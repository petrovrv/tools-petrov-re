const PL={"\" design (and, for the Monte-Carlo, its quantile tallies) live in the shared runtime, and this build will not substitute a different sampler and call it the same experiment.":"” (a dla metody Monte Carlo także zliczenia kwantyli) znajduje się we współdzielonym środowisku wykonawczym, a ta wersja nie podstawi innego generatora próbek pod nazwą tego samego eksperymentu.","% points":"pkt proc.","% pts":"% pkt","%-steps":"kroki co 1 %","(hydraulic diameter now":"(obecna średnica hydrauliczna","(unchanged from v1). Last runtime computation:":"(bez zmian względem v1). Ostatnie obliczenie w środowisku wykonawczym:","), so it fell back to the main thread":"), więc obliczenia wróciły do wątku głównego","), so sweeps stay on the main thread":"), więc analizy parametryczne pozostają w wątku głównym","); sweeps run on the main thread":"); analizy parametryczne działają w wątku głównym","); sweeps run on the main thread and the Monte-Carlo sweep is unavailable":"); analizy parametryczne działają w wątku głównym, a analiza Monte Carlo jest niedostępna","- (dp at 100% / dp at 10%; upper bound on open/closed authority)":"- (dp przy 100% / dp przy 10%; górne oszacowanie autorytetu otwarta/zamknięta)","- (fraction of intact flow)":"- (ułamek przepływu w sieci nienaruszonej)","- (fraction of wide-open flow)":"- (ułamek przepływu przy pełnym otwarciu)","- (fraction)":"- (ułamek)","2000 < Re < 4000 is a numerical blend, not a resolved transition model":"2000 < Re < 4000 to numeryczne przejście, a nie model strefy przejściowej","24 h — one day":"24 godziny — jeden dzień","8760 h — one year":"8760 h — jeden rok","8760 hourly rows are summarised above rather than printed.":"8760 wierszy godzinowych podsumowano powyżej zamiast je drukować.",": nothing in this payload maps onto the current selection.":": nic w tych danych nie odpowiada bieżącemu zaznaczeniu.","; ignored":"; pominięto","; one Worker case was checked against the same case solved here and came back identical":"; jeden przypadek z wątku roboczego porównano z tym samym przypadkiem obliczonym tutaj i wynik był identyczny","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Ducts running outside the published box are listed as a warning after each solve.":"; w tym zakresie różni się od rozwiązania równania Colebrooka o maksymalnie około 3% w f, a poza nim o więcej. Przejście 2000<Re<4000 jest pomostem numerycznym, a nie modelem strefy przejściowej. Kanały pracujące poza opublikowanym zakresem są wymieniane w ostrzeżeniu po każdym obliczeniu.","A Latin hypercube over duct roughness (lognormal, median 1), grille design pressure drop (lognormal, median 1) and damper opening (normal, in percentage points), with an optional rank correlation inside each family. Quantiles are DDSketch estimates with a stated error bound, not exact order statistics. Duct leakage is not sampled: this model has no leakage element, and inventing one as a nodal demand would be a different model, not an uncertainty.":"Hipersześcian łaciński dla chropowatości kanałów (rozkład logarytmiczno-normalny, mediana 1), obliczeniowego spadku ciśnienia kratek (logarytmiczno-normalny, mediana 1) i otwarcia przepustnic (normalny, w punktach procentowych), z opcjonalną korelacją rangową w obrębie każdej grupy. Kwantyle są oszacowaniami DDSketch z podaną granicą błędu, a nie dokładnymi statystykami pozycyjnymi. Nieszczelność kanałów nie jest losowana: model nie ma elementu nieszczelności, a wprowadzenie go jako zapotrzebowania węzłowego byłoby innym modelem, a nie niepewnością.","A arm":"Odgałęzienie A","A damper":"Przepustnica A","A damper out":"Za przepustnicą A","A descending quadratic curve of fan total-pressure rise through the shutoff pressure and one rated point, scaled by the affinity laws with the local and global speed factors. The solver adds this rise to the gauge total pressure of the airflow, so the curve must be on the fan total-pressure basis; a catalogue static-pressure curve needs the fan outlet velocity pressure added before entry. Rated pressure must be below shutoff pressure. Reverse flow and operation beyond the zero-head runout are extrapolations of that quadratic and are warned after the solve.":"Malejąca kwadratowa charakterystyka przyrostu ciśnienia całkowitego wentylatora, przechodząca przez ciśnienie przy zerowym przepływie i jeden punkt znamionowy, skalowana prawami podobieństwa z lokalnym i globalnym współczynnikiem prędkości. Solver dodaje ten przyrost do nadciśnienia całkowitego przepływu, więc charakterystykę należy podać w ciśnieniu całkowitym wentylatora; do katalogowej charakterystyki ciśnienia statycznego trzeba przed wprowadzeniem dodać ciśnienie dynamiczne na wylocie wentylatora. Ciśnienie znamionowe musi być niższe od ciśnienia przy zerowym przepływie. Przepływ wsteczny i praca poza punktem zerowego przyrostu ciśnienia są ekstrapolacją tej paraboli i są sygnalizowane ostrzeżeniem po obliczeniu.","A design-point pressure drop scaled by opening: dp = dp_design (q/q_design)² / c², with c = o for the linear conductance law and c = 50^(o−1) for equal percentage, where o is the opening as a fraction. Auto-balance changes the opening, never the rated characteristic. Set a balance target flow to include a damper in auto-balancing.":"Spadek ciśnienia z punktu obliczeniowego skalowany otwarciem: dp = dp_design (q/q_design)² / c², gdzie c = o dla liniowej charakterystyki przewodności i c = 50^(o−1) dla charakterystyki stałoprocentowej, a o to otwarcie wyrażone ułamkiem. Automatyczne równoważenie zmienia otwarcie, nigdy charakterystykę znamionową. Aby objąć przepustnicę automatycznym równoważeniem, ustaw jej przepływ docelowy.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary (normally 0 Pa for room/outdoor ambient). Positive node demand removes airflow; negative demand injects it. Boundary pressures are gauge pressures relative to the outdoor air at the node elevation; with one air density inside and outside, the hydrostatic terms cancel, and buoyancy/stack effect from temperature-dependent density is not modelled.":"Węzeł o stałym ciśnieniu ustala nadciśnienie całkowite na granicy o małej prędkości (zwykle 0 Pa dla pomieszczenia lub powietrza zewnętrznego). Dodatnie zapotrzebowanie węzła odprowadza powietrze z sieci; ujemne je doprowadza. Ciśnienia brzegowe są nadciśnieniami względem powietrza zewnętrznego na wysokości węzła; przy jednej gęstości powietrza wewnątrz i na zewnątrz składniki hydrostatyczne się znoszą, a wypór i ciąg kominowy wynikające z gęstości zależnej od temperatury nie są modelowane.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary — normally 0 Pa for a room or the outdoors. At least one is needed in every connected part of the network, otherwise the pressure level is undetermined and the solve is refused.":"Węzeł o stałym ciśnieniu ustala nadciśnienie całkowite na granicy o małej prędkości — zwykle 0 Pa dla pomieszczenia lub powietrza zewnętrznego. W każdej spójnej części sieci potrzebny jest co najmniej jeden taki węzeł; w przeciwnym razie poziom ciśnienia jest nieokreślony i obliczenie zostaje odrzucone.","A grille":"Kratka A","A rename does not change a number, so the solution is kept.":"Zmiana nazwy nie zmienia żadnej liczby, więc rozwiązanie zostaje zachowane.","A sweep is already running.":"Analiza parametryczna już trwa.","A tee arm is a user-supplied local-loss coefficient K applied to that arm only, with no friction term. Represent a multi-port junction as one node plus one fitting edge per arm that needs an explicit K. The K values are inputs: they are not derived from ASHRAE or Idelchik geometry, and not from the split ratio.":"Ramię trójnika to podany przez użytkownika współczynnik strat miejscowych K, stosowany tylko do tego ramienia, bez składnika tarcia. Węzeł rozdziału z wieloma przyłączami odwzoruj jako jeden węzeł i po jednym elemencie kształtki na każde ramię wymagające jawnego K. Wartości K są danymi wejściowymi: nie wynikają z geometrii według ASHRAE ani Idelczyka, ani ze stosunku podziału strumieni.","ASHRAE Handbook - Fundamentals, Duct Design: rectangular hydraulic diameter Dh = 2WH/(W+H); local loss dp = K rho v^2/2.":"ASHRAE Handbook - Fundamentals, rozdział Duct Design: średnica hydrauliczna przekroju prostokątnego Dh = 2WH/(W+H); strata miejscowa dp = K rho v^2/2.","Add at least one component.":"Dodaj co najmniej jeden element.","Add at least two nodes.":"Dodaj co najmniej dwa węzły.","Air and load":"Powietrze i obciążenie","Air density":"Gęstość powietrza","Air density 0.2 to 2 kg/m3":"Gęstość powietrza 0,2 do 2 kg/m3","Air density must be 0.2–2 kg/m³.":"Gęstość powietrza musi wynosić 0,2–2 kg/m³.","Air power W":"Moc powietrzna W","Air state":"Stan powietrza","Airflow [m³/h]":"Przepływ powietrza [m³/h]","All component airflows and all free-node gauge total pressures are unknowns in one system, solved by a damped Newton method with a numerically differentiated Jacobian and a dense Gauss–Jordan factorisation with partial pivoting. The stopping rule is a scaled residual of 2×10⁻⁹; if the iteration cap is reached first the result is reported as unconverged. The browser solver refuses models above 600 nonlinear unknowns.":"Przepływy we wszystkich elementach i nadciśnienia całkowite we wszystkich węzłach swobodnych są niewiadomymi jednego układu, rozwiązywanego tłumioną metodą Newtona z macierzą Jacobiego różniczkowaną numerycznie i gęstą eliminacją Gaussa–Jordana z częściowym wyborem elementu głównego. Kryterium zatrzymania to skalowane residuum 2×10⁻⁹; jeśli najpierw zostanie osiągnięty limit iteracji, wynik jest zgłaszany jako niezbieżny. Solver w przeglądarce odrzuca modele z więcej niż 600 niewiadomymi nieliniowymi.","Arm loss coefficient K":"Współczynnik strat ramienia K","At most 600 nonlinear unknowns (components + free nodes)":"Maksymalnie 600 niewiadomych nieliniowych (elementy + węzły swobodne)","Auto-balance dampers":"Automatyczne równoważenie przepustnic","Auto-balance moves the opening of every damper with a target above zero.":"Automatyczne równoważenie zmienia otwarcie każdej przepustnicy z przepływem docelowym większym od zera.","B arm":"Odgałęzienie B","B damper":"Przepustnica B","B damper out":"Za przepustnicą B","B grille":"Kratka B","Balance target":"Przepływ docelowy równoważenia","Balancing failed:":"Równoważenie nie powiodło się:","Balancing is not meaningful at 0% load":"Równoważenie nie ma sensu przy obciążeniu 0%","Boundary +in m³/h":"Dopływ z granicy m³/h","Boundary [m³/h]":"Przepływ na granicy [m³/h]","Boundary conditions":"Warunki brzegowe","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: used only to quantify the Swamee-Jain scatter, never as the graded reference.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: używane wyłącznie do ilościowego określenia rozrzutu wzoru Swamee–Jaina, nigdy jako odniesienie oceniane w benchmarku.","Cancel sweep":"Anuluj analizę parametryczną","Catalogue window ± steps (0 = all)":"Okno katalogu ± liczba wymiarów (0 = wszystkie)","Circular":"Okrągły","Circular or rectangular Darcy–Weisbach: 64/Re below Re 2000, the Swamee–Jain explicit approximation above Re 4000, and a smoothstep blend between. Swamee–Jain is published for 10⁻⁶ ≤ eps/Dh ≤ 10⁻² and 5×10³ ≤ Re ≤ 10⁸; over that box it differs from the Colebrook root by up to about 3 % in f, and by more outside it. Ducts running outside the published box are listed as a warning after each solve. Roughness is the absolute wall roughness in millimetres; ΣK collects the local losses on that run.":"Kanał okrągły lub prostokątny, Darcy–Weisbach: 64/Re poniżej Re 2000, jawne przybliżenie Swamee–Jaina powyżej Re 4000 i gładkie przejście (smoothstep) pomiędzy. Swamee–Jain opublikowano dla 10⁻⁶ ≤ eps/Dh ≤ 10⁻² i 5×10³ ≤ Re ≤ 10⁸; w tym zakresie różni się od pierwiastka równania Colebrooka o maksymalnie około 3 % w f, a poza nim o więcej. Kanały pracujące poza opublikowanym zakresem są wymieniane w ostrzeżeniu po każdym obliczeniu. Chropowatość to bezwzględna chropowatość ścianki w milimetrach; ΣK zbiera straty miejscowe na tym odcinku.","Click a node or a component on the drawing to edit it, or pick a tool and click the canvas to create one.":"Kliknij węzeł lub komponent na rysunku, aby go edytować, albo wybierz narzędzie i kliknij obszar roboczy, aby go utworzyć.","Click empty canvas to add a node.":"Kliknij pusty obszar rysunku, aby dodać węzeł.","Click junction node, then arm node to add a tee/fitting loss arm.":"Kliknij węzeł rozdziału, a następnie węzeł ramienia, aby dodać ramię trójnika/kształtki ze stratą miejscową.","Click start node, then end node to add a damper.":"Kliknij węzeł początkowy, a następnie końcowy, aby dodać przepustnicę.","Click start node, then end node to add a duct.":"Kliknij węzeł początkowy, a następnie końcowy, aby dodać kanał.","Click start node, then end node to add a grille.":"Kliknij węzeł początkowy, a następnie końcowy, aby dodać kratkę.","Component":"Element","Component closed":"Zamknięty element","Component energy:  h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, with h = p_total_gauge/(rho g), gauge relative to outdoor air at the node elevation, rho_out = rho":"Bilans energii elementu:  h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, gdzie h = p_total_gauge/(rho g), nadciśnienie względem powietrza zewnętrznego na wysokości węzła, rho_out = rho","Component results":"Wyniki elementów","Component velocity is the airflow divided by the flow area, and velocity pressure is ½ rho v². Generic junction nodes have no unique cross-section, so static pressure is not recovered at a node: velocity and velocity pressure are reported per component instead. The velocity limit in Screening limits is what the N-1, profile and sizing sweeps compare against.":"Prędkość w elemencie to przepływ podzielony przez pole przekroju, a ciśnienie dynamiczne wynosi ½ rho v². Ogólne węzły rozdziału nie mają jednoznacznego przekroju, więc ciśnienie statyczne nie jest wyznaczane w węźle: prędkość i ciśnienie dynamiczne podaje się dla każdego elementu. Do prędkości granicznej z sekcji Kryteria oceny odnoszą się analizy N-1, profilu obciążenia i doboru wymiarów.","Components":"Elementy","Compute":"Obliczenia","Could not sweep a usable authority curve.":"Nie udało się wyznaczyć użytecznej krzywej autorytetu.","Could not sweep a usable system curve.":"Nie udało się wyznaczyć użytecznej charakterystyki instalacji.","Curves":"Krzywe","Damper":"Przepustnica","Damper authority":"Autorytet przepustnicy","Damper flow m³/h":"Przepływ przepustnicy m³/h","Damper opening 0.1 % to 100 %":"Otwarcie przepustnicy od 0,1% do 100%","Damper opening [%]":"Otwarcie przepustnicy [%]","Damper opening sd (normal)":"Odchylenie standardowe otwarcia przepustnicy (normalny)","Damper:":"Przepustnica:","Damper:  h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2,  c = o (linear) or 50^(o-1) (equal percentage), o = opening/100":"Przepustnica:  h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2,  c = o (liniowa) lub 50^(o-1) (stałoprocentowa), o = otwarcie/100","Dampers":"Przepustnice","Delete":"Usuń","Delete selected":"Usuń wybrane","Delete the selection":"Usuń zaznaczenie","Demand [m³/h]":"Zapotrzebowanie [m³/h]","Demand m³/h":"Zapotrzebowanie m³/h","Demand, positive out":"Zapotrzebowanie, dodatnie = odbiór","Density and kinematic viscosity are constant everywhere and for the whole solve. Density converts head to pressure and scales every loss; viscosity only enters through the Reynolds number, and therefore only through the friction factor of ducts. 1.204 kg/m³ and 1.5×10⁻⁵ m²/s are dry air at about 20 °C and one atmosphere.":"Gęstość i lepkość kinematyczna są stałe w całej sieci i przez całe obliczenie. Gęstość przelicza wysokość słupa na ciśnienie i skaluje każdą stratę; lepkość wpływa tylko przez liczbę Reynoldsa, a więc tylko na współczynnik oporu tarcia kanałów. 1,204 kg/m³ i 1,5×10⁻⁵ m²/s to suche powietrze w temperaturze około 20 °C przy ciśnieniu jednej atmosfery.","Design flow":"Przepływ obliczeniowy","Design m³/h":"Obliczeniowy m³/h","Design Δp":"Obliczeniowe Δp","Diameter":"Średnica","Direction:":"Kierunek:","Drag nodes. Select an element to edit it.":"Przeciągnij węzły. Wybierz element, aby go edytować.","Draw":"Rysowanie","Draw a network, or load the example, then press Solve network.":"Narysuj sieć lub wczytaj przykład, a następnie naciśnij Oblicz sieć.","Draw and solve arbitrary air-duct networks with ducts, junction/tee arms, grilles, dampers and fans. Steady-state airflow, gauge total pressure, fan/system curves and damper balancing.":"Rysuj i obliczaj dowolne sieci kanałów wentylacyjnych z kanałami, ramionami rozgałęzień i trójników, kratkami, przepustnicami i wentylatorami. Przepływ ustalony, nadciśnienie całkowite, charakterystyki wentylatora i instalacji oraz równoważenie przepustnic.","Draw arbitrary duct networks with circular or rectangular ducts, junction and tee-loss arms, grilles, dampers and fans.":"Rysuj dowolne sieci z kanałami okrągłymi lub prostokątnymi, ramionami rozgałęzień i trójników ze stratą miejscową, kratkami, przepustnicami i wentylatorami.","Draw arbitrary duct networks with circular or rectangular ducts, junction and tee-loss arms, grilles, dampers and fans. Solve steady airflow and pressure drops, plot the fan/system curve with operating point, balance dampers to target flows, and explore partial-load operation.":"Rysuj dowolne sieci z kanałami okrągłymi lub prostokątnymi, ramionami rozgałęzień i trójników ze stratą miejscową, kratkami, przepustnicami i wentylatorami. Obliczaj przepływ ustalony i spadki ciśnienia, wykreślaj charakterystyki wentylatora i instalacji z punktem pracy, równoważ przepustnice do przepływów docelowych i badaj pracę przy obciążeniu częściowym.","Drawing tools":"Narzędzia do rysowania","Duct":"Kanał","Duct Network Solver":"Obliczenia sieci kanałów","Duct Network Solver (v2) — tools.petrov.re":"Obliczenia sieci kanałów (v2) — tools.petrov.re","Duct internal checks failed":"Wewnętrzne testy narzędzia nie powiodły się","Duct network drawing canvas":"Obszar rysunku sieci kanałów","Duct roughness σ (lognormal)":"Chropowatość kanałów σ (log-normalny)","Duct sizing":"Dobór wymiarów kanałów","Duct sizing cancelled.":"Anulowano dobór wymiarów kanałów.","Duct sizing failed:":"Dobór wymiarów kanałów nie powiódł się:","Duct sizing is ranked by specific air power (air power per m3/s delivered), not by raw air power: with a fan on a curve, a smaller duct lowers the product dp*Q while delivering less air, so the raw figure rewards choking. Each swept duct is replaced by a circular duct of the catalogue size under test, so a rectangular duct is re-sectioned, and cost is represented only by the swept surface area pi*D*L.":"Warianty doboru wymiarów kanałów są szeregowane według jednostkowej mocy powietrznej (moc powietrzna na dostarczony m3/s), a nie według samej mocy powietrznej: przy wentylatorze pracującym na charakterystyce mniejszy kanał obniża iloczyn dp*Q, dostarczając mniej powietrza, więc sama moc nagradza dławienie. Każdy badany kanał zastępuje się kanałem okrągłym o sprawdzanym wymiarze katalogowym, więc kanał prostokątny otrzymuje nowy przekrój, a koszt odwzorowuje tylko powierzchnia pi*D*L.","Duct sizing over the EN 1506 catalogue":"Dobór wymiarów kanałów według katalogu EN 1506","Duct:":"Kanał:","Duct:  h_loss = (f L/Dh + K) v^2/(2 g),  v = q/A,  Re = v Dh/nu":"Kanał:  h_loss = (f L/Dh + K) v^2/(2 g),  v = q/A,  Re = v Dh/nu","Ducts":"Kanały","Ducts to size (highest v first)":"Kanały do doboru (od największej prędkości)","EN 1506 nominal circular duct diameters, mm:":"Średnice nominalne kanałów okrągłych wg normy EN 1506, mm:","Each duct, tee arm and damper is removed in turn and the network re-solved from cold, to find which grilles starve when one branch closes. Contingencies that leave the network unsolvable are listed as such rather than being silently dropped.":"Każdy kanał, ramię trójnika i przepustnica są kolejno usuwane, a sieć obliczana od nowa, aby wykazać, które kratki zostają niedozasilone po zamknięciu jednej gałęzi. Przypadki, po których sieci nie da się obliczyć, są wymieniane jako takie, a nie pomijane.","Edge":"Element","Edge results":"Wyniki elementów","Elevation":"Wysokość","Node pressures are gauge pressures relative to the outdoor air at the elevation of the node. The energy balance carries the hydrostatic term (rho − rho_out) g z, and the outdoor density rho_out equals the air density entered here, so the term is zero and elevation changes no airflow or pressure. Buoyancy and stack effect from temperature-dependent density are not modelled, so a tall riser carrying warm air is not represented by raising its nodes.":"Ciśnienia w węzłach są ciśnieniami manometrycznymi względem powietrza zewnętrznego na wysokości danego węzła. Bilans energii zawiera składnik hydrostatyczny (rho − rho_out) g z, a gęstość powietrza zewnętrznego rho_out jest równa podanej tu gęstości powietrza, więc składnik ten jest zerowy i wysokość nie zmienia żadnego przepływu ani ciśnienia. Pływalność i efekt komina wynikający z gęstości zależnej od temperatury nie są modelowane, więc wysoki pion niosący ciepłe powietrze nie jest reprezentowany przez podniesienie jego węzłów.","Node pressures are gauge pressures relative to the outdoor air at each node elevation; with the outdoor density equal to the air density the hydrostatic terms cancel, and buoyancy and stack effect from temperature-dependent density are not modelled.":"Ciśnienia w węzłach są ciśnieniami manometrycznymi względem powietrza zewnętrznego na wysokości każdego węzła; przy gęstości zewnętrznej równej gęstości powietrza składniki hydrostatyczne się znoszą, a wyporność i efekt komina wynikający z gęstości zależnej od temperatury nie są modelowane.","Elevation m":"Wysokość m","Ensemble sweep results":"Wyniki analiz parametrycznych","Equal percentage (R=50)":"Stałoprocentowa (R=50)","Equations":"Równania","Every network needs at least one fixed-pressure node per connected component; ambient boundaries are normally 0 Pa gauge total pressure.":"Każda spójna część sieci wymaga co najmniej jednego węzła o stałym ciśnieniu; granice z otoczeniem mają zwykle nadciśnienie całkowite 0 Pa.","Every nodal demand is multiplied by this factor before the solve, so 60 % means every extraction and injection runs at 60 % of its design value. It does not touch fan speed, damper openings or grille design points. The valid range of the model is 0 to 150 %.":"Każde zapotrzebowanie węzłowe jest mnożone przez ten współczynnik przed obliczeniem, więc 60 % oznacza, że każdy odbiór i doprowadzenie powietrza wynosi 60 % wartości obliczeniowej. Nie zmienia to prędkości obrotowej wentylatorów, otwarć przepustnic ani punktów obliczeniowych kratek. Zakres stosowalności modelu to 0 do 150 %.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand, or tick \"profile also drives fan speed\", to make the profile mean anything.":"Każdy węzeł tej sieci ma zerowe zapotrzebowanie, a mnożnik profilu skaluje tylko zapotrzebowania węzłowe — więc każda godzina poniżej to ten sam punkt pracy. Aby profil miał sens, nadaj co najmniej jednemu węzłowi zapotrzebowanie albo zaznacz opcję „profil steruje także prędkością wentylatora”.","Exactly 24 finite, non-negative multipliers are needed.":"Potrzeba dokładnie 24 skończonych, nieujemnych mnożników.","Exponent n":"Wykładnik n","Fan / system curve":"Charakterystyka wentylatora / instalacji","Fan [Pa]":"Wentylator [Pa]","Fan affinity law dp ~ n^2 applied to the two-point quadratic fan curve.":"Prawo podobieństwa wentylatorów dp ~ n^2 zastosowane do dwupunktowej kwadratowej charakterystyki wentylatora.","Fan air power W":"Moc powietrzna wentylatora W","Fan airflow":"Przepływ wentylatora","Fan and system curves":"Charakterystyki wentylatora i instalacji","Fan discharge":"Wylot wentylatora","Fan flow m³/h":"Przepływ wentylatora m³/h","Fan rated pressure must be below shutoff pressure; reverse flow and beyond-runout operation are extrapolations and are warned":"Ciśnienie znamionowe wentylatora musi być niższe od ciśnienia przy zerowym przepływie; przepływ wsteczny i praca poza punktem zerowego przyrostu ciśnienia są ekstrapolacjami i są sygnalizowane ostrzeżeniem","Fan rise Pa":"Przyrost ciśnienia wentylatora Pa","Fan speed %":"Prędkość wentylatora %","Fan speed is held at the global factor; only nodal demand follows the profile.":"Prędkość wentylatora jest utrzymywana na poziomie współczynnika globalnego; profilem podąża tylko zapotrzebowanie węzłowe.","Fan total pressure rise":"Przyrost ciśnienia całkowitego wentylatora","Fan Δp Pa":"Δp wentylatora Pa","Fan, main duct, two tee arms, two dampers and two grilles between ambient and a room.":"Wentylator, kanał główny, dwa ramiona trójnika, dwie przepustnice i dwie kratki między otoczeniem a pomieszczeniem.","Fan/system curve":"Charakterystyka wentylatora / instalacji","Fan:":"Wentylator:","Fans":"Wentylatory","Fit the drawing":"Dopasuj rysunek","Fixed gauge total-pressure boundary":"Granica o stałym nadciśnieniu całkowitym","Fixed-pressure boundary":"Węzeł o stałym ciśnieniu","Fixed-pressure node:  h = p / (rho g)":"Węzeł o stałym ciśnieniu: h = p / (rho g)","Flow / flow at 100 % opening":"Przepływ / przepływ przy 100% otwarciu","Flow m³/h":"Przepływ m³/h","Flow vs current %":"Przepływ względem obecnego %","Flow-following discharge path":"Droga tłoczenia wzdłuż przepływu","For every free node the solver enforces airflow continuity. For every component it enforces steady Bernoulli using gauge total pressure + elevation, fan pressure rise and signed total-pressure loss. Edge airflows and free-node gauge total pressures are solved simultaneously with a damped Newton method.":"Dla każdego węzła swobodnego solver wymusza ciągłość przepływu. Dla każdego elementu wymusza ustalone równanie Bernoulliego z nadciśnieniem całkowitym + wysokością, przyrostem ciśnienia wentylatora i stratą ciśnienia całkowitego ze znakiem. Przepływy w elementach i nadciśnienia całkowite w węzłach swobodnych są wyznaczane jednocześnie tłumioną metodą Newtona.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25/[log10(eps/(3.7 Dh) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Tarcie: f = 64/Re dla Re <= 2000; Swamee–Jain f = 0.25/[log10(eps/(3.7 Dh) + 5.74/Re^0.9)]^2 dla Re >= 4000; pomiędzy przejście smoothstep","Gauge total pressure":"Nadciśnienie całkowite","Gauge total pressure [Pa]":"Nadciśnienie całkowite [Pa]","Global fan-speed factor":"Globalny współczynnik prędkości wentylatora","Global fan-speed factor must be between 40 and 120%.":"Globalny współczynnik prędkości wentylatorów musi wynosić od 40 do 120%.","Grille":"Kratka","Grille exponent n between 1 and 3":"Wykładnik kratki n od 1 do 3","Grille starvation threshold":"Próg niedozasilenia kratki","Grille:":"Kratka:","Grille:  h_loss = (dp_design/(rho g)) (q/q_design)^n":"Kratka: h_loss = (dp_design/(rho g)) (q/q_design)^n","Grilles":"Kratki","H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): the loop-correction method dQ = -sum(h)/sum(|dh/dQ|) used by the second solver.":"H. Cross, „Analysis of Flow in Networks of Conduits or Conductors”, Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): metoda poprawek obwodowych dQ = -sum(h)/sum(|dh/dQ|) użyta w drugim solverze.","Hagen-Poiseuille laminar friction f = 64/Re.":"Opór tarcia laminarnego Hagena–Poiseuille’a f = 64/Re.","Height":"Wysokość","Hide":"Ukryj","Highest v m/s":"Największa v m/s","Highest velocity":"Największa prędkość","Hour":"Godzina","Hourly VAV multipliers (24 values, comma separated)":"Godzinowe mnożniki VAV (24 wartości rozdzielone przecinkami)","How it is solved":"Metoda obliczeń","Ignored":"Zignorowano","Inherent c/c₁₀₀":"Wewnętrzna c/c₁₀₀","Initial residual is not finite.":"Początkowe residuum nie jest skończone.","Installed":"Zabudowana","Installed q/q₁₀₀":"Zabudowana q/q₁₀₀","Invalid component ID.":"Nieprawidłowy identyfikator elementu.","Invalid network file":"Nieprawidłowy plik sieci","Invalid node ID.":"Nieprawidłowy identyfikator węzła.","It solves a duct network in steady state: you draw nodes and join them with ducts, tee/fitting arms, dampers, grilles and fans, then press Solve network. For every free node the solver enforces airflow continuity, and for every component it enforces steady Bernoulli using gauge total pressure plus elevation, fan pressure rise and signed total-pressure loss. Component airflows and free-node gauge total pressures are solved simultaneously by a damped Newton method.\n\nStart from the example network in the panel above, or pick a tool and click the canvas. Every network needs at least one fixed-pressure node in each connected part.":"Narzędzie oblicza sieć kanałów w stanie ustalonym: rysujesz węzły i łączysz je kanałami, ramionami trójników/kształtek, przepustnicami, kratkami i wentylatorami, a następnie naciskasz Oblicz sieć. Dla każdego węzła swobodnego solver wymusza ciągłość przepływu, a dla każdego elementu ustalone równanie Bernoulliego z nadciśnieniem całkowitym i wysokością, przyrostem ciśnienia wentylatora i stratą ciśnienia całkowitego ze znakiem. Przepływy w elementach i nadciśnienia całkowite w węzłach swobodnych są wyznaczane jednocześnie tłumioną metodą Newtona.\n\nZacznij od przykładowej sieci w panelu powyżej albo wybierz narzędzie i kliknij obszar rysunku. Każda sieć wymaga co najmniej jednego węzła o stałym ciśnieniu w każdej spójnej części.","Jacobian is singular":"macierz Jacobiego jest osobliwa","Junction losses must be entered as tee/fitting arms with an explicit K; they are not derived from geometry or split ratio.":"Straty w węzłach rozdziału wprowadza się jako ramiona trójnika/kształtki z jawnym K; nie wynikają one z geometrii ani ze stosunku podziału strumieni.","Kinematic viscosity":"Lepkość kinematyczna","Kinematic viscosity must be positive.":"Lepkość kinematyczna musi być dodatnia.","Length":"Długość","Linear conductance":"Liniowa charakterystyka przewodności","Load example network":"Wczytaj przykładową sieć","Load factor must be between 0 and 150%.":"Współczynnik obciążenia musi wynosić od 0 do 150%.","Load profile cancelled.":"Anulowano profil obciążenia.","Load profile failed:":"Profil obciążenia nie powiódł się:","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the duct network the user draws is transmitted anywhere: every solve and every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Wczytuje trzy skrypty z tego samego źródła obok strony — site-disclaimer.js, diagram-common.js i diagram-compute.classic.js (klasyczna wersja współdzielonego środowiska obliczeniowego). Nic innego nie jest pobierane, żaden zewnętrzny serwer nie jest kontaktowany i nic o rysowanej sieci kanałów nie jest nigdzie przesyłane: każde obliczenie i każda analiza parametryczna działa w tej przeglądarce, w wątku głównym lub w wątkach roboczych Blob z tego samego źródła utworzonych z diagram-compute.classic.js.","Local speed":"Prędkość lokalna","Loss [Pa]":"Strata [Pa]","Main duct":"Kanał główny","Max v in swept ducts m/s":"Maks. v w badanych kanałach m/s","Max v m/s":"Maks. v m/s","Minor-loss ΣK":"Suma współczynników strat miejscowych ΣK","Model each tee run/branch arm separately with its own K.":"Każde ramię przelotowe i odgałęźne trójnika modeluj osobno z własnym K.","Model limits":"Ograniczenia modelu","Monte-Carlo":"Monte Carlo","Monte-Carlo cancelled.":"Anulowano analizę Monte Carlo.","Monte-Carlo failed:":"Analiza Monte Carlo nie powiodła się:","Multiplier":"Mnożnik","Multiplies the local speed of every fan, and enters the fan curve squared through the affinity law dp ~ n². The model is stated for 40 to 120 %; the VAV load profile clamps its own fan tracking to the same range.":"Mnoży lokalną prędkość każdego wentylatora i wchodzi do charakterystyki wentylatora w kwadracie zgodnie z prawem podobieństwa dp ~ n². Model jest określony dla 40 do 120 %; profil obciążenia VAV ogranicza własne nadążanie prędkości wentylatora do tego samego zakresu.","N-1 blockage":"Analiza N-1","N-1 branch blockage":"Analiza N-1 zamknięcia gałęzi","N-1 branch blockage — grille starvation":"Analiza N-1 zamknięcia gałęzi — niedozasilenie kratek","N-1 screen cancelled.":"Anulowano analizę N-1.","N-1 screen failed:":"Analiza N-1 nie powiodła się:","Name":"Nazwa","Network editor":"Edytor sieci","Network file":"Plik sieci","Network file is too large (5 MB limit).":"Plik sieci jest za duży (limit 5 MB).","Network file is too large for this editor (max 1000 nodes / 3000 components).":"Plik sieci jest za duży dla tego edytora (maks. 1000 węzłów / 3000 elementów).","Network loaded. Press Solve network.":"Sieć wczytana. Naciśnij Oblicz sieć.","Newton iterations":"Iteracje Newtona","Newton line search failed.":"Przeszukiwanie liniowe w metodzie Newtona nie powiodło się.","No Monte-Carlo sample solved.":"Nie obliczono żadnej próbki Monte Carlo.","No airflow/return path from fan discharge to a fixed-pressure boundary.":"Brak drogi przepływu/powrotu od tłoczenia wentylatora do granicy o stałym ciśnieniu.","No authority sweep generated.":"Nie wykonano analizy autorytetu.","No curve generated.":"Nie wyznaczono charakterystyki.","No pressure profile generated.":"Nie wyznaczono profilu ciśnienia.","No sizing combination solved.":"Nie obliczono żadnej kombinacji wymiarów.","No sweep has run for this network yet. Each button above solves the network many times; the fan / system curve is now the same kind of sweep.":"Dla tej sieci nie wykonano jeszcze żadnej analizy parametrycznej. Każdy przycisk powyżej oblicza sieć wielokrotnie; charakterystyka wentylatora / instalacji jest analizą tego samego rodzaju.","No sweep has run for this network yet. Each button in the input column solves the network many times; the fan / system curve is the same kind of sweep.":"Dla tej sieci nie wykonano jeszcze żadnej analizy parametrycznej. Każdy przycisk w kolumnie danych wejściowych oblicza sieć wielokrotnie; charakterystyka wentylatora / instalacji jest analizą tego samego rodzaju.","Nodal demand":"Zapotrzebowanie węzłowe","Node":"Węzeł","Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0":"Ciągłość w węźle (węzły swobodne):  SUM_in q - SUM_out q - demand * load_factor = 0","Node results":"Wyniki węzłów","Node Δp a−b Pa":"Δp między węzłami a−b Pa","Nodes and edges must be arrays.":"Węzły i elementy muszą być tablicami.","None":"Brak","Nonlinear unknowns":"Niewiadome nieliniowe","Not solved":"Nie obliczono","Not solved.":"Nie obliczono.","Not solved. Press Solve network.":"Nie obliczono. Naciśnij Oblicz sieć.","Nothing generated yet.":"Nic jeszcze nie wygenerowano.","Nothing is solved, so no result, export or sweep is available until the network validates.":"Nic nie zostało obliczone, więc do czasu poprawnej walidacji sieci nie są dostępne żadne wyniki, eksport ani analizy parametryczne.","Nothing selected":"Nic nie wybrano","Nothing to cancel; this sweep cannot be interrupted without the shared runtime.":"Nie ma czego anulować; tej analizy nie można przerwać bez współdzielonego środowiska wykonawczego.","Nothing to sample. Give the duct roughness a sigma above 0 (the network needs ducts with non-zero roughness), or the grilles a sigma, or the dampers an opening sd.":"Nie ma czego losować. Nadaj chropowatości kanałów sigma większe od 0 (sieć musi mieć kanały o niezerowej chropowatości), kratkom sigma albo otwarciu przepustnic odchylenie standardowe.","One duct solve is always on the main thread and is unchanged from the audited build. Repeated solves — the six sweeps — go to the shared compute runtime, which moves them into Workers only when there are enough cases to pay for a round trip. The badge states which backend last ran, why, and whether a Worker case was checked against the same case solved here.":"Pojedyncze obliczenie sieci zawsze odbywa się w wątku głównym i jest niezmienione względem audytowanej wersji. Obliczenia powtarzane — sześć analiz parametrycznych — trafiają do współdzielonego środowiska obliczeniowego, które przenosi je do wątków roboczych tylko wtedy, gdy przypadków jest dość, by opłacił się koszt przesyłu. Plakietka podaje, gdzie ostatnio liczono, dlaczego i czy przypadek z wątku roboczego porównano z tym samym przypadkiem obliczonym tutaj.","Open duct-network JSON file":"Otwórz plik JSON sieci kanałów","Open network file":"Otwórz plik sieci","Opening":"Otwarcie","Opening %":"Otwarcie %","Opening characteristic":"Charakterystyka otwarcia","P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, „Explicit equations for pipe-flow problems”, ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, podane dla 1e-6 <= eps/D <= 1e-2 i 5e3 <= Re <= 1e8.","Pa (gauge)":"Pa (nadciśnienie)","Partial load 0 to 150 %, global fan speed 40 to 120 %":"Obciążenie częściowe 0 do 150 %, globalna prędkość wentylatorów 40 do 120 %","Partial-load demand factor":"Współczynnik obciążenia częściowego","Positive component airflow follows its arrow.":"Dodatni przepływ w elemencie ma kierunek strzałki.","Positive demand removes airflow from the network at that node, negative demand injects it. It is scaled by the partial-load factor. A network with no demand at all is driven only by its fans and its boundary pressures.":"Dodatnie zapotrzebowanie odprowadza powietrze z sieci w tym węźle, ujemne je doprowadza. Jest ono skalowane współczynnikiem obciążenia częściowego. Sieć bez żadnego zapotrzebowania jest napędzana wyłącznie wentylatorami i ciśnieniami brzegowymi.","Potential [Pa]":"Potencjał [Pa]","Pressure profile":"Profil ciśnienia","Pressure rise [Pa]":"Przyrost ciśnienia [Pa]","Profile also drives the global fan-speed factor (clamped to 40–120 %)":"Profil steruje także globalnym współczynnikiem prędkości wentylatora (ograniczonym do 40–120 %)","Profile length":"Długość profilu","Rank correlation within family":"Korelacja rangowa w grupie","Rated flow":"Przepływ znamionowy","Rated pressure must be below the shutoff pressure.":"Ciśnienie znamionowe musi być niższe od ciśnienia przy zerowym przepływie.","Received":"Otrzymane","Rectangular":"Prostokątny","Rectangular section:  A = W H,  Dh = 2 W H/(W + H);  circular:  A = pi D^2/4,  Dh = D":"Przekrój prostokątny:  A = W H,  Dh = 2 W H/(W + H);  okrągły:  A = pi D^2/4,  Dh = D","Reset":"Resetuj","Rise P5 Pa":"Przyrost P5 Pa","Room / ambient":"Pomieszczenie / otoczenie","Roughness":"Chropowatość","Run duct sizing":"Uruchom dobór wymiarów kanałów","Run load profile":"Uruchom profil obciążenia","Samples":"Liczba próbek","Save network file":"Zapisz plik sieci","Save network file writes the drawing, the air state and the load factors as a tools.petrov.re/duct-network/v1 JSON document, and Open network file reads one back. This is the editor document, not the calculation record: the shared bar’s JSON export is the record and cannot be loaded back into the editor, and the shared bar’s Copy link carries the same document inside a permalink.":"Zapisz plik sieci zapisuje rysunek, stan powietrza i współczynniki obciążenia jako dokument JSON tools.petrov.re/duct-network/v1, a Otwórz plik sieci wczytuje go z powrotem. To dokument edytora, a nie zapis obliczeń: eksport JSON ze wspólnego paska narzędzi jest zapisem obliczeń i nie można go wczytać do edytora, a Kopiuj link ze wspólnego paska przenosi ten sam dokument w stałym odnośniku.","Scaled residual":"Skalowane residuum","Screening limits":"Kryteria oceny","Seasonal swing (8760 h only)":"Wahania sezonowe (tylko 8760 godz.)","Section":"Przekrój","Seed":"Ziarno","Select":"Zaznacz","Select a damper first":"Najpierw wybierz przepustnicę","Select a damper, then run the authority sweep.":"Wybierz przepustnicę, a następnie uruchom analizę autorytetu.","Select a fan first":"Najpierw wybierz wentylator","Select a fan on the drawing first.":"Najpierw wybierz wentylator na rysunku.","Select drags nodes and picks an element to edit. Node adds a node where you click on empty canvas. The five component tools each want two clicks: the start node, then the end node. Positive component airflow follows the arrow, so the direction you draw in is the sign convention for that component.":"Zaznacz przeciąga węzły i wybiera element do edycji. Węzeł dodaje węzeł w miejscu kliknięcia w pustym obszarze rysunku. Każde z pięciu narzędzi elementów wymaga dwóch kliknięć: węzła początkowego, a potem końcowego. Dodatni przepływ w elemencie ma kierunek strzałki, więc kierunek rysowania określa konwencję znaku tego elementu.","Selection":"Zaznaczenie","Set target flow on at least one damper":"Ustaw przepływ docelowy co najmniej dla jednej przepustnicy","Shared compute runtime: starting…":"Współdzielone środowisko obliczeniowe: uruchamianie…","Show":"Pokaż","Shutoff total pressure":"Ciśnienie całkowite przy zerowym przepływie","Sizes mm":"Rozmiary mm","Solve network":"Oblicz sieć","Solve the network first.":"Najpierw rozwiąż sieć.","Solved simultaneously for all component airflows and free-node gauge total pressures by a damped Newton method with a numerical Jacobian":"Przepływy we wszystkich elementach i nadciśnienia całkowite w węzłach swobodnych wyznaczane jednocześnie tłumioną metodą Newtona z numeryczną macierzą Jacobiego","Solver failed:":"Obliczenie nie powiodło się:","Specific air power W/(m³/s)":"Jednostkowa moc powietrzna W/(m³/s)","Starved grilles":"Niedozasilone kratki","Total pressure rise at rated flow":"Przyrost ciśnienia całkowitego przy przepływie znamionowym","Steady state, incompressible, single phase; constant air properties":"Stan ustalony, nieściśliwy, jednofazowy; stałe właściwości powietrza","Steady-state incompressible airflow networks":"Sieci przepływu powietrza nieściśliwego w stanie ustalonym","Supply junction":"Węzeł rozdziału nawiewu","Swamee-Jain is published for 1e-6 <= eps/Dh <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Wzór Swamee–Jaina opublikowano dla 1e-6 <= eps/Dh <= 1e-2 i 5e3 <= Re <= 1e8; w tym zakresie różni się od rozwiązania równania Colebrooka o maksymalnie około 3 %","Sweep cancelled.":"Anulowano analizę parametryczną.","Swept surface m²":"Powierzchnia badanych kanałów m²","System curve requires positive solved airflow through the selected fan.":"Charakterystyka instalacji wymaga dodatniego obliczonego przepływu przez wybrany wentylator.","THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.":"OSZACOWANIE DOKŁADNOŚCI NIE OBOWIĄZUJE DLA CO NAJMNIEJ JEDNEGO ZLICZENIA.","Tee / fitting":"Trójnik / kształtka","Tee / fitting arm:":"Ramię trójnika / kształtki:","Tee / fitting arm:  h_loss = K v^2/(2 g) on that arm only, no friction term":"Ramię trójnika / kształtki:  h_loss = K v^2/(2 g) tylko na tym ramieniu, bez składnika tarcia","Tee and fitting arms":"Ramiona trójników i kształtek","Tee branch A":"Odgałęzienie trójnika A","Tee run B":"Przelot trójnika B","Tee/fitting":"Trójnik/kształtka","The 24 hourly multipliers scale nodal demand hour by hour, optionally driving the global fan-speed factor with them, and the fan air power dp·Q is integrated over the period. This is air power: fan total efficiency, motor and drive losses and SFP are not part of this model, so no kW/(m³/s) figure is claimed.":"24 mnożniki godzinowe skalują zapotrzebowanie węzłowe godzina po godzinie, opcjonalnie sterując także globalnym współczynnikiem prędkości wentylatorów, a moc powietrzna wentylatora dp·Q jest całkowana w okresie. To moc powietrzna: sprawność całkowita wentylatora, straty silnika i napędu oraz SFP nie są częścią tego modelu, więc nie podaje się żadnej wartości kW/(m³/s).","The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.":"Analiza Monte Carlo wymaga diagram-compute.classic.js — plan hipersześcianu łacińskiego, transformacja korelacji rangowej i scalane zliczenia kwantyli należą do środowiska wykonawczego, a ta wersja nie podstawi innego generatora próbek jako tego samego eksperymentu.","The N-1 screen blocks ducts, tee arms and dampers one at a time; this network has none of them.":"Analiza N-1 zamyka kolejno kanały, ramiona trójników i przepustnice; ta sieć nie ma żadnego z nich.","The fan/system curve holds the airflow through the selected fan at each of 33 values and solves the whole network for each one, so the system curve is the network’s own resistance, not a fitted parabola. The total-pressure profile follows one representative path from the fan discharge to a fixed-pressure boundary. Select a fan on the drawing first.":"Charakterystyka wentylatora / instalacji ustala przepływ przez wybrany wentylator kolejno na 33 wartościach i dla każdej oblicza całą sieć, więc charakterystyka instalacji jest własnym oporem sieci, a nie dopasowaną parabolą. Profil ciśnienia całkowitego biegnie jedną reprezentatywną drogą od tłoczenia wentylatora do węzła o stałym ciśnieniu. Najpierw wybierz wentylator na rysunku.","The hardest-working ducts are re-sectioned to circular ducts from the EN 1506 / ISO 6580 nominal catalogue and every combination is solved. The ranking is specific air power — air power per m³/s actually delivered — because raw dp·Q rewards choking the duct: the fan sits on a curve, so a smaller duct moves the operating point back and the product falls while the building gets less air.":"Najbardziej obciążone kanały otrzymują przekroje okrągłe z katalogu wymiarów nominalnych EN 1506 / ISO 6580 i oblicza się każdą kombinację. Kryterium szeregowania to jednostkowa moc powietrzna — moc powietrzna na m³/s faktycznie dostarczonego powietrza — ponieważ sam iloczyn dp·Q nagradza dławienie kanału: wentylator pracuje na charakterystyce, więc mniejszy kanał cofa punkt pracy i iloczyn spada, a budynek dostaje mniej powietrza.","The hourly VAV profile needs exactly 24 finite, non-negative multipliers.":"Godzinowy profil VAV wymaga dokładnie 24 skończonych, nieujemnych mnożników.","The intact-network baseline case did not solve, so nothing can be compared against it.":"Przypadek bazowy z nienaruszoną siecią nie dał się obliczyć, więc nie ma z czym porównywać.","The load profile reports fan energy; this network has no fan.":"Profil obciążenia podaje energię wentylatora; ta sieć nie ma wentylatora.","The network document":"Dokument sieci","The profile also drives the global fan-speed factor, clamped to the tool’s own 40–120 % range.":"Profil steruje także globalnym współczynnikiem prędkości wentylatorów, ograniczonym do zakresu 40–120 % narzędzia.","The selected damper is swept from 10 % to 100 % open in 1 % steps, each step a full network solve, and its installed characteristic is compared with its own inherent law. The reported authority is the ratio dp(100 %)/dp(10 %) — an upper bound on the usual open/closed authority, because a fully shut damper makes the quadratic branch equation singular in this formulation.":"Wybrana przepustnica jest otwierana od 10 % do 100 % co 1 %, każdy krok to pełne obliczenie sieci, a jej charakterystyka zabudowana jest porównywana z charakterystyką wewnętrzną. Podawany autorytet to stosunek dp(100 %)/dp(10 %) — górne oszacowanie zwykłego autorytetu otwarta/zamknięta, ponieważ całkowicie zamknięta przepustnica czyni kwadratowe równanie gałęzi osobliwym w tym sformułowaniu.","The selection inspector":"Panel zaznaczenia","The shared interface layer (diagram-ui.js) did not load. Every input, the model, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"Wspólna warstwa interfejsu (diagram-ui.js) nie została wczytana. Wszystkie dane wejściowe, model, rysunek, analizy parametryczne i eksport nadal działają; strona przechodzi na jedną prostą kolumnę.","The velocity limit is the value the sweeps flag against; the starvation threshold is how far a grille’s airflow may fall below its intact-network value in the N-1 screen before that contingency counts as starving a grille.":"Prędkość graniczna to wartość, względem której analizy parametryczne zgłaszają przekroczenia; próg niedozasilenia określa, o ile przepływ kratki może spaść poniżej wartości w sieci nienaruszonej w analizie N-1, zanim dany przypadek zostanie uznany za niedozasilenie kratki.","There is no airflow through this damper at 100 % opening, so an installed characteristic has no meaning.":"Przy 100 % otwarcia przez tę przepustnicę nie płynie powietrze, więc charakterystyka zabudowana nie ma znaczenia.","This network has no ducts to size.":"Ta sieć nie ma kanałów do doboru wymiarów.","This sweep needs diagram-compute.classic.js: its \"":"Ta analiza parametryczna wymaga diagram-compute.classic.js: jej plan „","Topological fallback discharge path":"Zastępcza droga tłoczenia według topologii","Total + (ρ−ρo)gz Pa":"Całkowite + (ρ−ρo)gz Pa","Total loss signed Pa":"Strata całkowita ze znakiem Pa","Total p Pa(g)":"p całkowite Pa (nadc.)","Total-pressure profile":"Profil ciśnienia całkowitego","Two-branch supply system":"Instalacja nawiewna z dwiema gałęziami","Type":"Typ","Unsupported duct-network schema version":"Nieobsługiwana wersja schematu sieci kanałów","Use 0 Pa for room/outdoor ambient. Demand is scaled by the global load factor; negative demand injects air.":"Dla pomieszczenia lub powietrza zewnętrznego podaj 0 Pa. Zapotrzebowanie jest skalowane globalnym współczynnikiem obciążenia; ujemne zapotrzebowanie doprowadza powietrze.","VAV load profile":"Profil obciążenia VAV","VAV load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Profil obciążenia VAV: każdy węzeł tej sieci ma zerowe zapotrzebowanie, a mnożnik profilu skaluje tylko zapotrzebowania węzłowe, więc każda godzina to ten sam punkt pracy, a energia to jeden punkt pomnożony przez liczbę godzin.","Velocity and velocity pressure":"Prędkość i ciśnienie dynamiczne","Velocity limit":"Prędkość graniczna","Velocity m/s":"Prędkość m/s","Velocity p Pa":"Ciśnienie dynamiczne Pa","W (air)":"W (powietrze)","W per m3/s delivered":"W na dostarczony m3/s","What this tool does":"Do czego służy narzędzie","Whatever is selected on the drawing is edited here. Every edit throws the current solution away — the results dim and say so — because the answer belonged to the network as it was.":"Tu edytuje się to, co zaznaczono na rysunku. Każda zmiana unieważnia bieżące rozwiązanie — wyniki zostają przyciemnione i oznaczone — ponieważ dotyczyły sieci sprzed zmiany.","Where the arithmetic runs":"Gdzie wykonywane są obliczenia","Width":"Szerokość","Worst drop %":"Największy spadek %","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"przed udostępnieniem analiz parametrycznych przypadek z wątku roboczego porównano z tym samym przypadkiem obliczonym w wątku głównym","a design-point pressure-drop law scaled by opening; auto-balance changes opening, not the rated characteristic.":"prawo spadku ciśnienia z punktu obliczeniowego skalowane otwarciem; automatyczne równoważenie zmienia otwarcie, a nie charakterystykę znamionową.","a user-supplied local-loss coefficient K applied to that arm; represent a multi-port junction by a node and one fitting edge per arm that needs an explicit K.":"podany przez użytkownika współczynnik strat miejscowych K dla tego ramienia; węzeł rozdziału z wieloma przyłączami odwzoruj jako węzeł i po jednym elemencie kształtki na każde ramię wymagające jawnego K.","and 5·10":"i 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"arytmetyka, a ta zasada obowiązuje na platformie, której libm zaokrągla inaczej.","at opening limit:":"na granicy otwarcia:","cancelled by the user":"anulowane przez użytkownika","cancelling…":"anulowanie…","catalogue sizes tried)":"sprawdzonych wymiarów katalogowych)","central-difference Jacobian, the damped line search and the linear solve are all the":"macierz Jacobiego z różnic centralnych, tłumione przeszukiwanie liniowe i rozwiązanie układu liniowego są wszystkie","circular or rectangular Darcy–Weisbach; 64/Re laminar, Swamee–Jain turbulent friction and ΣK local losses. Swamee–Jain is an":"okrągły lub prostokątny, Darcy–Weisbach; 64/Re dla przepływu laminarnego, Swamee–Jain dla turbulentnego i straty miejscowe ΣK. Swamee–Jain to","cubic metres per hour":"m³/h","damper design point":"punkt obliczeniowy przepustnicy","descending quadratic curve of fan total-pressure rise from shutoff pressure and one rated point, scaled by fan affinity laws.":"malejąca kwadratowa charakterystyka przyrostu ciśnienia całkowitego wentylatora wyznaczona z ciśnienia przy zerowym przepływie i jednego punktu znamionowego, skalowana prawami podobieństwa wentylatorów.","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and its quantile tallies live in the runtime":"diagram-compute.classic.js nie został wczytany; analizy parametryczne działają w wątku głównym, a analiza Monte Carlo jest niedostępna, ponieważ jej plan hipersześcianu łacińskiego i zliczenia kwantyli należą do środowiska wykonawczego","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"brak diagram-compute.classic.js, więc analiza parametryczna wykonała się jako jedna blokująca pętla w wątku głównym, dokładnie jak w v1","dp = dp_design (Q/Q_design)^n, with the exponent n between 1 and 3 — 2 is the usual quadratic terminal. A grille here is a duct resistance only: no throw, no noise, no induction.":"dp = dp_design (Q/Q_design)^n, z wykładnikiem n od 1 do 3 — 2 to typowy element końcowy o charakterystyce kwadratowej. Kratka jest tu wyłącznie oporem w sieci: bez zasięgu strumienia, hałasu i indukcji.","duct network: the interface layer failed to start":"sieć kanałów: nie udało się uruchomić warstwy interfejsu","equal %":"stałoprocentowa","equal percentage":"stałoprocentowa","every case was evaluated in index order on one thread, each from a cold start":"każdy przypadek obliczono w kolejności indeksów w jednym wątku, każdy od początku","explicit approximation":"jawne przybliżenie","fan rated point":"punkt znamionowy wentylatora","gate then bounds the result at roughly 1e-7 relative.":"kryterium ogranicza wtedy wynik do około 1e-7 względnie.","grille design point":"punkt projektowy kratki","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"zatrzymuje się przy skalowanym residuum 2e-9, odpowiadającym około 1e-7 względnie), a nie przez","kW (air)":"kW (powietrze)","kWh (air power dp*Q; no fan, motor or drive efficiency)":"kWh (moc powietrzna dp*Q; bez sprawności wentylatora, silnika i napędu)","laminar friction":"tarcie laminarne","main thread":"wątek główny","m³/h, all fans":"m³/h, wszystkie wentylatory","no Worker pool could be created (":"nie udało się utworzyć puli wątków roboczych (","no result":"brak wyniku","no runtime; one blocking main-thread loop":"brak środowiska wykonawczego; jedna blokująca pętla w wątku głównym","no sweep has run yet; the interactive solve is always on the main thread":"nie wykonano jeszcze analizy parametrycznej; obliczenie interaktywne zawsze odbywa się w wątku głównym","no sweep run":"brak analizy parametrycznej","none (diagram-compute.classic.js absent)":"brak (brak diagram-compute.classic.js)","none: every recorded output reproduces bit for bit on this platform. What could":"brak: każdy zapisany wynik odtwarza się bit w bit na tej platformie. To, co mogłoby","operating point":"punkt pracy","p total [Pa]":"p całkowite [Pa]","path taken here is the path the page took.":"droga obliczeń jest tu taka sama jak na stronie.","preliminary assessment":"wstępna ocena","round duct finite loss":"skończona strata kanału okrągłego","s generic verbs are replaced by this tool":"ogólne polecenia zastępuje to narzędzie","s page-level unit system defaults to":"domyślny system jednostek strony to","s primary action for a compute:":"główna akcja obliczeniowa:","steps either side":"wymiarów w każdą stronę","still separate the two is a C library whose exp/log/pow round differently in the last":"nadal je rozróżnić, to biblioteka C, której exp/log/pow zaokrąglają inaczej w ostatnim","tap target >= 44 px below md":"pole dotyku >= 44 px poniżej md","technical exploration":"eksploracja techniczna","tee K loss":"strata K trójnika","the Worker case failed:":"przypadek z wątku roboczego nie powiódł się:","the Worker path did not reproduce the main-thread solve (":"ścieżka wątków roboczych nie odtworzyła obliczenia z wątku głównego (","the Worker path failed during this sweep (":"ścieżka wątków roboczych zawiodła podczas tej analizy (","the complete steady-state network solve of this page for the network currently on the canvas: the same continuity and energy equations, the same duct/tee/damper/grille/fan component laws, and the same damped Newton iteration on scaled residuals. Charts, auto-balancing and the pressure-path search are not part of the export.":"pełne obliczenie ustalonego stanu sieci z tej strony dla sieci na rysunku: te same równania ciągłości i energii, te same prawa elementów kanał/trójnik/przepustnica/kratka/wentylator i ta sama tłumiona iteracja Newtona na skalowanych residuach. Wykresy, automatyczne równoważenie i wyszukiwanie drogi ciśnienia nie są częścią eksportu.","the damper is not in this network snapshot":"tej przepustnicy nie ma w tej kopii sieci","the network on the canvas is not solvable, so no comparison was possible":"sieci na rysunku nie da się obliczyć, więc porównanie nie było możliwe","the shared runtime failed to start (":"współdzielone środowisko wykonawcze nie uruchomiło się (","the shared runtime is loaded; sweeps run on the main thread":"współdzielone środowisko wykonawcze jest wczytane; analizy parametryczne działają w wątku głównym","this browser exposes no Worker; sweeps run on the main thread":"ta przeglądarka nie udostępnia wątków roboczych; analizy parametryczne działają w wątku głównym","to Colebrook–White, published for 10":"równania Colebrooka–White’a, opublikowane dla 10","unknown sweep case kind:":"nieznany rodzaj przypadku analizy parametrycznej:","unrecognised duct-network state payload":"nierozpoznany stan sieci kanałów w danych","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search, same 600-unknown ceiling. What this build adds is repeated solves (fan/system curve, damper authority, N-1 branch blockage, Monte-Carlo, VAV load profile, duct sizing) on the shared compute runtime diagram-compute.classic.js. Damper auto-balancing is sequential by construction and was deliberately left on the main thread.":"Wersja v2: zapisane powyżej obliczenie stanu ustalonego to niezmieniony solver wersji v1 — to samo składanie residuów, ta sama macierz Jacobiego z różnic centralnych, ta sama gęsta eliminacja Gaussa–Jordana z częściowym wyborem elementu głównego, to samo tłumione przeszukiwanie liniowe Newtona, ten sam limit 600 niewiadomych. Ta wersja dodaje obliczenia powtarzane (charakterystyka wentylatora / instalacji, autorytet przepustnicy, analiza N-1, Monte Carlo, profil obciążenia VAV, dobór wymiarów kanałów) we współdzielonym środowisku obliczeniowym diagram-compute.classic.js. Automatyczne równoważenie przepustnic jest z natury sekwencyjne i celowo pozostawiono je w wątku głównym.","worst relative difference":"największa różnica względna","· design":"· plan","Δp at design flow, 100 %":"Δp przy przepływie obliczeniowym, 100 %","Δp damper Pa":"Δp przepustnicy Pa","Δp nodes [Pa]":"Δp między węzłami [Pa]","— THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY":"— OSZACOWANIE DOKŁADNOŚCI NIE OBOWIĄZUJE DLA CO NAJMNIEJ JEDNEGO ZLICZENIA","Fan":"Wentylator","fan":"wentylator","duct":"kanał","damper":"przepustnica","grille":"kratka","tee":"trójnik","free":"swobodny","Steady solve:":"Obliczenie ustalone:","System":"Instalacja","idle":"bezczynny","removes the selection.":"usuwa zaznaczenie.","Grille Δp σ (lognormal)":"Δp kratek σ (log-normalny)","Run Monte-Carlo":"Uruchom Monte Carlo","linear":"liniowa","Duct Network Solver (v2)":"Obliczenia sieci kanałów (v2)","Audited build 2026-08-09. Steady-state, incompressible and single-phase. Fluid properties are constant. Grilles are duct resistances only. Fan curves use shutoff pressure plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative damper-opening heuristic and cannot guarantee coupled or infeasible targets. The total-pressure profile follows one representative airflow path. Generic junction nodes have no unique cross-section, so static pressure is not recovered there; component velocity and velocity pressure are reported separately. Tee/fitting K values are inputs; they are not derived from ASHRAE/Idelchik geometry or split ratios. The dense browser solver refuses models above 600 nonlinear unknowns. No duct leakage, compressibility, acoustics, smoke transport, fan-efficiency map, stall/surge model, or transient control model is included.":"Wersja audytowana 2026-08-09. Stan ustalony, przepływ nieściśliwy i jednofazowy. Właściwości płynu są stałe. Kratki są wyłącznie oporami w sieci. Charakterystyki wentylatorów opierają się na ciśnieniu przy zerowym przepływie i jednym punkcie znamionowym; przepływ wsteczny i praca poza punktem zerowego przyrostu ciśnienia są ekstrapolacjami i są sygnalizowane ostrzeżeniem. Automatyczne równoważenie to iteracyjna heurystyka otwarć przepustnic i nie gwarantuje osiągnięcia celów sprzężonych ani nieosiągalnych. Profil ciśnienia całkowitego biegnie jedną reprezentatywną drogą przepływu. Ogólne węzły rozdziału nie mają jednoznacznego przekroju, więc ciśnienie statyczne nie jest w nich wyznaczane; prędkość i ciśnienie dynamiczne elementów podaje się osobno. Wartości K trójników i kształtek są danymi wejściowymi; nie wynikają z geometrii według ASHRAE/Idelczyka ani ze stosunku podziału strumieni. Gęsty solver w przeglądarce odrzuca modele z więcej niż 600 niewiadomymi nieliniowymi. Model nie obejmuje nieszczelności kanałów, ściśliwości, akustyki, przenoszenia dymu, mapy sprawności wentylatora, modelu pompażu ani regulacji w stanach nieustalonych."};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='pl')return'pl'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='pl'||localStorage.getItem('diagram_lang')==='pl')return'pl'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};
if(siteLang()!=='pl')return;
const setLang=()=>{if(window.Diagram&&typeof Diagram.setDocumentLang==='function')Diagram.setDocumentLang('pl');else if(document.documentElement.lang!=='pl')document.documentElement.lang='pl'};setLang();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setLang,{once:true});
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(PL,x))return PL[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(PL,t))return a+PL[t]+b;const pz=t&&window.__dnPatterns?window.__dnPatterns.translate('pl',t,PL):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(PL,k))return a+lw+': '+PL[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
</script>
