const UK={"\" design (and, for the Monte-Carlo, its quantile tallies) live in the shared runtime, and this build will not substitute a different sampler and call it the same experiment.":"\" розрахунок (а для методу Монте-Карло — його квантильні підсумки) живуть у спільному середовищі виконання, і ця збірка не підмінить інший семплер, назвавши це тим самим експериментом.","% points":"% пунктів","% pts":"% пт","%-steps":"%-кроки","(hydraulic diameter now":"(гідравлічний діаметр тепер","(unchanged from v1). Last runtime computation:":"(без змін відносно v1). Останнє обчислення під час виконання:","), so it fell back to the main thread":"), тому виконання повернулося в основний потік","), so sweeps stay on the main thread":"), тому розгортки лишаються в основному потоці","); sweeps run on the main thread":"); розгортки виконуються в основному потоці","); sweeps run on the main thread and the Monte-Carlo sweep is unavailable":"); розгортки виконуються в основному потоці, а розгортка Монте-Карло недоступна","- (dp at 100% / dp at 10%; upper bound on open/closed authority)":"- (dp при 100% / dp при 10%; верхня межа авторитетності відкрито/закрито)","- (fraction of intact flow)":"- (частка непошкодженої витрати)","- (fraction of wide-open flow)":"- (частка витрати при повністю відкритому положенні)","- (fraction)":"- (частка)","2000 < Re < 4000 is a numerical blend, not a resolved transition model":"2000 < Re < 4000 — це числове змішування, а не розв'язана модель перехідного режиму","24 h — one day":"24 год — одна доба","8760 h — one year":"8760 год — один рік","8760 hourly rows are summarised above rather than printed.":"8760 погодинних рядків підсумовано вище, а не виведено повністю.",": nothing in this payload maps onto the current selection.":": у цих даних немає нічого, що відповідало б поточному виділенню.","; ignored":"; проігноровано","; one Worker case was checked against the same case solved here and came back identical":"; один випадок Worker-обчислення був звірений з тим самим випадком, розв'язаним тут, і результати збіглися","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Ducts running outside the published box are listed as a warning after each solve.":"; у межах цього діапазону це відрізняється від кореня рівняння Colebrook не більш як на приблизно 3% за f, а поза його межами — більше. Змішування 2000<Re<4000 є числовим містком, а не розв'язаною моделлю перехідного режиму. Повітроводи, що виходять за межі опублікованого діапазону, перелічуються як попередження після кожного розрахунку.","A Latin hypercube over duct roughness (lognormal, median 1), grille design pressure drop (lognormal, median 1) and damper opening (normal, in percentage points), with an optional rank correlation inside each family. Quantiles are DDSketch estimates with a stated error bound, not exact order statistics. Duct leakage is not sampled: this model has no leakage element, and inventing one as a nodal demand would be a different model, not an uncertainty.":"Латинський гіперкуб за шорсткістю повітроводу (логнормальний розподіл, медіана 1), розрахунковим перепадом тиску решітки (логнормальний розподіл, медіана 1) і відкриттям заслінки (нормальний розподіл, у процентних пунктах), із додатковою ранговою кореляцією всередині кожного сімейства. Квантилі є оцінками DDSketch із заданою межею похибки, а не точними порядковими статистиками. Витік повітроводу не семплюється: ця модель не має елемента витоку, і вигадування його як вузлового навантаження було б уже іншою моделлю, а не невизначеністю.","A arm":"Плече A","A damper":"Заслінка A","A damper out":"Заслінка A вихід","A descending quadratic curve of fan total-pressure rise through the shutoff pressure and one rated point, scaled by the affinity laws with the local and global speed factors. The solver adds this rise to the gauge total pressure of the airflow, so the curve must be on the fan total-pressure basis; a catalogue static-pressure curve needs the fan outlet velocity pressure added before entry. Rated pressure must be below shutoff pressure. Reverse flow and operation beyond the zero-head runout are extrapolations of that quadratic and are warned after the solve.":"Спадна квадратична крива приросту повного тиску вентилятора, що проходить через тиск при нульовій витраті й одну номінальну точку, масштабована за законами подібності з локальним і глобальним коефіцієнтами швидкості. Розв’язувач додає цей приріст до надлишкового повного тиску потоку, тож криву слід вводити за повним тиском вентилятора; до каталожної кривої статичного тиску перед введенням треба додати динамічний тиск на виході вентилятора. Номінальний тиск має бути нижчим за тиск при нульовій витраті. Зворотна витрата та робота за межею нульового напору є екстраполяціями цієї квадратичної кривої й позначаються попередженням після розрахунку.","A design-point pressure drop scaled by opening: dp = dp_design (q/q_design)² / c², with c = o for the linear conductance law and c = 50^(o−1) for equal percentage, where o is the opening as a fraction. Auto-balance changes the opening, never the rated characteristic. Set a balance target flow to include a damper in auto-balancing.":"Перепад тиску в розрахунковій точці, масштабований за відкриттям: dp = dp_design (q/q_design)² / c², де c = o для лінійного закону провідності та c = 50^(o−1) для рівнопроцентного, де o — відкриття у частках. Автобалансування змінює відкриття, але ніколи не номінальну характеристику. Щоб включити заслінку в автобалансування, задайте цільову витрату балансування.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary (normally 0 Pa for room/outdoor ambient). Positive node demand removes airflow; negative demand injects it. Boundary pressures are gauge pressures relative to the outdoor air at the node elevation; with one air density inside and outside, the hydrostatic terms cancel, and buoyancy/stack effect from temperature-dependent density is not modelled.":"Вузол з фіксованим тиском фіксує надлишковий повний тиск на межі з низькою швидкістю (зазвичай 0 Па для приміщення/зовнішнього середовища). Додатне вузлове навантаження вилучає витрату повітря; від'ємне — нагнітає її. Граничні тиски — надлишкові відносно зовнішнього повітря на висоті вузла; за однієї густини повітря всередині й зовні гідростатичні доданки взаємно знищуються, а ефект плавучості/димової тяги через залежність густини від температури не моделюється.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary — normally 0 Pa for a room or the outdoors. At least one is needed in every connected part of the network, otherwise the pressure level is undetermined and the solve is refused.":"Вузол з фіксованим тиском фіксує надлишковий повний тиск на межі з низькою швидкістю — зазвичай 0 Па для приміщення або зовнішнього середовища. Принаймні один такий вузол потрібен у кожній зв'язній частині мережі, інакше рівень тиску не визначений і розрахунок відхиляється.","A grille":"Решітка A","A rename does not change a number, so the solution is kept.":"Перейменування не змінює число, тому розв'язок зберігається.","A sweep is already running.":"Розгортка вже виконується.","A tee arm is a user-supplied local-loss coefficient K applied to that arm only, with no friction term. Represent a multi-port junction as one node plus one fitting edge per arm that needs an explicit K. The K values are inputs: they are not derived from ASHRAE or Idelchik geometry, and not from the split ratio.":"Плече трійника — це заданий користувачем коефіцієнт місцевого опору K, застосований лише до цього плеча, без складової тертя. Багатопортове з'єднання подається як один вузол плюс одна фасонна гілка на кожне плече, для якого потрібен явний K. Значення K є вхідними даними: вони не виводяться з геометрії за ASHRAE чи Ідельчиком і не з коефіцієнта розділення.","ASHRAE Handbook - Fundamentals, Duct Design: rectangular hydraulic diameter Dh = 2WH/(W+H); local loss dp = K rho v^2/2.":"ASHRAE Handbook - Fundamentals, Duct Design: прямокутний гідравлічний діаметр Dh = 2WH/(W+H); місцевий опір dp = K rho v^2/2.","Add at least one component.":"Додайте принаймні один компонент.","Add at least two nodes.":"Додайте принаймні два вузли.","Air and load":"Повітря та навантаження","Air density":"Густина повітря","Air density 0.2 to 2 kg/m3":"Густина повітря 0,2 до 2 кг/м3","Air density must be 0.2–2 kg/m³.":"Густина повітря має бути 0,2–2 кг/м³.","Air power W":"Аеродинамічна потужність W","Air state":"Стан повітря","Airflow [m³/h]":"Витрата повітря [м³/год]","All component airflows and all free-node gauge total pressures are unknowns in one system, solved by a damped Newton method with a numerically differentiated Jacobian and a dense Gauss–Jordan factorisation with partial pivoting. The stopping rule is a scaled residual of 2×10⁻⁹; if the iteration cap is reached first the result is reported as unconverged. The browser solver refuses models above 600 nonlinear unknowns.":"Усі витрати компонентів та надлишкові повні тиски вільних вузлів є невідомими в одній системі, яка розв'язується демпфованим методом Ньютона з чисельно продиференційованим якобіаном і щільною факторизацією Гаусса–Жордана з частковим вибором головного елемента. Критерій зупинки — масштабований залишок 2×10⁻⁹; якщо спершу досягається ліміт ітерацій, результат позначається як такий, що не збігся. Розв'язувач у браузері відмовляє в моделях понад 600 нелінійних невідомих.","Arm loss coefficient K":"Коефіцієнт місцевого опору плеча K","At most 600 nonlinear unknowns (components + free nodes)":"Щонайбільше 600 нелінійних невідомих (компоненти + вільні вузли)","Auto-balance dampers":"Автобалансування заслінок","Auto-balance moves the opening of every damper with a target above zero.":"Автобалансування змінює відкриття кожної заслінки з ціллю, більшою за нуль.","B arm":"Плече B","B damper":"Заслінка B","B damper out":"Заслінка B вихід","B grille":"Решітка B","Balance target":"Ціль балансування","Balancing failed:":"Балансування не вдалося:","Balancing is not meaningful at 0% load":"Балансування не має сенсу при навантаженні 0%","Boundary +in m³/h":"Межа +вхід м³/год","Boundary [m³/h]":"Межа [м³/год]","Boundary conditions":"Граничні умови","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: used only to quantify the Swamee-Jain scatter, never as the graded reference.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: використовується лише для кількісної оцінки розкиду Swamee-Jain, а не як еталонне джерело.","Cancel sweep":"Скасувати розгортку","Catalogue window ± steps (0 = all)":"Вікно каталогу ± кроки (0 = усі)","Circular":"Кругла","Circular or rectangular Darcy–Weisbach: 64/Re below Re 2000, the Swamee–Jain explicit approximation above Re 4000, and a smoothstep blend between. Swamee–Jain is published for 10⁻⁶ ≤ eps/Dh ≤ 10⁻² and 5×10³ ≤ Re ≤ 10⁸; over that box it differs from the Colebrook root by up to about 3 % in f, and by more outside it. Ducts running outside the published box are listed as a warning after each solve. Roughness is the absolute wall roughness in millimetres; ΣK collects the local losses on that run.":"Дарсі–Вейсбах для круглого чи прямокутного перерізу: 64/Re при Re нижче 2000, явна апроксимація Swamee–Jain при Re вище 4000, і плавне змішування між ними. Swamee–Jain опубліковано для 10⁻⁶ ≤ eps/Dh ≤ 10⁻² та 5×10³ ≤ Re ≤ 10⁸; у межах цього діапазону це відрізняється від кореня рівняння Colebrook не більш як приблизно на 3% за f, а поза його межами — більше. Повітроводи, що виходять за межі опублікованого діапазону, перелічуються як попередження після кожного розрахунку. Шорсткість — це абсолютна шорсткість стінки в міліметрах; ΣK збирає місцеві опори цього прогону.","Click a node or a component on the drawing to edit it, or pick a tool and click the canvas to create one.":"Клацніть на вузлі чи компоненті на кресленні, щоб редагувати його, або оберіть інструмент і клацніть на полотні, щоб створити новий.","Click empty canvas to add a node.":"Клацніть на порожньому полотні, щоб додати вузол.","Click junction node, then arm node to add a tee/fitting loss arm.":"Клацніть на вузлі з'єднання, потім на вузлі плеча, щоб додати плече трійника/фасонної частини.","Click start node, then end node to add a damper.":"Клацніть на початковому вузлі, потім на кінцевому, щоб додати заслінку.","Click start node, then end node to add a duct.":"Клацніть на початковому вузлі, потім на кінцевому, щоб додати повітровід.","Click start node, then end node to add a grille.":"Клацніть на початковому вузлі, потім на кінцевому, щоб додати решітку.","Component":"Компонент","Component closed":"Компонент закрито","Component energy:  h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, with h = p_total_gauge/(rho g), gauge relative to outdoor air at the node elevation, rho_out = rho":"Енергія компонента: h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, де h = p_total_gauge/(rho g), rho_out = rho","Component results":"Результати компонента","Component velocity is the airflow divided by the flow area, and velocity pressure is ½ rho v². Generic junction nodes have no unique cross-section, so static pressure is not recovered at a node: velocity and velocity pressure are reported per component instead. The velocity limit in Screening limits is what the N-1, profile and sizing sweeps compare against.":"Швидкість компонента — це витрата повітря, поділена на площу перерізу, а динамічний тиск — ½ rho v². Звичайні вузли з'єднання не мають унікального перерізу, тому статичний тиск для вузла не визначається: натомість швидкість і динамічний тиск наводяться для кожного компонента. Ліміт швидкості у Межах скринінгу — це те, з чим порівнюють розгортки N-1, профілю та типорозмірів.","Components":"Компоненти","Compute":"Обчислити","Could not sweep a usable authority curve.":"Не вдалося побудувати придатну криву авторитетності.","Could not sweep a usable system curve.":"Не вдалося побудувати придатну криву мережі.","Curves":"Криві","Damper":"Заслінка","Damper authority":"Авторитетність заслінки","Damper flow m³/h":"Витрата заслінки м³/год","Damper opening 0.1 % to 100 %":"Відкриття заслінки 0,1% до 100%","Damper opening [%]":"Відкриття заслінки [%]","Damper opening sd (normal)":"Ст.відх. відкриття заслінки (нормальний розподіл)","Damper:":"Заслінка:","Damper:  h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2,  c = o (linear) or 50^(o-1) (equal percentage), o = opening/100":"Заслінка: h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2, c = o (лінійна) або 50^(o-1) (рівнопроцентна), o = відкриття/100","Dampers":"Заслінки","Delete":"Видалити","Delete selected":"Видалити вибране","Delete the selection":"Видалити виділення","Demand [m³/h]":"Навантаження [м³/год]","Demand m³/h":"Навантаження м³/год","Demand, positive out":"Навантаження, додатне назовні","Density and kinematic viscosity are constant everywhere and for the whole solve. Density converts head to pressure and scales every loss; viscosity only enters through the Reynolds number, and therefore only through the friction factor of ducts. 1.204 kg/m³ and 1.5×10⁻⁵ m²/s are dry air at about 20 °C and one atmosphere.":"Густина та кінематична в'язкість є сталими всюди й на весь час розрахунку. Густина переводить напір у тиск і масштабує кожен опір; в'язкість входить лише через число Рейнольдса, а отже — лише через коефіцієнт тертя повітроводів. 1,204 кг/м³ і 1,5×10⁻⁵ м²/с — це сухе повітря за приблизно 20 °C і одну атмосферу.","Design flow":"Розрахункова витрата","Design m³/h":"Розрахунково м³/год","Design Δp":"Розрахунковий Δp","Diameter":"Діаметр","Direction:":"Напрям:","Drag nodes. Select an element to edit it.":"Перетягуйте вузли. Виберіть елемент, щоб редагувати його.","Draw":"Малювати","Draw a network, or load the example, then press Solve network.":"Намалюйте мережу або завантажте приклад, потім натисніть «Розрахувати мережу».","Draw and solve arbitrary air-duct networks with ducts, junction/tee arms, grilles, dampers and fans. Steady-state airflow, gauge total pressure, fan/system curves and damper balancing.":"Малюйте та розраховуйте довільні мережі повітроводів із повітроводами, плечима з'єднань/трійників, решітками, заслінками та вентиляторами. Усталена витрата повітря, надлишковий повний тиск, криві вентилятора/мережі та балансування заслінок.","Drawing tools":"Інструменти креслення","Duct":"Повітровід","Duct internal checks failed":"Внутрішні перевірки повітроводу не пройдені","Duct network drawing canvas":"Полотно креслення мережі повітроводів","Duct roughness σ (lognormal)":"Шорсткість повітроводу σ (логнормальний розподіл)","Duct sizing":"Підбір типорозміру повітроводу","Duct sizing cancelled.":"Підбір типорозміру повітроводу скасовано.","Duct sizing failed:":"Підбір типорозміру повітроводу не вдався:","Duct sizing is ranked by specific air power (air power per m3/s delivered), not by raw air power: with a fan on a curve, a smaller duct lowers the product dp*Q while delivering less air, so the raw figure rewards choking. Each swept duct is replaced by a circular duct of the catalogue size under test, so a rectangular duct is re-sectioned, and cost is represented only by the swept surface area pi*D*L.":"Підбір типорозміру повітроводу ранжується за питомою аеродинамічною потужністю (потужність на м3/с доставленого повітря), а не за абсолютною аеродинамічною потужністю: оскільки вентилятор працює на кривій, менший повітровід знижує добуток dp*Q, доставляючи менше повітря, тож абсолютний показник заохочує «задушення». Кожен повітровід у розгортці замінюється круглим повітроводом каталожного типорозміру, що перевіряється, тож прямокутний повітровід перетинається заново, а вартість представлена лише площею поверхні розгортки pi*D*L.","Duct sizing over the EN 1506 catalogue":"Підбір типорозміру повітроводу за каталогом EN 1506","Duct:":"Повітровід:","Duct:  h_loss = (f L/Dh + K) v^2/(2 g),  v = q/A,  Re = v Dh/nu":"Повітровід: h_loss = (f L/Dh + K) v^2/(2 g), v = q/A, Re = v Dh/nu","Ducts":"Повітроводи","Ducts to size (highest v first)":"Повітроводи для підбору (спочатку найвища v)","EN 1506 nominal circular duct diameters, mm:":"Номінальні діаметри круглих повітроводів EN 1506, мм:","Each duct, tee arm and damper is removed in turn and the network re-solved from cold, to find which grilles starve when one branch closes. Contingencies that leave the network unsolvable are listed as such rather than being silently dropped.":"Кожен повітровід, плече трійника та заслінка по черзі вилучаються, а мережа заново розраховується «з нуля», щоб знайти, які решітки недоотримують повітря при закритті однієї гілки. Аварійні випадки, після яких мережа стає нерозв'язною, позначаються як такі, а не тихо відкидаються.","Edge":"Ребро","Edge results":"Результати ребра","Elevation":"Висота","Node pressures are gauge pressures relative to the outdoor air at the elevation of the node. The energy balance carries the hydrostatic term (rho − rho_out) g z, and the outdoor density rho_out equals the air density entered here, so the term is zero and elevation changes no airflow or pressure. Buoyancy and stack effect from temperature-dependent density are not modelled, so a tall riser carrying warm air is not represented by raising its nodes.":"Тиски у вузлах — надлишкові тиски відносно зовнішнього повітря на висоті вузла. Баланс енергії містить гідростатичний доданок (rho − rho_out) g z, а густина зовнішнього повітря rho_out дорівнює введеній тут густині повітря, тож доданок нульовий і висота не змінює жодної витрати чи тиску. Ефект плавучості та димової тяги через залежність густини від температури не моделюється, тож високий стояк із теплим повітрям не подається підняттям його вузлів.","Node pressures are gauge pressures relative to the outdoor air at each node elevation; with the outdoor density equal to the air density the hydrostatic terms cancel, and buoyancy and stack effect from temperature-dependent density are not modelled.":"Тиски у вузлах — надлишкові відносно зовнішнього повітря на висоті кожного вузла; коли густина зовнішнього повітря дорівнює густині повітря, гідростатичні доданки взаємно знищуються, а ефект плавучості та димової тяги через залежність густини від температури не моделюється.","Elevation m":"Висота, м","Ensemble sweep results":"Результати ансамблевої розгортки","Equal percentage (R=50)":"Рівнопроцентна (R=50)","Equations":"Рівняння","Every network needs at least one fixed-pressure node per connected component; ambient boundaries are normally 0 Pa gauge total pressure.":"Кожній мережі потрібен принаймні один вузол з фіксованим тиском на кожен зв'язний компонент; зовнішні межі зазвичай мають надлишковий повний тиск 0 Па.","Every nodal demand is multiplied by this factor before the solve, so 60 % means every extraction and injection runs at 60 % of its design value. It does not touch fan speed, damper openings or grille design points. The valid range of the model is 0 to 150 %.":"Кожне вузлове навантаження множиться на цей коефіцієнт перед розрахунком, тож 60% означає, що кожне вилучення та нагнітання працює на рівні 60% від свого розрахункового значення. Це не впливає на швидкість вентилятора, відкриття заслінок чи розрахункові точки решіток. Допустимий діапазон моделі — від 0 до 150%.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand, or tick \"profile also drives fan speed\", to make the profile mean anything.":"Кожен вузол цієї мережі має нульове навантаження, а множник профілю масштабує лише вузлові навантаження — тож кожна година нижче відповідає тій самій робочій точці. Задайте навантаження хоча б для одного вузла або позначте «профіль також керує швидкістю вентилятора», щоб профіль мав сенс.","Exactly 24 finite, non-negative multipliers are needed.":"Потрібно рівно 24 скінченні невід'ємні множники.","Exponent n":"Показник степеня n","Fan / system curve":"Крива вентилятора / мережі","Fan [Pa]":"Вентилятор [Па]","Fan affinity law dp ~ n^2 applied to the two-point quadratic fan curve.":"Закон подібності вентилятора dp ~ n^2, застосований до двоточкової квадратичної кривої вентилятора.","Fan air power W":"Аеродинамічна потужність вентилятора, Вт","Fan airflow":"Витрата вентилятора","Fan and system curves":"Криві вентилятора та мережі","Fan discharge":"Нагнітання вентилятора","Fan flow m³/h":"Витрата вентилятора м³/год","Fan rated pressure must be below shutoff pressure; reverse flow and beyond-runout operation are extrapolations and are warned":"Номінальний тиск вентилятора має бути нижчим за тиск при нульовій витраті; зворотна витрата та робота за межею runout є екстраполяціями та позначаються попередженням","Fan rise Pa":"Приріст тиску вентилятора, Па","Fan speed %":"Швидкість вентилятора, %","Fan speed is held at the global factor; only nodal demand follows the profile.":"Швидкість вентилятора утримується на рівні глобального коефіцієнта; лише вузлове навантаження слідує за профілем.","Fan total pressure rise":"Приріст повного тиску вентилятора","Fan Δp Pa":"Δp вентилятора, Па","Fan, main duct, two tee arms, two dampers and two grilles between ambient and a room.":"Вентилятор, магістральний повітровід, два плеча трійників, дві заслінки та дві решітки між зовнішнім середовищем і приміщенням.","Fan/system curve":"Крива вентилятора/мережі","Fan:":"Вентилятор:","Fans":"Вентилятори","Fit the drawing":"Вписати креслення","Fixed gauge total-pressure boundary":"Межа з фіксованим надлишковим повним тиском","Fixed-pressure boundary":"Межа з фіксованим тиском","Fixed-pressure node:  h = p / (rho g)":"Вузол з фіксованим тиском: h = p / (rho g)","Flow / flow at 100 % opening":"Витрата / витрата при відкритті 100%","Flow m³/h":"Витрата м³/год","Flow vs current %":"Витрата залежно від поточного %","Flow-following discharge path":"Шлях нагнітання, що слідує за витратою","For every free node the solver enforces airflow continuity. For every component it enforces steady Bernoulli using gauge total pressure + elevation, fan pressure rise and signed total-pressure loss. Edge airflows and free-node gauge total pressures are solved simultaneously with a damped Newton method.":"Для кожного вільного вузла розв'язувач забезпечує безперервність витрати повітря. Для кожного компонента він забезпечує усталене рівняння Бернуллі з надлишковим повним тиском + висотою, приростом тиску вентилятора та знаковою втратою повного тиску. Витрати на ребрах і надлишкові повні тиски вільних вузлів розв'язуються одночасно демпфованим методом Ньютона.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25/[log10(eps/(3.7 Dh) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Тертя: f = 64/Re для Re <= 2000; Swamee-Jain f = 0.25/[log10(eps/(3.7 Dh) + 5.74/Re^0.9)]^2 для Re >= 4000; плавне змішування між ними","Gauge total pressure":"Надлишковий повний тиск","Gauge total pressure [Pa]":"Надлишковий повний тиск [Па]","Global fan-speed factor":"Глобальний коефіцієнт швидкості вентилятора","Global fan-speed factor must be between 40 and 120%.":"Глобальний коефіцієнт швидкості вентилятора має бути в межах 40–120%.","Grille":"Решітка","Grille exponent n between 1 and 3":"Показник степеня решітки n у межах 1–3","Grille starvation threshold":"Поріг недоотримання решітки","Grille:":"Решітка:","Grille:  h_loss = (dp_design/(rho g)) (q/q_design)^n":"Решітка: h_loss = (dp_design/(rho g)) (q/q_design)^n","Grilles":"Решітки","H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): the loop-correction method dQ = -sum(h)/sum(|dh/dQ|) used by the second solver.":"H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): метод контурної корекції dQ = -sum(h)/sum(|dh/dQ|), який використовує другий розв'язувач.","Hagen-Poiseuille laminar friction f = 64/Re.":"Ламінарне тертя Хагена–Пуазейля f = 64/Re.","Height":"Висота","Hide":"Сховати","Highest v m/s":"Найвища v, м/с","Highest velocity":"Найвища швидкість","Hour":"Година","Hourly VAV multipliers (24 values, comma separated)":"Погодинні множники VAV (24 значення через кому)","How it is solved":"Як це розраховується","Ignored":"Проігноровано","Inherent c/c₁₀₀":"Власна c/c₁₀₀","Initial residual is not finite.":"Початковий залишок не є скінченним.","Installed":"Встановлена","Installed q/q₁₀₀":"Встановлена q/q₁₀₀","Invalid component ID.":"Некоректний ID компонента.","Invalid network file":"Некоректний файл мережі","Invalid node ID.":"Некоректний ID вузла.","It solves a duct network in steady state: you draw nodes and join them with ducts, tee/fitting arms, dampers, grilles and fans, then press Solve network. For every free node the solver enforces airflow continuity, and for every component it enforces steady Bernoulli using gauge total pressure plus elevation, fan pressure rise and signed total-pressure loss. Component airflows and free-node gauge total pressures are solved simultaneously by a damped Newton method.\n\nStart from the example network in the panel above, or pick a tool and click the canvas. Every network needs at least one fixed-pressure node in each connected part.":"Він розраховує мережу повітроводів в усталеному режимі: ви малюєте вузли й з'єднуєте їх повітроводами, плечима трійників/фасонних частин, заслінками, решітками та вентиляторами, а потім натискаєте «Розрахувати мережу». Для кожного вільного вузла розв'язувач забезпечує безперервність витрати повітря, а для кожного компонента — усталене рівняння Бернуллі з надлишковим повним тиском плюс висотою, приростом тиску вентилятора та знаковою втратою повного тиску. Витрати компонентів і надлишкові повні тиски вільних вузлів розраховуються одночасно демпфованим методом Ньютона.\n\nПочніть із прикладу мережі на панелі вище або оберіть інструмент і клацніть на полотні. Кожна мережа потребує принаймні одного вузла з фіксованим тиском у кожній зв'язній частині.","Jacobian is singular":"Якобіан вироджений","Junction losses must be entered as tee/fitting arms with an explicit K; they are not derived from geometry or split ratio.":"Втрати у з'єднанні слід вводити як плечі трійників/фасонних частин з явним K; вони не виводяться з геометрії чи коефіцієнта розділення.","Kinematic viscosity":"Кінематична в'язкість","Kinematic viscosity must be positive.":"Кінематична в'язкість має бути додатною.","Length":"Довжина","Linear conductance":"Лінійна провідність","Load example network":"Завантажити приклад мережі","Load factor must be between 0 and 150%.":"Коефіцієнт навантаження має бути в межах 0–150%.","Load profile cancelled.":"Завантаження профілю скасовано.","Load profile failed:":"Завантаження профілю не вдалося:","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the duct network the user draws is transmitted anywhere: every solve and every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Завантажує три скрипти з того самого джерела, що й сторінка, — site-disclaimer.js, diagram-common.js і diagram-compute.classic.js (класична збірка спільного середовища обчислень). Більше нічого не завантажується, жоден сторонній хост не опитується, і жодні дані про намальовану користувачем мережу повітроводів нікуди не передаються: кожен розрахунок і кожна розгортка виконуються в цьому браузері, в основному потоці або у Blob Workers з того самого джерела, створених з diagram-compute.classic.js.","Local speed":"Локальна швидкість","Loss [Pa]":"Втрата [Па]","Main duct":"Магістральний повітровід","Max v in swept ducts m/s":"Макс. v у повітроводах розгортки, м/с","Max v m/s":"Макс. v, м/с","Minor-loss ΣK":"ΣK місцевих опорів","Model each tee run/branch arm separately with its own K.":"Моделюйте кожне пряме/відгалужене плече трійника окремо з власним K.","Model limits":"Межі моделі","Monte-Carlo":"Монте-Карло","Monte-Carlo cancelled.":"Монте-Карло скасовано.","Monte-Carlo failed:":"Монте-Карло не вдалося:","Multiplier":"Множник","Multiplies the local speed of every fan, and enters the fan curve squared through the affinity law dp ~ n². The model is stated for 40 to 120 %; the VAV load profile clamps its own fan tracking to the same range.":"Множить локальну швидкість кожного вентилятора й входить у криву вентилятора в квадраті через закон подібності dp ~ n². Модель визначена для діапазону 40–120%; профіль навантаження VAV обмежує власне відстеження вентилятора тим самим діапазоном.","N-1 blockage":"Блокування N-1","N-1 branch blockage":"Блокування гілки N-1","N-1 branch blockage — grille starvation":"Блокування гілки N-1 — недоотримання решітки","N-1 screen cancelled.":"Скринінг N-1 скасовано.","N-1 screen failed:":"Скринінг N-1 не вдався:","Name":"Назва","Network editor":"Редактор мережі","Network file":"Файл мережі","Network file is too large (5 MB limit).":"Файл мережі завеликий (ліміт 5 МБ).","Network file is too large for this editor (max 1000 nodes / 3000 components).":"Файл мережі завеликий для цього редактора (макс. 1000 вузлів / 3000 компонентів).","Network loaded. Press Solve network.":"Мережу завантажено. Натисніть «Розрахувати мережу».","Newton iterations":"Ітерації Ньютона","Newton line search failed.":"Лінійний пошук методу Ньютона не вдався.","No Monte-Carlo sample solved.":"Жодного семпла Монте-Карло не розраховано.","No airflow/return path from fan discharge to a fixed-pressure boundary.":"Немає шляху витрати повітря/повернення від нагнітання вентилятора до межі з фіксованим тиском.","No authority sweep generated.":"Розгортку авторитетності не згенеровано.","No curve generated.":"Криву не згенеровано.","No pressure profile generated.":"Профіль тиску не згенеровано.","No sizing combination solved.":"Жодної комбінації типорозмірів не розраховано.","No sweep has run for this network yet. Each button above solves the network many times; the fan / system curve is now the same kind of sweep.":"Для цієї мережі ще не виконано жодної розгортки. Кожна кнопка вище розраховує мережу багато разів; крива вентилятора/мережі тепер — розгортка того самого типу.","No sweep has run for this network yet. Each button in the input column solves the network many times; the fan / system curve is the same kind of sweep.":"Для цієї мережі ще не виконано жодної розгортки. Кожна кнопка в стовпці вхідних даних розраховує мережу багато разів; крива вентилятора/мережі — розгортка того самого типу.","Nodal demand":"Вузлове навантаження","Node":"Вузол","Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0":"Вузлова безперервність (вільні вузли): SUM_in q - SUM_out q - demand * load_factor = 0","Node results":"Результати вузла","Node Δp a−b Pa":"Δp вузла a−b, Па","Nodes and edges must be arrays.":"Вузли та ребра мають бути масивами.","None":"Немає","Nonlinear unknowns":"Нелінійні невідомі","Not solved":"Не розраховано","Not solved.":"Не розраховано.","Not solved. Press Solve network.":"Не розраховано. Натисніть «Розрахувати мережу».","Nothing generated yet.":"Ще нічого не згенеровано.","Nothing is solved, so no result, export or sweep is available until the network validates.":"Нічого не розраховано, тому жоден результат, експорт чи розгортка недоступні, поки мережа не пройде перевірку.","Nothing selected":"Нічого не вибрано","Nothing to cancel; this sweep cannot be interrupted without the shared runtime.":"Нема чого скасовувати; цю розгортку неможливо перервати без спільного середовища виконання.","Nothing to sample. Give the duct roughness a sigma above 0 (the network needs ducts with non-zero roughness), or the grilles a sigma, or the dampers an opening sd.":"Нема чого семплювати. Задайте шорсткості повітроводу σ більше 0 (мережі потрібні повітроводи з ненульовою шорсткістю), або σ для решіток, або ст.відх. відкриття для заслінок.","One duct solve is always on the main thread and is unchanged from the audited build. Repeated solves — the six sweeps — go to the shared compute runtime, which moves them into Workers only when there are enough cases to pay for a round trip. The badge states which backend last ran, why, and whether a Worker case was checked against the same case solved here.":"Один розрахунок повітроводу завжди виконується в основному потоці і незмінний відносно перевіреної збірки. Повторювані розрахунки — шість розгорток — передаються до спільного середовища обчислень, яке переносить їх у Workers лише коли випадків достатньо, щоб виправдати накладні витрати на передачу. Значок вказує, який бекенд виконувався останнім, чому, та чи звірявся випадок Worker з тим самим випадком, розрахованим тут.","Open duct-network JSON file":"Відкрити JSON-файл мережі повітроводів","Open network file":"Відкрити файл мережі","Opening":"Відкриття","Opening %":"Відкриття, %","Opening characteristic":"Характеристика відкриття","P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, визначено для 1e-6 <= eps/D <= 1e-2 та 5e3 <= Re <= 1e8.","Pa (gauge)":"Па (надлишковий)","Partial load 0 to 150 %, global fan speed 40 to 120 %":"Часткове навантаження 0–150%, глобальна швидкість вентилятора 40–120%","Partial-load demand factor":"Коефіцієнт навантаження при частковому навантаженні","Positive component airflow follows its arrow.":"Додатна витрата компонента слідує за його стрілкою.","Positive demand removes airflow from the network at that node, negative demand injects it. It is scaled by the partial-load factor. A network with no demand at all is driven only by its fans and its boundary pressures.":"Додатне навантаження вилучає витрату повітря з мережі в цьому вузлі, від'ємне навантаження нагнітає її. Воно масштабується коефіцієнтом часткового навантаження. Мережа без жодного навантаження приводиться в рух лише своїми вентиляторами та граничними тисками.","Potential [Pa]":"Потенціал [Па]","Pressure profile":"Профіль тиску","Pressure rise [Pa]":"Приріст тиску [Па]","Profile also drives the global fan-speed factor (clamped to 40–120 %)":"Профіль також керує глобальним коефіцієнтом швидкості вентилятора (обмежено до 40–120%)","Profile length":"Довжина профілю","Rank correlation within family":"Рангова кореляція всередині сімейства","Rated flow":"Номінальна витрата","Rated pressure must be below the shutoff pressure.":"Номінальний тиск має бути нижчим за тиск при нульовій витраті.","Received":"Отримано","Rectangular":"Прямокутний","Rectangular section:  A = W H,  Dh = 2 W H/(W + H);  circular:  A = pi D^2/4,  Dh = D":"Прямокутний переріз: A = W H, Dh = 2 W H/(W + H); круглий: A = pi D^2/4, Dh = D","Reset":"Скинути","Rise P5 Pa":"Приріст P5, Па","Room / ambient":"Приміщення / зовнішнє середовище","Roughness":"Шорсткість","Run duct sizing":"Виконати підбір типорозміру повітроводу","Run load profile":"Виконати профіль навантаження","Samples":"Семпли","Save network file":"Зберегти файл мережі","Save network file writes the drawing, the air state and the load factors as a tools.petrov.re/duct-network/v1 JSON document, and Open network file reads one back. This is the editor document, not the calculation record: the shared bar’s JSON export is the record and cannot be loaded back into the editor, and the shared bar’s Copy link carries the same document inside a permalink.":"«Зберегти файл мережі» записує креслення, стан повітря та коефіцієнти навантаження як JSON-документ tools.petrov.re/duct-network/v1, а «Відкрити файл мережі» зчитує його назад. Це документ редактора, а не запис розрахунку: JSON-експорт спільної панелі є записом і не може бути завантажений назад у редактор, а «Копіювати посилання» спільної панелі несе той самий документ усередині постійного посилання.","Scaled residual":"Масштабований залишок","Screening limits":"Межі скринінгу","Seasonal swing (8760 h only)":"Сезонні коливання (лише 8760 год)","Section":"Переріз","Seed":"Насіння","Select":"Вибрати","Select a damper first":"Спершу виберіть заслінку","Select a damper, then run the authority sweep.":"Виберіть заслінку, потім виконайте розгортку авторитетності.","Select a fan first":"Спершу виберіть вентилятор","Select a fan on the drawing first.":"Спершу виберіть вентилятор на кресленні.","Select drags nodes and picks an element to edit. Node adds a node where you click on empty canvas. The five component tools each want two clicks: the start node, then the end node. Positive component airflow follows the arrow, so the direction you draw in is the sign convention for that component.":"«Вибрати» перетягує вузли та обирає елемент для редагування. «Вузол» додає вузол там, де ви клацнете на порожньому полотні. Кожен із п'яти інструментів компонентів потребує двох клацань: спершу початковий вузол, потім кінцевий. Додатна витрата компонента слідує за стрілкою, тож напрям, у якому ви малюєте, задає знакову угоду для цього компонента.","Selection":"Виділення","Set target flow on at least one damper":"Задайте цільову витрату принаймні для однієї заслінки","Shared compute runtime: starting…":"Спільне середовище обчислень: запуск…","Show":"Показати","Shutoff total pressure":"Повний тиск при нульовій витраті","Sizes mm":"Типорозміри, мм","Solve network":"Розрахувати мережу","Solve the network first.":"Спершу розрахуйте мережу.","Solved simultaneously for all component airflows and free-node gauge total pressures by a damped Newton method with a numerical Jacobian":"Розраховано одночасно для всіх витрат компонентів і надлишкових повних тисків вільних вузлів демпфованим методом Ньютона з чисельним якобіаном","Solver failed:":"Розв'язувач не впорався:","Specific air power W/(m³/s)":"Питома аеродинамічна потужність, Вт/(м³/с)","Starved grilles":"Решітки з недоотриманням повітря","Total pressure rise at rated flow":"Приріст повного тиску при номінальній витраті","Steady state, incompressible, single phase; constant air properties":"Усталений режим, нестисливе, однофазне; сталі властивості повітря","Steady-state incompressible airflow networks":"Мережі усталеної нестисливої витрати повітря","Supply junction":"Вузол подачі","Swamee-Jain is published for 1e-6 <= eps/Dh <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain опубліковано для 1e-6 <= eps/Dh <= 1e-2 та 5e3 <= Re <= 1e8; у цьому діапазоні відрізняється від кореня рівняння Colebrook не більш як приблизно на 3%","Sweep cancelled.":"Розгортку скасовано.","Swept surface m²":"Площа поверхні розгортки, м²","System curve requires positive solved airflow through the selected fan.":"Крива мережі потребує додатної розрахованої витрати через вибраний вентилятор.","THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.":"МЕЖА ТОЧНОСТІ НЕДІЙСНА ПРИНАЙМНІ ДЛЯ ОДНОГО ПІДСУМКУ.","Tee / fitting":"Трійник / фасонна частина","Tee / fitting arm:":"Плече трійника/фасонної частини:","Tee / fitting arm:  h_loss = K v^2/(2 g) on that arm only, no friction term":"Плече трійника/фасонної частини: h_loss = K v^2/(2 g) лише на цьому плечі, без складової тертя","Tee and fitting arms":"Плечі трійників та фасонних частин","Tee branch A":"Відгалуження трійника A","Tee run B":"Пряма ділянка трійника B","Tee/fitting":"Трійник/фасонна частина","The 24 hourly multipliers scale nodal demand hour by hour, optionally driving the global fan-speed factor with them, and the fan air power dp·Q is integrated over the period. This is air power: fan total efficiency, motor and drive losses and SFP are not part of this model, so no kW/(m³/s) figure is claimed.":"24 погодинні множники масштабують вузлове навантаження година за годиною, за бажанням керуючи ними ж глобальним коефіцієнтом швидкості вентилятора, а аеродинамічна потужність вентилятора dp·Q інтегрується за період. Це аеродинамічна потужність: повний ККД вентилятора, втрати двигуна й приводу та SFP не є частиною цієї моделі, тому жодного значення в кВт/(м³/с) не заявляється.","The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.":"Розгортка Монте-Карло потребує diagram-compute.classic.js — її латинський гіперкуб, її перетворення рангової кореляції та її об'єднувані квантильні підсумки належать середовищу виконання, і ця збірка не підмінить інший семплер, представивши це тим самим експериментом.","The N-1 screen blocks ducts, tee arms and dampers one at a time; this network has none of them.":"Скринінг N-1 блокує повітроводи, плечі трійників і заслінки по одному; ця мережа їх не має.","The fan/system curve holds the airflow through the selected fan at each of 33 values and solves the whole network for each one, so the system curve is the network’s own resistance, not a fitted parabola. The total-pressure profile follows one representative path from the fan discharge to a fixed-pressure boundary. Select a fan on the drawing first.":"Крива вентилятора/мережі утримує витрату через вибраний вентилятор на кожному з 33 значень і розраховує всю мережу для кожного з них, тож крива мережі — це власний опір мережі, а не підігнана парабола. Профіль повного тиску слідує одним репрезентативним шляхом від нагнітання вентилятора до межі з фіксованим тиском. Спершу виберіть вентилятор на кресленні.","The hardest-working ducts are re-sectioned to circular ducts from the EN 1506 / ISO 6580 nominal catalogue and every combination is solved. The ranking is specific air power — air power per m³/s actually delivered — because raw dp·Q rewards choking the duct: the fan sits on a curve, so a smaller duct moves the operating point back and the product falls while the building gets less air.":"Найбільш навантажені повітроводи перетинаються заново на круглі повітроводи з номінального каталогу EN 1506 / ISO 6580, і розраховується кожна комбінація. Ранжування — за питомою аеродинамічною потужністю — потужністю на м³/с фактично доставленого повітря — оскільки абсолютний dp·Q заохочує «задушення» повітроводу: вентилятор працює на кривій, тож менший повітровід зсуває робочу точку назад, і добуток падає, тоді як будівля отримує менше повітря.","The hourly VAV profile needs exactly 24 finite, non-negative multipliers.":"Погодинний профіль VAV потребує рівно 24 скінченних невід'ємних множники.","The intact-network baseline case did not solve, so nothing can be compared against it.":"Базовий випадок непошкодженої мережі не розрахувався, тому порівнювати з ним нічого.","The load profile reports fan energy; this network has no fan.":"Профіль навантаження звітує про енергію вентилятора; ця мережа не має вентилятора.","The network document":"Документ мережі","The profile also drives the global fan-speed factor, clamped to the tool’s own 40–120 % range.":"Профіль також керує глобальним коефіцієнтом швидкості вентилятора, обмеженим власним діапазоном інструмента 40–120%.","The selected damper is swept from 10 % to 100 % open in 1 % steps, each step a full network solve, and its installed characteristic is compared with its own inherent law. The reported authority is the ratio dp(100 %)/dp(10 %) — an upper bound on the usual open/closed authority, because a fully shut damper makes the quadratic branch equation singular in this formulation.":"Вибрана заслінка розгортається від 10% до 100% відкриття з кроком 1%, кожен крок — повний розрахунок мережі, а її встановлена характеристика порівнюється з власним законом. Наведена авторитетність — це співвідношення dp(100%)/dp(10%) — верхня межа звичайної авторитетності відкрито/закрито, оскільки повністю закрита заслінка робить квадратичне рівняння гілки виродженим у цьому формулюванні.","The selection inspector":"Інспектор виділення","The shared interface layer (diagram-ui.js) did not load. Every input, the model, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"Спільний рівень інтерфейсу (diagram-ui.js) не завантажився. Кожне поле вводу, модель, креслення, розгортки та кожен експорт усе ще працюють; сторінка переходить у режим однієї звичайної колонки.","The velocity limit is the value the sweeps flag against; the starvation threshold is how far a grille’s airflow may fall below its intact-network value in the N-1 screen before that contingency counts as starving a grille.":"Ліміт швидкості — це значення, відносно якого розгортки позначають попередження; поріг недоотримання — це наскільки витрата решітки може впасти нижче свого значення в непошкодженій мережі під час скринінгу N-1, перш ніж цей аварійний випадок зараховується як недоотримання решітки.","There is no airflow through this damper at 100 % opening, so an installed characteristic has no meaning.":"Через цю заслінку при відкритті 100% немає витрати повітря, тому встановлена характеристика не має сенсу.","This network has no ducts to size.":"Ця мережа не має повітроводів для підбору типорозміру.","This sweep needs diagram-compute.classic.js: its \"":"Ця розгортка потребує diagram-compute.classic.js: її \"","Topological fallback discharge path":"Резервний шлях нагнітання за топологією","Total + (ρ−ρo)gz Pa":"Повний + (ρ−ρo)gz, Па","Total loss signed Pa":"Знакова сумарна втрата, Па","Total p Pa(g)":"Повний p, Па(н)","Total-pressure profile":"Профіль повного тиску","Two-branch supply system":"Система подачі з двома гілками","Type":"Тип","Unsupported duct-network schema version":"Непідтримувана версія схеми мережі повітроводів","Use 0 Pa for room/outdoor ambient. Demand is scaled by the global load factor; negative demand injects air.":"Використовуйте 0 Па для приміщення/зовнішнього середовища. Навантаження масштабується глобальним коефіцієнтом навантаження; від'ємне навантаження нагнітає повітря.","VAV load profile":"Профіль навантаження VAV","VAV load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Профіль навантаження VAV: кожен вузол цієї мережі має нульове навантаження, а множник профілю масштабує лише вузлові навантаження, тож кожна година відповідає тій самій робочій точці, а показник енергії — це одна точка, помножена на кількість годин.","Velocity and velocity pressure":"Швидкість і динамічний тиск","Velocity limit":"Ліміт швидкості","Velocity m/s":"Швидкість, м/с","Velocity p Pa":"Динамічний тиск p, Па","W (air)":"Вт (повітря)","W per m3/s delivered":"Вт на м3/с доставленого повітря","What this tool does":"Що робить цей інструмент","Whatever is selected on the drawing is edited here. Every edit throws the current solution away — the results dim and say so — because the answer belonged to the network as it was.":"Тут редагується те, що вибрано на кресленні. Кожне редагування відкидає поточний розв'язок — результати тьмяніють і повідомляють про це — оскільки відповідь стосувалася мережі такою, якою вона була.","Where the arithmetic runs":"Де виконуються обчислення","Width":"Ширина","Worst drop %":"Найгірше падіння, %","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"випадок Worker було звірено з тим самим випадком, розрахованим в основному потоці, перш ніж було запропоновано будь-яку розгортку","a design-point pressure-drop law scaled by opening; auto-balance changes opening, not the rated characteristic.":"закон перепаду тиску в розрахунковій точці, масштабований за відкриттям; автобалансування змінює відкриття, а не номінальну характеристику.","a user-supplied local-loss coefficient K applied to that arm; represent a multi-port junction by a node and one fitting edge per arm that needs an explicit K.":"заданий користувачем коефіцієнт місцевого опору K, застосований до цього плеча; подавайте багатопортове з'єднання як вузол і одну фасонну гілку на кожне плече, для якого потрібен явний K.","and 5·10":"та 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"арифметика, і саме це правило керує на платформі, чия libm округлює інакше.","at opening limit:":"на межі відкриття:","cancelled by the user":"скасовано користувачем","cancelling…":"скасування…","catalogue sizes tried)":"перевірено типорозмірів каталогу)","central-difference Jacobian, the damped line search and the linear solve are all the":"якобіан центральних різниць, демпфований лінійний пошук і лінійний розв'язок — усі є","circular or rectangular Darcy–Weisbach; 64/Re laminar, Swamee–Jain turbulent friction and ΣK local losses. Swamee–Jain is an":"Дарсі–Вейсбах для круглого чи прямокутного перерізу; 64/Re для ламінарного тертя, турбулентне тертя Swamee–Jain і місцеві опори ΣK. Swamee–Jain — це","cubic metres per hour":"кубічних метрів на годину","damper design point":"розрахункова точка заслінки","descending quadratic curve of fan total-pressure rise from shutoff pressure and one rated point, scaled by fan affinity laws.":"спадна квадратична крива приросту повного тиску вентилятора від тиску при нульовій витраті й однієї номінальної точки, масштабована законами подібності вентилятора.","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and its quantile tallies live in the runtime":"diagram-compute.classic.js не завантажився; розгортки виконуються в основному потоці, а розгортка Монте-Карло недоступна, оскільки її латинський гіперкуб і квантильні підсумки живуть у середовищі виконання","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"diagram-compute.classic.js відсутній, тому розгортка виконувалася як один блокувальний цикл в основному потоці, точно як у v1","dp = dp_design (Q/Q_design)^n, with the exponent n between 1 and 3 — 2 is the usual quadratic terminal. A grille here is a duct resistance only: no throw, no noise, no induction.":"dp = dp_design (Q/Q_design)^n, де показник степеня n у межах 1–3 — 2 є звичайним квадратичним випадком. Решітка тут — лише опір повітроводу: без дальнобійності, без шуму, без ежекції.","duct network: the interface layer failed to start":"мережа повітроводів: рівень інтерфейсу не запустився","equal %":"рівнопроцентна %","equal percentage":"рівнопроцентна","every case was evaluated in index order on one thread, each from a cold start":"кожен випадок обчислювався в порядку індексів в одному потоці, кожен «з нуля»","explicit approximation":"явна апроксимація","fan rated point":"номінальна точка вентилятора","gate then bounds the result at roughly 1e-7 relative.":"поріг тоді обмежує результат приблизно 1e-7 відносно.","grille design point":"розрахункова точка решітки","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"зупиняється при масштабованому залишку 2e-9, що становить приблизно 1e-7 відносно) а не через","kW (air)":"кВт (повітря)","kWh (air power dp*Q; no fan, motor or drive efficiency)":"кВт·год (аеродинамічна потужність dp*Q; без ККД вентилятора, двигуна чи приводу)","laminar friction":"ламінарне тертя","main thread":"основний потік","m³/h, all fans":"м³/год, усі вентилятори","no Worker pool could be created (":"не вдалося створити пул Worker (","no result":"немає результату","no runtime; one blocking main-thread loop":"немає середовища виконання; один блокувальний цикл в основному потоці","no sweep has run yet; the interactive solve is always on the main thread":"розгортку ще не виконано; інтерактивний розрахунок завжди в основному потоці","no sweep run":"розгортку не виконано","none (diagram-compute.classic.js absent)":"немає (diagram-compute.classic.js відсутній)","none: every recorded output reproduces bit for bit on this platform. What could":"немає: кожен записаний результат відтворюється біт у біт на цій платформі. Що могло б","operating point":"робоча точка","p total [Pa]":"p повний [Па]","path taken here is the path the page took.":"шлях, пройдений тут, — це шлях, який пройшла сторінка.","preliminary assessment":"попередня оцінка","round duct finite loss":"скінченна втрата круглого повітроводу","s generic verbs are replaced by this tool":" загальні дієслова замінені цим інструментом","s page-level unit system defaults to":" система одиниць на рівні сторінки за замовчуванням","s primary action for a compute:":" основна дія для обчислення:","steps either side":"кроків з кожного боку","still separate the two is a C library whose exp/log/pow round differently in the last":"усе ще розділяють ці два — це бібліотека C, чиї exp/log/pow округлюють інакше в останньому","tap target >= 44 px below md":"ціль дотику >= 44 px нижче md","technical exploration":"технічне дослідження","tee K loss":"втрата K трійника","the Worker case failed:":"випадок Worker не вдався:","the Worker path did not reproduce the main-thread solve (":"шлях Worker не відтворив розрахунок основного потоку (","the Worker path failed during this sweep (":"шлях Worker не вдався під час цієї розгортки (","the complete steady-state network solve of this page for the network currently on the canvas: the same continuity and energy equations, the same duct/tee/damper/grille/fan component laws, and the same damped Newton iteration on scaled residuals. Charts, auto-balancing and the pressure-path search are not part of the export.":"повний усталений розрахунок мережі цієї сторінки для мережі, що зараз на полотні: ті самі рівняння безперервності й енергії, ті самі закони компонентів повітроводу/трійника/заслінки/решітки/вентилятора, і та сама демпфована ітерація Ньютона за масштабованими залишками. Графіки, автобалансування та пошук шляху тиску не є частиною експорту.","the damper is not in this network snapshot":"заслінки немає в цьому знімку мережі","the network on the canvas is not solvable, so no comparison was possible":"мережа на полотні нерозв'язна, тому порівняння було неможливим","the shared runtime failed to start (":"спільне середовище виконання не запустилося (","the shared runtime is loaded; sweeps run on the main thread":"спільне середовище виконання завантажено; розгортки виконуються в основному потоці","this browser exposes no Worker; sweeps run on the main thread":"цей браузер не надає Worker; розгортки виконуються в основному потоці","to Colebrook–White, published for 10":"до Colebrook–White, опубліковано для 10","unknown sweep case kind:":"невідомий тип випадку розгортки:","unrecognised duct-network state payload":"нерозпізнані дані стану мережі повітроводів","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search, same 600-unknown ceiling. What this build adds is repeated solves (fan/system curve, damper authority, N-1 branch blockage, Monte-Carlo, VAV load profile, duct sizing) on the shared compute runtime diagram-compute.classic.js. Damper auto-balancing is sequential by construction and was deliberately left on the main thread.":"збірка v2: усталений розрахунок, записаний вище, — це незмінний розв'язувач інструмента v1 — те саме складання залишку, той самий якобіан центральних різниць, той самий щільний Гаусс-Жордан із частковим вибором головного елемента, той самий демпфований лінійний пошук Ньютона, та сама стеля в 600 невідомих. Ця збірка додає повторювані розрахунки (крива вентилятора/мережі y, acoustics, smoke transport, fan-efficiency map, stall/surge model, or transient control model is included.":"Аудитована збірка 2026-08-09. Стаціонарний, нестисливий і однофазний режим. Властивості середовища сталі. Решітки є лише опорами мережі. Характеристики вентиляторів побудовано за тиском при нульовій витраті та однією номінальною точкою; зворотна витрата й робота за точкою нульового напору є екстраполяціями та позначаються попередженням. Автоматичне балансування — ітераційна евристика відкриття заслінок, яка не гарантує досягнення пов’язаних або недосяжних цілей. Профіль повного тиску проходить одним представницьким шляхом потоку. Загальні вузли розгалуження не мають однозначного перерізу, тому статичний тиск у них не визначається; швидкість і динамічний тиск наводяться для кожного компонента. Значення K трійників і фасонних частин є вхідними даними; вони не виводяться з геометрії ASHRAE/Ідельчика чи співвідношення поділу потоків. Щільний розв’язувач у браузері відхиляє моделі з понад 600 нелінійними невідомими. Витоки з повітроводів, стисливість, акустика, перенесення диму, карта ККД вентилятора, модель помпажу/зриву та перехідне керування не враховуються."};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='uk')return'uk'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='uk'||localStorage.getItem('diagram_lang')==='uk')return'uk'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};

const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(UK,x))return UK[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(UK,t))return a+UK[t]+b;const pz=t&&window.__dnPatterns?window.__dnPatterns.translate('uk',t,UK):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(UK,k))return a+lw+': '+UK[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
