<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-10-16.ductnetwork-4","id":"ductnetwork","file":"ductnetwork.html","listed":true,"category":"control","order":28,"title":{"en":"Duct Network Solver","uk":"Розрахунок мереж повітроводів","de":"Luftkanal-Netzberechner","nl":"Luchtkanaal-netwerkberekenaar","fr":"Solveur de réseau aéraulique","es":"Solucionador de redes de conductos","pl":"Solver sieci kanałów"},"summary":{"en":"Draw arbitrary duct networks with circular or rectangular ducts, junction and tee-loss arms, grilles, dampers and fans.","uk":"Намалюйте довільну мережу круглих або прямокутних повітроводів із вузлами, плечами трійників, решітками, заслінками та вентиляторами.","de":"Beliebige Netze aus runden oder rechteckigen Luftkanälen, Verzweigungen/T-Stück-Verlustarmen, Auslässen, Klappen und Ventilatoren zeichnen.","nl":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren.","fr":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs.","es":"Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores.","pl":"Narysuj dowolne sieci kanałów z kanałami okrągłymi lub prostokątnymi, ramionami przyłączeniowymi i trójnikowymi, kratkami, przepustnicami i wentylatorami."},"description":{"en":"Draw arbitrary duct networks with circular or rectangular ducts, junction and tee-loss arms, grilles, dampers and fans. Solve steady airflow and pressure drops, plot the fan/system curve with operating point, balance dampers to target flows, and explore partial-load operation.","uk":"Намалюйте довільну мережу круглих або прямокутних повітроводів із вузлами, плечами трійників, решітками, заслінками та вентиляторами. Розрахунок усталених витрат і втрат тиску, робоча точка вентилятора, характеристика системи, балансування заслінок і часткове навантаження.","de":"Beliebige Netze aus runden oder rechteckigen Luftkanälen, Verzweigungen/T-Stück-Verlustarmen, Auslässen, Klappen und Ventilatoren zeichnen. Stationäre Volumenströme und Druckverluste, Ventilator-/Anlagenkennlinie mit Betriebspunkt, Klappenabgleich und Teillastbetrieb werden berechnet.","nl":"Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren. Bereken stationaire debieten en drukverliezen, ventilator- en systeemcurve met werkpunt, klepbalancering en deellastbedrijf.","fr":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs. Calculez les débits et pertes de charge stationnaires, la courbe ventilateur/réseau et son point de fonctionnement, l’équilibrage des registres et la charge partielle.","es":"Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores. Calcula caudales y pérdidas de presión estacionarios, curva ventilador/sistema con punto de trabajo, equilibrado de compuertas y funcionamiento a carga parcial.","pl":"Narysuj dowolne sieci kanałów z kanałami okrągłymi lub prostokątnymi, ramionami rozdzielającymi i trójnikowymi, kratkami wentylacyjnymi, przepustnicami i wentylatorami. Oblicz ustalony strumień powietrza i spadki ciśnienia, wykreśl krzywą wentylatora/systemu z punktem pracy, zrównoważ przepustnice do docelowych przepływów i zbadaj pracę przy częściowym obciążeniu."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Steady-state, incompressible, constant-density airflow network model. Node pressure is gauge total pressure; generic junction nodes have no unique cross-section, so static pressure is not recovered there. Circular and rectangular ducts use Darcy–Weisbach with laminar and Swamee–Jain friction. Tee/fitting arms use user-supplied local-loss coefficient K interpreted as total-pressure loss; K is not derived automatically from fitting geometry, flow split or ASHRAE/Idelchik data. Dampers and grilles use simplified design-point pressure-drop laws rather than manufacturer maps. The fan curve is the fan total-pressure rise, a descending quadratic fitted from shutoff pressure and one rated point and scaled by affinity laws; a manufacturer static-pressure curve must have the fan outlet velocity pressure added before entry. Fan efficiency, shaft power, system effect, stall/surge and automatic fan sequencing are not modelled; reverse flow and operation beyond zero-pressure runout are extrapolations. Boundary pressures are gauge pressures relative to the outdoor air at each node’s elevation, and the outdoor density equals the air density, so the hydrostatic terms cancel and elevation does not change the solution; temperature-dependent buoyancy and stack effect are excluded. Duct leakage, compressibility, acoustics, smoke transport and transient controls are not modelled. Partial load scales nodal demands and damper balance targets; during the system-curve sweep nodal demands are rescaled with swept fan flow. Automatic damper balancing is an iterative opening heuristic and cannot guarantee coupled or infeasible target flows. The total-pressure profile shows one representative flow-following discharge path, with a labelled topological fallback when necessary, not every branch. The dense browser Newton solver refuses models above 600 nonlinear unknowns. Swamee–Jain is an explicit approximation to Colebrook–White, published for 1e-6 ≤ ε/Dh ≤ 1e-2 and 5e3 ≤ Re ≤ 1e8; over that range it differs from the Colebrook root by up to about 3 % in the friction factor, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model; ducts running outside the published range are listed as a warning after each solve. Damper openings below 0.1 % are refused rather than clamped, because the damper loss law is not defined there. This build: the steady-state solver is the v1 solver unchanged; only repeated solves moved onto the shared compute runtime, so every limitation above applies to every sweep case. The added sweeps carry their own. The damper-authority figure is the ratio of the pressure drop across the damper at 100 % opening to the drop at 10 % opening — an upper bound on the usual open-versus-closed authority, because a fully shut damper makes this quadratic formulation singular and is not solved. The VAV load profile integrates fan air power dp*Q: fan total efficiency, motor, drive and specific fan power are not modelled, so it is neither shaft nor electrical energy, and the multiplier scales nodal demand and, optionally, the global fan-speed factor and nothing else. Duct sizing replaces each swept duct with a circular duct of the EN 1506 catalogue size under test, so a rectangular duct is re-sectioned by the sweep, and cost is represented only by the swept surface area pi*D*L — fittings, insulation, space and acoustics are not. The Monte-Carlo samples duct roughness, grille design pressure drop and damper opening only; duct leakage is not an element of this model and is not sampled, and its quantiles are DDSketch estimates with a stated relative-error bound rather than exact order statistics. None of the six sweeps has a benchmark of any kind. Sizing combinations are ranked by air power per unit of delivered airflow, with the delivered flow reported beside it, because ranking by raw air power rewards choking the duct: the fan sits on a curve, so a smaller duct moves the operating point back and lowers the product while the building gets less air.","uk":"Стаціонарна модель мережі повітроводів для нестисливого повітря зі сталою густиною. У вузлах розв’язується повний надлишковий тиск; у загального вузла-з’єднання немає єдиного перерізу, тому статичний тиск там окремо не відновлюється. Круглі й прямокутні повітроводи рахуються за Darcy–Weisbach із ламінарним тертям та кореляцією Swamee–Jain. Для плечей трійників і фасонних частин користувач задає коефіцієнт місцевих втрат K як втрату повного тиску; K не визначається автоматично з геометрії, поділу потоку чи даних ASHRAE/Idelchik. Заслінки й решітки описані спрощеними законами перепаду тиску за розрахунковою точкою, а не картами виробника. Характеристика вентилятора — приріст повного тиску, спадна квадратична крива за тиском при нульовій витраті та однією номінальною точкою з масштабуванням за законами подібності; до кривої статичного тиску виробника перед введенням слід додати динамічний тиск на виході вентилятора. ККД, потужність на валу, system effect, зрив/помпаж і автоматичне каскадування вентиляторів не моделюються; зворотний потік і робота за межами нульового тиску є екстраполяціями. Граничні тиски — надлишкові відносно зовнішнього повітря на висоті вузла, а густина зовнішнього повітря дорівнює густині повітря, тож гідростатичні доданки взаємно знищуються і висота не змінює розв’язку; температурна плавучість і тяга не моделюються. Не моделюються витоки повітроводів, стисливість, акустика, перенесення диму та перехідні процеси керування. Часткове навантаження масштабує вузлові витрати та цілі балансування заслінок; під час sweep характеристики системи вузлові витрати масштабуються разом із витратою вентилятора. Автобалансування — ітераційна евристика за відкриттям заслінок і не гарантує пов’язаних або недосяжних цілей. Профіль повного тиску показує один репрезентативний шлях за напрямком потоку з позначеним топологічним fallback, якщо потрібно, а не всі гілки. Щільний Newton-розв’язувач у браузері відмовляється від моделей із понад 600 нелінійними невідомими. Swamee–Jain — явна апроксимація Colebrook–White, опублікована для 1e-6 ≤ ε/Dh ≤ 1e-2 та 5e3 ≤ Re ≤ 1e8; у цьому діапазоні коефіцієнт тертя відрізняється від кореня Colebrook приблизно до 3 %, а поза ним — більше. Перехід 2000<Re<4000 є числовим містком, а не розв’язаною моделлю переходу; повітроводи поза опублікованим діапазоном перелічуються у попередженні після кожного розрахунку. Відкриття заслінки нижче 0,1 % відхиляється, а не обрізається, бо модель втрат там не визначена. Ця збірка: розв'язувач усталеного режиму той самий, що у v1; на спільний обчислювальний рушій перенесено лише повторювані розрахунки, тож усі обмеження вище стосуються кожного випадку свипу. Додані свипи мають власні обмеження. Показник авторитету заслінки — це відношення перепаду тиску на заслінці при 100 % відкритті до перепаду при 10 % — верхня межа звичайного авторитету «відкрито проти закрито», бо повністю закрита заслінка робить це квадратичне формулювання виродженим і не розраховується. VAV-профіль інтегрує повітряну потужність вентилятора dp*Q: повний ККД вентилятора, двигун, привід і питома потужність не моделюються, тож це не енергія на валу й не електрична енергія, а множник масштабує вузлові витрати і, за бажанням, глобальний коефіцієнт швидкості вентилятора — і більше нічого. Підбір розмірів замінює кожен обраний повітровід круглим із каталогу EN 1506, тож прямокутний переріз змінюється свипом, а вартість подано лише площею поверхні pi*D*L — без фасонних частин, ізоляції, місця та акустики. Монте-Карло вибирає лише шорсткість повітроводів, розрахунковий перепад ґраток і відкриття заслінок; витік із повітроводів не є елементом цієї моделі й не вибирається, а квантилі є оцінками DDSketch із заявленою відносною похибкою, а не точними порядковими статистиками. Жоден із шести свипів не має жодного бенчмарку. Комбінації розмірів ранжуються за повітряною потужністю на одиницю поданої витрати, а сама витрата подається поруч, бо ранжування за сирою повітряною потужністю заохочує душіння повітроводу: вентилятор працює на кривій, тож менший діаметр зсуває робочу точку назад і зменшує добуток, тоді як будівля отримує менше повітря.","de":"Stationäres, inkompressibles Luftkanalnetz mit konstanter Dichte. An Knoten wird der Gesamt-Überdruck gelöst; ein allgemeiner Verzweigungsknoten besitzt keinen eindeutigen Querschnitt, daher wird dort kein separater statischer Druck rekonstruiert. Runde und rechteckige Kanäle verwenden Darcy–Weisbach mit laminarer Reibung und Swamee–Jain. Für T-Stück- und Formstückarme wird ein vom Benutzer vorgegebener Einzelverlustbeiwert K als Gesamtdruckverlust verwendet; K wird nicht automatisch aus Geometrie, Volumenstromaufteilung oder ASHRAE/Idelchik-Daten abgeleitet. Klappen und Auslässe verwenden vereinfachte, aus einem Auslegungspunkt abgeleitete Druckverlustgesetze statt Herstellerkennfeldern. Die Ventilatorkennlinie ist die Totaldruckerhöhung, eine fallende quadratische Kurve aus Sperrdruck und einem Nennpunkt mit Ähnlichkeitsgesetzen; zu einer statischen Herstellerkennlinie ist vor der Eingabe der dynamische Druck am Ventilatoraustritt zu addieren. Wirkungsgrad, Wellenleistung, Systemeffekt, Stall/Surge und automatische Ventilatorstaffelung werden nicht modelliert; Rückströmung und Betrieb jenseits des Null-Druck-Auslaufs sind Extrapolationen. Randdrücke sind Überdrücke gegenüber der Außenluft auf Knotenhöhe, und die Außenluftdichte ist gleich der Luftdichte; die hydrostatischen Terme heben sich daher auf und die Höhe ändert die Lösung nicht; temperaturabhängiger Auftrieb und Kamineffekt fehlen. Kanalleckage, Kompressibilität, Akustik, Rauchtransport und transiente Regelung werden nicht modelliert. Teillast skaliert Knotenentnahmen und Klappen-Abgleichsziele; beim Anlagenkennlinien-Sweep werden Knotenentnahmen mit dem variierten Ventilatorvolumenstrom skaliert. Der automatische Klappenabgleich ist eine iterative Öffnungsheuristik und garantiert gekoppelte oder unerreichbare Sollwerte nicht. Das Gesamtdruckprofil zeigt einen repräsentativen strömungsgerichteten Ausblaspfad mit gekennzeichnetem topologischem Ersatzpfad, falls nötig, nicht alle Zweige. Der dichte Newton-Löser im Browser verweigert Modelle mit mehr als 600 nichtlinearen Unbekannten. Swamee–Jain ist eine explizite Näherung an Colebrook–White, veröffentlicht für 1e-6 ≤ ε/Dh ≤ 1e-2 und 5e3 ≤ Re ≤ 1e8; in diesem Bereich weicht der Reibungsbeiwert um bis zu etwa 3 % von der Colebrook-Wurzel ab, außerhalb stärker. Der Übergang 2000<Re<4000 ist eine numerische Brücke, kein aufgelöstes Transitionsmodell; Kanäle außerhalb des veröffentlichten Bereichs werden nach jeder Berechnung als Warnung aufgelistet. Klappenöffnungen unter 0,1 % werden abgelehnt statt begrenzt, da das Verlustgesetz dort nicht definiert ist. Dieser Build: Der stationäre Löser ist unverändert der von v1; nur wiederholte Rechnungen liegen auf der gemeinsamen Rechen-Laufzeit, alle obigen Einschränkungen gelten daher für jeden Sweep-Fall. Die ergänzten Sweeps bringen eigene mit. Die Klappenautorität ist hier das Verhältnis des Druckverlusts über der Klappe bei 100 % zu dem bei 10 % Öffnung — eine obere Schranke der üblichen Autorität offen gegen geschlossen, weil eine ganz geschlossene Klappe diese quadratische Formulierung singulär macht und nicht gerechnet wird. Das VAV-Lastprofil integriert die Luftleistung dp*Q des Ventilators: Ventilatorwirkungsgrad, Motor, Antrieb und spezifische Ventilatorleistung sind nicht modelliert, es ist also weder Wellen- noch elektrische Energie; der Multiplikator skaliert den Knotenbedarf und wahlweise den globalen Drehzahlfaktor, sonst nichts. Die Kanalbemessung ersetzt jeden erfassten Kanal durch einen runden Kanal der geprüften EN-1506-Größe, ein rechteckiger Kanal wird also umgeschnitten, und Kosten sind allein durch die Mantelfläche pi*D*L vertreten — Formteile, Dämmung, Platzbedarf und Akustik nicht. Das Monte-Carlo bemustert nur Kanalrauheit, Auslass-Auslegungsdruckverlust und Klappenstellung; Kanalleckage ist kein Element dieses Modells und wird nicht bemustert, und die Quantile sind DDSketch-Schätzungen mit angegebener relativer Fehlerschranke, keine exakten Ordnungsstatistiken. Keiner der sechs Sweeps hat irgendeinen Benchmark. Bemessungskombinationen werden nach Luftleistung je geförderter Volumenstromeinheit gereiht, mit dem geförderten Volumenstrom daneben, weil eine Reihung nach roher Luftleistung das Androsseln belohnt: Der Ventilator liegt auf einer Kennlinie, ein kleinerer Kanal verschiebt den Betriebspunkt zurück und senkt das Produkt, während das Gebäude weniger Luft bekommt.","nl":"Stationair, incompressibel luchtkanaalnetwerk met constante dichtheid. In knopen wordt de totale overdruk opgelost; een algemene aftakkingsknoop heeft geen unieke doorsnede, zodat daar geen afzonderlijke statische druk wordt gereconstrueerd. Ronde en rechthoekige kanalen gebruiken Darcy–Weisbach met laminaire wrijving en Swamee–Jain. Voor armen van T-stukken en hulpstukken gebruikt het model een door de gebruiker ingevoerde lokale-verliescoëfficiënt K als totaaldrukverlies; K wordt niet automatisch afgeleid uit geometrie, debietverdeling of ASHRAE/Idelchik-data. Kleppen en roosters gebruiken vereenvoudigde drukverlieswetten vanuit een ontwerppunt, niet fabrikantkaarten. De ventilatorcurve is de totale drukverhoging, een dalende kwadratische curve uit afsluitdruk en één nominaal punt, geschaald met affiniteitswetten; bij een statische-drukcurve van de fabrikant moet vóór invoer de dynamische druk aan de ventilatoruitlaat worden opgeteld. Rendement, asvermogen, systeemeffect, stall/surge en automatische ventilatorcascadering worden niet gemodelleerd; omgekeerde stroming en bedrijf voorbij de nuldruk-uitloop zijn extrapolaties. Randdrukken zijn manometrisch ten opzichte van de buitenlucht op knoophoogte en de buitenluchtdichtheid is gelijk aan de luchtdichtheid, zodat de hydrostatische termen elkaar opheffen en hoogte de oplossing niet verandert; temperatuurafhankelijke opdrijving en schoorsteeneffect ontbreken. Kanaallekkage, compressibiliteit, akoestiek, rooktransport en transiënte regeling worden niet gemodelleerd. Deellast schaalt knoopdebieten en doelen voor klepbalancering; tijdens de systeemcurve-sweep worden knoopdebieten meegeschaald met het gevarieerde ventilatordebiet. Automatische klepbalancering is een iteratieve openingsheuristiek en garandeert gekoppelde of onhaalbare doelen niet. Het totaaldrukprofiel toont één representatief stromingsvolgend uitblaaspad, met een gemarkeerd topologisch terugvalpad indien nodig, niet alle takken. De dichte Newton-oplosser in de browser weigert modellen met meer dan 600 niet-lineaire onbekenden. Swamee–Jain is een expliciete benadering van Colebrook–White, gepubliceerd voor 1e-6 ≤ ε/Dh ≤ 1e-2 en 5e3 ≤ Re ≤ 1e8; binnen dat bereik wijkt de wrijvingsfactor tot ongeveer 3 % af van de Colebrook-wortel, daarbuiten meer. De overgang 2000<Re<4000 is een numerieke brug, geen opgelost transitiemodel; kanalen buiten het gepubliceerde bereik worden na elke berekening als waarschuwing vermeld. Klepstanden onder 0,1 % worden geweigerd in plaats van afgekapt, omdat de verliesrelatie daar niet gedefinieerd is. Deze build: de stationaire oplosser is die van v1, ongewijzigd; alleen herhaalde berekeningen staan op de gedeelde rekenruntime, dus elke beperking hierboven geldt voor elk sweepgeval. De toegevoegde sweeps hebben eigen beperkingen. Het klepautoriteitsgetal is de verhouding van de drukval over de klep bij 100 % opening tot die bij 10 % — een bovengrens van de gebruikelijke autoriteit open tegen dicht, omdat een volledig gesloten klep deze kwadratische formulering singulier maakt en niet wordt opgelost. Het VAV-belastingprofiel integreert het luchtvermogen dp*Q van de ventilator: totaal rendement, motor, aandrijving en specifiek ventilatorvermogen zijn niet gemodelleerd, dus dit is geen as- of elektrische energie; de vermenigvuldiger schaalt de knooppuntvraag en optioneel de globale toerentalfactor, verder niets. Kanaalmaatvoering vervangt elk meegenomen kanaal door een rond kanaal van de beproefde EN 1506-maat, een rechthoekig kanaal wordt dus opnieuw doorsneden, en kosten worden alleen door het manteloppervlak pi*D*L vertegenwoordigd — hulpstukken, isolatie, ruimte en akoestiek niet. De Monte-Carlo bemonstert alleen kanaalruwheid, ontwerpdrukval van roosters en klepstand; kanaallekkage is geen element van dit model en wordt niet bemonsterd, en de kwantielen zijn DDSketch-schattingen met een vermelde relatieve foutgrens, geen exacte ordestatistieken. Geen van de zes sweeps heeft enige benchmark. Maatcombinaties worden gerangschikt op luchtvermogen per eenheid geleverd debiet, met het geleverde debiet ernaast, omdat rangschikken op ruw luchtvermogen het smoren beloont: de ventilator ligt op een curve, dus een kleiner kanaal verschuift het werkpunt terug en verlaagt het product terwijl het gebouw minder lucht krijgt.","fr":"Modèle stationnaire et incompressible de réseau aéraulique à masse volumique constante. La variable nodale est la pression totale relative ; une jonction générique n’a pas de section unique, donc la pression statique n’y est pas reconstruite séparément. Les conduits circulaires et rectangulaires utilisent Darcy–Weisbach avec régime laminaire et corrélation de Swamee–Jain. Les bras de tés et raccords utilisent un coefficient de perte singulière K fourni par l’utilisateur comme perte de pression totale ; K n’est pas déduit automatiquement de la géométrie, du partage de débit ou de données ASHRAE/Idelchik. Registres et grilles suivent des lois simplifiées de perte de charge issues d’un point de calcul, et non des cartes constructeur. La courbe du ventilateur est l’élévation de pression totale, une parabole décroissante ajustée sur la pression à débit nul et un point nominal, puis mise à l’échelle par les lois d’affinité ; une courbe constructeur en pression statique doit être augmentée de la pression dynamique de sortie du ventilateur avant saisie. Rendement, puissance à l’arbre, effet système, décrochage/pompage et séquencement automatique des ventilateurs ne sont pas modélisés ; débit inverse et fonctionnement au-delà du débit à pression nulle sont extrapolés. Les pressions aux limites sont relatives à l’air extérieur à l’altitude de chaque nœud et la masse volumique extérieure est égale à celle de l’air : les termes hydrostatiques s’annulent et l’altitude ne modifie pas la solution ; poussée thermique et effet de cheminée sont exclus. Fuites de réseau, compressibilité, acoustique, transport de fumées et régulation transitoire ne sont pas modélisés. La charge partielle met à l’échelle les débits nodaux et les cibles d’équilibrage ; lors du balayage de la courbe système, les débits nodaux sont redimensionnés avec le débit ventilateur balayé. L’équilibrage automatique des registres est une heuristique itérative sur l’ouverture et ne garantit pas des cibles couplées ou irréalisables. Le profil de pression totale montre un trajet de soufflage représentatif suivant l’écoulement, avec un trajet topologique de repli explicitement indiqué si nécessaire, et non toutes les branches. Le solveur Newton dense du navigateur refuse les modèles dépassant 600 inconnues non linéaires. Swamee–Jain est une approximation explicite de Colebrook–White, publiée pour 1e-6 ≤ ε/Dh ≤ 1e-2 et 5e3 ≤ Re ≤ 1e8 ; sur ce domaine le coefficient de frottement s’écarte de la racine de Colebrook jusqu’à environ 3 %, et davantage en dehors. Le raccord 2000<Re<4000 est un pont numérique, pas un modèle de transition résolu ; les conduits hors du domaine publié sont listés en avertissement après chaque calcul. Les ouvertures de registre inférieures à 0,1 % sont refusées plutôt que bornées, car la loi de perte n’y est pas définie. Cette version : le solveur permanent est celui de la v1, inchangé ; seuls les calculs répétés passent par le moteur de calcul partagé, de sorte que toutes les limites ci-dessus valent pour chaque cas de balayage. Les balayages ajoutés ont les leurs. L'autorité de registre est ici le rapport de la perte de charge au registre à 100 % d'ouverture à celle à 10 % — une borne supérieure de l'autorité usuelle ouvert contre fermé, car un registre entièrement fermé rend cette formulation quadratique singulière et n'est pas résolu. Le profil de charge VAV intègre la puissance aéraulique dp*Q du ventilateur : rendement total, moteur, entraînement et puissance spécifique ne sont pas modélisés, ce n'est donc ni de l'énergie à l'arbre ni de l'énergie électrique ; le multiplicateur met à l'échelle la demande nodale et, en option, le facteur global de vitesse du ventilateur, et rien d'autre. Le dimensionnement remplace chaque conduit balayé par un conduit circulaire de la taille EN 1506 testée : un conduit rectangulaire est donc re-sectionné, et le coût n'est représenté que par la surface pi*D*L — ni accessoires, ni isolation, ni encombrement, ni acoustique. Le Monte-Carlo n'échantillonne que la rugosité des conduits, la perte de charge de calcul des grilles et l'ouverture des registres ; les fuites de conduits ne sont pas un élément de ce modèle et ne sont pas échantillonnées, et les quantiles sont des estimations DDSketch avec une borne d'erreur relative annoncée, non des statistiques d'ordre exactes. Aucun des six balayages n'a de banc d'essai. Les combinaisons de dimensionnement sont classées par puissance aéraulique par unité de débit fourni, le débit fourni étant affiché à côté, car un classement par puissance brute récompense l'étranglement : le ventilateur est sur une courbe, donc un conduit plus petit ramène le point de fonctionnement en arrière et abaisse le produit alors que le bâtiment reçoit moins d'air.","es":"Modelo estacionario e incompresible de red de conductos con densidad constante. La variable nodal es la presión total manométrica; una unión genérica no tiene una sección única, por lo que allí no se reconstruye por separado la presión estática. Los conductos circulares y rectangulares usan Darcy–Weisbach con fricción laminar y Swamee–Jain. Los brazos de tes y accesorios usan un coeficiente local K introducido por el usuario como pérdida de presión total; K no se deriva automáticamente de la geometría, el reparto de caudal ni datos ASHRAE/Idelchik. Compuertas y rejillas usan leyes simplificadas de pérdida de presión basadas en un punto de diseño, no mapas de fabricante. La curva del ventilador es el aumento de presión total, una parábola descendente ajustada con la presión a caudal nulo y un punto nominal, escalada con leyes de afinidad; a una curva del fabricante en presión estática hay que sumarle la presión dinámica de salida del ventilador antes de introducirla. No se modelan rendimiento, potencia de eje, efecto de sistema, pérdida/entrada en bombeo ni secuenciación automática de ventiladores; el flujo inverso y el funcionamiento más allá del caudal a presión cero son extrapolaciones. Las presiones de contorno son manométricas respecto al aire exterior a la cota de cada nodo y la densidad exterior es igual a la del aire, por lo que los términos hidrostáticos se anulan y la cota no modifica la solución; no se incluyen flotabilidad térmica ni efecto chimenea. No se modelan fugas, compresibilidad, acústica, transporte de humo ni controles transitorios. La carga parcial escala las demandas nodales y los objetivos de equilibrado; durante el barrido de la curva del sistema las demandas nodales se escalan con el caudal barrido del ventilador. El equilibrado automático de compuertas es una heurística iterativa sobre la apertura y no garantiza objetivos acoplados o inviables. El perfil de presión total muestra un recorrido de impulsión representativo que sigue el flujo, con una ruta topológica alternativa claramente indicada cuando es necesaria, no todas las ramas. El solucionador Newton denso del navegador rechaza modelos con más de 600 incógnitas no lineales. Swamee–Jain es una aproximación explícita a Colebrook–White, publicada para 1e-6 ≤ ε/Dh ≤ 1e-2 y 5e3 ≤ Re ≤ 1e8; en ese rango el factor de fricción se desvía de la raíz de Colebrook hasta un 3 % aproximadamente, y más fuera de él. El puente 2000<Re<4000 es numérico, no un modelo de transición resuelto; los conductos fuera del rango publicado se listan como advertencia tras cada cálculo. Las aperturas de compuerta por debajo del 0,1 % se rechazan en lugar de recortarse, porque la ley de pérdida no está definida allí. Esta compilación: el solucionador estacionario es el de la v1, sin cambios; solo los cálculos repetidos pasan al motor de cálculo compartido, así que todas las limitaciones anteriores rigen para cada caso de barrido. Los barridos añadidos tienen las suyas. La cifra de autoridad de compuerta es el cociente entre la pérdida de carga en la compuerta al 100 % de apertura y la del 10 % — una cota superior de la autoridad habitual abierto frente a cerrado, porque una compuerta totalmente cerrada hace singular esta formulación cuadrática y no se resuelve. El perfil de carga VAV integra la potencia aeráulica dp*Q del ventilador: el rendimiento total, el motor, la transmisión y la potencia específica no se modelan, por lo que no es energía en el eje ni eléctrica; el multiplicador escala la demanda nodal y, opcionalmente, el factor global de velocidad del ventilador, y nada más. El dimensionado sustituye cada conducto barrido por uno circular de la medida EN 1506 ensayada, de modo que un conducto rectangular es reseccionado, y el coste se representa solo por la superficie pi*D*L — no accesorios, aislamiento, espacio ni acústica. El Monte-Carlo muestrea solo la rugosidad de los conductos, la pérdida de carga de diseño de las rejillas y la apertura de las compuertas; la fuga de conductos no es un elemento de este modelo y no se muestrea, y los cuantiles son estimaciones DDSketch con una cota de error relativo declarada, no estadísticos de orden exactos. Ninguno de los seis barridos tiene banco de pruebas alguno. Las combinaciones de dimensionado se ordenan por potencia aeráulica por unidad de caudal entregado, con el caudal entregado al lado, porque ordenar por potencia bruta premia el estrangulamiento: el ventilador está sobre una curva, así que un conducto menor retrasa el punto de funcionamiento y baja el producto mientras el edificio recibe menos aire.","pl":"Model sieciowy przepływu powietrza w stanie ustalonym, nieściśliwym i o stałej gęstości. Ciśnienie w węzłach jest ciśnieniem całkowitym nadciśnienia; typowe węzły połączeń nie mają unikatowego przekroju poprzecznego, więc ciśnienie statyczne nie jest tam odzyskiwane. Kanały okrągłe i prostokątne wykorzystują równanie Darcy'ego-Weisbacha z tarciem laminarnym i Swamee-Jaina. Ramiona trójników/kształtek wykorzystują dostarczany przez użytkownika lokalny współczynnik strat K interpretowany jako całkowita strata ciśnienia; współczynnik K nie jest automatycznie wyliczany z geometrii kształtki, podziału przepływu ani danych ASHRAE/Idelchik. Przepustnice i kratki wykorzystują uproszczone prawa spadku ciśnienia w punktach projektowych, a nie mapy producenta. Krzywa wentylatora to przyrost ciśnienia całkowitego, malejąca krzywa kwadratowa dopasowana do ciśnienia wyłączenia i jednego punktu znamionowego, skalowana za pomocą praw powinowactwa; do krzywej ciśnienia statycznego producenta należy przed wprowadzeniem dodać ciśnienie dynamiczne na wylocie wentylatora. Sprawność wentylatora, moc na wale, wpływ systemu, przeciągnięcie/uderzenie i automatyczna sekwencja wentylatora nie są modelowane; przepływ wsteczny i praca po wybiciu przy zerowym ciśnieniu są ekstrapolacjami. Ciśnienia graniczne są manometryczne względem powietrza zewnętrznego na wysokości węzła, a gęstość zewnętrzna jest równa gęstości powietrza, więc składniki hydrostatyczne się znoszą i wysokość nie zmienia rozwiązania; wyporność zależna od temperatury i efekt kominowy są wyłączone. Nieszczelność kanału, ściśliwość, akustyka, transport dymu i sterowanie przejściowe nie są modelowane. Częściowe obciążenie skaluje węzłowe zapotrzebowania i cele równowagi przepustnicy; podczas przemiatania krzywej układu węzłowe zapotrzebowania są przeskalowane za pomocą przemiatanego przepływu wentylatora. Automatyczne równoważenie przepustnicy jest iteracyjną heurystyką otwierania i nie może zagwarantować sprzężonych lub niewykonalnych przepływów docelowych. Profil całkowitego ciśnienia pokazuje jedną reprezentatywną ścieżkę odprowadzania podążającą za przepływem, z oznaczonym topologicznym zapasem w razie potrzeby, a nie każdą gałąź. Solver Newtona z gęstą przeglądarką odrzuca modele powyżej 600 nieliniowych niewiadomych. Swamee–Jain jest jawnym przybliżeniem Colebrooka–White'a, opublikowanym dla 1e-6 ≤ ε/Dh ≤ 1e-2 i 5e3 ≤ Re ≤ 1e8; W tym zakresie różni się od pierwiastka Colebrooka o około 3% w współczynniku tarcia i o więcej poza nim. Mieszanka 2000<Re<4000 jest mostem numerycznym, a nie rozwiązanym modelem przejściowym; kanały biegnące poza opublikowanym zakresem są wymienione jako ostrzeżenie po każdym rozwiązaniu. Otwory przepustnicy poniżej 0,1% są odrzucane, a nie zaciskane, ponieważ prawo strat przepustnicy nie jest tam zdefiniowane. Ta kompilacja: solver stanu ustalonego to solver v1 bez zmian; tylko powtarzane rozwiązania przeniesiono do współdzielonego środowiska obliczeniowego, więc każde powyższe ograniczenie ma zastosowanie do każdego przypadku przemiatania. Dodane przemiatania niosą ze sobą własne. Liczba autorytetu przepustnicy to stosunek spadku ciśnienia na przepustnicy przy 100% otwarciu do spadku przy 10% otwarciu — górna granica zwykłego autorytetu otwartego względem zamkniętego, ponieważ całkowicie zamknięta przepustnica sprawia, że ​​to sformułowanie kwadratowe jest osobliwe i nie jest rozwiązane. Profil obciążenia VAV integruje moc wentylatora dp*Q: całkowita sprawność wentylatora, silnik, napęd i moc właściwa wentylatora nie są modelowane, więc nie jest to ani wał, ani energia elektryczna, a mnożnik skaluje zapotrzebowanie węzłowe i, opcjonalnie, globalny współczynnik prędkości wentylatora i nic więcej. Wymiarowanie kanału zastępuje każdy kanał omiatany kanałem okrągłym o rozmiarze katalogowym EN 1506 podlegającym testowi, więc kanał prostokątny jest ponownie przecinany przez przemiatanie, a koszt jest reprezentowany tylko przez powierzchnię omiataną pi*D*L — armatura, izolacja, przestrzeń i akustyka nie. Próbki Monte Carlo obejmują tylko chropowatość kanału, spadek ciśnienia w konstrukcji kratki i otwarcie przepustnicy; nieszczelność kanału nie jest elementem tego modelu i nie jest próbkowana, a jej kwantyle są szacunkami DDSketch z określoną granicą błędu względnego, a nie dokładnymi statystykami rzędu. Żaden z sześciu przemiatań nie ma żadnego punktu odniesienia. Kombinacje rozmiarów są klasyfikowane według mocy powietrza na jednostkę dostarczanego przepływu powietrza, przy czym obok podawany jest dostarczany przepływ, ponieważ klasyfikowanie według mocy powietrza surowego nagradza dławienie kanału: wentylator jest umieszczony na krzywej, więc mniejszy kanał przesuwa punkt pracy do tyłu i obniża produkt, podczas gdy do budynku dociera mniej powietrza."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","pl","nl","de","fr","es","uk"],"dependencies":["diagram-common.js","diagram-compute.classic.js"],"network_access":{"mode":"same-origin-data","note":"Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the duct network the user draws is transmitted anywhere: every solve and every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js."},"validation":{"basis":{"en":"41 cases with 1521 checks pass on this build: 80 stored network documents (55 solved, 21 refused at import, 4 refused at solve) and a stored friction-factor grid, run through the page's own file import. The reference is an independent python solver written by a second agent from a method specification without access to the page code, cross-checked by a second solver and by closed forms. Swamee-Jain, the transition blend, the damper and fan laws are checked for faithful implementation of the stated model, not against measurements. The harness is the author's own; no external party has reviewed it.","uk":"41 випадків із 1521 перевірками проходять на цій збірці: 80 збережені документи мереж (55 розв'язано, 21 відхилено під час імпорту, 4 відхилено під час розрахунку) і збережена сітка коефіцієнта тертя, подані через власний імпорт файлів сторінки. Еталон — незалежний розв'язувач на python, написаний іншим агентом за специфікацією методу без доступу до коду сторінки й перевірений другим розв'язувачем та замкненими формулами. Swamee-Jain, перехідне згладжування, закони заслінок і вентиляторів перевірено на точність реалізації заявленої моделі, а не за вимірюваннями. Набір тестів авторський; зовнішнього рецензування не було.","de":"41 Fälle mit 1521 Prüfungen bestehen auf diesem Build: 80 gespeicherte Netzdokumente (55 gelöst, 21 beim Import und 4 bei der Lösung abgewiesen) und ein gespeichertes Reibungszahl-Raster, eingelesen über den eigenen Dateiimport der Seite. Die Referenz ist ein unabhängiger Python-Löser, den ein zweiter Agent aus einer Methodenspezifikation ohne Zugriff auf den Seitencode geschrieben hat, gegengeprüft mit einem zweiten Löser und geschlossenen Formen. Swamee-Jain, der Übergangsbereich sowie Klappen- und Ventilatorgesetze werden auf getreue Umsetzung des angegebenen Modells geprüft, nicht gegen Messungen. Das Prüfgerüst stammt vom Autor; eine externe Prüfung fand nicht statt.","nl":"41 gevallen met 1521 controles slagen op deze build: 80 opgeslagen netwerkdocumenten (55 opgelost, 21 geweigerd bij import, 4 geweigerd bij oplossen) en een opgeslagen wrijvingsfactorraster, ingelezen via de eigen bestandsimport van de pagina. De referentie is een onafhankelijke python-oplosser die een tweede agent schreef uit een methodespecificatie zonder toegang tot de paginacode, gecontroleerd met een tweede oplosser en gesloten vormen. Swamee-Jain, de overgangszone en de klep- en ventilatorwetten worden gecontroleerd op getrouwe uitvoering van het opgegeven model, niet tegen metingen. Het testharnas is van de auteur; er was geen externe review.","fr":"41 cas et 1521 vérifications passent sur cette version : 80 documents de réseau enregistrés (55 résolus, 21 refusés à l'import, 4 refusés au calcul) et une grille de coefficients de frottement enregistrée, chargés par l'import de fichiers de la page. La référence est un solveur python indépendant, écrit par un second agent à partir d'une spécification de méthode sans accès au code de la page, recoupé par un second solveur et par des formes fermées. Swamee-Jain, le raccord de transition et les lois des registres et des ventilateurs sont vérifiés pour la fidélité au modèle déclaré, pas contre des mesures. Le banc d'essai est celui de l'auteur ; aucune revue externe n'a eu lieu.","es":"41 casos con 1521 comprobaciones pasan en esta versión: 80 documentos de red guardados (55 resueltos, 21 rechazados en la importación, 4 rechazados en el cálculo) y una malla de factores de fricción guardada, cargados con la importación de archivos de la propia página. La referencia es un solucionador python independiente, escrito por un segundo agente a partir de una especificación del método sin acceso al código de la página y contrastado con un segundo solucionador y con formas cerradas. Swamee-Jain, la zona de transición y las leyes de compuertas y ventiladores se comprueban por fidelidad al modelo declarado, no frente a mediciones. El banco de pruebas es del autor; no hubo revisión externa.","pl":"41 przypadków z 1521 sprawdzeniami przechodzi na tej wersji: 80 zapisane dokumenty sieci (55 rozwiązanych, 21 odrzuconych przy imporcie, 4 odrzucone przy obliczeniu) i zapisana siatka współczynnika tarcia, wczytane przez własny import plików strony. Wzorcem jest niezależny solwer python napisany przez drugiego agenta na podstawie specyfikacji metody, bez dostępu do kodu strony, sprawdzony drugim solwerem i wzorami zamkniętymi. Swamee-Jain, strefa przejściowa oraz prawa przepustnic i wentylatorów są sprawdzane pod kątem wiernej realizacji podanego modelu, nie względem pomiarów. Zestaw testów jest autorski; zewnętrznej recenzji nie było."},"independent_validation":false,"benchmarks":[{"id":"ductnetwork-stored-inputs-2026-10-16","reference":"Independent python reference written by a second agent from a method specification and the case files only, without access to the page code: a loop-flow Newton solver (Hardy Cross family, one virtual reservoir node linking the fixed-pressure nodes), cross-checked by a node-pressure Newton solver with exact per-component inversion (agreement 1.9e-11 relative or better) and by closed forms for the single-component and two-in-series cases (1.5e-13 or better). Every case input is stored in benchmarks/ductnetwork.reference.json.","citations":["P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.","H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): the loop-correction method dQ = -sum(h)/sum(|dh/dQ|) used by the second solver.","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: used only to quantify the Swamee-Jain scatter, never as the graded reference.","Hagen-Poiseuille laminar friction f = 64/Re.","ASHRAE Handbook - Fundamentals, Duct Design: rectangular hydraulic diameter Dh = 2WH/(W+H); local loss dp = K rho v^2/2.","Fan affinity law dp ~ n^2 applied to the two-point quadratic fan curve."],"cases":41,"passed":41,"tolerance":{"en":"Pass if |page - reference| <= max(1e-6 x |reference|, abs), where abs is ten times the first-order bound of the page's own convergence gate (scaled residual 2e-9) propagated through the scaled Jacobian of each ca /* =================== v2: ensemble sweeps on the shared compute runtime ===================
 * MIGRATION_MAP.md section 8 is explicit about this tool: it is hydraulicnetwork in air, and the
 * verdict is the same. ONE duct solve must not be parallelised — the Jacobian is a dense
 * nonsymmetric saddle-point block system, a Worker round trip costs hundreds of microseconds and a
 * 52-unknown solve costs about 9 ms, and WebGPU is f32 against a 2e-9 residual target and a 1e-6
 * python self-test. So the solver below is the v1 solver, character for character: same residual
 * assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same
 * damped line search, same 600-unknown ceiling.
 *
 * What moves onto diagram-compute.classic.js is the REPEATED solve. The fan/system curve was 33
 * blocking solves on the main thread; five more sweeps that were never written because they would
 * have frozen the page for seconds are added here. autoBalance is deliberately NOT among them:
 * MIGRATION_MAP calls it sequential by construction and this build leaves it sequential.
 */

  backend:'cpu',backendReason:'no sweep has run yet; the interactive solve is always on the main thread',

function dnNetSnapshot(){return{nodes:state.nodes.map(n=>({...n})),edges:state.edges.map(e=>({...e}))}}

/* ---- the two functions every sweep case goes through, on either thread ----
   Solve one case against a private network snapshot. The page's own state is swapped in and out
   around a single SYNCHRONOUS solveNetwork() call, so nothing can observe the swap: the ensemble
   only yields between cases, when state is already restored. state.sol is cleared for the duration,
   so every case is solved COLD — the answer cannot depend on which case ran before it, on this
   thread or in a Worker. In the Worker `state` is a bare object that exists for this purpose alone. */

  'const clamp='+clamp.toString()+';',
  'const finite=Number.isFinite;'
 ].concat(fns.map(f=>f.toString())).join('\n');
}

/* ---- start-up: runtime, ensemble, Worker pool, and a parity check that is run, not claimed ---- */
async function dnComputeInit(){
 const DC=(typeof window!=='undefined')?window.DiagramCompute:null;
 if(!DC||typeof DC.ComputeRuntime!=='function'){
  DN_COMPUTE.backendReason='diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and its quantile tallies live in the runtime';
  dnSetBackend('cpu');dnRenderComputeStatus();return;
 }
 try{
  DN_COMPUTE.version=DC.VERSION||null;
  /* benchmark:false — the backend choice here is not a cost question the calibrator can answer. A
     sweep is many independent whole solves; Workers win whenever there are enough of them to pay
     for a round trip, and that threshold is measured below instead. */
  const rt=await DC.ComputeRuntime.create({benchmark:false});
  const source=DC.createEnsembleWorkerSource(function(c,ctx){return dnEvaluateCase(c,ctx.params)},{preamble:dnWorkerPreamble()});
  const eng=rt.createEnsembleEngine({prefix:'ductnetwork-v2'});
  eng.registerEnsemble('sweep',{
   evaluate:(c,ctx)=>dnEvaluateCase(c,ctx.params),
   source,poolKey:'ductnetwork-v2:sweep',
   determinism:'repeatable',
   design:{method:'list',cases:[{}]},
   metadata:{tool:'ductnetwork-v2'}
  });
  DN_COMPUTE.runtime=rt;DN_COMPUTE.engine=eng;DN_COMPUTE.available=true;
  DN_COMPUTE.backendReason='the shared runtime is loaded; sweeps run on the main thread';
  if(rt.capabilities&&rt.capabilities.cpu&&rt.capabilities.cpu.workerAvailable){
   try{
    const pool=await rt.createWorkerPool('ductnetwork-v2:sweep',{source,type:'classic',name:'ductnetwork-v2:sweep'});
    await pool.init();
    DN_COMPUTE.workers=pool.workers.length;DN_COMPUTE.pool=true;
    const parity=await dnParityCheck();
    DN_COMPUTE.parity=parity;
    if(parity.ok){dnSetBackend('workers:'+DN_COMPUTE.workers);DN_COMPUTE.backendReason='a Worker case was checked against the same case solved on the main thread before any sweep was offered';}
    else{DN_COMPUTE.pool=false;dnSetBackend('cpu');DN_COMPUTE.backendReason='the Worker path did not reproduce the main-thread solve ('+parity.reason+'), so sweeps stay on the main thread';}
   }catch(e){
    DN_COMPUTE.pool=false;dnSetBackend('cpu');
    DN_COMPUTE.backendReason='no Worker pool could be created ('+String(e&&e.message||e)+'); sweeps run on the main thread';
   }
  }else{
   dnSetBackend('cpu');DN_COMPUTE.backendReason='this browser exposes no Worker; sweeps run on the main thread';
  }
 }catch(e){
  DN_COMPUTE.available=false;DN_COMPUTE.engine=null;dnSetBackend('cpu');
  DN_COMPUTE.backendReason='the shared runtime failed to start ('+String(e&&e.message||e)+'); sweeps run on the main thread and the Monte-Carlo sweep is unavailable';
 }
 dnRenderComputeStatus();
}
/* Solve the current network once in a Worker and once here, and compare. This is what lets the tool
   print "workers:N" as a fact rather than a hope. It also warms the pool, so the first real sweep
   does not pay for its creation. */
async function dnParityCheck(){
 try{
  if(validateNetwork())return{ok:false,reason:'the network on the canvas is not solvable, so no comparison was possible'};
  const params={kind:'mc',net:dnNetSnapshot(),fluid:getFluid()};
  const tm=dnNow();const mine=dnEvaluateCase({index:0,parameters:{}},params);const coldMs=dnNow()-tm;
  const tw=dnNow();
  const out=await DN_COMPUTE.engine.run('sweep',{design:{method:'list',cases:[{}]},params,keepResults:true,backend:'workers',randomDomain:'ductnetwork-v2:parity'});
  /* What one Worker round trip costs over and above the arithmetic. Both solves here are cold, so
     this over-estimates the overhead — the safe direction, because it only makes the size rule
     below more reluctant to leave the main thread. */
  DN_COMPUTE.rttMs=Math.max(0,(dnNow()-tw)-coldMs);
  const r=out.result.results[0];
  if(!r||!r.ok)return{ok:false,reason:'the Worker case failed: '+((r&&r.error)||'no result')};
  let worst=0,worstKey=null;
  for(const group of ['grilles','fans'])for(const id in mine[group]){
   const a=mine[group][id],b=r.value[group][id];
   if(a!==b){const s=Math.max(Math.abs(a),Math.abs(b),1e-300),rel=Math.abs(a-b)/s;if(rel>worst){worst=rel;worstKey=group+':'+id}}
  }
  return{ok:worst===0,worst,worstKey,reason:worst===0?'bit-identical':('worst relative difference '+worst.toExponential(2)+' at '+worstKey)};
 }catch(e){return{ok:false,reason:String(e&&e.message||e)}}
}

/* ---- running a sweep ---- */
function dnSetBackend(b){DN_COMPUTE.backend=b;try{window.__diagramComputeBackend=b}catch(e){}}
function dnSweepBusy(on,label){
 DN_COMPUTE.busy=!!on;DN_COMPUTE.label=label||'';
 const c=qs('#cancelSweepBtn');if(c)c.disabled=!on;
 for(const id of['curveBtn','authorityBtn','n1Btn','mcBtn','profileBtn','sizeBtn','hglBtn','balanceBtn','solveBtn']){const b=qs('#'+id);if(b)b.disabled=!!on}
 if(!on)dnSweepProgress('',0,'idle');
}
function dnSweepProgress(label,f,text){
 const bar=qs('#sweepProgressBar'),t=qs('#sweepProgressText');
 if(bar)bar.style.width=(Math.max(0,Math.min(1,f||0))*100).toFixed(1)+'%';
 if(t)t.textContent=text!==undefined?text:`${label} · ${(Math.max(0,Math.min(1,f||0))*100).toFixed(0)}%`;
}
function dnDesignCount(d){
 if(d.method==='list')return d.cases.length;
 if(d.method==='grid')return Object.keys(d.sweep).reduce((n,k)=>n*d.sweep[k].length,1);
 if(d.method==='leave-one-out')return d.items.length+(d.baseline===false?0:1);
 return Math.max(1,Number(d.count)||1);
}
/* What one case of THIS network costs on THIS machine, measured rather than guessed. Reset whenever
   the network changes (dnClearSweeps), so the estimate always belongs to what is on the canvas. */
function dnCaseCostMs(){
 if(Number.isFinite(DN_COMPUTE.caseMs))return DN_COMPUTE.caseMs;
 /* Normally this is already known: solveAndShow() times the interactive solve the user has just
    run, which is one sweep case. Only a page that has not solved since the network changed pays for
    the probe below, and it is ONE solve — at the tool's 600-unknown ceiling a solve is over a
    second, and spending two of them to decide where to put the work would cost more than it saves. */
 try{
  const params={kind:'mc',net:dnNetSnapshot(),fluid:getFluid()};
  const t0=dnNow();dnEvaluateCase({index:0,parameters:{}},params);DN_COMPUTE.caseMs=dnNow()-t0;
 }catch(e){DN_COMPUTE.caseMs=1}
 return DN_COMPUTE.caseMs;
}
/* MIGRATION_MAP section 7 is blunt about this: a Worker round trip costs hundreds of microseconds
   and a duct solve costs milliseconds, so a SMALL sweep sent to a Worker is one calculation in a
   costume and comes back slower. The rule is therefore measured, not assumed: run the sweep where
   it is cheaper, and say which it was. */
function dnPickBackend(cases){
 if(!DN_COMPUTE.pool)return{backend:'cpu',why:DN_COMPUTE.backendReason};
 /* One Worker is not a throughput argument, and this was measured rather than assumed: on a
    two-core machine the 8760-hour profile took 2.8 s through the chunked main-thread path and 4.6 s
    through a single Worker, for identical numbers. The main-thread path already yields between
    chunks (worst measured stall 59 ms), reports progress and honours cancel, so with fewer than two
    Workers there is nothing to buy and a round trip per chunk to pay. */
 if(DN_COMPUTE.workers<2)return{backend:'cpu',why:`this machine offers only ${DN_COMPUTE.workers} Worker, which cannot out-throughput the thread that would otherwise be idle, so the sweep ran on the chunked main-thread path — which yields between chunks and still reports progress and honours cancel`};
 const est=cases*dnCaseCostMs()/DN_COMPUTE.workers,floor=Math.max(200,6*(DN_COMPUTE.rttMs||10));
 if(est<floor)return{backend:'cpu',why:`${cases} cases at a measured ${dnCaseCostMs().toFixed(2)} ms each is about ${est.toFixed(0)} ms of arithmetic across ${DN_COMPUTE.workers} workers, below the ${floor.toFixed(0)} ms at which a Worker round trip pays for itself on this machine, so it ran on the main thread`};
 return{backend:'workers',why:`${cases} cases at a measured ${dnCaseCostMs().toFixed(2)} ms each is about ${(est/1000).toFixed(1)} s of arithmetic across ${DN_COMPUTE.workers} workers, so it went to the Worker pool with progress and cancel`};
}
async function dnRunSweep(kind,design,params,label,opts){
 opts=opts||{};
 if(DN_COMPUTE.busy)throw Error('A sweep is already running.');
 dnSweepBusy(true,label);dnSweepProgress(label,0);
 const t0=dnNow();
 try{
  if(!DN_COMPUTE.engine)return dnRunInline(kind,design,params,t0);
  const pick=dnPickBackend(dnDesignCount(design));
  const ac=new AbortController();DN_COMPUTE.abort=ac;
  /* randomDomain is pinned per sweep kind. CHANGELOG 0.32.1 note 8: the default domain is derived
     from the registered ensemble's NAME, so renaming it would silently move every stream. */
  const payload={design,params,seed:opts.seed??0,randomDomain:'ductnetwork-v2:'+kind,
   keepResults:true,signal:ac.signal,onProgress:f=>dnSweepProgress(label,f)};
  /* On the main thread the ensemble yields between chunks; size the chunk so the page never stalls
     for much more than a few frames' worth of solves. The lower bound matters as much as the upper
     one and was found by measurement, not taste: the boot solve is the coldest solve the page ever
     does (7.9 ms here against a warm 0.24 ms), so a chunk sized from it alone came out at 6 cases
     and the 8760-hour profile spent 7.4 s, of which 5.3 s was 1100 trips through the event loop —
     against 2.7 s at 64. Capping the number of chunks bounds that overhead whatever the estimate
     does, and the estimate corrects itself from the run below. */
  const cpuChunk=Math.max(1,Math.min(512,Math.max(Math.round(50/Math.max(.05,dnCaseCostMs())),Math.ceil(dnDesignCount(design)/400))));
  let out,why=pick.why;
  try{out=await DN_COMPUTE.engine.run('sweep',pick.backend==='workers'?{...payload,backend:'workers'}:{...payload,backend:'cpu',chunkSize:cpuChunk})}
  catch(e){
   if(dnIsAbort(e)||pick.backend!=='workers')throw e;
   DN_COMPUTE.pool=false;
   why='the Worker path failed during this sweep ('+String(e&&e.message||e)+'), so it fell back to the main thread';
   DN_COMPUTE.backendReason=why;dnSetBackend('cpu');dnRenderComputeStatus();
   out=await DN_COMPUTE.engine.run('sweep',{...payload,backend:'cpu',chunkSize:cpuChunk});
  }
  DN_COMPUTE.backendReason=why;
  const r=out.result;
  const b=out.compute.backend==='workers'?('workers:'+(r.workers||DN_COMPUTE.workers)):String(out.compute.backend);
  /* A finished main-thread sweep is a far better measurement of what one case costs than anything
     taken before it, and it is free. The next sweep sizes its chunks from this. */
  if(out.compute.backend!=='workers'&&r.completed>0&&r.elapsedMs>0)DN_COMPUTE.caseMs=r.elapsedMs/r.completed;
  dnSetBackend(b);dnRenderComputeStatus();
  return{results:r.results,cases:r.cases,completed:r.completed,failed:r.failed,failures:r.failures||[],
   backend:b,backendWhy:why,elapsedMs:r.elapsedMs,determinism:r.determinism,determinismBasis:r.determinismBasis,
   designSignature:r.designSignature||null,engine:'diagram-compute '+(DN_COMPUTE.version||'?')};
 }finally{DN_COMPUTE.abort=null;dnSweepBusy(false)}
}
/* No runtime: the designs this tool can enumerate itself still run, in one blocking loop, exactly as
   v1's fan curve did. The Latin hypercube and the quantile sketches are NOT reimplemented here — a
   different sampler is a different experiment, and presenting it as the same one is the thing
   AGENTS.md section 2 forbids. */
function dnEnumerateDesign(d){
 if(d.method==='list')return d.cases.map(c=>({...c}));
 if(d.method==='grid'){let out=[{}];for(const nm of Object.keys(d.sweep)){const nx=[];for(const base of out)for(const v of d.sweep[nm])nx.push({...base,[nm]:v});out=nx}return out}
 if(d.method==='leave-one-out'){const out=[];
  if(d.baseline!==false)out.push({[d.parameter]:d.baselineValue===undefined?null:d.baselineValue,caseKind:'baseline'});
  for(const it of d.items)out.push({[d.parameter]:it,caseKind:'variant'});return out}
 throw Error('This sweep needs diagram-compute.classic.js: its "'+d.method+'" design (and, for the Monte-Carlo, its quantile tallies) live in the shared runtime, and this build will not substitute a different sampler and call it the same experiment.');
}
function dnRunInline(kind,design,params,t0){
 const cases=dnEnumerateDesign(design),results=[];let failed=0;
 for(let i=0;i<cases.length;i++){
  try{results.push({index:i,ok:true,parameters:cases[i],value:dnEvaluateCase({index:i,parameters:cases[i]},params)})}
  catch(e){failed++;results.push({index:i,ok:false,parameters:cases[i],error:String(e&&e.message||e)})}
 }
 dnSetBackend('cpu');dnRenderComputeStatus();
 return{results,cases:cases.length,completed:cases.length-failed,failed,failures:[],
  backend:'cpu',elapsedMs:dnNow()-t0,determinism:'repeatable',
  determinismBasis:'every case was evaluated in index order on one thread, each from a cold start',
  backendWhy:'diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did',
  designSignature:null,engine:'none (diagram-compute.classic.js absent)'};
}
function dnCancelSweep(){if(DN_COMPUTE.abort){DN_COMPUTE.abort.abort('cancelled by the user');dnSweepProgress('',0,'cancelling…')}else toast('Nothing to cancel; this sweep cannot be interrupted without the shared runtime.')}

/* ---- damper authority: the installed characteristic against the inherent one ----
   91 solves. This feature does not exist in v1 for exactly one reason: about 0.9 s of frozen page. */
function selectedDamper(){if(state.selected?.kind!=='edge')return null;const e=edgeById(state.selected.id);return e?.type==='damper'?e:null}
async function runDamperAuthority(){
 const d=selectedDamper();
 if(!d){toast('Select a damper first');qs('#authorityChart').innerHTML='<div class="dn-chartempty">Select a damper, then run the authority sweep.</div>';return}
 if(DN_COMPUTE.busy){toast('A sweep is already running.');return}
 let spec;
 try{
  const err=validateNetwork();if(err)throw Error(err);
  spec={openings:dnRange(10,100),net:dnNetSnapshot(),fluid:getFluid(),law:d.law,id:d.id,name:d.name||d.id};
 }catch(e){qs('#authorityChart').innerHTML=`<div class="dn-chartempty">${esc(e.message)}</div>`;return}
 try{
  const run=await dnRunSweep('authority',{method:'grid',sweep:{o:spec.openings}},
   {kind:'authority',net:spec.net,fluid:spec.fluid,damperId:spec.id},`Damper authority (${spec.name})`);
  const pts=[];for(const r of run.results)if(r.ok&&r.value)pts.push(r.value);
  if(pts.length<4)throw Error('Could not sweep a usable authority curve.');
  pts.sort((a,b)=>a.o-b.o);
  const open=pts[pts.length-1],shut=pts[0];
  if(!(open.q>1e-9))throw Error('There is no airflow through this damper at 100 % opening, so an installed characteristic has no meaning.');
  const cOpen=open.c;
  const rows=pts.map(p=>({o:p.o,q:p.q,ratio:p.q/open.q,inherent:p.c/cOpen,dp:p.dp,fanQ:p.fanQ,grilles:p.grilles}));
  /* Authority is a ratio of pressure drops across the same device: wide open against closed. The
     sweep stops at 10 % rather than at zero — a fully shut damper makes the quadratic branch
     equation singular in this formulation — so what is reported is the ratio against the 10 %
     point, which is an UPPER bound on the true authority (the differential still grows as the
     damper keeps closing). Labelled as a bound, not as the number. */
  const beta=shut.dp>0?open.dp/shut.dp:NaN;
  drawXY(qs('#authorityChart'),rows.map(r=>[r.o,r.ratio]),rows.map(r=>[r.o,r.inherent]),
   'Damper opening [%]','Flow / flow at 100 % opening','Installed',`Inherent (${spec.law==='equal'?'equal %':'linear'})`,null);
  state.sweeps.authority={id:spec.id,name:spec.name,law:spec.law,rows,beta,
   dpOpen:open.dp,dpShut:shut.dp,qOpen:open.q,fanQOpen:open.fanQ,fanQShut:shut.fanQ,
   maxDeviation:rows.reduce((m,r)=>Math.max(m,Math.abs(r.ratio-r.inherent)),0),run};
  dnRenderSweeps();
 }catch(e){qs('#authorityChart').innerHTML=`<div class="dn-chartempty">${esc(dnIsAbort(e)?'Sweep cancelled.':e.message)}</div>`}
}

/* ---- N-1 branch blockage: close each branch in turn, report which grilles starve ---- */
async function runN1(){
 if(DN_COMPUTE.busy){toast('A sweep is already running.');return}
 let spec;
 try{
  const err=validateNetwork();if(err)throw Error(err);
  const net=dnNetSnapshot(),fluid=getFluid();
  const items=net.edges.filter(e=>e.type==='duct'||e.type==='tee'||e.type==='damper').map(e=>e.id);
  if(!items.length)throw Error('The N-1 screen blocks ducts, tee arms and dampers one at a time; this network has none of them.');
  const starve=clamp(Number(UIS.starvePct)||20,1,99)/100;
  const vLimit=Math.max(.1,Number(UIS.vLimit)||8);
  spec={design:{method:'leave-one-out',items,parameter:'excluded',baseline:true,baselineValue:null},
        params:{kind:'n1',net,fluid},starve,vLimit,net};
 }catch(e){dnSweepMessage('N-1 screen failed: '+e.message,'err');return}
 try{
  const run=await dnRunSweep('n1',spec.design,spec.params,'N-1 branch blockage');
  let baseline=null;const raw=[];
  for(const r of run.results){
   if(!r.ok){raw.push({excluded:String(r.parameters&&r.parameters.excluded),ok:false,reason:r.error});continue}
   if(r.value.excluded===null){baseline=r.value;continue}
   raw.push(r.value);
  }
  if(!baseline)throw Error('The intact-network baseline case did not solve, so nothing can be compared against it.');
  const names=new Map(spec.net.edges.map(e=>[e.id,e.name||e.id]));
  const rows=[];let infeasible=0,starving=0,overV=0;
  for(const v of raw){
   if(!v.ok){infeasible++;rows.push({id:v.excluded,name:names.get(v.excluded)||v.excluded,ok:false,reason:v.reason});continue}
   const starved=[];let worstDrop=0;
   for(const id in baseline.grilles){
    const b=baseline.grilles[id],q=v.grilles[id];
    if(q===undefined){starved.push({id,name:names.get(id)||id,q:0,base:b,frac:0});worstDrop=1;continue}
    const frac=b>1e-12?q/b:1;
    if(frac<1-spec.starve)starved.push({id,name:names.get(id)||id,q,base:b,frac});
    worstDrop=Math.max(worstDrop,1-frac);
   }
   if(starved.length)starving++;
   if(v.maxV>spec.vLimit)overV++;
   rows.push({id:v.excluded,name:names.get(v.excluded)||v.excluded,ok:true,starved,worstDrop,maxV:v.maxV,
     maxVEdge:names.get(v.maxVEdge)||v.maxVEdge,fanQ:v.fanQ,fanDp:v.fanDp,capped:!!v.capped});
  }
  rows.sort((a,b)=>(b.ok?b.starved.length:1e6)-(a.ok?a.starved.length:1e6));
  state.sweeps.n1={rows,baseline,starve:spec.starve,vLimit:spec.vLimit,infeasible,starving,overV,
    grilles:Object.keys(baseline.grilles).map(id=>({id,name:names.get(id)||id,base:baseline.grilles[id]})),run};
  dnRenderSweeps();
 }catch(e){dnSweepMessage(dnIsAbort(e)?'N-1 screen cancelled.':'N-1 screen failed: '+e.message,dnIsAbort(e)?'warn':'err')}
}

/* ---- Monte-Carlo over roughness and installation tolerance ----
   A distribution of grille flows instead of one nominal set. Note what is NOT here: duct leakage is
   not an element of this model at all, so it is not sampled and not renamed into something else. */
async function runMonteCarlo(){
 if(DN_COMPUTE.busy){toast('A sweep is already running.');return}
 const DC=(typeof window!=='undefined')?window.DiagramCompute:null;
 let spec;
 try{
  const err=validateNetwork();if(err)throw Error(err);
  if(!DC||!DN_COMPUTE.engine)throw Error('The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.');
  const net=dnNetSnapshot(),fluid=getFluid();
  const sigma=Math.max(0,Number(UIS.mcEpsSigma)||0);
  const gsig=Math.max(0,Number(UIS.mcGrilleSigma)||0);
  const dsd=Math.max(0,Number(UIS.mcDamperSd)||0);
  const rho=clamp(Number(UIS.mcRho)||0,0,.95);
  const count=Math.max(20,Math.min(20000,Math.round(Number(UIS.mcSamples)||400)));
  const seed=Math.round(Number(UIS.mcSeed)||0);
  const parameters={},group=[];
  if(sigma>0)for(const e of net.edges)if(e.type==='duct'&&e.eps>0){parameters['eps:'+e.id]={kind:'lognormal',median:1,sigma};group.push('eps')}
  if(gsig>0)for(const e of net.edges)if(e.type==='grille'){parameters['gdp:'+e.id]={kind:'lognormal',median:1,sigma:gsig};group.push('gdp')}
  if(dsd>0)for(const e of net.edges)if(e.type==='damper'){parameters['dop:'+e.id]={kind:'normal',mean:0,sd:dsd};group.push('dop')}
  const names=Object.keys(parameters);
  if(!names.length)throw Error('Nothing to sample. Give the duct roughness a sigma above 0 (the network needs ducts with non-zero roughness), or the grilles a sigma, or the dampers an opening sd.');
  let correlation=null;
  if(names.length>1&&rho>0){
   const M=names.map((_,i)=>names.map((__,j)=>i===j?1:(group[i]===group[j]?rho:0)));
   correlation={method:'iman-conover',target:'spearman',matrix:M};
  }
  spec={design:{method:'lhs',count,seed,parameters,correlation},params:{kind:'mc',net,fluid},
        count,seed,sigma,gsig,dsd,rho,net,names};
 }catch(e){dnSweepMessage('Monte-Carlo failed: '+e.message,'err');return}
 try{
  const run=await dnRunSweep('mc',spec.design,spec.params,'Monte-Carlo',{seed:spec.seed});
  /* Explicit tally ranges. CHANGELOG 0.32.1 note 1: the default span is a hint that now grows, but
     a consequence measured in absolute units deserves a stated range rather than luck. Grille flows
     are m3/h and fan rises are Pa, and both can legitimately be negative or zero here. */
  const skQ={},skP={};
  for(const e of spec.net.edges){
   if(e.type==='grille')skQ[e.id]=DC.createQuantileSketch({relativeAccuracy:.005,minValue:1e-3,maxValue:1e6,tailKeep:512});
   if(e.type==='fan')skP[e.id]=DC.createQuantileSketch({relativeAccuracy:.005,minValue:1e-2,maxValue:1e5,tailKeep:512});
  }
  let used=0;
  for(const r of run.results){
   if(!r.ok||!r.value)continue;used++;
   for(const id in r.value.grilles)if(skQ[id])skQ[id].add(r.value.grilles[id]);
   for(const id in r.value.fans)if(skP[id])skP[id].add(r.value.fans[id]);
  }
  if(!used)throw Error('No Monte-Carlo sample solved.');
  const probs=[.05,.5,.95];
  const grilles=spec.net.edges.filter(e=>e.type==='grille').map(e=>({id:e.id,name:e.name||e.id,design:e.Qdesign,s:skQ[e.id].summary({probabilities:probs})}));
  const fans=spec.net.edges.filter(e=>e.type==='fan').map(e=>({id:e.id,name:e.name||e.id,s:skP[e.id].summary({probabilities:probs})}));
  const boundHolds=grilles.every(x=>x.s.boundHolds)&&fans.every(x=>x.s.boundHolds);
  state.sweeps.mc={count:spec.count,used,seed:spec.seed,sigma:spec.sigma,gsig:spec.gsig,dsd:spec.dsd,rho:spec.rho,
   parameters:spec.names,grilles,fans,probs,boundHolds,
   diagnostics:(()=>{try{return DC.createSamplingDesign(spec.design).diagnostics()}catch(e){return null}})(),run};
  dnRenderSweeps();
 }catch(e){dnSweepMessage(dnIsAbort(e)?'Monte-Carlo cancelled.':'Monte-Carlo failed: '+e.message,dnIsAbort(e)?'warn':'err')}
}

/* ---- VAV load profile over 24 h or 8760 h ---- */
async function runLoadProfile(){
 if(DN_COMPUTE.busy){toast('A sweep is already running.');return}
 let spec;
 try{
  const err=validateNetwork();if(err)throw Error(err);
  const net=dnNetSnapshot(),fluid=getFluid();
  if(!net.edges.some(e=>e.type==='fan'))throw Error('The load profile reports fan energy; this network has no fan.');
  const hours=Number(UIS.profileHours)===8760?8760:24;
  const daily=String(UIS.profileDaily).split(/[,;\s]+/).filter(x=>x!=='').map(Number);
  if(daily.length!==24||daily.some(v=>!Number.isFinite(v)||v<0))throw Error('The hourly VAV profile needs exactly 24 finite, non-negative multipliers.');
  const season=clamp(Number(UIS.profileSeason)||0,0,.9);
  const speedFollows=!!UIS.profileSpeed;
  const cases=[];
  for(let h=0;h<hours;h++){
   const m=hours===8760?daily[h%24]*(1+season*Math.cos(2*Math.PI*Math.floor(h/24)/365)):daily[h%24];
   cases.push({hour:h,mult:m});
  }
  /* The multiplier scales nodal demands. On a network whose demands are all zero — the shipped
     example is one, because it is driven by the fan against two ambient boundaries — every hour is
     the same hour unless the profile also drives the fan speed. Saying so beats printing 8760
     identical rows and letting the reader assume they mean something. */
  const flat=!speedFollows&&!net.nodes.some(n=>n.demand!==0);
  spec={design:{method:'list',cases},params:{kind:'profile',net,fluid,speedFollows},hours,daily,season,speedFollows,net,flat};
 }catch(e){dnSweepMessage('Load profile failed: '+e.message,'err');return}
 try{
  const run=await dnRunSweep('profile',spec.design,spec.params,`VAV load profile (${spec.hours} h)`);
  const vLimit=Math.max(.1,Number(UIS.vLimit)||8);
  let energyWh=0,peakW=0,peakHour=null,maxV=0,overV=0,solved=0,air=0;
  const series=[];
  for(const r of run.results){
   if(!r.ok||!r.value)continue;solved++;
   const v=r.value;energyWh+=v.powerW;air+=v.fanQ;
   if(v.powerW>peakW){peakW=v.powerW;peakHour=v.hour}
   if(v.maxV>maxV)maxV=v.maxV;
   if(v.maxV>vLimit)overV++;
   if(spec.hours===24)series.push(v);
  }
  state.sweeps.profile={hours:spec.hours,season:spec.season,daily:spec.daily,speedFollows:spec.speedFollows,
   vLimit,solved,flat:spec.flat,energy_kWh:energyWh/1000,peak_kW:peakW/1000,
   mean_kW:solved?energyWh/solved/1000:0,peakHour,maxV,overV,air_m3:air,series,run};
  dnRenderSweeps();
 }catch(e){dnSweepMessage(dnIsAbort(e)?'Load profile cancelled.':'Load profile failed: '+e.message,dnIsAbort(e)?'warn':'err')}
}

/* ---- duct sizing: a grid over a standard catalogue ---- */
async function runSizeGrid(){
 if(DN_COMPUTE.busy){toast('A sweep is already running.');return}
 let spec;
 try{
  const err=validateNetwork();if(err)throw Error(err);
  if(!state.sol)state.sol=solveNetwork();
  const net=dnNetSnapshot(),fluid=getFluid();
  const ducts=net.edges.filter(e=>e.type==='duct');
  if(!ducts.length)throw Error('This network has no ducts to size.');
  const want=clamp(Math.round(Number(UIS.sizeCount)||2),1,3);
  const window=clamp(Math.round(Number(UIS.sizeWindow)||4),0,DN_DUCT_CATALOGUE.length);
  /* Size the ducts that are working hardest: highest solved velocity first. */
  const ranked=ducts.map(e=>({e,v:state.sol.edge[e.id]?state.sol.edge[e.id].vel:0}))
    .sort((a,b)=>(Number.isFinite(b.v)?b.v:0)-(Number.isFinite(a.v)?a.v:0)).slice(0,want).map(x=>x.e);
  const sweep={},chosen=[];
  for(const e of ranked){
   const Dh=areaDh(e).Dh*1000;
   let near=0;for(let i=1;i<DN_DUCT_CATALOGUE.length;i++)if(Math.abs(DN_DUCT_CATALOGUE[i]-Dh)<Math.abs(DN_DUCT_CATALOGUE[near]-Dh))near=i;
   const lo=window?Math.max(0,near-window):0,hi=window?Math.min(DN_DUCT_CATALOGUE.length-1,near+window):DN_DUCT_CATALOGUE.length-1;
   sweep['sz:'+e.id]=DN_DUCT_CATALOGUE.slice(lo,hi+1);
   chosen.push({id:e.id,name:e.name||e.id,Dh,near:DN_DUCT_CATALOGUE[near],sizes:sweep['sz:'+e.id].length,L:e.L});
  }
  const cases=Object.keys(sweep).reduce((n,k)=>n*sweep[k].length,1);
  if(cases>4000)throw Error(`That grid is ${cases} cases. Reduce the number of ducts or narrow the catalogue window.`);
  spec={sweep,chosen,cases,vLimit:Math.max(.1,Number(UIS.vLimit)||8),net,fluid,window};
 }catch(e){dnSweepMessage('Duct sizing failed: '+e.message,'err');return}
 try{
  const run=await dnRunSweep('size',{method:'grid',sweep:spec.sweep},{kind:'size',net:spec.net,fluid:spec.fluid},
    `Duct sizing (${spec.cases} combinations)`);
  const rows=[];
  for(const r of run.results)if(r.ok&&r.value)rows.push(r.value);
  if(!rows.length)throw Error('No sizing combination solved.');
  /* Specific air power, W per m3/s of delivered air — which for a single fan is just its total
     pressure rise. Ranking by RAW air power would be a trap and was one until this was measured:
     the fan sits on a curve, so choking the duct moves the operating point back and the product
     dp*Q FALLS. On a 12-branch test network the raw-power ranking picked the smallest duct in the
     catalogue, delivering less air for less power — energetically true, and useless as a design.
     Comparing energy per unit of air delivered is what makes two different sizes comparable, and
     the delivered flow is reported beside it so a shortfall cannot hide inside a good ratio. */
  const base=(state.sol&&state.sol.edge)?state.edges.filter(e=>e.type==='fan').reduce((a,e)=>a+Math.abs(state.sol.edge[e.id].q)*3600,0):0;
  for(const r of rows){r.specW=r.fanQ>1e-9?r.powerW/(r.fanQ/3600):Infinity;r.flowRatio=base>1e-9?r.fanQ/base:NaN}
  const feasible=rows.filter(r=>r.sweptV<=spec.vLimit);
  const ranked=(feasible.length?feasible:rows).slice().sort((a,b)=>a.specW-b.specW||a.area-b.area);
  state.sweeps.size={chosen:spec.chosen,cases:spec.cases,vLimit:spec.vLimit,window:spec.window,baseFlow:base,
   solved:rows.length,feasible:feasible.length,best:ranked[0],top:ranked.slice(0,12),
   worst:rows.slice().sort((a,b)=>b.specW-a.specW)[0],run};
  dnRenderSweeps();
 }catch(e){dnSweepMessage(dnIsAbort(e)?'Duct sizing cancelled.':'Duct sizing failed: '+e.message,dnIsAbort(e)?'warn':'err')}
}

/* ---- what the sweeps add to the calculation record ----
   AGENTS.md 2.1: new outputs go into the record, not into a second export path. Nothing is added
   while state.sweeps is empty, so a page that has only been solved records exactly what v1 records. */
function dnRecordSweeps(inputs,outputs,units,w){
  const S=state.sweeps;if(!S)return;
  const put=(o,k,v,u)=>{o[k]=v;units[k]=u===undefined?'-':u};
  const tag=(name,r)=>w.push(`${name}: ${r.completed} of ${r.cases} cases solved (${r.failed} failed), backend ${r.backend} (${r.backendWhy||''}), ${(r.elapsedMs/1000).toFixed(2)} s, determinism ${r.determinism} — ${r.determinismBasis}.`);
  if(S.curve){
    put(inputs,'curve_fan',S.curve.fan,'');
    put(inputs,'curve_points_requested',DN_CURVE_STEPS+1);
    put(outputs,'curve_points_usable',S.curve.points.length);
    put(outputs,'curve_flow_max',S.curve.qmax,'m3/h');
    for(const pt of S.curve.points){
      put(outputs,'curve_'+pt.k+'_flow',pt.q,'m3/h');
      put(outputs,'curve_'+pt.k+'_system_pressure',pt.sys,'Pa');
      put(outputs,'curve_'+pt.k+'_fan_pressure',pt.fan,'Pa');
    }
    tag('Fan/system curve',S.curve.run);
  }
  if(S.authority){
    const A=S.authority;
    put(inputs,'authority_damper',A.id,'');
    put(inputs,'authority_damper_law',A.law,'');
    put(inputs,'authority_openings',A.rows.length,'%-steps');
    put(outputs,'authority_flow_at_full_open',A.qOpen,'m3/h');
    put(outputs,'authority_dp_at_full_open',A.dpOpen,'Pa');
    put(outputs,'authority_dp_at_10_percent',A.dpShut,'Pa');
    put(outputs,'authority_ratio_upper_bound',A.beta,'- (dp at 100% / dp at 10%; upper bound on open/closed authority)');
    put(outputs,'authority_max_installed_minus_inherent',A.maxDeviation,'- (fraction of wide-open flow)');
    put(outputs,'authority_system_flow_full_open',A.fanQOpen,'m3/h');
    put(outputs,'authority_system_flow_10_percent',A.fanQShut,'m3/h');
    for(const r of A.rows){
      put(outputs,'authority_'+r.o+'_flow',r.q,'m3/h');
      put(outputs,'authority_'+r.o+'_installed_ratio',r.ratio,'-');
      put(outputs,'authority_'+r.o+'_inherent_ratio',r.inherent,'-');
    }
    tag('Damper authority',A.run);
  }
  if(S.n1){
    const N=S.n1;
    put(inputs,'n1_starvation_threshold',N.starve,'- (fraction of intact flow)');
    put(inputs,'n1_velocity_limit',N.vLimit,'m/s');
    put(outputs,'n1_contingencies',N.rows.length);
    put(outputs,'n1_not_solvable',N.infeasible);
    put(outputs,'n1_starving_contingencies',N.starving);
    put(outputs,'n1_over_velocity_limit',N.overV);
    for(const g of N.grilles)put(outputs,'n1_intact_flow_'+g.id,g.base,'m3/h');
    for(const r of N.rows){
      if(r.ok){
        put(outputs,'n1_'+r.id+'_worst_grille_drop',r.worstDrop,'- (fraction)');
        put(outputs,'n1_'+r.id+'_starved_grilles',r.starved.length);
        put(outputs,'n1_'+r.id+'_max_velocity',r.maxV,'m/s');
        put(outputs,'n1_'+r.id+'_fan_flow',r.fanQ,'m3/h');
      }else put(outputs,'n1_'+r.id+'_outcome',r.reason,'');
    }
    tag('N-1 branch blockage',N.run);
  }
  if(S.mc){
    const M=S.mc;
    put(inputs,'mc_samples_requested',M.count);
    put(inputs,'mc_seed',M.seed);
    put(inputs,'mc_roughness_lognormal_sigma',M.sigma);
    put(inputs,'mc_grille_dp_lognormal_sigma',M.gsig);
    put(inputs,'mc_damper_opening_sd',M.dsd,'% points');
    put(inputs,'mc_rank_correlation_within_family',M.rho);
    put(inputs,'mc_sampled_inputs',M.parameters.length);
    put(outputs,'mc_samples_solved',M.used);
    put(outputs,'mc_quantile_bound_holds',M.boundHolds?1:0);
    for(const g of M.grilles){
      put(outputs,'mc_flow_'+g.id+'_p05',g.s.quantiles['0.05'],'m3/h');
