par rapport au même cas résolu ici et est revenu identique","; over that box it differs from the Colebrook root by up to about 3% in f, and by more outside it. The 2000<Re<4000 blend is a numerical bridge, not a resolved transition model. Ducts running outside the published box are listed as a warning after each solve.":" ; dans ce cadre elle diffère de la racine de Colebrook jusqu'à environ 3 % sur f, et davantage en dehors. La transition 2000<Re<4000 est un pont numérique, pas un modèle de transition résolu. Les conduits situés hors du cadre publié sont signalés en avertissement après chaque résolution.","A Latin hypercube over duct roughness (lognormal, median 1), grille design pressure drop (lognormal, median 1) and damper opening (normal, in percentage points), with an optional rank correlation inside each family. Quantiles are DDSketch estimates with a stated error bound, not exact order statistics. Duct leakage is not sampled: this model has no leakage element, and inventing one as a nodal demand would be a different model, not an uncertainty.":"Un hypercube latin sur la rugosité des conduits (lognormale, médiane 1), la perte de charge de conception des grilles (lognormale, médiane 1) et l'ouverture des registres (normale, en points de pourcentage), avec une corrélation de rang optionnelle au sein de chaque famille. Les quantiles sont des estimations DDSketch avec une borne d'erreur indiquée, pas des statistiques d'ordre exactes. Les fuites de conduit ne sont pas échantillonnées : ce modèle ne comporte aucun élément de fuite, et en inventer une comme demande nodale constituerait un autre modèle, pas une incertitude.","A arm":"Bras A","A damper":"Registre A","A damper out":"Sortie registre A","A descending quadratic curve of fan total-pressure rise through the shutoff pressure and one rated point, scaled by the affinity laws with the local and global speed factors. The solver adds this rise to the gauge total pressure of the airflow, so the curve must be on the fan total-pressure basis; a catalogue static-pressure curve needs the fan outlet velocity pressure added before entry. Rated pressure must be below shutoff pressure. Reverse flow and operation beyond the zero-head runout are extrapolations of that quadratic and are warned after the solve.":"Une courbe quadratique décroissante de l'élévation de pression totale du ventilateur passant par la pression d'arrêt et un point nominal, mise à l'échelle par les lois d'affinité avec les facteurs de vitesse locale et globale. Le solveur ajoute cette élévation à la pression totale relative de l'écoulement ; la courbe doit donc être saisie en pression totale du ventilateur, et une courbe de catalogue en pression statique doit d'abord être augmentée de la pression dynamique à la sortie du ventilateur. La pression nominale doit être inférieure à la pression d'arrêt. Le débit inverse et le fonctionnement au-delà du point de fuite à hauteur nulle sont des extrapolations de cette parabole et sont signalés après la résolution.","A design-point pressure drop scaled by opening: dp = dp_design (q/q_design)² / c², with c = o for the linear conductance law and c = 50^(o−1) for equal percentage, where o is the opening as a fraction. Auto-balance changes the opening, never the rated characteristic. Set a balance target flow to include a damper in auto-balancing.":"Une perte de charge au point de conception mise à l'échelle par l'ouverture : dp = dp_design (q/q_design)² / c², avec c = o pour la loi de conductance linéaire et c = 50^(o−1) pour le pourcentage égal, où o est l'ouverture exprimée en fraction. L'équilibrage automatique modifie l'ouverture, jamais la caractéristique nominale. Définissez un débit cible d'équilibrage pour inclure un registre dans l'équilibrage automatique.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary (normally 0 Pa for room/outdoor ambient). Positive node demand removes airflow; negative demand injects it. Boundary pressures are gauge pressures relative to the outdoor air at the node elevation; with one air density inside and outside, the hydrostatic terms cancel, and buoyancy/stack effect from temperature-dependent density is not modelled.":"Un nœud à pression fixe impose la pression totale relative à une limite à faible vitesse (normalement 0 Pa pour une pièce ou l'air extérieur). Une demande nodale positive retire du débit ; une demande négative en injecte. Les pressions aux limites sont relatives à l'air extérieur à l'altitude du nœud ; avec une seule masse volumique à l'intérieur et à l'extérieur, les termes hydrostatiques s'annulent, et l'effet de flottabilité/tirage thermique dû à une densité dépendant de la température n'est pas modélisé.","A fixed-pressure node fixes gauge total pressure at a low-velocity boundary — normally 0 Pa for a room or the outdoors. At least one is needed in every connected part of the network, otherwise the pressure level is undetermined and the solve is refused.":"Un nœud à pression fixe impose la pression totale relative à une limite à faible vitesse — normalement 0 Pa pour une pièce ou l'extérieur. Il en faut au moins un dans chaque partie connexe du réseau, sinon le niveau de pression est indéterminé et la résolution est refusée.","A grille":"Grille A","A rename does not change a number, so the solution is kept.":"Un renommage ne modifie aucun nombre, la solution est donc conservée.","A sweep is already running.":"Un balayage est déjà en cours.","A tee arm is a user-supplied local-loss coefficient K applied to that arm only, with no friction term. Represent a multi-port junction as one node plus one fitting edge per arm that needs an explicit K. The K values are inputs: they are not derived from ASHRAE or Idelchik geometry, and not from the split ratio.":"Un bras de té est un coefficient de perte singulière K fourni par l'utilisateur, appliqué uniquement à ce bras, sans terme de frottement. Représentez une jonction à plusieurs voies par un nœud plus une arête de raccord par bras nécessitant un K explicite. Les valeurs de K sont des données d'entrée : elles ne sont pas dérivées de la géométrie ASHRAE ou Idelchik, ni du taux de répartition.","ASHRAE Handbook - Fundamentals, Duct Design: rectangular hydraulic diameter Dh = 2WH/(W+H); local loss dp = K rho v^2/2.":"ASHRAE Handbook - Fundamentals, Duct Design : diamètre hydraulique rectangulaire Dh = 2WH/(W+H) ; perte singulière dp = K rho v^2/2.","Add at least one component.":"Ajoutez au moins un composant.","Add at least two nodes.":"Ajoutez au moins deux nœuds.","Air and load":"Air et charge","Air density":"Masse volumique de l'air","Air density 0.2 to 2 kg/m3":"Masse volumique de l'air 0,2 à 2 kg/m3","Air density must be 0.2–2 kg/m³.":"La masse volumique de l'air doit être de 0,2 à 2 kg/m³.","Air power W":"Puissance aéraulique W","Air state":"État de l'air","Airflow [m³/h]":"Débit [m³/h]","All component airflows and all free-node gauge total pressures are unknowns in one system, solved by a damped Newton method with a numerically differentiated Jacobian and a dense Gauss–Jordan factorisation with partial pivoting. The stopping rule is a scaled residual of 2×10⁻⁹; if the iteration cap is reached first the result is reported as unconverged. The browser solver refuses models above 600 nonlinear unknowns.":"Tous les débits des composants et toutes les pressions totales relatives des nœuds libres sont des inconnues d'un même système, résolu par une méthode de Newton amortie avec un jacobien différencié numériquement et une factorisation de Gauss-Jordan dense à pivotage partiel. La règle d'arrêt est un résidu mis à l'échelle de 2×10⁻⁹ ; si la limite d'itérations est atteinte en premier, le résultat est signalé comme non convergé. Le solveur du navigateur refuse les modèles au-delà de 600 inconnues non linéaires.","Arm loss coefficient K":"Coefficient de perte K du bras","At most 600 nonlinear unknowns (components + free nodes)":"Au plus 600 inconnues non linéaires (composants + nœuds libres)","Auto-balance dampers":"Équilibrer automatiquement les registres","Auto-balance moves the opening of every damper with a target above zero.":"L'équilibrage automatique modifie l'ouverture de chaque registre dont la cible est supérieure à zéro.","B arm":"Bras B","B damper":"Registre B","B damper out":"Sortie registre B","B grille":"Grille B","Balance target":"Cible d'équilibrage","Balancing failed:":"Échec de l'équilibrage :","Balancing is not meaningful at 0% load":"L'équilibrage n'a pas de sens à 0 % de charge","Boundary +in m³/h":"Limite +entrée m³/h","Boundary [m³/h]":"Limite [m³/h]","Boundary conditions":"Conditions aux limites","C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156: used only to quantify the Swamee-Jain scatter, never as the graded reference.":"C.F. Colebrook, J. Inst. Civ. Eng. 11 (1939) 133-156 : utilisé uniquement pour quantifier la dispersion de Swamee-Jain, jamais comme référence graduée.","Cancel sweep":"Annuler le balayage","Catalogue window ± steps (0 = all)":"Fenêtre catalogue ± pas (0 = tous)","Circular":"Circulaire","Circular or rectangular Darcy–Weisbach: 64/Re below Re 2000, the Swamee–Jain explicit approximation above Re 4000, and a smoothstep blend between. Swamee–Jain is published for 10⁻⁶ ≤ eps/Dh ≤ 10⁻² and 5×10³ ≤ Re ≤ 10⁸; over that box it differs from the Colebrook root by up to about 3 % in f, and by more outside it. Ducts running outside the published box are listed as a warning after each solve. Roughness is the absolute wall roughness in millimetres; ΣK collects the local losses on that run.":"Circulaire ou rectangulaire, Darcy–Weisbach : 64/Re en dessous de Re 2000, l'approximation explicite de Swamee–Jain au-dessus de Re 4000, avec une transition lissée entre les deux. Swamee–Jain est publiée pour 10⁻⁶ ≤ eps/Dh ≤ 10⁻² et 5×10³ ≤ Re ≤ 10⁸ ; dans ce cadre elle diffère de la racine de Colebrook jusqu'à environ 3 % sur f, et davantage en dehors. Les conduits situés hors du cadre publié sont signalés en avertissement après chaque résolution. La rugosité est la rugosité absolue de paroi en millimètres ; ΣK rassemble les pertes singulières de ce calcul.","Click a node or a component on the drawing to edit it, or pick a tool and click the canvas to create one.":"Cliquez sur un nœud ou un composant du dessin pour le modifier, ou choisissez un outil et cliquez sur le canevas pour en créer un.","Click empty canvas to add a node.":"Cliquez sur un espace vide du canevas pour ajouter un nœud.","Click junction node, then arm node to add a tee/fitting loss arm.":"Cliquez sur le nœud de jonction, puis sur le nœud du bras pour ajouter un bras de perte de té/raccord.","Click start node, then end node to add a damper.":"Cliquez sur le nœud de départ, puis sur le nœud d'arrivée pour ajouter un registre.","Click start node, then end node to add a duct.":"Cliquez sur le nœud de départ, puis sur le nœud d'arrivée pour ajouter un conduit.","Click start node, then end node to add a grille.":"Cliquez sur le nœud de départ, puis sur le nœud d'arrivée pour ajouter une grille.","Component":"Composant","Component closed":"Composant fermé","Component energy:  h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, with h = p_total_gauge/(rho g), gauge relative to outdoor air at the node elevation, rho_out = rho":"Énergie du composant : h_a + z_a (1 - rho_out/rho) - h_b - z_b (1 - rho_out/rho) + h_fan(q) - h_loss(q) = 0, avec h = p_total_gauge/(rho g), rho_out = rho","Component results":"Résultats des composants","Component velocity is the airflow divided by the flow area, and velocity pressure is ½ rho v². Generic junction nodes have no unique cross-section, so static pressure is not recovered at a node: velocity and velocity pressure are reported per component instead. The velocity limit in Screening limits is what the N-1, profile and sizing sweeps compare against.":"La vitesse du composant est le débit divisé par la section de passage, et la pression dynamique est ½ rho v². Les nœuds de jonction génériques n'ont pas de section propre, la pression statique n'est donc pas restituée à un nœud : la vitesse et la pression dynamique sont indiquées par composant à la place. La limite de vitesse dans Limites de dépistage est ce à quoi se comparent les balayages N-1, profil et dimensionnement.","Components":"Composants","Compute":"Calculer","Could not sweep a usable authority curve.":"Impossible de balayer une courbe d'autorité utilisable.","Could not sweep a usable system curve.":"Impossible de balayer une courbe de réseau utilisable.","Curves":"Courbes","Damper":"Registre","Damper authority":"Autorité du registre","Damper flow m³/h":"Débit registre m³/h","Damper opening 0.1 % to 100 %":"Ouverture du registre 0,1 % à 100 %","Damper opening [%]":"Ouverture du registre [%]","Damper opening sd (normal)":"Ouverture du registre éc.-type (normale)","Damper:":"Registre :","Damper:  h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2,  c = o (linear) or 50^(o-1) (equal percentage), o = opening/100":"Registre : h_loss = (dp_design/(rho g)) (q/q_design)^2 / c^2, c = o (linéaire) ou 50^(o-1) (pourcentage égal), o = ouverture/100","Dampers":"Registres","Delete":"Supprimer","Delete selected":"Supprimer la sélection","Delete the selection":"Supprimer la sélection","Demand [m³/h]":"Demande [m³/h]","Demand m³/h":"Demande m³/h","Demand, positive out":"Demande, positif = sortant","Density and kinematic viscosity are constant everywhere and for the whole solve. Density converts head to pressure and scales every loss; viscosity only enters through the Reynolds number, and therefore only through the friction factor of ducts. 1.204 kg/m³ and 1.5×10⁻⁵ m²/s are dry air at about 20 °C and one atmosphere.":"La masse volumique et la viscosité cinématique sont constantes partout et pendant toute la résolution. La masse volumique convertit la hauteur en pression et met à l'échelle chaque perte ; la viscosité n'intervient que par le nombre de Reynolds, et donc uniquement par le facteur de frottement des conduits. 1,204 kg/m³ et 1,5×10⁻⁵ m²/s correspondent à de l'air sec à environ 20 °C et une atmosphère.","Design flow":"Débit de conception","Design m³/h":"Conception m³/h","Design Δp":"Δp de conception","Diameter":"Diamètre","Direction:":"Sens :","Drag nodes. Select an element to edit it.":"Faites glisser les nœuds. Sélectionnez un élément pour le modifier.","Draw":"Dessiner","Draw a network, or load the example, then press Solve network.":"Dessinez un réseau, ou chargez l'exemple, puis cliquez sur Résoudre le réseau.","Draw and solve arbitrary air-duct networks with ducts, junction/tee arms, grilles, dampers and fans. Steady-state airflow, gauge total pressure, fan/system curves and damper balancing.":"Dessinez et résolvez des réseaux aérauliques quelconques avec conduits, bras de jonction/té, grilles, registres et ventilateurs. Débit stationnaire, pression totale relative, courbes ventilateur/réseau et équilibrage des registres.","Drawing tools":"Outils de dessin","Duct":"Conduit","Duct internal checks failed":"Échec des contrôles internes du conduit","Duct network drawing canvas":"Canevas de dessin du réseau de conduits","Duct roughness σ (lognormal)":"Rugosité du conduit σ (lognormale)","Duct sizing":"Dimensionnement des conduits","Duct sizing cancelled.":"Dimensionnement des conduits annulé.","Duct sizing failed:":"Échec du dimensionnement des conduits :","Duct sizing is ranked by specific air power (air power per m3/s delivered), not by raw air power: with a fan on a curve, a smaller duct lowers the product dp*Q while delivering less air, so the raw figure rewards choking. Each swept duct is replaced by a circular duct of the catalogue size under test, so a rectangular duct is re-sectioned, and cost is represented only by the swept surface area pi*D*L.":"Le dimensionnement des conduits est classé par puissance aéraulique spécifique (puissance aéraulique par m3/s livré), et non par puissance aéraulique brute : avec un ventilateur sur une courbe, un conduit plus petit abaisse le produit dp*Q tout en livrant moins d'air, ce qui fait que le chiffre brut récompense l'étranglement. Chaque conduit balayé est remplacé par un conduit circulaire de la taille catalogue testée, un conduit rectangulaire est donc reconverti, et le coût n'est représenté que par la surface balayée pi*D*L.","Duct sizing over the EN 1506 catalogue":"Dimensionnement des conduits sur le catalogue EN 1506","Duct:":"Conduit :","Duct:  h_loss = (f L/Dh + K) v^2/(2 g),  v = q/A,  Re = v Dh/nu":"Conduit : h_loss = (f L/Dh + K) v^2/(2 g), v = q/A, Re = v Dh/nu","Ducts":"Conduits","Ducts to size (highest v first)":"Conduits à dimensionner (v le plus élevé en premier)","EN 1506 nominal circular duct diameters, mm:":"Diamètres nominaux de conduits circulaires EN 1506, mm :","Each duct, tee arm and damper is removed in turn and the network re-solved from cold, to find which grilles starve when one branch closes. Contingencies that leave the network unsolvable are listed as such rather than being silently dropped.":"Chaque conduit, bras de té et registre est retiré à tour de rôle et le réseau est résolu à nouveau à froid, afin de déterminer quelles grilles se retrouvent sous-alimentées lorsqu'une branche se ferme. Les scénarios rendant le réseau insoluble sont signalés comme tels plutôt que discrètement écartés.","Edge":"Arête","Edge results":"Résultats des arêtes","Elevation":"Altitude","Node pressures are gauge pressures relative to the outdoor air at the elevation of the node. The energy balance carries the hydrostatic term (rho − rho_out) g z, and the outdoor density rho_out equals the air density entered here, so the term is zero and elevation changes no airflow or pressure. Buoyancy and stack effect from temperature-dependent density are not modelled, so a tall riser carrying warm air is not represented by raising its nodes.":"Les pressions aux nœuds sont des pressions relatives à l'air extérieur à l'altitude du nœud. Le bilan d'énergie contient le terme hydrostatique (rho − rho_out) g z, et la masse volumique extérieure rho_out est égale à la masse volumique saisie ici : le terme est nul et l'altitude ne modifie aucun débit ni aucune pression. La flottabilité et l'effet de tirage thermique dus à une densité dépendant de la température ne sont pas modélisés, si bien qu'une colonne montante élevée transportant de l'air chaud n'est pas représentée en élevant ses nœuds.","Node pressures are gauge pressures relative to the outdoor air at each node elevation; with the outdoor density equal to the air density the hydrostatic terms cancel, and buoyancy and stack effect from temperature-dependent density are not modelled.":"Les pressions aux nœuds sont relatives à l'air extérieur à l'altitude de chaque nœud ; avec une masse volumique extérieure égale à celle de l'air, les termes hydrostatiques s'annulent, et la flottabilité et l'effet de tirage thermique dus à une densité dépendant de la température ne sont pas modélisés.","Elevation m":"Altitude m","Ensemble sweep results":"Résultats des balayages d'ensemble","Equal percentage (R=50)":"Pourcentage égal (R=50)","Equations":"Équations","Every network needs at least one fixed-pressure node per connected component; ambient boundaries are normally 0 Pa gauge total pressure.":"Chaque réseau a besoin d'au moins un nœud à pression fixe par composant connexe ; les limites ambiantes sont normalement à 0 Pa de pression totale relative.","Every nodal demand is multiplied by this factor before the solve, so 60 % means every extraction and injection runs at 60 % of its design value. It does not touch fan speed, damper openings or grille design points. The valid range of the model is 0 to 150 %.":"Chaque demande nodale est multipliée par ce facteur avant la résolution, donc 60 % signifie que chaque extraction et injection fonctionne à 60 % de sa valeur de conception. Cela n'affecte pas la vitesse du ventilateur, les ouvertures des registres ni les points de conception des grilles. La plage valide du modèle est de 0 à 150 %.","Every node in this network has zero demand, and the profile multiplier scales nodal demands only — so every hour below is the same operating point. Give at least one node a demand, or tick \"profile also drives fan speed\", to make the profile mean anything.":"Chaque nœud de ce réseau a une demande nulle, et le multiplicateur de profil ne met à l'échelle que les demandes nodales — chaque heure ci-dessous correspond donc au même point de fonctionnement. Donnez une demande à au moins un nœud, ou cochez « le profil pilote aussi la vitesse du ventilateur », pour donner un sens au profil.","Exactly 24 finite, non-negative multipliers are needed.":"Exactement 24 multiplicateurs finis et non négatifs sont nécessaires.","Exponent n":"Exposant n","Fan / system curve":"Courbe ventilateur/réseau","Fan [Pa]":"Ventilateur [Pa]","Fan affinity law dp ~ n^2 applied to the two-point quadratic fan curve.":"Loi d'affinité du ventilateur dp ~ n^2 appliquée à la courbe de ventilateur quadratique à deux points.","Fan air power W":"Puissance aéraulique ventilateur W","Fan airflow":"Débit du ventilateur","Fan and system curves":"Courbes ventilateur et réseau","Fan discharge":"Refoulement du ventilateur","Fan flow m³/h":"Débit ventilateur m³/h","Fan rated pressure must be below shutoff pressure; reverse flow and beyond-runout operation are extrapolations and are warned":"La pression nominale du ventilateur doit être inférieure à la pression d'arrêt ; le débit inverse et le fonctionnement au-delà du point de fuite sont des extrapolations et sont signalés","Fan rise Pa":"Élévation ventilateur Pa","Fan speed %":"Vitesse ventilateur %","Fan speed is held at the global factor; only nodal demand follows the profile.":"La vitesse du ventilateur est maintenue au facteur global ; seule la demande nodale suit le profil.","Fan total pressure rise":"Élévation de pression totale du ventilateur","Fan Δp Pa":"Δp ventilateur Pa","Fan, main duct, two tee arms, two dampers and two grilles between ambient and a room.":"Ventilateur, conduit principal, deux bras de té, deux registres et deux grilles entre l'ambiance extérieure et une pièce.","Fan/system curve":"Courbe ventilateur/réseau","Fan:":"Ventilateur :","Fans":"Ventilateurs","Fit the drawing":"Ajuster le dessin","Fixed gauge total-pressure boundary":"Limite à pression totale relative fixe","Fixed-pressure boundary":"Limite à pression fixe","Fixed-pressure node:  h = p / (rho g)":"Nœud à pression fixe : h = p / (rho g)","Flow / flow at 100 % opening":"Débit / débit à 100 % d'ouverture","Flow m³/h":"Débit m³/h","Flow vs current %":"Débit vs actuel %","Flow-following discharge path":"Trajet de refoulement suivant le débit","For every free node the solver enforces airflow continuity. For every component it enforces steady Bernoulli using gauge total pressure + elevation, fan pressure rise and signed total-pressure loss. Edge airflows and free-node gauge total pressures are solved simultaneously with a damped Newton method.":"Pour chaque nœud libre, le solveur impose la continuité du débit. Pour chaque composant, il impose Bernoulli stationnaire à l'aide de la pression totale relative + l'altitude, l'élévation de pression du ventilateur et la perte de pression totale signée. Les débits d'arête et les pressions totales relatives des nœuds libres sont résolus simultanément par une méthode de Newton amortie.","Friction: f = 64/Re for Re <= 2000; Swamee-Jain f = 0.25/[log10(eps/(3.7 Dh) + 5.74/Re^0.9)]^2 for Re >= 4000; smoothstep blend between":"Frottement : f = 64/Re pour Re <= 2000 ; Swamee-Jain f = 0,25/[log10(eps/(3,7 Dh) + 5,74/Re^0,9)]^2 pour Re >= 4000 ; transition lissée entre les deux","Gauge total pressure":"Pression totale relative","Gauge total pressure [Pa]":"Pression totale relative [Pa]","Global fan-speed factor":"Facteur global de vitesse du ventilateur","Global fan-speed factor must be between 40 and 120%.":"Le facteur global de vitesse du ventilateur doit être compris entre 40 et 120 %.","Grille":"Grille","Grille exponent n between 1 and 3":"Exposant n de la grille compris entre 1 et 3","Grille starvation threshold":"Seuil de sous-alimentation de la grille","Grille:":"Grille :","Grille:  h_loss = (dp_design/(rho g)) (q/q_design)^n":"Grille : h_loss = (dp_design/(rho g)) (q/q_design)^n","Grilles":"Grilles","H. Cross, \"Analysis of Flow in Networks of Conduits or Conductors\", Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936): the loop-correction method dQ = -sum(h)/sum(|dh/dQ|) used by the second solver.":"H. Cross, « Analysis of Flow in Networks of Conduits or Conductors », Univ. of Illinois Eng. Exp. Station Bulletin 286 (1936) : la méthode de correction de boucle dQ = -sum(h)/sum(|dh/dQ|) utilisée par le second solveur.","Hagen-Poiseuille laminar friction f = 64/Re.":"Frottement laminaire de Hagen-Poiseuille f = 64/Re.","Height":"Hauteur","Hide":"Masquer","Highest v m/s":"v maximale m/s","Highest velocity":"Vitesse maximale","Hour":"Heure","Hourly VAV multipliers (24 values, comma separated)":"Multiplicateurs horaires VAV (24 valeurs, séparées par des virgules)","How it is solved":"Comment c'est résolu","Ignored":"Ignoré","Inherent c/c₁₀₀":"Intrinsèque c/c₁₀₀","Initial residual is not finite.":"Le résidu initial n'est pas fini.","Installed":"Installée","Installed q/q₁₀₀":"Installée q/q₁₀₀","Invalid component ID.":"ID de composant non valide.","Invalid network file":"Fichier réseau non valide","Invalid node ID.":"ID de nœud non valide.","It solves a duct network in steady state: you draw nodes and join them with ducts, tee/fitting arms, dampers, grilles and fans, then press Solve network. For every free node the solver enforces airflow continuity, and for every component it enforces steady Bernoulli using gauge total pressure plus elevation, fan pressure rise and signed total-pressure loss. Component airflows and free-node gauge total pressures are solved simultaneously by a damped Newton method.\n\nStart from the example network in the panel above, or pick a tool and click the canvas. Every network needs at least one fixed-pressure node in each connected part.":"Il résout un réseau de conduits en régime stationnaire : vous dessinez des nœuds et les reliez par des conduits, des bras de té/raccord, des registres, des grilles et des ventilateurs, puis vous cliquez sur Résoudre le réseau. Pour chaque nœud libre, le solveur impose la continuité du débit, et pour chaque composant il impose Bernoulli stationnaire à l'aide de la pression totale relative plus l'altitude, l'élévation de pression du ventilateur et la perte de pression totale signée. Les débits des composants et les pressions totales relatives des nœuds libres sont résolus simultanément par une méthode de Newton amortie.\n\nPartez du réseau d'exemple dans le panneau ci-dessus, ou choisissez un outil et cliquez sur le canevas. Chaque réseau a besoin d'au moins un nœud à pression fixe dans chaque partie connexe.","Jacobian is singular":"Le jacobien est singulier","Junction losses must be entered as tee/fitting arms with an explicit K; they are not derived from geometry or split ratio.":"Les pertes de jonction doivent être saisies sous forme de bras de té/raccord avec un K explicite ; elles ne sont pas dérivées de la géométrie ni du taux de répartition.","Kinematic viscosity":"Viscosité cinématique","Kinematic viscosity must be positive.":"La viscosité cinématique doit être positive.","Length":"Longueur","Linear conductance":"Conductance linéaire","Load example network":"Charger le réseau d'exemple","Load factor must be between 0 and 150%.":"Le facteur de charge doit être compris entre 0 et 150 %.","Load profile cancelled.":"Profil de charge annulé.","Load profile failed:":"Échec du profil de charge :","Loads three same-origin scripts beside the page — site-disclaimer.js, diagram-common.js and diagram-compute.classic.js (the classic build of the shared compute runtime). Nothing else is fetched, no third-party host is contacted, and nothing about the duct network the user draws is transmitted anywhere: every solve and every sweep runs in this browser, on the main thread or in same-origin Blob Workers created from diagram-compute.classic.js.":"Charge trois scripts de même origine à côté de la page — site-disclaimer.js, diagram-common.js et diagram-compute.classic.js (la build classique du moteur de calcul partagé). Rien d'autre n'est récupéré, aucun hôte tiers n'est contacté, et rien concernant le réseau de conduits dessiné par l'utilisateur n'est transmis nulle part : chaque résolution et chaque balayage s'exécutent dans ce navigateur, sur le thread principal ou dans des Workers Blob de même origine créés à partir de diagram-compute.classic.js.","Local speed":"Vitesse locale","Loss [Pa]":"Perte [Pa]","Main duct":"Conduit principal","Max v in swept ducts m/s":"v max dans les conduits balayés m/s","Max v m/s":"v max m/s","Minor-loss ΣK":"Perte singulière ΣK","Model each tee run/branch arm separately with its own K.":"Modélisez chaque bras de passage/dérivation de té séparément avec son propre K.","Model limits":"Limites du modèle","Monte-Carlo":"Monte-Carlo","Monte-Carlo cancelled.":"Monte-Carlo annulé.","Monte-Carlo failed:":"Échec de Monte-Carlo :","Multiplier":"Multiplicateur","Multiplies the local speed of every fan, and enters the fan curve squared through the affinity law dp ~ n². The model is stated for 40 to 120 %; the VAV load profile clamps its own fan tracking to the same range.":"Multiplie la vitesse locale de chaque ventilateur, et entre au carré dans la courbe du ventilateur via la loi d'affinité dp ~ n². Le modèle est énoncé pour 40 à 120 % ; le profil de charge VAV limite son propre suivi du ventilateur à la même plage.","N-1 blockage":"Blocage N-1","N-1 branch blockage":"Blocage de branche N-1","N-1 branch blockage — grille starvation":"Blocage de branche N-1 — sous-alimentation de grille","N-1 screen cancelled.":"Dépistage N-1 annulé.","N-1 screen failed:":"Échec du dépistage N-1 :","Name":"Nom","Network editor":"Éditeur de réseau","Network file":"Fichier réseau","Network file is too large (5 MB limit).":"Le fichier réseau est trop volumineux (limite de 5 Mo).","Network file is too large for this editor (max 1000 nodes / 3000 components).":"Le fichier réseau est trop volumineux pour cet éditeur (max 1000 nœuds / 3000 composants).","Network loaded. Press Solve network.":"Réseau chargé. Cliquez sur Résoudre le réseau.","Newton iterations":"Itérations de Newton","Newton line search failed.":"Échec de la recherche linéaire de Newton.","No Monte-Carlo sample solved.":"Aucun échantillon Monte-Carlo résolu.","No airflow/return path from fan discharge to a fixed-pressure boundary.":"Aucun trajet de débit/retour du refoulement du ventilateur vers une limite à pression fixe.","No authority sweep generated.":"Aucun balayage d'autorité généré.","No curve generated.":"Aucune courbe générée.","No pressure profile generated.":"Aucun profil de pression généré.","No sizing combination solved.":"Aucune combinaison de dimensionnement résolue.","No sweep has run for this network yet. Each button above solves the network many times; the fan / system curve is now the same kind of sweep.":"Aucun balayage n'a encore été exécuté pour ce réseau. Chaque bouton ci-dessus résout le réseau de nombreuses fois ; la courbe ventilateur/réseau est désormais le même type de balayage.","No sweep has run for this network yet. Each button in the input column solves the network many times; the fan / system curve is the same kind of sweep.":"Aucun balayage n'a encore été exécuté pour ce réseau. Chaque bouton de la colonne de saisie résout le réseau de nombreuses fois ; la courbe ventilateur/réseau est le même type de balayage.","Nodal demand":"Demande nodale","Node":"Nœud","Node continuity (free nodes):  SUM_in q - SUM_out q - demand * load_factor = 0":"Continuité nodale (nœuds libres) : SUM_in q - SUM_out q - demand * load_factor = 0","Node results":"Résultats des nœuds","Node Δp a−b Pa":"Nœud Δp a−b Pa","Nodes and edges must be arrays.":"Les nœuds et les arêtes doivent être des tableaux.","None":"Aucun","Nonlinear unknowns":"Inconnues non linéaires","Not solved":"Non résolu","Not solved.":"Non résolu.","Not solved. Press Solve network.":"Non résolu. Cliquez sur Résoudre le réseau.","Nothing generated yet.":"Rien de généré pour l'instant.","Nothing is solved, so no result, export or sweep is available until the network validates.":"Rien n'est résolu, donc aucun résultat, export ou balayage n'est disponible tant que le réseau n'est pas valide.","Nothing selected":"Rien de sélectionné","Nothing to cancel; this sweep cannot be interrupted without the shared runtime.":"Rien à annuler ; ce balayage ne peut pas être interrompu sans le moteur partagé.","Nothing to sample. Give the duct roughness a sigma above 0 (the network needs ducts with non-zero roughness), or the grilles a sigma, or the dampers an opening sd.":"Rien à échantillonner. Donnez à la rugosité des conduits un sigma supérieur à 0 (le réseau a besoin de conduits à rugosité non nulle), ou un sigma aux grilles, ou un écart-type d'ouverture aux registres.","One duct solve is always on the main thread and is unchanged from the audited build. Repeated solves — the six sweeps — go to the shared compute runtime, which moves them into Workers only when there are enough cases to pay for a round trip. The badge states which backend last ran, why, and whether a Worker case was checked against the same case solved here.":"Une résolution de conduit unique est toujours sur le thread principal et reste inchangée par rapport à la build auditée. Les résolutions répétées — les six balayages — passent par le moteur de calcul partagé, qui ne les déplace vers des Workers que lorsqu'il y a assez de cas pour rentabiliser un aller-retour. Le badge indique quel backend a tourné en dernier, pourquoi, et si un cas Worker a été vérifié par rapport au même cas résolu ici.","Open duct-network JSON file":"Ouvrir un fichier JSON de réseau de conduits","Open network file":"Ouvrir un fichier réseau","Opening":"Ouverture","Opening %":"Ouverture %","Opening characteristic":"Caractéristique d'ouverture","P.K. Swamee & A.K. Jain, \"Explicit equations for pipe-flow problems\", ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664: f = 0.25/[log10(eps/(3.7 D) + 5.74/Re^0.9)]^2, stated for 1e-6 <= eps/D <= 1e-2 and 5e3 <= Re <= 1e8.":"P.K. Swamee & A.K. Jain, « Explicit equations for pipe-flow problems », ASCE J. Hydraulics Div. 102(HY5) (1976) 657-664 : f = 0,25/[log10(eps/(3,7 D) + 5,74/Re^0,9)]^2, énoncée pour 1e-6 <= eps/D <= 1e-2 et 5e3 <= Re <= 1e8.","Pa (gauge)":"Pa (relative)","Partial load 0 to 150 %, global fan speed 40 to 120 %":"Charge partielle de 0 à 150 %, vitesse globale du ventilateur de 40 à 120 %","Partial-load demand factor":"Facteur de demande en charge partielle","Positive component airflow follows its arrow.":"Un débit de composant positif suit sa flèche.","Positive demand removes airflow from the network at that node, negative demand injects it. It is scaled by the partial-load factor. A network with no demand at all is driven only by its fans and its boundary pressures.":"Une demande positive retire du débit au réseau à ce nœud, une demande négative en injecte. Elle est mise à l'échelle par le facteur de charge partielle. Un réseau sans aucune demande n'est entraîné que par ses ventilateurs et ses pressions aux limites.","Potential [Pa]":"Potentiel [Pa]","Pressure profile":"Profil de pression","Pressure rise [Pa]":"Élévation de pression [Pa]","Profile also drives the global fan-speed factor (clamped to 40–120 %)":"Le profil pilote aussi le facteur global de vitesse du ventilateur (limité à 40–120 %)","Profile length":"Longueur du profil","Rank correlation within family":"Corrélation de rang au sein de la famille","Rated flow":"Débit nominal","Rated pressure must be below the shutoff pressure.":"La pression nominale doit être inférieure à la pression d'arrêt.","Received":"Reçu","Rectangular":"Rectangulaire","Rectangular section:  A = W H,  Dh = 2 W H/(W + H);  circular:  A = pi D^2/4,  Dh = D":"Section rectangulaire : A = W H, Dh = 2 W H/(W + H) ; circulaire : A = pi D^2/4, Dh = D","Reset":"Réinitialiser","Rise P5 Pa":"Élévation P5 Pa","Room / ambient":"Pièce / ambiance","Roughness":"Rugosité","Run duct sizing":"Exécuter le dimensionnement des conduits","Run load profile":"Exécuter le profil de charge","Samples":"Échantillons","Save network file":"Enregistrer le fichier réseau","Save network file writes the drawing, the air state and the load factors as a tools.petrov.re/duct-network/v1 JSON document, and Open network file reads one back. This is the editor document, not the calculation record: the shared bar’s JSON export is the record and cannot be loaded back into the editor, and the shared bar’s Copy link carries the same document inside a permalink.":"Enregistrer le fichier réseau écrit le dessin, l'état de l'air et les facteurs de charge sous forme d'un document JSON tools.petrov.re/duct-network/v1, et Ouvrir un fichier réseau en relit un. C'est le document de l'éditeur, pas l'enregistrement de calcul : l'export JSON de la barre partagée est l'enregistrement et ne peut pas être rechargé dans l'éditeur, et Copier le lien de la barre partagée transporte le même document à l'intérieur d'un permalien.","Scaled residual":"Résidu mis à l'échelle","Screening limits":"Limites de dépistage","Seasonal swing (8760 h only)":"Variation saisonnière (8760 h uniquement)","Section":"Section","Seed":"Graine","Select":"Sélectionner","Select a damper first":"Sélectionnez d'abord un registre","Select a damper, then run the authority sweep.":"Sélectionnez un registre, puis exécutez le balayage d'autorité.","Select a fan first":"Sélectionnez d'abord un ventilateur","Select a fan on the drawing first.":"Sélectionnez d'abord un ventilateur sur le dessin.","Select drags nodes and picks an element to edit. Node adds a node where you click on empty canvas. The five component tools each want two clicks: the start node, then the end node. Positive component airflow follows the arrow, so the direction you draw in is the sign convention for that component.":"Sélectionner fait glisser les nœuds et choisit un élément à modifier. Nœud ajoute un nœud là où vous cliquez sur un canevas vide. Les cinq outils de composant demandent chacun deux clics : le nœud de départ, puis le nœud d'arrivée. Un débit de composant positif suit la flèche, le sens dans lequel vous dessinez est donc la convention de signe de ce composant.","Selection":"Sélection","Set target flow on at least one damper":"Définissez un débit cible sur au moins un registre","Shared compute runtime: starting…":"Moteur de calcul partagé : démarrage…","Show":"Afficher","Shutoff total pressure":"Pression totale d'arrêt","Sizes mm":"Tailles mm","Solve network":"Résoudre le réseau","Solve the network first.":"Résolvez d'abord le réseau.","Solved simultaneously for all component airflows and free-node gauge total pressures by a damped Newton method with a numerical Jacobian":"Résolu simultanément pour tous les débits des composants et les pressions totales relatives des nœuds libres par une méthode de Newton amortie avec jacobien numérique","Solver failed:":"Échec du solveur :","Specific air power W/(m³/s)":"Puissance aéraulique spécifique W/(m³/s)","Starved grilles":"Grilles sous-alimentées","Total pressure rise at rated flow":"Élévation de pression totale au débit nominal","Steady state, incompressible, single phase; constant air properties":"Régime stationnaire, incompressible, monophasique ; propriétés de l'air constantes","Steady-state incompressible airflow networks":"Réseaux aérauliques incompressibles en régime stationnaire","Supply junction":"Jonction de soufflage","Swamee-Jain is published for 1e-6 <= eps/Dh <= 1e-2 and 5e3 <= Re <= 1e8; it differs from the Colebrook root by up to about 3 % over that range":"Swamee-Jain est publiée pour 1e-6 <= eps/Dh <= 1e-2 et 5e3 <= Re <= 1e8 ; elle diffère de la racine de Colebrook jusqu'à environ 3 % sur cette plage","Sweep cancelled.":"Balayage annulé.","Swept surface m²":"Surface balayée m²","System curve requires positive solved airflow through the selected fan.":"La courbe de réseau exige un débit résolu positif à travers le ventilateur sélectionné.","THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY.":"LA BORNE DE PRÉCISION EST NULLE POUR AU MOINS UN RELEVÉ.","Tee / fitting":"Té / raccord","Tee / fitting arm:":"Bras de té/raccord :","Tee / fitting arm:  h_loss = K v^2/(2 g) on that arm only, no friction term":"Bras de té/raccord : h_loss = K v^2/(2 g) sur ce bras uniquement, sans terme de frottement","Tee and fitting arms":"Bras de té et de raccord","Tee branch A":"Dérivation de té A","Tee run B":"Passage de té B","Tee/fitting":"Té/raccord","The 24 hourly multipliers scale nodal demand hour by hour, optionally driving the global fan-speed factor with them, and the fan air power dp·Q is integrated over the period. This is air power: fan total efficiency, motor and drive losses and SFP are not part of this model, so no kW/(m³/s) figure is claimed.":"Les 24 multiplicateurs horaires mettent à l'échelle la demande nodale heure par heure, en pilotant éventuellement le facteur global de vitesse du ventilateur avec eux, et la puissance aéraulique du ventilateur dp·Q est intégrée sur la période. C'est de la puissance aéraulique : le rendement total du ventilateur, les pertes du moteur et de l'entraînement et le SFP ne font pas partie de ce modèle, aucun chiffre en kW/(m³/s) n'est donc avancé.","The Monte-Carlo sweep needs diagram-compute.classic.js — its Latin-hypercube design, its rank-correlation transform and its mergeable quantile tallies are the runtime’s, and this build will not swap in a different sampler and present it as the same experiment.":"Le balayage Monte-Carlo nécessite diagram-compute.classic.js — son plan d'hypercube latin, sa transformation de corrélation de rang et ses relevés de quantiles fusionnables appartiennent au moteur, et cette build ne substituera pas un autre échantillonneur en le présentant comme la même expérience.","The N-1 screen blocks ducts, tee arms and dampers one at a time; this network has none of them.":"Le dépistage N-1 bloque les conduits, les bras de té et les registres un par un ; ce réseau n'en possède aucun.","The fan/system curve holds the airflow through the selected fan at each of 33 values and solves the whole network for each one, so the system curve is the network’s own resistance, not a fitted parabola. The total-pressure profile follows one representative path from the fan discharge to a fixed-pressure boundary. Select a fan on the drawing first.":"La courbe ventilateur/réseau maintient le débit à travers le ventilateur sélectionné à chacune de 33 valeurs et résout l'ensemble du réseau pour chacune, de sorte que la courbe de réseau est la résistance propre du réseau, et non une parabole ajustée. Le profil de pression totale suit un trajet représentatif depuis le refoulement du ventilateur jusqu'à une limite à pression fixe. Sélectionnez d'abord un ventilateur sur le dessin.","The hardest-working ducts are re-sectioned to circular ducts from the EN 1506 / ISO 6580 nominal catalogue and every combination is solved. The ranking is specific air power — air power per m³/s actually delivered — because raw dp·Q rewards choking the duct: the fan sits on a curve, so a smaller duct moves the operating point back and the product falls while the building gets less air.":"Les conduits les plus sollicités sont reconvertis en conduits circulaires du catalogue nominal EN 1506 / ISO 6580 et chaque combinaison est résolue. Le classement se fait par puissance aéraulique spécifique — puissance aéraulique par m³/s réellement livré — car le dp·Q brut récompense l'étranglement du conduit : le ventilateur se situe sur une courbe, donc un conduit plus petit recule le point de fonctionnement et le produit chute tandis que le bâtiment reçoit moins d'air.","The hourly VAV profile needs exactly 24 finite, non-negative multipliers.":"Le profil VAV horaire a besoin d'exactement 24 multiplicateurs finis et non négatifs.","The intact-network baseline case did not solve, so nothing can be compared against it.":"Le cas de référence du réseau intact ne s'est pas résolu, rien ne peut donc être comparé à lui.","The load profile reports fan energy; this network has no fan.":"Le profil de charge rapporte l'énergie du ventilateur ; ce réseau n'a pas de ventilateur.","The network document":"Le document réseau","The profile also drives the global fan-speed factor, clamped to the tool’s own 40–120 % range.":"Le profil pilote aussi le facteur global de vitesse du ventilateur, limité à la plage propre de l'outil de 40–120 %.","The selected damper is swept from 10 % to 100 % open in 1 % steps, each step a full network solve, and its installed characteristic is compared with its own inherent law. The reported authority is the ratio dp(100 %)/dp(10 %) — an upper bound on the usual open/closed authority, because a fully shut damper makes the quadratic branch equation singular in this formulation.":"Le registre sélectionné est balayé de 10 % à 100 % d'ouverture par pas de 1 %, chaque pas étant une résolution complète du réseau, et sa caractéristique installée est comparée à sa propre loi intrinsèque. L'autorité rapportée est le rapport dp(100 %)/dp(10 %) — une borne supérieure de l'autorité ouvert/fermé habituelle, car un registre entièrement fermé rend l'équation de branche quadratique singulière dans cette formulation.","The selection inspector":"L'inspecteur de sélection","The shared interface layer (diagram-ui.js) did not load. Every input, the model, the drawing, the sweeps and every export still work; the page falls back to one plain column.":"La couche d'interface partagée (diagram-ui.js) ne s'est pas chargée. Chaque saisie, le modèle, le dessin, les balayages et chaque export fonctionnent toujours ; la page revient à une seule colonne simple.","The velocity limit is the value the sweeps flag against; the starvation threshold is how far a grille’s airflow may fall below its intact-network value in the N-1 screen before that contingency counts as starving a grille.":"La limite de vitesse est la valeur par rapport à laquelle les balayages signalent ; le seuil de sous-alimentation est de combien le débit d'une grille peut descendre sous sa valeur en réseau intact dans le dépistage N-1 avant que ce scénario ne compte comme sous-alimentant une grille.","There is no airflow through this damper at 100 % opening, so an installed characteristic has no meaning.":"Il n'y a aucun débit à travers ce registre à 100 % d'ouverture, une caractéristique installée n'a donc aucun sens.","This network has no ducts to size.":"Ce réseau n'a aucun conduit à dimensionner.","This sweep needs diagram-compute.classic.js: its \"":"Ce balayage nécessite diagram-compute.classic.js : son \"","Topological fallback discharge path":"Trajet de refoulement de secours topologique","Total + (ρ−ρo)gz Pa":"Total + (ρ−ρo)gz Pa","Total loss signed Pa":"Perte totale signée Pa","Total p Pa(g)":"p total Pa(rel)","Total-pressure profile":"Profil de pression totale","Two-branch supply system":"Système de soufflage à deux branches","Type":"Type","Unsupported duct-network schema version":"Version de schéma de réseau de conduits non prise en charge","Use 0 Pa for room/outdoor ambient. Demand is scaled by the global load factor; negative demand injects air.":"Utilisez 0 Pa pour une pièce ou l'ambiance extérieure. La demande est mise à l'échelle par le facteur de charge global ; une demande négative injecte de l'air.","VAV load profile":"Profil de charge VAV","VAV load profile: every node in this network has zero demand and the profile multiplier scales nodal demands only, so every hour is the same operating point and the energy figure is one point multiplied by the number of hours.":"Profil de charge VAV : chaque nœud de ce réseau a une demande nulle et le multiplicateur de profil ne met à l'échelle que les demandes nodales, donc chaque heure correspond au même point de fonctionnement et le chiffre d'énergie est un point multiplié par le nombre d'heures.","Velocity and velocity pressure":"Vitesse et pression dynamique","Velocity limit":"Limite de vitesse","Velocity m/s":"Vitesse m/s","Velocity p Pa":"p dynamique Pa","W (air)":"W (air)","W per m3/s delivered":"W par m3/s livré","What this tool does":"Ce que fait cet outil","Whatever is selected on the drawing is edited here. Every edit throws the current solution away — the results dim and say so — because the answer belonged to the network as it was.":"Tout ce qui est sélectionné sur le dessin est modifié ici. Chaque modification abandonne la solution actuelle — les résultats s'estompent et l'indiquent — car la réponse appartenait au réseau tel qu'il était.","Where the arithmetic runs":"Où s'exécute le calcul","Width":"Largeur","Worst drop %":"Pire chute %","a Worker case was checked against the same case solved on the main thread before any sweep was offered":"un cas Worker a été vérifié par rapport au même cas résolu sur le thread principal avant même qu'un balayage ne soit proposé","a design-point pressure-drop law scaled by opening; auto-balance changes opening, not the rated characteristic.":"une loi de perte de charge au point de conception mise à l'échelle par l'ouverture ; l'équilibrage automatique modifie l'ouverture, pas la caractéristique nominale.","a user-supplied local-loss coefficient K applied to that arm; represent a multi-port junction by a node and one fitting edge per arm that needs an explicit K.":"un coefficient de perte singulière K fourni par l'utilisateur, appliqué à ce bras ; représentez une jonction à plusieurs voies par un nœud et une arête de raccord par bras nécessitant un K explicite.","and 5·10":"et 5·10","arithmetic, and that rule is what governs on a platform whose libm rounds differently.":"calcul, et c'est cette règle qui prévaut sur une plateforme dont la libm arrondit différemment.","at opening limit:":"à la limite d'ouverture :","cancelled by the user":"annulé par l'utilisateur","cancelling…":"annulation…","catalogue sizes tried)":"tailles catalogue testées)","central-difference Jacobian, the damped line search and the linear solve are all the":"jacobien aux différences centrées, la recherche linéaire amortie et la résolution linéaire sont tous les","circular or rectangular Darcy–Weisbach; 64/Re laminar, Swamee–Jain turbulent friction and ΣK local losses. Swamee–Jain is an":"Darcy–Weisbach circulaire ou rectangulaire ; 64/Re laminaire, frottement turbulent Swamee–Jain et pertes singulières ΣK. Swamee–Jain est une","cubic metres per hour":"mètres cubes par heure","damper design point":"point de conception du registre","descending quadratic curve of fan total-pressure rise from shutoff pressure and one rated point, scaled by fan affinity laws.":"courbe quadratique décroissante de l'élévation de pression totale du ventilateur depuis la pression d'arrêt et un point nominal, mise à l'échelle par les lois d'affinité du ventilateur.","diagram-compute.classic.js did not load; sweeps run on the main thread and the Monte-Carlo sweep is unavailable because its Latin-hypercube design and its quantile tallies live in the runtime":"diagram-compute.classic.js ne s'est pas chargé ; les balayages s'exécutent sur le thread principal et le balayage Monte-Carlo est indisponible car son plan d'hypercube latin et ses relevés de quantiles résident dans le moteur","diagram-compute.classic.js is absent, so the sweep ran as one blocking main-thread loop, exactly as v1 did":"diagram-compute.classic.js est absent, le balayage s'est donc exécuté comme une seule boucle bloquante sur le thread principal, exactement comme le faisait v1","dp = dp_design (Q/Q_design)^n, with the exponent n between 1 and 3 — 2 is the usual quadratic terminal. A grille here is a duct resistance only: no throw, no noise, no induction.":"dp = dp_design (Q/Q_design)^n, avec l'exposant n compris entre 1 et 3 — 2 est la valeur quadratique habituelle. Une grille n'est ici qu'une résistance de conduit : pas de portée, pas de bruit, pas d'induction.","duct network: the interface layer failed to start":"réseau de conduits : la couche d'interface n'a pas pu démarrer","equal %":"égal %","equal percentage":"pourcentage égal","every case was evaluated in index order on one thread, each from a cold start":"chaque cas a été évalué dans l'ordre des index sur un seul thread, chacun depuis un démarrage à froid","explicit approximation":"approximation explicite","fan rated point":"point nominal du ventilateur","gate then bounds the result at roughly 1e-7 relative.":"seuil borne alors le résultat à environ 1e-7 relatif.","grille design point":"point de conception de la grille","halts at a scaled residual of 2e-9, worth about 1e-7 relative) rather than by the":"s'arrête à un résidu mis à l'échelle de 2e-9, soit environ 1e-7 relatif) plutôt que par le","kW (air)":"kW (air)","kWh (air power dp*Q; no fan, motor or drive efficiency)":"kWh (puissance aéraulique dp*Q ; sans rendement du ventilateur, du moteur ni de l'entraînement)","laminar friction":"frottement laminaire","main thread":"thread principal","m³/h, all fans":"m³/h, tous les ventilateurs","no Worker pool could be created (":"aucun pool de Workers n'a pu être créé (","no result":"aucun résultat","no runtime; one blocking main-thread loop":"pas de moteur ; une boucle bloquante sur le thread principal","no sweep has run yet; the interactive solve is always on the main thread":"aucun balayage n'a encore été exécuté ; la résolution interactive est toujours sur le thread principal","no sweep run":"aucun balayage exécuté","none (diagram-compute.classic.js absent)":"aucun (diagram-compute.classic.js absent)","none: every recorded output reproduces bit for bit on this platform. What could":"aucun : chaque sortie enregistrée se reproduit bit à bit sur cette plateforme. Ce qui pourrait","operating point":"point de fonctionnement","p total [Pa]":"p total [Pa]","path taken here is the path the page took.":"chemin emprunté ici est le chemin qu'a suivi la page.","preliminary assessment":"évaluation préliminaire","round duct finite loss":"perte finie du conduit circulaire","s generic verbs are replaced by this tool":"verbes génériques sont remplacés par cet outil","s page-level unit system defaults to":"système d'unités au niveau de la page revient par défaut à","s primary action for a compute:":"action principale pour un calcul :","steps either side":"pas de chaque côté","still separate the two is a C library whose exp/log/pow round differently in the last":"sépare encore les deux est une bibliothèque C dont exp/log/pow arrondissent différemment sur le dernier","tap target >= 44 px below md":"cible tactile >= 44 px sous md","technical exploration":"exploration technique","tee K loss":"perte K du té","the Worker case failed:":"le cas Worker a échoué :","the Worker path did not reproduce the main-thread solve (":"le trajet Worker n'a pas reproduit la résolution du thread principal (","the Worker path failed during this sweep (":"le trajet Worker a échoué pendant ce balayage (","the complete steady-state network solve of this page for the network currently on the canvas: the same continuity and energy equations, the same duct/tee/damper/grille/fan component laws, and the same damped Newton iteration on scaled residuals. Charts, auto-balancing and the pressure-path search are not part of the export.":"la résolution stationnaire complète du réseau de cette page pour le réseau actuellement sur le canevas : les mêmes équations de continuité et d'énergie, les mêmes lois de composant conduit/té/registre/grille/ventilateur, et la même itération de Newton amortie sur les résidus mis à l'échelle. Les graphiques, l'équilibrage automatique et la recherche de trajet de pression ne font pas partie de l'export.","the damper is not in this network snapshot":"le registre n'est pas dans cet instantané de réseau","the network on the canvas is not solvable, so no comparison was possible":"le réseau sur le canevas n'est pas soluble, aucune comparaison n'était donc possible","the shared runtime failed to start (":"le moteur partagé n'a pas pu démarrer (","the shared runtime is loaded; sweeps run on the main thread":"le moteur partagé est chargé ; les balayages s'exécutent sur le thread principal","this browser exposes no Worker; sweeps run on the main thread":"ce navigateur n'expose aucun Worker ; les balayages s'exécutent sur le thread principal","to Colebrook–White, published for 10":"à Colebrook–White, publiée pour 10","unknown sweep case kind:":"type de cas de balayage inconnu :","unrecognised duct-network state payload":"données d'état de réseau de conduits non reconnues","v2 build: the steady-state solve recorded above is the v1 tool’s solver unchanged — same residual assembly, same central-difference Jacobian, same dense Gauss-Jordan with partial pivoting, same damped Newton line search, same 600-unknown ceiling. What this build adds is repeated solves (fan/system curve, damper authority, N-1 branch blockage, Monte-Carlo, VAV load profile, duct sizing) on the shared compute runtime diagram-compute.classic.js. Damper auto-balancing is sequential by construction and was deliberately left on the main thread.":"Build v2 : la résolution stationnaire enregistrée ci-dessus est le solveur inchangé de l'outil v1 — même assemblage du résidu, même jacobien aux différences centrées, même Gauss-Jordan dense à pivotage partiel, même recherche linéaire de Newton amortie, même plafond de 600 inconnues. Ce que cette build ajoute, ce sont des résolutions répétées (courbe ventilateur/réseau, autorité des registres, blocage de branche N-1, Monte-Carlo, profil de charge VAV, dimensionnement des conduits) sur le moteur de calcul partagé diagram-compute.classic.js. L'équilibrage automatique des registres est séquentiel par construction et a été délibérément laissé sur le thread principal.","worst relative difference":"pire écart relatif","· design":"· conception","Δp at design flow, 100 %":"Δp au débit de conception, 100 %","Δp damper Pa":"Δp registre Pa","Δp nodes [Pa]":"Δp nœuds [Pa]","— THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY":"— LA BORNE DE PRÉCISION EST NULLE POUR AU MOINS UN RELEVÉ","Duct Network Solver":"Solveur de réseau aéraulique","Draw arbitrary duct networks with circular or rectangular ducts, junction and tee-loss arms, grilles, dampers and fans.":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs.","Draw arbitrary duct networks with circular or rectangular ducts, junction and tee-loss arms, grilles, dampers and fans. Solve steady airflow and pressure drops, plot the fan/system curve with operating point, balance dampers to target flows, and explore partial-load operation.":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs. Calculez les débits et pertes de charge stationnaires, la courbe ventilateur/réseau et son point de fonctionnement, l’équilibrage des registres et la charge partielle.","Duct Network Solver (v2) — tools.petrov.re":"Solveur de réseau aéraulique (v2) — tools.petrov.re","Teken willekeurige netwerken met ronde of rechthoekige luchtkanalen, aftakkingen/T-stukverliesarmen, roosters, kleppen en ventilatoren. Bereken stationaire debieten en drukverliezen, ventilator- en systeemcurve met werkpunt, klepbalancering en deellastbedrijf.":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs. Calculez les débits et pertes de charge stationnaires, la courbe ventilateur/réseau et son point de fonctionnement, l’équilibrage des registres et la charge partielle.","Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs.":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs.","Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs. Calculez les débits et pertes de charge stationnaires, la courbe ventilateur/réseau et son point de fonctionnement, l’équilibrage des registres et la charge partielle.":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs. Calculez les débits et pertes de charge stationnaires, la courbe ventilateur/réseau et son point de fonctionnement, l’équilibrage des registres et la charge partielle.","Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores.":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs.","Dibuje redes arbitrarias de conductos circulares o rectangulares con uniones, brazos de tes, rejillas, compuertas y ventiladores. Calcula caudales y pérdidas de presión estacionarios, curva ventilador/sistema con punto de trabajo, equilibrado de compuertas y funcionamiento a carga parcial.":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs. Calculez les débits et pertes de charge stationnaires, la courbe ventilateur/réseau et son point de fonctionnement, l’équilibrage des registres et la charge partielle.","Narysuj dowolne sieci kanałów z kanałami okrągłymi lub prostokątnymi, ramionami przyłączeniowymi i trójnikowymi, kratkami, przepustnicami i wentylatorami.":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs.","Narysuj dowolne sieci kanałów z kanałami okrągłymi lub prostokątnymi, ramionami rozdzielającymi i trójnikowymi, kratkami wentylacyjnymi, przepustnicami i wentylatorami. Oblicz ustalony strumień powietrza i spadki ciśnienia, wykreśl krzywą wentylatora/systemu z punktem pracy, zrównoważ przepustnice do docelowych przepływów i zbadaj pracę przy częściowym obciążeniu.":"Dessinez un réseau quelconque de conduits circulaires ou rectangulaires avec jonctions, bras de té, grilles, registres et ventilateurs. Calculez les débits et pertes de charge stationnaires, la courbe ventilateur/réseau et son point de fonctionnement, l’équilibrage des registres et la charge partielle.","Fan":"Ventilateur","fan":"ventilateur","duct":"conduit","damper":"registre","grille":"grille","tee":"té","free":"libre","Steady solve:":"Calcul stationnaire :","System":"Réseau","idle":"inactif","removes the selection.":"supprime la sélection.","Grille Δp σ (lognormal)":"Δp des grilles σ (lognormale)","Run Monte-Carlo":"Exécuter le Monte-Carlo","linear":"linéaire","Duct Network Solver (v2)":"Calcul de réseau de conduits (v2)","Audited build 2026-08-09. Steady-state, incompressible and single-phase. Fluid properties are constant. Grilles are duct resistances only. Fan curves use shutoff pressure plus one rated point; reverse flow and operation beyond zero-head runout are extrapolations and are warned. Automatic balancing is an iterative damper-opening heuristic and cannot guarantee coupled or infeasible targets. The total-pressure profile follows one representative airflow path. Generic junction nodes have no unique cross-section, so static pressure is not recovered there; component velocity and velocity pressure are reported separately. Tee/fitting K values are inputs; they are not derived from ASHRAE/Idelchik geometry or split ratios. The dense browser solver refuses models above 600 nonlinear unknowns. No duct leakage, compressibility, acoustics, smoke transport, fan-efficiency map, stall/surge model, or transient control model is included.":"Version auditée 2026-08-09. Stationnaire, incompressible et monophasique. Les propriétés du fluide sont constantes. Les grilles ne sont que des résistances du réseau. Les courbes de ventilateur utilisent la pression à débit nul et un point nominal ; le débit inverse et le fonctionnement au-delà du point à hauteur nulle sont des extrapolations et sont signalés. L’équilibrage automatique est une heuristique itérative sur l’ouverture des registres et ne peut garantir des cibles couplées ou inatteignables. Le profil de pression totale suit un chemin d’écoulement représentatif. Les nœuds de jonction génériques n’ont pas de section unique, la pression statique n’y est donc pas déterminée ; la vitesse et la pression dynamique sont données par composant. Les valeurs K des tés et raccords sont des données d’entrée ; elles ne sont pas déduites de la géométrie ASHRAE/Idelchik ni des rapports de partage. Le solveur dense du navigateur refuse les modèles de plus de 600 inconnues non linéaires. Fuites, compressibilité, acoustique, transport de fumées, carte de rendement du ventilateur, modèle de pompage/décrochage et régulation transitoire ne sont pas inclus."};
const siteLang=()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q&&String(q).slice(0,2).toLowerCase()==='fr')return'fr'}catch(e){}try{if(localStorage.getItem('diagram_site_lang')==='fr'||localStorage.getItem('diagram_lang')==='fr')return'fr'}catch(e){}return String(window.__diagramLang||'').slice(0,2).toLowerCase()};
if(siteLang()!=='fr')return;
const setLang=()=>{if(window.Diagram&&typeof Diagram.setDocumentLang==='function')Diagram.setDocumentLang('fr');else if(document.documentElement.lang!=='fr')document.documentElement.lang='fr'};setLang();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setLang,{once:true});
const attrs=['placeholder','title','aria-label','alt'];
function tr(s){if(s==null)return s;const x=String(s);if(Object.prototype.hasOwnProperty.call(FR,x))return FR[x];const a=x.match(/^\s*/)[0],b=x.match(/\s*$/)[0],t=x.trim();if(Object.prototype.hasOwnProperty.call(FR,t))return a+FR[t]+b;const pz=t&&window.__dnPatterns?window.__dnPatterns.translate('fr',t,FR):null;if(pz!=null)return a+pz+b;const lw=window.DiagramUI&&DiagramUI.current&&typeof DiagramUI.current.t==='function'?DiagramUI.current.t('learn'):null;if(lw&&t.indexOf(lw+': ')===0){const k=t.slice(lw.length+2);if(Object.prototype.hasOwnProperty.call(FR,k))return a+lw+': '+FR[k]+b}return x}
function node(n){if(!n)return;if(n.nodeType===3){const p=n.parentElement;if(p&&!/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(p.tagName)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1)return;if(/^(SCRIPT|STYLE|NOSCRIPT)$/i.test(n.tagName))return;for(const a of attrs)if(n.hasAttribute(a)){const v=n.getAttribute(a),w=tr(v);if(w!==v)n.setAttribute(a,w)}if(n.tagName==='INPUT'&&/^(button|submit|reset)$/i.test(n.type||'')){const v=n.value,w=tr(v);if(w!==v)n.value=w}const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let q;while(q=tw.nextNode())node(q);for(const e of n.querySelectorAll('*'))for(const a of attrs)if(e.hasAttribute(a)){const v=e.getAttribute(a),w=tr(v);if(w!==v)e.setAttribute(a,w)}}
const run=()=>{node(document.body);const tt=document.querySelector('title');if(tt)node(tt)};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')node(m.target);else if(m.type==='attributes'){const el=m.target,v=el.getAttribute(m.attributeName),w=tr(v);if(v!=null&&w!==v)el.setAttribute(m.attributeName,w)}else for(const n of m.addedNodes)node(n)}}).observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:attrs});
})();
