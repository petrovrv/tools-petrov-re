  speed:{title:'Global fan-speed factor',body:'Multiplies the local speed of every fan, and enters the fan curve squared through the affinity law dp ~ n². The model is stated for 40 to 120 %; the VAV load profile clamps its own fan tracking to the same range.'},
  boundary:{title:'Fixed-pressure boundary',body:'A fixed-pressure node fixes gauge total pressure at a low-velocity boundary — normally 0 Pa for a room or the outdoors. At least one is needed in every connected part of the network, otherwise the pressure level is undetermined and the solve is refused.'},
  demand:{title:'Nodal demand',body:'Positive demand removes airflow from the network at that node, negative demand injects it. It is scaled by the partial-load factor. A network with no demand at all is driven only by its fans and its boundary pressures.'},
  elevation:{title:'Elevation',body:'Node pressures are gauge pressures relative to the outdoor air at the elevation of the node. The energy balance carries the hydrostatic term (rho − rho_out) g z, and the outdoor density rho_out equals the air density entered here, so the term is zero and elevation changes no airflow or pressure. Buoyancy and stack effect from temperature-dependent density are not modelled, so a tall riser carrying warm air is not represented by raising its nodes.'},
  duct:{title:'Ducts',body:'Circular or rectangular Darcy–Weisbach: 64/Re below Re 2000, the Swamee–Jain explicit approximation above Re 4000, and a smoothstep blend between. Swamee–Jain is published for 10⁻⁶ ≤ eps/Dh ≤ 10⁻² and 5×10³ ≤ Re ≤ 10⁸; over that box it differs from the Colebrook root by up to about 3 % in f, and by more outside it. Ducts running outside the published box are listed as a warning after each solve. Roughness is the absolute wall roughness in millimetres; ΣK collects the local losses on that run.'},
  tee:{title:'Tee and fitting arms',body:'A tee arm is a user-supplied local-loss coefficient K applied to that arm only, with no friction term. Represent a multi-port junction as one node plus one fitting edge per arm that needs an explicit K. The K values are inputs: they are not derived from ASHRAE or Idelchik geometry, and not from the split ratio.'},
  damper:{title:'Dampers',body:'A design-point pressure drop scaled by opening: dp = dp_design (q/q_design)² / c², with c = o for the linear conductance law and c = 50^(o−1) for equal percentage, where o is the opening as a fraction. Auto-balance changes the opening, never the rated characteristic. Set a balance target flow to include a damper in auto-balancing.'},
  grille:{title:'Grilles',body:'dp = dp_design (Q/Q_design)^n, with the exponent n between 1 and 3 — 2 is the usual quadratic terminal. A grille here is a duct resistance only: no throw, no noise, no induction.'},
  fan:{title:'Fans',body:'A descending quadratic curve of fan total-pressure rise through the shutoff pressure and one rated point, scaled by the affinity laws with the local and global speed factors. The solver adds this rise to the gauge total pressure of the airflow, so the curve must be on the fan total-pressure basis; a catalogue static-pressure curve needs the fan outlet velocity pressure added before entry. Rated pressure must be below shutoff pressure. Reverse flow and operation beyond the zero-head runout are extrapolations of that quadratic and are warned after the solve.'},

  velocity:{title:'Velocity and velocity pressure',body:'Component velocity is the airflow divided by the flow area, and velocity pressure is ½ rho v². Generic junction nodes have no unique cross-section, so static pressure is not recovered at a node: velocity and velocity pressure are reported per component instead. The velocity limit in Screening limits is what the N-1, profile and sizing sweeps compare against.'},

function dgcNetDoc(){
  return{schema:SCHEMA,
    air:{rho:Number(UIS.rho),nu:Number(UIS.nu)},
    analysis:{loadFactor:Number(UIS.loadFactor),speedFactor:Number(UIS.speedFactor)},
    nodes:state.nodes,edges:state.edges};
}
function dgcApplyDoc(doc){
  const c=normalizeImport(doc);
  state.nodes=c.nodes;state.edges=c.edges;
  UIS.rho=c.fluid.rho;UIS.nu=c.fluid.nu;
  UIS.loadFactor=c.loadFactor;UIS.speedFactor=c.speedFactor;
  state.seqN=1+Math.max(0,...state.nodes.map(n=>parseInt(String(n.id).match(/\d+$/)?.[0]||0)));
  state.seqE=1+Math.max(0,...state.edges.map(e=>parseInt(String(e.id).match(/\d+$/)?.[0]||0)));
  state.selected=null;fitView();invalidate();renderProps();
}
function dgcSerialize(){return{v:1,net:dgcNetDoc(),sel:state.selected}}
function dgcDeserialize(st){
  if(!st||typeof st!=='object'||!st.net)throw Error('unrecognised duct-network state payload');
  dgcApplyDoc(st.net);
  if(st.sel&&st.sel.kind)state.selected=st.sel;
  solveAndShow();renderProps();
}
function dgcRecord(){
  if(!state.sol)return null;
  const fl=getFluid(),sol=state.sol,inputs={},outputs={},units={};
  inputs.air_density=fl.rho;units.air_density='kg/m3';
  inputs.kinematic_viscosity=fl.nu;units.kinematic_viscosity='m2/s';
  inputs.partial_load_factor=fl.load;units.partial_load_factor='-';
  inputs.fan_speed_factor=fl.speed;units.fan_speed_factor='-';
  inputs.nodes=state.nodes.length;units.nodes='-';
  inputs.fixed_pressure_nodes=state.nodes.filter(n=>n.fixed).length;units.fixed_pressure_nodes='-';
  inputs.components=state.edges.length;units.components='-';
  inputs.nonlinear_unknowns=state.edges.length+state.nodes.filter(n=>!n.fixed).length;units.nonlinear_unknowns='-';
  for(const n of state.nodes){
    inputs['node_'+n.id+'_elevation']=n.z;units['node_'+n.id+'_elevation']='m';
    inputs['node_'+n.id+'_demand']=n.demand;units['node_'+n.id+'_demand']='m3/h';
    if(n.fixed){inputs['node_'+n.id+'_fixed_total_pressure']=n.p;units['node_'+n.id+'_fixed_total_pressure']='Pa (gauge)';}
  }
  const geo=e=>{inputs['component_'+e.id+'_section']=e.shape;units['component_'+e.id+'_section']='';
    if(e.shape==='round'){inputs['component_'+e.id+'_diameter']=e.D;units['component_'+e.id+'_diameter']='mm';}
    else{inputs['component_'+e.id+'_width']=e.W;units['component_'+e.id+'_width']='mm';
         inputs['component_'+e.id+'_height']=e.H;units['component_'+e.id+'_height']='mm';}};
  for(const e of state.edges){
    inputs['component_'+e.id+'_type']=e.type;units['component_'+e.id+'_type']='';
    if(e.type==='duct'){geo(e);inputs['component_'+e.id+'_length']=e.L;units['component_'+e.id+'_length']='m';
      inputs['component_'+e.id+'_roughness']=e.eps;units['component_'+e.id+'_roughness']='mm';
      inputs['component_'+e.id+'_local_K']=e.K;units['component_'+e.id+'_local_K']='-';}
    if(e.type==='tee'){geo(e);inputs['component_'+e.id+'_arm_K']=e.K;units['component_'+e.id+'_arm_K']='-';}
    if(e.type==='fan'){inputs['component_'+e.id+'_shutoff_pressure']=e.P0;units['component_'+e.id+'_shutoff_pressure']='Pa';
      inputs['component_'+e.id+'_rated_flow']=e.Qrated;units['component_'+e.id+'_rated_flow']='m3/h';
      inputs['component_'+e.id+'_rated_pressure']=e.Prated;units['component_'+e.id+'_rated_pressure']='Pa';
      inputs['component_'+e.id+'_speed']=e.speed;units['component_'+e.id+'_speed']='%';}

function dgcReportText(ctx){
 const lang=String(ctx&&((ctx.domainLang)||(ctx.lang))||'en').slice(0,2).toLowerCase();
 return DGC_REPORT_TEXT[lang]||DGC_REPORT_TEXT.en;
}
/* Composite evidence strings need the document locale because toFixed() would
   put an English decimal point beside localized report tables. Four-digit
   identifiers and years remain ungrouped; grouping starts at five digits. */
function dgcReportNumber(value,ctx,digits){
 const n=Number(value);if(!Number.isFinite(n))return'—';
 const lang=String(ctx&&((ctx.domainLang)||(ctx.lang))||'en').slice(0,2).toLowerCase();
 const dgcReportLocales={nl:'nl-BE',de:'de-DE',fr:'fr-BE',es:'es-ES',uk:'uk-UA',pl:'pl-PL',en:'en-GB'};
 return n.toLocaleString(dgcReportLocales[lang]||'en-GB',{
  useGrouping:Math.abs(n)>=1e4,maximumFractionDigits:digits==null?2:digits
 });
}
function dgcReportScientific(value,ctx){
 const n=Number(value);if(!Number.isFinite(n)||n===0)return dgcReportNumber(n,ctx,2);
 const parts=n.toExponential(2).split('e'),sup={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
 return dgcReportNumber(Number(parts[0]),ctx,2)+' × 10'+parts[1].split('').map(x=>sup[x]||x).join('');
}
function dgcReportProfile(rec,ctx){
 const t=dgcReportText(ctx),inputs=rec.inputs||{},outputs=rec.outputs||{},units=rec.units||{};
 const finite=v=>typeof v==='number'&&Number.isFinite(v),ids=[];
 for(const key of Object.keys(inputs)){
  const m=key.match(/^component_(.+)_type$/);if(m&&!ids.includes(m[1]))ids.push(m[1]);
 }
 const type=id=>inputs['component_'+id+'_type'];
 const fanIds=ids.filter(id=>type(id)==='fan'),grilleIds=ids.filter(id=>type(id)==='grille');
 const resultRows=[];
 let airPowerW=0;
 for(const id of fanIds){
  const q=outputs['flow_'+id],dp=outputs['fan_pressure_rise_'+id];
  if(finite(q)&&finite(dp))airPowerW+=Math.abs(q/3600*dp);
 }
 if(airPowerW>0)resultRows.push({label:t.results.airPower,value:airPowerW/1000,unit:'kW',note:t.notes.airPower});
 const grilleFlows=grilleIds.map(id=>Math.abs(outputs['flow_'+id])).filter(finite);
 if(grilleFlows.length>1){
  const mean=grilleFlows.reduce((a,b)=>a+b,0)/grilleFlows.length;
  if(mean>0)resultRows.push({label:t.results.terminalSpread,value:(Math.max(...grilleFlows)-Math.min(...grilleFlows))/mean*100,unit:'%',note:t.notes.terminalSpread});
 }
 const nodePressures=Object.keys(outputs).filter(k=>/^total_pressure_/.test(k)).map(k=>outputs[k]).filter(finite);
 if(nodePressures.length>1)resultRows.push({label:t.results.pressureSpan,value:Math.max(...nodePressures)-Math.min(...nodePressures),unit:'Pa',note:t.notes.pressureSpan});

 const convergenceText=(rec.warnings||[]).find(x=>/^(Converged|Stopped at)/.test(String(x)))||'';
 const iterationMatch=convergenceText.match(/(?:Converged in|Stopped at the)\s+(\d+)/i);
 const residualMatch=convergenceText.match(/(?:scaled residual of|reached)\s+([0-9]+(?:\.[0-9]+)?(?:e[+\-]?[0-9]+)?)/i);
 const iterations=iterationMatch?Number(iterationMatch[1]):null,residual=residualMatch?Number(residualMatch[1]):null;
 if(finite(iterations))resultRows.push({label:t.results.iterations,value:iterations,unit:'-'});

 /* The detailed steady-state outputs are already printed by dgcSections().
    Only sweep outputs absent from those tables are added here. */
 const steady=/^(?:flow|pressure_loss|fan_pressure_rise|velocity|total_pressure|potential)_/;
 for(const key of Object.keys(outputs)){
  if(steady.test(key)||outputs[key]==null)continue;
  const label=ctx&&ctx.label?ctx.label(key,units[key]||''):key.replace(/_/g,' ');
  if(finite(outputs[key]))resultRows.push({label,value:outputs[key],unit:units[key]||''});
  else resultRows.push({label,text:String(outputs[key])});
 }

 const checks=[];
 if(finite(residual))checks.push({
  status:!/^(Stopped at)/.test(convergenceText)&&residual<=2e-9?'pass':'fail',
  title:t.checks.convergenceTitle,detail:t.checks.convergenceDetail,
  actual:t.checks.residualActual+': '+dgcReportScientific(residual,ctx),
  criterion:t.checks.residualCriterion,basis:'Tool stopping rule'
 });
 let minimumRunoutReserve=Infinity;
 for(const id of fanIds){
  const p0=inputs['component_'+id+'_shutoff_pressure'],pr=inputs['component_'+id+'_rated_pressure'],qr=inputs['component_'+id+'_rated_flow'];
  const local=inputs['component_'+id+'_speed']/100,global=inputs.fan_speed_factor,q=Math.abs(outputs['flow_'+id]);
  if(!(finite(p0)&&finite(pr)&&finite(qr)&&finite(local)&&finite(global)&&finite(q)&&p0>pr&&qr>0))continue;
  const runout=Math.sqrt(p0*Math.pow(local*global,2)/((p0-pr)/Math.pow(qr/3600,2)))*3600;
  if(runout>0)minimumRunoutReserve=Math.min(minimumRunoutReserve,(runout-q)/runout*100);
 }
 if(Number.isFinite(minimumRunoutReserve))checks.push({
  status:minimumRunoutReserve>=0?'pass':'attention',title:t.checks.fanDomainTitle,
  detail:t.checks.fanDomainDetail,
  actual:t.checks.fanReserveActual+': '+dgcReportNumber(minimumRunoutReserve,ctx,1)+' %',
  criterion:t.checks.fanReserveCriterion,basis:'Two-point quadratic fan model'
 });
 const reverseCount=ids.filter(id=>finite(outputs['flow_'+id])&&outputs['flow_'+id]<0).length;
 checks.push({status:reverseCount===0?'pass':'attention',title:t.checks.reverseTitle,
  detail:t.checks.reverseDetail,actual:t.checks.reverseActual+': '+dgcReportNumber(reverseCount,ctx,0),
  criterion:t.checks.reverseCriterion,basis:'Declared positive component direction'});
 const closureText=(rec.warnings||[]).find(x=>/^Max nodal continuity residual/.test(String(x)));
 if(closureText){
  const closure=String(closureText).match(/residual\s+([0-9.e+\-]+)\s+m3\/h;\s+max component energy residual\s+([0-9.e+\-]+)\s+Pa/i);
  const detail=closure
   ?t.checks.continuityActual+': '+dgcReportScientific(Number(closure[1]),ctx)+' m³/h; '+t.checks.energyActual+': '+dgcReportScientific(Number(closure[2]),ctx)+' Pa.'
   :String(closureText);
  checks.push({status:'info',title:t.checks.closureTitle,detail});
 }
 const applicability=(rec.warnings||[]).filter(x=>x!==convergenceText&&x!==closureText);
 for(const warning of applicability)checks.push({status:'attention',title:t.checks.warningTitle,
  detail:String(warning),actual:t.checks.warningActual,criterion:t.checks.warningCriterion,
  basis:'Declared model validity ranges'});

 const decisions=[];
 for(const kind of ['duct','fan','damper','grille','tee']){
  if(ids.some(id=>type(id)===kind))decisions.push(t.decisions[kind]);
 }

 const annex=[],used=new Set();
 const add=(key,label,group)=>{
  if(!Object.prototype.hasOwnProperty.call(inputs,key)||used.has(key))return;
  let value=inputs[key];
  if(typeof value==='string'&&Object.prototype.hasOwnProperty.call(t.values,value))value=t.values[value];
  annex.push({label,value,unit:units[key]||'',group});used.add(key);
 };
 for(const key of ['air_density','kinematic_viscosity'])add(key,t.base[key],t.groups.air);
 for(const key of ['partial_load_factor','fan_speed_factor'])add(key,t.base[key],t.groups.state);
 for(const key of ['nodes','fixed_pressure_nodes','components','nonlinear_unknowns'])add(key,t.base[key],t.groups.topology);
 const nodeProps=['fixed_total_pressure','elevation','demand'];
 for(const key of Object.keys(inputs)){
  const m=key.match(/^node_(.+)_(fixed_total_pressure|elevation|demand)$/);if(!m)continue;
  add(key,m[1]+' · '+t.node[m[2]],t.groups.nodes);
 }
 const componentProps=['shutoff_pressure','rated_pressure','rated_flow','design_flow','design_dp','local_K','arm_K','diameter','roughness','opening','section','height','length','exponent','speed','width','law','type'];
 for(const id of ids){
  const kind=type(id),kindLabel=t.values[kind]||kind||'';
  for(const prop of componentProps)add('component_'+id+'_'+prop,id+' · '+kindLabel+' · '+(t.component[prop]||prop),t.groups.components);
 }
 for(const key of Object.keys(inputs)){
  if(used.has(key))continue;
  const label=ctx&&ctx.label?ctx.label(key,units[key]||''):key.replace(/_/g,' ');
  add(key,label,t.groups.analyses);
 }

 const systemFigure=ctx&&ctx.figure?ctx.figure('#canvas',{caption:t.diagramCaption}):null;
 const figures=[];
 if(ctx&&ctx.figure){
  for(const item of [['#curveChart',t.curveCaption],['#hglChart',t.pressureCaption],['#authorityChart',t.authorityCaption]]){
   const figure=ctx.figure(item[0],{caption:item[1]});if(figure)figures.push(figure);
  }
 }
 return{
  title:t.title,
  executive:{text:t.summary,results:resultRows.slice(0,3),conclusion:''},
  system:{text:[t.systemText],figure:systemFigure,flow:[]},
  results:resultRows,
  decisions,
  checks,
  risks:[],
  questions:t.questions,
  figures,
  method:{
   equations:rec.model&&rec.model.equations||[],
   ranges:rec.model&&rec.model.ranges||[],
   notes:rec.model&&rec.model.notes||[],
   references:t.references
  },
  inputs:annex
 };
}

function dgcHandoff(){
  const fl=getFluid(),q={rho:{value:fl.rho,unit:'kg/m3'}};
  const sel=state.selected?.kind==='edge'?edgeById(state.selected.id):null;
  if(sel&&sel.type==='duct'){
    const g=areaDh(sel);
    q.D={value:g.Dh,unit:'m'};
    q.L={value:sel.L,unit:'m'};
    if(state.sol){const r=state.sol.edge[sel.id];
      q.Vdot={value:Math.abs(r.q),unit:'m3/s'};
      if(Number.isFinite(r.Re))q.Re={value:r.Re,unit:'-'};
      if(Number.isFinite(r.f))q.f_darcy={value:r.f,unit:'-'};
      q.dp={value:Math.abs(r.loss)*fl.rho*G,unit:'Pa'};}
  }
  return{quantities:q};
}
function dgcApplyHandoff(payload){
  const q=(payload&&payload.quantities)||{},accepted=[],ignored=[];
  const sel=state.selected?.kind==='edge'?edgeById(state.selected.id):null;
  for(const k of Object.keys(q)){
    const v=q[k]&&q[k].value;
    if(typeof v!=='number'||!isFinite(v)){ignored.push(k);continue}
    if(k==='rho'&&v>=0.2&&v<=2){UIS.rho=v;accepted.push(k)}
    else if(k==='D'&&v>0&&sel&&(sel.type==='duct'||sel.type==='tee')){sel.shape='round';sel.D=v*1000;accepted.push(k)}
    else if(k==='L'&&v>0&&sel&&sel.type==='duct'){sel.L=v;accepted.push(k)}
    else ignored.push(k);
  }
  if(accepted.length){invalidate();renderProps();
    toast('Received '+accepted.join(', ')+(ignored.length?'; ignored '+ignored.join(', '):'')+'. Press Solve network.');}
  else if(ignored.length)toast('Ignored '+ignored.join(', ')+': nothing in this payload maps onto the current selection.');
  return{accepted,ignored};
}

NODES = {n["id"]: n for n in NETWORK["nodes"]}

FI = {n["id"]: k for k, n in enumerate(FREE)}
NE, NF = len(EDGES), len(FREE)


def darcy_f(Re, rel):
    """64/Re laminar, Swamee-Jain turbulent, smoothstep blend over 2000..4000."""
    if not Re > 0:
        return 0.0
    if Re <= 2000:
        return 64.0 / Re
    turb = 0.25 / math.log10(rel / 3.7 + 5.74 / Re ** 0.9) ** 2
    if Re >= 4000:
        return turb
    lam = 64.0 / Re
    t = (Re - 2000.0) / 2000.0
    s = t * t * (3 - 2 * t)
    return lam * (1 - s) + turb * s


def area_dh(e):
    if e.get("shape") == "round":
        D = e["D"] / 1000.0
        return math.pi * D * D / 4, D
    W, H = e["W"] / 1000.0, e["H"] / 1000.0
    return W * H, 2 * W * H / (W + H)


def opening_factor(e):
    o = min(1.0, max(0.001, e["opening"] / 100.0))
    return 50.0 ** (o - 1) if e.get("law") == "equal" else o


def edge_physics(e, q):
    """Returns (signed loss [m of air], fan head [m of air], velocity, Re, f)."""
    aq = abs(q)
    loss = 0.0
    fan = 0.0
    vel = float("nan")
    Re = float("nan")
    f = float("nan")
    if e["type"] in ("duct", "tee"):
        A, Dh = area_dh(e)
        vel = aq / A
        Re = vel * Dh / AIR["nu"]
        if e["type"] == "duct":
            f = darcy_f(Re, e["eps"] / 1000.0 / Dh)
            coeff = f * e["L"] / Dh + e["K"]
        else:
            coeff = e["K"]
        loss = coeff * vel * vel / (2 * G)
    elif e["type"] == "damper":
        c = opening_factor(e)
        loss = (e["dpDesign"] / (AIR["rho"] * G)) * (aq / (e["Qdesign"] / 3600.0)) ** 2 / (c * c)
    elif e["type"] == "grille":
        loss = (e["dpDesign"] / (AIR["rho"] * G)) * (aq / (e["Qdesign"] / 3600.0)) ** e["n"]
    elif e["type"] == "fan":
        qr = e["Qrated"] / 3600.0
        a = (e["P0"] - e["Prated"]) / (qr * qr)
        s = e["speed"] / 100.0 * AIR["speed"]
        fan = (e["P0"] * s * s - a * q * abs(q)) / (AIR["rho"] * G)
    return (0.0 if q == 0 else math.copysign(loss, q)), fan, vel, Re, f


def fixed_head(n):
    return n["p"] / (AIR["rho"] * G)


# Outdoor air density: the page has no separate input, so it equals the air density.
RHO_OUT = AIR["rho"]


def elev_head(n):
    # (rho - rho_out) g z / (rho g): node pressures are gauge relative to outdoor air at the node elevation
    return n["z"] * (AIR["rho"] - RHO_OUT) / AIR["rho"]


def _boundary_flow_scale():
    heads = [fixed_head(n) + elev_head(n) for n in NETWORK["nodes"] if n["fixed"]]
    if len(heads) < 2:
        return 0.0
    span = max(heads) - min(heads)
    if not span > 0:
        return 0.0
    q = 0.0
    for e in EDGES:
        if e["type"] == "fan":
            continue
        hi, ok = 1e-6, False
        for _ in range(80):
            if abs(edge_physics(e, hi)[0]) >= span:
                ok = True
                break
            hi *= 2
        if not ok:
            continue
        lo = 0.0
        for _ in range(80):
            mid = (lo + hi) / 2
            if abs(edge_physics(e, mid)[0]) < span:
                lo = mid
            else:
                hi = mid
        q = max(q, (lo + hi) / 2)
    return q if math.isfinite(q) else 0.0


def _scales():
    demand = [abs(n["demand"]) * AIR["load"] / 3600.0 for n in NETWORK["nodes"]]
    fans = [abs(e["Qrated"] / 3600.0 * e["speed"] / 100.0 * AIR["speed"]) for e in EDGES if e["type"] == "fan"]
    driven = max([0.0] + demand + fans)
    q_scale = max(1e-5, driven) if driven > 1e-9 else max(1e-5, _boundary_flow_scale())
    hs = [abs(fixed_head(n)) for n in NETWORK["nodes"] if n["fixed"]]
    hs += [abs(elev_head(n)) for n in NETWORK["nodes"]]
    hs += [abs(e["P0"] * (e["speed"] / 100.0 * AIR["speed"]) ** 2 / (AIR["rho"] * G)) for e in EDGES if e["type"] == "fan"]
    return q_scale, max([5.0] + hs)


def residual(v, q_scale, h_scale):
    r = [0.0] * (NF + NE)
    for k, n in enumerate(FREE):
        bal = -n["demand"] * AIR["load"] / 3600.0
        for i, e in enumerate(EDGES):
            if e["b"] == n["id"]:
                bal += v[i] * q_scale
            if e["a"] == n["id"]:
                bal -= v[i] * q_scale
        r[k] = bal / q_scale
    for i, e in enumerate(EDGES):
        a, b = NODES[e["a"]], NODES[e["b"]]
        ha = fixed_head(a) if a["fixed"] else v[NE + FI[a["id"]]] * h_scale
        hb = fixed_head(b) if b["fixed"] else v[NE + FI[b["id"]]] * h_scale
        loss, fan, _, _, _ = edge_physics(e, v[i] * q_scale)
        r[NF + i] = (ha + elev_head(a) - hb - elev_head(b) + fan - loss) / h_scale
    return r


def solve_linear(A, b):
    """Gauss-Jordan with partial pivoting — the page's own solveLinear(), ported.

    The page does not call a library for this either: it eliminates on the augmented
    matrix in place, picks the pivot by largest magnitude in the column, rejects a
    pivot below 1e-12 as singular and skips a multiplier below 1e-18. Keeping that
    routine rather than substituting a LAPACK LU is what makes this script the page's
    computation and not merely an equivalent one."""
    n = len(b)
    M = [list(A[i]) + [b[i]] for i in range(n)]
    for k in range(n):
        p = k
        for i in range(k + 1, n):
            if abs(M[i][k]) > abs(M[p][k]):
                p = i
        if not math.isfinite(M[p][k]) or abs(M[p][k]) < 1e-12:
            raise RuntimeError('Jacobian is singular')
        M[k], M[p] = M[p], M[k]
        d = M[k][k]
        for j in range(k, n + 1):
            M[k][j] /= d
        for i in range(n):
            if i == k:
                continue
            f = M[i][k]
            if abs(f) < 1e-18:
                continue
            for j in range(k, n + 1):
                M[i][j] -= f*M[k][j]
    return [M[i][n] for i in range(n)]

def compute():
    """Damped Newton on the scaled residuals, identical formulation to the page."""
    q_scale, h_scale = _scales()
    n = NE + NF
    x = [0.0] * n
    for i, e in enumerate(EDGES):
        g = max(1e-8, e["Qrated"] / 3600.0 * e["speed"] / 100.0 * AIR["speed"] * 0.6) if e["type"] == "fan" else q_scale * 0.2
        x[i] = g / q_scale
    fixed_nodes = [nd for nd in NETWORK["nodes"] if nd["fixed"]]
    avg = sum(fixed_head(nd) for nd in fixed_nodes) / len(fixed_nodes) if fixed_nodes else 0.0
    for k in range(NF):
        x[NE + k] = avg / h_scale
    r = residual(x, q_scale, h_scale)
    norm = max(abs(t) for t in r)
    it = 0
    while it < 60 and norm > 2e-9:
        J = [[0.0]*n for _ in range(n)]
        for j in range(n):
            step = 2e-6 * max(1.0, abs(x[j]))
            xp = list(x)
            xm = list(x)
            xp[j] += step
            xm[j] -= step
            rp = residual(xp, q_scale, h_scale)
            rm = residual(xm, q_scale, h_scale)
            for i in range(n):
                J[i][j] = (rp[i] - rm[i]) / (2 * step)
        dx = solve_linear(J, [-t for t in r])
        alpha, best, bx, br = 1.0, float("inf"), None, None
        for _ in range(16):
            xt = [x[i] + alpha * dx[i] for i in range(n)]
            rt = residual(xt, q_scale, h_scale)
            nt = max(abs(t) for t in rt)
            if nt < best:
                best, bx, br = nt, xt, rt
            if nt < norm * 0.985 or nt < 1e-10:
                break
            alpha *= 0.5
        x, r, norm = bx, br, best
        it += 1
    if norm > 2e-6:
        raise RuntimeError("no convergence, scaled residual %.3g" % norm)

    head = {}
    for nd in NETWORK["nodes"]:
        head[nd["id"]] = fixed_head(nd) if nd["fixed"] else x[NE + FI[nd["id"]]] * h_scale

    out = {}
    for i, e in enumerate(EDGES):
        q = x[i] * q_scale
        loss, fan, vel, Re, f = edge_physics(e, q)
        out["flow_" + e["id"]] = q * 3600.0
        out["pressure_loss_" + e["id"]] = None if e["type"] == "fan" else loss * AIR["rho"] * G
        if e["type"] == "fan":
            out["fan_pressure_rise_" + e["id"]] = fan * AIR["rho"] * G
        out["velocity_" + e["id"]] = vel if math.isfinite(vel) else None
    for nd in NETWORK["nodes"]:
        out["total_pressure_" + nd["id"]] = head[nd["id"]] * AIR["rho"] * G
        out["potential_" + nd["id"]] = (head[nd["id"]] + elev_head(nd)) * AIR["rho"] * G
    return out

odzaj przypadku analizy parametrycznej: {k}","nl":"onbekend type sweepgeval: {k}","de":"unbekannte Sweep-Fallart: {k}","fr":"type de cas de balayage inconnu : {k}","es":"tipo de caso de barrido desconocido: {k}","uk":"невідомий тип випадку розгортки: {k}"},{"en":"N-1 screen failed: {m:n}","pl":"Analiza N-1 nie powiodła się: {m}","nl":"N-1-screening mislukt: {m}","de":"N-1-Prüfung fehlgeschlagen: {m}","fr":"Le criblage N-1 a échoué : {m}","es":"El cribado N-1 ha fallado: {m}","uk":"Перевірка N-1 — помилка: {m}"},{"en":"Monte-Carlo failed: {m:n}","pl":"Analiza Monte Carlo nie powiodła się: {m}","nl":"Monte-Carlo mislukt: {m}","de":"Monte-Carlo fehlgeschlagen: {m}","fr":"Le Monte-Carlo a échoué : {m}","es":"El Monte Carlo ha fallado: {m}","uk":"Монте-Карло — помилка: {m}"},{"en":"Load profile failed: {m:n}","pl":"Profil obciążenia nie powiódł się: {m}","nl":"Belastingsprofiel mislukt: {m}","de":"Lastprofil fehlgeschlagen: {m}","fr":"Le profil de charge a échoué : {m}","es":"El perfil de carga ha fallado: {m}","uk":"Профіль навантаження — помилка: {m}"},{"en":"Duct sizing failed: {m:n}","pl":"Dobór wymiarów kanałów — błąd: {m}","nl":"Kanaaldimensionering mislukt: {m}","de":"Kanaldimensionierung fehlgeschlagen: {m}","fr":"Le dimensionnement des conduits a échoué : {m}","es":"El dimensionado de conductos ha fallado: {m}","uk":"Підбір типорозміру повітроводів — помилка: {m}"},{"en":"Transition region (2000<Re<4000), interpolated not resolved: {list}.","pl":"Strefa przejściowa (2000<Re<4000), interpolowana, nie modelowana: {list}.","nl":"Overgangsgebied (2000<Re<4000), geïnterpoleerd, niet gemodelleerd: {list}.","de":"Übergangsbereich (2000<Re<4000), interpoliert, nicht aufgelöst: {list}.","fr":"Zone de transition (2000<Re<4000), interpolée et non modélisée : {list}.","es":"Región de transición (2000<Re<4000), interpolada, no modelada: {list}.","uk":"Перехідна область (2000<Re<4000), інтерпольована, не розв’язана: {list}."},{"en":"Outside the published Swamee–Jain range (5e у потоці — з паузами між частинами, показом поступу й можливістю скасування"},{"en":"{c} cases at a measured {ms} ms each is about {tot} ms of arithmetic across {w} workers, below the {fl} ms at which a Worker round trip pays for itself on this machine, so it ran on the main thread","pl":"przypadki: {c}, po zmierzonych {ms} ms każdy, to około {tot} ms obliczeń na {w} wątkach roboczych, poniżej {fl} ms, od których przesłanie do wątku roboczego i z powrotem opłaca się na tym komputerze, więc obliczenia wykonano w wątku głównym","nl":"{c} gevallen van gemeten {ms} ms elk is ongeveer {tot} ms rekenwerk over {w} workers, onder de {fl} ms waarboven een Worker-rondreis loont op deze machine, dus liep het op de hoofdthread","de":"{c} Fälle zu gemessenen {ms} ms sind etwa {tot} ms Rechenarbeit auf {w} Workern, unter den {fl} ms, ab denen sich ein Worker-Umlauf auf diesem Rechner lohnt; daher lief es im Hauptthread","fr":"{c} cas à {ms} ms mesurés chacun représentent environ {tot} ms de calcul sur {w} workers, sous les {fl} ms à partir desquels un aller-retour Worker est rentable sur cette machine ; le calcul s’est donc fait sur le thread principal","es":"{c} casos a {ms} ms medidos cada uno son unos {tot} ms de cálculo en {w} workers, por debajo de los {fl} ms a partir de los que un viaje de ida y vuelta al Worker compensa en este equipo, así que se ejecutó en el hilo principal","uk":"{c} випадків по виміряних {ms} мс — це близько {tot} мс обчислень на {w} workers, менше за {fl} мс, з яких обмін із Worker окупається на цьому комп’ютері, тож розрахунок виконано в основному потоці"},{"en":"{c} cases at a measured {ms} ms each is about {tot} s of arithmetic across {w} workers, so it went to the Worker pool with progress and cancel","pl":"przypadki: {c}, po zmierzonych {ms} ms każdy, to około {tot} s obliczeń na {w} wątkach roboczych, więc trafiły do puli wątków roboczych z podglądem postępu i możliwością anulowania","nl":"{c} gevallen van gemeten {ms} ms elk is ongeveer {tot} s  ({err}); розгортки виконуються в основному потоці"},{"en":"the Worker path did not reproduce the main-thread solve ({reason:n}), so sweeps stay on the main thread","pl":"ścieżka wątków roboczych nie odtworzyła obliczenia z wątku głównego ({reason}), więc analizy parametryczne pozostają w wątku głównym","nl":"het Worker-pad reproduceerde de berekening op de hoofdthread niet ({reason}), dus blijven sweeps op de hoofdthread","de":"der Worker-Pfad hat die Hauptthread-Berechnung nicht reproduziert ({reason}); Sweeps bleiben im Hauptthread","fr":"le chemin Worker n’a pas reproduit le calcul du thread principal ({reason}) ; les balayages restent sur le thread principal","es":"la vía de Workers no reprodujo el cálculo del hilo principal ({reason}), así que los barridos siguen en el hilo principal","uk":"шлях Worker не відтворив розрахунок основного потоку ({reason}), тож розгортки залишаються в основному потоці"},{"en":"the shared runtime failed to start ({err}); sweeps run on the main thread and the Monte-Carlo sweep is unavailable","pl":"współdzielone środowisko wykonawcze nie uruchomiło się ({err}); analizy parametryczne działają w wątku głównym, a analiza Monte Carlo jest niedostępna","nl":"de gedeelde runtime kon niet starten ({err}); sweeps lopen op de hoofdthread en de Monte-Carlo-sweep is niet beschikbaar","de":"die gemeinsame Laufzeit konnte nicht starten ({err}); Sweeps laufen im Hauptthread, der Monte-Carlo-Sweep ist nicht verfügbar","fr":"l’environnement partagé n’a pas démarré ({err}) ; les balayages s’exécutent sur le thread principal et le balayage Monte-Carlo est indisponible","es":"el entorno compartido no pudo iniciarse ({err}); los barridos se ejecutan en el hilo principal y el barrido Monte Carlo no está disponible","uk":"спільне середовище виконання не запустилося ({err}); розгортки виконуються в основному потоці, а Монте-Карло недоступне"},{"en":"the Worker case failed: {err}","pl":"przypadek z wątku roboczego nie powiódł się: {err}","nl":"het Worker-geval mislukte: {err}","de":"der Worker-Fall ist fehlgeschlagen: {err}","fr":"le cas Worker a échoué : {err}","es":"el caso del Worker falló: {err}","uk":"випадок Worker не вдався: {err}"},{"en":"worst relative difference {x} at {k}","pl":"największa różnica względna {x} w {k}","nl":"grootste relatieve afwijking {x} bij {k}","de":"größte relative Abweichung {x} bei {k}","fr":"plus grand écart relatif {x} pour {k}","es":"mayor diferencia relativa {x} en {k}","uk":"найбільша відносна різниця {x} у {k}"},{"en":"; one Worker case was checked against the same case solved here and came back identical","pl":"; jeden przypadek z wątku roboczego porównano z tym samym przypadkiem obliczonym tutaj i wynik był identyczny","nl":"; één Worker-geval werd vergeleken met hetzelfde hier berekende geval en kwam identiek terug","de":"; ein Worker-Fall wurde mit demselben hier berechneten Fall verglichen und war identisch","fr":"; un cas Worker a été comparé au même cas calculé ici et s’est révélé identique","es":"; un caso del Worker se comparó con el mismo caso calculado aquí y resultó idéntico","uk":"; один випадок Worker порівняно з тим самим випадком, розрахованим тут, і він збігся"},{"en":"; parity check: {reason:n}","pl":"; kontrola zgodności: {reason}","nl":"; pariteitscontrole: {reason}","de":"; Paritätsprüfung: {reason}","fr":"; contrôle de parité : {reason}","es":"; comprobación de paridad: {reason}","uk":"; перевірка відповідності: {reason}"},{"en":"· {n} worker(s) ready; a sweep goes to them only when it is worth more than a round trip ({ms} ms measured)","pl":"· wątki robocze gotowe: {n}; analiza trafia do nich tylko wtedy, gdy zysk przewyższa koszt przesłania danych tam i z powrotem (zmierzono {ms} ms)","nl":"· {n} worker(s) gereed; een sweep gaat er alleen heen als dat meer oplevert dan een rondreis ({ms} ms gemeten)","de":"· {n} Worker bereit; ein Sweep geht nur dorthin, wenn er mehr bringt als ein Umlauf ({ms} ms gemessen)","fr":"· {n} worker(s) prêt(s) ; un balayage ne leur est confié que s’il rapporte plus qu’un aller-retour ({ms} ms mesurés)","es":"· {n} worker(s) listo(s); un barrido solo va a ellos cuando compensa más que un viaje de ida y vuelta ({ms} ms medidos)","uk":"· готових workers: {n}; розгортка передається їм лише тоді, коли це вигідніше за обмін ({ms} мс виміряно)"},{"en":"· diagram-compute {v}","pl":"· diagram-compute {v}","nl":"· diagram-compute {v}","de":"· diagram-compute {v}","fr":"· diagram-compute {v}","es":"· diagram-compute {v}","uk":"· diagram-compute {v}"},{"en":"Fan / system curve — {name}","pl":"Krzywa wentylatora / instalacji — {name}","nl":"Ventilator-/systeemcurve — {name}","de":"Ventilator-/Anlagenkennlinie — {name}","fr":"Courbe ventilateur/réseau — {name}","es":"Curva ventilador/sistema — {name}","uk":"Крива вентилятора / мережі — {name}"},{"en":"{n} usable points up to {q} m³/h. The chart is above. Every point is a full network solve with the fan airflow held at that value; the numbers are the v1 curve's numbers.","pl":"Użyteczne punkty: {n}, do {q} m³/h. Wykres jest powyżej. Każdy punkt to pełne obliczenie sieci z przepływem wentylatora ustalonym na tej wartości; liczby są takie same jak w krzywej v1.","nl":"{n} bruikbare punten tot {q} m³/h. De grafiek staat hierboven. Elk punt is een volledige netberekening met het ventilatordebiet op die waarde vastgehouden; de getallen zijn die van de v1-curve.","de":"{n} nutzbare Punkte bis {q} m³/h. Das Diagramm steht oben. Jeder Punkt ist eine vollständige Netzberechnung mit auf diesem Wert festgehaltenem Ventilatorvolumenstrom; die Zahlen sind die der v1-Kennlinie.","fr":"{n} points utilisables jusqu’à {q} m³/h. Le graphique est au-dessus. Chaque point est un calcul complet du réseau avec le débit du ventilateur maintenu à cette valeur ; les valeurs sont celles de la courbe v1.","es":"{n} puntos utilizables hasta {q} m³/h. El gráfico está arriba. Cada punto es un cálculo completo de la red con el caudal del ventilador fijado en ese valor; los números son los de la curva v1.","uk":"Придатних точок: {n}, до {q} м³/год. Графік вище. Кожна точка — повний розрахунок мережі з витратою вентилятора, зафіксованою на цьому значенні; числа збігаються з кривою v1."},{"en":"Damper authority — {name} (linear)","pl":"Autorytet przepustnicy — {name} (liniowa)","nl":"Smoorklepautoriteit — {name} (lineair)","de":"Klappenautorität — {name} (linear)","fr":"Autorité du registre — {name} (linéaire)","es":"Autoridad de la compuerta — {name} (lineal)","uk":"Авторитетність заслінки — {name} (лінійна)"},{"en":"Damper authority — {name} (equal percentage)","pl":"Autorytet przepustnicy — {name} (stałoprocentowa)","nl":"Smoorklepautoriteit — {name} (gelijkprocentig)","de":"Klappenautorität — {name} (gleichprozentig)","fr":"Autorité du registre — {name} (égal pourcentage)","es":"Autoridad de la compuerta — {name} (isoporcentual)","uk":"Авторитетність заслінки — {name} (рівновідсоткова)"},{"en":"Installed characteristic against the damper's own inherent law, 10–100 % in 1 % steps, each point a full network solve. Largest departure of installed from inherent: {d} of the wide-open flow. Δp across the damper: {a} Pa wide open, {b} Pa at 10 %. Authority ratio Δp(100 %)/Δp(10 %) = {r} — an upper bound on the usual open/closed authority, because the sweep stops at 10 % rather than at a shut damper, whose zero-flow quadratic makes this formulation singular. System airflow moves from {q1} to {q2} m³/h across the sweep.","pl":"Charakterystyka zabudowana w porównaniu z charakterystyką własną przepustnicy, 10–100 % co 1 %, każdy punkt to pełne obliczenie sieci. Największe odchylenie charakterystyki zabudowanej od własnej: {d} przepływu przy pełnym otwarciu. Δp na przepustnicy: {a} Pa przy pełnym otwarciu, {b} Pa przy 10 %. Stosunek autorytetu Δp(100 %)/Δp(10 %) = {r} — górne oszacowanie zwykłego autorytetu otwarta/zamknięta, ponieważ analiza kończy się na 10 %, a nie na zamkniętej przepustnicy, której kwadratowe prawo przy zerowym przepływie czyni to sformułowanie osobliwym. Przepływ w instalacji zmienia się w trakcie analizy od {q1} do {q2} m³/h.","nl":"Geïnstalleerde karakteristiek tegenover de eigen inherente wet van de klep, 10–100 % in stappen van 1 %, elk punt een volledige netberekening. Grootste afwijking van geïnstalleerd ten opzichte van inherent: {d} van het volledig open debiet. Δp over de klep: {a} Pa volledig open, {b} Pa bij 10 %. Autoriteitsverhouding Δp(100 %)/Δp(10 %) = {r} — een bovengrens voor de gebruikelijke open/dicht-autoriteit, omdat de sweep stopt bij 10 % in plaats van bij een gesloten klep, waarvan de kwadratische wet bij nuldebiet deze formulering singulier maakt. Het systeemdebiet loopt over de sweep van {q1} naar {q2} m³/h.","de":"Betriebskennlinie gegenüber der eigenen Grundkennlinie der Klappe, 10–100 % in 1-%-Schritten, jeder Punkt eine vollständige Netzberechnung. Größte Abweichung der Betriebs- von der Grundkennlinie: {d} des Volumenstroms bei voller Öffnung. Δp über der Klappe: {a} Pa voll offen, {b} Pa bei 10 %. Autoritätsverhältnis Δp(100 %)/Δp(10 %) = {r} — eine obere Schranke der üblichen Auf/Zu-Autorität, weil der Sweep bei 10 % endet statt bei geschlossener Klappe, deren quadratisches Gesetz bei Nullvolumenstrom diese Formulierung singulär macht. Der Anlagenvolumenstrom ändert sich über den Sweep von {q1} auf {q2} m³/h.","fr":"Caractéristique installée comparée à la loi intrinsèque du registre, 10–100 % par pas de 1 %, chaque point étant un calcul complet du réseau. Plus grand écart entre installée et intrinsèque : {d} du débit pleine ouverture. Δp sur le registre : {a} Pa pleine ouverture, {b} Pa à 10 %. Rapport d’autorité Δp(100 %)/Δp(10 %) = {r} — une borne supérieure de l’autorité ouvert/fermé usuelle, car le balayage s’arrête à 10 % et non à un registre fermé, dont la loi quadratique à débit nul rend cette formulation singulière. Le débit du réseau passe de {q1} à {q2} m³/h au cours du balayage.","es":"Característica instalada frente a la ley intrínseca de la compuerta, 10–100 % en pasos de 1 %, cada punto un cálculo completo de la red. Mayor desviación de la instalada respecto a la intrínseca: {d} del caudal a plena apertura. Δp en la compuerta: {a} Pa a plena apertura, {b} Pa al 10 %. Relación de autoridad Δp(100 %)/Δp(10 %) = {r} — una cota superior de la autoridad abierta/cerrada habitual, porque el barrido se detiene en el 10 % y no en una compuerta cerrada, cuya ley cuadrática a caudal nulo hace singular esta formulación. El caudal del sistema pasa de {q1} a {q2} m³/h a lo largo del barrido.","uk":"Робоча характеристика порівняно з власним законом заслінки, 10–100 % з кроком 1 %, кожна точка — повний розрахунок мережі. Найбільше відхилення робочої характеристики від власної: {d} витрати при повному відкритті. Δp на заслінці: {a} Па при повному відкритті, {b} Па при 10 %. Відношення авторитетності Δp(100 %)/Δp(10 %) = {r} — верхня межа звичайної авторитетності відкрито/закрито, бо розгортка зупиняється на 10 %, а не на закритій заслінці, квадратичний закон якої при нульовій витраті робить це формулювання виродженим. Витрата системи за розгортку змінюється від {q1} до {q2} м³/год."},{"en":"Each duct, tee arm and damper is removed in turn and the network re-solved from cold. A grille counts as starved when its airflow falls below {p} % of the intact-network value. {a} of {b} contingencies starve at least one grille; {c} leave the network unsolvable; {d} exceed the {v} m/s velocity limit. Intact grille flows: {list} m³/h.","pl":"Każdy kanał, ramię trójnika i przepustnica są kolejno usuwane, a sieć obliczana od nowa. Kratka uznawana jest za niedozasiloną, gdy jej przepływ spada poniżej {p} % wartości w sieci nienaruszonej. {a} z {b} przypadków awaryjnych niedozasila co najmniej jedną kratkę; po {c} sieci nie da się obliczyć; {d} przekracza graniczną prędkość {v} m/s. Przepływy kratek w sieci nienaruszonej: {list} m³/h.","nl":"Elk kanaal, elke T-arm en elke smoorklep wordt beurtelings verwijderd en het net opnieuw koud berekend. Een rooster geldt als ondervoorzien wanneer zijn debiet onder {p} % van de waarde in het intacte net zakt. {a} van {b} uitvalscenario’s ondervoorzien minstens één rooster; {c} maken het net onoplosbaar; {d} overschrijden de snelheidsgrens van {v} m/s. Roosterdebieten in het intacte net: {list} m³/h.","de":"Jeder Kanal, jeder T-Stück-Arm und jede Klappe wird nacheinander entfernt und das Netz kalt neu berechnet. Ein Luftdurchlass gilt als unterversorgt, wenn sein Volumenstrom unter {p} % des Werts im intakten Netz fällt. {a} von {b} Ausfällen versorgen mindestens einen Luftdurchlass unter; {c} machen das Netz unlösbar; {d} überschreiten die Geschwindigkeitsgrenze von {v} m/s. Durchlassvolumenströme im intakten Netz: {list} m³/h.","fr":"Chaque conduit, bras de té et registre est retiré à tour de rôle et le réseau recalculé à froid. Une grille est considérée comme sous-alimentée lorsque son débit tombe sous {p} % de la valeur du réseau intact. {a} contingences sur {b} sous-alimentent au moins une grille ; {c} rendent le réseau insoluble ; {d} dépassent la limite de vitesse de {v} m/s. Débits des grilles du réseau intact : {list} m³/h.","es":"Cada conducto, brazo de te y compuerta se elimina por turno y la red se recalcula en frío. Una rejilla se considera desabastecida cuando su caudal cae por debajo del {p} % del valor en la red intacta. {a} de {b} contingencias desabastecen al menos una rejilla; {c} dejan la red sin solución; {d} superan el límite de velocidad de {v} m/s. Caudales de rejilla en la red intacta: {list} m³/h.","uk":"Кожен повітровід, плече трійника й заслінку по черзі вилучають, а мережу перераховують з нуля. Решітка вважається недоживленою, коли її витрата падає нижче {p} % від значення в непошкодженій мережі. {a} з {b} відмов недоживлюють щонайменше одну решітку; {c} роблять мережу нерозв’язною; {d} перевищують межу швидкості {v} м/с. Витрати решіток у непошкодженій мережі: {list} м³/год."},{"en":"not solvable with this component closed: {r:n}","pl":"nie da się obliczyć po zamknięciu tego elementu: {r}","nl":"onoplosbaar met deze component dicht: {r}","de":"mit dieser geschlossenen Komponente nicht lösbar: {r}","fr":"insoluble avec ce composant fermé : {r}","es":"sin solución con este componente cerrado: {r}","uk":"нерозв’язна з цим закритим компонентом: {r}"},{"en":"Monte-Carlo — {u} of {c} samples solved","pl":"Monte Carlo — obliczono {u} z {c} próbek","nl":"Monte-Carlo — {u} van {c} steekproeven opgelost","de":"Monte-Carlo — {u} von {c} Stichproben gelöst","fr":"Monte-Carlo — {u} échantillons résolus sur {c}","es":"Monte Carlo — {u} de {c} muestras resueltas","uk":"Монте-Карло — розраховано {u} з {c} вибірок"},{"en":"Latin hypercube, seed {seed}, {n} sampled inputs: duct roughness lognormal median 1 σ={a}, grille design Δp lognormal median 1 σ={b}, damper opening normal mean 0 sd={c} percentage points, rank correlation {r} within each family. Duct leakage is not sampled: this model has no leakage element, and inventing one as a nodal demand would be a different model, not an uncertainty. Quantiles are DDSketch estimates, not exact order statistics: {bound:n} — THE ACCURACY BOUND IS VOID FOR AT LEAST ONE TALLY Achieved rank correlation is within {e} of the target.","pl":"Hipersześcian łaciński, ziarno {seed}, {n} losowanych wielkości wejściowych: chropowatość kanałów logarytmiczno-normalna, mediana 1, σ={a}; obliczeniowe Δp kratek logarytmiczno-normalne, mediana 1, σ={b}; otwarcie przepustnic normalne, średnia 0, odchylenie standardowe {c} punktów procentowych; korelacja rangowa {r} w obrębie każdej grupy. Nieszczelność kanałów nie jest losowana: model nie ma elementu nieszczelności, a wprowadzenie go jako zapotrzebowania węzłowego byłoby innym modelem, a nie niepewnością. Kwantyle są oszacowaniami DDSketch, a nie dokładnymi statystykami pozycyjnymi: {bound} — OSZACOWANIE DOKŁADNOŚCI NIE OBOWIĄZUJE DLA CO NAJMNIEJ JEDNEGO ZLICZENIA Uzyskana korelacja rangowa mieści się w granicy {e} od wartości docelowej.","nl":"Latin hypercube, seed {seed}, {n} bemonsterde invoerwaarden: kanaalruwheid lognormaal mediaan 1 σ={a}, ontwerp-Δp rooster lognormaal mediaan 1 σ={b}, klepopening normaal gemiddelde 0 sd={c} procentpunten, rangcorrelatie {r} binnen elke familie. Kanaallekkage wordt niet bemonsterd: dit model heeft geen lekelement, en er een verzinnen als knoopvraag zou een ander model zijn, geen onzekerheid. Kwantielen zijn DDSketch-schattingen, geen exacte ordestatistieken: {bound} — DE NAUWKEURIGHEIDSGRENS GELDT NIET VOOR MINSTENS ÉÉN TELLING De bereikte rangcorrelatie ligt binnen {e} van het doel.","de":"Latin-Hypercube, Seed {seed}, {n} gezogene Eingangsgrößen: Kanalrauheit lognormal Median 1 σ={a}, Auslegungs-Δp der Luftdurchlässe lognormal Median 1 σ={b}, Klappenöffnung normal Mittelwert 0 sd={c} Prozentpunkte, Rangkorrelation {r} innerhalb jeder Gruppe. Kanalleckage wird nicht gezogen: das Modell hat kein Leckageelement, und eines als Knotenentnahme zu erfinden wäre ein anderes Modell, keine Unsicherheit. Quantile sind DDSketch-Schätzungen, keine exakten Ordnungsstatistiken: {bound} — DIE GENAUIGKEITSSCHRANKE GILT FÜR MINDESTENS EINE ZÄHLUNG NICHT Die erreichte Rangkorrelation liegt innerhalb {e} vom Zielwert.","fr":"Hypercube latin, graine {seed}, {n} entrées échantillonnées : rugosité des conduits lognormale de médiane 1 σ={a}, Δp de calcul des grilles lognormale de médiane 1 σ={b}, ouverture des registres normale de moyenne 0 écart type {c} points de pourcentage, corrélation de rang {r} dans chaque famille. Les fuites des conduits ne sont pas échantillonnées : ce modèle n’a pas d’élément de fuite, et en inventer un sous forme de demande nodale serait un autre modèle, pas une incertitude. Les quantiles sont des estimations DDSketch, pas des statistiques d’ordre exactes : {bound} — LA BORNE DE PRÉCISION NE TIENT PAS POUR AU MOINS UN DÉCOMPTE La corrélation de rang obtenue est à moins de {e} de la cible.","es":"Hipercubo latino, semilla {seed}, {n} entradas muestreadas: rugosidad de conductos lognormal de mediana 1 σ={a}, Δp de diseño de rejillas lognormal de mediana 1 σ={b}, apertura de compuertas normal de media 0 sd={c} puntos porcentuales, correlación de rangos {r} dentro de cada familia. Las fugas de los conductos no se muestrean: este modelo no tiene elemento de fuga, e inventarlo como demanda nodal sería otro modelo, no una incertidumbre. Los cuantiles son estimaciones DDSketch, no estadísticos de orden exactos: {bound} — LA COTA DE PRECISIÓN NO SE CUMPLE EN AL MENOS UN RECUENTO La correlación de rangos obtenida está dentro de {e} del objetivo.","uk":"Латинський гіперкуб, зерно {seed}, вибіркових вхідних величин: {n}; шорсткість повітроводів логнормальна, медіана 1, σ={a}; розрахунковий Δp решіток логнормальний, медіана 1, σ={b}; відкриття заслінок нормальне, середнє 0, сд={c} відсоткових пунктів; рангова кореляція {r} у межах кожної групи. Витоки з повітроводів не моделюються вибіркою: модель не має елемента витоку, а вигадати його як вузлове навантаження означало б іншу модель, а не невизначеність. Квантилі — оцінки DDSketch, а не точні порядкові статистики: {bound} — МЕЖА ТОЧНОСТІ НЕ ВИКОНУЄТЬСЯ ЩОНАЙМЕНШЕ ДЛЯ ОДНОГО ПІДРАХУНКУ Досягнута рангова кореляція відрізняється від цільової не більше ніж на {e}."},{"en":"Latin hypercube, seed {seed}, {n} sampled inputs: duct roughness lognormal median 1 σ={a}, grille design Δp lognormal median 1 σ={b}, damper opening normal mean 0 sd={c} percentage points, rank correlation {r} within each family. Duct leakage is not sampled: this model has no leakage element, and inventing one as a nodal demand would be a different model, not an uncertainty. Quantiles are DDSketch estimates, not exact order statistics: {bound:n} Achieved rank correlation is within {e} of the target.","pl":"Hipersześcian łaciński, ziarno {seed}, {n} losowanych wielkości wejściowych: chropowatość kanałów logarytmiczno-normalna, mediana 1, σ={a}; obliczeniowe Δp kratek logarytmiczno-normalne, mediana 1, σ={b}; otwarcie w okresie: {e} kWh w {n} obliczonych godzinach (szczyt {pk} kW w godzinie {ph}, średnio {mn} kW). Profil steruje także globalnym współczynnikiem prędkości wentylatora, ograniczonym do zakresu 40–120 % narzędzia. Największa prędkość {v} m/s; granica {lim} m/s przekroczona w {k} godz. To moc powietrzna, a nie moc na wale ani elektryczna: sprawność całkowita wentylatora, straty silnika i napędu oraz SFP nie są częścią tego modelu, więc nie podaje się żadnej wartości kW/(m³/s).","nl":"Luchtenergie van de ventilator Δp·Q geïntegreerd over de periode: {e} kWh over {n} opgeloste uren (piek {pk} kW in uur {ph}, gemiddeld {mn} kW). Het profiel stuurt ook de globale ventilatortoerentalfactor, begrensd tot het eigen bereik van 40–120 %. Hoogste snelheid {v} m/s; de grens van {lim} m/s wordt in {k} uur overschreden. Dit is luchtvermogen, geen as- of elektrisch vermogen: totaal ventilatorrendement, motor- en aandrijfverliezen en SFP maken geen deel uit van dit model, dus wordt geen kW/(m³/s)-waarde opgegeven.","de":"Luftenergie des Ventilators Δp·Q über den Zeitraum integriert: {e} kWh über {n} gelöste Stunden (Spitze {pk} kW in Stunde {ph}, Mittel {mn} kW). Das Profil steuert auch den globalen Ventilator-Drehzahlfaktor, begrenzt auf den eigenen Bereich von 40–120 %. Höchste Geschwindigkeit {v} m/s; die Grenze von {lim} m/s wird in {k} Stunde(n) überschritten. Das ist Luftleistung, keine Wellen- oder elektrische Leistung: Gesamtwirkungsgrad des Ventilators, Motor- und Antriebsverluste und SFP sind nicht Teil dieses Modells, daher wird kein kW/(m³/s)-Wert angegeben.","fr":"Énergie aéraulique du ventilateur Δp·Q intégrée sur la période : {e} kWh sur {n} heures résolues (pic {pk} kW à l’heure {ph}, moyenne {mn} kW). Le profil pilote aussi le facteur global de vitesse des ventilateurs, borné à la plage propre de 40–120 %. Vitesse la plus élevée {v} m/s ; la limite de {lim} m/s est dépassée pendant {k} heure(s). Il s’agit de puissance aéraulique, ni à l’arbre ni électrique : rendement total du ventilateur, pertes du moteur et de la transmission et SFP ne font pas partie de ce modèle, donc aucune valeur en kW/(m³/s) n’est annoncée.","es":"Energía aerodinámica del ventilador Δp·Q integrada en el periodo: {e} kWh en {n} horas resueltas (pico {pk} kW en la hora {ph}, media {mn} kW). El perfil también gobierna el factor global de velocidad del ventilador, limitado al rango propio de 40–120 %. Velocidad máxima {v} m/s; el límite de {lim} m/s se supera en {k} hora(s). Es potencia aerodinámica, no potencia en el eje ni eléctrica: el rendimiento total del ventilador, las pérdidas de motor y transmisión y el SFP no forman parte de este modelo, por lo que no se indica ningún valor en kW/(m³/s).","uk":"Повітряна енергія вентилятора Δp·Q, проінтегрована за період: {e} кВт·год за {n} розрахованих годин (пік {pk} кВт у годину {ph}, середнє {mn} кВт). Профіль також керує глобальним коефіцієнтом швидкості вентилятора, обмеженим власним діапазоном 40–120 %. Найбільша швидкість {v} м/с; межу {lim} м/с перевищено протягом {k} год. Це повітряна потужність, а не потужність на валу чи електрична: повний ККД вентилятора, втрати двигуна й приводу та SFP не входять до цієї моделі, тож значення кВт/(м³/с) не наводиться."},{"en":"Fan air energy Δp·Q integrated over the period: {e} kWh over {n} solved hours (peak {pk} kW at hour {ph}, mean {mn} kW). Fan speed is held at the global factor; only nodal demand follows the profile. Highest velocity {v} m/s, over the {lim} m/s limit in {k} hour(s). This is air power, not shaft or electrical power: fan total efficiency, motor and drive losses and SFP are not part of this model, so no kW/(m³/s) figure is claimed.","pl":"Energia powietrzna wentylatora Δp·Q scałkowana w okresie: {e} kWh w {n} obliczonych godzinach (szczyt {pk} kW w godzinie {ph}, średnio {mn} kW). Prędkość wentylatora jest utrzymywana na poziomie współczynnika globalnego; profilem podąża tylko zapotrzebowanie węzłowe. Największa prędkość {v} m/s; granica {lim} m/s przekroczona w {k} godz. To moc powietrzna, a nie moc na wale ani elektryczna: sprawność całkowita wentylatora, straty silnika i napędu oraz SFP nie są częścią tego modelu, więc nie podaje się żadnej wartości kW/(m³/s).","nl":"Luchtenergie van de ventilator Δp·Q geïntegreerd over de periode: {e} kWh over {n} opgeloste uren (piek {pk} kW in uur {ph}, gemiddeld {mn} kW). Het ventilatortoerental blijft op de globale factor; alleen de knoopvraag volgt het profiel. Hoogste snelheid {v} m/s; de grens van {lim} m/s wordt in {k} uur overschreden. Dit is luchtvermogen, geen as- of elektrisch vermogen: totaal ventilatorrendement, motor- en aandrijfverliezen en SFP maken geen deel uit van dit model, dus wordt geen kW/(m³/s)-waarde opgegeven.","de":"Luftenergie des Ventilators Δp·Q über den Zeitraum integriert: {e} kWh über {n} gelöste Stunden (Spitze {pk} kW in Stunde {ph}, Mittel {mn} kW). Die Ventilatordrehzahl bleibt beim globalen Faktor; nur die Knotenentnahme folgt dem Profil. Höchste Geschwindigkeit {v} m/s; die Grenze von {lim} m/s wird in {k} Stunde(n) überschritten. Das ist Luftleistung, keine Wellen- oder elektrische Leistung: Gesamtwirkungsgrad des Ventilators, Motor- und Antriebsverluste und SFP sind nicht Teil dieses Modells, daher wird kein kW/(m³/s)-Wert angegeben.","fr":"Énergie aéraulique du ventilateur Δp·Q intégrée sur la période : {e} kWh sur {n} heures résolues (pic {pk} kW à l’heure {ph}, moyenne {mn} kW). La vitesse des ventilateurs reste au facteur global ; seule la demande nodale suit le profil. Vitesse la plus élevée {v} m/s ; la limite de {lim} m/s est dépassée pendant {k} heure(s). Il s’agit de puissance aéraulique, ni à l’arbre ni électrique : rendement total du ventilateur, pertes du moteur et de la transmission et SFP ne font pas partie de ce modèle, donc aucune valeur en kW/(m³/s) n’est annoncée.","es":"Energía aerodinámica del ventilador Δp·Q integrada en el periodo: {e} kWh en {n} horas resueltas (pico {pk} kW en la hora {ph}, media {mn} kW). La velocidad del ventilador se mantiene en el factor global; solo la demanda nodal sigue el perfil. Velocidad máxima {v} m/s; el límite de {lim} m/s se supera en {k} hora(s). Es potencia aerodinámica, no potencia en el eje ni eléctrica: el rendimiento total del ventilador, las pérdidas de motor y transmisión y el SFP no forman parte de este modelo, por lo que no se indica ningún valor en kW/(m³/s).","uk":"Повітряна енергія вентилятора Δp·Q, проінтегрована за період: {e} кВт·год за {n} розрахованих годин (пік {pk} кВт у годину {ph}, середнє {mn} кВт). Швидкість вентилятора тримається на глобальному коефіцієнті; профілю відповідає лише вузлове навантаження. Найбільша швидкість {v} м/с; межу {lim} м/с перевищено протягом {k} год. Це повітряна потужність, а не потужність на валу чи електрична: повний ККД вентилятора, втрати двигуна й приводу та SFP не входять до цієї моделі, тож значення кВт/(м³/с) не наводиться."},{"en":"{list:p}. {s} of {c} combinations solved, {f} within the {v} m/s velocity limit. Ranked by specific air power — fan air power per m³/s actually delivered, which for a single fan is its total pressure rise — because raw Δp·Q rewards choking the duct: the fan sits on a curve, so a smaller duct moves the operating point back and the product falls while the building gets less air. The delivered-flow column is there so a shortfall cannot hide behind a good ratio. Spread across the grid: {b} best against {w} W/(m³/s) worst. A swept duct is replaced by a circular duct of the catalogue size under test, so a rectangular duct is re-sectioned by the sweep; duct cost is represented only by the swept surface area πDL, and fittings, insulation, space and acoustics are not modelled.","pl":"{list}. Obliczono {s} z {c} kombinacji, {f} w granicy prędkości {v} m/s. Ranking według jednostkowej mocy powietrznej — mocy powietrznej wentylatora na m³/s faktycznie dostarczonego powietrza, czyli dla pojedynczego wentylatora jego przyrostu ciśnienia całkowitego — ponieważ surowe Δp·Q nagradza dławienie kanału: wentylator pracuje na krzywej, więc mniejszy kanał cofa punkt pracy i iloczyn spada, podczas gdy budynek dostaje mniej powietrza. Kolumna przepływu dostarczonego pokazuje, by niedobór nie ukrył się za dobrym wskaźnikiem. Rozrzut w siatce: {b} najlepiej wobec {w} W/(m³/s) najgorzej. Badany kanał zastępuje się kanałem okrągłym o testowanym rozmiarze katalogowym, więc kanał prostokątny otrzymuje nowy przekrój; koszt kanału reprezentuje tylko powierzchnia πDL, a kształtki, izolacja, przestrzeń i akustyka nie są modelowane.","nl":"{list}. {s} van {c} combinaties opgelost, {f} binnen de snelheidsgrens van {v} m/s. Gerangschikt op specifiek luchtvermogen — ventilatorluchtvermogen per werkelijk geleverde m³/s, voor één ventilator zijn totale drukverhoging — omdat ruwe Δp·Q het knijpen van het kanaal beloont: de ventilator zit op een curve, dus een kleiner kanaal schuift het werkpunt terug en het product daalt terwijl het gebouw minder lucht krijgt. De kolom geleverd debiet staat er zodat een tekort zich niet achter een goede verhouding kan verbergen. Spreiding over het raster: {b} best tegenover {w} W/(m³/s) slechtst. Een gevarieerd kanaal wordt vervangen door een rond kanaal van de geteste catalogusmaat, dus een rechthoekig kanaal krijgt een nieuwe doorsnede; de kanaalkosten worden alleen weergegeven door het oppervlak πDL, en hulpstukken, isolatie, ruimte en akoestiek worden niet gemodelleerd.","de":"{list}. {s} von {c} Kombinationen gelöst, {f} innerhalb der Geschwindigkeitsgrenze von {v} m/s. Gereiht nach spezifischer Luftleistung — Luftleistung des Ventilators je tatsächlich geförderten m³/s, bei einem einzelnen Ventilator seine Totaldruckerhöhung — weil rohes Δp·Q das Drosseln des Kanals belohnt: der Ventilator läuft auf einer Kennlinie, ein kleinerer Kanal schiebt den Betriebspunkt zurück und das Produkt sinkt, während das Gebäude weniger Luft erhält. Die Spalte des geförderten Volumenstroms steht da, damit sich ein Defizit nicht hinter einem guten Verhältnis versteckt. Streuung über das Raster: {b} am besten gegenüber {w} W/(m³/s) am schlechtesten. Ein variierter Kanal wird durch einen runden Kanal der geprüften Katalogweite ersetzt, ein Rechteckkanal erhält also einen neuen Querschnitt; die Kanalkosten werden nur durch die Fläche πDL abgebildet, Formstücke, Dämmung, Platzbedarf und Akustik werden nicht modelliert.","fr":"{list}. {s} combinaisons résolues sur {c}, {f} dans la limite de vitesse de {v} m/s. Classement par puissance aéraulique spécifique — puissance aéraulique du ventilateur par m³/s réellement fourni, soit pour un ventilateur seul son élévation de pression totale — car le Δp·Q brut récompense l’étranglement du conduit : le ventilateur est sur une courbe, donc un conduit plus petit recule le point de fonctionnement et le produit baisse pendant que le bâtiment reçoit moins d’air. La colonne du débit fourni est là pour qu’un déficit ne se cache pas derrière un bon rapport. Dispersion sur la grille : {b} au mieux contre {w} W/(m³/s) au pire. Un conduit balayé est remplacé par un conduit circulaire de la taille de catalogue testée, de sorte qu’un conduit rectangulaire change de section ; le coût du conduit n’est représenté que par la surface πDL, et accessoires, isolation, encombrement et acoustique ne sont pas modélisés.","es":"{list}. {s} de {c} combinaciones resueltas, {f} dentro del límite de velocidad de {v} m/s. Ordenado por potencia aerodinámica específica — potencia aerodinámica del ventilador por m³/s realmente entregado, que para un solo ventilador es su aumento de presión total — porque el Δp·Q bruto premia estrangular el conducto: el ventilador está sobre una curva, así que un conducto menor retrasa el punto de trabajo y el producto baja mientras el edificio recibe menos aire. La columna de caudal entregado está para que un déficit no se esconda tras una buena relación. Dispersión en la malla: {b} el mejor frente a {w} W/(m³/s) el peor. Un conducto barrido se sustituye por uno circular del tamaño de catálogo ensayado, de modo que un conducto rectangular cambia de sección; el coste del conducto solo se representa por la superficie πDL, y accesorios, aislamiento, espacio y acústica no se modelan.","uk":"{list}. Розраховано {s} з {c} комбінацій, {f} у межах швидкості {v} м/с. Ранжування за питомою повітряною потужністю — повітряна потужність вентилятора на фактично подані м³/с, тобто для одного вентилятора його приріст повного тиску — бо сирий добуток Δp·Q заохочує дроселювання повітроводу: вентилятор працює на кривій, тож менший повітровід зсуває робочу точку назад і добуток падає, а будівля отримує менше повітря. Стовпець поданої витрати потрібен, щоб нестача не ховалася за добрим співвідношенням. Розкид у сітці: {b} найкраще проти {w} Вт/(м³/с) найгірше. Повітровід, що перебирається, замінюють круглим повітроводом каталожного розміру, тож прямокутний повітровід отримує новий переріз; вартість повітроводу подано лише площею πDL, а фасонні частини, ізоляцію, простір і акустику не моделюють."},{"en":"|estimate - order statistic| <= {a} * |order statistic|; exact for p <= {lo} or p >= {hi}","pl":"|oszacowanie - statystyka pozycyjna| <= {a} * |statystyka pozycyjna|; dokładne dla p <= {lo} lub p >= {hi}","nl":"|schatting - ordestatistiek| <= {a} * |ordestatistiek|; exact voor p <= {lo} of p >= {hi}","de":"|Schätzung - Ordnungsstatistik| <= {a} * |Ordnungsstatistik|; exakt für p <= {lo} oder p >= {hi}","fr":"|estimation - statistique d’ordre| <= {a} * |statistique d’ordre| ; exacte pour p <= {lo} ou p >= {hi}","es":"|estimación - estadístico de orden| <= {a} * |estadístico de orden|; exacta para p <= {lo} o p >= {hi}","uk":"|оцінка - порядкова статистика| <= {a} * |порядкова статистика|; точна для p <= {lo} або p >= {hi}"},{"en":"VOID: {a} of {b} weight fell outside the representable range [{lo}, {hi}] and was folded into an edge bucket, so no accuracy bound holds for these quantiles. Raise maxBuckets, or set minValue/maxValue to span the data.","pl":"NIEWAŻNE: {a} z {b} wagi wypadło poza reprezentowalny zakres [{lo}, {hi}] i trafiło do skrajnego przedziału, więc dla tych kwantyli nie obowiązuje żadne oszacowanie dokładności. Zwiększ maxBuckets albo ustaw minValue/maxValue tak, by obejmowały dane.","nl":"ONGELDIG: {a} van {b} gewicht viel buiten het representeerbare bereik [{lo}, {hi}] en werd in een randbak gevouwen, dus voor deze kwantielen geldt geen nauwkeurigheidsgrens. Verhoog maxBuckets of stel minValue/maxValue zo in dat ze de gegevens omvatten.","de":"UNGÜLTIG: {a} von {b} Gewicht lag außerhalb des darstellbaren Bereichs [{lo}, {hi}] und wurde in einen Randbehälter gefaltet; für diese Quantile gilt daher keine Genauigkeitsschranke. maxBuckets erhöhen oder minValue/maxValue so setzen, dass sie die Daten umfassen.","fr":"NUL : {a} sur {b} du poids est tombé hors de la plage représentable [{lo}, {hi}] et a été replié dans un compartiment de bord ; aucune borne de précision ne tient donc pour ces quantiles. Augmentez maxBuckets ou réglez minValue/maxValue pour couvrir les données.","es":"NULO: {a} de {b} del peso quedó fuera del rango representable [{lo}, {hi}] y se plegó en un contenedor de borde, por lo que ninguna cota de precisión se cumple para estos cuantiles. Aumente maxBuckets o ajuste minValue/maxValue para abarcar los datos.","uk":"НЕДІЙСНО: {a} з {b} ваги вийшло за межі представного діапазону [{lo}, {hi}] і потрапило до крайового кошика, тож для цих квантилів межа точності не виконується. Збільште maxBuckets або задайте minValue/maxValue так, щоб вони охоплювали дані."}];
const PHRASES={"pl":{" cubic metres per hour":" m³/h"," (hydraulic diameter now ":" (średnica hydrauliczna obecnie "," catalogue sizes tried)":" sprawdzonych rozmiarów katalogowych)"},"nl":{" cubic metres per hour":" kubieke meter per uur"," (hydraulic diameter now ":" (hydraulische diameter nu "," catalogue sizes tried)":" geteste catalogusmaten)"},"de":{" cubic metres per hour":" Kubikmeter pro Stunde"," (hydraulic diameter now ":" (hydraulischer Durchmesser jetzt "," catalogue sizes tried)":" geprüfte Katalogweiten)"},"fr":{" cubic metres per hour":" mètres cubes par heure"," (hydraulic diameter now ":" (diamètre hydraulique actuel "," catalogue sizes tried)":" tailles de catalogue essayées)"},"es":{" cubic metres per hour":" metros cúbicos por hora"," (hydraulic diameter now ":" (diámetro hidráulico actual "," catalogue sizes tried)":" tamaños de catálogo probados)"},"uk":{" cubic metres per hour":" кубічних метрів на годину"," (hydraulic diameter now ":" (гідравлічний діаметр зараз "," catalogue sizes tried)":" перевірених каталожних розмірів)"}};
const re1=/[.*+?^${}()|[\]\\]/g,esc=x=>x.replace(re1,'\\$&');
const C=P.map(p=>{const names=[],kinds=[];let src='',last=0,m;const r=/\{(\w+)(?::([tnp]))?\}/g;
 while((m=r.exec(p.en))){src+=esc(p.en.slice(last,m.index))+'((?:(?!\\. [A-Z])[\\s\\S])+?)';names.push(m[1]);kinds.push(m[2]||'');last=r.lastIndex}
 const tail=p.en.slice(last);src+=esc(tail);
 return{p,names,kinds,whole:new RegExp('^'+src+'$'),prefix:tail.length?new RegExp('^'+src+'(?![0-9A-Za-z])'):null}});
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const prefixKeys=new WeakMap();
function keysFor(dict){let k=prefixKeys.get(dict);if(!k){k=Object.keys(dict).filter(x=>x.length>=12).sort((a,b)=>b.length-a.length);prefixKeys.set(dict,k)}return k}
function translate(lang,text,dict){
 const memo=new Map();
 const fill=(c,m)=>{const tpl=c.p[lang];if(tpl==null)return null;const v={};
  for(let i=0;i<c.names.length;i++){let x=m[i+1];const k=c.kinds[i];
   if(k==='t'){const y=tr(x);if(y==null)return null;x=y}
   else if(k==='n'){const y=tr(x);if(y!=null)x=y}
   else if(k==='p'){const ph=PHRASES[lang]||{};for(const e of Object.keys(ph))x=x.split(e).join(ph[e])}
   v[c.names[i]]=x}
  return tpl.replace(/\{(\w+)\}/g,(a,n)=>own(v,n)?v[n]:a)};
 const one=t=>{
  if(own(dict,t))return dict[t];
  for(const c of C){const m=c.whole.exec(t);if(m){const r=fill(c,m);if(r!=null)return r}}
  for(const c of C){if(!c.prefix)continue;const m=c.prefix.exec(t);if(!m)continue;
   const rest=t.slice(m[0].length),sp=rest.match(/^\s*/)[0];if(!rest.slice(sp.length))continue;
   const a=fill(c,m);if(a==null)continue;const b=tr(rest.slice(sp.length));if(b!=null)return a+sp+b}
  for(const k of keysFor(dict)){if(!t.startsWith(k))continue;const rest=t.slice(k.length),sp=rest.match(/^\s*/)[0];
   if(!/[.:;!?)]$/.test(k)&&!/^[\s;·,(]/.test(rest))continue;
   if(!rest.slice(sp.length))continue;const b=tr(rest.slice(sp.length));if(b!=null)return dict[k]+sp+b}
  return null};
 const tr=t=>{if(memo.has(t))return memo.get(t);memo.set(t,null);const r=one(t);memo.set(t,r);return r};
 return tr(String(text));
}
window.__dnPatterns={translate,count:P.length};
})();
