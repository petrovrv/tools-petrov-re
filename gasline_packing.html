/* Shared transient-tool chart.
   Replaces the single-extent drawStage used by the Pipe/Vessel Transients family.
   Series carrying different units get their own axis, so a curve is never
   flattened by an unrelated quantity sharing its scale.

   spec = { x:{label,unit}, series:[{x:[],y:[],label,unit}] }
   Series are grouped by unit; the first group takes the left axis, the second
   the right. A third distinct unit would have nowhere to go, so the plotter
   reports it to the caller instead of drawing it silently on the wrong scale. */
function dgcPlot(ctx, w, h, spec, opt) {
  opt = opt || {};
  var density = opt.density || 'fine';
  var css = opt.css || {};
  var muted = css.muted || '#6b7280', line = css.line || '#d6dae0',
      text = css.text || '#1f2430', font = css.font || 'sans-serif',
      bg = css.bg || null;
  var coarse = density === 'coarse';
  var fs = opt.fontScale || 1;
  var f1 = Math.round(11 * fs), f2 = Math.round(12 * fs);

  var groups = [], skipped = [];
  (spec.series || []).forEach(function (s) {
    if (!s || !s.x || !s.y || !s.x.length) return;
    var u = s.unit == null ? '' : String(s.unit);
    var g = null;
    for (var i = 0; i < groups.length; i++) if (groups[i].unit === u) { g = groups[i]; break; }
    if (!g) {
      if (groups.length >= 2) { skipped.push(s.label || u); return; }
      g = { unit: u, series: [] }; groups.push(g);
    }
    g.series.push(s);
  });
  if (!groups.length) return { drawn: 0, skipped: skipped };

  // Extents per axis group, and the shared x extent.
  var xs = [];
  groups.forEach(function (g) {
    var lo = Infinity, hi = -Infinity;
    g.series.forEach(function (s) {
      s.x.forEach(function (v) { if (isFinite(v)) xs.push(v); });
      s.y.forEach(function (v) { if (isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } });
    });
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (hi === lo) { var d = Math.max(1e-9, Math.abs(lo) * 0.05); lo -= d; hi += d; }
    else { var pad = (hi - lo) * 0.06; lo -= pad; hi += pad; }
    g.lo = lo; g.hi = hi;
  });
  if (!xs.length) return { drawn: 0, skipped: skipped };
  var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
  if (xmax === xmin) xmax = xmin + 1;

  var hasRight = groups.length > 1;
  var padL = (coarse ? 52 : 64) * fs, padR = (hasRight ? (coarse ? 52 : 64) : 16) * fs;
  var padT = 12 * fs, padB = (44 + (spec.series.length > 1 ? 16 : 0)) * fs;
  var W = w - padL - padR, H = h - padT - padB;
  if (W <= 20 || H <= 20) return { drawn: 0, skipped: skipped };

  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); } else ctx.clearRect(0, 0, w, h);

  var X = function (v) { return padL + W * (v - xmin) / (xmax - xmin); };
  var Yof = function (g) { return function (v) { return padT + H - H * (v - g.lo) / (g.hi - g.lo); }; };

  var tick = opt.ticks || function (lo, hi) {
    var n = 5, out = [], step = (hi - lo) / n;
    var mag = Math.pow(10, Math.floor(Math.log(step) / Math.LN10)), norm = step / mag;
    step = (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
    for (var v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(v);
    return out;
  };
  /* AGENTS §2.2.1 -- one locale map for the on-screen chart and the report figure.
     The digits are this chart's own and are not re-rounded; only the decimal
     separator is re-written, by the framework map that the report engine reads.
     group:false keeps the axis label ungrouped, which is what it has always been
     and what the English rendering must stay (NUMBER-FORMAT.md rule 2). */
  var sepNum = function (s) {
    try { return window.DiagramUI.num.sep(s, { digits: 'raw', group: false }); }
    catch (e) { return s; }
  };
  var fmt = opt.fmt || function (v) {
    var a = Math.abs(v);
    if (a !== 0 && (a < 1e-3 || a >= 1e5)) return sepNum(v.toExponential(1));
    return sepNum(String(Math.round(v * 1000) / 1000));
  };

  // Grid, drawn first so the curves sit on top of it.
  ctx.strokeStyle = line; ctx.lineWidth = 1;
  ctx.globalAlpha = 0.45;
  tick(groups[0].lo, groups[0].hi).forEach(function (v) {
    var y = Yof(groups[0])(v);
    if (y < padT - 0.5 || y > padT + H + 0.5) return;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + W, y); ctx.stroke();
  });
  tick(xmin, xmax).forEach(function (v) {
    var x = X(v);
    if (x < padL - 0.5 || x > padL + W + 0.5) return;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + H); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // Frame.
  ctx.strokeStyle = muted; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + H); ctx.lineTo(padL + W, padT + H); ctx.stroke();
  if (hasRight) { ctx.beginPath(); ctx.moveTo(padL + W, padT); ctx.lineTo(padL + W, padT + H); ctx.stroke(); }

  ctx.font = '400 ' + f1 + 'px ' + font;
  ctx.fillStyle = muted;

  // Left axis.
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  tick(groups[0].lo, groups[0].hi).forEach(function (v) {
    var y = Yof(groups[0])(v);
    if (y < padT - 0.5 || y > padT + H + 0.5) return;
    ctx.beginPath(); ctx.moveTo(padL - 4, y); ctx.lineTo(padL, y); ctx.stroke();
    ctx.fillText(fmt(v), padL - 7, y);
  });
  // Right axis.
  if (hasRight) {
    ctx.textAlign = 'left';
    tick(groups[1].lo, groups[1].hi).forEach(function (v) {
      var y = Yof(groups[1])(v);
      if (y < padT - 0.5 || y > padT + H + 0.5) return;
      ctx.beginPath(); ctx.moveTo(padL + W, y); ctx.lineTo(padL + W + 4, y); ctx.stroke();
      ctx.fillText(fmt(v), padL + W + 7, y);
    });
  }
  // X axis.
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  tick(xmin, xmax).forEach(function (v) {
    var x = X(v);
    if (x < padL - 0.5 || x > padL + W + 0.5) return;
    ctx.beginPath(); ctx.moveTo(x, padT + H); ctx.lineTo(x, padT + H + 4); ctx.stroke();
    ctx.fillText(fmt(v), x, padT + H + 7);
  });

  // Axis titles carry the unit, so a reader never has to guess the scale.
  ctx.fillStyle = text; ctx.font = '500 ' + f2 + 'px ' + font;
  var xTitle = (spec.x && spec.x.label ? spec.x.label : '') + (spec.x && spec.x.unit ? ', ' + spec.x.unit : '');
  if (xTitle) { ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(xTitle, padL + W / 2, h - (spec.series.length > 1 ? 20 * fs : 5 * fs)); }
  function axisTitle(g, right) {
    var t = (g.series.length === 1 && g.series[0].label ? g.series[0].label : (g.title || '')) + (g.unit ? ', ' + g.unit : '');
    if (!t) return;
    // Both titles are rotated so their glyphs fall inside the canvas: after the
    // rotation a 'top' baseline places them toward the plot, either way.
    ctx.save(); ctx.translate(right ? w - 3 * fs : 13 * fs, padT + H / 2);
    ctx.rotate(right ? Math.PI / 2 : -Math.PI / 2);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(t, 0, 0); ctx.restore();
  }
  axisTitle(groups[0], false); if (hasRight) axisTitle(groups[1], true);

  // Curves.
  var colors = opt.colors || ['#1f6feb', '#d1651a', '#2f9e44', '#9333ea', '#0891b2'];
  var idx = 0, legend = [];
  groups.forEach(function (g, gi) {
    var Y = Yof(g);
    g.series.forEach(function (s) {
      var col = s.color || colors[idx % colors.length];
      legend.push({ label: s.label || '', unit: g.unit, color: col, dash: gi === 1 });
      ctx.strokeStyle = col; ctx.lineWidth = 2 * fs; ctx.lineJoin = 'round';
      ctx.setLineDash(gi === 1 ? [6 * fs, 4 * fs] : []);
      ctx.beginPath(); var began = false;
      for (var i = 0; i < s.x.length; i++) {
        var xv = s.x[i], yv = s.y[i];
        if (!isFinite(xv) || !isFinite(yv)) { began = false; continue; }
        var px = X(xv), py = Y(yv);
        if (!began) { ctx.moveTo(px, py); began = true; } else ctx.lineTo(px, py);
      }
      ctx.stroke(); ctx.setLineDash([]);
      idx++;
    });
  });

  // Legend, only when more than one curve is on the plot.
  if (legend.length > 1) {
    ctx.font = '400 ' + f1 + 'px ' + font; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    var items = legend.map(function (l) { return { l: l, w: ctx.measureText(l.label + (l.unit ? ', ' + l.unit : '')).width + 26 * fs }; });
    var total = items.reduce(function (a, b) { return a + b.w; }, 0);
    var cx = padL + Math.max(0, (W - total) / 2), cy = h - 6 * fs;
    items.forEach(function (it) {
      ctx.strokeStyle = it.l.color; ctx.lineWidth = 2 * fs;
      ctx.setLineDash(it.l.dash ? [6 * fs, 4 * fs] : []);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 18 * fs, cy); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = text; ctx.fillText(it.l.label + (it.l.unit ? ', ' + it.l.unit : ''), cx + 22 * fs, cy);
      cx += it.w;
    });
  }
  return { drawn: idx, skipped: skipped };
}

 concDepack:"Im Endzustand übersteigt die Entnahme den Zulauf, der Abschnitt verliert beim Fensterende also noch Bestand.",
 concEmpty:"Der Bestand erreichte im Fenster die Leerlaufschwelle des Solvers; der Endzustand ist das Leerlaufereignis, kein eingeschwungener Zustand.",
 system:"Der Rohrabschnitt gilt als ein isothermes Kontrollvolumen. Der Zulauf folgt aus einer Versorgungsblende gegen den momentanen Leitungsdruck, die Entnahme ist fest, und die Differenz ändert den Bestand. Der Druck folgt aus der Idealgasbeziehung für diesen Bestand bei fester Leitungstemperatur.",
 figCap:"Leitungsdruck über der Zeit im simulierten Fenster.",
 ckDepack:"Analytischer Grenzfall ohne Eintrittsfläche",ckDepackB:"Bei Eintrittsfläche null liefert die Blende nichts, dm/dt = −ṁ_ab ist konstant, der Bestand also exakt linear in der Zeit und der Leerlaufzeitpunkt (m₀ − m_Schwelle)/ṁ_ab. RK4 integriert eine Konstante ohne Abbruchfehler, der Marsch muss diese Gerade und diesen Zeitpunkt als Arithmetik zurückgeben.",
 ckRK4:"Endzustand gegen einen verfeinerten Marsch",ckRK4B:"Derselbe klassische RK4-Marsch, mit durch sechzehn geteiltem Schrittanteil und Darstellungsdeckel, also eine wirklich feinere Zerlegung derselben Bahn. Verglichen werden Enddruck UND Endzeitpunkt, denn ein leerlaufender Fall erreicht ohnehin denselben Schwellendruck und nur der Zeitpunkt kann abweichen. Die Übereinstimmung prüft die Integration statt des Modells.",
 ckHandoff:"Zustandsschluss der Übergabe",ckHandoffB:"Die SI-Übergabe gibt Leitungsdruck und Dichte heraus und schreibt einen eingehenden Druck direkt in den Anfangsdruck. Der aus dem gemeldeten Druck folgende Bestand muss daher der Bestand am Marschende sein, und die gemeldete Dichte muss dieselbe Beziehung p = m R T / V erfüllen.",
 ckEquil:"Richtung der Bestandsänderung",ckEquilB:"Die Blendenbeziehung fällt monoton mit dem Gegendruck, es gibt also genau einen Druck, bei dem Zulauf gleich Entnahme ist. Die Bestandsrate muss auf diesen Druck zeigen und durchweg negativ sein, wenn selbst der gesperrte Zulauf die Entnahme nicht deckt.",
 ckChoke:"Eintrittsregime im Endzustand",ckChokeB:"Druckverhältnis p/p_Versorgung gegen das kritische Verhältnis (2/(γ+1))^(γ/(γ−1)). Darunter ist die Eintrittsblende gesperrt und der Zulauf allein durch den Versorgungszustand bestimmt.",
 ckEnd:"Abbruchzweig",ckEndB:"Der Marsch endet entweder bei der angeforderten Simulationszeit oder wenn der Bestand die per Bisektion lokalisierte Leerlaufschwelle erreicht. Was eingetreten ist, entscheidet, ob der Endzustand als Leitungszustand gelesen werden darf.",
 flowSupply:"Versorgung mit festem Druck",flowInlet:"Eintrittsblende (A_ein, Cd)",flowLine:"Rohrabschnitt",flowDraw:"Entnahme mit fester Rate",
 rPacking:"speichernd",rDepacking:"entspeichernd",rBalanced:"ausgeglichen",rNoEq:"kein Gleichgewichtsdruck",
 rChoked:"gesperrt",rSub:"unterkritisch",rHorizon:"Simulationszeit erreicht",rEmptied:"Leerlaufschwelle erreicht",
 rInv0:"Anfangsbestand",rDrawL:"Entnahmerate",
 rVol:"Leitungsvolumen",rP0:"Anfangsdruck der Leitung",rPeq:"Gleichgewichtsdruck",rNet:"Netto-Bestandsrate",
 rMassFrac:"Bestandsänderung als Anteil des Anfangs",rResidence:"Bestand geteilt durch Entnahme",
 rPress:"Enddruck der Leitung",rInv:"Endbestand",rDelta:"Bestandsänderung",rIn:"Zulauf am Ende",rPeak:"Maximaler Zulauf",rDens:"Leitungsdichte",rElapsed:"Simulierte Zeit",
 rSupplyWhy:"Legt den erreichbaren Eintrittsdruck fest und mit der Fläche den maximalen Zulauf",
 rAreaWhy:"Legt den Zulauf bei jedem Leitungsdruck fest und damit den Gleichgewichtsdruck",
 rDrawWhy:"Feste Entnahme; die Bestandsrate ist der Zulauf abzüglich dieser Rate",
 riskDistT:"Verteilte Leitungsdynamik",riskDist:"Der Abschnitt ist ein konzentriertes Volumen, es läuft also kein Druckgefälle entlang und keine Welle hindurch. Ein schnelles Armaturereignis oder eine lange Leitung mit unterschiedlichen Enddrücken liegt außerhalb dieses Bestandsmodells.",
 riskIsoT:"Isotherme Annahme",riskIso:"Die Leitungstemperatur bleibt auf dem Eingabewert, die Verdichtungswärme beim Speichern und die Abkühlung beim Entspeichern fehlen also. Der bei fester Temperatur berechnete Druck trägt diesen Fehler.",
 riskFloorT:"Leerlaufschwelle",riskFloor:"Der Marsch hält bei einem Bestand von 1e-9 kg statt bei null, und der dort gemeldete Druck ist der Idealgasdruck dieser Schwellenmasse. Ein leerlaufender Fall ist auf seine Leerlaufzeit zu lesen, nicht auf seinen Enddruck.",
 mNote:"Ideales Gas mit konstantem γ und R bei fester Leitungstemperatur. Ein konzentriertes Kontrollvolumen, fester Versorgungsdruck, vorgegebene Entnahme, keine Rohrreibung und kein örtliches Druckgefälle."},
nl:{title:"Leidingpacking — geconcentreerde isotherme inventaris van een leidingsegment",
 summary:"Een leiding van {D} mm × {L} m met {V} m³ gas op {T} °C start op {p0} bar en wordt gevoed via een inlaatorifice van {A} mm² met uitstroomcoëfficiënt {Cd} vanuit een bron op {ps} bar, tegen een afname van {out} kg/s. Na {t} s staat de leiding op {pf} bar en {mf} kg, een verandering van {dm} kg.",
 concPack:"In de eindtoestand overtreft de instroom de afname, dus het segment wint bij het sluiten van het venster nog inventaris.",
 concDepack:"In de eindtoestand overtreft de afname de instroom, dus het segment verliest bij het sluiten van het venster nog inventaris.",
 concEmpty:"De inventaris bereikte binnen het venster de leegloopdrempel van de solver; de eindtoestand is die leegloopgebeurtenis, geen ingespeelde toestand.",
 system:"Het leidingsegment geldt als één isotherm controlevolume. De instroom volgt uit een bronorifice tegen de momentane leidingdruk, de afname ligt vast, en het verschil verandert de inventaris. De druk volgt uit de ideaal-gasrelatie voor die inventaris bij de vaste leidingtemperatuur.",
 figCap:"Leidingdruk tegen de tijd over het gesimuleerde venster.",
 ckDepack:"Analytische limiet bij nul inlaatoppervlak",ckDepackB:"Met inlaatoppervlak nul levert de orifice niets en is dm/dt = −ṁ_uit constant, dus de inventaris is exact lineair in de tijd en het leeglooptijdstip is (m₀ − m_drempel)/ṁ_uit. RK4 integreert een constante zonder afbreekfout, dus de mars moet die rechte en dat tijdstip als rekenwerk teruggeven.",
 ckRK4:"Eindtoestand tegen een verfijnde mars",ckRK4B:"Dezelfde klassieke RK4-mars, met de stapfractie en de tekenlimiet door zestien gedeeld, dus een werkelijk fijnere verdeling van dezelfde baan. Zowel de einddruk als het eindtijdstip worden vergeleken, want een leeglopend geval bereikt hoe dan ook dezelfde drempeldruk en alleen het tijdstip kan verschillen. Overeenstemming toetst de integratie in plaats van het model.",
 ckHandoff:"Toestandssluiting van de overdracht",ckHandoffB:"De SI-overdracht geeft leidingdruk en dichtheid af en schrijft een binnenkomende druk rechtstreeks in de begindruk. De inventaris die uit de gemelde druk volgt moet dus de inventaris zijn waarmee de mars eindigde, en de gemelde dichtheid moet dezelfde relatie p = m R T / V voldoen.",
 ckEquil:"Richting van de inventarisverandering",ckEquilB:"De orificerelatie daalt monotoon met de tegendruk, dus er is precies één druk waarbij instroom gelijk is aan afname. De inventarissnelheid moet naar die druk wijzen en overal negatief zijn wanneer zelfs de gechokte instroom de afname niet dekt.",
 ckChoke:"Inlaatregime in de eindtoestand",ckChokeB:"Drukverhouding p/p_bron tegen de kritische verhouding (2/(γ+1))^(γ/(γ−1)). Daaronder is de inlaatorifice choked en wordt de instroom alleen door de brontoestand bepaald.",
 ckEnd:"Beëindigingstak",ckEndB:"De mars stopt ofwel op de gevraagde simulatietijd, ofwel wanneer de inventaris de per bisectie gelokaliseerde leegloopdrempel bereikt. Wat er gebeurde bepaalt of de eindtoestand als leidingtoestand gelezen mag worden.",
 flowSupply:"Bron op vaste druk",flowInlet:"Inlaatorifice (A_in, Cd)",flowLine:"Leidingsegment",flowDraw:"Afname met vast debiet",
 rPacking:"packing",rDepacking:"depacking",rBalanced:"in evenwicht",rNoEq:"geen evenwichtsdruk",
 rChoked:"choked",rSub:"subkritisch",rHorizon:"simulatietijd bereikt",rEmptied:"leegloopdrempel bereikt",
 rInv0:"Beginvoorraad",rDrawL:"Afnamedebiet",
 rVol:"Leidingvolume",rP0:"Begindruk leiding",rPeq:"Evenwichtsdruk",rNet:"Netto inventarissnelheid",
 rMassFrac:"Inventarisverandering als deel van het begin",rResidence:"Inventaris gedeeld door afname",
 rPress:"Einddruk leiding",rInv:"Eindinventaris",rDelta:"Inventarisverandering",rIn:"Instroom aan het eind",rPeak:"Piekinstroom",rDens:"Leidingdichtheid",rElapsed:"Gesimuleerde tijd",
 rSupplyWhy:"Bepaalt de druk die de inlaat kan halen en met het oppervlak de maximale instroom",
 rAreaWhy:"Bepaalt de instroom bij elke leidingdruk en daarmee de evenwichtsdruk",
 rDrawWhy:"Vaste afname; de inventarissnelheid is de instroom minus deze",
 riskDistT:"Verdeelde leidingdynamiek",riskDist:"Het segment is één geconcentreerd volume, dus er loopt geen drukgradiënt langs en geen golf doorheen. Een snelle afsluitergebeurtenis of een lange leiding met verschillende einddrukken valt buiten dit inventarismodel.",
 riskIsoT:"Isotherme aanname",riskIso:"De leidingtemperatuur blijft op de invoerwaarde, dus de compressiewarmte van packing en de afkoeling van depacking ontbreken. De bij vaste temperatuur berekende druk draagt die fout.",
 riskFloorT:"Leegloopdrempel",riskFloor:"De mars stopt bij een inventaris van 1e-9 kg in plaats van bij nul, en de daar gemelde druk is de ideaal-gasdruk van die drempelmassa. Lees een leeglopend geval op zijn leeglooptijd, niet op zijn einddruk.",
 mNote:"Ideaal gas met constante γ en R bij een vaste leidingtemperatuur. Eén geconcentreerd controlevolume, vaste brondruk, opgegeven afname, geen leidingwrijving en geen plaatselijke drukgradiënt."},
fr:{title:"Stockage en conduite — inventaire isotherme global d’un tronçon",
 summary:"Une conduite de {D} mm × {L} m et {V} m³ contenant du gaz à {T} °C part de {p0} bar et est alimentée par un orifice d’entrée de {A} mm² et de coefficient de décharge {Cd} depuis une source à {ps} bar, contre un soutirage de {out} kg/s. Après {t} s la conduite est à {pf} bar et {mf} kg, soit une variation de {dm} kg.",
 concPack:"À l’état final l’entrée dépasse le soutirage, le tronçon gagne donc encore de l’inventaire à la fermeture de la fenêtre.",
 concDepack:"À l’état final le soutirage dépasse l’entrée, le tronçon perd donc encore de l’inventaire à la fermeture de la fenêtre.",
 concEmpty:"L’inventaire a atteint le plancher de conduite vide du solveur dans la fenêtre; l’état final est cet événement de vidage, pas un état établi.",
 system:"Le tronçon est traité comme un unique volume de contrôle isotherme. Le débit d’entrée est fixé par un orifice d’alimentation travaillant contre la pression instantanée, le soutirage est constant, et la différence fait évoluer l’inventaire. La pression découle de la relation des gaz parfaits appliquée à cet inventaire à température de conduite fixe.",
 figCap:"Pression de conduite en fonction du temps sur la fenêtre simulée.",
 ckDepack:"Limite analytique à section d’entrée nulle",ckDepackB:"Avec une section d’entrée nulle l’orifice ne délivre rien et dm/dt = −ṁ_sortie est constant, l’inventaire est donc exactement linéaire en temps et l’instant de vidage vaut (m₀ − m_plancher)/ṁ_sortie. RK4 intègre une constante sans erreur de troncature, la marche doit donc rendre cette droite et cet instant comme de l’arithmétique.",
 ckRK4:"État final contre une marche raffinée",ckRK4B:"La même marche RK4 classique, avec la fraction de pas et le plafond de tracé divisés par seize, donc une partition réellement plus fine de la même trajectoire. La pression finale ET l’instant final sont comparés, car un cas qui se vide atteint de toute façon la même pression plancher et seul l’instant peut différer. L’accord teste l’intégration plutôt que le modèle.",
 ckHandoff:"Fermeture d’état au transfert",ckHandoffB:"Le transfert SI livre la pression et la masse volumique de conduite et écrit une pression entrante directement dans la pression initiale. L’inventaire déduit de la pression annoncée doit donc être celui sur lequel la marche s’est achevée, et la masse volumique annoncée doit vérifier la même relation p = m R T / V.",
 ckEquil:"Sens de variation de l’inventaire",ckEquilB:"La relation d’orifice décroît de façon monotone avec la contre-pression, il existe donc une seule pression où l’entrée égale le soutirage. Le taux d’inventaire doit pointer vers cette pression, et rester négatif partout quand même l’entrée bloquée ne couvre pas le soutirage.",
 ckChoke:"Régime d’entrée à l’état final",ckChokeB:"Rapport de pression p/p_source contre le rapport critique (2/(γ+1))^(γ/(γ−1)). En dessous, l’orifice d’entrée est bloqué et le débit d’entrée ne dépend que de l’état de la source.",
 ckEnd:"Branche d’arrêt",ckEndB:"La marche s’arrête soit au temps de simulation demandé, soit quand l’inventaire atteint le plancher de conduite vide localisé par bissection. Ce qui s’est produit décide si l’état final peut se lire comme un état de conduite.",
 flowSupply:"Source à pression fixe",flowInlet:"Orifice d’entrée (A_in, Cd)",flowLine:"Tronçon de conduite",flowDraw:"Soutirage à débit fixe",
 rPacking:"stockage",rDepacking:"déstockage",rBalanced:"équilibré",rNoEq:"pas de pression d’équilibre",
 rChoked:"bloqué",rSub:"sous-critique",rHorizon:"temps de simulation atteint",rEmptied:"plancher de conduite vide atteint",
 rInv0:"Inventaire initial",rDrawL:"Débit de soutirage",
 rVol:"Volume de la conduite",rP0:"Pression initiale de conduite",rPeq:"Pression d’équilibre",rNet:"Taux net d’inventaire",
 rMassFrac:"Variation d’inventaire rapportée au départ",rResidence:"Inventaire divisé par le soutirage",
 rPress:"Pression finale de conduite",rInv:"Inventaire final",rDelta:"Variation d’inventaire",rIn:"Débit d’entrée final",rPeak:"Débit d’entrée de pointe",rDens:"Masse volumique de conduite",rElapsed:"Temps simulé",
 rSupplyWhy:"Fixe la pression que l’entrée peut atteindre et, avec la section, le débit d’entrée maximal",
 rAreaWhy:"Fixe le débit d’entrée à toute pression de conduite et donc la pression d’équilibre",
 rDrawWhy:"Soutirage constant; le taux d’inventaire est le débit d’entrée moins celui-ci",
 riskDistT:"Dynamique répartie de la conduite",riskDist:"Le tronçon est un volume global, aucun gradient de pression ne le parcourt et aucune onde ne s’y propage. Un événement de vanne rapide ou une conduite longue dont les extrémités diffèrent en pression sort de ce modèle d’inventaire.",
 riskIsoT:"Hypothèse isotherme",riskIso:"La température de conduite reste à la valeur saisie, la chaleur de compression du stockage et le refroidissement du déstockage sont donc absents. La pression calculée à température fixe porte cette erreur.",
 riskFloorT:"Plancher de conduite vide",riskFloor:"La marche s’arrête à un inventaire de 1e-9 kg et non à zéro, et la pression qu’elle y annonce est la pression de gaz parfait de cette masse plancher. Un cas qui se vide se lit sur son temps de vidage, pas sur sa pression finale.",
 mNote:"Gaz parfait à γ et R constants et température de conduite fixe. Un volume de contrôle global, pression d’alimentation fixe, soutirage imposé, sans frottement de conduite ni gradient de pression axial."},
es:{title:"Empaquetado de línea de gas — inventario isotérmico concentrado de un tramo",
 summary:"Una línea de {D} mm × {L} m y {V} m³ con gas a {T} °C parte de {p0} bar y se alimenta por un orificio de entrada de {A} mm² con coeficiente de descarga {Cd} desde un suministro a {ps} bar, contra una extracción de {out} kg/s. Tras {t} s la línea queda a {pf} bar y {mf} kg, un cambio de {dm} kg.",
 concPack:"En el estado final la entrada supera a la extracción, así que el tramo sigue ganando inventario al cerrarse la ventana.",
 concDepack:"En el estado final la extracción supera a la entrada, así que el tramo sigue perdiendo inventario al cerrarse la ventana.",
 concEmpty:"El inventario alcanzó el suelo de línea vacía del solver dentro de la ventana; el estado final es ese evento de vaciado, no un estado asentado.",
 system:"El tramo se trata como un único volumen de control isotérmico. El caudal de entrada lo fija un orificio de suministro que trabaja contra la presión instantánea de línea, la extracción es fija, y la diferencia cambia el inventario. La presión sale de la relación de gas ideal aplicada a ese inventario a temperatura de línea fija.",
 figCap:"Presión de línea frente al tiempo en la ventana simulada.",
 ckDepack:"Límite analítico con área de entrada nula",ckDepackB:"Con área de entrada nula el orificio no entrega nada y dm/dt = −ṁ_sal es constante, de modo que el inventario es exactamente lineal en el tiempo y el instante de vaciado vale (m₀ − m_suelo)/ṁ_sal. RK4 integra una constante sin error de truncamiento, así que la marcha debe devolver esa recta y ese instante como aritmética.",
 ckRK4:"Estado final frente a una marcha refinada",ckRK4B:"La misma marcha RK4 clásica, con la fracción de paso y el tope de trazado divididos por dieciséis, es decir una partición realmente más fina de la misma trayectoria. Se comparan la presión final Y el instante final, porque un caso que se vacía alcanza de todos modos la misma presión de umbral y solo el instante puede diferir. La concordancia prueba la integración en vez del modelo.",
 ckHandoff:"Cierre de estado en la transferencia",ckHandoffB:"La transferencia SI entrega presión y densidad de línea y escribe una presión entrante directamente en la presión inicial. El inventario que se deduce de la presión reportada debe ser entonces el inventario con que terminó la marcha, y la densidad reportada debe cumplir la misma relación p = m R T / V.",
 ckEquil:"Sentido de la variación de inventario",ckEquilB:"La relación del orificio decrece de forma monótona con la contrapresión, así que existe una sola presión en que la entrada iguala a la extracción. La tasa de inventario debe apuntar a esa presión, y ser negativa en todo momento cuando ni siquiera la entrada crítica cubre la extracción.",
 ckChoke:"Régimen de entrada en el estado final",ckChokeB:"Relación de presiones p/p_suministro frente a la relación crítica (2/(γ+1))^(γ/(γ−1)). Por debajo el orificio de entrada es crítico y el caudal de entrada depende solo del estado del suministro.",
 ckEnd:"Rama de terminación",ckEndB:"La marcha se detiene en el tiempo de simulación solicitado o cuando el inventario alcanza el suelo de línea vacía localizado por bisección. Lo ocurrido decide si el estado final puede leerse como estado de línea.",
 flowSupply:"Suministro a presión fija",flowInlet:"Orificio de entrada (A_in, Cd)",flowLine:"Tramo de tubería",flowDraw:"Extracción a caudal fijo",
 rPacking:"empaquetando",rDepacking:"desempaquetando",rBalanced:"equilibrado",rNoEq:"sin presión de equilibrio",
 rChoked:"crítico",rSub:"subcrítico",rHorizon:"tiempo de simulación alcanzado",rEmptied:"suelo de línea vacía alcanzado",
 rInv0:"Inventario inicial",rDrawL:"Caudal de extracción",
 rVol:"Volumen de la línea",rP0:"Presión inicial de línea",rPeq:"Presión de equilibrio",rNet:"Tasa neta de inventario",
 rMassFrac:"Cambio de inventario como fracción del inicio",rResidence:"Inventario dividido por la extracción",
 rPress:"Presión final de línea",rInv:"Inventario final",rDelta:"Cambio de inventario",rIn:"Caudal de entrada final",rPeak:"Caudal de entrada máximo",rDens:"Densidad de línea",rElapsed:"Tiempo simulado",
 rSupplyWhy:"Fija la presión que la entrada puede alcanzar y, con el área, el caudal de entrada máximo",
 rAreaWhy:"Fija el caudal de entrada a cualquier presión de línea y con ello la presión de equilibrio",
 rDrawWhy:"Extracción fija; la tasa de inventario es el caudal de entrada menos esta",
 riskDistT:"Dinámica distribuida de la línea",riskDist:"El tramo es un volumen concentrado, así que ningún gradiente de presión lo recorre ni ninguna onda lo atraviesa. Un evento rápido de válvula o una línea larga con extremos a distinta presión queda fuera de este modelo de inventario.",
 riskIsoT:"Hipótesis isotérmica",riskIso:"La temperatura de línea se mantiene en el valor de entrada, así que faltan el calor de compresión al empaquetar y el enfriamiento al desempaquetar. La presión calculada a temperatura fija arrastra ese error.",
 riskFloorT:"Suelo de línea vacía",riskFloor:"La marcha se detiene en un inventario de 1e-9 kg en lugar de cero, y la presión que reporta allí es la presión de gas ideal de esa masa suelo. Un caso que se vacía se lee por su tiempo de vaciado, no por su presión final.",
 mNote:"Gas ideal con γ y R constantes a temperatura de línea fija. Un volumen de control concentrado, presión de suministro fija, extracción impuesta, sin fricción de línea ni gradiente axial de presión."},
pl:{title:"Akumulacja gazu w rurociągu — skupiony izotermiczny zapas odcinka",
 summary:"Rurociąg {D} mm × {L} m o objętości {V} m³ z gazem o {T} °C startuje z {p0} bar i jest zasilany przez kryzę wlotową {A} mm² o współczynniku wypływu {Cd} ze źródła {ps} bar, przy poborze {out} kg/s. Po {t} s rurociąg ma {pf} bar i {mf} kg, zmiana {dm} kg.",
 concPack:"W stanie końcowym dopływ przewyższa pobór, więc odcinek wciąż zyskuje zapas, gdy okno się zamyka.",
 concDepack:"W stanie końcowym pobór przewyższa dopływ, więc odcinek wciąż traci zapas, gdy okno się zamyka.",
 concEmpty:"Zapas osiągnął w oknie dolną granicę pustego rurociągu przyjętą przez solver; stan końcowy to zdarzenie opróżnienia, nie stan ustalony.",
 system:"Odcinek rurociągu traktowany jest jako jedna izotermiczna objętość kontrolna. Strumień wlotowy wyznacza kryza źródłowa pracująca przeciw chwilowemu ciśnieniu w rurociągu, pobór jest stały, a różnica zmienia zapas. Ciśnienie wynika z równania gazu doskonałego dla tego zapasu przy stałej temperaturze rurociągu.",

function dgcLang(){try{return (window.Diagram&&Diagram.lang&&Diagram.lang())||'en';}catch(e){return 'en';}}
function dgcRt(k){var l=dgcLang();return (DGC_RT[l]&&DGC_RT[l][k])||DGC_RT.en[k]||k;}
var DGC_LOC={en:'en-GB',uk:'uk-UA',de:'de-DE',nl:'nl-BE',fr:'fr-BE',es:'es-ES',pl:'pl-PL'};
function dgcNum(v,d){if(!isFinite(v))return '—';
 try{return Number(v).toLocaleString(DGC_LOC[dgcLang()]||'en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});}
 catch(e){return Number(v).toFixed(d);}}

/* Verification computed live from the current state. This is the SELF-CHECK subset:
   the analytic zero-inlet-area limit of the shipped inventory equation, a sixteen-fold
   refinement of the same step rule, and the state closure the SI handoff depends on.
   Every figure is recomputed here, inside the tool, so these rows establish internal
   consistency and nothing more. The published artifact is graded by an external
   independent Python reference and carries these rows beside it, labelled as such. */
var DGC_REF_REFINE=16, DGC_MID_REFINE=4;
function dgcWith(s,o){var r={};for(var k in s)r[k]=s[k];for(var k in o)r[k]=o[k];return r;}
function dgcVolume(s){return Math.PI*s.D*s.D*s.L/4;}
/* The same classical RK4 march as solve() on the same step rule, with the step fraction and
   the plotting cap divided by `refine`, so the shipped answer can be measured against a
   genuinely finer partition of the same trajectory. Nothing else differs. */
function dgcMarch(s,refine){
  var V=dgcVolume(s),m=s.p0*V/(s.R*s.T),t=0,n=0,eps=1e-9,guard=GL_GUARD*refine;
  function rhs(mass){var pr=mass*s.R*s.T/V;
    return gasOrifice(s.pSupply,s.T,pr,s.Cd,s.Ain,s.gamma,s.R).mdot-s.mdotOut;}
  function rk4(mass,h){var a=rhs(mass),b=rhs(Math.max(eps,mass+.5*h*a)),
    c=rhs(Math.max(eps,mass+.5*h*b)),d=rhs(Math.max(eps,mass+h*c));
    return mass+h*(a+2*b+2*c+d)/6;}
  var tgt=glTarget(s,V,eps),f0=Math.abs(rhs(m)),
      tau0=f0>0?Math.abs(m-tgt.m)/f0:0,
      dtFloor=Math.max(1e-12,1e-9*(tau0>0?tau0:s.tEnd)),
      plotCap=Math.max(s.tEnd/GL_PLOT_STEPS,1e-12);
  while(t<s.tEnd&&n<guard){
    var sp=glStep(s,m,t,tgt,rhs(m),dtFloor,plotCap,eps,refine),dt=sp.dt;
    if(sp.settled){t+=dt;n++;continue;}
    var mn=rk4(m,dt);
    if(mn<=eps){var lo=0,hi=dt;
      for(var k=0;k<50;k++){var mid=.5*(lo+hi);if(rk4(m,mid)>eps)lo=mid;else hi=mid;}
      t+=hi;m=eps;break;}
    m=mn;t+=dt;n++;
  }
  return {m:m,t:t,p:m*s.R*s.T/V,steps:n};
}
/* Pressure at which the inlet orifice delivers exactly the withdrawal rate.
   gasOrifice is monotonically decreasing in downstream pressure, so a bisection
   on the tool's own relation locates it. Returns null when even the choked
   inlet cannot meet the withdrawal, in which case the line always depacks. */
function dgcEquilibriumP(s){
  var qMax=gasOrifice(s.pSupply,s.T,0,s.Cd,s.Ain,s.gamma,s.R).mdot;
  if(!(qMax>s.mdotOut))return null;
  var lo=0,hi=s.pSupply;
  for(var k=0;k<200;k++){var mid=.5*(lo+hi);
    if(gasOrifice(s.pSupply,s.T,mid,s.Cd,s.Ain,s.gamma,s.R).mdot>s.mdotOut)lo=mid;else hi=mid;}
  return .5*(lo+hi);
}
/* With no inlet area the orifice returns zero flow, so dm/dt = -mdot_out is a
   constant and the inventory is exactly linear in time. RK4 integrates a
   constant without truncation error, so the march must reproduce the straight
   line and the emptying instant to floating-point precision. */
function dgcZeroInlet(s){
  var a=dgcWith(s,{Ain:0}),V=dgcVolume(a),m0=a.p0*V/(a.R*a.T),eps=1e-9;
  if(!(a.mdotOut>0))return null;
  var tStar=(m0-eps)/a.mdotOut, tRef=Math.min(tStar,a.tEnd);
  var mRef=tRef>=tStar?eps:m0-a.mdotOut*tRef;
  var r=solve(a);
  var relP=Math.abs(r.p-mRef*a.R*a.T/V)/Math.max(Math.abs(mRef*a.R*a.T/V),1e-30);
  var relT=Math.abs(r.time-tRef)/Math.max(tRef,1e-30);
  return {rel:Math.max(relP,relT),relP:relP,relT:relT,
          pRef:mRef*a.R*a.T/V,pGot:r.p,tRef:tRef,tGot:r.time,emptied:tStar<=a.tEnd};
}
/* Returns one row per case: what was measured, what it was measured against,
   the difference and the verdict. No case reports a verdict it cannot show the
   numbers for. */
function dgcVerify(s){
  var out=[],r=solve(s),V=dgcVolume(s);
  var q=gasOrifice(s.pSupply,s.T,r.p,s.Cd,s.Ain,s.gamma,s.R);
  var dmdt=q.mdot-s.mdotOut;

  // 1. Zero-inlet-area analytic limit. The comparison is exact arithmetic on
  //    both sides, so the criterion is floating-point precision.
  var zi=dgcZeroInlet(s);
  out.push({id:'zero-inlet-area-analytic-depacking',key:'ckDepack',graded:!!zi,
    got:zi?zi.pGot:null,ref:zi?zi.pRef:null,abs:zi?Math.abs(zi.pGot-zi.pRef):null,
    rel:zi?zi.rel:null,tol:1e-12,unit:'Pa',dp:6,
    pass:zi?zi.rel<=1e-12:false,status:zi?(zi.rel<=1e-12?'pass':'attention'):'info',
    extra:zi?{tRef:zi.tRef,tGot:zi.tGot,relPressure:zi.relP,relTime:zi.relT,emptied:zi.emptied}:null});

  // 2. Terminal state against the same march on a sixteen-fold finer step fraction.
  //    The criterion is step-fraction convergence, stated as a relative departure: the
  //    shipped step must already be converged to 1e-6 in both the terminal pressure and
  //    the terminal instant. That band is fixed by what the tool prints and by the
  //    fidelity of its own ideal-gas closure, not by the step - a band scaled by the
  //    step could never fail, however coarse the step became. The four-fold run is
  //    carried with the row because the ladder is what shows where the residue sits.
  var ref=dgcMarch(s,DGC_REF_REFINE),mid=dgcMarch(s,DGC_MID_REFINE);
  var dP=Math.abs(r.p-ref.p),relP=dP/Math.max(Math.abs(ref.p),1e-30);
  var dT=Math.abs(r.time-ref.t),relT=dT/Math.max(Math.abs(ref.t),1e-30);
  var relR=Math.max(relP,relT),tolR=1e-6,okP=relR<=tolR;
  out.push({id:'final-pressure-vs-refined-rk4',key:'ckRK4',graded:true,
    got:r.p,ref:ref.p,abs:dP,rel:relR,tol:tolR,unit:'Pa',dp:6,
    pass:okP,status:okP?'pass':'attention',
    extra:{pShipped:r.p,pMid:mid.p,pRefined:ref.p,
           tShipped:r.time,tMid:mid.t,tRefined:ref.t,
           relPressure:relP,relTime:relT,
           refineMid:DGC_MID_REFINE,refineRef:DGC_REF_REFINE,
           stepsShipped:r.steps,stepsMid:mid.steps,stepsRefined:ref.steps,
           spread:Math.abs(r.p-mid.p)}});

  // 3. State closure the SI handoff depends on. The handoff hands out p and rho
  //    and writes an incoming p straight into p0, so the inventory implied by
  //    the reported pressure must be the inventory the march ended with, and
  //    the reported density must satisfy the same ideal-gas relation.
  var mFromP=r.p*V/(s.R*s.T);
  var relM=r.mass!==0?Math.abs(mFromP-r.mass)/Math.abs(r.mass):0;
  var relD=r.p!==0?Math.abs(r.rho*s.R*s.T-r.p)/Math.abs(r.p):0;
  var relHO=Math.max(relM,relD),okHO=relHO<=1e-12;
  out.push({id:'handoff-state-closure',key:'ckHandoff',graded:true,
    got:mFromP,ref:r.mass,abs:Math.abs(mFromP-r.mass),rel:relHO,tol:1e-12,unit:'kg',dp:6,
    pass:okHO,status:okHO?'pass':'attention',
    extra:{relInventory:relM,relDensity:relD,rho:r.rho,volume:V}});

  // 4. Direction of the inventory rate against the equilibrium pressure. The
  //    orifice relation falls monotonically with downstream pressure, so the
  //    line must move toward the pressure where inlet equals withdrawal, and
  //    must depack throughout when no such pressure exists. Exact, no tolerance.
  var pEq=dgcEquilibriumP(s);
  var okE=pEq===null?(dmdt<0):(dmdt===0||(dmdt>0)===(pEq>r.p));
  out.push({id:'inventory-rate-direction',key:'ckEquil',graded:true,
    got:dmdt,ref:pEq,rel:null,tol:null,unit:'kg/s',dp:6,
    pass:okE,status:okE?'pass':'attention',
    word:pEq===null?'rNoEq':(dmdt>0?'rPacking':dmdt<0?'rDepacking':'rBalanced'),
    extra:{pTerminal:r.p,pEquilibrium:pEq,mdotIn:q.mdot,mdotOut:s.mdotOut}});

  // 5. Orifice regime at the terminal state. Reported, not graded: it states
  //    which branch of gasOrifice set the last inlet flow.
  var rc=Math.pow(2/(s.gamma+1),s.gamma/(s.gamma-1));
  out.push({id:'terminal-inlet-regime',key:'ckChoke',graded:false,
    got:q.r,ref:rc,rel:null,unit:'-',dp:4,pass:true,status:'info',
    word:q.choked?'rChoked':'rSub'});

  // 6. How the march ended. Both terminations are legitimate; which one occurred
  //    decides how the terminal state may be read. No criterion, so recorded.
  var atHorizon=r.time>=s.tEnd-1e-12;
  out.push({id:'termination-branch',key:'ckEnd',graded:false,
    got:r.time,ref:s.tEnd,rel:null,unit:'s',dp:4,pass:true,status:'info',
    word:atHorizon?'rHorizon':'rEmptied'});
  return out;
}

/* The report is a separate document without the tool's stylesheet, so the
   figure is drawn into its own canvas at print resolution rather than scraped
   off the screen. Without this the engine falls back to the on-screen stage,
   which carries no caption, no axis titles and no units. */
function dgcFigureCanvas(w,h,scale){
  var c=document.createElement('canvas');
  c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  var ctx=c.getContext('2d'); ctx.scale(scale,scale);
  return {canvas:c,ctx:ctx};
}
function dgcPlotSpec(){
  if(!last||!last.series||!last.series.length)return null;
  return {x:{label:dgcLabel('time'),unit:'s'},
    series:[{x:last.series[0].x,y:last.series[0].y,label:dgcLabel('pressure'),unit:'bar',color:'#1f6feb'}]};
}
var DGC_AXIS={
 time:{en:'Time',uk:'Час',de:'Zeit',nl:'Tijd',fr:'Temps',es:'Tiempo',pl:'Czas'},
 pressure:{en:'Line pressure',uk:'Тиск у лінії',de:'Leitungsdruck',nl:'Leidingdruk',fr:'Pression de conduite',es:'Presión de línea',pl:'Ciśnienie w rurociągu'}
};
function dgcLabel(k){var l=dgcLang();return (DGC_AXIS[k]&&(DGC_AXIS[k][l]||DGC_AXIS[k].en))||k;}
function dgcReportFigure(ctx){
  var spec=dgcPlotSpec(); if(!spec)return null;
  var f=dgcFigureCanvas(720,300,2);
  dgcPlot(f.ctx,720,300,spec,{css:{bg:'#ffffff',muted:'#5a6570',line:'#c9d0d8',text:'#17202a',
    font:'-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif'},fontScale:1});
  return ctx.figure(f.canvas,{caption:dgcRt('figCap'),alt:dgcRt('figCap')});
}
function dgcReportProfile(rec,ctx){
  if(!rec||!last)return null;
  var i=rec.inputs||{}, o=rec.outputs||{}, u=rec.units||{};
  var row=function(label,value,unit,note){return {label:label,value:value,unit:unit||'',note:note||''};};
  var n=dgcNum, V=dgcVolume(i), elapsed=last.time;
  var q=gasOrifice(i.pSupply,i.T,o.p_final,i.Cd,i.Ain,i.gamma,i.R);
  var dmdt=q.mdot-i.mdotOut;
  var m0=i.p0*V/(i.R*i.T);
  var emptied=elapsed<i.tEnd-1e-12;

  var summary=dgcRt('summary')
    .replace('{D}',n(i.D*1000,1)).replace('{L}',n(i.L,1)).replace('{V}',n(V,2))
    .replace('{T}',n(i.T-273.15,1)).replace('{p0}',n(i.p0/1e5,2)).replace('{A}',n(i.Ain*1e6,1))
    .replace('{Cd}',n(i.Cd,2)).replace('{ps}',n(i.pSupply/1e5,2)).replace('{out}',n(i.mdotOut,3))
    .replace('{t}',n(elapsed,2)).replace('{pf}',n(o.p_final/1e5,3))
    .replace('{mf}',n(o.inventory_final,2)).replace('{dm}',n(o.inventory_change,2));

  /* Values are shown in the units an engineer reads them in. The record keeps SI. */
  var tiles=[
    row(dgcRt('rPress'),n(o.p_final/1e5,3),'bar'),
    row(dgcRt('rDelta'),n(o.inventory_change,2),'kg'),
    row(dgcRt('rInv'),n(o.inventory_final,2),'kg'),
    row(dgcRt('rIn'),n(o.mdot_in_final,3),'kg/s'),
    row(dgcRt('rDens'),n(o.rho_final,3),'kg/m³'),
    row(dgcRt('rElapsed'),n(elapsed,2),'s')
  ];
  /* Quantities the tiles do not carry: the geometry behind the inventory, the
     pressure the segment is heading for, and the rate that is taking it there. */
  var pEq=dgcEquilibriumP(i);
  var results=tiles.concat([
    row(dgcRt('rVol'),n(V,3),'m³',n(i.D*1000,1)+' mm × '+n(i.L,1)+' m'),
    row(dgcRt('rP0'),n(i.p0/1e5,3),'bar',dgcRt('rInv0')+': '+n(m0,2)+' kg'),
    row(dgcRt('rPeq'),pEq===null?dgcRt('rNoEq'):n(pEq/1e5,3),pEq===null?'':'bar'),
    row(dgcRt('rNet'),n(dmdt,4),'kg/s',dgcRt(dmdt>0?'rPacking':dmdt<0?'rDepacking':'rBalanced')),
    row(dgcRt('rPeak'),n(o.mdot_in_peak,3),'kg/s'),
    row(dgcRt('rMassFrac'),m0>0?n(100*o.inventory_change/m0,2):'—','%'),
    row(dgcRt('rResidence'),i.mdotOut>0?n(o.inventory_final/i.mdotOut,1):'—','s')
  ]);

  var v=dgcVerify(state);
  var checks=v.map(function(c){
    var st=c.status||(c.pass?'pass':'attention');
    var actual,criterion='',note='';
    if(c.key==='ckDepack'){
      actual=c.rel===null?'—':'max relative departure = '+Number(c.rel).toExponential(2);
      criterion='≤ 1·10⁻¹²';
      if(c.extra)note='p = '+n(c.got/1e5,6)+' bar vs '+n(c.ref/1e5,6)+' bar · t = '+
        n(c.extra.tGot,4)+' s vs '+n(c.extra.tRef,4)+' s';
    } else if(c.key==='ckRK4'){
      actual='|Δp| = '+Number(c.abs).toExponential(3)+' Pa';
      criterion='≤ |dm/dt| R T Δt / V = '+Number(c.tol).toExponential(3)+' Pa';
      if(c.extra)note=n(c.extra.refSteps,0)+' steps · Δt = '+n(c.extra.stepSeconds,4)+
        ' s · 800 → 1600 spread '+Number(c.extra.spread).toExponential(3)+' Pa · relative '+
        Number(c.rel).toExponential(2);
    } else if(c.key==='ckHandoff'){
      actual='max(Δm/m, Δp/p) = '+Number(c.rel).toExponential(2);
      criterion='≤ 1·10⁻¹²';
      if(c.extra)note='m = '+n(c.ref,6)+' kg · ρ = '+n(c.extra.rho,5)+' kg/m³ · V = '+n(c.extra.volume,4)+' m³';
    } else if(c.key==='ckEquil'){
      actual='dm/dt = '+n(c.got,5)+' kg/s ('+dgcRt(c.word)+')';
      criterion=c.ref===null?dgcRt('rNoEq')+', dm/dt < 0':dgcRt('rPeq')+' = '+n(c.ref/1e5,4)+' bar';
      if(c.extra)note='p = '+n(c.extra.pTerminal/1e5,4)+' bar · ṁ_in = '+n(c.extra.mdotIn,4)+
        ' kg/s · ṁ_out = '+n(c.extra.mdotOut,4)+' kg/s';
    } else if(c.key==='ckChoke'){
      actual='p/p_supply = '+n(c.got,4)+' ('+dgcRt(c.word)+')';
      criterion='r_crit = '+n(c.ref,4);
    } else {
      actual=n(c.got,3)+' s ('+dgcRt(c.word)+')';
      criterion=ctx.label('tEnd',u.tEnd||'s')+' = '+n(c.ref,3)+' s';
    }
    return {status:st,title:dgcRt(c.key),actual:actual,criterion:criterion,
            basis:dgcRt(c.key+'B'),detail:note};
  });
  (rec.warnings||[]).forEach(function(w){checks.push({status:'attention',title:dgcRt('ckEnd'),detail:w});});

  var decisions=[
    row(ctx.label('pSupply',u.pSupply),n(i.pSupply/1e5,2)+' bar','',dgcRt('rSupplyWhy')),
    row('A_in · Cd',n(i.Ain*1e6,2)+' mm² · '+n(i.Cd,2),'',dgcRt('rAreaWhy')),
    row(dgcRt('rDrawL'),n(i.mdotOut,3)+' kg/s','',dgcRt('rDrawWhy'))
  ];

function gasOrifice(pu,Tu,pd,Cd,A,gamma,R){
 if(!(pu>pd&&Tu>0&&A>0&&Cd>0))return {mdot:0,choked:false,G:0,r:pd/Math.max(pu,1)};
 var r=Math.max(0,Math.min(1,pd/pu));
 var rc=Math.pow(2/(gamma+1),gamma/(gamma-1));
 var G;
 if(r<=rc){G=pu*Math.sqrt(gamma/(R*Tu))*Math.pow(2/(gamma+1),(gamma+1)/(2*(gamma-1)));return {mdot:Cd*A*G,choked:true,G:G,r:r};}
 var z=Math.max(0,Math.pow(r,2/gamma)-Math.pow(r,(gamma+1)/gamma));
 G=pu*Math.sqrt(2*gamma/(R*Tu*(gamma-1))*z);return {mdot:Cd*A*G,choked:false,G:G,r:r};
}

/* Step size for the inventory march.

   dm/dt = f(m) is autonomous and one-dimensional, so it carries exactly one local timescale:
       tau = |m - m_target| / |dm/dt|,
   the time the rest of the approach would still take at the present rate. m_target is the
   equilibrium inventory when some line pressure makes the inlet meet the withdrawal, and the
   empty-line floor when no such pressure exists. Resolving a fixed fraction of tau makes the
   accuracy a property of the line, the gas and the two boundary flows alone.

   The simulated-time window survives only inside a Math.min(), where it can refine the step so
   that a short window still draws a smooth curve, but can never coarsen it. Sizing the step
   from the window instead - the earlier dt = tEnd/800 - let a wide plotting range put the whole
   transient inside one or two steps: it moved the reported emptying instant by up to 14 % and,
   on a small line behind a large orifice, made the explicit stage unstable and returned line
   pressures thousands of times the supply pressure. */
var GL_STEP_FRAC=0.005, GL_PLOT_STEPS=800, GL_GUARD=60000, GL_SETTLED=1e-11;
/* Inventory at which the inlet delivers exactly the withdrawal, and whether one exists at
   all. When it does not, the line depacks at every pressure and the target is the floor. */
function glTarget(s,V,floor){var pe=dgcEquilibriumP(s);
  return pe===null?{m:floor,eq:false}:{m:pe*V/(s.R*s.T),eq:true};}
/* One inventory step, shared by the shipped march and by the refined march it is checked
   against. `refine` divides both the step fraction and the plotting cap, so a refined run is a
   genuinely finer partition of the same trajectory rather than a different rule.

   The trajectory is monotone towards the target, so the inventory still to come is bounded
   BOTH by the distance left to the target and by what the remaining window can deliver at the
   present rate: it is at most min(|m - m_target|, |dm/dt| (tEnd - t)). Once that bound falls
   below a relative 1e-11 the state cannot move again inside this window, and the rest of the
   window is drawn rather than integrated. Stepping through it instead would let one enormous
   explicit step overshoot a target the physics forbids passing - which is how the previous
   window-sized step returned line pressures above the supply pressure. */
function glStep(s,m,t,tgt,dm,dtFloor,plotCap,eps,refine){
  var af=Math.abs(dm),rem=s.tEnd-t,cap=plotCap/refine,dt;
  if(tgt.eq&&Math.min(Math.abs(m-tgt.m),af*rem)<=GL_SETTLED*Math.max(m,eps))
    return {dt:Math.min(cap,rem),settled:true};
  dt=af>0?GL_STEP_FRAC/refine*Math.abs(m-tgt.m)/af:cap;
  if(!(dt>0))dt=cap;
  dt=Math.min(dt,cap);
  dt=Math.max(dt,dtFloor/refine);
  return {dt:Math.min(dt,rem),settled:false};
}
function solve(s){var V=Math.PI*s.D*s.D*s.L/4,m=s.p0*V/(s.R*s.T),m0=m,t=0,x=[],pp=[],mm=[],peakIn=0,lastIn=0,n=0,eps=1e-9;function rhs(mass){var pr=mass*s.R*s.T/V,q=gasOrifice(s.pSupply,s.T,pr,s.Cd,s.Ain,s.gamma,s.R);return {dm:q.mdot-s.mdotOut,q:q.mdot};}function rk4(mass,h){var a=rhs(mass),b=rhs(Math.max(eps,mass+.5*h*a.dm)),c=rhs(Math.max(eps,mass+.5*h*b.dm)),d=rhs(Math.max(eps,mass+h*c.dm));return {m:mass+h*(a.dm+2*b.dm+2*c.dm+d.dm)/6,q1:a.q,q2:b.q,q3:c.q,q4:d.q};}

/* ---- incoming SI handoff: one range check per accepted quantity -------------
   A quantity that arrives over the handoff is a reading taken somewhere else. A
   pressure named p may be a barometric reading, a pump suction pressure or a
   contained line pressure, and the name alone does not say which (AGENTS.md
   2.4, 2.7). Each accepted quantity is therefore applied only inside LIM, the
   same lo/hi the typed field enforces: a typed value outside the bound is moved
   to it and announced by the framework, an arriving value outside the bound is
   refused and nothing is written for it.
   The refused name is kept out of the `ignored` array, because the framework
   renders that array as "this tool does not use them" and the tool does use
   these quantities; the refusal sentence below carries the reason instead. */
var HO_MAP={T:'T',p:'p0',mdot:'mdotOut',D:'D',L:'L',A:'Ain'};
var HO_OUT=T(
 "{q} = {v} {u} from {f} is outside {lo}–{hi} {u}, the range this tool applies to “{field}”; that input is unchanged.",
 "{q} = {v} {u} від {f} лежить поза діапазоном {lo}–{hi} {u}, який цей інструмент застосовує до «{field}»; це поле не змінено.",
 "{q} = {v} {u} von {f} liegt außerhalb von {lo}–{hi} {u}, dem Bereich, den dieses Werkzeug auf „{field}“ anwendet; dieses Eingabefeld bleibt unverändert.",
 "{q} = {v} {u} van {f} valt buiten {lo}–{hi} {u}, het bereik dat deze tool op „{field}” toepast; dat invoerveld blijft ongewijzigd.",
 "{q} = {v} {u} venant de {f} se situe hors de {lo}–{hi} {u}, la plage que cet outil applique à « {field} » ; ce champ reste inchangé.",
 "{q} = {v} {u} procedente de {f} queda fuera de {lo}–{hi} {u}, el rango que esta herramienta aplica a «{field}»; ese campo no cambia.",
 "{q} = {v} {u} z {f} leży poza zakresem {lo}–{hi} {u}, który to narzędzie stosuje do „{field}”; to pole pozostaje bez zmian.");
/* A figure in the reader's locale. Above 1e4 and below 1e-2 the mantissa and the
   decimal exponent are printed, so a 200 MPa bound stays one short token. */
function hoFig(v){
 if(!isFinite(v))return '—';
 if(v===0)return '0';
 var a=Math.abs(v);
 if(a<0.01||a>=1e4){var e=Math.floor(Math.log(a)/Math.LN10);
  return dgcNum(v/Math.pow(10,e),2)+'e'+(e<0?'':'+')+e;}

}
function hoApply(pl){
 var q=(pl&&pl.quantities)||{},from=(pl&&pl.from&&pl.from.tool)||'—',
     acc=[],ign=[],lang=dgcLang();
 Object.keys(q).forEach(function(n){

    .split('{q}').join(n)
    .split('{v}').join(hoFig(v))
    .split('{lo}').join(hoFig(lim.lo))
    .split('{hi}').join(hoFig(lim.hi))
    .split('{u}').join(lim.u)
    .split('{f}').join(from)
    .split('{field}').join((LBL[key]&&(LBL[key][lang]||LBL[key].en))||key);
   try{if(window.Diagram&&Diagram.notify)Diagram.notify(msg,'warn');}catch(e){}

  }

 });

 id:"gasline-packing",file:"gasline_packing.html",

 record:function(){if(!last)return null;return {inputs:{"D":state["D"],"L":state["L"],"p0":state["p0"],"T":state["T"],"pSupply":state["pSupply"],"Ain":state["Ain"],"Cd":state["Cd"],"mdotOut":state["mdotOut"],"gamma":state["gamma"],"R":state["R"],"tEnd":state["tEnd"]},outputs:{"p_final":last.p,"rho_final":last.rho,"inventory_final":last.mass,"inventory_change":last.delta,"mdot_in_final":last.mdot,"mdot_in_peak":last.peakIn},units:{"D":"m","L":"m","p0":"Pa","T":"K","pSupply":"Pa","Ain":"m2","Cd":"-","mdotOut":"kg/s","gamma":"-","R":"J/(kg K)","tEnd":"s","p_final":"Pa","rho_final":"kg/m3","inventory_final":"kg","inventory_change":"kg","mdot_in_final":"kg/s","mdot_in_peak":"kg/s"},model:{equations:["V = pi D^2 L / 4", "m = p V / (R T)", "dm/dt = mdot_in - mdot_out", "ideal-gas compressible supply-orifice relation"],ranges:["single isothermal control volume", "ideal gas", "fixed supply pressure and specified withdrawal"],notes:["line friction and spatial pressure gradients are outside this lumped inventory model"]},warnings:last.warnings||[]};},
 python:function(){return {code:"\ndef gas_orifice(pu, Tu, pd, Cd, A, gamma, R):\n    if not (pu > pd and Tu > 0 and A > 0 and Cd > 0):\n        return 0.0, False, 0.0\n    r=max(0.0,min(1.0,pd/pu)); rc=(2/(gamma+1))**(gamma/(gamma-1))\n    if r <= rc:\n        G=pu*math.sqrt(gamma/(R*Tu))*(2/(gamma+1))**((gamma+1)/(2*(gamma-1)))\n        return Cd*A*G, True, G\n    z=max(0.0,r**(2/gamma)-r**((gamma+1)/gamma))\n    G=pu*math.sqrt(2*gamma/(R*Tu*(gamma-1))*z)\n    return Cd*A*G, False, G\n\ndef equilibrium_pressure(ps, T, Cd, Ain, gamma, R, out):\n    \"\"\"Line pressure at which the inlet delivers exactly the withdrawal, or None when even\n    the choked inlet cannot meet it. gas_orifice falls monotonically with downstream\n    pressure, so a bisection locates the root.\"\"\"\n    qmax=gas_orifice(ps,T,0.0,Cd,Ain,gamma,R)[0]\n    if not (qmax > out):\n        return None\n    lo,hi=0.0,ps\n    for _ in range(200):\n        mid=0.5*(lo+hi)\n        if gas_orifice(ps,T,mid,Cd,Ain,gamma,R)[0] > out: lo=mid\n        else: hi=mid\n    return 0.5*(lo+hi)\n\ndef compute():\n    D=INPUTS['D']; L=INPUTS['L']; p0=INPUTS['p0']; T=INPUTS['T']; ps=INPUTS['pSupply']; Ain=INPUTS['Ain']; Cd=INPUTS['Cd']; out=INPUTS['mdotOut']; gamma=INPUTS['gamma']; R=INPUTS['R']; tEnd=INPUTS['tEnd']\n    V=math.pi*D*D*L/4; m=p0*V/(R*T); m0=m; t=0.0; peak=0.0; q=0.0; n=0; eps=1e-9\n    STEP_FRAC=0.005; PLOT_STEPS=800; GUARD=60000; SETTLED=1e-11\n    def rhs(mass):\n        p=mass*R*T/V; q,_,_=gas_orifice(ps,T,p,Cd,Ain,gamma,R); return q-out,q\n    def rk4(mass,h):\n        f1,q1=rhs(mass); f2,q2=rhs(max(eps,mass+0.5*h*f1)); f3,q3=rhs(max(eps,mass+0.5*h*f2)); f4,q4=rhs(max(eps,mass+h*f3))\n        return mass+h*(f1+2*f2+2*f3+f4)/6.0,q1,q2,q3,q4\n    # The step comes from the transient, not from the simulated-time window: tau is the time\n    # the rest of the approach would still take at the present rate, and a fixed fraction of\n    # it is resolved. tEnd appears only inside a min(), where it can refine the step for\n    # plotting but never coarsen it.\n    pe=equilibrium_pressure(ps,T,Cd,Ain,gamma,R,out)\n    has_eq = pe is not None\n    m_target = (pe*V/(R*T)) if has_eq else eps\n    f0=abs(rhs(m0)[0]); tau0=(abs(m0-m_target)/f0) if f0>0 else 0.0\n    dt_floor=max(1e-12, 1e-9*(tau0 if tau0>0 else tEnd)); plot_cap=max(tEnd/PLOT_STEPS,1e-12)\n    while t<tEnd and n<GUARD:\n        dm=rhs(m)[0]; af=abs(dm); rem=tEnd-t\n        if has_eq and min(abs(m-m_target), af*rem) <= SETTLED*max(m,eps):\n            t+=min(plot_cap,rem); n+=1; continue\n        dt=(STEP_FRAC*abs(m-m_target)/af) if af>0 else plot_cap\n        if not (dt>0): dt=plot_cap\n        dt=min(dt,plot_cap); dt=max(dt,dt_floor); dt=min(dt,rem)\n        mn,q1,q2,q3,q4=rk4(m,dt); peak=max(peak,q1,q2,q3,q4)\n        if mn<=eps:\n            lo=0.0; hi=dt\n            for _ in range(50):\n                mid=0.5*(lo+hi)\n                if rk4(m,mid)[0]>eps: lo=mid\n                else: hi=mid\n            t+=hi; m=eps; break\n        m=mn; t+=dt; n+=1\n    p=m*R*T/V; q,_,_=gas_orifice(ps,T,p,Cd,Ain,gamma,R); peak=max(peak,q)\n    return {'p_final':p,'rho_final':m/V,'inventory_final':m,'inventory_change':m-m0,'mdot_in_final':q,'mdot_in_peak':peak,'elapsed':t}\n",requires:[],basis:{kind:'reproduce',note:'Standard-library port of the same equations and the same transient-sized stepping rule used by the browser tool.'},selftest:{tolerance:1e-12,note:'Browser and exported Python evaluate the same equations, the same step rule and the same terminal-event bisection; the tolerance only covers floating-point implementation differences.'}};},
 report:{profile:dgcReportProfile},
 handoff:{provides:["p", "rho", "mdot", "D", "L"],accepts:["T", "p", "mdot", "D", "L", "A"],build:function(){if(!last)return null;return {quantities:{p:{value:last.p,unit:'Pa'},rho:{value:last.rho,unit:'kg/m3'},mdot:{value:state.mdotOut,unit:'kg/s'},D:{value:state.D,unit:'m'},L:{value:state.L,unit:'m'}}};},apply:function(p){return hoApply(p);}}
