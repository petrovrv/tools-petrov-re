  "title": {"en":"Window Performance Classes (BE)","uk":"Класи характеристик вікон (BE)","de":"Leistungsklassen von Fenstern (BE)","nl":"Prestatieklassen van ramen (BE)","fr":"Classes de performance des fenêtres (BE)","es":"Clases de prestaciones de ventanas (BE)","pl":"Klasy właściwości okien (BE)"},
  "summary": {"en":"Which air, water and wind classes a window or curtain wall must have on a Belgian site — from height, basic wind speed and terrain by NBN B 25-002-1 — plus operating-force, misuse, durability, impact and burglary classes, a surface-condensation check (fRsi) and the window U-value.","uk":"Які класи повітропроникності, водонепроникності й вітростійкості потрібні вікну чи фасаду на бельгійській ділянці — за висотою, базовою швидкістю вітру й місцевістю за NBN B 25-002-1 — а також класи зусиль відкривання, зловживання, довговічності, ударів і зламостійкості, перевірка конденсату (fRsi) та U вікна.","de":"Welche Luft-, Wasser- und Windklassen ein Fenster oder eine Vorhangfassade auf einem belgischen Standort braucht — aus Höhe, Basiswindgeschwindigkeit und Gelände nach NBN B 25-002-1 — dazu Bedienkräfte, Fehlgebrauch, Dauerfunktion, Stoß- und Einbruchklassen, Tauwasserprüfung (fRsi) und Uw.","nl":"Welke lucht-, water- en windklassen een raam of vliesgevel op een Belgische locatie nodig heeft — uit hoogte, basiswindsnelheid en terrein volgens NBN B 25-002-1 — plus bedieningskrachten, misbruik, duurzaamheid, stoot- en inbraakklassen, een condensatiecontrole (fRsi) en de Uw.","fr":"Quelles classes air, eau et vent une fenêtre ou une façade rideau doit avoir sur un site belge — d’après la hauteur, la vitesse de référence du vent et la rugosité selon la NBN B 25-002-1 — avec les classes d’efforts de manœuvre, d’abus d’utilisation, d’endurance, de choc et d’effraction, un contrôle de condensation (fRsi) et l’Uw.","es":"Qué clases de aire, agua y viento necesita una ventana o un muro cortina en un emplazamiento belga — por altura, velocidad básica del viento y rugosidad según NBN B 25-002-1 — más fuerzas de maniobra, uso indebido, durabilidad, impacto y antirrobo, un control de condensación (fRsi) y la Uw.","pl":"Jakie klasy przepuszczalności powietrza, wodoszczelności i odporności na wiatr musi mieć okno lub ściana osłonowa w Belgii — z wysokości, bazowej prędkości wiatru i terenu wg NBN B 25-002-1 — oraz klasy sił obsługi, niewłaściwego użytkowania, trwałości, uderzeń i włamaniowe, kontrola kondensacji (fRsi) i Uw."},
  "description": {"en":"Enter the reference height ze, the basic wind velocity vb0 of the Belgian map (23–26 m/s) and the terrain roughness (0 coast … IV city). The tool reads the wind exposure class W1–W8 of NBN B 25-002-1:2019 Tab. 2 and gives the air, water and wind classes of Tab. 3 with the notes for air-conditioned rooms, windows without run-off protection, protected windows and buildings above 100 m; the equivalence of the deflection classes (Annex C) and an optional calculation of a mullion against 1/225 (§6.5.5). For curtain walls it gives the CW class, A / R classes of Tab. 14 and the test pressures wK and wU (§7.4). Optional: operating forces, misuse and durability by the use of the window, the EN 356 glass of a burglary class, the EN 13049 impact class by the fall height (Tab. 11), the Method II condensation check (minimum fRsi of Tab. 7 against the frame, the glass edge and the glass centre) and Uw by ISO 10077-1 eq. (1).","uk":"Введіть висоту ze, базову швидкість вітру vb0 з бельгійської карти (23–26 м/с) і шорсткість місцевості (0 узбережжя … IV місто). Інструмент читає клас вітрового впливу W1–W8 з NBN B 25-002-1:2019 Tab. 2 і дає класи повітря, води й вітру з Tab. 3 з примітками для кондиціонованих приміщень, вікон без захисту від стікання води, захищених вікон і будівель понад 100 м; еквівалентність класів прогину (Annex C) і, за бажання, розрахунок імпоста на 1/225 (§6.5.5). Для фасадів — клас CW, класи A / R з Tab. 14 і тиски випробувань wK і wU (§7.4). Додатково: зусилля відкривання, зловживання й довговічність за режимом використання, скло EN 356 для класу зламостійкості, клас удару EN 13049 за висотою падіння (Tab. 11), перевірка конденсату методом II (мінімальний fRsi з Tab. 7 для рами, кромки й центру скла) та Uw за ISO 10077-1 eq. (1).","de":"Geben Sie die Bezugshöhe ze, die Basiswindgeschwindigkeit vb0 der belgischen Karte (23–26 m/s) und die Geländerauigkeit (0 Küste … IV Stadt) ein. Das Werkzeug liest die Windexpositionsklasse W1–W8 aus NBN B 25-002-1:2019 Tab. 2 und gibt Luft-, Wasser- und Windklassen nach Tab. 3 mit den Hinweisen für klimatisierte Räume, Fenster ohne Ablaufschutz, geschützte Fenster und Gebäude über 100 m; die Gleichwertigkeit der Durchbiegungsklassen (Anhang C) und optional die Berechnung eines Pfostens gegen 1/225 (§6.5.5). Für Vorhangfassaden: CW-Klasse, A- / R-Klassen nach Tab. 14 und Prüfdrücke wK, wU (§7.4). Optional: Bedienkräfte, Fehlgebrauch, Dauerfunktion nach Nutzung, EN-356-Glas einer Einbruchklasse, EN-13049-Stoßklasse nach Absturzhöhe (Tab. 11), Tauwasserprüfung Methode II (Mindest-fRsi nach Tab. 7 für Rahmen, Glasrand und Glasmitte) und Uw nach ISO 10077-1 Gl. (1).","nl":"Geef de referentiehoogte ze, de basiswindsnelheid vb0 van de Belgische kaart (23–26 m/s) en de terreinruwheid (0 kust … IV stad). De tool leest de windblootstellingsklasse W1–W8 uit NBN B 25-002-1:2019 Tab. 2 en geeft de lucht-, water- en windklassen van Tab. 3 met de opmerkingen voor geklimatiseerde lokalen, ramen zonder bescherming tegen afstromend water, beschermde ramen en gebouwen boven 100 m; de gelijkwaardigheid van de doorbuigingsklassen (bijlage C) en optioneel een berekening van een stijl tegen 1/225 (§6.5.5). Voor vliesgevels: CW-klasse, A- / R-klassen van Tab. 14 en de proefdrukken wK en wU (§7.4). Optioneel: bedieningskrachten, misbruik en duurzaamheid volgens het gebruik, het EN 356-glas van een inbraakklasse, de EN 13049-stootklasse volgens de valhoogte (Tab. 11), de condensatiecontrole methode II (minimale fRsi van Tab. 7 voor kader, glasrand en glasmidden) en Uw volgens ISO 10077-1 vgl. (1).","fr":"Indiquez la hauteur de référence ze, la vitesse de référence du vent vb0 de la carte belge (23–26 m/s) et la rugosité du terrain (0 côte … IV ville). L’outil lit la classe d’exposition au vent W1–W8 du Tableau 2 de la NBN B 25-002-1:2019 et donne les classes air, eau et vent du Tableau 3 avec les notes pour locaux climatisés, fenêtres non protégées contre l’eau ruisselante, fenêtres protégées et bâtiments de plus de 100 m ; l’équivalence des classes de flèche (annexe C) et, en option, le calcul d’un montant à 1/225 (§6.5.5). Pour les façades rideaux : classe CW, classes A / R du Tableau 14 et pressions d’essai wK et wU (§7.4). En option : efforts de manœuvre, abus d’utilisation et endurance selon l’usage, verre EN 356 d’une classe d’effraction, classe de choc EN 13049 selon la hauteur de chute (Tab. 11), contrôle de condensation méthode II (fRsi minimum du Tab. 7 pour le cadre, le bord et le centre du vitrage) et Uw selon l’ISO 10077-1 éq. (1).","es":"Indique la altura de referencia ze, la velocidad básica del viento vb0 del mapa belga (23–26 m/s) y la rugosidad del terreno (0 costa … IV ciudad). La herramienta lee la clase de exposición al viento W1–W8 de NBN B 25-002-1:2019 Tab. 2 y da las clases de aire, agua y viento de la Tab. 3 con las notas para locales climatizados, ventanas sin protección contra el agua de escorrentía, ventanas protegidas y edificios de más de 100 m; la equivalencia de las clases de flecha (anexo C) y, opcionalmente, el cálculo de un montante contra 1/225 (§6.5.5). Para muros cortina: clase CW, clases A / R de la Tab. 14 y presiones de ensayo wK y wU (§7.4). Opcional: fuerzas de maniobra, uso indebido y durabilidad según el uso, el vidrio EN 356 de una clase antirrobo, la clase de impacto EN 13049 por la altura de caída (Tab. 11), el control de condensación método II (fRsi mínimo de la Tab. 7 para marco, borde y centro del vidrio) y Uw según ISO 10077-1 ec. (1).","pl":"Podaj wysokość odniesienia ze, bazową prędkość wiatru vb0 z mapy belgijskiej (23–26 m/s) i chropowatość terenu (0 wybrzeże … IV miasto). Narzędzie odczytuje klasę ekspozycji na wiatr W1–W8 z NBN B 25-002-1:2019 Tab. 2 i podaje klasy powietrza, wody i wiatru z Tab. 3 z uwagami dla pomieszczeń klimatyzowanych, okien bez ochrony przed spływającą wodą, okien osłoniętych i budynków powyżej 100 m; równoważność klas ugięcia (załącznik C) i opcjonalnie obliczenie słupka względem 1/225 (§6.5.5). Dla ścian osłonowych: klasa CW, klasy A / R z Tab. 14 i ciśnienia badawcze wK i wU (§7.4). Opcjonalnie: siły obsługi, niewłaściwe użytkowanie i trwałość wg sposobu użytkowania, szkło EN 356 dla klasy włamaniowej, klasa uderzeń EN 13049 wg wysokości upadku (Tab. 11), kontrola kondensacji metodą II (minimalny fRsi z Tab. 7 dla ramy, krawędzi i środka szyby) oraz Uw wg ISO 10077-1 wzór (1)."},

  "limitations": {"en":"Belgian rules only (NBN B 25-002-1:2019; STS 52 not available); regional energy (PEB/EPB) and fire rules prevail. ze is taken as the building height unless given (CSTC report n° 11 not available); off-map vb0 or heights outside Tab. 2 are refused. Curtain-wall wK / wU use qp of EN 1991-1-4 with the recommended terrain parameters (the Belgian ANB was not available) and a cp you enter. fRsi of frames and glass edges are typical learning values — use the ISO 10077-2 / EN ISO 10211 value of the real profile. Mullion check: a single simply supported profile under uniform load. Inclined windows above 30° need a special study.","uk":"Лише бельгійські правила (NBN B 25-002-1:2019; STS 52 недоступний); регіональні енергетичні (PEB/EPB) і пожежні правила мають пріоритет. ze приймається рівною висоті будівлі, якщо не задано (звіт CSTC № 11 недоступний); vb0 поза картою чи висоти поза Tab. 2 відхиляються. wK / wU фасадів використовують qp за EN 1991-1-4 з рекомендованими параметрами місцевості (бельгійський ANB недоступний) і введений вами cp. fRsi рам і кромок скла — типові навчальні значення; використовуйте розрахунок ISO 10077-2 / EN ISO 10211 реального профілю. Перевірка імпоста — один шарнірно обпертий профіль під рівномірним навантаженням. Похилі вікна понад 30° потребують окремого дослідження.","de":"Nur belgische Regeln (NBN B 25-002-1:2019; STS 52 nicht verfügbar); regionale Energie- (PEB/EPB) und Brandschutzregeln haben Vorrang. ze = Gebäudehöhe, sofern nicht angegeben (CSTC-Bericht Nr. 11 nicht verfügbar); vb0 außerhalb der Karte oder Höhen außerhalb Tab. 2 werden abgelehnt. wK / wU der Vorhangfassade nutzen qp nach EN 1991-1-4 mit empfohlenen Geländeparametern (belgischer ANB nicht verfügbar) und Ihren cp. fRsi von Rahmen und Glasrand sind typische Lernwerte — verwenden Sie den Wert nach ISO 10077-2 / EN ISO 10211 des echten Profils. Pfostennachweis: ein gelenkig gelagertes Profil unter Gleichlast. Geneigte Fenster über 30° erfordern eine Sonderuntersuchung.","nl":"Alleen Belgische regels (NBN B 25-002-1:2019; STS 52 niet beschikbaar); regionale energie- (EPB) en brandregels gaan voor. ze = gebouwhoogte tenzij opgegeven (WTCB-rapport nr. 11 niet beschikbaar); vb0 buiten de kaart of hoogtes buiten Tab. 2 worden geweigerd. wK / wU van vliesgevels gebruiken qp volgens EN 1991-1-4 met de aanbevolen terreinparameters (Belgische ANB niet beschikbaar) en een cp die u opgeeft. fRsi van kaders en glasranden zijn typische leerwaarden — gebruik de ISO 10077-2 / EN ISO 10211-waarde van het echte profiel. Stijlcontrole: één scharnierend opgelegd profiel onder gelijkmatige last. Hellende ramen boven 30° vragen een bijzondere studie.","fr":"Règles belges uniquement (NBN B 25-002-1:2019 ; STS 52 non disponible) ; les règles régionales énergie (PEB) et incendie priment. ze = hauteur du bâtiment sauf indication (rapport CSTC n° 11 non disponible) ; vb0 hors carte ou hauteurs hors Tableau 2 refusées. wK / wU des façades rideaux utilisent qp de l’EN 1991-1-4 avec les paramètres de terrain recommandés (ANB belge non disponible) et un cp saisi. Les fRsi des cadres et bords de vitrage sont des valeurs pédagogiques typiques — utilisez la valeur ISO 10077-2 / EN ISO 10211 du profilé réel. Contrôle de montant : un profilé simplement appuyé sous charge uniforme. Fenêtres inclinées au-delà de 30° : étude spéciale.","es":"Solo reglas belgas (NBN B 25-002-1:2019; STS 52 no disponible); prevalecen las normas regionales de energía (PEB) e incendio. ze = altura del edificio salvo que se indique (informe CSTC n.º 11 no disponible); vb0 fuera del mapa o alturas fuera de la Tab. 2 se rechazan. wK / wU de muros cortina usan qp de EN 1991-1-4 con los parámetros de terreno recomendados (ANB belga no disponible) y un cp introducido. Los fRsi de marcos y bordes de vidrio son valores didácticos típicos — use el valor ISO 10077-2 / EN ISO 10211 del perfil real. Comprobación de montante: un perfil biapoyado bajo carga uniforme. Ventanas inclinadas más de 30°: estudio especial.","pl":"Tylko przepisy belgijskie (NBN B 25-002-1:2019; STS 52 niedostępna); regionalne przepisy energetyczne (PEB) i pożarowe mają pierwszeństwo. ze = wysokość budynku, jeśli nie podano (raport CSTC nr 11 niedostępny); vb0 spoza mapy lub wysokości spoza Tab. 2 są odrzucane. wK / wU ścian osłonowych używają qp wg EN 1991-1-4 z zalecanymi parametrami terenu (belgijski ANB niedostępny) i podanego cp. fRsi ram i krawędzi szyb to typowe wartości dydaktyczne — użyj wartości ISO 10077-2 / EN ISO 10211 rzeczywistego profilu. Sprawdzenie słupka: jeden swobodnie podparty profil pod obciążeniem równomiernym. Okna pochylone ponad 30° wymagają osobnego opracowania."},

  'nt.cw_min3': ['Tab. 13 starts at CW3: a {w} site still gets CW3.', 'Tab. 13 починається з CW3: ділянка {w} все одно отримує CW3.', 'Tab. 13 beginnt bei CW3: ein {w}-Standort erhält CW3.', 'Tab. 13 begint bij CW3: een {w}-locatie krijgt CW3.', 'Le Tab. 13 commence à CW3 : un site {w} reçoit CW3.', 'La Tab. 13 empieza en CW3: un sitio {w} recibe CW3.', 'Tab. 13 zaczyna się od CW3: lokalizacja {w} dostaje CW3.'],
  'nt.cw_openings': ['Opening vents in the curtain wall follow the window classes of §6.5.7 (Tab. 14 note 4) — switch the element to “window” to read them.', 'Стулки у фасаді мають класи вікон за §6.5.7 (Tab. 14 примітка 4) — перемкніть елемент на «вікно».', 'Öffnungsflügel der Fassade folgen den Fensterklassen nach §6.5.7 (Tab. 14 Hinweis 4) — Bauteil auf „Fenster“ stellen.', 'Opengaande delen in de vliesgevel volgen de raamklassen van §6.5.7 (Tab. 14 opm. 4) — zet het element op “raam”.', 'Les ouvrants de la façade suivent les classes fenêtres du §6.5.7 (Tab. 14 note 4) — passez l’ouvrage sur « fenêtre ».', 'Las hojas practicables del muro siguen las clases de ventana del §6.5.7 (Tab. 14 nota 4) — cambie el elemento a «ventana».', 'Skrzydła otwierane w ścianie osłonowej mają klasy okien wg §6.5.7 (Tab. 14 uwaga 4) — przełącz element na „okno”.'],
  'nt.above100': ['ze above 100 m: a watertightness test under dynamic pressure and spray per NBN EN 13050 is recommended (note 4).', 'ze понад 100 м: рекомендовано випробування водонепроникності під динамічним тиском за NBN EN 13050 (примітка 4).', 'ze über 100 m: Prüfung der Schlagregendichtheit unter dynamischem Druck nach NBN EN 13050 empfohlen (Hinweis 4).', 'ze boven 100 m: waterdichtheidsproef onder dynamische druk volgens NBN EN 13050 aanbevolen (opm. 4).', 'ze > 100 m : essais d’étanchéité sous pression dynamique selon la NBN EN 13050 recommandés (note 4).', 'ze > 100 m: se recomienda el ensayo de estanqueidad con presión dinámica según NBN EN 13050 (nota 4).', 'ze > 100 m: zalecane badanie wodoszczelności przy ciśnieniu dynamicznym wg NBN EN 13050 (uwaga 4).'],
  'nt.maint_100N': ['Vents opened only for maintenance may be tested for racking and torsion at 100 N (Tab. 5 note).', 'Стулки лише для обслуговування можна випробовувати на кут і кручення при 100 Н (Tab. 5 примітка).', 'Nur zur Wartung geöffnete Flügel dürfen mit 100 N auf Verwindung und Torsion geprüft werden (Tab. 5).', 'Enkel voor onderhoud geopende delen mogen met 100 N op schranken en torsie beproefd worden (Tab. 5).', 'Les ouvrants d’entretien peuvent être testés au contreventement et à la torsion sous 100 N (Tab. 5, note).', 'Las hojas de mantenimiento pueden ensayarse a 100 N (Tab. 5, nota).', 'Skrzydła tylko do konserwacji można badać siłą 100 N (Tab. 5, uwaga).'],
  'nt.lowenergy': ['Low-energy building: check the airtightness limit of §6.2 on the test report, not only the class.', 'Низькоенергетична будівля: перевірте межу герметичності §6.2 у протоколі, а не лише клас.', 'Niedrigenergiegebäude: den Luftdichtheitswert nach §6.2 im Prüfbericht prüfen, nicht nur die Klasse.', 'Lage-energiegebouw: controleer de luchtdichtheidsgrens van §6.2 in het proefverslag, niet enkel de klasse.', 'Bâtiment basse énergie : vérifier la limite d’étanchéité du §6.2 sur le rapport d’essai, pas seulement la classe.', 'Edificio de bajo consumo: compruebe el límite de estanqueidad del §6.2 en el informe, no solo la clase.', 'Budynek niskoenergetyczny: sprawdź limit szczelności z §6.2 w raporcie z badań, nie tylko klasę.'],
  'nt.hf': ['The sill counts as protection: Hf = h + 0,5·l = {hf} m ≥ 1,0 m with h ≥ 0,80 m → case 3; the glass then follows NBN S 23-002 case 3 (Safety Glazing tool).', 'Підвіконня рахується захистом: Hf = h + 0,5·l = {hf} м ≥ 1,0 м при h ≥ 0,80 м → випадок 3; скло — за NBN S 23-002 випадок 3 (інструмент безпечного скління).', 'Die Brüstung zählt als Schutz: Hf = h + 0,5·l = {hf} m ≥ 1,0 m bei h ≥ 0,80 m → Fall 3; Glas nach NBN S 23-002 Fall 3 (Sicherheitsglas-Werkzeug).', 'De borstwering telt als bescherming: Hf = h + 0,5·l = {hf} m ≥ 1,0 m met h ≥ 0,80 m → geval 3; glas volgens NBN S 23-002 geval 3 (tool veiligheidsbeglazing).', 'L’allège compte comme protection : Hf = h + 0,5·l = {hf} m ≥ 1,0 m avec h ≥ 0,80 m → cas 3 ; le verre suit la NBN S 23-002 cas 3 (outil vitrage de sécurité).', 'El antepecho cuenta como protección: Hf = h + 0,5·l = {hf} m ≥ 1,0 m con h ≥ 0,80 m → caso 3; el vidrio sigue NBN S 23-002 caso 3 (herramienta de seguridad).', 'Parapet liczy się jako ochrona: Hf = h + 0,5·l = {hf} m ≥ 1,0 m przy h ≥ 0,80 m → przypadek 3; szkło wg NBN S 23-002 przypadek 3 (narzędzie szyb bezpiecznych).'],
  'nt.case1_reco': ['Case 1 (hc ≤ 1,5 m): no fall danger — with safety glass the impact test is only a recommendation (§6.15.2.1).', 'Випадок 1 (hc ≤ 1,5 м): немає небезпеки падіння — з безпечним склом випробування удару лише рекомендоване (§6.15.2.1).', 'Fall 1 (hc ≤ 1,5 m): keine Absturzgefahr — mit Sicherheitsglas ist die Stoßprüfung nur eine Empfehlung (§6.15.2.1).', 'Geval 1 (hc ≤ 1,5 m): geen valgevaar — met veiligheidsglas is de stootproef slechts een aanbeveling (§6.15.2.1).', 'Cas 1 (hc ≤ 1,5 m) : pas de danger de chute — avec un verre de sécurité l’essai de choc n’est qu’une recommandation (§6.15.2.1).', 'Caso 1 (hc ≤ 1,5 m): sin riesgo de caída — con vidrio de seguridad el ensayo de impacto es solo una recomendación (§6.15.2.1).', 'Przypadek 1 (hc ≤ 1,5 m): brak ryzyka upadku — przy szkle bezpiecznym badanie uderzeniowe jest tylko zaleceniem (§6.15.2.1).'],
  'nt.case2_barrier': ['Case 2 (fall > 1,5 m): all checks are required; an opening vent a person can pass through needs a guard rail per NBN B 03-004 (§6.15.2.1).', 'Випадок 2 (падіння > 1,5 м): усі перевірки обов’язкові; стулка, крізь яку може пройти людина, потребує огородження за NBN B 03-004 (§6.15.2.1).', 'Fall 2 (Absturz > 1,5 m): alle Nachweise erforderlich; ein durchsteigbarer Flügel braucht eine Absturzsicherung nach NBN B 03-004.', 'Geval 2 (val > 1,5 m): alle controles verplicht; een opengaand deel waar iemand door kan, vraagt een borstwering volgens NBN B 03-004.', 'Cas 2 (chute > 1,5 m) : toutes les vérifications sont exigées ; un ouvrant permettant le passage d’un corps exige un garde-corps NBN B 03-004.', 'Caso 2 (caída > 1,5 m): todas las comprobaciones; una hoja por la que pase una persona necesita barandilla según NBN B 03-004.', 'Przypadek 2 (upadek > 1,5 m): wszystkie sprawdzenia; skrzydło, przez które przejdzie człowiek, wymaga balustrady wg NBN B 03-004.'],
  'nt.note1': ['Inside, case 3 in category C: only recommended when other impacts are reasonably foreseeable (balls in a sports hall, playground) — Tab. 11 note (1).', 'Всередині, випадок 3 категорії C: лише рекомендація, якщо можливі інші удари (м’ячі, ігровий майданчик) — Tab. 11 примітка (1).', 'Innen, Fall 3 in Kategorie C: nur empfohlen, wenn andere Stöße vorhersehbar sind (Bälle, Pausenhof) — Tab. 11 Hinweis (1).', 'Binnen, geval 3 in categorie C: enkel aanbevolen als andere stoten te verwachten zijn (ballen, speelplaats) — Tab. 11 opm. (1).', 'Intérieur, cas 3 en catégorie C : recommandé seulement si d’autres chocs sont prévisibles (ballons, cour de récréation) — Tab. 11 note (1).', 'Interior, caso 3 en categoría C: solo recomendado si son previsibles otros impactos (balones, patio) — Tab. 11 nota (1).', 'Wewnątrz, przypadek 3 w kategorii C: tylko zalecane, gdy możliwe są inne uderzenia (piłki, boisko) — Tab. 11 uwaga (1).'],
  'nt.cond_bath': ['Short condensation in rooms with momentary humidity (bathroom) or in exceptional cold is acceptable; where it cannot be avoided, the frame needs condensate gutters (Tab. 7 notes 3–4).', 'Короткочасний конденсат у приміщеннях із пікової вологістю (ванна) чи в надзвичайний мороз допустимий; де його не уникнути, рамі потрібні жолоби для конденсату (Tab. 7 примітки 3–4).', 'Kurzes Tauwasser in Räumen mit kurzzeitiger Feuchte (Bad) oder bei außergewöhnlicher Kälte ist zulässig; wo es unvermeidbar ist, braucht der Rahmen Tauwasserrinnen (Tab. 7 Hinweise 3–4).', 'Kortstondige condensatie in lokalen met piekvocht (badkamer) of bij uitzonderlijke koude is aanvaardbaar; waar ze niet te vermijden is, krijgt het kader condensgootjes (Tab. 7 opm. 3–4).', 'Une condensation passagère (salle de bain, froid exceptionnel) est acceptable ; si elle est inévitable, le châssis reçoit des goulottes de récolte (Tab. 7 notes 3–4).', 'La condensación pasajera (baño, frío excepcional) es aceptable; si es inevitable, el marco lleva canaletas de recogida (Tab. 7 notas 3–4).', 'Krótkotrwała kondensacja (łazienka, wyjątkowy mróz) jest dopuszczalna; gdy jest nieunikniona, rama potrzebuje rynienek na skropliny (Tab. 7 uwagi 3–4).'],
  'ch.cap': ['Wind exposure class against the reference height for the chosen vb0 — your terrain bold, the other terrains thin; the dot is your building (NBN B 25-002-1 Tab. 2)', 'Клас вітрового впливу залежно від висоти для вибраної vb0 — ваша місцевість жирно, інші тонко; точка — ваша будівля (NBN B 25-002-1 Tab. 2)', 'Windexpositionsklasse über der Bezugshöhe für das gewählte vb0 — Ihr Gelände fett, die anderen dünn; der Punkt ist Ihr Gebäude (NBN B 25-002-1 Tab. 2)', 'Windblootstellingsklasse tegen de referentiehoogte voor de gekozen vb0 — uw terrein vet, de andere dun; de stip is uw gebouw (NBN B 25-002-1 Tab. 2)', 'Classe d’exposition au vent selon la hauteur pour la vb0 choisie — votre rugosité en gras, les autres en fin ; le point est votre bâtiment (NBN B 25-002-1 Tab. 2)', 'Clase de exposición frente a la altura para la vb0 elegida — su terreno en grueso, los demás finos; el punto es su edificio (NBN B 25-002-1 Tab. 2)', 'Klasa ekspozycji na wiatr w funkcji wysokości dla wybranej vb0 — twój teren pogrubiony, inne cienkie; kropka to twój budynek (NBN B 25-002-1 Tab. 2)'],
  footer: ['Classes by NBN B 25-002-1:2019 (Tab. 2, 3, 13, 14 and their notes; §6.5.5; Annex C; Tab. 4, 5, 8, 10, 11, 12; Method II Tab. 7), qp for curtain walls by EN 1991-1-4 with recommended terrain parameters, Uw by ISO 10077-1:2006 eq. (1) with Annex E Ψg. Typical fRsi of frames and glass edges and the default cp are learning assumptions. Norm values cited by clause, no norm text or table reproduced.', 'Класи за NBN B 25-002-1:2019 (Tab. 2, 3, 13, 14 і примітки; §6.5.5; Annex C; Tab. 4, 5, 8, 10, 11, 12; метод II Tab. 7), qp фасадів за EN 1991-1-4 з рекомендованими параметрами місцевості, Uw за ISO 10077-1:2006 eq. (1) з Ψg з Annex E. Типові fRsi рам і кромок та cp за замовчуванням — навчальні припущення. Значення норм наведено з посиланням на пункт, без відтворення тексту чи таблиць.', 'Klassen nach NBN B 25-002-1:2019 (Tab. 2, 3, 13, 14 und Hinweise; §6.5.5; Anhang C; Tab. 4, 5, 8, 10, 11, 12; Methode II Tab. 7), qp für Vorhangfassaden nach EN 1991-1-4 mit empfohlenen Geländeparametern, Uw nach ISO 10077-1:2006 Gl. (1) mit Ψg aus Anhang E. Typische fRsi und der Standard-cp sind Lernannahmen. Normwerte mit Abschnitt zitiert, kein Normtext und keine Tabelle wiedergegeben.', 'Klassen volgens NBN B 25-002-1:2019 (Tab. 2, 3, 13, 14 en opmerkingen; §6.5.5; bijlage C; Tab. 4, 5, 8, 10, 11, 12; methode II Tab. 7), qp voor vliesgevels volgens EN 1991-1-4 met aanbevolen terreinparameters, Uw volgens ISO 10077-1:2006 vgl. (1) met Ψg uit bijlage E. Typische fRsi en de standaard-cp zijn leeraannames. Normwaarden met artikel geciteerd, geen normtekst of tabel overgenomen.', 'Classes selon la NBN B 25-002-1:2019 (Tab. 2, 3, 13, 14 et notes ; §6.5.5 ; annexe C ; Tab. 4, 5, 8, 10, 11, 12 ; méthode II Tab. 7), qp des façades rideaux selon l’EN 1991-1-4 avec les paramètres de terrain recommandés, Uw selon l’ISO 10077-1:2006 éq. (1) avec Ψg de l’annexe E. Les fRsi typiques et le cp par défaut sont des hypothèses pédagogiques. Valeurs citées par article, aucun texte ni tableau de norme reproduit.', 'Clases según NBN B 25-002-1:2019 (Tab. 2, 3, 13, 14 y notas; §6.5.5; anexo C; Tab. 4, 5, 8, 10, 11, 12; método II Tab. 7), qp de muros cortina según EN 1991-1-4 con parámetros de terreno recomendados, Uw según ISO 10077-1:2006 ec. (1) con Ψg del anexo E. Los fRsi típicos y el cp por defecto son supuestos didácticos. Valores citados por apartado, sin reproducir texto ni tablas.', 'Klasy wg NBN B 25-002-1:2019 (Tab. 2, 3, 13, 14 i uwagi; §6.5.5; załącznik C; Tab. 4, 5, 8, 10, 11, 12; metoda II Tab. 7), qp ścian osłonowych wg EN 1991-1-4 z zalecanymi parametrami terenu, Uw wg ISO 10077-1:2006 wzór (1) z Ψg z załącznika E. Typowe fRsi i domyślne cp to założenia dydaktyczne. Wartości norm cytowane z punktem, bez odtwarzania tekstu i tabel.']
};
function tx(k) { var a = I[k]; return a ? T7(a) : { en: k }; }
function S(k) { return pick(tx(k)); }
var PL = {
  'house-bocage': [['Detached house, bocage, 9 m', 'Окремий будинок, бокаж, 9 м', 'Einfamilienhaus, Bocage, 9 m', 'Vrijstaande woning, bocage, 9 m', 'Maison isolée, bocage, 9 m', 'Vivienda aislada, bocage, 9 m', 'Dom wolnostojący, bocage, 9 m'],
    ['Roughness II, vb0 25 m/s, ze 9 m is already W4 (W3 stops at 6 m): air 3, water 8A (450 Pa), wind C2. At 6 m it would be W3 with 7A — a few metres of building height move the water class.', 'Шорсткість II, vb0 25 м/с, ze 9 м — це вже W4 (W3 закінчується на 6 м): повітря 3, вода 8A (450 Па), вітер C2. На 6 м було б W3 і 7A — кілька метрів висоти змінюють клас води.', 'Rauigkeit II, vb0 25 m/s, ze 9 m ist schon W4 (W3 endet bei 6 m): Luft 3, Wasser 8A (450 Pa), Wind C2. Bei 6 m wäre es W3 mit 7A — wenige Meter Gebäudehöhe verschieben die Wasserklasse.', 'Ruwheid II, vb0 25 m/s, ze 9 m is al W4 (W3 stopt bij 6 m): lucht 3, water 8A (450 Pa), wind C2. Bij 6 m zou het W3 met 7A zijn — een paar meter gebouwhoogte verschuiven de waterklasse.', 'Rugosité II, vb0 25 m/s, ze 9 m donne déjà W4 (W3 s’arrête à 6 m) : air 3, eau 8A (450 Pa), vent C2. À 6 m ce serait W3 et 7A — quelques mètres de hauteur changent la classe d’eau.', 'Rugosidad II, vb0 25 m/s, ze 9 m ya es W4 (W3 acaba en 6 m): aire 3, agua 8A (450 Pa), viento C2. A 6 m sería W3 con 7A — unos metros de altura cambian la clase de agua.', 'Chropowatość II, vb0 25 m/s, ze 9 m to już W4 (W3 kończy się na 6 m): powietrze 3, woda 8A (450 Pa), wiatr C2. Przy 6 m byłoby W3 i 7A — kilka metrów wysokości zmienia klasę wody.']],
  'house-coast': [['Same house on the coast', 'Той самий будинок на узбережжі', 'Dasselbe Haus an der Küste', 'Dezelfde woning aan de kust', 'Même maison à la côte', 'La misma casa en la costa', 'Ten sam dom na wybrzeżu'],
    ['Coastal terrain (roughness 0 exists only in the 26 m/s zone) puts the same 9 m house in W5: air 4, water 9A (600 Pa), wind C3. Terrain, not the province, moves the class.', 'Узбережжя (шорсткість 0 є лише в зоні 26 м/с) ставить той самий будинок 9 м у W5: повітря 4, вода 9A (600 Па), вітер C3. Клас змінює місцевість, а не провінція.', 'Küstengelände (Rauigkeit 0 gibt es nur in der 26-m/s-Zone) setzt dasselbe 9-m-Haus in W5: Luft 4, Wasser 9A (600 Pa), Wind C3. Das Gelände, nicht die Provinz, verschiebt die Klasse.', 'Kustterrein (ruwheid 0 bestaat enkel in de zone 26 m/s) zet dezelfde woning van 9 m in W5: lucht 4, water 9A (600 Pa), wind C3. Het terrein, niet de provincie, verschuift de klasse.', 'La côte (rugosité 0, seulement en zone 26 m/s) place la même maison de 9 m en W5 : air 4, eau 9A (600 Pa), vent C3. C’est le terrain, pas la province, qui fait la classe.', 'La costa (rugosidad 0 solo existe en la zona de 26 m/s) pone la misma casa de 9 m en W5: aire 4, agua 9A (600 Pa), viento C3. El terreno, no la provincia, cambia la clase.', 'Wybrzeże (chropowatość 0 tylko w strefie 26 m/s) daje temu samemu domowi 9 m klasę W5: powietrze 4, woda 9A (600 Pa), wiatr C3. Klasę zmienia teren, nie prowincja.']],
  'house-city': [['Same house in a city', 'Той самий будинок у місті', 'Dasselbe Haus in der Stadt', 'Dezelfde woning in de stad', 'Même maison en ville', 'La misma casa en la ciudad', 'Ten sam dom w mieście'],
    ['City terrain (IV) shelters it: W1 up to 18 m at 25 m/s — air 3, water 5A (200 Pa), wind C1. The same window needs four water classes less in town than at the coast.', 'Місто (IV) його захищає: W1 до 18 м при 25 м/с — повітря 3, вода 5A (200 Па), вітер C1. У місті тому самому вікну треба на чотири класи води менше, ніж на узбережжі.', 'Stadtgelände (IV) schützt: W1 bis 18 m bei 25 m/s — Luft 3, Wasser 5A (200 Pa), Wind C1. Dasselbe Fenster braucht in der Stadt vier Wasserklassen weniger als an der Küste.', 'Stadsterrein (IV) beschut: W1 tot 18 m bij 25 m/s — lucht 3, water 5A (200 Pa), wind C1. Hetzelfde raam heeft in de stad vier waterklassen minder nodig dan aan de kust.', 'La ville (IV) abrite : W1 jusqu’à 18 m à 25 m/s — air 3, eau 5A (200 Pa), vent C1. La même fenêtre demande quatre classes d’eau de moins en ville qu’à la côte.', 'La ciudad (IV) protege: W1 hasta 18 m a 25 m/s — aire 3, agua 5A (200 Pa), viento C1. La misma ventana necesita cuatro clases de agua menos en la ciudad que en la costa.', 'Miasto (IV) osłania: W1 do 18 m przy 25 m/s — powietrze 3, woda 5A (200 Pa), wiatr C1. To samo okno potrzebuje w mieście o cztery klasy wody mniej niż na wybrzeżu.']],
  'office-45': [['45 m office in a city, air-conditioned', 'Офіс 45 м у місті, з кондиціонуванням', 'Büro 45 m in der Stadt, klimatisiert', 'Kantoor 45 m in de stad, geklimatiseerd', 'Bureaux de 45 m en ville, climatisés', 'Oficina de 45 m en ciudad, climatizada', 'Biurowiec 45 m w mieście, klimatyzowany'],
    ['W3 in town even at 45 m; air-conditioning lifts air to class 4 (note 1). The 2,7 m aluminium mullion (I 95 cm⁴, load width 1,35 m) bends ≈ 11 mm at P1 800 Pa: it fails the tested 1/300 (9 mm) but passes 1/225 (12 mm) by calculation — accepted only with P2 and P3 tests at C2.', 'У місті навіть 45 м — це W3; кондиціонування піднімає клас повітря до 4 (примітка 1). Алюмінієвий імпост 2,7 м (I 95 см⁴, ширина 1,35 м) прогинається ≈ 11 мм при P1 800 Па: не проходить 1/300 випробування (9 мм), але проходить 1/225 (12 мм) за розрахунком — лише з випробуваннями P2 і P3 для C2.', 'In der Stadt selbst bei 45 m W3; Klimatisierung hebt die Luftklasse auf 4 (Hinweis 1). Der 2,7-m-Alupfosten (I 95 cm⁴, Lastbreite 1,35 m) biegt sich bei P1 800 Pa um ≈ 11 mm: geprüft 1/300 (9 mm) nicht erfüllt, rechnerisch 1/225 (12 mm) erfüllt — nur mit P2- und P3-Prüfung in C2.', 'In de stad zelfs op 45 m W3; klimatisatie tilt de luchtklasse naar 4 (opm. 1). De alu stijl van 2,7 m (I 95 cm⁴, belastingsbreedte 1,35 m) buigt ≈ 11 mm door bij P1 800 Pa: faalt op 1/300 bij proef (9 mm) maar voldoet aan 1/225 (12 mm) door berekening — enkel met P2- en P3-proeven in C2.', 'En ville W3 même à 45 m ; la climatisation porte l’air en classe 4 (note 1). Le montant alu de 2,7 m (I 95 cm⁴, largeur de charge 1,35 m) fléchit ≈ 11 mm sous P1 800 Pa : il échoue au 1/300 d’essai (9 mm) mais passe le 1/225 (12 mm) par calcul — admis seulement avec les essais P2 et P3 en C2.', 'En ciudad W3 incluso a 45 m; la climatización sube el aire a clase 4 (nota 1). El montante de aluminio de 2,7 m (I 95 cm⁴, ancho de carga 1,35 m) flecta ≈ 11 mm a P1 800 Pa: no cumple 1/300 de ensayo (9 mm) pero sí 1/225 (12 mm) por cálculo — solo con ensayos P2 y P3 en C2.', 'W mieście nawet 45 m to W3; klimatyzacja podnosi klasę powietrza do 4 (uwaga 1). Słupek alu 2,7 m (I 95 cm⁴, szerokość obciążenia 1,35 m) ugina się ≈ 11 mm przy P1 800 Pa: nie spełnia 1/300 z badania (9 mm), ale spełnia 1/225 (12 mm) z obliczeń — tylko z badaniami P2 i P3 w C2.']],
  'flush-6m': [['Window flush with the façade, no drip', 'Вікно в площині фасаду без відливу', 'Fassadenbündiges Fenster ohne Tropfkante', 'Raam in het gevelvlak zonder druiplijst', 'Fenêtre au nu de la façade, sans rejet d’eau', 'Ventana enrasada sin goterón', 'Okno w licu fasady bez kapinosu'],
    ['The site asks W3 and 7A; a window in the façade plane without a drip of at least 20 mm takes all the run-off water and needs the next class, 8A (note 2).', 'Ділянка дає W3 і 7A; вікно в площині фасаду без відливу ≥ 20 мм приймає всю стічну воду й потребує наступного класу 8A (примітка 2).', 'Der Standort verlangt W3 und 7A; ein fassadenbündiges Fenster ohne Tropfkante ≥ 20 mm bekommt das ganze Ablaufwasser und braucht die nächste Klasse, 8A (Hinweis 2).', 'De locatie vraagt W3 en 7A; een raam in het gevelvlak zonder druiplijst van minstens 20 mm krijgt al het afstromende water en vraagt de volgende klasse, 8A (opm. 2).', 'Le site demande W3 et 7A ; une fenêtre au nu sans rejet d’eau d’au moins 20 mm reçoit toute l’eau ruisselante et exige la classe suivante, 8A (note 2).', 'El sitio pide W3 y 7A; una ventana enrasada sin goterón de 20 mm recibe toda el agua de escorrentía y necesita la clase siguiente, 8A (nota 2).', 'Lokalizacja daje W3 i 7A; okno w licu bez kapinosu ≥ 20 mm przyjmuje całą spływającą wodę i wymaga następnej klasy, 8A (uwaga 2).']],
  'canopy-6m': [['Same window under a canopy L ≥ H/4', 'Те саме вікно під навісом L ≥ H/4', 'Dasselbe Fenster unter Vordach L ≥ H/4', 'Hetzelfde raam onder een luifel L ≥ H/4', 'Même fenêtre sous un auvent L ≥ H/4', 'La misma ventana bajo un voladizo L ≥ H/4', 'To samo okno pod daszkiem L ≥ H/4'],
    ['A protected window may be specified in the B class of the same pressure (note 3): 7B instead of 7A. Method B exists only up to 7B — from W4 (8A) the A class stays even under a canopy.', 'Захищене вікно можна задати класом B того ж тиску (примітка 3): 7B замість 7A. Метод B є лише до 7B — від W4 (8A) клас A лишається навіть під навісом.', 'Ein geschütztes Fenster darf in der B-Klasse gleichen Drucks ausgeschrieben werden (Hinweis 3): 7B statt 7A. Verfahren B gibt es nur bis 7B — ab W4 (8A) bleibt die A-Klasse auch unter Vordach.', 'Een beschermd raam mag in de B-klasse met dezelfde druk (opm. 3): 7B i.p.v. 7A. Methode B bestaat maar tot 7B — vanaf W4 (8A) blijft de A-klasse, ook onder een luifel.', 'Une fenêtre protégée peut être prescrite en classe B de même pression (note 3) : 7B au lieu de 7A. La méthode B ne va que jusqu’à 7B — dès W4 (8A) la classe A reste, même sous auvent.', 'Una ventana protegida puede especificarse en la clase B de la misma presión (nota 3): 7B en vez de 7A. El método B solo llega a 7B — desde W4 (8A) se mantiene la clase A incluso bajo voladizo.', 'Okno osłonięte można wpisać w klasie B o tym samym ciśnieniu (uwaga 3): 7B zamiast 7A. Metoda B jest tylko do 7B — od W4 (8A) klasa A zostaje nawet pod daszkiem.']],
  'flat-alu': [['Flat, aluminium frame without thermal break', 'Квартира, алюмінієва рама без терморозриву', 'Wohnung, Alurahmen ohne thermische Trennung', 'Appartement, alu kader zonder thermische onderbreking', 'Appartement, châssis alu sans rupture thermique', 'Piso, marco de aluminio sin rotura de puente', 'Mieszkanie, rama alu bez przekładki'],
    ['Indoor climate class 3 (flats) at θe −3 °C needs fRsi ≥ 0,61 (Tab. 7). An aluminium frame without a break (≈ 0,35) and its glass edge (≈ 0,40) are far below: water runs down the frame in every cold spell. The glass centre (Ug 1,1 → fRsi ≈ 0,86) stays dry — the frame is the weak spot, not the glass.', 'Клас клімату 3 (квартири) при θe −3 °C вимагає fRsi ≥ 0,61 (Tab. 7). Алюмінієва рама без розриву (≈ 0,35) і кромка скла (≈ 0,40) значно нижче: у кожен мороз по рамі стікає вода. Центр скла (Ug 1,1 → fRsi ≈ 0,86) сухий — слабке місце рама, а не скло.', 'Innenklimaklasse 3 (Wohnungen) bei θe −3 °C verlangt fRsi ≥ 0,61 (Tab. 7). Ein Alurahmen ohne Trennung (≈ 0,35) und sein Glasrand (≈ 0,40) liegen weit darunter: bei jedem Frost läuft Wasser am Rahmen. Die Glasmitte (Ug 1,1 → fRsi ≈ 0,86) bleibt trocken — die Schwachstelle ist der Rahmen, nicht das Glas.', 'Binnenklimaatklasse 3 (appartementen) bij θe −3 °C vraagt fRsi ≥ 0,61 (Tab. 7). Een alu kader zonder onderbreking (≈ 0,35) en zijn glasrand (≈ 0,40) zitten ver onder: bij elke vorst loopt er water langs het kader. Het glasmidden (Ug 1,1 → fRsi ≈ 0,86) blijft droog — het zwakke punt is het kader, niet het glas.', 'Climat intérieur classe 3 (logements) à θe −3 °C : fRsi ≥ 0,61 (Tab. 7). Un châssis alu sans rupture (≈ 0,35) et son bord de vitrage (≈ 0,40) sont loin dessous : l’eau coule sur le cadre à chaque gel. Le centre du vitrage (Ug 1,1 → fRsi ≈ 0,86) reste sec — le point faible est le cadre, pas le verre.', 'Clima interior clase 3 (pisos) a θe −3 °C exige fRsi ≥ 0,61 (Tab. 7). Un marco de aluminio sin rotura (≈ 0,35) y su borde de vidrio (≈ 0,40) quedan muy por debajo: con cada helada corre agua por el marco. El centro del vidrio (Ug 1,1 → fRsi ≈ 0,86) sigue seco — el punto débil es el marco, no el vidrio.', 'Klasa klimatu 3 (mieszkania) przy θe −3 °C wymaga fRsi ≥ 0,61 (Tab. 7). Rama alu bez przekładki (≈ 0,35) i krawędź szyby (≈ 0,40) są daleko poniżej: przy każdym mrozie po ramie spływa woda. Środek szyby (Ug 1,1 → fRsi ≈ 0,86) pozostaje suchy — słabym punktem jest rama, nie szkło.']],
  'flat-alu-tb': [['Same flat: thermal break + warm edge', 'Та сама квартира: терморозрив + тепла рамка', 'Dieselbe Wohnung: thermische Trennung + warme Kante', 'Zelfde appartement: thermische onderbreking + warm edge', 'Même appartement : rupture thermique + warm edge', 'El mismo piso: rotura de puente + borde cálido', 'To samo mieszkanie: przekładka + ciepła ramka'],
    ['A thermal break (≈ 0,62) and a warm-edge spacer (≈ 0,66) clear the 0,61 of Tab. 7, and Uw falls to ≈ 1,6 W/(m²·K) by ISO 10077-1 eq. (1). The fRsi values are typical learning values — ask for the calculated value of the real profile.', 'Терморозрив (≈ 0,62) і тепла рамка (≈ 0,66) проходять 0,61 з Tab. 7, а Uw падає до ≈ 1,6 Вт/(м²·К) за ISO 10077-1 eq. (1). fRsi — типові навчальні значення; вимагайте розрахункове значення реального профілю.', 'Thermische Trennung (≈ 0,62) und warme Kante (≈ 0,66) erfüllen die 0,61 aus Tab. 7, und Uw sinkt auf ≈ 1,6 W/(m²·K) nach ISO 10077-1 Gl. (1). Die fRsi sind typische Lernwerte — den berechneten Wert des echten Profils anfordern.', 'Een thermische onderbreking (≈ 0,62) en warm edge (≈ 0,66) halen de 0,61 van Tab. 7, en Uw zakt naar ≈ 1,6 W/(m²·K) volgens ISO 10077-1 vgl. (1). De fRsi zijn typische leerwaarden — vraag de berekende waarde van het echte profiel.', 'Une rupture thermique (≈ 0,62) et un intercalaire warm edge (≈ 0,66) franchissent 0,61 du Tab. 7, et Uw descend à ≈ 1,6 W/(m²·K) selon l’ISO 10077-1 éq. (1). Les fRsi sont des valeurs pédagogiques — demandez la valeur calculée du profilé réel.', 'La rotura de puente (≈ 0,62) y el borde cálido (≈ 0,66) superan el 0,61 de la Tab. 7, y Uw baja a ≈ 1,6 W/(m²·K) según ISO 10077-1 ec. (1). Los fRsi son valores didácticos — pida el valor calculado del perfil real.', 'Przekładka (≈ 0,62) i ciepła ramka (≈ 0,66) przekraczają 0,61 z Tab. 7, a Uw spada do ≈ 1,6 W/(m²·K) wg ISO 10077-1 wzór (1). fRsi to wartości dydaktyczne — żądaj obliczonej wartości rzeczywistego profilu.']],
  'cw-coast-30': [['Curtain wall, 30 m, on the coast', 'Навісний фасад, 30 м, на узбережжі', 'Vorhangfassade, 30 m, an der Küste', 'Vliesgevel, 30 m, aan de kust', 'Façade rideau, 30 m, à la côte', 'Muro cortina, 30 m, en la costa', 'Ściana osłonowa, 30 m, na wybrzeżu'],
    ['W5 → CW5: air A4, water R7 (600 Pa). The test pressures come from the site: wK = 0,80·qp·cp ≈ 1,23 kPa and wU = 1,25·qp·cp ≈ 1,92 kPa with cp 1,0 (learning assumption — enter the project cp) — save the result and Glass Thickness can take the pressure. Maintenance-only vents: force class A, misuse 2, durability E (500 cycles).', 'W5 → CW5: повітря A4, вода R7 (600 Па). Тиски випробувань — із ділянки: wK = 0,80·qp·cp ≈ 1,23 кПа і wU = 1,25·qp·cp ≈ 1,92 кПа при cp 1,0 (навчальне припущення — введіть cp проєкту) — збережіть результат, і «Товщина скла» візьме тиск. Стулки лише для обслуговування: зусилля A, зловживання 2, довговічність E (500 циклів).', 'W5 → CW5: Luft A4, Wasser R7 (600 Pa). Die Prüfdrücke folgen aus dem Standort: wK = 0,80·qp·cp ≈ 1,23 kPa und wU = 1,25·qp·cp ≈ 1,92 kPa mit cp 1,0 (Lernannahme — Projekt-cp eingeben) — Ergebnis speichern, Glasdicke übernimmt den Druck. Wartungsflügel: Kraftklasse A, Fehlgebrauch 2, Dauerfunktion E (500 Zyklen).', 'W5 → CW5: lucht A4, water R7 (600 Pa). De proefdrukken volgen uit de locatie: wK = 0,80·qp·cp ≈ 1,23 kPa en wU = 1,25·qp·cp ≈ 1,92 kPa met cp 1,0 (leeraanname — voer de project-cp in) — sla het resultaat op en Glasdikte neemt de druk over. Onderhoudsramen: krachtklasse A, misbruik 2, duurzaamheid E (500 cycli).', 'W5 → CW5 : air A4, eau R7 (600 Pa). Les pressions d’essai viennent du site : wK = 0,80·qp·cp ≈ 1,23 kPa et wU = 1,25·qp·cp ≈ 1,92 kPa avec cp 1,0 (hypothèse pédagogique — saisissez le cp du projet) — enregistrez et Épaisseur de verre reprendra la pression. Ouvrants d’entretien : effort classe A, abus 2, endurance E (500 cycles).', 'W5 → CW5: aire A4, agua R7 (600 Pa). Las presiones de ensayo salen del sitio: wK = 0,80·qp·cp ≈ 1,23 kPa y wU = 1,25·qp·cp ≈ 1,92 kPa con cp 1,0 (supuesto didáctico — introduzca el cp del proyecto) — guarde el resultado y Espesor de vidrio tomará la presión. Hojas de mantenimiento: fuerza clase A, uso indebido 2, durabilidad E (500 ciclos).', 'W5 → CW5: powietrze A4, woda R7 (600 Pa). Ciśnienia badawcze wynikają z lokalizacji: wK = 0,80·qp·cp ≈ 1,23 kPa i wU = 1,25·qp·cp ≈ 1,92 kPa przy cp 1,0 (założenie dydaktyczne — wpisz cp projektu) — zapisz wynik, a Grubość szkła przejmie ciśnienie. Skrzydła serwisowe: siły klasa A, użytkowanie 2, trwałość E (500 cykli).']],
  'school-ground': [['School classroom on the playground', 'Шкільний клас біля ігрового майданчика', 'Klassenzimmer am Pausenhof', 'Klaslokaal aan de speelplaats', 'Classe d’école sur la cour', 'Aula junto al patio', 'Klasa szkolna przy boisku'],
    ['Category C1, ground floor (case 1, fall ≤ 1,5 m): impact class 4 (700 mm) from the public playground and from inside — with safety glass the test is only recommended, because nobody falls far. Intensive use: misuse class 4, durability 3 (20 000 cycles); class 2 forces (30 N) where users need low forces (Tab. 4 application, e.g. reduced strength); CR2 → P4A glass.', 'Категорія C1, перший поверх (випадок 1, падіння ≤ 1,5 м): клас удару 4 (700 мм) з боку публічного майданчика й зсередини — з безпечним склом випробування лише рекомендоване, бо падати невисоко. Інтенсивне використання: зловживання 4, довговічність 3 (20 000 циклів); зусилля класу 2 (30 Н) там, де користувачам потрібні малі зусилля (застосування Tab. 4, напр. знижена сила); CR2 → скло P4A.', 'Kategorie C1, Erdgeschoss (Fall 1, Absturz ≤ 1,5 m): Stoßklasse 4 (700 mm) vom öffentlichen Pausenhof und von innen — mit Sicherheitsglas nur empfohlen, weil niemand tief fällt. Intensive Nutzung: Fehlgebrauch 4, Dauerfunktion 3 (20 000 Zyklen); Bedienkräfte Klasse 2 (30 N), wo Nutzer geringe Kräfte brauchen (Anwendung Tab. 4, z. B. verminderte Kraft); CR2 → P4A-Glas.', 'Categorie C1, gelijkvloers (geval 1, val ≤ 1,5 m): stootklasse 4 (700 mm) vanaf de publieke speelplaats en van binnen — met veiligheidsglas slechts aanbevolen, want niemand valt diep. Intensief gebruik: misbruik 4, duurzaamheid 3 (20 000 cycli); bedieningskrachten klasse 2 (30 N) waar gebruikers lage krachten nodig hebben (toepassing Tab. 4, bv. verminderde kracht); CR2 → P4A-glas.', 'Catégorie C1, rez-de-chaussée (cas 1, chute ≤ 1,5 m) : classe de choc 4 (700 mm) côté cour publique et côté intérieur — avec un verre de sécurité l’essai n’est que recommandé, personne ne tombe de haut. Usage intensif : abus 4, endurance 3 (20 000 cycles) ; efforts de classe 2 (30 N) là où les usagers ont besoin d’efforts faibles (application du Tab. 4, p. ex. force réduite) ; CR2 → verre P4A.', 'Categoría C1, planta baja (caso 1, caída ≤ 1,5 m): clase de impacto 4 (700 mm) desde el patio público y desde dentro — con vidrio de seguridad solo se recomienda, nadie cae de alto. Uso intensivo: uso indebido 4, durabilidad 3 (20 000 ciclos); fuerzas clase 2 (30 N) donde los usuarios necesitan fuerzas bajas (aplicación de la Tab. 4, p. ej. fuerza reducida); CR2 → vidrio P4A.', 'Kategoria C1, parter (przypadek 1, upadek ≤ 1,5 m): klasa uderzeń 4 (700 mm) od publicznego boiska i od wewnątrz — przy szkle bezpiecznym badanie tylko zalecane, bo nikt nie spadnie wysoko. Intensywne użytkowanie: klasa 4, trwałość 3 (20 000 cykli); siły klasy 2 (30 N) tam, gdzie użytkownicy potrzebują małych sił (zastosowanie Tab. 4, np. obniżona siła); CR2 → szkło P4A.']]
};

  intro: { title: T7(['What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie']),
    body: T7(['A window is tested for air leakage, driving rain and wind; the Belgian standard NBN B 25-002-1 says which test classes it must reach on a given site. The site is summarised in one wind exposure class W1–W8 from three things: how high the building is, how windy the region is and how rough the terrain is. The tool reads that class, the classes it asks for and the notes that move them.', 'Вікно випробовують на повітропроникність, косий дощ і вітер; бельгійський стандарт NBN B 25-002-1 каже, яких класів воно має досягти на ділянці. Ділянка зводиться до класу вітрового впливу W1–W8 з трьох чинників: висота будівлі, вітряність регіону й шорсткість місцевості. Інструмент читає цей клас, потрібні класи й примітки, що їх змінюють.', 'Ein Fenster wird auf Luftdurchlässigkeit, Schlagregen und Wind geprüft; die belgische Norm NBN B 25-002-1 sagt, welche Klassen es auf einem Standort erreichen muss. Der Standort wird zu einer Windexpositionsklasse W1–W8 aus drei Größen: Gebäudehöhe, Windzone und Geländerauigkeit. Das Werkzeug liest diese Klasse, die geforderten Klassen und die Hinweise, die sie verschieben.', 'Een raam wordt beproefd op luchtlekken, slagregen en wind; de Belgische norm NBN B 25-002-1 zegt welke klassen het op een locatie moet halen. De locatie wordt één windblootstellingsklasse W1–W8 uit drie gegevens: gebouwhoogte, windzone en terreinruwheid. De tool leest die klasse, de gevraagde klassen en de opmerkingen die ze verschuiven.', 'Une fenêtre est testée à l’air, à la pluie battante et au vent ; la NBN B 25-002-1 dit quelles classes elle doit atteindre sur un site. Le site se résume à une classe d’exposition W1–W8 à partir de trois données : hauteur du bâtiment, zone de vent et rugosité du terrain. L’outil lit cette classe, les classes demandées et les notes qui les modifient.', 'Una ventana se ensaya a aire, lluvia batiente y viento; la norma belga NBN B 25-002-1 dice qué clases debe alcanzar en un sitio. El sitio se resume en una clase de exposición W1–W8 a partir de tres datos: altura del edificio, zona de viento y rugosidad del terreno. La herramienta lee esa clase, las clases exigidas y las notas que las cambian.', 'Okno bada się na przepuszczalność powietrza, deszcz z wiatrem i wiatr; belgijska norma NBN B 25-002-1 mówi, jakie klasy musi osiągnąć w danej lokalizacji. Lokalizację streszcza jedna klasa ekspozycji W1–W8 z trzech danych: wysokości budynku, strefy wiatrowej i chropowatości terenu. Narzędzie odczytuje tę klasę, wymagane klasy i uwagi, które je zmieniają.']) },
  topics: {
    exposure: { title: T7(['Wind exposure class', 'Клас вітрового впливу', 'Windexpositionsklasse', 'Windblootstellingsklasse', 'Classe d’exposition au vent', 'Clase de exposición al viento', 'Klasa ekspozycji na wiatr']),
      body: T7(['Wind speed grows with height and is slowed by rough ground. Tab. 2 of NBN B 25-002-1 groups all combinations of ze, vb0 and roughness that give the same exposure: the same W4 is a 17 m building on open plain at 25 m/s and a 44 m building in bocage at 24 m/s. The coast (roughness 0) exists only in the 26 m/s zone of the map.', 'Швидкість вітру зростає з висотою й гальмується шорсткою місцевістю. Tab. 2 NBN B 25-002-1 групує комбінації ze, vb0 і шорсткості з однаковим впливом: той самий W4 — це будівля 17 м на рівнині при 25 м/с і будівля 44 м у бокажі при 24 м/с. Узбережжя (шорсткість 0) є лише в зоні 26 м/с.', 'Die Windgeschwindigkeit wächst mit der Höhe und wird durch raues Gelände gebremst. Tab. 2 der NBN B 25-002-1 fasst alle Kombinationen von ze, vb0 und Rauigkeit mit gleicher Exposition zusammen: dasselbe W4 ist ein 17-m-Gebäude im Flachland bei 25 m/s und ein 44-m-Gebäude im Bocage bei 24 m/s. Die Küste (Rauigkeit 0) gibt es nur in der 26-m/s-Zone.', 'De windsnelheid groeit met de hoogte en wordt afgeremd door ruw terrein. Tab. 2 van NBN B 25-002-1 groepeert alle combinaties van ze, vb0 en ruwheid met dezelfde blootstelling: dezelfde W4 is een gebouw van 17 m in open vlakte bij 25 m/s en een van 44 m in bocage bij 24 m/s. De kust (ruwheid 0) bestaat enkel in de zone 26 m/s.', 'La vitesse du vent croît avec la hauteur et est freinée par un terrain rugueux. Le Tab. 2 de la NBN B 25-002-1 regroupe les combinaisons ze, vb0, rugosité de même exposition : le même W4 est un bâtiment de 17 m en plaine à 25 m/s et de 44 m en bocage à 24 m/s. La côte (rugosité 0) n’existe qu’en zone 26 m/s.', 'La velocidad del viento crece con la altura y la frena el terreno rugoso. La Tab. 2 de NBN B 25-002-1 agrupa las combinaciones de ze, vb0 y rugosidad con la misma exposición: el mismo W4 es un edificio de 17 m en llanura a 25 m/s y uno de 44 m en bocage a 24 m/s. La costa (rugosidad 0) solo existe en la zona de 26 m/s.', 'Prędkość wiatru rośnie z wysokością i jest hamowana przez szorstki teren. Tab. 2 NBN B 25-002-1 grupuje kombinacje ze, vb0 i chropowatości o tej samej ekspozycji: to samo W4 to budynek 17 m na równinie przy 25 m/s i 44 m w bocage przy 24 m/s. Wybrzeże (chropowatość 0) istnieje tylko w strefie 26 m/s.']) },

      body: T7(['The class C criterion is 1/300 of the measured span at P1. NBN B 25-002-1 §6.5.5 also accepts 1/225 if a calculation shows it — but the repeated (P2) and safety (P3) tests must still be passed at that class. Annex C: because deflection grows in proportion to pressure, C2 (800 Pa at L/300) is as stiff as B3 (1200 Pa at L/200) and A4 (1600 Pa at L/150).', 'Критерій класу C — 1/300 виміряного прольоту при P1. NBN B 25-002-1 §6.5.5 приймає й 1/225, якщо це показано розрахунком, — але повторні (P2) і безпекові (P3) випробування для цього класу все одно потрібні. Annex C: прогин пропорційний тиску, тож C2 (800 Па при L/300) так само жорсткий, як B3 (1200 Па при L/200) і A4 (1600 Па при L/150).', 'Das Kriterium der Klasse C ist 1/300 der gemessenen Spannweite bei P1. NBN B 25-002-1 §6.5.5 akzeptiert auch 1/225 per Berechnung — die Prüfungen P2 (wiederholt) und P3 (Sicherheit) müssen in dieser Klasse trotzdem bestanden sein. Anhang C: Die Durchbiegung wächst proportional zum Druck, daher ist C2 (800 Pa bei L/300) so steif wie B3 (1200 Pa bei L/200) und A4 (1600 Pa bei L/150).', 'Het criterium van klasse C is 1/300 van de gemeten overspanning bij P1. NBN B 25-002-1 §6.5.5 aanvaardt ook 1/225 via berekening — maar de herhaalde (P2) en veiligheidsproef (P3) moeten in die klasse gehaald zijn. Bijlage C: de doorbuiging groeit evenredig met de druk, dus C2 (800 Pa bij L/300) is even stijf als B3 (1200 Pa bij L/200) en A4 (1600 Pa bij L/150).', 'Le critère de la classe C est 1/300 de la portée mesurée sous P1. La NBN B 25-002-1 §6.5.5 admet aussi 1/225 justifié par calcul — mais les essais P2 (répétés) et P3 (sécurité) doivent être faits à cette classe. Annexe C : la flèche est proportionnelle à la pression, donc C2 (800 Pa à L/300) est aussi rigide que B3 (1200 Pa à L/200) et A4 (1600 Pa à L/150).', 'El criterio de la clase C es 1/300 de la luz medida a P1. NBN B 25-002-1 §6.5.5 admite también 1/225 justificado por cálculo — pero los ensayos P2 (repetidos) y P3 ( inimum par classe de climat intérieur (1 sec … 5 très humide) et zone extérieure (−2 °C côte … −8 °C Hautes Fagnes). Au centre du vitrage fRsi = 1 − Ug·Rsi avec Rsi 0,13 ; cadres et bord du vitrage demandent un calcul 2D (valeurs typiques affichées).', 'fRsi = (θsi − θe)/(θi − θe) indica lo templada que queda la superficie interior más fría: 1 es la temperatura interior, 0 la exterior. Hay condensación cuando θsi baja del punto de rocío. La Tab. 7 da el fRsi mínimo por clase de clima interior (1 seco … 5 muy húmedo) y zona (−2 °C costa … −8 °C Altos Fagnes). En el centro del vidrio fRsi = 1 − Ug·Rsi con Rsi 0,13; marcos y borde necesitan un cálculo 2D (se muestran valores típicos).', 'fRsi = (θsi − θe)/(θi − θe) mówi, jak ciepła pozostaje najzimniejsza powierzchnia wewnętrzna: 1 to temperatura pokoju, 0 zewnętrzna. Kondensacja powstaje, gdy θsi spada poniżej punktu rosy. Tab. 7 podaje minimalny fRsi dla klasy klimatu (1 suchy … 5 bardzo wilgotny) i strefy (−2 °C wybrzeże … −8 °C Hautes Fagnes). Dla środka szyby fRsi = 1 − Ug·Rsi przy Rsi 0,13; ramy i krawędź wymagają obliczenia 2D (pokazane wartości typowe).']) }
