    /* rule statements (report check titles and README) */
    r001: ['A barrier counts as adequately specified only with function, performance criterion and verification method.', 'Бар’єр вважається належно описаним лише з функцією, критерієм ефективності та методом перевірки.', 'Eine Barriere gilt nur mit Funktion, Leistungskriterium und Prüfmethode als ausreichend spezifiziert.', 'Een barrière is pas voldoende gespecificeerd met functie, prestatiecriterium en verificatiemethode.', 'Une barrière n’est correctement spécifiée qu’avec fonction, critère de performance et méthode de vérification.', 'Una barrera solo está bien especificada con función, criterio de desempeño y método de verificación.', 'Bariera jest właściwie opisana tylko z funkcją, kryterium skuteczności i metodą weryfikacji.'],
    r002: ['A verified barrier needs a reference to the evidence of that verification.', 'Перевірений бар’єр потребує посилання на докази цієї перевірки.', 'Eine geprüfte Barriere braucht einen Verweis auf den Nachweis der Prüfung.', 'Een geverifieerde barrière heeft een verwijzing naar het bewijs nodig.', 'Une barrière vérifiée exige une référence à la preuve de cette vérification.', 'Una barrera verificada necesita referencia a la evidencia de esa verificación.', 'Weryfikowana bariera wymaga odniesienia do dowodu tej weryfikacji.'],
    r003: ['Each barrier has a named owner.', 'Кожен бар’єр має визначеного власника.', 'Jede Barriere hat benannte Verantwortliche.', 'Elke barrière heeft een benoemde eigenaar.', 'Chaque barrière a un responsable désigné.', 'Cada barrera tiene un responsable designado.', 'Każda bariera ma wskazanego właściciela.'],
    r004: ['Each barrier states how often it is verified.', 'Для кожного бар’єра вказано частоту перевірки.', 'Für jede Barriere ist das Prüfintervall angegeben.', 'Voor elke barrière is de verificatiefrequentie opgegeven.', 'Chaque barrière indique sa fréquence de vérification.', 'Cada barrera indica su frecuencia de verificación.', 'Każda bariera ma podaną częstotliwość weryfikacji.'],
    r005: ['Preventive barriers stand left of the top event, mitigative barriers right of it.', 'Запобіжні бар’єри стоять ліворуч від головної події, пом’якшувальні — праворуч.', 'Präventive Barrieren stehen links vom Top-Ereignis, mindernde rechts davon.', 'Preventieve barrières staan links van het top event, mitigerende rechts.', 'Les barrières de prévention sont à gauche de l’événement redouté, celles d’atténuation à droite.', 'Las barreras preventivas van a la izquierda del evento principal y las mitigadoras a la derecha.', 'Bariery prewencyjne stoją na lewo od zdarzenia szczytowego, łagodzące na prawo.'],
    r006: ['Detection alone is not a barrier function unless it triggers an action.', 'Саме виявлення не є функцією бар’єра, якщо не запускає дію.', 'Erkennung allein ist keine Barrierenfunktion, solange sie keine Handlung auslöst.', 'Detectie alleen is geen barrièrefunctie zolang er geen actie op volgt.', 'La détection seule n’est pas une fonction de barrière sans action déclenchée.', 'La detección sola no es función de barrera si no desencadena una acción.', 'Sama detekcja nie jest funkcją bariery, jeśli nie uruchamia działania.'],
    r007: ['Barriers on one pathway that share a power supply, sensor, operator or procedure are not independent.', 'Бар’єри одного шляху зі спільним живленням, датчиком, оператором чи процедурою не є незалежними.', 'Barrieren eines Pfads mit gemeinsamer Stromversorgung, Sensor, Bediener oder Verfahren sind nicht unabhängig.', 'Barrières op één pad met gedeelde voeding, sensor, operator of procedure zijn niet onafhankelijk.', 'Des barrières d’un même chemin partageant alimentation, capteur, opérateur ou procédure ne sont pas indépendantes.', 'Las barreras de una vía que comparten alimentación, sensor, operador o procedimiento no son independientes.', 'Bariery jednej ścieżki ze wspólnym zasilaniem, czujnikiem, operatorem lub procedurą nie są niezależne.'],
    r008: ['A barrier that relies on an upstream barrier of its own pathway is not independent of it.', 'Бар’єр, що покладається на попередній бар’єр свого шляху, не є від нього незалежним.', 'Eine Barriere, die auf eine vorgelagerte Barriere ihres Pfads angewiesen ist, ist von ihr nicht unabhängig.', 'Een barrière die steunt op een eerdere barrière van haar pad is daarvan niet onafhankelijk.', 'Une barrière qui s’appuie sur une barrière amont de son chemin n’en est pas indépendante.', 'Una barrera que depende de otra anterior de su vía no es independiente de ella.', 'Bariera zależna od wcześniejszej bariery swojej ścieżki nie jest od niej niezależna.'],
    r009: ['A shared element between prevention and mitigation can defeat both sides at once.', 'Спільний елемент запобігання і пом’якшення може вивести з ладу обидві сторони одночасно.', 'Ein gemeinsames Element von Prävention und Minderung kann beide Seiten zugleich ausschalten.', 'Een gedeeld element van preventie en mitigatie kan beide kanten tegelijk uitschakelen.', 'Un élément partagé entre prévention et atténuation peut neutraliser les deux côtés à la fois.', 'Un elemento compartido entre prevención y mitigación puede anular ambos lados a la vez.', 'Wspólny element prewencji i łagodzenia może jednocześnie unieważnić obie strony.'],
    r010: ['Every barrier is attached to a threat or a consequence.', 'Кожен бар’єр прив’язаний до загрози або наслідку.', 'Jede Barriere ist einer Bedrohung oder Auswirkung zugeordnet.', 'Elke barrière hoort bij een bedreiging of een gevolg.', 'Chaque barrière est rattachée à une menace ou à une conséquence.', 'Cada barrera está vinculada a una amenaza o consecuencia.', 'Każda bariera jest przypisana do zagrożenia lub skutku.'],
    r011: ['Every threat has a counted preventive barrier and every consequence a counted mitigative barrier.', 'Кожна загроза має зарахований запобіжний бар’єр, кожен наслідок — пом’якшувальний.', 'Jede Bedrohung hat eine gezählte präventive, jede Auswirkung eine gezählte mindernde Barriere.', 'Elke bedreiging heeft een meegetelde preventieve en elk gevolg een meegetelde mitigerende barrière.', 'Chaque menace a une barrière de prévention comptée et chaque conséquence une barrière d’atténuation.', 'Cada amenaza tiene una barrera preventiva contada y cada consecuencia una mitigadora.', 'Każde zagrożenie ma zaliczoną barierę prewencyjną, a każdy skutek łagodzącą.'],
    r012: ['Every degradation factor has a degradation control.', 'Кожен фактор деградації має засіб контролю.', 'Jeder Degradationsfaktor hat eine Gegenmaßnahme.', 'Elke degradatiefactor heeft een beheersmaatregel.', 'Chaque facteur de dégradation a une mesure associée.', 'Cada factor de degradación tiene un control.', 'Każdy czynnik degradacji ma środek zaradczy.'],
    r013: ['The model names its hazard and its top event.', 'Модель називає свою небезпеку та головну подію.', 'Das Modell benennt Gefahr und Top-Ereignis.', 'Het model benoemt gevaar en top event.', 'Le modèle nomme son danger et son événement redouté.', 'El modelo nombra su peligro y su evento principal.', 'Model nazywa źródło zagrożenia i zdarzenie szczytowe.'],
    r014: ['References point to existing items on the same pathway.', 'Посилання вказують на наявні елементи того ж шляху.', 'Verweise zeigen auf vorhandene Elemente desselben Pfads.', 'Verwijzingen wijzen naar bestaande items op hetzelfde pad.', 'Les références visent des éléments existants du même chemin.', 'Las referencias apuntan a elementos existentes de la misma vía.', 'Odniesienia wskazują istniejące elementy tej samej ścieżki.'],
    r015: ['Barrier count on a pathway is not its number of independent barriers.', 'Кількість бар’єрів на шляху не дорівнює кількості незалежних.', 'Die Barrierenanzahl eines Pfads ist nicht die Zahl unabhängiger Barrieren.', 'Het aantal barrières op een pad is niet het aantal onafhankelijke.', 'Le nombre de barrières d’un chemin n’est pas celui des barrières indépendantes.', 'El número de barreras de una vía no es el de barreras independientes.', 'Liczba barier na ścieżce nie jest liczbą barier niezależnych.'],
    r016: ['Risk acceptability is not concluded without a user-defined criterion.', 'Висновок про прийнятність ризику не робиться без заданого користувачем критерію.', 'Ohne nutzerdefiniertes Kriterium wird keine Risikoakzeptanz gefolgert.', 'Zonder door de gebruiker gedefinieerd criterium volgt geen oordeel over aanvaardbaarheid.', 'Aucune conclusion d’acceptabilité sans critère défini par l’utilisateur.', 'Sin un criterio definido por el usuario no se concluye la aceptabilidad.', 'Bez kryterium użytkownika nie formułuje się wniosku o akceptowalności.'],
    r017: ['Node identifiers are unique and survive renaming.', 'Ідентифікатори вузлів унікальні й не змінюються при перейменуванні.', 'Knotenkennungen sind eindeutig und überdauern Umbenennungen.', 'Knooppuntidentificaties zijn uniek en blijven bij hernoemen.', 'Les identifiants de nœud sont uniques et survivent au renommage.', 'Los identificadores de nodo son únicos y sobreviven al renombrado.', 'Identyfikatory węzłów są unikalne i nie zmieniają się przy zmianie nazwy.'],
    r018: ['Every threat, consequence and barrier has a name.', 'Кожна загроза, наслідок і бар’єр мають назву.', 'Jede Bedrohung, Auswirkung und Barriere hat eine Bezeichnung.', 'Elke bedreiging, elk gevolg en elke barrière heeft een naam.', 'Chaque menace, conséquence et barrière porte un nom.', 'Cada amenaza, consecuencia y barrera tiene nombre.', 'Każde zagrożenie, skutek i bariera mają nazwę.'],

    rFig: ['Bow-tie as recorded. Threats T left, top event TE centre, consequences C right; barrier codes match the register. Mark and fill give the status: tick complete, exclamation attention, cross incomplete. Triangle with number: degradation factors. Dashed lines: declared shared elements or dependencies.', 'Bow-tie у записаному вигляді. Загрози T ліворуч, головна подія TE у центрі, наслідки C праворуч; коди бар’єрів відповідають реєстру. Позначка й заливка показують статус: галочка — повний, знак оклику — увага, хрестик — неповний. Трикутник із числом — фактори деградації. Пунктир — заявлені спільні елементи або залежності.', 'Bow-Tie wie erfasst. Bedrohungen T links, Top-Ereignis TE Mitte, Auswirkungen C rechts; Barrierencodes wie im Register. Zeichen und Füllung zeigen den Status: Haken vollständig, Ausrufezeichen prüfen, Kreuz unvollständig. Dreieck mit Zahl: Degradationsfaktoren. Gestrichelt: erfasste gemeinsame Elemente oder Abhängigkeiten.', 'Bow-tie zoals vastgelegd. Bedreigingen T links, top event TE midden, gevolgen C rechts; barrièrecodes zoals in het register. Teken en vulling geven de status: vinkje volledig, uitroepteken aandacht, kruis onvolledig. Driehoek met getal: degradatiefactoren. Gestippeld: opgegeven gedeelde elementen of afhankelijkheden.', 'Nœud papillon tel que saisi. Menaces T à gauche, événement redouté TE au centre, conséquences C à droite ; codes des barrières identiques au registre. Signe et remplissage donnent le statut : coche complète, point d’exclamation à revoir, croix incomplète. Triangle chiffré : facteurs de dégradation. Tirets : éléments partagés ou dépendances déclarés.', 'Bow-tie tal como está registrado. Amenazas T a la izquierda, evento principal TE en el centro, consecuencias C a la derecha; los códigos coinciden con el registro. Marca y relleno indican el estado: visto completa, exclamación revisar, aspa incompleta. Triángulo con número: factores de degradación. Discontinuas: elementos compartidos o dependencias declarados.', 'Bow-tie w zapisanej postaci. Zagrożenia T po lewej, zdarzenie szczytowe TE w środku, skutki C po prawej; kody barier jak w rejestrze. Znak i wypełnienie pokazują status: ptaszek kompletna, wykrzyknik do sprawdzenia, krzyżyk niekompletna. Trójkąt z liczbą: czynniki degradacji. Linie przerywane: zadeklarowane wspólne elementy lub zależności.'],
    rFigLeft: ['Preventive side only, enlarged: threats T to top event TE.', 'Лише запобіжна сторона, збільшено: загрози T до головної події TE.', 'Nur präventive Seite, vergrößert: Bedrohungen T bis Top-Ereignis TE.', 'Alleen preventieve kant, vergroot: bedreigingen T tot top event TE.', 'Côté prévention seul, agrandi : menaces T jusqu’à l’événement TE.', 'Solo lado preventivo, ampliado: amenazas T hasta el evento TE.', 'Tylko strona prewencyjna, powiększona: zagrożenia T do zdarzenia TE.'],
    rFigRight: ['Mitigative side only, enlarged: top event TE to consequences C.', 'Лише пом’якшувальна сторона, збільшено: головна подія TE до наслідків C.', 'Nur mindernde Seite, vergrößert: Top-Ereignis TE bis Auswirkungen C.', 'Alleen mitigerende kant, vergroot: top event TE tot gevolgen C.', 'Côté atténuation seul, agrandi : événement TE jusqu’aux conséquences C.', 'Solo lado mitigador, ampliado: evento TE hasta las consecuencias C.', 'Tylko strona łagodząca, powiększona: zdarzenie TE do skutków C.'],
    rNote1: ['Status per barrier: incomplete when function, performance criterion or verification method is missing; attention when any other rule reports on the barrier or its degradation factors; complete otherwise. Preventive and mitigative counts include only barriers whose declared role matches their side.', 'Статус бар’єра: неповний, якщо бракує функції, критерію ефективності чи методу перевірки; увага, якщо будь-яке інше правило має зауваження до бар’єра чи його факторів деградації; інакше повний. Запобіжні й пом’якшувальні бар’єри лічаться лише тоді, коли заявлена роль збігається зі стороною.', 'Status je Barriere: unvollständig, wenn Funktion, Leistungskriterium oder Prüfmethode fehlt; prüfen bei jedem anderen Befund zur Barriere oder ihren Degradationsfaktoren; sonst vollständig. Präventive und mindernde Barrieren zählen nur, wenn die erfasste Rolle zur Seite passt.', 'Status per barrière: onvolledig als functie, prestatiecriterium of verificatiemethode ontbreekt; aandacht bij elke andere bevinding over de barrière of haar degradatiefactoren; anders volledig. Preventieve en mitigerende aantallen tellen alleen barrières waarvan de opgegeven rol bij de kant past.', 'Statut par barrière : incomplète s’il manque la fonction, le critère de performance ou la méthode de vérification ; à revoir si une autre règle signale la barrière ou ses facteurs de dégradation ; complète sinon. Les nombres de barrières de prévention et d’atténuation ne comptent que celles dont le rôle déclaré correspond au côté.', 'Estado por barrera: incompleta si falta la función, el criterio de desempeño o el método de verificación; revisar si otra regla informa sobre la barrera o sus factores de degradación; completa en otro caso. Los recuentos preventivo y mitigador solo incluyen barreras cuya función declarada coincide con su lado.', 'Status bariery: niekompletna, gdy brak funkcji, kryterium skuteczności lub metody weryfikacji; do sprawdzenia przy każdej innej uwadze do bariery lub jej czynników degradacji; w pozostałych przypadkach kompletna. Liczby barier prewencyjnych i łagodzących obejmują tylko bariery, których zadeklarowana rola zgadza się ze stroną.'],
    rNote2: ['A barrier is counted on its pathway when its declared role matches its side and it is not a detection element without a triggered action. Independent groups join counted barriers of one pathway that share an element or depend on each other.', 'Бар’єр зараховується на своєму шляху, якщо заявлена роль збігається зі стороною і це не виявлення без дії. Незалежні групи об’єднують зараховані бар’єри шляху зі спільним елементом або взаємною залежністю.', 'Eine Barriere zählt auf ihrem Pfad, wenn Rolle und Seite übereinstimmen und sie keine Erkennung ohne Handlung ist. Unabhängige Gruppen fassen gezählte Barrieren eines Pfads zusammen, die ein Element teilen oder voneinander abhängen.', 'Een barrière telt mee op haar pad als rol en kant overeenkomen en het geen detectie zonder actie is. Onafhankelijke groepen voegen meegetelde barrières van één pad samen die een element delen of van elkaar afhangen.', 'Une barrière est comptée sur son chemin si son rôle correspond à son côté et si ce n’est pas une détection sans action. Les groupes indépendants réunissent les barrières comptées d’un chemin qui partagent un élément ou dépendent l’une de l’autre.', 'Una barrera cuenta en su vía si su función declarada coincide con su lado y no es una detección sin acción. Los grupos independientes unen las barreras contadas de una vía que comparten un elemento o dependen entre sí.', 'Bariera jest zaliczana na swojej ścieżce, gdy zadeklarowana rola zgadza się ze stroną i nie jest detekcją bez działania. Niezależne grupy łączą zaliczone bariery ścieżki, które dzielą element lub od siebie zależą.'],
    rNote3: ['Shared elements are compared as entered, ignoring case and spacing; an element that is not entered cannot be found.', 'Спільні елементи порівнюються як введено, без урахування регістру та пробілів; невведений елемент знайти неможливо.', 'Gemeinsame Elemente werden wie eingegeben verglichen, ohne Groß-/Kleinschreibung und Leerzeichen; nicht eingetragene Elemente bleiben unentdeckt.', 'Gedeelde elementen worden vergeleken zoals ingevoerd, zonder hoofdletters en spaties; een niet ingevoerd element wordt niet gevonden.', 'Les éléments partagés sont comparés tels que saisis, sans tenir compte de la casse ni des espaces ; un élément non saisi reste invisible.', 'Los elementos compartidos se comparan tal como se introducen, sin mayúsculas ni espacios; un elemento no introducido no se detecta.', 'Wspólne elementy porównuje się w postaci wpisanej, bez wielkości liter i spacji; niewpisanego elementu nie da się wykryć.'],
    rRef1: ['CCPS and Energy Institute, Bow Ties in Risk Management: A Concept Book for Process Safety, Wiley, 2018.', 'CCPS and Energy Institute, Bow Ties in Risk Management: A Concept Book for Process Safety, Wiley, 2018.', 'CCPS and Energy Institute, Bow Ties in Risk Management: A Concept Book for Process Safety, Wiley, 2018.', 'CCPS and Energy Institute, Bow Ties in Risk Management: A Concept Book for Process Safety, Wiley, 2018.', 'CCPS and Energy Institute, Bow Ties in Risk Management: A Concept Book for Process Safety, Wiley, 2018.', 'CCPS and Energy Institute, Bow Ties in Risk Management: A Concept Book for Process Safety, Wiley, 2018.', 'CCPS and Energy Institute, Bow Ties in Risk Management: A Concept Book for Process Safety, Wiley, 2018.'],

    rRef3: ['IEC 61511-1, functional safety for the process industry sector: independence of protection layers as a concept, not as a SIL calculation.', 'IEC 61511-1, функціональна безпека для процесної галузі: незалежність шарів захисту як поняття, не як розрахунок SIL.', 'IEC 61511-1, funktionale Sicherheit in der Prozessindustrie: Unabhängigkeit von Schutzebenen als Begriff, keine SIL-Berechnung.', 'IEC 61511-1, functionele veiligheid in de procesindustrie: onafhankelijkheid van beschermingslagen als begrip, geen SIL-berekening.', 'IEC 61511-1, sécurité fonctionnelle du secteur des procédés : indépendance des couches de protection comme notion, sans calcul SIL.', 'IEC 61511-1, seguridad funcional en la industria de procesos: independencia de capas de protección como concepto, sin cálculo SIL.', 'IEC 61511-1, bezpieczeństwo funkcjonalne w przemyśle procesowym: niezależność warstw zabezpieczeń jako pojęcie, bez obliczeń SIL.'],

  function langIdx(l) { var i = LANGS.indexOf(l); return i < 0 ? 0 : i; }
  function tx(key, l, p) {
    var row = S[key];
    var s = row ? (row[langIdx(l)] || row[0]) : key;
    if (p) s = s.replace(/\{(\w+)\}/g, function (m, k) { return p[k] != null ? String(p[k]) : m; });
    return s;
  }
  /* seven-language label object, for framework slots that pick by language */
  function TL(key, p) { var o = {}; LANGS.forEach(function (l) { o[l] = tx(key, l, p); }); return o; }
  function nf(n, l) {
    try { return new Intl.NumberFormat(LOCALE[l] || 'en-GB').format(n); } catch (e) { return String(n); }
  }

  /* ============================================= 2. model and rule engine */
  var MODEL_SCHEMA = 'tools.petrov.re/bowtiebuilder-model/v1';
  var EXCHANGE_SCHEMA = 'tools.petrov.re/safety-exchange/v1';
  var EXCHANGE_KIND = 'bowtie.barriers';
  var EXCHANGE_KEY = 'tools.petrov.re/safety-exchange/' + EXCHANGE_KIND;
  var DRAFT_KEY = 'dgu.bowtiebuilder.model.draft';
  var RULE_PACK = 'BT-2026.1';
  var TYPES = ['engineered', 'procedural', 'human', 'detection', 'response'];
  var ROLES = ['preventive', 'mitigative'];
  var CATS = ['power', 'sensor', 'operator', 'procedure'];
  var STATUSES = ['complete', 'attention', 'incomplete'];
  var ACTS = ['', 'yes', 'no'];
  var SRC_CCPS = 'CCPS/EI, Bow Ties in Risk Management (2018)';
  var SRC_IEC = 'IEC 61511-1 independence concept; CCPS/EI (2018)';

  /* Rule registry. kind is one of physical|guidance|national|company|heuristic|illustrative.
     sev: fail -> barrier incomplete (specification only, BT-R-001); warn -> attention. flag: counted as dependency flag. */
  var RULES = {
    'BT-R-001': { text: 'r001', sev: 'fail', basis: { kind: 'guidance', source: SRC_CCPS + ': barrier described by function, performance and verification', jurisdiction: 'international', version: '2018' } },
    'BT-R-002': { text: 'r002', sev: 'warn', basis: { kind: 'guidance', source: SRC_CCPS + ': barriers are auditable', jurisdiction: 'international', version: '2018' } },
    'BT-R-003': { text: 'r003', sev: 'warn', basis: { kind: 'heuristic', source: 'bowtiebuilder rule pack ' + RULE_PACK, jurisdiction: 'none', version: RULE_PACK } },
    'BT-R-004': { text: 'r004', sev: 'warn', basis: { kind: 'heuristic', source: 'bowtiebuilder rule pack ' + RULE_PACK, jurisdiction: 'none', version: RULE_PACK } },
    'BT-R-005': { text: 'r005', sev: 'warn', basis: { kind: 'guidance', source: SRC_CCPS + ': bow-tie diagram convention', jurisdiction: 'international', version: '2018' } },
    'BT-R-006': { text: 'r006', sev: 'warn', basis: { kind: 'guidance', source: SRC_CCPS + ': detect, decide and act elements', jurisdiction: 'international', version: '2018' } },
    'BT-R-007': { text: 'r007', sev: 'warn', flag: true, basis: { kind: 'guidance', source: SRC_IEC, jurisdiction: 'international', version: 'conceptual' } },
    'BT-R-008': { text: 'r008', sev: 'warn', flag: true, basis: { kind: 'guidance', source: SRC_IEC, jurisdiction: 'international', version: 'conceptual' } },
    'BT-R-009': { text: 'r009', sev: 'warn', flag: true, basis: { kind: 'guidance', source: SRC_IEC, jurisdiction: 'international', version: 'conceptual' } },
    'BT-R-010': { text: 'r010', sev: 'warn', basis: { kind: 'heuristic', source: 'bowtiebuilder graph integrity', jurisdiction: 'none', version: RULE_PACK } },
    'BT-R-011': { text: 'r011', sev: 'warn', basis: { kind: 'guidance', source: SRC_CCPS + ': each threat and consequence has barriers', jurisdiction: 'international', version: '2018' } },
    'BT-R-012': { text: 'r012', sev: 'warn', basis: { kind: 'guidance', source: SRC_CCPS + ': degradation factors and controls', jurisdiction: 'international', version: '2018' } },
    'BT-R-013': { text: 'r013', sev: 'warn', basis: { kind: 'heuristic', source: 'bowtiebuilder insufficient-data rule', jurisdiction: 'none', version: RULE_PACK } },
    'BT-R-014': { text: 'r014', sev: 'warn', basis: { kind: 'heuristic', source: 'bowtiebuilder graph integrity', jurisdiction: 'none', version: RULE_PACK } },
    'BT-R-015': { text: 'r015', sev: 'warn', basis: { kind: 'guidance', source: SRC_IEC, jurisdiction: 'international', version: 'conceptual' } },
    'BT-R-016': { text: 'r016', sev: 'info', basis: { kind: 'heuristic', source: 'bowtiebuilder scope statement', jurisdiction: 'none', version: RULE_PACK } },
    'BT-R-017': { text: 'r017', sev: 'info', basis: { kind: 'heuristic', source: 'safety series stable-ID policy (appendix B)', jurisdiction: 'none', version: RULE_PACK } },

  };
  var RULE_IDS = Object.keys(RULES);

  function str(v) { return v == null ? '' : String(v); }
  function blank(v) { return !str(v).trim(); }
  function norm(v) { return str(v).toLowerCase().replace(/\s+/g, ' ').trim(); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function uuid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    var b = [];
    for (var i = 0; i < 16; i++) b.push(Math.floor(Math.random() * 256));
    try { if (window.crypto && crypto.getRandomValues) { var a = new Uint8Array(16); crypto.getRandomValues(a); b = Array.prototype.slice.call(a); } } catch (e) {}
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = b.map(function (x) { return (x + 256).toString(16).slice(1); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  function emptyModel() { return { v: 1, hazard: '', topEvent: '', threats: [], consequences: [], barriers: [], degradations: [] }; }
  function newBarrier(pathwayId, role, label) {
    return { id: uuid(), pathway: pathwayId || '', label: label || '', role: role || 'preventive', type: 'engineered',
      func: '', owner: '', criterion: '', verification: '', frequency: '', evidence: '', acts: '',
      dep: { power: '', sensor: '', operator: '', procedure: '' }, upstream: [] };
  }

  /* codes are display handles derived from order; ids are the stable keys */
  function analyse(m) {
    var byId = {}, codes = {}, kindOf = {}, findings = [];
    var threatIdx = {}, consIdx = {};
    m.threats.forEach(function (t, i) { byId[t.id] = t; kindOf[t.id] = 'threat'; codes[t.id] = 'T' + (i + 1); threatIdx[t.id] = i; });
    m.consequences.forEach(function (c, i) { byId[c.id] = c; kindOf[c.id] = 'consequence'; codes[c.id] = 'C' + (i + 1); consIdx[c.id] = i; });
    var perPath = {}, orphans = [];
    m.barriers.forEach(function (b) {
      byId[b.id] = b; kindOf[b.id] = 'barrier';
      var k = kindOf[b.pathway];
      if (k === 'threat' || k === 'consequence') {
        (perPath[b.pathway] = perPath[b.pathway] || []).push(b);
        codes[b.id] = (k === 'threat' ? 'P' + (threatIdx[b.pathway] + 1) : 'M' + (consIdx[b.pathway] + 1)) + '.' + perPath[b.pathway].length;
      } else { orphans.push(b); codes[b.id] = 'X' + orphans.length; }
    });
    var degByBarrier = {};
    m.degradations.forEach(function (d, i) {
      byId[d.id] = d; kindOf[d.id] = 'degradation'; codes[d.id] = 'D' + (i + 1);
      (degByBarrier[d.barrier] = degByBarrier[d.barrier] || []).push(d);
    });
    function sideOf(b) { var k = kindOf[b.pathway]; return k === 'threat' ? 'preventive' : (k === 'consequence' ? 'mitigative' : ''); }
    function add(rule, target, params, other, extra) {
      var id = rule + ':' + target + (other ? ':' + other : '') + (extra ? ':' + extra : '');
      findings.push({ id: id, rule: rule, target: target, kind: kindOf[target] || 'model', other: other || null, params: params || {} });
    }
    /* model basis */
    var missing = [];
    if (blank(m.hazard)) missing.push('m_hazard');
    if (blank(m.topEvent)) missing.push('m_top');
    if (missing.length) add('BT-R-013', 'model', { what: missing });
    /* names */
    m.threats.concat(m.consequences).forEach(function (x) { if (blank(x.label)) add('BT-R-018', x.id); });
    var counted = {};
    m.barriers.forEach(function (b) {
      if (blank(b.label)) add('BT-R-018', b.id);
      var miss = [];
      if (blank(b.func)) miss.push('miss_func');
      if (blank(b.criterion)) miss.push('miss_crit');
      if (blank(b.verification)) miss.push('miss_ver');
      if (miss.length) add('BT-R-001', b.id, { list: miss });
      if (!blank(b.verification) && blank(b.evidence)) add('BT-R-002', b.id);
      if (blank(b.owner)) add('BT-R-003', b.id);
      if (blank(b.frequency)) add('BT-R-004', b.id);
      var side = sideOf(b);
      if (!side) add('BT-R-010', b.id);
      else if (b.role !== side) add('BT-R-005', b.id, { role: b.role, side: side });
      var detNoAct = b.type === 'detection' && b.acts !== 'yes';
      if (detNoAct) add('BT-R-006', b.id, { state: b.acts === 'no' ? 'stNo' : 'stUnknown' });
      counted[b.id] = !!side && b.role === side && !detNoAct;
      (b.upstream || []).forEach(function (u) {
        var ub = byId[u];
        if (!ub || kindOf[u] !== 'barrier' || u === b.id) add('BT-R-014', b.id, { v: 'm' }, null, 'up-' + u);
        else if (ub.pathway !== b.pathway || !side) add('BT-R-014', b.id, { v: 'x' }, u, 'up');
      });
    });
    m.degradations.forEach(function (d) {
      if (kindOf[d.barrier] !== 'barrier') add('BT-R-014', d.id, { v: 'd' });
      if (blank(d.label)) add('BT-R-018', d.id);
      if (blank(d.control)) add('BT-R-012', d.id);
    });
    /* shared elements and dependencies; one flag per unordered pair and element */
    var pairs = {}, depPairs = [];
    var bs = m.barriers.filter(function (b) { return !!sideOf(b); });
    for (var i = 0; i < bs.length; i++) {
      for (var j = i + 1; j < bs.length; j++) {
        var a = bs[i], c = bs[j];
        var same = a.pathway === c.pathway, cross = sideOf(a) !== sideOf(c);
        if (!same && !cross) continue;
        CATS.forEach(function (cat) {
          var va = norm(a.dep && a.dep[cat]), vc = norm(c.dep && c.dep[cat]);
          if (!va || va !== vc) return;
          var rule = same ? 'BT-R-007' : 'BT-R-009';
          var val = str(a.dep[cat]).trim();
          add(rule, a.id, { el: 'c_' + cat, val: val }, c.id, cat);
          add(rule, c.id, { el: 'c_' + cat, val: str(c.dep[cat]).trim() }, a.id, cat);
          var key = [a.id, c.id].sort().join('|') + '|' + cat;
          if (!pairs[key]) { pairs[key] = 1; depPairs.push({ a: a.id, b: c.id, cat: cat, rule: rule }); }
        });
      }
    }
    bs.forEach(function (b) {
      (b.upstream || []).forEach(function (u) {
        var ub = byId[u];
        if (!ub || kindOf[u] !== 'barrier' || u === b.id || ub.pathway !== b.pathway) return;
        add('BT-R-008', b.id, {}, u);
        var key = [b.id, u].sort().join('|') + '|up';
        if (!pairs[key]) { pairs[key] = 1; depPairs.push({ a: b.id, b: u, cat: 'up', rule: 'BT-R-008' }); }
      });
    });
    /* pathways: count, counted, independent groups (union-find over counted barriers) */
    var pathways = [];
    function pathway(x, kind) {
      var list = perPath[x.id] || [];
      var cnt = list.filter(function (b) { return counted[b.id]; });
      var parent = {};
      cnt.forEach(function (b) { parent[b.id] = b.id; });
      function find(k) { while (parent[k] !== k) k = parent[k] = parent[parent[k]]; return k; }
      depPairs.forEach(function (p) {
        if (p.rule === 'BT-R-009') return;
        if (parent[p.a] != null && parent[p.b] != null) parent[find(p.a)] = find(p.b);
      });
      var roots = {};
      cnt.forEach(function (b) { roots[find(b.id)] = 1; });
      var groups = Object.keys(roots).length;
      if (!cnt.length) add('BT-R-011', x.id, { side: kind });
      if (cnt.length >= 2 && groups < cnt.length) add('BT-R-015', x.id, { n: cnt.length, g: groups });
      pathways.push({ id: x.id, kind: kind, code: codes[x.id], label: x.label, barriers: list.map(function (b) { return b.id; }), counted: cnt.length, groups: groups });
    }
    m.threats.forEach(function (t) { pathway(t, 'threat'); });
    m.consequences.forEach(function (c) { pathway(c, 'consequence'); });
    /* per-barrier status */
    var status = {}, fb = {};
    findings.forEach(function (f) {
      var tgt = f.kind === 'degradation' ? (byId[f.target] && byId[f.target].barrier) : f.target;
      if (kindOf[tgt] !== 'barrier') return;
      (fb[tgt] = fb[tgt] || []).push(f);
    });
    m.barriers.forEach(function (b) {
      var list = fb[b.id] || [];
      var s = 'complete';
      list.forEach(function (f) {
        var sev = RULES[f.rule].sev;
        if (sev === 'fail' && f.target === b.id) s = 'incomplete';
        else if (s !== 'incomplete') s = 'attention';
      });
      status[b.id] = s;
    });
    var counts = {
      threats: m.threats.length, consequences: m.consequences.length,
      preventive: m.barriers.filter(function (b) { return sideOf(b) === 'preventive' && b.role === 'preventive'; }).length,
      mitigative: m.barriers.filter(function (b) { return sideOf(b) === 'mitigative' && b.role === 'mitigative'; }).length,
      barriers: m.barriers.length,
      incomplete: 0, attention: 0, complete: 0,
      depFlags: depPairs.length,
      notCounted: m.barriers.filter(function (b) { return !counted[b.id]; }).length,
      degs: m.degradations.length,
      degsOpen: m.degradations.filter(function (d) { return blank(d.control); }).length,
      findings: findings.length
    };
    m.barriers.forEach(function (b) { counts[status[b.id]] += 1; });
    var insufficient = missing.slice();
    if (!m.threats.length) insufficient.push('m_threat');
    if (!m.consequences.length) insufficient.push('m_cons');
    if (!m.barriers.length) insufficient.push('m_barrier');
    return { byId: byId, codes: codes, kindOf: kindOf, findings: findings, status: status, counted: counted,
      pathways: pathways, depPairs: depPairs, counts: counts, insufficient: insufficient, sideOf: sideOf,

  /* ============================================== 5. data layer and report */
  function isEmptyModel(m) {
    return blank(m.hazard) && blank(m.topEvent) && !m.threats.length && !m.consequences.length && !m.barriers.length && !m.degradations.length;
  }
  function buildRecord(m, l) {
    if (isEmptyModel(m)) return null;
    var An = analyse(m), c = An.counts, v = verdict(An, l);
    return {
      inputs: { hazard: str(m.hazard) || '—', top_event: str(m.topEvent) || '—', rule_pack: RULE_PACK },
      outputs: {
        threat_count: c.threats, consequence_count: c.consequences,
        preventive_barriers: c.preventive, mitigative_barriers: c.mitigative,
        incomplete_barriers: c.incomplete, dependency_flags: c.depFlags,
        complete_barriers: c.complete, attention_barriers: c.attention,
        barriers_not_counted: c.notCounted, degradation_factors: c.degs,
        degradation_factors_without_control: c.degsOpen, open_findings: c.findings,
        review_state: v.kind
      },
      units: {},
      report_context: {
        model: clone(m), rule_pack: RULE_PACK,
        findings: An.findings.map(function (f) { return { id: f.id, rule: f.rule, target: f.target, code: An.codes[f.target] || 'model' }; }),
        barrier_status: clone(An.status)
      },
      model: { equations: [], ranges: [], notes: [] },
      warnings: [v.text].concat(An.findings.map(function (f) {
        return (f.target === 'model' ? tx('modelItem', l) : An.codes[f.target]) + ' · ' + f.rule + ' · ' + findingText(f, An, l);
      }))
    };
  }
  var OUT_LABELS = {
    threat_count: 'k_threats', consequence_count: 'k_consequences', preventive_barriers: 'k_prev', mitigative_barriers: 'k_mitig',
    incomplete_barriers: 'k_incomplete', dependency_flags: 'k_depflags', complete_barriers: 'k_complete', attention_barriers: 'k_attention',
    barriers_not_counted: 'k_notcounted', degradation_factors: 'k_degs', degradation_factors_without_control: 'k_degsopen',
    open_findings: 'k_findings', review_state: 'status', hazard: 'hazard', top_event: 'topEvent', rule_pack: 'rRule'
  };
  function reportProfile(rec, ctx) {
    var l = (ctx && ctx.domainLang) || 'en';
    var rc = rec.report_context || {};
    var n = normalise(rc.model || {});
    var m = n.model, An = analyse(m), c = An.counts, v = verdict(An, l);
    var labels = {};
    Object.keys(OUT_LABELS).forEach(function (k) { labels[k] = TL(OUT_LABELS[k]); });
    var dash = '—';
    function row(key, val) { return { key: key, label: tx(OUT_LABELS[key], l), value: nf(val, l) }; }
    /* checks: one card per rule that fired, listing the affected codes */
    var byRule = {};
    An.findings.forEach(function (f) { (byRule[f.rule] = byRule[f.rule] || []).push(f.target === 'model' ? tx('modelItem', l) : An.codes[f.target]); });
    var checks = RULE_IDS.filter(function (r) { return byRule[r]; }).map(function (r) {
      var codes = byRule[r].filter(function (x, i, a) { return a.indexOf(x) === i; });
      return { status: RULES[r].sev === 'fail' ? 'fail' : 'attention', title: r + ' · ' + tx(RULES[r].text, l),
        detail: tx('affected', l, { list: codes.join(', ') }), basis: basisText(r, l) };
    });
    /* figures */
    var figs = [];
    try {
      figureParts(m, An).forEach(function (Lz) {
        var cv = drawFigure(Lz, 2);
        var cap = Lz.part === 'all' ? tx('rFig', l) : tx(Lz.part === 'left' ? 'rFigLeft' : 'rFigRight', l);
        var f = ctx && ctx.figure ? ctx.figure(cv, { caption: cap, alt: cap }) : null;
        if (f) figs.push(f);
      });
    } catch (e) { if (window.console) console.warn('[bowtiebuilder] figure', e); }
    var reg = m.barriers.map(function (b) {
      var pw = An.byId[b.pathway];
      return [An.codes[b.id], itemName(An, b.id, l), pw ? An.codes[pw.id] : dash, tx('t_' + b.type, l), b.owner || dash, statusIcon(An.status[b.id]) + ' ' + tx('s_' + An.status[b.id], l)];
    });
    var assur = m.barriers.map(function (b) {
      return [An.codes[b.id], b.func || dash, b.criterion || dash, (b.verification || dash) + (b.frequency ? ' · ' + b.frequency : ''), b.evidence || dash];
    });
    var paths = An.pathways.map(function (p) { return [p.code, itemName(An, p.id, l), tx(p.kind, l), nf(p.barriers.length, l), nf(p.counted, l), nf(p.groups, l)]; });
    var degRows = m.degradations.map(function (d) {
      return [An.codes[d.id], d.label || dash, An.byId[d.barrier] && An.kindOf[d.barrier] === 'barrier' ? An.codes[d.barrier] : dash, d.control || dash];
    });
    var depRows = [];
    CATS.forEach(function (cat) {
      var groups = {};
      m.barriers.forEach(function (b) { var k = norm(b.dep && b.dep[cat]); if (k) (groups[k] = groups[k] || { v: str(b.dep[cat]).trim(), codes: [] }).codes.push(An.codes[b.id]); });
      Object.keys(groups).forEach(function (k) { depRows.push([tx('c_' + cat, l), groups[k].v, groups[k].codes.join(', ')]); });
    });
    var issues = An.findings.map(function (f) {
      var code = f.target === 'model' ? tx('modelItem', l) : An.codes[f.target];
      return [code, f.target === 'model' ? dash : itemName(An, f.target, l), f.rule, findingText(f, An, l)];
    });
    var apx = [];
    if (paths.length) apx.push({ title: tx('rPaths', l), head: [tx('code', l), tx('name', l), tx('rKind', l), tx('rBarriers', l), tx('rCounted', l), tx('rGroups', l)], rows: paths, cols: '13mm minmax(0,2.6fr) minmax(0,1fr) 17mm 19mm 24mm' });
    if (reg.length) {
      apx.push({ title: tx('rRegister', l), head: [tx('code', l), tx('barrier', l), tx('pathway', l), tx('hType', l), tx('owner', l), tx('status', l)], rows: reg, cols: '13mm minmax(0,2.4fr) 16mm minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.1fr)' });
      apx.push({ title: tx('rAssurance', l), head: [tx('code', l), tx('func', l), tx('hCrit', l), tx('hVer', l), tx('hEvid', l)], rows: assur, cols: '13mm minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,1fr)' });
    }
    if (depRows.length) apx.push({ title: tx('rDeps', l), head: [tx('rElement', l), tx('rIdent', l), tx('rUsedBy', l)], rows: depRows, cols: 'minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.6fr)' });
    if (degRows.length) apx.push({ title: tx('rDegs', l), head: [tx('code', l), tx('degFactor', l), tx('affects', l), tx('degControl', l)], rows: degRows, cols: '13mm minmax(0,1.6fr) 22mm minmax(0,1.6fr)' });
    if (issues.length) apx.push({ title: tx('rIssues', l), head: [tx('code', l), tx('name', l), tx('rRule', l), tx('rFinding', l)], rows: issues, cols: '15mm minmax(0,1.3fr) 21mm minmax(0,2fr)' });
    apx.push({ title: tx('rMethodT', l), text: tx('rNote1', l),
      notes: [tx('rNote2', l), tx('noteCount', l), tx('rNote3', l), tx('rPack', l, { v: RULE_PACK, n: RULE_IDS.length }), tx('rRef1', l), tx('rRef2', l), tx('rRef3', l)] });
    return {
      title: tx('rTitle', l),
      labels: labels,
      project: [{ label: tx('hazard', l), text: m.hazard || dash }, { label: tx('topEvent', l), text: m.topEvent || dash }],
      executive: {
        text: [v.text, tx('rScope', l, { v: RULE_PACK }), tx('noteRisk', l)],
        results: [row('threat_count', c.threats), row('consequence_count', c.consequences), row('preventive_barriers', c.preventive),
          row('mitigative_barriers', c.mitigative), row('incomplete_barriers', c.incomplete), row('dependency_flags', c.depFlags)],
        conclusion: ''
      },
      assumptions: [],
      results: [row('complete_barriers', c.complete), row('attention_barriers', c.attention), row('barriers_not_counted', c.notCounted),
        row('degradation_factors', c.degs), row('degradation_factors_without_control', c.degsOpen), row('open_findings', c.findings)],
      decisions: [],
      checks: checks,
      risks: [], actions: [],
      figures: figs,
      method: { equations: [], ranges: [], notes: [], references: [] },
      inputs: [],
      appendices: apx
    };
  }

  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'bowtiebuilder',
      file: 'bowtiebuilder.html',
      record: function () { return buildRecord(state, L()); },
      report: { profile: reportProfile },
      handoff: { provides: [], accepts: [] }
    });
  }

  /* ======================================================= 6. self-tests */
  function refCase(name, build, expect) { return { name: name, build: build, expect: expect }; }
  function mini(opts) {
    /* a fully specified one-threat, one-consequence model; opts mutate it */
    var m = emptyModel();
    m.hazard = 'H'; m.topEvent = 'TE';
    m.threats = [{ id: pid(9001), label: 'T' }];
    m.consequences = [{ id: pid(9002), label: 'C' }];
    function full(id, p, role, extra) {
      var b = B({ id: pid(id), p: p, role: role, type: role === 'preventive' ? 'engineered' : 'response', label: 'B' + id,
        func: 'f', owner: 'o', criterion: 'c', verification: 'v', frequency: 'q', evidence: 'e' });
      Object.keys(extra || {}).forEach(function (k) { b[k] = extra[k]; });
      return b;
    }
    m.barriers = [full(9101, pid(9001), 'preventive'), full(9102, pid(9001), 'preventive'), full(9201, pid(9002), 'mitigative')];
    if (opts) opts(m, full);
    return m;
  }
  var REFERENCE = [
    refCase('R01 fully specified model', function () { return mini(); }, []),
    refCase('R02 missing criterion', function () { return mini(function (m) { m.barriers[0].criterion = ''; }); }, ['BT-R-001']),
    refCase('R03 missing function, criterion, verification', function () { return mini(function (m) { var b = m.barriers[0]; b.func = b.criterion = b.verification = ''; }); }, ['BT-R-001']),
    refCase('R04 no evidence', function () { return mini(function (m) { m.barriers[2].evidence = ' '; }); }, ['BT-R-002']),
    refCase('R05 no owner, no frequency', function () { return mini(function (m) { m.barriers[1].owner = ''; m.barriers[1].frequency = ''; }); }, ['BT-R-003', 'BT-R-004']),
    refCase('R06 mitigative barrier on a threat', function () { return mini(function (m) { m.barriers[1].role = 'mitigative'; }); }, ['BT-R-005']),
    refCase('R07 detection without action', function () { return mini(function (m) { m.barriers[0].type = 'detection'; m.barriers[0].acts = ''; }); }, ['BT-R-006']),
    refCase('R08 detection stated no, sole mitigation', function () { return mini(function (m) { m.barriers[2].type = 'detection'; m.barriers[2].acts = 'no'; }); }, ['BT-R-006', 'BT-R-011']),
    refCase('R09 shared sensor on one threat', function () { return mini(function (m) { m.barriers[0].dep.sensor = 'PT-1'; m.barriers[1].dep.sensor = ' pt-1 '; }); }, ['BT-R-007', 'BT-R-007', 'BT-R-015']),
    refCase('R10 upstream dependency', function () { return mini(function (m) { m.barriers[1].upstream = [pid(9101)]; }); }, ['BT-R-008', 'BT-R-015']),
    refCase('R11 shared power across the top event', function () { return mini(function (m) { m.barriers[0].dep.power = 'UPS'; m.barriers[2].dep.power = 'UPS'; }); }, ['BT-R-009', 'BT-R-009']),
    refCase('R12 orphan barrier', function () { return mini(function (m, full) { m.barriers.push(full(9301, 'gone', 'preventive')); }); }, ['BT-R-010']),
    refCase('R13 consequence without barrier', function () { return mini(function (m) { m.barriers.pop(); }); }, ['BT-R-011']),
    refCase('R14 degradation without control', function () { return mini(function (m) { m.degradations.push({ id: pid(9401), barrier: pid(9101), label: 'D', control: '' }); }); }, ['BT-R-012']),
    refCase('R15 no hazard', function () { return mini(function (m) { m.hazard = ''; }); }, ['BT-R-013']),
    refCase('R16 dangling upstream', function () { return mini(function (m) { m.barriers[1].upstream = [pid(9999)]; }); }, ['BT-R-014']),
    refCase('R17 cross-pathway upstream', function () { return mini(function (m) { m.barriers[2].upstream = [pid(9101)]; }); }, ['BT-R-014']),
    refCase('R18 degradation on deleted barrier', function () { return mini(function (m) { m.degradations.push({ id: pid(9402), barrier: pid(9999), label: 'D', control: 'k' }); }); }, ['BT-R-014']),
    refCase('R19 unnamed threat and barrier', function () { return mini(function (m) { m.threats[0].label = ''; m.barriers[0].label = ''; }); }, ['BT-R-018', 'BT-R-018']),
    refCase('R20 shared element on different threats is not a flag', function () { return mini(function (m, full) { m.threats.push({ id: pid(9003), label: 'T2' }); var b = full(9103, pid(9003), 'preventive'); b.dep.operator = 'Op'; m.barriers[0].dep.operator = 'op'; m.barriers.push(b); }); }, [])
  ];

  function runSafetyTests() {
    var out = [];
    function t(id, rule, kind, name, got, expected, pass) {
      out.push({ id: id, rule: rule, kind: kind, name: name, got: got, expected: expected, pass: pass === undefined ? JSON.stringify(got) === JSON.stringify(expected) : !!pass });
    }
    function rulesOf(m) { return analyse(m).findings.map(function (f) { return f.rule; }).sort(); }
    /* reference bow-ties */
    REFERENCE.forEach(function (rc, i) {
      var exp = rc.expect.slice().sort();
      var ruleId = exp[0] || 'BT-R-001';
      t('REF-' + (i + 1), ruleId, exp.length ? 'reference' : 'negative', rc.name, rulesOf(rc.build()), exp);
    });
    /* rule-level cases */
    var m = mini();
    var A0 = analyse(m);
    t('R001-neg', 'BT-R-001', 'negative', 'complete barrier has no specification finding', A0.status[pid(9101)], 'complete');
    m = mini(function (x) { x.barriers[0].verification = ''; });
    var A1 = analyse(m);
    t('R001-status', 'BT-R-001', 'rule', 'missing verification makes the barrier incomplete', A1.status[pid(9101)], 'incomplete');
    t('R002-boundary', 'BT-R-002', 'boundary', 'no verification means no evidence finding (only R001)', rulesOf(m), ['BT-R-001']);
    t('R001-params', 'BT-R-001', 'rule', 'missing list names the verification method', A1.findings[0].params.list, ['miss_ver']);
    m = mini(function (x) { x.barriers[2].frequency = '  '; });
    t('R004-blank', 'BT-R-004', 'boundary', 'whitespace-only frequency counts as missing and gives attention', [rulesOf(m), analyse(m).status[pid(9201)]], [['BT-R-004'], 'attention']);
    m = mini(function (x) { x.barriers[0].type = 'detection'; x.barriers[0].acts = 'yes'; });
    t('R006-neg', 'BT-R-006', 'negative', 'detection that triggers an action is counted', [rulesOf(m), analyse(m).counted[pid(9101)]], [[], true]);
    m = mini(function (x) { x.barriers[0].type = 'detection'; });
    t('R006-count', 'BT-R-006', 'rule', 'detection without action is not counted', analyse(m).counted[pid(9101)], false);
    m = mini(function (x) { x.barriers[0].type = 'detection'; x.barriers[1].type = 'detection'; });
    t('R006-R011', 'BT-R-011', 'boundary', 'two detection-only barriers leave the threat without a counted barrier', rulesOf(m), ['BT-R-006', 'BT-R-006', 'BT-R-011']);
    m = mini(function (x) { x.barriers[0].dep.sensor = ''; x.barriers[1].dep.sensor = ''; });
    t('R007-empty', 'BT-R-007', 'boundary', 'empty identifiers are never shared', rulesOf(m), []);
    m = mini(function (x) { x.barriers[0].dep.sensor = 'PT-1'; x.barriers[1].dep.sensor = 'PT-2'; });
    t('R007-neg', 'BT-R-007', 'negative', 'different identifiers are not shared', rulesOf(m), []);
    m = mini(function (x) { x.barriers[0].dep.sensor = 'PT-1'; x.barriers[1].dep.power = 'PT-1'; });
    t('R007-cat', 'BT-R-007', 'negative', 'same text in different element categories is not shared', rulesOf(m), []);
    m = mini(function (x) { x.barriers[0].dep = { power: 'U', sensor: 'S', operator: 'O', procedure: 'P' }; x.barriers[1].dep = { power: 'u', sensor: 's', operator: 'o', procedure: 'p' }; });
    var A7 = analyse(m);
    t('R007-flags', 'BT-R-007', 'rule', 'four shared elements give four dependency flags and one group', [A7.counts.depFlags, A7.pathways[0].groups], [4, 1]);
    m = mini(function (x) { x.barriers[0].dep.sensor = 'S'; x.barriers[1].dep.sensor = 'S'; x.barriers[0].type = 'detection'; });
    t('R015-counted', 'BT-R-015', 'boundary', 'a barrier not counted does not reduce independence', rulesOf(m).indexOf('BT-R-015') < 0, true);
    m = mini(function (x) { x.barriers[1].upstream = [pid(9101)]; x.barriers[0].upstream = [pid(9102)]; });
    t('R008-pair', 'BT-R-008', 'boundary', 'mutual dependency is one flag', analyse(m).counts.depFlags, 1);
    m = mini(function (x) { x.barriers[0].upstream = [pid(9101)]; });
    t('R014-self', 'BT-R-014', 'negative', 'self-dependency is a reference error, not a flag', [rulesOf(m), analyse(m).counts.depFlags], [['BT-R-014'], 0]);
    m = mini(function (x) { x.barriers[2].role = 'preventive'; });
    t('R005-mit', 'BT-R-005', 'rule', 'preventive barrier on a consequence needs attention and is counted on neither side', [analyse(m).status[pid(9201)], rulesOf(m), analyse(m).counts.mitigative, analyse(m).counts.incomplete], ['attention', ['BT-R-005', 'BT-R-011'], 0, 0]);
    m = mini(function (x) { x.degradations.push({ id: pid(9401), barrier: pid(9101), label: 'D', control: '' }); });
    t('R012-status', 'BT-R-012', 'rule', 'open degradation factor puts its barrier on attention', analyse(m).status[pid(9101)], 'attention');
    m = mini(function (x) { x.degradations.push({ id: pid(9401), barrier: pid(9101), label: 'D', control: 'K' }); });
    t('R012-neg', 'BT-R-012', 'negative', 'controlled degradation factor raises nothing', rulesOf(m), []);
    /* insufficient data */
    var e = emptyModel();
    t('INS-empty', 'BT-R-013', 'insufficient', 'empty model gives no record', buildRecord(e, 'en'), null);
    var ve = verdict(analyse(e), 'en');
    t('INS-verdict', 'BT-R-013', 'insufficient', 'empty model reads as insufficient data', [ve.kind, ve.tone], ['insufficient', 'warn']);
    var sk = presetSkeleton();
    var vs = verdict(analyse(sk), 'en');
    t('INS-skeleton', 'BT-R-013', 'insufficient', 'skeleton preset reports what is missing', vs.text, 'Insufficient data, review required: no hazard, no consequence, no barrier.');
    var recSk = buildRecord(sk, 'en');
    t('INS-record', 'BT-R-013', 'insufficient', 'skeleton record state is insufficient', recSk && recSk.outputs.review_state, 'insufficient');
    /* BT-R-016: no acceptability statement in any language, even for a clean model */
    var clean = analyse(presetLift());
    var words = /accept|acceptab|прийнятн|akzept|aanvaard|acceptab|aceptab|akceptow|safe\b|sicher\b|veilig\b/i;
    var bad = LANGS.filter(function (l) { return words.test(verdict(clean, l).text); });
    t('R016-verdict', 'BT-R-016', 'negative', 'clean verdict states scope and no acceptability', [clean.findings.length, verdict(clean, 'en').kind, bad], [0, 'clean', []]);
    var recL = buildRecord(presetLift(), 'en');
    t('R016-record', 'BT-R-016', 'rule', 'record carries no acceptability output', Object.keys(recL.outputs).filter(function (k) { return /accept|risk_level|probab/.test(k); }), []);
    /* presets */
    var V = analyse(presetVessel());
    t('PRE-vessel', 'BT-R-007', 'reference', 'vessel preset findings by rule',
