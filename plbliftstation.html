    "en": "Steady duty point, one rising main without branches (no shared pressure sewers), clean-water viscosity, generic pump parabola instead of a manufacturer curve, no surge (use waterhammer) and no septicity/H₂S check. Operating roughness, Σζ, design rain, starts per hour, efficiency and the DN/OD equivalence are learning assumptions. Minimum sizes and velocity limits as widely published from EN 12056-4; EN 12056-4:2000 §6.3 (useful volume > rising-main volume, ≥ 20 l, T·Qp of Table 5) and §5.1 (surface water below flood level in its own plant outside the building) as read in the licensed text. Regional rules and the sewer operator may be stricter.",

  'fl.duplex_required': T7('The inflow must not be interrupted, so EN 12056-4 asks for a duplex plant: a second pump that takes over automatically. A single pump is not enough here.', 'Приплив не можна переривати, тож EN 12056-4 вимагає здвоєну установку: другий насос, що вмикається автоматично. Одного насоса тут недостатньо.', 'Der Zufluss darf nicht unterbrochen werden, daher verlangt EN 12056-4 eine Doppelanlage: eine zweite Pumpe, die automatisch übernimmt. Eine Einzelanlage reicht hier nicht.', 'De instroom mag niet onderbroken worden, dus EN 12056-4 vraagt een duo-installatie: een tweede pomp die automatisch overneemt. Eén pomp volstaat hier niet.', 'Le débit ne doit pas être interrompu : EN 12056-4 exige une station double, avec une seconde pompe qui prend le relais automatiquement. Une pompe seule ne suffit pas.', 'La entrada no puede interrumpirse, por lo que EN 12056-4 exige un equipo doble: una segunda bomba que entra automáticamente. Una sola bomba no basta.', 'Dopływu nie wolno przerwać, więc EN 12056-4 wymaga przepompowni podwójnej: druga pompa przejmuje pracę automatycznie. Jedna pompa tu nie wystarczy.'),
  'fl.dn_below_min': T7('The chosen rising main is below the minimum DN %d for this wastewater (EN 12056-4).', 'Вибрана напірна труба менша за мінімальний DN %d для цих стоків (EN 12056-4).', 'Die gewählte Druckleitung liegt unter der Mindestnennweite DN %d für dieses Abwasser (EN 12056-4).', 'De gekozen persleiding is kleiner dan de minimale DN %d voor dit afvalwater (EN 12056-4).', 'Le refoulement choisi est inférieur au DN minimal %d pour ces eaux (EN 12056-4).', 'La impulsión elegida es menor que el DN mínimo %d para estas aguas (EN 12056-4).', 'Wybrany przewód tłoczny jest mniejszy niż minimalne DN %d dla tych ścieków (EN 12056-4).'),
  'fl.no_pipe': T7('No pipe of this series keeps the velocity at or below 2.3 m/s — split the flow over two mains or choose another series.', 'Жодна труба цієї серії не тримає швидкість ≤ 2,3 м/с — розділіть витрату на дві труби або виберіть іншу серію.', 'Kein Rohr dieser Reihe hält 2,3 m/s ein — Durchfluss auf zwei Leitungen aufteilen oder eine andere Reihe wählen.', 'Geen buis van deze reeks houdt de snelheid op of onder 2,3 m/s — verdeel het debiet over twee leidingen of kies een andere reeks.', 'Aucun tube de cette série ne garde la vitesse ≤ 2,3 m/s — répartissez le débit sur deux conduites ou changez de série.', 'Ningún tubo de esta serie mantiene la velocidad ≤ 2,3 m/s: reparta el caudal en dos impulsiones o elija otra serie.', 'Żadna rura tej serii nie utrzymuje prędkości ≤ 2,3 m/s — podziel przepływ na dwa przewody lub wybierz inną serię.'),
  'fl.v_low': T7('Velocity %v m/s is below 0.7 m/s: solids settle in the rising main. Use a smaller pipe or a stronger pump.', 'Швидкість %v м/с нижча за 0,7 м/с: тверді частинки осідають у напірній трубі. Зменште трубу або візьміть потужніший насос.', 'Geschwindigkeit %v m/s unter 0,7 m/s: Feststoffe setzen sich in der Druckleitung ab. Kleineres Rohr oder stärkere Pumpe wählen.', 'Snelheid %v m/s is lager dan 0,7 m/s: vaste stoffen bezinken in de persleiding. Kies een kleinere buis of een sterkere pomp.', 'Vitesse %v m/s inférieure à 0,7 m/s : les matières se déposent dans le refoulement. Réduisez le tube ou prenez une pompe plus forte.', 'Velocidad %v m/s por debajo de 0,7 m/s: los sólidos se depositan en la impulsión. Use un tubo menor o una bomba más potente.', 'Prędkość %v m/s poniżej 0,7 m/s: osady odkładają się w przewodzie tłocznym. Zmniejsz rurę lub weź mocniejszą pompę.'),
  'fl.v_high': T7('Velocity %v m/s is above 2.3 m/s: high losses, noise and surge. Use a larger pipe.', 'Швидкість %v м/с вища за 2,3 м/с: великі втрати, шум і гідроудар. Збільште трубу.', 'Geschwindigkeit %v m/s über 2,3 m/s: hohe Verluste, Geräusche und Druckstöße. Größeres Rohr wählen.', 'Snelheid %v m/s is hoger dan 2,3 m/s: grote verliezen, geluid en waterslag. Kies een grotere buis.', 'Vitesse %v m/s supérieure à 2,3 m/s : pertes élevées, bruit et coups de bélier. Prenez un tube plus grand.', 'Velocidad %v m/s por encima de 2,3 m/s: grandes pérdidas, ruido y golpe de ariete. Use un tubo mayor.', 'Prędkość %v m/s powyżej 2,3 m/s: duże straty, hałas i uderzenia hydrauliczne. Zwiększ rurę.'),

  'fl.loop_below': T7('The loop invert is at or below the backflow level: sewer backflow can run back into the building. Lead the rising main above the backflow level (EN 12056-4).', 'Низ петлі на рівні підпору або нижче: підпір із каналізації може повернутися в будівлю. Виведіть напірну трубу вище рівня підпору (EN 12056-4).', 'Die Schleifensohle liegt auf oder unter der Rückstauebene: Rückstau aus dem Kanal kann ins Gebäude laufen. Druckleitung über die Rückstauebene führen (EN 12056-4).', 'De onderkant van de lus ligt op of onder het terugstuwpeil: terugstuwing uit de riolering kan het gebouw in lopen. Leid de persleiding boven het terugstuwpeil (EN 12056-4).', 'Le fil d’eau de la boucle est au niveau de refoulement ou en dessous : l’égout peut refouler dans le bâtiment. Faites passer le refoulement au-dessus de ce niveau (EN 12056-4).', 'La solera del bucle está en el nivel de reflujo o por debajo: el alcantarillado puede volver al edificio. Lleve la impulsión por encima del nivel de reflujo (EN 12056-4).', 'Dno pętli jest na poziomie cofki lub poniżej: ścieki z kanału mogą cofnąć się do budynku. Wyprowadź przewód tłoczny ponad poziom cofki (EN 12056-4).'),
  'fl.inputs_defaulted': T7('Missing input (empty or null) replaced by the default: %f — check these fields.', 'Відсутні вхідні дані (порожні або null) замінено типовими: %f — перевірте ці поля.', 'Fehlende Eingaben (leer oder null) durch den Vorgabewert ersetzt: %f — diese Felder prüfen.', 'Ontbrekende invoer (leeg of null) vervangen door de standaardwaarde: %f — controleer deze velden.', 'Entrées manquantes (vides ou null) remplacées par la valeur par défaut : %f — vérifiez ces champs.', 'Entradas que faltan (vacías o null) sustituidas por el valor por defecto: %f; revise estos campos.', 'Brakujące dane (puste lub null) zastąpiono wartością domyślną: %f — sprawdź te pola.'),
  'fl.rain_r_assumed': T7('Rain below the backflow level uses the default r = 600 l/(s·ha), a learning assumption of the order of r(5,100) for Uccle — replace it by the KMI IDF value r(5,100) of the site.', 'Дощ нижче рівня підпору рахується з типовим r = 600 л/(с·га) — навчальним припущенням порядку r(5,100) для Юккля; замініть його значенням r(5,100) з IDF KMI для ділянки.', 'Der Regen unter der Rückstauebene nutzt den Vorgabewert r = 600 l/(s·ha), eine Lernannahme in der Größenordnung von r(5,100) für Uccle — durch den KMI-IDF-Wert r(5,100) des Standorts ersetzen.', 'De regen onder het terugstuwpeil gebruikt de standaard r = 600 l/(s·ha), een leeraanname in de orde van r(5,100) voor Ukkel — vervang ze door de KMI-IDF-waarde r(5,100) van de site.', 'La pluie sous le niveau de refoulement utilise r = 600 l/(s·ha) par défaut, hypothèse pédagogique de l’ordre de r(5,100) à Uccle — remplacez-la par la valeur IDF r(5,100) de l’IRM pour le site.', 'La lluvia bajo el nivel de reflujo usa el valor por defecto r = 600 l/(s·ha), un supuesto didáctico del orden de r(5,100) en Uccle; sustitúyalo por el valor IDF r(5,100) del KMI/IRM para el emplazamiento.', 'Deszcz poniżej poziomu cofki liczony jest z domyślnym r = 600 l/(s·ha), założeniem dydaktycznym rzędu r(5,100) dla Uccle — zastąp je wartością r(5,100) z krzywych IDF KMI dla lokalizacji.'),
  'fl.main_rule_off': T7('The check “useful volume > rising-main volume” is switched off, but EN 12056-4 §6.3 requires it: wastewater may stay in the main between cycles and turn septic (odour, H₂S). Switch it on, or document the manufacturer’s deviation.', 'Перевірку «корисний об’єм > об’єму напірної труби» вимкнено, але EN 12056-4 §6.3 її вимагає: стоки можуть застоюватися в трубі між циклами й загнивати (запах, H₂S). Увімкніть її або задокументуйте відхилення, погоджене з виробником.', 'Die Prüfung „Nutzvolumen > Druckleitungsvolumen“ ist ausgeschaltet, EN 12056-4 §6.3 verlangt sie aber: Abwasser kann zwischen den Zyklen in der Leitung stehen und faulen (Geruch, H₂S). Einschalten oder die Abweichung des Herstellers dokumentieren.', 'De controle “nuttig volume > volume van de persleiding” staat uit, maar EN 12056-4 §6.3 eist ze: afvalwater kan tussen de cycli in de leiding blijven staan en septisch worden (geur, H₂S). Zet ze aan of documenteer de afwijking van de fabrikant.', 'La vérification « volume utile > volume du refoulement » est désactivée, alors que l’EN 12056-4 §6.3 l’exige : les eaux peuvent stagner dans la conduite entre deux cycles et devenir septiques (odeur, H₂S). Activez-la ou documentez la dérogation du fabricant.', 'La comprobación «volumen útil > volumen de la impulsión» está desactivada, pero la EN 12056-4 §6.3 la exige: el agua residual puede quedarse en la tubería entre ciclos y volverse séptica (olor, H₂S). Actívela o documente la desviación del fabricante.', 'Sprawdzenie „objętość użyteczna > objętość przewodu tłocznego” jest wyłączone, a EN 12056-4 §6.3 go wymaga: ścieki mogą zalegać w przewodzie między cyklami i zagniwać (odór, H₂S). Włącz je albo udokumentuj odstępstwo producenta.'),
  'fl.no_inflow': T7('The inflow is 0 l/s (no fixtures, no flow given): the plant is sized only by the 0.7 m/s self-cleansing flow. Enter the fixtures or a flow.', 'Приплив 0 л/с (немає приладів і витрати): установка підбирається лише за самоочисною витратою 0,7 м/с. Введіть прилади або витрату.', 'Der Zufluss ist 0 l/s (keine Entwässerungsgegenstände, kein Durchfluss): die Anlage wird nur über die Selbstreinigungsgeschwindigkeit 0,7 m/s bemessen. Gegenstände oder einen Durchfluss eingeben.', 'De instroom is 0 l/s (geen toestellen, geen debiet): de installatie wordt enkel op het zelfreinigende debiet bij 0,7 m/s bepaald. Geef de toestellen of een debiet in.', 'Le débit entrant est de 0 l/s (aucun appareil, aucun débit) : la station n’est dimensionnée que par la vitesse d’autocurage de 0,7 m/s. Saisissez les appareils ou un débit.', 'La entrada es 0 l/s (sin aparatos ni caudal): el equipo solo se dimensiona por la velocidad de autolimpieza de 0,7 m/s. Introduzca los aparatos o un caudal.', 'Dopływ wynosi 0 l/s (brak przyborów i przepływu): przepompownię dobiera się tylko z przepływu samooczyszczającego 0,7 m/s. Wprowadź przybory lub przepływ.'),
  'fl.rain_mixed': T7('Rain %s l/s from areas below the backflow level enters the same plant as domestic wastewater %w l/s. EN 12056-4 §5.1: surface water is kept separate and pumped by its own lifting plant outside the building. Size two plants — the combined sizing below is not compliant.', 'Дощ %s л/с із площ нижче рівня підпору надходить у ту саму установку, що й побутові стоки %w л/с. EN 12056-4 §5.1: поверхневі води тримають окремо й відкачують власною установкою поза будівлею. Підберіть дві установки — спільний розрахунок нижче не відповідає нормі.', 'Regen %s l/s von Flächen unter der Rückstauebene gelangt in dieselbe Anlage wie das häusliche Schmutzwasser %w l/s. EN 12056-4 §5.1: Niederschlagswasser wird getrennt gehalten und über eine eigene Hebeanlage außerhalb des Gebäudes abgeführt. Zwei Anlagen bemessen — die gemeinsame Bemessung unten ist nicht normgerecht.', 'Regen %s l/s van oppervlakken onder het terugstuwpeil komt in dezelfde installatie als het huishoudelijk afvalwater %w l/s. EN 12056-4 §5.1: hemelwater blijft gescheiden en wordt verpompt door een eigen opvoerinstallatie buiten het gebouw. Dimensioneer twee installaties — de gezamenlijke berekening hieronder voldoet niet.', 'La pluie %s l/s des surfaces sous le niveau de refoulement arrive dans la même station que les eaux usées domestiques %w l/s. EN 12056-4 §5.1 : les eaux pluviales restent séparées et sont relevées par leur propre station hors du bâtiment. Dimensionnez deux stations — le calcul commun ci-dessous n’est pas conforme.', 'La lluvia %s l/s de superficies bajo el nivel de reflujo entra en el mismo equipo que las aguas residuales domésticas %w l/s. EN 12056-4 §5.1: las aguas pluviales se mantienen separadas y se bombean con un equipo propio fuera del edificio. Dimensione dos equipos: el cálculo conjunto de abajo no cumple.', 'Deszcz %s l/s z powierzchni poniżej poziomu cofki trafia do tej samej przepompowni co ścieki bytowe %w l/s. EN 12056-4 §5.1: wody opadowe odprowadza się oddzielnie, własną przepompownią poza budynkiem. Dobierz dwie przepompownie — wspólny wynik poniżej jest niezgodny z normą.'),
  'fl.surface_outside': T7('Surface-water plant (rain %s l/s, no domestic wastewater): EN 12056-4 §5.1 asks for it to be installed outside the building.', 'Установка для поверхневих вод (дощ %s л/с, без побутових стоків): за EN 12056-4 §5.1 її встановлюють поза будівлею.', 'Anlage für Niederschlagswasser (Regen %s l/s, kein häusliches Schmutzwasser): nach EN 12056-4 §5.1 außerhalb des Gebäudes aufstellen.', 'Hemelwaterinstallatie (regen %s l/s, geen huishoudelijk afvalwater): volgens EN 12056-4 §5.1 buiten het gebouw plaatsen.', 'Station d’eaux pluviales (pluie %s l/s, sans eaux usées domestiques) : selon l’EN 12056-4 §5.1, elle s’installe hors du bâtiment.', 'Equipo de aguas pluviales (lluvia %s l/s, sin aguas residuales domésticas): según la EN 12056-4 §5.1 se instala fuera del edificio.', 'Przepompownia wód opadowych (deszcz %s l/s, bez ścieków bytowych): wg EN 12056-4 §5.1 instaluje się ją poza budynkiem.'),
  'fl.sump_min20': T7('The useful volume %u l of the chosen unit is below the minimum of 20 l (EN 12056-4 §6.3).', 'Корисний об’єм %u л вибраної установки менший за мінімальні 20 л (EN 12056-4 §6.3).', 'Das Nutzvolumen %u l der gewählten Anlage liegt unter dem Mindestwert von 20 l (EN 12056-4 §6.3).', 'Het nuttige volume %u l van de gekozen installatie is kleiner dan het minimum van 20 l (EN 12056-4 §6.3).', 'Le volume utile %u l de la station choisie est inférieur au minimum de 20 l (EN 12056-4 §6.3).', 'El volumen útil %u l del equipo elegido es menor que el mínimo de 20 l (EN 12056-4 §6.3).', 'Objętość użyteczna %u l wybranej przepompowni jest mniejsza od minimum 20 l (EN 12056-4 §6.3).'),
  'fl.sump_le_main': T7('The useful volume %u l is not greater than the rising main %p l between non-return valve and loop; EN 12056-4 §6.3 requires a larger volume, otherwise part of the wastewater stays in the main.', 'Корисний об’єм %u л не більший за об’єм напірної труби %p л між зворотним клапаном і петлею; EN 12056-4 §6.3 вимагає більшого об’єму, інакше частина стоків лишається в трубі.', 'Das Nutzvolumen %u l ist nicht größer als die Druckleitung %p l zwischen Rückflussverhinderer und Schleife; EN 12056-4 §6.3 verlangt mehr, sonst bleibt ein Teil des Abwassers in der Leitung.', 'Het nuttige volume %u l is niet groter dan de persleiding %p l tussen terugslagklep en lus; EN 12056-4 §6.3 eist meer, anders blijft een deel van het afvalwater in de leiding staan.', 'Le volume utile %u l n’est pas supérieur au refoulement %p l entre clapet anti-retour et boucle ; l’EN 12056-4 §6.3 exige davantage, sinon une partie des effluents reste dans la conduite.', 'El volumen útil %u l no es mayor que la impulsión %p l entre la válvula de retención y el bucle; la EN 12056-4 §6.3 exige más, si no parte del agua residual se queda en la tubería.', 'Objętość użyteczna %u l nie jest większa od objętości przewodu tłocznego %p l między zaworem zwrotnym a pętlą; EN 12056-4 §6.3 wymaga więcej, inaczej część ścieków zostaje w przewodzie.'),
  'f.rainr.h': T7('r(5,100) of the site — default 600 is a learning assumption (order of r(5,100) Uccle), replace by the KMI IDF value', 'r(5,100) для ділянки — типове 600 є навчальним припущенням (порядку r(5,100) Юккля), замініть значенням IDF KMI', 'r(5,100) des Standorts — Vorgabe 600 ist eine Lernannahme (Größenordnung r(5,100) Uccle), durch den KMI-IDF-Wert ersetzen', 'r(5,100) van de site — standaard 600 is een leeraanname (orde r(5,100) Ukkel), vervang door de KMI-IDF-waarde', 'r(5,100) du site — 600 par défaut est une hypothèse pédagogique (ordre de r(5,100) à Uccle), à remplacer par la valeur IDF de l’IRM', 'r(5,100) del emplazamiento — el 600 por defecto es un supuesto didáctico (orden de r(5,100) en Uccle); sustitúyalo por el valor IDF del KMI/IRM', 'r(5,100) dla lokalizacji — domyślne 600 to założenie dydaktyczne (rząd r(5,100) Uccle), zastąp wartością IDF KMI'),
  /* notes */
  'n.inflow': T7('Inflow %i l/s = wastewater %w + continuous %c + rain %r l/s.', 'Приплив %i л/с = стічні води %w + постійна %c + дощ %r л/с.', 'Zufluss %i l/s = Schmutzwasser %w + Dauerabfluss %c + Regen %r l/s.', 'Instroom %i l/s = afvalwater %w + continu %c + regen %r l/s.', 'Entrée %i l/s = eaux usées %w + continu %c + pluie %r l/s.', 'Entrada %i l/s = aguas residuales %w + continuo %c + lluvia %r l/s.', 'Dopływ %i l/s = ścieki %w + ciągły %c + deszcz %r l/s.'),
  'n.streams': T7('Two streams (EN 12056-4 §5.1): domestic wastewater %w l/s (with continuous flow) → this plant without the rain; surface water %s l/s → its own plant outside the building. Enter each stream on its own to size the two plants.', 'Два потоки (EN 12056-4 §5.1): побутові стоки %w л/с (з постійною витратою) → ця установка без дощу; поверхневі води %s л/с → власна установка поза будівлею. Введіть кожен потік окремо, щоб підібрати дві установки.', 'Zwei Ströme (EN 12056-4 §5.1): häusliches Schmutzwasser %w l/s (mit Dauerabfluss) → diese Anlage ohne Regen; Niederschlagswasser %s l/s → eigene Anlage außerhalb des Gebäudes. Jeden Strom einzeln eingeben, um beide Anlagen zu bemessen.', 'Twee stromen (EN 12056-4 §5.1): huishoudelijk afvalwater %w l/s (met continu debiet) → deze installatie zonder regen; hemelwater %s l/s → eigen installatie buiten het gebouw. Voer elke stroom apart in om beide installaties te dimensioneren.', 'Deux flux (EN 12056-4 §5.1) : eaux usées domestiques %w l/s (avec le débit continu) → cette station sans la pluie ; eaux pluviales %s l/s → station propre hors du bâtiment. Saisissez chaque flux séparément pour dimensionner les deux stations.', 'Dos caudales (EN 12056-4 §5.1): aguas residuales domésticas %w l/s (con el caudal continuo) → este equipo sin la lluvia; aguas pluviales %s l/s → equipo propio fuera del edificio. Introduzca cada caudal por separado para dimensionar los dos equipos.', 'Dwa strumienie (EN 12056-4 §5.1): ścieki bytowe %w l/s (z przepływem ciągłym) → ta przepompownia bez deszczu; wody opadowe %s l/s → osobna przepompownia poza budynkiem. Wprowadź każdy strumień osobno, aby dobrać obie przepompownie.'),
  'n.dugov': T7('K·√ΣDU = %k l/s is smaller than the largest single DU, so %d l/s is used (EN 12056-2).', 'K·√ΣDU = %k л/с менше за найбільше окреме DU, тому взято %d л/с (EN 12056-2).', 'K·√ΣDU = %k l/s ist kleiner als der größte einzelne DU, daher werden %d l/s angesetzt (EN 12056-2).', 'K·√ΣDU = %k l/s is kleiner dan de grootste afzonderlijke DU, dus wordt %d l/s gebruikt (EN 12056-2).', 'K·√ΣDU = %k l/s est inférieur au plus grand DU isolé : %d l/s est retenu (EN 12056-2).', 'K·√ΣDU = %k l/s es menor que el mayor DU individual, por lo que se usa %d l/s (EN 12056-2).', 'K·√ΣDU = %k l/s jest mniejsze od największego pojedynczego DU, więc przyjęto %d l/s (EN 12056-2).'),
  'n.vmin': T7('In %p the inflow would flow at only %v m/s; to reach 0.7 m/s the pump must deliver %q l/s — the self-cleansing velocity, not the inflow, sets the pump.', 'У %p приплив ішов би лише зі швидкістю %v м/с; щоб досягти 0,7 м/с, насос має давати %q л/с — розмір насоса визначає швидкість самоочищення, а не приплив.', 'In %p flösse der Zufluss nur mit %v m/s; für 0,7 m/s muss die Pumpe %q l/s fördern — die Mindestgeschwindigkeit, nicht der Zufluss, bestimmt die Pumpe.', 'In %p zou de instroom maar %v m/s halen; voor 0,7 m/s moet de pomp %q l/s leveren — de zelfreinigende snelheid, niet de instroom, bepaalt de pomp.', 'Dans %p l’entrée ne circulerait qu’à %v m/s ; pour 0,7 m/s la pompe doit débiter %q l/s — c’est la vitesse d’autocurage, pas l’entrée, qui dimensionne la pompe.', 'En %p la entrada circularía solo a %v m/s; para 0,7 m/s la bomba debe dar %q l/s: la velocidad de autolimpieza, no la entrada, fija la bomba.', 'W %p dopływ płynąłby tylko z prędkością %v m/s; aby osiągnąć 0,7 m/s, pompa musi dawać %q l/s — o pompie decyduje prędkość samooczyszczania, a nie dopływ.'),
  'n.head': T7('Head %h m = static %g m (to the loop crest) + friction %f m + fittings %l m.', 'Напір %h м = статичний %g м (до верху петлі) + тертя %f м + арматура %l м.', 'Förderhöhe %h m = geodätisch %g m (bis zum Scheitel der Schleife) + Reibung %f m + Einbauten %l m.', 'Opvoerhoogte %h m = statisch %g m (tot de top van de lus) + wrijving %f m + hulpstukken %l m.', 'Hauteur %h m = géométrique %g m (jusqu’au sommet de la boucle) + frottement %f m + singularités %l m.', 'Altura %h m = geométrica %g m (hasta la cresta del bucle) + fricción %f m + accesorios %l m.', 'Wysokość %h m = geometryczna %g m (do szczytu pętli) + tarcie %f m + armatura %l m.'),
  'n.duty': T7('Duty point on the pump curve: %q l/s at %h m (requirement %r l/s at %s m).', 'Робоча точка на кривій насоса: %q л/с при %h м (вимога %r л/с при %s м).', 'Betriebspunkt auf der Kennlinie: %q l/s bei %h m (Anforderung %r l/s bei %s m).', 'Werkpunt op de pompcurve: %q l/s bij %h m (eis %r l/s bij %s m).', 'Point de fonctionnement sur la courbe : %q l/s à %h m (besoin %r l/s à %s m).', 'Punto de trabajo en la curva: %q l/s a %h m (requisito %r l/s a %s m).', 'Punkt pracy na charakterystyce: %q l/s przy %h m (wymaganie %r l/s przy %s m).'),
  'n.req': T7('Select a pump that delivers at least %q l/s at %h m.', 'Виберіть насос, що дає щонайменше %q л/с при %h м.', 'Wählen Sie eine Pumpe mit mindestens %q l/s bei %h m.', 'Kies een pomp die minstens %q l/s levert bij %h m.', 'Choisissez une pompe qui débite au moins %q l/s à %h m.', 'Elija una bomba que dé al menos %q l/s a %h m.', 'Wybierz pompę dającą co najmniej %q l/s przy %h m.'),
  'n.sump': T7('Useful volume: starts limit 900·%q / (%z × %a) = %s l; run time T·Qp = %t s × %q = %k l (EN 12056-4 Table 5); minimum 20 l; rising main %m l.', 'Корисний об’єм: обмеження пусків 900·%q / (%z × %a) = %s л; час роботи T·Qp = %t с × %q = %k л (EN 12056-4, табл. 5); мінімум 20 л; напірна труба %m л.', 'Nutzvolumen: Schaltspielgrenze 900·%q / (%z × %a) = %s l; Laufzeit T·Qp = %t s × %q = %k l (EN 12056-4 Tabelle 5); mindestens 20 l; Druckleitung %m l.', 'Nuttig volume: startlimiet 900·%q / (%z × %a) = %s l; looptijd T·Qp = %t s × %q = %k l (EN 12056-4 tabel 5); minimum 20 l; persleiding %m l.', 'Volume utile : limite de démarrages 900·%q / (%z × %a) = %s l ; durée de marche T·Qp = %t s × %q = %k l (EN 12056-4 tableau 5) ; minimum 20 l ; refoulement %m l.', 'Volumen útil: límite de arranques 900·%q / (%z × %a) = %s l; tiempo de marcha T·Qp = %t s × %q = %k l (EN 12056-4 tabla 5); mínimo 20 l; impulsión %m l.', 'Objętość użyteczna: limit załączeń 900·%q / (%z × %a) = %s l; czas pracy T·Qp = %t s × %q = %k l (EN 12056-4 tablica 5); minimum 20 l; przewód tłoczny %m l.'),

    backflow: { title: T7('Backflow level and the loop', 'Рівень підпору й петля', 'Rückstauebene und Schleife', 'Terugstuwpeil en lus', 'Niveau de refoulement et boucle', 'Nivel de reflujo y bucle', 'Poziom cofki i pętla'),
      body: T7('When the public sewer surcharges, water rises in it up to the backflow level — usually the street level, set by the sewer operator. Every outlet below that level would flood. EN 12056-4 therefore leads the rising main up as a loop whose invert lies above the backflow level; beyond the crest the water falls by gravity into the sewer. The pump lifts to the crest: static head = backflow level above pump stop + loop height + pipe diameter.',
        'Коли міська каналізація переповнюється, вода в ній піднімається до рівня підпору — зазвичай рівня вулиці, який задає оператор мережі. Кожен вихід нижче цього рівня затопило б. Тому EN 12056-4 виводить напірну трубу петлею, низ якої лежить вище рівня підпору; за верхом петлі вода стікає в каналізацію самопливом. Насос піднімає воду до верху петлі: статичний напір = рівень підпору над рівнем вимкнення + висота петлі + діаметр труби.',
        'Wenn der öffentliche Kanal überstaut, steigt das Wasser bis zur Rückstauebene — meist die Straßenoberkante, festgelegt vom Netzbetreiber. Jede Ablaufstelle darunter würde überflutet. EN 12056-4 führt die Druckleitung daher als Schleife hoch, deren Sohle über der Rückstauebene liegt; hinter dem Scheitel fließt das Wasser im Freispiegel in den Kanal. Die Pumpe fördert bis zum Scheitel: geodätische Höhe = Rückstauebene über Ausschaltpunkt + Schleifenhöhe + Rohrdurchmesser.',
        'Als de openbare riolering overbelast is, stijgt het water tot het terugstuwpeil — meestal het straatpeil, vastgelegd door de rioolbeheerder. Elk lozingspunt daaronder zou overstromen. EN 12056-4 leidt de persleiding daarom op als een lus waarvan de onderkant boven het terugstuwpeil ligt; na de top loopt het water onder vrij verval in de riolering. De pomp tilt tot de top: statische hoogte = terugstuwpeil boven uitschakelpeil + hoogte van de lus + buisdiameter.',
        'Quand l’égout public est en charge, l’eau y monte jusqu’au niveau de refoulement — en général le niveau de la voirie, fixé par le gestionnaire. Tout appareil situé plus bas serait inondé. EN 12056-4 fait donc monter le refoulement en boucle dont le fil d’eau est au-dessus de ce niveau ; après le sommet, l’eau s’écoule gravitairement vers l’égout. La pompe relève jusqu’au sommet : hauteur géométrique = niveau de refoulement au-dessus de l’arrêt pompe + hauteur de boucle + diamètre.',
        'Cuando la red pública entra en carga, el agua sube hasta el nivel de reflujo, normalmente la rasante de la calle, fijado por el gestor. Todo desagüe por debajo se inundaría. Por eso EN 12056-4 eleva la impulsión formando un bucle cuya solera queda por encima del nivel de reflujo; tras la cresta el agua cae por gravedad a la red. La bomba eleva hasta la cresta: altura geométrica = nivel de reflujo sobre el paro + altura del bucle + diámetro.',
        'Gdy kanał publiczny jest przeciążony, woda podnosi się w nim do poziomu cofki — zwykle poziomu ulicy, ustalanego przez operatora sieci. Każdy odpływ poniżej zostałby zalany. Dlatego EN 12056-4 wyprowadza przewód tłoczny pętlą, której dno leży ponad poziomem cofki; za szczytem woda spływa grawitacyjnie do kanału. Pompa podnosi do szczytu: wysokość geometryczna = poziom cofki nad wyłączeniem pompy + wysokość pętli + średnica rury.') },
    inflow: { title: T7('Inflow: discharge units and rain', 'Приплив: одиниці стоку й дощ', 'Zufluss: Anschlusswerte und Regen', 'Instroom: afvoerwaarden en regen', 'Débit entrant : débits unitaires et pluie', 'Entrada: unidades de descarga y lluvia', 'Dopływ: odpływy jednostkowe i deszcz'),
      body: T7('Fixtures are counted in discharge units (DU, l/s): WC 2.0, shower 0.6, basin 0.5, washing machine 0.8 (EN 12056-2, system I). Not all drain at once, so Qww = K·√ΣDU, but never less than the largest single DU. Rain on a ramp or light well below the backflow level cannot drain by gravity either: Qr = r·C·A. EN 12056-4 §5.1 keeps this surface water separate from the domestic wastewater — it gets its own lifting plant outside the building; the tool flags a plant that takes both. The default r = 600 l/(s·ha) is a learning assumption of the order of r(5,100) for Uccle (DIN 1986-100 asks r(5,100) below the backflow level) — replace it by the KMI IDF value of the site; then 100 m² of ramp gives 6 l/s, more than a whole flat.',
        'Прилади рахують в одиницях стоку (DU, л/с): унітаз 2,0, душ 0,6, умивальник 0,5, пральна машина 0,8 (EN 12056-2, система I). Усі разом не зливають, тому Qww = K·√ΣDU, але не менше найбільшого окремого DU. Дощ із пандуса чи приямка нижче рівня підпору теж не стікає самопливом: Qr = r·C·A. EN 12056-4 §5.1 вимагає тримати ці поверхневі води окремо від побутових стоків — для них потрібна власна установка поза будівлею; інструмент позначає установку, що приймає обидва потоки. Типове r = 600 л/(с·га) — навчальне припущення порядку r(5,100) для Юккля (DIN 1986-100 вимагає r(5,100) нижче рівня підпору); замініть його значенням IDF KMI для ділянки. Тоді 100 м² пандуса дають 6 л/с — більше, ніж ціла квартира.',
        'Entwässerungsgegenstände werden in Anschlusswerten gezählt (DU, l/s): WC 2,0, Dusche 0,6, Waschtisch 0,5, Waschmaschine 0,8 (EN 12056-2, System I). Nicht alle entwässern gleichzeitig, daher Qww = K·√ΣDU, aber nie weniger als der größte einzelne DU. Regen auf einer Rampe oder in einem Lichtschacht unter der Rückstauebene kann ebenfalls nicht im Freispiegel abfließen: Qr = r·C·A. EN 12056-4 §5.1 hält dieses Niederschlagswasser vom häuslichen Schmutzwasser getrennt — es bekommt eine eigene Hebeanlage außerhalb des Gebäudes; das Werkzeug markiert eine Anlage, die beides aufnimmt. Der Vorgabewert r = 600 l/(s·ha) ist eine Lernannahme in der Größenordnung von r(5,100) für Uccle (DIN 1986-100 verlangt r(5,100) unter der Rückstauebene) — durch den KMI-IDF-Wert des Standorts ersetzen; dann liefern 100 m² Rampe 6 l/s, mehr als eine ganze Wohnung.',
        'Toestellen worden geteld in afvoerwaarden (DU, l/s): wc 2,0, douche 0,6, wastafel 0,5, wasmachine 0,8 (EN 12056-2, systeem I). Ze lozen niet allemaal tegelijk, dus Qww = K·√ΣDU, maar nooit minder dan de grootste afzonderlijke DU. Regen op een helling of in een lichtkoker onder het terugstuwpeil kan evenmin onder vrij verval weg: Qr = r·C·A. EN 12056-4 §5.1 houdt dit hemelwater gescheiden van het huishoudelijk afvalwater — het krijgt een eigen opvoerinstallatie buiten het gebouw; de tool markeert een installatie die beide opneemt. De standaard r = 600 l/(s·ha) is een leeraanname in de orde van r(5,100) voor Ukkel (DIN 1986-100 vraagt r(5,100) onder het terugstuwpeil) — vervang ze door de KMI-IDF-waarde van de site; dan geeft 100 m² helling 6 l/s, meer dan een volledig appartement.',
        'Les appareils sont comptés en débits unitaires (DU, l/s) : WC 2,0, douche 0,6, lavabo 0,5, lave-linge 0,8 (EN 12056-2, système I). Ils ne se vident pas tous en même temps : Qww = K·√ΣDU, mais jamais moins que le plus grand DU isolé. La pluie d’une rampe ou d’un saut-de-loup sous le niveau de refoulement ne peut pas non plus s’écouler par gravité : Qr = r·C·A. L’EN 12056-4 §5.1 sépare ces eaux pluviales des eaux usées domestiques — elles ont leur propre station de relevage hors du bâtiment ; l’outil signale une station qui reçoit les deux. La valeur par défaut r = 600 l/(s·ha) est une hypothèse pédagogique de l’ordre de r(5,100) à Uccle (la DIN 1986-100 demande r(5,100) sous le niveau de refoulement) — remplacez-la par la valeur IDF de l’IRM pour le site ; 100 m² de rampe donnent alors 6 l/s, plus qu’un logement entier.',
        'Los aparatos se cuentan en unidades de descarga (DU, l/s): inodoro 2,0, ducha 0,6, lavabo 0,5, lavadora 0,8 (EN 12056-2, sistema I). No descargan todos a la vez, así que Qww = K·√ΣDU, pero nunca menos que el mayor DU individual. La lluvia de una rampa o patio inglés bajo el nivel de reflujo tampoco puede salir por gravedad: Qr = r·C·A. La EN 12056-4 §5.1 mantiene estas aguas pluviales separadas de las aguas residuales domésticas: tienen su propio equipo de bombeo fuera del edificio; la herramienta marca un equipo que recibe ambas. El valor por defecto r = 600 l/(s·ha) es un supuesto didáctico del orden de r(5,100) en Uccle (DIN 1986-100 exige r(5,100) bajo el nivel de reflujo): sustitúyalo por el valor IDF del KMI/IRM para el emplazamiento; entonces 100 m² de rampa dan 6 l/s, más que una vivienda entera.',
        'Przybory liczy się w odpływach jednostkowych (DU, l/s): miska ustępowa 2,0, natrysk 0,6, umywalka 0,5, pralka 0,8 (EN 12056-2, system I). Nie odpływają jednocześnie, więc Qww = K·√ΣDU, ale nigdy mniej niż największy pojedynczy DU. Deszcz z rampy lub szybu świetlnego poniżej poziomu cofki też nie odpłynie grawitacyjnie: Qr = r·C·A. EN 12056-4 §5.1 oddziela te wody opadowe od ścieków bytowych — dostają własną przepompownię poza budynkiem; narzędzie oznacza przepompownię, która przyjmuje oba strumienie. Domyślne r = 600 l/(s·ha) to założenie dydaktyczne rzędu r(5,100) dla Uccle (DIN 1986-100 wymaga r(5,100) poniżej poziomu cofki) — zastąp je wartością IDF KMI dla lokalizacji; wtedy 100 m² rampy daje 6 l/s, więcej niż całe mieszkanie.') },
    main: { title: T7('Rising main: 0.7 to 2.3 m/s', 'Напірна труба: від 0,7 до 2,3 м/с', 'Druckleitung: 0,7 bis 2,3 m/s', 'Persleiding: 0,7 tot 2,3 m/s', 'Refoulement : de 0,7 à 2,3 m/s', 'Impulsión: de 0,7 a 2,3 m/s', 'Przewód tłoczny: od 0,7 do 2,3 m/s'),
      body: T7('EN 12056-4 keeps the velocity in the rising main between 0.7 m/s (below it solids settle) and 2.3 m/s (above it losses, noise and surge grow). Faecal wastewater needs at least DN 80 so that the solids the pump passes do not block the pipe; a grinder pump or faecal-free water allows DN 32. The tool takes the smallest pipe that fits — and if the inflow alone is too small for 0.7 m/s in DN 80, the pump has to deliver more than the inflow. The DN of a pressure pipe here is the usual DN/OD equivalence of its series (PE d110 ≙ DN 100, inner diameter 90 mm); the minimum DN is checked on this nominal size — compare the inner diameter with the free passage of the pump.',
        'EN 12056-4 тримає швидкість у напірній трубі між 0,7 м/с (нижче осідають тверді частинки) і 2,3 м/с (вище зростають втрати, шум і гідроудар). Фекальним стокам потрібен щонайменше DN 80, щоб тверді частинки, які пропускає насос, не забивали трубу; насос-подрібнювач або стоки без фекалій дозволяють DN 32. Інструмент бере найменшу придатну трубу — і якщо самого припливу замало для 0,7 м/с у DN 80, насос мусить подавати більше за приплив. DN напірної труби тут — звичайна відповідність DN/OD її серії (PE d110 ≙ DN 100, внутрішній діаметр 90 мм); мінімальний DN перевіряється за цим номінальним розміром — порівняйте внутрішній діаметр із вільним проходом насоса.',
        'EN 12056-4 hält die Geschwindigkeit in der Druckleitung zwischen 0,7 m/s (darunter setzen sich Feststoffe ab) und 2,3 m/s (darüber wachsen Verluste, Geräusche und Druckstöße). Fäkalienhaltiges Abwasser braucht mindestens DN 80, damit die Feststoffe, die die Pumpe durchlässt, die Leitung nicht verstopfen; eine Pumpe mit Schneidwerk oder fäkalienfreies Abwasser erlaubt DN 32. Das Werkzeug wählt das kleinste passende Rohr — und reicht der Zufluss allein nicht für 0,7 m/s in DN 80, muss die Pumpe mehr fördern als zufließt. Die Nennweite eines Druckrohrs ist hier die übliche DN/OD-Zuordnung seiner Reihe (PE d110 ≙ DN 100, Innendurchmesser 90 mm); die Mindestnennweite wird an dieser Nennweite geprüft — den Innendurchmesser mit dem freien Durchgang der Pumpe vergleichen.',
        'EN 12056-4 houdt de snelheid in de persleiding tussen 0,7 m/s (daaronder bezinken vaste stoffen) en 2,3 m/s (daarboven groeien verliezen, geluid en waterslag). Afvalwater met fecaliën vraagt minstens DN 80, zodat de vaste stoffen die de pomp doorlaat de leiding niet verstoppen; een pomp met snijwerk of water zonder fecaliën laat DN 32 toe. De tool neemt de kleinste passende buis — en als de instroom alleen te klein is voor 0,7 m/s in DN 80, moet de pomp meer leveren dan er toestroomt. De DN van een drukbuis is hier de gangbare DN/OD-toewijzing van de reeks (PE d110 ≙ DN 100, binnendiameter 90 mm); de minimale DN wordt op deze nominale maat getoetst — vergelijk de binnendiameter met de vrije doorlaat van de pomp.',
        'EN 12056-4 maintient la vitesse dans le refoulement entre 0,7 m/s (en dessous les matières se déposent) et 2,3 m/s (au-dessus pertes, bruit et coups de bélier augmentent). Les eaux vannes demandent au moins DN 80 pour que les solides admis par la pompe ne bouchent pas la conduite ; une pompe dilacératrice ou des eaux sans matières fécales permettent DN 32. L’outil prend le plus petit tube qui convient — et si le débit entrant seul est trop faible pour 0,7 m/s en DN 80, la pompe doit débiter plus que l’entrée. Le DN d’un tube pression est ici l’équivalence DN/OD usuelle de sa série (PE d110 ≙ DN 100, diamètre intérieur 90 mm) ; le DN minimal est vérifié sur cette taille nominale — comparez le diamètre intérieur au passage libre de la pompe.',
        'EN 12056-4 mantiene la velocidad en la impulsión entre 0,7 m/s (por debajo se depositan sólidos) y 2,3 m/s (por encima crecen las pérdidas, el ruido y el golpe de ariete). Las aguas fecales necesitan al menos DN 80 para que los sólidos que deja pasar la bomba no obstruyan la tubería; una bomba trituradora o aguas sin fecales permiten DN 32. La herramienta toma el menor tubo válido y, si la entrada sola no da 0,7 m/s en DN 80, la bomba debe dar más caudal que la entrada. El DN de un tubo a presión es aquí la equivalencia DN/OD habitual de su serie (PE d110 ≙ DN 100, diámetro interior 90 mm); el DN mínimo se comprueba sobre este tamaño nominal: compare el diámetro interior con el paso libre de la bomba.',
        'EN 12056-4 utrzymuje prędkość w przewodzie tłocznym między 0,7 m/s (poniżej osadzają się zanieczyszczenia) a 2,3 m/s (powyżej rosną straty, hałas i uderzenia hydrauliczne). Ścieki z fekaliami wymagają co najmniej DN 80, aby części stałe przepuszczane przez pompę nie zatkały przewodu; pompa z rozdrabniaczem lub ścieki bez fekaliów pozwalają na DN 32. Narzędzie bierze najmniejszą pasującą rurę — a jeśli sam dopływ jest za mały na 0,7 m/s w DN 80, pompa musi tłoczyć więcej, niż dopływa. DN rury ciśnieniowej to tu zwykłe przyporządkowanie DN/OD danej serii (PE d110 ≙ DN 100, średnica wewnętrzna 90 mm); minimalne DN sprawdza się dla tej średnicy nominalnej — porównaj średnicę wewnętrzną z wolnym przelotem pompy.') },
    duty: { title: T7('Duty point', 'Робоча точка', 'Betriebspunkt', 'Werkpunt', 'Point de fonctionnement', 'Punto de trabajo', 'Punkt pracy'),
      body: T7('The system curve starts at the static head and rises with v²: friction λ·L/d (Colebrook, operating roughness 0.25 mm as a learning assumption for a wastewater film) plus fittings Σζ. A pump delivers where its curve crosses this line. With “Pump curve” the tool uses a generic parabola through the shut-off head and one catalogue point — enough to see that a pump rated 4 l/s at 6 m may deliver less on a long main. Always check the real manufacturer curve.',
        'Крива мережі починається зі статичного напору й зростає з v²: тертя λ·L/d (Колбрук, експлуатаційна шорсткість 0,25 мм як навчальне припущення для плівки стоків) плюс арматура Σζ. Насос працює там, де його крива перетинає цю лінію. У режимі «Крива насоса» інструмент бере узагальнену параболу через напір при нульовій витраті й одну точку каталогу — досить, щоб побачити, що насос на 4 л/с при 6 м на довгій трубі може давати менше. Завжди перевіряйте справжню криву виробника.',
        'Die Anlagenkennlinie beginnt bei der geodätischen Höhe und steigt mit v²: Reibung λ·L/d (Colebrook, betriebliche Rauheit 0,25 mm als Lernannahme für den Abwasserfilm) plus Einbauten Σζ. Die Pumpe fördert dort, wo ihre Kennlinie diese Linie schneidet. Mit „Pumpenkennlinie“ verwendet das Werkzeug eine generische Parabel durch Nullförderhöhe und einen Katalogpunkt — genug, um zu sehen, dass eine Pumpe mit 4 l/s bei 6 m an einer langen Leitung weniger fördern kann. Prüfen Sie immer die echte Herstellerkennlinie.',
        'De systeemcurve begint bij de statische hoogte en stijgt met v²: wrijving λ·L/d (Colebrook, bedrijfsruwheid 0,25 mm als leeraanname voor een afvalwaterfilm) plus hulpstukken Σζ. Een pomp levert waar haar curve deze lijn snijdt. Met “Pompcurve” gebruikt de tool een generieke parabool door de nuldebiet-opvoerhoogte en één catalogpunt — genoeg om te zien dat een pomp van 4 l/s bij 6 m op een lange leiding minder kan leveren. Controleer altijd de echte curve van de fabrikant.',
        'La courbe de réseau part de la hauteur géométrique et croît avec v² : frottement λ·L/d (Colebrook, rugosité d’exploitation 0,25 mm en hypothèse pédagogique pour le film d’eaux usées) plus singularités Σζ. La pompe débite là où sa courbe coupe cette ligne. Avec « Courbe de pompe », l’outil utilise une parabole générique passant par la hauteur à débit nul et un point catalogue — assez pour voir qu’une pompe de 4 l/s à 6 m peut débiter moins sur un long refoulement. Vérifiez toujours la vraie courbe du fabricant.',
        'La curva de la instalación parte de la altura geométrica y crece con v²: fricción λ·L/d (Colebrook, rugosidad de servicio 0,25 mm como supuesto didáctico para la película de aguas residuales) más accesorios Σζ. La bomba trabaja donde su curva corta esta línea. Con «Curva de bomba» la herramienta usa una parábola genérica por la altura a caudal cero y un punto de catálogo, suficiente para ver que una bomba de 4 l/s a 6 m puede dar menos en una impulsión larga. Compruebe siempre la curva real del fabricante.',
        'Charakterystyka instalacji zaczyna się od wysokości geometrycznej i rośnie z v²: tarcie λ·L/d (Colebrook, chropowatość eksploatacyjna 0,25 mm jako założenie dydaktyczne dla warstwy ścieków) plus armatura Σζ. Pompa pracuje tam, gdzie jej charakterystyka przecina tę linię. W trybie „Charakterystyka pompy” narzędzie używa ogólnej paraboli przez wysokość przy zerowym przepływie i jeden punkt katalogowy — wystarczy, by zobaczyć, że pompa 4 l/s przy 6 m na długim przewodzie może dawać mniej. Zawsze sprawdź rzeczywistą charakterystykę producenta.') },
    sump: { title: T7('Useful volume and starts per hour', 'Корисний об’єм і пуски за годину', 'Nutzvolumen und Schaltspiele', 'Nuttig volume en starts per uur', 'Volume utile et démarrages par heure', 'Volumen útil y arranques por hora', 'Objętość użyteczna i załączenia na godzinę'),
      body: T7('Between the start and stop levels the sump holds the useful volume V. With inflow q the pump stands V/q and runs V/(Qp − q). The cycle is shortest when q = Qp/2: Tc = 4V/Qp. To stay within z starts per hour: V = Qp·Tc/4 = 900·Qp/z (litres, l/s). z = 15 is a learning assumption — the motor decides. EN 12056-4 §6.3 adds three limits: V = T·Qp with the minimum running time T of Table 5 (2.2 / 5.5 / 8.5 s by motor power), V greater than the volume of the rising main between non-return valve and loop — so that each cycle pushes fresh water through and wastewater does not go septic in the pipe — and at least 20 l.',
        'Між рівнями вмикання й вимикання резервуар містить корисний об’єм V. При припливі q насос стоїть V/q і працює V/(Qp − q). Цикл найкоротший при q = Qp/2: Tc = 4V/Qp. Щоб не перевищити z пусків за годину: V = Qp·Tc/4 = 900·Qp/z (літри, л/с). z = 15 — навчальне припущення, вирішує двигун. EN 12056-4 §6.3 додає три межі: V = T·Qp з мінімальним часом роботи T за табл. 5 (2,2 / 5,5 / 8,5 с залежно від потужності двигуна), V більший за об’єм напірної труби між зворотним клапаном і петлею — щоб кожен цикл проштовхував свіжу воду і стоки не загнивали в трубі — і щонайменше 20 л.',
        'Zwischen Ein- und Ausschaltpunkt fasst der Behälter das Nutzvolumen V. Bei Zufluss q steht die Pumpe V/q und läuft V/(Qp − q). Das Schaltspiel ist am kürzesten bei q = Qp/2: Tc = 4V/Qp. Um z Schaltspiele je Stunde einzuhalten: V = Qp·Tc/4 = 900·Qp/z (Liter, l/s). z = 15 ist eine Lernannahme — der Motor entscheidet. EN 12056-4 §6.3 setzt drei weitere Grenzen: V = T·Qp mit der Mindestlaufzeit T nach Tabelle 5 (2,2 / 5,5 / 8,5 s je nach Motorleistung), V größer als das Volumen der Druckleitung zwischen Rückflussverhinderer und Schleife — damit jedes Spiel frisches Wasser durchschiebt und das Abwasser in der Leitung nicht fault — und mindestens 20 l.',
        'Tussen het in- en uitschakelpeil bevat de tank het nuttige volume V. Bij instroom q staat de pomp V/q stil en draait ze V/(Qp − q). De cyclus is het kortst bij q = Qp/2: Tc = 4V/Qp. Om binnen z starts per uur te blijven: V = Qp·Tc/4 = 900·Qp/z (liter, l/s). z = 15 is een leeraanname — de motor beslist. EN 12056-4 §6.3 voegt drie grenzen toe: V = T·Qp met de minimale looptijd T uit tabel 5 (2,2 / 5,5 / 8,5 s naargelang het motorvermogen), V groter dan het volume van de persleiding tussen terugslagklep en lus — zodat elke cyclus vers water doorduwt en het afvalwater in de leiding niet gaat rotten — en minstens 20 l.',
        'Entre les niveaux de marche et d’arrêt, la bâche contient le volume utile V. Avec un débit entrant q, la pompe est arrêtée V/q et tourne V/(Qp − q). Le cycle est le plus court pour q = Qp/2 : Tc = 4V/Qp. Pour rester sous z démarrages par heure : V = Qp·Tc/4 = 900·Qp/z (litres, l/s). z = 15 est une hypothèse pédagogique — le moteur décide. L’EN 12056-4 §6.3 ajoute trois limites : V = T·Qp avec la durée minimale de marche T du tableau 5 (2,2 / 5,5 / 8,5 s selon la puissance du moteur), V supérieur au volume du refoulement entre clapet anti-retour et boucle — pour que chaque cycle renouvelle l’eau et que les effluents ne fermentent pas dans la conduite — et au moins 20 l.',
        'Entre los niveles de arranque y paro el depósito guarda el volumen útil V. Con una entrada q la bomba está parada V/q y funciona V/(Qp − q). El ciclo es más corto cuando q = Qp/2: Tc = 4V/Qp. Para no superar z arranques por hora: V = Qp·Tc/4 = 900·Qp/z (litros, l/s). z = 15 es un supuesto didáctico: lo decide el motor. La EN 12056-4 §6.3 añade tres límites: V = T·Qp con el tiempo mínimo de funcionamiento T de la tabla 5 (2,2 / 5,5 / 8,5 s según la potencia del motor), V mayor que el volumen de la impulsión entre la válvula de retención y el bucle —para que cada ciclo renueve el agua y no se vuelva séptica en la tubería— y al menos 20 l.',
        'Między poziomami załączenia i wyłączenia zbiornik mieści objętość użyteczną V. Przy dopływie q pompa stoi V/q i pracuje V/(Qp − q). Cykl jest najkrótszy przy q = Qp/2: Tc = 4V/Qp. Aby nie przekroczyć z załączeń na godzinę: V = Qp·Tc/4 = 900·Qp/z (litry, l/s). z = 15 to założenie dydaktyczne — decyduje silnik. EN 12056-4 §6.3 dodaje trzy granice: V = T·Qp z minimalnym czasem pracy T z tablicy 5 (2,2 / 5,5 / 8,5 s zależnie od mocy silnika), V większa od objętości przewodu tłocznego między zaworem zwrotnym a pętlą — aby każdy cykl wypychał świeżą wodę, a ścieki nie zagniwały w rurze — oraz co najmniej 20 l.') },
    duplex: { title: T7('Single or duplex', 'Одинарна чи здвоєна', 'Einzel- oder Doppelanlage', 'Enkel of duo', 'Simple ou double', 'Simple o doble', 'Pojedyncza czy podwójna'),
      body: T7('If the inflow must not be interrupted when a pump fails — offices, flats above a shared plant, hospitals, anything public — EN 12056-4 asks for a duplex plant: a second pump that takes over automatically, each able to handle the full inflow. A single plant fits where the users can stop using the fixtures, such as a basement WC in a house. When the two pumps alternate, each starts every second cycle, so the same starts limit needs only half the useful volume.',
        'Якщо приплив не можна перервати при відмові насоса — офіси, квартири над спільною установкою, лікарні, будь-які громадські будівлі, — EN 12056-4 вимагає здвоєну установку: другий насос вмикається автоматично, і кожен здатен пропустити весь приплив. Одинарна установка підходить там, де користувачі можуть перестати користуватися приладами, наприклад для туалету в підвалі приватного будинку. Коли два насоси чергуються, кожен вмикається через цикл, тож за того самого обмеження пусків потрібна лише половина корисного об’єму.',
        'Darf der Zufluss bei Pumpenausfall nicht unterbrochen werden — Büros, Wohnungen über einer gemeinsamen Anlage, Krankenhäuser, alles Öffentliche —, verlangt EN 12056-4 eine Doppelanlage: eine zweite Pumpe, die automatisch übernimmt, jede für den vollen Zufluss. Eine Einzelanlage genügt, wo die Nutzer auf die Entwässerungsgegenstände verzichten können, etwa beim Keller-WC eines Einfamilienhauses. Im Wechselbetrieb startet jede Pumpe nur jedes zweite Spiel; für dieselbe Schaltspielgrenze genügt das halbe Nutzvolumen.',
        'Als de instroom bij een pompstoring niet onderbroken mag worden — kantoren, appartementen boven een gemeenschappelijke installatie, ziekenhuizen, alles wat publiek is — vraagt EN 12056-4 een duo-installatie: een tweede pomp die automatisch overneemt, elk geschikt voor de volle instroom. Een enkele installatie volstaat waar de gebruikers de toestellen even niet kunnen gebruiken, zoals een kelder-wc in een woning. Als de twee pompen afwisselen, start elke pomp maar om de andere cyclus; voor dezelfde startlimiet volstaat het halve nuttige volume.',
        'Si le débit entrant ne doit pas être interrompu en cas de panne — bureaux, logements au-dessus d’une station commune, hôpitaux, tout ce qui est public —, EN 12056-4 exige une station double : une seconde pompe qui prend le relais automatiquement, chacune capable du débit total. Une station simple convient là où les usagers peuvent renoncer aux appareils, comme un WC de sous-sol dans une maison. Quand les deux pompes alternent, chacune démarre un cycle sur deux : pour la même limite de démarrages, la moitié du volume utile suffit.',
        'Si la entrada no puede interrumpirse cuando falla una bomba —oficinas, viviendas sobre un equipo común, hospitales, todo lo público—, EN 12056-4 exige un equipo doble: una segunda bomba que entra automáticamente, cada una capaz de toda la entrada. Un equipo simple sirve donde los usuarios pueden dejar de usar los aparatos, como un aseo en el sótano de una vivienda. Si las dos bombas alternan, cada una arranca un ciclo de cada dos, por lo que con el mismo límite de arranques basta la mitad del volumen útil.',
        'Jeśli dopływu nie wolno przerwać podczas awarii pompy — biura, mieszkania nad wspólną przepompownią, szpitale, wszystko publiczne — EN 12056-4 wymaga przepompowni podwójnej: druga pompa przejmuje pracę automatycznie, a każda poradzi sobie z pełnym dopływem. Przepompownia pojedyncza wystarczy tam, gdzie użytkownicy mogą przestać korzystać z przyborów, np. przy WC w piwnicy domu. Gdy pompy pracują naprzemiennie, każda załącza się co drugi cykl, więc przy tym samym limicie załączeń wystarcza połowa objętości użytecznej.') },
    types: { title: T7('Plant types (EN 12050)', 'Типи установок (EN 12050)', 'Anlagentypen (EN 12050)', 'Types installaties (EN 12050)', 'Types de stations (EN 12050)', 'Tipos de equipos (EN 12050)', 'Typy przepompowni (EN 12050)'),
      body: T7('EN 12050-1 covers plants for wastewater with faecal matter (gas- and odour-tight tank, vented through the roof, free passage for solids), EN 12050-2 faecal-free wastewater (basins, showers, washing machines, floor drains), EN 12050-3 small plants of limited application — for example a WC with macerator — allowed only when the users also have a WC above the backflow level. Fit a gate valve and a non-return valve in the rising main and an alarm for the high level.',
        'EN 12050-1 стосується установок для фекальних стоків (газо- й запахонепроникний резервуар, вентиляція через дах, вільний прохід для твердих частинок), EN 12050-2 — стоків без фекалій (умивальники, душові, пральні машини, трапи), EN 12050-3 — малих установок обмеженого застосування, наприклад унітаза з подрібнювачем, дозволених лише якщо користувачі мають і унітаз вище рівня підпору. На напірній трубі встановіть засувку й зворотний клапан, а також сигналізацію верхнього рівня.',
        'EN 12050-1 gilt für Anlagen für fäkalienhaltiges Abwasser (gas- und geruchsdichter Behälter, Lüftung über Dach, freier Durchgang für Feststoffe), EN 12050-2 für fäkalienfreies Abwasser (Waschtische, Duschen, Waschmaschinen, Bodenabläufe), EN 12050-3 für Kleinhebeanlagen zur begrenzten Verwendung — etwa ein WC mit Zerkleinerer —, nur zulässig, wenn den Nutzern zusätzlich ein WC über der Rückstauebene zur Verfügung steht. In der Druckleitung Absperrschieber und Rückflussverhinderer vorsehen, dazu einen Hochwasseralarm.',
        'EN 12050-1 betreft installaties voor afvalwater met fecaliën (gas- en geurdichte tank, ontluchting via het dak, vrije doorlaat voor vaste stoffen), EN 12050-2 afvalwater zonder fecaliën (wastafels, douches, wasmachines, vloerputten), EN 12050-3 kleine installaties voor beperkt gebruik — bijvoorbeeld een wc met vermaler —, alleen toegelaten als de gebruikers ook een wc boven het terugstuwpeil hebben. Voorzie een afsluiter en een terugslagklep in de persleiding en een hoogwateralarm.',
        'EN 12050-1 traite des stations pour eaux vannes (bâche étanche aux gaz et aux odeurs, ventilation en toiture, passage libre pour les solides), EN 12050-2 des eaux sans matières fécales (lavabos, douches, lave-linge, siphons de sol), EN 12050-3 des petites stations à usage limité — par exemple un WC broyeur —, admises seulement si les usagers disposent aussi d’un WC au-dessus du niveau de refoulement. Posez une vanne et un clapet anti-retour sur le refoulement, ainsi qu’une alarme de niveau haut.',
        'EN 12050-1 trata los equipos para aguas con materias fecales (depósito estanco a gases y olores, ventilado por cubierta, paso libre de sólidos), EN 12050-2 las aguas sin fecales (lavabos, duchas, lavadoras, sumideros) y EN 12050-3 los equipos pequeños de uso limitado, por ejemplo un inodoro con triturador, admitidos solo si los usuarios tienen también un inodoro por encima del nivel de reflujo. Coloque una válvula de corte y una de retención en la impulsión y una alarma de nivel alto.',
        'EN 12050-1 dotyczy przepompowni ścieków z fekaliami (zbiornik gazo- i zapachoszczelny, odpowietrzenie ponad dach, wolny przelot dla części stałych), EN 12050-2 ścieków bez fekaliów (umywalki, natryski, pralki, wpusty podłogowe), EN 12050-3 małych przepompowni o ograniczonym zastosowaniu — np. miski z rozdrabniaczem — dopuszczalnych tylko wtedy, gdy użytkownicy mają też WC powyżej poziomu cofki. Na przewodzie tłocznym zastosuj zasuwę i zawór zwrotny oraz alarm wysokiego poziomu.') }
  },

var PL = {
  house_basement: [T7('Basement of a house — WC, shower, washer', 'Підвал приватного будинку — унітаз, душ, пральна машина', 'Keller eines Einfamilienhauses — WC, Dusche, Waschmaschine', 'Kelder van een woning — wc, douche, wasmachine', 'Sous-sol d’une maison — WC, douche, lave-linge', 'Sótano de una vivienda — inodoro, ducha, lavadora', 'Piwnica domu — WC, natrysk, pralka'),
    T7('The inflow is only 2 l/s, yet the pump must deliver about 3 l/s: in the DN 80 that faecal water requires, only 3 l/s reach the self-cleansing 0.7 m/s.', 'Приплив лише 2 л/с, але насос має давати близько 3 л/с: у DN 80, обов’язковому для фекальних стоків, лише 3 л/с дають швидкість самоочищення 0,7 м/с.', 'Der Zufluss beträgt nur 2 l/s, doch die Pumpe muss etwa 3 l/s fördern: in der für Fäkalien vorgeschriebenen DN 80 erreichen erst 3 l/s die Mindestgeschwindigkeit 0,7 m/s.', 'De instroom is maar 2 l/s, toch moet de pomp ongeveer 3 l/s leveren: in de DN 80 die fecaliën vereisen, halen pas 3 l/s de zelfreinigende 0,7 m/s.', 'L’entrée n’est que de 2 l/s, mais la pompe doit débiter environ 3 l/s : dans le DN 80 exigé pour les eaux vannes, seuls 3 l/s atteignent la vitesse d’autocurage de 0,7 m/s.', 'La entrada es solo de 2 l/s, pero la bomba debe dar unos 3 l/s: en el DN 80 que exigen las aguas fecales, solo 3 l/s alcanzan la velocidad de autolimpieza de 0,7 m/s.', 'Dopływ to tylko 2 l/s, a pompa musi dawać ok. 3 l/s: w DN 80 wymaganym dla fekaliów dopiero 3 l/s daje prędkość samooczyszczania 0,7 m/s.')],
  office_single: [T7('Office basement — one pump', 'Підвал офісу — один насос', 'Bürokeller — eine Pumpe', 'Kantoorkelder — één pomp', 'Sous-sol de bureaux — une pompe', 'Sótano de oficinas — una bomba', 'Piwnica biurowca — jedna pompa'),
    T7('The hydraulics work, but the plant is not allowed: an office cannot stop using its toilets when the pump fails, so EN 12056-4 asks for a duplex plant.', 'Гідравліка в порядку, але установка недопустима: офіс не може перестати користуватися туалетами при відмові насоса, тож EN 12056-4 вимагає здвоєну установку.', 'Die Hydraulik passt, aber die Anlage ist nicht zulässig: ein Büro kann bei Pumpenausfall nicht auf seine WCs verzichten, daher verlangt EN 12056-4 eine Doppelanlage.', 'De hydraulica klopt, maar de installatie mag niet: een kantoor kan bij een pompstoring zijn toiletten niet missen, dus vraagt EN 12056-4 een duo-installatie.', 'L’hydraulique fonctionne, mais la station n’est pas admise : des bureaux ne peuvent pas se passer de leurs WC en cas de panne, EN 12056-4 exige donc une station double.', 'La hidráulica funciona, pero el equipo no se admite: una oficina no puede dejar de usar sus aseos si falla la bomba, así que EN 12056-4 exige un equipo doble.', 'Hydraulika działa, ale przepompownia jest niedopuszczalna: biuro nie może przestać korzystać z toalet przy awarii pompy, więc EN 12056-4 wymaga przepompowni podwójnej.')],
  office_duplex: [T7('Office basement — duplex, alternating', 'Підвал офісу — здвоєна, з чергуванням', 'Bürokeller — Doppelanlage im Wechselbetrieb', 'Kantoorkelder — duo, afwisselend', 'Sous-sol de bureaux — station double alternée', 'Sótano de oficinas — doble, alternas', 'Piwnica biurowca — podwójna, naprzemiennie'),
    T7('The second pump is required anyway — and because the pumps alternate, each starts only every second cycle: the useful volume halves (≈ 230 → 115 l).', 'Другий насос однаково потрібен — а оскільки насоси чергуються, кожен вмикається лише через цикл: корисний об’єм зменшується вдвічі (≈ 230 → 115 л).', 'Die zweite Pumpe ist ohnehin Pflicht — und weil die Pumpen wechseln, startet jede nur jedes zweite Spiel: das Nutzvolumen halbiert sich (≈ 230 → 115 l).', 'De tweede pomp is hoe dan ook verplicht — en omdat de pompen afwisselen, start elke pomp maar om de andere cyclus: het nuttige volume halveert (≈ 230 → 115 l).', 'La seconde pompe est de toute façon obligatoire — et comme les pompes alternent, chacune ne démarre qu’un cycle sur deux : le volume utile est divisé par deux (≈ 230 → 115 l).', 'La segunda bomba es obligatoria de todos modos y, como alternan, cada una arranca solo un ciclo de cada dos: el volumen útil se reduce a la mitad (≈ 230 → 115 l).', 'Druga pompa i tak jest wymagana — a ponieważ pompy pracują naprzemiennie, każda załącza się co drugi cykl: objętość użyteczna spada o połowę (≈ 230 → 115 l).')],
  long_main: [T7('Car park — 140 m rising main', 'Паркінг — напірна труба 140 м', 'Tiefgarage — 140 m Druckleitung', 'Parkeergarage — 140 m persleiding', 'Parking — refoulement de 140 m', 'Aparcamiento — impulsión de 140 m', 'Garaż podziemny — przewód tłoczny 140 m'),
    T7('The starts limit needs only ≈ 90 l, but the 140 m main holds ≈ 600 l: the sump must be sized by the pipe, about 6.6 times larger, or the wastewater sits in the main for days.', 'Обмеженню пусків вистачає ≈ 90 л, але труба довжиною 140 м вміщує ≈ 600 л: резервуар треба розраховувати за трубою, приблизно в 6,6 раза більший, інакше стоки стоять у трубі днями.', 'Die Schaltspielgrenze braucht nur ≈ 90 l, aber die 140-m-Leitung fasst ≈ 600 l: der Behälter ist nach der Leitung zu bemessen, rund 6,6-mal größer, sonst steht das Abwasser tagelang in der Leitung.', 'De startlimiet vraagt maar ≈ 90 l, maar de persleiding van 140 m bevat ≈ 600 l: de tank moet op de leiding worden gedimensioneerd, zo’n 6,6 keer groter, anders blijft het afvalwater dagen in de leiding staan.', 'La limite de démarrages ne demande que ≈ 90 l, mais le refoulement de 140 m contient ≈ 600 l : la bâche se dimensionne sur la conduite, environ 6,6 fois plus grande, sinon les effluents stagnent des jours dans le tube.', 'El límite de arranques solo pide ≈ 90 l, pero la impulsión de 140 m contiene ≈ 600 l: el depósito se dimensiona por la tubería, unas 6,6 veces mayor, o el agua residual se queda días en la impulsión.', 'Limit załączeń wymaga tylko ≈ 90 l, ale przewód o długości 140 m mieści ≈ 600 l: zbiornik trzeba dobrać według przewodu, ok. 6,6 raza większy, inaczej ścieki stoją w rurze całymi dniami.')],
  ramp_rain: [T7('Underground garage — ramp rain, own surface-water plant', 'Підземний гараж — дощ із пандуса, окрема установка для поверхневих вод', 'Tiefgarage — Rampenregen, eigene Niederschlagswasseranlage', 'Ondergrondse garage — hellingregen, eigen hemelwaterinstallatie', 'Garage souterrain — pluie de rampe, station d’eaux pluviales dédiée', 'Garaje subterráneo — lluvia de rampa, equipo propio de pluviales', 'Garaż podziemny — deszcz z rampy, osobna przepompownia wód opadowych'),
    T7('150 m² of open ramp bring 9 l/s of rain — more than four times the garage’s 2 l/s of wastewater. EN 12056-4 keeps the two apart: this is the rain plant alone, outside the building; the floor drains get their own plant.', '150 м² відкритого пандуса дають 9 л/с дощу — більш ніж учетверо більше за 2 л/с стоків гаража. EN 12056-4 тримає їх окремо: це лише установка для дощу, поза будівлею; трапи отримують власну установку.', '150 m² offene Rampe bringen 9 l/s Regen — mehr als viermal so viel wie die 2 l/s Schmutzwasser der Garage. EN 12056-4 hält beides getrennt: dies ist nur die Regenanlage, außerhalb des Gebäudes; die Bodenabläufe bekommen eine eigene Anlage.', '150 m² open helling brengt 9 l/s regen — meer dan het viervoudige van de 2 l/s afvalwater van de garage. EN 12056-4 houdt ze gescheiden: dit is alleen de regeninstallatie, buiten het gebouw; de vloerputten krijgen een eigen installatie.', '150 m² de rampe ouverte apportent 9 l/s de pluie — plus du quadruple des 2 l/s d’eaux usées du garage. L’EN 12056-4 les sépare : voici la seule station pluviale, hors du bâtiment ; les siphons de sol ont leur propre station.', '150 m² de rampa abierta aportan 9 l/s de lluvia, más del cuádruple de los 2 l/s de aguas residuales del garaje. La EN 12056-4 los separa: este es solo el equipo de lluvia, fuera del edificio; los sumideros tienen su propio equipo.', '150 m² otwartej rampy daje 9 l/s deszczu — ponad cztery razy więcej niż 2 l/s ścieków garażu. EN 12056-4 rozdziela je: to sama przepompownia deszczowa, poza budynkiem; wpusty podłogowe mają własną przepompownię.')],
