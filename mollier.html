  else{const C8=-5800.2206,C9=1.3914993,C10=-0.048640239,C11=4.1764768e-5,C12=-1.4452093e-8,C13=6.5459673;

const W_sat=(t,P)=>W_from_Pw(Math.min(Pws(t),P*0.999),P);

   ASHRAE Handbook-Fundamentals (2017) Ch.1 Eq.33 for t* >= 0 °C (water bulb),
   Eq.35 for t* < 0 °C (ice bulb).  Using Eq.33 below freezing while taking Ws

function W_on_wb(t,twb,P){const Ws=W_sat(twb,P);
  return twb>=0 ? ((H_FG-2.326*twb)*Ws-C_DA*(t-twb))/(H_FG+C_V*t-4.186*twb)

  for(let i=0;i<80;i++){dp=(lo+hi)/2;if(Pws(dp)>Pw)hi=dp;else lo=dp;}return dp;}
function W_from_wb(t,twb,P){return Math.max(0,W_on_wb(t,twb,P));}

/* ---- Fog / supersaturation -------------------------------------------------
   W > W_sat is not a gas state.  The chart and every property here describe the
   saturated gas phase only, so the excess water is split off as liquid mist and
   reported; it is never silently deleted.
   fogAtT   : temperature is prescribed (state input, coil, wheel).
   fogFromHW: adiabatic case (mixing) - the temperature follows from the energy

function fogAtT(t,W,P){const Ws=W_sat(t,P);return W>Ws?{t,W:Ws,liq:W-Ws}:{t,W,liq:0};}

  const f=tf=>{const Ws=Math.min(W_sat(tf,P),W);return enthalpy(tf,Ws)+(W-Ws)*CW*tf-h;};
  let lo=-100,hi=200;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(f(m)>0)hi=m;else lo=m;}

  for(let i=0;i<70;i++){Ws=(lo+hi)/2;if(RH_from_W(tOf(Ws),Ws,P)>1)hi=Ws;else lo=Ws;}return{tOf,Ws};}

 resNote:{en:'Power & moisture use dry-air mass from the Start flow. “−” = heat/moisture removed. Coil load is ṁ·Δi of the air stream only: the enthalpy carried out by the condensate (≈0.6 % of the load) is not included, and adiabatic mixing has no power across its boundary.',uk:'Потужність і волога — за масою сухого повітря з витрати на «Старті». «−» = відведення. Навантаження теплообмінника — це ṁ·Δi лише повітряного потоку: ентальпія, що виноситься конденсатом (≈0,6 % навантаження), не враховується, а адіабатичне змішування не має потужності через межу.',ru:'Мощность и влага — по массе сухого воздуха из расхода на «Старте». «−» = отвод. Нагрузка теплообменника — это ṁ·Δi только воздушного потока: энтальпия, уносимая конденсатом (≈0,6 % нагрузки), не учитывается, а адиабатическое смешение не имеет мощности через границу.',nl:'Vermogen & vocht via droge-luchtmassa uit Start-debiet. “−” = onttrokken. Batterijbelasting is ṁ·Δi van alleen de luchtstroom: de enthalpie die met het condensaat wegstroomt (≈0,6 % van de belasting) is niet meegerekend, en adiabatisch mengen kent geen vermogen over de grens.',fr:'Puissance & humidité via la masse d’air sec du débit Départ. « − » = retiré. La charge de la batterie est ṁ·Δi du seul flux d’air : l’enthalpie évacuée par le condensat (≈0,6 % de la charge) n’est pas incluse, et le mélange adiabatique n’échange aucune puissance à sa frontière.',de:'Leistung & Feuchte über Trockenluftmasse aus Start-Strom. „−“ = entzogen. Die Kühlerlast ist ṁ·Δi allein des Luftstroms: die mit dem Kondensat abgeführte Enthalpie (≈0,6 % der Last) ist nicht enthalten, und adiabatische Mischung überträgt keine Leistung über die Grenze.',es:'Potencia y humedad usan masa de aire seco del caudal Inicio. “−” = retirado. La carga de la batería es ṁ·Δi solo de la corriente de aire: no incluye la entalpía que se lleva el condensado (≈0,6 % de la carga), y la mezcla adiabática no transfiere potencia por su frontera.',pl:"Moc i wilgotność wykorzystują masę suchego powietrza z przepływu początkowego. „−” = usunięte ciepło/wilgoć. Obciążenie wężownicy to ṁ·Δi samego strumienia powietrza: entalpia niesiona przez kondensat (≈0,6% obciążenia) nie jest uwzględniana, a mieszanie adiabatyczne nie ma mocy na swojej granicy."},

/* AGENTS.md §3 — site-language precedence: ?lang=xx, then
   localStorage.diagram_site_lang, then legacy diagram_lang, then the browser,
   then English. This tool also keeps its historical tool-local Russian UI. */
const SITE_LANGS=['en','uk','de','nl','fr','es','pl'];
function pickLang(sup){
  const norm=v=>String(v||"").slice(0,2).toLowerCase();
  const ok=v=>sup.indexOf(norm(v))>=0;
  let q=null; try{q=new URLSearchParams(location.search).get("lang");}catch(e){}
  if(ok(q))return norm(q);
  if(ok(window.__diagramLang))return norm(window.__diagramLang);
  try{const x=localStorage.getItem("diagram_site_lang"); if(ok(x))return norm(x);}catch(e){}
  try{const x=localStorage.getItem("diagram_lang"); if(ok(x))return norm(x);}catch(e){}
  const nav=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
  for(let i=0;i<nav.length;i++){ if(ok(nav[i]))return norm(nav[i]); }
  return "en";
}
/* the user changed the language inside the tool: remember it for the whole site */
function rememberLang(l){
  if(SITE_LANGS.indexOf(l)<0)return;
  try{localStorage.setItem("diagram_site_lang",l);localStorage.setItem("diagram_lang",l);}catch(e){}
  window.__diagramLang=l;
}
let LANG=pickLang(LANGS);
const tr=k=>(T[k]&&T[k][LANG])||(T[k]&&T[k].en)||k;

const LRN={
 intro:[{en:'What this tool does',uk:'Що робить цей інструмент',ru:'Что делает этот инструмент',nl:'Wat deze tool doet',fr:'Ce que fait cet outil',de:'Was dieses Werkzeug tut',es:'Qué hace esta herramienta',pl:"Co to narzędzie robi"},
  {en:'It draws the state of moist air on a psychrometric (Mollier i–d) chart and follows it through HVAC processes. Set the barometric pressure and the entering air, add processes such as heating, a cooling coil or mixing, then read enthalpy, moisture content, dew point and wet-bulb temperature for every state. The correlations are the ASHRAE moist-air formulation.',
   uk:'Показує стан вологого повітря на психрометричній (i–d) діаграмі та проводить його через процеси ОВК. Задайте барометричний тиск і вхідне повітря, додайте процеси — нагрівання, охолоджувач, змішування — і зчитуйте ентальпію, вологовміст, точку роси й температуру мокрого термометра для кожного стану. Кореляції — за ASHRAE.',
   ru:'Показывает состояние влажного воздуха на психрометрической (i–d) диаграмме и проводит его через процессы ОВиК. Задайте барометрическое давление и входной воздух, добавьте процессы — нагрев, охладитель, смешение — и читайте энтальпию, влагосодержание, точку росы и температуру мокрого термометра для каждого состояния. Корреляции — по ASHRAE.',
   nl:'Tekent de toestand van vochtige lucht op een psychrometrisch (Mollier i–d) diagram en volgt die door HVAC-processen. Stel de barometerdruk en de intredende lucht in, voeg processen toe zoals verwarmen, een koelbatterij of mengen, en lees enthalpie, vochtgehalte, dauwpunt en natteboltemperatuur van elke toestand af. De correlaties zijn die van ASHRAE.',
   fr:'Trace l’état de l’air humide sur un diagramme psychrométrique (Mollier i–d) et le suit à travers les transformations CVC. Réglez la pression barométrique et l’air entrant, ajoutez des transformations — chauffage, batterie froide, mélange — puis lisez l’enthalpie, la teneur en eau, le point de rosée et la température humide de chaque état. Les corrélations sont celles de l’ASHRAE.',
   de:'Zeichnet den Zustand feuchter Luft in ein psychrometrisches (Mollier-i–d-)Diagramm und verfolgt ihn durch HLK-Prozesse. Barometerdruck und Eintrittsluft einstellen, Prozesse wie Erwärmung, Kühler oder Mischung hinzufügen und für jeden Zustand Enthalpie, Wassergehalt, Taupunkt und Feuchtkugeltemperatur ablesen. Die Korrelationen sind die von ASHRAE.',
   es:'Dibuja el estado del aire húmedo en un diagrama psicrométrico (Mollier i–d) y lo sigue a través de los procesos de climatización. Fije la presión barométrica y el aire de entrada, añada procesos como calentamiento, batería de frío o mezcla, y lea la entalpía, el contenido de humedad, el punto de rocío y la temperatura de bulbo húmedo de cada estado. Las correlaciones son las de ASHRAE.',pl:"Rysuje stan wilgotnego powietrza na wykresie psychrometrycznym (Mollier i–d) i śledzi go przez procesy HVAC. Ustaw ciśnienie barometryczne i powietrze wlotowe, dodaj procesy, takie jak ogrzewanie, chłodnica lub mieszanie, a następnie odczytaj entalpię, zawartość wilgoci, punkt rosy i temperaturę termometru mokrego dla każdego stanu. Korelacje są formułą ASHRAE dla wilgotnego powietrza."}],

 chart:[{en:'Chart type',uk:'Тип діаграми',ru:'Тип диаграммы',nl:'Diagramtype',fr:'Type de diagramme',de:'Diagrammtyp',es:'Tipo de diagrama',pl:"Typ wykresu"},
  {en:'The Mollier i–d chart carries moisture content across and skews the temperature axis so that lines of constant enthalpy run straight. The psychrometric (ASHRAE) chart carries dry-bulb temperature across instead. The two draw the same states differently; nothing computed depends on the choice.',
   uk:'На діаграмі Молльє i–d горизонтальна вісь — вологовміст, а вісь температури нахилена так, щоб лінії сталої ентальпії були прямими. На психрометричній діаграмі (ASHRAE) горизонтальна вісь — температура сухого термометра. Це два креслення тих самих станів; на розрахунок вибір не впливає.',
   ru:'На диаграмме Молье i–d по горизонтали отложено влагосодержание, а ось температуры наклонена так, чтобы линии постоянной энтальпии были прямыми. На психрометрической диаграмме (ASHRAE) по горизонтали отложена температура сухого термометра. Это два изображения одних и тех же состояний; на расчёт выбор не влияет.',
   nl:'Het Mollier i–d-diagram zet het vochtgehalte horizontaal uit en kantelt de temperatuuras zodat lijnen van gelijke enthalpie recht lopen. Het psychrometrische (ASHRAE) diagram zet in plaats daarvan de drogeboltemperatuur horizontaal uit. Beide tonen dezelfde toestanden; de keuze verandert geen enkel getal.',
   fr:'Le diagramme de Mollier i–d porte la teneur en eau en abscisse et incline l’axe des températures pour que les isenthalpes soient droites. Le diagramme psychrométrique (ASHRAE) porte la température sèche en abscisse. Les deux représentent les mêmes états ; le choix ne change aucun calcul.',
   de:'Das Mollier-i–d-Diagramm trägt den Wassergehalt waagerecht auf und neigt die Temperaturachse, damit Linien gleicher Enthalpie gerade verlaufen. Das psychrometrische (ASHRAE-)Diagramm trägt stattdessen die Trockentemperatur waagerecht auf. Beide zeigen dieselben Zustände; die Wahl ändert keine Zahl.',
   es:'El diagrama de Mollier i–d lleva el contenido de humedad en horizontal e inclina el eje de temperatura para que las líneas de entalpía constante sean rectas. El diagrama psicrométrico (ASHRAE) lleva en horizontal la temperatura seca. Ambos muestran los mismos estados; la elección no cambia ningún cálculo.',pl:"Wykres Molliera i–d przenosi zawartość wilgoci i przechyla oś temperatury, tak że linie stałej entalpii biegną prosto. Wykres psychrometryczny (ASHRAE) przenosi temperaturę suchego termometru. Oba wykresy rysują te same stany inaczej; nic z obliczeń nie zależy od wyboru."}],

 units:[{en:'Metric and imperial',uk:'Метричні та імперські одиниці',ru:'Метрические и имперские единицы',nl:'Metrisch en imperiaal',fr:'Métrique et impérial',de:'Metrisch und imperial',es:'Métrico e imperial',pl:"Metryczne i imperialne"},
  {en:'Metric reads °C, g/kg of dry air, kJ/kg and kPa; imperial reads °F, grains per pound, Btu/lb and psia. What the permalink, the calculation record and the Python export carry is always SI, whichever you are reading.',
   uk:'У метричній системі — °C, g/kg сухого повітря, kJ/kg і kPa; в імперській — °F, гран/фунт, Btu/lb і psia. У постійному посиланні, розрахунковому записі та експорті в Python завжди зберігаються одиниці СІ, незалежно від того, що ви бачите.',
   ru:'В метрической системе — °C, g/kg сухого воздуха, kJ/kg и kPa; в имперской — °F, гран/фунт, Btu/lb и psia. В постоянной ссылке, расчётной записи и экспорте в Python всегда хранятся единицы СИ, что бы вы ни видели на экране.',
   nl:'Metrisch toont °C, g/kg droge lucht, kJ/kg en kPa; imperiaal toont °F, grains per pound, Btu/lb en psia. De permalink, de rekenrecord en de Python-export dragen altijd SI, wat u ook afleest.',
   fr:'Le système métrique affiche des °C, g/kg d’air sec, kJ/kg et kPa ; l’impérial affiche des °F, grains par livre, Btu/lb et psia. Le lien permanent, l’enregistrement de calcul et l’export Python restent en SI quoi que vous lisiez.',
   de:'Metrisch zeigt °C, g/kg trockene Luft, kJ/kg und kPa; imperial zeigt °F, Grain je Pfund, Btu/lb und psia. Permalink, Rechenprotokoll und Python-Export führen stets SI, gleich was angezeigt wird.',
   es:'El sistema métrico muestra °C, g/kg de aire seco, kJ/kg y kPa; el imperial muestra °F, granos por libra, Btu/lb y psia. El enlace permanente, el registro de cálculo y la exportación a Python siempre llevan SI, sea cual sea la lectura.',pl:"W układzie metrycznym używane są °C, g/kg suchego powietrza, kJ/kg i kPa; w układzie imperialnym °F, grains/lb, Btu/lb i psia. Stały link, rekord obliczeń i eksport do Pythona zawsze zapisują wartości w SI, niezależnie od wybranego sposobu prezentacji."}],

 pressure:[{en:'Barometric pressure and altitude',uk:'Барометричний тиск і висота',ru:'Барометрическое давление и высота',nl:'Barometerdruk en hoogte',fr:'Pression barométrique et altitude',de:'Barometerdruck und Höhe',es:'Presión barométrica y altitud',pl:"Ciśnienie barometryczne i wysokość"},
  {en:'Every property on the chart depends on the total pressure, so one chart is one pressure. Enter it directly, or enter an altitude and the ISA standard atmosphere sets it for you; typing a pressure clears the altitude again.',

   ru:'Все свойства на диаграмме зависят от полного давления, поэтому одна диаграмма — одно давление. Задайте его напрямую или введите высоту, и давление вычислит стандартная атмосфера ISA; ввод давления снова очищает поле высоты.',

   de:'Jede Eigenschaft im Diagramm hängt vom Gesamtdruck ab: ein Diagramm, ein Druck. Direkt eingeben oder eine Höhe eingeben, dann setzt ihn die ISA-Normatmosphäre; ein eingetippter Druck löscht die Höhe wieder.',
   es:'Todas las propiedades del diagrama dependen de la presión total: un diagrama, una presión. Introdúzcala directamente, o introduzca una altitud y la atmósfera estándar ISA la calcula; escribir una presión borra de nuevo la altitud.',pl:"Każda właściwość na wykresie zależy od ciśnienia całkowitego, więc jeden wykres to jedno ciśnienie. Wprowadź je bezpośrednio lub podaj wysokość, a standardowa atmosfera ISA ustawi ją za Ciebie; wpisanie ciśnienia ponownie usunie wysokość."}],

 humidity:[{en:'Which humidity you type',uk:'Яку вологість ви задаєте',ru:'Какую влажность вы задаёте',nl:'Welke vochtigheid u invoert',fr:'Quelle humidité vous saisissez',de:'Welche Feuchte Sie eingeben',es:'Qué humedad introduce',pl:"Jaką wilgotność wpisujesz"},
  {en:'One temperature and one humidity value fix the state. Choose which humidity you have to hand — relative humidity, moisture content d, enthalpy i, dew point or wet-bulb temperature — and the other four are derived and listed in the state table.',

   nl:'Eén temperatuur en één vochtwaarde leggen de toestand vast. Kies welke vochtwaarde u bij de hand hebt — relatieve vochtigheid, vochtgehalte d, enthalpie i, dauwpunt of natteboltemperatuur — de andere vier worden afgeleid en in de toestandstabel getoond.',
   fr:'Une température et une valeur d’humidité fixent l’état. Choisissez celle dont vous disposez — humidité relative, teneur en eau d, enthalpie i, point de rosée ou température humide — les quatre autres sont déduites et listées dans le tableau des états.',

 flow:[{en:'Air flow and the dry-air basis',uk:'Витрата повітря та основа сухого повітря',ru:'Расход воздуха и основа сухого воздуха',nl:'Luchtdebiet en de droge-luchtbasis',fr:'Débit d’air et base air sec',de:'Luftstrom und Trockenluftbasis',es:'Caudal de aire y base de aire seco',pl:"Przepływ powietrza i podstawa suchego powietrza"},
  {en:'Loads and moisture rates are per kilogram of DRY air, so the flow you type is converted to a dry-air mass flow with the specific volume of the entering state. A volume flow therefore represents a different mass at a different temperature; a mass flow does not.',
   uk:'Потужності та витрати вологи віднесені до кілограма СУХОГО повітря, тож задана витрата перераховується у масову витрату сухого повітря за питомим об’ємом вхідного стану. Тому об’ємна витрата за іншої температури відповідає іншій масі, а масова — ні.',
   ru:'Мощности и расходы влаги отнесены к килограмму СУХОГО воздуха, поэтому заданный расход пересчитывается в массовый расход сухого воздуха по удельному объёму входного состояния. Объёмный расход при другой температуре соответствует другой массе, массовый — нет.',
   nl:'Belastingen en vochtstromen gelden per kilogram DROGE lucht; het ingevoerde debiet wordt daarom met het soortelijk volume van de intredende toestand omgerekend naar een droge-luchtmassastroom. Een volumestroom staat bij een andere temperatuur dus voor een andere massa, een massastroom niet.',
   fr:'Les puissances et les débits d’humidité sont rapportés au kilogramme d’air SEC : le débit saisi est converti en débit massique d’air sec avec le volume spécifique de l’état d’entrée. Un débit volumique représente donc une masse différente à une autre température, un débit massique non.',
   de:'Lasten und Feuchteströme beziehen sich auf ein Kilogramm TROCKENE Luft; der eingegebene Strom wird daher mit dem spezifischen Volumen des Eintrittszustands in einen Trockenluft-Massenstrom umgerechnet. Ein Volumenstrom steht bei anderer Temperatur für eine andere Masse, ein Massenstrom nicht.',
   es:'Las cargas y los caudales de humedad se refieren al kilogramo de aire SECO, por lo que el caudal introducido se convierte en caudal másico de aire seco con el volumen específico del estado de entrada. Un caudal volumétrico representa otra masa a otra temperatura; uno másico, no.',pl:"Obciążenia cieplne i strumienie wilgoci odnoszą się do kilograma SUCHEGO powietrza, dlatego wpisany przepływ objętościowy jest przeliczany na strumień masy suchego powietrza z użyciem objętości właściwej stanu wlotowego. Ten sam przepływ objętościowy oznacza więc inną masę przy innej temperaturze; strumień masowy nie."}],

 process:[{en:'Processes and the chain',uk:'Процеси та ланцюжок',ru:'Процессы и цепочка',nl:'Processen en de reeks',fr:'Transformations et enchaînement',de:'Prozesse und die Kette',es:'Procesos y la cadena',pl:"Procesy i ich łańcuch"},
  {en:'A process starts from a state you pick and produces a new one, so the chain can branch: any process may start from the start state or from the outlet of an earlier process. Delete a process with the × on its row.',
   uk:'Процес починається з обраного вами стану й дає новий, тож ланцюжок може розгалужуватися: кожен процес може виходити зі стартового стану або з виходу будь-якого попереднього. Видалити процес — знаком × у його рядку.',
   ru:'Процесс начинается с выбранного вами состояния и даёт новое, поэтому цепочка может ветвиться: любой процесс может исходить из стартового состояния или из выхода любого предыдущего. Удалить процесс — знаком × в его строке.',
   nl:'Een proces begint bij een toestand die u kiest en levert een nieuwe op; de reeks mag dus vertakken: elk proces kan starten bij de starttoestand of bij de uitlaat van een eerder proces. Verwijderen doet u met de × op de regel.',
   fr:'Une transformation part d’un état que vous choisissez et en produit un nouveau : l’enchaînement peut donc se ramifier, chaque transformation partant de l’état initial ou de la sortie d’une transformation antérieure. Le × de la ligne supprime la transformation.',
   de:'Ein Prozess beginnt an einem von Ihnen gewählten Zustand und liefert einen neuen; die Kette darf sich also verzweigen: jeder Prozess kann vom Startzustand oder vom Austritt eines früheren Prozesses ausgehen. Das × in der Zeile löscht ihn.',
   es:'Un proceso parte de un estado que usted elige y produce otro, de modo que la cadena puede ramificarse: cualquier proceso puede partir del estado inicial o de la salida de un proceso anterior. La × de la fila lo elimina.',pl:"Proces rozpoczyna się od wybranego stanu i generuje nowy, dzięki czemu łańcuch może się rozgałęziać: każdy proces może rozpocząć się od stanu początkowego lub od punktu wyjścia wcześniejszego procesu. Usuń proces ze znakiem × w wierszu."}],

 coil:[{en:'Cooling coil: ADP and bypass factor',uk:'Охолоджувач: ADP і байпас-фактор',ru:'Охладитель: ADP и байпас-фактор',nl:'Koelbatterij: ADP en bypassfactor',fr:'Batterie froide : ADP et facteur de bypass',de:'Kühler: ADP und Bypass-Faktor',es:'Batería de frío: ADP y factor de bypass',pl:"Chłodnica: ADP i współczynnik obejścia"},
  {en:'A wet coil is modelled as part of the air reaching the surface at the apparatus dew point (ADP) and the rest passing by untreated; the bypass factor is that untreated fraction. A coil whose ADP is at or above the entering dew point cannot condense anything and runs dry: only the temperature falls.',
   uk:'Мокрий охолоджувач моделюють так: частина повітря досягає стану поверхні — точки роси апарата (ADP), решта проходить необробленою; байпас-фактор — це необроблена частка. Охолоджувач, у якого ADP не нижча за точку роси на вході, нічого не конденсує й працює «сухим»: падає лише температура.',
   ru:'Мокрый охладитель моделируют так: часть воздуха достигает состояния поверхности — точки росы аппарата (ADP), остальная проходит необработанной; байпас-фактор — эта необработанная доля. Охладитель, у которого ADP не ниже точки росы на входе, ничего не конденсирует и работает «сухим»: падает только температура.',
   nl:'Een natte batterij wordt gemodelleerd als een deel van de lucht dat het oppervlak op het apparaatdauwpunt (ADP) bereikt terwijl de rest onbehandeld passeert; de bypassfactor is dat onbehandelde deel. Een batterij met een ADP op of boven het intredende dauwpunt condenseert niets en werkt droog: alleen de temperatuur daalt.',
   fr:'Une batterie humide est modélisée par une part d’air atteignant la surface au point de rosée machine (ADP) et le reste passant sans traitement ; le facteur de bypass est cette fraction non traitée. Une batterie dont l’ADP atteint ou dépasse le point de rosée d’entrée ne condense rien et fonctionne à sec : seule la température baisse.',
   de:'Ein nasser Kühler wird als Teil der Luft modelliert, der die Oberfläche am Taupunkt des Apparats (ADP) erreicht, während der Rest unbehandelt vorbeiströmt; der Bypass-Faktor ist dieser unbehandelte Anteil. Ein Kühler, dessen ADP nicht unter dem Eintrittstaupunkt liegt, kondensiert nichts und arbeitet trocken: nur die Temperatur sinkt.',
   es:'Una batería húmeda se modela como una parte del aire que alcanza la superficie en el punto de rocío del equipo (ADP) mientras el resto pasa sin tratar; el factor de bypass es esa fracción sin tratar. Una batería cuyo ADP iguala o supera el punto de rocío de entrada no condensa nada y trabaja en seco: sólo baja la temperatura.',pl:"Mokrą wężownicę modeluje się jako część powietrza docierającą do powierzchni w punkcie rosy urządzenia (ADP), a pozostałą część przepływającą bez oczyszczania; współczynnikiem obejścia jest ta nieoczyszczona frakcja. Wężownica, której ADP jest równe lub wyższe od punktu rosy na wlocie, nie może niczego skroplić i działa na sucho: spada jedynie temperatura."}],

 mixing:[{en:'Mixing two streams',uk:'Змішування двох потоків',ru:'Смешение двух потоков',nl:'Mengen van twee stromen',fr:'Mélange de deux flux',de:'Mischung zweier Ströme',es:'Mezcla de dos flujos',pl:"Mieszanie dwóch strumieni"},
  {en:'Adiabatic mixing conserves dry air, water and enthalpy, so the mixture lies on the straight line between the two states, at the point set by their mass ratio. No power crosses the boundary of a mixing box, so no load is reported for it. The second stream is a percentage of the total or an absolute flow.',
   uk:'Адіабатичне змішування зберігає сухе повітря, воду й ентальпію, тож суміш лежить на прямій між двома станами в точці, заданій співвідношенням мас. Через межу камери змішування потужність не передається, тому навантаження для неї не показано. Другий потік задають у відсотках від суми або абсолютною витратою.',
   ru:'Адиабатическое смешение сохраняет сухой воздух, воду и энтальпию, поэтому смесь лежит на прямой между двумя состояниями в точке, заданной отношением масс. Через границу камеры смешения мощность не передаётся, поэтому нагрузка для неё не показана. Второй поток задают в процентах от суммы или абсолютным расходом.',
   nl:'Adiabatisch mengen behoudt droge lucht, water en enthalpie: het mengsel ligt op de rechte lijn tussen beide toestanden, op het punt dat de massaverhouding bepaalt. Over de grens van een mengkamer gaat geen vermogen, dus wordt er geen belasting voor gemeld. De tweede stroom is een percentage van het totaal of een absoluut debiet.',
   fr:'Le mélange adiabatique conserve l’air sec, l’eau et l’enthalpie : le mélange se place sur la droite joignant les deux états, au point fixé par le rapport des masses. Aucune puissance ne traverse la frontière du caisson de mélange, aucune charge n’est donc indiquée. Le second flux se donne en pourcentage du total ou en débit absolu.',
   de:'Adiabatische Mischung erhält Trockenluft, Wasser und Enthalpie: die Mischung liegt auf der Geraden zwischen beiden Zuständen, an der vom Massenverhältnis bestimmten Stelle. Über die Grenze der Mischkammer fließt keine Leistung, daher wird keine Last ausgewiesen. Der zweite Strom wird als Prozentsatz der Summe oder als absoluter Strom angegeben.',
   es:'La mezcla adiabática conserva el aire seco, el agua y la entalpía: la mezcla queda en la recta entre ambos estados, en el punto que fija la relación de masas. Ninguna potencia cruza la frontera de la cámara de mezcla, por lo que no se indica carga. El segundo flujo se da como porcentaje del total o como caudal absoluto.',pl:"Mieszanie adiabatyczne zachowuje masę suchego powietrza, wody i entalpię, dlatego stan mieszaniny leży na prostej łączącej oba stany, w punkcie wynikającym z ich stosunku strumieni masowych. Przez granicę komory mieszania nie przepływa moc cieplna, więc nie jest dla niej podawane obciążenie. Drugi strumień można podać jako procent całości albo jako przepływ bezwzględny."}],

 recovery:[{en:'Heat recovery efficiency',uk:'ККД рекуперації',ru:'КПД рекуперации',nl:'Rendement van warmteterugwinning',fr:'Efficacité de la récupération',de:'Wirkungsgrad der Wärmerückgewinnung',es:'Eficiencia de la recuperación',pl:"Sprawność odzysku ciepła"},
  {en:'The temperature efficiency ε is the share of the temperature difference between the two streams that the exchanger actually transfers. A sensible device moves heat only; an enthalpy wheel also moves a share ε_d of the difference in moisture content.',
   uk:'ККД за температурою ε — це частка різниці температур між двома потоками, яку насправді передає апарат. Рекуператор явного тепла переносить лише теплоту; ентальпійний ротор переносить ще й частку ε_d різниці вологовмісту.',
   ru:'КПД по температуре ε — доля разности температур между двумя потоками, которую действительно передаёт аппарат. Рекуператор явного тепла переносит только теплоту; энтальпийный ротор переносит ещё и долю ε_d разности влагосодержания.',
   nl:'Het temperatuurrendement ε is het deel van het temperatuurverschil tussen beide stromen dat de wisselaar werkelijk overdraagt. Een voelbaar toestel verplaatst alleen warmte; een enthalpiewiel verplaatst daarnaast een deel ε_d van het verschil in vochtgehalte.',
   fr:'L’efficacité en température ε est la part de l’écart de température entre les deux flux réellement transférée. Un échangeur sensible ne transfère que de la chaleur ; une roue enthalpique transfère en plus une part ε_d de l’écart de teneur en eau.',
   de:'Der Temperatur-Wirkungsgrad ε ist der Anteil der Temperaturdifferenz zwischen beiden Strömen, den das Gerät tatsächlich überträgt. Ein sensibler Wärmeübertrager bewegt nur Wärme; ein Enthalpierad überträgt zusätzlich den Anteil ε_d der Wassergehaltsdifferenz.',
   es:'La eficiencia en temperatura ε es la parte de la diferencia de temperatura entre ambos flujos que el equipo transfiere realmente. Un recuperador sensible sólo mueve calor; una rueda entálpica mueve además una parte ε_d de la diferencia de contenido de humedad.',pl:"Sprawność temperaturowa ε to część różnicy temperatur między dwoma strumieniami, którą wymiennik faktycznie przenosi. Urządzenie odczuwalne przenosi jedynie ciepło; koło entalpii przenosi również część ε_d różnicy w zawartości wilgoci."}],

 adiabatic:[{en:'Adiabatic (evaporative) cooling',uk:'Адіабатичне (випарне) охолодження',ru:'Адиабатическое (испарительное) охлаждение',nl:'Adiabatische (verdampings)koeling',fr:'Refroidissement adiabatique (évaporatif)',de:'Adiabatische (Verdunstungs-)Kühlung',es:'Enfriamiento adiabático (evaporativo)',pl:"Chłodzenie adiabatyczne (wyparne)"},
  {en:'Water evaporates into the air, which cools along a line of almost constant wet-bulb temperature. The humidifying efficiency is how far towards saturation the air actually gets; the feed-water temperature sets the small amount of enthalpy the water itself carries in.',
   uk:'Вода випаровується в повітря, яке охолоджується вздовж лінії майже сталої температури мокрого термометра. ККД зволоження — це частка шляху до насичення, яку повітря справді проходить; температура живильної води задає ту невелику ентальпію, яку вносить сама вода.',
   ru:'Вода испаряется в воздух, который охлаждается вдоль линии почти постоянной температуры мокрого термометра. КПД увлажнения — доля пути до насыщения, которую воздух действительно проходит; температура питательной воды задаёт небольшую энтальпию, вносимую самой водой.',
   nl:'Water verdampt in de lucht, die afkoelt langs een lijn van vrijwel constante natteboltemperatuur. Het bevochtigingsrendement geeft aan hoe ver richting verzadiging de lucht werkelijk komt; de voedingswatertemperatuur bepaalt de kleine enthalpie die het water zelf meebrengt.',
   fr:'L’eau s’évapore dans l’air, qui se refroidit le long d’une ligne de température humide quasi constante. L’efficacité d’humidification indique quelle part du chemin vers la saturation est réellement parcourue ; la température de l’eau d’appoint fixe la faible enthalpie apportée par l’eau elle-même.',
   de:'Wasser verdunstet in die Luft, die sich entlang einer Linie nahezu konstanter Feuchtkugeltemperatur abkühlt. Der Befeuchtungswirkungsgrad gibt an, wie weit die Luft wirklich in Richtung Sättigung kommt; die Speisewassertemperatur bestimmt die geringe Enthalpie, die das Wasser selbst einträgt.',
   es:'El agua se evapora en el aire, que se enfría a lo largo de una línea de temperatura de bulbo húmedo casi constante. La eficiencia de humidificación indica qué parte del camino hacia la saturación se recorre realmente; la temperatura del agua de aporte fija la pequeña entalpía que aporta el propio agua.',pl:"Woda odparowuje do powietrza, które ochładza się wzdłuż linii niemal stałej temperatury termometru mokrego. Sprawność nawilżania określa, jak blisko nasycenia dochodzi powietrze; temperatura wody zasilającej określa niewielką entalpię wnoszoną przez samą wodę."}],

 fog:[{en:'Fog and supersaturation',uk:'Туман і перенасичення',ru:'Туман и пересыщение',nl:'Mist en oververzadiging',fr:'Brouillard et sursaturation',de:'Nebel und Übersättigung',es:'Niebla y sobresaturación',pl:"Mgła i przesycenie"},
  {en:'Air cannot hold more water than saturation. Where a state or a process ends above the saturation line the tool reports saturated air plus the matching mass of liquid water, and says so; every tabulated property then refers to the saturated gas phase only.',
   uk:'Повітря не може містити більше води, ніж за насичення. Якщо стан або процес опиняється вище лінії насичення, інструмент показує насичене повітря плюс відповідну масу рідкої води і повідомляє про це; усі табличні властивості тоді стосуються лише насиченої газової фази.',
   ru:'Воздух не может содержать больше воды, чем при насыщении. Если состояние или процесс оказывается выше линии насыщения, инструмент показывает насыщенный воздух плюс соответствующую массу жидкой воды и сообщает об этом; все табличные свойства тогда относятся только к насыщенной газовой фазе.',
   nl:'Lucht kan niet meer water bevatten dan bij verzadiging. Eindigt een toestand of proces boven de verzadigingslijn, dan meldt de tool verzadigde lucht plus de bijbehorende massa vloeibaar water; alle getabelleerde eigenschappen gelden dan alleen voor de verzadigde gasfase.',
   fr:'L’air ne peut pas contenir plus d’eau qu’à saturation. Si un état ou une transformation se termine au-dessus de la courbe de saturation, l’outil indique de l’air saturé plus la masse correspondante d’eau liquide ; toutes les propriétés tabulées ne concernent alors que la phase gazeuse saturée.',
   de:'Luft kann nicht mehr Wasser aufnehmen als bei Sättigung. Endet ein Zustand oder Prozess oberhalb der Sättigungslinie, weist das Werkzeug gesättigte Luft plus die zugehörige Masse flüssigen Wassers aus; alle tabellierten Eigenschaften gelten dann nur für die gesättigte Gasphase.',
   es:'El aire no puede contener más agua que en saturación. Si un estado o proceso termina por encima de la línea de saturación, la herramienta indica aire saturado más la masa correspondiente de agua líquida; todas las propiedades tabuladas se refieren entonces sólo a la fase gaseosa saturada.',pl:"Powietrze nie może pomieścić więcej wody niż wynosi nasycenie. Gdy stan lub proces kończy się powyżej linii nasycenia, narzędzie podaje nasycone powietrze plus odpowiadającą mu masę ciekłej wody i to zaznacza; każda tabelaryczna właściwość odnosi się wówczas wyłącznie do nasyconej fazy gazowej."}],

 wetbulb:[{en:'Wet-bulb temperature',uk:'Температура мокрого термометра',ru:'Температура мокрого термометра',nl:'Natteboltemperatuur',fr:'Température humide',de:'Feuchtkugeltemperatur',es:'Temperatura de bulbo húmedo',pl:"Temperatura termometru mokrego"},
  {en:'The thermodynamic wet-bulb, that is the adiabatic-saturation temperature: ASHRAE Eq. 33 above 0 °C and the ice-bulb Eq. 35 below it. It is the temperature evaporative cooling drives towards.',
   uk:'Термодинамічна температура мокрого термометра — температура адіабатного насичення: рівняння ASHRAE 33 вище 0 °C і крижане рівняння 35 нижче. Саме до неї прямує випарне охолодження.',
   ru:'Термодинамическая температура мокрого термометра — температура адиабатного насыщения: уравнение ASHRAE 33 выше 0 °C и «ледяное» уравнение 35 ниже. Именно к ней стремится испарительное охлаждение.',
   nl:'De thermodynamische natte bol, dat wil zeggen de adiabatische verzadigingstemperatuur: ASHRAE vgl. 33 boven 0 °C en de ijsbol-vgl. 35 daaronder. Verdampingskoeling streeft naar deze temperatuur.',
   fr:'Le bulbe humide thermodynamique, c’est-à-dire la température de saturation adiabatique : éq. 33 de l’ASHRAE au-dessus de 0 °C et éq. 35 (bulbe glacé) en dessous. C’est la température vers laquelle tend le refroidissement évaporatif.',
   de:'Die thermodynamische Feuchtkugeltemperatur, also die Temperatur der adiabaten Sättigung: ASHRAE Gl. 33 über 0 °C und die Eiskugel-Gl. 35 darunter. Auf sie läuft die Verdunstungskühlung zu.',
   es:'El bulbo húmedo termodinámico, es decir la temperatura de saturación adiabática: ec. 33 de ASHRAE por encima de 0 °C y ec. 35 (bulbo de hielo) por debajo. Es la temperatura hacia la que tiende el enfriamiento evaporativo.',pl:"Termodynamiczna temperatura termometru mokrego, czyli temperatura nasycenia adiabatycznego: równanie ASHRAE 33 powyżej 0 °C i równanie 35 dla termometru oblodzonego poniżej 0 °C. Jest to temperatura, do której dąży chłodzenie wyparne."}],

 dewpoint:[{en:'Dew point',uk:'Точка роси',ru:'Точка росы',nl:'Dauwpunt',fr:'Point de rosée',de:'Taupunkt',es:'Punto de rocío',pl:"Punkt rosy"},
  {en:'The temperature at which the air would begin to condense if it were cooled at constant moisture content. It decides whether a cooling coil condenses at all, and it is printed as a dash for perfectly dry air, where it does not exist.',
   uk:'Температура, за якої повітря почало б конденсувати вологу, якби його охолоджували за сталого вологовмісту. Вона вирішує, чи взагалі конденсуватиме охолоджувач; для абсолютно сухого повітря вона не існує й показується прочерком.',
   ru:'Температура, при которой воздух начал бы конденсировать влагу, если бы его охлаждали при постоянном влагосодержании. Она определяет, будет ли охладитель вообще конденсировать; для абсолютно сухого воздуха она не существует и показывается прочерком.',
   nl:'De temperatuur waarbij de lucht zou gaan condenseren als zij bij gelijk vochtgehalte werd gekoeld. Zij bepaalt of een koelbatterij überhaupt condenseert en verschijnt als streepje voor volkomen droge lucht, waar zij niet bestaat.',
   fr:'La température à laquelle l’air commencerait à condenser s’il était refroidi à teneur en eau constante. Elle décide si une batterie froide condense, et s’affiche par un tiret pour l’air parfaitement sec, où elle n’existe pas.',
   de:'Die Temperatur, bei der die Luft bei konstantem Wassergehalt zu kondensieren begänne. Sie entscheidet, ob ein Kühler überhaupt kondensiert, und erscheint als Strich für vollkommen trockene Luft, wo es sie nicht gibt.',
   es:'La temperatura a la que el aire empezaría a condensar si se enfriase con contenido de humedad constante. Decide si una batería de frío condensa y se muestra como un guion para el aire perfectamente seco, donde no existe.',pl:"Temperatura, w której powietrze zaczęłoby się skraplać, gdyby było chłodzone przy stałej zawartości wilgoci. Decyduje ona o tym, czy wężownica chłodząca w ogóle się skrapla i jest wyświetlana jako kreska dla idealnie suchego powietrza, gdy go nie ma."}],

 enthalpy:[{en:'Enthalpy i',uk:'Ентальпія i',ru:'Энтальпия i',nl:'Enthalpie i',fr:'Enthalpie i',de:'Enthalpie i',es:'Entalpía i',pl:"Entalpia i"},
  {en:'Energy per kilogram of DRY air, taken as zero for dry air at 0 °C. The load of a process is the dry-air mass flow times the difference in i, which is why the enthalpy lines matter more than the temperature ones when a process both cools and dries.',
   uk:'Енергія на кілограм СУХОГО повітря, нульова для сухого повітря за 0 °C. Навантаження процесу — це масова витрата сухого повітря на різницю i, тому для процесу, що одночасно охолоджує й осушує, лінії ентальпії важливіші за температурні.',

const uid=()=>Math.random().toString(36).slice(2,8);
const $=id=>document.getElementById(id);
const palette=['#ffb454','#2ecc71','#ff6b6b','#c77dff','#4dd0e1','#f78fb3','#9ccc65','#ff9f43'];
const humModes=['h_rh','h_d','h_h','h_dp','h_wb'];

/* =========================================================================
   State. The serialised shape (dgcSerialize) is the permalink contract and is
   unchanged: `alt`, `grid` and `draft` are page state that has never been in
   the link — the grid checkboxes and the add-process form were plain DOM
   before this port — and they stay out of it.
   ========================================================================= */
const S={P:101325,tmin:-10,tmax:50,wmax:0.030,view:'id',units:'metric',
  start:{t:20,hmode:'h_rh',hval:50,flow:1000,funit:'m3h',name:null},
  procs:[],nextPr:1,drag:null,cal:null,sel:null,
  alt:null,grid:{rh:true,h:true,wb:false,v:false},
  draft:{type:'heat',a:'start',par:{tf:35},b:{t:24,hmode:'h_rh',hval:50},flowMode:'pct',flowVal:50}};

/* the screen the tool has always opened on: start state plus one heating
   process to 35 °C (the old boot did this by driving its own form) */
function makeDefaults(){
  return {P:101325,tmin:-10,tmax:50,wmax:0.030,view:'id',units:'metric',
    start:{t:20,hmode:'h_rh',hval:50,flow:1000,funit:'m3h',name:null},
    procs:[{id:uid(),n:1,type:'heat',color:palette[0],a:'start',par:{tf:35},name:null}],
    nextPr:2,drag:null,cal:null,sel:null,alt:null,
    grid:{rh:true,h:true,wb:false,v:false},
    draft:{type:'heat',a:'start',par:{tf:35},b:{t:24,hmode:'h_rh',hval:50},flowMode:'pct',flowVal:50}};
}
/* mutate in place: App.reset()/App.example() would hand back a NEW object and
   every field would keep pointing at the old one (framework note, §11) */
function assignState(src){
  Object.keys(S).forEach(k=>{delete S[k];});
  Object.assign(S,JSON.parse(JSON.stringify(src)));
}
function resetAll(){assignState(makeDefaults());}

/* ---- add-process draft (was the #prParams form) ---- */
function draftDef(){return procDefs[S.draft.type]||procDefs.heat;}
function stateRefs(){
  return [{id:'start',name:startName()}].concat(S.procs.map(p=>({id:p.id,name:procName(p)})));
}
function resetDraft(type){
  const def=procDefs[type]||procDefs.heat,d=S.draft;
  d.type=type;d.par={};
  def.params.forEach(p=>{d.par[p.k]=p.def;});
  if(def.manualB)d.b={t:def.bDef.t,hmode:def.bDef.hmode,hval:def.bDef.hval};
  if(def.mixFlow){d.flowMode='pct';d.flowVal=50;}
  const st=stateRefs();d.a=st[st.length-1].id;      /* as buildParams() did */
}
function normalizeDraft(){
  const d=S.draft||(S.draft=makeDefaults().draft);
  if(!procDefs[d.type])d.type='heat';
  if(!d.par)d.par={};
  if(!d.b)d.b={t:24,hmode:'h_rh',hval:50};
  if(d.a!=='start'&&!S.procs.some(p=>p.id===d.a))d.a='start';
}

/* ---- unit-system switch: the old #unitsSeg handler, unchanged in effect ---- */
function switchUnits(u){
  if(u!=='metric'&&u!=='imperial')return;
  if(u===S.units)return;
  const snap={start:startState()};
  S.procs.forEach(pr=>{if(pr.bStream)snap[pr.id]=getBState(pr);});
  const map={m3h:'cfm',kgh:'lbh',m3s:'cfs',kgs:'lbs',cfm:'m3h',lbh:'kgh',cfs:'m3s',lbs:'kgs'};
  const fc={m3h_cfm:0.588578,cfm_m3h:1/0.588578,kgh_lbh:2.20462,lbh_kgh:1/2.20462,
            m3s_cfs:35.3147,cfs_m3s:1/35.3147,kgs_lbs:2.20462,lbs_kgs:1/2.20462};
  const old=S.start.funit,neo=map[old];
  if(fc[old+'_'+neo]&&S.start.flow)S.start.flow=+(S.start.flow*fc[old+'_'+neo]).toFixed(2);
  S.start.funit=neo;
  S.units=u;
  S.start.hval=+humToVal(snap.start.t,snap.start.W,S.start.hmode).toFixed(2);
  S.procs.forEach(pr=>{
    if(pr.bStream){const bb=snap[pr.id];pr.bStream.hval=+humToVal(bb.t,bb.W,pr.bStream.hmode).toFixed(2);}
    if(pr.type==='mix'&&pr.flowMode==='abs'&&fc[old+'_'+neo])pr.flowVal=+(pr.flowVal*fc[old+'_'+neo]).toFixed(2);
  });
}

/* ---- labels: the unit belongs in the framework's unit slot, never in the
       label text (spec §6), so it is stripped off the tool's own strings ---- */
const U=lbl=>({unit:lbl,display:lbl});
function stripUnit(txt,unit){
  if(!unit)return txt;
  const tail=', '+unit;
  return txt.slice(-tail.length)===tail?txt.slice(0,-tail.length):txt;
}
function paramUnit(p){
  return p.u==='T'?CONV.t[un()].lab:p.u==='D'?CONV.d[un()].lab:(p.k==='rhf'?'%':'');
}
function paramLabel(p){return stripUnit(uLab(tr(p.key)),paramUnit(p));}
function humUnit(mode){
  return mode==='h_rh'?'%':mode==='h_d'?CONV.d[un()].lab:mode==='h_h'?enthAbsLab():CONV.t[un()].lab;
}

function humToVal(t,W,mode){const P=S.P;switch(mode){
  case 'h_rh':return RH_from_W(t,W,P)*100;case 'h_d':return dispD(W);
  case 'h_h':return enthAbs(t,W);
  case 'h_dp':{const d=dewPoint(W,P);return dispT(isFinite(d)?d:-100);}
  case 'h_wb':return dispT(wetBulb(t,W,P));}return 0;}
function valToW(t,mode,val){const P=S.P,imp=un()==='imperial';switch(mode){
  case 'h_rh':return W_from_RH(t,Math.max(0,val)/100,P);
  case 'h_d':return Math.max(0,imp?val/7000:val/1000);
  case 'h_h':{if(imp){const tf=t*9/5+32;return Math.max(0,(val-0.240*tf)/(1061+0.444*tf));}return Math.max(0,W_from_hT(val,t));}
  case 'h_dp':return W_sat(fromT(val),P);case 'h_wb':return W_from_wb(t,fromT(val),P);}return 0;}
function mkState(t,Wraw){const g=fogAtT(t,Math.max(0,Wraw),S.P);const st=props(g.t,g.W,S.P);st.liq=g.liq;return st;}
function startState(){const t=S.start.t;return mkState(t,valToW(t,S.start.hmode,S.start.hval));}
function getBState(pr){const t=pr.bStream.t;return mkState(t,valToW(t,pr.bStream.hmode,pr.bStream.hval));}

/* потоки сухого воздуха */
function flowToDry(val,unit,st){if(!val||val<=0)return 0;switch(unit){
  case 'm3h':return (val/3600)/st.v;case 'm3s':return val/st.v;case 'kgh':return (val/3600)/(1+st.W);case 'kgs':return val/(1+st.W);
  case 'cfm':return (val*0.000471947)/st.v;case 'cfs':return (val*0.0283168)/st.v;case 'lbh':return (val*0.000125998)/(1+st.W);case 'lbs':return (val*0.453592)/(1+st.W);}return 0;}
function dryToFlow(md,st,unit){switch(unit){
  case 'm3h':return md*st.v*3600;case 'm3s':return md*st.v;case 'kgh':return md*(1+st.W)*3600;case 'kgs':return md*(1+st.W);
  case 'cfm':return md*st.v/0.000471947;case 'cfs':return md*st.v/0.0283168;case 'lbh':return md*(1+st.W)/0.000125998;case 'lbs':return md*(1+st.W)/0.453592;}return 0;}
function startDry(){return flowToDry(S.start.flow,S.start.funit,startState());}
function dryFlowOfState(ref){if(ref==='start')return startDry();const pr=S.procs.find(p=>p.id===ref);if(!pr)return 0;
  const mA=dryFlowOfState(pr.a);if(pr.type==='mix'){return mA+streamBDry(pr,mA);}return mA;}
function streamBDry(pr,mA){if(pr.flowMode==='pct'){const pct=Math.max(0,Math.min(99.9,pr.flowVal));return mA*pct/(100-pct);}
  return flowToDry(pr.flowVal,S.start.funit,getBState(pr));}

/* ================= geometry / transforms (unchanged) ================= */
/* ================= Геометрия / преобразования ================= */
const M={l:58,r:60,t:40,b:52},VW=980,VH=680;
const plotW=()=>VW-M.l-M.r,plotH=()=>VH-M.t-M.b;
function calibrate(){if(S.view==='ps'){S.cal={};return;}const rawY=(t,W)=>-(enthalpy(t,W)-R0*W);
  let ys=[];for(const t of[S.tmin,S.tmax])for(const W of[0,S.wmax])ys.push(rawY(t,W));
  S.cal={rymin:Math.min(...ys),rymax:Math.max(...ys),rxmax:S.wmax};}
function P2S(t,W){if(S.view==='ps')return{x:M.l+(t-S.tmin)/(S.tmax-S.tmin)*plotW(),y:M.t+plotH()-(W/S.wmax)*plotH()};
  const c=S.cal,rawY=-(enthalpy(t,W)-R0*W);return{x:M.l+(W/c.rxmax)*plotW(),y:M.t+(rawY-c.rymin)/(c.rymax-c.rymin)*plotH()};}
function S2P(x,y){if(S.view==='ps'){return{t:S.tmin+(x-M.l)/plotW()*(S.tmax-S.tmin),W:(M.t+plotH()-y)/plotH()*S.wmax};}
  const c=S.cal,W=(x-M.l)/plotW()*c.rxmax,rawY=c.rymin+(y-M.t)/plotH()*(c.rymax-c.rymin);return{t:-rawY/(C_DA+C_V*W),W};}
function svgEl(n,a){const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function txt(x,y,s,a){const e=svgEl('text',Object.assign({x,y},a||{}));e.textContent=s;return e;}
function seg(a,b,at){return svgEl('line',Object.assign({x1:a.x,y1:a.y,x2:b.x,y2:b.y},at));}
function curve(arr,at){return svgEl('polyline',Object.assign({points:arr.map(p=>p.x+','+p.y).join(' '),fill:'none'},at));}
function arrow(a,b,c,L){const g=Math.atan2(b.y-a.y,b.x-a.x);L=L||9;
  return svgEl('polygon',{points:`${b.x},${b.y} ${b.x-L*Math.cos(g-.4)},${b.y-L*Math.sin(g-.4)} ${b.x-L*Math.cos(g+.4)},${b.y-L*Math.sin(g+.4)}`,fill:c});}

/* =========================================================================
   The chart. Same geometry, same curves; what the port changes is that the
   host owns the size (spec §10), that every colour is a token instead of a
   dark-theme literal, that label and stroke sizes are physical rather than
   scaled with the drawing, and that the relative-humidity labels are no
   longer clipped at the plot frame.
   ========================================================================= */
let STAGE=null,READOUT=null,CHARTHOST=null,LASTSIZE={w:VW,h:VH,density:'fine'};

function drawChartInto(host,size){
  calibrate();
  LASTSIZE=size||LASTSIZE;
  const coarse=(LASTSIZE.density==='coarse');
  const k=VW/Math.max(120,LASTSIZE.w||VW);        /* viewBox units per CSS pixel */
  const FS=n=>+(n*k).toFixed(2), SW=n=>+(n*k).toFixed(2);

  hr_enth:{refs:1,manualB:true,bDef:{t:22,hmode:'h_rh',hval:45},params:[{k:'epst',key:'p_epst',def:0.7},{k:'epsd',key:'p_epsd',def:0.6}]},
};

function startName(){return S.start.name||tr('startName');}

function bName(pr){return pr.bStream.name||('B'+pr.n);}
function getState(ref){if(ref==='start')return startState();const pr=S.procs.find(p=>p.id===ref);return pr?pr.out:null;}
function allStates(){const out=[{id:'start',name:startName(),color:'#4ea1ff',...startState()}];
  S.procs.forEach(pr=>{if(procDefs[pr.type].manualB&&pr.bStream){const B=getBState(pr);out.push({id:pr.id+'_B',name:bName(pr),color:pr.color,bpid:pr.id,...B});}
    if(pr.out)out.push({id:pr.id,name:procName(pr),color:pr.color,...pr.out});});return out;}
function computeProcess(type,A,B,par,opt){const P=S.P;let path=[],out=null,extra={},warn='';opt=opt||{};
  /* clamp to saturation and book the excess as liquid mist, never silently */
  const cs=(t,W)=>{const g=fogAtT(t,W,P);if(g.liq>0){extra.liq=g.liq;warn=warn||tr('w_fog');}return g.W;};
  switch(type){
    case 'heat':{out={t:par.tf,W:A.W};path=[{t:A.t,W:A.W},{t:par.tf,W:A.W}];break;}
    case 'cool':{const dp=dewPoint(A.W,P);
      if(!(par.tf<dp)){out={t:par.tf,W:A.W};path=[{t:A.t,W:A.W},{t:par.tf,W:A.W}];}
      else{const te=Math.max(par.tf,-60);path=[{t:A.t,W:A.W},{t:dp,W:A.W}];for(let tt=dp-1;tt>te;tt-=1)path.push({t:tt,W:W_sat(tt,P)});
        const Wf=W_sat(te,P);path.push({t:te,W:Wf});out={t:te,W:Wf};extra.cond=A.W-Wf;}break;}
    /* A coil whose surface (ADP) is at or above the entering dew point cannot
       condense anything: it runs dry, W is unchanged and only t drops.  The
       ADP/bypass mixing model applies to the wet coil only. */
    case 'coil':{const adp=par.adp,bf=Math.max(0,Math.min(1,par.bf)),dpA=dewPoint(A.W,P);
      const t2=adp+bf*(A.t-adp);extra.adp={t:adp,W:W_sat(adp,P)};
      if(!(adp<dpA)){out={t:t2,W:A.W};path=[{t:A.t,W:A.W},{t:t2,W:A.W}];extra.dry=true;break;}
      const Wa=W_sat(adp,P),W2=Wa+bf*(A.W-Wa);
      out={t:t2,W:W2};path=[{t:A.t,W:A.W},{t:t2,W:W2}];extra.cond=A.W-W2;break;}
    /* Adiabatic mixing: conserve dry air, total water (vapour + any liquid carried
       in) and total enthalpy.  If the mixture is supersaturated the temperature
       follows from the energy balance INCLUDING the condensed liquid - clamping W
       after solving for t would throw away both water and enthalpy. */
    case 'mix':{const w1=opt.w1!=null?opt.w1:1,w2=opt.w2!=null?opt.w2:1,mt=w1+w2||1;
      const lA=liqOf(A),lB=liqOf(B);
      const W=(w1*(A.W+lA)+w2*(B.W+lB))/mt,h=(w1*(A.h+lA*CW*A.t)+w2*(B.h+lB*CW*B.t))/mt;
      const g=fogFromHW(h,W,P);out={t:g.t,W:g.W,liq:g.liq};
      path=[{t:A.t,W:A.W},{t:g.t,W:g.W},{t:B.t,W:B.W}];
      if(g.liq>0){extra.liq=g.liq;warn=tr('w_fogmix');}break;}
    case 'adiab':{const eff=Math.max(0,Math.min(1,par.eff)),tw=(par.tw==null?A.wb:par.tw);const{tOf,Ws}=adiabLine(A,tw,P);
      const W=A.W+eff*(Ws-A.W),t=tOf(W);out={t,W:cs(t,W)};path=[];for(let i=0;i<=14;i++){const ww=A.W+(W-A.W)*i/14;path.push({t:tOf(ww),W:ww});}break;}
    case 'steam':{const Wf=W_from_RH(A.t,par.rhf/100,P);
      if(Wf<A.W){warn=tr('w_rhDown');out={t:A.t,W:A.W};path=[{t:A.t,W:A.W}];break;}
      out={t:A.t,W:Wf};path=[{t:A.t,W:A.W},{t:A.t,W:Wf}];break;}
    case 'dehum':{const Wf=Math.max(0,par.df/1000);if(Wf>=A.W){warn=tr('w_dUp');out={t:A.t,W:A.W};path=[{t:A.t,W:A.W}];break;}
      const dp=dewPoint(A.W,P),tef=dewPoint(Wf,P),te=isFinite(tef)?tef:-100;
      path=[{t:A.t,W:A.W},{t:dp,W:A.W}];for(let tt=dp;tt>=te;tt-=1)path.push({t:tt,W:W_sat(tt,P)});path.push({t:te,W:Wf});
      out={t:te,W:Wf};extra.cond=A.W-Wf;break;}
    case 'hr_sens':{const e=Math.max(0,Math.min(1,par.eps)),t=A.t+e*(B.t-A.t);out={t,W:A.W};path=[{t:A.t,W:A.W},{t,W:A.W}];break;}
    case 'hr_enth':{const et=Math.max(0,Math.min(1,par.epst)),ed=Math.max(0,Math.min(1,par.epsd));const t=A.t+et*(B.t-A.t),W=A.W+ed*(B.W-A.W);
      out={t,W:cs(t,W)};path=[{t:A.t,W:A.W},{t,W}];break;}}
  const o=props(out.t,out.W,P);o.liq=out.liq||extra.liq||0;
  return{path,out:o,extra,warn};}

function computeAll(){

  stWarn(startState(),startName());

    const r=computeProcess(pr.type,A,B,pr.par,opt);pr.path=r.path;pr.out=r.out;pr.extra=r.extra;pr.warn=r.warn;
    if(r.warn)warns.push(procName(pr)+': '+r.warn);});

function addProcess(){

  const pr={id:uid(),n:S.nextPr,type:type,color:palette[(S.nextPr-1)%palette.length],

function procTableNode(){
  if(!S.procs.length)return null;
  const imp=un()==='imperial',tl=CONV.t[un()].lab,dl=CONV.d[un()].lab;
  const wrap=mk('div','dgu-table-wrap'),tb=mk('table','dgu-table');
  tb.id='mo-proc-table';
  tb.innerHTML='<caption class="dgu-panel-t mo-cap">'+esc(tr('resT'))+'</caption><thead><tr>'
    +`<th>${esc(tr('procC'))}</th><th>${esc(tr('from'))}</th><th>${esc(tr('to'))}</th>`
    +`<th>Δt, ${tl}</th><th>Δd, ${dl}</th><th>Δi, ${CONV.enthd[un()].lab}</th>`
    +`<th>${esc(tr('power'))}, ${CONV.pow[un()].lab}</th><th>${esc(tr('moist'))}, ${CONV.mrate[un()].lab}</th>`
    +`<th>${esc(tr('note'))}</th></tr></thead><tbody></tbody>`;
  const body=tb.querySelector('tbody');
  S.procs.forEach(pr=>{
    const A=getState(pr.a),o=pr.out;if(!A||!o)return;
    const dt=o.t-A.t,dd=(o.W-A.W)*1000,di=o.h-A.h;
    const dtD=imp?dt*9/5:dt,ddD=imp?dd*7:dd;
    const md=dryFlowOfState(pr.id);let power='—',moi='—';
    const adiabatic=(pr.type==='mix');
    if(md>0){if(!adiabatic)power=nsep(CONV.pow[un()].f(md*di).toFixed(imp?0:2));
      moi=nsep(CONV.mrate[un()].f(md*(o.W-A.W)*3600).toFixed(2));}
    const note=[];
    if(pr.extra&&pr.extra.cond>0)note.push(tr('cond')+' '+(imp?nsep((pr.extra.cond*7000).toFixed(1))+' gr/lb':nsep((pr.extra.cond*1000).toFixed(2))+' g/kg'));
    if(pr.extra&&pr.extra.liq>0)note.push(tr('fogw')+' '+(imp?nsep((pr.extra.liq*7000).toFixed(1))+' gr/lb':nsep((pr.extra.liq*1000).toFixed(2))+' g/kg'));
    if(pr.extra&&pr.extra.adp)note.push('ADP '+nsep(dispT(pr.extra.adp.t).toFixed(1))+tl);
    if(pr.extra&&pr.extra.dry)note.push(tr('drycoil'));
    if(pr.type==='mix'){const mtot=dryFlowOfState(pr.id);if(mtot>0)note.push('Σ '+nsep(dryToFlow(mtot,o,S.start.funit).toFixed(0))+' '+flowLab(S.start.funit));}
    if(adiabatic)note.push(tr('noPower'));
    const r=document.createElement('tr');
    r.innerHTML=`<td><span class="mo-cell"><span class="mo-dot" style="background:${esc(pr.color)}"></span>${esc(tr('pn_'+pr.type))}</span></td>`
      +`<td class="num">${nsep(dispT(A.t).toFixed(1))}${tl}</td>`
      +`<td class="num">${nsep(dispT(o.t).toFixed(1))}${tl} / ${nsep(dispD(o.W).toFixed(1))} ${dl}</td>`
      +`<td class="num">${nsep(dtD.toFixed(1))}</td><td class="num">${nsep(ddD.toFixed(2))}</td>`
      +`<td class="num">${nsep(CONV.enthd[un()].f(di).toFixed(2))}</td><td class="num">${power}</td><td class="num">${moi}</td>`
      +`<td>${esc(note.join('; ')||'—')}</td>`;
    body.appendChild(r);});
  wrap.appendChild(tb);return wrap;
}

/* ---- results: tiles for the end of the chain, then the two tables ---- */
function buildResults(){
  const states=allStates(),fin=states[states.length-1];
  const tl=CONV.t[un()].lab,imp=un()==='imperial';
  const lastPr=S.procs.length?S.procs[S.procs.length-1]:null;
  const tiles=[
    {label:tr('temp'),value:+dispT(fin.t).toFixed(1),unit:tl,display:tl,precision:1,hint:fin.name},
    {label:stripUnit(uLab(tr('h_rh')),'%'),value:+(fin.rh*100).toFixed(0),unit:'%',display:'%',precision:0,
      hint:fin.name,learn:'humidity',tone:fin.rh>=0.999?'warn':null}
  ];
  if(lastPr&&lastPr.out){
    const A=getState(lastPr.a),o=lastPr.out,md=dryFlowOfState(lastPr.id);
    const adiabatic=(lastPr.type==='mix');
    tiles.push({label:tr('power'),unit:CONV.pow[un()].lab,display:CONV.pow[un()].lab,learn:'power',hint:procName(lastPr),
      value:(md>0&&!adiabatic)?+CONV.pow[un()].f(md*(o.h-A.h)).toFixed(imp?0:2):null,
      precision:imp?0:2});
  }
  tiles.push(
    {label:stripUnit(uLab(tr('h_d')),CONV.d[un()].lab),value:+dispD(fin.W).toFixed(2),
      unit:CONV.d[un()].lab,display:CONV.d[un()].lab,precision:2,learn:'moisture',headline:false},
    {label:stripUnit(uLab(tr('h_h')),enthAbsLab()),value:+enthAbs(fin.t,fin.W).toFixed(2),
      unit:enthAbsLab(),display:enthAbsLab(),precision:2,learn:'enthalpy',headline:false},
    {label:stripUnit(uLab(tr('h_wb')),tl),value:isFinite(fin.wb)?+dispT(fin.wb).toFixed(1):null,
      unit:tl,display:tl,precision:1,learn:'wetbulb',headline:false},
    {label:stripUnit(uLab(tr('h_dp')),tl),value:isFinite(fin.dp)?+dispT(fin.dp).toFixed(1):null,
      unit:tl,display:tl,precision:1,learn:'dewpoint',headline:false},
    {label:tr('g_v'),value:+CONV.v[un()].f(fin.v).toFixed(3),unit:CONV.v[un()].lab,display:CONV.v[un()].lab,
      precision:3,headline:false},
    {label:tr('pvL'),value:+CONV.pv[un()].f(fin.pw).toFixed(CONV.pv[un()].dp),
      unit:CONV.pv[un()].lab,display:CONV.pv[un()].lab,precision:CONV.pv[un()].dp,headline:false});
  if(lastPr&&lastPr.out){
    const A=getState(lastPr.a),o=lastPr.out,md=dryFlowOfState(lastPr.id);
    tiles.push({label:tr('moist'),unit:CONV.mrate[un()].lab,display:CONV.mrate[un()].lab,headline:false,hint:procName(lastPr),
      value:md>0?+CONV.mrate[un()].f(md*(o.W-A.W)*3600).toFixed(2):null,precision:2});
  }
  return {
    verdict:LASTWARN.length?{tone:'warn',text:LASTWARN.join('  •  ')}:null,
    tiles:tiles
  };
}

/* ---- the process list: name, the one parameter that steers the process,
       and delete. The parameter input is the old "Adjust" column. ---- */
function procRow(pr){
  const item=mk('div','mo-item'+(pr.id===S.sel?' sel':''));
  const h=mk('div','mo-row');
  const dot=mk('span','mo-dot');dot.style.background=pr.color;h.appendChild(dot);
  const nm=mk('input','dgu-fctl mo-grow');
  nm.type='text';nm.value=procName(pr);nm.setAttribute('aria-label',tr('nameL'));
  nm.addEventListener('change',()=>setName(pr.id,nm.value));
  h.appendChild(nm);
  const del=mk('button','dgu-btn ghost icon');
  del.type='button';del.textContent='×';
  del.title=tr('delProcL');del.setAttribute('aria-label',tr('delProcL')+' '+procName(pr));
  del.addEventListener('click',()=>delProc(pr.id));
  h.appendChild(del);
  item.appendChild(h);

  const r2=mk('div','mo-row');
  const typeBtn=mk('button','dgu-btn ghost mo-type');
  typeBtn.type='button';typeBtn.textContent=tr('pn_'+pr.type);
  typeBtn.title=tr('selProcL');
  typeBtn.addEventListener('click',()=>{S.sel=pr.id;refresh();});
  r2.appendChild(typeBtn);
  const c=ctrlOf(pr);
  let ctl=null;
  if(c){
    ctl=mk('input','dgu-fctl mo-ctl');ctl.type='number';
    ctl.step=(c.u==='T'?'0.5':'0.05');
    ctl.setAttribute('aria-label',procName(pr)+' — '+c.lab);
    ctl.addEventListener('change',()=>{const v=parseFloat(ctl.value);
      if(isFinite(v)){pushHistory();c.set(fromPar(c.u,v));refresh();}});
    r2.appendChild(ctl);
    r2.appendChild(mk('span','mo-k',c.lab));
  }
  item.appendChild(r2);

  let bnm=null;
  if(procDefs[pr.type].manualB&&pr.bStream){
    const r3=mk('div','mo-row');
    const d2=mk('span','mo-dot');d2.style.background=pr.color;d2.style.opacity='.55';r3.appendChild(d2);
    bnm=mk('input','dgu-fctl mo-grow');bnm.type='text';
    bnm.setAttribute('aria-label',tr('secondStream')+' — '+tr('nameL'));
    bnm.addEventListener('change',()=>setName(pr.id+'_B',bnm.value));
    r3.appendChild(bnm);
    item.appendChild(r3);
  }
  item.__upd=()=>{
    item.classList.toggle('sel',pr.id===S.sel);
    if(document.activeElement!==nm)nm.value=procName(pr);
    if(ctl&&document.activeElement!==ctl){const cc=ctrlOf(pr);
      if(cc)ctl.value=String(+dispPar(cc.u,cc.get()).toFixed(2));}
    if(bnm&&document.activeElement!==bnm)bnm.value=bName(pr);
  };
  item.__upd();
  return item;
}

  pushHistory();

  S.procs=[];S.nextPr=1;S.sel=null;

    const def=procDefs[p.type];
    const pr={id:uid(),n:S.nextPr,type:p.type,color:palette[(S.nextPr-1)%palette.length],

      if(def.mixFlow){pr.flowMode='pct';pr.flowVal=p.share;}}

  });
  normalizeDraft();
}

/* ---- framework repair, local to this file: App.prototype.setLang refuses any
   language outside the site's registry in older framework builds, while this tool
   also carries a tool-local Russian UI; App.prototype.rebuild() takes the shell
   down with the shared chrome docked inside it below md. Both belong upstream:
   the language gate should read the tool's own language list, and rebuild()
   should re-home #dgc-bar itself. ---- */
function rebuildKeepingChrome(a){
  const kept=['dgc-bar','eng-disc-badge','dgc-menu','dgc-notes']
    .map(id=>document.getElementById(id)).filter(Boolean);
  const docked=document.documentElement.getAttribute('data-dgu-chrome')==='flow';
  kept.forEach(n=>document.body.appendChild(n));
  /* the panel definitions carry the unit labels of the current system, and
     rebuild() reuses the options object it was given, so they are re-declared */
  a.opts.panels=PANELS();
  const past=a.history?a.history.past.slice():null,fut=a.history?a.history.future.slice():null;
  a.rebuild();
  if(past&&a.history){a.history.past=past;a.history.future=fut;a.syncHeader();}
  const dock=(docked&&a.node)?a.node.querySelector('.dgu-chromedock'):null;
  if(dock){kept.forEach(n=>dock.appendChild(n));dock.hidden=false;}
  try{DiagramUI.measure();}catch(e){}
}
function patchLanguage(app){
  const proto=Object.getPrototypeOf(app);
  if(!proto.__moLang){
    proto.__moLang=true;
    proto.setLang=function(l){
      if(LANGS.indexOf(l)<0)return this.lang;
      LANG=l;this.lang=l;this.siteLang=l;rememberLang(l);
      try{const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u);}catch(e){}
      try{if(window.Diagram)Diagram.setLang(l);}catch(e){}
      document.documentElement.lang=l;
      document.title=tr('title')+' — '+(window.Diagram&&Diagram.site?Diagram.site.name():'tools.petrov.re');
      rebuildKeepingChrome(this);
      return l;
    };
  }
  const sels=app.head?app.head.querySelectorAll('select'):[];
  for(let i=0;i<sels.length;i++){
    const sel=sels[i];
    if(!sel.options.length)continue;
    let isLang=true;
    for(let j=0;j<sel.options.length;j++)if(LANGS.indexOf(sel.options[j].value)<0)isLang=false;
    if(!isLang)continue;
    let hasRu=false;
    for(let j=0;j<sel.options.length;j++)if(sel.options[j].value==='ru')hasRu=true;
    if(!hasRu){
      const o=document.createElement('option');o.value='ru';
      let at=null;
      for(let j=0;j<sel.options.length;j++)if(sel.options[j].value==='de')at=sel.options[j];
      sel.insertBefore(o,at);
    }
    for(let j=0;j<sel.options.length;j++)sel.options[j].text=LANG_NATIVE7[sel.options[j].value]||sel.options[j].text;
    sel.value=app.lang;
  }
}

/* ---- apply a state change that came from outside the fields ---- */
function applyAll(){
  if(!ui){fbRefresh();return;}
  if(ui.lang!==LANG){
    ui.lang=LANG;
    document.documentElement.lang=LANG;
    document.title=tr('title')+' — '+(window.Diagram&&Diagram.site?Diagram.site.name():'tools.petrov.re');
    rebuildKeepingChrome(ui);
  }else{ui.sync();ui.run();}
}

/* ================================================================== boot */
function onCompute(){
  computeAll();
  fillTables();
  if(STAGE)STAGE.schedule();
  PREV=snapshot();
  return buildResults();
}
function boot(){
  assignState(makeDefaults());
  if(!window.DiagramUI||DiagramUI.api!=='tools.petrov.re/ui/v1'){
    /* degrade honestly: same fields, same maths, same record, no framework */
    fbMount();
    dgcInit();
    window.__mollier={ui:null,state:()=>S,compute:computeAll};
    return;
  }
  ui=DiagramUI.app({
    id:'mollier',mount:'#app',layout:'calculator',compute:'live',
    lang:LANG,state:S,defaults:makeDefaults,
    title:()=>tr('title'),subtitle:()=>tr('sub'),
    strings:frameworkStrings(),
    learn:learnDef(),
    panels:PANELS(),
    footer:footerContent,
    history:{capture:captureHistory,restore:restoreHistory},
    regions:{
      inputs:(host,app)=>{app.examples(EXAMPLES);},
      stage:(host,app)=>{STAGE=buildStage(app);}
    },
    on:{
      compute:onCompute,
      change:key=>{
        /* the unit system rewrites every label and every unit slot, so the
           shell is rebuilt once, out of the field's own event */
        if(key==='units')setTimeout(()=>{if(ui)rebuildKeepingChrome(ui);},0);
      },
      reset:s=>{assignState(s);ui.state=S;},
      lang:l=>{LANG=l;},
      ready:()=>{patchLanguage(ui);if(STAGE)STAGE.schedule();}
    }
  });
  patchLanguage(ui);
  /* the tool's seventh language is not a site language, so the shared bootstrap
     could not publish it; the tool does, exactly as it did before the port */
  if(document.documentElement.lang!==LANG)document.documentElement.lang=LANG;
  document.title=tr('title')+' — '+(window.Diagram&&Diagram.site?Diagram.site.name():'tools.petrov.re');
  ui.ready();
  dgcInit();
  window.__mollier={ui:ui,state:()=>S,compute:computeAll};
}

function dragParam(pr,tc,Wc){const A=getState(pr.a),P=S.P,cl=(x,a,b)=>Math.max(a,Math.min(b,x));

    case 'adiab':{const tw=pr.par.tw==null?A.wb:pr.par.tw,{tOf,Ws}=adiabLine(A,tw,P),ts=tOf(Ws);pr.par.eff=+cl((A.t-tc)/((A.t-ts)||1),0,1).toFixed(2);break;}

function pget(o,p){const a=String(p).split('.');let c=o;
  for(let i=0;i<a.length;i++){if(c==null)return undefined;c=c[a[i]];}return c;}
function pset(o,p,v){const a=String(p).split('.');let c=o;
  for(let i=0;i<a.length-1;i++){if(c[a[i]]==null||typeof c[a[i]]!=='object')c[a[i]]={};c=c[a[i]];}
  c[a[a.length-1]]=v;}
const FBF=[];let FBCHART=null,FBRES=null;
const lbl=v=>typeof v==='function'?v():(v&&typeof v==='object'?(v[LANG]||v.en):v||'');
function fbField(def,host){
  if(def.type==='note'){
    const n=mk('div','dgu-hint',lbl(def.label));host.appendChild(n);
    FBF.push({def:def,node:n,ctl:null});return;
  }
  const node=mk('div','dgu-field');node.setAttribute('data-dgu-field',def.id||'');
  const id=(def.id||'f')+'-c';
  const la=mk('label','dgu-flabel',lbl(def.label));la.setAttribute('for',id);node.appendChild(la);
  const row=mk('div','dgu-frow');
  const get=()=>def.get?def.get(S,{state:S}):pget(S,def.key);
  const put=v=>{if(def.set)def.set(v,S,{state:S});else pset(S,def.key,v);};
  let ctl;
  if(def.type==='select'){
    ctl=mk('select','dgu-fctl');
    ctl.addEventListener('change',()=>{put(ctl.value);fbFull();});
  }else if(def.type==='segmented'){
    ctl=mk('div','dgu-frow');
    (typeof def.options==='function'?def.options():def.options).forEach(o=>{
      const b=mk('button','dgu-btn',o[1]);b.type='button';b.dataset.v=o[0];
      b.addEventListener('click',()=>{put(o[0]);fbFull();});ctl.appendChild(b);});
  }else if(def.type==='toggle'){
    ctl=mk('input','dgu-fctl');ctl.type='checkbox';ctl.style.width='auto';ctl.style.flex='0 0 auto';
    ctl.addEventListener('change',()=>{put(!!ctl.checked);fbFull();});
  }else{
    ctl=mk('input','dgu-fctl');ctl.type=def.type==='text'?'text':'number';
    if(def.step!=null)ctl.step=def.step;
    if(def.placeholder)ctl.placeholder=lbl(def.placeholder);
    ctl.addEventListener('change',()=>{
      const v=ctl.type==='number'?(ctl.value===''?null:parseFloat(ctl.value)):ctl.value;
      put(v);fbFull();});
  }
  ctl.id=id;row.appendChild(ctl);
  let unitNode=null;
  if(def.unit){unitNode=mk('span','dgu-unit',def.unit);row.appendChild(unitNode);}
  node.appendChild(row);
  host.appendChild(node);
  FBF.push({def:def,node:node,ctl:ctl,unit:unitNode,get:get});
}
function fbSyncFields(){
  FBF.forEach(f=>{
    const d=f.def;
    if(d.visible)f.node.hidden=!d.visible({state:S});
    if(!f.ctl)return;
    const v=f.get();
    if(d.type==='select'){
      const opts=typeof d.options==='function'?d.options():d.options;
      const sig=opts.map(o=>o[0]).join('|');
      if(f.ctl.dataset.sig!==sig){f.ctl.dataset.sig=sig;f.ctl.textContent='';
        opts.forEach(o=>{const n=document.createElement('option');n.value=o[0];n.textContent=o[1];f.ctl.appendChild(n);});}
      f.ctl.value=v;
    }else if(d.type==='segmented'){
      [].forEach.call(f.ctl.children,b=>b.classList.toggle('on',b.dataset.v===String(v)));
    }else if(d.type==='toggle'){f.ctl.checked=!!v;}
    else if(document.activeElement!==f.ctl){f.ctl.value=(v==null?'':String(v));}
    if(f.unit&&d.id==='f-hval')f.unit.textContent=humUnit(S.start.hmode);
    if(f.unit&&d.id==='f-flow')f.unit.textContent=flowLab(S.start.funit);
    if(f.unit&&d.id==='f-bhval')f.unit.textContent=humUnit(S.draft.b.hmode);

/* The chart itself, for the shared PDF report. The tool used to print it from a

   shared report owns pagination and the per-page Source line), so the figure
   moves into the report instead of being lost. The tokens are resolved against
   the light theme, because paper is white — the old popup printed `var(--line)`
   into a document that had never heard of it. */
function chartSVGMarkup(){
  const svg=(CHARTHOST&&CHARTHOST.querySelector('svg'))||document.querySelector('.mo-svg');
  if(!svg)return null;
  const root=document.documentElement,prev=root.getAttribute('data-theme');
  root.setAttribute('data-theme','light');
  const cs=getComputedStyle(root),seen={};
  let m=new XMLSerializer().serializeToString(svg);
  m=m.replace(/var\((--[a-z0-9-]+)\)/gi,(_,n)=>{
    if(!seen[n])seen[n]=(cs.getPropertyValue(n).trim()||'#333');
    return seen[n];});
  if(prev===null)root.removeAttribute('data-theme');else root.setAttribute('data-theme',prev);
  return m.replace(/\sclass="mo-svg"/,' width="900"');
}

R_DA = 0.287042   # kJ/(kg.K)
MW = 0.621945     # molar mass ratio water/dry air
CW = 4.186        # kJ/(kg.K), liquid water


def p_ws(t):
    """Hyland-Wexler saturation pressure over ice (t < 0) or water, Pa."""
    tk = t + 273.15
    if t < 0:
        c = (-5674.5359 / tk + 6.3925247 - 9.677843e-3 * tk + 6.2215701e-7 * tk ** 2
             + 2.0747825e-9 * tk ** 3 - 9.484024e-13 * tk ** 4 + 4.1635019 * math.log(tk))
    else:
        c = (-5800.2206 / tk + 1.3914993 - 0.048640239 * tk + 4.1764768e-5 * tk ** 2
             - 1.4452093e-8 * tk ** 3 + 6.5459673 * math.log(tk))
    return math.exp(c)


def w_from_pw(pw, p):
    return MW * pw / (p - pw)


def pw_from_w(w, p):
    return p * w / (MW + w)


def w_sat(t, p):
    return w_from_pw(min(p_ws(t), p * 0.999), p)


def enthalpy(t, w):
    """kJ per kg of DRY air."""
    return C_DA * t + w * (H_FG + C_V * t)


def t_from_hw(h, w):
    return (h - H_FG * w) / (C_DA + C_V * w)


def spec_vol(t, w, p):
    """m3 per kg of dry air."""
    return R_DA * (t + 273.15) * (1 + 1.607858 * w) / (p / 1000.0)


def rh_from_w(t, w, p):
    return pw_from_w(w, p) / p_ws(t)


def w_from_rh(t, rh, p):
    return w_from_pw(rh * p_ws(t), p)


def w_on_wb(t, twb, p):
    """Humidity ratio on the thermodynamic wet-bulb line (ASHRAE Eq. 33 / 35)."""
    ws = w_sat(twb, p)
    if twb >= 0:
        return ((H_FG - 2.326 * twb) * ws - C_DA * (t - twb)) / (H_FG + C_V * t - 4.186 * twb)
    return ((2830 - 0.24 * twb) * ws - C_DA * (t - twb)) / (2830 + C_V * t - 2.1 * twb)


def wet_bulb(t, w, p):
    lo, hi, x = -100.0, t + 0.001, t
    for _ in range(80):
        x = (lo + hi) / 2.0
        if w_on_wb(t, x, p) > w:
            hi = x
        else:
            lo = x
    return x


def dew_point(w, p):
    """Dew/frost point, or None where it is undefined."""
    if not (w > 0):
        return None
    pw = pw_from_w(w, p)
    if pw <= p_ws(-100):
        return None
    lo, hi, dp = -100.0, 90.0, 0.0
    for _ in range(80):
        dp = (lo + hi) / 2.0
        if p_ws(dp) > pw:
            hi = dp
        else:
            lo = dp
    return dp


def props(t, w, p):
    w = max(0.0, w)
    return {"t": t, "W": w, "rh": min(rh_from_w(t, w, p), 1.6), "h": enthalpy(t, w),
            "wb": wet_bulb(t, w, p), "dp": dew_point(w, p), "v": spec_vol(t, w, p),
            "pw": pw_from_w(w, p), "liq": 0.0}


def fog_at_t(t, w, p):
    ws = w_sat(t, p)
    return (t, ws, w - ws) if w > ws else (t, w, 0.0)


def fog_from_hw(h, w, p):
    """Adiabatic case: temperature follows from the energy balance including mist."""
    t0 = t_from_hw(h, w)
    if not (w > w_sat(t0, p)):
        return t0, w, 0.0

    def f(tf):
        ws = min(w_sat(tf, p), w)
        return enthalpy(tf, ws) + (w - ws) * CW * tf - h

    lo, hi = -100.0, 200.0
    for _ in range(100):
        m = (lo + hi) / 2.0
        if f(m) > 0:
            hi = m
        else:
            lo = m
    t = (lo + hi) / 2.0
    ws = min(w_sat(t, p), w)
    return t, ws, w - ws


def mk_state(t, w, p):
    tt, ww, liq = fog_at_t(t, max(0.0, w), p)
    s = props(tt, ww, p)
    s["liq"] = liq
    return s


def adiab_line(a, tw, p):
    """Returns t(W) along the adiabatic-saturation line through state a, and W at saturation."""
    def t_of(w):
        return (a["h"] + (w - a["W"]) * CW * tw - H_FG * w) / (C_DA + C_V * w)
    lo, hi, ws = a["W"], w_sat(a["wb"], p) * 1.5 + 0.03, a["W"]
    for _ in range(70):
        ws = (lo + hi) / 2.0
        if rh_from_w(t_of(ws), ws, p) > 1:
            hi = ws
        else:
            lo = ws
    return t_of, ws


def compute_process(kind, a, b, par, p, w1=1.0, w2=1.0):
    """One psychrometric process; returns (out state, condensate kg/kg)."""
    cond = 0.0
    if kind == "heat":
        out_t, out_w = par["tf"], a["W"]
    elif kind == "cool":
        dp = dew_point(a["W"], p)
        if dp is None or not (par["tf"] < dp):
            out_t, out_w = par["tf"], a["W"]
        else:
            te = max(par["tf"], -60.0)
            out_t, out_w = te, w_sat(te, p)
            cond = a["W"] - out_w
    elif kind == "coil":
        adp = par["adp"]
        bf = max(0.0, min(1.0, par["bf"]))
        dpa = dew_point(a["W"], p)
        t2 = adp + bf * (a["t"] - adp)
        if dpa is None or not (adp < dpa):
            out_t, out_w = t2, a["W"]
        else:
            wa = w_sat(adp, p)
            out_t, out_w = t2, wa + bf * (a["W"] - wa)
            cond = a["W"] - out_w
    elif kind == "mix":
        mt = w1 + w2 or 1.0
        la, lb = a["liq"], b["liq"]
        w = (w1 * (a["W"] + la) + w2 * (b["W"] + lb)) / mt
        h = (w1 * (a["h"] + la * CW * a["t"]) + w2 * (b["h"] + lb * CW * b["t"])) / mt
        t, ws, liq = fog_from_hw(h, w, p)
        s = props(t, ws, p)
        s["liq"] = liq
        return s, cond
    elif kind == "adiab":
        eff = max(0.0, min(1.0, par["eff"]))
        tw = a["wb"] if par.get("tw") is None else par["tw"]
        t_of, ws = adiab_line(a, tw, p)
        w = a["W"] + eff * (ws - a["W"])
        out_t, out_w = t_of(w), w
    elif kind == "steam":
        wf = w_from_rh(a["t"], par["rhf"] / 100.0, p)
        out_t, out_w = a["t"], (a["W"] if wf < a["W"] else wf)
    elif kind == "dehum":
        wf = max(0.0, par["df"] / 1000.0)
        if wf >= a["W"]:
            out_t, out_w = a["t"], a["W"]
        else:
            tef = dew_point(wf, p)
            te = tef if tef is not None else -100.0
            out_t, out_w = te, wf
            cond = a["W"] - wf
    elif kind == "hr_sens":
        e = max(0.0, min(1.0, par["eps"]))
        out_t, out_w = a["t"] + e * (b["t"] - a["t"]), a["W"]
    elif kind == "hr_enth":
        et = max(0.0, min(1.0, par["epst"]))
        ed = max(0.0, min(1.0, par["epsd"]))
        out_t = a["t"] + et * (b["t"] - a["t"])
        out_w = a["W"] + ed * (b["W"] - a["W"])
    else:
        raise ValueError("unknown process type " + kind)
    if kind in ("adiab", "hr_enth"):
        # these two clamp to saturation and book the excess as liquid mist
        return mk_state(out_t, out_w, p), cond
    s = props(out_t, out_w, p)
    return s, cond


def compute():
    p = BAROMETRIC_PRESSURE
    start = mk_state(START_TEMPERATURE, START_HUMIDITY_RATIO, p)
    states = [start]                 # chart order: start, then per process B (if any) and the outlet
    outs = []                        # outlet state of every process, in order
    flows = [START_DRY_AIR_FLOW]     # dry-air mass flow reaching each process outlet
    out = {}
    for j, pr in enumerate(PROCESSES):
        src = start if pr["from_index"] < 0 else outs[pr["from_index"]]
        m_a = START_DRY_AIR_FLOW if pr["from_index"] < 0 else flows[pr["from_index"] + 1]
        b = None
        w1 = w2 = 1.0
        if pr["stream_B"] is not None:
            b = mk_state(pr["stream_B"]["t"], pr["stream_B"]["W"], p)
            states.append(b)
            if pr["type"] == "mix":
                m_b = pr["stream_B_dry_air_flow"] or 0.0
                if m_a + m_b > 0:
                    w1, w2 = m_a, m_b
                else:
                    pct = 50.0
                    w1, w2 = 100.0 - pct, pct
        o, cond = compute_process(pr["type"], src, b, pr["par"], p, w1, w2)
        states.append(o)
        outs.append(o)
        m_out = m_a + (pr["stream_B_dry_air_flow"] or 0.0) if pr["type"] == "mix" else m_a
        flows.append(m_out)
        k = "pr%d_" % (j + 1)
        out[k + "dt"] = o["t"] - src["t"]
        out[k + "dW"] = o["W"] - src["W"]
        out[k + "dh"] = o["h"] - src["h"]
        out[k + "dry_air_flow"] = m_out
        out[k + "power"] = m_out * (o["h"] - src["h"]) * 1000.0
        out[k + "moisture_rate"] = m_out * (o["W"] - src["W"])
        out[k + "condensate"] = cond
    for i, s in enumerate(states):
        k = "st%d_" % i
        for key in ("t", "W", "rh", "h", "wb", "dp", "v", "pw", "liq"):
            out[k + key] = s[key]
    return out`;
