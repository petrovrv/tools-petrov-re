  "summary": {
    "en": "Build a job safety analysis step by step: hazards per step, initial and residual rating on your own matrix, linked controls, weak-control flags and an action register.",
    "uk": "Покроковий аналіз безпеки робіт: небезпеки для кожного кроку, початковий і залишковий ризик за вашою матрицею, пов’язані заходи, слабкі заходи та реєстр дій.",
    "de": "Gefährdungsbeurteilung Schritt für Schritt: Gefährdungen je Arbeitsschritt, Anfangs- und Restrisiko nach eigener Matrix, verknüpfte Maßnahmen, schwache Maßnahmen und Maßnahmenregister.",
    "nl": "Stap voor stap een taakrisicoanalyse opbouwen: gevaren per stap, initieel en restrisico op uw eigen matrix, gekoppelde maatregelen, zwakke maatregelen en een actieregister.",

    "es": "Construya un análisis de seguridad paso a paso: peligros por paso, riesgo inicial y residual en su propia matriz, controles vinculados, controles débiles y registro de acciones.",
    "pl": "Analiza bezpieczeństwa pracy krok po kroku: zagrożenia na etap, ryzyko początkowe i resztkowe według własnej matrycy, powiązane środki, słabe środki i rejestr działań."

  "description": {
    "en": "The work is entered as an ordered list of steps. Each step carries its hazards with consequence and exposure; each hazard gets an initial rating on a risk matrix whose size, scoring rule and band thresholds you define and which is printed with the report. Controls live in one register, carry a hierarchy tag (elimination, substitution, engineering, administrative, PPE), an owner, a verification record and a status, and are linked to hazards rather than copied. A residual rating below the initial one is accepted only when at least one linked control is in place, tagged, verified and specifically worded, or when an explanation is written; otherwise the initial score is carried forward. Rule checks flag vague wording, missing owner or verification, PPE as the only control on a high initial risk, duplicated hazards and controls, and open controls, which form the action register. Exports: project JSON, CSV table, and exchange documents for the permit-to-work and PPE tools.",
    "uk": "Робота вводиться як упорядкований перелік кроків. Кожен крок містить небезпеки з наслідком і експозицією; кожна небезпека отримує початкову оцінку за матрицею ризику, розмір, правило підрахунку й межі класів якої задаєте ви і яка друкується у звіті. Заходи зберігаються в одному реєстрі з рівнем ієрархії (усунення, заміна, інженерні, адміністративні, ЗІЗ), відповідальним, записом перевірки та статусом і пов’язуються з небезпеками без копіювання. Залишкова оцінка, нижча за початкову, приймається лише тоді, коли щонайменше один пов’язаний захід впроваджено, класифіковано, перевірено й конкретно сформульовано, або коли записано пояснення; інакше переноситься початкова оцінка. Перевірки позначають розмите формулювання, відсутність відповідального чи перевірки, ЗІЗ як єдиний захід при високому початковому ризику, дублікати небезпек і заходів, а також невпроваджені заходи, що утворюють реєстр дій. Експорт: JSON проєкту, таблиця CSV і документи обміну для інструментів допуску до робіт і ЗІЗ.",
    "de": "Die Arbeit wird als geordnete Liste von Schritten erfasst. Jeder Schritt trägt seine Gefährdungen mit Folge und Exposition; jede Gefährdung erhält eine Anfangsbewertung auf einer Risikomatrix, deren Größe, Rechenregel und Klassengrenzen Sie festlegen und die mit dem Bericht gedruckt wird. Maßnahmen stehen in einem Register mit Rangstufe (Beseitigung, Substitution, technisch, organisatorisch, PSA), Verantwortlichem, Wirksamkeitsnachweis und Status und werden mit Gefährdungen verknüpft statt kopiert. Ein Restrisiko unter dem Anfangswert wird nur übernommen, wenn mindestens eine verknüpfte Maßnahme umgesetzt, eingestuft, nachgewiesen und konkret formuliert ist oder eine Begründung eingetragen wurde; sonst gilt der Anfangswert weiter. Regelprüfungen markieren vage Formulierungen, fehlende Verantwortliche oder Nachweise, PSA als einzige Maßnahme bei hohem Anfangsrisiko, doppelte Gefährdungen und Maßnahmen sowie offene Maßnahmen, die das Maßnahmenregister bilden. Exporte: Projekt-JSON, CSV-Tabelle und Austauschdokumente für die Werkzeuge Arbeitsfreigabe und PSA.",
    "nl": "Het werk wordt ingevoerd als geordende lijst van stappen. Elke stap bevat zijn gevaren met gevolg en blootstelling; elk gevaar krijgt een initiële beoordeling op een risicomatrix waarvan u grootte, rekenregel en klassegrenzen bepaalt en die met het rapport wordt afgedrukt. Maatregelen staan in één register met een rang in de arbeidshygiënische strategie (eliminatie, substitutie, technisch, organisatorisch, PBM), een eigenaar, een verificatie en een status, en worden aan gevaren gekoppeld in plaats van gekopieerd. Een restrisico lager dan het initiële wordt alleen aanvaard als minstens één gekoppelde maatregel aanwezig, ingedeeld, geverifieerd en specifiek geformuleerd is, of als een toelichting is ingevuld; anders blijft de initiële score staan. Regelcontroles markeren vage formuleringen, ontbrekende eigenaar of verificatie, PBM als enige maatregel bij hoog initieel risico, dubbele gevaren en maatregelen, en open maatregelen, die het actieregister vormen. Exporten: project-JSON, CSV-tabel en uitwisselingsdocumenten voor de werkvergunning- en PBM-tools.",
    "fr": "Le travail est saisi comme une liste ordonnée d’étapes. Chaque étape porte ses dangers avec conséquence et exposition ; chaque danger reçoit une cotation initiale sur une matrice de risque dont vous fixez la taille, la règle de calcul et les seuils de classe, et qui est imprimée avec le rapport. Les mesures figurent dans un registre unique avec un niveau de hiérarchie (suppression, substitution, technique, organisationnelle, EPI), un responsable, une preuve de vérification et un statut ; elles sont liées aux dangers et non copiées. Une cotation résiduelle inférieure à l’initiale n’est retenue que si au moins une mesure liée est en place, classée, vérifiée et formulée précisément, ou si une justification est écrite ; sinon la cote initiale est reportée. Les contrôles signalent les formulations vagues, l’absence de responsable ou de vérification, l’EPI comme seule mesure pour un risque initial élevé, les doublons de dangers et de mesures, et les mesures non en place, qui forment le registre d’actions. Exports : JSON du projet, tableau CSV et documents d’échange pour les outils permis de travail et EPI.",
    "es": "El trabajo se introduce como una lista ordenada de pasos. Cada paso contiene sus peligros con consecuencia y exposición; cada peligro recibe una valoración inicial en una matriz de riesgo cuyo tamaño, regla de cálculo y umbrales de nivel define usted y que se imprime con el informe. Los controles están en un único registro con nivel de jerarquía (eliminación, sustitución, ingeniería, administrativo, EPI), responsable, registro de verificación y estado, y se vinculan a los peligros en lugar de copiarse. Una valoración residual inferior a la inicial solo se acepta si al menos un control vinculado está implantado, clasificado, verificado y redactado de forma concreta, o si se escribe una justificación; en caso contrario se mantiene la puntuación inicial. Las comprobaciones señalan redacción vaga, falta de responsable o de verificación, EPI como único control ante un riesgo inicial alto, peligros y controles duplicados, y controles no implantados, que forman el registro de acciones. Exportaciones: JSON del proyecto, tabla CSV y documentos de intercambio para las herramientas de permiso de trabajo y EPI.",
    "pl": "Praca jest wprowadzana jako uporządkowana lista etapów. Każdy etap zawiera zagrożenia ze skutkiem i narażeniem; każde zagrożenie otrzymuje ocenę początkową na matrycy ryzyka, której rozmiar, regułę liczenia i progi kategorii ustala użytkownik i która jest drukowana w raporcie. Środki kontroli są w jednym rejestrze z poziomem hierarchii (eliminacja, zastąpienie, techniczne, organizacyjne, ŚOI), osobą odpowiedzialną, zapisem weryfikacji i statusem; są powiązane z zagrożeniami, a nie kopiowane. Ocena resztkowa niższa od początkowej jest przyjmowana tylko wtedy, gdy co najmniej jeden powiązany środek jest wdrożony, sklasyfikowany, zweryfikowany i konkretnie sformułowany, albo gdy wpisano uzasadnienie; w przeciwnym razie przenoszona jest ocena początkowa. Reguły oznaczają niejasne sformułowania, brak osoby odpowiedzialnej lub weryfikacji, ŚOI jako jedyny środek przy wysokim ryzyku początkowym, zdublowane zagrożenia i środki oraz środki niewdrożone, które tworzą rejestr działań. Eksport: JSON projektu, tabela CSV i dokumenty wymiany dla narzędzi pozwoleń na pracę i ŚOI."
  },

  "limitations": {
    "en": "The risk score is an ordinal index on the matrix you define; it is not a probability and not comparable between matrices. The tool checks the structure and wording of the analysis; it cannot establish that a control is effective or that the hazard list is complete. The weak-wording checker is a phrase list with a digit exemption: it misses vague text it does not list and flags some specific text. The default matrix and thresholds are an illustrative profile, not a published standard. No legal compliance, no permission to start work and no absence of risk is stated.",
    "uk": "Бал ризику — порядковий індекс на заданій вами матриці; це не ймовірність, і він не порівнюваний між матрицями. Інструмент перевіряє структуру й формулювання аналізу; він не може встановити, що захід ефективний або що перелік небезпек повний. Перевірка розмитих формулювань — це список фраз із винятком для текстів із цифрами: вона пропускає непереліковані розмиті фрази й позначає деякі конкретні тексти. Типова матриця та межі — ілюстративний профіль, а не опублікований стандарт. Інструмент не стверджує юридичної відповідності, дозволу на початок робіт чи відсутності ризику.",
    "de": "Die Risikozahl ist ein ordinaler Index auf der von Ihnen definierten Matrix; sie ist keine Wahrscheinlichkeit und zwischen Matrizen nicht vergleichbar. Das Werkzeug prüft Aufbau und Formulierung der Beurteilung; es kann weder die Wirksamkeit einer Maßnahme noch die Vollständigkeit der Gefährdungsliste feststellen. Die Prüfung auf vage Formulierungen ist eine Phrasenliste mit Ausnahme für Texte mit Ziffern: Sie übersieht nicht gelistete vage Texte und markiert manche konkreten. Standardmatrix und Grenzen sind ein illustratives Profil, keine veröffentlichte Norm. Es wird weder Rechtskonformität noch eine Arbeitsfreigabe noch Risikofreiheit ausgesagt.",
    "nl": "De risicoscore is een ordinale index op de matrix die u definieert; het is geen kans en niet vergelijkbaar tussen matrices. De tool controleert opbouw en formulering van de analyse; hij kan niet vaststellen dat een maatregel doeltreffend is of dat de gevarenlijst volledig is. De controle op vage formuleringen is een zinnenlijst met uitzondering voor teksten met cijfers: ze mist niet-opgesomde vage tekst en markeert soms specifieke tekst. De standaardmatrix en grenzen zijn een illustratief profiel, geen gepubliceerde norm. Er wordt geen wettelijke conformiteit, geen toestemming om te starten en geen afwezigheid van risico verklaard.",
    "fr": "Le score de risque est un indice ordinal sur la matrice que vous définissez ; ce n’est pas une probabilité et il n’est pas comparable d’une matrice à l’autre. L’outil vérifie la structure et la rédaction de l’analyse ; il ne peut établir ni l’efficacité d’une mesure ni l’exhaustivité de la liste des dangers. Le contrôle des formulations vagues est une liste d’expressions avec exemption des textes contenant des chiffres : il manque les textes vagues non listés et signale certains textes précis. La matrice et les seuils par défaut sont un profil illustratif, pas une norme publiée. Aucune conformité légale, aucune autorisation de commencer et aucune absence de risque n’est affirmée.",
    "es": "La puntuación de riesgo es un índice ordinal sobre la matriz que usted define; no es una probabilidad ni es comparable entre matrices. La herramienta comprueba la estructura y la redacción del análisis; no puede establecer que un control sea eficaz ni que la lista de peligros esté completa. El detector de redacción vaga es una lista de frases con exención para textos con cifras: no detecta textos vagos no listados y marca algunos textos concretos. La matriz y los umbrales por defecto son un perfil ilustrativo, no una norma publicada. No se afirma cumplimiento legal, autorización para empezar ni ausencia de riesgo.",
    "pl": "Wskaźnik ryzyka jest indeksem porządkowym na zdefiniowanej przez użytkownika matrycy; nie jest prawdopodobieństwem i nie jest porównywalny między matrycami. Narzędzie sprawdza strukturę i sformułowania analizy; nie może stwierdzić skuteczności środka ani kompletności listy zagrożeń. Wykrywanie niejasnych sformułowań to lista fraz z wyjątkiem dla tekstów zawierających cyfry: pomija niewymienione niejasne teksty i oznacza niektóre konkretne. Domyślna matryca i progi są profilem ilustracyjnym, a nie opublikowaną normą. Narzędzie nie stwierdza zgodności z prawem, zezwolenia na rozpoczęcie pracy ani braku ryzyka."
  },

  "validation": {
    "basis": {
      "en": "Independent reference corpus: 67 cases with 1573 exact checks, written without access to the tool code from spec 15, ISO 45001:2018 clause 8.1.2 (as quoted by a secondary source), NIOSH and HSE; every check is recomputed from this build (see the benchmark report). It covers matrix arithmetic on 2..10 scales with both scoring rules, invalid matrices, residual traceability, PPE-only and weak-control flags, duplicates, the action register, missing data, step-count limits, a 30-step/100-hazard case and 10 randomised analyses. The page also carries rule-by-rule self-tests. Hierarchy rules follow ISO 45001:2018, 8.1.2; the other rules are this tool's editable methodology or declared heuristics. This is the author's own harness against an independent reference, not an independent validation.",
      "uk": "Незалежний еталонний корпус: 67 випадків із 1573 точними перевірками, складений без доступу до коду за специфікацією 15, ISO 45001:2018, пункт 8.1.2 (за вторинною цитатою), NIOSH і HSE; кожна перевірка перераховується з цієї збірки (див. звіт про еталонну перевірку). Охоплює арифметику матриці на шкалах 2..10 за обома правилами, недійсні матриці, простежуваність залишкового ризику, позначки «лише ЗІЗ» і слабких заходів, дублікати, реєстр дій, відсутні дані, межі кількості кроків, випадок із 30 кроками й 100 небезпеками та 10 випадкових аналізів. Сторінка також містить самоперевірки для кожного правила. Правила ієрархії спираються на ISO 45001:2018, 8.1.2; решта — редагована методика інструмента або заявлені евристики. Це власний стенд автора з незалежним еталоном, а не незалежна валідація.",
      "de": "Unabhängiger Referenzkorpus: 67 Fälle mit 1573 exakten Prüfungen, ohne Zugriff auf den Code erstellt nach Spezifikation 15, ISO 45001:2018 Abschnitt 8.1.2 (nach Sekundärzitat), NIOSH und HSE; jede Prüfung wird mit diesem Build neu berechnet (siehe Benchmark-Bericht). Abgedeckt sind Matrixarithmetik auf Skalen 2..10 mit beiden Rechenregeln, ungültige Matrizen, Nachvollziehbarkeit des Restrisikos, Markierungen „nur PSA“ und schwache Maßnahmen, Dubletten, das offene Maßnahmenregister, fehlende Daten, Grenzen der Schrittzahl, ein Fall mit 30 Schritten und 100 Gefährdungen sowie 10 Zufallsbeurteilungen. Die Seite enthält zusätzlich regelweise Selbsttests. Rangfolgeregeln folgen ISO 45001:2018, 8.1.2; die übrigen Regeln sind die editierbare Methodik des Werkzeugs oder ausgewiesene Heuristiken. Dies ist das eigene Prüfgerüst des Autors gegen eine unabhängige Referenz, keine unabhängige Validierung.",
      "nl": "Onafhankelijk referentiecorpus: 67 gevallen met 1573 exacte controles, opgesteld zonder toegang tot de code op basis van specificatie 15, ISO 45001:2018 artikel 8.1.2 (via een secundair citaat), NIOSH en HSE; elke controle wordt met deze build herberekend (zie het benchmarkrapport). Gedekt zijn matrixrekenwerk op schalen 2..10 met beide rekenregels, ongeldige matrices, herleidbaarheid van het restrisico, markeringen voor alleen PBM en zwakke maatregelen, dubbels, het actieregister, ontbrekende gegevens, grenzen van het aantal stappen, een geval met 30 stappen en 100 gevaren en 10 willekeurige analyses. De pagina bevat daarnaast zelftests per regel. Regels over de rangorde volgen ISO 45001:2018, 8.1.2; de overige regels zijn de aanpasbare methodiek van de tool of benoemde heuristieken. Dit is het eigen testkader van de auteur tegen een onafhankelijke referentie, geen onafhankelijke validatie.",
      "fr": "Corpus de référence indépendant : 67 cas et 1573 vérifications exactes, rédigés sans accès au code à partir de la spécification 15, de l’ISO 45001:2018 article 8.1.2 (d’après une citation secondaire), du NIOSH et du HSE ; chaque vérification est recalculée avec cette version (voir le rapport de banc d’essai). Il couvre l’arithmétique de matrice sur des échelles 2..10 avec les deux règles, les matrices invalides, la traçabilité du résiduel, les signalements EPI seul et mesures faibles, les doublons, le registre d’actions, les données manquantes, les limites du nombre d’étapes, un cas de 30 étapes et 100 dangers et 10 analyses aléatoires. La page contient aussi des autotests règle par règle. Les règles de hiérarchie suivent l’ISO 45001:2018, 8.1.2 ; les autres relèvent de la méthodologie modifiable de l’outil ou d’heuristiques déclarées. Il s’agit du banc d’essai de l’auteur face à une référence indépendante, pas d’une validation indépendante.",
      "es": "Corpus de referencia independiente: 67 casos con 1573 comprobaciones exactas, redactado sin acceso al código a partir de la especificación 15, ISO 45001:2018 apartado 8.1.2 (según cita secundaria), NIOSH y HSE; cada comprobación se recalcula con esta versión (véase el informe de referencia). Cubre la aritmética de la matriz en escalas 2..10 con ambas reglas, matrices no válidas, trazabilidad del residual, marcas de solo EPI y controles débiles, duplicados, el registro de acciones, datos ausentes, límites del número de pasos, un caso de 30 pasos y 100 peligros y 10 análisis aleatorios. La página incluye además autopruebas por regla. Las reglas de jerarquía siguen ISO 45001:2018, 8.1.2; las demás son la metodología editable de la herramienta o heurísticas declaradas. Es el banco de pruebas propio del autor frente a una referencia independiente, no una validación independiente.",
      "pl": "Niezależny korpus referencyjny: 67 przypadków z 1573 dokładnymi sprawdzeniami, opracowany bez dostępu do kodu na podstawie specyfikacji 15, ISO 45001:2018 punkt 8.1.2 (według cytatu wtórnego), NIOSH i HSE; każde sprawdzenie jest przeliczane w tej wersji (zob. raport benchmarku). Obejmuje arytmetykę matrycy na skalach 2..10 dla obu reguł, nieprawidłowe matryce, identyfikowalność ryzyka resztkowego, oznaczenia „tylko ŚOI” i słabych środków, duplikaty, rejestr działań, brakujące dane, granice liczby etapów, przypadek z 30 etapami i 100 zagrożeniami oraz 10 losowych analiz. Strona zawiera też autotesty dla każdej reguły. Reguły hierarchii opierają się na ISO 45001:2018, 8.1.2; pozostałe to edytowalna metodyka narzędzia lub zadeklarowane heurystyki. To własne stanowisko testowe autora względem niezależnej referencji, a nie niezależna walidacja."

    a1: T('A control is credited when it is linked, in place, hierarchy-tagged, verified and free of weak-wording flags.', 'Захід зараховується, якщо він пов’язаний, впроваджений, має рівень ієрархії, перевірений і не має позначок розмитого формулювання.', 'Eine Maßnahme wird angerechnet, wenn sie verknüpft, umgesetzt, eingestuft, nachgewiesen und ohne Formulierungsmarkierung ist.', 'Een maatregel wordt erkend als hij gekoppeld, aanwezig, ingedeeld, geverifieerd en zonder formuleringsmarkering is.', 'Une mesure est créditée si elle est liée, en place, classée, vérifiée et sans signalement de rédaction.', 'Un control se acredita si está vinculado, implantado, clasificado, verificado y sin marcas de redacción.', 'Środek jest zaliczany, gdy jest powiązany, wdrożony, sklasyfikowany, zweryfikowany i bez oznaczeń sformułowania.'),
    a2: T('Band limits are inclusive upper scores; the analyst enters likelihood and severity, the tool derives score and band only.', 'Межі класів — включні верхні бали; ймовірність і тяжкість вводить аналітик, інструмент лише обчислює бал і клас.', 'Klassengrenzen sind einschließliche Obergrenzen; Wahrscheinlichkeit und Schwere gibt der Bearbeiter ein, das Werkzeug leitet nur Zahl und Klasse ab.', 'Klassegrenzen zijn inclusieve bovengrenzen; de analist voert waarschijnlijkheid en ernst in, de tool leidt alleen score en klasse af.', 'Les seuils sont des scores supérieurs inclusifs ; l’analyste saisit probabilité et gravité, l’outil en déduit seulement le score et la classe.', 'Los umbrales son puntuaciones superiores inclusivas; el analista introduce probabilidad y severidad y la herramienta solo deriva puntuación y nivel.', 'Progi są włączającymi górnymi wynikami; prawdopodobieństwo i ciężkość wpisuje analityk, narzędzie wyznacza tylko wynik i kategorię.'),
    a3: T('Repeated wording is detected after case folding and removal of punctuation; synonyms are not detected.', 'Повтори виявляються після зведення регістру й вилучення розділових знаків; синоніми не виявляються.', 'Wiederholungen werden nach Vereinheitlichung der Schreibung und Entfernen der Satzzeichen erkannt; Synonyme nicht.', 'Herhalingen worden herkend na gelijkschakeling van hoofdletters en verwijdering van leestekens; synoniemen niet.', 'Les répétitions sont détectées après normalisation de la casse et suppression de la ponctuation ; les synonymes ne le sont pas.', 'Las repeticiones se detectan tras normalizar mayúsculas y quitar la puntuación; los sinónimos no.', 'Powtórzenia wykrywane są po ujednoliceniu wielkości liter i usunięciu interpunkcji; synonimy nie są wykrywane.'),
    a4: T('The PPE-only rule applies from an initial band of High upwards and only when at least one control is linked.', 'Правило «лише ЗІЗ» діє від початкового класу «Високий» і лише за наявності хоча б одного пов’язаного заходу.', 'Die Regel „nur PSA“ gilt ab der Anfangsklasse Hoch und nur, wenn mindestens eine Maßnahme verknüpft ist.', 'De regel “alleen PBM” geldt vanaf initiële klasse Hoog en alleen als minstens één maatregel gekoppeld is.', 'La règle « EPI seul » s’applique à partir de la classe initiale Élevé et seulement si une mesure au moins est liée.', 'La regla «solo EPI» se aplica desde el nivel inicial Alto y solo si hay al menos un control vinculado.', 'Reguła „tylko ŚOI” obowiązuje od początkowej kategorii Wysokie i tylko przy co najmniej jednym powiązanym środku.'),
    a5: T('Weak-wording phrases are matched at word starts in all seven interface languages; any digit in the text exempts it.', 'Розмиті фрази шукаються з початку слова в усіх семи мовах інтерфейсу; будь-яка цифра в тексті знімає позначку.', 'Vage Phrasen werden am Wortanfang in allen sieben Oberflächensprachen gesucht; jede Ziffer im Text nimmt ihn aus.', 'Vage zinsdelen worden aan woordbegin gezocht in alle zeven interfacetalen; elk cijfer in de tekst stelt hem vrij.', 'Les expressions vagues sont recherchées en début de mot dans les sept langues de l’interface ; tout chiffre dans le texte l’exempte.', 'Las frases vagas se buscan al inicio de palabra en los siete idiomas de la interfaz; cualquier cifra en el texto lo exime.', 'Niejasne frazy są wyszukiwane od początku słowa we wszystkich siedmiu językach interfejsu; dowolna cyfra w tekście go wyłącza.'),
    figCap: T('Hazards per matrix cell: initial rating on the left, residual rating used on the right. The small digit in each cell is the band number.', 'Небезпеки в клітинках матриці: ліворуч початкова оцінка, праворуч прийнята залишкова. Мала цифра в клітинці — номер класу.', 'Gefährdungen je Matrixfeld: links Anfangsbewertung, rechts verwendete Restbewertung. Die kleine Ziffer im Feld ist die Klassennummer.', 'Gevaren per matrixcel: links de initiële beoordeling, rechts de gebruikte restbeoordeling. Het kleine cijfer in elke cel is het klassenummer.', 'Dangers par case : à gauche la cotation initiale, à droite la cotation résiduelle retenue. Le petit chiffre de chaque case est le numéro de classe.', 'Peligros por celda: a la izquierda la valoración inicial, a la derecha la residual utilizada. El dígito pequeño es el número de nivel.', 'Zagrożenia w komórkach: po lewej ocena początkowa, po prawej przyjęta ocena resztkowa. Mała cyfra w komórce to numer kategorii.'),
    rFindN: T('occurrences: %n', 'випадків: %n', 'Vorkommen: %n', 'aantal: %n', 'occurrences : %n', 'casos: %n', 'wystąpień: %n'),
    rTask: T('Job', 'Робота', 'Tätigkeit', 'Taak', 'Travail', 'Trabajo', 'Praca'),
    rHoc: T('Hierarchy assessment per hazard', 'Оцінка ієрархії для кожної небезпеки', 'Rangstufenbewertung je Gefährdung', 'Beoordeling van de strategie per gevaar', 'Évaluation de la hiérarchie par danger', 'Evaluación de la jerarquía por peligro', 'Ocena hierarchii dla każdego zagrożenia'),
    rHocNote: T('Listed: hazards with at least one assessed level. * = not assessed, taken from the linked controls; (n) = reason n below.', 'Наведено небезпеки з хоча б одним оціненим рівнем. * — не оцінено, взято з пов’язаних заходів; (n) — причина n нижче.', 'Aufgeführt sind Gefährdungen mit mindestens einer bewerteten Stufe. * = nicht bewertet, aus den verknüpften Maßnahmen; (n) = Begründung n unten.', 'Vermeld: gevaren met minstens één beoordeeld niveau. * = niet beoordeeld, afgeleid uit de gekoppelde maatregelen; (n) = reden n hieronder.', 'Sont listés les dangers ayant au moins un niveau évalué. * = non évalué, tiré des mesures liées ; (n) = justification n ci-dessous.', 'Se listan los peligros con al menos un nivel evaluado. * = sin evaluar, tomado de los controles vinculados; (n) = motivo n abajo.', 'Wymieniono zagrożenia z co najmniej jednym ocenionym poziomem. * = nie oceniono, przyjęto z powiązanych środków; (n) = uzasadnienie n poniżej.'),
    rHocNone: T('No hazard carries a hierarchy assessment; every level is taken from the linked controls.', 'Жодна небезпека не має оцінки ієрархії; кожен рівень визначено за пов’язаними заходами.', 'Keine Gefährdung trägt eine Rangstufenbewertung; jede Stufe ergibt sich aus den verknüpften Maßnahmen.', 'Geen gevaar heeft een beoordeling van de strategie; elk niveau volgt uit de gekoppelde maatregelen.', 'Aucun danger ne porte d’évaluation de la hiérarchie ; chaque niveau découle des mesures liées.', 'Ningún peligro tiene evaluación de la jerarquía; cada nivel se toma de los controles vinculados.', 'Żadne zagrożenie nie ma oceny hierarchii; każdy poziom wynika z powiązanych środków.'),
    rHocWhy: T('(%n) %t', '(%n) %t', '(%n) %t', '(%n) %t', '(%n) %t', '(%n) %t', '(%n) %t'),
    a6: T('The PPE exchange carries one value per hierarchy level: applied, open or na. The value na is written only where the analyst chose not practicable and gave a reason, which travels with the item; it is never inferred from absent controls.', 'Обмін із ЗІЗ передає одне значення на рівень ієрархії: applied, open або na. Значення na записується лише там, де аналітик вибрав «неможливо» й навів причину, яка передається разом із позицією; воно ніколи не виводиться з відсутності заходів.', 'Der PSA-Austausch trägt je Rangstufe einen Wert: applied, open oder na. Der Wert na wird nur geschrieben, wo „nicht praktikabel“ gewählt und begründet wurde; die Begründung reist mit dem Eintrag. Aus fehlenden Maßnahmen wird er nie abgeleitet.', 'De PBM-uitwisseling bevat per niveau één waarde: applied, open of na. De waarde na wordt alleen geschreven waar de analist “niet uitvoerbaar” koos en een reden gaf, die met het item meegaat; ze wordt nooit afgeleid uit ontbrekende maatregelen.', 'L’échange EPI porte une valeur par niveau de hiérarchie : applied, open ou na. La valeur na n’est écrite que si l’analyste a choisi « non réalisable » et donné une justification, transmise avec l’élément ; elle n’est jamais déduite d’une absence de mesures.', 'El intercambio de EPI lleva un valor por nivel de jerarquía: applied, open o na. El valor na solo se escribe cuando el analista eligió «no factible» y dio un motivo, que viaja con el elemento; nunca se deduce de la ausencia de controles.', 'Wymiana ŚOI zawiera jedną wartość na poziom hierarchii: applied, open lub na. Wartość na jest zapisywana tylko tam, gdzie analityk wybrał „niewykonalne” i podał uzasadnienie przekazywane z pozycją; nigdy nie wynika z braku środków.'),
    exF: T('Pump seal replacement, hierarchy assessed', 'Заміна ущільнення насоса, ієрархію оцінено', 'Gleitringdichtung, Rangfolge bewertet', 'Asafdichting vervangen, strategie beoordeeld', 'Garniture de pompe, hiérarchie évaluée', 'Sello de bomba, jerarquía evaluada', 'Uszczelnienie pompy, hierarchia oceniona'),
    exFNote: T('All four levels assessed for each of the 10 hazards', 'Усі чотири рівні оцінено для кожної з 10 небезпек', 'Alle vier Stufen für jede der 10 Gefährdungen bewertet', 'Alle vier niveaus beoordeeld voor elk van de 10 gevaren', 'Les quatre niveaux évalués pour chacun des 10 dangers', 'Los cuatro niveles evaluados para cada uno de los 10 peligros', 'Wszystkie cztery poziomy ocenione dla każdego z 10 zagrożeń'),
    /* learn */
    lIntroT: T('What this tool does', 'Що робить цей інструмент', 'Was dieses Werkzeug tut', 'Wat deze tool doet', 'Ce que fait cet outil', 'Qué hace esta herramienta', 'Co robi to narzędzie'),
    lIntroB: T('You break a job into steps, list the hazards of each step, rate them on your matrix and link controls from one register. The tool re-scores everything on every change and lists what cannot be traced or is worded too loosely to act on.', 'Ви розбиваєте роботу на кроки, перелічуєте небезпеки кожного кроку, оцінюєте їх за своєю матрицею й пов’язуєте заходи з єдиного реєстру. Інструмент перераховує все при кожній зміні й показує, що не простежується або сформульовано надто розмито.', 'Sie zerlegen die Arbeit in Schritte, erfassen die Gefährdungen je Schritt, bewerten sie auf Ihrer Matrix und verknüpfen Maßnahmen aus einem Register. Das Werkzeug bewertet bei jeder Änderung neu und listet, was nicht nachvollziehbar oder zu unbestimmt formuliert ist.', 'U deelt het werk op in stappen, noteert de gevaren per stap, beoordeelt ze op uw matrix en koppelt maatregelen uit één register. De tool herberekent alles bij elke wijziging en toont wat niet herleidbaar of te vaag geformuleerd is.', 'Vous découpez le travail en étapes, listez les dangers de chacune, les cotez sur votre matrice et liez des mesures d’un registre unique. L’outil recote tout à chaque modification et liste ce qui n’est pas traçable ou trop vague pour agir.', 'Divide el trabajo en pasos, anota los peligros de cada paso, los valora en su matriz y vincula controles de un único registro. La herramienta recalcula todo en cada cambio y lista lo que no es trazable o está redactado de forma demasiado vaga.', 'Dzielisz pracę na etapy, wpisujesz zagrożenia każdego etapu, oceniasz je na swojej matrycy i wiążesz środki z jednego rejestru. Narzędzie przelicza wszystko przy każdej zmianie i wskazuje, czego nie da się prześledzić lub co sformułowano zbyt ogólnie.'),
    lMatT: T('Your risk matrix', 'Ваша матриця ризику', 'Ihre Risikomatrix', 'Uw risicomatrix', 'Votre matrice de risque', 'Su matriz de riesgo', 'Twoja matryca ryzyka'),
    lMatB: T('There is no single true matrix. Set the number of likelihood and severity levels, whether the score is their product or their sum, and the highest score of each band. The profile name, version and source travel with the analysis and are printed in the report.', 'Єдиної правильної матриці не існує. Задайте кількість рівнів імовірності й тяжкості, чи є бал їх добутком або сумою, і найвищий бал кожного класу. Назва, версія й джерело профілю зберігаються з аналізом і друкуються у звіті.', 'Die eine richtige Matrix gibt es nicht. Legen Sie die Anzahl der Stufen, Produkt oder Summe als Rechenregel und die höchste Zahl je Klasse fest. Name, Version und Quelle des Profils reisen mit der Beurteilung und stehen im Bericht.', 'Er bestaat geen enige juiste matrix. Stel het aantal niveaus in, of de score het product of de som is, en de hoogste score per klasse. Naam, versie en bron van het profiel gaan mee met de analyse en staan in het rapport.', 'Il n’existe pas de matrice unique. Fixez le nombre de niveaux, la règle produit ou somme et le score maximal de chaque classe. Le nom, la version et la source du profil accompagnent l’analyse et figurent au rapport.', 'No existe una única matriz correcta. Defina el número de niveles, si la puntuación es producto o suma y la puntuación máxima de cada nivel. Nombre, versión y fuente del perfil acompañan al análisis y se imprimen en el informe.', 'Nie ma jednej właściwej matrycy. Ustal liczbę poziomów, czy wynik to iloczyn czy suma, oraz najwyższy wynik każdej kategorii. Nazwa, wersja i źródło profilu są zapisywane z analizą i drukowane w raporcie.'),
    lHierT: T('Hierarchy of controls', 'Ієрархія заходів', 'Rangfolge der Maßnahmen', 'Arbeidshygiënische strategie', 'Hiérarchie des mesures', 'Jerarquía de controles', 'Hierarchia środków kontroli'),
    lHierB: T('ISO 45001:2018, 8.1.2 orders controls from eliminating the hazard, through substitution, engineering and administrative measures, to personal protective equipment. A high initial risk handled by PPE alone is flagged.', 'ISO 45001:2018, 8.1.2 упорядковує заходи від усунення небезпеки через заміну, інженерні й адміністративні заходи до засобів індивідуального захисту. Високий початковий ризик, що покривається лише ЗІЗ, позначається.', 'ISO 45001:2018, 8.1.2 ordnet Maßnahmen von der Beseitigung über Substitution, technische und organisatorische Maßnahmen bis zur persönlichen Schutzausrüstung. Ein hohes Anfangsrisiko, das nur mit PSA behandelt wird, wird markiert.', 'ISO 45001:2018, 8.1.2 ordent maatregelen van eliminatie via substitutie, technische en organisatorische maatregelen tot persoonlijke beschermingsmiddelen. Een hoog initieel risico dat alleen met PBM wordt behandeld, wordt gemarkeerd.', 'L’ISO 45001:2018, 8.1.2 ordonne les mesures de la suppression du danger à la substitution, aux mesures techniques et organisationnelles, puis aux équipements de protection individuelle. Un risque initial élevé traité par EPI seul est signalé.', 'ISO 45001:2018, 8.1.2 ordena los controles desde la eliminación, pasando por la sustitución y las medidas de ingeniería y administrativas, hasta el equipo de protección individual. Un riesgo inicial alto tratado solo con EPI se marca.', 'ISO 45001:2018, 8.1.2 porządkuje środki od eliminacji zagrożenia przez zastąpienie, środki techniczne i organizacyjne do środków ochrony indywidualnej. Wysokie ryzyko początkowe obsługiwane wyłącznie ŚOI jest oznaczane.'),
    lTraceT: T('Traceable residual risk', 'Простежуваний залишковий ризик', 'Nachvollziehbares Restrisiko', 'Herleidbaar restrisico', 'Résiduel traçable', 'Residual trazable', 'Identyfikowalne ryzyko resztkowe'),
    lTraceB: T('Each residual score is traced to the initial score and the linked control set. A lower residual needs a credited control or a written explanation; otherwise the initial score is carried forward and the finding stays open.', 'Кожен залишковий бал простежується до початкового балу й набору пов’язаних заходів. Нижчий залишковий бал потребує зарахованого заходу або письмового пояснення; інакше переноситься початковий бал, а зауваження лишається відкритим.', 'Jede Restzahl wird auf Anfangszahl und verknüpfte Maßnahmen zurückgeführt. Ein niedrigeres Restrisiko braucht eine angerechnete Maßnahme oder eine schriftliche Begründung; sonst gilt die Anfangszahl weiter und der Befund bleibt offen.', 'Elke restscore wordt herleid tot de initiële score en de gekoppelde maatregelen. Een lager restrisico vraagt een erkende maatregel of een schriftelijke toelichting; anders blijft de initiële score staan en blijft de bevinding open.', 'Chaque score résiduel est rattaché au score initial et aux mesures liées. Un résiduel plus bas exige une mesure créditée ou une justification écrite ; sinon le score initial est reporté et le constat reste ouvert.', 'Cada residual se vincula a la puntuación inicial y a los controles vinculados. Un residual menor exige un control acreditado o una justificación escrita; si no, se mantiene la inicial y el hallazgo sigue abierto.', 'Każdy wynik resztkowy jest powiązany z wynikiem początkowym i zestawem środków. Niższy wynik wymaga zaliczonego środka lub pisemnego uzasadnienia; inaczej przenoszony jest wynik początkowy, a ustalenie pozostaje otwarte.'),
    footer: T('Score = L × S or L + S on the profile you set; band from inclusive upper limits. Residual used = claimed when it is not lower, or when a credited control or explanation supports it; otherwise the initial score.', 'Бал = L × S або L + S за вашим профілем; клас — за включними верхніми межами. Прийнятий залишковий = заявлений, якщо він не нижчий або підтверджений зарахованим заходом чи поясненням; інакше — початковий.', 'Zahl = L × S oder L + S nach Ihrem Profil; Klasse aus einschließlichen Obergrenzen. Verwendetes Rest = angesetzt, wenn nicht niedriger oder durch angerechnete Maßnahme bzw. Begründung gestützt; sonst Anfangszahl.', 'Score = L × S of L + S volgens uw profiel; klasse uit inclusieve bovengrenzen. Gebruikte rest = opgegeven als die niet lager is, of gesteund door een erkende maatregel of toelichting; anders de initiële score.', 'Score = L × S ou L + S selon votre profil ; classe par seuils supérieurs inclusifs. Résiduel retenu = déclaré s’il n’est pas plus bas ou s’il est étayé par une mesure créditée ou une justification ; sinon le score initial.', 'Puntuación = L × S o L + S según su perfil; nivel por umbrales superiores inclusivos. Residual utilizado = declarado si no es menor o si lo respalda un control acreditado o una justificación; si no, el inicial.', 'Wynik = L × S lub L + S według profilu; kategoria z włączających górnych progów. Przyjęte resztkowe = deklarowane, jeśli nie jest niższe lub wspiera je zaliczony środek albo uzasadnienie; inaczej początkowe.'),

    exBNote: T('5 steps, 6 hazards, edge protection still planned', '5 кроків, 6 небезпек, захист краю ще заплановано', '5 Schritte, 6 Gefährdungen, Seitenschutz noch geplant', '5 stappen, 6 gevaren, randbeveiliging nog gepland', '5 étapes, 6 dangers, protection de rive encore prévue', '5 pasos, 6 peligros, protección de borde aún planificada', '5 etapów, 6 zagrożeń, zabezpieczenie krawędzi jeszcze planowane'),

  var KIND_TOOL = { kind: 'company', source: 'srcTool', jurisdiction: 'none (editable profile)', version: 'r1' };
  var KIND_HEUR = { kind: 'heuristic', source: 'srcHeur', jurisdiction: 'none', version: 'r1' };
  var KIND_ISO = { kind: 'guidance', source: 'ISO 45001:2018, 8.1.2', jurisdiction: 'international', version: '2018' };
  var RULES = [
    { id: 'JSA-R-001', sev: 'insufficient', basis: KIND_TOOL,
      name: T('Initial rating missing', 'Немає початкової оцінки', 'Anfangsbewertung fehlt', 'Initiële beoordeling ontbreekt', 'Cotation initiale absente', 'Falta la valoración inicial', 'Brak oceny początkowej'),
      text: T('Every hazard needs an initial likelihood and severity; without both it counts as insufficient data.', 'Кожна небезпека потребує початкових імовірності й тяжкості; без обох вона вважається недостатніми даними.', 'Jede Gefährdung braucht Anfangswahrscheinlichkeit und -schwere; ohne beide zählt sie als unzureichende Daten.', 'Elk gevaar heeft een initiële waarschijnlijkheid en ernst nodig; zonder beide telt het als onvoldoende gegevens.', 'Chaque danger exige une probabilité et une gravité initiales ; sans les deux il compte comme données insuffisantes.', 'Cada peligro necesita probabilidad y severidad iniciales; sin ambas cuenta como datos insuficientes.', 'Każde zagrożenie wymaga początkowego prawdopodobieństwa i ciężkości; bez obu liczy się jako niewystarczające dane.') },
    { id: 'JSA-R-002', sev: 'insufficient', basis: KIND_TOOL,
      name: T('Rating outside the matrix', 'Оцінка поза матрицею', 'Bewertung außerhalb der Matrix', 'Beoordeling buiten de matrix', 'Cotation hors matrice', 'Valoración fuera de la matriz', 'Ocena poza matrycą'),
      text: T('A level must be a whole number from 1 to the size of the current scale; a rating left from a larger matrix is not rescaled.', 'Рівень має бути цілим числом від 1 до розміру поточної шкали; оцінка з більшої матриці не масштабується.', 'Eine Stufe muss eine ganze Zahl von 1 bis zur Größe der aktuellen Skala sein; Werte einer größeren Matrix werden nicht umgerechnet.', 'Een niveau moet een geheel getal zijn van 1 tot de grootte van de huidige schaal; een waarde uit een grotere matrix wordt niet herschaald.', 'Un niveau doit être un entier de 1 à la taille de l’échelle courante ; une cotation issue d’une matrice plus grande n’est pas convertie.', 'Un nivel debe ser un entero de 1 al tamaño de la escala actual; una valoración de una matriz mayor no se reescala.', 'Poziom musi być liczbą całkowitą od 1 do rozmiaru bieżącej skali; ocena z większej matrycy nie jest przeskalowywana.') },
    { id: 'JSA-R-003', sev: 'insufficient', basis: KIND_TOOL,
      name: T('Matrix definition invalid', 'Недійсне визначення матриці', 'Matrixdefinition ungültig', 'Matrixdefinitie ongeldig', 'Définition de matrice invalide', 'Definición de matriz no válida', 'Nieprawidłowa definicja matrycy'),
      text: T('Scales of 2 to 10 whole levels, a known scoring rule and whole band limits Low < Medium < High inside the score range are required; otherwise no rating is evaluated.', 'Потрібні шкали з 2–10 цілих рівнів, відоме правило підрахунку й цілі межі «Низький» < «Середній» < «Високий» у діапазоні балів; інакше жодна оцінка не обчислюється.', 'Erforderlich sind Skalen mit 2 bis 10 ganzen Stufen, eine bekannte Rechenregel und ganze Grenzen Niedrig < Mittel < Hoch im Zahlenbereich; sonst wird keine Bewertung ausgewertet.', 'Vereist zijn schalen van 2 tot 10 gehele niveaus, een bekende rekenregel en gehele grenzen Laag < Middel < Hoog binnen het scorebereik; anders wordt geen beoordeling uitgewerkt.', 'Il faut des échelles de 2 à 10 niveaux entiers, une règle de calcul connue et des seuils entiers Faible < Moyen < Élevé dans la plage de score ; sinon aucune cotation n’est évaluée.', 'Se requieren escalas de 2 a 10 niveles enteros, una regla de cálculo conocida y umbrales enteros Bajo < Medio < Alto dentro del rango; si no, no se evalúa ninguna valoración.', 'Wymagane są skale od 2 do 10 poziomów całkowitych, znana reguła liczenia i całkowite progi Niskie < Średnie < Wysokie w zakresie wyników; inaczej żadna ocena nie jest liczona.') },
    { id: 'JSA-R-004', sev: 'fail', basis: KIND_TOOL,
      name: T('Residual lowered without credited control', 'Залишковий знижено без зарахованого заходу', 'Restrisiko ohne angerechnete Maßnahme gesenkt', 'Restrisico verlaagd zonder erkende maatregel', 'Résiduel abaissé sans mesure créditée', 'Residual reducido sin control acreditado', 'Obniżone resztkowe bez zaliczonego środka'),
      text: T('A residual score below the initial score needs a credited linked control or a written explanation; otherwise the initial score is carried forward.', 'Залишковий бал нижче початкового потребує зарахованого пов’язаного заходу або письмового пояснення; інакше переноситься початковий бал.', 'Eine Restzahl unter der Anfangszahl braucht eine angerechnete verknüpfte Maßnahme oder eine schriftliche Begründung; sonst gilt die Anfangszahl.', 'Een restscore onder de initiële score vraagt een erkende gekoppelde maatregel of een schriftelijke toelichting; anders geldt de initiële score.', 'Un score résiduel inférieur à l’initial exige une mesure liée créditée ou une justification écrite ; sinon le score initial est reporté.', 'Una puntuación residual menor que la inicial exige un control vinculado acreditado o una justificación escrita; si no, se mantiene la inicial.', 'Wynik resztkowy niższy od początkowego wymaga zaliczonego powiązanego środka lub pisemnego uzasadnienia; inaczej przenoszony jest wynik początkowy.') },
    { id: 'JSA-R-005', sev: 'attention', basis: KIND_TOOL,
      name: T('Residual lowered on explanation only', 'Залишковий знижено лише за поясненням', 'Restrisiko nur mit Begründung gesenkt', 'Restrisico alleen op toelichting verlaagd', 'Résiduel abaissé sur seule justification', 'Residual reducido solo con justificación', 'Obniżone resztkowe tylko na podstawie uzasadnienia'),
      text: T('The lower residual score rests on the written explanation; the explanation is printed for review.', 'Нижчий залишковий бал спирається на письмове пояснення; пояснення друкується для перегляду.', 'Die niedrigere Restzahl stützt sich auf die schriftliche Begründung; diese wird zur Prüfung gedruckt.', 'De lagere restscore steunt op de schriftelijke toelichting; die wordt ter beoordeling afgedrukt.', 'Le score résiduel plus bas repose sur la justification écrite, imprimée pour revue.', 'La puntuación residual menor se apoya en la justificación escrita, que se imprime para revisión.', 'Niższy wynik resztkowy opiera się na pisemnym uzasadnieniu, drukowanym do przeglądu.') },
    { id: 'JSA-R-006', sev: 'attention', basis: KIND_TOOL,
      name: T('Residual higher than initial', 'Залишковий вищий за початковий', 'Restrisiko höher als Anfangsrisiko', 'Restrisico hoger dan initieel', 'Résiduel supérieur à l’initial', 'Residual mayor que el inicial', 'Resztkowe wyższe niż początkowe'),
      text: T('A residual score above the initial one points to a rating error or to a control that introduces a hazard; the higher value is kept.', 'Залишковий бал вищий за початковий вказує на помилку оцінки або на захід, що створює небезпеку; зберігається вище значення.', 'Eine Restzahl über der Anfangszahl deutet auf einen Bewertungsfehler oder eine gefährdende Maßnahme; der höhere Wert bleibt.', 'Een restscore boven de initiële wijst op een beoordelingsfout of een maatregel die een gevaar invoert; de hogere waarde blijft.', 'Un score résiduel supérieur à l’initial signale une erreur de cotation ou une mesure qui crée un danger ; la valeur la plus haute est conservée.', 'Una puntuación residual mayor que la inicial indica un error de valoración o un control que introduce un peligro; se conserva el valor mayor.', 'Wynik resztkowy wyższy od początkowego wskazuje na błąd oceny lub środek wprowadzający zagrożenie; zachowywana jest wyższa wartość.') },
    { id: 'JSA-R-007', sev: 'insufficient', basis: KIND_TOOL,
      name: T('Residual rating missing', 'Немає залишкової оцінки', 'Restbewertung fehlt', 'Restbeoordeling ontbreekt', 'Cotation résiduelle absente', 'Falta la valoración residual', 'Brak oceny resztkowej'),
      text: T('A rated hazard needs a residual likelihood and severity; until both are given the initial score is used.', 'Оцінена небезпека потребує залишкових імовірності й тяжкості; доки їх немає, використовується початковий бал.', 'Eine bewertete Gefährdung braucht Restwahrscheinlichkeit und -schwere; bis dahin gilt die Anfangszahl.', 'Een beoordeeld gevaar heeft een rest-waarschijnlijkheid en -ernst nodig; tot dan geldt de initiële score.', 'Un danger coté exige une probabilité et une gravité résiduelles ; d’ici là le score initial est utilisé.', 'Un peligro valorado necesita probabilidad y severidad residuales; mientras falten se usa la inicial.', 'Oceniane zagrożenie wymaga resztkowego prawdopodobieństwa i ciężkości; do tego czasu stosowany jest wynik początkowy.') },
    { id: 'JSA-R-010', sev: 'fail', basis: KIND_ISO,
      name: T('No control linked', 'Жодного пов’язаного заходу', 'Keine Maßnahme verknüpft', 'Geen maatregel gekoppeld', 'Aucune mesure liée', 'Ningún control vinculado', 'Brak powiązanego środka'),
      text: T('A hazard with an initial band of Medium or above has no linked control.', 'Небезпека з початковим класом «Середній» або вище не має пов’язаного заходу.', 'Eine Gefährdung ab Anfangsklasse Mittel hat keine verknüpfte Maßnahme.', 'Een gevaar met initiële klasse Middel of hoger heeft geen gekoppelde maatregel.', 'Un danger de classe initiale Moyen ou plus n’a aucune mesure liée.', 'Un peligro con nivel inicial Medio o superior no tiene control vinculado.', 'Zagrożenie o początkowej kategorii Średnie lub wyższej nie ma powiązanego środka.') },
    { id: 'JSA-R-011', sev: 'attention', basis: KIND_HEUR,
      name: T('Vague control wording', 'Розмите формулювання заходу', 'Vage Formulierung der Maßnahme', 'Vage omschrijving van maatregel', 'Libellé de mesure vague', 'Redacción vaga del control', 'Niejasna treść środka'),
      text: T('Heuristic: the wording contains a listed vague phrase such as “be careful” and no figure, so it does not say what is done.', 'Евристика: формулювання містить розмиту фразу зі списку, наприклад «будьте обережні», і жодної цифри, тож не каже, що саме робиться.', 'Heuristik: Der Wortlaut enthält eine gelistete vage Phrase wie „vorsichtig sein“ und keine Zahl und sagt daher nicht, was getan wird.', 'Heuristiek: de omschrijving bevat een opgesomd vaag zinsdeel zoals “voorzichtig zijn” en geen getal, en zegt dus niet wat er gebeurt.', 'Heuristique : le libellé contient une expression vague listée comme « faire attention » et aucun chiffre ; il ne dit pas ce qui est fait.', 'Heurística: la redacción contiene una frase vaga de la lista, como «tener cuidado», y ninguna cifra, así que no dice qué se hace.', 'Heurystyka: treść zawiera frazę z listy, np. „uważać”, i żadnej liczby, więc nie mówi, co jest robione.') },
    { id: 'JSA-R-012', sev: 'attention', basis: KIND_HEUR,
      name: T('Control without owner', 'Захід без відповідального', 'Maßnahme ohne Verantwortlichen', 'Maatregel zonder eigenaar', 'Mesure sans responsable', 'Control sin responsable', 'Środek bez odpowiedzialnego'),
      text: T('Heuristic: no role is named as responsible for the control.', 'Евристика: не названо роль, відповідальну за захід.', 'Heuristik: Keine Funktion ist als verantwortlich benannt.', 'Heuristiek: er is geen functie als verantwoordelijke genoemd.', 'Heuristique : aucune fonction n’est désignée comme responsable.', 'Heurística: no se nombra ninguna función responsable.', 'Heurystyka: nie wskazano funkcji odpowiedzialnej za środek.') },
    { id: 'JSA-R-013', sev: 'attention', basis: KIND_HEUR,
      name: T('Control without verification', 'Захід без перевірки', 'Maßnahme ohne Nachweis', 'Maatregel zonder verificatie', 'Mesure sans vérification', 'Control sin verificación', 'Środek bez weryfikacji'),
      text: T('Heuristic: no verification or evidence is recorded, so the control cannot be credited.', 'Евристика: не записано перевірки чи підтвердження, тож захід не може бути зарахований.', 'Heuristik: Kein Nachweis erfasst, daher kann die Maßnahme nicht angerechnet werden.', 'Heuristiek: geen verificatie of bewijs vastgelegd, dus de maatregel kan niet worden erkend.', 'Heuristique : aucune vérification ni preuve n’est enregistrée ; la mesure ne peut pas être créditée.', 'Heurística: no hay verificación ni evidencia registrada, así que el control no puede acreditarse.', 'Heurystyka: brak zapisanej weryfikacji lub dowodu, więc środka nie można zaliczyć.') },
    { id: 'JSA-R-014', sev: 'fail', basis: KIND_ISO,
      name: T('PPE is the only control', 'ЗІЗ — єдиний захід', 'PSA ist die einzige Maßnahme', 'PBM is de enige maatregel', 'L’EPI est la seule mesure', 'El EPI es el único control', 'ŚOI jest jedynym środkiem'),
      text: T('A hazard with an initial band of High or Very high relies on PPE alone, which the hierarchy of controls places last.', 'Небезпека з початковим класом «Високий» або «Дуже високий» покладається лише на ЗІЗ, які в ієрархії заходів стоять останніми.', 'Eine Gefährdung der Anfangsklasse Hoch oder Sehr hoch stützt sich nur auf PSA, die in der Rangfolge zuletzt kommt.', 'Een gevaar met initiële klasse Hoog of Zeer hoog steunt alleen op PBM, die in de rangorde als laatste komen.', 'Un danger de classe initiale Élevé ou Très élevé repose sur le seul EPI, placé en dernier dans la hiérarchie.', 'Un peligro con nivel inicial Alto o Muy alto depende solo del EPI, que la jerarquía sitúa en último lugar.', 'Zagrożenie o początkowej kategorii Wysokie lub Bardzo wysokie opiera się wyłącznie na ŚOI, które hierarchia stawia na końcu.') },
    { id: 'JSA-R-015', sev: 'insufficient', basis: KIND_TOOL,
      name: T('Control without hierarchy tag', 'Захід без рівня ієрархії', 'Maßnahme ohne Rangstufe', 'Maatregel zonder rang', 'Mesure non classée', 'Control sin nivel de jerarquía', 'Środek bez poziomu hierarchii'),
      text: T('Each control needs a hierarchy tag; an untagged control is not credited.', 'Кожен захід потребує рівня ієрархії; захід без нього не зараховується.', 'Jede Maßnahme braucht eine Rangstufe; ohne sie wird sie nicht angerechnet.', 'Elke maatregel heeft een rang nodig; zonder rang wordt hij niet erkend.', 'Chaque mesure doit être classée ; une mesure non classée n’est pas créditée.', 'Cada control necesita un nivel de jerarquía; sin él no se acredita.', 'Każdy środek wymaga poziomu hierarchii; bez niego nie jest zaliczany.') },
    { id: 'JSA-R-016', sev: 'attention', basis: KIND_HEUR,
      name: T('Control wording too short', 'Надто коротке формулювання', 'Wortlaut zu kurz', 'Omschrijving te kort', 'Libellé trop court', 'Redacción demasiado corta', 'Zbyt krótka treść'),
      text: T('Heuristic: fewer than three words rarely state what is done, by what means and to what extent.', 'Евристика: менш ніж три слова рідко описують, що робиться, чим і в якому обсязі.', 'Heuristik: Weniger als drei Wörter sagen selten, was womit und in welchem Umfang getan wird.', 'Heuristiek: minder dan drie woorden zeggen zelden wat, waarmee en in welke mate er gebeurt.', 'Heuristique : moins de trois mots disent rarement quoi, avec quoi et dans quelle mesure.', 'Heurística: menos de tres palabras rara vez dicen qué se hace, con qué y en qué medida.', 'Heurystyka: mniej niż trzy słowa rzadko mówią, co, czym i w jakim zakresie jest robione.') },
    { id: 'JSA-R-017', sev: 'insufficient', basis: KIND_TOOL,
      name: T('Link to a missing control', 'Посилання на відсутній захід', 'Verknüpfung auf fehlende Maßnahme', 'Koppeling naar ontbrekende maatregel', 'Lien vers une mesure absente', 'Vínculo a un control inexistente', 'Powiązanie z nieistniejącym środkiem'),
      text: T('A hazard refers to a control ID that is not in the register, typically after an edited file was opened.', 'Небезпека посилається на ID заходу, якого немає в реєстрі, зазвичай після відкриття відредагованого файлу.', 'Eine Gefährdung verweist auf eine Kennung, die nicht im Register steht, meist nach dem Öffnen einer bearbeiteten Datei.', 'Een gevaar verwijst naar een ID die niet in het register staat, meestal na het openen van een bewerkt bestand.', 'Un danger renvoie à un identifiant absent du registre, souvent après ouverture d’un fichier modifié.', 'Un peligro remite a un ID que no está en el registro, normalmente tras abrir un archivo editado.', 'Zagrożenie odwołuje się do ID spoza rejestru, zwykle po otwarciu edytowanego pliku.') },
    { id: 'JSA-R-020', sev: 'info', basis: KIND_HEUR,
      name: T('Repeated hazard', 'Повторна небезпека', 'Wiederholte Gefährdung', 'Herhaald gevaar', 'Danger répété', 'Peligro repetido', 'Powtórzone zagrożenie'),
      text: T('Heuristic: the same hazard wording appears in more than one place; check that the same controls are linked where they apply.', 'Евристика: те саме формулювання небезпеки трапляється в кількох місцях; перевірте, чи пов’язано ті самі заходи там, де вони застосовні.', 'Heuristik: Derselbe Gefährdungswortlaut kommt mehrfach vor; prüfen, ob dort dieselben Maßnahmen verknüpft sind.', 'Heuristiek: dezelfde gevaaromschrijving komt vaker voor; controleer of daar dezelfde maatregelen gekoppeld zijn.', 'Heuristique : le même libellé de danger apparaît plusieurs fois ; vérifier que les mêmes mesures y sont liées.', 'Heurística: la misma redacción de peligro aparece varias veces; compruebe que se vinculan los mismos controles donde procedan.', 'Heurystyka: ta sama treść zagrożenia występuje kilka razy; sprawdź, czy tam powiązano te same środki.') },

      text: T('A level marked applied has no linked control of that level in place and is exported as open; a level marked not practicable has one in place and is exported as applied.', 'Рівень, позначений як застосований, не має впровадженого пов’язаного заходу цього рівня й експортується як відкритий; рівень, позначений як неможливий, має такий захід і експортується як застосований.', 'Eine als angewendet markierte Stufe hat keine umgesetzte verknüpfte Maßnahme dieser Stufe und wird als offen exportiert; eine als nicht praktikabel markierte Stufe hat eine und wird als angewendet exportiert.', 'Een als toegepast gemarkeerd niveau heeft geen aanwezige gekoppelde maatregel van dat niveau en wordt als open geëxporteerd; een als niet uitvoerbaar gemarkeerd niveau heeft er wel een en wordt als toegepast geëxporteerd.', 'Un niveau marqué appliqué n’a aucune mesure liée de ce niveau en place et est exporté comme ouvert ; un niveau marqué non réalisable en a une et est exporté comme appliqué.', 'Un nivel marcado como aplicado no tiene ningún control vinculado de ese nivel implantado y se exporta como abierto; un nivel marcado como no factible sí lo tiene y se exporta como aplicado.', 'Poziom oznaczony jako zastosowany nie ma wdrożonego powiązanego środka tego poziomu i jest eksportowany jako otwarty; poziom oznaczony jako niewykonalny ma taki środek i jest eksportowany jako zastosowany.') },

      text: T('Who is exposed, for how long and how often is not stated.', 'Не зазначено, хто зазнає впливу, як довго й як часто.', 'Es fehlt, wer wie lange und wie oft exponiert ist.', 'Wie, hoe lang en hoe vaak blootgesteld wordt, is niet vermeld.', 'Qui est exposé, combien de temps et à quelle fréquence n’est pas indiqué.', 'No se indica quién está expuesto, cuánto tiempo ni con qué frecuencia.', 'Nie podano, kto jest narażony, jak długo i jak często.') }
  ];
  var RULE = {};
  RULES.forEach(function (r) { RULE[r.id] = r; });

  /* Vague phrases, matched at a word start, case-insensitive, in every UI
     language because an analysis may be written in any of them. A text that
     contains any digit is exempt (it usually carries a measurable criterion). */
  var VAGUE = [
    'be careful', 'take care', 'careful', 'carefully', 'be aware', 'awareness', 'pay attention', 'stay alert', 'be alert',
    'common sense', 'as required', 'as necessary', 'where necessary', 'if necessary', 'if needed', 'as appropriate',
    'where possible', 'use caution', 'caution', 'watch out', 'be vigilant', 'in a safe manner', 'work safely', 'proper', 'adequate', 'suitable',
    'будьте обережн', 'обережн', 'уважн', 'пильн', 'за потреби', 'при необхідності', 'за необхідності', 'належн', 'здоровий глузд', 'безпечно працювати',
    'vorsicht', 'aufpassen', 'achtsam', 'aufmerksam', 'bei bedarf', 'falls erforderlich', 'gesunder menschenverstand', 'sicher arbeiten', 'geeignet', 'angemessen',
    'voorzichtig', 'opletten', 'oplettend', 'alert', 'indien nodig', 'waar nodig', 'gezond verstand', 'veilig werken', 'geschikt', 'passend',
    'faire attention', 'attention', 'prudence', 'prudent', 'vigilan', 'si nécessaire', 'au besoin', 'bon sens', 'travailler en sécurité', 'adapté', 'approprié',
    'tener cuidado', 'cuidado', 'precaución', 'atención', 'si es necesario', 'cuando sea necesario', 'sentido común', 'trabajar con seguridad', 'adecuad', 'apropiad',
    'uważa', 'uwaga', 'ostrożn', 'czujn', 'w razie potrzeby', 'jeśli to konieczne', 'zdrowy rozsąd', 'bezpiecznie pracować', 'odpowiedni'
  ];

  /* ================================================================ 2. model */
  var HIER = ['elimination', 'substitution', 'engineering', 'admin', 'ppe'];
  var HIER_KEY = { elimination: 'hElim', substitution: 'hSubst', engineering: 'hEng', admin: 'hAdmin', ppe: 'hPPE' };
  var STATUS = ['in_place', 'planned', 'not_started'];
  var STATUS_KEY = { in_place: 'stIn', planned: 'stPlan', not_started: 'stNot' };
  var BAND_KEY = ['b0', 'b1', 'b2', 'b3'];
  /* hierarchy levels assessed per hazard (exchange contract D control keys) */
  var LEVEL_KEYS = ['elimination', 'substitution', 'engineering', 'administrative'];
  var LEVELS = { elimination: 'elimination', substitution: 'substitution', engineering: 'engineering', administrative: 'admin' };
  var LEVEL_STATES = ['applied', 'open', 'na'];
  var LEVEL_LABEL = { applied: 'hocApplied', open: 'hocOpen', na: 'hocNA' };
  var SEV_ORDER = { insufficient: 0, fail: 1, attention: 2, info: 3 };
  var SEV_KEY = { insufficient: 'sevInsuff', fail: 'sevFail', attention: 'sevAttn', info: 'sevInfo' };
  var TOOL_ID = 'jsatrabuilder', TOOL_FILE = 'jsatrabuilder.html', REV = '2026-09-16.jsatrabuilder.b2';
  var FILE_SCHEMA = 'tools.petrov.re/jsatrabuilder/analysis/v1';
  var EX_SCHEMA = 'tools.petrov.re/safety-exchange/v1';
  var REC_SCHEMA = 'tools.petrov.re/calculation-record/v1';
  var KINDS = { permit: 'jsa.task-hazards', ppe: 'jsa.residual-hazards' };
  var LOCALE = { en: 'en-GB', uk: 'uk-UA', de: 'de-DE', nl: 'nl-NL', fr: 'fr-FR', es: 'es-ES', pl: 'pl-PL' };

  function lx(v, lang) {
    if (v == null) return '';
    if (typeof v !== 'object') return String(v);
    return v[lang] != null ? v[lang] : (v.en != null ? v.en : '');
  }
  function tx(key, lang, vars) {
    var s = lx(D[key], lang);
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('%' + k).join(String(vars[k])); });
    return s;
  }
  function num(v, lang) {
    try { return Number(v).toLocaleString(LOCALE[lang] || 'en-GB'); } catch (e) { return String(v); }
  }
  function isInt(v) { return typeof v === 'number' && isFinite(v) && Math.floor(v) === v; }
  function str(v) { return v == null ? '' : String(v); }
  function blank(v) { return str(v).trim() === ''; }
  function norm(s) { return str(s).toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{N}]+/gu, ' ').trim(); }
  function words(s) { var n = norm(s); return n ? n.split(' ').length : 0; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function matrixRange(m) {
    var sum = m.method === 'sum';
    return { min: sum ? 2 : 1, max: sum ? m.nL + m.nS : m.nL * m.nS };
  }
  function matrixCheck(m) {
    var p = [];
    if (!m || !isInt(m.nL) || !isInt(m.nS) || m.nL < 2 || m.nL > 10 || m.nS < 2 || m.nS > 10) p.push({ code: 'pSize' });
    if (!m || (m.method !== 'product' && m.method !== 'sum')) p.push({ code: 'pMethod' });
    if (!m || !isInt(m.t1) || !isInt(m.t2) || !isInt(m.t3) || !(m.t1 < m.t2 && m.t2 < m.t3)) p.push({ code: 'pOrder' });
    if (!p.length) {
      var r = matrixRange(m);
      if (m.t1 < r.min) p.push({ code: 'pLow', v: m.t1, m: r.min });
      if (m.t3 >= r.max) p.push({ code: 'pHigh', v: m.t3, m: r.max });
    }
    return { ok: !p.length, problems: p };
  }
  function score(m, L, S) { return m.method === 'sum' ? L + S : L * S; }
  function band(m, sc) { return sc <= m.t1 ? 0 : (sc <= m.t2 ? 1 : (sc <= m.t3 ? 2 : 3)); }
  function bandRange(m, b) {
    var r = matrixRange(m);
    var lo = [r.min, m.t1 + 1, m.t2 + 1, m.t3 + 1][b], hi = [m.t1, m.t2, m.t3, r.max][b];
    return [lo, hi];
  }
  /* one rating: missing | out | ok */
  function rating(m, L, S) {
    if (L == null || S == null || L === '' || S === '') return { state: 'missing', L: L, S: S };
    if (!isInt(L) || !isInt(S) || L < 1 || S < 1 || L > m.nL || S > m.nS) return { state: 'out', L: L, S: S };
    var sc = score(m, L, S);
    return { state: 'ok', L: L, S: S, score: sc, band: band(m, sc) };
  }
  function levelNames(m, axis) {
    return str(axis === 'L' ? m.lNames : m.sNames).split(';').map(function (x) { return x.trim(); });
  }

  var VAGUE_RX = VAGUE.map(function (p) {
    return { p: p, rx: new RegExp('(^|[^\\p{L}])' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'iu') };
  });
  /* returns the matched phrase, or null; any digit exempts the text */
  function vagueHit(text) {
    var t = str(text);
    if (!t.trim() || /\d/.test(t)) return null;
    for (var i = 0; i < VAGUE_RX.length; i++) if (VAGUE_RX[i].rx.test(t)) return VAGUE_RX[i].p;
    return null;
  }
  function controlFlags(c) {
    var f = [], hit = vagueHit(c.text);
    if (hit) f.push('JSA-R-011');
    if (words(c.text) < 3) f.push('JSA-R-016');
    if (blank(c.owner)) f.push('JSA-R-012');
    if (blank(c.verify)) f.push('JSA-R-013');
    return { flags: f, vague: hit };
  }

  /* The whole rule engine. Pure: the same document gives the same result. */
  function evaluate(doc) {
    doc = doc || {};
    var m = doc.matrix || {}, mc = matrixCheck(m), F = [];
    function add(rule, where, args) { F.push({ rule: rule, sev: RULE[rule].sev, where: where || {}, args: args || {} }); }
    var task = doc.task || {};
    if (blank(task.title) || blank(task.scope)) {
      add('JSA-R-043', { task: 1 }, { missing: [blank(task.title) ? 'fTitle' : null, blank(task.scope) ? 'fScope' : null].filter(Boolean) });
    }
    if (!mc.ok) add('JSA-R-003', { matrix: 1 }, { problems: mc.problems });
    var steps = Array.isArray(doc.steps) ? doc.steps : [];
    var controls = Array.isArray(doc.controls) ? doc.controls : [];
    if (steps.length < 5 || steps.length > 20) add('JSA-R-040', { job: 1 }, { n: steps.length });

    var cById = {}, cev = {};
    controls.forEach(function (c, i) {
      cById[c.id] = c;
      var cf = controlFlags(c);
      var tagged = HIER.indexOf(c.hier) >= 0;
      cev[c.id] = {
        id: c.id, index: i, flags: cf.flags, vague: cf.vague, tagged: tagged, linked: [],
        open: c.status !== 'in_place',
        credited: c.status === 'in_place' && tagged && !blank(c.verify) &&
                  cf.flags.indexOf('JSA-R-011') < 0 && cf.flags.indexOf('JSA-R-016') < 0
      };
    });

    var hz = [], dupH = {};
    steps.forEach(function (s, si) {
      var no = si + 1;
      if (blank(s.text)) add('JSA-R-042', { step: s.id, stepNo: no });
      var hs = Array.isArray(s.hazards) ? s.hazards : [];
      if (!hs.length && !s.noHazard) add('JSA-R-041', { step: s.id, stepNo: no });
      hs.forEach(function (h) {
        var w = { step: s.id, stepNo: no, hazard: h.id };
        var he = { id: h.id, stepId: s.id, stepNo: no, linked: [], credited: [], missing: [],
                   initial: null, claimed: null, used: null, basis: 'none' };
        if (blank(h.text) || blank(h.consequence)) add('JSA-R-044', w);
        if (blank(h.exposure)) add('JSA-R-045', w);
        (Array.isArray(h.controls) ? h.controls : []).forEach(function (id) {
          if (cById[id]) {
            if (he.linked.indexOf(id) >= 0) return;
            he.linked.push(id);
            cev[id].linked.push(h.id);
            if (cev[id].credited) he.credited.push(id);
          } else {
            he.missing.push(id);
            add('JSA-R-017', w, { id: id });
          }
        });
        /* hierarchy assessment per level */
        he.levels = {};
        var hoc = h.hoc && typeof h.hoc === 'object' ? h.hoc : {};
        LEVEL_KEYS.forEach(function (k) {
          var inPlace = he.linked.some(function (id) { return cById[id].hier === LEVELS[k] && cById[id].status === 'in_place'; });
          var a = hoc[k] && typeof hoc[k] === 'object' ? hoc[k] : null;
          var st = a && LEVEL_STATES.indexOf(a.state) >= 0 ? a.state : '';
          var why = a ? str(a.reason).trim() : '';
          var lv = { value: inPlace ? 'applied' : 'open', assessed: st, reason: '' };
          if (st === 'applied' && !inPlace) add('JSA-R-047', w, { level: k, claim: 'applied' });

  /* after every evaluation: chips, badges and finding lists, in place */
  var SEV_TONE = { insufficient: 'warn', fail: 'bad', attention: 'warn', info: 'info' };
  var SEV_MARK = { insufficient: '?', fail: '✖', attention: '⚠', info: 'ℹ' };
  var HOC_MARK = { applied: '✓', open: '○', na: '–' };
  function chip(node, r, prefix) {
    var L = LG();
    node.className = 'jsa-chip' + (r ? ' b' + r.band : '');
    node.textContent = prefix + (r ? r.L + ' × ' + r.S + ' = ' + r.score + ' · ' + tx(BAND_KEY[r.band], L) : t('unset'));
  }
  function fillFind(ul, list) {
    while (ul.firstChild) ul.removeChild(ul.firstChild);
    var L = LG();
    list.forEach(function (f) {
      ul.appendChild(h('li', { cls: SEV_TONE[f.sev], text: SEV_MARK[f.sev] + ' ' + f.rule + ' · ' + findingText(f, L) }));
    });
  }
  function decorate() {
    if (!last || !state) return;
    var L = LG();
    var cmap = {};
    state.controls.forEach(function (c) { cmap[c.id] = c; });
    state.steps.forEach(function (st) {
      var r = refs.step[st.id];
      if (!r) return;
      while (r.sum.firstChild) r.sum.removeChild(r.sum.firstChild);
      r.sum.appendChild(document.createTextNode(t('hazN', { n: st.hazards.length })));
      var worst = null, nf = { insufficient: 0, fail: 0, attention: 0 };
      st.hazards.forEach(function (hz) {
        var he = last.hById[hz.id];
        if (!he) return;
        if (he.used && (!worst || he.used.score > worst.score)) worst = he.used;
        he.findings.forEach(function (f) { if (nf[f.sev] != null) nf[f.sev]++; });
      });
      last.findings.forEach(function (f) { if (f.where.step === st.id && f.where.hazard == null && nf[f.sev] != null) nf[f.sev]++; });
      if (worst) { var c1 = h('span'); chip(c1, worst, t('residual') + ' '); r.sum.appendChild(c1); }
      ['insufficient', 'fail', 'attention'].forEach(function (s) {
        if (nf[s]) r.sum.appendChild(h('span', { cls: 'jsa-chip ' + (s === 'fail' ? 'bad' : 'warn'), text: SEV_MARK[s] + ' ' + nf[s] + ' ' + tx(SEV_KEY[s], L) }));
      });
      st.hazards.forEach(function (hz) {
        var hr = refs.haz[hz.id], he = last.hById[hz.id];
        if (!hr || !he) return;
        chip(hr.iChip, he.initial, '');
        var pre = he.claimed && he.used && he.used !== he.claimed ? t('claimed') + ' ' + he.claimed.score + ' → ' + t('used') + ' ' : '';
        chip(hr.rChip, he.used, pre);
        if (he.basis === 'held' || he.basis === 'missing') hr.rChip.className += ' warn';
        fillFind(hr.find, he.findings);
        if (hr.hoc) LEVEL_KEYS.forEach(function (k) {
          var lv = he.levels[k], node = hr.hoc[k];
          if (!lv || !node) return;
          node.textContent = HOC_MARK[lv.value] + ' ' + t('hocOut', { v: t(LEVEL_LABEL[lv.value]) + (lv.assessed ? '' : ' (' + t('hocFrom') + ')') });
          node.className = 'jsa-chip ' + (lv.value === 'applied' ? 'ok' : (lv.value === 'open' ? 'warn' : ''));
        });
      });

    if (edSteps) {
      Array.prototype.forEach.call(edSteps.querySelectorAll('[data-cid]'), function (n) {
        var c = cmap[n.getAttribute('data-cid')], e = last.cById[n.getAttribute('data-cid')];

          (e.credited ? ' ✓' : '') + ' — ' + (str(c.text) || '…');
      });
    }
    state.controls.forEach(function (c) {
      var r = refs.ctl[c.id], e = last.cById[c.id];
      if (!r || !e) return;
      r.state.textContent = (e.credited ? '✓ ' : '') + tx(STATUS_KEY[c.status] || 'stNot', L) + ' · ' + hierText(c.hier, L);
      r.state.className = 'jsa-chip ' + (e.credited ? 'ok' : (e.open ? 'warn' : ''));
      r.linked.textContent = t('linkedTo') + ': ' + (e.linked.length ? e.linked.join(', ') : t('nothing'));
      r.del.disabled = e.linked.length > 0;
      r.del.title = e.linked.length ? t('delBlocked') : t('delCtl') + ' ' + c.id;
      fillFind(r.find, e.findings || []);
    });
    if (heatBox) {

    }

      if (importMsg) importMsg.forEach(function (m) { importBox.appendChild(h('div', { cls: 'jsa-msg ' + (m.tone || ''), text: m.text })); });
      if (!storageOk) importBox.appendChild(h('div', { cls: 'jsa-msg bad', text: t('storeFail') }));
    }

  /* ------------------------------------------------------------ heat maps */
  var BAND_FILL = ['#cfe8d2', '#f6e7a1', '#f7c38f', '#f0a39c'];
  var BAND_INK = ['#1f5c2a', '#6b5700', '#7a3900', '#7d1a14'];
  function drawGrid(ctx, x0, y0, cell, m, cells) {
    var nL = m.nL, nS = m.nS;
    ctx.font = '600 ' + Math.round(cell * 0.18) + 'px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    for (var L = nL; L >= 1; L--) {
      for (var S = 1; S <= nS; S++) {
        var x = x0 + (S - 1) * cell, y = y0 + (nL - L) * cell;
        var b = band(m, score(m, L, S));
        ctx.fillStyle = BAND_FILL[b];
        ctx.fillRect(x, y, cell, cell);
        if (b >= 2) {
          ctx.save();
          ctx.beginPath(); ctx.rect(x, y, cell, cell); ctx.clip();
          ctx.strokeStyle = 'rgba(0,0,0,' + (b === 3 ? 0.22 : 0.12) + ')';
          ctx.lineWidth = 1;
          var step = b === 3 ? cell / 6 : cell / 4;
          for (var k = -cell; k < cell * 2; k += step) { ctx.beginPath(); ctx.moveTo(x + k, y + cell); ctx.lineTo(x + k + cell, y); ctx.stroke(); }
          ctx.restore();
        }
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(x, y, cell, cell);
        ctx.fillStyle = BAND_INK[b];
        ctx.textAlign = 'right';
        ctx.font = '600 ' + Math.max(9, Math.round(cell * 0.2)) + 'px system-ui, sans-serif';
        ctx.fillText(String(b + 1), x + cell - 4, y + cell * 0.2);
        var n = cells[L + ',' + S] || 0;
        if (n) {
          ctx.textAlign = 'center';
          ctx.font = '700 ' + Math.round(cell * 0.42) + 'px system-ui, sans-serif';
          ctx.fillStyle = '#111';
          ctx.fillText(String(n), x + cell / 2, y + cell * 0.58);
        }
      }
    }
    /* axis numerals */
    ctx.fillStyle = '#555';
    ctx.font = '500 ' + Math.max(10, Math.round(cell * 0.24)) + 'px system-ui, sans-serif';
    ctx.textAlign = 'right';
    for (var L2 = 1; L2 <= nL; L2++) ctx.fillText(String(L2), x0 - 6, y0 + (nL - L2 + 0.5) * cell);
    ctx.textAlign = 'center';
    for (var S2 = 1; S2 <= nS; S2++) ctx.fillText(String(S2), x0 + (S2 - 0.5) * cell, y0 + nL * cell + 12);
  }
  function gridSize(m, cssW) {
    var cell = Math.max(18, Math.min(52, Math.floor((cssW - 28) / m.nS)));
    return { cell: cell, w: 28 + cell * m.nS + 4, h: cell * m.nL + 24 };
  }

  function reportFigure(m, ev) {
    var g = gridSize(m, 340), gap = 34, scale = 2;
    var cv = document.createElement('canvas');
    cv.width = (g.w * 2 + gap) * scale; cv.height = g.h * scale;

    drawGrid(ctx, 26 + g.w + gap, 4, g.cell, m, ev.cells.residual);
    ctx.strokeStyle = '#999'; ctx.lineWidth = 1.5;
    var ax = g.w + 4, ay = g.h / 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + gap - 10, ay); ctx.lineTo(ax + gap - 16, ay - 5); ctx.moveTo(ax + gap - 10, ay); ctx.lineTo(ax + gap - 16, ay + 5); ctx.stroke();

  function escH(s) { return str(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  /* A table whose header row is printed once. The engine repeats a declared

     reads as a repeated sentence; so the header is a styled row of its own. */
  function tableSec(title, head, cols, rows, notes) {
    var hdr = '<div class="r cN rh" style="grid-template-columns:' + escH(cols) + '">' +
      head.map(function (x) { return '<span>' + escH(x) + '</span>'; }).join('') + '</div>';
    return [{ title: title, html: hdr }, { cols: cols, rows: rows, notes: notes || [] }];
  }
  function verdictText(ev, l) {
    var c = ev.counts;
    return ev.verdict === 'insufficient' ? tx('vInsuff', l, { n: c.insufficient })
      : (ev.verdict === 'findings' ? tx('vFind', l, { n: c.blocking }) : tx('vClear', l, { s: c.steps, h: c.hazards, a: c.advisory }));
  }
  /* doc defaults to the live analysis; the benchmark adapter passes its own */
  function reportProfile(rec, ctx, doc) {
    var l = (ctx && (ctx.domainLang || ctx.lang)) || 'en';
    if (LANGS.indexOf(l) < 0) l = 'en';
    var st = doc || state;
    var ev = doc ? evaluate(doc) : recompute(), m = st.matrix, tk = st.task, c = ev.counts;
    var cmap = {};
    st.controls.forEach(function (x) { cmap[x.id] = x; });
    var dash = '—';
    var verdict = verdictText(ev, l);

    /* one card per rule, most severe first */
    var groups = [], gi = {};
    ev.findings.forEach(function (f) {
      if (!gi[f.rule]) { gi[f.rule] = { rule: f.rule, sev: f.sev, list: [] }; groups.push(gi[f.rule]); }
      gi[f.rule].list.push(f);
    });
    var checks = groups.map(function (g) {
      var r = RULE[g.rule];
      var locs = g.list.map(function (f) { var d = detailText(f, l); return whereText(f.where, l) + (d ? ' (' + d + ')' : ''); });
      return {
        status: g.sev === 'fail' ? 'fail' : (g.sev === 'info' ? 'info' : 'warn'),
        title: g.rule + ' · ' + lx(r.name, l),
        detail: locs.join('; '),
        actual: tx(SEV_KEY[g.sev], l) + ' · ' + tx('rFindN', l, { n: g.list.length }),
        basis: kindText(r.basis.kind, l)
      };
    });

    var stepRows = [];
    st.steps.forEach(function (s, i) {
      var head = (i + 1) + '. ' + (str(s.text) || dash);
      if (!s.hazards.length) { stepRows.push([head, s.noHazard ? tx('rNoHazStep', l) : dash, '', '', '', '']); return; }
      s.hazards.forEach(function (hz, j) {
        var he = ev.hById[hz.id];
        var ctl = he.linked.map(function (id) { return id + (he.credited.indexOf(id) >= 0 ? ' ✓' : ''); }).concat(he.missing.map(function (id) { return id + ' ?'; })).join(', ');
        stepRows.push([j ? '' : head, hz.id + ' ' + (str(hz.text) || dash),
          [str(hz.consequence) || dash, str(hz.exposure) || dash].join(' · '),
          ratingText(he.initial, l), ctl || dash,
          ratingText(he.used, l) + (he.used && he.claimed !== he.used ? ' *' : '')]);
      });
    });

    var mc = ev.matrix;
    var lnames = levelNames(m, 'L'), snames = levelNames(m, 'S');
    function scaleText(n, names) {
      var out = tx('rLevels', l, { n: n });
      var nn = isInt(n) ? Math.min(n, 10) : 0, parts = [];
      for (var i = 1; i <= nn; i++) parts.push(i + (names[i - 1] ? ' ' + names[i - 1] : ''));
      return out + (parts.length ? ': ' + parts.join('; ') : '');
    }
    var matrixRows = [
      [tx('mName', l), str(m.name) || dash], [tx('mVersion', l), str(m.version) || dash], [tx('mSource', l), str(m.source) || dash],
      [tx('rLScale', l), scaleText(m.nL, lnames)], [tx('rSScale', l), scaleText(m.nS, snames)],
      [tx('mMethod', l), m.method === 'sum' ? tx('mSum', l) : (m.method === 'product' ? tx('mProduct', l) : str(m.method))],
      [tx('mT1', l), str(m.t1)], [tx('mT2', l), str(m.t2)], [tx('mT3', l), str(m.t3)]
    ];
    if (mc.ok) {
      matrixRows.push([tx('colRange', l), [0, 1, 2, 3].map(function (b) { var br = bandRange(m, b); return (b + 1) + ' ' + tx(BAND_KEY[b], l) + ' ' + br[0] + '–' + br[1]; }).join('; ')]);
    } else {
      matrixRows.push([lx(RULE['JSA-R-003'].name, l), (mc.problems || []).map(function (p) { return tx(p.code, l, { v: p.v, m: p.m }); }).join('; ')]);
    }
    var sections = [
      { title: tx('rSteps', l), head: [tx('step', l), tx('hazard', l), tx('rConsExp', l), tx('initial', l), tx('tCtl', l), tx('residual', l)],
        cols: 'minmax(0,1.15fr) minmax(0,1.2fr) minmax(0,1.3fr) 25mm minmax(0,.8fr) 25mm', rows: stepRows, notes: [tx('rStepsNote', l)] },
      { title: tx('rMatrix', l), head: [tx('rProp', l), tx('rVal', l)], cols: 'minmax(40mm,.6fr) minmax(0,1.6fr)', rows: matrixRows }
    ];
    if (mc.ok) {
      var gh = ['L \\ S'], grows = [];
      for (var S = 1; S <= m.nS; S++) gh.push(String(S));
