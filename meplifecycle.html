  "description": {
    "en": "Edit the site register (install year, condition, replacement cost, refrigerant, end of support, bundles) or load an example building. Each asset gets an effective age from its condition grade and failure history, a renewal trigger from its criticality class, and the regulatory drivers of Regulation (EU) 2024/573 (servicing bans, HFC quota) and the HCFC ban. The fleet becomes a 25-year capex profile; a budget cap defers the lowest-risk renewals first and reports the backlog and the risk added. Bundles align renewals of several assets with one project when the net value is positive. Per-asset economics go to Repair or Replace; a heat or cold generator goes to the generator shortlist with its rating.",
    "uk": "Редагуйте реєстр об’єкта (рік встановлення, стан, вартість заміни, холодоагент, кінець підтримки, пакети) або завантажте приклад будівлі. Кожна одиниця отримує ефективний вік за оцінкою стану й історією відмов, поріг оновлення за класом критичності та регуляторні чинники Регламенту (ЄС) 2024/573 (заборони обслуговування, квота ГФВ) і заборону ГХФВ. Парк обладнання стає 25-річним профілем капвитрат; бюджетний ліміт відкладає спершу оновлення з найменшим ризиком і показує відставання та доданий ризик. Пакети поєднують оновлення кількох одиниць в одному проєкті, коли чиста вигода додатна. Економіку окремої одиниці рахує «Ремонт чи заміна»; джерело тепла чи холоду передається в підбір генераторів із його потужністю.",
    "de": "Bearbeiten Sie das Anlagenregister (Einbaujahr, Zustand, Ersatzkosten, Kältemittel, Supportende, Pakete) oder laden Sie ein Beispielgebäude. Jede Anlage erhält ein effektives Alter aus Zustandsnote und Störungshistorie, eine Erneuerungsschwelle aus ihrer Kritikalitätsklasse und die regulatorischen Treiber der Verordnung (EU) 2024/573 (Wartungsverbote, HFKW-Quote) sowie das H-FCKW-Verbot. Der Bestand wird zu einem 25-Jahres-Investitionsprofil; eine Budgetgrenze schiebt zuerst die Erneuerungen mit dem geringsten Risiko und zeigt Rückstau und hinzugefügtes Risiko. Pakete legen Erneuerungen mehrerer Anlagen in ein Projekt, wenn der Nettowert positiv ist. Die Wirtschaftlichkeit einer Anlage rechnet „Reparieren oder ersetzen“; ein Wärme- oder Kälteerzeuger geht mit seiner Leistung in die Erzeugerauswahl.",
    "nl": "Bewerk het installatieregister (bouwjaar, conditie, vervangingskosten, koudemiddel, einde ondersteuning, bundels) of laad een voorbeeldgebouw. Elke installatie krijgt een effectieve leeftijd uit conditiescore en storingshistorie, een vervangingsdrempel uit haar kriticiteitsklasse en de regelgevende drijvers van Verordening (EU) 2024/573 (onderhoudsverboden, HFK-quotum) en het HCFK-verbod. Het bestand wordt een investeringsprofiel over 25 jaar; een budgetplafond schuift eerst de vervangingen met het laagste risico door en toont de achterstand en het toegevoegde risico. Bundels leggen vervangingen van meerdere installaties in één project als de nettowaarde positief is. De economie per installatie rekent ‘Repareren of vervangen’; een warmte- of koudeopwekker gaat met zijn vermogen naar de opwekkerselectie.",
    "fr": "Modifiez le registre du site (année d’installation, état, coût de remplacement, fluide, fin de support, lots) ou chargez un bâtiment d’exemple. Chaque équipement reçoit un âge effectif d’après sa note d’état et son historique de pannes, un seuil de renouvellement d’après sa classe de criticité et les contraintes du règlement (UE) 2024/573 (interdictions d’entretien, quota HFC) et de l’interdiction des HCFC. Le parc devient un profil d’investissement sur 25 ans ; un plafond budgétaire reporte d’abord les renouvellements les moins risqués et indique l’arriéré et le risque ajouté. Les lots regroupent les renouvellements de plusieurs équipements dans un projet quand le gain net est positif. L’économie d’un équipement relève de « Réparer ou remplacer » ; un générateur de chaud ou de froid part vers la présélection de générateurs avec sa puissance.",
    "es": "Edite el registro del emplazamiento (año de instalación, estado, coste de sustitución, refrigerante, fin de soporte, paquetes) o cargue un edificio de ejemplo. Cada equipo recibe una edad efectiva a partir de su nota de estado y su historial de fallos, un umbral de renovación según su clase de criticidad y los condicionantes del Reglamento (UE) 2024/573 (prohibiciones de mantenimiento, cuota de HFC) y la prohibición de los HCFC. El parque se convierte en un perfil de inversión a 25 años; un tope presupuestario aplaza primero las renovaciones de menor riesgo e indica el retraso acumulado y el riesgo añadido. Los paquetes agrupan renovaciones de varios equipos en un proyecto cuando el valor neto es positivo. La economía de un equipo la calcula «Reparar o sustituir»; un generador de calor o frío pasa a la preselección de generadores con su potencia.",
    "pl": "Edytuj rejestr obiektu (rok montażu, stan, koszt wymiany, czynnik chłodniczy, koniec wsparcia, pakiety) lub wczytaj przykładowy budynek. Każde urządzenie dostaje wiek efektywny z oceny stanu i historii awarii, próg odnowy z klasy krytyczności oraz wymogi rozporządzenia (UE) 2024/573 (zakazy serwisowania, kontyngent HFC) i zakazu HCFC. Park urządzeń staje się 25-letnim profilem nakładów; limit budżetu odracza najpierw odnowy o najmniejszym ryzyku i pokazuje zaległości oraz dodane ryzyko. Pakiety łączą odnowy kilku urządzeń w jeden projekt, gdy wartość netto jest dodatnia. Ekonomikę pojedynczego urządzenia liczy „Naprawić czy wymienić”; źródło ciepła lub chłodu trafia z mocą do doboru źródeł."

  "limitations": {
    "en": "A fleet planning aid in real euros of the plan year (no escalation, no discounting). Economic lives and replacement costs are class ranges from public sources or stated learning assumptions; the condition-to-life table, trigger fractions, the Weibull wear-out used for the deferral risk and the quota-scarcity horizons for R410A/R407C/R134a are learning assumptions to be replaced with site data. Refrigerant dates follow the EU text (Regulation (EU) 2024/573, Regulation (EC) 1005/2009); national rules may be stricter. Not a substitute for manufacturer instructions, a condition survey or national regulations.",
    "uk": "Допоміжний засіб планування парку в реальних євро планового року (без індексації та дисконтування). Строки економічної служби та вартості заміни — діапазони класів із відкритих джерел або явні навчальні припущення; таблиця «стан → спрацьований ресурс», порогові частки, знос за Вейбуллом для ризику відкладення та горизонти дефіциту квоти для R410A/R407C/R134a — навчальні припущення, які слід замінити даними об’єкта. Дати щодо холодоагентів відповідають тексту ЄС (Регламент (ЄС) 2024/573, Регламент (ЄС) 1005/2009); національні правила можуть бути суворішими. Не замінює інструкцій виробника, обстеження стану чи національних норм.",
    "de": "Eine Planungshilfe für den Bestand in realen Euro des Planjahres (keine Teuerung, keine Abzinsung). Nutzungsdauern und Ersatzkosten sind Klassenspannen aus öffentlichen Quellen oder ausgewiesene Lernannahmen; die Tabelle Zustand → verbrauchte Lebensdauer, die Schwellenanteile, der Weibull-Verschleiß für das Aufschubrisiko und die Quotenknappheits-Horizonte für R410A/R407C/R134a sind Lernannahmen, die durch Standortdaten zu ersetzen sind. Kältemitteldaten folgen dem EU-Text (Verordnung (EU) 2024/573, Verordnung (EG) 1005/2009); nationale Vorschriften können strenger sein. Kein Ersatz für Herstellervorgaben, eine Zustandserfassung oder nationale Vorschriften.",
    "nl": "Een planningshulpmiddel voor het bestand in reële euro’s van het planjaar (geen indexatie, geen disconto). Levensduren en vervangingskosten zijn klassebandbreedtes uit openbare bronnen of vermelde leeraannames; de tabel conditie → verbruikte levensduur, de drempelfracties, de Weibull-slijtage voor het uitstelrisico en de quotumschaarstehorizonnen voor R410A/R407C/R134a zijn leeraannames die door locatiegegevens vervangen moeten worden. Koudemiddeldata volgen de EU-tekst (Verordening (EU) 2024/573, Verordening (EG) 1005/2009); nationale regels kunnen strenger zijn. Geen vervanging van fabrieksvoorschriften, een conditiemeting of nationale regels.",
    "fr": "Une aide à la planification du parc en euros constants de l’année du plan (sans indexation ni actualisation). Durées de vie et coûts de remplacement sont des plages de classe issues de sources publiques ou des hypothèses pédagogiques déclarées ; la table état → vie consommée, les fractions de seuil, l’usure de Weibull utilisée pour le risque de report et les horizons de pénurie de quota pour R410A/R407C/R134a sont des hypothèses pédagogiques à remplacer par les données du site. Les dates relatives aux fluides suivent le texte de l’UE (règlement (UE) 2024/573, règlement (CE) 1005/2009) ; les règles nationales peuvent être plus strictes. Ne remplace ni les instructions du fabricant, ni un état des lieux, ni la réglementation nationale.",
    "es": "Una ayuda de planificación del parque en euros constantes del año del plan (sin actualización de precios ni descuento). Vidas útiles y costes de sustitución son rangos de clase de fuentes públicas o supuestos didácticos declarados; la tabla estado → vida consumida, las fracciones de umbral, el desgaste de Weibull usado para el riesgo de aplazar y los horizontes de escasez de cuota para R410A/R407C/R134a son supuestos didácticos que deben sustituirse por datos del emplazamiento. Las fechas de refrigerantes siguen el texto de la UE (Reglamento (UE) 2024/573, Reglamento (CE) 1005/2009); las normas nacionales pueden ser más estrictas. No sustituye las instrucciones del fabricante, una inspección de estado ni la normativa nacional.",
    "pl": "Pomoc w planowaniu parku urządzeń w realnych euro roku planu (bez waloryzacji i dyskontowania). Okresy użytkowania i koszty wymiany to zakresy klas z publicznych źródeł lub jawne założenia dydaktyczne; tabela stan → zużyta trwałość, progi, zużycie Weibulla do ryzyka odroczenia i horyzonty niedoboru kontyngentu dla R410A/R407C/R134a to założenia dydaktyczne do zastąpienia danymi obiektu. Daty dotyczące czynników chłodniczych wynikają z tekstu UE (rozporządzenie (UE) 2024/573, rozporządzenie (WE) 1005/2009); przepisy krajowe mogą być surowsze. Nie zastępuje instrukcji producenta, oceny stanu ani przepisów krajowych."
  },

  quota_scarcity_mid: T7('GWP 750–1499 (R134a): no servicing ban; quota at about 16–20 % of the 2025 level after 2033 (Annex VII) — planning horizon, a learning assumption', 'GWP 750–1499 (R134a): заборони обслуговування немає; квота після 2033 близько 16–20 % рівня 2025 (додаток VII) — плановий горизонт, навчальне припущення', 'GWP 750–1499 (R134a): kein Wartungsverbot; Quote nach 2033 bei etwa 16–20 % des Werts von 2025 (Anhang VII) — Planungshorizont, Lernannahme', 'GWP 750–1499 (R134a): geen onderhoudsverbod; quotum na 2033 rond 16–20 % van 2025 (bijlage VII) — planningshorizon, leeraanname', 'GWP 750–1499 (R134a) : pas d’interdiction ; quota vers 16–20 % du niveau 2025 après 2033 (annexe VII) — horizon de planification, hypothèse pédagogique', 'GWP 750–1499 (R134a): sin prohibición; cuota en torno al 16–20 % del nivel de 2025 después de 2033 (anexo VII) — horizonte de planificación, supuesto didáctico', 'GWP 750–1499 (R134a): brak zakazu; kontyngent po 2033 ok. 16–20 % poziomu z 2025 (załącznik VII) — horyzont planistyczny, założenie dydaktyczne'),

  support_end: T7('Manufacturer support ends (spares, firmware): plan the renewal or a last-time buy', 'Кінець підтримки виробника (запчастини, прошивки): плануйте оновлення або останню закупівлю', 'Herstellersupport endet (Ersatzteile, Firmware): Erneuerung oder Letztbevorratung planen', 'Fabrieksondersteuning eindigt (onderdelen, firmware): plan vervanging of laatste aankoop', 'Fin du support constructeur (pièces, micrologiciel) : planifier le renouvellement ou un dernier achat', 'Fin del soporte (repuestos, firmware): planificar la renovación o una última compra', 'Koniec wsparcia (części, oprogramowanie): zaplanuj odnowę lub ostatni zakup'),

  crit_class_assumed: T7('No criticality class available: B assumed. Rank the register in MEP Asset Criticality.', 'Клас критичності відсутній: припущено B. Оцініть реєстр у «Критичності обладнання».', 'Keine Kritikalitätsklasse: B angenommen. Register in Anlagenkritikalität bewerten.', 'Geen kriticiteitsklasse: B aangenomen. Beoordeel het register in Kriticiteit installaties.', 'Pas de classe de criticité : B supposée. Classez le registre dans Criticité des équipements.', 'Sin clase de criticidad: se supone B. Clasifique el registro en Criticidad de activos.', 'Brak klasy krytyczności: przyjęto B. Oceń rejestr w Krytyczności urządzeń.'),
  life_typical: T7('Economic life from the class library (range lo–hi gives the renewal range).', 'Строк служби з бібліотеки класів (діапазон дає діапазон року оновлення).', 'Nutzungsdauer aus der Klassenbibliothek (die Spanne ergibt die Spanne des Erneuerungsjahrs).', 'Levensduur uit de klassenbibliotheek (de bandbreedte geeft de bandbreedte van het vervangingsjaar).', 'Durée de vie issue de la bibliothèque de classes (sa plage donne la plage de l’année).', 'Vida útil de la biblioteca de clases (su rango da el rango del año).', 'Okres użytkowania z biblioteki klas (zakres daje zakres roku odnowy).'),

  capex_unknown: T7('Replacement cost unknown: the renewal is not in the profile (no 0 EUR bar) and is counted under “cost unknown”. Enter a cost to book it.', 'Вартість заміни невідома: оновлення не входить у профіль (без стовпця 0 EUR) і враховується як «вартість невідома». Введіть вартість, щоб запланувати.', 'Ersatzkosten unbekannt: die Erneuerung steht nicht im Profil (kein 0-EUR-Balken) und zählt unter „Kosten unbekannt“. Kosten eingeben, um sie einzuplanen.', 'Vervangingskosten onbekend: de vervanging staat niet in het profiel (geen balk van 0 EUR) en telt onder ‘kosten onbekend’. Vul een bedrag in om te begroten.', 'Coût de remplacement inconnu : le renouvellement n’entre pas dans le profil (pas de barre à 0 EUR) et est compté en « coût inconnu ». Saisissez un coût pour l’inscrire.', 'Coste de sustitución desconocido: la renovación no entra en el perfil (sin barra de 0 EUR) y se cuenta como «coste desconocido». Introduzca un coste para presupuestarla.', 'Koszt wymiany nieznany: odnowa nie wchodzi do profilu (bez słupka 0 EUR) i liczy się jako „koszt nieznany”. Wpisz koszt, aby ją zaplanować.'),
  survey_needed: T7('No condition grade: survey needed. The year and range from age are indicative only; no money is booked in the profile — age alone never books capex.', 'Немає оцінки стану: потрібне обстеження. Рік і діапазон за віком лише орієнтовні; гроші в профіль не закладаються — сам вік ніколи не визначає капвитрати.', 'Keine Zustandsnote: Begehung nötig. Jahr und Spanne nach Alter sind nur Richtwerte; im Profil wird kein Geld eingeplant — das Alter allein löst keine Investition aus.', 'Geen conditiescore: inspectie nodig. Jaar en bandbreedte op leeftijd zijn alleen indicatief; er wordt geen geld in het profiel begroot — leeftijd alleen leidt nooit tot een investering.', 'Pas de note d’état : état des lieux requis. L’année et la plage d’après l’âge sont indicatives ; aucun montant n’entre dans le profil — l’âge seul n’engage jamais d’investissement.', 'Sin nota de estado: hace falta inspección. El año y el rango por edad son solo indicativos; no se presupuesta dinero en el perfil — la edad sola nunca decide una inversión.', 'Brak oceny stanu: potrzebny przegląd. Rok i zakres z wieku są tylko orientacyjne; w profilu nie planuje się pieniędzy — sam wiek nigdy nie uruchamia nakładu.'),
  unknown_class: T7('Equipment class not in the library: generic life 15–20–25 years.', 'Клас відсутній у бібліотеці: загальний строк 15–20–25 років.', 'Klasse nicht in der Bibliothek: allgemeine Dauer 15–20–25 Jahre.', 'Klasse niet in de bibliotheek: algemene levensduur 15–20–25 jaar.', 'Classe absente de la bibliothèque : durée générique 15–20–25 ans.', 'Clase no incluida: vida genérica 15–20–25 años.', 'Klasy brak w bibliotece: ogólny okres 15–20–25 lat.'),
  failure_floor: T7('Three or more unplanned failures in 3 years: treated as grade 4 (poor) evidence.', 'Три чи більше позапланових відмов за 3 роки: враховано як оцінку 4 (поганий).', 'Drei oder mehr ungeplante Ausfälle in 3 Jahren: als Note 4 (schlecht) gewertet.', 'Drie of meer ongeplande storingen in 3 jaar: geteld als score 4 (slecht).', 'Trois pannes imprévues ou plus en 3 ans : comptées comme note 4 (mauvais).', 'Tres o más fallos imprevistos en 3 años: cuentan como nota 4 (malo).', 'Trzy lub więcej nieplanowanych awarii w 3 latach: liczone jako ocena 4 (zły).'),
  age_only: T7('No condition grade: the estimate uses calendar age only. Survey it before committing money.', 'Немає оцінки стану: оцінка лише за календарним віком. Обстежте перед витратами.', 'Keine Zustandsnote: Schätzung nur nach Kalenderalter. Vor einer Ausgabe begutachten.', 'Geen conditiescore: schatting alleen op kalenderleeftijd. Inspecteer vóór u geld vastlegt.', 'Pas de note d’état : estimation sur l’âge seul. Faites un état des lieux avant d’engager.', 'Sin nota de estado: estimación solo por la edad. Inspeccione antes de comprometer dinero.', 'Brak oceny stanu: szacunek tylko z wieku. Zbadaj przed wydatkiem.'),
  install_year_unknown: T7('Installation year unknown: condition grade only.', 'Рік встановлення невідомий: лише оцінка стану.', 'Einbaujahr unbekannt: nur Zustandsnote.', 'Bouwjaar onbekend: alleen conditiescore.', 'Année d’installation inconnue : note d’état seule.', 'Año de instalación desconocido: solo la nota de estado.', 'Rok montażu nieznany: tylko ocena stanu.'),
  no_condition_no_age: T7('Neither age nor condition known: placed at a typical grade 3. Survey needed.', 'Невідомі ні вік, ні стан: прийнято типову оцінку 3. Потрібне обстеження.', 'Weder Alter noch Zustand bekannt: mit typischer Note 3 angesetzt. Begehung nötig.', 'Leeftijd noch conditie bekend: gezet op typische score 3. Inspectie nodig.', 'Ni âge ni état connus : placé à une note typique 3. État des lieux nécessaire.', 'Ni edad ni estado conocidos: se toma una nota típica 3. Hace falta inspección.', 'Nie znany wiek ani stan: przyjęto typową ocenę 3. Potrzebny przegląd.'),

  sf6_2035: T7('SF6: from 2035 servicing only with reclaimed or recycled SF6 (Art. 13(7)) — information, not a renewal date.', 'SF6: з 2035 обслуговування лише відновленим чи рециркульованим SF6 (ст. 13(7)) — інформація, не дата оновлення.', 'SF6: ab 2035 Wartung nur mit aufgearbeitetem oder recyceltem SF6 (Art. 13(7)) — Hinweis, kein Erneuerungsjahr.', 'SF6: vanaf 2035 onderhoud alleen met geregenereerd of gerecycled SF6 (art. 13(7)) — informatie, geen vervangingsjaar.', 'SF6 : dès 2035 entretien uniquement au SF6 régénéré ou recyclé (art. 13(7)) — information, pas une date.', 'SF6: desde 2035 mantenimiento solo con SF6 regenerado o reciclado (art. 13(7)) — información, no fecha.', 'SF6: od 2035 serwis tylko z SF6 regenerowanym lub z recyklingu (art. 13 ust. 7) — informacja, nie data odnowy.'),
  virgin_service_ban_2025: T7('Already now (since 2025) only reclaimed or recycled gas may be used for servicing.', 'Уже зараз (з 2025) для обслуговування можна використовувати лише відновлений чи рециркульований газ.', 'Schon jetzt (seit 2025) darf zur Wartung nur aufgearbeitetes oder recyceltes Gas verwendet werden.', 'Nu al (sinds 2025) mag voor onderhoud alleen geregenereerd of gerecycled gas worden gebruikt.', 'Dès maintenant (depuis 2025), seul du fluide régénéré ou recyclé peut servir à l’entretien.', 'Ya ahora (desde 2025) solo puede usarse gas regenerado o reciclado.', 'Już teraz (od 2025) do serwisu wolno używać tylko czynnika regenerowanego lub z recyklingu.'),
  virgin_service_ban_2026: T7('Already now (since 2026) only reclaimed or recycled gas may be used for servicing.', 'Уже зараз (з 2026) для обслуговування можна використовувати лише відновлений чи рециркульований газ.', 'Schon jetzt (seit 2026) darf zur Wartung nur aufgearbeitetes oder recyceltes Gas verwendet werden.', 'Nu al (sinds 2026) mag voor onderhoud alleen geregenereerd of gerecycled gas worden gebruikt.', 'Dès maintenant (depuis 2026), seul du fluide régénéré ou recyclé peut servir à l’entretien.', 'Ya ahora (desde 2026) solo puede usarse gas regenerado o reciclado.', 'Już teraz (od 2026) do serwisu wolno używać tylko czynnika regenerowanego lub z recyklingu.'),

  l4l_banned_chiller_2027: T7('A new chiller > 12 kW with GWP ≥ 750 may not be placed on the market from 2027 (Annex IV 7(d)): the renewal includes a refrigerant change.', 'Новий чилер > 12 кВт з GWP ≥ 750 не можна розміщувати на ринку з 2027 (додаток IV 7(d)): оновлення означає зміну холодоагенту.', 'Ein neuer Kaltwassersatz > 12 kW mit GWP ≥ 750 darf ab 2027 nicht in Verkehr gebracht werden (Anhang IV 7(d)): die Erneuerung umfasst einen Kältemittelwechsel.', 'Een nieuwe koelmachine > 12 kW met GWP ≥ 750 mag vanaf 2027 niet in de handel worden gebracht (bijlage IV 7(d)): vervanging betekent ander koudemiddel.', 'Un groupe froid neuf > 12 kW au GWP ≥ 750 ne peut plus être mis sur le marché dès 2027 (annexe IV 7(d)) : le renouvellement implique un changement de fluide.', 'Una enfriadora nueva > 12 kW con GWP ≥ 750 no puede comercializarse desde 2027 (anexo IV 7(d)): la renovación implica cambiar de refrigerante.', 'Nowego agregatu > 12 kW z GWP ≥ 750 nie wolno wprowadzać do obrotu od 2027 (załącznik IV 7(d)): odnowa oznacza zmianę czynnika.'),
  l4l_banned_split_2029: T7('New split systems > 12 kW with GWP ≥ 750 are banned from 2029 (Annex IV 9(e)): like-for-like R410A replacement is not possible.', 'Нові спліт-системи > 12 кВт з GWP ≥ 750 заборонені з 2029 (додаток IV 9(e)): заміна «як було» на R410A неможлива.', 'Neue Split-Systeme > 12 kW mit GWP ≥ 750 sind ab 2029 verboten (Anhang IV 9(e)): ein Ersatz mit R410A ist nicht möglich.', 'Nieuwe splitsystemen > 12 kW met GWP ≥ 750 zijn verboden vanaf 2029 (bijlage IV 9(e)): gelijkwaardige vervanging met R410A kan niet.', 'Les systèmes split neufs > 12 kW au GWP ≥ 750 sont interdits dès 2029 (annexe IV 9(e)) : pas de remplacement à l’identique en R410A.', 'Los sistemas partidos nuevos > 12 kW con GWP ≥ 750 se prohíben desde 2029 (anexo IV 9(e)): no cabe sustituir igual por igual con R410A.', 'Nowe systemy split > 12 kW z GWP ≥ 750 zakazane od 2029 (załącznik IV 9(e)): wymiana „jeden do jednego” na R410A niemożliwa.'),
  l4l_banned_split_gwp150_2033: T7('From 2033 new split systems > 12 kW need GWP < 150 (Annex IV 9(f)).', 'З 2033 нові спліт-системи > 12 кВт мають мати GWP < 150 (додаток IV 9(f)).', 'Ab 2033 brauchen neue Split-Systeme > 12 kW ein GWP < 150 (Anhang IV 9(f)).', 'Vanaf 2033 moeten nieuwe splitsystemen > 12 kW GWP < 150 hebben (bijlage IV 9(f)).', 'Dès 2033 les systèmes split neufs > 12 kW doivent avoir un GWP < 150 (annexe IV 9(f)).', 'Desde 2033 los sistemas partidos nuevos > 12 kW necesitan GWP < 150 (anexo IV 9(f)).', 'Od 2033 nowe systemy split > 12 kW muszą mieć GWP < 150 (załącznik IV 9(f)).'),
  l4l_banned_hp_2027: T7('Self-contained heat pumps up to 50 kW with GWP ≥ 150 are banned from 2027 (Annex IV 8(b),(d)); split units follow Annex IV 9.', 'Моноблочні теплові насоси до 50 кВт з GWP ≥ 150 заборонені з 2027 (додаток IV 8(b),(d)); спліт — за додатком IV 9.', 'Kompakte Wärmepumpen bis 50 kW mit GWP ≥ 150 sind ab 2027 verboten (Anhang IV 8(b),(d)); Split-Geräte nach Anhang IV 9.', 'Compacte warmtepompen tot 50 kW met GWP ≥ 150 zijn verboden vanaf 2027 (bijlage IV 8(b),(d)); split volgens bijlage IV 9.', 'Les PAC monobloc jusqu’à 50 kW au GWP ≥ 150 sont interdites dès 2027 (annexe IV 8(b),(d)) ; les split suivent l’annexe IV 9.', 'Las bombas de calor compactas hasta 50 kW con GWP ≥ 150 se prohíben desde 2027 (anexo IV 8(b),(d)); las partidas siguen el anexo IV 9.', 'Pompy ciepła monoblok do 50 kW z GWP ≥ 150 zakazane od 2027 (załącznik IV 8(b),(d)); split wg załącznika IV 9.'),
  l4l_banned_hp_2030: T7('Self-contained heat pumps > 50 kW with GWP ≥ 150 are banned from 2030 (Annex IV 8(e)); split units follow Annex IV 9.', 'Моноблочні теплові насоси > 50 кВт з GWP ≥ 150 заборонені з 2030 (додаток IV 8(e)); спліт — за додатком IV 9.', 'Kompakte Wärmepumpen > 50 kW mit GWP ≥ 150 sind ab 2030 verboten (Anhang IV 8(e)); Split-Geräte nach Anhang IV 9.', 'Compacte warmtepompen > 50 kW met GWP ≥ 150 zijn verboden vanaf 2030 (bijlage IV 8(e)); split volgens bijlage IV 9.', 'Les PAC monobloc > 50 kW au GWP ≥ 150 sont interdites dès 2030 (annexe IV 8(e)) ; les split suivent l’annexe IV 9.', 'Las bombas de calor compactas > 50 kW con GWP ≥ 150 se prohíben desde 2030 (anexo IV 8(e)); las partidas siguen el anexo IV 9.', 'Pompy ciepła monoblok > 50 kW z GWP ≥ 150 zakazane od 2030 (załącznik IV 8(e)); split wg załącznika IV 9.'),

function tx(k) { return I18N[k] || R[k] || { en: k }; }

function pick(o) { var l = curLang(); return (o && o[l]) || (o && o.en) || String(o == null ? '' : o); }
function S(k, subs) { var s = pick(tx(k)); if (subs) Object.keys(subs).sort(function (a, b) { return b.length - a.length; }).forEach(function (p) { s = s.split('%' + p).join(subs[p]); }); return s; }
function U(k) { return function () { return pick(tx(k)); }; }
var LOCALE = { en: 'en-GB', uk: 'uk-UA', de: 'de-DE', nl: 'nl-NL', fr: 'fr-FR', es: 'es-ES', pl: 'pl-PL' };
function fmt(v, d) { if (v == null || !isFinite(v)) return '—'; if (CORE && typeof CORE.fmt === 'function') { try { return CORE.fmt(v, curLang(), d); } catch (e) { /* fall through */ } } return Number(v).toLocaleString(LOCALE[curLang()] || 'en-GB', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
function eur(v) { return v == null || !isFinite(v) ? '—' : fmt(Math.round(v), 0) + ' EUR'; }
function keur(v) { return v == null || !isFinite(v) ? '—' : fmt(v / 1000, v >= 100000 || v === 0 || v % 1000 === 0 ? 0 : 1) + ' ' + S('u.k'); }
function clone(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
function className(id) { var c = CORE && CORE.CLASSES && CORE.CLASSES[id]; return c && c.name ? pick(c.name) : String(id || '—'); }
function classOptions() { var ids = (CORE && CORE.CLASSES) ? Object.keys(CORE.CLASSES) : CLASS_IDS.slice(); return ids.map(function (k) { return { value: k, label: function () { return className(k); } }; }); }
function opts(prefix, keys) { return keys.map(function (k) { return { value: k, label: tx(prefix + k) }; }); }
/* demo names: life presets carry `names`; core sites carry name_i18n (MEPCore.assetName, QA-21); an edited name wins */
function assetLabel(a) {
  if (a.names) return pick(a.names);
  if (CORE && typeof CORE.assetName === 'function') { try { var n = CORE.assetName(a, curLang()); if (n && n !== a.id) return n; } catch (e) { /* fall back */ } }

var LEARN = { version: 1,
  intro: T7('Renewal planning in four ideas: effective age from condition, a trigger by criticality, legal and supply dates for refrigerants, and a budget cap that moves cost into a backlog with risk.', 'Планування оновлення в чотирьох ідеях: ефективний вік за станом, поріг за критичністю, законні дати й доступність холодоагентів і бюджетний ліміт, що переносить витрати у відставання з ризиком.', 'Erneuerungsplanung in vier Gedanken: effektives Alter aus dem Zustand, eine Schwelle nach Kritikalität, gesetzliche und Versorgungstermine für Kältemittel und eine Budgetgrenze, die Kosten mit Risiko in einen Rückstau schiebt.', 'Vervangingsplanning in vier ideeën: effectieve leeftijd uit conditie, een drempel volgens kriticiteit, wettelijke en leveringsdata voor koudemiddelen en een budgetplafond dat kosten met risico naar een achterstand schuift.', 'La planification du renouvellement en quatre idées : âge effectif d’après l’état, seuil selon la criticité, échéances légales et d’approvisionnement des fluides, et un plafond budgétaire qui reporte le coût dans un arriéré avec du risque.', 'La planificación de la renovación en cuatro ideas: edad efectiva según el estado, umbral según la criticidad, fechas legales y de suministro de refrigerantes y un tope presupuestario que pasa el coste a un retraso con riesgo.', 'Planowanie odnowy w czterech myślach: wiek efektywny ze stanu, próg wg krytyczności, terminy prawne i dostępność czynników oraz limit budżetu, który przenosi koszt do zaległości z ryzykiem.'),
  topics: {
    effective_age: { title: T7('Effective age: condition first', 'Ефективний вік: спершу стан', 'Effektives Alter: zuerst der Zustand', 'Effectieve leeftijd: eerst de conditie', 'Âge effectif : l’état d’abord', 'Edad efectiva: primero el estado', 'Wiek efektywny: najpierw stan'),
      body: T7('The condition grade is turned into a consumed share of the economic life (grade 1 → 10 %, 2 → 35 %, 3 → 60 %, 4 → 90 %, 5 → 110 %). How much this replaces the calendar age depends on the evidence: a measured grade replaces it fully, a documented one by 80 %, an assumed one by half. Three or more unplanned failures in three years count as grade 4. So a 28-year-old boiler in good measured condition is "younger" than an 8-year-old one that keeps tripping. Without any grade the asset is "survey needed": an indicative year from age, no money in the profile.', 'Оцінка стану перетворюється на спрацьовану частку строку економічної служби (оцінка 1 → 10 %, 2 → 35 %, 3 → 60 %, 4 → 90 %, 5 → 110 %). Наскільки вона замінює календарний вік, залежить від даних: виміряна оцінка замінює повністю, задокументована — на 80 %, припущена — наполовину. Три чи більше позапланових відмови за три роки вважаються оцінкою 4. Тож 28-річний котел у доброму виміряному стані «молодший» за 8-річний, що постійно відмовляє. Без жодної оцінки одиниця позначається «потрібне обстеження»: орієнтовний рік за віком, без грошей у профілі.', 'Die Zustandsnote wird in einen verbrauchten Anteil der Nutzungsdauer übersetzt (Note 1 → 10 %, 2 → 35 %, 3 → 60 %, 4 → 90 %, 5 → 110 %). Wie stark sie das Kalenderalter ersetzt, hängt vom Nachweis ab: eine gemessene Note ersetzt es ganz, eine dokumentierte zu 80 %, eine angenommene zur Hälfte. Drei oder mehr ungeplante Ausfälle in drei Jahren zählen als Note 4. Ein 28 Jahre alter Kessel in gutem gemessenem Zustand ist so „jünger“ als ein 8 Jahre alter, der ständig auslöst. Ohne jede Note gilt die Anlage als „Begehung nötig“: ein Richtjahr nach Alter, kein Geld im Profil.', 'De conditiescore wordt omgezet in een verbruikt deel van de economische levensduur (score 1 → 10 %, 2 → 35 %, 3 → 60 %, 4 → 90 %, 5 → 110 %). Hoeveel die de kalenderleeftijd vervangt, hangt af van de onderbouwing: een gemeten score volledig, een gedocumenteerde voor 80 %, een aangenomen voor de helft. Drie of meer ongeplande storingen in drie jaar tellen als score 4. Zo is een ketel van 28 jaar in goede gemeten staat ‘jonger’ dan een van 8 jaar die steeds uitvalt. Zonder enige score is de installatie ‘inspectie nodig’: een indicatief jaar op leeftijd, geen geld in het profiel.', 'La note d’état est traduite en part consommée de la durée de vie économique (note 1 → 10 %, 2 → 35 %, 3 → 60 %, 4 → 90 %, 5 → 110 %). La part dont elle remplace l’âge calendaire dépend des éléments : une note mesurée le remplace entièrement, documentée à 80 %, supposée à moitié. Trois pannes imprévues ou plus en trois ans valent une note 4. Une chaudière de 28 ans en bon état mesuré est ainsi « plus jeune » qu’une de 8 ans qui disjoncte sans cesse. Sans aucune note, l’équipement est « état des lieux requis » : une année indicative d’après l’âge, aucun montant dans le profil.', 'La nota de estado se traduce en una parte consumida de la vida útil (nota 1 → 10 %, 2 → 35 %, 3 → 60 %, 4 → 90 %, 5 → 110 %). Cuánto sustituye a la edad depende de la evidencia: una nota medida la sustituye del todo, una documentada en un 80 %, una supuesta a medias. Tres o más fallos imprevistos en tres años cuentan como nota 4. Así una caldera de 28 años en buen estado medido es «más joven» que una de 8 que no deja de fallar. Sin ninguna nota el equipo queda como «inspección necesaria»: un año indicativo por edad, sin dinero en el perfil.', 'Ocena stanu jest zamieniana na zużytą część okresu użytkowania (ocena 1 → 10 %, 2 → 35 %, 3 → 60 %, 4 → 90 %, 5 → 110 %). Na ile zastępuje wiek kalendarzowy, zależy od danych: ocena zmierzona w całości, udokumentowana w 80 %, przyjęta w połowie. Trzy lub więcej nieplanowanych awarii w trzy lata liczą się jak ocena 4. Tak 28-letni kocioł w dobrym zmierzonym stanie jest „młodszy” od 8-letniego, który ciągle się wyłącza. Bez żadnej oceny urządzenie ma status „potrzebny przegląd”: orientacyjny rok z wieku, bez pieniędzy w profilu.') },
    trigger: { title: T7('Trigger by criticality', 'Поріг за критичністю', 'Schwelle nach Kritikalität', 'Drempel volgens kriticiteit', 'Seuil selon la criticité', 'Umbral según la criticidad', 'Próg wg krytyczności'),
      body: T7('A class A asset is renewed when its effective age reaches 90 % of its economic life, class B at 100 %, class C at 115 % (it may run towards failure). The class comes from MEP Asset Criticality — from its results in the register after you press Use in the register bar, otherwise computed live; without it B is assumed and marked. The range shown uses the low and high life of the class library.', 'Одиницю класу A оновлюють, коли її ефективний вік досягає 90 % строку економічної служби, клас B — 100 %, клас C — 115 % (може працювати до відмови). Клас береться з «Критичності обладнання» — з її результатів у реєстрі після натискання «Використати» на панелі реєстру, інакше обчислюється наживо; без нього припускається B і позначається. Показаний діапазон використовує нижній і верхній строк із бібліотеки класів.', 'Eine Anlage der Klasse A wird erneuert, wenn ihr effektives Alter 90 % der Nutzungsdauer erreicht, Klasse B bei 100 %, Klasse C bei 115 % (sie darf auf Ausfall laufen). Die Klasse kommt aus der Anlagenkritikalität — aus ihren Ergebnissen im Register, nachdem Sie in der Registerleiste „Übernehmen“ gewählt haben, sonst live berechnet; ohne sie wird B angenommen und markiert. Die angezeigte Spanne nutzt die untere und obere Dauer der Klassenbibliothek.', 'Een installatie van klasse A wordt vervangen als haar effectieve leeftijd 90 % van de levensduur bereikt, klasse B bij 100 %, klasse C bij 115 % (mag naar storing toe draaien). De klasse komt uit Kriticiteit installaties — uit haar resultaten in het register nadat u ‘Gebruiken’ in de registerbalk kiest, anders live berekend; zonder klasse wordt B aangenomen en gemarkeerd. De getoonde bandbreedte gebruikt de lage en hoge levensduur van de klassenbibliotheek.', 'Un équipement de classe A est renouvelé quand son âge effectif atteint 90 % de sa durée de vie, la classe B à 100 %, la classe C à 115 % (elle peut aller jusqu’à la panne). La classe vient de Criticité des équipements — de ses résultats dans le registre après « Utiliser » dans la barre du registre, sinon calculée en direct ; sans elle, B est supposée et signalée. La plage affichée utilise les durées basse et haute de la bibliothèque.', 'Un equipo de clase A se renueva cuando su edad efectiva alcanza el 90 % de su vida útil, la clase B al 100 %, la clase C al 115 % (puede llegar al fallo). La clase viene de Criticidad de activos — de sus resultados en el registro tras pulsar «Usar» en la barra del registro, si no se calcula en directo; sin ella se supone B y se marca. El rango mostrado usa la vida baja y alta de la biblioteca de clases.', 'Urządzenie klasy A odnawia się, gdy wiek efektywny osiąga 90 % okresu użytkowania, klasy B przy 100 %, klasy C przy 115 % (może pracować do awarii). Klasa pochodzi z Krytyczności urządzeń — z jej wyników w rejestrze po naciśnięciu „Użyj” na pasku rejestru, w przeciwnym razie liczona na bieżąco; bez niej przyjmuje się B i oznacza. Pokazany zakres używa dolnego i górnego okresu z biblioteki klas.') },
    refrigerant: { title: T7('Refrigerants: law vs supply', 'Холодоагенти: закон і постачання', 'Kältemittel: Gesetz und Versorgung', 'Koudemiddelen: wet en levering', 'Fluides : la loi et l’approvisionnement', 'Refrigerantes: ley y suministro', 'Czynniki: prawo i dostawy'),
      body: T7('Hard dates come from the law: no HCFC (R22) for servicing since 2015; in air conditioning and heat pumps, gases with GWP ≥ 2500 (R404A, R507A) may be serviced only with reclaimed or recycled gas from 2026 and not at all from 2032 (Reg. (EU) 2024/573 Art. 13(4)); in refrigeration from 2025 / 2030 (Art. 13(3)). R410A (GWP 2088), R407C (1774) and R134a (1430) have no servicing ban: their date is a planning horizon from the HFC quota, which falls to about 21 % of the 2025 level in 2030 (Annex VII). That date is soft and editable per asset. New equipment with these gases often cannot be bought any more (Annex IV), so a renewal also means a refrigerant change.', 'Тверді дати дає закон: ГХФВ (R22) для обслуговування заборонені з 2015; у кондиціонуванні й теплових насосах гази з GWP ≥ 2500 (R404A, R507A) з 2026 можна обслуговувати лише відновленим чи рециркульованим газом, а з 2032 — зовсім ні (Регл. (ЄС) 2024/573 ст. 13(4)); у холодильному обладнанні — з 2025 / 2030 (ст. 13(3)). R410A (GWP 2088), R407C (1774) і R134a (1430) заборони обслуговування не мають: їхня дата — плановий горизонт за квотою ГФВ, що у 2030 падає приблизно до 21 % рівня 2025 (додаток VII). Ця дата м’яка й редагується для кожної одиниці. Нове обладнання на цих газах часто вже не можна купити (додаток IV), тож оновлення означає й зміну холодоагенту.', 'Feste Termine kommen aus dem Gesetz: kein H-FCKW (R22) zur Wartung seit 2015; in Klima- und Wärmepumpenanlagen dürfen Gase mit GWP ≥ 2500 (R404A, R507A) ab 2026 nur mit aufgearbeitetem oder recyceltem Gas und ab 2032 gar nicht mehr gewartet werden (VO (EU) 2024/573 Art. 13(4)); in Kälteanlagen ab 2025 / 2030 (Art. 13(3)). R410A (GWP 2088), R407C (1774) und R134a (1430) haben kein Wartungsverbot: ihr Datum ist ein Planungshorizont aus der HFKW-Quote, die 2030 auf etwa 21 % des Werts von 2025 sinkt (Anhang VII). Dieses Datum ist weich und je Anlage änderbar. Neue Geräte mit diesen Gasen sind oft nicht mehr erhältlich (Anhang IV), eine Erneuerung bedeutet also auch einen Kältemittelwechsel.', 'Vaste data komen uit de wet: geen HCFK (R22) voor onderhoud sinds 2015; in airconditioning en warmtepompen mogen gassen met GWP ≥ 2500 (R404A, R507A) vanaf 2026 alleen met geregenereerd of gerecycled gas en vanaf 2032 helemaal niet meer worden onderhouden (Vo. (EU) 2024/573 art. 13(4)); in koelinstallaties vanaf 2025 / 2030 (art. 13(3)). R410A (GWP 2088), R407C (1774) en R134a (1430) hebben geen onderhoudsverbod: hun datum is een planningshorizon uit het HFK-quotum, dat in 2030 daalt tot ongeveer 21 % van 2025 (bijlage VII). Die datum is zacht en per installatie aanpasbaar. Nieuwe apparatuur met deze gassen is vaak niet meer te koop (bijlage IV), dus vervangen betekent ook een ander koudemiddel.', 'Les dates fermes viennent de la loi : plus de HCFC (R22) pour l’entretien depuis 2015 ; en climatisation et pompes à chaleur, les fluides au GWP ≥ 2500 (R404A, R507A) ne peuvent être entretenus qu’au fluide régénéré ou recyclé dès 2026 et plus du tout dès 2032 (règl. (UE) 2024/573 art. 13(4)) ; en froid dès 2025 / 2030 (art. 13(3)). R410A (GWP 2088), R407C (1774) et R134a (1430) ne sont pas interdits à l’entretien : leur date est un horizon de planification tiré du quota HFC, qui tombe vers 21 % du niveau 2025 en 2030 (annexe VII). Cette date est souple et modifiable par équipement. Les équipements neufs à ces fluides ne sont souvent plus vendus (annexe IV) : renouveler implique donc de changer de fluide.', 'Las fechas fijas vienen de la ley: sin HCFC (R22) para mantenimiento desde 2015; en climatización y bombas de calor, los gases con GWP ≥ 2500 (R404A, R507A) solo pueden mantenerse con gas regenerado o reciclado desde 2026 y en absoluto desde 2032 (Regl. (UE) 2024/573 art. 13(4)); en refrigeración desde 2025 / 2030 (art. 13(3)). R410A (GWP 2088), R407C (1774) y R134a (1430) no tienen prohibición de mantenimiento: su fecha es un horizonte de planificación según la cuota de HFC, que cae a cerca del 21 % del nivel de 2025 en 2030 (anexo VII). Esa fecha es flexible y editable por equipo. Los equipos nuevos con estos gases a menudo ya no se venden (anexo IV), así que renovar implica también cambiar de refrigerante.', 'Sztywne terminy wynikają z prawa: brak HCFC (R22) do serwisu od 2015; w klimatyzacji i pompach ciepła gazy o GWP ≥ 2500 (R404A, R507A) od 2026 wolno serwisować tylko czynnikiem regenerowanym lub z recyklingu, a od 2032 wcale (rozp. (UE) 2024/573 art. 13 ust. 4); w chłodnictwie od 2025 / 2030 (art. 13 ust. 3). R410A (GWP 2088), R407C (1774) i R134a (1430) nie mają zakazu serwisu: ich data to horyzont planistyczny z kontyngentu HFC, który w 2030 spada do ok. 21 % poziomu z 2025 (załącznik VII). Ta data jest miękka i edytowalna dla każdego urządzenia. Nowych urządzeń z tymi gazami często nie można już kupić (załącznik IV), więc odnowa oznacza też zmianę czynnika.') },
    profile: { title: T7('The 25-year profile', '25-річний профіль', 'Das 25-Jahres-Profil', 'Het profiel over 25 jaar', 'Le profil sur 25 ans', 'El perfil a 25 años', 'Profil na 25 lat'),
      body: T7('Each asset is renewed in its year and then again every cycle of a new asset (trigger × life) inside the horizon. Bars show the need per year in real euros of the plan year; nothing is escalated or discounted — the present-value comparison of one asset is the job of Repair or Replace. Click a year to select its first renewal.', 'Кожна одиниця оновлюється у свій рік, а потім знову кожен цикл нової одиниці (поріг × строк) у межах горизонту. Стовпці показують потребу за рік у реальних євро планового року; нічого не індексується й не дисконтується — порівняння за теперішньою вартістю однієї одиниці робить «Ремонт чи заміна». Клацніть рік, щоб вибрати перше оновлення в ньому.', 'Jede Anlage wird in ihrem Jahr erneuert und dann in jedem Zyklus einer neuen Anlage (Schwelle × Dauer) innerhalb des Horizonts. Die Balken zeigen den Bedarf je Jahr in realen Euro des Planjahres; nichts wird indexiert oder abgezinst — der Barwertvergleich einer Anlage ist Aufgabe von „Reparieren oder ersetzen“. Ein Jahr anklicken wählt seine erste Erneuerung.', 'Elke installatie wordt in haar jaar vervangen en daarna elke cyclus van een nieuwe installatie (drempel × levensduur) binnen de horizon. De staven tonen de behoefte per jaar in reële euro’s van het planjaar; niets wordt geïndexeerd of verdisconteerd — de contantewaardevergelijking van één installatie is het werk van ‘Repareren of vervangen’. Klik op een jaar om de eerste vervanging erin te kiezen.', 'Chaque équipement est renouvelé dans son année puis à chaque cycle d’un équipement neuf (seuil × durée) dans l’horizon. Les barres montrent le besoin annuel en euros constants de l’année du plan ; rien n’est indexé ni actualisé — la comparaison en valeur actuelle d’un équipement relève de « Réparer ou remplacer ». Cliquez une année pour sélectionner son premier renouvellement.', 'Cada equipo se renueva en su año y luego en cada ciclo de un equipo nuevo (umbral × vida) dentro del horizonte. Las barras muestran la necesidad anual en euros constantes del año del plan; nada se actualiza ni se descuenta — la comparación en valor actual de un equipo es tarea de «Reparar o sustituir». Pulse un año para seleccionar su primera renovación.', 'Każde urządzenie odnawia się w swoim roku, a potem w każdym cyklu nowego urządzenia (próg × okres) w horyzoncie. Słupki pokazują potrzeby roczne w realnych euro roku planu; nic nie jest waloryzowane ani dyskontowane — porównanie wartości bieżącej jednego urządzenia to zadanie „Naprawić czy wymienić”. Kliknij rok, aby wybrać pierwszą odnowę w nim.') },
    cap: { title: T7('A cap moves cost, it does not remove it', 'Ліміт переносить витрати, а не прибирає їх', 'Eine Grenze verschiebt Kosten, sie beseitigt sie nicht', 'Een plafond verschuift kosten, het haalt ze niet weg', 'Un plafond déplace le coût, il ne le supprime pas', 'Un tope mueve el coste, no lo elimina', 'Limit przesuwa koszt, nie usuwa go'),
      body: T7('With a cap the tool goes year by year: renewals that cannot wait (class A, a legal date reached) are done first even if the cap is exceeded; the rest in the order A > B > C and highest risk cost first; what does not fit waits for next year. A renewal larger than the whole cap is done alone in its year. The purple line is the backlog of renewals already due but waiting — its peak is the "wall". With a reserve fund the unspent budget carries over.', 'З лімітом інструмент іде рік за роком: оновлення, що не можуть чекати (клас A, настала законна дата), виконуються першими навіть із перевищенням ліміту; решта — у порядку A > B > C і за найбільшою вартістю ризику; що не вміщується, чекає наступного року. Оновлення, більше за весь ліміт, виконується окремо у своєму році. Фіолетова лінія — відставання вже належних, але відкладених оновлень; її пік — «стіна». З резервним фондом невикористаний бюджет переходить далі.', 'Mit einer Grenze geht das Werkzeug Jahr für Jahr vor: Erneuerungen, die nicht warten können (Klasse A, erreichter gesetzlicher Termin), kommen zuerst, auch über die Grenze; der Rest in der Reihenfolge A > B > C und höchste Risikokosten zuerst; was nicht passt, wartet aufs nächste Jahr. Eine Erneuerung, die größer als die ganze Grenze ist, wird allein in ihrem Jahr ausgeführt. Die violette Linie ist der Rückstau fälliger, aber wartender Erneuerungen — ihre Spitze ist die „Wand“. Mit Rücklage wird nicht verbrauchtes Budget übertragen.', 'Met een plafond gaat de tool jaar na jaar: vervangingen die niet kunnen wachten (klasse A, wettelijke datum bereikt) eerst, ook boven het plafond; de rest in de volgorde A > B > C en hoogste risicokosten eerst; wat niet past, wacht een jaar. Een vervanging groter dan het hele plafond wordt alleen in haar jaar uitgevoerd. De paarse lijn is de achterstand van vervangingen die al aan de beurt zijn maar wachten — de piek is de ‘muur’. Met een reservefonds schuift niet besteed budget door.', 'Avec un plafond l’outil avance année par année : les renouvellements qui ne peuvent attendre (classe A, date légale atteinte) passent d’abord, même au-delà du plafond ; le reste dans l’ordre A > B > C et coût de risque le plus élevé d’abord ; ce qui ne rentre pas attend l’année suivante. Un renouvellement plus grand que tout le plafond est fait seul dans son année. La ligne violette est l’arriéré des renouvellements dus mais en attente — son pic est le « mur ». Avec un fonds de réserve, le budget non dépensé est reporté.', 'Con un tope la herramienta avanza año a año: las renovaciones que no pueden esperar (clase A, fecha legal alcanzada) van primero aunque se supere el tope; el resto en el orden A > B > C y mayor coste de riesgo primero; lo que no cabe espera al año siguiente. Una renovación mayor que todo el tope se hace sola en su año. La línea morada es el retraso de renovaciones ya debidas pero en espera — su pico es el «muro». Con un fondo de reserva el presupuesto no gastado pasa al año siguiente.', 'Z limitem narzędzie idzie rok po roku: odnowy, które nie mogą czekać (klasa A, osiągnięty termin prawny), idą pierwsze nawet ponad limit; reszta w kolejności A > B > C i najwyższy koszt ryzyka najpierw; co się nie mieści, czeka na kolejny rok. Odnowa większa niż cały limit jest wykonywana osobno w swoim roku. Fioletowa linia to zaległość odnów już należnych, ale czekających — jej szczyt to „ściana”. Z funduszem rezerwowym niewydany budżet przechodzi dalej.') },
    risk: { title: T7('The risk added by waiting', 'Ризик, доданий очікуванням', 'Das Risiko des Wartens', 'Het risico van wachten', 'Le risque ajouté par l’attente', 'El riesgo añadido por esperar', 'Ryzyko dodane przez czekanie'),
      body: T7('For each year a renewal waits, the old machine has a higher chance of a major failure than a new one. The tool uses a Weibull wear-out curve with shape 3 and scale equal to the economic life (a learning assumption) and multiplies the extra failure rate by the cost of one event: 15 % of the replacement cost for the repair plus downtime cost × repair time (zero downtime when tested redundancy covers it). The result is an expected value in euros for comparing options, not a forecast.', 'За кожен рік очікування стара машина має більший шанс серйозної відмови, ніж нова. Інструмент використовує криву зносу Вейбулла з формою 3 і масштабом, що дорівнює строку служби (навчальне припущення), і множить надлишкову частоту відмов на вартість однієї події: 15 % вартості заміни на ремонт плюс вартість простою × час ремонту (без простою, коли його покриває випробуваний резерв). Результат — очікуване значення в євро для порівняння варіантів, а не прогноз.', 'Für jedes Jahr des Wartens hat die alte Maschine eine höhere Wahrscheinlichkeit eines schweren Ausfalls als eine neue. Das Werkzeug nutzt eine Weibull-Verschleißkurve mit Form 3 und Skala gleich der Nutzungsdauer (Lernannahme) und multipliziert die zusätzliche Ausfallrate mit den Kosten eines Ereignisses: 15 % der Ersatzkosten für die Reparatur plus Ausfallkosten × Reparaturzeit (null, wenn getestete Redundanz sie abdeckt). Das Ergebnis ist ein Erwartungswert in Euro zum Vergleichen, keine Prognose.', 'Voor elk jaar dat een vervanging wacht, heeft de oude machine meer kans op een zware storing dan een nieuwe. De tool gebruikt een Weibull-slijtagecurve met vorm 3 en schaal gelijk aan de levensduur (leeraanname) en vermenigvuldigt de extra storingsfrequentie met de kosten van één gebeurtenis: 15 % van de vervangingskosten voor de reparatie plus uitvalkosten × reparatietijd (nul als geteste redundantie die dekt). Het resultaat is een verwachtingswaarde in euro om te vergelijken, geen voorspelling.', 'Pour chaque année d’attente, la vieille machine a plus de chances d’une panne majeure qu’une neuve. L’outil utilise une courbe d’usure de Weibull de forme 3 et d’échelle égale à la durée de vie (hypothèse pédagogique) et multiplie le surcroît de taux de panne par le coût d’un événement : 15 % du coût de remplacement pour la réparation plus coût d’arrêt × durée de réparation (nul si une redondance essayée le couvre). Le résultat est une espérance en euros pour comparer, pas une prévision.', 'Por cada año de espera, la máquina vieja tiene más probabilidad de un fallo grave que una nueva. La herramienta usa una curva de desgaste de Weibull de forma 3 y escala igual a la vida útil (supuesto didáctico) y multiplica el exceso de tasa de fallos por el coste de un suceso: 15 % del coste de sustitución para la reparación más coste de parada × tiempo de reparación (cero si una redundancia probada lo cubre). El resultado es un valor esperado en euros para comparar, no un pronóstico.', 'Za każdy rok czekania stara maszyna ma większą szansę poważnej awarii niż nowa. Narzędzie używa krzywej zużycia Weibulla o kształcie 3 i skali równej okresowi użytkowania (założenie dydaktyczne) i mnoży nadwyżkę intensywności awarii przez koszt jednego zdarzenia: 15 % kosztu wymiany na naprawę plus koszt przestoju × czas naprawy (zero, gdy sprawdzona rezerwa go pokrywa). Wynik to wartość oczekiwana w euro do porównań, nie prognoza.') },
    bundles: { title: T7('Bundles', 'Пакети', 'Pakete', 'Bundels', 'Lots', 'Paquetes', 'Pakiety'),
      body: T7('Assets with the same bundle tag whose renewal years lie within the window can be done as one project (one crane, one shutdown, one design). The tool tries each member’s year as the common year and takes the best net value = saving (default 10 % of each member’s cost) − life given up by those brought forward − risk added to those delayed. A member past a legal date cannot be delayed. If the best net is not positive, they stay apart.', 'Одиниці з однаковою міткою пакета, роки оновлення яких лежать у вікні, можна виконати одним проєктом (один кран, одна зупинка, один проєкт). Інструмент пробує рік кожного члена як спільний і бере найкращу чисту вигоду = економія (типово 10 % вартості кожного) − ресурс, втрачений тими, кого зсунуто раніше, − ризик, доданий тим, кого відкладено. Члена після законної дати відкласти не можна. Якщо найкраща чиста вигода не додатна, вони лишаються окремо.', 'Anlagen mit gleicher Paketkennung, deren Erneuerungsjahre im Fenster liegen, können als ein Projekt laufen (ein Kran, eine Abschaltung, eine Planung). Das Werkzeug probiert das Jahr jedes Mitglieds als gemeinsames Jahr und nimmt den besten Nettowert = Ersparnis (Vorgabe 10 % der Kosten je Mitglied) − aufgegebene Lebensdauer der vorgezogenen − zusätzliches Risiko der verschobenen. Ein Mitglied hinter einem gesetzlichen Termin kann nicht verschoben werden. Ist der beste Nettowert nicht positiv, bleiben sie getrennt.', 'Installaties met hetzelfde bundellabel waarvan de vervangingsjaren binnen het venster liggen, kunnen als één project (één kraan, één stillegging, één ontwerp). De tool probeert het jaar van elk lid als gezamenlijk jaar en neemt de beste nettowaarde = besparing (standaard 10 % van de kosten per lid) − opgegeven levensduur van de vervroegde − toegevoegd risico van de uitgestelde. Een lid voorbij een wettelijke datum kan niet worden uitgesteld. Is de beste nettowaarde niet positief, dan blijven ze apart.', 'Les équipements de même étiquette dont les années tombent dans la fenêtre peuvent faire un seul projet (une grue, un arrêt, une étude). L’outil essaie l’année de chaque membre comme année commune et retient le meilleur gain net = économie (10 % du coût de chaque membre par défaut) − vie abandonnée par ceux qui sont avancés − risque ajouté à ceux qui sont retardés. Un membre au-delà d’une date légale ne peut être retardé. Si le meilleur gain net n’est pas positif, ils restent séparés.', 'Los equipos con la misma etiqueta cuyos años de renovación caen en la ventana pueden hacerse como un proyecto (una grúa, una parada, un diseño). La herramienta prueba el año de cada miembro como año común y toma el mejor valor neto = ahorro (por defecto 10 % del coste de cada miembro) − vida perdida por los adelantados − riesgo añadido a los retrasados. Un miembro pasada una fecha legal no puede retrasarse. Si el mejor neto no es positivo, quedan separados.', 'Urządzenia z tym samym znacznikiem pakietu, których lata odnowy mieszczą się w oknie, można zrobić jako jeden projekt (jeden dźwig, jeden postój, jeden projekt). Narzędzie próbuje roku każdego członka jako wspólnego i wybiera najlepszą wartość netto = oszczędność (domyślnie 10 % kosztu każdego) − trwałość utracona przez przyspieszone − ryzyko dodane opóźnionym. Członka po terminie prawnym nie można opóźnić. Jeśli najlepsza wartość netto nie jest dodatnia, zostają osobno.') },
    handoff: { title: T7('Where to go next', 'Куди далі', 'Wie es weitergeht', 'Waar verder', 'Pour aller plus loin', 'Cómo seguir', 'Co dalej'),
      body: T7('This planner works on the whole fleet. For one asset, Repair or Replace compares keeping, overhauling and replacing in present value; the generator shortlist proposes a replacement chiller, boiler or heat pump of the same output; Last-time buy sizes a final stock of an obsolete part when support ends. The register (with these renewal results) is shared with the other MEP maintenance tools.', 'Цей планувальник працює з усім парком. Для однієї одиниці «Ремонт чи заміна» порівнює експлуатацію, капремонт і заміну за теперішньою вартістю; підбір генераторів пропонує чилер, котел або тепловий насос на заміну тієї ж потужності; «Остання закупівля» визначає запас застарілої деталі, коли підтримка закінчується. Реєстр (з цими результатами оновлення) спільний з іншими інструментами обслуговування MEP.', 'Dieser Planer arbeitet am ganzen Bestand. Für eine Anlage vergleicht „Reparieren oder ersetzen“ Weiterbetrieb, Überholung und Ersatz im Barwert; die Erzeugerauswahl schlägt einen Ersatz-Kaltwassersatz, -Kessel oder eine Wärmepumpe gleicher Leistung vor; die Letztbevorratung bemisst den Endbestand eines abgekündigten Teils bei Supportende. Das Register (mit diesen Ergebnissen) ist mit den anderen TGA-Instandhaltungswerkzeugen geteilt.', 'Deze planner werkt op het hele bestand. Voor één installatie vergelijkt ‘Repareren of vervangen’ doorgaan, reviseren en vervangen in contante waarde; de opwekkerselectie stelt een vervangende koelmachine, ketel of warmtepomp van hetzelfde vermogen voor; ‘Laatste aankoop’ bepaalt de eindvoorraad van een verouderd onderdeel bij einde ondersteuning. Het register (met deze resultaten) wordt gedeeld met de andere onderhoudstools.', 'Ce planificateur travaille sur tout le parc. Pour un équipement, « Réparer ou remplacer » compare maintien, rénovation et remplacement en valeur actuelle ; la présélection de générateurs propose un groupe froid, une chaudière ou une PAC de même puissance ; « Dernier achat » dimensionne le stock final d’une pièce obsolète en fin de support. Le registre (avec ces résultats) est partagé avec les autres outils de maintenance.', 'Este planificador trabaja sobre todo el parque. Para un equipo, «Reparar o sustituir» compara seguir, reacondicionar y sustituir en valor actual; la preselección de generadores propone una enfriadora, caldera o bomba de calor de igual potencia; «Última compra» dimensiona el stock final de una pieza obsoleta al acabar el soporte. El registro (con estos resultados) se comparte con las demás herramientas de mantenimiento.', 'Ten planer działa na całym parku. Dla jednego urządzenia „Naprawić czy wymienić” porównuje dalszą pracę, remont i wymianę w wartości bieżącej; dobór źródeł proponuje agregat, kocioł lub pompę ciepła tej samej mocy; „Ostatni zakup” wyznacza końcowy zapas wycofanej części przy końcu wsparcia. Rejestr (z tymi wynikami) jest wspólny z innymi narzędziami utrzymania.') }
  },
  tour: [{ topic: 'effective_age', focus: '[data-dgu-field="f-condition"]' }, { topic: 'trigger', focus: '.dgu-r-results' }, { topic: 'refrigerant', focus: '[data-dgu-field="f-refrigerant"]' },

function examples() {
  return presetIds().map(function (k) {
    var lab = PL[k] || [T7(k, k, k, k, k, k, k), T7('', '', '', '', '', '', '')];
