  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Hydrogen quantity, energy and fuel quality';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

              'El PCS (HHV, Hs) incluye el calor de condensación del agua formada; el PCI (LHV, Hi) no. En el hidrógeno la diferencia es grande: 141,9 frente a 119,9 MJ/kg a 15 °C según ISO 6976:2016. Las pilas de combustible, los motores y la normativa de la UE suelen usar el PCI (120 MJ/kg); las redes de gas facturan por PCS. Las impurezas reducen ligeramente ambos valores.',

            body: T(
              'Volumes use the real-gas density of hydrogen from the Leachman (2009) equation of state: 0.0899 kg/m³ at 0 °C and 0.0852 kg/m³ at 15 °C, with a compression factor of 1.0006. The ISO 6976 summation-factor method would give 0.9994, about 0.12 % off for pure hydrogen, so it is not used here for volumes. Traces of heavier gases raise the density in proportion to the molar mass.',

              'Los volúmenes usan la densidad real del hidrógeno según la ecuación de estado de Leachman (2009): 0,0899 kg/m³ a 0 °C y 0,0852 kg/m³ a 15 °C, con factor de compresibilidad 1,0006. El método de factores de suma de ISO 6976 daría 0,9994, un 0,12 % de desviación para hidrógeno puro, por lo que aquí no se usa para volúmenes. Las trazas de gases más pesados aumentan la densidad en proporción a la masa molar.',
              'Objętości wyznaczono z gęstości rzeczywistej wodoru wg równania stanu Leachmana (2009): 0,0899 kg/m³ w 0 °C i 0,0852 kg/m³ w 15 °C, przy współczynniku ściśliwości 1,0006. Metoda współczynników sumacyjnych ISO 6976 dałaby 0,9994, czyli około 0,12 % odchyłki dla czystego wodoru, dlatego nie jest tu stosowana do objętości. Śladowe cięższe gazy zwiększają gęstość proporcjonalnie do masy molowej.'

              'Äquivalente enthalten dieselbe Energie (Hi) mit den Standardwerten der Richtlinie (EU) 2018/2001 Anhang III: Diesel 43 MJ/kg und 36 MJ/L, Benzin 43 und 32, LPG 46 und 24, Methanol 20 und 16; Erdgas wird als Methan bei 15 °C angesetzt. Die CO₂-Spalte gibt die Emission bei Verbrennung dieses Brennstoffs an (IPCC-2006-Standardwerte); es ist ein Energie-gegen-Energie-Vergleich ohne den höheren Wirkungsgrad der Brennstoffzelle und ohne Vorkettenemissionen des Wasserstoffs.',
              'Equivalenten bevatten dezelfde LHV-energie, met de standaardwaarden van Richtlijn (EU) 2018/2001 bijlage III: diesel 43 MJ/kg en 36 MJ/L, benzine 43 en 32, LPG 46 en 24, methanol 20 en 16; aardgas wordt als methaan bij 15 °C genomen. De CO₂-kolom is wat verbranding van die brandstof zou uitstoten (IPCC 2006-standaardwaarden); het is een vergelijking energie tegen energie zonder het hogere rendement van brandstofcellen en zonder ketenemissies van waterstof.',
              'Les équivalents portent la même énergie PCI, avec les valeurs par défaut de la directive (UE) 2018/2001 annexe III : gazole 43 MJ/kg et 36 MJ/L, essence 43 et 32, GPL 46 et 24, méthanol 20 et 16 ; le gaz naturel est assimilé au méthane à 15 °C. La colonne CO₂ est l’émission de la combustion de ce carburant (valeurs par défaut GIEC 2006) ; la comparaison est énergie pour énergie, sans le meilleur rendement des piles ni les émissions amont de l’hydrogène.',
              'Los equivalentes contienen la misma energía en PCI, con los valores por defecto de la Directiva (UE) 2018/2001 anexo III: diésel 43 MJ/kg y 36 MJ/L, gasolina 43 y 32, GLP 46 y 24, metanol 20 y 16; el gas natural se toma como metano a 15 °C. La columna de CO₂ es lo que emitiría quemar ese combustible (valores por defecto del IPCC 2006); es una comparación energía por energía que ignora la mayor eficiencia de las pilas y las emisiones previas del hidrógeno.',

          poisons: {

            body: T(
              'CO, sulphur compounds, formaldehyde, formic acid and halogens adsorb on the platinum catalyst and poison the cell at very low levels; ammonia degrades the membrane; inert gases only dilute the fuel and build up in the anode loop. CO and sulphur are typical of hydrogen from reforming, oxygen and water of hydrogen from electrolysis, which is why the source decides the purification and analysis effort.',

              'CO, Schwefelverbindungen, Formaldehyd, Ameisensäure und Halogene adsorbieren am Platinkatalysator und vergiften die Zelle schon in sehr kleinen Mengen; Ammoniak schädigt die Membran; Inertgase verdünnen nur und reichern sich im Anodenkreislauf an. CO und Schwefel sind typisch für Wasserstoff aus Reformierung, Sauerstoff und Wasser für Elektrolysewasserstoff; daher bestimmt die Quelle den Reinigungs- und Analyseaufwand.',
              'CO, zwavelverbindingen, formaldehyde, mierenzuur en halogenen adsorberen op de platinakatalysator en vergiftigen de cel al bij zeer lage gehalten; ammoniak tast het membraan aan; inerte gassen verdunnen alleen en hopen zich op in de anodekringloop. CO en zwavel zijn typisch voor waterstof uit reforming, zuurstof en water voor elektrolysewaterstof; daarom bepaalt de bron de inspanning voor zuivering en analyse.',
              'Le CO, les composés soufrés, le formaldéhyde, l’acide formique et les halogènes s’adsorbent sur le catalyseur au platine et empoisonnent la pile à très faible teneur ; l’ammoniac dégrade la membrane ; les inertes ne font que diluer et s’accumulent dans la boucle anodique. CO et soufre sont typiques de l’hydrogène de reformage, oxygène et eau de l’hydrogène électrolytique : la source fixe l’effort de purification et d’analyse.',
              'El CO, los compuestos de azufre, el formaldehído, el ácido fórmico y los halógenos se adsorben en el catalizador de platino y envenenan la pila a niveles muy bajos; el amoníaco degrada la membrana; los inertes solo diluyen y se acumulan en el circuito anódico. CO y azufre son típicos del hidrógeno de reformado, oxígeno y agua del electrolítico, por lo que la fuente determina el esfuerzo de purificación y análisis.',
              'CO, związki siarki, formaldehyd, kwas mrówkowy i halogeny adsorbują się na katalizatorze platynowym i zatruwają ogniwo już w bardzo małych ilościach; amoniak niszczy membranę; gazy obojętne tylko rozcieńczają paliwo i gromadzą się w obiegu anodowym. CO i siarka są typowe dla wodoru z reformingu, tlen i woda dla wodoru z elektrolizy, dlatego źródło decyduje o nakładach na oczyszczanie i analizę.'
            )

        var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        ctx.clearRect(0, 0, w, h);
        if (!last || !last.ok) return;
        var L = coarse ? 40 : 48, R = 10, TOP = 12, B = coarse ? 40 : 48, pw = w - L - R, ph = h - TOP - B, i, k, v, y, n = IMPF.length, bw = pw / n;
        function Y(r) { var lg = Math.log(Math.max(1e-3, Math.min(10, r))) / Math.LN10; return TOP + ph - (lg + 3) / 4 * ph; }
        ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(L, TOP); ctx.lineTo(L, TOP + ph); ctx.lineTo(L + pw, TOP + ph); ctx.stroke();
        ctx.fillStyle = muted; ctx.font = (coarse ? 10 : 11) + 'px ' + font; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        [0.001, 0.01, 0.1, 1, 10].forEach(function (t) { y = Y(t); ctx.fillText(String(t), L - 4, y); });
        for (i = 0; i < n; i++) {
          k = IMPF[i][0]; v = (+state[k]) / LIMD[k];
          ctx.fillStyle = v > 1 ? DiagramUI.series(1) : DiagramUI.series(0);
          y = Y(v);
          if (v > 0) ctx.fillRect(L + i * bw + bw * 0.15, y, bw * 0.7, TOP + ph - y);
          ctx.save(); ctx.fillStyle = muted; ctx.translate(L + i * bw + bw / 2, TOP + ph + 4); ctx.rotate(-Math.PI / 4); ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(SHORT[k], 0, 0); ctx.restore();
        }
        ctx.strokeStyle = DiagramUI.series(1); ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(L, Y(1)); ctx.lineTo(L + pw, Y(1)); ctx.stroke(); ctx.setLineDash([]);
      }
    });
    adoptStage(ui);

    ui.ready();
    window['__h2_fuel_conversion'] = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord(){
    if (!last) return null;
    var inputs = {}, outputs = {}, units = {}, warnings, i, k;
    var inU = [['level','-'], ['amount','in unit'], ['unit','-'], ['tComb','degC']];
    for (i = 0; i < IMPF.length; i++) { inU.push([IMPF[i][0], 'umol/mol']); }
    for (i = 0; i < inU.length; i++) { k = inU[i][0]; inputs[k] = state[k]; units[k] = inU[i][1]; }
    if (last.ok) {
      var outU = [['m_kg','kg'], ['V_N','Nm3 (0 C, 101.325 kPa)'], ['V_S','Sm3 (15 C, 101.325 kPa)'], ['E_LHV_MWh','MWh'], ['E_HHV_MWh','MWh'], ['E_LHV_GJ','GJ'],
        ['Hs_mass','MJ/kg'], ['Hi_mass','MJ/kg'], ['rho_N','kg/m3'], ['rho_S','kg/m3'], ['Hi_vol_S','MJ/m3'], ['Hs_vol_S','MJ/m3'],
        ['diesel_kg','kg'], ['diesel_L','L'], ['diesel_co2_t','t'], ['petrol_kg','kg'], ['petrol_L','L'], ['petrol_co2_t','t'],
        ['lpg_kg','kg'], ['lpg_L','L'], ['lpg_co2_t','t'], ['methanol_kg','kg'], ['methanol_L','L'], ['methanol_co2_t','t'],
        ['ng_Sm3','Sm3 CH4'], ['ng_co2_t','t'], ['co2_own_t','t'],
        ['purity_pct','%'], ['total_umol','umol/mol'], ['okTotal','-'], ['okIndex','-'], ['gradeD','-'], ['gradeA','-'], ['n_fail','-'], ['basis_label','-'], ['energy_basis','-']];
      for (i = 0; i < outU.length; i++) { k = outU[i][0]; outputs[k] = last[k]; units[k] = outU[i][1]; }
      outputs.fails = last.fails.join(','); units.fails = '-';
      warnings = (last.warnings || []).slice();
    } else {
      warnings = [last.error];
    }
    return {
      inputs: inputs,
      outputs: outputs,
      units: units,
      model: {
        equations: [
          'ISO 6976:2016 (2016-08): Hs = sum x_i Hs_i / sum x_i M_i; Hi = Hs - n(H2O) L, mass basis',
          'rho = rho_H2(T, 101.325 kPa; Leachman 2009) * M_mix / M_H2; V = m / rho',
          'Fuel equivalent = m * Hi / LHV_fuel (Directive (EU) 2018/2001 Annex III); CO2 = E * EF (IPCC 2006 Vol. 2 Table 1.4)',
          'ISO 14687:2019 (2019-11) Table 2 Grade D: each impurity <= limit, total non-H2 <= 300 umol/mol, H2 >= 99.97 %'
        ],
        ranges: [ 'Hydrogen with up to 20 % impurities (volumes assume ideal mixing of traces)', 'Combustion reference 0, 15, 20 or 25 degC' ],
        notes: [ 'Non-methane hydrocarbons are counted as methane (C1 basis) in the energy; sulphur, HCHO, HCOOH and halogenated traces are checked only', 'Grade A checked on hydrogen fraction only (>= 98 %)' ]
      },
      warnings: warnings
    };
  }

  var HANDOFF = {
    provides: ['E', 'x'],
    accepts: [],
    build: function(){
      if (!(last && last.ok)) return null;
      return {
        /* E = LHV per kg (J/kg); the energy amount, mass, grade flags and basis stay in the record */
        quantities: { E: { value: last.Hi_mass * 1e6, unit: 'J/kg' }, x: { value: last.purity_pct / 100, unit: '-' } },
        sets: { h2_product: [{ purity: { value: last.purity_pct / 100, unit: '-' }, HHV: { value: last.Hs_mass * 1e6, unit: 'J/kg' } }] }
      };
    },
    apply: function(payload){
      /* nothing is accepted: an energy amount (J) is not a handoff quantity */
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'h2_fuel_conversion',
        file: 'h2_fuel_conversion.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
