  "summary": {
    "en": "Compares continue, repair, refurbish, replace and upgrade on one horizon as the present value of their costs, with yearly cash flows, sensitivity and switch-over thresholds.",
    "uk": "Порівнює продовження експлуатації, ремонт, капремонт, заміну й модернізацію на одному горизонті за приведеною вартістю витрат, з річними потоками, чутливістю та порогами зміни вибору.",
    "de": "Vergleicht Weiterbetrieb, Reparatur, Überholung, Ersatz und Ertüchtigung über einen Horizont als Barwert der Kosten, mit jährlichen Zahlungsströmen, Sensitivität und Umschlagschwellen.",
    "nl": "Vergelijkt doorgaan, repareren, reviseren, vervangen en upgraden over één horizon als contante waarde van de kosten, met jaarlijkse kasstromen, gevoeligheid en omslagdrempels.",
    "fr": "Compare continuer, réparer, rénover, remplacer et moderniser sur un horizon unique par la valeur actuelle des coûts, avec flux annuels, sensibilité et seuils de bascule.",

    "pl": "Porównuje dalszą eksploatację, naprawę, remont kapitalny, wymianę i modernizację na jednym horyzoncie według wartości bieżącej kosztów, z przepływami rocznymi, wrażliwością i progami zmiany wyboru."
  },
  "description": {
    "en": "Describe the existing item (age, O&M cost, cost and unavailability per failure, failure model) and two to six strategies (investment, lead time, outage, then either the existing item at a stated age or a new item with its own costs, failure model, service life and renewals). Failures follow a constant rate, a power-law NHPP for a repaired item or a Weibull renewal process for an item replaced on failure; the last two can be fitted from failure history (Crow-AMSAA, censored Weibull maximum likelihood) and the fit is refused below three failures. The tool discounts every option to a present value, names the cheapest admissible one unless options tie, and shows the yearly cash flows, a one-at-a-time sensitivity, the values at which the preference switches, a scenario band for uncertain failure rates and the non-price constraints. Unknown inputs stop the comparison and are never replaced by zero. Calculation completed, decision criterion met and engineering decision approved are separate states.",
    "uk": "Опишіть наявне обладнання (вік, витрати на експлуатацію і ТО, вартість і тривалість простою на відмову, модель відмов) і від двох до шести стратегій (інвестиція, термін до впровадження, простій, далі — наявне обладнання з заданим віком або нове обладнання з власними витратами, моделлю відмов, строком служби й відновленнями). Відмови описує стала інтенсивність, степеневий NHPP для ремонтованого обладнання або процес відновлення Вейбулла для обладнання, яке замінюють при відмові; дві останні моделі можна оцінити за історією відмов (Crow-AMSAA, метод максимальної правдоподібності Вейбулла з цензуруванням), а оцінку відхиляють, якщо відмов менше трьох. Інструмент приводить кожен варіант до приведеної вартості, називає найдешевший допустимий, якщо немає рівності, і показує річні грошові потоки, чутливість за одним параметром, значення, за яких змінюється вибір, сценарний діапазон невизначених інтенсивностей відмов і нецінові обмеження. Невідомі вхідні дані зупиняють порівняння й ніколи не замінюються нулем. «Розрахунок виконано», «критерій рішення виконано» і «інженерне рішення затверджено» — окремі стани.",
    "de": "Beschreiben Sie das vorhandene Betriebsmittel (Alter, Betriebs- und Instandhaltungskosten, Kosten und Ausfallzeit je Ausfall, Ausfallmodell) und zwei bis sechs Strategien (Investition, Vorlaufzeit, Stillstand, danach entweder das vorhandene Betriebsmittel mit angegebenem Alter oder ein neues mit eigenen Kosten, Ausfallmodell, Nutzungsdauer und Erneuerungen). Ausfälle folgen einer konstanten Rate, einem Potenzgesetz-NHPP für ein instandgesetztes Betriebsmittel oder einem Weibull-Erneuerungsprozess für ein bei Ausfall ersetztes; die beiden letzten lassen sich aus der Ausfallhistorie schätzen (Crow-AMSAA, zensierte Weibull-Maximum-Likelihood), unter drei Ausfällen wird die Schätzung verweigert. Das Werkzeug diskontiert jede Option auf einen Barwert, nennt die günstigste zulässige, sofern keine Gleichheit vorliegt, und zeigt die jährlichen Zahlungsströme, eine Einzelparameter-Sensitivität, die Werte, bei denen die Präferenz umschlägt, ein Szenarioband für unsichere Ausfallraten und die nicht monetären Randbedingungen. Unbekannte Eingaben halten den Vergleich an und werden nie durch null ersetzt. Berechnung abgeschlossen, Entscheidungskriterium erfüllt und technische Entscheidung freigegeben sind getrennte Zustände.",
    "nl": "Beschrijf het bestaande item (leeftijd, bedrijfs- en onderhoudskosten, kosten en onbeschikbaarheid per storing, storingsmodel) en twee tot zes strategieën (investering, doorlooptijd, stilstand, daarna het bestaande item op een opgegeven leeftijd of een nieuw item met eigen kosten, storingsmodel, levensduur en vernieuwingen). Storingen volgen een constante frequentie, een machtswet-NHPP voor een gerepareerd item of een Weibull-vernieuwingsproces voor een item dat bij storing wordt vervangen; de laatste twee zijn te schatten uit de storingshistorie (Crow-AMSAA, gecensureerde Weibull-maximum-likelihood) en onder drie storingen wordt de schatting geweigerd. De tool disconteert elke optie naar een contante waarde, noemt de goedkoopste toelaatbare tenzij opties gelijk zijn, en toont de jaarlijkse kasstromen, een gevoeligheid per parameter, de waarden waarbij de voorkeur omslaat, een scenarioband voor onzekere storingsfrequenties en de niet-financiële randvoorwaarden. Onbekende invoer stopt de vergelijking en wordt nooit door nul vervangen. Berekening uitgevoerd, beslissingscriterium vervuld en technische beslissing goedgekeurd zijn aparte toestanden.",
    "fr": "Décrivez l’équipement existant (âge, coût d’exploitation et de maintenance, coût et indisponibilité par défaillance, modèle de défaillance) et deux à six stratégies (investissement, délai, arrêt, puis soit l’équipement existant à un âge donné, soit un équipement neuf avec ses coûts, son modèle de défaillance, sa durée de vie et ses renouvellements). Les défaillances suivent un taux constant, un NHPP en loi de puissance pour un équipement réparé ou un processus de renouvellement de Weibull pour un équipement remplacé à la défaillance ; les deux derniers peuvent être ajustés sur l’historique (Crow-AMSAA, maximum de vraisemblance de Weibull avec censure) et l’ajustement est refusé sous trois défaillances. L’outil actualise chaque option en valeur actuelle, désigne la moins chère admissible sauf égalité, et montre les flux annuels, une sensibilité paramètre par paramètre, les valeurs de bascule de la préférence, une bande de scénarios pour les taux incertains et les contraintes non financières. Les données inconnues arrêtent la comparaison et ne sont jamais remplacées par zéro. Calcul effectué, critère de décision satisfait et décision technique approuvée sont des états distincts.",
    "es": "Describa el equipo existente (edad, coste de operación y mantenimiento, coste e indisponibilidad por fallo, modelo de fallos) y de dos a seis estrategias (inversión, plazo de implantación, parada y, después, el equipo existente a una edad dada o un equipo nuevo con sus costes, modelo de fallos, vida útil y renovaciones). Los fallos siguen una tasa constante, un NHPP de ley de potencia para un equipo reparado o un proceso de renovación de Weibull para un equipo sustituido al fallar; los dos últimos pueden ajustarse con el historial (Crow-AMSAA, máxima verosimilitud de Weibull con censura) y el ajuste se rechaza con menos de tres fallos. La herramienta descuenta cada opción a valor actual, nombra la más barata admisible salvo empate y muestra los flujos anuales, una sensibilidad parámetro a parámetro, los valores en los que cambia la preferencia, una banda de escenarios para tasas inciertas y las restricciones no económicas. Los datos desconocidos detienen la comparación y nunca se sustituyen por cero. Cálculo completado, criterio de decisión cumplido y decisión técnica aprobada son estados distintos.",
    "pl": "Opisz istniejące urządzenie (wiek, koszt eksploatacji i utrzymania, koszt i niedostępność na awarię, model awarii) oraz od dwóch do sześciu strategii (inwestycja, czas do wdrożenia, postój, a potem istniejące urządzenie w podanym wieku albo nowe z własnymi kosztami, modelem awarii, okresem eksploatacji i odnowieniami). Awarie opisuje stała intensywność, potęgowy NHPP dla urządzenia naprawianego albo proces odnowy Weibulla dla urządzenia wymienianego po awarii; dwa ostatnie można dopasować do historii awarii (Crow-AMSAA, metoda największej wiarygodności Weibulla z cenzurowaniem), a dopasowanie jest odrzucane poniżej trzech awarii. Narzędzie dyskontuje każdy wariant do wartości bieżącej, wskazuje najtańszy dopuszczalny, o ile nie ma remisu, i pokazuje roczne przepływy, wrażliwość na pojedyncze parametry, wartości, przy których zmienia się wybór, pasmo scenariuszy dla niepewnych intensywności awarii oraz ograniczenia pozacenowe. Nieznane dane zatrzymują porównanie i nigdy nie są zastępowane zerem. Obliczenie wykonane, kryterium decyzji spełnione i decyzja inżynierska zatwierdzona to odrębne stany."
  },

  "limitations": {
    "en": "Deterministic expected values: no probability distribution of the present value, no taxes, financing, inflation beyond a real discount rate or escalation per cost type. One failure model per item; a fit needs at least three failures and is not tested for goodness of fit. The power-law NHPP assumes minimal repair, the Weibull renewal model replacement as good as new. The renewal function is computed on 2 000 steps (relative error below 1e-4 for shape ≥ 1, up to 7e-4 at shape 0,5 and 60 scale lengths). Residual value is straight-line. The ranking is a cost comparison; the decision and its approval stay with the responsible engineer.",
    "uk": "Детерміновані очікувані значення: немає розподілу ймовірностей приведеної вартості, податків, фінансування, інфляції понад реальну ставку дисконтування чи ескалації за видами витрат. Одна модель відмов на одиницю обладнання; для оцінки потрібно щонайменше три відмови, згода моделі з даними не перевіряється. Степеневий NHPP передбачає мінімальний ремонт, модель відновлення Вейбулла — заміну «як нове». Функцію відновлення обчислено на 2 000 кроках (відносна похибка менше 1e-4 для параметра форми ≥ 1, до 7e-4 при формі 0,5 і 60 масштабах). Залишкова вартість — лінійна. Ранжування є порівнянням витрат; рішення та його затвердження залишаються за відповідальним інженером.",
    "de": "Deterministische Erwartungswerte: keine Wahrscheinlichkeitsverteilung des Barwerts, keine Steuern, Finanzierung, Inflation über einen realen Zinssatz hinaus oder Preissteigerung je Kostenart. Ein Ausfallmodell je Betriebsmittel; eine Schätzung braucht mindestens drei Ausfälle, die Anpassungsgüte wird nicht geprüft. Das Potenzgesetz-NHPP setzt Minimalinstandsetzung voraus, das Weibull-Erneuerungsmodell Ersatz wie neu. Die Erneuerungsfunktion wird auf 2 000 Schritten berechnet (relativer Fehler unter 1e-4 für Formparameter ≥ 1, bis 7e-4 bei Form 0,5 und 60 Skalenlängen). Restwert linear. Die Rangfolge ist ein Kostenvergleich; Entscheidung und Freigabe bleiben beim verantwortlichen Ingenieur.",
    "nl": "Deterministische verwachtingswaarden: geen kansverdeling van de contante waarde, geen belastingen, financiering, inflatie boven een reële disconteringsvoet of prijsstijging per kostensoort. Eén storingsmodel per item; een schatting vraagt minstens drie storingen en de passing wordt niet getoetst. De machtswet-NHPP veronderstelt minimale reparatie, het Weibull-vernieuwingsmodel vervanging als nieuw. De vernieuwingsfunctie wordt op 2 000 stappen berekend (relatieve fout onder 1e-4 voor vormparameter ≥ 1, tot 7e-4 bij vorm 0,5 en 60 schaallengten). Restwaarde lineair. De rangorde is een kostenvergelijking; de beslissing en de goedkeuring blijven bij de verantwoordelijke ingenieur.",
    "fr": "Valeurs espérées déterministes : pas de distribution de probabilité de la valeur actuelle, pas d’impôts, de financement, d’inflation au-delà d’un taux réel ni d’indexation par type de coût. Un modèle de défaillance par équipement ; un ajustement exige au moins trois défaillances et la qualité d’ajustement n’est pas testée. Le NHPP en loi de puissance suppose une réparation minimale, le renouvellement de Weibull un remplacement à neuf. La fonction de renouvellement est calculée sur 2 000 pas (erreur relative sous 1e-4 pour une forme ≥ 1, jusqu’à 7e-4 pour une forme 0,5 et 60 échelles). Valeur résiduelle linéaire. Le classement est une comparaison de coûts ; la décision et son approbation restent à l’ingénieur responsable.",
    "es": "Valores esperados deterministas: sin distribución de probabilidad del valor actual, sin impuestos, financiación, inflación más allá de una tasa real ni escalado por tipo de coste. Un modelo de fallos por equipo; un ajuste requiere al menos tres fallos y no se contrasta la bondad del ajuste. El NHPP de ley de potencia supone reparación mínima; la renovación de Weibull, sustitución como nuevo. La función de renovación se calcula en 2 000 pasos (error relativo inferior a 1e-4 para forma ≥ 1, hasta 7e-4 con forma 0,5 y 60 escalas). Valor residual lineal. La clasificación es una comparación de costes; la decisión y su aprobación corresponden al ingeniero responsable.",
    "pl": "Deterministyczne wartości oczekiwane: brak rozkładu prawdopodobieństwa wartości bieżącej, podatków, finansowania, inflacji ponad realną stopę dyskontową i eskalacji według rodzajów kosztów. Jeden model awarii na urządzenie; dopasowanie wymaga co najmniej trzech awarii, a zgodność dopasowania nie jest testowana. Potęgowy NHPP zakłada naprawę minimalną, model odnowy Weibulla wymianę na nowe. Funkcja odnowy liczona jest na 2 000 krokach (błąd względny poniżej 1e-4 dla parametru kształtu ≥ 1, do 7e-4 przy kształcie 0,5 i 60 skalach). Wartość rezydualna liniowa. Ranking jest porównaniem kosztów; decyzja i jej zatwierdzenie należą do odpowiedzialnego inżyniera."
  },

      "uk": "Дисконтовані грошові потоки за структурою IEC 60300-3-3:2017 (оцінка вартості життєвого циклу); степеневий NHPP і оцінка Crow-AMSAA за Crow (1974) та Rigdon & Basu (2000); максимальна правдоподібність Вейбулла з цензуруванням справа за Lawless (2003); функція відновлення за схемою Xie (1989). Докази: корпус, складений за SPEC-repairreplace.md без доступу до коду сторінки, числа якого перевірено другим незалежним способом розрахунку.",

      {
        "id": "repairreplace-corpus-2026-10-03",
        "reference": {
          "en": "The model is the deterministic expected-value life-cycle cost of IEC 60300-3-3: each option's costs (investment and outage at implementation and at like-for-like renewals, yearly opex, expected failures times the cost of one failure including its downtime, expected risk cost) are discounted at the real rate r, investments at their exact time and recurring costs at the end of each year, with a straight-line residual value credited at the horizon; options are ranked by present value and compared through the equivalent annual cost. Expected failure counts come from a homogeneous rate, a power-law NHPP (minimal repair; Crow-AMSAA estimates for time-terminated data, Rigdon & Basu 2000) or a Weibull renewal process (as good as new; renewal function solved by a Stieltjes-trapezoid scheme of the Xie 1989 type on the grid the specification prescribes; Weibull parameters by censored maximum likelihood, Lawless 2003).",
          "uk": "Модель — детерміновані витрати життєвого циклу в очікуваних значеннях за IEC 60300-3-3: витрати кожного варіанта (інвестиції та простій при впровадженні й при рівноцінних оновленнях, річні операційні витрати, очікувана кількість відмов, помножена на вартість однієї відмови з урахуванням її неготовності, очікувана вартість ризиків) дисконтуються за реальною ставкою r, інвестиції — у точний момент їх здійснення, а поточні витрати — наприкінці кожного року, із залишковою вартістю за лінійним списанням, що зараховується на кінець горизонту; варіанти ранжуються за приведеною вартістю і порівнюються через еквівалентні річні витрати. Очікувана кількість відмов визначається сталою інтенсивністю, степеневим NHPP (мінімальний ремонт; оцінки Crow-AMSAA для даних з обмеженням за часом, Rigdon & Basu 2000) або процесом відновлення Вейбулла (стан «як новий»; функцію відновлення обчислено схемою трапецій Стілтьєса типу Xie 1989 на сітці, яку визначає специфікація; параметри Вейбулла — методом максимальної правдоподібності з цензуруванням, Lawless 2003).",
          "de": "Das Modell sind die deterministischen Lebenszykluskosten als Erwartungswert nach IEC 60300-3-3: Die Kosten jeder Option (Investition und Stillstand bei Umsetzung und bei gleichwertigen Erneuerungen, jährliche Betriebskosten, erwartete Ausfälle mal Kosten eines Ausfalls einschließlich seiner Nichtverfügbarkeit, erwartete Risikokosten) werden mit dem realen Diskontsatz r diskontiert, Investitionen zu ihrem exakten Zeitpunkt und laufende Kosten am Ende jedes Jahres, wobei ein linearer Restwert am Ende des Betrachtungszeitraums gutgeschrieben wird; die Optionen werden nach dem Barwert gereiht und über die äquivalenten jährlichen Kosten verglichen. Die erwarteten Ausfallzahlen stammen aus einer konstanten Rate, einem Potenzgesetz-NHPP (Minimalinstandsetzung; Crow-AMSAA-Schätzungen für zeitbegrenzte Daten, Rigdon & Basu 2000) oder einem Weibull-Erneuerungsprozess (so gut wie neu; Erneuerungsfunktion gelöst mit einem Stieltjes-Trapezverfahren vom Typ Xie 1989 auf dem Gitter, das die Spezifikation vorschreibt; Weibull-Parameter durch zensierte Maximum-Likelihood-Schätzung, Lawless 2003).",
          "nl": "Het model is de deterministische levenscycluskost als verwachtingswaarde volgens IEC 60300-3-3: de kosten van elke optie (investering en stilstand bij implementatie en bij gelijkwaardige vernieuwingen, jaarlijkse bedrijfskosten, verwachte storingen maal de kosten van één storing inclusief de onbeschikbaarheid ervan, verwachte risicokosten) worden verdisconteerd tegen de reële disconteringsvoet r, investeringen op hun exacte tijdstip en terugkerende kosten aan het einde van elk jaar, met een lineaire restwaarde die aan het einde van de horizon wordt gecrediteerd; de opties worden gerangschikt op contante waarde en vergeleken via de equivalente jaarlijkse kosten. De verwachte aantallen storingen volgen uit een constante frequentie, een machtswet-NHPP (minimaal herstel; Crow-AMSAA-schattingen voor tijdsbegrensde gegevens, Rigdon & Basu 2000) of een Weibull-vernieuwingsproces (zo goed als nieuw; vernieuwingsfunctie opgelost met een Stieltjes-trapeziumschema van het type Xie 1989 op het rooster dat de specificatie voorschrijft; Weibull-parameters via gecensureerde maximale aannemelijkheid, Lawless 2003).",
          "fr": "Le modèle est le coût de cycle de vie déterministe en valeur espérée selon IEC 60300-3-3 : les coûts de chaque option (investissement et arrêt à la mise en œuvre et aux renouvellements à l’identique, coûts d’exploitation annuels, défaillances attendues multipliées par le coût d’une défaillance, indisponibilité comprise, coût de risque attendu) sont actualisés au taux réel r, les investissements à leur date exacte et les coûts récurrents à la fin de chaque année, une valeur résiduelle linéaire étant créditée à l’horizon ; les options sont classées par valeur actuelle et comparées au moyen du coût annuel équivalent. Les nombres de défaillances attendus proviennent d’un taux constant, d’un NHPP en loi puissance (réparation minimale ; estimations Crow-AMSAA pour des données tronquées en temps, Rigdon & Basu 2000) ou d’un processus de renouvellement de Weibull (aussi bon que neuf ; fonction de renouvellement résolue par un schéma des trapèzes de Stieltjes du type Xie 1989 sur la grille prescrite par la spécification ; paramètres de Weibull par maximum de vraisemblance censuré, Lawless 2003).",
          "es": "El modelo es el coste del ciclo de vida determinista en valor esperado según IEC 60300-3-3: los costes de cada opción (inversión y parada en la implantación y en las renovaciones equivalentes, costes de operación anuales, fallos esperados por el coste de un fallo incluida su indisponibilidad, coste de riesgo esperado) se descuentan a la tasa real r, las inversiones en su momento exacto y los costes recurrentes al final de cada año, con un valor residual lineal abonado en el horizonte; las opciones se clasifican por valor actual y se comparan mediante el coste anual equivalente. Los números esperados de fallos proceden de una tasa constante, de un NHPP de ley potencial (reparación mínima; estimaciones Crow-AMSAA para datos truncados por tiempo, Rigdon & Basu 2000) o de un proceso de renovación de Weibull (tan bueno como nuevo; función de renovación resuelta mediante un esquema de trapecios de Stieltjes del tipo Xie 1989 en la malla que prescribe la especificación; parámetros de Weibull por máxima verosimilitud censurada, Lawless 2003).",
          "pl": "Model to deterministyczny koszt cyklu życia w wartościach oczekiwanych według IEC 60300-3-3: koszty każdego wariantu (nakłady inwestycyjne i postój przy wdrożeniu oraz przy odnowach na równoważne, roczne koszty operacyjne, oczekiwana liczba uszkodzeń razy koszt jednego uszkodzenia łącznie z jego niedostępnością, oczekiwany koszt ryzyka) są dyskontowane realną stopą r, inwestycje w ich dokładnym momencie, a koszty bieżące na koniec każdego roku, przy czym liniowa wartość rezydualna jest zaliczana na koniec horyzontu; warianty są szeregowane według wartości bieżącej i porównywane za pomocą równoważnego kosztu rocznego. Oczekiwane liczby uszkodzeń wynikają ze stałej intensywności, potęgowego NHPP (naprawa minimalna; estymatory Crow-AMSAA dla danych uciętych czasowo, Rigdon & Basu 2000) lub procesu odnowy Weibulla (stan jak nowy; funkcja odnowy wyznaczana schematem trapezów Stieltjesa typu Xie 1989 na siatce określonej w specyfikacji; parametry Weibulla metodą największej wiarygodności z cenzurowaniem, Lawless 2003)."

        "tolerance": {
          "en": "All tolerances are relative. Default 1e-9 for PV, EAC, components and year-table values of cases using rate, nhpp or none models: these are closed-form sums, and the reference was matched to 1e-9 by an independent route. Cases with Weibull renewal counts carry tol 1e-4 (pv, eac, years, renewal); the reference values are the 2 000-step values of the rev .2 §4 scheme (Xie 1989), and each was checked against a 16x finer grid of the same scheme (agreement better than 2e-5). Renewal-dependent values are graded only inside the rev .2 domain beta >= 1, t_max/eta <= 60; the graded Weibull cases have beta 1-3.5 and t_max/eta <= 3. The beta = 1 case keeps the exact rate values (M = t/eta), which the scheme reproduces to 1e-7. Fitted parameters 1e-9 (bisection to 1e-12 relative). Thresholds 1e-6 as the specification allows; the reference threshold is the boundary of the preferred option including a change to a tie, i.e. where PV(challenger) - PV(preferred) = max(0.005 EUR, 1e-9 x largest |PV|); this boundary differs from the exact PV crossing by up to 1.4e-6 relative in case thresholds_rate_models, which therefore carries tol 2e-6 so that both readings pass. Integers, booleans, indices, lists of gap ids and refusal reasons are graded exactly. 'gaps' lists the complete set expected (order-free); 'no_gaps' lists gap ids that must be absent. Partial component dictionaries grade only the keys given.",
          "uk": "Усі допуски відносні. За замовчуванням 1e-9 для PV, EAC, складових і значень річної таблиці у випадках із моделями rate, nhpp або none: це суми в замкненій формі, і еталон незалежним шляхом підтверджено з точністю до 1e-9. Випадки з кількістю відновлень Вейбулла мають tol 1e-4 (pv, eac, years, renewal); еталонні значення — це значення схеми з rev .2 §4 (Xie 1989) на 2 000 кроків, і кожне перевірено на 16x дрібнішій сітці тієї самої схеми (збіг краще ніж 2e-5). Значення, що залежать від відновлень, перевіряються лише в межах області rev .2 beta >= 1, t_max/eta <= 60; перевірювані випадки Вейбулла мають beta 1-3.5 і t_max/eta <= 3. Випадок beta = 1 зберігає точні значення моделі rate (M = t/eta), які схема відтворює з точністю до 1e-7. Оцінені параметри — 1e-9 (бісекція до 1e-12 відносно). Пороги зміни переваги — 1e-6, як дозволяє специфікація; еталонний поріг — це межа рекомендованого варіанта, включно зі зміною на рівність, тобто точка, де PV(challenger) - PV(preferred) = max(0.005 EUR, 1e-9 x largest |PV|); у випадку thresholds_rate_models ця межа відрізняється від точного перетину PV до 1.4e-6 відносно, тому цей випадок має tol 2e-6, щоб проходили обидва прочитання. Цілі числа, булеві значення, індекси, списки ідентифікаторів прогалин і причини неприйняття перевіряються точно. 'gaps' перелічує повну очікувану множину (без урахування порядку); 'no_gaps' перелічує ідентифікатори прогалин, яких не має бути. Часткові словники складових перевіряються лише за наданими ключами.",
          "de": "Alle Toleranzen sind relativ. Standardwert 1e-9 für PV, EAC, Komponenten und Werte der Jahrestabelle in Fällen mit den Modellen rate, nhpp oder none: Dies sind Summen in geschlossener Form, und die Referenz wurde auf einem unabhängigen Weg auf 1e-9 genau bestätigt. Fälle mit Weibull-Erneuerungszahlen haben tol 1e-4 (pv, eac, years, renewal); die Referenzwerte sind die Werte des Verfahrens aus rev .2 §4 (Xie 1989) mit 2 000 Schritten, und jeder wurde gegen ein 16x feineres Gitter desselben Verfahrens geprüft (Übereinstimmung besser als 2e-5). Erneuerungsabhängige Werte werden nur innerhalb des Bereichs von rev .2 beta >= 1, t_max/eta <= 60 geprüft; die geprüften Weibull-Fälle haben beta 1-3.5 und t_max/eta <= 3. Der Fall beta = 1 behält die exakten Werte des Modells rate (M = t/eta), die das Verfahren auf 1e-7 genau reproduziert. Angepasste Parameter 1e-9 (Bisektion auf 1e-12 relativ). Umschlagschwellen 1e-6, wie es die Spezifikation zulässt; die Referenzschwelle ist die Grenze der bevorzugten Option einschließlich eines Wechsels zu Gleichstand, d. h. dort, wo PV(challenger) - PV(preferred) = max(0.005 EUR, 1e-9 x largest |PV|); diese Grenze weicht im Fall thresholds_rate_models um bis zu 1.4e-6 relativ vom exakten PV-Schnittpunkt ab, daher hat dieser Fall tol 2e-6, damit beide Lesarten bestehen. Ganzzahlen, boolesche Werte, Indizes, Listen von Lücken-IDs und Ablehnungsgründe werden exakt geprüft. 'gaps' listet die vollständige erwartete Menge (ohne Reihenfolge); 'no_gaps' listet Lücken-IDs, die fehlen müssen. Partielle Komponenten-Dictionaries werden nur über die angegebenen Schlüssel geprüft.",
          "nl": "Alle toleranties zijn relatief. Standaard 1e-9 voor PV, EAC, componenten en waarden van de jaartabel in gevallen met de modellen rate, nhpp of none: dit zijn sommen in gesloten vorm, en de referentie is langs een onafhankelijke weg tot op 1e-9 bevestigd. Gevallen met Weibull-vernieuwingsaantallen hebben tol 1e-4 (pv, eac, years, renewal); de referentiewaarden zijn de waarden met 2 000 stappen van het schema uit rev .2 §4 (Xie 1989), en elke waarde is gecontroleerd tegen een 16x fijner rooster van hetzelfde schema (overeenstemming beter dan 2e-5). Vernieuwingsafhankelijke waarden worden alleen beoordeeld binnen het domein van rev .2 beta >= 1, t_max/eta <= 60; de beoordeelde Weibull-gevallen hebben beta 1-3.5 en t_max/eta <= 3. Het geval beta = 1 behoudt de exacte waarden van het model rate (M = t/eta), die het schema tot op 1e-7 reproduceert. Geschatte parameters 1e-9 (bisectie tot 1e-12 relatief). Omslagdrempels 1e-6, zoals de specificatie toestaat; de referentiedrempel is de grens van de voorkeursoptie, inclusief een overgang naar gelijkspel, d.w.z. waar PV(challenger) - PV(preferred) = max(0.005 EUR, 1e-9 x largest |PV|); deze grens wijkt in geval thresholds_rate_models tot 1.4e-6 relatief af van het exacte PV-snijpunt, dat geval heeft daarom tol 2e-6 zodat beide lezingen slagen. Gehele getallen, booleans, indices, lijsten van hiaat-identificatoren en weigeringsredenen worden exact beoordeeld. 'gaps' geeft de volledige verwachte verzameling (volgorde vrij); 'no_gaps' geeft hiaat-identificatoren die moeten ontbreken. Gedeeltelijke componentwoordenboeken worden alleen op de opgegeven sleutels beoordeeld.",
          "fr": "Toutes les tolérances sont relatives. Par défaut 1e-9 pour PV, EAC, composantes et valeurs du tableau annuel des cas utilisant les modèles rate, nhpp ou none : ce sont des sommes sous forme fermée, et la référence a été recoupée à 1e-9 par une voie indépendante. Les cas avec nombres de renouvellements de Weibull portent tol 1e-4 (pv, eac, years, renewal) ; les valeurs de référence sont les valeurs à 2 000 pas du schéma de rev .2 §4 (Xie 1989), et chacune a été vérifiée sur une grille 16x plus fine du même schéma (accord meilleur que 2e-5). Les valeurs dépendant des renouvellements ne sont contrôlées qu’à l’intérieur du domaine de rev .2 beta >= 1, t_max/eta <= 60 ; les cas de Weibull contrôlés ont beta 1-3.5 et t_max/eta <= 3. Le cas beta = 1 conserve les valeurs exactes du modèle rate (M = t/eta), que le schéma reproduit à 1e-7 près. Paramètres ajustés 1e-9 (bissection à 1e-12 en relatif). Seuils de basculement 1e-6, comme le permet la spécification ; le seuil de référence est la limite de l’option préférée, y compris un passage à l’égalité, c.-à-d. le point où PV(challenger) - PV(preferred) = max(0.005 EUR, 1e-9 x largest |PV|) ; cette limite s’écarte du croisement exact des PV de jusqu’à 1.4e-6 en relatif dans le cas thresholds_rate_models, qui porte donc tol 2e-6 afin que les deux lectures passent. Les entiers, booléens, indices, listes d’identifiants de lacunes et motifs de refus sont contrôlés exactement. 'gaps' liste l’ensemble complet attendu (sans ordre) ; 'no_gaps' liste les identifiants de lacunes qui doivent être absents. Les dictionnaires partiels de composantes ne sont contrôlés que sur les clés fournies.",
          "es": "Todas las tolerancias son relativas. Por defecto 1e-9 para PV, EAC, componentes y valores de la tabla anual de los casos con los modelos rate, nhpp o none: son sumas en forma cerrada, y la referencia se contrastó hasta 1e-9 por una vía independiente. Los casos con número de renovaciones de Weibull llevan tol 1e-4 (pv, eac, years, renewal); los valores de referencia son los valores con 2 000 pasos del esquema de rev .2 §4 (Xie 1989), y cada uno se verificó frente a una malla 16x más fina del mismo esquema (concordancia mejor que 2e-5). Los valores que dependen de las renovaciones solo se evalúan dentro del dominio de rev .2 beta >= 1, t_max/eta <= 60; los casos de Weibull evaluados tienen beta 1-3.5 y t_max/eta <= 3. El caso beta = 1 conserva los valores exactos del modelo rate (M = t/eta), que el esquema reproduce hasta 1e-7. Parámetros ajustados 1e-9 (bisección hasta 1e-12 relativo). Umbrales de cambio 1e-6, como permite la especificación; el umbral de referencia es el límite de la opción preferente, incluido un paso a empate, es decir, donde PV(challenger) - PV(preferred) = max(0.005 EUR, 1e-9 x largest |PV|); este límite difiere del cruce exacto de PV hasta en 1.4e-6 relativo en el caso thresholds_rate_models, que por ello lleva tol 2e-6 para que ambas lecturas pasen. Los enteros, booleanos, índices, listas de identificadores de lagunas y motivos de rechazo se evalúan exactamente. 'gaps' enumera el conjunto completo esperado (sin orden); 'no_gaps' enumera identificadores de lagunas que deben estar ausentes. Los diccionarios parciales de componentes solo se evalúan en las claves dadas.",
          "pl": "Wszystkie tolerancje są względne. Domyślnie 1e-9 dla PV, EAC, składników i wartości tabeli rocznej w przypadkach z modelami rate, nhpp lub none: są to sumy w postaci zamkniętej, a wartość odniesienia potwierdzono niezależną drogą z dokładnością 1e-9. Przypadki z liczbą odnów Weibulla mają tol 1e-4 (pv, eac, years, renewal); wartości odniesienia to wartości schematu z rev .2 §4 (Xie 1989) przy 2 000 krokach, a każdą sprawdzono na 16x gęstszej siatce tego samego schematu (zgodność lepsza niż 2e-5). Wartości zależne od odnów są oceniane tylko w obszarze rev .2 beta >= 1, t_max/eta <= 60; oceniane przypadki Weibulla mają beta 1-3.5 i t_max/eta <= 3. Przypadek beta = 1 zachowuje dokładne wartości modelu rate (M = t/eta), które schemat odtwarza z dokładnością 1e-7. Parametry dopasowane 1e-9 (bisekcja do 1e-12 względnie). Progi zmiany preferencji 1e-6, jak dopuszcza specyfikacja; progiem odniesienia jest granica wariantu preferowanego, łącznie ze zmianą na remis, tj. punkt, w którym PV(challenger) - PV(preferred) = max(0.005 EUR, 1e-9 x largest |PV|); w przypadku thresholds_rate_models granica ta różni się od dokładnego przecięcia PV o maksymalnie 1.4e-6 względnie, dlatego ten przypadek ma tol 2e-6, aby przeszły oba odczyty. Liczby całkowite, wartości logiczne, indeksy, listy identyfikatorów luk i przyczyny odmowy są oceniane dokładnie. 'gaps' wymienia pełny oczekiwany zbiór (bez względu na kolejność); 'no_gaps' wymienia identyfikatory luk, których nie może być. Częściowe słowniki składników są oceniane tylko według podanych kluczy."

var RR_FAIL = ['none', 'rate', 'nhpp', 'weibull'];
var RR_AFTER = ['existing', 'new'];

function rrNum(v) { return (typeof v === 'number' && isFinite(v)) ? v : null; }
function rrKnown(v) { return rrNum(v) !== null; }

/* ---- failure models: expected number of failures in the age interval [a, b] (years) ---- */
function rrWeibullCdf(t, beta, eta) { return t <= 0 ? 0 : 1 - Math.exp(-Math.pow(t / eta, beta)); }
/* Renewal function M(t) of an ordinary renewal process with Weibull(beta, eta) lifetimes,
   solved on a uniform grid with the trapezoid-free Riemann-Stieltjes scheme of Xie (1989):
   M(t_n) = F(t_n) + sum_{i=1..n} [M(t_{n-i}) + M(t_{n-i+1})]/2 * [F(t_i) - F(t_{i-1})]   (implicit in M(t_n) via i=1 term) */
function rrRenewalTable(beta, eta, tmax, n) {
  var h = tmax / n, F = new Array(n + 1), M = new Array(n + 1), i, k;
  for (i = 0; i <= n; i++) F[i] = rrWeibullCdf(i * h, beta, eta);
  M[0] = 0;

ntado acumulado","pl":"Skumulowany koszt zdyskontowany"},"chart.comp":{"en":"Present value by component","uk":"Приведена вартість за складовими","de":"Barwert nach Komponenten","nl":"Contante waarde per component","fr":"Valeur actuelle par composante","es":"Valor actual por componente","pl":"Wartość bieżąca według składników"},"chart.caption":{"en":"Cumulative discounted cost per option over the horizon, and the present value split by component","uk":"Накопичені дисконтовані витрати кожного варіанта на горизонті та розподіл приведеної вартості за складовими","de":"Kumulierte diskontierte Kosten je Option über den Betrachtungszeitraum und Aufteilung des Barwerts nach Komponenten","nl":"Cumulatieve verdisconteerde kosten per optie over de horizon, en de contante waarde per component","fr":"Coût actualisé cumulé par option sur l'horizon, et répartition de la valeur actuelle par composante","es":"Coste descontado acumulado por opción a lo largo del horizonte y desglose del valor actual por componente","pl":"Skumulowany koszt zdyskontowany każdego wariantu w horyzoncie oraz podział wartości bieżącej według składników"},"chart.year":{"en":"year","uk":"рік","de":"Jahr","nl":"jaar","fr":"année","es":"año","pl":"rok"},"rep.title":{"en":"Repair / refurbish / replace / upgrade — life-cycle cost comparison","uk":"Ремонт / капітальний ремонт / заміна / модернізація — порівняння витрат життєвого циклу","de":"Instandsetzung / Überholung / Ersatz / Ertüchtigung — Vergleich der Lebenszykluskosten","nl":"Herstelling / revisie / vervanging / upgrade — vergelijking van levenscycluskosten","fr":"Réparation / rénovation / remplacement / modernisation — comparaison du coût de cycle de vie","es":"Reparación / reacondicionamiento / sustitución / modernización — comparación del coste del ciclo de vida","pl":"Naprawa / remont kapitalny / wymiana / modernizacja — porównanie kosztów cyklu życia"},"rep.scope":{"en":"Scope","uk":"Обсяг","de":"Umfang","nl":"Reikwijdte","fr":"Périmètre","es":"Alcance","pl":"Zakres"},"rep.exec":{"en":"%n options compared over %h years at a real discount rate of %r %.","uk":"Порівняно варіантів: %n; горизонт %h років; реальна ставка дисконтування %r %.","de":"%n Optionen verglichen über %h Jahre bei einem realen Diskontsatz von %r %.","nl":"%n opties vergeleken over %h jaar bij een reële disconteringsvoet van %r %.","fr":"%n options comparées sur %h ans à un taux d'actualisation réel de %r %.","es":"%n opciones comparadas en %h años con una tasa de descuento real del %r %.","pl":"Porównano warianty: %n; horyzont %h lat; realna stopa dyskontowa %r %."},"rep.decision":{"en":"Decision","uk":"Рішення","de":"Entscheidung","nl":"Beslissing","fr":"Décision","es":"Decisión","pl":"Decyzja"},"rep.basis":{"en":"Lowest present value of costs among the complete options whose constraints are all met","uk":"Найменша приведена вартість витрат серед повних варіантів, усі обмеження яких виконано","de":"Niedrigster Barwert der Kosten unter den vollständigen Optionen, deren Randbedingungen alle erfüllt sind","nl":"Laagste contante waarde van de kosten onder de volledige opties waarvan alle randvoorwaarden voldaan zijn","fr":"Valeur actuelle des coûts la plus basse parmi les options complètes dont toutes les contraintes sont satisfaites","es":"Menor valor actual de costes entre las opciones completas que cumplen todas sus restricciones","pl":"Najniższa wartość bieżąca kosztów spośród kompletnych wariantów, których wszystkie ograniczenia są spełnione"},"eq.pv":{"en":"PV = Σ investments·(1+r)^−t + Σ_y recurring costs of year y·(1+r)^−y − residual·(1+r)^−H","uk":"PV = Σ інвестиції·(1+r)^−t + Σ_y поточні витрати року y·(1+r)^−y − залишкова вартість·(1+r)^−H","de":"PV = Σ Investitionen·(1+r)^−t + Σ_y laufende Kosten des Jahres y·(1+r)^−y − Restwert·(1+r)^−H","nl":"PV = Σ investeringen·(1+r)^−t + Σ_y terugkerende kosten van jaar y·(1+r)^−y − restwaarde·(1+r)^−H","fr":"PV = Σ investissements·(1+r)^−t + Σ_y coûts récurrents de l'année y·(1+r)^−y − valeur résiduelle·(1+r)^−H","es":"PV = Σ inversiones·(1+r)^−t + Σ_y costes recurrentes del año y·(1+r)^−y − valor residual·(1+r)^−H","pl":"PV = Σ inwestycje·(1+r)^−t + Σ_y koszty bieżące roku y·(1+r)^−y − wartość rezydualna·(1+r)^−H"},"eq.eac":{"en":"EAC = PV · r / (1 − (1+r)^−H); EAC = PV / H at r = 0","uk":"EAC = PV · r / (1 − (1+r)^−H); EAC = PV / H при r = 0","de":"EAC = PV · r / (1 − (1+r)^−H); EAC = PV / H bei r = 0","nl":"EAC = PV · r / (1 − (1+r)^−H); EAC = PV / H bij r = 0","fr":"EAC = PV · r / (1 − (1+r)^−H) ; EAC = PV / H pour r = 0","es":"EAC = PV · r / (1 − (1+r)^−H); EAC = PV / H con r = 0","pl":"EAC = PV · r / (1 − (1+r)^−H); EAC = PV / H przy r = 0"},"eq.nhpp":{"en":"Power-law NHPP: N(a,b) = (b/η)^β − (a/η)^β; Crow-AMSAA fit β = n / Σ ln(T/tᵢ), η = T / n^(1/β)","uk":"Степеневий NHPP: N(a,b) = (b/η)^β − (a/η)^β; оцінка Crow-AMSAA β = n / Σ ln(T/tᵢ), η = T / n^(1/β)","de":"Potenzgesetz-NHPP: N(a,b) = (b/η)^β − (a/η)^β; Crow-AMSAA-Anpassung β = n / Σ ln(T/tᵢ), η = T / n^(1/β)","nl":"Machtswet-NHPP: N(a,b) = (b/η)^β − (a/η)^β; Crow-AMSAA-schatting β = n / Σ ln(T/tᵢ), η = T / n^(1/β)","fr":"NHPP en loi puissance : N(a,b) = (b/η)^β − (a/η)^β ; ajustement Crow-AMSAA β = n / Σ ln(T/tᵢ), η = T / n^(1/β)","es":"NHPP de ley potencial: N(a,b) = (b/η)^β − (a/η)^β; ajuste Crow-AMSAA β = n / Σ ln(T/tᵢ), η = T / n^(1/β)","pl":"NHPP potęgowy: N(a,b) = (b/η)^β − (a/η)^β; dopasowanie Crow-AMSAA β = n / Σ ln(T/tᵢ), η = T / n^(1/β)"},"eq.renewal":{"en":"Weibull renewal: M(t) = F(t) + ∫ M(t−x) dF(x), solved on 2 000 steps","uk":"Відновлення Вейбулла: M(t) = F(t) + ∫ M(t−x) dF(x), розв'язано на 2 000 кроках","de":"Weibull-Erneuerung: M(t) = F(t) + ∫ M(t−x) dF(x), gelöst mit 2 000 Schritten","nl":"Weibull-vernieuwing: M(t) = F(t) + ∫ M(t−x) dF(x), opgelost in 2 000 stappen","fr":"Renouvellement de Weibull : M(t) = F(t) + ∫ M(t−x) dF(x), résolu sur 2 000 pas","es":"Renovación de Weibull: M(t) = F(t) + ∫ M(t−x) dF(x), resuelta en 2 000 pasos","pl":"Odnowa Weibulla: M(t) = F(t) + ∫ M(t−x) dF(x), rozwiązane w 2 000 krokach"},"rng.horizon":{"en":"Horizon 1–60 whole years; expected values only; costs in constant euros at a real discount rate","uk":"Горизонт 1–60 повних років; лише очікувані значення; витрати в постійних євро за реальної ставки дисконтування","de":"Betrachtungszeitraum 1–60 ganze Jahre; nur Erwartungswerte; Kosten in konstanten Euro bei realem Diskontsatz","nl":"Horizon 1–60 volle jaren; alleen verwachtingswaarden; kosten in constante euro bij een reële disconteringsvoet","fr":"Horizon de 1 à 60 années entières ; valeurs espérées uniquement ; coûts en euros constants à un taux d'actualisation réel","es":"Horizonte de 1–60 años enteros; solo valores esperados; costes en euros constantes con una tasa de descuento real","pl":"Horyzont 1–60 pełnych lat; wyłącznie wartości oczekiwane; koszty w stałych euro przy realnej stopie dyskontowej"},"note.model":{"en":"The calculation states expected costs. It does not choose: the decision, its basis and its approval stay with the responsible engineer.","uk":"Розрахунок показує очікувані витрати. Вибору він не робить: рішення, його обґрунтування та погодження залишаються за відповідальним інженером.","de":"Die Berechnung weist erwartete Kosten aus. Sie trifft keine Wahl: Entscheidung, Begründung und Freigabe liegen beim verantwortlichen Ingenieur.","nl":"De berekening geeft verwachte kosten. Ze maakt geen keuze: de beslissing, de onderbouwing en de goedkeuring blijven bij de verantwoordelijke ingenieur.","fr":"Le calcul indique des coûts espérés. Il ne choisit pas : la décision, sa justification et son approbation restent à l'ingénieur responsable.","es":"El cálculo indica costes esperados. No elige: la decisión, su fundamento y su aprobación corresponden al ingeniero responsable.","pl":"Obliczenie podaje koszty oczekiwane. Nie dokonuje wyboru: decyzja, jej uzasadnienie i zatwierdzenie należą do odpowiedzialnego inżyniera."},"footer":{"en":"Life-cycle cost comparison on one horizon (IEC 60300-3-3 structure). Failure models: constant rate; power-law NHPP for a repaired item (Crow-AMSAA fit); Weibull renewal for an item replaced on failure (censored maximum-likelihood fit). A fit is refused below 3 failures. Expected values only; no taxes, financing or inflation beyond the real discount rate.","uk":"Порівняння витрат життєвого циклу на одному горизонті (структура IEC 60300-3-3). Моделі відмов: стала інтенсивність; степеневий NHPP для ремонтованого об'єкта (оцінка Crow-AMSAA); відновлення Вейбулла для об'єкта, що замінюється при відмові (оцінка максимальної правдоподібності з цензуруванням). Якщо відмов менше 3, оцінку не виконують. Лише очікувані значення; податки, фінансування та інфляція поза реальною ставкою дисконтування не враховуються.","de":"Lebenszykluskostenvergleich über einen Betrachtungszeitraum (Struktur nach IEC 60300-3-3). Ausfallmodelle: konstante Rate; Potenzgesetz-NHPP für eine instand gesetzte Einheit (Crow-AMSAA-Anpassung); Weibull-Erneuerung für eine bei Ausfall ersetzte Einheit (Maximum-Likelihood-Anpassung mit Zensierung). Unter 3 Ausfällen wird keine Anpassung vorgenommen. Nur Erwartungswerte; keine Steuern, Finanzierung oder Inflation über den realen Diskontsatz hinaus.","nl":"Vergelijking van levenscycluskosten over één horizon (structuur volgens IEC 60300-3-3). Faalmodellen: constante frequentie; machtswet-NHPP voor een hersteld item (Crow-AMSAA-schatting); Weibull-vernieuwing voor een item dat bij storing wordt vervangen (maximum-likelihoodschatting met censurering). Onder 3 storingen wordt niet geschat. Alleen verwachtingswaarden; geen belastingen, financiering of inflatie buiten de reële disconteringsvoet.","fr":"Comparaison du coût de cycle de vie sur un horizon (structure IEC 60300-3-3). Modèles de défaillance : taux constant ; NHPP en loi puissance pour un élément réparé (ajustement Crow-AMSAA) ; renouvellement de Weibull pour un élément remplacé à la défaillance (ajustement du maximum de vraisemblance avec censure). Aucun ajustement en dessous de 3 défaillances. Valeurs espérées uniquement ; ni taxes, ni financement, ni inflation au-delà du taux d'actualisation réel.","es":"Comparación del coste del ciclo de vida en un horizonte (estructura IEC 60300-3-3). Modelos de fallo: tasa constante; NHPP de ley potencial para un elemento reparado (ajuste Crow-AMSAA); renovación de Weibull para un elemento sustituido al fallar (ajuste de máxima verosimilitud con censura). No se ajusta con menos de 3 fallos. Solo valores esperados; sin impuestos, financiación ni inflación más allá de la tasa de descuento real.","pl":"Porównanie kosztów cyklu życia w jednym horyzoncie (struktura wg IEC 60300-3-3). Modele uszkodzeń: stała intensywność; NHPP potęgowy dla obiektu naprawianego (dopasowanie Crow-AMSAA); odnowa Weibulla dla obiektu wymienianego po uszkodzeniu (dopasowanie metodą największej wiarygodności z cenzurowaniem). Poniżej 3 uszkodzeń dopasowanie nie jest wykonywane. Wyłącznie wartości oczekiwane; bez podatków, finansowania i inflacji poza realną stopą dyskontową."},"learn.intro.t":{"en":"What this tool does","uk":"Що робить цей інструмент","de":"Was dieses Werkzeug tut","nl":"Wat deze tool doet","fr":"Ce que fait cet outil","es":"Qué hace esta herramienta","pl":"Co robi to narzędzie"},"learn.intro.b":{"en":"Describe the existing equipment and two to six strategies. Each strategy becomes a stream of yearly costs over one horizon; the stream is discounted to a present value. The cheapest admissible option is named only when it is not tied. Unknown inputs stay unknown and stop the comparison instead of becoming zero.","uk":"Опишіть наявне обладнання та від двох до шести стратегій. Кожна стратегія перетворюється на потік річних витрат на одному горизонті; потік дисконтується до приведеної вартості. Найдешевший допустимий варіант називається лише тоді, коли немає рівності. Невідомі вхідні дані залишаються невідомими й зупиняють порівняння; нулем вони не замінюються.","de":"Beschreiben Sie das bestehende Betriebsmittel und zwei bis sechs Strategien. Jede Strategie wird zu einer Folge jährlicher Kosten über einen Betrachtungszeitraum; diese Folge wird auf einen Barwert diskontiert. Die günstigste zulässige Option wird nur genannt, wenn kein Gleichstand vorliegt. Unbekannte Eingaben bleiben unbekannt und stoppen den Vergleich; sie werden nicht zu null.","nl":"Beschrijf de bestaande installatie en twee tot zes strategieën. Elke strategie wordt een reeks jaarlijkse kosten over één horizon; die reeks wordt verdisconteerd tot een contante waarde. De goedkoopste toelaatbare optie wordt alleen genoemd als er geen gelijkspel is. Onbekende invoer blijft onbekend en stopt de vergelijking; ze wordt niet nul.","fr":"Décrivez l'équipement existant et deux à six stratégies. Chaque stratégie devient une suite de coûts annuels sur un horizon ; cette suite est actualisée en valeur actuelle. L'option admissible la moins chère n'est désignée qu'en l'absence d'égalité. Les données inconnues restent inconnues et arrêtent la comparaison ; elles ne deviennent pas zéro.","es":"Describa el equipo existente y de dos a seis estrategias. Cada estrategia se convierte en una serie de costes anuales en un horizonte; la serie se descuenta a valor actual. La opción admisible más barata solo se indica si no hay empate. Los datos desconocidos siguen siendo desconocidos y detienen la comparación; no se convierten en cero.","pl":"Opisz istniejące urządzenie oraz od dwóch do sześciu strategii. Każda strategia staje się strumieniem rocznych kosztów w jednym horyzoncie; strumień jest dyskontowany do wartości bieżącej. Najtańszy dopuszczalny wariant jest wskazywany tylko wtedy, gdy nie ma remisu. Nieznane dane pozostają nieznane i zatrzymują porównanie; nie są zastępowane zerem."},"learn.lcc.t":{"en":"Life-cycle cost on one horizon","uk":"Витрати життєвого циклу на одному горизонті","de":"Lebenszykluskosten über einen Betrachtungszeitraum","nl":"Levenscycluskosten over één horizon","fr":"Coût de cycle de vie sur un horizon","es":"Coste del ciclo de vida en un horizonte","pl":"Koszt cyklu życia w jednym horyzoncie"},"learn.lcc.b":{"en":"All options are compared over the same horizon. Investments are discounted at the moment they are made; recurring costs at the end of each year; the residual value of the last new item is credited at the horizon, straight-line over its life.","uk":"Усі варіанти порівнюються на одному горизонті. Інвестиції дисконтуються на момент їх здійснення; поточні витрати — на кінець кожного року; залишкова вартість останнього нового об'єкта зараховується на кінець горизонту за лінійним методом на строк його служби.","de":"Alle Optionen werden über denselben Betrachtungszeitraum verglichen. Investitionen werden zum Zeitpunkt ihrer Tätigung diskontiert, laufende Kosten zum Ende jedes Jahres; der Restwert der letzten neuen Einheit wird am Ende des Zeitraums gutgeschrieben, linear über ihre Nutzungsdauer.","nl":"Alle opties worden over dezelfde horizon vergeleken. Investeringen worden verdisconteerd op het moment dat ze worden gedaan, terugkerende kosten aan het einde van elk jaar; de restwaarde van het laatste nieuwe item wordt aan het einde van de horizon gecrediteerd, lineair over de levensduur.","fr":"Toutes les options sont comparées sur le même horizon. Les investissements sont actualisés à la date où ils sont engagés, les coûts récurrents en fin de chaque année ; la valeur résiduelle du dernier élément neuf est créditée à l'horizon, linéairement sur sa durée de vie.","es":"Todas las opciones se comparan en el mismo horizonte. Las inversiones se descuentan en el momento en que se realizan; los costes recurrentes, al final de cada año; el valor residual del último elemento nuevo se abona al final del horizonte, de forma lineal sobre su vida útil.","pl":"Wszystkie warianty są porównywane w tym samym horyzoncie. Inwestycje dyskontuje się na moment ich poniesienia, koszty bieżące na koniec każdego roku; wartość rezydualna ostatniego nowego obiektu jest zaliczana na koniec horyzontu, liniowo w okresie jego eksploatacji."},"learn.fail.t":{"en":"Which failure model","uk":"Яка модель відмов","de":"Welches Ausfallmodell","nl":"Welk faalmodel","fr":"Quel modèle de défaillance","es":"Qué modelo de fallos","pl":"Który model uszkodzeń"},"learn.fail.b":{"en":"Constant rate: failures do not depend on age. Power-law NHPP: a repaired item ages; repair returns it to the state just before the failure. Weibull renewal: the item is replaced on failure by a new one. Fit the NHPP only on a repaired item's history and the Weibull only on times to failure of items replaced on failure; with fewer than 3 failures nothing is fitted and a scenario rate is needed.","uk":"Стала інтенсивність: відмови не залежать від віку. Степеневий NHPP: ремонтований об'єкт старіє; ремонт повертає його до стану безпосередньо перед відмовою. Відновлення Вейбулла: при відмові об'єкт замінюють новим. Оцінюйте NHPP лише за історією ремонтованого об'єкта, а Вейбулла — лише за наробітками до відмови об'єктів, що замінюються при відмові; якщо відмов менше 3, оцінка не виконується і потрібна сценарна інтенсивність.","de":"Konstante Rate: Ausfälle hängen nicht vom Alter ab. Potenzgesetz-NHPP: eine instand gesetzte Einheit altert; die Instandsetzung bringt sie in den Zustand unmittelbar vor dem Ausfall zurück. Weibull-Erneuerung: die Einheit wird bei Ausfall durch eine neue ersetzt. Den NHPP nur an die Historie einer instand gesetzten Einheit anpassen und Weibull nur an Zeiten bis zum Ausfall von Einheiten, die bei Ausfall ersetzt werden; unter 3 Ausfällen wird nichts angepasst und eine Szenariorate ist nötig.","nl":"Constante frequentie: storingen hangen niet af van de leeftijd. Machtswet-NHPP: een hersteld item veroudert; herstelling brengt het terug in de toestand vlak vóór de storing. Weibull-vernieuwing: het item wordt bij storing door een nieuw vervangen. Schat het NHPP alleen op de historiek van een hersteld item en Weibull alleen op tijden tot storing van items die bij storing worden vervangen; onder 3 storingen wordt niets geschat en is een scenariofrequentie nodig.","fr":"Taux constant : les défaillances ne dépendent pas de l'âge. NHPP en loi puissance : un élément réparé vieillit ; la réparation le ramène à l'état juste avant la défaillance. Renouvellement de Weibull : l'élément est remplacé par un neuf à la défaillance. N'ajustez le NHPP que sur l'historique d'un élément réparé et Weibull que sur les durées jusqu'à défaillance d'éléments remplacés à la défaillance ; en dessous de 3 défaillances, rien n'est ajusté et un taux de scénario est nécessaire.","es":"Tasa constante: los fallos no dependen de la edad. NHPP de ley potencial: un elemento reparado envejece; la reparación lo devuelve al estado inmediatamente anterior al fallo. Renovación de Weibull: el elemento se sustituye por uno nuevo al fallar. Ajuste el NHPP solo al historial de un elemento reparado y Weibull solo a tiempos hasta el fallo de elementos sustituidos al fallar; con menos de 3 fallos no se ajusta nada y se necesita una tasa de escenario.","pl":"Stała intensywność: uszkodzenia nie zależą od wieku. NHPP potęgowy: naprawiany obiekt się starzeje; naprawa przywraca go do stanu tuż przed uszkodzeniem. Odnowa Weibulla: obiekt jest po uszkodzeniu wymieniany na nowy. NHPP dopasowuj tylko do historii obiektu naprawianego, a Weibulla tylko do czasów do uszkodzenia obiektów wymienianych po uszkodzeniu; przy mniej niż 3 uszkodzeniach nic nie jest dopasowywane i potrzebna jest intensywność scenariuszowa."},"learn.lead.t":{"en":"Lead time","uk":"Термін до впровадження","de":"Vorlaufzeit","nl":"Doorlooptijd","fr":"Délai de mise en œuvre","es":"Plazo de implantación","pl":"Czas do wdrożenia"},"learn.lead.b":{"en":"Until an option is implemented, the existing equipment keeps running with its own failures and costs. A long lead time therefore carries the old failure cost forward.","uk":"Доки варіант не впроваджено, наявне обладнання продовжує працювати з власними відмовами та витратами. Тому тривалий термін до впровадження переносить старі витрати на відмови вперед.","de":"Bis eine Option umgesetzt ist, läuft das bestehende Betriebsmittel mit seinen eigenen Ausfällen und Kosten weiter. Eine lange Vorlaufzeit trägt daher die alten Ausfallkosten weiter.","nl":"Tot een optie is geïmplementeerd, blijft de bestaande installatie draaien met haar eigen storingen en kosten. Een lange doorlooptijd sleept de oude storingskosten dus mee.","fr":"Tant qu'une option n'est pas mise en œuvre, l'équipement existant continue de fonctionner avec ses propres défaillances et coûts. Un long délai prolonge donc l'ancien coût de défaillance.","es":"Hasta que se implanta una opción, el equipo existente sigue funcionando con sus propios fallos y costes. Por ello, un plazo largo prolonga el coste de fallos anterior.","pl":"Dopóki wariant nie zostanie wdrożony, istniejące urządzenie pracuje dalej z własnymi uszkodzeniami i kosztami. Długi czas do wdrożenia przenosi więc dawny koszt uszkodzeń dalej."},"learn.case.t":{"en":"Try it: when does the ranking change?","uk":"Спробуйте: коли змінюється ранжування?","de":"Ausprobieren: Wann ändert sich die Reihenfolge?","nl":"Probeer het: wanneer wijzigt de rangschikking?","fr":"Essayez : quand le classement change-t-il ?","es":"Pruébelo: ¿cuándo cambia la clasificación?","pl":"Sprawdź: kiedy zmienia się ranking?"},"learn.case.b":{"en":"Load the pump example. The replacement is preferred. Before reading on, guess how many months of lead time the replacement can take before the repair becomes cheaper.","uk":"Завантажте приклад насоса. Перевагу має заміна. Перш ніж читати далі, оцініть, скільки місяців може тривати термін до впровадження заміни, доки ремонт не стане дешевшим.","de":"Laden Sie das Pumpenbeispiel. Der Ersatz wird bevorzugt. Schätzen Sie vor dem Weiterlesen, wie viele Monate Vorlaufzeit der Ersatz haben darf, bevor die Instandsetzung günstiger wird.","nl":"Laad het pompvoorbeeld. De vervanging heeft de voorkeur. Schat vóór u verder leest hoeveel maanden doorlooptijd de vervanging mag hebben voordat de herstelling goedkoper wordt.","fr":"Chargez l'exemple de la pompe. Le remplacement est préféré. Avant de poursuivre, estimez combien de mois de délai le remplacement peut prendre avant que la réparation devienne moins chère.","es":"Cargue el ejemplo de la bomba. Se prefiere la sustitución. Antes de seguir leyendo, estime cuántos meses de plazo puede tener la sustitución antes de que la reparación resulte más barata.","pl":"Wczytaj przykład pompy. Preferowana jest wymiana. Zanim przeczytasz dalej, oszacuj, ile miesięcy może trwać realizacja wymiany, zanim naprawa stanie się tańsza."},"learn.explain.t":{"en":"Explanation","uk":"Пояснення","de":"Erklärung","nl":"Uitleg","fr":"Explication","es":"Explicación","pl":"Wyjaśnienie"},"learn.explain.b":{"en":"The switch-over table answers it: the lead-time row of the replacement gives the value at which the preference changes. Every month of lead time keeps the ageing pump in service with its failure cost; at the threshold the two present values are equal.","uk":"Відповідь дає таблиця порогів: рядок терміну до впровадження заміни показує значення, за якого змінюється перевага. Кожен місяць затримки залишає старіючий насос в експлуатації з його витратами на відмови; на порозі обидві приведені вартості рівні.","de":"Die Schwellentabelle beantwortet dies: Die Zeile Vorlaufzeit des Ersatzes zeigt den Wert, bei dem die Präferenz wechselt. Jeder Monat Vorlaufzeit hält die alternde Pumpe mit ihren Ausfallkosten in Betrieb; an der Schwelle sind beide Barwerte gleich.","nl":"De drempeltabel geeft het antwoord: de rij doorlooptijd van de vervanging toont de waarde waarbij de voorkeur wijzigt. Elke maand doorlooptijd houdt de verouderende pomp in bedrijf met haar storingskosten; op de drempel zijn beide contante waarden gelijk.","fr":"Le tableau des seuils répond : la ligne du délai du remplacement donne la valeur à laquelle la préférence change. Chaque mois de délai maintient en service la pompe vieillissante avec son coût de défaillance ; au seuil, les deux valeurs actuelles sont égales.","es":"La tabla de umbrales lo responde: la fila del plazo de la sustitución da el valor en el que cambia la preferencia. Cada mes de plazo mantiene en servicio la bomba envejecida con su coste de fallos; en el umbral ambos valores actuales son iguales.","pl":"Odpowiedź daje tabela progów: wiersz czasu do wdrożenia wymiany podaje wartość, przy której zmienia się preferencja. Każdy miesiąc oczekiwania utrzymuje starzejącą się pompę w eksploatacji wraz z kosztem jej uszkodzeń; na progu obie wartości bieżące są równe."},"learn.fix.t":{"en":"Correct the plan","uk":"Скоригуйте план","de":"Den Plan korrigieren","nl":"Het plan bijsturen","fr":"Corriger le plan","es":"Corregir el plan","pl":"Popraw plan"},"learn.fix.b":{"en":"If the real lead time is above the threshold, either shorten it (stock, framework contract) or accept the repair. Change the lead time and watch the verdict and the cumulative-cost chart move.","uk":"Якщо реальний термін до впровадження перевищує поріг, скоротіть його (склад, рамковий договір) або прийміть ремонт. Змініть термін і простежте, як змінюються висновок і графік накопичених витрат.","de":"Liegt die tatsächliche Vorlaufzeit über der Schwelle, verkürzen Sie sie (Lagerbestand, Rahmenvertrag) oder akzeptieren Sie die Instandsetzung. Ändern Sie die Vorlaufzeit und beobachten Sie Ergebnis und Diagramm der kumulierten Kosten.","nl":"Ligt de werkelijke doorlooptijd boven de drempel, verkort ze dan (voorraad, raamcontract) of aanvaard de herstelling. Wijzig de doorlooptijd en volg hoe het oordeel en de grafiek van cumulatieve kosten verschuiven.","fr":"Si le délai réel dépasse le seuil, raccourcissez-le (stock, contrat-cadre) ou acceptez la réparation. Modifiez le délai et observez l'évolution du verdict et du graphique du coût cumulé.","es":"Si el plazo real supera el umbral, acórtelo (existencias, contrato marco) o acepte la reparación. Cambie el plazo y observe cómo varían el veredicto y el gráfico de coste acumulado.","pl":"Jeśli rzeczywisty czas do wdrożenia przekracza próg, skróć go (zapas, umowa ramowa) albo przyjmij naprawę. Zmień czas do wdrożenia i obserwuj, jak zmieniają się werdykt i wykres kosztu skumulowanego."},"learn.thr.t":{"en":"Switch-over thresholds","uk":"Пороги зміни переваги","de":"Umschlagschwellen","nl":"Omslagdrempels","fr":"Seuils de basculement","es":"Umbrales de cambio","pl":"Progi zmiany preferencji"},"learn.thr.b":{"en":"For a few inputs the tool finds the value at which the preferred option changes, below and above the current value. A threshold close to the current value means the decision is fragile.","uk":"Для кількох вхідних величин інструмент знаходить значення, за якого змінюється рекомендований варіант, нижче та вище поточного значення. Поріг, близький до поточного значення, означає, що рішення нестійке.","de":"Für einige Eingaben bestimmt das Werkzeug den Wert, bei dem die bevorzugte Option wechselt, unterhalb und oberhalb des aktuellen Werts. Eine Schwelle nahe am aktuellen Wert bedeutet eine fragile Entscheidung.","nl":"Voor enkele invoerwaarden zoekt de tool de waarde waarbij de voorkeursoptie wijzigt, onder en boven de huidige waarde. Een drempel dicht bij de huidige waarde betekent dat de beslissing fragiel is.","fr":"Pour quelques données, l'outil trouve la valeur à laquelle l'option préférée change, en dessous et au-dessus de la valeur actuelle. Un seuil proche de la valeur actuelle signifie que la décision est fragile.","es":"Para algunos datos, la herramienta halla el valor en el que cambia la opción preferente, por debajo y por encima del valor actual. Un umbral próximo al valor actual indica una decisión frágil.","pl":"Dla kilku danych wejściowych narzędzie wyznacza wartość, przy której zmienia się wariant preferowany, poniżej i powyżej wartości bieżącej. Próg bliski wartości bieżącej oznacza, że decyzja jest niestabilna."},"learn.states.t":{"en":"Three separate states","uk":"Три окремі стани","de":"Drei getrennte Zustände","nl":"Drie afzonderlijke toestanden","fr":"Trois états distincts","es":"Tres estados separados","pl":"Trzy odrębne stany"},"learn.states.b":{"en":"Calculation completed: every option has a present value. Criterion met: a single option is cheapest, and no input, constraint or option is open. Decision approved: an approval with a reference, bound to these inputs; any change to an input withdraws it.","uk":"Розрахунок виконано: кожен варіант має приведену вартість. Критерій виконано: один варіант найдешевший, і жодна вхідна величина, обмеження чи варіант не є відкритими. Рішення погоджено: погодження з реквізитами, прив'язане до цих вхідних даних; будь-яка зміна вхідної величини його скасовує.","de":"Berechnung abgeschlossen: Jede Option hat einen Barwert. Kriterium erfüllt: Eine einzige Option ist am günstigsten, und keine Eingabe, Randbedingung oder Option ist offen. Entscheidung freigegeben: eine Freigabe mit Referenz, gebunden an diese Eingaben; jede Änderung einer Eingabe zieht sie zurück.","nl":"Berekening voltooid: elke optie heeft een contante waarde. Criterium voldaan: één optie is het goedkoopst en geen invoer, randvoorwaarde of optie staat open. Beslissing goedgekeurd: een goedkeuring met referentie, gekoppeld aan deze invoer; elke wijziging van een invoer trekt ze in.","fr":"Calcul terminé : chaque option a une valeur actuelle. Critère satisfait : une seule option est la moins chère et aucune donnée, contrainte ou option n'est ouverte. Décision approuvée : une approbation avec référence, liée à ces données ; toute modification d'une donnée la retire.","es":"Cálculo completado: cada opción tiene un valor actual. Criterio cumplido: una única opción es la más barata y ningún dato, restricción u opción está abierto. Decisión aprobada: una aprobación con referencia, vinculada a estos datos; cualquier cambio en un dato la retira.","pl":"Obliczenie zakończone: każdy wariant ma wartość bieżącą. Kryterium spełnione: jeden wariant jest najtańszy i żadna dana wejściowa, ograniczenie ani wariant nie pozostają otwarte. Decyzja zatwierdzona: zatwierdzenie z sygnaturą, powiązane z tymi danymi; każda zmiana danej wejściowej je wycofuje."},"preset.control":{"en":"Control · identical options at 0 %","uk":"Контроль · однакові варіанти при 0 %","de":"Kontrolle · identische Optionen bei 0 %","nl":"Controle · identieke opties bij 0 %","fr":"Contrôle · options identiques à 0 %","es":"Control · opciones idénticas al 0 %","pl":"Kontrola · identyczne warianty przy 0 %"},"preset.pump":{"en":"Pump · repair or replace","uk":"Насос · ремонт або заміна","de":"Pumpe · Instandsetzung oder Ersatz","nl":"Pomp · herstellen of vervangen","fr":"Pompe · réparer ou remplacer","es":"Bomba · reparar o sustituir","pl":"Pompa · naprawa lub wymiana"},"preset.drive":{"en":"Drive · replace with fitted failure history","uk":"Привод · заміна з оціненою історією відмов","de":"Antrieb · Ersatz mit angepasster Ausfallhistorie","nl":"Aandrijving · vervangen met geschatte storingshistoriek","fr":"Variateur · remplacement avec historique de défaillances ajusté","es":"Accionamiento · sustitución con historial de fallos ajustado","pl":"Napęd · wymiana z dopasowaną historią uszkodzeń"},"preset.ahu":{"en":"Air-handling unit · upgrade for O&M savings","uk":"Припливна установка · модернізація заради економії на експлуатації і ТО","de":"Lüftungsgerät · Ertüchtigung für geringere Betriebs- und Instandhaltungskosten","nl":"Luchtbehandelingskast · upgrade voor lagere exploitatie- en onderhoudskosten","fr":"Centrale de traitement d'air · modernisation pour réduire l'exploitation et la maintenance","es":"Unidad de tratamiento de aire · modernización para ahorrar en operación y mantenimiento","pl":"Centrala wentylacyjna · modernizacja dla oszczędności eksploatacji i utrzymania"},"preset.problem":{"en":"Problem · no usable failure history","uk":"Проблема · немає придатної історії відмов","de":"Problem · keine verwertbare Ausfallhistorie","nl":"Probleem · geen bruikbare storingshistoriek","fr":"Problème · aucun historique de défaillances exploitable","es":"Problema · sin historial de fallos utilizable","pl":"Problem · brak użytecznej historii uszkodzeń"},"preset.lto":{"en":"Plant LTO · operate to end or extend","uk":"LTO установки · експлуатація до кінця строку або продовження","de":"Anlagen-LTO · Betrieb bis Ende oder Verlängerung","nl":"LTO van de installatie · uitbaten tot einde of verlengen","fr":"LTO de la centrale · exploiter jusqu'au terme ou prolonger","es":"LTO de la planta · operar hasta el final o prolongar","pl":"LTO instalacji · eksploatacja do końca lub przedłużenie"},"pn.control":{"en":"Two identical options, 0 % discount: equal present values and no winner.","uk":"Два однакові варіанти, дисконтування 0 %: рівні приведені вартості й жодного переможця.","de":"Zwei identische Optionen, 0 % Diskont: gleiche Barwerte und kein Sieger.","nl":"Twee identieke opties, 0 % disconto: gelijke contante waarden en geen winnaar.","fr":"Deux options identiques, actualisation à 0 % : valeurs actuelles égales et aucune option retenue.","es":"Dos opciones idénticas, descuento del 0 %: valores actuales iguales y ninguna ganadora.","pl":"Dwa identyczne warianty, dyskonto 0 %: równe wartości bieżące i brak zwycięzcy."},"pn.pump":{"en":"Repair of an ageing pump against replacement with a 6-month lead time.","uk":"Ремонт старіючого насоса проти заміни з терміном до впровадження 6 місяців.","de":"Instandsetzung einer alternden Pumpe gegen Ersatz mit 6 Monaten Vorlaufzeit.","nl":"Herstelling van een verouderende pomp tegenover vervanging met 6 maanden doorlooptijd.","fr":"Réparation d'une pompe vieillissante face à un remplacement avec un délai de 6 mois.","es":"Reparación de una bomba envejecida frente a sustitución con un plazo de 6 meses.","pl":"Naprawa starzejącej się pompy wobec wymiany z czasem realizacji 6 miesięcy."},"pn.drive": var PY_CORE = "# repairreplace core — Python mirror of the page's JavaScript model (standard library only).\nimport math\n\nRR_MODEL_VERSION = 'repairreplace-1.0'\nRR_MIN_FAILURES = 3\nRR_RENEWAL_STEPS = 2000\n_RENEWAL_CACHE = {}\n\n\ndef known(v):\n    return isinstance(v, (int, float)) and not isinstance(v, bool) and math.isfinite(v)\n\n\ndef weibull_cdf(t, beta, eta):\n    return 0.0 if t <= 0 else 1.0 - math.exp(-((t / eta) ** beta))\n\n\ndef renewal_table(beta, eta, tmax, n):\n    \"\"\"Renewal function M(t) for Weibull lifetimes on a uniform grid (Xie 1989 scheme).\"\"\"\n    h = tmax / n\n    F = [weibull_cdf(i * h, beta, eta) for i in range(n + 1)]\n    M = [0.0] * (n + 1)\n    dF = [0.0] + [F[i] - F[i - 1] for i in range(1, n + 1)]\n    for k in range(1, n + 1):\n        s = F[k]\n        for i in range(2, k + 1):\n            s += 0.5 * (M[k - i] + M[k - i + 1]) * dF[i]\n        s += 0.5 * M[k - 1] * dF[1]\n        M[k] = s / (1 - 0.5 * dF[1])\n    return {'h': h, 'M': M}\n\n\ndef renewal_at(tab, t):\n    if t <= 0:\n        return 0.0\n    x = t / tab['h']\n    i = int(math.floor(x))\n    M = tab['M']\n    if i >= len(M) - 1:\n        return M[-1]\n    return M[i] + (M[i + 1] - M[i]) * (x - i)\n\n\ndef renewal_cached(beta, eta, tmax):\n    key = (beta, eta, tmax)\n    if key not in _RENEWAL_CACHE:\n        _RENEWAL_CACHE[key] = renewal_table(beta, eta, tmax, RR_RENEWAL_STEPS)\n    return _RENEWAL_CACHE[key]\n\n\ndef expected_failures(m, a, b):\n    if not m or m['model'] == 'none' or b <= a:\n        return 0.0\n    if m['model'] == 'rate':\n        return m['rate'] * (b - a)\n    if m['model'] == 'nhpp':\n        return (b / m['eta']) ** m['beta'] - (a / m['eta']) ** m['beta']\n    if m['model'] == 'weibull':\n        tab = renewal_cached(m['beta'], m['eta'], m.get('tmax') or b)\n        return renewal_at(tab, b) - renewal_at(tab, a)\n    return 0.0\n\n\ndef n_fail(m, a, b):\n    n = expected_failures(m, a, b)\n    return n * m['mult'] if (m and m.get('m 'capex']\n                outage_y += v['outageCost']\n                pv_inv += (v['capex'] + v['outageCost']) * df(r, v['t'])\n        recur = opex + fail_cost + risk\n        tot['opex'] += opex * d\n        tot['failure'] += fail_cost * d\n        tot['risk'] += risk * d\n        years.append({'year': y, 'capex': capex_y, 'outage': outage_y, 'opex': opex, 'failures': fails,\n                      'failureCost': fail_cost, 'risk': risk, 'residual': 0.0,\n                      'nominal': capex_y + outage_y + recur, 'discounted': recur * d + pv_inv})\n    for v in invest:\n        tot['capex'] += v['capex'] * df(r, v['t'])\n        tot['outage'] += v['outageCost'] * df(r, v['t'])\n    resid = 0.0\n    if life:\n        last = invest[-1]\n        resid = last['capex'] * max(0.0, (life - (H - last['t'])) / life)\n    tot['residual'] = -resid * df(r, H)\n    if years:\n        years[-1]['residual'] = -resid\n        years[-1]['nominal'] -= resid\n        years[-1]['discounted'] += tot['residual']\n    pv = tot['capex'] + tot['outage'] + tot['opex'] + tot['failure'] + tot['risk'] + tot['residual']\n    return {'pv': pv, 'eac': pv / annuity(r, H), 'components': tot, 'years': years, 'residualValue': resid}\n\n\ndef missing(o):\n    m = []\n    if o['kind'] != 'continue':\n        for k in ('capex', 'leadMonths', 'outageHours'):\n            if not known(o.get(k)):\n                m.append(k)\n        if o.get('after') == 'existing' and not known(o.get('ageAfter')):\n            m.append('ageAfter')\n        if o.get('after') == 'new':\n            for k in ('opex', 'failCost', 'failHours', 'life'):\n                if not known(o.get(k)):\n                    m.append(k)\n    for i, q in enumerate(o.get('risks') or []):\n        if not known(q.get('p')):\n            m.append('risks[%d].p' % i)\n        if not known(q.get('cost')):\n            m.append('risks[%d].cost' % i)\n    return m\n\n\ndef tie_tol(pvs):\n    return max(0.005, 1e-9 * max([abs(v) for v in pvs] + [
