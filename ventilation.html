 en:{lt_intro:"What this tool does",lt_probe:"Temperature probe",lt_stage:"The drawing",
   lt_strat:"Temperature stratification",lt_notes:"Model and limitations",
   lb_geom:"One rectangular volume. Floor and roof are W × L, the wall area is 2(W + L)H and the volume is W × L × H. Height counts twice: it is the stack height between the low and the high openings, and it is the height over which the temperature gradient is spread.",
   lb_env:"The U-value follows from the material and the insulation tick; the absorptance follows from the material alone. The walls are given 30 % of the horizontal irradiance, the roof all of it.",
   lb_open:"The free area of an opening is its in-plane size times its depth: height × width for a wall opening, width × depth for a roof hatch. Every opening below the neutral pressure level admits air and every opening above it discharges.",
   lb_src:"Each source adds its power to the zone balance. Only the total and the power-weighted mean height are used: that height sets how strongly the room stratifies, not where the heat appears in the drawing.",
   lb_sup:"Mechanical supply air enters at its own temperature and leaves through the openings, so it shifts the neutral pressure level as well as the balance. A supply below 40 % of the room height mixes the lower zone and flattens the gradient.",
   lb_npl:"The neutral pressure level is the height at which the inside and the outside pressure are equal. It is found by bisection, so that the mass entering plus the mechanical supply equals the mass leaving.",
   lb_probe:"Drag the dashed line in the drawing to read the temperature at any height. The reading comes from the linear profile whose mean over the height is the zone temperature; it is an overlay, not a second calculation.",
   lb_ach:"Air changes per hour is the exhaust volume flow divided by the room volume, evaluated at the mean indoor temperature. It is a bookkeeping ratio, not a comfort or a contaminant criterion.",
   lb_bal:"The five rows are the terms of one steady sensible balance and they sum to zero: heat sources, solar and conduction through the envelope, mechanical supply air, the natural ventilation loss and the extra flux.",
   lb_worst:"Sets the design summer dry-bulb temperature of the selected city, a clear sky and 15:00 — the hot design condition the room still has to work in. Everything else is left as you set it."},
 uk:{lt_intro:"Що робить цей інструмент",lt_probe:"Зонд температури",lt_stage:"Рисунок",

   lb_open:"Вільна площа отвору — це його розмір у площині, помножений на глибину: висота × ширина для отвору в стіні, ширина × глибина для люка в даху. Кожен отвір нижче нейтральної площини впускає повітря, кожен вище — випускає.",

   lb_sup:"Механічний приплив надходить із власною температурою і виходить крізь отвори, тож він зміщує і нейтральну площину, і баланс. Приплив нижче 40 % висоти приміщення перемішує нижню зону та згладжує градієнт.",
   lb_npl:"Нейтральна площина — це висота, на якій тиски всередині та зовні рівні. Її знаходять діленням навпіл так, щоб маса, що входить, плюс механічний приплив дорівнювали масі, що виходить.",
   lb_probe:"Перетягніть пунктирну лінію на рисунку, щоб зчитати температуру на будь-якій висоті. Значення береться з лінійного профілю, середнє якого за висотою дорівнює температурі зони; це накладення, а не другий розрахунок.",
   lb_ach:"Кратність повітрообміну — це об'ємна витрата витяжки, поділена на об'єм приміщення, за середньою внутрішньою температурою. Це облікове відношення, а не критерій комфорту чи чистоти повітря.",
   lb_bal:"П'ять рядків — це складові одного стаціонарного явного балансу, і їхня сума дорівнює нулю: джерела тепла, сонце й теплопровідність огородження, механічний приплив, втрати природної вентиляції та додатковий потік.",
   lb_worst:"Встановлює розрахункову літню температуру сухого термометра для обраного міста, ясне небо та 15:00 — спекотні розрахункові умови, у яких приміщення все одно має працювати. Решта залишається як є."},
 nl:{lt_intro:"Wat deze tool doet",lt_probe:"Temperatuursonde",lt_stage:"De tekening",
   lt_strat:"Temperatuurstratificatie",lt_notes:"Model en beperkingen",
   lb_geom:"Eén rechthoekig volume. Vloer en dak zijn W × L, het wandoppervlak 2(W + L)H en het volume W × L × H. De hoogte telt twee keer: het is de trekhoogte tussen de lage en de hoge openingen en de hoogte waarover het temperatuurverloop zich uitstrekt.",
   lb_env:"De U-waarde volgt uit het materiaal en het vinkje isolatie; de absorptiecoëfficiënt volgt alleen uit het materiaal. De muren krijgen 30 % van de horizontale instraling, het dak alles.",
   lb_open:"De vrije oppervlakte van een opening is de maat in het vlak maal de diepte: hoogte × breedte bij een wandopening, breedte × diepte bij een dakluik. Elke opening onder het neutrale drukvlak laat lucht binnen, elke opening erboven laat lucht uit.",
   lb_src:"Elke bron telt zijn vermogen op bij de zonebalans. Alleen de som en de vermogensgewogen gemiddelde hoogte worden gebruikt: die hoogte bepaalt hoe sterk de ruimte stratificeert, niet waar de warmte in de tekening staat.",
   lb_sup:"Mechanische toevoerlucht komt binnen op haar eigen temperatuur en verlaat de ruimte via de openingen; ze verschuift dus zowel het neutrale drukvlak als de balans. Toevoer onder 40 % van de ruimtehoogte mengt de onderste zone en vlakt het verloop af.",
   lb_npl:"Het neutrale drukvlak is de hoogte waarop de druk binnen en buiten gelijk is. Het wordt met bisectie bepaald, zodat de binnenkomende massa plus de mechanische toevoer gelijk is aan de uitgaande massa.",
   lb_probe:"Sleep de stippellijn in de tekening om de temperatuur op elke hoogte af te lezen. De waarde komt uit het lineaire profiel waarvan het gemiddelde over de hoogte de zonetemperatuur is; het is een overlay, geen tweede berekening.",
   lb_ach:"Luchtwisselingen per uur is het afvoerdebiet gedeeld door het ruimtevolume, bepaald bij de gemiddelde binnentemperatuur. Het is een boekhoudkundige verhouding, geen comfort- of verontreinigingscriterium.",
   lb_bal:"De vijf regels zijn de termen van één stationaire voelbare balans en tellen op tot nul: warmtebronnen, zon en geleiding door de schil, mechanische toevoerlucht, het ventilatieverlies en de extra stroom.",
   lb_worst:"Zet de zomerse ontwerpdrogeboltemperatuur van de gekozen stad, een heldere hemel en 15:00 uur — de warme ontwerpconditie waarin de ruimte nog moet werken. De rest blijft zoals u die heeft ingesteld."},
 fr:{lt_intro:"Ce que fait cet outil",lt_probe:"Sonde de température",lt_stage:"Le dessin",
   lt_strat:"Stratification de température",lt_notes:"Modèle et limites",
   lb_geom:"Un seul volume rectangulaire. Le sol et la toiture font W × L, la surface des murs 2(W + L)H et le volume W × L × H. La hauteur compte deux fois : c'est la hauteur de tirage entre les ouvertures basses et hautes et la hauteur sur laquelle s'étale le gradient de température.",
   lb_env:"La valeur U découle du matériau et de la case isolation ; l'absorptivité du seul matériau. Les murs reçoivent 30 % de l'éclairement horizontal, la toiture la totalité.",
   lb_open:"L'aire libre d'une ouverture est sa dimension dans le plan multipliée par sa profondeur : hauteur × largeur pour une ouverture en paroi, largeur × profondeur pour une trappe de toit. Toute ouverture sous le plan de pression neutre fait entrer l'air et toute ouverture au-dessus le fait sortir.",
   lb_src:"Chaque source ajoute sa puissance au bilan de la zone. Seuls la somme et la hauteur moyenne pondérée par la puissance interviennent : cette hauteur fixe l'intensité de la stratification, pas l'endroit où la chaleur apparaît sur le dessin.",
   lb_sup:"L'air soufflé mécaniquement entre à sa propre température et ressort par les ouvertures : il déplace donc le plan de pression neutre autant que le bilan. Un soufflage sous 40 % de la hauteur du local brasse la zone basse et aplatit le gradient.",
   lb_npl:"Le plan de pression neutre est la hauteur à laquelle les pressions intérieure et extérieure s'égalent. Il est trouvé par dichotomie, pour que la masse entrante plus le soufflage mécanique égale la masse sortante.",
   lb_probe:"Faites glisser la ligne pointillée du dessin pour lire la température à n'importe quelle hauteur. La valeur vient du profil linéaire dont la moyenne sur la hauteur est la température de zone ; c'est un calque, pas un second calcul.",
   lb_ach:"Le taux de renouvellement d'air est le débit d'extraction divisé par le volume du local, évalué à la température intérieure moyenne. C'est un rapport de bilan, pas un critère de confort ni de pollution.",
   lb_bal:"Les cinq lignes sont les termes d'un même bilan sensible permanent et leur somme est nulle : sources de chaleur, apports solaires et par conduction de l'enveloppe, air soufflé mécanique, perte par ventilation naturelle et flux supplémentaire.",
   lb_worst:"Applique la température sèche de dimensionnement d'été de la ville choisie, un ciel clair et 15 h — la condition chaude de dimensionnement dans laquelle le local doit encore fonctionner. Le reste est inchangé."},

function T(k){return (I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k;}
function TF(k){return function(){return T(k);};}

/* ============================================================
   STATE — one plain object; the permalink payload is built from it
   ============================================================ */
var DEFAULTS={
  country:'Belgium',city:'Brussels',season:'summer',tout:32,time:15,cloud:0,
  H:8,W:20,L:40,wallmat:'concrete',roofmat:'sandwich',wallins:false,roofins:true,
  qextra:0,probeZ:1.5,
  openings:[
    {type:'gate',   d1:3.0, depth:2.0, z:1.5, side:'left',  x:0.5},
    {type:'window', d1:1.4, depth:1.4, z:4.8, side:'right', x:0.5},
    {type:'hatch',  d1:1.5, depth:1.0, z:8,   side:'roof',  x:0.5}
  ],
  sources:[{power:40000,z:1.5,x:0.5}],
  supplies:[{flow:0,temp:22,z:0.5,x:0.06}]
};
function clone(o){return JSON.parse(JSON.stringify(o));}
var S=clone(DEFAULTS);
var LASTR=null, VIEW=null, DRAG=null;
var ui=null, stage=null, svgHost=null;
var DGC_LANGS=['en','uk','de','nl','fr','es','pl'];

/* parseFloat on an empty control gave NaN; the framework commits null. Keep the
   old arithmetic: an empty field still poisons the result rather than reading 0. */
function num(v){return (v===null||v===undefined||v==='')?NaN:+v;}
function cityRow(s){var r=CITIES[s.country]||[];for(var i=0;i<r.length;i++)if(r[i][0]===s.city)return r[i];return undefined;}

/* ============================================================
   SOLAR MODEL
   ============================================================ */
function solarIrradiance(s){
  var season=s.season;
  var t=num(s.time);
  var cloud=num(s.cloud)/100;
  var ct=cityRow(s);
  var lat=(ct?ct[2]:50)*Math.PI/180;
  var decDeg = season==='summer'?23.45 : season==='winter'?-23.45 : 0;
  var dec=decDeg*Math.PI/180;
  var Ha=(t-12)*15*Math.PI/180;
  var sinB=Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(Ha);
  sinB=Math.max(0,sinB);
  var I=1050*Math.pow(sinB,1.15);          // clear-sky global horizontal approx
  I*=(1-0.75*Math.pow(cloud,3.4));         // cloud attenuation
  return {I:Math.max(0,I), sinB:sinB};
}

/* ============================================================
   STACK-EFFECT FLOW SOLVER
   Given Ti, find neutral plane zn so mass balances, return flows
   ============================================================ */
function solveFlows(s,Ti,Tout,msup){
  var openings=s.openings;
  var ri=rho(Ti), ro=rho(Tout);
  var dRho=ro-ri;                           // >0 when inside warmer
  // net mass out through openings must equal msup (mechanical net inflow)
  // flow at opening (height z): driven by g*dRho*(zn - z)
  // sign: if inside warmer & z<zn -> inflow(+ into room); z>zn -> outflow
  function massImbalance(zn){
    var net=0; // (inflow - outflow) through openings
    for(var i=0;i<openings.length;i++){
      var o=openings[i];
      var dp=G*dRho*(zn-o.z);               // Pa; >0 => pushes air IN
      var v=CD*Math.sqrt(2*Math.abs(dp)/((dp>=0?ro:ri)+1e-9));
      var rf=(dp>=0?ro:ri);
      var md=rf*opArea(o)*v;                // kg/s magnitude
      net += (dp>=0? md : -md);
    }
    // openings net inflow + mechanical supply must be ~0 (steady): inflow=outflow
    return net + msup;                      // want =0
  }
  // if virtually no stack and no mech -> distribute nothing
  if(Math.abs(dRho)<1e-4 && msup<1e-6){
    return openings.map(function(o){return {o:o,v:0,md:0,dir:'out',rf:ri};});
  }
  // bisection for zn in [-5, H+5] (allow outside range => all in/out)
  var H=num(s.H);
  var lo=-8, hi=H+8, flo=massImbalance(lo), fhi=massImbalance(hi);
  var zn;
  if(flo*fhi>0){ zn = (Math.abs(flo)<Math.abs(fhi))?lo:hi; }
  else{
    for(var i=0;i<60;i++){ zn=(lo+hi)/2; var fm=massImbalance(zn);
      if(flo*fm<=0){hi=zn;fhi=fm;} else {lo=zn;flo=fm;} }
    zn=(lo+hi)/2;
  }
  var res=openings.map(function(o){
    var dp=G*dRho*(zn-o.z);
    var v=CD*Math.sqrt(2*Math.abs(dp)/((dp>=0?ro:ri)+1e-9));
    var rf=(dp>=0?ro:ri);
    return {o:o, v:v, md:rf*opArea(o)*v, dir:(dp>=0?'in':'out'), rf:rf};
  });
  res.zn=zn;
  return res;
}

/* ============================================================
   MAIN SOLVER — outer loop over Ti
   ============================================================ */
function solve(s){
  var sources=s.sources, supplies=s.supplies;
  // aggregate heat sources
  var Qsrc = sources.reduce(function(a,x){return a+(+x.power||0);},0);
  var hsrc = Qsrc>0 ? sources.reduce(function(a,x){return a+(+x.power||0)*x.z;},0)/Qsrc : 1.5; // power-weighted height
  var P={
    Tout:num(s.tout),
    H:num(s.H), W:num(s.W), L:num(s.L),
    Qsrc:Qsrc, hsrc:hsrc,
    qextra:num(s.qextra)
  };
  var wall=MAT[s.wallmat], roofm=MAT[s.roofmat];
  var Uw=s.wallins?wall.u_ins:wall.u_bare;
  var Ur=s.roofins?roofm.u_ins:roofm.u_bare;
  var Af=P.W*P.L, Aw=2*(P.W+P.L)*P.H, Ar=P.W*P.L, Vol=P.W*P.L*P.H;
  var I=solarIrradiance(s).I;
  var Tsa_roof=P.Tout + roofm.a*I/HOUT;      // sol-air temp roof
  var Tsa_wall=P.Tout + wall.a*(0.3*I)/HOUT; // walls see less irradiance

  // aggregate mechanical supplies: mass, enthalpy, low-level mass (for mixing)
  var msup=0, Hsup=0, lowSupMass=0;
  supplies.forEach(function(su){ var f=+su.flow||0; if(f<=0)return;
    var m=rho(su.temp)*f/3600; msup+=m; Hsup+=m*su.temp;
    if(su.z < P.H*0.4) lowSupMass+=m; });

  var Ti=P.Tout+6, flows, min, mout, Qroof, Qwall, Qroof_c, Qwall_c;
  for(var it=0; it<80; it++){
    flows=solveFlows(s,Ti,P.Tout,msup);
    min=0; mout=0;
    for(var k=0;k<flows.length;k++){ var f=flows[k]; if(f.dir==='in') min+=f.md; else mout+=f.md; }
    // enforce steady mass: mout should ~ min+msup (solver ensures); use for energy
    var moutEff=Math.max(min+msup, 1e-6);
    Qroof_c=Ur*Ar, Qwall_c=Uw*Aw;
    var RHS = min*CP*P.Tout + CP*Hsup + P.Qsrc
            + Qroof_c*Tsa_roof + Qwall_c*Tsa_wall + P.qextra;
    var DEN = moutEff*CP + Qroof_c + Qwall_c;
    var Tnew = RHS/DEN;
    if(Math.abs(Tnew-Ti)<0.01){Ti=Tnew;break;}
    Ti=Ti+0.6*(Tnew-Ti);
  }
  Qroof=Ur*Ar*(Tsa_roof-Ti); Qwall=Uw*Aw*(Tsa_wall-Ti);
  mout=Math.max(min+msup,1e-9);
  var Qvent=mout*CP*Ti - min*CP*P.Tout - CP*Hsup; // net enthalpy carried out

  // ----- stratification: linear profile, mean = Ti -----
  var dRho=rho(P.Tout)-rho(Ti);
  // strat strength: scales with heat rise & source elevation, damped by mixing/flow
  var dTvent = P.Qsrc/(mout*CP+1e-6);        // characteristic rise
  var hfrac=Math.min(1,Math.max(0,P.hsrc/P.H));
  var Sspan = dTvent*(0.35+0.5*hfrac);       // top-bottom difference
  // strong mechanical low supply mixes -> reduce
  if(lowSupMass>0) Sspan*=Math.max(0.3,1-lowSupMass*CP/(mout*CP+1e-6)*0.5);
  Sspan=Math.max(0, Math.min(Sspan, 18));
  if(Ti<P.Tout) Sspan=Math.min(Sspan,3);     // cooling-dominant: little stratification
  var Tbottom=Ti - Sspan/2*(1 - 0.0), Ttop=Ti + Sspan/2;
  var grad = Sspan/P.H;
  // profile every 0.5 m
  var zs=[]; for(var z=0; z<=P.H+1e-6; z+=0.5) zs.push(Math.round(z*2)/2);
  var prof=zs.map(function(z){return {z:z, t: Tbottom + grad*z};});

  var zn = flows.zn!==undefined?flows.zn:NaN;
  var totalOutM3 = mout/rho(Ti)*3600;        // m³/h exhaust
  var ach = totalOutM3/Vol;

  var Tprobe = Tbottom + grad*Math.max(0,Math.min(P.H,s.probeZ));
  return {P:P,Ti:Ti,Tbottom:Tbottom,Ttop:Ttop,grad:grad,S:Sspan,prof:prof,flows:flows,zn:zn,
    min:min,mout:mout,msup:msup,Hsup:Hsup,Tprobe:Tprobe,
    Qroof:Qroof,Qwall:Qwall,Qvent:Qvent,Qsrc:P.Qsrc,qextra:P.qextra,I:I,ach:ach,
    totalOutM3:totalOutM3,Uw:Uw,Ur:Ur,Vol:Vol};
}

/* ============================================================
   COLOR SCALE (diverging blue->yellow->red)
   ============================================================ */
function tempColor(t,tmin,tmax){
  var x=(t-tmin)/(tmax-tmin+1e-9); x=Math.max(0,Math.min(1,x));
  var stops=[[0,'44,123,182'],[.25,'171,217,233'],[.5,'255,255,191'],[.75,'253,174,97'],[1,'215,25,28']];
  for(var i=1;i<stops.length;i++){
    if(x<=stops[i][0]){
      var a=stops[i-1],b=stops[i]; var f=(x-a[0])/(b[0]-a[0]);
      var ca=a[1].split(',').map(Number), cb=b[1].split(',').map(Number);
      var c=ca.map(function(v,j){return Math.round(v+(cb[j]-v)*f);});
      return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
    }
  }
  return 'rgb(215,25,28)';
}

/* ============================================================
   SVG RENDER — same drawing; it is now laid out in real pixels so the
   annotations keep their physical size instead of shrinking with the
   picture (spec section 10), and the decorative parts drop out below md.
   ============================================================ */
function svgMarkup(s,R,size){
  var P=R.P;
  var avail=(size&&size.w)?size.w:760;
  var coarse=!!(size&&size.density==='coarse');
  var Wpx=Math.max(340,Math.min(760,Math.round(avail)));
  var Hpx=Math.max(300,Math.round(Wpx*440/760));
  var pad=Wpx<560?44:64;
  var iw=Wpx-2*pad, ih=Hpx-2*pad;
  var sx=iw/P.W, sy=ih/P.H;
  var X0=pad, X1=pad+iw, Y1=Hpx-pad, Y0=Hpx-pad-ih; // Y1 floor bottom, Y0 ceiling
  var tmin=Math.min(P.Tout, R.Tbottom)-1, tmax=Math.max(R.Ttop,P.Tout)+1;
  var zToY=function(z){return Y1 - z*sy;};
  VIEW={X0:X0,X1:X1,Y0:Y0,Y1:Y1,iw:iw,ih:ih,sx:sx,sy:sy,H:P.H,W:P.W,Wpx:Wpx,sliders:{}};
  var out='<svg viewBox="0 0 '+Wpx+' '+Hpx+'" width="100%" style="max-width:'+Wpx+'px;touch-action:none;background:#0b0f18;border:1px solid #2b3550;border-radius:12px" xmlns="http://www.w3.org/2000/svg">';

  // sky tint by time/season
  var sinB=solarIrradiance(s).sinB;
  var dayF=Math.max(0,Math.min(1,sinB*1.3));
  var cloud=num(s.cloud)/100;
  var skyTop='rgb('+Math.round(20+90*dayF)+','+Math.round(28+120*dayF)+','+Math.round(50+150*dayF)+')';
  out+='<defs>'
    +'<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+skyTop+'"/><stop offset="1" stop-color="#0b0f18"/></linearGradient>'
    +'<linearGradient id="strat" x1="0" y1="0" x2="0" y2="1">';
  // gradient stops top(ceiling)->bottom(floor)
  for(var k=0;k<=6;k++){ var zg=P.H*(1-k/6); var tg=R.Tbottom+R.grad*zg;
    out+='<stop offset="'+(k/6*100).toFixed(0)+'%" stop-color="'+tempColor(tg,tmin,tmax)+'"/>'; }
  out+='</linearGradient>'
    +'<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">'
    +'<path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke"/></marker></defs>';
  out+='<rect x="0" y="0" width="'+Wpx+'" height="'+Hpx+'" fill="url(#sky)"/>';

  // sun / moon
  var sunX=X0+ (num(s.time)/24)*iw;
  var sunY= Math.max(16, Y0-24 - dayF*30);
  if(sinB>0.02){
    var sunA=1-0.7*cloud;
    out+='<circle cx="'+sunX+'" cy="'+sunY+'" r="16" fill="rgba(255,214,120,'+sunA+')"/>';
    if(!coarse){
      for(var a=0;a<8;a++){var ang=a*Math.PI/4;
        out+='<line x1="'+(sunX+18*Math.cos(ang))+'" y1="'+(sunY+18*Math.sin(ang))+'" x2="'+(sunX+26*Math.cos(ang))+'" y2="'+(sunY+26*Math.sin(ang))+'" stroke="rgba(255,214,120,'+sunA+')" stroke-width="2"/>';}
      if(R.I>10){ // solar arrows onto roof
        for(var i2=0;i2<5;i2++){var rx=X0+iw*(0.2+0.15*i2);
          out+='<line x1="'+(rx-14)+'" y1="'+(Y0-30)+'" x2="'+rx+'" y2="'+(Y0-4)+'" stroke="rgba(255,200,90,'+(0.25+0.5*sunA)+')" stroke-width="2" marker-end="url(#ah)"/>';}
      }
    }
  }
  if(cloud>0.15&&!coarse){for(var i3=0;i3<Math.round(cloud*4)+1;i3++){var cx3=X0+30+i3*150+ (i3%2)*40, cy3=Y0-40-((i3%2)*14);
    out+='<g fill="rgba(210,220,235,'+(0.35+0.4*cloud)+')"><ellipse cx="'+cx3+'" cy="'+cy3+'" rx="26" ry="13"/><ellipse cx="'+(cx3+22)+'" cy="'+(cy3+3)+'" rx="20" ry="11"/><ellipse cx="'+(cx3-20)+'" cy="'+(cy3+4)+'" rx="18" ry="10"/></g>';}}

  // room fill (stratified)
  out+='<rect x="'+X0+'" y="'+Y0+'" width="'+iw+'" height="'+ih+'" fill="url(#strat)" opacity="0.92"/>';
  // roof
  out+='<rect x="'+(X0-6)+'" y="'+(Y0-10)+'" width="'+(iw+12)+'" height="12" fill="#3a465e"/>';
  // ground

  // neutral plane
  if(isFinite(R.zn) && R.zn>0 && R.zn<P.H){ var yn=zToY(R.zn);

    +'<line x1="'+X1+'" y1="'+wY+'" x2="'+(wX-7)+'" y2="'+wY+'" stroke="#4da3ff" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>'

  out+='<g>'
    +'<line x1="'+hX+'" y1="'+Y0+'" x2="'+hX+'" y2="'+(hY+7)+'" stroke="#4da3ff" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>'

    +'<line x1="'+(hX-7)+'" y1="'+(hY-2)+'" x2="'+(hX+7)+'" y2="'+(hY-2)+'" stroke="#04101f" stroke-width="1.3"/>'
    +'<line x1="'+(hX-7)+'" y1="'+(hY+2)+'" x2="'+(hX+7)+'" y2="'+(hY+2)+'" stroke="#04101f" stroke-width="1.3"/>'
    +'<rect x="'+(hX-22)+'" y="'+(hY-11)+'" width="44" height="22" fill="#000" opacity="0" data-drag="hsize" style="pointer-events:all;cursor:ns-resize"/></g>';

  // ---- temperature probe (draggable) — prominent readout at its height ----
  var pz=Math.max(0,Math.min(P.H,s.probeZ)); var py=zToY(pz);
  var pcol=tempColor(R.Tprobe,tmin,tmax);
  out+='<line x1="'+X0+'" y1="'+py+'" x2="'+X1+'" y2="'+py+'" stroke="#ffffff" stroke-dasharray="2 3" stroke-width="1.4" opacity="0.85"/>';
  // knob on left
  out+='<circle cx="'+X0+'" cy="'+py+'" r="6" fill="#4da3ff" stroke="#fff" stroke-width="1.5"/>';
  // big label box on right end
  var boxW=coarse?86:118, bx=X1-boxW-6, by=py-14;

    +'<rect x="'+bx+'" y="'+by+'" width="'+boxW+'" height="28" rx="6" fill="#0b0f18" stroke="#4da3ff" stroke-width="1.5"/>'

    +'<text x="'+(bx+14)+'" y="'+(by+12)+'" font-size="10" fill="#95a2bd">'+pz.toFixed(1)+' m</text>'
    +'<text x="'+(bx+14)+'" y="'+(by+24)+'" font-size="15" font-weight="700" fill="#e7ecf5">'+R.Tprobe.toFixed(1)+' °C</text></g>';
  // full-width hit strip for dragging probe
  out+='<rect x="'+X0+'" y="'+(py-9)+'" width="'+iw+'" height="18" fill="#000" opacity="0" data-drag="probe" style="pointer-events:all;cursor:ns-resize"/>';

  // outdoor temp label
  out+='<text x="'+(Wpx-12)+'" y="'+(Hpx-12)+'" font-size="11" fill="#95a2bd" text-anchor="end">'+T('u_tout')+': '+P.Tout+'°C · I='+Math.round(R.I)+' W/m²</text>';
  out+='<text x="12" y="'+(Hpx-12)+'" font-size="11" fill="#e7ecf5">'+T('u_tmean')+': '+R.Ti.toFixed(1)+'°C</text>';

  return out;
}

/* ============================================================
   DOM helper (works with or without diagram-ui.js)
   ============================================================ */
function mk(tag,attrs,kids){
  var n=document.createElement(tag); attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k]; if(v==null||v===false)return;
    if(k==='class')n.className=v;
    else if(k==='text')n.textContent=v;
    else if(k==='html')n.innerHTML=v;
    else if(k==='style')n.setAttribute('style',v);
    else if(k.slice(0,2)==='on'&&typeof v==='function')n.addEventListener(k.slice(2),v);
    else if(v===true)n.setAttribute(k,'');
    else n.setAttribute(k,v);
  });
  (kids||[]).forEach(function(c){ if(c==null||c===false)return;
    n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}
function clearNode(n){while(n&&n.firstChild)n.removeChild(n.firstChild);}
function fmtTime(t){var h=Math.floor(t),m=Math.round((t-h)*60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function probeLabel(){return (Math.round(S.probeZ*10)/10).toFixed(S.probeZ%1?1:0);}

/* ============================================================
   RESULT TABLES — kept as real nodes so the colour scale swatch, the
   IN/OUT tag and the sign colouring of the balance survive the port.
   ============================================================ */
function tableNode(caption,head,rows){
  var wrap=mk('div',{class:'dgu-table-wrap'});
  var tb=mk('table',{class:'dgu-table'});
  if(caption)tb.appendChild(mk('caption',{class:'vt-cap',text:caption}));
  if(head){var tr=mk('tr');head.forEach(function(h){tr.appendChild(mk('th',{text:h}));});
    tb.appendChild(mk('thead',{},[tr]));}
  var body=mk('tbody');
  rows.forEach(function(r){
    var t=mk('tr');
    r.forEach(function(c){
      if(c&&c.nodeType){var td=mk('td',{});td.appendChild(c);t.appendChild(td);return;}
      if(c&&typeof c==='object'){t.appendChild(mk('td',{class:c.cls||'',text:c.text}));return;}
      t.appendChild(mk('td',{class:typeof c==='number'?'num':'',text:String(c)}));
    });
    body.appendChild(t);
  });
  tb.appendChild(body); wrap.appendChild(tb); return wrap;
}
function profileNode(R){
  var P=R.P;
  var tmin=Math.min(P.Tout,R.Tbottom)-1, tmax=Math.max(R.Ttop,P.Tout)+1;
  var rows=R.prof.slice().reverse().map(function(p){
    return [{cls:'num',text:p.z.toFixed(1)},{cls:'num',text:p.t.toFixed(1)},
      mk('span',{class:'vt-swatch',style:'background:'+tempColor(p.t,tmin,tmax)})];
  });
  return tableNode(T('prof'),[T('z'),T('t'),''],rows);
}
function openingNode(R){
  var P=R.P;
  var rows=R.flows.map(function(f){
    var o=f.o, m3=f.md/f.rf*3600;
    return [T(o.type),{cls:'num',text:Math.min(o.z,P.H).toFixed(1)},{cls:'num',text:f.v.toFixed(2)},
      mk('span',{class:'dgu-chip '+(f.dir==='in'?'':'bad'),text:f.dir==='in'?T('inlet'):T('outlet')}),
      {cls:'num',text:String(Math.round(m3))}];
  });
  return tableNode(T('opres'),[T('opening'),T('z'),'v, m/s',T('dir'),'m³/h'],rows);
}
function balanceNode(R){
  var rows=[
    [T('b_src'), R.Qsrc],
    [T('b_sol'), R.Qroof+R.Qwall],
    [T('b_sup'), CP*(R.Hsup - R.msup*R.Ti)],
    [T('b_vent'), -(CP*R.min*(R.Ti-R.P.Tout))],
    [T('b_extra'), R.qextra]
  ];
  var tot=rows.reduce(function(a,r){return a+r[1];},0);
  var out=rows.map(function(r){
    var v=r[1];
    return [r[0],mk('span',{class:'vt-sign '+(v>=0?'pos':'neg'),text:(v>=0?'+':'')+Math.round(v)})];
  });
  out.push([mk('b',{text:T('b_net')}),mk('b',{text:String(Math.round(tot))})]);
  var n=tableNode(T('bal'),null,out); n.classList.add('vt-baltable');
  n.setAttribute('data-learn-topic','bal'); return n;
}

function warningsFor(R){
  if(!R)return [];
  var w=[],P=R.P;
  if(R.zn<0||R.zn>P.H)w.push(T('w_npl'));
  var atot=S.openings.reduce(function(a,o){return a+opArea(o);},0);
  if(atot<0.05)w.push(T('w_area'));
  if(R.msup>0&&atot<0.05)w.push(T('w_noexit'));
  if(Math.abs(R.Ti-P.Tout)<0.2&&R.msup<=0)w.push(T('w_nostack'));
  if(R.S>=17.99)w.push(T('w_stratcap'));
  return w;
}

function resultsData(R){
  if(!R)return null;
  var P=R.P;
  var outside=(R.zn<0||R.zn>P.H);
  return {
    tiles:[
      {label:T('u_t15').replace('{z}',probeLabel()),value:R.Tprobe,precision:1,unit:'°C',display:'°C',learn:'probe'},
      {label:T('u_tmean'),value:R.Ti,precision:1,unit:'°C',display:'°C'},
      {label:T('u_grad'),value:R.grad,precision:2,unit:'°C/m',display:'°C/m',learn:'strat'},
      {label:T('u_ach'),value:R.ach,precision:1,unit:'1/h',display:'1/h',learn:'ach'},
      {label:T('u_npl'),value:isFinite(R.zn)?(R.zn.toFixed(1)+(outside?' ⚠':'')):'—',
        unit:'m',display:'m',tone:outside?'warn':null,learn:'npl'},
      {label:T('u_exhaust'),value:R.totalOutM3,precision:0,unit:'m³/h',display:'m³/h'}
    ],
    nodes:[profileNode(R),openingNode(R),balanceNode(R)],
    notes:warningsFor(R)
  };
}

/* ============================================================

function itemHead(title,onDelete){

    'aria-label':T('remove'),text:'✕',onclick:onDelete});

}
function numCell(label,value,step,minv,onchange){
  var f=mk('div',{class:'dgu-field'});
  var id='vt-'+(++uidN);
  f.appendChild(mk('label',{class:'dgu-flabel',for:id,text:label}));
  var row=mk('div',{class:'dgu-frow'});
  var inp=mk('input',{class:'dgu-fctl',type:'number',id:id,inputmode:'decimal',step:String(step),value:String(value)});
  if(minv!=null)inp.min=String(minv);
  inp.addEventListener('change',function(){onchange(parseFloat(inp.value));});
  row.appendChild(inp); f.appendChild(row); return f;
}
function selCell(label,value,options,onchange){
  var f=mk('div',{class:'dgu-field'});
  var id='vt-'+(++uidN);
  if(label)f.appendChild(mk('label',{class:'dgu-flabel',for:id,text:label}));
  var row=mk('div',{class:'dgu-frow'});
  var sel=mk('select',{class:'dgu-fctl',id:id,'aria-label':label||''});
  options.forEach(function(o){sel.appendChild(mk('option',{value:o[0],text:o[1]}));});
  sel.value=value;
  sel.addEventListener('change',function(){onchange(sel.value);});
  row.appendChild(sel); f.appendChild(row); return f;
}
function roCell(label,text){
  var f=mk('div',{class:'dgu-field'});
  f.appendChild(mk('span',{class:'dgu-flabel',text:label}));
  f.appendChild(mk('div',{class:'dgu-frow'},[mk('output',{class:'vt-ro',text:text})]));

}
var uidN=0;

var rangeNodes=[];
function rangeField(id,key,label,minv,maxv,step,format,learn){
  return {id:id,key:key,type:'custom',label:label,learn:learn,
    render:function(box){
      var inp=mk('input',{class:'vt-range',type:'range',min:String(minv),max:String(maxv),
        step:String(step),value:String(S[key]),'aria-label':label()});
      var outp=mk('output',{class:'dgu-rangeval'});
      var upd=function(){outp.textContent=format(parseFloat(inp.value));};
      inp.addEventListener('input',function(){S[key]=parseFloat(inp.value);upd();apply(false);});
      inp.addEventListener('change',function(){S[key]=parseFloat(inp.value);upd();apply(true);});
      upd();
      box.appendChild(inp); box.appendChild(outp);
      rangeNodes.push({inp:inp,key:key,upd:upd});
    }};
}

/* ============================================================
   DRAG ENGINE (resize walls, move sources/supplies/openings/probe, power slider)
   ============================================================ */
function clampH(st){ var H=num(st.H);
  st.openings.forEach(function(o){ if(o.side==='roof')o.z=H; else o.z=Math.min(o.z,H); });
  st.sources.forEach(function(s){s.z=Math.min(s.z,H);});
  st.supplies.forEach(function(s){s.z=Math.min(s.z,H);}); }

function applyDrag(type,sxp,syp){
  var V=VIEW; if(!V)return;
  var z=Math.max(0,Math.min(V.H,(V.Y1-syp)/V.sy));
  var xf=Math.max(0,Math.min(1,(sxp-V.X0)/V.iw));
  var parts=type.split(':'), t=parts[0], id=+parts[1];
  if(t==='wsize'){ var W=Math.round(((sxp-V.X0)/V.sx)*2)/2; W=Math.max(3,Math.min(150,W)); S.W=W; apply(true); }
  else if(t==='hsize'){ var H=Math.round(((V.Y1-syp)/V.sy)*2)/2; H=Math.max(2,Math.min(40,H)); S.H=H; clampH(S); apply(true); }
  else if(t==='probe'){ S.probeZ=Math.round(z*10)/10; apply(false); }
  else if(t==='src'){ var s1=S.sources[id]; if(s1){s1.z=Math.round(z*10)/10; s1.x=Math.max(0.1,Math.min(0.9,xf)); apply(true);} }
  else if(t==='sup'){ var s2=S.supplies[id]; if(s2){s2.z=Math.round(z*10)/10; s2.x=Math.max(0.04,Math.min(0.5,xf)); apply(true);} }
  else if(t==='psrc'){ var s3=S.sources[id], sl=V.sliders[id]; if(s3&&sl){
      var p=Math.round((sxp-sl.x0)/(sl.x1-sl.x0)*sl.maxP/500)*500; p=Math.max(0,Math.min(sl.maxP,p)); s3.power=p; apply(true); } }
  else if(t==='op'){ var o=S.openings[id]; if(o){
      // move whole opening; keep its size (d1). Decide side/roof by pointer location.
      if(z>=V.H-0.3 && xf>0.18 && xf<0.82){ o.side='roof'; o.z=V.H; o.x=Math.max(0.08,Math.min(0.92,xf)); }
      else { o.side = xf<0.5?'left':'right';
        o.z=Math.round(Math.max(o.d1/2, Math.min(V.H-o.d1/2, z))*10)/10; }
      apply(true); } }
  else if(t==='opedge'){ var edge=parts[2]; var o2=S.openings[id]; if(o2){
      if(edge==='top'){ var bot=o2.z-o2.d1/2; var nt=Math.max(bot+0.2,Math.min(V.H,z));
        o2.d1=Math.round((nt-bot)*10)/10; o2.z=Math.round((nt+bot)/2*10)/10; }
      else if(edge==='bot'){ var top=o2.z+o2.d1/2; var nb=Math.min(top-0.2,Math.max(0,z));
        o2.d1=Math.round((top-nb)*10)/10; o2.z=Math.round((top+nb)/2*10)/10; }
      else { // roof left/right — keep opposite edge fixed
        var cxm=(o2.x||0.5)*V.W, xm=xf*V.W;
        if(edge==='right'){ var le=cxm-o2.d1/2; var nr=Math.max(le+0.2,Math.min(V.W,xm));
          o2.d1=Math.round((nr-le)*10)/10; o2.x=((le+nr)/2)/V.W; }
        else { var re=cxm+o2.d1/2; var nl=Math.min(re-0.2,Math.max(0,xm));
          o2.d1=Math.round((re-nl)*10)/10; o2.x=((nl+re)/2)/V.W; } }
      apply(true); } }
}
function svgPoint(e){ var svg=svgHost&&svgHost.querySelector('svg'); if(!svg)return null;
  var r=svg.getBoundingClientRect(); var sc=r.width/((VIEW&&VIEW.Wpx)||760);
  return {x:(e.clientX-r.left)/sc, y:(e.clientY-r.top)/sc}; }

var windowDragBound=false;
function bindDrag(host){
  host.addEventListener('pointerdown',function(e){
    var t=e.target.closest('[data-drag]'); if(!t)return;
    if(ui&&ui.history)ui.history.push();
    DRAG={type:t.getAttribute('data-drag')}; e.preventDefault();
  });
  if(windowDragBound)return; windowDragBound=true;
  window.addEventListener('pointermove',function(e){ if(!DRAG)return; var p=svgPoint(e); if(p)applyDrag(DRAG.type,p.x,p.y); });
  window.addEventListener('pointerup',function(){DRAG=null;});
}

function boot(){
  LANG=(window.__diagramLang&&I18N[window.__diagramLang])?window.__diagramLang:'en';   /* ?lang= -> localStorage.diagram_lang -> browser -> en, resolved by the shared bootstrap */
  if(!window.DiagramUI||DiagramUI.api!=='tools.petrov.re/ui/v1'){ bootBare(); initDiagram(); return; }

  ui=DiagramUI.app({
    id:'ventilation',mount:'#app',layout:'calculator',compute:'live',lang:LANG,
    state:S,defaults:DEFAULTS,subtitle:TF('sub'),learn:LEARN,
    panels:PANELS(),
    history:{
      capture:function(){return clone(S);},
      restore:function(snap){ if(!snap)return; Object.keys(snap).forEach(function(k){S[k]=snap[k];}); }
    },
    regions:{
      stage:function(host,app){
        stage=app.stage({
          minHeight:320,
          caption:function(){return T('draghelp');},
          a11y:stageA11y,
          render:function(size){
            if(!svgHost||!svgHost.isConnected){
              svgHost=mk('div',{class:'vt-svg'});
              stage.body.appendChild(svgHost);
              bindDrag(svgHost);
            }
            paintStage(size);
          }
        });
        var ramp=[0,0.25,0.5,0.75,1].map(function(x){return tempColor(x,0,1);}).join(',');
        var legend=mk('div',{class:'vt-legend'},[
          mk('span',{text:T('cold')}),
          mk('span',{class:'vt-bar',style:'background:linear-gradient(90deg,'+ramp+')'}),
          mk('span',{text:T('hot')}),
          mk('span',{class:'vt-legend-sp',text:'→ '+T('flowleg')})
        ]);
        var cap=stage.node.querySelector('.dgu-stage-cap');
        if(cap)stage.node.insertBefore(legend,cap); else stage.node.appendChild(legend);
      }
    },
    footer:function(host){footerNode(host);},
    on:{
      compute:function(st){ LASTR=solve(st); if(stage)stage.schedule(); return resultsData(LASTR); },
      lang:function(l){ LANG=I18N[l]?l:'en'; svgHost=null; },
      reset:function(st){ S=st; },
      ready:function(){ repairToggles(); bindHeightCommit(); }
    }
  });

  /* the data layer is registered unconditionally, before the shell is declared
     ready: spec section 3, order of operations, step 4 */
  initDiagram();
  ui.ready();
  window.__ventilation={ui:ui,solve:solve,record:dgcRecord,apply:apply,
    get state(){return S;}, get last(){return LASTR;}};
}

/* Local repair: the framework points the field <label for> at the wrapper span
   of a toggle, so the checkbox itself has no accessible name. Belongs upstream. */
function repairToggles(){
  document.querySelectorAll('.dgu-app .dgu-field.toggle').forEach(function(f){
    var lab=f.querySelector('label.dgu-flabel'),box=f.querySelector('input[type=checkbox]');
    if(!lab||!box)return;
    if(!box.id)box.id=(f.dataset.dguField||'f')+'-box';
    lab.setAttribute('for',box.id);
    box.setAttribute('aria-label',lab.textContent.replace('?','').trim());
  });
}
/* The room height clamps the openings, the sources and the supplies — but only
   once the value is committed, exactly as the change-only listener did before.
   Clamping on every keystroke would eat the openings while a number is typed. */
function bindHeightCommit(){
  var inp=document.querySelector('[data-dgu-field="f-H"] input');
  if(!inp||inp.dataset.vtClamp)return;
  inp.dataset.vtClamp='1';
  inp.addEventListener('change',function(){ clampH(S); apply(true); });
}

/* ============================================================
   DEGRADED BOOT — diagram-ui.js unreachable. Same model, same state,
   same record, same permalink; a plain form instead of the shell.
   ============================================================ */
function bareApply(){
  LASTR=solve(S);
  paintStage();
  var out=document.getElementById('vt-bare-results');
  if(out){ clearNode(out); bareResults(out); }
  var box=document.getElementById('vt-bare-inputs');
  if(box) bareSync();
}
var bareSyncers=[];
function bareSync(){ bareSyncers.forEach(function(f){f();}); syncRanges(); }
function bareField(def,host){
  if(def.type==='custom'){
    var f=mk('div',{class:'dgu-field custom'});
    f.appendChild(mk('span',{class:'dgu-flabel',text:def.label()}));
    var row=mk('div',{class:'dgu-frow'});
    var boxc=mk('div',{class:'vt-customctl'});
    def.render(boxc); row.appendChild(boxc); f.appendChild(row); host.appendChild(f); return;
  }
  var id=def.id+'-c';
  var wrap=mk('div',{class:'dgu-field'});
  wrap.appendChild(mk('label',{class:'dgu-flabel',for:id,text:def.label()}));
  var row2=mk('div',{class:'dgu-frow'});
  var ctl;
  if(def.type==='select'){
    ctl=mk('select',{class:'dgu-fctl',id:id});
    var fill=function(){ clearNode(ctl);
      (typeof def.options==='function'?def.options({state:S}):def.options).forEach(function(o){
        ctl.appendChild(mk('option',{value:o[0],text:o[1]}));});
      ctl.value=S[def.key]; };
    fill();
    ctl.addEventListener('change',function(){
      if(def.set)def.set(ctl.value,S); else S[def.key]=ctl.value; apply(true);});
    bareSyncers.push(fill);
  }else if(def.type==='toggle'){
    ctl=mk('input',{type:'checkbox',id:id});
    ctl.checked=!!S[def.key];
    ctl.addEventListener('change',function(){S[def.key]=!!ctl.checked;apply(false);});
    bareSyncers.push(function(){ctl.checked=!!S[def.key];});
  }else{
    ctl=mk('input',{class:'dgu-fctl',type:'number',id:id,inputmode:'decimal',step:String(def.step||'any')});
    if(def.minDisplay!=null)ctl.min=String(def.minDisplay);
    ctl.value=String(S[def.key]);
    ctl.addEventListener('input',function(){S[def.key]=ctl.value===''?null:parseFloat(ctl.value);apply(false);});
    ctl.addEventListener('change',function(){
      S[def.key]=ctl.value===''?null:parseFloat(ctl.value);
      if(def.key==='H')clampH(S);
      apply(true);});
    bareSyncers.push(function(){if(document.activeElement!==ctl)ctl.value=S[def.key]==null?'':String(S[def.key]);});
  }
  row2.appendChild(ctl);
  if(def.unit)row2.appendChild(mk('span',{class:'dgu-unit',text:def.unit}));
  wrap.appendChild(row2); host.appendChild(wrap);
}
function bareResults(host){
  var R=LASTR; if(!R)return;
  var d=resultsData(R);
  var grid=mk('div',{class:'vt-bare-tiles'});
  d.tiles.forEach(function(t){
    grid.appendChild(mk('div',{class:'vt-bare-tile'},[
      mk('div',{class:'dgu-hint',text:t.label}),
      mk('div',{class:'vt-bare-v',text:(typeof t.value==='number'
        ? t.value.toFixed(t.precision==null?2:t.precision) : String(t.value))+' '+(t.unit||'')})]));
  });
  host.appendChild(grid);
  d.nodes.forEach(function(n){host.appendChild(n);});
  d.notes.forEach(function(n){host.appendChild(mk('p',{class:'dgu-hint',text:n}));});
}
function bootBare(){
  var host=document.getElementById('app')||document.body;
  clearNode(host); host.className='vt-bare';
  host.appendChild(mk('a',{class:'vt-bare-home',href:'index.html?lang='+LANG,text:'← Tools'}));
  host.appendChild(mk('h1',{text:T('ttl')}));
  host.appendChild(mk('p',{class:'dgu-hint',text:T('sub')}));
  var lsel=mk('select',{class:'dgu-fctl','aria-label':T('lang')});
  DGC_LANGS.forEach(function(l){lsel.appendChild(mk('option',{value:l,text:l}));});
  lsel.value=LANG;
  lsel.addEventListener('change',function(){
    LANG=lsel.value; try{localStorage.setItem('diagram_lang',LANG)}catch(e){}
    if(window.Diagram&&Diagram.setLang)Diagram.setLang(LANG);
    document.documentElement.lang=LANG; bootBare(); bareApply();
  });
  host.appendChild(lsel);

  var cols=mk('div',{class:'vt-bare-cols'});
  var inputs=mk('div',{id:'vt-bare-inputs'});
  bareSyncers=[];
  PANELS().forEach(function(p){
    var sec=mk('section',{class:'vt-bare-panel'});

function snapRange(v,minv,maxv,step){
  if(!isFinite(v))return minv;
  v=Math.max(minv,Math.min(maxv,v));
  return Math.max(minv,Math.min(maxv,Math.round((v-minv)/step)*step+minv));
}

    var list=CITIES[st.country].map(function(c){return c[0];});
    S.city=list.indexOf(S.city)>=0?S.city:list[0];

                           z:+o.z||0,side:o.s||'right',x:o.x==null?0.5:+o.x};});
  S.sources=(st.src||[]).map(function(s){return {power:+s.p||0,z:+s.z||0,x:s.x==null?0.5:+s.x};});
  S.supplies=(st.sup||[]).map(function(s){return {flow:+s.f||0,temp:+s.t||20,z:+s.z||0,

/* The report said no acceptance criterion had been supplied. This model checks
   itself four ways and reported none of them: it closes an energy balance and
   a mass balance, it places the neutral pressure level, and its stratification
   span runs into a cap of its own. Every card carries the value and the number
   it was measured against; the titles come from the report's own vocabulary,
   so no text is added to this tool. */
function dgcReportProfile(rec, ctx){
  var R = LASTR; if(!R) return null;
  var P = R.P, o = rec.outputs, u = rec.units, C = [];
  var V = function(v, un){ return ctx.value(typeof v === 'number' && isFinite(v) ? v : null, un || ''); };
  var rel = function(a, b){ return b > 0 ? Math.abs(a) / b : null; };

  var scale = Math.abs(o.heat_source) + Math.abs(o.envelope_gain)
            + Math.abs(o.supply_air_gain) + Math.abs(o.extra_flux);
  var rE = rel(o.balance_residual, scale);
  if(rE !== null) C.push({
    status: rE <= 0.01 ? 'pass' : (rE <= 0.05 ? 'attention' : 'fail'),
    title: ctx.label('balance_residual', u.balance_residual),
    actual: V(o.balance_residual, u.balance_residual) + ' (' + V(rE * 100, '%') + ')',
    criterion: '\u2264 1 % \u00b7 ' + V(scale, u.heat_source) });

  var mIn = (o.mass_flow_in || 0) + (o.mass_flow_supply || 0);
  var rM = rel(mIn - o.mass_flow_out, Math.abs(o.mass_flow_out));
  if(rM !== null) C.push({
    status: rM <= 0.01 ? 'pass' : 'attention',
    title: ctx.label('mass_flow_in', u.mass_flow_in) + ' / ' + ctx.label('mass_flow_out', u.mass_flow_out),
    actual: V(mIn, u.mass_flow_in) + ' / ' + V(o.mass_flow_out, u.mass_flow_out)
            + ' (' + V(rM * 100, '%') + ')',
    criterion: '\u2264 1 %' });

  if(isFinite(o.neutral_pressure_level)) C.push({
    status: (o.neutral_pressure_level >= 0 && o.neutral_pressure_level <= P.H) ? 'pass' : 'fail',
    title: ctx.label('neutral_pressure_level', u.neutral_pressure_level),
    actual: V(o.neutral_pressure_level, 'm'),
    criterion: '0 \u2026 ' + V(P.H, 'm') });

  if(isFinite(o.stratification_span)) C.push({
    status: o.stratification_span >= 17.99 ? 'attention' : 'pass',
    title: ctx.label('stratification_span', u.stratification_span),
    actual: V(o.stratification_span, 'K'),
    criterion: '< 18 K' });

  return C.length ? { checks: C } : null;
}

function dgcApply(payload){

    if(k==='Q'&&typeof v==='number'&&isFinite(v)&&v>0){

function dgcPython(){
  var R=LASTR; if(!R)return null;
  var ops=S.openings.map(function(o){return [+opArea(o).toFixed(9),o.z];}),
      srcs=S.sources.map(function(s){return [+s.power||0,s.z];}),
      sups=S.supplies.map(function(s){return [+s.flow||0,s.temp,s.z];}),
      wall=MAT[S.wallmat],roofm=MAT[S.roofmat],
      code=
"# ---- the room, exactly as the page had it at export time -----------------\n"+
"OPENINGS = "+JSON.stringify(ops)+"   # [free area m2, height m]\n"+
"SOURCES  = "+JSON.stringify(srcs)+"  # [power W, height m]\n"+
"SUPPLIES = "+JSON.stringify(sups)+"  # [flow m3/h, temperature degC, height m]\n"+
"WALL_ALPHA = "+wall.a+"\nROOF_ALPHA = "+roofm.a+"\n"+
"PROBE_Z  = "+S.probeZ+"\n"+
"G = 9.81\nCP = 1005.0\nPATM = 101325.0\nRAIR = 287.05\n"+
"CD = DISCHARGE_COEFFICIENT\nHOUT = EXTERNAL_FILM_COEFFICIENT\n\n\n"+
"def rho(t_c):\n"+
"    \"\"\"Ideal-gas air density at atmospheric pressure.\"\"\"\n"+
"    return PATM/(RAIR*(t_c + 273.15))\n\n\n"+
"def solar_irradiance():\n"+
"    dec = {'summer': 23.45, 'winter': -23.45}.get(SEASON, 0.0)*math.pi/180\n"+
"    lat = LATITUDE*math.pi/180\n"+
"    ha = (HOUR - 12)*15*math.pi/180\n"+
"    sinb = max(0.0, math.sin(lat)*math.sin(dec) + math.cos(lat)*math.cos(dec)*math.cos(ha))\n"+
"    i = 1050.0*sinb**1.15\n"+
"    i *= (1 - 0.75*(CLOUD_COVER/100.0)**3.4)\n"+
"    return max(0.0, i)\n\n\n"+
"def opening_flows(t_in, z_n):\n"+
"    \"\"\"Stack-driven flow through every opening for a given neutral plane.\n"+
"    dp = g (rho_o - rho_i) (z_n - z);  v = Cd sqrt(2 |dp| / rho_ref).\"\"\"\n"+
"    ri, ro = rho(t_in), rho(OUTDOOR_TEMPERATURE)\n"+
"    drho = ro - ri\n"+
"    out = []\n"+
"    for area, z in OPENINGS:\n"+
"        dp = G*drho*(z_n - z)\n"+
"        ref = ro if dp >= 0 else ri\n"+
"        v = CD*math.sqrt(2*abs(dp)/(ref + 1e-9))\n"+
"        out.append((ref*area*v, v, 'in' if dp >= 0 else 'out', ref, area))\n"+
"    return out\n\n\n"+
"def neutral_plane(t_in, mdot_sup):\n"+
"    \"\"\"Bisection for the height at which the zone mass balance closes.\"\"\"\n"+
"    def imbalance(z_n):\n"+
"        return sum((m if d == 'in' else -m)\n"+
"                   for m, v, d, r, a in opening_flows(t_in, z_n)) + mdot_sup\n"+
"    ri, ro = rho(t_in), rho(OUTDOOR_TEMPERATURE)\n"+
"    if abs(ro - ri) < 1e-4 and mdot_sup < 1e-6:\n"+
"        return None\n"+
"    lo, hi = -8.0, ROOM_HEIGHT + 8.0\n"+
"    flo, fhi = imbalance(lo), imbalance(hi)\n"+
"    if flo*fhi > 0:\n"+
"        return lo if abs(flo) < abs(fhi) else hi\n"+
"    zn = 0.0\n"+
"    for _ in range(60):\n"+
"        zn = (lo + hi)/2\n"+
"        fm = imbalance(zn)\n"+
"        if flo*fm <= 0:\n"+
"            hi, fhi = zn, fm\n"+
"        else:\n"+
"            lo, flo = zn, fm\n"+
"    return (lo + hi)/2\n\n\n"+
"def compute():\n"+
"    a_wall = 2*(ROOM_WIDTH + ROOM_LENGTH)*ROOM_HEIGHT\n"+
"    a_roof = ROOM_WIDTH*ROOM_LENGTH\n"+
"    vol = ROOM_WIDTH*ROOM_LENGTH*ROOM_HEIGHT\n"+
"    ua_wall, ua_roof = WALL_U_VALUE*a_wall, ROOF_U_VALUE*a_roof\n"+
"    irr = solar_irradiance()\n"+
"    tsa_roof = OUTDOOR_TEMPERATURE + ROOF_ALPHA*irr/HOUT\n"+
"    tsa_wall = OUTDOOR_TEMPERATURE + WALL_ALPHA*(0.3*irr)/HOUT\n"+
"    mdot_sup = h_sup = low_sup = 0.0\n"+
"    for flow, temp, z in SUPPLIES:\n"+
"        if flow <= 0:\n"+
"            continue\n"+
"        m = rho(temp)*flow/3600.0\n"+
"        mdot_sup += m\n"+
"        h_sup += m*temp\n"+
"        if z < ROOM_HEIGHT*0.4:\n"+
"            low_sup += m\n"+
"    q_src = sum(p for p, z in SOURCES)\n"+
"    h_src = (sum(p*z for p, z in SOURCES)/q_src) if q_src > 0 else 1.5\n"+
"    t_i = OUTDOOR_TEMPERATURE + 6.0\n"+
"    m_in = m_out = 0.0\n"+
"    zn = None\n"+
"    for _ in range(80):\n"+
"        zn = neutral_plane(t_i, mdot_sup)\n"+
"        flows = [] if zn is None else opening_flows(t_i, zn)\n"+
"        m_in = sum(m for m, v, d, r, a in flows if d == 'in')\n"+
"        m_out = max(m_in + mdot_sup, 1e-6)\n"+
"        rhs = (m_in*CP*OUTDOOR_TEMPERATURE + CP*h_sup + q_src\n"+
"               + ua_roof*tsa_roof + ua_wall*tsa_wall + EXTRA_HEAT_FLUX)\n"+
"        t_new = rhs/(m_out*CP + ua_roof + ua_wall)\n"+
"        if abs(t_new - t_i) < 0.01:\n"+
"            t_i = t_new\n"+
"            break\n"+
"        t_i = t_i + 0.6*(t_new - t_i)\n"+
"    q_roof = ua_roof*(tsa_roof - t_i)\n"+
"    q_wall = ua_wall*(tsa_wall - t_i)\n"+
"    m_out = max(m_in + mdot_sup, 1e-9)\n"+
"    q_sup = CP*(h_sup - mdot_sup*t_i)\n"+
"    q_nat = -CP*m_in*(t_i - OUTDOOR_TEMPERATURE)\n"+
"    d_t_vent = q_src/(m_out*CP + 1e-6)\n"+
"    s = d_t_vent*(0.35 + 0.5*min(1.0, max(0.0, h_src/ROOM_HEIGHT)))\n"+
"    if low_sup > 0:\n"+
"        s *= max(0.3, 1 - low_sup*CP/(m_out*CP + 1e-6)*0.5)\n"+
"    s = max(0.0, min(s, 18.0))\n"+
"    if t_i < OUTDOOR_TEMPERATURE:\n"+
"        s = min(s, 3.0)\n"+

"    # NB: the opening flows the panel prints are the ones from the last outer\n"+
"    # iteration, i.e. evaluated one 0.01 K step before the reported temperature.\n"+
"    total_out_m3 = m_out/rho(t_i)*3600.0\n"+
"    return dict(\n"+
"        indoor_mean_temperature=t_i,\n"+
"        temperature_at_probe=t_bottom + grad*min(max(PROBE_Z, 0.0), ROOM_HEIGHT),\n"+
"        temperature_bottom=t_bottom, temperature_top=t_top,\n"+
"        vertical_gradient=grad, stratification_span=s,\n"+
"        neutral_pressure_level=float('nan') if zn is None else zn,\n"+
"        exhaust_flow=total_out_m3, air_changes_per_hour=total_out_m3/vol,\n"+
"        mass_flow_in=m_in, mass_flow_out=m_out, mass_flow_supply=mdot_sup,\n"+
"        solar_irradiance=irr, sol_air_roof=tsa_roof,\n"+
"        heat_source=q_src, envelope_gain=q_roof + q_wall,\n"+
"        roof_gain=q_roof, wall_gain=q_wall,\n"+
"        supply_air_gain=q_sup, natural_ventilation_loss=q_nat,\n"+
"        extra_flux=EXTRA_HEAT_FLUX,\n"+
"        balance_residual=q_src + q_roof + q_wall + q_sup + q_nat + EXTRA_HEAT_FLUX,\n"+
"        room_volume=vol,\n"+
"        inflow_volume=sum(a*v*3600.0 for m, v, d, r, a in flows if d == 'in'),\n"+
"        outflow_volume=sum(a*v*3600.0 for m, v, d, r, a in flows if d == 'out'),\n"+

      +'script runs the same bisection and the same relaxed outer loop as the page.',
    selftest:{tolerance:1e-9,
