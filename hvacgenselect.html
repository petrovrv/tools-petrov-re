(function () {

  function main() {

  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }
  var LANGS7 = ['en', 'uk', 'de', 'nl', 'fr', 'es', 'pl'];
  function TF(t, vals) {
    var o = {};
    for (var i = 0; i < LANGS7.length; i++) {
      var l = LANGS7[i];
      o[l] = String(t[l] || t.en).replace(/\{(\d+)\}/g, function (_, n) { return vals[+n] == null ? '' : String(vals[+n]); });
    }
    return o;
  }
  function TL(o) {
    var lang = (document.documentElement.lang || 'en').slice(0, 2);
    return o[lang] || o.en;
  }

  /* ============================================================ 1. the model */
  var H = window.HvacSelect || null;
  var DB = null;
  var DB_STATE = 'loading';

  var hasOwn = Object.prototype.hasOwnProperty;

  function copyVal(v) {
    return Object.prototype.toString.call(v) === '[object Array]' ? v.slice() : v;
  }

  var L1_PARAMS = (function () {
    var out = [];
    if (!H || !H.QUESTIONS || !H.QUESTIONS.length) { return out; }
    for (var i = 0; i < H.QUESTIONS.length; i++) {
      var q = H.QUESTIONS[i];
      if (q && q.level === 1 && q.param) { out.push(q.param); }
    }
    return out;
  })();

  var DEFAULTS = (function () {
    var d = {};
    if (H) {
      try {
        var base = H.defaults('office', 'brussels') || {};
        for (var k in base) {
          if (hasOwn.call(base, k)) { d[k] = copyVal(base[k]); }
        }
      } catch (e) {
        d = {};
      }
    }
    d.level = 'quick';
    d._answered = [];
    return d;
  })();

  function engState(s) {
    var o = {};
    if (!s) { return o; }
    for (var k in s) {
      if (hasOwn.call(s, k) && k !== 'level') { o[k] = copyVal(s[k]); }
    }
    if (!o._answered) { o._answered = []; }
    return o;
  }

  function answered(s, p) {
    var a = s && s._answered;
    if (!a || !a.length) { return false; }
    for (var i = 0; i < a.length; i++) {
      if (a[i] === p) { return true; }
    }
    return false;
  }

  function l1Done(s) {
    for (var i = 0; i < L1_PARAMS.length; i++) {
      if (!answered(s, L1_PARAMS[i])) { return false; }
    }
    return true;
  }

  function nextQ(s) {
    if (!H || !s) { return null; }
    try {
      if (s.level === 'expert') { return null; }
      if (s.level === 'refine') {
        if (!l1Done(s)) { return H.nextQuestion(engState(s), 1, DB); }
        return H.nextQuestion(engState(s), 2, DB);
      }
      return H.nextQuestion(engState(s), 1, DB);
    } catch (e) {
      return null;
    }
  }

  function answer(st, p, v) {
    if (!H || !st) { return st; }
    var lvl = st.level;
    var ns = H.setParam(engState(st), p, v);
    if (ns) {
      for (var k in ns) {
        if (hasOwn.call(ns, k)) { st[k] = copyVal(ns[k]); }
      }
    }
    st.level = lvl;
    return st;
  }

  function confirmAll(st, params) {
    if (!st || !params || !params.length) { return st; }
    for (var i = 0; i < params.length; i++) {
      var p = params[i];
      if (!answered(st, p)) { answer(st, p, st[p]); }
    }
    return st;
  }

  function isVisible(s, p, nextParam) {
    if (!s) { return false; }
    if (s.level === 'expert') { return true; }
    for (var i = 0; i < L1_PARAMS.length; i++) {
      if (L1_PARAMS[i] === p) { return true; }
    }
    if (answered(s, p)) { return true; }
    if (s.level === 'refine' && p === nextParam) { return true; }
    return false;
  }

  function solve(s) {
    if (!H) { return { ok: false, err: 'hvac-select.js did not load' }; }
    try {
      var es = engState(s);
      var res = H.run(es, DB);
      var ex = H.explain(res);
      var spec = H.tenderSpec(es, res, DB);
      return { ok: true, res: res, ex: ex, spec: spec, next: nextQ(s), db: DB_STATE };
    } catch (e) {
      return { ok: false, err: 'Engine error: ' + (e && e.message ? e.message : String(e)) };
    }
  }

  function staleSeries(res) {
    var out = [];
    var list = res && res.series;
    if (!list || !list.length) { return out; }
    var ref = NaN;
    ref = Date.now();
    var limit = 365 * 24 * 3600 * 1000;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var sr = e && e.series;
      if (!sr || !sr.data_date) { continue; }
      var d = Date.parse(sr.data_date);
      if (isNaN(d)) { continue; }
      if (ref - d > limit) { out.push(e); }
    }
    return out;
  }

  // Freshness mark of a series record: green < 12 months, yellow 12-24, red > 24 (age counted from today).
  function freshMark(dateStr) {
    var d = Date.parse(dateStr || '');
    if (isNaN(d)) { return ''; }
    var m = (Date.now() - d) / (30.44 * 24 * 3600 * 1000);
    return m < 12 ? '🟢' : m < 24 ? '🟡' : '🔴';
  }

  var LBL = {
    cfg: {
      hp_mono: T('Air-water heat pump (monobloc)', 'Тепловий насос повітря-вода (моноблок)', 'Luft-Wasser-Wärmepumpe (Monoblock)', 'Lucht-waterwarmtepomp (monoblock)', 'Pompe à chaleur air-eau (monobloc)', 'Bomba de calor aire-agua (monobloque)', 'Pompa ciepła powietrze-woda (monoblok)'),
      hp_cascade_ht: T('High-temperature heat pump (60-90 °C)', 'Високотемпературний тепловий насос (60-90 °C)', 'Hochtemperatur-Wärmepumpe (60-90 °C)', 'Hogetemperatuurwarmtepomp (60-90 °C)', 'Pompe à chaleur haute température (60-90 °C)', 'Bomba de calor de alta temperatura (60-90 °C)', 'Wysokotemperaturowa pompa ciepła (60-90 °C)'),
      hybrid_hp_boiler: T('Hybrid heat pump + gas boiler', 'Гібридний тепловий насос + газовий котел', 'Hybrid-Wärmepumpe + Gaskessel', 'Hybride warmtepomp + gasketel', 'Pompe à chaleur hybride + chaudière gaz', 'Bomba de calor híbrida + caldera de gas', 'Hybrydowa pompa ciepła + kocioł gazowy'),

        p = last.next.param;

        return out;
      }
      for (i = 0; i < LANGS.length; i++) { out[LANGS[i]] = DONE[LANGS[i]]; }
      return out;
    }

    function isShare(p) { return p === 'part_load_share' || p === 'critical_share'; }

    function fieldFor(q) {
      var p = q.param;
      var f = {
        id: 'f-' + p,
        label: plbl(p),
        learn: LEARN_OF[p] || 'akinator',
        visible: function (ctx) {
          return isVisible(ctx.state, p, last && last.ok && last.next ? last.next.param : null);
        }
      };

      if (q.kind === 'bool') {
        f.type = 'toggle';
        f.get = function (st) { return !!st[p]; };
        f.set = function (v, st) { answer(st, p, !!v); };
      } else if (q.kind === 'number') {
        f.type = 'number';
        f.min = q.min;
        f.max = q.max;
        f.unit = UNITS[p] || '';
        f.precision = isShare(p) ? 2 : (p.indexOf('t_') === 0 ? 1 : 0);
        f.step = isShare(p) ? 0.05 : 1;
        f.required = p !== 'kw_avail';
        f.get = function (st) { return st[p]; };
        f.set = function (v, st) {
          if (typeof v === 'number' && isFinite(v)) { answer(st, p, v); }
          else if (p === 'kw_avail' && (v === null || v === '')) { answer(st, p, null); }
        };
      } else {
        f.type = 'select';
        if (p === 'sources') {
          f.options = [['air', olbl('sources', 'air')], ['air_district', olbl('sources', 'air_district')]];
          f.get = function (st) { return (st.sources || []).indexOf('district') >= 0 ? 'air_district' : 'air'; };
          f.set = function (v, st) { answer(st, 'sources', v === 'air_district' ? ['air', 'district'] : ['air']); };
        } else if (p === 'voltage' || p === 'hz') {
          var suffix = p === 'voltage' ? ' V' : ' Hz';
          f.options = (q.options || []).map(function (o) { return [String(o), String(o) + suffix]; });
          f.get = function (st) { return String(st[p]); };
          f.set = function (v, st) { answer(st, p, Number(v)); };
        } else if (p === 'city') {
          f.options = (q.options || []).map(function (o) { return [o, olbl('city', o)]; });
          f.options.sort(function (a, b) {
            var x = a[1].en, y = b[1].en;
            return x < y ? -1 : (x > y ? 1 : 0);
          });
          f.get = function (st) { return st[p]; };
          f.set = function (v, st) { answer(st, p, v); };
        } else {
          f.options = (q.options || []).map(function (o) { return [o, olbl(p, o)]; });
          f.get = function (st) { return st[p]; };
          f.set = function (v, st) { answer(st, p, v); };

          variant: 'ghost',

            ui.sync(); ui.run();

          variant: 'ghost',
          run: function () {
            var ps = [], i, q;
            for (i = 0; i < H.QUESTIONS.length; i++) {
              q = H.QUESTIONS[i];
              if (state.level === 'expert' || q.level === 1) { ps.push(q.param); }
            }
            confirmAll(state, ps);
            ui.sync(); ui.run();
          }
        }
      ]
    };

    var l1 = [], l2 = [], i;
    for (i = 0; i < H.QUESTIONS.length; i++) {
      if (H.QUESTIONS[i].level === 1) { l1.push(fieldFor(H.QUESTIONS[i])); }

  function warnCell(x) {

  function joinCodes(codes, sep) {
    sep = sep || ', ';
    codes = codes || [];
    if (!codes.length) { return T('–', '–', '–', '–', '–', '–', '–'); }
    return TJ(function (l) {
      var out = [];
      for (var i = 0; i < codes.length; i++) {
        var c = (codes[i] && typeof codes[i] === 'object') ? codes[i].code : codes[i];
        var lb = lbl('code', c);
        out.push(lb && lb[l] ? lb[l] : String(c));
      }
      return out.join(sep);
    });
  }

  var AHA = {
  office: T('Internal gains make offices cooling-led, so seasonal part-load efficiency matters more than full-load COP.', 'Внутрішні теплонадходження роблять офіси орієнтованими переважно на охолодження, тому сезонна ефективність при частковому навантаженні важливіша за COP при повному навантаженні.', 'Interne Wärmelasten machen Büros kühlungsdominiert, daher ist die saisonale Teillasteffizienz wichtiger als der COP bei Volllast.', 'Interne warmtelasten maken kantoren koelingsgedreven, dus het seizoensrendement bij deellast is belangrijker dan de COP bij vollast.', 'Les apports internes rendent les bureaux à dominante froid, donc l\'efficacité saisonnière à charge partielle compte davantage que le COP à pleine charge.', 'Las ganancias internas hacen que en las oficinas predomine la refrigeración, por lo que la eficiencia estacional a carga parcial importa más que el COP a plena carga.', 'Zyski wewnętrzne sprawiają, że w biurach dominuje chłodzenie, dlatego sezonowa efektywność przy obciążeniu częściowym jest ważniejsza niż COP przy pełnym obciążeniu.'),
  hotel: T('Simultaneous room heating and cooling plus year-round hot water make heat recovery worth more than peak efficiency.', 'Одночасне опалення й охолодження номерів та цілорічне гаряче водопостачання роблять рекуперацію тепла ціннішою за пікову ефективність.', 'Gleichzeitiges Heizen und Kühlen der Zimmer sowie ganzjähriger Warmwasserbedarf machen Wärmerückgewinnung wertvoller als Spitzeneffizienz.', 'Gelijktijdig verwarmen en koelen van kamers en het hele jaar door warm tapwater maken warmteterugwinning waardevoller dan piekrendement.', 'Le chauffage et le refroidissement simultanés des chambres, ainsi que l\'eau chaude sanitaire toute l\'année, donnent plus de valeur à la récupération de chaleur qu\'à l\'efficacité de pointe.', 'La calefacción y refrigeración simultáneas de las habitaciones, junto con el agua caliente sanitaria todo el año, hacen que la recuperación de calor valga más que la eficiencia máxima.', 'Jednoczesne ogrzewanie i chłodzenie pokoi oraz całoroczne zapotrzebowanie na ciepłą wodę sprawiają, że odzysk ciepła jest cenniejszy niż szczytowa efektywność.'),
  school: T('Short occupancy hours mean high-capex plant rarely pays back, so emitter upgrades to lower flow temperature often beat plant upgrades.', 'Короткі години перебування людей означають, що капіталомістке обладнання рідко окупається, тому модернізація опалювальних приладів для зниження температури подачі часто вигідніша за модернізацію джерела тепла.', 'Kurze Nutzungszeiten bedeuten, dass sich investitionsintensive Anlagen selten amortisieren, daher sind Heizflächen-Upgrades zur Senkung der Vorlauftemperatur oft wirtschaftlicher als Anlagen-Upgrades.', 'Korte gebruikstijden betekenen dat installaties met hoge investeringskosten zich zelden terugverdienen, dus het aanpassen van afgiftesystemen voor een lagere aanvoertemperatuur levert vaak meer op dan het vervangen van de opwekking.', 'Les courtes périodes d\'occupation font que les équipements à fort CAPEX sont rarement rentabilisés ; moderniser les émetteurs pour abaisser la température de départ est donc souvent plus intéressant que de remplacer la production.', 'Las pocas horas de ocupación hacen que los equipos de alta inversión rara vez se amorticen, por lo que mejorar los emisores para reducir la temperatura de impulsión suele ser más rentable que renovar la generación.', 'Krótki czas użytkowania sprawia, że kapitałochłonne instalacje rzadko się zwracają, dlatego modernizacja grzejników pod kątem niższej temperatury zasilania jest często korzystniejsza niż modernizacja źródła ciepła.'),
  hospital: T('Small rooms with restricted occupancy make EN 378 charge limits, not capacity, the deciding constraint for direct expansion.', 'Через малі приміщення з обмеженим доступом визначальним обмеженням для систем безпосереднього випаровування стають ліміти заправки холодоагентом за EN 378, а не потужність.', 'Kleine Räume mit eingeschränkter Belegung machen die Füllmengengrenzen nach EN 378, nicht die Leistung, zur entscheidenden Randbedingung für Direktverdampfung.', 'Kleine ruimtes met beperkte bezetting maken de vullingslimieten volgens EN 378, niet het vermogen, tot de doorslaggevende beperking voor directe expansie.', 'Les petites pièces à occupation restreinte font des limites de charge de la norme EN 378, et non de la puissance, la contrainte déterminante pour la détente directe.', 'Las salas pequeñas con ocupación restringida hacen que los límites de carga de la EN 378, y no la capacidad, sean la restricción determinante para la expansión directa.', 'W małych pomieszczeniach o ograniczonym dostępie to limity napełnienia czynnikiem wg EN 378, a nie wydajność, są decydującym ograniczeniem dla układów z bezpośrednim odparowaniem.'),
  data_center: T('At 18 °C chilled water, free cooling covers most hours in northern Europe and the rejected heat can feed district heating.', 'При температурі охолодженої води 18 °C вільне охолодження покриває більшість годин у Північній Європі, а відведене тепло можна подавати в систему централізованого теплопостачання.', 'Bei 18 °C Kaltwassertemperatur deckt die freie Kühlung in Nordeuropa die meisten Stunden ab, und die Abwärme kann in Fernwärmenetze eingespeist werden.', 'Bij gekoeld water van 18 °C dekt vrije koeling in Noord-Europa de meeste uren af en kan de afgevoerde warmte een warmtenet voeden.', 'Avec une eau glacée à 18 °C, le free cooling couvre la plupart des heures en Europe du Nord et la chaleur rejetée peut alimenter un réseau de chaleur.', 'Con agua enfriada a 18 °C, el free cooling cubre la mayoría de las horas en el norte de Europa y el calor residual puede alimentar redes de calefacción urbana.', 'Przy wodzie lodowej o temperaturze 18 °C free cooling pokrywa większość godzin w Europie Północnej, a ciepło odpadowe może zasilać sieć ciepłowniczą.'),
  pool: T('Heat recovered from dehumidification can cover most pool water heating, while chlorinated humid air rules out unprotected indoor coils.', 'Тепло, відновлене під час осушення, може покрити більшу частину нагріву води в басейні, тоді як хлороване вологе повітря виключає використання незахищених внутрішніх теплообмінників.', 'Die bei der Entfeuchtung zurückgewonnene Wärme kann den Großteil der Beckenwassererwärmung decken, während chlorhaltige feuchte Luft ungeschützte Innenregister ausschließt.', 'Warmte die bij ontvochtiging wordt teruggewonnen, kan het grootste deel van de verwarming van het zwembadwater dekken, terwijl gechloreerde vochtige lucht onbeschermde binnenbatterijen uitsluit.', 'La chaleur récupérée lors de la déshumidification peut couvrir l\'essentiel du chauffage de l\'eau du bassin, tandis que l\'air humide chloré exclut les batteries intérieures non protégées.', 'El calor recuperado de la deshumidificación puede cubrir la mayor parte del calentamiento del agua de la piscina, mientras que el aire húmedo clorado descarta las baterías interiores sin protección.', 'Ciepło odzyskane z osuszania może pokryć większość zapotrzebowania na podgrzew wody basenowej, natomiast wilgotne, chlorowane powietrze wyklucza niezabezpieczone wymienniki wewnętrzne.'),
  warehouse: T('High ceilings and frequent door openings favour radiant or destratified heating over higher flow temperatures.', 'Високі стелі та часте відчинення воріт роблять променеве опалення або опалення з дестратифікацією кращим вибором, ніж підвищення температури подачі.', 'Hohe Decken und häufiges Öffnen der Tore sprechen für Strahlungsheizung oder Heizung mit Destratifikation statt für höhere Vorlauftemperaturen.', 'Hoge plafonds en het vaak openen van deuren pleiten voor stralingsverwarming of verwarming met destratificatie in plaats van hogere aanvoertemperaturen.', 'Les grandes hauteurs sous plafond et les ouvertures fréquentes de portes favorisent le chauffage radiant ou déstratifié plutôt que des températures de départ plus élevées.', 'Los techos altos y la apertura frecuente de puertas favorecen la calefacción radiante o con desestratificación frente a temperaturas de impulsión más altas.', 'Wysokie stropy i częste otwieranie bram przemawiają za ogrzewaniem promiennikowym lub z destratyfikacją zamiast wyższych temperatur zasilania.'),
  industry: T('Process cooling rejects heat that a heat pump can lift for process heating at a combined COP above 6.', 'Технологічне охолодження відводить тепло, яке тепловий насос може підняти для технологічного нагріву із сукупним COP понад 6.', 'Die Prozesskühlung gibt Wärme ab, die eine Wärmepumpe für die Prozesswärme anheben kann, mit einem kombinierten COP über 6.', 'Proceskoeling geeft warmte af die een warmtepomp kan opwaarderen voor procesverwarming, met een gecombineerde COP boven 6.', 'Le refroidissement des procédés rejette une chaleur qu\'une pompe à chaleur peut relever pour le chauffage des procédés, avec un COP combiné supérieur à 6.', 'La refrigeración de procesos rechaza calor que una bomba de calor puede elevar para el calentamiento de procesos con un COP combinado superior a 6.', 'Chłodzenie procesowe oddaje ciepło, które pompa ciepła może podnieść na potrzeby grzania procesowego przy łącznym COP powyżej 6.'),
  offshore: T('Salt air, no gas supply and confined escape routes push towards seawater-cooled, low-charge or natural-refrigerant packages.', 'Солоне повітря, відсутність газопостачання та обмежені шляхи евакуації спонукають до вибору агрегатів з охолодженням морською водою, з малою заправкою або на природних холодоагентах.', 'Salzhaltige Luft, fehlende Gasversorgung und beengte Fluchtwege sprechen für meerwassergekühlte Kompaktanlagen, Anlagen mit geringer Füllmenge oder mit natürlichen Kältemitteln.', 'Zilte lucht, het ontbreken van gasvoorziening en beperkte vluchtwegen pleiten voor zeewatergekoelde units, units met een lage vulling of units met natuurlijke koudemiddelen.', 'L\'air salin, l\'absence d\'alimentation en gaz et l\'exiguïté des voies d\'évacuation orientent vers des groupes refroidis à l\'eau de mer, à faible charge ou à fluide frigorigène naturel.', 'El aire salino, la falta de suministro de gas y las vías de evacuación reducidas empujan hacia equipos compactos refrigerados por agua de mar, de baja carga o con refrigerantes naturales.', 'Słone powietrze, brak dostaw gazu i ciasne drogi ewakuacyjne skłaniają ku agregatom chłodzonym wodą morską, o małym napełnieniu lub z naturalnymi czynnikami chłodniczymi.')
  };
  function buildExamples() {
    var out = [];
    if (!H || !H.PRESETS) return out;
    Object.keys(H.PRESETS).forEach(function (id) {
      out.push({
        id: id,
        label: olbl('preset', id),
        note: AHA[id] || T('', '', '', '', '', '', ''),
        apply: function (t) {
          var lvl = t.level || 'quick';
          var d = H.defaults(id, H.PRESETS[id].city);
          Object.keys(t).forEach(function (k) { if (k !== 'level') delete t[k]; });
          Object.keys(d).forEach(function (k) { t[k] = copyVal(d[k]); });
          t._answered = ['preset', 'city'];
          t.level = lvl;
        }
      });
    });
    return out;
  }
  var stage = null;
  var EXCL_T = T('excluded', 'виключено', 'ausgeschlossen', 'uitgesloten', 'exclue', 'excluida', 'wykluczona');
  function renderRanking(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
    ctx.clearRect(0, 0, w, h);
    if (typeof last === 'undefined' || !last || !last.ok || !last.res) return;
    var cs = getComputedStyle(document.documentElement);
    function cv(n, f) { var x = cs.getPropertyValue(n); x = x ? String(x).trim() : ''; return x || f; }
    var muted = cv('--muted', '#888'), line = cv('--line', '#ccc'), font = cv('--font', 'sans-serif');
    var accent = cv('--accent', '#2563eb'), ok = cv('--ok', '#16a34a'), bad = cv('--bad', '#dc2626');
    var textCol = cs.color || '#222';
    var ranked = (last.res.ranked || []).slice();
    ranked.sort(function (a, b) { return (+b.score || 0) - (+a.score || 0); });
    var excluded = (last.res.tech && last.res.tech.excluded) ? last.res.tech.excluded : [];
    var rows = ranked.length + excluded.length;
    if (!rows) return;
    var fs = coarse ? 10 : 11;
    ctx.font = fs + 'px ' + font;
    ctx.textBaseline = 'middle';
    function name(id) {
      try { var t = TL(lbl('cfg', id)); return t ? String(t) : String(id); } catch (e) { return String(id); }
    }
    function fit(t, maxW) {
      if (ctx.measureText(t).width <= maxW) return t;
      while (t.length && ctx.measureText(t + '\u2026').width > maxW) t = t.slice(0, -1);
      return t + '\u2026';
    }
    function clamp(x) { x = +x; if (isNaN(x)) x = 0; return x < 0 ? 0 : (x > 1 ? 1 : x); }
    function dash(on) { if (ctx.setLineDash) ctx.setLineDash(on ? [3, 3] : []); }
    var labelW = w * (coarse ? 0.45 : 0.40);
    var x0 = Math.round(labelW + 6) + 0.5;
    var scoreSpace = ctx.measureText('0.00').width + 8;
    var barW = Math.max(10, w - x0 - scoreSpace - 4);
    var top = 4;
    var rowH = Math.min(34, (h - 30) / rows);
    var bh = Math.max(2, rowH * 0.6);
    var i, y, r, s, len;
    for (i = 0; i < ranked.length; i++) {
      r = ranked[i];
      y = top + i * rowH + rowH / 2;
      s = clamp(r.score);
      ctx.textAlign = 'left';
      ctx.fillStyle = i === 0 ? accent : textCol;
      ctx.fillText(fit(name(r.id), labelW - 4), 2, y);
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = i === 0 ? accent : muted;
      ctx.fillRect(x0, y - bh / 2, s * barW, bh);
      ctx.globalAlpha = 1;
      ctx.fillStyle = i === 0 ? ok : muted;
      ctx.fillText(fixL(s, 2, (document.documentElement.lang || 'en').slice(0, 2)), x0 + s * barW + 4, y);
    }
    for (i = 0; i < excluded.length; i++) {
      r = excluded[i];
      y = top + (ranked.length + i) * rowH + rowH / 2;
      ctx.textAlign = 'left';
      ctx.fillStyle = muted;
      ctx.fillText(fit(name(r.id), labelW - 4), 2, y);
      len = Math.min(40, barW * 0.15);
      ctx.strokeStyle = muted;
      ctx.lineWidth = 1;
      dash(true);
      ctx.beginPath();
      ctx.moveTo(x0 + 2, Math.round(y) + 0.5);
      ctx.lineTo(x0 + 2 + len, Math.round(y) + 0.5);
      ctx.stroke();
      dash(false);
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = bad;
      ctx.fillText(TL(EXCL_T), x0 + len + 6, y);
      ctx.globalAlpha = 1;
    }
    var yb = Math.round(top + rows * rowH) + 0.5;
    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, top);
    ctx.lineTo(x0, yb);
    ctx.lineTo(x0 + barW, yb);
    ctx.stroke();
    ctx.fillStyle = muted;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var ticks = [0, 0.5, 1], tx;
    for (i = 0; i < ticks.length; i++) {
      tx = Math.round(x0 + ticks[i] * barW) + 0.5;
      ctx.strokeStyle = muted;
      ctx.beginPath();
      ctx.moveTo(tx, yb);
      ctx.lineTo(tx, yb + 4);
      ctx.stroke();
      ctx.fillText(String(ticks[i]), tx, yb + 6);
    }
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
  function stageText() {
    if (!last || !last.ok || !last.res) return '';
    return last.res.ranked.map(function (r) { return TL(lbl('cfg', r.id)) + ' ' + fixL(+r.score, 2, (document.documentElement.lang || 'en').slice(0, 2)); }).join('; ');
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Heat & Cold Generator Shortlist';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

  function boot() {
    last = solve(state);
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
    loadData();
  }

  function buildInterface() {
    var panels = buildPanels();
    ui = DiagramUI.app({
      id: 'hvacgenselect',
      mount: '#app',
      layout: 'calculator',
      compute: 'live',
      state: state,
      defaults: DEFAULTS,
      notices: [{ id: 'genre', tone: 'warn', sticky: true,
        title: T('What this answer is', 'Що це за відповідь', 'Was diese Antwort ist', 'Wat dit antwoord is', 'Ce qu\'est cette réponse', 'Qué es esta respuesta', 'Czym jest ta odpowiedź'),
        text: T('Preliminary selection, not a design calculation. Ranking is by fit to your requirements only, never by brand.',
          'Попередній вибір, не проєктний розрахунок. Рейтинг лише за відповідністю вимогам, не за брендом.',
          'Vorauswahl, keine Auslegung. Rangfolge nur nach Eignung für Ihre Anforderungen, nie nach Marke.',
          'Voorlopige selectie, geen ontwerpberekening. Rangorde enkel op basis van uw eisen, nooit op merk.',
          'Sélection préliminaire, pas un dimensionnement. Classement selon vos exigences, jamais selon la marque.',
          'Selección preliminar, no un cálculo de diseño. Orden solo por ajuste a sus requisitos, nunca por marca.',
          'Wstępny dobór, nie obliczenia projektowe. Ranking wg zgodności z wymaganiami, nigdy wg marki.') }],
      learn: {
        version: 1,
        intro: { title: T('Heat & cold generator shortlist', 'Шорт-лист генераторів тепла та холоду', 'Shortlist Wärme- und Kälteerzeuger', 'Shortlist warmte- en koudeopwekkers', 'Présélection de générateurs de chaud et de froid', 'Preselección de generadores de calor y frío', 'Wstępna lista źródeł ciepła i chłodu'), body: T('Answer a few questions (Quick: 8, Refine: adaptive, Expert: all). Hard filters and weighted scoring rank 10 heat/cold generation configurations; compliant manufacturer series (public data) get neutral tender wording ("or equivalent", ≥3 manufacturers). Preliminary selection, not design calculation. Start with building type and city.', 'Відповідайте на кілька запитань (Швидко: 8, Уточнення: адаптивно, Експерт: усі). Жорсткі фільтри та зважена оцінка ранжують 10 конфігурацій генерації тепла/холоду; відповідні серії виробників (публічні дані) отримують нейтральні тендерні вимоги («або еквівалент», ≥3 виробники). Попередній вибір, не проєктний розрахунок. Почніть із типу будівлі та міста.', 'Beantworten Sie einige Fragen (Schnell: 8, Verfeinern: adaptiv, Experte: alle). Harte Filter und eine gewichtete Bewertung sortieren 10 Konfigurationen zur Wärme-/Kälteerzeugung; passende Herstellerserien (öffentliche Daten) erhalten neutrale Ausschreibungsanforderungen („oder gleichwertig“, mindestens 3 Hersteller). Vorläufige Auswahl, keine Auslegungsberechnung. Beginnen Sie mit Gebäudetyp und Stadt.', 'Beantwoord enkele vragen (Snel: 8, Verfijnen: adaptief, Expert: alle). Harde filters en een gewogen score rangschikken 10 configuraties voor warmte-/koudeopwekking; geschikte fabrikantseries (openbare gegevens) krijgen neutrale aanbestedingseisen ("of gelijkwaardig", minimaal 3 fabrikanten). Voorlopige selectie, geen ontwerpberekening. Begin met het gebouwtype en de stad.', 'Répondez aux questions (Rapide : 8, Affiné : adaptatif, Expert : toutes). Filtres stricts et score pondéré classent 10 configurations chaud/froid ; les gammes conformes (données publiques) reçoivent des clauses neutres (« ou équivalent », ≥3 fabricants). Sélection préliminaire, sans dimensionnement. Commencez par le type de bâtiment et la ville.', 'Responda unas preguntas (Rápido: 8, Refinar: adaptativo, Experto: todas). Filtros estrictos y puntuación ponderada clasifican 10 configuraciones de calor/frío; las series de fabricantes conformes (datos públicos) reciben especificaciones neutras («o equivalente», mínimo 3 fabricantes). Selección preliminar, no dimensionamiento. Empiece por tipo de edificio y ciudad.', 'Odpowiedz na pytania (Szybko: 8, Doprecyzowanie: adaptacyjnie, Ekspert: wszystkie). Twarde filtry i ważona ocena szeregują 10 konfiguracji wytwarzania ciepła/chłodu; zgodne serie producentów (dane publiczne) otrzymują neutralne zapisy przetargowe („lub równoważne”, min. 3 producentów). Wstępny wybór, nie obliczenia projektowe. Zacznij od typu budynku i miasta.') },
        topics: {
        akinator: {
          title: T('Adaptive questions', 'Адаптивні запитання', 'Adaptive Fragen', 'Adaptieve vragen', 'Questions adaptatives', 'Preguntas adaptativas', 'Pytania adaptacyjne'),
          body: T(
            'Sensitivity S of an unanswered question = probability that the top configuration changes over its value range + change in the score gap. The highest S is asked next. Stops at S<0.05, gap>0.15 or 7 questions. Confidence = 0.5·answered sensitivity share + 0.5·min(1, gap/0.2).',
            'Чутливість S питання без відповіді = імовірність, що найкраща конфігурація зміниться в межах його значень, + зміна розриву оцінок. Наступним ставиться питання з найбільшим S. Зупинка при S<0.05, розриві>0.15 або після 7 питань. Впевненість = 0.5·частка чутливості з відповідями + 0.5·min(1, розрив/0.2).',
            'Sensitivität S einer offenen Frage = Wahrscheinlichkeit, dass sich die Top-Konfiguration über ihren Wertebereich ändert, + Änderung des Score-Abstands. Die Frage mit dem höchsten S folgt als Nächstes. Stopp bei S<0.05, Abstand>0.15 oder 7 Fragen. Konfidenz = 0.5·beantworteter Sensitivitätsanteil + 0.5·min(1, Abstand/0.2).',
            'Gevoeligheid S van een onbeantwoorde vraag = kans dat de topconfiguratie verandert over haar waardebereik + verandering van het scoreverschil. De vraag met de hoogste S volgt. Stopt bij S<0.05, verschil>0.15 of 7 vragen. Betrouwbaarheid = 0.5·beantwoord aandeel gevoeligheid + 0.5·min(1, verschil/0.2).',
            'Sensibilité S d\'une question ouverte = probabilité que la configuration en tête change sur sa plage de valeurs + variation de l\'écart de score. La plus sensible suit. Arrêt si S<0.05, écart>0.15 ou 7 questions. Confiance = 0.5·part de sensibilité répondue + 0.5·min(1, écart/0.2).',
            'Sensibilidad S de una pregunta abierta = probabilidad de que la configuración líder cambie en su rango + cambio de brecha de puntuación. Sigue la de mayor S. Para si S<0.05, brecha>0.15 o 7 preguntas. Confianza = 0.5·cuota de sensibilidad respondida + 0.5·min(1, brecha/0.2).',
            'Czułość S pytania bez odpowiedzi = prawdopodobieństwo zmiany najlepszej konfiguracji w zakresie jego wartości + zmiana różnicy wyników. Następne jest pytanie o najwyższym S. Stop przy S<0.05, różnicy>0.15 lub po 7 pytaniach. Pewność = 0.5·udział czułości z odpowiedzią + 0.5·min(1, różnica/0.2).'
          )
        },
        scoring: { title: T('How the score works', 'Як працює оцінювання', 'So funktioniert die Bewertung', 'Hoe de score werkt', 'Fonctionnement du score', 'Cómo funciona la puntuación', 'Jak działa ocena'), body: T('Criteria are min-max normalised over feasible configurations: seasonal efficiency, investment, 20-year CO2 (energy plus 3 %/yr refrigerant leakage × GWP), noise margin, footprint, maintenance. Weighted by chosen priority, minus penalties: high GWP, uncoated coil, no high-ambient version, noise, single circuit. Ranked by fit, never brand.', 'Критерії нормалізуються min-max серед допустимих конфігурацій: сезонна ефективність, інвестиції, 20-річний CO2 (енергія плюс витік холодоагенту 3 %/рік × GWP), запас шуму, площа, обслуговування. Зважування за пріоритетом, мінус штрафи: високий GWP, непокритий теплообмінник, без тропічного виконання, шум, один контур. Рейтинг за відповідністю, ніколи за брендом.', 'Kriterien werden min-max über die zulässigen Konfigurationen normiert: saisonale Effizienz, Investition, 20-Jahres-CO2 (Energie plus 3 %/Jahr Kältemittelleckage × GWP), Schallreserve, Platzbedarf, Wartung. Gewichtet nach gewählter Priorität, abzüglich Strafpunkte: hohes GWP, unbeschichtetes Register, keine Hochtemperatur-Ausführung, Lärm, Einzelkreis. Rangfolge nur nach Eignung, nie nach Marke.', 'Criteria worden min-max genormaliseerd over de haalbare configuraties: seizoensrendement, investering, 20-jaars-CO2 (energie plus koudemiddellekkage 3 %/jr × GWP), geluidsmarge, ruimtebeslag, onderhoud. Gewogen naar gekozen prioriteit, minus straffen: hoge GWP, ongecoate batterij, geen hogetemperatuuruitvoering, geluid, enkel circuit. Rangschikking alleen op geschiktheid, nooit op merk.', 'Critères normalisés min-max sur configurations faisables : efficacité saisonnière, investissement, CO2 sur 20 ans (énergie + fuite frigorigène 3 %/an × GWP), marge acoustique, emprise, maintenance. Pondérés par priorité, moins pénalités : GWP élevé, batterie nue, sans version tropicale, bruit, mono-circuit. Classement par adéquation, jamais par marque.', 'Criterios normalizados min-max entre configuraciones factibles: eficiencia estacional, inversión, CO2 a 20 años (energía + fuga de refrigerante 3 %/año × GWP), margen acústico, superficie, mantenimiento. Ponderados por prioridad, menos penalizaciones: GWP alto, batería sin recubrimiento, sin versión tropical, ruido, monocircuito. Clasificación por idoneidad, nunca por marca.', 'Kryteria normalizowane min-max względem dopuszczalnych konfiguracji: sprawność sezonowa, inwestycja, 20-letnia emisja CO2 (energia + wycieki czynnika 3 %/rok × GWP), zapas akustyczny, powierzchnia, serwis. Ważone wybranym priorytetem, minus kary: wysoki GWP, niepowlekany wymiennik, brak wersji tropikalnej, hałas, jeden obieg. Ranking według dopasowania, nigdy marki.') },
        refrigerant: { title: T('Refrigerant and EN 378', 'Холодоагент і EN 378', 'Kältemittel und EN 378', 'Koudemiddel en EN 378', 'Fluide frigorigène et EN 378', 'Refrigerante y EN 378', 'Czynnik chłodniczy i EN 378'), body: T('Regulation (EU) 2024/573 (F-gas, in force 11 March 2024); GWP per AR4 as in its Annex. Policies: any, low GWP (< 750), natural only (R290, R744, R717, R718). VRF charge checked against EN 378-1:2016+A1:2020 practical limit × smallest room volume, halved for restricted-mobility occupancy.', 'Регламент (ЄС) 2024/573 (F-гази, чинний з 11 березня 2024); GWP за AR4 з його додатка. Політики: будь-які, низький GWP (< 750), лише природні (R290, R744, R717, R718). Заправку VRF перевіряють за практичною межею EN 378-1:2016+A1:2020 × об’єм найменшого приміщення, зменшеною вдвічі для маломобільних осіб.', 'Verordnung (EU) 2024/573 (F-Gase, in Kraft seit 11. März 2024); GWP nach AR4 laut Anhang. Richtlinien: beliebig, niedriges GWP (< 750), nur natürliche (R290, R744, R717, R718). VRF-Füllmenge wird mit dem praktischen Grenzwert der EN 378-1:2016+A1:2020 × kleinstem Raumvolumen verglichen; halbiert bei eingeschränkt mobilen Personen.', 'Verordening (EU) 2024/573 (F-gassen, van kracht sinds 11 maart 2024); GWP volgens AR4 (bijlage). Beleid: alle, lage GWP (< 750), alleen natuurlijk (R290, R744, R717, R718). VRF-vulling wordt getoetst aan de praktische limiet van EN 378-1:2016+A1:2020 × kleinste ruimtevolume, gehalveerd bij minder mobiele gebruikers.', 'Règlement (UE) 2024/573 (F-gaz, en vigueur depuis le 11 mars 2024). PRG selon AR4 (annexe). Politiques : toutes, PRG faible (< 750), naturels uniquement (R290, R744, R717, R718). Charge VRF ≤ limite pratique EN 378-1:2016+A1:2020 × volume du plus petit local, divisée par deux si mobilité réduite.', 'Reglamento (UE) 2024/573 (F-gas, vigente desde el 11 de marzo de 2024); PCA según AR4 (anexo). Políticas: cualquiera, PCA bajo (< 750), solo naturales (R290, R744, R717, R718). Carga VRF ≤ límite práctico EN 378-1:2016+A1:2020 × volumen del recinto más pequeño, a la mitad con movilidad reducida.', 'Rozporządzenie (UE) 2024/573 (F-gazy, obowiązuje od 11 marca 2024); GWP wg AR4 z załącznika. Polityki: dowolne, niski GWP (< 750), tylko naturalne (R290, R744, R717, R718). Napełnienie VRF sprawdzane względem limitu praktycznego EN 378-1:2016+A1:2020 × kubatury najmniejszego pomieszczenia, obniżonego o połowę przy ograniczonej mobilności użytkowników.') },

        noise: {
          title: T('Noise at the receiver', 'Шум у точці прийому', 'Schall am Immissionsort', 'Geluid bij de ontvanger', 'Bruit au point de réception', 'Ruido en el receptor', 'Hałas w punkcie odbioru'),
          body: T(
            'Estimated level at the receiver: Lp = Lw − 20 log10(r) − 8 dB (hemispherical free field). Subtract a further 15 dB for plant-room or indoor units. Margin = limit − Lp. Sound power is declared per EN ISO 9614-2 / EN 12102-1, and local noise rules set the limit.',
            'Розрахунковий рівень у точці прийому: Lp = Lw − 20 log10(r) − 8 dB (напівсферичне вільне поле). Для агрегатів у машинному залі чи всередині будівлі віднімають ще 15 dB. Запас = межа − Lp. Звукова потужність декларується за EN ISO 9614-2 / EN 12102-1, а межу встановлюють місцеві норми щодо шуму.',
            'Berechneter Pegel am Immissionsort: Lp = Lw − 20 log10(r) − 8 dB (halbkugelförmiges Freifeld). Für Geräte im Technikraum oder innen werden weitere 15 dB abgezogen. Reserve = Grenzwert − Lp. Die Schallleistung wird nach EN ISO 9614-2 / EN 12102-1 angegeben, und den Grenzwert legen die örtlichen Lärmschutzvorschriften fest.',
            'Berekend niveau bij de ontvanger: Lp = Lw − 20 log10(r) − 8 dB (halfbolvormig vrij veld). Trek nog 15 dB extra af voor units in een technische ruimte of binnen. Marge = grenswaarde − Lp. Het geluidvermogen wordt opgegeven volgens EN ISO 9614-2 / EN 12102-1, en de lokale geluidsregels bepalen de grenswaarde.',
            'Niveau estimé au récepteur : Lp = Lw − 20 log10(r) − 8 dB (champ libre hémisphérique). Retrancher 15 dB de plus pour les unités en local technique ou intérieures. Marge = limite − Lp. La puissance acoustique est déclarée selon EN ISO 9614-2 / EN 12102-1, et la réglementation locale sur le bruit fixe la limite.',
            'Nivel estimado en el receptor: Lp = Lw − 20 log10(r) − 8 dB (campo libre hemisférico). Reste otros 15 dB para equipos en sala de máquinas o interiores. Margen = límite − Lp. La potencia sonora se declara según EN ISO 9614-2 / EN 12102-1, y la normativa local de ruido fija el límite.',
            'Szacowany poziom w punkcie odbioru: Lp = Lw − 20 log10(r) − 8 dB (półsferyczne pole swobodne). Dla urządzeń w maszynowni lub wewnętrznych odejmij dodatkowo 15 dB. Zapas = limit − Lp. Moc akustyczna jest deklarowana wg EN ISO 9614-2 / EN 12102-1, a limit określają lokalne przepisy dotyczące hałasu.'

        redundancy: {
          title: T('Reliability and redundancy', 'Надійність і резервування', 'Zuverlässigkeit und Redundanz', 'Betrouwbaarheid en redundantie', 'Fiabilité et redondance', 'Fiabilidad y redundancia', 'Niezawodność i redundancja'),
          body: T(
            'Standard: at least 1 circuit. Business: at least 2 circuits. Critical: at least 2 units, at least 2 circuits per unit, minimum N+1. Life-safety: as critical, plus 2N for the critical share and dual power supply. Units n = ceil(load / unit capacity). N+1 adds one unit, and 2N doubles them.',
            'Стандарт: щонайменше 1 контур. Бізнес: щонайменше 2 контури. Критичний: щонайменше 2 агрегати, щонайменше 2 контури на агрегат, мінімум N+1. Життєзабезпечення: як критичний, плюс 2N для критичної частки та подвійне живлення. Кількість агрегатів n = ceil(навантаження / потужність агрегата). N+1 додає один агрегат, а 2N подвоює їх кількість.',
            'Standard: mindestens 1 Kreis. Business: mindestens 2 Kreise. Kritisch: mindestens 2 Geräte, je Gerät mindestens 2 Kreise, mindestens N+1. Lebenssicherheit: wie kritisch, zusätzlich 2N für den kritischen Anteil und doppelte Stromversorgung. Geräteanzahl n = ceil(Last / Geräteleistung). N+1 ergänzt ein Gerät, und 2N verdoppelt die Anzahl.',
            'Standaard: minimaal 1 circuit. Zakelijk: minimaal 2 circuits. Kritisch: minimaal 2 units, minimaal 2 circuits per unit, ten minste N+1. Levensveiligheid: als kritisch, plus 2N voor het kritische deel en dubbele voeding. Aantal units n = ceil(last / unitcapaciteit). N+1 voegt één unit toe, en 2N verdubbelt het aantal.',
            'Standard : au moins 1 circuit. Professionnel : au moins 2 circuits. Critique : au moins 2 unités, au moins 2 circuits par unité, au minimum N+1. Sécurité des personnes : comme critique, plus 2N pour la part critique et double alimentation électrique. Nombre d\'unités n = ceil(charge / puissance unitaire). N+1 ajoute une unité, et 2N double leur nombre.',
            'Estándar: al menos 1 circuito. Negocio: al menos 2 circuitos. Crítico: al menos 2 equipos, al menos 2 circuitos por equipo, mínimo N+1. Seguridad de personas: como crítico, más 2N para la parte crítica y doble alimentación eléctrica. Número de equipos n = ceil(carga / capacidad unitaria). N+1 añade un equipo, y 2N duplica su número.',
            'Standard: co najmniej 1 obieg. Biznes: co najmniej 2 obiegi. Krytyczny: co najmniej 2 urządzenia, co najmniej 2 obiegi na urządzenie, minimum N+1. Bezpieczeństwo życia: jak krytyczny, plus 2N dla części krytycznej i podwójne zasilanie. Liczba urządzeń n = ceil(obciążenie / moc urządzenia). N+1 dodaje jedno urządzenie, a 2N podwaja ich liczbę.'
          )

        sizing: {
          title: T('Loads and part load', 'Навантаження та часткове навантаження', 'Lasten und Teillast', 'Belastingen en deellast', 'Charges et charge partielle', 'Cargas y carga parcial', 'Obciążenia i obciążenie częściowe'),
          body: T(
            'Design loads are entered in kW. Minimum load equals part-load share × design load. Inverter units need unit capacity × turndown ≤ minimum load; otherwise the tool suggests more modules or shows a buffer tank warning. Annual energy uses fixed full-load hours: 1800 h heating, 1000 h cooling.',
            'Розрахункові навантаження вводяться в кВт. Мінімальне навантаження = частка часткового навантаження × навантаження. Для інверторних агрегатів потрібно: потужність агрегату × мінімальна модуляція ≤ мінімального навантаження; інакше інструмент пропонує більше модулів або попереджає про буферний бак. Річна енергія враховує фіксовані години повного навантаження: 1800 год опалення, 1000 год охолодження.',
            'Auslegungslasten werden in kW eingegeben. Mindestlast = Teillastanteil × Last. Inverter-Geräte benötigen Geräteleistung × Mindestmodulation ≤ Mindestlast; andernfalls schlägt das Tool mehr Module vor oder zeigt eine Pufferspeicher-Warnung. Der Jahresenergiebedarf basiert auf festen Volllaststunden: 1800 h Heizen, 1000 h Kühlen.',
            'Ontwerpbelastingen worden in kW ingevoerd. Minimale belasting = deellastaandeel × belasting. Inverterunits vereisen unitvermogen × minimale modulatie ≤ minimale belasting; anders stelt de tool meer modules voor of toont een waarschuwing voor een buffervat. Het jaarlijkse energieverbruik gebruikt vaste vollasturen: 1800 h verwarming, 1000 h koeling.',
            'Les charges de conception sont saisies en kW. Charge minimale = part de charge partielle × charge. Les unités Inverter exigent puissance unitaire × taux de modulation ≤ charge minimale ; sinon, l\'outil propose plus de modules ou alerte sur un ballon tampon. L\'énergie annuelle utilise des heures pleine charge fixes : 1800 h chauffage, 1000 h froid.',
            'Las cargas de diseño se introducen en kW. Carga mínima = fracción de carga parcial × carga. Los equipos Inverter requieren potencia unitaria × modulación mínima ≤ carga mínima; si no, la herramienta propone más módulos o avisa de un depósito de inercia. La energía anual usa horas fijas a plena carga: 1800 h calefacción, 1000 h refrigeración.',
            'Obciążenia projektowe podaje się w kW. Obciążenie minimalne = udział obciążenia częściowego × obciążenie. Urządzenia inwerterowe wymagają: moc jednostki × minimalna modulacja ≤ obciążenie minimalne; w przeciwnym razie narzędzie proponuje więcej modułów lub ostrzega o zbiorniku buforowym. Roczna energia opiera się na stałych godzinach pełnego obciążenia: 1800 h ogrzewania, 1000 h chłodzenia.'
          )
        },
        temperatures: {
          title: T('Water temperatures', 'Температури води', 'Wassertemperaturen', 'Watertemperaturen', 'Températures d\'eau', 'Temperaturas del agua', 'Temperatury wody'),
          body: T(
            'Heating flow temperature decides heat-pump feasibility. SCOP per EN 14825:2022 at 35 and 55 °C, linear between, −3 %/K above 55 °C. 60–90 °C needs high-temperature or cascade heat pumps. Chillers are rated per Regulation (EU) 2016/2281 (SEER 12/7 °C, SEPR process). Simultaneous heating and cooling favours 4-pipe or VRF heat-recovery units.',
            'Температура подачі опалення визначає доцільність теплового насоса. SCOP за EN 14825:2022 при 35 і 55 °C, лінійно між ними, −3 %/K понад 55 °C. Для 60–90 °C потрібні високотемпературні або каскадні теплові насоси. Чилери оцінюються за Регламентом (ЄС) 2016/2281 (SEER 12/7 °C, SEPR для процесів). Одночасне опалення й охолодження — на користь 4-трубних агрегатів або VRF з рекуперацією тепла.',
            'Die Heizungsvorlauftemperatur entscheidet über die Eignung von Wärmepumpen. SCOP nach EN 14825:2022 bei 35 und 55 °C, dazwischen linear, oberhalb 55 °C −3 %/K. 60–90 °C erfordern Hochtemperatur- oder Kaskaden-Wärmepumpen. Kaltwassersätze werden nach Verordnung (EU) 2016/2281 bewertet (SEER 12/7 °C, SEPR Prozess). Gleichzeitiges Heizen und Kühlen begünstigt 4-Leiter-Geräte oder VRF mit Wärmerückgewinnung.',

  /* ======================================================= 3. the data layer */
  function unitFor(k) {
    if (k === 'load_kw' || k === 'load_cool_kw' || k === 'kw_avail') return 'kW';
    if (k.indexOf('t_') === 0) return 'degC';
    if (k === 'noise_limit_dba') return 'dB(A)';
    if (k === 'noise_dist_m' || k === 'pipe_m') return 'm';
    if (k === 'smallest_room_m3') return 'm3';
    if (k === 'voltage') return 'V';
    if (k === 'hz') return 'Hz';
    if (/share/.test(k) || k === 'delivery_year') return '-';
    if (k === 'grid') return 'kg/kWh';
    return 'text';
  }
  function buildModel() {
    return {
      equations: ['score = sum(w_k * n_k) - penalties', 'n = ceil(load / unit capacity); N+1 -> n+1; 2N -> 2n', 'Lp = Lw - 20 log10(r) - 8 dB', 'co2_20y = 20 (E_el grid + E_gas 0.202 + charge GWP 0.03)'],
      ranges: ['20-500 kW per system (VRF 10-150 kW)'],
      notes: ['engine hvac-select.js ' + (H && H.version), 'data ' + (DB ? DB.data_date : 'not loaded'), 'generic TECH values are typical figures per configuration, not brand data', 'units: kW and degC kept as entered (selection tool, not SI solver); text = categorical value']
    };
  }
  function buildRecord() {
    if (!last) return null;
    var inputs = engState(state);
    delete inputs._answered;
    if (!last.ok) return { inputs: inputs, outputs: {}, units: {}, model: buildModel(), warnings: [last.err] };
    var res = last.res, ex = last.ex, spec = last.spec;
    var outputs = {
      top: res.top, gap: res.gap, confidence: ex.confidence,
      ranking: res.ranked.map(function (r) { return { id: r.id, score: r.score }; }),
      excluded: res.tech.excluded,
      series: res.series.map(function (x) {
        var s = x.series;
        return { family: x.family, id: s && s.id, manufacturer: s && s.manufacturer, series: s && s.series, units: x.units, unit_cap_kw: x.unit_cap_kw, circuits: x.circuits, data_date: s && s.data_date, url_source: s && s.url_source };
      }),
      tender_ok: spec.ok, tender_matches: spec.matches.length, flips: ex.flips
    };
    var units = {}, k;
    for (k in inputs) if (Object.prototype.hasOwnProperty.call(inputs, k)) units[k] = unitFor(k);
    for (k in outputs) if (Object.prototype.hasOwnProperty.call(outputs, k)) units[k] = (k === 'gap' || k === 'confidence') ? '-' : 'text';
    var warnings = [], seen = {};
    res.series.forEach(function (x) {
      (x.warnings || []).forEach(function (w) {
        var c = (w && typeof w === 'object') ? w.code : w;
        if (c != null && !seen[c]) { seen[c] = true; warnings.push(c); }
      });
    });
    if (DB_STATE !== 'ok') warnings.push('manufacturer data not loaded');
    return { inputs: inputs, outputs: outputs, units: units, model: buildModel(), warnings: warnings };
  }
  var HANDOFF = {
    provides: ['Q', 'T'],
    accepts: ['Q', 'T'],
    build: function () {
      if (!last || !last.ok || !last.res.top) return null;
      return {
        quantities: { Q: { value: state.load_kw * 1000, unit: 'W' }, T: { value: state.t_flow_heat + 273.15, unit: 'K' } },
        sets: { hvacgenselect: [H.handoff(engState(state), last.res)] }
      };
    },
    apply: function (p) {
      var q = (p && p.quantities) || {};
      if (q.Q && isFinite(q.Q.value) && q.Q.value > 0) answer(state, 'load_kw', Math.round(q.Q.value / 1000));
      if (q.T && isFinite(q.T.value)) {
        var c = q.T.value - 273.15;
        if (c >= 35 && c <= 90) answer(state, 't_flow_heat', Math.round(c));
      }
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function numL(v, l) {
    if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) {
      return '?';
    }
    if (typeof v === 'number') {
      var s = String(v);
      return l !== 'en' ? s.replace(/\./g, ',') : s;
    }
    return String(v);
  }

  function fixL(v, d, l) {
    var s = Number(v).toFixed(d);
    return l !== 'en' ? s.replace('.', ',') : s;
  }

  function tplL(key, l) {
    if (TENDER_I18N[key]) {
      return TENDER_I18N[key][l] || TENDER_I18N[key].en;
    }
    return key;
  }

  function renderArgL(v, l, parentKey) {
    var i, parts, sep;
    if (v === null || v === undefined || typeof v === 'number') {
      return numL(v, l);
    }
    if (typeof v === 'string') {
      return v;
    }
    if (Object.prototype.toString.call(v) === '[object Array]') {
      parts = [];
      for (i = 0; i < v.length; i++) {
        parts.push(renderArgL(v[i], l, parentKey));
      }
      sep = parentKey === 'temps' ? '; ' : ', ';
      return parts.join(sep);
    }
    if (typeof v === 'object' && v.key) {
      return renderNode(v, l);
    }
    return String(v);
  }

  function renderNode(node, l) {
    var args = (node && node.args) || {};
    var key = node ? node.key : '';
    var tpl = String(tplL(key, l));
    return tpl.replace(/\{(\w+)\}/g, function (m, name) {
      if (!Object.prototype.hasOwnProperty.call(args, name)) {
        return '?';
      }
      return renderArgL(args[name], l, key);
    });
  }

  function clauseL(c, l) {
    var s;
    if (l === 'en' || !c.key) {
      return c.text;
    }
    s = renderNode({ key: c.key, args: c.args || {} }, l);
    if (c.key.indexOf('seasonal_') === 0) {
      return s + '.';
    }
    return s + tplL('or_equiv', l) + '.';
  }

  function basisL(b, l) {
    var map = {
      'Project design data': 'basis_design',
      'Manufacturer data': 'basis_mfr',
      'Project reliability requirement': 'basis_reliab',
      'Project BMS standard': 'basis_bms'
    };
    if (Object.prototype.hasOwnProperty.call(map, b)) {
      return tplL(map[b], l);
    }
    return b;
  }

  function famL(f, l) {
    return TENDER_I18N['fam_' + f] ? tplL('fam_' + f, l) : f;
  }

  function tenderMarkdown() {
    var l, res, spec, matches, list, i, j, m, mfr, ser, fam, name;
    var famOrder, famMap, groups, clauses, lines, c, dataDate;

    if (!last || !last.ok || !last.res || !last.res.top) {
      return '';
    }

    l = (document.documentElement.lang || 'en').slice(0, 2);
    res = last.res;
    spec = last.spec || {};
    matches = spec.matches || [];
    list = [];
    famOrder = [];
    famMap = {};

    for (i = 0; i < matches.length; i++) {
      m = matches[i];
      mfr = m.manufacturer;
      ser = m.series;
      fam = m.family;
      if (ser && typeof ser === 'object') {
        if (ser.manufacturer) {
          mfr = ser.manufacturer;
        }
        if (!fam && ser.family) {
          fam = ser.family;
        }
        ser = ser.series;
      }
      name = (mfr || '') + ' ' + (ser || '');
      list.push(name);
      if (fam === undefined || fam === null) {
        fam = '';
      }
      if (!Object.prototype.hasOwnProperty.call(famMap, fam)) {
        famMap[fam] = [];
        famOrder.push(fam);
      }
      famMap[fam].push(name);
    }

    dataDate = DB ? DB.data_date : '-';

    if (l === 'en') {
      return '# Heat & cold generator shortlist - tender requirements\n\n' +
        'Configuration: ' + res.top + '\n' +
        'Data date: ' + dataDate + '\n\n' +
        H.tenderText(spec) +
        '\n\nComplying manufacturers (' + list.length + '): ' + list.join('; ') +
        '\n\nPreliminary selection, not a design calculation. Verify with current certified data (Eurovent, EPREL) before tendering.\n';
    }

    clauses = spec.clauses || [];
    lines = [];
    for (j = 0; j < clauses.length; j++) {
      c = clauses[j];
      lines.push((j + 1) + '. ' + clauseL(c, l) + ' [' + basisL(c.basis, l) + ']');
    }

    groups = [];
    for (j = 0; j < famOrder.length; j++) {
      groups.push(famL(famOrder[j], l) + ': ' + famMap[famOrder[j]].join(', '));
    }

    return '# ' + tplL('md_title', l) + '\n\n' +
      tplL('md_config', l) + ': ' + TL(lbl('cfg', res.top)) + ' (' + res.top + ')\n' +
      tplL('md_date', l) + ': ' + dataDate + '\n\n' +
      lines.join('\n') + '\n\n' +
      tplL('complying', l) + ': ' + (groups.length ? groups.join('; ') : tplL('none', l)) + '\n\n' +
      tplL('md_mfrs', l) + ' (' + list.length + '): ' + list.join('; ') + '\n\n' +
      tplL('md_note', l) + '\n';
  }
  function tenderActions() {
    return [
      {
        label: T('Copy tender text', 'Копіювати текст тендеру', 'Ausschreibungstext kopieren', 'Aanbestedingstekst kopiëren', 'Copier le texte d\'appel d\'offres', 'Copiar texto de licitación', 'Kopiuj tekst przetargu'),
        variant: 'ghost',
        run: function () {
          var t = tenderMarkdown();
          if (t && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t);
        }
      },
      {
        label: T('Download tender .md', 'Завантажити тендер .md', 'Ausschreibung .md herunterladen', 'Aanbesteding .md downloaden', 'Télécharger l\'appel d\'offres .md', 'Descargar licitación .md', 'Pobierz przetarg .md'),
        variant: 'ghost',
        run: function () {
          var t = tenderMarkdown();
          if (!t) return;
          var b = new Blob([t], { type: 'text/markdown' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(b);
          a.download = 'hvacgenselect-tender.md';
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
        }
      }
    ];
  }
  function loadData() {
    if (!window.fetch) { DB_STATE = 'failed'; return; }
    fetch('hvac-series.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (j && j.series && j.series.length) { DB = j; DB_STATE = 'ok'; } else DB_STATE = 'failed'; })
      .catch(function () { DB_STATE = 'failed'; })
      .then(function () { last = solve(state); if (ui) { ui.sync(); ui.run(); } });
  }

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'hvacgenselect',
        file: 'hvacgenselect.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  boot();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main);
  else main();
})();
