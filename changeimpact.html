    "uk": "Визначає наслідки першого й другого порядку інженерної зміни: зачеплені області, дії, докази й закриття, зі скринінгом, походженням зв’язків і станом затвердження.",

  "description": {
    "en": "State the changed item, the current and proposed configuration, the change family and process type, the life-cycle stage, the baseline and what is known about safety and interfaces. The tool screens the change (permanent, temporary, emergency, like-for-like, replacement-in-kind candidate), maps 23 engineering areas through a typed dependency graph whose every edge carries its source, and turns the map into an action, evidence and closure register. Numeric parameters carry unit, source, date or version, allowed range and confidence, and are checked. Calculation completed, release criterion met and engineering decision approved are three separate states; an approval is bound to the inputs it was given for and goes stale when an input changes.",
    "uk": "Вкажіть змінений об’єкт, поточну й запропоновану конфігурацію, тип і процес зміни, етап життєвого циклу, базову конфігурацію та відоме про безпеку й інтерфейси. Інструмент проводить скринінг зміни (постійна, тимчасова, аварійна, рівноцінна заміна, кандидат на ідентичну заміну), визначає вплив на 23 інженерні області через типізований граф залежностей, де кожен зв’язок має джерело, і перетворює карту на реєстр дій, доказів і закриття. Числові параметри мають одиницю, джерело, дату чи версію, допустимий діапазон і достовірність та перевіряються. «Розрахунок виконано», «критерій випуску виконано» і «інженерне рішення затверджено» — три окремі стани; затвердження прив’язане до вхідних даних і застаріває після їх зміни.",
    "de": "Geben Sie das geänderte Objekt, die bestehende und die vorgeschlagene Konfiguration, Änderungsart und Prozesstyp, die Lebenszyklusphase, die Baseline sowie den Kenntnisstand zu Sicherheit und Schnittstellen an. Das Werkzeug ordnet die Änderung ein (dauerhaft, temporär, dringlich, gleichwertiger Ersatz, Kandidat für identischen Ersatz), ermittelt 23 Engineering-Bereiche über einen typisierten Abhängigkeitsgraphen, dessen Kanten ihre Quelle tragen, und erzeugt daraus ein Register aus Maßnahmen, Nachweisen und Abschluss. Numerische Parameter tragen Einheit, Quelle, Datum oder Version, zulässigen Bereich und Zuverlässigkeit und werden geprüft. Berechnung abgeschlossen, Freigabekriterium erfüllt und technische Entscheidung freigegeben sind drei getrennte Zustände; eine Freigabe ist an ihre Eingaben gebunden und veraltet, sobald sich eine Eingabe ändert.",
    "nl": "Geef het gewijzigde item, de huidige en voorgestelde configuratie, het wijzigingstype en procestype, de levenscyclusfase, de baseline en wat bekend is over veiligheid en interfaces. De tool screent de wijziging (permanent, tijdelijk, spoed, gelijkwaardige vervanging, kandidaat voor identieke vervanging), brengt 23 engineeringgebieden in kaart via een getypeerde afhankelijkheidsgraaf waarvan elke relatie haar bron draagt, en maakt van de kaart een register van acties, bewijs en afsluiting. Numerieke parameters dragen eenheid, bron, datum of versie, toegestaan bereik en betrouwbaarheid en worden gecontroleerd. Berekening uitgevoerd, vrijgavecriterium vervuld en technische beslissing goedgekeurd zijn drie aparte toestanden; een goedkeuring is gebonden aan haar invoer en veroudert zodra een invoer wijzigt.",
    "fr": "Indiquez l’élément modifié, la configuration actuelle et proposée, la famille et le type de processus, l’étape du cycle de vie, la référence de configuration et ce que l’on sait de la sûreté et des interfaces. L’outil trie la modification (permanente, temporaire, urgente, remplacement équivalent, candidat au remplacement à l’identique), cartographie 23 domaines d’ingénierie au moyen d’un graphe de dépendances typé dont chaque lien porte sa source, et transforme la carte en registre d’actions, de preuves et de clôture. Les paramètres numériques portent unité, source, date ou version, plage admissible et fiabilité, et sont contrôlés. Calcul effectué, critère de libération satisfait et décision technique approuvée sont trois états distincts ; une approbation est liée aux données pour lesquelles elle a été donnée et devient caduque dès qu’une donnée change.",
    "es": "Indique el elemento modificado, la configuración actual y propuesta, la familia y el tipo de proceso del cambio, la etapa del ciclo de vida, la línea base y lo que se sabe sobre seguridad e interfaces. La herramienta criba el cambio (permanente, temporal, de emergencia, sustitución equivalente, candidato a sustitución idéntica), mapea 23 áreas de ingeniería mediante un grafo de dependencias tipado en el que cada vínculo lleva su fuente, y convierte el mapa en un registro de acciones, evidencias y cierre. Los parámetros numéricos llevan unidad, fuente, fecha o versión, rango admisible y confianza, y se comprueban. Cálculo completado, criterio de liberación cumplido y decisión técnica aprobada son tres estados distintos; una aprobación queda ligada a los datos para los que se dio y caduca cuando un dato cambia.",
    "pl": "Podaj zmieniany element, obecną i proponowaną konfigurację, rodzaj i typ procesu zmiany, etap cyklu życia, konfigurację bazową oraz to, co wiadomo o bezpieczeństwie i interfejsach. Narzędzie kwalifikuje zmianę (stała, tymczasowa, awaryjna, zamiennik równoważny, kandydat na zamiennik identyczny), mapuje 23 obszary inżynierskie przez typowany graf zależności, w którym każde powiązanie ma źródło, i zamienia mapę w rejestr działań, dowodów i zamknięcia. Parametry liczbowe mają jednostkę, źródło, datę lub wersję, dopuszczalny zakres i wiarygodność oraz są sprawdzane. Obliczenie wykonane, kryterium wydania spełnione i decyzja inżynierska zatwierdzona to trzy odrębne stany; zatwierdzenie jest związane z danymi, dla których je wydano, i traci ważność po zmianie danych."

      "uk": "Метод структуровано за ISO 10007:2017 з керування конфігурацією, ISO/IEC/IEEE 15288:2023 з процесів життєвого циклу та ISO 10006:2017 з якості в проєктах. Правила є інженерними евристиками, якщо прямо не зазначено процесну вимогу джерела. Докази: незмінний набір із 57 випадків правил і проєктного пакета попереднього випуску та корпус 2.0, складений за SPEC-changeimpact.md без доступу до коду сторінки.",

té → inconnu.","es":"Propagación dirigida de dependencias en dos niveles, propia de la familia del cambio, con atenuación categórica: afectado → probablemente afectado → desconocido.","pl":"Ukierunkowana dwupoziomowa propagacja zależności właściwa dla rodzaju zmiany, z kategorialnym tłumieniem: dotyczy → prawdopodobnie dotyczy → nieznane."},"ui.eq_closure":{"en":"Impact classification is independent from closure state. Release readiness requires valid closure dispositions and required context.","uk":"Класифікація впливу не залежить від стану закриття. Готовність до випуску потребує чинних рішень про закриття та потрібного контексту.","de":"Die Auswirkungsklassifizierung ist unabhängig vom Abschlusszustand. Freigabebereitschaft erfordert gültige Abschlussentscheidungen und den erforderlichen Kontext.","nl":"De impactclassificatie staat los van de afsluitstatus. Vrijgavegereedheid vereist geldige afsluitbeslissingen en de vereiste context.","fr":"La classification d’impact est indépendante de l’état de clôture. La préparation à la libération exige des dispositions de clôture valides et le contexte requis.","es":"La clasificación de impacto es independiente del estado de cierre. La preparación para la liberación exige disposiciones de cierre válidas y el contexto requerido.","pl":"Klasyfikacja wpływu jest niezależna od stanu zamknięcia. Gotowość do wydania wymaga ważnych decyzji zamknięcia i wymaganego kontekstu."},"ui.insufficient":{"en":"Define the changed object and change family to start propagation.","uk":"Вкажіть змінений об’єкт і тип зміни, щоб почати поширення.","de":"Definieren Sie geändertes Objekt und Änderungsfamilie, um die Propagation zu starten.","nl":"Definieer het gewijzigde object en wijzigingstype om propagatie te starten.","fr":"Définissez l’objet modifié et la famille de modification pour démarrer la propagation.","es":"Defina el objeto modificado y la familia del cambio para iniciar la propagación.","pl":"Zdefiniuj zmieniony obiekt i rodzaj zmiany, aby rozpocząć propagację."},"ui.blockers":{"en":"Open blockers","uk":"Відкриті блокери","de":"Offene Blocker","nl":"Open blokkades","fr":"Blocages ouverts","es":"Bloqueos abiertos","pl":"Otwarte blokery"},"ui.affected":{"en":"Affected","uk":"Зачеплено","de":"Betroffen","nl":"Beïnvloed","fr":"Affecté","es":"Afectado","pl":"Dotyczy"},"ui.probably":{"en":"Probably affected","uk":"Ймовірно зачеплено","de":"Wahrscheinlich betroffen","nl":"Waarschijnlijk beïnvloed","fr":"Probablement affecté","es":"Probablemente afectado","pl":"Prawdopodobnie dotyczy"},"ui.unknown":{"en":"Unknown","uk":"Невідомо","de":"Unbekannt","nl":"Onbekend","fr":"Inconnu","es":"Desconocido","pl":"Nieznane"},"ui.noimpact":{"en":"Checked — no impact","uk":"Перевірено — впливу немає","de":"Geprüft — keine Auswirkung","nl":"Gecontroleerd — geen impact","fr":"Vérifié — sans impact","es":"Revisado — sin impacto","pl":"Sprawdzone — brak wpływu"},"ui.na":{"en":"N/A","uk":"Не застосовується","de":"N/A","nl":"N.v.t.","fr":"N/A","es":"N/A","pl":"N/D"},"ui.open":{"en":"Open","uk":"Відкрито","de":"Offen","nl":"Open","fr":"Ouvert","es":"Abierto","pl":"Otwarte"},"ui.in_review":{"en":"In review","uk":"На перевірці","de":"In Prüfung","nl":"In review","fr":"En revue","es":"En revisión","pl":"W przeglądzie"},"ui.closed":{"en":"Closed","uk":"Закрито","de":"Geschlossen","nl":"Gesloten","fr":"Clos","es":"Cerrado","pl":"Zamknięte"},"ui.next":{"en":"Resolve next","uk":"Вирішити далі","de":"Als Nächstes klären","nl":"Volgende oplossen","fr":"À résoudre ensuite","es":"Resolver a continuación","pl":"Rozwiązać następne"},"ui.reason_col":{"en":"Why it may be affected","uk":"Чому може бути зачеплено","de":"Warum möglicherweise betroffen","nl":"Waarom mogelijk beïnvloed","fr":"Pourquoi il peut être affecté","es":"Por qué puede verse afectado","pl":"Dlaczego może być dotknięte"},"ui.evidence_col":{"en":"Required review / evidence","uk":"Потрібна перевірка / доказ","de":"Erforderliche Prüfung / Evidenz","nl":"Benodigde review / bewijs","fr":"Revue / preuve requise","es":"Revisión / evidencia requerida","pl":"Wymagany przegląd / dowód"},"ui.status_col":{"en":"Status","uk":"Статус","de":"Status","nl":"Status","fr":"État","es":"Estado","pl":"Status"},"ui.graph":{"en":"Impact propagation graph","uk":"Граф поширення впливу","de":"Graph der Auswirkungspropagation","nl":"Grafiek van impactpropagatie","fr":"Graphe de propagation des impacts","es":"Grafo de propagación del impacto","pl":"Graf propagacji wpływu"},"ui.graph_learn":{"en":"The centre is the changed object. Inner nodes are direct or first-order consequences; outer nodes are second-order review candidates.","uk":"У центрі — змінений об’єкт. Внутрішні вузли — прямі або наслідки першого порядку; зовнішні — кандидати другого порядку.","de":"Im Zentrum steht das geänderte Objekt. Innere Knoten sind direkte oder Folgen erster Ordnung; äußere Knoten sind Prüfkandidaten zweiter Ordnung.","nl":"In het midden staat het gewijzigde object. Binnenste knopen zijn directe of eerste-orde gevolgen; buitenste knopen zijn tweede-orde reviewkandidaten.","fr":"Le centre est l’objet modifié. Les nœuds internes sont des conséquences directes ou de premier ordre ; les externes sont des candidats de second ordre.","es":"El centro es el objeto modificado. Los nodos internos son consecuencias directas o de primer orden; los externos son candidatos de segundo orden.","pl":"W środku jest zmieniony obiekt. Węzły wewnętrzne to skutki bezpośrednie lub pierwszego rzędu; zewnętrzne to kandydaci do przeglądu drugiego rzędu."},"ui.learn_intro_title":{"en":"How to use this assessment","uk":"Як користуватися оцінкою","de":"So verwenden Sie die Bewertung","nl":"Zo gebruikt u deze beoordeling","fr":"Comment utiliser cette évaluation","es":"Cómo usar esta evaluación","pl":"Jak korzystać z oceny"},"ui.learn_intro_body":{"en":"Start with the object, change family and lifecycle state. The tool proposes review domains immediately. Add project-specific links, then record dispositions only after evidence is checked.","uk":"Почніть з об’єкта, типу зміни та етапу життєвого циклу. Інструмент одразу пропонує області перевірки. Додайте проєктні зв’язки й фіксуйте рішення лише після перевірки доказів.","de":"Beginnen Sie mit Objekt, Änderungsfamilie und Lebenszyklusstatus. Das Werkzeug schlägt sofort Prüffelder vor. Ergänzen Sie projektspezifische Beziehungen und erfassen Sie Entscheidungen erst nach Evidenzprüfung.","nl":"Begin met object, wijzigingstype en levenscyclusstatus. De tool stelt direct reviewdomeinen voor. Voeg projectspecifieke relaties toe en leg besluiten pas vast na controle van bewijs.","fr":"Commencez par l’objet, la famille de modification et l’état du cycle de vie. L’outil propose immédiatement des domaines de revue. Ajoutez les liens propres au projet, puis enregistrez les décisions après vérification des preuves.","es":"Empiece por el objeto, la familia del cambio y el estado del ciclo de vida. La herramienta propone dominios de revisión de inmediato. Añada relaciones del proyecto y registre decisiones solo tras comprobar evidencia.","pl":"Zacznij od obiektu, rodzaju zmiany i stanu cyklu życia. Narzędzie od razu proponuje obszary przeglądu. Dodaj zależności projektu, a decyzje zapisuj dopiero po sprawdzeniu dowodów."},"ui.method":{"en":"Method and basis","uk":"Метод і основа","de":"Methode und Grundlage","nl":"Methode en basis","fr":"Méthode et base","es":"Método y base","pl":"Metoda i podstawa"},"ui.footer":{"en":"Two-level dependency propagation. Built-in rules are engineering heuristics unless explicitly marked otherwise. Review disposition remains the user’s responsibility.","uk":"Поширення залежностей на два рівні. Вбудовані правила є інженерними евристиками, якщо прямо не зазначено інше. Рішення за результатами перевірки залишається відповідальністю користувача.","de":"Abhängigkeitspropagation über zwei Ebenen. Eingebaute Regeln sind Engineering-Heuristiken, sofern nicht ausdrücklich anders markiert. Die Prüfentscheidung bleibt beim Nutzer.","nl":"Afhankelijkheidspropagatie over twee niveaus. Ingebouwde regels zijn engineeringheuristieken tenzij anders aangegeven. De reviewbeslissing blijft bij de gebruiker.","fr":"Propagation des dépendances sur deux niveaux. Les règles intégrées sont des heuristiques d’ingénierie sauf indication contraire. La décision de revue reste sous la responsabilité de l’utilisateur.","es":"Propagación de dependencias en dos niveles. Las reglas integradas son heurísticas de ingeniería salvo indicación expresa. La disposición de revisión sigue siendo responsabilidad del usuario.","pl":"Propagacja zależności na dwa poziomy. Wbudowane reguły są heurystykami inżynierskimi, o ile nie zaznaczono inaczej. Decyzja z przeglądu pozostaje po stronie użytkownika."},"ui.preset_temp":{"en":"Example · Temperature regime — 80/60 → 60/40","uk":"Приклад · Температурний режим — 80/60 → 60/40","de":"Beispiel · Temperaturniveau — 80/60 → 60/40","nl":"Voorbeeld · Temperatuurregime — 80/60 → 60/40","fr":"Exemple · Régime de température — 80/60 → 60/40","es":"Ejemplo · Régimen de temperatura — 80/60 → 60/40","pl":"Przykład · Reżim temperatury — 80/60 → 60/40"},"ui.preset_pump":{"en":"Example · Pump replacement — duty preserved","uk":"Приклад · Заміна насоса — робоча точка збережена","de":"Beispiel · Pumpenersatz — Betriebspunkt bleibt","nl":"Voorbeeld · Pompvervanging — werkpunt behouden","fr":"Exemple · Remplacement de pompe — point de service conservé","es":"Ejemplo · Sustitución de bomba — punto de trabajo conservado","pl":"Przykład · Wymiana pompy — punkt pracy zachowany"},"ui.preset_cable":{"en":"Problem · Cable reroute — installation already started","uk":"Проблема · Перетрасування кабелю — монтаж уже почався","de":"Problem · Kabel neu trassiert — Montage läuft bereits","nl":"Probleem · Kabel omgelegd — installatie al gestart","fr":"Problème · Câble rerouté — installation déjà commencée","es":"Problema · Cable reruteado — instalación ya iniciada","pl":"Problem · Zmiana trasy kabla — montaż już rozpoczęty"},"ui.preset_setpoint":{"en":"Problem · PLC logic — changed after FAT","uk":"Проблема · Логіка PLC — змінена після FAT","de":"Problem · SPS-Logik — nach FAT geändert","nl":"Probleem · PLC-logica — gewijzigd na FAT","fr":"Problème · Logique PLC — modifiée après FAT","es":"Problema · Lógica PLC — cambiada después del FAT","pl":"Problem · Logika PLC — zmieniona po FAT"},"ui.preset_supplier":{"en":"Problem · Vendor substitution — same nominal data","uk":"Проблема · Заміна постачальника — ті самі номінальні дані","de":"Problem · Lieferantenwechsel — gleiche Nenndaten","nl":"Probleem · Leverancierswissel — dezelfde nominale data","fr":"Problème · Changement de fournisseur — mêmes données nominales","es":"Problema · Cambio de proveedor — mismos datos nominales","pl":"Problem · Zmiana dostawcy — te same dane nominalne"},"ui.preset_fat":{"en":"Problem · Late site change — standing configuration missing","uk":"Проблема · Пізня зміна на майданчику — standing configuration не визначена","de":"Problem · Späte Baustellenänderung — stehende Konfiguration fehlt","nl":"Probleem · Late sitewijziging — geldende configuratie ontbreekt","fr":"Problème · Modification tardive sur site — configuration en vigueur absente","es":"Problema · Cambio tardío en obra — falta configuración vigente","pl":"Problem · Późna zmiana na budowie — brak konfiguracji obowiązującej"},"ui.preset_req":{"en":"Example · Layout change — skid moved 600 mm","uk":"Приклад · Зміна компонування — skid зміщено на 600 мм","de":"Beispiel · Layoutänderung — Skid um 600 mm versetzt","nl":"Voorbeeld · Layoutwijziging — skid 600 mm verplaatst","fr":"Exemple · Changement d’implantation — skid déplacé de 600 mm","es":"Ejemplo · Cambio de layout — skid desplazado 600 mm","pl":"Przykład · Zmiana układu — skid przesunięty o 600 mm"},"ui.preset_stop":{"en":"Example · Text-only correction — propagation stops","uk":"Приклад · Лише текстова правка — поширення зупиняється","de":"Beispiel · Reine Textkorrektur — Propagation stoppt","nl":"Voorbeeld · Alleen tekstcorrectie — propagatie stopt","fr":"Exemple · Correction textuelle — propagation arrêtée","es":"Ejemplo · Corrección solo de texto — la propagación se detiene","pl":"Przykład · Korekta tylko tekstu — propagacja się zatrzymuje"},"ui.basis_topic_title":{"en":"Why configuration state matters","uk":"Чому стан конфігурації важливий","de":"Warum der Konfigurationsstatus wichtig ist","nl":"Waarom configuratiestatus belangrijk is","fr":"Pourquoi l’état de configuration compte","es":"Por qué importa el estado de configuración","pl":"Dlaczego stan konfiguracji ma znaczenie"},"ui.basis_topic_body":{"en":"The same technical change creates different obligations before a baseline, after procurement, after testing and in operation. Late changes need evidence that previously completed work remains valid or has been repeated.","uk":"Та сама технічна зміна створює різні обов’язки до базової конфігурації, після закупівлі, випробувань і в експлуатації. Пізні зміни потребують доказу чинності попередньої роботи або її повторення.","de":"Dieselbe technische Änderung erzeugt vor einer Baseline, nach Beschaffung, nach Prüfung und im Betrieb unterschiedliche Pflichten. Späte Änderungen brauchen Nachweis, dass frühere Arbeit gültig bleibt oder wiederholt wurde.","nl":"Dezelfde technische wijziging geeft vóór een baseline, na inkoop, na testen en in bedrijf andere verplichtingen. Late wijzigingen vragen bewijs dat eerder werk geldig blijft of is herhaald.","fr":"La même modification technique crée des obligations différentes avant une référence, après achats, après essais et en exploitation. Les modifications tardives exigent la preuve que le travail antérieur reste valide ou a été répété.","es":"El mismo cambio técnico crea obligaciones distintas antes de una línea base, después de compras, después de pruebas y en operación. Los cambios tardíos requieren evidencia de que el trabajo anterior sigue siendo válido o se repitió.","pl":"Ta sama zmiana techniczna tworzy inne obowiązki przed bazą konfiguracji, po zakupie, po próbach i w eksploatacji. Zmiany późne wymagają dowodu, że wcześniejsze prace pozostają ważne lub zostały powtórzone."},"r.family":{"en":"Direct consequence of the selected change family:","uk":"Прямий наслідок вибраного типу зміни:","de":"Direkte Folge der gewählten Änderungsfamilie:","nl":"Direct gevolg van het gekozen wijzigingstype:","fr":"Conséquence directe de la famille de modification :","es":"Consecuencia directa de la familia de cambio:","pl":"Bezpośredni skutek wybranego rodzaju zmiany:"},"r.baseline":{"en":"An approved or later configuration baseline exists; traceability must be rechecked.","uk":"Існує затверджена або пізніша конфігураційна база; трасування треба перевірити повторно.","de":"Eine freigegebene oder spätere Konfigurationsbaseline existiert; Traceability ist erneut zu prüfen.","nl":"Er is een goedgekeurde of latere configuratiebaseline; traceerbaarheid moet opnieuw worden gecontroleerd.","fr":"Une référence de configuration approuvée ou ultérieure existe ; la traçabilité doit être revue.","es":"Existe una línea base aprobada o posterior; debe revisarse la trazabilidad.","pl":"Istnieje zatwierdzona lub późniejsza baza konfiguracji; śledzenie trzeba sprawdzić ponownie."},"r.late":{"en":"The change occurs after commitment of procurement, manufacture, installation, test or operation.","uk":"Зміна відбувається після закупівлі, виробництва, монтажу, випробувань або введення в експлуатацію.","de":"Die Änderung erfolgt nach Beschaffungs-, Fertigungs-, Montage-, Prüf- oder Betriebsbindung.","nl":"De wijziging vindt plaats nadat inkoop, fabricage, installatie, test of bedrijf al is vastgelegd.","fr":"La modification intervient après engagement des achats, fabrication, installation, essais ou exploitation.","es":"El cambio ocurre después de comprometer compras, fabricación, instalación, pruebas u operación.","pl":"Zmiana następuje po zaangażowaniu zakupów, produkcji, montażu, prób lub eksploatacji."},"r.fat":{"en":"FAT has already been completed; previous test evidence may no longer bound the delivered configuration.","uk":"FAT уже завершено; попередні результати випробувань можуть більше не відповідати поставленій конфігурації.","de":"FAT ist abgeschlossen; frühere Prüfnachweise decken die gelieferte Konfiguration möglicherweise nicht mehr ab.","nl":"FAT is al afgerond; eerder testbewijs dekt de geleverde configuratie mogelijk niet meer.","fr":"Le FAT est terminé ; les preuves d’essai antérieures peuvent ne plus couvrir la configuration livrée.","es":"El FAT ya terminó; la evidencia de prueba previa puede no cubrir la configuración entregada.","pl":"FAT jest zakończony; wcześniejsze dowody z prób mogą już nie obejmować dostarczonej konfiguracji."},"r.safety":{"en":"The user marked safety or regulatory relevance.","uk":"Користувач позначив вплив на безпеку або регулювання.","de":"Der Nutzer hat Sicherheits- oder Genehmigungsrelevanz angegeben.","nl":"De gebruiker heeft veiligheids- of regelgevingsrelevantie aangegeven.","fr":"L’utilisateur a indiqué une pertinence sûreté ou réglementaire.","es":"El usuario indicó relevancia de seguridad o regulatoria.","pl":"Użytkownik wskazał znaczenie dla bezpieczeństwa lub regulacji."},"r.interface":{"en":"Known interfaces make coordination part of the change scope.","uk":"Відомі інтерфейси роблять координацію частиною обсягу зміни.","de":"Bekannte Schnittstellen machen die Koordination zum Teil des Änderungsumfangs.","nl":"Bekende interfaces maken coördinatie onderdeel van de wijziging.","fr":"Des interfaces connues rendent la coordination nécessaire dans le périmètre de la modification.","es":"Las interfaces conocidas hacen que la coordinación forme parte del cambio.","pl":"Znane interfejsy powodują, że koordynacja jest częścią zakresu zmiany."},"r.same_nominal":{"en":"Equal nominal performance does not demonstrate interchangeability of interfaces, tests, spares or configuration.","uk":"Однакові номінальні характеристики не доводять взаємозамінність інтерфейсів, випробувань, запасних частин чи конфігурації.","de":"Gleiche Nennleistung beweist keine Austauschbarkeit von Schnittstellen, Prüfungen, Ersatzteilen oder Konfiguration.","nl":"Gelijke nominale prestatie bewijst geen uitwisselbaarheid van interfaces, tests, reservedelen of configuratie.","fr":"Des performances nominales identiques ne prouvent pas l’interchangeabilité des interfaces, essais, rechanges ou configuration.","es":"El mismo rendimiento nominal no demuestra intercambiabilidad de interfaces, pruebas, repuestos o configuración.","pl":"Takie same parametry nominalne nie dowodzą zamienności interfejsów, prób, części ani konfiguracji."},"r.unknown":{"en":"The selected state is unknown or TBD; the impact cannot yet be closed.","uk":"Вибраний стан невідомий або TBD; вплив поки не можна закрити.","de":"Der ausgewählte Status ist unbekannt oder TBD; die Auswirkung kann noch nicht geschlossen werden.","nl":"De gekozen status is onbekend of TBD; de impact kan nog niet worden gesloten.","fr":"L’état sélectionné est inconnu ou à définir ; l’impact ne peut pas encore être clos.","es":"El estado seleccionado es desconocido o por definir; el impacto aún no puede cerrarse.","pl":"Wybrany stan jest nieznany lub do ustalenia; wpływu nie można jeszcze zamknąć."},"r.conflict":{"en":"Two answers conflict or leave a lifecycle/configuration inconsistency.","uk":"Дві відповіді суперечать одна одній або створюють неузгодженість життєвого циклу/конфігурації.","de":"Zwei Antworten widersprechen sich oder erzeugen eine Lebenszyklus-/Konfigurationsinkonsistenz.","nl":"Twee antwoorden botsen of laten een inconsistentie in levenscyclus/configuratie achter.","fr":"Deux réponses se contredisent ou laissent une incohérence de cycle de vie/configuration.","es":"Dos respuestas se contradicen o dejan una inconsistencia de ciclo de vida/configuración.","pl":"Dwie odpowiedzi są sprzeczne lub pozostawiają niespójność cyklu życia/konfiguracji."},"r.missing_reason":{"en":"A late change has no recorded reason.","uk":"Для пізньої зміни не вказано причину.","de":"Für eine späte Änderung ist kein Grund dokumentiert.","nl":"Voor een late wijziging is geen reden vastgelegd.","fr":"Une modification tardive n’a pas de motif enregistré.","es":"Un cambio tardío no tiene motivo registrado.","pl":"Dla późnej zmiany nie zapisano powodu."},"r.na_reason":{"en":"N/A was selected without the required reason.","uk":"N/A вибрано без обов’язкового пояснення.","de":"N/A wurde ohne erforderliche Begründung gewählt.","nl":"N.v.t. is gekozen zonder vereiste reden.","fr":"N/A a été choisi sans justification requise.","es":"Se seleccionó N/A sin la justificación requerida.","pl":"Wybrano N/D bez wymaganego uzasadnienia."},"r.propagated":{"en":"First/second-order dependency from","uk":"Залежність першого/другого порядку від","de":"Abhängigkeit erster/zweiter Ordnung von","nl":"Afhankelijkheid van eerste/tweede orde vanuit","fr":"Dépendance de premier/deuxième ordre depuis","es":"Dependencia de primer/segundo orden desde","pl":"Zależność pierwszego/drugiego rzędu od"},"r.custom":{"en":"Project-specific dependency from","uk":"Проєктна залежність від","de":"Projektspezifische Abhängigkeit von","nl":"Projectspecifieke afhankelijkheid vanuit","fr":"Dépendance propre au projet depuis","es":"Dependencia específica del proyecto desde","pl":"Zależność specyficzna dla projektu od"},"r.review":{"en":"Review disposition recorded by the user.","uk":"Рішення за результатами перевірки зафіксовано користувачем.","de":"Prüfentscheidung vom Nutzer dokumentiert.","nl":"Reviewbesluit door de gebruiker vastgelegd.","fr":"Décision de revue enregistrée par l’utilisateur.","es":"Decisión de revisión registrada por el usuario.","pl":"Decyzja z przeglądu zapisana przez użytkownika."},"ui.delta":{"en":"Engineering delta","uk":"Інженерна зміна","de":"Technische Änderung","nl":"Technische wijziging","fr":"Écart technique","es":"Cambio técnico","pl":"Zmiana techniczna"},"ui.current_value":{"en":"Current / existing state","uk":"Поточний / існуючий стан","de":"Aktueller / bestehender Zustand","nl":"Huidige / bestaande toestand","fr":"État actuel / existant","es":"Estado actual / existente","pl":"Stan obecny / istniejący"},"ui.proposed_value":{"en":"Proposed state","uk":"Запропонований стан","de":"Vorgeschlagener Zustand","nl":"Voorgestelde toestand","fr":"État proposé","es":"Estado propuesto","pl":"Stan proponowany"},"ui.process_type":{"en":"Change process type","uk":"Тип процесу зміни","de":"Art des Änderungsprozesses","nl":"Type wijzigingsproces","fr":"Type de processus de modification","es":"Tipo de proceso de cambio","pl":"Rodzaj procesu zmiany"},"ui.effectivity":{"en":"Effectivity / affected units or areas","uk":"Застосовність / зачеплені одиниці чи зони","de":"Gültigkeitsbereich / betroffene Einheiten oder Bereiche","nl":"Toepassingsgebied / getroffen eenheden of zones","fr":"Applicabilité / unités ou zones concernées","es":"Aplicabilidad / unidades o áreas afectadas","pl":"Zakres obowiązywania / jednostki lub obszary"},"ui.effective_date":{"en":"Planned effective date / milestone","uk":"Планова дата набрання чинності / етап","de":"Geplantes Wirksamkeitsdatum / Meilenstein","nl":"Geplande ingangsdatum / mijlpaal","fr":"Date d’effet / jalon prévu","es":"Fecha efectiva / hito previsto","pl":"Planowana data wejścia w życie / kamień milowy"},"ui.standing_config":{"en":"Standing configuration until completion","uk":"Чинна конфігурація до завершення","de":"Geltende Konfiguration bis zum Abschluss","nl":"Geldende configuratie tot afronding","fr":"Configuration en vigueur jusqu’à clôture","es":"Configuración vigente hasta el cierre","pl":"Konfiguracja obowiązująca do zakończenia"},"ui.related_change_refs":{"en":"Related change / deviation references","uk":"Посилання на пов’язані зміни / відхилення","de":"Verweise auf verbundene Änderungen / Abweichungen","nl":"Referenties naar gerelateerde wijzigingen / afwijkingen","fr":"Références de modifications / dérogations liées","es":"Referencias de cambios / desviaciones relacionados","pl":"Odniesienia do powiązanych zmian / odstępstw"},"ui.action_register":{"en":"Action, evidence & closure register","uk":"Реєстр дій, доказів і закриття","de":"Maßnahmen-, Nachweis- und Abschlussregister","nl":"Register acties, bewijs en afsluiting","fr":"Registre actions, preuves et clôture","es":"Registro de acciones, evidencias y cierre","pl":"Rejestr działań, dowodów i zamknięcia"},"ui.action_note":{"en":"One row closes one impact domain. Closed affected items require an action and evidence; checked-no-impact requires a documented basis; N/A requires a reason.","uk":"Один рядок закриває одну область впливу. Для закритого впливу потрібні дія й доказ; для «впливу немає» — документована підстава; для N/A — причина.","de":"Eine Zeile schließt einen Auswirkungsbereich. Geschlossene betroffene Punkte benötigen Maßnahme und Nachweis; „kein Einfluss“ braucht eine dokumentierte Begründung; N/A braucht einen Grund.","nl":"Eén rij sluit één impactdomein. Gesloten beïnvloede punten vereisen actie en bewijs; gecontroleerd-geen-impact vereist een gedocumenteerde basis; n.v.t. vereist een reden.","fr":"Une ligne clôt un domaine d’impact. Un impact clôturé exige une action et une preuve ; « sans impact » exige une base documentée ; N/A exige un motif.","es":"Una fila cierra un dominio de impacto. Un impacto cerrado requiere acción y evidencia; «sin impacto» requiere una base documentada; N/A requiere motivo.","pl":"Jeden wiersz zamyka jeden obszar wpływu. Zamknięty wpływ wymaga działania i dowodu; „brak wpływu” wymaga udokumentowanej podstawy; N/D wymaga uzasadnienia."},"ui.item_refs":{"en":"Affected item(s) / document IDs","uk":"Зачеплені об’єкти / ID документів","de":"Betroffene Elemente / Dokument-IDs","nl":"Getroffen items / document-ID’s","fr":"Éléments affectés / identifiants documents","es":"Elementos afectados / IDs de documentos","pl":"Elementy objęte zmianą / identyfikatory dokumentów"},"ui.required_action":{"en":"Required action","uk":"Потрібна дія","de":"Erforderliche Maßnahme","nl":"Vereiste actie","fr":"Action requise","es":"Acción requerida","pl":"Wymagane działanie"},"ui.owner":{"en":"Owner","uk":"Власник дії","de":"Verantwortlicher","nl":"Eigenaar","fr":"Responsable","es":"Responsable","pl":"Odpowiedzialny"},"ui.due":{"en":"Required before / due","uk":"Потрібно до / строк","de":"Erforderlich vor / fällig","nl":"Vereist vóór / termijn","fr":"Requis avant / échéance","es":"Requerido antes de / vencimiento","pl":"Wymagane przed / termin"},"ui.closure_status":{"en":"Closure status","uk":"Статус закриття","de":"Abschlussstatus","nl":"Afsluitstatus","fr":"État de clôture","es":"Estado de cierre","pl":"Status zamknięcia"},"ui.evidence_ref":{"en":"Evidence / record reference","uk":"Доказ / посилання на запис","de":"Nachweis / Datensatzreferenz","nl":"Bewijs / recordreferentie","fr":"Preuve / référence d’enregistrement","es":"Evidencia / referencia de registro","pl":"Dowód / odniesienie do zapisu"},"ui.add_action":{"en":"Add disposition / action","uk":"Додати рішення / дію","de":"Entscheidung / Maßnahme hinzufügen","nl":"Besluit / actie toevoegen","fr":"Ajouter décision / action","es":"Añadir disposición / acción","pl":"Dodaj decyzję / działanie"},"ui.open_actions":{"en":"Open actions","uk":"Відкриті дії","de":"Offene Maßnahmen","nl":"Open acties","fr":"Actions ouvertes","es":"Acciones abiertas","pl":"Otwarte działania"},"ui.evidence_gaps":{"en":"Closure gaps","uk":"Прогалини закриття","de":"Abschlusslücken","nl":"Afsluitgaten","fr":"Écarts de clôture","es":"Brechas de cierre","pl":"Luki zamknięcia"},"ui.closed_actions":{"en":"Closed domains","uk":"Закриті області","de":"Geschlossene Bereiche","nl":"Gesloten domeinen","fr":"Domaines clôturés","es":"Dominios cerrados","pl":"Zamknięte obszary"},"ui.assessment_open":{"en":"Impact mapped — closure actions remain open","uk":"Вплив визначено — дії із закриття залишаються відкритими","de":"Auswirkungen ermittelt — Abschlussmaßnahmen sind noch offen","nl":"Impact in kaart — afsluitacties staan nog open","fr":"Impacts cartographiés — actions de clôture encore ouvertes","es":"Impacto mapeado — quedan acciones de cierre","pl":"Wpływ określony — działania zamykające pozostają otwarte"},"ui.ready_release":{"en":"Impact assessment closed for release","uk":"Оцінку впливу закрито для випуску","de":"Auswirkungsbewertung für Freigabe abgeschlossen","nl":"Impactbeoordeling gesloten voor vrijgave","fr":"Évaluation d’impact clôturée pour libération","es":"Evaluación de impacto cerrada para liberación","pl":"Ocena wpływu zamknięta do wydania"},"ui.path":{"en":"Impact path","uk":"Ланцюжок впливу","de":"Auswirkungspfad","nl":"Impactpad","fr":"Chaîne d’impact","es":"Ruta de impacto","pl":"Ścieżka wpływu"},"ui.proposed_impact":{"en":"Proposed impact","uk":"Запропонований вплив","de":"Vorgeschlagene Auswirkung","nl":"Voorgestelde impact","fr":"Impact proposé","es":"Impacto propuesto","pl":"Proponowany wpływ"},"ui.closure_issue":{"en":"Why closure is not valid","uk":"Чому закриття недійсне","de":"Warum der Abschluss nicht gültig ist","nl":"Waarom de afsluiting niet geldig is","fr":"Pourquoi la clôture n’est pas valide","es":"Por qué el cierre no es válido","pl":"Dlaczego zamknięcie jest nieważne"},"ui.delta_missing":{"en":"Define current and proposed states so the technical delta is explicit.","uk":"Вкажіть поточний і запропонований стани, щоб технічна зміна була явною.","de":"Aktuellen und vorgeschlagenen Zustand angeben, damit die technische Änderung eindeutig ist.","nl":"Definieer huidige en voorgestelde toestand zodat de technische delta expliciet is.","fr":"Définissez les états actuel et proposé pour rendre l’écart technique explicite.","es":"Defina los estados actual y propuesto para que el cambio técnico sea explícito.","pl":"Określ stan obecny i proponowany, aby zmiana techniczna była jednoznaczna."},"ui.effectivity_missing":{"en":"A late or field change needs an explicit effectivity / affected-unit statement.","uk":"Пізня або польова зміна потребує явного визначення застосовності / зачеплених одиниць.","de":"Eine späte oder Feldänderung braucht eine eindeutige Aussage zum Gültigkeitsbereich / betroffenen Einheiten.","nl":"Een late of veldwijziging vereist een expliciete toepassings-/eenhedenverklaring.","fr":"Une modification tardive ou chantier exige une définition explicite de l’applicabilité / des unités concernées.","es":"Un cambio tardío o de campo requiere una definición explícita de aplicabilidad / unidades afectadas.","pl":"Późna lub terenowa zmiana wymaga jawnego określenia zakresu obowiązywania / jednostek."},"ui.effective_date_missing":{"en":"Implemented/operational change needs an effective date or milestone.","uk":"Впроваджена / експлуатаційна зміна потребує дати набрання чинності або етапу.","de":"Eine umgesetzte/betriebliche Änderung braucht ein Wirksamkeitsdatum oder einen Meilenstein.","nl":"Een geïmplementeerde/operationele wijziging vereist een ingangsdatum of mijlpaal.","fr":"Une modification mise en œuvre/en exploitation exige une date d’effet ou un jalon.","es":"Un cambio implementado/en operación requiere fecha efectiva o hito.","pl":"Wdrożona/eksploatacyjna zmiana wymaga daty wejścia w życie lub kamienia milowego."},"ui.standing_config_missing":{"en":"Temporary/incomplete implementation needs the standing configuration until completion.","uk":"Тимчасове / незавершене впровадження потребує визначення чинної конфігурації до завершення.","de":"Temporäre/unvollständige Umsetzung braucht die geltende Konfiguration bis zum Abschluss.","nl":"Tijdelijke/onvolledige implementatie vereist de geldende configuratie tot afronding.","fr":"Une mise en œuvre temporaire/incomplète exige la configuration en vigueur jusqu’à clôture.","es":"Una implementación temporal/incompleta requiere la configuración vigente hasta el cierre.","pl":"Tymczasowe/niepełne wdrożenie wymaga wskazania konfiguracji obowiązującej do zakończenia."},"ui.impact_not_failure":{"en":"“Affected” is not a failure state: it means review/action is required. Readiness is determined by closure evidence.","uk":"«Зачеплено» не є станом відмови: це означає, що потрібна перевірка/дія. Готовність визначається доказами закриття.","de":"„Betroffen“ ist kein Fehlerzustand: Es bedeutet, dass Prüfung/Maßnahme erforderlich ist. Freigabebereitschaft richtet sich nach Abschlussnachweisen.","nl":"Beïnvloed is geen fouttoestand: het betekent dat review/actie nodig is. Vrijgavegereedheid wordt bepaald door afsluitbewijs.","fr":"« Affecté » n’est pas un état d’échec : une revue/action est requise. L’aptitude à libération dépend des preuves de clôture.","es":"«Afectado» no es un estado de fallo: requiere revisión/acción. La preparación para liberar depende de la evidencia de cierre.","pl":"„Dotyczy” nie jest stanem błędu: oznacza potrzebę przeglądu/działania. Gotowość do wydania zależy od dowodów zamknięcia."},"r.closure_open":{"en":"No valid closed disposition has been recorded for this impact domain.","uk":"Для цієї області впливу немає чинного закритого рішення.","de":"Für diesen Auswirkungsbereich wurde keine gültige geschlossene Entscheidung dokumentiert.","nl":"Voor dit impactdomein is geen geldige gesloten beslissing vastgelegd.","fr":"Aucune disposition clôturée valide n’est enregistrée pour ce domaine.","es":"No se ha registrado una disposición cerrada válida para este dominio.","pl":"Dla tego obszaru wpływu nie zapisano ważnej zamkniętej decyzji."},"r.closure_evidence":{"en":"Closure requires an evidence/reference record.","uk":"Для закриття потрібне посилання на доказ / запис.","de":"Der Abschluss erfordert einen Nachweis / eine Datensatzreferenz.","nl":"Afsluiting vereist een bewijs-/recordreferentie.","fr":"La clôture exige une preuve / référence d’enregistrement.","es":"El cierre requiere una evidencia / referencia de registro.","pl":"Zamknięcie wymaga dowodu / odniesienia do zapisu."},"r.closure_action":{"en":"An affected item cannot be closed without recording the completed action.","uk":"Зачеплений об’єкт не можна закрити без запису виконаної дії.","de":"Ein betroffenes Element kann nicht ohne dokumentierte abgeschlossene Maßnahme geschlossen werden.","nl":"Een beïnvloed item kan niet worden gesloten zonder vastgelegde uitgevoerde actie.","fr":"Un élément affecté ne peut être clôturé sans action réalisée enregistrée.","es":"Un elemento afectado no puede cerrarse sin registrar la acción completada.","pl":"Elementu objętego wpływem nie można zamknąć bez zapisania wykonanego działania."},"r.closure_basis":{"en":"Checked-no-impact requires a documented technical basis and evidence reference.","uk":"«Перевірено — впливу немає» потребує документованої технічної підстави та посилання на доказ.","de":"„Geprüft – keine Auswirkung“ erfordert eine dokumentierte technische Begründung und Nachweisreferenz.","nl":"Gecontroleerd-geen-impact vereist een gedocumenteerde technische basis en bewijsreferentie.","fr":"« Vérifié — sans impact » exige une justification technique documentée et une référence de preuve.","es":"«Revisado — sin impacto» requiere base técnica documentada y referencia de evidencia.","pl":"„Sprawdzone — brak wpływu” wymaga udokumentowanej podstawy technicznej i odniesienia do dowodu."},"r.closure_na":{"en":"N/A requires a recorded reason.","uk":"N/A потребує записаної причини.","de":"N/A erfordert einen dokumentierten Grund.","nl":"N.v.t. vereist een vastgelegde reden.","fr":"N/A exige un motif enregistré.","es":"N/A requiere un motivo registrado.","pl":"N/D wymaga zapisanego uzasadnienia."},"r.unknown_close":{"en":"Unknown cannot be closed; resolve the uncertainty or change the disposition after review.","uk":"Невідомий вплив не можна закрити; усуньте невизначеність або змініть рішення після перевірки.","de":"„Unbekannt“ kann nicht geschlossen werden; Unsicherheit klären oder Einstufung nach Prüfung ändern.","nl":"Onbekend kan niet worden gesloten; los de onzekerheid op of wijzig de classificatie na review.","fr":"« Inconnu » ne peut pas être clôturé ; lever l’incertitude ou modifier la disposition après revue.","es":"«Desconocido» no puede cerrarse; resuelva la incertidumbre o cambie la disposición tras la revisión.","pl":"„Nieznane” nie może być zamknięte; usuń niepewność lub zmień klasyfikację po przeglądzie."},"a.utility_calc":{"en":"Recalculate duty/flow/pressure-loss consequences at the proposed utility condition.","uk":"Перерахувати продуктивність/витрату/втрати тиску для запропонованої умови енергоносія.","de":"Leistung/Volumenstrom/Druckverlust für die vorgeschlagene Versorgungsbedingung neu berechnen.","nl":"Herbereken capaciteit/debiet/drukverlies bij de voorgestelde nutsconditie.","fr":"Recalculer puissance/débit/pertes de charge à la condition utilité proposée.","es":"Recalcular capacidad/caudal/pérdida de presión en la condición propuesta.","pl":"Przeliczyć wydajność/przepływ/straty ciśnienia dla proponowanego warunku medium."},"a.utility_equipment":{"en":"Verify equipment operating point at the proposed condition; nominal rating alone is not sufficient.","uk":"Перевірити робочу точку обладнання за запропонованих умов; лише номіналу недостатньо.","de":"Betriebspunkt der Ausrüstung bei der vorgeschlagenen Bedingung prüfen; Nennleistung allein reicht nicht.","nl":"Controleer het werkpunt bij de voorgestelde conditie; nominale waarde alleen is onvoldoende.","fr":"Vérifier le point de fonctionnement à la condition proposée ; la valeur nominale seule ne suffit pas.","es":"Verificar el punto de operación en la condición propuesta; la nominal no basta.","pl":"Sprawdzić punkt pracy urządzenia w proponowanych warunkach; sam parametr znamionowy nie wystarcza."},"a.utility_operability":{"en":"Verify system/terminal performance and controllability at the proposed condition.","uk":"Перевірити продуктивність системи/терміналів і керованість за запропонованих умов.","de":"System-/Endgeräteleistung und Regelbarkeit bei der vorgeschlagenen Bedingung prüfen.","nl":"Controleer systeem-/afgifteprestatie en regelbaarheid bij de voorgestelde conditie.","fr":"Vérifier performance système/terminaux et contrôlabilité à la condition proposée.","es":"Verificar rendimiento del sistema/terminales y controlabilidad en la condición propuesta.","pl":"Sprawdzić osiągi systemu/odbiorników i sterowalność w proponowanych warunkach."},"a.utility_commissioning":{"en":"Update balancing, commissioning and control setpoints derived from the changed condition.","uk":"Оновити балансування, пусконалагодження та уставки керування, що залежать від зміненої умови.","de":"Abgleich-, Inbetriebnahme- und Regelwerte aus der geänderten Bedingung aktualisieren.","nl":"Werk inregel-, commissioning- en regelwaarden bij die uit de gewijzigde conditie volgen.","fr":"Mettre à jour équilibrage, mise en service et consignes dérivées de la condition modifiée.","es":"Actualizar equilibrado, puesta en marcha y consignas derivadas de la condición modificada.","pl":"Zaktualizować wartości równoważenia, rozruchu i nastaw wynikające ze zmienionego warunku."},"a.routing_calc":{"en":"Recheck length-dependent calculations and installation assumptions for the new route.","uk":"Повторно перевірити розрахунки, залежні від довжини, та монтажні припущення для нової траси.","de":"Längenabhängige Berechnungen und Installationsannahmen für die neue Trasse erneut prüfen.","nl":"Controleer lengteafhankelijke berekeningen en installatieaannames voor de nieuwe route.","fr":"Revoir les calculs dépendant de la longueur et les hypothèses d’installation pour le nouveau cheminement.","es":"Revisar cálculos dependientes de longitud y supuestos de instalación para la nueva ruta.","pl":"Ponownie sprawdzić obliczenia zależne od długości i założenia montażowe dla nowej trasy."},"a.routing_construction":{"en":"Check grouping/support/tray loading, penetrations, access and installation sequence along the new route.","uk":"Перевірити групування/опори/завантаження лотків, проходки, доступ і послідовність монтажу на новій трасі.","de":"Gruppierung/Halterungen/Traglast, Durchführungen, Zugang und Montagefolge entlang der neuen Trasse prüfen.","nl":"Controleer groepering/steunen/gootbelasting, doorvoeren, toegang en montagevolgorde langs de nieuwe route.","fr":"Vérifier groupement/supports/charge chemin de câbles, traversées, accès et séquence d’installation.","es":"Comprobar agrupación/soportes/carga de bandejas, penetraciones, acceso y secuencia de instalación.","pl":"Sprawdzić grupowanie/podpory/obciążenie tras, przepusty, dostęp i kolejność montażu na nowej trasie."},"a.fat_review":{"en":"Determine whether completed FAT/test evidence still bounds the changed configuration; define repeat-test scope where it does not.","uk":"Визначити, чи завершені FAT/випробування все ще охоплюють змінену конфігурацію; за потреби визначити обсяг повторних випробувань.","de":"Feststellen, ob abgeschlossene FAT-/Prüfnachweise die geänderte Konfiguration noch abdecken; andernfalls Wiederholungsprüfungen festlegen.","nl":"Bepaal of afgerond FAT/testbewijs de gewijzigde configuratie nog dekt; bepaal zo nodig de hertestomvang.","fr":"Déterminer si les preuves FAT/essais achevés couvrent encore la configuration modifiée ; sinon définir les réessais.","es":"Determinar si la evidencia FAT/pruebas completadas sigue cubriendo la configuración modificada; definir repetición cuando no.","pl":"Ustalić, czy zakończone FAT/próby nadal obejmują zmienioną konfigurację; w przeciwnym razie określić zakres powtórnych prób."},"a.supplier_same":{"en":"Demonstrate interchangeability beyond nominal duty: interfaces, materials, qualification, spares and test/acceptance basis.","uk":"Довести взаємозамінність не лише за номіналом: інтерфейси, матеріали, кваліфікація, запасні частини та база випробувань/приймання.","de":"Austauschbarkeit über die Nennleistung hinaus nachweisen: Schnittstellen, Werkstoffe, Qualifikation, Ersatzteile und Prüf-/Abnahmebasis.","nl":"Toon uitwisselbaarheid aan buiten nominale prestatie: interfaces, materialen, kwalificatie, reservedelen en test/acceptatiebasis.","fr":"Démontrer l’interchangeabilité au-delà du nominal : interfaces, matériaux, qualification, rechanges et base essais/réception.","es":"Demostrar intercambiabilidad más allá de lo nominal: interfaces, materiales, cualificación, repuestos y base de pruebas/aceptación.","pl":"Wykazać zamienność poza parametrem znamionowym: interfejsy, materiały, kwalifikację, części oraz podstawę prób/odbioru."},"ui.examples_topic_title":{"en":"Examples are not benchmarks","uk":"Приклади — не еталонні тести","de":"Beispiele sind keine Benchmarks","nl":"Voorbeelden zijn geen benchmarks","fr":"Les exemples ne sont pas des benchmarks","es":"Los ejemplos no son benchmarks","pl":"Przykłady nie są benchmarkami"},"ui.examples_topic_body":{"en":"Examples are editable project starting points. Cards labelled “Problem” intentionally contain a missing, late or deceptively simple condition so the inference engine exposes cross-field and second-order consequences. They are UX stories, not frozen proof cases; benchmarks remain separate regression evidence.","uk":"Приклади — це редаговані стартові конфігурації проєкту. Картки «Проблема» навмисно містять відсутню, пізню або оманливо просту умову, щоб механізм висновків показав міжпольові наслідки та наслідки другого порядку. Це сценарії для користувача, а не заморожені доказові кейси; еталонні тести залишаються окремим регресійним доказом.","de":"Beispiele sind editierbare Projekt-Startpunkte. Karten mit „Problem“ enthalten absichtlich eine fehlende, späte oder täuschend einfache Bedingung, damit die Inferenz feldübergreifende und Folgen zweiter Ordnung sichtbar macht. Sie sind UX-Szenarien, keine eingefrorenen Nachweisfälle; Benchmarks bleiben getrennte Regressionsnachweise.","nl":"Voorbeelden zijn bewerkbare startpunten voor een project. Kaarten met “Probleem” bevatten bewust een ontbrekende, late of bedrieglijk eenvoudige conditie zodat de inferentie kruisveld- en tweede-ordegevolgen toont. Het zijn UX-scenario’s, geen bevroren bewijsgevallen; benchmarks blijven afzonderlijk regressiebewijs.","fr":"Les exemples sont des points de départ de projet modifiables. Les cartes « Problème » contiennent volontairement une condition manquante, tardive ou faussement simple afin que le moteur d’inférence révèle les conséquences croisées et de second ordre. Ce sont des scénarios UX, pas des cas de preuve figés; les benchmarks restent des preuves de régression séparées.","es":"Los ejemplos son puntos de partida editables del proyecto. Las tarjetas “Problema” contienen deliberadamente una condición ausente, tardía o engañosamente simple para que el motor de inferencia muestre consecuencias cruzadas y de segundo orden. Son historias UX, no casos de prueba congelados; los benchmarks siguen siendo evidencia de regresión separada.","pl":"Przykłady są edytowalnymi punktami startowymi projektu. Karty „Problem” celowo zawierają brakujący, późny lub pozornie prosty warunek, aby silnik wnioskowania pokazał skutki między polami i skutki drugiego rzędu. To scenariusze UX, nie zamrożone przypadki dowodowe; benchmarki pozostają osobnym dowodem regresji."},"ui.screening":{"en":"Change screening","uk":"Скринінг зміни","de":"Änderungsscreening","nl":"Wijzigingsscreening","fr":"Screening de la modification","es":"Cribado del cambio","pl":"Screening zmiany"},"ui.screening_result":{"en":"Screening result","uk":"Результат скринінгу","de":"Screening-Ergebnis","nl":"Screeningresultaat","fr":"Résultat du screening","es":"Resultado del cribado","pl":"Wynik screeningu"},"ui.configuration":{"en":"Configuration and evidence","uk":"Конфігурація та докази","de":"Konfiguration und Nachweise","nl":"Configuratie en bewijs","fr":"Configuration et preuves","es":"Configuración y evidencia","pl":"Konfiguracja i dowody"},"ui.current_config":{"en":"Current configuration / basis","uk":"Поточна конфігурація / база","de":"Aktuelle  emergencia","pl":"Modyfikacja awaryjna"},"ui.preset_identical":{"en":"Synthetic · Identical replacement","uk":"Синтетичний · Ідентична заміна","de":"Synthetisch · Identischer Ersatz","nl":"Synthetisch · Identieke vervanging","fr":"Synthétique · Remplacement identique","es":"Sintético · Sustitución idéntica","pl":"Syntetyczny · Identyczna wymiana"},"ui.preset_retrofit":{"en":"Synthetic · Pump retrofit","uk":"Синтетичний · Ретрофіт насоса","de":"Synthetisch · Pumpen-Retrofit","nl":"Synthetisch · Pomp-retrofit","fr":"Synthétique · Retrofit de pompe","es":"Sintético · Retrofit de bomba","pl":"Syntetyczny · Retrofit pompy"},"ui.preset_jumper":{"en":"Synthetic · Temporary jumper","uk":"Синтетичний · Тимчасова перемичка","de":"Synthetisch · Temporäre Brücke","nl":"Synthetisch · Tijdelijke jumper","fr":"Synthétique · Cavalier temporaire","es":"Sintético · Puente temporal","pl":"Syntetyczny · Tymczasowy mostek"},"ui.learn_case_title":{"en":"Learn case: find the missed setpoint change","uk":"Навчальний кейс: знайдіть пропущену зміну уставки","de":"Lernfall: übersehene Sollwertänderung finden","nl":"Leercasus: gemiste setpointwijziging vinden","fr":"Cas Learn : trouver le changement de consigne omis","es":"Caso Learn: detectar el cambio de consigna omitido","pl":"Przypadek Learn: znajdź pominiętą zmianę nastawy"},"ui.learn_case_body":{"en":"Try first: review a control-loop modification and identify two missing items. Record your assessment before opening the explanation.","uk":"Спочатку спробуйте: перегляньте модифікацію контуру керування й знайдіть два пропущені пункти. Зафіксуйте свою оцінку до відкриття пояснення.","de":"Zuerst selbst versuchen: Prüfen Sie eine Regelkreisänderung und finden Sie zwei fehlende Punkte. Halten Sie Ihre Bewertung fest, bevor Sie die Erklärung öffnen.","nl":"Probeer eerst: beoordeel een wijziging aan een regelkring en vind twee ontbrekende punten. Leg uw beoordeling vast voordat u de uitleg opent.","fr":"Essayez d’abord : examinez une modification de boucle de régulation et trouvez deux éléments manquants. Consignez votre évaluation avant d’ouvrir l’explication.","es":"Pruebe primero: revise una modificación de lazo de control e identifique dos elementos omitidos. Registre su evaluación antes de abrir la explicación.","pl":"Najpierw spróbuj: przejrzyj zmianę pętli regulacji i znajdź dwa pominięte elementy. Zapisz ocenę przed otwarciem wyjaśnienia."},"ui.parameter_meta_missing":{"en":"Numeric parameter metadata is incomplete","uk":"Метадані числового параметра неповні","de":"Metadaten des numerischen Parameters sind unvollständig","nl":"Metadata van numerieke parameter zijn onvolledig","fr":"Métadonnées du paramètre numérique incomplètes","es":"Metadatos del parámetro numérico incompletos","pl":"Metadane parametru liczbowego są niepełne"},"ui.evidence_unknown":{"en":"Closed action still has unknown or rejected evidence status","uk":"Закрита дія все ще має невідомий або відхилений статус доказу","de":"Geschlossene Maßnahme hat weiterhin unbekannten oder abgelehnten Nachweisstatus","nl":"Gesloten actie heeft nog onbekende of afgewezen bewijsstatus","fr":"Action clôturée avec statut de preuve encore inconnu ou rejeté","es":"Acción cerrada con evidencia aún desconocida o rechazada","pl":"Zamknięte działanie ma nadal nieznany lub odrzucony status dowodu"},"ui.ssc_refs":{"en":"SSC / tag references","uk":"SSC / позначення","de":"SSC / Kennzeichen","nl":"SSC / tag-referenties","fr":"Références SSC / repères","es":"Referencias SSC / etiquetas","pl":"Odniesienia SSC / tagi"},"ui.procedures":{"en":"Affected procedures","uk":"Зачеплені процедури","de":"Betroffene Verfahren","nl":"Betrokken procedures","fr":"Procédures concernées","es":"Procedimientos afectados","pl":"Procedury objęte zmianą"},"ui.temporary_until":{"en":"Temporary until / removal criterion","uk":"Тимчасово до / критерій зняття","de":"Befristet bis / Rückbaukriterium","nl":"Tijdelijk tot / verwijdercriterium","fr":"Temporaire jusqu’à / critère de retrait","es":"Temporal hasta / criterio de retirada","pl":"Tymczasowo do / kryterium usunięcia"},"ui.approval_stale":{"en":"Approval is stale after an input change","uk":"Затвердження застаріло після зміни входів","de":"Freigabe ist nach einer Eingabeänderung veraltet","nl":"Goedkeuring is verouderd na invoerwijziging","fr":"L’approbation est périmée après modification des entrées","es":"La aprobación está obsoleta tras cambiar entradas","pl":"Zatwierdzenie jest nieaktualne po zmianie danych"},"ui.approval_basis_missing":{"en":"Approved decision requires an approval reference / basis","uk":"Затверджене рішення потребує посилання / підстави","de":"Freigegebene Entscheidung benötigt Freigabereferenz / Grundlage","nl":"Goedgekeurd besluit vereist goedkeuringsreferentie / basis","fr":"Une décision approuvée exige une référence / base d’approbation","es":"Una decisión aprobada requiere referencia / base de aprobación","pl":"Zatwierdzona decyzja wymaga odniesienia / podstawy"},"ui.normative_profile_incomplete":{"en":"Selected normative profile is incomplete","uk":"Обраний нормативний профіль неповний","de":"Gewähltes normatives Profil ist unvollständig","nl":"Geselecteerd normatief profiel is onvolledig","fr":"Le profil normatif sélectionné est incomplet","es":"El perfil normativo seleccionado está incompleto","pl":"Wybrany profil normatywny jest niepełny"},"ui.learn_explain_title":{"en":"Explanation","uk":"Пояснення","de":"Erklärung","nl":"Uitleg","fr":"Explication","es":"Explicación","pl":"Wyjaśnienie"},"ui.learn_explain_body":{"en":"The missed items are the setpoint dependency and the validity of the earlier functional test. A setpoint or logic change can invalidate test evidence even when the physical equipment is unchanged.","uk":"Пропущені пункти — залежність уставки та чинність попереднього функціонального випробування. Зміна уставки або логіки може зробити доказ випробування неактуальним навіть без фізичної зміни обладнання.","de":"Übersehen wurden die Sollwertabhängigkeit und die Gültigkeit des früheren Funktionstests. Eine Sollwert- oder Logikänderung kann Prüfnachweise ungültig machen, auch wenn die Hardware unverändert bleibt.","nl":"De gemiste punten zijn de setpointafhankelijkheid en de geldigheid van de eerdere functietest. Een setpoint- of logikawijziging kan testbewijs ongeldig maken, ook als de fysieke apparatuur niet verandert.","fr":"Les éléments omis sont la dépendance de consigne et la validité de l’essai fonctionnel antérieur. Une modification de consigne ou de logique peut invalider une preuve d’essai même si l’équipement physique reste inchangé.","es":"Los elementos omitidos son la dependencia de la consigna y la validez de la prueba funcional anterior. Un cambio de consigna o de lógica puede invalidar la evidencia de prueba aunque el equipo físico no cambie.","pl":"Pominięte elementy to zależność nastawy i ważność wcześniejszego testu funkcjonalnego. Zmiana nastawy lub logiki może unieważnić dowód z testu, nawet gdy sprzęt fizyczny pozostaje bez zmian."},"ui.learn_fix_title":{"en":"Apply the correction","uk":"Внесіть виправлення","de":"Korrektur anwenden","nl":"Correctie toepassen","fr":"Appliquer la correction","es":"Aplicar la corrección","pl":"Wprowadź korektę"},"ui.learn_fix_body":{"en":"Add the missing dependency, mark the pre-change functional-test evidence as stale in the evidence-version field, and keep closure open until a current evidence reference is recorded.","uk":"Додайте пропущену залежність, позначте доказ функціонального випробування до зміни як застарілий у полі версії доказу та залиште закриття відкритим до внесення актуального посилання на доказ.","de":"Ergänzen Sie die fehlende Abhängigkeit, kennzeichnen Sie den Funktionstest vor der Änderung im Evidenzversionsfeld als veraltet und lassen Sie den Abschluss offen, bis ein aktueller Nachweis eingetragen ist.","nl":"Voeg de ontbrekende afhankelijkheid toe, markeer het functietestbewijs van vóór de wijziging als verouderd in het bewijsversieveld en laat de afsluiting open tot een actuele bewijsreferentie is vastgelegd.","fr":"Ajoutez la dépendance manquante, marquez la preuve de l’essai fonctionnel antérieur comme périmée dans le champ de version des preuves et laissez la clôture ouverte jusqu’à l’enregistrement d’une référence de preuve actuelle.","es":"Añada la dependencia omitida, marque como obsoleta la evidencia de la prueba funcional previa al cambio en el campo de versión de evidencia y mantenga el cierre abierto hasta registrar una referencia de evidencia vigente.","pl":"Dodaj brakującą zależność, oznacz dowód testu funkcjonalnego sprzed zmiany jako nieaktualny w polu wersji dowodu i pozostaw zamknięcie otwarte do zapisania aktualnego odniesienia do dowodu."}},"families":{"design_parameter":{"en":"Design parameter","uk":"Проєктний параметр","de":"Designparameter","nl":"Ontwerpparameter","fr":"Paramètre de conception","es":"Parámetro de diseño","pl":"Parametr projektowy"},"equipment_replacement":{"en":"Equipment replacement","uk":"Заміна обладнання","de":"Geräteersatz","nl":"Vervanging van apparatuur","fr":"Remplacement d’équipement","es":"Sustitución de equipo","pl":"Wymiana urządzenia"},"dimensions_layout":{"en":"Dimensions / layout","uk":"Розміри / компонування","de":"Abmessungen / Layout","nl":"Afmetingen / lay-out","fr":"Dimensions / implantation","es":"Dimensiones / disposición","pl":"Wymiary / układ"},"material":{"en":"Material","uk":"Матеріал","de":"Werkstoff","nl":"Materiaal","fr":"Matériau","es":"Material","pl":"Materiał"},"capacity":{"en":"Capacity / duty","uk":"Потужність / продуктивність","de":"Leistung / Kapazität","nl":"Capaciteit / taak","fr":"Capacité / service","es":"Capacidad / servicio","pl":"Wydajność / funkcja"},"setpoint":{"en":"Setpoint","uk":"Уставка","de":"Sollwert","nl":"Setpoint","fr":"Consigne","es":"Consigna","pl":"Nastawa"},"control_logic":{"en":"Control logic","uk":"Логіка керування","de":"Steuerlogik","nl":"Regellogica","fr":"Logique de commande","es":"Lógica de contr function addImpact(map,d,c,reason,level,rule,path){
 if(!DOMAINS[d])return;
 var cur=map[d],p=path||['change',d];
 if(!cur){map[d]={domain:d,classification:c,reasons:[reason],level:level||0,rules:rule?[rule]:[],path:p.slice()};}
 else if(rank(c)>rank(cur.classification)){
  /* a higher class wins the classification and the path; the area keeps the smallest depth
     at which it was reached and every reason that reached it */
  map[d]={domain:d,classification:c,reasons:[reason].concat(cur.reasons.filter(function(x){return x!==reason;})),level:Math.min(cur.level,level||0),rules:(rule?[rule]:[]).concat(cur.rules.filter(function(x){return x!==rule;})),path:p.slice()};}
 else {if(cur.reasons.indexOf(reason)<0)cur.reasons.push(reason);if(rule&&cur.rules.indexOf(rule)<0)cur.rules.push(rule);cur.level=Math.min(cur.level,level||0);}
}
