var CI_PY_CORE="\"\"\"Standard-library Python port of the rule engine of changeimpact.html (changeimpact-2.0).\n\nEntry point: ci_solve(s) takes a state that has already been passed through the page's\nsanitizeState() and returns the language-neutral outputs (see ci_solve docstring).\nci_sanitize(o) is a port of sanitizeState() for convenience; ci_fingerprint(s) is a port\nof stableInputFingerprint().\n\nAll text that the engine emits (suggested actions) is the English ('en') variant, which is\nwhat the page produces when its UI language is English.\n\nJavaScript semantics that matter for parity are reproduced explicitly:\n  * truthiness (js_truthy / js_or) and String() conversion (js_str), including the\n    ECMAScript Number::toString formatting of doubles (js_number_to_string);\n  * String.prototype.trim / regex \\\\s whitespace set (JS_WS), ASCII-only \\\\d;\n  * JSON.stringify of strings (lone surrogates escaped) and of numbers;\n  * Array.prototype.sort() default ordering by UTF-16 code units;\n  * cyrb53 over UTF-16 code units with 32-bit Math.imul arithmetic;\n  * Date.UTC year mapping (years 0..99 are read as 1900..1999).\n\"\"\"\nimport math\nimport re\n\n# ---------------------------------------------------------------------------\n# Vocabularies (copied from DATA in changeimpact.html; only keys and English labels)\n# ---------------------------------------------------------------------------\nDOMAIN_KEYS = [\"requirements\", \"calculations\", \"drawings\", \"specifications\", \"interfaces\", \"equipment\", \"procurement\", \"manufacturing\", \"construction\", \"software\", \"safety\", \"operability\", \"maintainability\", \"test\", \"commissioning\", \"acceptance\", \"spares\", \"training\", \"om\", \"permits\", \"schedule\", \"cost\", \"related_changes\"]\nFAMILY_KEYS = [\"design_parameter\", \"equipment_replacement\", \"dimensions_layout\", \"material\", \"capacity\", \"setpoint\", \"control_logic\", \"software\", \"utility\", \"routing\", \"interface\", \"requirement\", \"standard_basis\", \"supplier\", \"construction_sequence\"]\nLIFECYCLE_KEYS = [\"concept\", \"basic_design\", \"detailed_design\", \"procurement\", \"manufacturing\", \"construction\", \"fat_done\", \"commissioning\", \"operation\"]\nASSET_KEYS = [\"design_only\", \"ordered\", \"manufactured\", \"installed\", \"tested\", \"commissioned\", \"in_operation\"]\nBASELINE_KEYS = [\"pre\", \"approved\", \"as_built\", \"operational\", \"unknown\", \"tbd\", \"na\"]\nKNOW_KEYS = [\"yes\", \"no\", \"unknown\", \"tbd\", \"na\"]\nCLASSIF_KEYS = [\"keep\", \"affected\", \"probably\", \"unknown\", \"no_impact\", \"na\"]\nPROCESS_KEYS = [\"permanent\", \"temporary\", \"field\", \"deviation\", \"like_for_like\", \"document_only\", \"emergency\"]\nDECISION_KEYS = [\"confirmed\", \"rejected\", \"unknown\", \"na\"]\nCONFIDENCE_KEYS = [\"confirmed\", \"provisional\", \"unknown\"]\nAPPROVAL_KEYS = [\"not_requested\", \"pending\", \"approved\", \"rejected\"]\nEVIDENCE_EN = {\n    \"req\": \"Updated requirement and traceability record\",\n    \"calc\": \"Recalculation or documented applicability check\",\n    \"drawing\": \"Revised drawing/model or documented no-change review\",\n    \"spec\": \"Revised specification / datasheet and approval\",\n    \"interface\": \"Interface coordination record / ICD disposition\",\n    \"proc\": \"Purchase order/specification revision or supplier acknowledgement\",\n    \"mfg\": \"Manufacturing impact statement, concession or revised work instruction\",\n    \"construction\": \"Revised installation method/redline and field acceptance\",\n    \"software\": \"Versioned change record and regression/test evidence\",\n    \"safety\": \"Safety assessment and required independent/authority approval\",\n    \"test\": \"Revised test procedure, acceptance criteria and test result\",\n    \"commissioning\": \"Updated commissioning values and signed test pack\",\n    \"om\": \"Updated as-built/O&M/training/spares records as applicable\",\n    \"permit\": \"Approval/permit applicability review and authority disposition\",\n    \"schedule\": \"Updated schedule/sequence impact and required hold points\",\n    \"cost\": \"Documented cost/commercial impact or confirmation of no impact\",\n    \"related_change\": \"Cross-check against open/approved changes, deviations and concessions\"\n}\nACTION_EN = {\n    \"a.utility_calc\": \"Recalculate duty/flow/pressure-loss consequences at the proposed utility condition.\",\n    \"a.utility_equipment\": \"Verify equipment operating point at the proposed condition; nominal rating alone is not sufficient.\",\n    \"a.utility_operability\": \"Verify system/terminal performance and controllability at the proposed condition.\",\n    \"a.utility_commissioning\": \"Update balancing, commissioning and control setpoints derived from the changed condition.\",\n    \"a.routing_calc\": \"Recheck length-dependent calculations and installation assumptions for the new route.\",\n    \"a.routing_construction\": \"Check grouping/support/tray loading, penetrations, access and installation sequence along the new route.\",\n    \"a.fat_review\": \"Determine whether completed FAT/test evidence still bounds the changed configuration; define repeat-test scope where it does not.\",\n    \"a.supplier_same\": \"Demonstrate interchangeability beyond nominal duty: interfaces, materials, qualification, spares and test/acceptance basis.\"\n}\nUNIT_BASE = [\"m\", \"g\", \"s\", \"A\", \"K\", \"mol\", \"cd\", \"Pa\", \"bar\", \"N\", \"J\", \"W\", \"V\", \"\\u03a9\", \"ohm\", \"Hz\", \"C\", \"F\", \"H\", \"T\", \"Wb\", \"S\", \"l\", \"L\", \"h\", \"min\", \"d\", \"t\", \"\\u00b0C\", \"\\u2103\", \"\\u00b0F\", \"%\", \"\\u2030\", \"ppm\", \"rpm\", \"r/min\", \"m\\u00b3\", \"m\\u00b2\", \"m3\", \"m2\", \"VA\", \"var\", \"Wh\", \"VAh\", \"dB\", \"dB(A)\", \"bara\", \"barg\", \"bar(a)\", \"bar(g)\", \"mbar\", \"psi\", \"kgf\", \"lx\", \"lm\", \"rad\", \"sr\", \"\\u00b0\", \"a\", \"yr\", \"cycle\", \"cycles\", \"mm\", \"\\u00b5m\"]\n\nDOMAINS = set(DOMAIN_KEYS)\nCLASSIF = set(CLASSIF_KEYS)\nDECISION = set(DECISION_KEYS)\nCONFIDENCE = set(CONFIDENCE_KEYS)\n\nENGINE_VERSION = 'changeimpact-2.0'\n\n# ---------------------------------------------------------------------------\n# JavaScript value semantics\n# ---------------------------------------------------------------------------\n# WhiteSpace + LineTerminator code points: the set used by String.prototype.trim and by \\s\nJS_WS = ('\\t\\n\\u000b\\u000c\\r          '\n         '        　﻿')\n_WS_CLASS = '[' + re.escape(JS_WS) + ']'\n\n\ndef _is_num(v):\n    return isinstance(v, (int, float)) and not isinstance(v, bool)\n\n\ndef js_truthy(v):\n    \"\"\"ToBoolean for JSON-like values (None stands for both null and undefined).\"\"\"\n    if v is None:\n        return False\n    if isinstance(v, bool):\n        return v\n    if _is_num(v):\n        return not (v == 0 or (isinstance(v, float) and math.isnan(v)))\n    if isinstance(v, str):\n        return len(v) > 0\n    return True\n\n\ndef js_or(*vals):\n    \"\"\"a || b || c : first truthy operand, otherwise the last one.\"\"\"\n    for v in vals[:-1]:\n        if js_truthy(v):\n            return v\n    return vals[-1]\n\n\ndef js_number_to_string(x):\n    \"\"\"ECMAScript Number::toString(10) for a double.\"\"\"\n    x = float(x)\n    if math.isnan(x):\n        return 'NaN'\n    if x == 0:\n        return '0'          # also for -0\n    if math.isinf(x):\n        return 'Infinity' if x > 0 else '-Infinity'\n    if x < 0:\n        return '-' + js_number_to_string(-x)\n    # repr() yields the shortest round-tripping digit string, as ECMAScript requires\n    r = repr(x)\n    mant, _, exp = r.partition('e')\n    e = int(exp) if exp else 0\n    if '.' in mant:\n        ip, fp = mant.split('.')\n    else:\n        ip, fp = mant, ''\n    digits = (ip + fp).lstrip('0')\n    # value = 0.<ip+fp> * 10^(len(ip)+e); adjust for leading zeros removed\n    lead = len(ip + fp) - len((ip + fp).lstrip('0'))\n    n = len(ip) + e - lead\n    digits = digits.rstrip('0') or '0'\n    k = len(digits)\n    if k <= n <= 21:\n        return digits + '0' * (n - k)\n    if 0 < n <= 21:\n        return digits[:n] + '.' + digits[n:]\n    if -6 < n <= 0:\n        return '0.' + '0' * (-n) + digits\n    ee = n - 1\n    sign = '+' if ee >= 0 else '-'\n    if k == 1:\n        return digits + 'e' + sign + str(abs(ee))\n    return digits[0] + '.' + digits[1:] + 'e' + sign + str(abs(ee))\n\n\ndef js_str(v):\n    \"\"\"String(v) for JSON-like values (None is rendered as for null).\"\"\"\n    if isinstance(v, str):\n        return v\n    if v is None:\n        return 'null'\n    if isinstance(v, bool):\n        return 'true' if v else 'false'\n    if _is_num(v):\n        return js_number_to_string(v)\n    if isinstance(v, list):\n        return ','.join('' if x is None else js_str(x) for x in v)\n    return '[object Object]'\n\n\ndef js_trim(t):\n    return t.strip(JS_WS)\n\n\ndef S(v):\n    \"\"\"String(v||'').trim() - the most common idiom of the page.\"\"\"\n    return js_trim(js_str(js_or(v, '')))\n\n\ndef prop(o, k):\n    \"\"\"o.k for a JSON-like value; anything that is not an object yields undefined (None).\"\"\"\n    if isinstance(o, dict):\n        return o.get(k)\n    return None\n\n\ndef own(d, k):\n    \"\"\"Object.prototype.hasOwnProperty.call(VOCAB, k) for a vocabulary given as a set.\"\"\"\n    if isinstance(k, str):\n        return k in d\n    if k is None or isinstance(k, (list, dict)):\n        # String(null) / String(array) / '[object Object]' never name a vocabulary key\n        return js_str(k) in d if isinstance(k, list) else False\n    return js_str(k) in d\n\n\ndef utf16_units(s):\n    b = s.encode('utf-16-le', 'surrogatepass')\n    return [b[i] | (b[i + 1] << 8) for i in range(0, len(b), 2)]\n\n\ndef utf16_len(s):\n    return len(s.encode('utf-16-le', 'surrogatepass')) // 2\n\n\ndef _utf16_key(s):\n    return s.encode('utf-16-be', 'surrogatepass')\n\n\n# ---------------------------------------------------------------------------\n# Ranking, evidence keys\n# ---------------------------------------------------------------------------\n_RANK = {'affected': 4, 'probably': 3, 'unknown': 2, 'no_impact': 1, 'na': 0, 'keep': -1}\n\n\ndef rank(c):\n    # {...}[c]||0 : a missing key and keep's -1 are distinct (-1 is truthy)\n    return _RANK.get(c, 0) if isinstance(c, str) else 0\n\n\ndef downgrade(c):\n    return 'probably' if c == 'affected' else 'unknown'\n\n\ndef evidence_key(d):\n    if d == 'requirements':\n        return 'req'\n    if d == 'calculations':\n        return 'calc'\n    if d == 'drawings':\n        return 'drawing'\n    if d in ('specifications', 'equipment'):\n        return 'spec'\n    if d == 'interfaces':\n        return 'interface'\n    if d == 'procurement':\n        return 'proc'\n    if d == 'manufacturing':\n        return 'mfg'\n    if d == 'construction':\n        return 'construction'\n    if d == 'software':\n        return 'software'\n    if d == 'safety':\n        return 'safety'\n    if d == 'permits':\n        return 'permit'\n    if d in ('test', 'acceptance'):\n        return 'test'\n    if d == 'commissioning':\n        return 'commissioning'\n    if d == 'schedule':\n        return 'schedule'\n    if d == 'cost':\n        return 'cost'\n    if d == 'related_changes':\n        return 'related_change'\n    return 'om'\n\n\n# ---------------------------------------------------------------------------\n# Defaults, seeds, edges\n# ---------------------------------------------------------------------------\nDEFAULTS = {\n    'object': '', 'system': '', 'reason': '', 'family': 'design_parameter', 'processType': 'permanent',\n    'currentValue': '', 'proposedValue': '', 'currentConfig': '', 'sscRefs': '', 'proposedConfig': '',\n    'designBasisRefs': '', 'documentRefs': '', 'procedureRefs': '', 'trainingImpact': '', 'evidenceVersions': '',\n    'effectivity': '', 'temporaryUntil': '', 'effectiveDate': '', 'standingConfig': '', 'relatedChangeRefs': '',\n    'lifecycle': 'detailed_design', 'assetState': 'design_only',\n    'baseline': 'approved', 'baselineNaReason': '', 'safety': 'unknown', 'safetyNaReason': '',\n    'interfaces': 'unknown', 'interfacesNaReason': '', 'sameNominal': False,\n    'jurisdiction': '', 'jurisdictionEdition': '', 'jurisdictionSource': '',\n    'parameters': [], 'relations': [], 'reviews': [],\n    'approvalStatus': 'not_requested', 'approvalBasis': '', 'approvalFingerprint': '', 'presetMeta': None,\n}\n\nFAMILY_SEEDS = {\n    'design_parameter': [['calculations', 'affected'], ['drawings', 'probably'], ['specifications', 'probably']],\n    'equipment_replacement': [['equipment', 'affected'], ['specifications', 'affected'], ['interfaces', 'probably']],\n    'dimensions_layout': [['drawings', 'affected'], ['interfaces', 'affected'], ['construction', 'probably']],\n    'material': [['specifications', 'affected'], ['calculations', 'affected'], ['equipment', 'probably']],\n    'capacity': [['calculations', 'affected'], ['equipment', 'affected'], ['specifications', 'affected']],\n    'setpoint': [['software', 'affected'], ['operability', 'affected'], ['test', 'probably']],\n    'control_logic': [['software', 'affected'], ['interfaces', 'affected'], ['test', 'affected']],\n    'software': [['software', 'affected'], ['test', 'affected'], ['om', 'probably']],\n    'utility': [['calculations', 'affected'], ['operability', 'affected'], ['equipment', 'probably']],\n    'routing': [['drawings', 'affected'], ['construction', 'affected'], ['interfaces', 'probably'], ['calculations', 'probably']],\n    'interface': [['interfaces', 'affected'], ['drawings', 'probably'], ['requirements', 'probably']],\n    'requirement': [['requirements', 'affected'], ['acceptance', 'affected'], ['specifications', 'affected']],\n    'standard_basis': [['requirements', 'affected'], ['safety', 'affected'], ['permits', 'probably']],\n    'supplier': [['procurement', 'affected'], ['equipment', 'probably'], ['specifications', 'affected']],\n    'construction_sequence': [['construction', 'affected'], ['interfaces', 'probably'], ['schedule', 'affected']],\n}\n\nFAMILY_EDGES = {\n    'design_parameter': [['calculations', 'equipment'], ['calculations', 'test'], ['drawings', 'interfaces'], ['specifications', 'acceptance'], ['equipment', 'procurement'], ['interfaces', 'construction']],\n    'equipment_replacement': [['equipment', 'procurement'], ['equipment', 'spares'], ['equipment', 'maintainability'], ['interfaces', 'construction'], ['interfaces', 'test'], ['specifications', 'acceptance'], ['procurement', 'manufacturing']],\n    'dimensions_layout': [['drawings', 'procurement'], ['interfaces', 'construction'], ['interfaces', 'maintainability'], ['construction', 'test'], ['construction', 'om']],\n    'material': [['specifications', 'procurement'], ['specifications', 'manufacturing'], ['specifications', 'acceptance'], ['calculations', 'safety'], ['equipment', 'maintainability'], ['equipment', 'spares']],\n    'capacity': [['calculations', 'operability'], ['calculations', 'test'], ['equipment', 'procurement'], ['specifications', 'acceptance'], ['operability', 'commissioning']],\n    'setpoint': [['software', 'test'], ['software', 'om'], ['operability', 'commissioning'], ['test', 'acceptance'], ['commissioning', 'training']],\n    'control_logic': [['software', 'test'], ['software', 'om'], ['interfaces', 'commissioning'], ['interfaces', 'drawings'], ['test', 'acceptance'], ['commissioning', 'training']],\n    'software': [['software', 'test'], ['software', 'om'], ['test', 'acceptance'], ['test', 'commissioning'], ['commissioning', 'training']],\n    'utility': [['calculations', 'equipment'], ['calculations', 'test'], ['operability', 'commissioning'], ['equipment', 'specifications'], ['equipment', 'procurement'], ['commissioning', 'acceptance']],\n    'routing': [['drawings', 'interfaces'], ['drawings', 'procurement'], ['calculations', 'test'], ['interfaces', 'test'], ['construction', 'om'], ['construction', 'permits'], ['construction', 'schedule']],\n    'interface': [['interfaces', 'software'], ['interfaces', 'test'], ['interfaces', 'commissioning'], ['drawings', 'construction'], ['requirements', 'acceptance']],\n    'requirement': [['requirements', 'calculations'], ['requirements', 'interfaces'], ['specifications', 'procurement'], ['calculations', 'equipment'], ['calculations', 'test'], ['acceptance', 'test']],\n    'standard_basis': [['requirements', 'calculations'], ['requirements', 'specifications'], ['requirements', 'acceptance'], ['safety', 'test'], ['permits', 'construction'], ['specifications', 'procurement']],\n    'supplier': [['equipment', 'interfaces'], ['equipment', 'spares'], ['equipment', 'maintainability'], ['specifications', 'acceptance'], ['procurement', 'manufacturing'], ['procurement', 'construction'], ['procurement', 'schedule'], ['procurement', 'cost'], ['interfaces', 'test']],\n    'construction_sequence': [['construction', 'test'], ['construction', 'commissioning'], ['construction', 'om'], ['interfaces', 'drawings'], ['schedule', 'cost']],\n}\n\n\ndef add_impact(m, d, c, reason, level, rule, path=None):\n    \"\"\"addImpact: a higher class wins classification and path; the area keeps the smallest\n    depth at which it was reached and every reason/rule that reached it.\"\"\"\n    if d not in DOMAINS:\n        return\n    cur = m.get(d)\n    p = path or ['change', d]\n    lv = level or 0\n    if cur is None:\n        m[d] = {'domain': d, 'classification': c, 'reasons': [reason], 'level': lv,\n                'rules': [rule] if rule else [], 'path': list(p)}\n    elif rank(c) > rank(cur['classification']):\n        # dict assignment to an existing key keeps its position, as in JS\n        m[d] = {'domain': d, 'classification': c,\n                'reasons': [reason] + [x for x in cur['reasons'] if x != reason],\n                'level': min(cur['level'], lv),\n                'rules': ([rule] if rule else []) + [x for x in cur['rules'] if x != rule],\n                'path': list(p)}\n    else:\n        if reason not in cur['reasons']:\n            cur['reasons'].append(reason)\n        if rule and rule not in cur['rules']:\n            cur['rules'].append(rule)\n        cur['level'] = min(cur['level'], lv)\n\n\n_LATE_ASSET = ('ordered', 'manufactured', 'installed', 'tested', 'commissioned', 'in_operation')\n_IMPL_ASSET = ('installed', 'tested', 'commissioned', 'in_operation')\n_DELTA_FAMILIES = ('design_parameter', 'equipment_replacement', 'dimensions_layout', 'material', 'capacity',\n                   'setpoint', 'control_logic', 'software', 'utility', 'routing', 'interface', 'supplier')\n\n\ndef has_late(s):\n    return s.get('assetState') in _LATE_ASSET or s.get('lifecycle') in ('fat_done', 'commissioning', 'operation')\n\n\ndef implemented(s):\n    return s.get('assetState') in _IMPL_ASSET or s.get('lifecycle') in ('commissioning', 'operation')\n\n\ndef technical_delta_expected(s):\n    return s.get('processType') != 'document_only' and s.get('family') in _DELTA_FAMILIES\n\n\ndef _reason_short(s):\n    # !s.reason || s.reason.trim().length < 3 (length in UTF-16 code units)\n    r = s.get('reason')\n    if not js_truthy(r):\n        return True\n    return utf16_len(js_trim(js_str(r))) < 3\n\n\ndef _rules(s, m):\n    \"\"\"RULES R01..R45 in page order (each predicate tested, then applied).\"\"\"\n    A = add_impact\n    fam = s.get('family')\n    pt = s.get('processType')\n    ast = s.get('assetState')\n    lc = s.get('lifecycle')\n    bl = s.get('baseline')\n    sf = s.get('safety')\n    itf = s.get('interfaces')\n    same = js_truthy(s.get('sameNominal'))\n    late = has_late(s)\n    # R01\n    if js_truthy(s.get('object')) and js_truthy(fam):\n        for d, c in FAMILY_SEEDS[fam]:\n            if pt == 'like_for_like' and d == 'equipment':\n                c = 'probably'\n            A(m, d, c, 'family', 0, 'R01')\n    if bl == 'approved':\n        A(m, 'requirements', 'probably', 'baseline', 0, 'R02')\n    if bl in ('as_built', 'operational'):\n        A(m, 'om', 'affected', 'baseline', 0, 'R03')\n    if ast == 'ordered':\n        A(m, 'procurement', 'affected', 'late', 0, 'R04'); A(m, 'schedule', 'probably', 'late', 0, 'R04')\n    if ast == 'manufactured':\n        A(m, 'manufacturing', 'affected', 'late', 0, 'R05'); A(m, 'procurement', 'probably', 'late', 0, 'R05')\n        A(m, 'cost', 'probably', 'late', 0, 'R05')\n    if ast == 'installed':\n        A(m, 'construction', 'affected', 'late', 0, 'R06'); A(m, 'drawings', 'affected', 'late', 0, 'R06')\n        A(m, 'schedule', 'affected', 'late', 0, 'R06')\n    if ast == 'tested':\n        A(m, 'test', 'affected', 'fat', 0, 'R07'); A(m, 'acceptance', 'affected', 'fat', 0, 'R07')\n    if ast in ('commissioned', 'in_operation'):\n        A(m, 'commissioning', 'affected', 'late', 0, 'R08'); A(m, 'operability', 'affected', 'late', 0, 'R08')\n        A(m, 'om', 'affected', 'late', 0, 'R08')\n    if lc == 'fat_done':\n        A(m, 'test', 'affected', 'fat', 0, 'R09'); A(m, 'acceptance', 'affected', 'fat', 0, 'R09')\n    if lc == 'commissioning':\n        A(m, 'commissioning', 'affected', 'late', 0, 'R10')\n    if lc == 'operation':\n        A(m, 'operability', 'affected', 'late', 0, 'R11'); A(m, 'training', 'probably', 'late', 0, 'R11')\n    if sf == 'yes':\n        A(m, 'safety', 'affected', 'safety', 0, 'R12'); A(m, 'permits', 'probably', 'safety', 0, 'R12')\n    if sf in ('unknown', 'tbd'):\n        A(m, 'safety', 'unknown', 'unknown', 0, 'R13')\n    if itf == 'yes':\n        A(m, 'interfaces', 'probably' if (fam == 'supplier' and same) else 'affected', 'interface', 0, 'R14')\n    if itf in ('unknown', 'tbd'):\n        A(m, 'interfaces', 'unknown', 'unknown', 0, 'R15')\n    if fam == 'equipment_replacement':\n        A(m, 'spares', 'probably', 'family', 0, 'R16'); A(m, 'maintainability', 'probably', 'family', 0, 'R16')\n    if fam == 'equipment_replacement' and late:\n        A(m, 'construction', 'probably', 'late', 0, 'R17')\n    if fam == 'supplier':\n        A(m, 'procurement', 'affected', 'family', 0, 'R18')\n    if fam == 'supplier' and same:\n        A(m, 'interfaces', 'probably', 'same_nominal', 0, 'R19'); A(m, 'test', 'probably', 'same_nominal', 0, 'R19')\n        A(m, 'spares', 'probably', 'same_nominal', 0, 'R19')\n    if fam == 'setpoint':\n        A(m, 'commissioning', 'probably', 'family', 0, 'R20'); A(m, 'acceptance', 'probably', 'family', 0, 'R20')\n    if fam == 'setpoint' and late:\n        A(m, 'training', 'probably', 'late', 0, 'R21')\n    if fam in ('control_logic', 'software'):\n        A(m, 'software', 'affected', 'family', 0, 'R22'); A(m, 'test', 'affected', 'family', 0, 'R22')\n    if fam == 'software' and late:\n        A(m, 'om', 'affected', 'late', 0, 'R23')\n    if fam == 'utility':\n        A(m, 'calculations', 'affected', 'family', 0, 'R24'); A(m, 'equipment', 'probably', 'family', 0, 'R24')\n    if fam == 'routing':\n        A(m, 'drawings', 'affected', 'family', 0, 'R25'); A(m, 'construction', 'affected', 'family', 0, 'R25')\n        A(m, 'interfaces', 'probably', 'family', 0, 'R25')\n    if fam == 'routing' and late:\n        A(m, 'permits', 'probably', 'late', 0, 'R26')\n    if fam == 'requirement':\n        A(m, 'requirements', 'affected', 'family', 0, 'R27'); A(m, 'acceptance', 'affected', 'family', 0, 'R27')\n    if fam == 'standard_basis':\n        A(m, 'requirements', 'affected', 'family', 0, 'R28'); A(m, 'permits', 'probably', 'family', 0, 'R28')\n    if fam == 'dimensions_layout':\n        A(m, 'maintainability', 'probably', 'family', 0, 'R29')\n    if fam == 'material':\n        A(m, 'safety', 'probably' if sf == 'no' else 'affected', 'family', 0, 'R30')\n        A(m, 'manufacturing', 'probably', 'family', 0, 'R30')\n    if fam == 'capacity':\n        A(m, 'operability', 'affected', 'family', 0, 'R31')\n    if fam == 'construction_sequence':\n        A(m, 'construction', 'affected', 'family', 0, 'R32'); A(m, 'interfaces', 'probably', 'family', 0, 'R32')\n    if bl in ('unknown', 'tbd'):\n        A(m, 'requirements', 'unknown', 'unknown', 0, 'R33')\n    if late and bl == 'pre':\n        A(m, 'om', 'unknown', 'conflict', 0, 'R34')\n    if late and _reason_short(s):\n        A(m, 'requirements', 'unknown', 'missing_reason', 0, 'R35')\n    if fam == 'supplier' and same and late:\n        A(m, 'acceptance', 'probably', 'same_nominal', 0, 'R36')\n    if fam == 'interface' and itf == 'no':\n        A(m, 'interfaces', 'unknown', 'conflict', 0, 'R37')\n    if sf == 'na' and not js_truthy(s.get('safetyNaReason')):\n        A(m, 'safety', 'unknown', 'na_reason', 0, 'R38')\n    if itf == 'na' and not js_truthy(s.get('interfacesNaReason')):\n        A(m, 'interfaces', 'unknown', 'na_reason', 0, 'R39')\n    if bl == 'na' and not js_truthy(s.get('baselineNaReason')):\n        A(m, 'requirements', 'unknown', 'na_reason', 0, 'R40')\n    if pt == 'temporary':\n        A(m, 'operability', 'affected', 'family', 0, 'R41'); A(m, 'training', 'probably', 'family', 0, 'R41')\n        A(m, 'om', 'affected', 'family', 0, 'R41')\n    if pt == 'field':\n        A(m, 'construction', 'affected', 'family', 0, 'R42'); A(m, 'drawings', 'affected', 'family', 0, 'R42')\n        A(m, 'schedule', 'affected', 'family', 0, 'R42'); A(m, 'om', 'probably', 'family', 0, 'R42')\n    if pt == 'deviation':\n        A(m, 'requirements', 'probably', 'family', 0, 'R43'); A(m, 'acceptance', 'affected', 'family', 0, 'R43')\n        A(m, 'related_changes', 'probably', 'family', 0, 'R43')\n    if late:\n        A(m, 'related_changes', 'probably', 'late', 0, 'R44'); A(m, 'cost', 'probably', 'late', 0, 'R44')\n    rc = s.get('relatedChangeRefs')\n    if js_truthy(rc) and js_trim(js_str(rc)):\n        A(m, 'related_changes', 'affected', 'interface', 0, 'R45')\n\n\ndef edge_list(s):\n    fam = s.get('family')\n    return [{'from': e[0], 'to': e[1], 'type': 'functional', 'source': 'built-in family rule ' + js_str(fam),\n             'sourceVersion': ENGINE_VERSION} for e in FAMILY_EDGES.get(fam, [])]\n\n\ndef propagate(m, s):\n    \"\"\"Two-level propagation over the family edges and user relations, one attenuation step per level.\"\"\"\n    if s.get('processType') == 'document_only':\n        return []\n    edges = []\n    frontier = [d for d in m if m[d]['level'] == 0]\n    seen = {d: 0 for d in frontier}\n    rels = s.get('relations') or []\n    for depth in (1, 2):\n        nxt = []\n        for src in frontier:\n            sc = js_or(m[src]['classification'] if src in m else None, 'unknown')\n            for e in edge_list(s):\n                if e['from'] != src:\n                    continue\n                dst = e['to']\n                c = downgrade(sc)\n                pth = list(m[src]['path'] or ['change', src]) + [dst]\n                add_impact(m, dst, c, 'propagate:' + src, depth, 'P' + str(depth), pth)\n                edges.append({'from': src, 'to': dst, 'level': depth, 'custom': False, 'type': e['type'],\n                              'source': e['source'], 'sourceVersion': e['sourceVersion']})\n                if dst not in seen:\n                    seen[dst] = depth\n                    nxt.append(dst)\n            for r in rels:\n                if not (js_truthy(r) and prop(r, 'from') == src and js_truthy(prop(r, 'to'))\n                        and prop(r, 'to') in DOMAINS):\n                    continue\n                to = r['to']\n                c = downgrade(sc)\n                pth = list(m[src]['path'] or ['change', src]) + [to]\n                add_impact(m, to, c, 'custom:' + src, depth, 'C' + str(depth), pth)\n                edges.append({'from': src, 'to': to, 'level': depth, 'custom': True,\n                              'type': js_or(r.get('type'), 'functional'), 'source': js_or(r.get('source'), ''),\n                              'sourceVersion': js_or(r.get('sourceVersion'), ''), 'note': js_or(r.get('note'), '')})\n                if to not in seen:\n                    seen[to] = depth\n                    nxt.append(to)\n        frontier = nxt\n    return edges\n\n\ndef review_rows_for(s, d):\n    return [r for r in (s.get('reviews') or []) if js_truthy(r) and prop(r, 'domain') == d]\n\n\ndef row_classification(r, proposed):\n    rc = prop(r, 'classification')\n    if not js_truthy(rc) or rc == 'keep':\n        return proposed\n    return rc if own(CLASSIF, rc) else 'unknown'\n\n\ndef closure_check(r, proposed):\n    \"\"\"closureCheck: returns (valid, classification, issue).\"\"\"\n    c = row_classification(r, proposed)\n    status = js_or(prop(r, 'status'), 'open')\n    reason = js_trim(js_str(js_or(prop(r, 'reason'), '')))\n    evidence = js_trim(js_str(js_or(prop(r, 'evidenceRef'), '')))\n    action = js_trim(js_str(js_or(prop(r, 'action'), '')))\n    es_raw = prop(r, 'evidenceStatus')\n    explicit = isinstance(r, dict) and 'evidenceStatus' in r and js_truthy(es_raw)\n    if explicit:\n        evidence_status = es_raw if own(DECISION, es_raw) else 'unknown'\n    elif c == 'na' and reason:\n        evidence_status = 'na'\n    elif status == 'closed' and evidence:\n        evidence_status = 'confirmed'\n    else:\n        evidence_status = 'unknown'\n    status_reason = js_trim(js_str(js_or(prop(r, 'statusReason'), '')))\n    if status != 'closed':\n        return False, c, 'closure_open'\n    if c == 'unknown':\n        return False, c, 'unknown_close'\n    if c == 'na' and not reason:\n        return False, c, 'closure_na'\n    if c == 'no_impact' and (not reason or not evidence):\n        return False, c, 'closure_basis'\n    if c in ('affected', 'probably') and not action:\n        return False, c, 'closure_action'\n    if c in ('affected', 'probably') and not evidence:\n        return False, c, 'closure_evidence'\n    if evidence_status in ('unknown', 'rejected'):\n        return False, c, 'evidence_unknown'\n    if evidence_status == 'na' and c != 'na' and not status_reason:\n        return False, c, 'closure_na'\n    return True, c, ''\n\n\ndef suggested_action(d, s):\n    fam = s.get('family')\n    if fam == 'utility' and d == 'calculations':\n        return ACTION_EN['a.utility_calc']\n    if fam == 'utility' and d == 'equipment':\n        return ACTION_EN['a.utility_equipment']\n    if fam == 'utility' and d == 'operability':\n        return ACTION_EN['a.utility_operability']\n    if fam == 'utility' and d == 'commissioning':\n        return ACTION_EN['a.utility_commissioning']\n    if fam == 'routing' and d == 'calculations':\n        return ACTION_EN['a.routing_calc']\n    if fam == 'routing' and d == 'construction':\n        return ACTION_EN['a.routing_construction']\n    if (s.get('lifecycle') == 'fat_done' or s.get('assetState') == 'tested') and d in ('test', 'acceptance'):\n        return ACTION_EN['a.fat_review']\n    if fam == 'supplier' and js_truthy(s.get('sameNominal')) and d in ('equipment', 'interfaces', 'test', 'spares', 'acceptance'):\n        return ACTION_EN['a.supplier_same']\n    return EVIDENCE_EN[evidence_key(d)]\n\n\ndef apply_reviews(m, s):\n    for d in list(m):\n        rows = review_rows_for(s, d)\n        valid_closed = False\n        issues = []\n        for r in rows:\n            ok, c, issue = closure_check(r, m[d]['classification'])\n            rc = prop(r, 'classification')\n            if js_truthy(rc) and rc != 'keep' and ok:\n                m[d]['classification'] = c\n            if ok:\n                valid_closed = True\n            else:\n                issues.append(issue)\n        m[d]['reviewStatus'] = 'closed' if valid_closed else (js_or(rows[0].get('status'), 'open') if rows else 'open')\n        m[d]['closureValid'] = valid_closed\n        m[d]['closureIssues'] = issues\n        m[d]['override'] = any(js_truthy(prop(r, 'classification')) and prop(r, 'classification') != 'keep' for r in rows)\n\n\n# ---------------------------------------------------------------------------\n# Number / range / date / unit parsing\n# ---------------------------------------------------------------------------\n_STRIP_NUM = re.compile('[' + re.escape(JS_WS) + '  ]')\n_NUM_RE = re.compile(r'^([0-9]+\\.?[0-9]*|\\.[0-9]+)([eE][+-]?[0-9]+)?$')\n\n\ndef _js_number(t):\n    \"\"\"Number(t) for a string already validated by _NUM_RE (optionally signed).\"\"\"\n    try:\n        return float(t)\n    except (ValueError, OverflowError):\n        return float('nan')\n\n\ndef parse_locale_number(v):\n    \"\"\"parseLocaleNumber: 1234.5 | 1234,5 | 1,234,567 | 1,234.5 | 1.234.567 | 1.234,5 | .5 | 2e-3;\n    a single separator followed by exactly three digits is ambiguous and refused (NaN).\"\"\"\n    t = '' if v is None else js_str(v)\n    t = _STRIP_NUM.sub('', js_trim(t)).replace('−', '-')\n    if not t:\n        return float('nan')\n    sg = ''\n    if t[0] in '+-':\n        sg = t[0]\n        t = t[1:]\n    if re.match(r'^[1-9][0-9]{0,2}[.,][0-9]{3}$', t):\n        return float('nan')\n    if re.match(r'^[0-9]{1,3}(,[0-9]{3})+\\.[0-9]+$', t) or re.match(r'^[0-9]{1,3}(,[0-9]{3}){2,}$', t):\n        t = t.replace(',', '')\n    elif re.match(r'^[0-9]{1,3}(\\.[0-9]{3})+,[0-9]+$', t) or re.match(r'^[0-9]{1,3}(\\.[0-9]{3}){2,}$', t):\n        t = t.replace('.', '').replace(',', '.', 1)\n    elif re.match(r'^[0-9]*,[0-9]+$', t):\n        t = t.replace(',', '.', 1)\n    # Python's $ also matches before a final newline; whitespace was removed above, so none is left\n    return _js_number(sg + t) if _NUM_RE.match(t) else float('nan')\n\n\ndef _finite(x):\n    return isinstance(x, float) and math.isfinite(x)\n\n\ndef parse_range(v):\n    \"\"\"parseRange: a..b, a–b, a—b, a…b, a-b (unsigned), ≥a, >=a, ≤b, <=b; None when invalid.\"\"\"\n    t = '' if v is None else js_str(v)\n    t = _STRIP_NUM.sub('', js_trim(t)).replace('−', '-')\n    if not t:\n        return None\n    m = re.match(r'^(>=|≥)(.+)$', t, re.S)\n    if m:\n        a = parse_locale_number(m.group(2))\n        return (a, math.inf) if _finite(a) else None\n    m = re.match(r'^(<=|≤)(.+)$', t, re.S)\n    if m:\n        b = parse_locale_number(m.group(2))\n        return (-math.inf, b) if _finite(b) else None\n    m = (re.match(r'^(.+?)(\\.\\.|–|—|…)(.+)$', t, re.S)\n         or re.match(r'^([0-9][0-9.,]*(?:[eE][0-9]+)?)(-)([0-9][0-9.,]*(?:[eE][0-9]+)?)$', t))\n    if m:\n        lo = parse_locale_number(m.group(1))\n        hi = parse_locale_number(m.group(3))\n        return (lo, hi) if (_finite(lo) and _finite(hi) and lo <= hi) else None\n    return None\n\n\ndef valid_iso_date(v):\n    t = js_trim(js_str(js_or(v, '')))\n    m = re.match(r'^([0-9]{4})-([0-9]{2})-([0-9]{2})$', t)\n    if not m:\n        return False\n    y, mo, d = int(m.group(1)), int(m.group(2)), int(m.group(3))\n    if y < 100:\n        return False        # Date.UTC maps years 0..99 to 1900..1999, so the round trip fails\n    if not 1 <= mo <= 12:\n        return False\n    mdays = [31, 29 if (y % 4 == 0 and (y % 100 != 0 or y % 400 == 0)) else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]\n    return 1 <= d <= mdays[mo - 1]\n\n\ndef unit_recognised(u):\n    \"\"\"unitRecognised: every token of a compound unit is a base unit, optionally SI-prefixed.\"\"\"\n    t = js_trim(js_str(js_or(u, '')))\n    if not t:\n        return False\n    for tok in re.split('[/·*⋅ ]+', t):\n        tok = re.sub(r'[²³]$|\\^?-?[0-9]$', '', tok, count=1)\n        if not tok:\n            return False\n        if tok in UNIT_BASE:\n            continue\n        p = re.match(r'^(k|M|G|T|m|µ|u|n|c|d|h)(.+)$', tok, re.S)\n        if not (p and p.group(2) in UNIT_BASE):\n            return False\n    return True\n\n\ndef numeric_metadata_gaps(s):\n    gaps = []\n    for i, p in enumerate(s.get('parameters') or []):\n        if not js_truthy(p):\n            continue\n        g = lambda k: prop(p, k)\n        used = S(js_or(g('name'), g('current'), g('proposed'), ''))\n        if not used:\n            continue\n        if (not S(g('unit')) or not S(g('source')) or not (S(g('sourceDate')) or S(g('sourceVersion')))\n                or not S(g('allowedRange')) or not S(g('confidence'))):\n            gaps.append('parameter_meta_%d' % i)\n        cur, pro = S(g('current')), S(g('proposed'))\n        vc, vp = parse_locale_number(cur), parse_locale_number(pro)\n        if (cur and not _finite(vc)) or (pro and not _finite(vp)):\n            gaps.append('parameter_value_%d' % i)\n        u = S(g('unit'))\n        if u and _finite(parse_locale_number(u)):\n            gaps.append('parameter_unit_%d' % i)\n        if S(g('sourceDate')) and not valid_iso_date(g('sourceDate')):\n            gaps.append('parameter_date_%d' % i)\n        rg = S(g('allowedRange'))\n        r = parse_range(rg) if rg else None\n        if rg and not r:\n            gaps.append('parameter_range_%d' % i)\n        if r and _finite(vp) and (vp < r[0] or vp > r[1]):\n            gaps.append('parameter_out_of_range_%d' % i)\n        if S(g('confidence')) and not own(CONFIDENCE, g('confidence')):\n            gaps.append('parameter_confidence_%d' % i)\n    return gaps\n\n\ndef input_gaps(s):\n    \"\"\"inputGaps: ids of the change-context gaps, in page order.\"\"\"\n    g = []\n    pt = s.get('processType')\n    if technical_delta_expected(s) and (not S(s.get('currentValue')) or not S(s.get('proposedValue'))):\n        g.append('delta')\n    if (has_late(s) or pt == 'field') and not S(s.get('effectivity')):\n        g.append('effectivity')\n    if implemented(s) and not S(s.get('effectiveDate')):\n        g.append('effective_date')\n    if (pt in ('temporary', 'emergency') or (implemented(s) and pt == 'field')) and not S(s.get('standingConfig')):\n        g.append('standing_config')\n    if pt == 'temporary' and not S(s.get('temporaryUntil')):\n        g.append('temporary_until')\n    if S(s.get('jurisdiction')) and (not S(s.get('jurisdictionEdition')) or not S(s.get('jurisdictionSource'))):\n        g.append('normative_profile')\n    if s.get('approvalStatus') == 'approved' and not S(s.get('approvalBasis')):\n        g.append('approval_basis')\n    g.extend(numeric_metadata_gaps(s))\n    return g\n\n\ndef build_actions(impacts, s):\n    out = []\n    for x in impacts:\n        rows = review_rows_for(s, x['domain'])\n        if not rows:\n            out.append({'domain': x['domain'], 'item': '', 'classification': x['classification'],\n                        'action': suggested_action(x['domain'], s), 'owner': '', 'due': '', 'status': 'open',\n                        'valid': False, 'issue': 'closure_open'})\n            continue\n        for r in rows:\n            ok, c, issue = closure_check(r, x['classification'])\n            out.append({'domain': x['domain'], 'item': js_or(r.get('item'), ''), 'classification': c,\n                        'action': js_or(r.get('action'), suggested_action(x['domain'], s)),\n                        'owner': js_or(r.get('owner'), ''), 'due': js_or(r.get('due'), ''),\n                        'status': js_or(r.get('status'), 'open'), 'valid': ok, 'issue': issue})\n    return out\n\n\n# ---------------------------------------------------------------------------\n# Canonical JSON, cyrb53, fingerprint, approval\n# ---------------------------------------------------------------------------\n_ESC = {'\"': '\\\\\"', '\\\\': '\\\\\\\\', '\\b': '\\\\b', '\\f': '\\\\f', '\\n': '\\\\n', '\\r': '\\\\r', '\\t': '\\\\t'}\n\n\ndef js_json_string(s):\n    \"\"\"JSON.stringify(string): well-formed variant (lone surrogates are escaped).\"\"\"\n    out = ['\"']\n    units = utf16_units(s)\n    i, n = 0, len(units)\n    while i < n:\n        u = units[i]\n        if 0xD800 <= u <= 0xDBFF and i + 1 < n and 0xDC00 <= units[i + 1] <= 0xDFFF:\n            out.append(chr(0x10000 + ((u - 0xD800) << 10) + (units[i + 1] - 0xDC00)))\n            i += 2\n            continue\n        ch = chr(u)\n        if ch in _ESC:\n            out.append(_ESC[ch])\n        elif u < 0x20 or 0xD800 <= u <= 0xDFFF:\n            out.append('\\\\u%04x' % u)\n        else:\n            out.append(ch)\n        i += 1\n    out.append('\"')\n    return ''.join(out)\n\n\ndef canonical_json(v):\n    \"\"\"canonicalJSON: object keys sorted by UTF-16 code units, JSON.stringify for scalars.\"\"\"\n    if isinstance(v, list):\n        return '[' + ','.join(canonical_json(x) for x in v) + ']'\n    if isinstance(v, dict):\n        return '{' + ','.join(js_json_string(k) + ':' + canonical_json(v[k])\n                              for k in sorted(v.keys(), key=_utf16_key)) + '}'\n    if v is None:\n        return 'null'\n    if isinstance(v, bool):\n        return 'true' if v else 'false'\n    if _is_num(v):\n        f = float(v)\n        return js_number_to_string(f) if math.isfinite(f) else 'null'\n    if isinstance(v, str):\n        return js_json_string(v)\n    return 'null'\n\n\ndef _imul(a, b):\n    return (a * b) & 0xFFFFFFFF\n\n\ndef cyrb53(text):\n    h1, h2 = 0xdeadbeef, 0x41c6ce57\n    for ch in utf16_units(text):\n        h1 = _imul(h1 ^ ch, 2654435761)\n        h2 = _imul(h2 ^ ch, 1597334677)\n    h1 = _imul(h1 ^ (h1 >> 16), 2246822507)\n    h1 ^= _imul(h2 ^ (h2 >> 13), 3266489909)\n    h2 = _imul(h2 ^ (h2 >> 16), 2246822507)\n    h2 ^= _imul(h1 ^ (h1 >> 13), 3266489909)\n    return '%08x%08x' % (h2 & 0xFFFFFFFF, h1 & 0xFFFFFFFF)\n\n\ndef _json_clone(v):\n    \"\"\"JSON.parse(JSON.stringify(v)) for JSON-like data: non-finite numbers become null.\"\"\"\n    if isinstance(v, dict):\n        return {k: _json_clone(x) for k, x in v.items()}\n    if isinstance(v, list):\n        return [_json_clone(x) for x in v]\n    if isinstance(v, float) and not math.isfinite(v):\n        return None\n    return v\n\n\ndef ci_fingerprint(s):\n    \"\"\"stableInputFingerprint: cyrb53 over the canonical JSON of the inputs without approval fields.\"\"\"\n    x = _json_clone(s or {})\n    for k in ('approvalStatus', 'approvalBasis', 'approvalFingerprint', 'presetMet mily', 0, 'R-TM-02')\n        add_impact(m, 'training', 'probably', 'family', 0, 'R-TM-03')\n    edges = propagate(m, s)\n    apply_reviews(m, s)\n    impacts = list(m.values())\n    for x in impacts:\n        x['reviewStatus'] = js_or(x.get('reviewStatus'), 'open')\n        x['evidence'] = evidence_key(x['domain'])\n    # rank desc, level asc, domain asc (localeCompare equals code-point order for the domain keys)\n    impacts.sort(key=lambda x: (-rank(x['classification']), x['level'], x['domain']))\n    counts = {'affected': 0, 'probably': 0, 'unknown': 0, 'no_impact': 0, 'na': 0}\n    for x in impacts:\n        counts[x['classification']] = counts.get(x['classification'], 0) + 1\n    actions = build_actions(impacts, s)\n    gaps = [{'domain': a['domain'], 'classification': a['classification'], 'issue': a['issue'],\n             'item': js_or(a['item'], '')} for a in actions if not a['valid']]\n    for gid in input_gaps(s):\n        gaps.append({'domain': 'requirements', 'classification': 'unknown', 'issue': gid, 'item': ''})\n    closed = sum(1 for x in impacts if x['closureValid'])\n    appr = approval_state(s)\n    return {\n        'calculation_completed': True,\n        'criterion_met': len(gaps) == 0,\n        'result_stale': bool(appr['stale']),\n        'counts': counts,\n        'closed_domains': closed,\n        'closure_gaps': len(gaps),\n        'impact_classes': [{'domain': x['domain'], 'classification': x['classification'], 'level': x['level'],\n                            'review_status': x['reviewStatus'], 'closure_valid': bool(x['closureValid'])}\n                           for x in impacts],\n        'gap_list': gaps,\n        'action_list': actions,\n        'dependency_edges': [{'from': e['from'], 'to': e['to'], 'type': js_or(e.get('type'), ''),\n                              'source': js_or(e.get('source'), ''), 'source_version': js_or(e.get('sourceVersion'), ''),\n                              'level': e['level'], 'custom': bool(e['custom'])} for e in edges],\n    }\n\n\ndef compute():\n    # INPUTS is the recorded (sanitized) state; outputs are the language-neutral keys of the record\n    r = ci_solve(INPUTS)\n    al = [{k: a[k] for k in ('domain', 'item', 'classification', 'owner', 'due', 'status', 'valid', 'issue')} for a in r['action_list']]\n    for a in al: a['issue'] = a['issue'] or ''\n    out = {k: r[k] for k in ('calculation_completed', 'criterion_met', 'result_stale', 'counts', 'closure_gaps', 'impact_classes', 'gap_list', 'dependency_edges')}\n    out['action_list'] = al\n    if r.get('closed_domains') is not None: out['closed_domains'] = r['closed_domains']\n    return out\n";

/* ================= project package (tools.petrov.re/project-package/v1) =========

   stages. It reads all ten sections and writes `flags` and nothing else (TZ §5).
   A flag never deletes or edits the thing it points at (§2.3); if this file ever
   wants to modify a requirement, it wants a flag on it instead.
   diagram-project.js is deferred, so it has not run while this inline script is
   evaluated: every use asks for the runtime at call time, never through a
   captured var. */

/* §2.1 canonical stage vocabulary <-> this tool's nine local stages. The pair
   manufacturing <-> factory is the only place the two lists spell the same stage
   differently. `fat_done` is a local milestone with no canonical equivalent and
   `handover`, `close-out` and `decommissioning` are canonical stages with no
   local equivalent: all four are REPORTED as unmapped and never rounded to a
   neighbour (§3.4). This tool writes no `project` section, so the map only has
   to be injective in the canonical -> local direction, which it is. */
var CI_LIFE_FROM={concept:'concept',basic:'basic_design',detailed:'detailed_design',procurement:'procurement',factory:'manufacturing',construction:'construction',commissioning:'commissioning',operations:'operation'};
var CI_LIFE_TO={concept:'concept',basic_design:'basic',detailed_design:'detailed',procurement:'procurement',manufacturing:'factory',construction:'construction',commissioning:'commissioning',operation:'operations'};

/* The 23 impact areas are this tool's natural statement of what a change touches.
   Mapping an area to the package register it implicates is how an impact becomes
   a flag. `basis:'definitional'` means the area and the register are the same
   object under two names; `basis:'judgement'` means an engineering judgement that
   a reader may disagree with, and it is written down here so that disagreement is
   visible rather than buried in code.
   An area with an EMPTY LIST implicates no register in this schema. It is reported
   to the user as unflaggable and never forced into the nearest register, because
   rounding manufactures an orphan flag in a tool that owns a different register
   (§2.3). That is a different thing from an area whose register is simply not in
   this package yet, which gets its own sentence.
   `acceptance` deliberately keeps TWO links. Now that the two evidence registers
   have two distinct kinds, an acceptance impact raises one flag in EACH: they are
   two registers with two owners answering two different questions, and collapsing
   them to one would leave one of the two owners unwarned. See ciPropose. */

/* §2.3, amended: `target_kind` names the register, ONE KIND PER REGISTER, and
   the seven values below are the whole list. Every register the package carries
   now has a kind, so every register is flaggable.
   NOTHING VALIDATES THIS. The runtime stores and returns `flags[]` verbatim and
   has no `target_kind` concept at all — it accepts a misspelt kind, an unknown
   flag word, even a bare number, with ok:true and no warning. The only thing
   standing between a wrong kind and six tools rendering it is this table and the

var CI_REGISTER_KIND={requirements:'requirement',deliverables:'deliverable',vendor_documents:'vendor_document',interfaces:'interface',verification_evidence:'verification_evidence',commissioning_evidence:'commissioning_evidence',definition_decisions:'definition_decision',review_decisions:'review_decision'};

var CI_TARGET_KINDS=['requirement','deliverable','vendor_document','interface','verification_evidence','commissioning_evidence','definition_decision','review_decision'];

var CI_SPLIT_PAIRS=[['verification_evidence','commissioning_evidence'],['definition_decisions','review_decisions']];

function PKs(k){ return (window.DiagramProject&&DiagramProject.strings[k])||CIS[k]||{en:k}; }
function PKt(k,vars){ var o=PKs(k),l=PLANG(); var s=(o&&(o[l]||o.en))||k; Object.keys(vars||{}).forEach(function(v){ s=s.split('{'+v+'}').join(String(vars[v])); }); return s; }
function Ct(k,vars){ var o=CIS[k]||{en:k},l=PLANG(); var s=o[l]||o.en||k; Object.keys(vars||{}).forEach(function(v){ s=s.split('{'+v+'}').join(String(vars[v])); }); return s; }

/* ---- reading the package ---- */
function ciItemLabel(o){ if(!o||typeof o!=='object') return ''; return String(o.label||o.name||o.title||o.text||o.id||''); }
/* The inventory of everything a flag could point at, per register, from whatever
   the package actually carries. A register the package does not carry is absent
   from this map — which is not the same as an empty register, and the two are
   reported differently. */
function ciInventory(p){
 var inv={};
 if(!p) return inv;
 CI_REGISTERS.forEach(function(reg){
  if(!Array.isArray(p[reg])) return;
  inv[reg]=p[reg].filter(function(x){return x&&typeof x==='object'&&x.id;}).map(function(x){return {id:String(x.id),label:ciItemLabel(x)};});
 });
 return inv;
}
/* §2.2 — a work package may carry a system NAME with an empty system id. That is
   the truth, not a defect, and it is reported rather than matched against
   nothing. */
function ciSystemNameOnly(p){
 var st=p&&p.structure, out=[];
 if(!st||!Array.isArray(st.packages)) return out;
 st.packages.forEach(function(pk){ if(pk&&pk.system_name&&!pk.system_id) out.push(String(pk.name||pk.id||'')+' → '+String(pk.system_name)); });
 return out;
}
function ciLifecycleFrom(canon){ return CI_LIFE_FROM[canon]||null; }
function ciLifecycleTo(local){ return CI_LIFE_TO[local]||null; }

/* ---- proposing flags ----
   The impact result is the input. Every area the model classifies `affected` or
   `probably` implicates the registers in CI_AREA_REGISTERS; every item in those
   registers that the package actually carries becomes one proposed flag. The
   flag WORD is chosen here and nowhere else:
     stale       - the target is evidence and the change is late (the asset is
                   built, tested, commissioned or running, or the stage is at or
                   past construction): evidence produced before the change may
                   no longer demonstrate the delivered configuration.
     superseded  - the change is a permanent change to the requirement or the
                   standard basis itself, and the target is a requirement or a
                   decision: the basis those items rest on has been replaced.
     affected    - everything else: review is required, and nothing is asserted
                   about the outcome of that review. */
var CI_SEP=String.fromCharCode(31);
function ciLate(s){ return ['installed','tested','commissioned','in_operation'].indexOf(s.assetState)>=0||['construction','fat_done','commissioning','operation'].indexOf(s.lifecycle)>=0; }
function ciFlagWord(reg,s){
 /* both evidence registers take the same word for the same reason — evidence
    produced before a late change — but they are flagged under their own kinds and
    reach their own owners */
 if((reg==='verification_evidence'||reg==='commissioning_evidence')&&ciLate(s)) return 'stale';
 if((reg==='requirements'||reg==='decisions')&&s.processType==='permanent'&&(s.family==='requirement'||s.family==='standard_basis')) return 'superseded';
 return 'affected';
}
function ciNowIso(){ try{ return new Date().toISOString().replace(/\.\d{3}Z$/,'Z'); }catch(e){ return '1970-01-01T00:00:00Z'; } }
function ciReason(word,area,s){
 var l=PLANG(), objName=String(s.object||'').trim()||pick(tx('ui.object'));
 var areaLabel=(DOMAINS[area]&&(DOMAINS[area][l]||DOMAINS[area].en))||area;
 var stageLabel=(LIFECYCLE[s.lifecycle]&&(LIFECYCLE[s.lifecycle][l]||LIFECYCLE[s.lifecycle].en))||s.lifecycle||'';
 if(word==='stale') return Ct('r_stale',{object:objName,stage:stageLabel});
 if(word==='superseded') return Ct('r_superseded',{object:objName,area:areaLabel});
 return Ct('r_affected',{object:objName,area:areaLabel});
}
/* Returns the proposals plus the two things this tool must REPORT rather than act
   on, kept apart because they are different facts about the world:
     unflaggable - the area implicates no register in this schema at all. Nothing
                   will ever be flaggable for it. Reported, never rounded onto a
                   neighbouring register (§2.3).
     notInPackage - the area maps to a real register that THIS package does not
                   carry yet. Flaggable in principle, absent in fact, and saying
                   "unflaggable" here would be a lie about the schema.
   Every register now has a kind, so there is no longer a third bucket for a
   register the flag vocabulary cannot name. A kind this table cannot supply is a
   bug in the table, and the assertion below turns it into a failed benchmark case
   rather than a malformed flag shipped to six tools. */
function ciPropose(p,s,res){
 var inv=ciInventory(p), rev=(p&&Number(p.package_revision))||0, at=ciNowIso();
 var props=[], unflaggable=[], notInPackage=[], seen={}, badKind=[];
 (res&&res.impacts||[]).forEach(function(x){
  if(x.classification!=='affected'&&x.classification!=='probably') return;
  var links=CI_AREA_REGISTERS[x.domain];
  if(!links) return;
  if(!links.length){ if(unflaggable.indexOf(x.domain)<0) unflaggable.push(x.domain); return; }
  links.forEach(function(link){
   var reg=link.register, kind=CI_REGISTER_KIND[reg], items=inv[reg]||[];
   /* a register with no kind is impossible after the §2.3 amendment; if it ever
      happens it is surfaced, never silently rounded and never emitted */
   if(!kind||CI_TARGET_KINDS.indexOf(kind)<0){ if(badKind.indexOf(reg)<0) badKind.push(reg); return; }
   if(!items.length){ if(notInPackage.indexOf(reg)<0) notInPackage.push(reg); return; }
   var word=ciFlagWord(reg,s);
   items.forEach(function(it){
    var k=kind+CI_SEP+it.id+CI_SEP+word;
    if(seen[k]) return; seen[k]=1;
    props.push({target_kind:kind,target_id:it.id,flag:word,reason:ciReason(word,x.domain,s),
                raised_by:'changeimpact',raised_at:at,raised_against_revision:rev,
                _label:it.label,_register:reg,_area:x.domain,_basis:link.basis});
   });
  });
 });
 return {proposals:props,unflaggable:unflaggable,notInPackage:notInPackage,badKind:badKind,inventory:inv};
}

/* ---- flag identity ----
   A flag is identified by raised_by + target_kind + target_id + flag, and by
   nothing else. `reason` is prose that is regenerated on every run (and in the
   language of the run); `raised_at` and `raised_against_revision` change by
   construction on every run. Including any of those in the identity would make a
   second run of the same analysis append a second copy of every flag, which is
   the accumulation §2.3 must not produce.
   On a re-raise the existing entry is replaced IN PLACE at its original array
   position, keeping the ORIGINAL raised_at (when this was first raised, which is
   what a reader wants) and refreshing `reason` and `raised_against_revision`
   (what the latest analysis says, and what it was run against).
   Flags are never removed here: one this run does not re-raise stays, and an
   orphan stays (§2.3, §7 case 7). Removal is a deliberate user action in the
   tool that owns the display, never a side effect of re-analysis. */
function ciFlagKey(f){ return [String(f&&f.raised_by||''),String(f&&f.target_kind||''),String(f&&f.target_id||''),String(f&&f.flag||'')].join(CI_SEP); }
function ciMergeFlags(existing,proposals){
 var out=(Array.isArray(existing)?existing:[]).slice(), idx={}, added=[], refreshed=[];
 out.forEach(function(f,i){ var k=ciFlagKey(f); if(idx[k]===undefined) idx[k]=i; });
 (proposals||[]).forEach(function(pr){
  var f={target_kind:pr.target_kind,target_id:pr.target_id,flag:pr.flag,reason:pr.reason,
         raised_by:pr.raised_by,raised_at:pr.raised_at,raised_against_revision:pr.raised_against_revision};
  var k=ciFlagKey(f), at=idx[k];
  if(at===undefined){ idx[k]=out.length; out.push(f); added.push(k); }
  else { var prev=out[at]||{}; f.raised_at=prev.raised_at||f.raised_at; out[at]=f; refreshed.push(k); }
 });
 return {flags:out,added:added,refreshed:refreshed};
}
/* §2.3 + §7 case 7. Three honest outcomes, not two: a target matching an id the
   package carries; a target matching nothing although the register that would
   hold it IS in the package (a true orphan); and a target whose register the
   package does not carry at all, which cannot be checked from here and is
   therefore not called an orphan. All three are kept, and all three are shown. */
function ciClassifyFlags(p,flags){
 var inv=ciInventory(p), ids={}, kinds={};
 Object.keys(inv).forEach(function(reg){
  var kind=CI_REGISTER_KIND[reg]; if(kind) kinds[kind]=true;
  inv[reg].forEach(function(it){ ids[it.id]=true; });
 });
 var matched=[],orphan=[],unverifiable=[],malformed=[];
 (Array.isArray(flags)?flags:[]).forEach(function(f){
  /* A non-object entry — a string, a number, null, an array — is reachable: save()
     validates, but importFile() does not and must not (§2.3 says keep and report,
     never reject a whole file over one bad entry). Dropping it here would be the
     silent loss §2.3 forbids, so it is kept and shown with its raw content. */
  if(!f||typeof f!=='object'||Array.isArray(f)){ malformed.push(f); return; }
  if(ids[String(f.target_id||'')]) matched.push(f);
  else if(kinds[String(f.target_kind||'')]) orphan.push(f);
  else unverifiable.push(f);
 });
 return {matched:matched,orphan:orphan,unverifiable:unverifiable,malformed:malformed};
}
function ciFlagText(f){
 if(!f||typeof f!=='object'||Array.isArray(f)) return ciRawText(f);
 var l=PLANG(), kk=CI_FLAG_DISPLAY['kind_'+f.target_kind], fk=CI_FLAG_DISPLAY[f.flag];
 var kind=(kk&&(kk[l]||kk.en))||String(f.target_kind||''), word=(fk&&(fk[l]||fk.en))||String(f.flag||'');
 return kind+' '+String(f.target_id||'')+' — '+word;
}

/* An entry that is not a flag object at all still has to be shown to somebody, so
   it is rendered as its raw content rather than as a kind and a word it does not
   have. JSON.stringify covers string, number, null and array; undefined and a
   cyclic value fall back to String(). */
function ciRawText(f){ try{ var t=JSON.stringify(f); return t===undefined?String(f):t; }catch(e){ return String(f); } }

/* ---- applying the package to this tool ----
   §3.1: nothing is applied until the user presses Load. §3.4: a canonical stage
   with no local spelling is shown, never rounded. This tool writes no `project`
   section, so the only value it takes from the package is the stage. */
var ciPkgLoaded=null;
function ciApply(p,target){
 var t=target||state, applied=[], unmapped=[], replaced=[], notes=[];
 if(!p) return {applied:applied,unmapped:unmapped,replaced:replaced,notes:notes};
 var pr=p.project;
 if(pr&&pr.lifecycle){
  var local=ciLifecycleFrom(String(pr.lifecycle));
  if(local){
   if(t.lifecycle&&t.lifecycle!==local) replaced.push(PKt('sec_project')+': '+String(t.lifecycle)+' -> '+local);
   t.lifecycle=local; applied.push(PKt('sec_project'));
  } else unmapped.push(String(pr.lifecycle));
 }
 if(t.lifecycle&&!ciLifecycleTo(t.lifecycle)) notes.push(Ct('localUnmapped',{stage:(LIFECYCLE[t.lifecycle]&&pick(LIFECYCLE[t.lifecycle]))||t.lifecycle}));
 var sn=ciSystemNameOnly(p); if(sn.length) notes.push(Ct('sysNameOnly',{list:sn.join('; ')}));
 var cls=ciClassifyFlags(p,p.flags||[]);
 var all=cls.matched.concat(cls.orphan,cls.unverifiable,cls.malformed);
 if(all.length) notes.push(Ct('existing',{list:all.map(ciFlagText).join('; ')}));
 if(cls.malformed.length) notes.push(Ct('malformed',{list:cls.malformed.map(ciRawText).join(', ')}));
 if(cls.orphan.length) notes.push(Ct('orphan',{list:cls.orphan.map(function(f){return String(f.target_id||'');}).join(', ')}));
 if(cls.unverifiable.length) notes.push(Ct('unverifiable',{list:cls.unverifiable.map(function(f){return String(f.target_id||'');}).join(', ')}));
 ciPkgLoaded=p;
 return {applied:applied,unmapped:unmapped,replaced:replaced,notes:notes};
}

function ciRefreshProps(){
 ciProps=[]; ciChosen={};
 if(PKG_OK()&&ciPkgLoaded&&last&&last.ready){
  var r=ciPropose(ciPkgLoaded,state,last);
  ciProps=r.proposals;
  var msgs=[];
  if(r.unflaggable.length) msgs.push(Ct('unflaggable',{list:r.unflaggable.map(function(a){return pick(DOMAINS[a]||{en:a});}).join(', ')}));
  if(r.notInPackage.length) msgs.push(Ct('notInPackage',{list:ciLabels(r.notInPackage)}));
  /* ANY area that reached both halves of a split register pair: say why there are
     two flags where a reader might expect one. Two pairs exist today (the evidence
     pair and the decision pair) and the rule is identical for both, so it is
     expressed once over the pairs rather than once per pair. */
  var pairsHit=[];
  CI_SPLIT_PAIRS.forEach(function(pair){
   var areas={};
   r.proposals.forEach(function(x){ if(pair.indexOf(x._register)>=0){ areas[x._area]=areas[x._area]||{}; areas[x._area][x._register]=1; } });
   var both=Object.keys(areas).filter(function(a){ return pair.every(function(reg){ return areas[a][reg]; }); });
   if(both.length) pairsHit.push(ciLabels(pair));
  });
  if(pairsHit.length) msgs.push(Ct('splitBoth',{list:pairsHit.join('; ')}));
  if(!r.proposals.length) msgs.push(Ct('noTargets'));
  if(msgs.length) ciSay(ciLines.concat(msgs));
 }
 ciPaintProps();
}
function ciReport(r,out){
 var msgs=[];
 if(out&&out.applied&&out.applied.length) msgs.push(PKt('applied',{list:out.applied.join(', ')}));
 if(out&&out.replaced&&out.replaced.length) msgs.push(PKt('replaced',{list:out.replaced.join('; ')}));
 if(out&&out.unmapped&&out.unmapped.length) msgs.push(PKt('unmapped',{list:out.unmapped.join('; ')}));
 if(out&&out.notes&&out.notes.length) msgs=msgs.concat(out.notes);
 msgs.push(r&&r.ignored&&r.ignored.length?PKt('ignored',{list:ciLabels(r.ignored)}):PKt('ignoredNone'));
 msgs.push(Ct('reasonLang'));
 return msgs;
}

function ciRaiseNow(){

/* ---- §7 benchmark cases ----
   Every case is guarded on its own: an unexpected exception must fail exactly
   the case it happened in and never hide the cases after it. Nothing here adds a
   key to `state` or to DEFAULTS — the recorded `inputs` of the forty-five
   pre-existing cases are `clone(DEFAULTS)`, so one extra default key would move
   every one of them. */
function ciBenchCases(){
 if(!PKG_OK()) return [];
 var KD='diagram_project_package', KM='diagram_project_package_meta', cases=[];
 function raw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
 function put(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
 var save0=raw(KD), save1=raw(KM), heldBefore=ciPkgLoaded;
 function safeClone(x){ try{ return x===undefined?'<undefined>':JSON.parse(JSON.stringify(x)); }catch(e){ return String(x); } }
 function cmp(got,ref,ok){ return {got:safeClone(got),ref:safeClone(ref),tol:'exact',ok:ok===undefined?JSON.stringify(got)===JSON.stringify(ref):!!ok}; }
 function guard(id,name,fn){
  try{ fn(); }
  catch(e){ cases.push({id:id,name:name,inputs:{},cmp:{harness:{got:String(e&&e.message||e),ref:'no exception',tol:'exact',ok:false}}}); }
 }
 function seed(doc){ put(KD,JSON.stringify(doc,null,1)); put(KM,null); }

 var upstream={ name:'North Quay chiller replacement', reference:'NQ-2026-114',
  acceptance_authority:'Owner technical authority', evidence_owner:'Project document controller',
  gate:'design_freeze', project_type:'brownfield', lifecycle:'construction' };
 var REGS={
  requirements:[{id:'REQ-001',label:'Chiller duty',text:'The chiller shall deliver 1200 kW at 6/12 C.'},
                {id:'REQ-002',label:'Noise limit',text:'Plantroom noise shall not exceed 75 dB(A).'}],
  deliverables:[{id:'DEL-001',label:'Chilled water P&ID'}],
  vendor_documents:[{id:'VD-001',label:'Chiller O&M manual'}],
  interfaces:[{id:'IF-001',label:'Chiller to CHW header'}],
  verification_evidence:[{id:'VER-001',label:'Factory capacity test report'}],
  commissioning_evidence:[{id:'CE-001',label:'CHW flushing certificate'}],
  definition_decisions:[{id:'DD-001',label:'Design basis: 6/12 C chilled water'}],
  review_decisions:[{id:'RD-001',label:'Review accepted two-stage centrifugal machine'}]
 };
 function fullDoc(extra){
  var d={ schema:'tools.petrov.re/project-package/v1', package_id:'11111111-2222-4333-8444-555555555555',
   package_revision:6, created_at:'2026-09-12T10:00:00Z', updated_at:'2026-09-12T12:00:00Z',
   provenance:[{path:'project',tool:'projectdefinition',tool_revision:'pd-2',written_at:'2026-09-12T10:00:00Z',package_revision:1},
               {path:'requirements',tool:'requirementsmatrix',tool_revision:'rm-2',written_at:'2026-09-12T11:00:00Z',package_revision:4}],
   project:clone(upstream),
   structure:{ systems:[{id:'SYS-01',name:'Chilled water',type:'utility',discipline:'mechanical'}],
               packages:[{id:'PKG-01',name:'Chiller package',system_id:'',system_name:'Chilled water',organisation:'Acme',discipline:'mechanical',lead:'A. Ing'}] } };
  Object.keys(REGS).forEach(function(k){ d[k]=clone(REGS[k]); });
  Object.keys(extra||{}).forEach(function(k){ d[k]=extra[k]; });
  return d;
 }
 /* A real, late, permanent change: installed asset, construction stage. It
    reaches equipment, interfaces, drawings, construction and the evidence
    registers, which is what makes every register in the package reachable. */
 function changeState(over){
  var s=clone(DEFAULTS);
  s.object='Chiller CH-01 capacity uprate'; s.system='Chilled water'; s.reason='Load growth in area 2';
  s.family='capacity'; s.processType='permanent'; s.currentValue='1000 kW'; s.proposedValue='1200 kW';
  s.effectivity='CH-01'; s.effectiveDate='Before continuation of installation';
  s.lifecycle='construction'; s.assetState='installed'; s.baseline='approved';
  s.safety='no'; s.interfaces='yes';
  Object.keys(over||{}).forEach(function(k){ s[k]=over[k]; });
  return s;
 }

 try{
  /* 1. Round trip. Everything this tool declares it reads arrives byte-identical,
     the canonical stage maps into this tool's vocabulary without rounding, and
     the one section this tool owns comes back out again. */
  guard('package-round-trip','Project package round trip: all ten sections in, flags out',function(){
   put(KD,null); put(KM,null);
   var doc=fullDoc(); seed(doc);
   var r=DiagramProject.load();
   var t=clone(DEFAULTS);
   var out=ciApply(r.package,t);
   var c={};
   /* the eleven sections of TZ-project-package §2; the TZ-engineering-workflow §2 registers are outside this tool's reads */
   c.reads_the_eleven_v1_sections=cmp(r.reads.slice().sort(),['commissioning_evidence','definition_decisions','deliverables','flags','interfaces','project','requirements','review_decisions','structure','vendor_documents','verification_evidence']);
   c.nothing_ignored=cmp(r.ignored,[]);
   c.project_identical=cmp(r.package.project,upstream);
   c.structure_identical=cmp(r.package.structure,doc.structure);
   Object.keys(REGS).forEach(function(k){ c['register_identical_'+k]=cmp(r.package[k],REGS[k]); });
   /* §2.1 — canonical construction is this tool's construction; `factory` must
      reach `manufacturing` and must not be swallowed by procurement. */
   c.stage_mapped=cmp(t.lifecycle,'construction');
   var tf=clone(DEFAULTS); var of_=ciApply({project:{name:'x',lifecycle:'factory'}},tf);
   c.factory_maps_to_manufacturing=cmp(tf.lifecycle,'manufacturing');
   c.factory_not_unmapped=cmp(of_.unmapped,[]);
   /* a canonical stage with no local spelling is REPORTED, never rounded */
   var th=clone(DEFAULTS); th.lifecycle='detailed_design';
   var oh=ciApply({project:{name:'x',lifecycle:'handover'}},th);
   c.handover_left_alone=cmp([th.lifecycle,oh.unmapped],['detailed_design',['handover']]);
   var tc=clone(DEFAULTS); tc.lifecycle='detailed_design';
   var oc=ciApply({project:{name:'x',lifecycle:'close-out'}},tc);
   c.closeout_left_alone=cmp([tc.lifecycle,oc.unmapped],['detailed_design',['close-out']]);
   /* and a LOCAL stage with no canonical spelling is reported too (fat_done) */
   c.fat_done_has_no_canonical=cmp(ciLifecycleTo('fat_done'),null);
   var tq=clone(DEFAULTS); tq.lifecycle='fat_done';
   var oq=ciApply({project:{name:'x'}},tq);
   c.fat_done_reported=cmp(oq.notes.length>0&&oq.notes.join(' ').indexOf(pick(LIFECYCLE.fat_done))>=0,true);
   c.upstream_provenance_visible=cmp((r.package.provenance||[]).map(function(p){return p.path+'|'+p.tool;}),
                                     ['project|projectdefinition','requirements|requirementsmatrix']);
   /* the write half: flags, and only flags */
   var s=changeState(), res=solve(s);
   var pr=ciPropose(r.package,s,res);
   var merged=ciMergeFlags(r.package.flags||[],pr.proposals);
   var w=DiagramProject.save({flags:merged.flags});
   var stored=JSON.parse(raw(KD));
   c.written_is_flags_only=cmp(w.written,['flags']);
   c.revision_bumped=cmp(stored.package_revision,7);
   c.provenance_for_flags=cmp((stored.provenance||[]).filter(function(p){return p.path==='flags';})
                              .map(function(p){return p.tool;}),['changeimpact']);
   c.upstream_provenance_kept=cmp((stored.provenance||[]).filter(function(p){return p.path!=='flags';}),doc.provenance);
   Object.keys(REGS).forEach(function(k){ c['register_untouched_'+k]=cmp(stored[k],REGS[k]); });
   c.project_untouched=cmp(stored.project,doc.project);
   c.structure_untouched=cmp(stored.structure,doc.structure);
   cases.push({id:'package-round-trip',name:'Project package round trip: all ten sections in, flags out',
               inputs:{reads:DiagramProject.declaration().reads,writes:DiagramProject.declaration().writes,stage:upstream.lifecycle},cmp:c});
  });

  /* 2. Unknown fields survive (§2.5). */
  guard('package-unknown-fields-survive','Unrecognised top-level keys survive a flags write verbatim',function(){
   var doc=fullDoc({ future_register:[{id:'FR-1',note:'written by a newer tool',depth:{a:[1,2,3]}}],
                     vendor_matrix:{rows:2,tag:'keep me verbatim'} });
   seed(doc);

   var r=DiagramProject.load();
   DiagramProject.save({flags:[{target_kind:'requirement',target_id:'REQ-001',flag:'affected',reason:'x',raised_by:'changeimpact',raised_at:'2026-09-12T12:00:00Z',raised_against_revision:6}]});
   var after=JSON.parse(raw(KD));
   var c={};
   c.future_register=cmp(after.future_register,before);
   c.vendor_matrix=cmp(after.vendor_matrix,before2);
   c.not_buried_under_unknown=cmp(after.unknown===undefined,true);
   c.reported_as_ignored=cmp(r.ignored.slice().sort(),['future_register','vendor_matrix']);

   c.impact_domains_unchanged=cmp(after.impacts.map(function(x){return x.domain+':'+x.classification;}),

   cases.push({id:'package-no-implicit-apply',name:'A package in storage changes nothing until the user applies it',
               inputs:{stored_project:'Should not appear'},cmp:c});
  });

  /* 5. Storage unavailable (§3.5). The impact model may not depend on the package
     in any way: the ordered impact list and the closure result must be identical. */
  guard('package-storage-unavailable','A throwing localStorage degrades to no package, with the impact model unchanged',function(){
