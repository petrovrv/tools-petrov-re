function trModel(m) { return MODEL_T[m] || same7(String(m)); }

  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null;

  /* ======================================================== 2. the interface */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }

  var stage = null;
  function LEGEND_ITEMS() {
    return [
      { label: T('Centreline concentration', 'Концентрація на осі', 'Konzentration auf der Achse', 'Concentratie op de as', 'Concentration dans l’axe', 'Concentración en el eje', 'Stężenie w osi'), series: 0 },
      { label: T('Target', 'Ціль', 'Zielwert', 'Doel', 'Cible', 'Objetivo', 'Cel'), series: 1 }
    ];
  }
  function adoptStage(app) {
    stage = app.stages[0] || null;
    if (stage) stage.legend({ items: LEGEND_ITEMS() });
  }

  var ui = null;

  function computeView(s) {
    last = solve(s);
    if (stage) stage.schedule();
    if (!last || !last.ok) { var e = String((last && last.err) || 'Error'); var ew = trW(e); return { verdict: { tone: 'bad', text: ew.en === e ? trErr(e) : ew }, tiles: [], notes: [] }; }
    var r = last.r, tiles = [], notes = [], verdict, i, w, n;
    var full = !!(s && s.level === 'full');
    function fin(v) { return typeof v === 'number' && isFinite(v); }
    function cell(v) { return fin(v) ? { value: sigv(v, 4), precision: sig(v, 4) } : { value: null, precision: 0 }; }
    function tile(label, v, hint, learn, tone, headline) {
      var c = cell(v);
      return { label: label, value: c.value, hint: hint, precision: c.precision, tone: tone, learn: learn, headline: !!headline };
    }
    if (!fin(r.xTarget)) {
      verdict = { tone: 'ok', text: T('Target concentration not reached at ground level',
        'Цільова концентрація не досягається на рівні землі',
        'Zielkonzentration in Bodenhöhe nicht erreicht',
        'Doelconcentratie niet bereikt op grondniveau',
        'Concentration cible non atteinte au niveau du sol',
        'Concentración objetivo no alcanzada a nivel del suelo',
        'Stężenie docelowe nieosiągnięte na poziomie gruntu') };
    } else {
      n = DiagramUI.fmt(r.xTarget, { precision: sig(r.xTarget, 3) });
      verdict = { tone: 'warn', text: TF(T('Target reached up to $1 m downwind',
        'Цільову концентрацію досягнуто до $1 м за вітром',
        'Zielwert bis $1 m in Windrichtung erreicht',
        'Doelwaarde bereikt tot $1 m benedenwinds',
        'Cible atteinte jusqu\'à $1 m sous le vent',
        'Objetivo alcanzado hasta $1 m a sotavento',
        'Cel osiągnięty do $1 m z wiatrem'), [n]) };
    }
    tiles.push(tile(T('Distance to target', 'Відстань до цілі', 'Abstand bis Zielwert', 'Afstand tot doelwaarde',
      'Distance à la cible', 'Distancia al objetivo', 'Odległość do celu'), r.xTarget, 'm', 'target', verdict.tone, true));
    tiles.push(tile(T('Max. half-width (Gaussian)', 'Макс. напівширина (Гаус)', 'Max. Halbbreite (Gauß)', 'Max. halve breedte (Gauss)',
      'Demi-largeur max. (gaussien)', 'Semiancho máx. (gaussiano)', 'Maks. półszerokość (Gauss)'), r.yMax, 'm', 'plume', null, true));
    tiles.push(tile(T('Target concentration', 'Цільова концентрація', 'Zielkonzentration', 'Doelconcentratie',
      'Concentration cible', 'Concentración objetivo', 'Stężenie docelowe'), fin(r.ct) ? r.ct * 1e6 : null, 'ppm', 'target'));
    var mLbl = T('Model', 'Модель', 'Modell', 'Model', 'Modèle', 'Modelo', 'Model');
    tiles.push(tile(mLbl, null, LP(trModel(r.model)), 'densegas'));
    if (full) {
      if (fin(r.xHalf)) tiles.push(tile(T('Distance to ½ LFL', 'Відстань до ½ НКМП', 'Abstand bis ½ UEG', 'Afstand tot ½ LEL',
        'Distance à ½ LIE', 'Distancia a ½ LII', 'Odległość do ½ DGW'), r.xHalf, 'm', 'averaging'));
      tiles.push(tile(T('Gaussian distance', 'Гаусова відстань', 'Gauß-Abstand', 'Gaussiaanse afstand',
        'Distance gaussienne', 'Distancia gaussiana', 'Odległość Gaussa'), r.xGauss, 'm', 'plume'));
      tiles.push(tile(T('Density criterion', 'Критерій густини', 'Dichtekriterium', 'Dichtheidscriterium',
        'Critère de densité', 'Criterio de densidad', 'Kryterium gęstości'), r.densityCriterion, '-', 'densegas'));
      tiles.push(tile(T('Gas density', 'Густина газу', 'Gasdichte', 'Gasdichtheid',
        'Masse volumique du gaz', 'Densidad del gas', 'Gęstość gazu'), r.rho0, 'kg/m3', 'densegas'));
    }
    for (i = 0; r.warnings && i < r.warnings.length; i++) { w = String(r.warnings[i]); notes.push(trW(w)); }
    notes.push(TF(T('Model: $1', 'Модель: $1', 'Modell: $1', 'Model: $1', 'Modèle : $1', 'Modelo: $1', 'Model: $1'), [LP(trModel(r.model))]));
    notes.push(T('Concentrations are mean values; no averaging-time correction',
      'Концентрації є середніми значеннями; без поправки на час усереднення',
      'Konzentrationen sind Mittelwerte; keine Mittelungszeitkorrektur',
      'Concentraties zijn gemiddelde waarden; geen middelingstijdcorrectie',
      'Les concentrations sont des valeurs moyennes ; sans correction du temps d\'intégration',
      'Las concentraciones son valores medios; sin corrección por tiempo de promediado',
      'Stężenia są wartościami średnimi; bez korekty czasu uśredniania'));
    if (r.norm) notes.push(trSrc(r.norm));
    return { verdict: verdict, tiles: tiles, meters: [], tables: [], notes: notes };
  }

  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1');
    h.textContent = 'Gas dispersion';
    var p = document.createElement('p');
    p.textContent = 'The interactive interface could not load. The export, the calculation record '
                  + 'and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h);
    host.appendChild(p);
    last = solve(state);
  }

    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }

            body: T(

              'Gassen die zwaarder zijn dan lucht (propaan, CO2, H2S) zakken uit en verspreiden zich zijwaarts. Als het criterium (g0\' q0/(u^3 Dc))^(1/3) minstens 0,15 is, geeft de Britter-McQuaid-correlatie voor continue lozing de afstand x = Dc 10^beta(alpha, C/C0); anders wordt de lozing als passief behandeld en wordt het Gaussische resultaat gebruikt.',

          wind: {
            title: T('Wind speed', 'Швидкість вітру', 'Windgeschwindigkeit', 'Windsnelheid', 'Vitesse du vent', 'Velocidad del viento', 'Prędkość wiatru'),
            body: T('The wind speed at 10 m dilutes a passive plume directly: C is proportional to Q/u, so halving the wind doubles the centreline concentration. Low wind usually comes with stable classes E-F at night, which is why the worst case for passive gases is a calm night (1.5 m/s F), not a storm. For dense gases the wind also sets the density criterion (g0 q0/(u³ Dc))^(1/3): weaker wind makes a cloud more strongly dense-gas dominated. Below about 1 m/s the plume model loses meaning (meandering, pooling).', 'Швидкість вітру на висоті 10 м прямо розбавляє пасивний шлейф: C пропорційна Q/u, тож удвічі слабший вітер подвоює концентрацію на осі. Слабкий вітер зазвичай супроводжується стійкими класами E-F уночі, тому найгірший випадок для пасивних газів — тиха ніч (1,5 м/с, F), а не буря. Для важких газів вітер також задає критерій густини (g0 q0/(u³ Dc))^(1/3): слабший вітер робить хмару ще «важчою». Нижче приблизно 1 м/с модель шлейфу втрачає зміст (меандрування, застій).', 'Die Windgeschwindigkeit in 10 m verdünnt eine passive Fahne direkt: C ist proportional zu Q/u, halber Wind bedeutet doppelte Achsenkonzentration. Schwacher Wind tritt meist nachts mit stabilen Klassen E-F auf; deshalb ist der ungünstigste Fall für passive Gase eine ruhige Nacht (1,5 m/s, F), nicht Sturm. Bei Schwergasen bestimmt der Wind auch das Dichtekriterium (g0 q0/(u³ Dc))^(1/3): schwächerer Wind macht die Wolke stärker schwergasdominiert. Unter etwa 1 m/s verliert das Fahnenmodell seinen Sinn (Mäandrieren, Ansammlung).', 'De windsnelheid op 10 m verdunt een passieve pluim direct: C is evenredig met Q/u, dus halve wind verdubbelt de concentratie op de as. Weinig wind gaat ’s nachts meestal samen met stabiele klassen E-F; daarom is het slechtste geval voor passieve gassen een windstille nacht (1,5 m/s, F), geen storm. Bij zware gassen bepaalt de wind ook het dichtheidscriterium (g0 q0/(u³ Dc))^(1/3): zwakkere wind maakt de wolk sterker zwaargasgedomineerd. Onder ongeveer 1 m/s verliest het pluimmodel zijn betekenis (meanderen, ophoping).', 'La vitesse du vent à 10 m dilue directement un panache passif : C est proportionnelle à Q/u, un vent deux fois plus faible double la concentration dans l’axe. Le vent faible va souvent de pair avec les classes stables E-F la nuit ; le pire cas pour les gaz passifs est donc une nuit calme (1,5 m/s, F), pas une tempête. Pour les gaz lourds, le vent fixe aussi le critère de densité (g0 q0/(u³ Dc))^(1/3) : un vent plus faible rend le nuage plus dominé par la gravité. Sous environ 1 m/s, le modèle de panache perd son sens (méandres, accumulation).', 'La velocidad del viento a 10 m diluye directamente una pluma pasiva: C es proporcional a Q/u, así que la mitad de viento duplica la concentración en el eje. El viento flojo suele ir con clases estables E-F de noche; por eso el peor caso para gases pasivos es una noche en calma (1,5 m/s, F), no una tormenta. En gases densos el viento fija también el criterio de densidad (g0 q0/(u³ Dc))^(1/3): menos viento hace la nube más dominada por la gravedad. Por debajo de 1 m/s aprox. el modelo de pluma pierde sentido (serpenteo, acumulación).', 'Prędkość wiatru na 10 m bezpośrednio rozcieńcza smugę pasywną: C jest proporcjonalne do Q/u, więc wiatr o połowę słabszy podwaja stężenie w osi. Słaby wiatr zwykle idzie w parze z nocnymi klasami stabilnymi E-F, dlatego najgorszy przypadek dla gazów pasywnych to spokojna noc (1,5 m/s, F), a nie burza. Dla gazów ciężkich wiatr wyznacza też kryterium gęstości (g0 q0/(u³ Dc))^(1/3): słabszy wiatr czyni chmurę bardziej „ciężką”. Poniżej ok. 1 m/s model smugi traci sens (meandrowanie, gromadzenie się gazu).')
          },
          averaging: {
            title: T('Averaging time and ½ LFL', 'Час усереднення та ½ НКМП', 'Mittelungszeit und ½ UEG', 'Middelingstijd en ½ OEG', 'Durée d’intégration et ½ LIE', 'Tiempo de promediado y ½ LII', 'Czas uśredniania i ½ DGW'),
            body: T('Briggs sigmas describe concentrations averaged over about 10 minutes. A flammable cloud ignites on instantaneous peaks, which can be about twice the mean, so practice (API RP 752, many company standards) maps flammable zones to ½ LFL; the Full mode shows that distance. Toxic criteria are tied to an exposure time (e.g. 30-60 min for AEGL/ERPG), so a 10-minute mean is roughly consistent for them. No peak-to-mean factor is applied here - choose the endpoint knowingly.', 'Сигми Бріггса описують концентрації, усереднені приблизно за 10 хвилин. Горюча хмара займається від миттєвих піків, що можуть удвічі перевищувати середнє, тому на практиці (API RP 752, багато корпоративних стандартів) горючу зону будують до ½ НКМП; повний режим показує цю відстань. Токсичні критерії прив’язані до часу дії (наприклад, 30-60 хв для AEGL/ERPG), тож для них 10-хвилинне середнє приблизно узгоджене. Коефіцієнт пік/середнє тут не застосовано — обирайте поріг свідомо.', 'Briggs-Sigmas beschreiben Konzentrationen, die über etwa 10 Minuten gemittelt sind. Eine brennbare Wolke zündet an momentanen Spitzen, die etwa doppelt so hoch wie der Mittelwert sein können; daher werden Ex-Zonen in der Praxis (API RP 752, viele Werksnormen) bis ½ UEG gezogen - der Modus „Vollständig“ zeigt diesen Abstand. Toxische Kriterien hängen an einer Expositionszeit (z. B. 30-60 min für AEGL/ERPG), dafür passt ein 10-Minuten-Mittel ungefähr. Ein Spitzen-Mittel-Faktor wird hier nicht angewendet - wählen Sie den Endpunkt bewusst.', 'Briggs-sigma’s beschrijven concentraties gemiddeld over ongeveer 10 minuten. Een brandbare wolk ontsteekt op momentane pieken die ongeveer het dubbele van het gemiddelde kunnen zijn; daarom wordt in de praktijk (API RP 752, veel bedrijfsnormen) tot ½ OEG gerekend - de modus Volledig toont die afstand. Toxische criteria horen bij een blootstellingsduur (bijv. 30-60 min voor AEGL/ERPG), daarvoor past een 10-minutengemiddelde ongeveer. Er wordt hier geen piek-gemiddeldefactor toegepast - kies het eindpunt bewust.', 'Les sigmas de Briggs décrivent des concentrations moyennées sur environ 10 minutes. Un nuage inflammable s’enflamme sur des pics instantanés pouvant valoir environ deux fois la moyenne ; la pratique (API RP 752, nombreux standards d’entreprise) trace donc les zones inflammables à ½ LIE - le mode Complet affiche cette distance. Les critères toxiques sont liés à une durée d’exposition (p. ex. 30-60 min pour AEGL/ERPG), pour lesquels une moyenne de 10 minutes est à peu près cohérente. Aucun facteur pic/moyenne n’est appliqué ici - choisissez le seuil en connaissance de cause.', 'Las sigmas de Briggs describen concentraciones promediadas en unos 10 minutos. Una nube inflamable se enciende con picos instantáneos que pueden ser el doble de la media; por eso en la práctica (API RP 752, muchas normas de empresa) las zonas inflamables se trazan a ½ LII; el modo Completo muestra esa distancia. Los criterios tóxicos van ligados a un tiempo de exposición (p. ej. 30-60 min para AEGL/ERPG), para los que una media de 10 minutos es más o menos coherente. Aquí no se aplica factor pico/media: elija el umbral a sabiendas.', 'Sigmy Briggsa opisują stężenia uśrednione w ok. 10 minutach. Chmura palna zapala się od chwilowych pików, które mogą być ok. dwa razy wyższe od średniej, dlatego w praktyce (API RP 752, wiele norm firmowych) strefy palne wyznacza się do ½ DGW - tryb Pełny pokazuje tę odległość. Kryteria toksyczne są powiązane z czasem narażenia (np. 30-60 min dla AEGL/ERPG), dla nich średnia 10-minutowa jest mniej więcej spójna. Nie stosuje się tu współczynnika pik/średnia - wybierz próg świadomie.')
          },
          limits: {

              'Emisión continua estacionaria sobre terreno llano y abierto, sin cantidad de movimiento del chorro, elevación de la pluma, edificios, relieve ni corrección por tiempo de promediado; el gas denso es isotermo y las sigmas de Briggs fuera de 100 m-10 km se extrapolan. Use el resultado para un cribado y verifique los diseños con SLAB, DEGADIS, PHAST o CFD.',

            )

      render: function (size, st) {

  function buildRecord() {
    if (!last) return null;
    var keys = ['gas', 'Q_kg_s', 'u10_m_s', 'stab', 'H_m', 'z_m', 'T_C', 'p_Pa', 'Ctarget_ppm'];
    var units = { gas: '-', Q_kg_s: 'kg/s', u10_m_s: 'm/s', stab: '-', H_m: 'm', z_m: 'm', T_C: 'degC', p_Pa: 'Pa', Ctarget_ppm: 'ppm' };
    var outKeys = ['model', 'ct', 'ckg', 'rho0', 'rhoa', 'xTarget', 'xGauss', 'xHalf', 'yMax', 'xAtYmax', 'densityCriterion'];
    var inputs = {}, outputs = {}, notes = [], warnings = [], r = last.ok ? last.r : null, i;
    for (i = 0; i < keys.length; i++) inputs[keys[i]] = state[keys[i]];
    if (r) {
      for (i = 0; i < outKeys.length; i++) outputs[outKeys[i]] = r[outKeys[i]];
      if (r.norm !== undefined && r.norm !== null && r.norm !== '') notes.push(r.norm);
      var w = r.warnings || [];
      for (i = 0; i < w.length; i++) warnings.push(w[i]);
    } else {
      warnings.push(String(last.err));
    }
    return {
      inputs: inputs,
      units: units,
      outputs: outputs,
      model: {
        equations: [
          'C = Q/(2 pi u sy sz) exp(-y2/2sy2)[exp(-(z-H)2/2sz2)+exp(-(z+H)2/2sz2)] (Gaussian plume, ground reflection)',
          'Briggs (1973) open-country sigma_y, sigma_z for Pasquill classes A-F',
          'Britter-McQuaid (1988) continuous dense-gas workbook: alpha = 0.2 log10(g0^2 q0/u^5), x = Dc 10^beta(alpha, Cm/C0)',
          'dense-gas criterion (g0 q0/(u^3 Dc))^(1/3) >= 0.15'
        ],
        ranges: ['Q > 0 kg/s', 'u10 0.5..20 m/s', 'Briggs sigmas 100 m..10 km', 'BM alpha -1..1, Cm/C0 0.002..0.1'],
        notes: notes
      },
      warnings: warnings
    };
  }

  var HANDOFF = {
    provides: ['mdot', 'T', 'p'],
    accepts: ['mdot'],
    build: function () {
      if (!last || !last.ok) return null;
      var r = last.r, row = {};
      if (typeof r.xTarget === 'number' && isFinite(r.xTarget)) row.xTarget = { value: r.xTarget, unit: 'm' };
      if (typeof r.yMax === 'number' && isFinite(r.yMax)) row.yMax = { value: r.yMax, unit: 'm' };
      if (typeof r.ct === 'number' && isFinite(r.ct)) row.c_target = { value: r.ct, unit: '-' };
      return {
        quantities: { mdot: { value: state.Q_kg_s, unit: 'kg/s' }, T: { value: state.T_C + 273.15, unit: 'K' }, p: { value: state.p_Pa, unit: 'Pa' } },
        sets: { dispersion: [row] }
      };
    },
    apply: function (payload) {
      var q = payload && payload.quantities ? (payload.quantities.mdot || payload.quantities.Q) : undefined;
      var v = (q !== null && typeof q === 'object') ? q.value : q;
      if (typeof v === 'number' && isFinite(v) && v > 0) { state.Q_kg_s = v; return true; }
      return false;
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'gas_dispersion',
        file: 'gas_dispersion.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
