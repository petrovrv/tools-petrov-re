function icon(kind, x, y, w, h) {
  const cx = x + w / 2, cy = y + h / 2, r = Math.min(w, h) / 2 - 3;
  const s = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  switch (kind) {
    case 'hp': return `<rect ${s} x="${x + 3}" y="${y + 3}" width="${w - 6}" height="${h - 6}" rx="3"/><path ${s} d="M${x + 7} ${cy}h${w - 14}M${cx - 4} ${cy - 4}l4 4-4 4"/>`;
    case 'fan': return `<circle ${s} cx="${cx}" cy="${cy}" r="${r}"/><path ${s} d="M${cx} ${cy}V${cy - r + 2}M${cx} ${cy}l${(r - 2) * .87} ${(r - 2) * .5}M${cx} ${cy}l${-(r - 2) * .87} ${(r - 2) * .5}"/>`;
    case 'drill': return `<path ${s} d="M${cx} ${y + 3}v${h - 8}M${cx - 5} ${y + 8}l5-4 5 4M${cx - 4} ${y + h - 5}l4 4 4-4"/>`;
    case 'drop': return `<path ${s} d="M${cx} ${y + 4}q6 7 6 12a6 6 0 0 1-12 0q0-5 6-12Z"/>`;
    case 'recover': return `<path ${s} d="M${x + 5} ${cy - 4}h${w - 10}l-4-3M${x + w - 5} ${cy + 4}h${-(w - 10)}l4 3"/>`;
    case 'flame': return `<path ${s} d="M${cx} ${y + h - 5}q-6-3-6-8 0-6 6-10 0 5 4 7 2-2 2-4 4 4 4 9 0 4-4 6"/>`;
    case 'bolt': return `<path ${s} d="M${cx + 3} ${y + 4}l-7 9h6l-3 9 8-11h-6z"/>`;
    case 'pipe': return `<path ${s} d="M${x + 4} ${cy - 4}h${w - 8}M${x + 4} ${cy + 4}h${w - 8}"/>`;
    case 'snow': return `<path ${s} d="M${cx} ${cy - r}v${2 * r}M${cx - r * .87} ${cy - r * .5}l${r * 1.73} ${r}M${cx + r * .87} ${cy - r * .5}l${-r * 1.73} ${r}"/>`;
    case 'tank': return `<rect ${s} x="${cx - 8}" y="${y + 3}" width="16" height="${h - 6}" rx="6"/><path ${s} d="M${cx - 8} ${cy}h16"/>`;
    case 'split': return `<path ${s} d="M${x + 4} ${cy}h${w - 8}M${cx} ${y + 4}v${h - 8}"/>`;
    case 'manifold': return `<path ${s} d="M${x + 4} ${cy - 5}h${w - 8}M${x + 4} ${cy + 5}h${w - 8}M${x + 9} ${cy - 5}v10M${cx} ${cy - 5}v10M${x + w - 9} ${cy - 5}v10"/>`;
    case 'valve': return `<path ${s} d="M${x + 4} ${cy}h${w - 8}M${cx - 6} ${cy - 5}l12 10v-10l-12 10z"/>`;
    case 'pump': return `<circle ${s} cx="${cx}" cy="${cy}" r="${r}"/><path ${s} d="M${cx} ${cy}h${r}"/>`;
    case 'floor': { let d = ''; for (let i = 0; i < 3; i++) { const yy = y + 6 + i * ((h - 12) / 2); d += `M${x + 5} ${yy}q5 -4 10 0t10 0`; } return `<path ${s} d="${d}"/>`; }
    case 'slab': return `<rect ${s} x="${x + 4}" y="${cy - 6}" width="${w - 8}" height="12" rx="2"/><path ${s} d="M${x + 8} ${cy}h${w - 16}"/>`;
    case 'rad': { let d = ''; for (let i = 0; i < 4; i++) { const xx = x + 6 + i * ((w - 12) / 3); d += `M${xx} ${y + 5}v${h - 10}`; } return `<rect ${s} x="${x + 4}" y="${y + 5}" width="${w - 8}" height="${h - 10}" rx="2"/><path ${s} d="${d}"/>`; }
    case 'tap': return `<path ${s} d="M${x + 5} ${y + 6}h8v6h-8zM${x + 13} ${y + 9}h6v6M${x + 19} ${cy + 4}v3"/>`;
    case 'loop': return `<path ${s} d="M${cx} ${cy}m-${r} 0a${r} ${r} 0 1 1 ${r} ${r}"/><path ${s} d="M${cx - 3} ${cy + r - 3}l3 3 3-3"/>`;
    default: return `<rect x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${h - 8}" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="3 3"/>`;
  }
}

function chunk(a, n) { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o.length ? o : [[]]; }

function diagramSVG(R, opts) {
  opts = opts || {};
  const compact = !!opts.compact;
  const BW = 96, BH = 66, GAP = 9, PADX = 12, HEADH = 20, SPECH = 15;
  const perRow = compact ? 999 : (opts.perRow || 6);
  const sides = [
    { label: tt('ui.rowWarm'), items: R.chainInfo.heat },
    { label: tt('ui.rowKoud'), items: R.chainInfo.cool },
    { label: tt('ui.rowSww'), items: R.chainInfo.dhw }
  ].filter(s => s.items.length);
  const lines = [];
  sides.forEach(s => chunk(s.items, perRow).forEach((items, i) =>
    lines.push({ label: i === 0 ? s.label : '', items })));
  const maxN = Math.max(1, ...lines.map(l => l.items.length));
  const W = PADX * 2 + maxN * BW + (maxN - 1) * GAP + 26;
  const lineH = HEADH + BH + SPECH + 12;
  /* On paper the family colours carry the reading of the drawing, so the key
     travels inside the <svg> with them. Printed as a separate line of words it
     named colours the reader could no longer see. */
  const LEGH = opts.legend ? 22 : 0;
  const H = Math.max(lineH, lines.length * lineH) + 8 + LEGH;
  const wAttr = compact ? `width="${W}" height="${H}"` : `width="100%"`;
  let svg = `<svg class="diagram" viewBox="0 0 ${W} ${H}" ${wAttr} role="img" aria-label="${esc(tt('ui.diagramTitle'))}">`;
  svg += `<defs><marker id="dgar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--dg-arrow)"/></marker></defs>`;
  lines.forEach((line, li) => {
    const yTop = li * lineH + 6, yBox = yTop + HEADH;
    if (line.label) svg += `<text x="${PADX}" y="${yTop + 11}" class="dg-rowlabel">${esc(line.label)}</text>`;
    const startX = PADX + 14, n = line.items.length;
    if (n) {
      svg += `<line x1="${PADX}" y1="${yBox + BH / 2}" x2="${startX - 5}" y2="${yBox + BH / 2}" class="dg-flow" marker-end="url(#dgar)"/>`;
      svg += `<line x1="${startX + n * (BW + GAP) - GAP}" y1="${yBox + BH / 2}" x2="${startX + n * (BW + GAP) - GAP + 9}" y2="${yBox + BH / 2}" class="dg-flow" marker-end="url(#dgar)"/>`;
    }
    line.items.forEach((m, i) => {
      const x = startX + i * (BW + GAP);
      svg += `<g class="dg-mod dg-${m.family}">`;
      svg += `<rect x="${x}" y="${yBox}" width="${BW}" height="${BH}" rx="6" class="dg-box"/>`;
      svg += `<rect x="${x}" y="${yBox}" width="${BW}" height="3.5" rx="1.75" class="dg-accent"/>`;
      svg += `<g class="dg-icon">${icon(MOD_ICON[m.key] || 'empty', x + BW / 2 - 16, yBox + 12, 32, 26)}</g>`;
      const lbl = modLabel(m.key);
      const cls = lbl.length > 13 ? 'dg-lab dg-lab-s' : 'dg-lab';
      svg += `<text x="${x + BW / 2}" y="${yBox + BH - 8}" class="${cls}">${esc(lbl.length > 20 ? lbl.slice(0, 19) + '…' : lbl)}</text>`;
      svg += `</g>`;
      const sp = m.spec === m.key ? '' : specLabel(m.spec);
      if (sp) svg += `<text x="${x + BW / 2}" y="${yBox + BH + 11}" class="dg-spec">${esc(sp)}</text>`;
    });
  });
  if (opts.legend) {
    const dict = (L().fam || base().fam || {});
    const yy = H - 8;
    let lx = PADX;
    ['bron', 'opwekking', 'opslag', 'distributie', 'afgifte', 'sanitair'].forEach(f => {
      const lab = String(dict[f] || f);
      svg += `<rect x="${lx}" y="${yy - 5.5}" width="14" height="4" rx="2" fill="var(--dg-${f})"/>`;
      svg += `<text x="${lx + 18}" y="${yy}" class="dg-spec" style="text-anchor:start">${esc(lab)}</text>`;
      lx += 18 + lab.length * 4.9 + 14;
    });
  }
  svg += `</svg>`;
  return svg;
}

function diagramLegend() {
  const fams = ['bron', 'opwekking', 'opslag', 'distributie', 'afgifte', 'sanitair'];
  return `<ul class="dglegend">` + fams.map(f =>
    `<li><span class="sw" style="background:var(--dg-${f})"></span>${esc((L().fam || base().fam || {})[f] || f)}</li>`).join('') + `</ul>`;
}

function ruleText(r) {
  const pack = (L().rules || {})[r.id] || (base().rules || {})[r.id] || { t: r.id, d: '', r: '' };
  let vars = Object.assign({}, r.vars);
  if (r.id === 'profiel_note') {
    const p = PROFILES.find(x => x.id === r.vars.profiel);
    vars.note = p ? profText(p, 'note') : '';
    vars.basis = p ? profText(p, 'basis') : '—';
    return { title: `${pack.t}${p ? ` — ${profText(p, 'label')}` : ''}`, body: vars.note, ref: vars.basis };
  }
  return { title: fill(pack.t, vars), body: fill(pack.d, vars), ref: fill(pack.r, vars) };
}

function ruleHTML(r) {
  const x = ruleText(r);
  const lvl = { blok: tt('ui.levelBlok'), waarschuwing: tt('ui.levelWaarschuwing'), advies: tt('ui.levelAdvies') }[r.level];
  const sym = { blok: '■', waarschuwing: '▲', advies: '●' }[r.level];
  return `<div class="rule lv-${r.level}">
    <div class="rhead"><span class="badge" aria-hidden="true">${sym}</span><span class="lvl">${esc(lvl)}</span><h4>${esc(x.title)}</h4></div>
    <p>${esc(x.body)}</p>
    ${x.ref && x.ref !== '—' ? `<p class="ref">${esc(tt('ui.basis'))}: ${esc(x.ref)}</p>` : ''}
  </div>`;
}

/* =====================================================================
   Rapport
   ===================================================================== */
function answerRows() {
  const rows = [];
  SCHEMA.forEach((sec, si) => {
    const qs = sec.questions.filter(q => !q.show || q.show(App.A));
    const items = [];
    qs.forEach(q => {
      let v = App.A[q.id];
      if (q.type === 'checkbox') v = Array.isArray(v) && v.length ? v.map(x => {
        const o = (q.options || []).find(o => o.v === x); return o ? optLabel(q, o) : x;
      }).join('; ') : '';
      else if (q.type === 'profile') { const p = PROFILES.find(p => p.id === v); v = p ? profText(p, 'label') : ''; }
      else if (q.options) { const o = (q.options || []).find(o => o.v === v); v = o ? optLabel(q, o) : (v || ''); }
      if (App.hideEmpty && (v === undefined || v === null || v === '')) return;
      items.push({ label: qText(q, 'label'), value: (v === undefined || v === null || v === '') ? tt('ui.unanswered') : v, unit: q.unit || '' });
    });
    if (items.length) rows.push({ title: secTitle(sec, si), items });
  });
  return rows;
}

function renderReport() {
  const R = App.R, A = App.A;
  const counts = { blok: 0, waarschuwing: 0, advies: 0 };
  R.rules.forEach(r => counts[r.level]++);
  const mots = R.motivations.map(m => {

    return `<tr><th scope="row">${esc(fill(pack.m, m.vars))}</th><td>${esc(fill(pack.w, m.vars))}</td><td>${esc(fill(pack.d, m.vars))}</td><td class="norm">${esc(fill(pack.n, m.vars))}</td></tr>`;
  }).join('');

  const G = R.generation, LD = R.loads, H = R.hydraulics;
  const duty = [
    [tt('ui.kpiHeat'), `${nf(LD.heat, 1)} kW` + (LD.area ? ` (${nf(LD.heat * 1000 / LD.area)} W/m²)` : '')],
    LD.cool > 0 ? [tt('ui.kpiCool'), `${nf(LD.cool, 1)} kW`] : null,
    [tt('ui.kpiUA'), `${nf(G.UA, 2)} kW/K`],
    [tt('ui.kpiRegime'), `${nf(R.regime.tFlow)}/${nf(R.regime.tReturn)} °C, Δ ${nf(R.regime.dT, 1)} K`],
    [tt('ui.kpiFlowRate'), `${nf(R.regime.flowHeat, 2)} m³/h`],
    R.chainInfo.isHP ? [tt('ui.kpiCop'), `${nf(G.copDesign, 2)}`] : null,
    R.chainInfo.isHP ? [tt('ui.kpiScop'), `≈ ${nf(G.copSeason, 2)}`] : null,
    R.chainInfo.isHP ? [tt('ui.kpiBivalent'), `${nf(G.bivalentPoint, 1)} °C`] : null,
    R.chainInfo.isHP ? [tt('ui.kpiCoverage'), `${nf(G.coverage * 100)} %`] : null,
    [tt('ui.kpiBackup'), `${nf(G.backupKW, 1)} kW`],
    [tt('ui.kpiBuffer'), `${nf(H.bufferAdvised)} l`],
    [tt('ui.kpiExpansion'), `${nf(H.expansion)} l`],
    G.dhw.dailyL > 0 ? [tt('ui.kpiDhw'), `${nf(G.dhw.dailyL)} ${ux('perDay')} · ${nf(G.dhwKWhYear)} ${ux('perYear')}`] : null,
    G.dhw.dailyL > 0 ? [tt('ui.kpiDhwCop'), `${nf(G.copDHW, 2)}`] : null,
    [tt('ui.kpiEnergyHeat'), `${nf(G.heatKWh)} kWh/a`],
    [tt('ui.kpiEnergyElec'), `${nf(G.elecKWh + G.dhwElec)} kWh/a`]

  const prof = R.profile ? profText(R.profile, 'label') : '—';

  return `<article class="report" id="report">
    <header class="rhead-main">
      <div class="rtitle">${esc(tt('ui.reportTitle'))}</div>
      <table class="meta"><tbody>
        <tr><th>${esc(tt('ui.reportRef'))}</th><td>${esc(A.prj_name || '—')}${A.prj_ref ? ' · ' + esc(A.prj_ref) : ''}</td>
            <th>${esc(tt('ui.reportDate'))}</th><td>${esc(A.prj_date || '—')}</td></tr>
        <tr><th>${esc(tt('ui.reportFor'))}</th><td>${esc(A.prj_client || '—')}</td>
            <th>${esc(tt('ui.kpiHeat'))}</th><td>${nf(R.loads.heat, 1)} kW</td></tr>
        <tr><th>${esc(tt('ui.reportBy'))}</th><td>${esc(A.prj_author || '—')}</td>
            <th>${esc(qText(SCHEMA[0].questions.find(q => q.id === 'geb_type') || {}, 'label'))}</th><td>${esc(prof)}</td></tr>
      </tbody></table>
    </header>

    <section><h2>${esc(tt('ui.secSummary'))}</h2>
      <p>${esc(fill(tt('ui.checksCount'), counts))}</p>
      ${A.prj_process_desc ? `<p>${esc(A.prj_process_desc)}</p>` : ''}
      ${R.profile ? `<p class="profnote">${esc(profText(R.profile, 'note'))}</p>` : ''}
    </section>

    <section><h2>${esc(tt('ui.diagramTitle'))}</h2>
      ${diagramSVG(R, { perRow: 6 })}
      ${diagramLegend()}
      <p class="note">${esc(tt('ui.diagramNote'))}</p>
    </section>

    <section><h2>${esc(tt('ui.secDuty'))}</h2>
      <table class="grid"><tbody>
        ${duty.map(d => `<tr><th scope="row">${esc(d[0])}</th><td>${esc(d[1])}</td></tr>`).join('')}
      </tbody></table>
    </section>

    <section class="break"><h2>${esc(tt('ui.secModules'))}</h2>
      <table class="grid wide"><thead><tr>
        <th>${esc(tt('ui.colModule'))}</th><th>${esc(tt('ui.colWhy'))}</th>
        <th>${esc(tt('ui.colDriver'))}</th><th>${esc(tt('ui.colNorm'))}</th></tr></thead>
        <tbody>${mots}</tbody></table>

    <section class="break"><h2>${esc(tt('ui.secChecks'))}</h2>
      ${R.rules.length ? R.rules.map(ruleHTML).join('') : `<p>${esc(tt('ui.checksNone'))}</p>`}
    </section>

    <section><h2>${esc(tt('ui.secQuestions'))}</h2>
      <ol class="asks">${(tt('ui.openQuestions') || []).map(q => `<li>${esc(q)}</li>`).join('')}</ol>
    </section>

    <section class="break"><h2>${esc(tt('ui.secAll'))}</h2>
      ${answerRows().map(g => `<h3>${esc(g.title)}</h3>
        <table class="grid"><tbody>${g.items.map(i =>
    `<tr><th scope="row">${esc(i.label)}</th><td>${esc(i.value)}${i.unit ? ' ' + esc(i.unit) : ''}</td></tr>`).join('')}</tbody></table>`).join('')}
    </section>

    <section><h2>${esc(tt('ui.secDisclaimer'))}</h2><p class="disclaimer">${esc(tt('ui.disclaimer'))}</p></section>
  </article>`;
}

/* =====================================================================
   INTERFACE — tools.petrov.re/ui/v1
   The shell, the header, the theme, the language control, the wizard steps,
   the fields, the tiles, the result states and the learn mode belong to
   diagram-ui.js.  What is left here is what only this sheet knows: the
   question schema, the installation schematic, the 67 checks and the report.
   ===================================================================== */

let steps = null;                     /* the wizard step list                       */
let stage = null;                     /* the installation schematic                 */
let fileInput = null;                 /* project-file picker, kept out of the shell  */
const REDRAW = Object.create(null);   /* custom fields that repaint themselves       */

/* The framework hands back a fresh state object after Reset, and a language change replaces the
   App instance, so nothing below holds on to either of them. */
function UI() { return window.DiagramUI ? DiagramUI.current : null; }
function refresh() { const a = UI(); if (a) { a.sync(); a.run(); } }
function runRedraw() { for (const k in REDRAW) REDRAW[k](); }

/* Framework repair, local to this file.  Below 768 px diagram-ui.js moves #dgc-bar and
   #eng-disc-badge into the shell's own .dgu-chromedock so they flow with the document instead of
   covering it.  App.destroy() then removes the whole shell on a language rebuild and takes the
   shared chrome with it, leaving the page with no toolbar.  The fix belongs upstream — destroy()
   should return the docked nodes to the body first — and until then every rebuild goes through
   here. */
function rebuildKeepingChrome(a) {
  const ids = ['dgc-bar', 'eng-disc-badge', 'dgc-menu', 'dgc-notes'];
  const kept = ids.map(id => document.getElementById(id)).filter(Boolean);
  const docked = document.documentElement.getAttribute('data-dgu-chrome') === 'flow';
  kept.forEach(n => document.body.appendChild(n));
  a.rebuild();
  const live = UI();
  const dock = (docked && live && live.node) ? live.node.querySelector('.dgu-chromedock') : null;
  if (dock) { kept.forEach(n => dock.appendChild(n)); dock.hidden = false; }
  try { DiagramUI.measure(); } catch (e) { }
}

/* The answer sheet is one object for the life of the page and is only ever mutated in place.
   Framework note, reported rather than patched: App.reset() and App.example() assign a NEW object
   to `this.state`, while App.rebuild() copies a second instance onto the first, so every Field
   keeps a reference to the instance it was built with.  Upstream the fix is for reset() and
   example() to refill the existing state object instead of replacing it. */
function setAnswers(o) {
  const keep = App.A;
  if (o && o !== keep) {
    Object.keys(keep).forEach(k => { delete keep[k]; });
    Object.assign(keep, o);
  }
  const a = UI();
  if (a) a.state = keep;
  return keep;
}

/* the declared defaults, as `Leegmaken` always produced them */
function freshAnswers() {
  const keep = App.A;
  App.A = {};
  applyDefaults();
  const out = App.A;
  App.A = keep;
  return out;
}

/* ---- stapnavigatie --------------------------------------------------- */
function applyNav(id) {
  if (id === 'report') App.view = 'report';
  else { App.step = Math.max(0, Math.min(SCHEMA.length - 1, +id)); App.view = 'form'; }
}
function goStep(id) { applyNav(id); try { window.scrollTo(0, 0); } catch (e) { } refresh(); }
function syncSteps() {
  if (!steps) return;
  const want = App.view === 'report' ? 'report' : String(App.step);
  /* Framework repair, local to this file: the Steps constructor sets aria-selected on its buttons
     from `value` but never writes that value into the <select> it also builds, so below 768 px —
     where the select IS the step control — a sheet that arrives on step 3 shows "1. Project and
     building" over the third form.  The fix belongs upstream in diagram-ui.js. */
  if (steps.select_ && steps.select_.value !== want) steps.select_.value = want;
  if (steps.value === want) return;
  steps.value = want;
  steps.items.forEach((it, i) => {
    const on = it.id === want;
    steps.buttons[i].setAttribute('aria-selected', String(on));
    if (on) steps.buttons[i].setAttribute('aria-current', 'step');
    else steps.buttons[i].removeAttribute('aria-current');
  });
  steps.select_.value = want;
}
/* the report replaces the form and its live rail, exactly as it did before the port */
function applyViewRegions(app) {
  const rep = App.view === 'report';
  if (!app || !app.regions) return;
  if (app.regions.results) app.regions.results.hidden = rep;
  if (app.regions.stage) app.regions.stage.hidden = rep;
  if (app.regions.strip) app.regions.strip.hidden = rep || app.regions.strip.hidden;
}

/* ---- vragen → velden ------------------------------------------------- */
function optPairs(q) { return (q.options || []).map(o => [o.v, () => optLabel(q, o)]); }

/* An emptied number field stores `undefined`, which is what the form produced before the port and
   what the calculation, the record and the permalink expect; `null` would count as answered. */
function numberSet(id) {
  return (v, s) => {
    s[id] = (v === null || v === undefined || (typeof v === 'number' && !Number.isFinite(v))) ? undefined : v;
  };
}

function multiRender(q) {
  return function (box, ctx, field) {
    box.className = 'vwk-checks';
    const draw = () => {
      const arr = Array.isArray(App.A[q.id]) ? App.A[q.id] : [];
      box.textContent = '';
      (q.options || []).forEach(o => {
        const on = arr.indexOf(o.v) >= 0;
        const lab = document.createElement('label');
        lab.className = 'vwk-chk' + (on ? ' on' : '');
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = o.v; cb.checked = on;
        cb.setAttribute('aria-label', optLabel(q, o));
        cb.addEventListener('change', () => {
          const cur = Array.isArray(App.A[q.id]) ? App.A[q.id].slice() : [];
          const i = cur.indexOf(o.v);
          if (cb.checked && i < 0) cur.push(o.v);
          if (!cb.checked && i >= 0) cur.splice(i, 1);
          field.commit(cur, true);
        });
        const bx = document.createElement('span');
        bx.className = 'box';
        bx.textContent = '✓';
        bx.setAttribute('aria-hidden', 'true');
        const sp = document.createElement('span');
        sp.textContent = optLabel(q, o);
        lab.appendChild(cb); lab.appendChild(bx); lab.appendChild(sp);
        box.appendChild(lab);
      });
    };
    REDRAW['f_' + q.id] = draw;
    draw();
  };
}

function profileRender(q) {
  return function (box) {
    box.className = 'vwk-profiles';
    const draw = () => {
      const cur = App.A[q.id];
      box.textContent = '';
      PROFILE_GROUPS.forEach(g => {
        const wrap = document.createElement('div');
        const h = document.createElement('h4');
        h.textContent = (L().pgroup || {})[g.id] || g.label;
        wrap.appendChild(h);
        const grid = document.createElement('div');
        grid.className = 'vwk-pgrid';
        PROFILES.filter(p => p.group === g.id).forEach(p => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'vwk-pcard' + (cur === p.id ? ' on' : '');
          b.setAttribute('aria-pressed', String(cur === p.id));
          b.textContent = profText(p, 'label');
          b.addEventListener('click', () => { applyProfile(p.id); refresh(); });
          grid.appendChild(b);
        });
        wrap.appendChild(grid);
        box.appendChild(wrap);
      });
    };
    REDRAW['f_' + q.id] = draw;
    draw();
  };
}

function fieldOf(q, si) {
  const d = {
    id: 'f_' + q.id,
    key: q.id,
    label: () => qText(q, 'label'),
    visible: () => App.view === 'form' && App.step === si && (!q.show || q.show(App.A)),
    required: !!q.required
  };
  /* The sheet's own unit is also its display unit: these answers are quoted to a manufacturer in
     the units the standards use, so nothing is converted and no unit-system control appears. */
  if (q.unit) { d.unit = q.unit; d.display = q.unit; }
  if (qText(q, 'help')) d.learn = q.id;
  switch (q.type) {
    case 'date': d.type = 'text'; d.inputType = 'date'; break;
    case 'textarea': d.type = 'textarea'; d.rows = 3; break;
    case 'number':
      d.type = 'number';
      d.set = numberSet(q.id);
      d.step = q.step || 'any';
      if (q.default !== undefined) d.placeholder = String(q.default);
      break;
    case 'select': d.type = 'select'; d.options = () => optPairs(q); break;
    case 'radio': d.type = 'segmented'; d.options = () => optPairs(q); break;
    case 'checkbox': d.type = 'custom'; d.render = multiRender(q); break;
    case 'profile': d.type = 'custom'; d.render = profileRender(q); break;
    default: d.type = 'text';
  }
  return d;
}

/* ---- rapportweergave en stapknoppen als velden ----------------------- */
function reportRender() {
  return function (box) {
    box.className = 'report-host';
    const draw = () => { box.innerHTML = (App.view === 'report' && App.R) ? renderReport() : ''; };
    REDRAW['f_report'] = draw;
    draw();
  };
}

function navRender() {
  return function (box) {
    box.className = 'vwk-navrow';
    const prev = document.createElement('button');
    prev.type = 'button'; prev.className = 'dgu-btn ghost';
    const label = document.createElement('span');
    label.className = 'vwk-progress';
    const next = document.createElement('button');
    next.type = 'button'; next.className = 'dgu-btn primary';
    prev.addEventListener('click', () => goStep(String(App.step - 1)));
    next.addEventListener('click', () => {
      if (App.step + 1 >= SCHEMA.length) goStep('report'); else goStep(String(App.step + 1));
    });
    box.appendChild(prev); box.appendChild(label); box.appendChild(next);
    const draw = () => {
      prev.disabled = App.step === 0;
      prev.textContent = '← ' + tt('ui.prev');
      next.textContent = tt('ui.next') + ' →';
      label.textContent = tt('ui.step') + ' ' + (App.step + 1) + ' ' + tt('ui.of') + ' ' + SCHEMA.length;
    };
    REDRAW['f_nav'] = draw;
    draw();
  };
}

/* ---- panelen --------------------------------------------------------- */
function buildPanels() {
  const list = SCHEMA.map((sec, si) => ({
    slot: 'inputs', id: 'sec-' + sec.id,
    title: () => secTitle(sec, si),
    note: () => secText(sec, 'intro'),
    learn: 'sec:' + sec.id,
    fields: sec.questions.map(q => fieldOf(q, si))
  }));
  list.push({
    slot: 'inputs', id: 'vwk-report',
    fields: [{
      id: 'f_report', key: '__report', type: 'custom', label: '',
      visible: () => App.view === 'report', render: reportRender()
    }]
  });
  list.push({
    slot: 'inputs', id: 'vwk-nav',
    fields: [{
      id: 'f_nav', key: '__nav', type: 'custom', label: '',
      visible: () => App.view === 'form', render: navRender()
    }]
  });
  /* Reset lives in the inputs footer under the shared name.  The two project-file actions stay
     with it: the shared bar exports the record and copies a permalink, but it has no import, so
     deleting them would strand every sheet a user has already saved. */
  list.push({
    slot: 'inputs', id: 'vwk-tools',
    actions: [
      { id: 'vwk-save', label: () => tt('ui.save'), run: exportJSON },
      { id: 'vwk-load', label: () => tt('ui.load'), run: () => { if (fileInput) fileInput.click(); } },
      { id: 'vwk-reset', variant: 'ghost', label: () => fw('reset'), run: () => { const a = UI(); if (a) a.reset(); } }
    ],
    actionsAlign: 'end'
  });
  return list;
}

/* ---- resultaten ------------------------------------------------------ */
function checksNode(R) {
  const box = document.createElement('div');
  box.className = 'vwk-checks-box';
  const h = document.createElement('h3');
  h.className = 'vwk-section-t';
  h.textContent = tt('ui.checksTitle');
  box.appendChild(h);
  const list = document.createElement('div');
  list.innerHTML = R.rules.length
    ? R.rules.map(ruleHTML).join('')
    : '<p class="vwk-muted">' + esc(tt('ui.checksNone')) + '</p>';
  box.appendChild(list);
  return box;
}

function buildResults(R) {
  const counts = { blok: 0, waarschuwing: 0, advies: 0 };
  R.rules.forEach(r => counts[r.level]++);
  const G = R.generation, LD = R.loads, H = R.hydraulics;
  const rad = Object.values(R.terminals.detail).find(d => d && d.factor !== undefined);
  const isHP = R.chainInfo.isHP;
  /* UI_FRAMEWORK_SPEC §7: a quantity that has never been computed shows a dash, never a zero.
     Before the port an untouched sheet answered 0.0 kW, 0 l and a bivalent point of -8 °C in the
     same type as the real figures, with nothing to tell the two apart. */
  const known = LD.area > 0 || LD.heat > 0 || LD.cool > 0;
  const V = (s) => (known ? s : null);
  const U = (u) => (known ? u : null);
  const T = (s) => (known ? s : undefined);

  const tiles = [
    { label: () => tt('ui.kpiHeat'), value: V(nf(LD.heat, 1)), unit: U('kW'), display: 'kW',
      learn: 'vwk:load',
      hint: T(LD.area ? nf(LD.heat * 1000 / LD.area) + ' W/m²' : '') },
    { label: () => tt('ui.kpiCool'), value: V(LD.cool > 0 ? nf(LD.cool, 1) : '—'),
      unit: U(LD.cool > 0 ? 'kW' : null), display: 'kW',
      hint: T(LD.cool > 0 && LD.area ? nf(LD.cool * 1000 / LD.area) + ' W/m²' : '') },
    { label: () => tt('ui.kpiRegime'), value: V(nf(R.regime.tFlow) + '/' + nf(R.regime.tReturn)),
      unit: U('°C'), display: '°C', learn: 'vwk:regime',
      hint: T('Δ ' + nf(R.regime.dT, 1) + ' K · ' + nf(R.regime.flowHeat, 2) + ' m³/h') },
    rad
      ? { label: () => tt('ui.kpiRadiator'), value: V(nf(rad.factor * 100)), unit: U('%'), display: '%',
          learn: 'vwk:derating',
          hint: T('≥ ' + nf(rad.requiredNominal, 1) + ' kW ' + ux('nominal')) }
      : { label: () => tt('ui.kpiFlowRate'), value: V(nf(R.regime.flowHeat, 2)), unit: U('m³/h'), display: 'm³/h',
          learn: 'vwk:regime', hint: T('') },
    { label: () => tt('ui.kpiCop'), value: V(isHP ? nf(G.copDesign, 2) : '—'), learn: 'vwk:cop',
      hint: T(isHP ? tt('ui.kpiScop') + ' ≈ ' + nf(G.copSeason, 2) : '') },
    { label: () => tt('ui.kpiBivalent'), value: V(isHP ? nf(G.bivalentPoint, 1) : '—'),
      unit: U(isHP ? '°C' : null), display: '°C', learn: 'vwk:bivalent',
      hint: T(isHP ? tt('ui.kpiCoverage') + ' ' + nf(G.coverage * 100) + ' %' : '') },
    { label: () => tt('ui.kpiBackup'), value: V(nf(G.backupKW, 1)), unit: U('kW'), display: 'kW',
      hint: T(nf(G.capacityAtDesign, 1) + ' kW ' + ux('available')) },
    { label: () => tt('ui.kpiBuffer'), value: V(nf(H.bufferAdvised)), unit: U('l'), display: 'l',
      hint: T(tt('ui.kpiExpansion') + ' ' + nf(H.expansion) + ' l') },
    { label: () => tt('ui.kpiDhw'), value: V(G.dhw.dailyL > 0 ? nf(G.dhw.dailyL) : '—'),
      unit: U(G.dhw.dailyL > 0 ? 'l/d' : null), display: 'l/d',
      hint: T(G.dhw.dailyL > 0 ? 'COP ' + nf(G.copDHW, 2) + ' · ' + nf(G.dhwKWhYear) + ' kWh/a' : '') },
    { label: () => tt('ui.kpiEnergyElec'), value: V(nf(G.elecKWh + G.dhwElec)), unit: U('kWh/a'), display: 'kWh/a',
      hint: T(tt('ui.kpiEnergyHeat') + ' ' + nf(G.heatKWh) + ' kWh/a') }
  ];

  const out = {
    verdict: {
      tone: counts.blok ? 'bad' : (counts.waarschuwing ? 'warn' : 'ok'),
      text: fill(tt('ui.checksCount'), counts)
    },
    tiles: tiles,
    nodes: [checksNode(R)],
    notes: []
  };
  if (!known) out.notes.push(tt('ui.diagramEmpty'));
  return out;
}

/* ---- uitleg ---------------------------------------------------------- */
function T6(nl, fr, en, de, ru, uk) { return { nl: nl, fr: fr, en: en, de: de, ru: ru, uk: uk }; }
/* not DiagramUI.pick: these strings are also needed by the report when diagram-ui.js is the
   very thing that failed to load */
function pick6(o) { return (o && (o[App.lang] || o.nl)) || ''; }

/* the two words the results rail needs that the sheet's own dictionary never had:
   before the port both of them printed Dutch into the English, French, German,
   Russian and Ukrainian interface. */
const UX = {
  nominal: T6('nominaal', 'nominal', 'nominal', 'Nennleistung', 'номинал', 'номінал'),
  available: T6('beschikbaar', 'disponible', 'available', 'verfügbar', 'доступно', 'доступно'),
  /* the report's hot-water line spelled its two units in Dutch in all six languages */
  perDay: T6('l/dag', 'l/j', 'l/d', 'l/d', 'л/сут', 'л/добу'),
  perYear: T6('kWh/jaar', 'kWh/an', 'kWh/a', 'kWh/a', 'кВт·ч/год', 'кВт·год/рік')
};
function ux(k) { return pick6(UX[k]); }

/* ---- framework repair, local to this file ----------------------------
   App.prototype.setLang refuses any language outside the site's six, so this tool's Russian —
   declared in tool_languages and shipped inline as LANG_RU — could be chosen from the shared
   header but never applied.  The fix belongs upstream in diagram-ui.js: the gate should accept
   the manifest's tool_languages, not the site list. */
function patchLanguage(app) {
  const proto = Object.getPrototypeOf(app);
  if (!proto.__vwkLang) {
    proto.__vwkLang = true;
    proto.setLang = function (l) {
      if (!LANGS[l]) return this.lang;
      App.lang = l;
      this.lang = l;
      try { localStorage.setItem('diagram_site_lang', l); } catch (e) { }
      try {
        const u = new URL(location.href);
        u.searchParams.set('lang', l);
        history.replaceState(null, '', u);
      } catch (e) { }
      try { if (window.Diagram) window.Diagram.setLang(l); } catch (e) { }
      document.documentElement.lang = l;
      save();
      rebuildKeepingChrome(this);
      return l;
    };
  }
  /* the switcher shows native names; diagram-ui.js has no entry for Russian */
  const sels = app.head ? app.head.querySelectorAll('select') : [];
  for (let s = 0; s < sels.length; s++) {
    const sel = sels[s];
    let all = sel.options.length > 0;
    for (let i = 0; i < sel.options.length; i++) if (!LANGS[sel.options[i].value]) all = false;
    if (!all) continue;
    for (let i = 0; i < sel.options.length; i++) sel.options[i].text = LANGS[sel.options[i].value].name;
    sel.value = App.lang;
  }
}

/* Taalkeuze, volgorde volgens FRAMEWORK_V2_SPEC §3:
   ?lang= -> localStorage.diagram_site_lang -> legacy diagram_lang -> browsertaal -> en.               */
function detectLang() {
  const SUPPORTED = LANG_ORDER;
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q && SUPPORTED.includes(String(q).slice(0, 2).toLowerCase()))
      return String(q).slice(0, 2).toLowerCase();
  } catch (e) { }
  try {
    const x = localStorage.getItem('diagram_site_lang');
    if (x && SUPPORTED.includes(x)) return x;
  } catch (e) { }
  try {
    const x = localStorage.getItem('diagram_lang');
    if (x && SUPPORTED.includes(x)) {
      try { localStorage.setItem('diagram_site_lang', x); } catch (e) { }
      return x;
    }
  } catch (e) { }
  for (const n of (navigator.languages || [navigator.language || ''])) {
    const b = String(n).slice(0, 2).toLowerCase();
    if (SUPPORTED.includes(b)) return b;
  }
  return SUPPORTED.includes('en') ? 'en' : LANG_ORDER[0];
}

function boot() {
  if (!window.DiagramUI || DiagramUI.api !== 'tools.petrov.re/ui/v1') { bootBare(); return; }

  load();
  App.lang = detectLang();
  applyDefaults();

  /* The v2 data layer starts first and unconditionally, outside any then/catch: the shared bar,
     the permalink, the record, the Python export and the handoff must exist even if the shell
     below never gets built.  An incoming permalink is applied here, before the shell reads
     App.lang, App.step and App.view. */
  dgcInit();

  fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = 'application/json,.json';
  fileInput.hidden = true;
  fileInput.id = 'fileinput';
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) importJSON(e.target.files[0]); });
  document.body.appendChild(fileInput);

  const app = DiagramUI.app({
    id: 'verwarmenkoelenselector',
    mount: '#app',
    layout: 'wizard',
    compute: 'live',
    lang: App.lang,
    title: () => tt('ui.appTitle'),
    subtitle: () => tt('ui.appSubtitle'),
    state: App.A,
    defaults: freshAnswers,
    strings: frameworkStrings(),
    learn: buildLearn(),
    panels: buildPanels(),
    footer: buildFooter,
    on: {
      compute: function () {
        const R = compute();
        runRedraw();
        syncSteps();
        if (stage) stage.schedule();
        document.title = tt('ui.appTitle') + ' — ' + tt('ui.appSubtitle');
        save();
        return buildResults(R);
      },
      reset: function (s, a) { setAnswers(s); if (a) a.state = App.A; App.step = 0; App.view = 'form'; },
      state: function (st, a) { applyViewRegions(a); },
      ready: function (a) {
        if (a.__vwkBuilt) return;
        a.__vwkBuilt = true;
        patchLanguage(a);

        steps = a.steps({
          label: tt('ui.step'),
          items: SCHEMA.map((sec, i) => ({ id: String(i), label: () => secText(sec, 'title') }))
            .concat([{ id: 'report', label: () => tt('ui.report') }]),
          value: App.view === 'report' ? 'report' : String(App.step),
          onSelect: function (id) { applyNav(id); try { window.scrollTo(0, 0); } catch (e) { } refresh(); }
        });

        stage = buildStage(a);

        a.examples([{
          label: () => tt('ui.demo'),
          note: 'Rijwoning Leiestraat — vervanging ketel · OFF-2026-041',
          apply: function () { demo(); }
        }]);

        a.sync();
        a.run();
      }
    }
  });

  document.documentElement.lang = App.lang;
  app.ready();
}

  const summary = [fill(tt('ui.checksCount'), counts)];
  if (A.prj_process_desc) summary.push(A.prj_process_desc);
  if (R.profile) summary.push(profText(R.profile, 'note'));
  return {
    title: tt('ui.reportTitle'),
    project: [
      { label: tt('ui.reportRef'), value: [A.prj_name, A.prj_ref].filter(Boolean).join(' · ') || '—' },
      { label: tt('ui.reportFor'), value: A.prj_client || '—' },
      { label: tt('ui.reportBy'), value: A.prj_author || '—' },
      { label: tt('ui.reportDate'), value: A.prj_date || '—' },
      { label: qText(SCHEMA[0].questions.find(q => q.id === 'geb_type') || {}, 'label'), value: profileName }
    ],
    /* The conclusion used to restate the summary count line verbatim, and the
       design-basis block was the first twelve rows of the questionnaire annex.
       Each fact now appears once: counts in the summary, inputs in the annex. */
    executive: { text: summary, results: duty.slice(0, 6), conclusion: '' },
    assumptions: [],
    system: {
      text: systemText, figure: figure,
      flow: figure ? [] : heatPath.map(m => ({
        label: modLabel(m.key), detail: m.spec === m.key ? '' : specLabel(m.spec)
      }))
    },
    results: duty,
    decisions: choices,
    checks: checks,
    risks: [],
    questions: tt('ui.openQuestions') || [],
    method: {
      equations: rec.model && rec.model.equations || [],
      ranges: rec.model && rec.model.ranges || [],
      notes: rec.model && rec.model.notes || [],
      references: Array.from(new Set(choices.map(x => x.basis).concat(checks.map(x => x.basis)).filter(x => x && x !== '—')))
    },
    inputs: allInputs
  };
}
function dgcInit() {
  if (!window.Diagram) return;
  window.Diagram.init({
    id: 'verwarmenkoelenselector', file: 'verwarmenkoelenselector.html',
    state: { serialize: dgcSerialize, deserialize: dgcDeserialize },
    record: dgcRecord,
    python: dgcPython,
    handoff: { provides: ['Q', 'Vdot'], accepts: ['Q'], build: dgcHandoff, apply: dgcApply },
    report: { profile: dgcReportProfile }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
