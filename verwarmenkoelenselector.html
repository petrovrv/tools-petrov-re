e_derating":{"t":"За цього режиму прилади тепловіддачі дають істотно менше","d":"За {aan}/{ret} °C для позиції «{type}» залишається {pct} % номінальної потужності. Розраховуйте приблизно на {nodig} kW номінальної потужності, щоб покрити навантаження. Перевіряйте це по приміщеннях: середнє значення не говорить нічого, вирішує приміщення з найменшим запасом.","r":"EN 442"},"afgifte_ok":{"t":"Прилади тепловіддачі відповідають обраному режиму","d":"За цього режиму для позиції «{type}» залишається {pct} % номінальної потужності. Попри це перевірте приміщення з найгіршим співвідношенням між навантаженням і встановленою тепловіддачею.","r":"EN 442"},"vloer_oververhit":{"t":"Тепла підлога вище допустимої температури поверхні","d":"Потрібний тепловий потік становить {nodig} W/m², тоді як за максимальної температури поверхні 29 °C у зоні перебування можливо приблизно {max} W/m². Розрахункова температура поверхні виходить {opp} °C — це не лише поза нормою, а й некомфортно. Збільште площу укладання, зменште крок укладання або доповніть другою системою тепловіддачі.","r":"EN 1264"},"vloerafwerking":{"t":"Покриття підлоги з високим термічним опором","d":"За R = {r} m²K/W температура води має піднятися приблизно до {tmed} °C, щоб віддати ту саму теплоту. Це найтихіший убивця проєктів: забудовник обирає покриття підлоги окремо від установки, а ефективність теплового насоса йде слідом. Зафіксуйте максимально допустимий опір у специфікації та доведіть його до відома.","r":"EN 1264"},"legoppervlak":{"t":"Обмежена площа укладання для теплої підлоги","d":"За {pct} % доступної площі та сама теплота має пройти через менше квадратних метрів, і температура води зростає відповідно. Перевірте, чи справді вбудовані шафи та обладнання стануть саме на тих місцях, і розгляньте настінне опалення як доповнення.","r":"EN 1264"},"tabs_te_zwaar":{"t":"Активація бетонного ядра не витримує теплового навантаження","d":"Потрібно {nodig} W/m², тоді як бетонне ядро дає приблизно {max} W/m². Бетонне ядро покриває базове навантаження; пік має забезпечити друга, швидша система. Прорахуйте обидві, замість сподіватися, що маса це перехопить.","r":"ISO 11855"},"tabs_koel_te_zwaar":{"t":"Активація бетонного ядра не витримує холодильного навантаження самотужки","d":"Потрібно {nodig} W/m² проти приблизно {max} W/m² доступних. Доповніть доводячим регулюванням або зменште холодильне навантаження зовнішнім сонцезахистом — останнє майже завжди дешевше за встановлену потужність.","r":"ISO 11855"},"tabs_zonder_massa":{"t":"Активація бетонного ядра без теплової маси","d":"У легкій будівлі або під підвісною стелею активація бетонного ядра не має діючої маси, а отже, не дає ефекту. Оберіть іншу систему тепловіддачі або звільніть масу і прийміть акустичні наслідки цього.","r":"ISO 11855"},"tabs_onderbroken":{"t":"Повільна система за сильно переривчастого використання","d":"Активація бетонного ядра реагує годинами. За режиму використання із сильними перервами теплота приходить запізно і запізно припиняється, наслідком є перегрів і недогрів. Розгляньте швидшу систему або прийміть, що бетонне ядро дає лише базу.","r":"—"},"condens_plafond":{"t":"Ризик конденсації на охолоджувальній стелі","d":"Температура подачі {aan} °C лежить надто близько до очікуваної точки роси {dauw} °C. Без осушення деінде і без контролю точки роси стеля почне капати першого ж задушливого дня. Підвищте температуру подачі або забезпечте осушення через систему обробки повітря та давач на подачі І в приміщенні.","r":"ISO 11855; EN 14240"},"straling_zonder_ontvochtiging":{"t":"Променеве охолодження без осушення","d":"Охолоджувана поверхня сприймає лише явну теплоту. Без осушення вологість зростає доти, доки точка роси не впреться в обмеження системи, і саме в найтепліші дні. Передбачте осушення в системі обробки повітря.","r":"—"},"gemengde_regimes":{"t":"Тепла підлога і радіатори на одному режимі","d":"Тоді джерело теплоти має видавати найвищу температуру, і ефективність іде за радіаторами, а не за підлогою. Передбачте вузол змішування або — краще — замініть радіатори, щоб уся будівля могла працювати на низькому режимі.","r":"—"},"latent_zonder_ontvochtiging":{"t":"Латентне навантаження {pct} % без осушення","d":"Волога має кудись подітися. Без осушення в системі обробки повітря або у фанкойлах вологість повітря зростає доти, доки не зникне комфорт і доки променеве охолодження не доведеться приглушити. Зафіксуйте, де відбувається осушення і з якою потужністю.","r":"EN 16798-1"},"boven_max_temp":{"t":"Потрібна температура подачі вища за діапазон теплового насоса","d":"Потрібно {aan} °C, тоді як апарат дає щонайбільше {max} °C. Перевірте до того ж, чи досягається цей максимум і за найнижчої температури джерела — багато апаратів дають свій максимум лише за м'яких зовнішніх температур, а це саме не той момент, коли він вам потрібен.","r":"EN 14511"},"hoog_regime":{"t":"Висока температура подачі для теплового насоса","d":"За {aan} °C COP за розрахункових умов виходить близько {cop}. Кожен градус нижче дає приблизно 2–3 % кращої ефективності. Спершу з'ясуйте, чи можна знизити режим цілеспрямованою заміною приладів тепловіддачі; за строк служби це окупається з лишком.","r":"EN 14511"},"kleine_spreiding":{"t":"Дуже малий перепад температур","d":"За перепаду {dt} K витрата води становить {debiet} m³/h — це потребує великих діаметрів і коштує енергії на перекачування цілий рік. Перевірте, чи підбір трубопроводів і вибір насосів зроблено саме на це, а не на котловий режим.","r":"—"},"grote_spreiding":{"t":"Великий перепад температур для теплового насоса","d":"За {dt} K тепловий насос має опрацьовувати низький зворот, водночас створюючи високу подачу. Більшість апаратів розраховано на 5–8 K; перевірте, чи діють заявлені характеристики за такого перепаду.","r":"EN 14511"},"geen_stooklijn":{"t":"Погодозалежного регулювання немає","d":"Без опалювального графіка установка весь сезон працює на розрахунковій температурі, тоді як за 7 °C зовні достатньо значно меншої. Це практично безкоштовний приріст ефективності, і відмова від нього забирає велику частину переваги теплового насоса.","r":"—"},"regime_niet_vastgelegd":{"t":"Режим не зафіксовано в договорі","d":"Зафіксуйте подачу, зворот і перепад з точками вимірювання під час приймання. Без такої домовленості режим під час виконання тихо повзе вгору, а потім ніхто не відповідає за низьку ефективність.","r":"—"},"tekort_zonder_bijstook":{"t":"Дефіцит потужності без доводчика","d":"За розрахункових умов тепловий насос дає приблизно {cap} kW, тоді як навантаження вище; бракує {tekort} kW, а доводчика не передбачено. Оберіть більший апарат або передбачте доводчик — але спершу прорахуйте, що з двох дешевше за строк служби.","r":"—"},"bivalentpunt_hoger":{"t":"Фактична точка бівалентності вища за бажану","d":"За розрахунком точка лягає на {werkelijk} °C проти бажаних {gewenst} °C; тоді тепловий насос покриває приблизно {dekking} % річної потреби в теплоті. Трохи більший апарат зміщує цю точку суттєво і зменшує частку дорогого доводчика.","r":"—"},"lage_dekking":{"t":"Низьке покриття тепловим насосом","d":"Приблизно {dekking} % річної потреби в теплоті дає тепловий насос; решту дає доводчик ({backup}). За електричного доводчика це означає значно вищий річний рахунок, ніж обіцяє проспект.","r":"—"},"elektrische_bijstook":{"t":"Електричний доводчик приблизно {kw} kW","d":"Кожна кіловат-година коштує однієї кіловат-години, тоді як тепловий насос дає три-п'ять. Запитайте, скільки годин роботи на рік очікується, і прорахуйте це за тарифом — часто виявляється, що трохи більший тепловий насос стає дешевшим уже за кілька років.","r":"—"},"aanuit_zonder_buffer":{"t":"Апарат без модуляції та без буфера","d":"Немодульований апарат без буфера безперервно вмикається і вимикається, що коштує ефективності та ресурсу. Передбачте приблизно {liter} літрів або оберіть модульований апарат.","r":"—"},"geen_regeneratie":{"t":"Ґрунтова енергія без регенерації","d":"Ґрунт, з якого лише тягнуть, за роки вихолоджується, і ефективність падає разом із ним. Пасивне охолодження влітку знову заряджає ґрунт І дає майже безкоштовний холод — це найсильніший аргумент на користь ґрунтової енергії, і про нього часто забувають у комерційній пропозиції.","r":"—"},"warmtenet_voorwaarden":{"t":"Умови теплової мережі не зафіксовано","d":"Максимально допустима температура зворотної лінії для теплової мережі є жорсткою граничною умовою: вона вимірюється, за неї часто передбачені штрафи, і вона визначає весь ваш проєкт тепловіддачі. Запитайте умови приєднання ще до вибору приладів тепловіддачі.","r":"—"},"cop_punten":{"t":"Оцінена ефективність за цього режиму","d":"За подачі {aan} °C: COP {copOntwerp} за розрахункових умов, {copMild} за м'якої зовнішньої температури, оцінене сезонне середнє {copSeizoen}. Це наближення за Карно — запитайте сертифіковані значення в цих самих точках і порівняйте.","r":"EN 14511 / EN 14825"},"sww_rendement":{"t":"Гаряче водопостачання тягне сезонну ефективність униз","d":"За температури зберігання {t} °C тепловий насос працює з COP {copSww} проти {copCv} для опалення. Річна потреба в теплоті на гарячу воду становить приблизно {kwh} kWh, що дає приблизно {elek} kWh електроенергії. Розглядайте це як окрему систему: станція приготування ГВП проточного типу, нижча температура запасу або окремий високотемпературний ступінь дадуть тут більше, ніж будь-яка оптимізація опалення.","r":"EN 14825"},"verswater_circulatie":{"t":"Станція приготування ГВП проточного типу з циркуляційним трубопроводом","d":"Перевага станції проточного типу полягає у відсутності застояної гарячої води. З циркуляційним трубопроводом ця вода частково повертається, а разом із нею й безперервні втрати. З'ясуйте, чи може циркуляція вмикатися за розкладом або на вимогу, та ізолюйте потужно.","r":"—"},"legionella_elektrisch":{"t":"Цикл проти легіонели на електричному доводчику","d":"Періодичний нагрів до 60 °C або вище на практиці майже завжди виконує електричний нагрівач, бо тепловий насос такої температури не досягає. Запитайте, скільки кіловат-годин цей цикл коштує на рік; це часто більше, ніж очікують, і цього можна уникнути проточним принципом.","r":"Національне законодавство щодо легіонели"},"boilerspiraal":{"t":"Площа теплообміну бака-накопичувача","d":"Змійовик, замалий для теплового насоса, змушує температуру конденсації підніматися і коштує ефективності при кожному завантаженні. Запитуйте площу теплообміну в m² і потужність за ВАШОЇ температури подачі, а не за котлової.","r":"—"},"circulatieverlies":{"t":"Втрати циркуляційного трубопроводу","d":"За погано ізольованого циркуляційного трубопроводу втрати можуть бути більшими за корисне споживання гарячої води. Вимагайте оцінку цих втрат і потужну ізоляцію; де можливо, вмикайте циркуляцію за розкладом або на вимогу.","r":"—"},"voorrang_snel_systeem":{"t":"Пріоритет гарячої води за швидкої системи тепловіддачі","d":"За повітряного опалення або фанкойлів зникнення опалення помітне вже за десять хвилин. Зафіксуйте, як довго може тривати перерва і чи залишається мінімальна тепловіддача.","r":"—"},"buffer_te_klein":{"t":"Об'єм буфера менший за розрахунковий","d":"Обрано {gekozen} літрів проти приблизно {nodig} літрів, які випливають із мінімальної тривалості роботи та з розморожування. Замалий буфер усе одно дає тактування; це коштує ефективності та ресурсу.","r":"—"},"geen_buffer":{"t":"Немає буфера за апарата без повної модуляції","d":"Запитайте у виробника мінімальну тривалість роботи і мінімальний об'єм води в установці. За теплої підлоги власного водовмісту часто достатньо; за радіаторів із термостатичними клапанами — майже ніколи.","r":"—"},"evenwichtsfles":{"t":"Гідравлічний розділювач або гідравлічна стрілка","d":"Неправильно підібрана гідравлічна стрілка змішує подачу та зворот: тепловий насос бачить завищений зворот, скидає модуляцію, і ефективність падає — при цьому ніщо не виглядає несправним. Уникайте гідравлічного розділення там, де можна, і замовляйте розрахунок там, де воно потрібне.","r":"—"},"geen_inregeling":{"t":"Гідравлічного балансування не передбачено","d":"Без балансування найближчий контур отримує все, а найдальший нічого, і це компенсують вищою температурою подачі — саме тим, чого ви хотіли уникнути. Це різниця між установкою, яка працює на 35 °C, і тією самою установкою, яка змушена працювати на 45 °C.","r":"—"},"vulwater":{"t":"Необроблений теплоносій","d":"Накип на теплообміннику з малими каналами одразу коштує потужності, а кисень дає магнетит, який забиває насоси та клапани. Більшість виробників прив'язують свою гарантію до якості теплоносія. Замовте аналіз під час приймання і через рік.","r":"VDI 2035"},"vulwater_onbepaald":{"t":"Якість теплоносія ще не визначено","d":"Зафіксуйте вимогу до замовлення обладнання і внесіть її до приймальної документації разом із виміряними значеннями. Згодом уже неможливо довести, чим саме заповнено систему.","r":"VDI 2035"},"geen_vuilafscheider":{"t":"Немає шламо- та повітровідділення за наявних трубопроводів","d":"Наявні трубопроводи містять магнетит і шлам, який при першому ж пуску піде до нового теплообмінника. Магнітний шламовловлювач і сепаратор мікробульбашок безпосередньо перед джерелом теплоти тут не розкіш, а умова збереження гарантії.","r":"—"},"glycol":{"t":"Гліколь у системі ({pct} %)","d":"Гліколь знижує теплоємність і підвищує в'язкість: більша витрата і значно більша енергія на перекачування для тієї самої потужності. Обмежте його контуром, де мороз справді можливий, і відокремте цей контур гідравлічно.","r":"—"},"pompenergie":{"t":"Висока частка енергії на перекачування","d":"Орієнтовно {kw} kW, приблизно {pct} % теплової потужності. Допоміжна енергія входить до фактичної сезонної ефективності і вимірюється рідко. Перевірте робочу точку насосів і втрати тиску в мережі.","r":"—"},"expansievat":{"t":"Розширювальний бак приблизно {liter} літрів","d":"Розраховано за водовмісту системи {volume} літрів. Перевірте тиск підпору проти статичної висоти і встановіть бак на всмоктувальному боці насоса.","r":"EN 12828"},"tweepijps_gelijktijdig":{"t":"Двотрубна система за одночасної потреби в теплоті та холоді","d":"Зони, які хочуть водночас опалюватися й охолоджуватися, за одного сезонного перемикання цього зробити не можуть. Оберіть чотиритрубну схему, мережу джерела з децентралізованими тепловими насосами або VRF із рекуперацією — інакше весь перехідний сезон буде супроводжуватися скаргами.","r":"—"},"vrije_koeling_gemist":{"t":"Вільне охолодження не використано за високого режиму охолодження","d":"За подачі {t} °C у наших широтах значну частину року можливе вільне охолодження, лише з енергією насосів. Це найсильніший аргумент, щоб задати високий режим охолодження; скористайтеся ним.","r":"—"},"geen_terugwinning":{"t":"Одночасна потреба в теплоті та холоді без рекуперації","d":"Теплота від охолодження придатна цілий рік для гарячої води або для опалення інших зон. Система з рекуперацією тут майже завжди окуповується.","r":"—"},"koeltoren_legionella":{"t":"Мокра градирня — потрібен план контролю","d":"Мокра градирня енергетично вигідна і приносить із собою план контролю легіонели, а також увагу до розташування щодо повітрозабірників цієї будівлі та сусідів.","r":"Національне законодавство щодо легіонели"},"koudwater_te_koud":{"t":"Низька температура холодної води за променевого охолодження","d":"За подачі {t} °C променеве охолодження або бетонне ядро неможливо експлуатувати безпечно через конденсацію, до того ж втрачається можливість вільного охолодження. Розділіть контури: холодна вода для осушення, тепліша — для променевих поверхонь.","r":"—"},"aansluiting_te_klein":{"t":"Приєднаної електричної потужності недостатньо","d":"Орієнтовно одночасно {nodig} kW проти {beschikbaar} kW доступних. Збільшення потужності триває місяцями і іноді коштує більше за саму установку. Перевірте це до замовлення обладнання і з'ясуйте, чи можна розтягнути пік засобами регулювання.","r":"—"},"aansluiting_onbekend":{"t":"Приєднану електричну потужність не вказано","d":"Це найпоширеніший сюрприз проєкту з тепловим насосом. Запитайте доступну величину приєднання і складіть разом тепловий насос, доводчик, приготування гарячої води та можливу зарядну інфраструктуру для найхолоднішої години року.","r":"—"},"propaan_binnen":{"t":"Пропан (R290) за встановлення всередині","d":"R290 сильно горючий і важчий за повітря: він опускається до нижче розташованих приміщень. Запитайте масу заправки, мінімальний розмір приміщення, вимоги до вентиляції та відстань до підвалів, приямків і отворів — і зробіть це до того, як зафіксуєте місце встановлення.","r":"EN 378; IEC 60335-2-40"},"geluidseis_onbekend":{"t":"Вимогу щодо шуму не задано","d":"Шум зовнішніх блоків — найпоширеніша скарга на теплові насоси і найпоширеніша причина примусових заходів. Знайдіть застосовне граничне значення в точці оцінювання і зверніть увагу на нічне значення — саме вночі апарат і працює.","r":"Регіональні екологічні вимоги"},"geluid_dichtbij":{"t":"Зовнішній блок близько до точки оцінювання без жодних заходів","d":"На {d} m за вимоги {db} dB(A) якийсь захід майже напевно потрібен. Увага: нічний режим знижує шум І потужність, саме тоді, коли надворі найхолодніше — прорахуйте, чи витримає це будівля.","r":"—"},"condens_buitendeel":{"t":"Відведення конденсату від зовнішнього блока не вирішено","d":"Повітряний тепловий насос у мороз утворює десятки літрів конденсату на добу. Без обігрівного відведення чи щебеневої засипки він примерзає під апаратом і на доріжці поруч — з ризиком падіння людей і заблокованим вентилятором.","r":"—"},"geen_octaafband":{"t":"Дані по октавних смугах не запитано","d":"Одного значення в dB(A) недостатньо для акустичного розрахунку і тим паче для низькочастотної складової, яка проходить крізь фасади і дратує найбільше.","r":"—"},"geen_vorstbeveiliging":{"t":"Захист від замерзання при відмові не врегульовано","d":"Що станеться при аварії в морозний період і хто отримає повідомлення? У будівлі з великою кількістю води в конструкції підлоги це не теоретичне питання.","r":"—"},"geen_rendementsmeting":{"t":"Немає одночасного обліку теплоти І електроенергії на джерелі теплоти","d":"Без обох лічильників фактичну сезонну ефективність встановити неможливо, і будь-яка суперечка про низькі показники не має розв'язку. Саме тому цих лічильників так часто немає — внесіть їх до опитувальника.","r":"—"},"hulpenergie_ongemeten":{"t":"Допоміжна енергія не вимірюється окремо","d":"Насоси, розморожування, електроніка та циркуляція сумуються і часто пояснюють різницю між обіцяною і виміряною ефективністю. Окремий лічильник коштує мало і переводить суперечку у площину фактів.","r":"—"},"geen_inregelrapport":{"t":"Звіт про гідравлічне балансування не вимагається","d":"Витрати по контурах, виміряні та записані. Без цього звіту неможливо довести, що установка здатна працювати на проєктному режимі, і ні в кого немає підстави це перевіряти.","r":"—"},"geen_nulmeting":{"t":"Немає вимірювання характеристик під час приймання","d":"Подача, зворот, витрата, спожита та віддана потужність за визначеного режиму роботи. Без нульового вимірювання згодом неможливо встановити, чи щось змінилося.","r":"—"},"geen_nameting":{"t":"Немає повторного вимірювання після першого опалювального сезону","d":"Фактична ефективність виявляється лише за цілий сезон. Домовленість про повернення для коригування опалювального графіка та налаштувань дає зазвичай від десяти до двадцяти відсотків економії — більше, ніж більшість рішень щодо вибору обладнання.","r":"—"},"scop_zonder_garantie":{"t":"Вимога до ефективності без гарантії характеристик","d":"Задана сезонна ефективність без узгоджених меж вимірювання, методики вимірювання та наслідків у разі недосягнення — це побажання, а не вимога. Зафіксуйте, що станеться, якщо її не буде досягнуто.","r":"—"},"doorlooptijd_boringen":{"t":"Терміни оформлення дозволу та виконання свердловин","d":"Ґрунтова енергія потребує дозволу, іноді тесту відгуку і завжди планування з буровою організацією. Ці терміни визначають планування частіше, ніж строк постачання обладнання. Починайте процедуру до замовлення.","r":"Законодавство про ґрунтову енергію"},"geen_selectierapport":{"t":"Звіт про підбір не вимагається разом із комерційною пропозицією","d":"Вимагайте характеристики за ВАШОЇ температури подачі, витрати та температури джерела. Саме цей один документ уперше робить пропозиції різних виробників порівнюваними — без нього ви порівнюєте проспекти.","r":"—"},"profiel_note":{"t":"На що звернути увагу для цього типу будівлі","d":"{note}","r":"{basis}"},"wand_niet_gedimensioneerd":{"t":"Стінове опалення тут не розраховується","d":"Стінове опалення позначене, але цей аркуш дімензіонує лише підлогове опалення. EN 1264-5 використовує для стін власні коефіцієнти, яких тут немає, тож тепловіддачу і температуру води визначайте окремо. Тримайте температуру поверхні нижче приблизно {max} °C і зважайте на розташування шаф і комунікацій.","r":"EN 1264-5"}},"mot":{"last":{"m":"Розрахункове навантаження","w":"Вихідна точка для всіх потужностей і для лінії будівлі, за якою визначають точку бівалентності.","d":"Опалення {kw} kW ({spec} W/m²), охолодження {kwK} kW; від {tOut} °C зовні до {tIn} °C усередині. Коефіцієнт тепловтрат {ua} kW/K.","n":"EN 12831"},"regime":{"m":"Температурний режим","w":"Наскрізна лінія: вона пов'язує тепловіддачу з виробництвом теплоти і визначає ефективність.","d":"{aan}/{ret} °C, перепад {dt} K, витрата води {debiet} m³/h.","n":"—"},"opwekker_wp":{"m":"Тепловий насос","w":"Виконання: {type}; вибір зроблено за зафіксованим вище режимом.","d":"Номінально {kw7} kW за A7/W35, за розрахункових умов ще {capOntwerp} kW. COP {copOntwerp} за розрахункових умов, сезонна оцінка {copSeizoen}. Точка бівалентності {biv} °C, покриття приблизно {dekking} % річної потреби в теплоті.","n":"EN 14511 / EN 14825"},"opwekker_overig":{"m":"Виробництво теплоти","w":"Виконання: {type}.","d":"Розрахункова потужність {kw} kW.","n":"—"},"bijstook":{"m":"Доводчик","w":"Покриває дефіцит нижче точки бівалентності; стратегія — {strategie}.","d":"Потрібно {kw} kW, виконання: {type}.","n":"—"},"afgifte_rad":{"m":"Тепловіддача — {type}","w":"За обраного режиму дає {pct} % номінальної потужності згідно з EN 442.","d":"Щоб покрити навантаження, потрібно приблизно {nodig} kW номінальної потужності.","n":"EN 442"},"afgifte_vloer":{"m":"Тепла підлога","w":"Базова тепловіддача на низькій температурі; обмежена допустимою температурою поверхні.","d":"Потрібно {nodig} W/m² з максимальних {max} W/m²; температура поверхні {opp} °C, потрібна температура води приблизно {tmed} °C за покриття з R = {r} m²K/W.","n":"EN 1264"},"afgifte_tabs":{"m":"Активація бетонного ядра","w":"Несе базове навантаження масою будівлі; повільна та саморегулівна.","d":"Потрібно {warm} W/m² теплоти з максимальних {maxWarm} і {koud} W/m² холоду з максимальних {maxKoud}.","n":"ISO 11855"},"sww":{"m":"Гаряче водопостачання","w":"Окрема система з власним, менш сприятливим температурним рівнем; виконання: {systeem}.","d":"{liter} l/добу за {t} °C, {kwh} kWh/добу і приблизно {jaar} kWh/рік. COP {cop}, тобто приблизно {elek} kWh електроенергії на рік.","n":"—"},"buffer":{"m":"Буфер","w":"Перекриває мінімальну тривалість роботи джерела теплоти і дає об'єм для розморожування.","d":"Рекомендовано {liter} літрів за мінімальної тривалості роботи {looptijd} хв; лише для розморожування вистачило б {ontdooi} літрів. Підключення — {mode}.","n":"—"},"expansie":{"m":"Розширювальний бак","w":"Сприймає розширення води і тримає тиск у робочому діапазоні.","d":"Приблизно {liter} літрів за водовмісту системи {volume} літрів.","n":"EN 12828"},"energie":{"m":"Річний баланс (орієнтовно)","w":"Порядок величин для порівняння варіантів, а не для взаєморозрахунків.","d":"Потреба в теплоті {warmte} kWh/рік; електроенергія на опалення {elek} kWh, на гарячу воду {swwElek} kWh, разом приблизно {totaal} kWh.","n":"Метод градусо-діб"}},"sec":{"project":{"title":"Проєкт і будівля","intro":"Що це за будівля, наскільки якісна її оболонка і хто нею користується? Якість оболонки визначає навантаження, а навантаження визначає, чи взагалі досяжний низькотемпературний режим."},"belasting":{"title":"Навантаження","intro":"Розрахункова потужність, а не потужність наявного котла. Котел майже завжди має надмірний запас; хто переносить це число у проєкт, купує тепловий насос на два розміри більший — і саме тому той погано модулює."},"afgifte":{"title":"Системи тепловіддачі","intro":"Те, що встановлено в приміщенні, визначає, яку температуру має забезпечити джерело теплоти, а не навпаки. Тому цей блок стоїть перед вибором теплового насоса. Розрахунок показує, скільки насправді ще віддає наявний радіатор за низького режиму."},"regime":{"title":"Температурний режим","intro":"Наскрізна лінія всього проєкту. Кожен градус нижчої температури подачі дає приблизно 2–3 % кращої ефективності теплового насоса — і коштує площі приладів тепловіддачі. Тут ви робите цей обмін явним, замість того щоб дозволити йому статися самому по собі."},"opwekking":{"title":"Виробництво теплоти","intro":"Лише тепер черга джерела теплоти, бо тепер уже відомо, яку температуру воно має забезпечувати. Завжди запитуйте характеристики саме для вашого режиму, а не за нормативних умов із проспекту."},"koude":{"title":"Виробництво холоду","intro":"Охолодження рідко буває окремою системою. Питання не лише в тому, звідки береться холод, а й у тому, куди подінеться теплота — і чи корисна вона десь в іншому місці будівлі."},"bivalentie":{"title":"Бівалентність, резерв і надійність","intro":"Тепловий насос, який самотужки покриває все розрахункове навантаження, решту року завеликий. Замалий — залишає будівлю холодною. Точка бівалентності — це місце, де ви робите цей вибір свідомо."},"sww":{"title":"Гаряче водопостачання","intro":"Складник, який найчастіше руйнує весь низькотемпературний проєкт. Опалення потребує 35 °C, гаряча вода — від 55 до 60 °C; той самий тепловий насос дає там майже вдвічі нижчу ефективність. Розглядайте це як окрему систему."},"hydraulica":{"title":"Гідравліка, буфер і водяний бік","intro":"Саме тут установки з тепловими насосами справді ламаються. Неправильно поставлене гідравлічне розділення або буфер не на своєму місці знищують перепад температур, а разом із ним і ефективність, при цьому ніщо не виглядає несправним."},"distributie":{"title":"Розподіл і зонування","intro":"Як енергія від джерела потрапляє до приміщення і де проходять межі відповідальності та обліку. У колективних установках це також юридичне питання, а не лише технічне."},"regeling":{"title":"Регулювання та керування","intro":"У котла регулювання виправляє помилки проєкту; у теплового насоса — збільшує їх. Віддавати повільно, тримати низько і дивитися наперед — ось суть."},"energie":{"title":"Енергія, облік і тарифи","intro":"Скільки насправді коштуватиме установка, залежить від тарифів і одночасності не менше, ніж від ефективності. Цей блок робить експлуатацію видимою поряд з інвестицією."},"opstelling":{"title":"Розміщення, шум і безпека","intro":"Де стоять апарати, визначає, чи взагалі можна їх там ставити. Шум зовнішніх блоків — найпоширеніша скарга на теплові насоси і найпоширеніша причина процедури примусового припинення."},"normen":{"title":"Норми, дозволи та підтримка","intro":"Що вимагає закон і що дозволяють фінанси. І перше, і друге має терміни оформлення, які визначають планування — частіше, ніж строк постачання обладнання."},"uitvoering":{"title":"Виконання, приймання та експлуатація","intro":"Установка з тепловим насосом, у якій не виконано гідравлічного балансування, ніколи не досягне своєї ефективності — і ніхто цього не помітить, бо тепло ж таки буде. Цей блок фіксує, як ви це все-таки помітите."}},"q":{"prj_name":{"label":"Назва проєкту"},"prj_client":{"label":"Замовник","help":"Хто вирішує щодо співвідношення інвестиції та експлуатаційних витрат? В інвестора, який здає об'єкт в оренду, ці дві статті лягають на різні сторони — і це змінює весь вибір."},"prj_location":{"label":"Населений пункт","help":"Визначає розрахункову температуру зовнішнього повітря, градусо-доби та доступність теплової мережі чи ґрунтової енергії."},"prj_ref":{"label":"Шифр"},"prj_author":{"label":"Склав"},"prj_date":{"label":"Дата"},"geb_type":{"label":"Тип будівлі","help":"Задає початкові значення для навантаження, режиму, одночасності та відповідь на питання, чи взагалі потрібне охолодження."},"prj_aard":{"label":"Характер проєкту","help":"Якщо замінюється лише джерело теплоти, система тепловіддачі вже задана, а разом із нею і режим. Це саме та ситуація, у якій тепловий насос на наявних радіаторах розчаровує — цей аркуш прораховує це за вас.","options":{"nieuwbouw":"Нове будівництво","renovatie":"Реконструкція з поліпшенням оболонки","vervanging":"Заміна джерела теплоти, наявні прилади тепловіддачі","uitbreiding":"Розширення"}},"geb_area":{"label":"Опалювана площа підлоги"},"geb_volume":{"label":"Опалюваний об'єм","help":"Для часу розігріву та для повітряних систем."},"geb_bouwjaar":{"label":"Рік побудови","help":"Груба ознака якості оболонки, коли розрахунку немає."},"geb_schil":{"label":"Якість оболонки будівлі","help":"Найважливіше запитання цього блоку. Погано утеплена оболонка потребує високої температури подачі, а саме там тепловий насос дає найменше. Утеплити перед заміною джерела теплоти майже завжди дешевший порядок дій.","options":{"passief":"Пасивна / дуже добре утеплена","goed":"Добра — недавнє нове будівництво","gemiddeld":"Середня — з додатковим утепленням","matig":"Посередня — утеплення обмежене","slecht":"Погана — без утеплення"}},"geb_luchtdicht":{"label":"Повітронепроникність (n50 або v50)","help":"За негерметичної оболонки інфільтраційне навантаження становить значну частку розрахункової потужності, і до того ж воно залежить від вітру — тобто не піддається регулюванню."},"geb_massa":{"label":"Теплова інерція (маса)","help":"Визначає, чи працюватиме повільне регулювання. Активація бетонного ядра потребує маси; у легкій будівлі з підвісною стелею вона не дає ефекту і є викинутими грошима.","options":{"zwaar":"Велика — бетон, відкритий","gemiddeld":"Середня","licht":"Мала — каркасна конструкція, підвісна стеля"}},"geb_gebruik":{"label":"Режим використання","help":"За сильно переривчастого використання повільна система на кшталт теплої підлоги або бетонного ядра непридатна: вона не встигає ані вчасно нагрітися, ані вчасно зупинитися.","options":{"continu":"Безперервно, 24/7","kantooruren":"Робочі години","onderbroken":"Сильно переривчасте","seizoen":"Сезонне"}},"geb_zones":{"label":"Кількість теплових зон","help":"Зони з різним заповненням, орієнтацією або вимогами. Кожна зона, яка хоче водночас опалюватися й охолоджуватися, штовхає вибір системи до чотиритрубної схеми або до теплового насоса з рекуперацією."},"geb_gelijktijdig":{"label":"Чи можуть зони одночасно опалюватися й охолоджуватися?","help":"Сонце з півдня і тінь з півночі, або серверна поряд з офісом. Якщо так, то двотрубна система із сезонним перемиканням недостатня, хоч якою вигідною вона здається.","options":{"ja":"Так","nee":"Ні"}},"bel_basis":{"label":"На чому ґрунтується потужність?","help":"Поприміщенний розрахунок за EN 12831 — єдина основа, на якій можна перевірити тепловіддачу в кожному приміщенні. Питомий показник годиться для першої оцінки; дані про споживання за три роки часто надійніші за розрахунок на хибних вихідних даних.","options":{"berekening":"Розрахунок тепловтрат по приміщеннях","opgegeven":"Задана сумарна потужність","specifiek":"Питомий показник на m² (орієнтовно)","verbruik":"Виведено з фактичного споживання"}},"bel_spec_heat":{"label":"Питома теплова потужність","help":"Пасивний будинок 10–20, недавнє нове будівництво 30–40, з додатковим утепленням 45–70, без утеплення 90–140 W/m². Використовуйте це лише для першої оцінки."},"bel_heat_kw":{"label":"Теплова потужність","help":"Без надбавки на розігрів; її ви вказуєте нижче окремо, щоб залишалося видно, звідки вона взялася."},"bel_opwarm":{"label":"Надбавка на розігрів після перерви","help":"За безперервної роботи — нуль. За щоденного нічного зниження у важкій будівлі надбавка може сягати 20–30 % — і тоді саме вона визначає всю потужність джерела теплоти. Розгляньте довший попередній прогрів замість більшої потужності."},"bel_cooling":{"label":"Чи передбачено охолодження?","options":{"ja":"Так","nee":"Ні"}},"bel_spec_cool":{"label":"Питома холодильна потужність","help":"Офіс зі звичайним склінням 40–60 W/m², з великою площею скла або високим внутрішнім навантаженням 70–100. Зовнішній сонцезахист знижує це значення сильніше, ніж будь-яка установка."},"bel_cool_kw":{"label":"Холодильна потужність"},"bel_latent":{"label":"Частка прихованого (латентного) холодильного навантаження","help":"Вирішальна для вибору системи. Променеве охолодження та бетонне ядро сприймають виключно явну теплоту; волога має відводитися деінде — зазвичай через систему обробки повітря. Хто про це забуває, отримує конденсат на стелі."},"bel_intern":{"label":"Внутрішні теплонадходження","help":"Люди, освітлення, обладнання. У сучасному офісі це часто домінантне холодильне навантаження, і вдень воно суттєво зменшує потребу в теплоті."},"bel_proces":{"label":"Технологічні або особливі навантаження","help":"Серверна, кухня, виробнича лінія, басейн. Часто це навантаження, які потребують охолодження цілий рік — а отже, є безкоштовним джерелом теплоти для решти будівлі."},"bel_gelijktijdigheid":{"label":"Коефіцієнт одночасності","help":"За багатьох квартир на одному джерелі теплоти можна рахувати менше, ніж суму пікових значень. Для однієї будівлі з однією зоною — ні: там пік справді настає всюди водночас."},"cnd_t_design":{"label":"Розрахункова температура зовнішнього повітря","help":"Для Бельгії зазвичай від −8 до −11 °C залежно від зони та маси будівлі. Разом із навантаженням визначає лінію будівлі, на якій знаходять точку бівалентності."},"cnd_t_room":{"label":"Температура приміщення, опалення"},"cnd_t_room_cool":{"label":"Температура приміщення, охолодження"},"cnd_dewpoint_room":{"label":"Найвища очікувана точка роси в приміщенні","help":"Нижня межа для будь-якої охолоджуваної поверхні. За 25 °C і 55 % відносної вологості точка роси лежить близько 15 °C — охолоджувальна стеля з подачею 16 °C стоїть до неї небезпечно близько. Без осушення променеве охолодження неможливо безпечно регулювати."},"cnd_degree_days":{"label":"Градусо-доби","help":"Для Бельгії зазвичай близько 2000 K·d, база 15/15. Лише для орієнтовної річної оцінки."},"afg_types":{"label":"Які системи тепловіддачі передбачені або наявні?","help":"Комбінації — це нормально: тепла підлога на базове навантаження і фанкойли на пік та на охолодження. Вкажіть усе, що буде, бо найнижчий спільний знаменник визначає режим усього контуру — якщо тільки ви не працюєте з розділеними групами та вузлами змішування.","options":{"vloer":"Тепла підлога","wand":"Настінне опалення","tabs":"Активація бетонного ядра","radiator":"Радіатори","convector":"Конвектори","vloerconvector":"Підлогові конвектори","ventilo":"Фанкойли (вентиляторні конвектори)","koelplafond":"Охолоджувальна стеля / кліматична стеля","balk":"Індукційні блоки / охолоджувальні балки","paneel":"Променеві панелі","luchtverwarmer":"Повітряне опалення через систему обробки повітря","vrf":"Внутрішні блоки VRF (безпосереднє випаровування)"}},"afg_bestaand":{"label":"Чи використовуються повторно наявні прилади тепловіддачі?","help":"Якщо так, складіть по приміщеннях перелік установленої номінальної потужності. Без цієї інвентаризації неможливо встановити, чи досяжний обраний режим, і будь-яка обіцянка щодо теплового насоса є здогадом.","options":{"nee":"Ні, все нове","deels":"Частково","ja":"Так, повністю"}},"afg_vloer_share":{"label":"Частка навантаження через теплу підлогу або настінне опалення"},"afg_vloer_coverage":{"label":"Доступна площа укладання","help":"Під вбудованими шафами, кухонними меблями та обладнанням трубу не кладуть. За 60 % доступної площі та сама теплота має пройти через менше квадратних метрів, тож температура води зростає — часто рівно настільки, щоб з'їсти всю перевагу теплового насоса."},"afg_vloer_r":{"label":"Термічний опір покриття підлоги","help":"Плитка приблизно 0,02, ламінат із підкладкою 0,10–0,15, килим до 0,20 m²K/W. Це найтихіший убивця проєктів: та сама тепла підлога під килимом потребує на десять градусів вищої температури води, ніж під плиткою. Зафіксуйте максимально допустимий опір у специфікації та доведіть його до забудовника."},"afg_vloer_spacing":{"label":"Крок укладання","help":"Менший крок знижує потрібну температуру води. 10 cm замість 15 cm дають кілька градусів і в новому будівництві коштують дешево; згодом змінити це вже неможливо."},"afg_tabs_share":{"label":"Частка навантаження через активацію бетонного ядра","help":"Бетонне ядро дає приблизно 30–40 W/m² теплоти і 40–50 W/m² холоду та реагує годинами, а не хвилинами. Воно покриває базове навантаження; пік і поприміщенне регулювання мають забезпечуватися швидшою системою."},"afg_koelplafond_share":{"label":"Частка холодильного навантаження через охолоджувальну стелю"},"afg_regelbaar":{"label":"Регулювання за приміщеннями","help":"У теплої підлоги та бетонного ядра поприміщенне регулювання працює лише повільно; надмірне регулювання призводить до перевищення температури та коливань. Для теплового насоса постійна циркуляція за низької, погодозалежно керованої температури зазвичай краща за вмикання-вимикання по приміщеннях.","options":{"thermostaat":"Кімнатний термостат на зону","kraan":"Термостатичні клапани","centraal":"Лише централізовано, погодозалежно","geen":"Індивідуального регулювання немає"}},"afg_meting":{"label":"Чи проінвентаризовано наявні прилади тепловіддачі по приміщеннях?","help":"Тип, розміри та номінальна потужність кожного приладу. Це та робота, якої ніхто не хоче робити і яка визначає різницю між установкою, що працює, і тією, що не працює.","options":{"ja":"Так","nee":"Ні"}},"reg_t_flow":{"label":"Температура подачі в режимі опалення за розрахункових умов","help":"Тепла підлога 30–38, бетонне ядро 26–32, нові радіатори 45–55, наявні радіатори часто 70–80 °C. Це число вирішує, які джерела теплоти взагалі залишаються можливими."},"reg_t_return":{"label":"Температура зворотної лінії, опалення","help":"Перепад температур визначає витрату води, а отже, діаметри трубопроводів і енергію на перекачування. Тепловий насос зазвичай працює з перепадом 5 K, котел — 20 K; це вчетверо більша витрата і суттєва різниця в підборі трубопроводів."},"reg_weersafhankelijk":{"label":"Погодозалежне регулювання температури подачі?","help":"Практично безкоштовний приріст ефективності: за 7 °C зовні достатньо подачі, значно нижчої, ніж за −8 °C. Без опалювального графіка установка весь сезон працює на розрахунковому значенні, і тепловий насос втрачає велику частину своєї переваги.","options":{"ja":"Так","nee":"Ні"}},"reg_t_flow_cool":{"label":"Температура подачі, охолодження","help":"Фанкойли з осушенням 6–8 °C, променеве охолодження та бетонне ядро 16–18 °C. Висока температура холодної води робить можливими вільне охолодження та добру роботу холодильної машини, але виключає осушення — це вибір системи, а не налаштування."},"reg_t_return_cool":{"label":"Температура зворотної лінії, охолодження"},"reg_glycol_pct":{"label":"Вміст гліколю","help":"Гліколь знижує теплоємність і підвищує в'язкість: за 30 % це приблизно на 10 % більша витрата і значно більша енергія на перекачування для тієї самої потужності. Застосовуйте його лише там, де мороз справді можливий, і тоді гідравлічно відокремте цей контур."},"reg_menggroepen":{"label":"Вузли змішування для різних режимів?","help":"Потрібні, щойно тепла підлога та радіатори живляться від одного джерела теплоти. Увага: тоді джерело має видавати НАЙВИЩУ температуру, а вузол змішування знижує її локально — отже, ефективність іде за радіаторами, а не за підлогою. Зважте, чи не можна замінити самі радіатори.","options":{"ja":"Так","nee":"Ні"}},"reg_dt_marge":{"label":"Зафіксувати режим у договорі з точками вимірювання?","help":"Подача, зворотна лінія та перепад за розрахункових умов, з вимірюванням під час приймання. Без такої домовленості режим під час виконання тихо повзе вгору, а потім ніхто не відповідає за низьку ефективність.","options":{"ja":"Так","nee":"Ні"}},"opw_type":{"label":"Тип джерела теплоти","help":"Ґрунтові системи цілий рік мають стабільне джерело і тому набагато рівнішу ефективність, але потребують дозволу, місця та значно більших інвестицій. Повітря-вода простіше, і його найслабший момент настає саме в мороз — тобто тоді, коли будівля потребує найбільше.","options":{"lucht_water":"Тепловий насос повітря-вода","grond_boring":"Тепловий насос ґрунт-вода — вертикальні свердловини","grond_horizontaal":"Тепловий насос ґрунт-вода — горизонтальний колектор","water_water":"Тепловий насос вода-вода — ґрунтові або поверхневі води","afvoerlucht":"Тепловий насос на витяжному повітрі","lucht_lucht":"Тепловий насос повітря-повітря","hybride":"Гібридна система — тепловий насос із котлом","gasketel":"Газовий котел, конденсаційний","elektrisch":"Електричне резистивне опалення","warmtenet":"Теплова мережа / централізоване теплопостачання","wkk":"Когенераційна установка","biomassa":"Котел на біомасі","zon_thermisch":"Сонячні колектори (додатково)"}},"opw_hp_kw":{"label":"Потужність теплового насоса за A7/W35","help":"Виробники подають потужність за сприятливих умов. Запитуйте повну таблицю: потужність І COP за A−7/W45, A2/W35, A7/W35 та за вашої власної температури подачі. Різниця між цими точками більша, ніж дає зрозуміти більшість комерційних пропозицій."},"opw_source_t":{"label":"Температура джерела за розрахункових умов","help":"Для повітря це розрахункова температура зовнішнього повітря. Для ґрунту зазвичай від 0 до 5 °C, для ґрунтових вод — від 10 до 12 °C. Залиште порожнім, щоб вивести значення з типу джерела."},"opw_modulatie":{"label":"Регулювання потужності","help":"Запитуйте мінімальну модульовану потужність, а не лише максимум. Тепловий насос, який не може опуститися нижче 40 % своєї потужності, навесні та восени почне тактувати — це коштує ефективності та ресурсу, і буфером це можна лише пом'якшити, а не усунути.","options":{"inverter":"Плавне (інвертор)","stappen":"Кілька ступенів","aan_uit":"Увімкнено/вимкнено"}},"opw_koudemiddel":{"label":"Холодоагент","help":"Регламент про F-гази витискає з ринку холодоагенти з високим GWP; тому R290 фактично став стандартом для менших теплових насосів. Пропан сильно горючий: це висуває вимоги до місця встановлення, до відстаней від отворів і до підвалу чи приямка, куди міг би опуститися газ у разі витоку.","options":{"R290":"R290 пропан (A3)","R32":"R32 (A2L)","R454C":"R-454C (A2L)","R1234ze":"R-1234ze (A2L)","R744":"R-744 CO₂","R410A":"R-410A (A1)"}},"opw_max_temp":{"label":"Максимальна температура подачі теплового насоса","help":"Переконайтеся, що це значення досягається і за найнижчої температури джерела — багато апаратів дають свій максимум лише за м'яких зовнішніх температур, а це саме не той момент, коли він вам потрібен."},"opw_bron_detail":{"label":"Дані про джерело","help":"Кількість і глибина свердловин, або площа горизонтального колектора, або витрата й температура ґрунтових вод. Для більших об'єктів запитуйте також тепловий тест відгуку та річний баланс між відбором і поверненням теплоти — ґрунт, з якого лише тягнуть, за роки вихолоджується, і ефективність падає разом із ним."},"opw_regeneratie":{"label":"Чи передбачено регенерацію ґрунтового масиву?","help":"Пасивне охолодження влітку знову заряджає ґрунт і дає майже безкоштовний холод. Це найсильніший аргумент на користь ґрунтової енергії — і про нього часто забувають у комерційній пропозиції.","options":{"ja":"Так","nee":"Ні"}},"opw_warmtenet_detail":{"label":"Умови теплової мережі","help":"Температура подачі, гарантована температура зворотної лінії, штрафи за завищений зворот, приєднана потужність і структура тарифу. Максимально допустима температура зворотної лінії — жорстка гранична умова: вона визначає весь ваш проєкт тепловіддачі і вона вимірюється."},"opw_bestaand":{"label":"Наявне джерело теплоти, яке залишається або виводиться з експлуатації","help":"У разі поетапної заміни: що залишається, як воно гідравлічно вбудовується і хто керує переходом?"},"kou_type":{"label":"Джерело холоду","help":"Пасивне охолодження від ґрунту споживає лише енергію насосів і водночас заряджає ґрунт на зиму. Воно дає обмежену потужність за високої температури води — саме те, що пасує бетонному ядру та охолоджувальній стелі, і непридатне для осушення.","options":{"reversibel":"Реверсивний тепловий насос","chiller":"Окрема холодильна машина","passief_bodem":"Пасивне охолодження від ґрунту","vrije_koeling":"Вільне охолодження із сухим охолоджувачем","vrf":"VRF із рекуперацією теплоти","adiabatisch":"Адіабатичне охолодження","warmtenet_koude":"Мережа холодопостачання","geen":"Активного охолодження немає"}},"kou_terugwinning":{"label":"Одночасне опалення й охолодження з рекуперацією?","help":"У будівлі із серверною, кухнею або орієнтацією північ-південь теплота від охолодження придатна для гарячого водопостачання чи опалення цілий рік. Це потребує чотиритрубної системи або теплового насоса з рекуперацією і майже завжди окуповується.","options":{"ja":"Так","nee":"Ні"}},"kou_condensor":{"label":"Відведення теплоти від холодильної машини","help":"Мокра градирня енергетично найвигідніша і приносить із собою план контролю легіонели, а також увагу до розташування щодо повітрозабірників. Скидання теплоти в ґрунт майже завжди найкращий варіант, коли свердловини вже й так є.","options":{"lucht":"З повітряним охолодженням","droog":"Сухий охолоджувач із гліколем","adiabatisch_cond":"З адіабатичним доохолодженням","nat":"Мокра градирня","bodem":"У ґрунт","water":"У поверхневі або ґрунтові води"}},"kou_vrije_koeling":{"label":"Вільне охолодження за низької зовнішньої температури?","help":"За режиму охолодження 16/18 °C вільне охолодження в наших широтах можливе значну частину року. Це найсильніший аргумент, щоб задати високий режим охолодження — і працює він лише тоді, коли система тепловіддачі до цього пасує.","options":{"ja":"Так","nee":"Ні"}},"kou_ontvochtiging":{"label":"Де відбувається осушення?","help":"Питання, яке вирішує долю променевого охолодження. Без осушення деінде охолоджувальна стеля чи бетонне ядро ніколи не зможуть опуститися нижче точки роси, тож регулювання змушене обмежувати температуру поверхні — із втратою потужності саме в найтепліші й найвологіші дні.","options":{"lucht":"У системі обробки повітря","ventilo":"У фанкойлах","geen":"Ніде — активного осушення немає"}},"biv_strategie":{"label":"Стратегія бівалентності","help":"Паралельна тримає тепловий насос у роботі й дозволяє доводчику покривати лише дефіцит; альтернативна вимикає його повністю. За газового котла як доводчика альтернативна іноді дешевша в експлуатації, за електричного доводчика — практично ніколи.","options":{"monovalent":"Моновалентна — тепловий насос покриває все","parallel":"Бівалентна паралельна — доводчик поряд із тепловим насосом","alternatief":"Бівалентна альтернативна — перемикання на котел","deels_parallel":"Частково паралельна, далі перемикання"}},"biv_backup":{"label":"Тип доводчика","help":"Електричний доводчик дешевий у придбанні й дорогий в експлуатації: кожна кіловат-година коштує однієї кіловат-години, тоді як тепловий насос дає три-п'ять. Запитайте, скільки годин на рік він має працювати, і прорахуйте це — часто виявляється, що трохи більший тепловий насос дешевший.","options":{"geen":"Немає","elektrisch":"Електричний нагрівач","gasketel":"Газовий котел","warmtenet":"Теплова мережа","tweede_wp":"Другий тепловий насос"}},"biv_punt":{"label":"Бажана точка бівалентності","help":"За −5 °C тепловий насос зазвичай покриває понад 90 % річної потреби в теплоті, хоча може бути значно меншим за розрахункове навантаження. Цей аркуш обчислює фактичну точку з ваших власних даних і показує її поряд із цим побажанням."},"biv_redundantie":{"label":"Потрібний рівень надійності при відмові","help":"Для житла чи офісу потрібен рідко, для закладу охорони здоров'я, центру обробки даних або технологічного процесу це жорстка вимога. Кілька менших апаратів дають і резервування, і кращу роботу на частковому навантаженні — часто це кращий вибір, ніж один великий.","options":{"geen":"Немає — відмова прийнятна","gedeeltelijk":"Частина потужності має залишитися","volledig":"Повне резервування (n+1)"}},"biv_vorstbeveiliging":{"label":"Чи врегульовано захист будівлі від замерзання при відмові?","help":"Що станеться при аварії в морозний період і хто про це дізнається? У будівлі з теплою підлогою і великою кількістю води в конструкції це не теоретичне питання.","options":{"ja":"Так","nee":"Ні"}},"biv_smart_grid":{"label":"Чи можливе керування за навантаженням мережі або тарифом?","help":"Години блокування від оператора мережі, динамічні тарифи або власна сонячна електроенергія. Це потребує акумулювальної здатності в буфері чи в масі будівлі та регулювання, здатного дивитися наперед. За активації бетонного ядра ця маса вже є, і безкоштовно.","options":{"ja":"Так","nee":"Ні"}},"dhw_aanwezig":{"label":"Чи готує ця установка гарячу воду для ГВП?","options":{"ja":"Так","nee":"Ні"}},"dhw_persons":{"label":"Кількість осіб або точок водорозбору"},"dhw_l_person":{"label":"Споживання на особу за добу","help":"Житло 35–50 l на особу за 55 °C, офіс значно менше, спортивна споруда та заклад охорони здоров'я — значно більше й із різким піком."},"dhw_profiel":{"label":"Профіль водорозбору","help":"Пік визначає об'єм, добове споживання визначає потужність. У спортивній споруді визначальним є пік, і запас води дешевший за потужність.","options":{"woning":"Житло — ранковий і вечірній пік","kantoor":"Офіс — низьке й рівномірне","sport":"Спорт — короткий дуже високий пік","zorg":"Охорона здоров'я — високе й безперервне","horeca":"Заклад харчування / кухня"}},"dhw_t_store":{"label":"Температура зберігання","help":"Кожен градус вище коштує ефективності теплового насоса. Проточний апарат або станція приготування ГВП проточного типу може обійтися нижчою температурою запасу, бо застояної гарячої води немає — це часто найелегантніше розв'язання питання легіонели."},"dhw_t_cold":{"label":"Температура холодної води"},"dhw_systeem":{"label":"Система","help":"Станція приготування ГВП проточного типу готує воду на вимогу і не тримає гарячу воду в запасі; це зменшує ризик легіонели й дозволяє нижчу температуру буфера. Недолік — висока пікова потреба в цей момент: її має витримати буфер або теплообмінник.","options":{"boiler":"Бак-накопичувач зі змійовиком","verswater":"Станція приготування ГВП проточного типу","laadsysteem":"Зарядна система із зовнішнім теплообмінником","decentraal":"Децентралізовано, на квартиру або точку водорозбору","elektrisch_boiler":"Електричний бойлер"}},"dhw_legionella":{"label":"Контроль легіонели","help":"Термічна дезінфекція потребує періодичних 60 °C або вище в усій установці, включно з циркуляційним трубопроводом. Саме тоді вмикається електричний доводчик: запитайте, скільки енергії це коштує на рік, бо це часто більше, ніж очікують.","options":{"thermisch":"Періодична термічна дезінфекція","doorstroom":"Проточний принцип, без запасу","temperatuur":"Постійне підтримання температури","alternatief":"Альтернативна технологія"}},"dhw_circulatie":{"label":"Чи є циркуляційний трубопровід?","help":"Циркуляційний трубопровід тримає гарячу воду напоготові й при цьому безперервно втрачає теплоту — за поганої ізоляції ця втрата може бути більшою за корисне споживання. Ізолюйте потужно і, де можливо, вмикайте за розкладом або на вимогу.","options":{"ja":"Так","nee":"Ні"}},"dhw_voorrang":{"label":"Пріоритет гарячої води над опаленням?","help":"Річ звична і рідко проблемна, але зафіксуйте, як довго опалення може бути відсутнім. За активації бетонного ядра цього ніхто не помітить; за повітряного опалення — уже за десять хвилин.","options":{"ja":"Так","nee":"Ні"}},"dhw_zon":{"label":"Використовувати геліоколектори або надлишок PV?","help":"Гаряча вода — найпростіший накопичувач для власної сонячної електроенергії, бо потреба в ній існує const LANG_PL = {"code":"pl","name":"Polski","prof":{"woning_nieuw":{"label":"Mieszkanie — nowy budynek","note":"Tutaj wszystko się układa: dobra obudowa, ogrzewanie podłogowe, niski reżim. Uwaga skupia się na ciepłej wodzie użytkowej — w nowoczesnym domu stanowi ona połowę rocznego zapotrzebowania na ciepło i działa w znacznie gorszej temperaturze niż ogrzewanie.","basis":"EPB, nowy budynek; EN 12831"},"woning_renovatie":{"label":"Mieszkanie — remont","note":"Najbardziej niewygodna i najczęstsza kategoria. Istniejące grzejniki zostały wybrane do 75/65, a przy 45/40 nadal zapewniają tylko około jednej trzeciej deklarowanej wydajności. Sprawdź, co jest zamontowane w każdym pomieszczeniu, oblicz, co wychodzi przy założonym reżimie i wymień dokładnie te elementy, które nie spełniają oczekiwań — to prawie zawsze tańsze niż większa pompa ciepła lub wyższy reżim.","basis":"EN 12831; istniejące odbiorniki do zbadania"},"appartement_collectief":{"label":"Budynek wielorodzinny","note":"W tym przypadku o wydajności decyduje produkcja ciepłej wody użytkowej i obieg cyrkulacyjny, a nie ogrzewanie. Wspólna rura utrzymywana w temperaturze 60°C przez cały rok stale traci ciepło; moduły natychmiastowej ciepłej wody użytkowej na mieszkanie w sieci źródeł o temperaturze 40°C rozwiązują zarówno problem legionelli, jak i problem wydajności.","basis":"EPB; opomiarowanie na jednostkę"},"kantoor_nieuw":{"label":"Biuro — nowy budynek","note":"Termicznie aktywowany system budynku i energią gruntu stanowi tutaj silne połączenie: latem grunt zapewnia pasywne chłodzenie i jest w tym procesie doładowywany na zimę. Warunkiem jest masa w budynku i sterowanie końcowe, które obsługuje szczytowe obciążenie — sama aktywacja termiczna konstrukcji nie zaspokaja szczytowego obciążenia i nie kontroluje poszczególnych pomieszczeń.","basis":"EN 16798-1; EPB"},"kantoor_renovatie":{"label":"Biuro — remont","note":"Zwróć uwagę na strefy, które mają być ogrzewane i chłodzone jednocześnie: południowa fasada jest nasłoneczniona, podczas gdy północna nadal potrzebuje ciepła. System dwururowy z sezonowym przełączaniem uniemożliwia to i powoduje skargi w okresie przejściowym.","basis":"EN 16798-1"},"school":{"label":"Szkoła","note":"Wyraźnie przerywane użytkowanie w okresie świątecznym: w tym przypadku o mocy generatora decyduje czas nagrzewania, a nie obciążenie projektowe. Optymalny start z systemem sterowania, który uczy się czasu nagrzewania, jest tańszy niż dodatkowe kilowaty — a wolne odbiorniki, takie jak aktywacja termiczna konstrukcji, nie pasują do tego schematu.","basis":"EN 16798-1; Wytyczne dla sektora edukacji"},"zorg":{"label":"Placówka opieki","note":"Dominuje ciepła woda użytkowa: wysokie zużycie, ciągła, z pętlą cyrkulacyjną i ścisłym reżimem legionelli przy 60°C. Traktuj ją jako osobną instalację z własnym wytwarzaniem lub własnym stopniem wysokotemperaturowym, w przeciwnym razie obniża to wydajność całego systemu grzewczego.","basis":"EN 16798-1; wytyczne dotyczące opieki zdrowotnej; przepisy dotyczące legionelli"},"winkel":{"label":"Sklep / handel detaliczny","note":"Wysokie zyski wewnętrzne z oświetlenia i odwiedzających: tutaj chłodzenie jest często potrzebne przez cały rok, a ogrzewanie tylko przed otwarciem. Tam, gdzie znajdują się również witryny chłodnicze, ich ciepło skraplacza stanowi bezpłatne źródło ciepła dla sklepu — ogniwo, które prawie zawsze jest pomijane.","basis":"EN 16798-1"},"sport":{"label":"Obiekt sportowy","note":"Obowiązuje szczyt prysznica, który trwa dwadzieścia minut. Magazynowanie jest tutaj znacznie tańsze niż produkcja: duży zbiornik, ładowany stale przez cały dzień, jest lepszy od dużej pompy ciepła, która musi dostarczać wszystko na raz trzy razy w tygodniu.","basis":"EN 16798-1"},"zwembad_geb":{"label":"Basen","note":"Trzy zapotrzebowania na ciepło jednocześnie: woda w basenie, ogrzewanie pomieszczeń i woda z prysznica, każde o innej temperaturze. Największą stratą jest parowanie z powierzchni wody, a pierwszym rozwiązaniem jest osłona poza godzinami otwarcia — to lepsze niż jakakolwiek interwencja ze strony instalacji.","basis":"VDI 2089"},"industrie_hal":{"label":"Hala przemysłowa","note":"Panele promiennikowe ogrzewają ludzi i powierzchnie robocze zamiast powietrza pod dachem, a w wysokiej hali ma to istotne znaczenie. Wymagają one wyższej temperatury zasilania niż ogrzewanie podłogowe — trzeba to świadomie wybrać.","basis":"Ogrzewanie procesowe; EN 12831"},"proces_restwarmte":{"label":"Proces z wykorzystaniem ciepła odpadowego","note":"W przypadku konieczności chłodzenia procesu przez cały rok, dostępne jest już źródło ciepła o stałej temperaturze — znacznie korzystniejsze niż powietrze zewnętrzne i bez sezonowych wahań. Najpierw zmapuj poziomy temperatury i zbieżność, zanim spojrzysz na zewnątrz.","basis":"Odzysk ciepła z procesów"},"datacenter_geb":{"label":"Centrum danych / serwerownia","note":"Tylko chłodzenie, przez cały rok, z dostępnością przewyższającą efektywność. Wysoki reżim chłodzenia umożliwia swobodne chłodzenie przez większą część roku, a ciepło odpadowe o temperaturze powrotu 26°C można wykorzystać w sąsiednim budynku lub do podgrzania wody użytkowej za pomocą pompy ciepła.","basis":"ASHRAE TC 9.9"}},"ui":{"appTitle":"Dobór systemu ogrzewania i chłodzenia","appSubtitle":"Od źródła do odbiorników — parametry temperaturowe jako wspólny wątek","step":"Krok","of":"z","next":"Następny","prev":"Poprzedni","report":"Raport","print":"Raport / PDF","save":"Zapisz","load":"Otwórz","reset":"Wyczyść","demo":"Przykład","required":"wymagane","why":"Dlaczego zadano to pytanie","kpiHeat":"Moc grzewcza","kpiCool":"Moc chłodnicza","kpiRegime":"Reżim ogrzewania","kpiFlowRate":"Przepływ wody, ogrzewanie","kpiCop":"COP w warunkach projektowych","kpiScop":"Sprawność sezonowa (szacunek)","kpiBivalent":"Punkt biwalentny","kpiCoverage":"Pokrycie zapotrzebowania przez pompę ciepła","kpiBackup":"Wymagana moc źródła szczytowego","kpiBuffer":"Zalecana objętość buforowa","kpiExpansion":"Naczyni
