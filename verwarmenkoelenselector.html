<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-09-10.report-profile-1","id":"verwarmenkoelenselector","file":"verwarmenkoelenselector.html","listed":true,"category":"hvac","order":32,"title":{"en":"Heating & Cooling System Selector","uk":"Вибір системи опалення та охолодження","de":"Auswahlhilfe Heizen und Kühlen","nl":"Uitvraag verwarmen en koelen — systeemkeuze","fr":"Choix du système de chauffage et de refroidissement","es":"Selección del sistema de calefacción y refrigeración","pl":"Dobór systemu ogrzewania i chłodzenia"},"summary":{"en":"Choose a temperature regime and see what the emitters still deliver.","uk":"Оберіть температурний режим і подивіться, скільки насправді віддають прилади.","de":"Wählen Sie ein Temperaturniveau und sehen Sie, was die Heizflächen noch abgeben.","nl":"Kies een temperatuurregime en zie wat de afgifte werkelijk nog is.","fr":"Choisissez un régime de température et voyez ce que les émetteurs délivrent réellement.","es":"Elija un régimen de temperatura y vea lo que los emisores entregan realmente.","pl":"Wybierz parametry temperaturowe i sprawdź, jaką moc nadal oddają odbiorniki."},"description":{"en":"Choose a temperature regime and see what the emitters still deliver. Radiators and convectors are derated from their EN 442 rating at 75/65/20 through the (ΔT/49.83)ⁿ law, with the logarithmic mean excess temperature the standard prescribes; floor heating follows the EN 1264 basic characteristic q = 8.92·ΔΘ^1.1 with the 29/35/33 °C surface caps, and cooled ceilings are checked against an indicative maximum and the room dew point. Wall heating is deliberately not dimensioned — EN 1264-5 uses coefficients this tool does not carry — and says so. On the generator side a Carnot heat pump with a per-source quality factor, defrost penalty and capacity derating gives the bivalent point, the back-up size and the seasonal coverage, together with buffer and expansion volumes, flow rates, domestic hot water and a degree-day annual balance. Sixty-seven rules block, warn or advise — including when an existing radiator no longer reaches 45 % of its rating.","nl":"Kies een temperatuurregime en zie wat de afgifte werkelijk nog is. Radiatoren en convectoren worden vanaf hun EN 442-nominaal bij 75/65/20 gecorrigeerd met de wet (ΔT/49,83)ⁿ, met het logaritmisch gemiddelde temperatuurverschil dat de norm voorschrijft; vloerverwarming volgt de EN 1264-basiskennlijn q = 8,92·ΔΘ^1,1 met de oppervlaktegrenzen 29/35/33 °C, en koelplafonds worden getoetst aan een indicatief maximum en het dauwpunt in de ruimte. Wandverwarming wordt bewust niet gedimensioneerd — EN 1264-5 gebruikt kengetallen die dit blad niet bevat — en dat wordt ook gemeld. Aan de opwekkingszijde geeft een Carnot-warmtepomp met een kwaliteitsfactor per bron, ontdooiaftrek en capaciteitsderating het bivalentiepunt, het benodigde back-upvermogen en de seizoensdekking, samen met buffer- en expansievolume, debieten, sanitair warm water en een jaarbalans op graaddagen. Zevenenzestig regels blokkeren, waarschuwen of adviseren — onder meer wanneer een bestaande radiator nog geen 45 % van zijn nominaal haalt.","de":"Wählen Sie ein Temperaturniveau und sehen Sie, was die Heizflächen noch abgeben. Radiatoren und Konvektoren werden von ihrer EN-442-Nennleistung bei 75/65/20 über das Gesetz (ΔT/49,83)ⁿ abgemindert, mit der logarithmischen mittleren Übertemperatur, die die Norm vorschreibt; die Fußbodenheizung folgt der EN-1264-Basiskennlinie q = 8,92·ΔΘ^1,1 mit den Oberflächengrenzen 29/35/33 °C, Kühldecken werden gegen ein indikatives Maximum und den Raumtaupunkt geprüft. Wandheizung wird bewusst nicht ausgelegt — EN 1264-5 verwendet Kennwerte, die dieses Blatt nicht enthält — und sagt das auch. Auf der Erzeugerseite liefert eine Carnot-Wärmepumpe mit quellenabhängiger Gütezahl, Abtauabschlag und Leistungsminderung den Bivalenzpunkt, die erforderliche Nachheizleistung und den Deckungsgrad, dazu Puffer- und Ausdehnungsvolumen, Volumenströme, Trinkwarmwasser und eine Jahresbilanz nach Gradtagen. 67 Regeln sperren, warnen oder empfehlen — etwa wenn ein vorhandener Radiator keine 45 % seiner Nennleistung mehr erreicht.","fr":"Choisissez un régime de température et voyez ce que les émetteurs délivrent réellement. Radiateurs et convecteurs sont corrigés depuis leur puissance nominale EN 442 à 75/65/20 par la loi (ΔT/49,83)ⁿ, avec l'écart de température logarithmique moyen que la norme prescrit ; le plancher chauffant suit la courbe de base EN 1264 q = 8,92·ΔΘ^1,1 avec les plafonds de surface 29/35/33 °C, et les plafonds rafraîchissants sont contrôlés face à un maximum indicatif et au point de rosée du local. Le chauffage mural n'est délibérément pas dimensionné — l'EN 1264-5 utilise des coefficients absents de cette feuille — et l'outil le signale. Côté production, une pompe à chaleur de Carnot affectée d'un facteur de qualité par source, d'une pénalité de dégivrage et d'un déclassement en puissance donne le point de bivalence, la puissance d'appoint et le taux de couverture saisonnier, avec les volumes de ballon tampon et de vase d'expansion, les débits, l'eau chaude sanitaire et un bilan annuel en degrés-jours. Soixante-sept règles bloquent, alertent ou conseillent — notamment lorsqu'un radiateur existant n'atteint plus 45 % de sa puissance nominale.","uk":"Оберіть температурний режим і подивіться, скільки насправді віддають прилади. Радіатори та конвектори перераховуються з номіналу за EN 442 при 75/65/20 за законом (ΔT/49,83)ⁿ із логарифмічним середнім надлишком температури, який приписує норма; підлогове опалення йде за базовою характеристикою EN 1264 q = 8,92·ΔΘ^1,1 з обмеженнями поверхні 29/35/33 °C, а охолоджувальні стелі перевіряються за орієнтовним максимумом і точкою роси в приміщенні. Стінове опалення свідомо не дімензіонується — EN 1264-5 використовує коефіцієнти, яких тут немає — і про це повідомляється. З боку джерела теплоти карнотівська модель теплового насоса з коефіцієнтом якості за типом джерела, штрафом на розморожування та зниженням потужності дає точку бівалентності, потрібну потужність резерву й сезонне покриття, а також об’єми буфера та розширювального бака, витрати, гаряче водопостачання і річний баланс за градусо-добами. Шістдесят сім правил блокують, попереджають або радять — зокрема коли наявний радіатор уже не дає 45 % номіналу.","es":"Elija un régimen de temperatura y vea lo que los emisores entregan realmente. Radiadores y convectores se corrigen desde su potencia nominal EN 442 a 75/65/20 mediante la ley (ΔT/49,83)ⁿ, con la diferencia media logarítmica de temperatura que prescribe la norma; el suelo radiante sigue la curva básica EN 1264 q = 8,92·ΔΘ^1,1 con los topes de superficie 29/35/33 °C, y los techos refrescantes se contrastan con un máximo indicativo y el punto de rocío del local. La calefacción mural no se dimensiona deliberadamente — la EN 1264-5 usa coeficientes que esta hoja no incorpora — y así se indica. En el lado de la generación, una bomba de calor de Carnot con factor de calidad por fuente, penalización por desescarche y merma de potencia da el punto de bivalencia, la potencia de apoyo y la cobertura estacional, junto con los volúmenes de inercia y de expansión, los caudales, el agua caliente sanitaria y un balance anual por grados-día. Sesenta y siete reglas bloquean, advierten o aconsejan — entre ellas, cuando un radiador existente ya no alcanza el 45 % de su potencia nominal.","pl":"Wybierz parametry temperaturowe i sprawdź rzeczywistą moc odbiorników. Grzejniki i konwektory są przeliczane z mocy znamionowej EN 442 dla 75/65/20 według zależności (ΔT/49,83)ⁿ z logarytmiczną średnią nadwyżką temperatury; ogrzewanie podłogowe korzysta z podstawowej charakterystyki EN 1264 q = 8,92·ΔΘ^1,1 i ograniczeń temperatury powierzchni 29/35/33 °C, a sufity chłodzące są sprawdzane względem orientacyjnej mocy maksymalnej i punktu rosy. Ogrzewanie ścienne celowo nie jest wymiarowane, ponieważ EN 1264-5 wymaga współczynników, których narzędzie nie zawiera. Po stronie źródła model pompy ciepła oparty na cyklu Carnota, współczynniku jakości zależnym od źródła, korekcie odszraniania i spadku mocy wyznacza punkt biwalentny, moc źródła szczytowego i pokrycie sezonowe, a także objętość bufora i naczynia wzbiorczego, przepływy, ciepłą wodę użytkową oraz roczny bilans stopniodniowy. 67 reguł blokuje, ostrzega lub wskazuje ryzyka projektowe."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Steady-state design sizing. The load is entered by the user or taken from a W/m² rule of thumb rather than computed room by room to EN 12831; emitter output is a generic per-type exponent (1.30 radiator, 1.35 convector, 1.25 radiant panel, 1.00 fan coil) applied to the EN 442 nominal rating with the logarithmic mean excess temperature, with no per-model data, valve authority or enclosure effects — and no correction for the up to about 10 % deviation the EN 442 logarithmic conversion is known to show at strongly reduced mass flow and increased spread (REHVA, 2022). Floor heating uses the EN 1264 basic characteristic curve and surface caps, not the full EN 1264-2 product-coefficient method, so the mean water temperature is a series-resistance simplification; wall heating is not dimensioned at all, and cooled ceilings and concrete core activation use indicative maxima rather than EN 1264-5. Heat pump performance is Carnot times a fixed quality factor rather than interpolated EN 14511 capacity tables, defrost is a blanket coefficient, and the seasonal figure is a fixed blend of design and mild-condition COP. The annual balance is a degree-day estimate without solar or internal gains, cycling losses or control behaviour, and there is no hydraulic balancing, pipe network sizing, buffer stratification, DHW tapping profile or latent cooling load.","nl":"Stationaire ontwerpberekening. De belasting wordt ingevoerd of uit een W/m²-kental genomen in plaats van per ruimte volgens EN 12831 berekend; de afgifte volgt een generieke exponent per type (1,30 radiator, 1,35 convector, 1,25 stralingspaneel, 1,00 ventilatorconvector) op het EN 442-nominaal met het logaritmisch gemiddelde temperatuurverschil, zonder modelgegevens, klepautoriteit of ombouweffecten — en zonder correctie voor de afwijking tot ongeveer 10 % die de logaritmische EN 442-omrekening bij sterk verlaagd debiet en grote spreiding vertoont (REHVA, 2022). Vloerverwarming gebruikt de EN 1264-basiskennlijn en de oppervlaktegrenzen, niet de volledige productkengetallenmethode van EN 1264-2; de gemiddelde watertemperatuur is daarom een vereenvoudigd weerstandsmodel. Wandverwarming wordt niet gedimensioneerd, en koelplafonds en betonkernactivering gebruiken indicatieve maxima in plaats van EN 1264-5. De warmtepompprestatie is Carnot maal een vaste kwaliteitsfactor in plaats van geïnterpoleerde EN 14511-tabellen, ontdooien is een vlakke factor en het seizoenscijfer een vaste menging van ontwerp- en mildweer-COP. De jaarbalans is een graaddagenschatting zonder zon- of interne winsten, pendelverliezen of regelgedrag, en er is geen hydraulische inregeling, leidingnetberekening, bufferstratificatie, tappatroon of latente koellast.","de":"Stationäre Auslegungsrechnung. Die Last wird eingegeben oder aus einem W/m²-Kennwert übernommen statt raumweise nach EN 12831 berechnet; die Heizflächenleistung folgt einem gattungsweiten Exponenten (1,30 Radiator, 1,35 Konvektor, 1,25 Strahlplatte, 1,00 Gebläsekonvektor) auf die EN-442-Nennleistung mit der logarithmischen mittleren Übertemperatur, ohne modellspezifische Daten, Ventilautorität oder Verkleidungseinflüsse — und ohne Korrektur für die Abweichung von bis zu etwa 10 %, die die logarithmische EN-442-Umrechnung bei stark reduziertem Massenstrom und großer Spreizung zeigt (REHVA, 2022). Die Fußbodenheizung nutzt die EN-1264-Basiskennlinie und die Oberflächengrenzen, nicht das vollständige Produktkennwertverfahren der EN 1264-2; die mittlere Wassertemperatur ist daher ein vereinfachtes Widerstandsmodell. Wandheizung wird gar nicht ausgelegt, Kühldecken und Betonkernaktivierung nutzen indikative Maxima statt EN 1264-5. Die Wärmepumpenleistung ist Carnot mal einer festen Gütezahl statt interpolierter EN-14511-Kennfelder, das Abtauen ein pauschaler Faktor und die Jahresarbeitszahl eine feste Mischung aus Auslegungs- und Mildwetter-COP. Die Jahresbilanz ist eine Gradtagschätzung ohne solare und interne Gewinne, ohne Taktverluste und Regelverhalten; hydraulischer Abgleich, Rohrnetzberechnung, Pufferschichtung, Zapfprofil und latente Kühllast fehlen.","fr":"Dimensionnement statique aux conditions de base. La charge est saisie ou déduite d'un ratio en W/m² plutôt que calculée pièce par pièce selon l'EN 12831 ; l'émission suit un exposant générique par type (1,30 radiateur, 1,35 convecteur, 1,25 panneau rayonnant, 1,00 ventilo-convecteur) appliqué à la puissance nominale EN 442 avec l'écart de température logarithmique moyen, sans données par modèle, autorité de vanne ni effet d'habillage — et sans correction de l'écart pouvant atteindre 10 % que la conversion logarithmique EN 442 présente à débit fortement réduit et large spread (REHVA, 2022). Le plancher chauffant utilise la courbe de base EN 1264 et les plafonds de surface, pas la méthode complète à coefficients produit de l'EN 1264-2 ; la température moyenne d'eau est donc un modèle de résistances simplifié. Le chauffage mural n'est pas dimensionné, et plafonds rafraîchissants et dalles actives utilisent des maxima indicatifs plutôt que l'EN 1264-5. La performance de la pompe à chaleur est un Carnot multiplié par un facteur de qualité fixe et non une interpolation des tableaux EN 14511 ; le dégivrage est un coefficient forfaitaire et la valeur saisonnière un mélange figé de COP au point de base et par temps doux. Le bilan annuel est une estimation en degrés-jours sans apports solaires ni internes, sans pertes de cyclage ni comportement de régulation, et il n'y a ni équilibrage hydraulique, ni dimensionnement du réseau, ni stratification du ballon, ni profil de puisage, ni charge latente de refroidissement.","uk":"Стаціонарний розрахунок на розрахункові умови. Навантаження задає користувач або воно береться з питомого показника Вт/м², а не рахується по кімнатах за EN 12831; віддача приладів — це загальний показник степеня за типом (1,30 радіатор, 1,35 конвектор, 1,25 панель, 1,00 фанкойл), застосований до номіналу за EN 442 з логарифмічним середнім надлишком температури, без даних конкретних моделей, авторитету клапана та впливу екранів — і без поправки на відхилення до ≈10 %, яке логарифмічний перерахунок EN 442 дає при сильно зниженій витраті й великому перепаді (REHVA, 2022). Підлогове опалення використовує базову характеристику EN 1264 та обмеження поверхні, а не повний метод продуктових коефіцієнтів EN 1264-2; середня температура води — спрощена модель опорів. Стінове опалення не дімензіонується, а охолоджувальні стелі та активація бетонного ядра використовують орієнтовні максимуми замість EN 1264-5. Характеристики теплового насоса — це Карно, помножений на сталий коефіцієнт якості, а не інтерпольовані таблиці за EN 14511; розморожування враховано одним коефіцієнтом, а сезонний показник — фіксована суміш COP у розрахунковій і м'якій умовах. Річний баланс — оцінка за градусо-добами без сонячних і внутрішніх надходжень, втрат на тактування та поведінки автоматики; гідравлічне балансування, розрахунок трубопроводів, стратифікація буфера, профіль водорозбору та прихована холодильна потужність не моделюються.","es":"Dimensionado estacionario en condiciones de proyecto. La carga se introduce o se toma de un ratio en W/m² en lugar de calcularse local por local según EN 12831; la emisión sigue un exponente genérico por tipo (1,30 radiador, 1,35 convector, 1,25 panel radiante, 1,00 fancoil) aplicado a la potencia nominal EN 442 con la diferencia media logarítmica de temperatura, sin datos por modelo, autoridad de válvula ni efectos de envolvente — y sin corrección de la desviación de hasta un 10 % que la conversión logarítmica EN 442 presenta con caudal muy reducido y salto amplio (REHVA, 2022). El suelo radiante usa la curva básica EN 1264 y los topes de superficie, no el método completo de coeficientes de producto de la EN 1264-2; la temperatura media del agua es, por tanto, un modelo de resistencias simplificado. La calefacción mural no se dimensiona, y los techos refrescantes y la activación del núcleo de hormigón usan máximos indicativos en lugar de la EN 1264-5. El rendimiento de la bomba de calor es Carnot por un factor de calidad fijo y no una interpolación de las tablas EN 14511; el desescarche es un coeficiente global y la cifra estacional una mezcla fija de COP de proyecto y de tiempo suave. El balance anual es una estimación por grados-día sin ganancias solares ni internas, sin pérdidas por ciclado ni comportamiento del control, y no hay equilibrado hidráulico, dimensionado de la red, estratificación de acumulador, perfil de consumo de ACS ni carga latente de refrigeración.","pl":"Obliczenia służą do doboru w stanie ustalonym. Obciążenie jest podawane przez użytkownika albo szacowane wskaźnikiem W/m², a nie liczone pomieszczenie po pomieszczeniu według EN 12831. Moc odbiorników jest przeliczana za pomocą ogólnych wykładników dla typów urządzeń i nie uwzględnia danych konkretnego modelu, autorytetu zaworów ani obudów. Ogrzewanie podłogowe korzysta z podstawowej charakterystyki i ograniczeń EN 1264, nie z pełnej metody współczynników produktowych EN 1264-2; ogrzewanie ścienne nie jest wymiarowane, a sufity chłodzące i TABS korzystają z orientacyjnych limitów zamiast pełnego EN 1264-5. Charakterystyka pompy ciepła to Carnot razy stały współczynnik jakości, a nie interpolacja certyfikowanych tabel EN 14511; odszranianie jest ujęte współczynnikiem, a wartość sezonowa jest uproszczonym połączeniem punktu projektowego i łagodnych warunków. Bilans roczny jest oszacowaniem stopniodniowym bez zysków słonecznych i wewnętrznych, strat taktowania oraz szczegółowego sterowania; narzędzie nie wymiaruje sieci rurowej, nie wykonuje pełnego równoważenia hydraulicznego ani profilu poboru CWU i nie liczy utajonego obciążenia chłodniczego."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["nl","fr","en","de","ru","uk","pl","es"],"dependencies":[],"network_access":{"mode":"none"},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":true,"requires":[]},"handoff":{"provides":["Q","Vdot"],"accepts":["Q"]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3},"validation":{"basis":{"en":"107 of 107 benchmark entries pass. The EN 442-2 emitter law (logarithmic mean excess temperature, 49.83 K at 75/65/20) and the EN 1264 basic characteristic q = 8.92 ΔΘ^1.1 with its surface caps are re-implemented in python from their published equations and cited; the plant, hydraulic and degree-day arithmetic is graded as closed-form identities, and the arithmetic-mean variant of the emitter law is computed alongside every case to demonstrate which convention is in use. The per-type exponents, the Carnot quality factors, the coverage curve and the 66 rule texts are explicitly not benchmarked. The harness is the author's own; no external party has reviewed it.","uk":"107 зі 107 записів еталонного тесту пройдено. Закон приладів за EN 442-2 (логарифмічний середній надлишок температури, 49,83 K при 75/65/20) і базову характеристику EN 1264 q = 8,92·ΔΘ^1,1 з обмеженнями температури поверхні реалізовано наново в python за опублікованими рівняннями з посиланнями; арифметику джерела, гідравліки та градусо-діб перевірено як замкнені тотожності, а варіант із середнім арифметичним обчислено поруч у кожному випадку, щоб показати, яка конвенція застосована. Показники степеня за типами, коефіцієнти якості Карно, крива покриття та 66 текстових правил свідомо не тестувалися. Стенд авторський; сторонньої перевірки не було.","de":"107 von 107 Benchmark-Einträgen bestanden. Das EN-442-2-Heizflächengesetz (logarithmische mittlere Übertemperatur, 49,83 K bei 75/65/20) und die EN-1264-Basiskennlinie q = 8,92·ΔΘ^1,1 mit ihren Oberflächengrenzen sind in python aus den veröffentlichten Gleichungen neu implementiert und zitiert; die Erzeuger-, Hydraulik- und Gradtagsarithmetik wird als geschlossene Identität geprüft, und die arithmetische Variante des Gesetzes wird in jedem Fall mitgerechnet, um die tatsächlich verwendete Konvention zu belegen. Die gattungsweiten Exponenten, die Carnot-Gütezahlen, die Deckungskurve und die 66 Regeltexte sind ausdrücklich nicht benchmarkt. Der Prüfstand stammt vom Autor; eine externe Prüfung fand nicht statt.","nl":"107 van 107 benchmarkregels slagen. De EN 442-2-afgiftewet (logaritmisch gemiddeld temperatuurverschil, 49,83 K bij 75/65/20) en de EN 1264-basiskennlijn q = 8,92·ΔΘ^1,1 met haar oppervlaktegrenzen zijn in python opnieuw geïmplementeerd uit de gepubliceerde vergelijkingen en geciteerd; de opwekkings-, hydraulische en graaddagenrekenkunde wordt als gesloten identiteit getoetst, en de rekenkundige variant van de wet wordt bij elk geval meeberekend om aan te tonen welke conventie gebruikt wordt. De generieke exponenten, de Carnot-kwaliteitsfactoren, de dekkingscurve en de 66 regelteksten zijn uitdrukkelijk niet gebenchmarkt. De testbank is van de auteur zelf; er was geen externe review.","fr":"107 entrées de banc d'essai sur 107 réussissent. La loi d'émission EN 442-2 (écart de température logarithmique moyen, 49,83 K à 75/65/20) et la courbe de base EN 1264 q = 8,92·ΔΘ^1,1 avec ses plafonds de température de surface sont réimplémentées en python à partir des équations publiées et citées ; l'arithmétique de production, d'hydraulique et de degrés-jours est vérifiée comme identité fermée, et la variante arithmétique de la loi est calculée en parallèle pour chaque cas afin de démontrer la convention réellement employée. Les exposants génériques, les facteurs de qualité de Carnot, la courbe de couverture et les 66 textes de règles ne sont explicitement pas testés. Le banc est celui de l'auteur ; aucun tiers ne l'a examiné.","es":"107 de 107 entradas del banco de pruebas pasan. La ley de emisión EN 442-2 (diferencia media logarítmica de temperatura, 49,83 K a 75/65/20) y la curva básica EN 1264 q = 8,92·ΔΘ^1,1 con sus topes de temperatura superficial se reimplementan en python a partir de las ecuaciones publicadas y se citan; la aritmética de generación, hidráulica y grados-día se verifica como identidad cerrada, y la variante aritmética de la ley se calcula en paralelo en cada caso para demostrar qué convención se emplea. Los exponentes genéricos, los factores de calidad de Carnot, la curva de cobertura y los 66 textos de reglas no se contrastan de forma explícita. El banco es del propio autor; ningún tercero lo ha revisado.","pl":"107 z 107 przypadków testowych przechodzi. Prawo mocy odbiorników EN 442-2 z logarytmiczną średnią nadwyżką temperatury (49,83 K dla 75/65/20) oraz podstawowa charakterystyka EN 1264 q = 8,92·ΔΘ^1,1 z ograniczeniami temperatury powierzchni zostały niezależnie odtworzone w Pythonie z opublikowanych równań i źródeł. Arytmetyka źródła, hydrauliki i stopniodni jest sprawdzana jako zamknięte zależności, a dla każdego przypadku równolegle liczony jest wariant ze średnią arytmetyczną, aby wykazać używaną konwencję. Wykładniki zależne od typu odbiornika, współczynniki jakości modelu Carnota, krzywa pokrycia oraz teksty reguł nie są objęte benchmarkiem. Zestaw testowy jest autorski i nie był niezależnie recenzowany."},"independent_validation":false,"benchmarks":[{"id":"en442-emitter-law-en1264-floor-and-plant-arithmetic","reference":"EN 442-2 emitter characteristic Phi = Phi_50 (dT_ln/49.83)^n with the logarithmic mean excess temperature, and the EN 1264 basic characteristic q = 8.92 (theta_F,m - theta_i)^1.1 with its inversion and the standard floor surface caps, both implemented in python from the published equations; the plant, hydraulic and degree-day arithmetic is recomputed independently as closed-form identities.","citations":["EN 442-2, \"Radiators and convectors - Part 2: Test methods and rating\": nominal thermal output measured at 75/65/20 degC and converted with Phi = Phi_50 (dT_ln/dT_ln,50)^n.","P. Sarbu et al. / L. Bagi et al., \"Can we still trust in EN 442? New operating definitions for radiators, Part 1 and Part 2\", REHVA Journal (2022): states the EN 442-2 conversion as Phi = Phi_50 (dT_ln/dT_ln,50)^n and the design point \"75-65-20 degC, which means 50 K (dT_ln = 49.83 K) over-temperature\"; reports measured exponents n = 1.26...1.35 and deviations up to about 10 % at reduced mass flow / increased spread. https://www.rehva.eu/rehva-journal/chapter/can-we-still-trust-in-en-442-new-operating-definitions-for-radiators-part-2-model-based-analysis-and-results","buildingservicestutor.com, \"Hydronic balancing step 4: calculate radiator output\": confirms the logarithmic excess temperature convention and the 75/65/20 reference, and quotes n = 1.3 for panel radiators, 1.26 for towel radiators. https://www.buildingservicestutor.com/calculate-radiator-output/","DIN EN 1264 basic characteristic curve for floor heating, q = 8.92 (theta_F,m - theta_i)^1.1 W/m2, as quoted at https://www.hilfreiche-tools.de/waermestromdichte-fussbodenheizung/","EN 1264 floor surface temperature limits 29 degC (occupied zone), 35 degC (peripheral zone) and 33 degC (bathrooms), as quoted in Uponor, \"Underfloor heating and cooling - planning principles\", https://brandportal.uponor.com/m/7187327a41365ace/original/TI-planning-principles-UFHC-EN-1186660-v1.pdf"],"cases":107,"passed":107,"tolerance":"The tool states which published closed forms it implements, so the reference implements the same forms independently in python and the tool is held to 1e-9 relative on every continuous quantity; volumes the tool rounds to whole litres and unit counts must match exactly. Two things are deliberately not graded to a tighter number than the physics allows: the reference temperature difference, where the exact logarithmic mean at 75/65/20 is 49.83289 K and the tool - like the industry - declares 49.83, a 0.006 % rounding whose effect on the output factor is 0.008 %, and the unity check at the rating point, which is therefore given 2e-4. The arithmetic-mean variant of the same law is computed alongside every case and its distance from the logarithmic one recorded (up to 8.9 % over the regime grid) so that the convention actually in use is demonstrated rather than assumed.","run_at":"2026-10-17T14:26:00Z","artifact":"benchmarks/verwarmenkoelenselector.json"}]}}</script>

  .dgu-head, .dgu-r-results, .dgu-r-stage, .dgu-r-footer, .vwk-navrow,
  [data-dgu-panel="vwk-tools"] { display: none !important; }

<body>
<div id="app"></div>
<script>/* =====================================================================
   VERWARMEN EN KOELEN — rekenkern
   Vermogens, temperatuurregimes, afgiftecapaciteit bij afwijkend regime,
   warmtepompgedrag en bivalentiepunt, buffervolume, debieten,
   expansievat, sanitair warm water en een indicatieve jaarbalans.

   Alle uitkomsten zijn ONTWERPINDICATIES voor de uitvraag. De definitieve
   selectie komt van de fabrikant met gecertificeerde gegevens.
   ===================================================================== */

const HYD = (() => {
  const RHO = 1000, CP = 4.187;          // water bij ~40 °C, kJ/(kg·K)

  const num = (x, d = 0) => {
    const n = typeof x === 'number' ? x : parseFloat(String(x ?? '').replace(',', '.'));
    return Number.isFinite(n) ? n : d;
  };

  /* Waterdebiet [m³/h] uit vermogen [kW] en spreiding [K] */
  function flow(kW, dT, glycolPct = 0) {
    if (!(dT > 0)) return 0;
    const cp = CP * (1 - 0.0045 * glycolPct);     // glycol verlaagt de warmtecapaciteit
    const rho = RHO * (1 + 0.0009 * glycolPct);
    return kW / (rho * cp * dT) * 3600;
  }

  /* Logaritmisch temperatuurverschil van een afgifte-element */
  function dtLog(tAan, tRet, tRuimte) {
    const a = tAan - tRuimte, b = tRet - tRuimte;
    if (a <= 0 || b <= 0) return 0;
    if (Math.abs(a - b) < 1e-6) return a;
    return (a - b) / Math.log(a / b);
  }

  /* ---- Afgiftesystemen ------------------------------------------------
     Radiatoren volgen EN 442: het nominale vermogen geldt bij 75/65/20,
     dus bij een logaritmisch verschil van 49,83 K. Bij elk ander regime
     schaalt het vermogen met (ΔT/49,83)^n, met n ≈ 1,3.
     Dit is de belangrijkste berekening van het hele blad: ze laat zien
     waarom een bestaande radiator op een warmtepompregime maar een
     fractie van zijn opgegeven vermogen levert.                        */
  const DT_NOM = 49.83;
  const EXPONENT = {
    radiator: 1.30, convector: 1.35, vloerconvector: 1.35,
    ventilo: 1.00, luchtverwarmer: 1.00,       // geforceerde convectie ≈ lineair
    paneel: 1.25, plafondpaneel: 1.25
  };

  function radiatorFactor(tAan, tRet, tRuimte, type = 'radiator') {
    const dt = dtLog(tAan, tRet, tRuimte);
    if (dt <= 0) return 0;
    return Math.pow(dt / DT_NOM, EXPONENT[type] ?? 1.3);
  }

  /* Benodigd nominaal vermogen om bij het gekozen regime de last te halen */
  function radiatorRequired(loadKW, tAan, tRet, tRuimte, type) {
    const f = radiatorFactor(tAan, tRet, tRuimte, type);
    return f > 0 ? loadKW / f : Infinity;
  }

  /* Vloer- en wandverwarming: warmtestroom naar boven volgens EN 1264,
     begrensd door de toelaatbare oppervlaktetemperatuur.               */
  function surfaceOutput(tSurface, tRoom) {
    const d = tSurface - tRoom;
    return d > 0 ? 8.92 * Math.pow(d, 1.1) : 0;      // W/m²
  }
  const SURFACE_LIMIT = {
    vloer_verblijf: 29, vloer_rand: 35, vloer_badkamer: 33,
    wand: 40, plafond: 27
  };

  /* Oppervlakte-overtemperatuur die bij een warmtestroomdichtheid hoort:
     de omkering van de basiskennlijn q = 8,92·Δθ^1,1 uit EN 1264.        */
  function surfaceExcess(q) {
    return q > 0 ? Math.pow(q / 8.92, 1 / 1.1) : 0;
  }

  /* Dekvloer boven de buis: 45 mm bij λ = 1,2 W/(m·K), de standaardopbouw
     waarop EN 1264-2 zijn kengetallen betrekt.                           */
  const R_SCREED = 0.045 / 1.2;                     // 0,0375 m²K/W

  /* Gemiddelde watertemperatuur die bij een gevraagde afgifte hoort.
     Ze wordt OPGEBOUWD vanaf de vloeroppervlaktetemperatuur: het water moet
     per definitie warmer zijn dan het oppervlak dat het opwarmt. Boven op de
     oppervlakte-overtemperatuur komt de val over de vloerafwerking en de
     dekvloer. Vereenvoudiging van EN 1264-2, dat met productgebonden
     kengetallen (B, a_B, a_T^mT, a_ü^mü, a_D^mD) werkt; de legafstand is
     hier een lineaire correctie en geen normatieve a_T-factor.           */
  function embeddedFlowTemp(qNeed, tRoom, R = 0.09, spacing = 0.15) {
    if (!(qNeed > 0)) return tRoom;
    const spacingFactor = Math.max(0.5, 1 + (spacing - 0.15) * 1.2);
    return tRoom + surfaceExcess(qNeed) + qNeed * (Math.max(0, R) + R_SCREED) * spacingFactor;
  }

  /* Betonkernactivering: traag, zelfregelend, beperkt vermogen */
  const TABS = { heatMax: 40, coolMax: 50, dtTypical: 3 };   // W/m²

  /* ---- Warmtepomp ------------------------------------------------------
     Carnot met een realistische kwaliteitsgraad. Alleen indicatief:
     de werkelijke prestatie komt uit de gecertificeerde tabellen.      */
  const HP_QUALITY = {
    lucht_water: 0.42, grond_boring: 0.50, grond_horizontaal: 0.48,
    water_water: 0.52, afvoerlucht: 0.40, lucht_lucht: 0.40, hybride: 0.42
  };

  function cop(tSource, tSink, type = 'lucht_water') {
    const Ts = tSink + 273.15, To = tSource + 273.15;
    if (Ts <= To) return 8;
    const q = HP_QUALITY[type] ?? 0.42;
    let c = q * Ts / (Ts - To);
    /* Ontdooiverlies bij luchtbronnen tussen −7 en +7 °C */
    if ((type === 'lucht_water' || type === 'lucht_lucht' || type === 'hybride') &&
      tSource > -8 && tSource < 7) c *= 0.88;
    return Math.max(1, Math.min(c, 8));
  }

  /* Beschikbaar vermogen van een luchtwarmtepomp daalt met de
     buitentemperatuur; ruwweg lineair tussen +7 en −15 °C. */
  function hpCapacityFactor(tOut, type = 'lucht_water') {
    if (type !== 'lucht_water' && type !== 'lucht_lucht' && type !== 'hybride') return 1;
    const f = 1 + (tOut - 7) * 0.022;
    return Math.max(0.35, Math.min(1.05, f));
  }

  /* Bivalentiepunt: snijpunt van de gebouwlijn UA·(θi − θe) met de
     capaciteitslijn. Beide lijnen zijn stuksgewijs lineair, dus het snijpunt
     wordt exact opgelost in plaats van met een stapsgewijze zoektocht — die
     gaf een resultaat dat tot 0,1 K te laag lag en met drijvendekommaruis. */
  const CAP_SLOPE = 0.022, CAP_MAX = 1.05, CAP_MIN = 0.35;
  function bivalent(loadKW, tDesign, tRoom, hpKW7, type) {
    const UA = (tRoom - tDesign) > 0 ? loadKW / (tRoom - tDesign) : 0;   // kW/K
    if (!(UA > 0) || !(hpKW7 > 0)) return { UA, point: tDesign };
    const air = type === 'lucht_water' || type === 'lucht_lucht' || type === 'hybride';
    let p;
    if (!air) p = tRoom - hpKW7 / UA;
    else {
      const tHi = 7 + (CAP_MAX - 1) / CAP_SLOPE, tLo = 7 + (CAP_MIN - 1) / CAP_SLOPE;
      p = tRoom - CAP_MAX * hpKW7 / UA;                       // capaciteit begrensd op 1,05
      if (p < tHi) {
        p = (UA * tRoom - hpKW7 * (1 - 7 * CAP_SLOPE)) / (UA + CAP_SLOPE * hpKW7);
        if (p < tLo) p = tRoom - CAP_MIN * hpKW7 / UA;        // capaciteit begrensd op 0,35
      }
    }
    if (!Number.isFinite(p) || p > tRoom) p = tRoom;
    if (p < tDesign) p = tDesign;
    return { UA, point: p };
  }

  /* Aandeel van de jaarlijkse warmtevraag onder het bivalentiepunt.
     Benadering op basis van de gebruikelijke verdeling van graaduren in
     een gematigd zeeklimaat. */
  function bivalentCoverage(tBiv, tDesign, tRoom) {
    if (tBiv <= tDesign) return 1;
    const span = tRoom - tDesign;
    const x = (tRoom - tBiv) / (span || 1);          // 0…1
    return Math.max(0, Math.min(1, 1 - Math.pow(Math.max(0, x), 2.6) * 0.55));
  }

  /* ---- Buffer, expansie, sanitair ------------------------------------ */
  function bufferVolume(kW, mode, minRunMin = 6, dTbuffer = 5) {
    /* Volume dat de minimale looptijd overbrugt: V = Q·t/(ρ·c·ΔT) */
    if (mode === 'geen') return 0;
    const v = kW * minRunMin * 60 / (RHO / 1000 * CP * dTbuffer);   // liter
    return Math.round(v);
  }
  function defrostVolume(kW) { return Math.round(kW * 12); }        // vuistregel l/kW

  function expansion(volumeL, tMax = 60, pStatic = 1.5, pMax = 3) {
    /* Uitzettingscoëfficiënt van water tussen 10 °C en tMax */
    const e = Math.max(0.005, 0.00035 * (tMax - 10) + 0.0005);
    const p0 = pStatic + 0.3, pe = pMax - 0.5;
    const factor = (pe + 1) / Math.max(0.1, pe - p0);
    return Math.round(volumeL * e * factor * 1.1);
  }

  function dhw(persons, litersPerPerson = 40, tCold = 10, tStore = 55, peakFactor = 1.0) {
    const dailyL = persons * litersPerPerson;
    const dailyKWh = dailyL * (tStore - tCold) * 1.163 / 1000;
    const peakKW = dailyKWh * peakFactor;               // indicatief piekuurvermogen
    return { dailyL, dailyKWh, peakKW };
  }

  /* ---- Jaarbalans ---------------------------------------------------- */
  function annual(A, loadKW, tDesign, tRoom, degreeDays, copSeason) {
    const UA = (tRoom - tDesign) > 0 ? loadKW / (tRoom - tDesign) : 0;
    const heatKWh = UA * degreeDays * 24;               // kWh/a
    const elecKWh = copSeason > 0 ? heatKWh / copSeason : 0;
    return { heatKWh, elecKWh, UA };
  }

  return {
    num, flow, dtLog, radiatorFactor, radiatorRequired, surfaceOutput, surfaceExcess,
    R_SCREED, embeddedFlowTemp,
    SURFACE_LIMIT, TABS, cop, hpCapacityFactor, bivalent, bivalentCoverage,
    bufferVolume, defrostVolume, expansion, dhw, annual, DT_NOM, EXPONENT, HP_QUALITY
  };
})();

/* =====================================================================
   Rekenpijplijn op de antwoorden
   ===================================================================== */
const CALC = (() => {
  const n = HYD.num;

  function loads(A) {
    const L = {};
    const area = n(A.geb_area);
    L.area = area;
    const basis = A.bel_basis || 'specifiek';
    L.basis = basis;
    L.specific = n(A.bel_spec_heat, 45);              // W/m²
    L.heatFromSpec = area * L.specific / 1000;        // kW
    L.heatGiven = n(A.bel_heat_kw);
    L.heat = basis === 'opgegeven' ? L.heatGiven : L.heatFromSpec;

    L.specificCool = n(A.bel_spec_cool, 45);
    L.coolFromSpec = area * L.specificCool / 1000;
    L.coolGiven = n(A.bel_cool_kw);
    L.cool = A.bel_cooling === 'nee' ? 0
      : (basis === 'opgegeven' ? L.coolGiven : L.coolFromSpec);

    L.tDesign = n(A.cnd_t_design, -8);
    L.tRoom = n(A.cnd_t_room, 20);
    L.tRoomCool = n(A.cnd_t_room_cool, 25);
    L.degreeDays = n(A.cnd_degree_days, 2000);
    return L;
  }

  function regime(A, L) {
    const r = {};
    r.tFlow = n(A.reg_t_flow, 45);
    r.tReturn = n(A.reg_t_return, 40);
    r.dT = Math.max(0.5, r.tFlow - r.tReturn);
    r.tFlowCool = n(A.reg_t_flow_cool, 12);
    r.tReturnCool = n(A.reg_t_return_cool, 18);
    r.dTCool = Math.max(0.5, r.tReturnCool - r.tFlowCool);
    r.glycol = n(A.reg_glycol_pct, 0);

    r.flowHeat = HYD.flow(L.heat, r.dT, r.glycol);          // m³/h
    r.flowCool = L.cool > 0 ? HYD.flow(L.cool, r.dTCool, r.glycol) : 0;
    return r;
  }

  /* Afgifte: wat levert het gekozen systeem bij dit regime werkelijk? */
  function terminals(A, L, r) {
    const t = { list: A.afg_types || [], detail: {} };
    const RAD = ['radiator', 'convector', 'vloerconvector', 'paneel', 'plafondpaneel', 'ventilo', 'luchtverwarmer'];

    RAD.forEach(k => {
      if (!t.list.includes(k)) return;
      const f = HYD.radiatorFactor(r.tFlow, r.tReturn, L.tRoom, k);
      t.detail[k] = {
        factor: f,
        requiredNominal: f > 0 ? L.heat / f : Infinity,
        note: 'EN 442, nominaal 75/65/20'
      };
    });

    if (t.list.includes('vloer')) {
      const limit = HYD.SURFACE_LIMIT.vloer_verblijf;
      const qMax = HYD.surfaceOutput(limit, L.tRoom);
      const share = n(A.afg_vloer_share, 100) / 100;
      const areaEff = L.area * share * n(A.afg_vloer_coverage, 80) / 100;
      const qNeed = areaEff > 0 ? L.heat * 1000 * share / areaEff : 0;
      t.detail.vloer = {
        qMax, qNeed, areaEff,
        ok: qNeed <= qMax,
        tSurface: L.tRoom + HYD.surfaceExcess(qNeed),
        tMedium: HYD.embeddedFlowTemp(qNeed, L.tRoom, n(A.afg_vloer_r, 0.09),
                                      n(A.afg_vloer_spacing, 0.15))
      };
    }

    if (t.list.includes('wand')) {
      /* Wandverwarming wordt door dit blad NIET gedimensioneerd: EN 1264-5 gebruikt
         daarvoor eigen kengetallen die hier niet zijn opgenomen. Alleen het aandeel
         en de bekende oppervlaktegrens worden vastgehouden, en er volgt een expliciete
         melding zodat de gebruiker niet denkt dat er iets is doorgerekend.          */
      t.detail.wand = {
        share: n(A.afg_vloer_share, 100) / 100,
        surfaceLimit: HYD.SURFACE_LIMIT.wand,
        dimensioned: false
      };
    }

    if (t.list.includes('tabs')) {
      const share = n(A.afg_tabs_share, 100) / 100;
      const areaEff = L.area * share;
      t.detail.tabs = {
        qNeedHeat: areaEff > 0 ? L.heat * 1000 * share / areaEff : 0,
        qNeedCool: areaEff > 0 ? L.cool * 1000 * share / areaEff : 0,
        maxHeat: HYD.TABS.heatMax, maxCool: HYD.TABS.coolMax, areaEff
      };
    }

    if (t.list.includes('koelplafond')) {
      const share = n(A.afg_koelplafond_share, 100) / 100;
      const areaEff = L.area * share;
      t.detail.koelplafond = {
        qNeedCool: areaEff > 0 ? L.cool * 1000 * share / areaEff : 0,
        maxCool: 75, areaEff,
        /* Oppervlak moet boven het dauwpunt van de ruimte blijven */
        dewLimit: n(A.cnd_dewpoint_room, 14)
      };
    }
    return t;
  }

  function generation(A, L, r) {
    const g = {};
    g.type = A.opw_type || 'lucht_water';
    g.hpKW7 = n(A.opw_hp_kw, L.heat);
    g.source = A.opw_source_t !== undefined && A.opw_source_t !== ''
      ? n(A.opw_source_t) : (g.type === 'lucht_water' ? L.tDesign : 5);

    g.copDesign = HYD.cop(g.source, r.tFlow, g.type);
    g.copMild = HYD.cop(7, r.tFlow - 8, g.type);
    g.copSeason = (g.copDesign * 0.3 + g.copMild * 0.7);
    g.capacityAtDesign = g.hpKW7 * HYD.hpCapacityFactor(L.tDesign, g.type);

    const b = HYD.bivalent(L.heat, L.tDesign, L.tRoom, g.hpKW7, g.type);
    g.UA = b.UA;
    g.bivalentPoint = b.point;
    g.coverage = HYD.bivalentCoverage(g.bivalentPoint, L.tDesign, L.tRoom);
    g.backupKW = Math.max(0, L.heat - g.capacityAtDesign);

    /* Sanitair warm water */
    const persons = n(A.dhw_persons);
    g.dhw = HYD.dhw(persons, n(A.dhw_l_person, 40), n(A.dhw_t_cold, 10), n(A.dhw_t_store, 55));
    g.dhwTemp = n(A.dhw_t_store, 55);
    g.copDHW = HYD.cop(g.source, g.dhwTemp + 5, g.type);

    /* Jaarbalans */
    const an = HYD.annual(A, L.heat, L.tDesign, L.tRoom, L.degreeDays, g.copSeason);
    g.heatKWh = an.heatKWh;
    g.elecKWh = an.elecKWh;
    g.dhwKWhYear = g.dhw.dailyKWh * 365;
    g.dhwElec = g.copDHW > 0 ? g.dhwKWhYear / g.copDHW : 0;
    return g;
  }

  function hydraulics(A, L, r, g) {
    const h = {};
    h.bufferMode = A.hyd_buffer || 'geen';
    h.minRun = n(A.hyd_min_run, 6);
    h.bufferCalc = HYD.bufferVolume(Math.min(g.hpKW7, L.heat), h.bufferMode, h.minRun, n(A.hyd_buffer_dt, 5));
    h.defrostCalc = ['lucht_water', 'hybride'].includes(g.type) ? HYD.defrostVolume(g.hpKW7) : 0;
    h.bufferAdvised = Math.max(h.bufferCalc, h.defrostCalc);
    h.bufferGiven = n(A.hyd_buffer_l);

    h.systemVolume = n(A.hyd_system_l, Math.round(L.heat * 12));
    h.expansion = HYD.expansion(h.systemVolume, r.tFlow + 10, n(A.hyd_p_static, 1.5), n(A.hyd_p_max, 3));

    h.pumpFlow = r.flowHeat;
    h.pumpHead = n(A.hyd_head_kpa, 40);
    h.pumpPower = h.pumpFlow * h.pumpHead / 3.6 / 0.45 / 1000;   // kW, indicatief
    return h;
  }

  return { loads, regime, terminals, generation, hydraulics };
})();




/* ------------------------------------------------------------------ */

/* =====================================================================
   GEBOUWPROFIELEN
   Zetten vertrekwaarden voor last, regime, afgifte en koeling. Ze zijn
   een startpunt, geen normatieve eis — projectspecifiek te verifiëren.
   ===================================================================== */

const PROFILES = [
  {
    id: 'woning_nieuw', group: 'wonen', label: 'Woning — nieuwbouw',
    basis: 'EPB-nieuwbouw; EN 12831',
    defaults: {
      bel_spec_heat: 30, bel_cooling: 'nee', geb_schil: 'goed', geb_massa: 'gemiddeld',
      geb_gebruik: 'continu', reg_t_flow: 35, reg_t_return: 30, afg_types: ['vloer'],
      opw_type: 'lucht_water', dhw_aanwezig: 'ja', dhw_l_person: 40, dhw_t_store: 55,
      biv_punt: -7, hyd_buffer: 'ontdooi'
    },
    flags: { lowTemp: true, dhwCritical: true },
    note: 'Hier valt alles op zijn plaats: goede schil, vloerverwarming, laag regime. De aandacht verschuift naar het sanitair warm water — dat is bij een moderne woning al snel de helft van de jaarlijkse warmtevraag en het draait op een veel ongunstiger temperatuur dan de verwarming.'
  },
  {
    id: 'woning_renovatie', group: 'wonen', label: 'Woning — renovatie',
    basis: 'EN 12831; bestaande afgifte inventariseren',
    defaults: {
      bel_spec_heat: 70, bel_cooling: 'nee', geb_schil: 'matig', geb_massa: 'zwaar',
      geb_gebruik: 'continu', reg_t_flow: 55, reg_t_return: 45, afg_types: ['radiator'],
      afg_bestaand: 'ja', opw_type: 'hybride', dhw_aanwezig: 'ja', biv_punt: -2,
      prj_aard: 'vervanging'
    },
    flags: { lowTemp: false, existingEmitters: true },
    note: 'De lastigste categorie en de meest voorkomende. Bestaande radiatoren zijn geselecteerd op 75/65 en leveren bij 45/40 nog ongeveer een derde van hun opgegeven vermogen. Inventariseer per ruimte wat er hangt, reken door wat er bij het gewenste regime uitkomt, en vervang gericht de elementen die tekortschieten — dat is bijna altijd goedkoper dan een grotere warmtepomp of een hoger regime.'
  },
  {
    id: 'appartement_collectief', group: 'wonen', label: 'Collectief woongebouw',
    basis: 'EPB; meting per eenheid',
    defaults: {
      bel_spec_heat: 40, bel_cooling: 'nee', geb_schil: 'gemiddeld', geb_gebruik: 'continu',
      reg_t_flow: 45, reg_t_return: 38, afg_types: ['radiator', 'vloer'],
      opw_type: 'lucht_water', dis_opzet: 'collectief_individueel', dis_afleverset: 'ja',
      dis_meting_eenheid: 'ja', dhw_aanwezig: 'ja', dhw_systeem: 'verswater',
      bel_gelijktijdigheid: 0.7
    },
    flags: { lowTemp: true, dhwCritical: true, metering: true },
    note: 'De sanitaire bereiding en de circulatieleiding bepalen hier het rendement, niet de verwarming. Een collectieve leiding die het hele jaar op 60 °C staat, verliest continu; verswaterstations per woning op een bronnet van 40 °C lossen zowel het legionellavraagstuk als het rendementsprobleem op.'
  },

  {
    id: 'kantoor_nieuw', group: 'utiliteit', label: 'Kantoor — nieuwbouw',
    basis: 'EN 16798-1; EPB',
    defaults: {
      bel_spec_heat: 35, bel_spec_cool: 50, bel_cooling: 'ja', bel_latent: 25,
      geb_schil: 'goed', geb_massa: 'zwaar', geb_gebruik: 'kantooruren',
      reg_t_flow: 35, reg_t_return: 30, reg_t_flow_cool: 16, reg_t_return_cool: 19,
      afg_types: ['tabs', 'ventilo'], opw_type: 'grond_boring', opw_regeneratie: 'ja',
      kou_type: 'passief_bodem', kou_vrije_koeling: 'ja', geb_gelijktijdig: 'ja',
      dhw_aanwezig: 'nee'
    },
    flags: { lowTemp: true, simultaneous: true },
    note: 'Betonkernactivering met bodemenergie is hier het sterke koppel: de bodem levert \'s zomers passieve koeling en wordt daarbij opgeladen voor de winter. Voorwaarde is wel massa in het gebouw en een naregeling die de piek opvangt — betonkern alleen haalt de piekbelasting niet en regelt niet per ruimte.'
  },
  {
    id: 'kantoor_renovatie', group: 'utiliteit', label: 'Kantoor — renovatie',
    basis: 'EN 16798-1',
    defaults: {

    { id: 'uit_documentatie', type: 'checkbox', label: 'Gevraagde documentatie',
      options: [
        { v: 'berekening', l: 'Warmteverlies- en koellastberekening' },
        { v: 'selectie', l: 'Selectierapport met prestatiepunten bij het projectregime' },
        { v: 'schema', l: 'Hydraulisch schema, as-built' },
        { v: 'elektrisch', l: 'Elektrisch schema en puntenlijst' },
        { v: 'inregel', l: 'Inregelrapport met gemeten debieten' },
        { v: 'stooklijn', l: 'Ingestelde stooklijn en regelparameters' },
        { v: 'onderhoud', l: 'Onderhoudsvoorschrift met intervallen' },
        { v: 'logboek', l: 'Logboek koudemiddel' },
        { v: 'garantie', l: 'Garantiebepalingen en voorwaarden' }],
      help: 'Vraag het selectierapport bij de offerte, met de prestaties bij úw aanvoertemperatuur. Dat ene document maakt offertes van verschillende fabrikanten voor het eerst vergelijkbaar.' },
    { id: 'uit_opleiding', type: 'radio', label: 'Opleiding van de beheerder voorzien?', options: YESNO, default: 'ja', help: 'Wie de stooklijn niet begrijpt, zet hem hoger bij de eerste klacht — en dan is het rendement weg. Een uur uitleg bij oplevering verdient zich terug.' },
    { id: 'uit_onderhoud', type: 'select', label: 'Onderhoudscontract', default: 'nog_bepalen',
      options: [{ v: 'geen', l: 'Geen' }, { v: 'basis', l: 'Basis — inspectie en wettelijke controles' }, { v: 'volledig', l: 'Volledig — inclusief regeling en prestatieopvolging' }, { v: 'nog_bepalen', l: 'Nog te bepalen' }] },
    { id: 'uit_garantie', type: 'number', label: 'Gevraagde garantietermijn', unit: 'jaar', default: 5 },
    { id: 'uit_levertijd', type: 'text', label: 'Gevraagde levertijd of opleverdatum', help: 'Vraag de levertijd van de regeling en van de buitendelen apart; die lopen zelden gelijk.' },
    { id: 'uit_budget', type: 'text', label: 'Budgetindicatie' },
    { id: 'uit_opmerkingen', type: 'textarea', label: 'Overige opmerkingen en randvoorwaarden' }
  ]

/* ------------------------------------------------------------------ */

/* =====================================================================
   SYSTEEMKETEN EN REGELWERK — taalonafhankelijk
   ===================================================================== */

const CHAIN = (() => {
  const LEVEL = { blok: 3, waarschuwing: 2, advies: 1 };

  /* Families volgen de volgorde in de keten, zodat naast elkaar liggende
     onderdelen twee gevalideerd onderscheidbare tinten krijgen. */
  const FAMILY = {
    bron: 'bron', buitendeel: 'bron', boring: 'bron', grondwater: 'bron', restwarmte: 'bron',
    warmtepomp: 'opwekking', ketel: 'opwekking', elektrisch: 'opwekking', warmtenet: 'opwekking',
    chiller: 'opwekking', wkk: 'opwekking', vrije_koeling: 'opwekking',
    buffer: 'opslag', boilervat: 'opslag', scheiding: 'opslag',
    verdeler: 'distributie', menggroep: 'distributie', pomp: 'distributie', afleverset: 'distributie',
    vloer: 'afgifte', wand: 'afgifte', tabs: 'afgifte', radiator: 'afgifte', convector: 'afgifte',
    vloerconvector: 'afgifte', ventilo: 'afgifte', koelplafond: 'afgifte', balk: 'afgifte',
    paneel: 'afgifte', luchtverwarmer: 'afgifte', vrf: 'afgifte',
    verswater: 'sanitair', tappunt: 'sanitair', circulatie: 'sanitair'
  };

  const SOURCE_NODE = {
    lucht_water: 'buitendeel', lucht_lucht: 'buitendeel', hybride: 'buitendeel',
    grond_boring: 'boring', grond_horizontaal: 'boring',
    water_water: 'grondwater', afvoerlucht: 'restwarmte'
  };

  function chain(A, calc) {
    const heat = [], cool = [], dhw = [];
    const P = (key, row, spec) => ({ key, row, spec, family: FAMILY[key] || 'overig' });
    const opw = A.opw_type || 'lucht_water';
    const isHP = /lucht|grond|water|hybride|afvoerlucht/.test(opw);
    const types = A.afg_types || [];

    /* ---- warmteketen ---- */
    if (isHP) heat.push(P(SOURCE_NODE[opw] || 'bron', 'warm', opw));
    if (isHP) heat.push(P('warmtepomp', 'warm', opw));
    else if (opw === 'gasketel' || opw === 'biomassa' || opw === 'wkk')
      heat.push(P(opw === 'wkk' ? 'wkk' : 'ketel', 'warm', opw));
    else if (opw === 'warmtenet') heat.push(P('warmtenet', 'warm'));
    else if (opw === 'elektrisch') heat.push(P('elektrisch', 'warm'));
    if (A.opw_type === 'hybride' || (A.biv_backup && A.biv_backup !== 'geen'))
      heat.push(P(A.biv_backup === 'gasketel' ? 'ketel' : 'elektrisch', 'warm', 'bijstook'));
    if (A.hyd_buffer && A.hyd_buffer !== 'geen') heat.push(P('buffer', 'warm', A.hyd_buffer));
    if (A.hyd_scheiding && !['geen', 'buffer_serie', 'buffer_parallel'].includes(A.hyd_scheiding))
      heat.push(P('scheiding', 'warm', A.hyd_scheiding));
    heat.push(P('verdeler', 'warm'));
    if (A.reg_menggroepen === 'ja') heat.push(P('menggroep', 'warm'));
    if (A.dis_afleverset === 'ja') heat.push(P('afleverset', 'warm'));
    const warmEmitters = types.filter(t => !['koelplafond', 'balk'].includes(t));
    warmEmitters.forEach(t => heat.push(P(t, 'warm')));

    /* ---- koudeketen ---- */
    if (A.bel_cooling !== 'nee' && A.kou_type && A.kou_type !== 'geen') {
      const k = A.kou_type;
      if (k === 'passief_bodem') cool.push(P('boring', 'koud', 'passief'));
      else if (k === 'vrije_koeling') cool.push(P('vrije_koeling', 'koud'));
      else if (k === 'warmtenet_koude') cool.push(P('warmtenet', 'koud', 'koude'));
      else { cool.push(P('bron', 'koud', A.kou_condensor || 'lucht')); cool.push(P('chiller', 'koud', k)); }
      if (A.hyd_buffer && A.hyd_buffer !== 'geen') cool.push(P('buffer', 'koud'));
      cool.push(P('verdeler', 'koud'));
      const coolEmitters = types.filter(t => ['ventilo', 'koelplafond', 'balk', 'tabs', 'vloer', 'vrf', 'luchtverwarmer'].includes(t));
      (coolEmitters.length ? coolEmitters : ['ventilo']).forEach(t => cool.push(P(t, 'koud')));
    }

    /* ---- sanitair ---- */
    if (A.dhw_aanwezig !== 'nee') {
      if (isHP) dhw.push(P('warmtepomp', 'sww', opw));
      else dhw.push(P('ketel', 'sww'));
      if (A.dhw_systeem === 'verswater') { dhw.push(P('buffer', 'sww', 'verswater')); dhw.push(P('verswater', 'sww')); }
      else if (A.dhw_systeem === 'elektrisch_boiler') dhw.push(P('elektrisch', 'sww'));
      else dhw.push(P('boilervat', 'sww', A.dhw_systeem));
      if (A.dhw_circulatie === 'ja') dhw.push(P('circulatie', 'sww'));
      dhw.push(P('tappunt', 'sww'));
    }

    return { heat, cool, dhw, all: heat.concat(cool, dhw), isHP, opw };
  }

  /* =================================================================== */
  function checkRules(A, R) {
    const out = [];
    const n = x => parseFloat(String(x ?? '').replace(',', '.'));
    const add = (level, id, vars) => out.push({ level, id, vars: vars || {} });
    const t = R.terminals.detail, types = A.afg_types || [];
    const has = k => types.includes(k);
    const isHP = R.chainInfo.isHP;
    /* Same reason as in motivations(): the check texts printed an English
       decimal point beside a results table written with a comma. */
    const fn = (x, d = 1) => (Number.isFinite(x)
      ? x.toLocaleString(LOCALE[App.lang] || 'nl-BE',
          { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: Math.abs(x) >= 1e4 })
      : '—');

    /* ---- 1. Afgifte tegen regime -------------------------------------- */
    ['radiator', 'convector', 'vloerconvector', 'paneel'].forEach(k => {
      const d = t[k]; if (!d) return;
      const pct = Math.round(d.factor * 100);
      if (d.factor < 0.45 && A.afg_bestaand !== 'nee')
        add('blok', 'afgifte_ontoereikend', { type: k, pct, aan: A.reg_t_flow, ret: A.reg_t_return, nodig: fn(d.requiredNominal) });
      else if (d.factor < 0.7)
        add('waarschuwing', 'afgifte_derating', { type: k, pct, aan: A.reg_t_flow, ret: A.reg_t_return, nodig: fn(d.requiredNominal) });
      else add('advies', 'afgifte_ok', { type: k, pct });
    });

    if (t.vloer) {
      if (!t.vloer.ok) add('blok', 'vloer_oververhit', {
        nodig: Math.round(t.vloer.qNeed), max: Math.round(t.vloer.qMax), opp: fn(t.vloer.tSurface)
      });
      if (n(A.afg_vloer_r) > 0.13) add('waarschuwing', 'vloerafwerking', { r: A.afg_vloer_r, tmed: fn(t.vloer.tMedium) });
      if (n(A.afg_vloer_coverage) < 70) add('waarschuwing', 'legoppervlak', { pct: A.afg_vloer_coverage });
    }
    if (t.wand) add('advies', 'wand_niet_gedimensioneerd', { max: t.wand.surfaceLimit });
    if (t.tabs) {
      if (t.tabs.qNeedHeat > t.tabs.maxHeat)
        add('blok', 'tabs_te_zwaar', { nodig: Math.round(t.tabs.qNeedHeat), max: t.tabs.maxHeat });
      if (t.tabs.qNeedCool > t.tabs.maxCool)
        add('waarschuwing', 'tabs_koel_te_zwaar', { nodig: Math.round(t.tabs.qNeedCool), max: t.tabs.maxCool });
      if (A.geb_massa === 'licht') add('blok', 'tabs_zonder_massa');
      if (A.geb_gebruik === 'onderbroken') add('waarschuwing', 'tabs_onderbroken');
    }
    if (t.koelplafond) {
      if (n(A.reg_t_flow_cool) <= n(A.cnd_dewpoint_room) + 2)
        add('blok', 'condens_plafond', { aan: A.reg_t_flow_cool, dauw: A.cnd_dewpoint_room });
      if (A.kou_ontvochtiging === 'geen') add('waarschuwing', 'straling_zonder_ontvochtiging');
    }
    if (has('vloer') && (has('radiator') || has('convector')) && A.reg_menggroepen !== 'ja')
      add('waarschuwing', 'gemengde_regimes');
    if (n(A.bel_latent) > 10 && A.kou_ontvochtiging === 'geen' && A.bel_cooling !== 'nee')
      add('blok', 'latent_zonder_ontvochtiging', { pct: A.bel_latent });

    /* ---- 2. Regime ---------------------------------------------------- */
    if (isHP && n(A.reg_t_flow) > n(A.opw_max_temp, 55))
      add('blok', 'boven_max_temp', { aan: A.reg_t_flow, max: A.opw_max_temp });
    if (isHP && n(A.reg_t_flow) > 50)
      add('waarschuwing', 'hoog_regime', { aan: A.reg_t_flow, cop: fn(R.generation.copDesign, 2) });
    if (R.regime.dT < 3) add('waarschuwing', 'kleine_spreiding', { dt: fn(R.regime.dT), debiet: fn(R.regime.flowHeat, 2) });
    if (isHP && R.regime.dT > 12) add('waarschuwing', 'grote_spreiding', { dt: fn(R.regime.dT) });
    if (A.reg_weersafhankelijk === 'nee') add('waarschuwing', 'geen_stooklijn');
    if (A.reg_dt_marge === 'nee') add('advies', 'regime_niet_vastgelegd');

    /* ---- 3. Opwekking en bivalentie ----------------------------------- */
    const g = R.generation;
    if (g.backupKW > 0.1 && A.biv_backup === 'geen')
      add('blok', 'tekort_zonder_bijstook', { tekort: fn(g.backupKW), cap: fn(g.capacityAtDesign) });
    if (g.bivalentPoint > n(A.biv_punt, -5) + 2)
      add('waarschuwing', 'bivalentpunt_hoger', { werkelijk: fn(g.bivalentPoint), gewenst: A.biv_punt, dekking: Math.round(g.coverage * 100) });
    if (g.coverage < 0.8)
      add('waarschuwing', 'lage_dekking', { dekking: Math.round(g.coverage * 100), backup: A.biv_backup });
    if (A.biv_backup === 'elektrisch' && g.backupKW > 1)
      add('advies', 'elektrische_bijstook', { kw: fn(g.backupKW) });
    if (A.opw_modulatie === 'aan_uit' && A.hyd_buffer === 'geen')
      add('blok', 'aanuit_zonder_buffer', { liter: R.hydraulics.bufferAdvised });
    if (String(A.opw_type).includes('grond') && A.opw_regeneratie === 'nee')
      add('advies', 'geen_regeneratie');
    if (A.opw_type === 'warmtenet' && !A.opw_warmtenet_detail)
      add('waarschuwing', 'warmtenet_voorwaarden');
    if (isHP) add('advies', 'cop_punten', {
      copOntwerp: fn(g.copDesign, 2), copMild: fn(g.copMild, 2), copSeizoen: fn(g.copSeason, 2), aan: A.reg_t_flow
    });

    /* ---- 4. Sanitair warm water --------------------------------------- */
    if (A.dhw_aanwezig !== 'nee') {
      if (isHP && n(A.dhw_t_store, 55) >= 55)
        add('waarschuwing', 'sww_rendement', {
          t: A.dhw_t_store, copSww: fn(g.copDHW, 2), copCv: fn(g.copSeason, 2),
          kwh: Math.round(g.dhwKWhYear), elek: Math.round(g.dhwElec)
        });
      if (A.dhw_systeem === 'verswater' && A.dhw_circulatie === 'ja')
        add('advies', 'verswater_circulatie');
      if (A.dhw_legionella === 'thermisch' && A.biv_backup === 'elektrisch')
        add('advies', 'legionella_elektrisch');
      if (A.dhw_systeem === 'boiler' && isHP)
        add('advies', 'boilerspiraal');
      if (A.dhw_circulatie === 'ja') add('advies', 'circulatieverlies');
      if (A.dhw_voorrang === 'ja' && (has('luchtverwarmer') || has('ventilo')))
        add('advies', 'voorrang_snel_systeem');
    }

    /* ---- 5. Hydraulica ------------------------------------------------- */
    const h = R.hydraulics;
    if (h.bufferGiven > 0 && h.bufferGiven < h.bufferAdvised * 0.8)
      add('waarschuwing', 'buffer_te_klein', { gekozen: h.bufferGiven, nodig: h.bufferAdvised });
    if (h.bufferMode === 'geen' && isHP && A.opw_modulatie !== 'inverter')
      add('waarschuwing', 'geen_buffer');
    if (A.hyd_scheiding === 'open_verdeler')
      add('waarschuwing', 'evenwichtsfles');
    if (A.hyd_inregeling === 'geen') add('blok', 'geen_inregeling');
    if (A.hyd_waterkwaliteit === 'leidingwater') add('waarschuwing', 'vulwater');
    if (A.hyd_waterkwaliteit === 'nog_bepalen') add('advies', 'vulwater_onbepaald');
    if (A.hyd_ontluchting === 'nee' && A.prj_aard !== 'nieuwbouw') add('waarschuwing', 'geen_vuilafscheider');
    if (n(A.reg_glycol_pct) > 0) add('advies', 'glycol', { pct: A.reg_glycol_pct });
    if (h.pumpPower > R.loads.heat * 0.03 && R.loads.heat > 0)
      add('advies', 'pompenergie', { kw: fn(h.pumpPower, 2), pct: fn(h.pumpPower / R.loads.heat * 100) });
    add('advies', 'expansievat', { liter: h.expansion, volume: h.systemVolume });

    /* ---- 6. Koeling ---------------------------------------------------- */
    if (A.bel_cooling !== 'nee') {
      if (A.dis_leidingen === 'tweepijps' && A.geb_gelijktijdig === 'ja')
        add('blok', 'tweepijps_gelijktijdig');
      if (n(A.reg_t_flow_cool) >= 14 && A.kou_vrije_koeling === 'nee')
        add('advies', 'vrije_koeling_gemist', { t: A.reg_t_flow_cool });
      if (A.geb_gelijktijdig === 'ja' && A.kou_terugwinning === 'nee')
        add('advies', 'geen_terugwinning');
      if (A.kou_condensor === 'nat') add('advies', 'koeltoren_legionella');
      if (n(A.reg_t_flow_cool) <= 8 && (has('tabs') || has('koelplafond')))
        add('waarschuwing', 'koudwater_te_koud', { t: A.reg_t_flow_cool });
    }

    /* ---- 7. Elektrisch, veiligheid, geluid ----------------------------- */
    if (n(A.ene_elek_aansluiting) > 0 && n(A.ene_gelijktijdig_elek) > n(A.ene_elek_aansluiting))
      add('blok', 'aansluiting_te_klein', { nodig: A.ene_gelijktijdig_elek, beschikbaar: A.ene_elek_aansluiting });
    if (!A.ene_elek_aansluiting) add('waarschuwing', 'aansluiting_onbekend');
    if (A.opw_koudemiddel === 'R290' && ['techniek', 'berging', 'kelder'].includes(A.ops_plaats_binnen))
      add('waarschuwing', 'propaan_binnen');
    if (!A.ops_geluid_eis) add('waarschuwing', 'geluidseis_onbekend');
    else if (n(A.ops_geluid_afstand) > 0 && n(A.ops_geluid_afstand) < 6 &&
      (A.ops_geluid_maatregel || []).includes('geen_maatregel'))
      add('waarschuwing', 'geluid_dichtbij', { d: A.ops_geluid_afstand, db: A.ops_geluid_eis });
    if (A.ops_condens === 'nee') add('waarschuwing', 'condens_buitendeel');
    if (A.ops_octaaf === 'nee') add('advies', 'geen_octaafband');
    if (A.biv_vorstbeveiliging === 'nee') add('waarschuwing', 'geen_vorstbeveiliging');

    /* ---- 8. Meting, normen, oplevering --------------------------------- */
    const meters = A.ene_meters || [];
    if (!meters.includes('warmte_wp') || !meters.includes('elek_wp'))
      add('waarschuwing', 'geen_rendementsmeting');
    if (!meters.includes('elek_pompen')) add('advies', 'hulpenergie_ongemeten');
    if (A.uit_inregeling === 'nee') add('blok', 'geen_inregelrapport');
    if (A.uit_prestatiemeting === 'nee') add('waarschuwing', 'geen_nulmeting');
    if (A.uit_seizoensmeting === 'nee') add('advies', 'geen_nameting');
    if (n(A.ene_scop_eis) > 0 && A.ene_prestatie !== 'ja') add('advies', 'scop_zonder_garantie');
    if ((A.nrm_vergunning || []).includes('bodemenergie') || String(A.opw_type).includes('grond'))
      add('advies', 'doorlooptijd_boringen');
    if (!(A.uit_documentatie || []).includes('selectie')) add('waarschuwing', 'geen_selectierapport');

    /* ---- 9. Profiel ---------------------------------------------------- */
    if (R.profile) add('advies', 'profiel_note', { profiel: R.profile.id });

    const seen = new Set();
    return out.filter(r => (seen.has(r.id) ? false : seen.add(r.id)))
      .sort((a, b) => LEVEL[b.level] - LEVEL[a.level]);
  }

  /* =================================================================== */
  function motivations(A, R) {
    const m = [];
    const put = (key, vars) => m.push({ key, vars: vars || {} });
    /* toFixed() writes an English decimal point, so the same quantity read
       "11.6 kW" in a motivation and "11,6 kW" in the results table one page
       earlier. Format in the document locale at the intended precision. */
    const fd = (x, d) => (Number.isFinite(x)
      ? x.toLocaleString(LOCALE[App.lang] || 'nl-BE',
          { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: Math.abs(x) >= 1e4 })
      : '—');
    const f1 = x => fd(x, 1);
    const f2 = x => fd(x, 2);
    const g = R.generation, h = R.hydraulics, t = R.terminals.detail;

    put('last', {
      kw: f1(R.loads.heat), spec: f1(R.loads.heat * 1000 / Math.max(1, R.loads.area)),
      kwK: f1(R.loads.cool), tOut: R.loads.tDesign, tIn: R.loads.tRoom, ua: f2(g.UA)
    });
    put('regime', {
      aan: A.reg_t_flow, ret: A.reg_t_return, dt: f1(R.regime.dT),
      debiet: f2(R.regime.flowHeat)
    });
    if (R.chainInfo.isHP) put('opwekker_wp', {
      type: A.opw_type, kw7: A.opw_hp_kw, capOntwerp: f1(g.capacityAtDesign),
      copOntwerp: f2(g.copDesign), copSeizoen: f2(g.copSeason),
      biv: f1(g.bivalentPoint), dekking: Math.round(g.coverage * 100)
    });
    else put('opwekker_overig', { type: A.opw_type, kw: f1(R.loads.heat) });
    if (g.backupKW > 0.05) put('bijstook', { kw: f1(g.backupKW), type: A.biv_backup, strategie: A.biv_strategie });

    Object.keys(t).forEach(k => {
      if (['vloer', 'tabs', 'koelplafond'].includes(k)) return;
      put('afgifte_rad', { type: k, pct: Math.round(t[k].factor * 100), nodig: f1(t[k].requiredNominal) });
    });
    if (t.vloer) put('afgifte_vloer', {
      nodig: Math.round(t.vloer.qNeed), max: Math.round(t.vloer.qMax),
      opp: f1(t.vloer.tSurface), tmed: f1(t.vloer.tMedium), r: A.afg_vloer_r
    });
    if (t.tabs) put('afgifte_tabs', {
      warm: Math.round(t.tabs.qNeedHeat), koud: Math.round(t.tabs.qNeedCool),
      maxWarm: t.tabs.maxHeat, maxKoud: t.tabs.maxCool
    });
    if (A.dhw_aanwezig !== 'nee') put('sww', {
      liter: Math.round(g.dhw.dailyL), kwh: f1(g.dhw.dailyKWh), jaar: Math.round(g.dhwKWhYear),
      t: A.dhw_t_store, cop: f2(g.copDHW), elek: Math.round(g.dhwElec), systeem: A.dhw_systeem
    });
    if (h.bufferAdvised > 0) put('buffer', {
      liter: h.bufferAdvised, looptijd: A.hyd_min_run, ontdooi: h.defrostCalc, mode: A.hyd_buffer
    });
    put('expansie', { liter: h.expansion, volume: h.systemVolume });
    put('energie', {
      warmte: Math.round(g.heatKWh), elek: Math.round(g.elecKWh),
      swwElek: Math.round(g.dhwElec), totaal: Math.round(g.elecKWh + g.dhwElec)
    });
    return m;
  }

  return { chain, checkRules, motivations, FAMILY, LEVEL };

    tweepijps_gelijktijdig: { t: 'Tweepijpssysteem bij gelijktijdige warmte- en koudevraag', d: 'Zones die tegelijk willen verwarmen en koelen kunnen dat met één seizoensomschakeling niet. Kies vierpijps, een bronnet met decentrale warmtepompen, of VRF met terugwinning — anders levert het hele tussenseizoen klachten op.', r: '—' },
    vrije_koeling_gemist: { t: 'Vrije koeling niet benut bij een hoog koelregime', d: 'Bij {t} °C aanvoer is in onze streek een groot deel van het jaar vrije koeling mogelijk, met alleen pompenergie. Dat is het sterkste argument om het koelregime hoog te leggen; benut het.', r: '—' },
    geen_terugwinning: { t: 'Gelijktijdige warmte- en koudevraag zonder terugwinning', d: 'De warmte uit de koeling is het hele jaar bruikbaar voor sanitair water of voor de verwarming van andere zones. Een systeem met terugwinning verdient zich hier vrijwel altijd terug.', r: '—' },
    koeltoren_legionella: { t: 'Natte koeltoren — beheersplan vereist', d: 'Een natte koeltoren is energetisch gunstig en brengt een legionellabeheersplan mee, plus aandacht voor de plaats ten opzichte van luchtinlaten van dit gebouw en van de buren.', r: 'Nationale legionellawetgeving' },
    koudwater_te_koud: { t: 'Lage koudwatertemperatuur bij stralingskoeling', d: 'Bij {t} °C aanvoer is stralingskoeling of betonkern niet veilig te bedrijven wegens condensatie, en gaat bovendien de mogelijkheid van vrije koeling verloren. Scheid de kringen: laag water voor ontvochtiging, hoog water voor straling.', r: '—' },

    aansluiting_te_klein: { t: 'Elektrisch aansluitvermogen ontoereikend', d: 'Geraamd gelijktijdig {nodig} kW tegenover {beschikbaar} kW beschikbaar. Verzwaren duurt maanden en kost soms meer dan de installatie zelf. Ga dit na vóór de bestelling, en onderzoek of de piek te spreiden is via de regeling.', r: '—' },
    aansluiting_onbekend: { t: 'Elektrisch aansluitvermogen niet opgegeven', d: 'Dit is de meest voorkomende verrassing van een warmtepompproject. Vraag de beschikbare aansluitwaarde op en tel warmtepomp, bijstook, tapwaterbereiding en eventuele laadinfrastructuur bij elkaar op voor het koudste uur van het jaar.', r: '—' },
    propaan_binnen: { t: 'Propaan (R290) bij binnenopstelling', d: 'R290 is sterk brandbaar en zwaarder dan lucht: het zakt naar lager gelegen ruimten. Vraag de vullinghoeveelheid, de minimale ruimtegrootte, de eisen aan ventilatie en de afstand tot kelders, putten en openingen — en doe dat vóór u de opstellingsplaats vastlegt.', r: 'EN 378; IEC 60335-2-40' },
    geluidseis_onbekend: { t: 'Geen geluidseis opgegeven', d: 'Geluid van buitendelen is bij warmtepompen de meest voorkomende klacht en de meest voorkomende reden voor handhaving. Zoek de toepasselijke grenswaarde op de beoordelingsplaats op, en let op de nachtwaarde — juist \'s nachts draait het toestel door.', r: 'Regionale milieuvoorwaarden' },
    geluid_dichtbij: { t: 'Buitendeel dicht bij een beoordelingspunt zonder maatregelen', d: 'Op {d} m met een eis van {db} dB(A) is enige maatregel vrijwel zeker nodig. Let op: nachtmodus verlaagt het geluid én het vermogen, precies wanneer het buiten het koudst is — reken door of het gebouw dat aankan.', r: '—' },
    condens_buitendeel: { t: 'Condensafvoer van het buitendeel niet geregeld', d: 'Een luchtwarmtepomp produceert bij vorst tientallen liters condens per dag. Zonder verwarmde afvoer of grindbed vriest dat vast onder het toestel en op het pad ernaast — met valgevaar en een geblokkeerde ventilator als gevolg.', r: '—' },
    geen_octaafband: { t: 'Geen octaafbandgegevens gevraagd', d: 'Eén dB(A)-waarde volstaat niet voor een akoestische berekening en al helemaal niet voor het laagfrequente deel, dat door gevels heen gaat en het meest stoort.', r: '—' },
    geen_vorstbeveiliging: { t: 'Vorstbeveiliging bij uitval niet geregeld', d: 'Wat gebeurt er bij een storing tijdens de vorstperiode, en wie krijgt bericht? Bij een gebouw met veel water in de vloer is dit geen theoretische vraag.', r: '—' },

    geen_rendementsmeting: { t: 'Geen warmte- én elektriciteitsmeting op de opwekker', d: 'Zonder beide meters is het werkelijke seizoensrendement niet vast te stellen en is elke discussie over tegenvallende prestaties onbeslisbaar. Dat is precies waarom die meters zo vaak ontbreken — neem ze op in de uitvraag.', r: '—' },
    hulpenergie_ongemeten: { t: 'Hulpenergie niet apart gemeten', d: 'Pompen, ontdooien, elektronica en circulatie tellen op en verklaren vaak het verschil tussen het beloofde en het gemeten rendement. Een aparte meter kost weinig en maakt de discussie feitelijk.', r: '—' },
    geen_inregelrapport: { t: 'Geen inregelrapport gevraagd', d: 'Debieten per kring, gemeten en genoteerd. Zonder dit rapport is niet aantoonbaar dat de installatie op het ontworpen regime kan draaien, en heeft niemand een reden om het te controleren.', r: '—' },
    geen_nulmeting: { t: 'Geen prestatiemeting bij oplevering', d: 'Aanvoer, retour, debiet, opgenomen en afgegeven vermogen bij een gedefinieerde bedrijfstoestand. Zonder nulmeting is later niet vast te stellen of er iets veranderd is.', r: '—' },
    geen_nameting: { t: 'Geen nameting na het eerste stookseizoen', d: 'Het werkelijke rendement blijkt pas over een heel seizoen. Een terugkomafspraak om stooklijn en instellingen bij te stellen levert doorgaans tien tot twintig procent besparing — meer dan de meeste componentkeuzes.', r: '—' },
    scop_zonder_garantie: { t: 'Rendementseis zonder prestatiegarantie', d: 'Een gevraagd seizoensrendement zonder afgesproken meetgrenzen, meetmethode en gevolgen bij niet-halen is een wens, geen eis. Leg vast wat er gebeurt als het niet gehaald wordt.', r: '—' },
    doorlooptijd_boringen: { t: 'Doorlooptijd van vergunning en boringen', d: 'Bodemenergie vraagt vergunning, soms een responstest en altijd planning met een boorfirma. Die doorlooptijd bepaalt de planning vaker dan de levertijd van de toestellen. Start het traject vóór de bestelling.', r: 'Regelgeving bodemenergie' },
    geen_selectierapport: { t: 'Geen selectierapport gevraagd bij de offerte', d: 'Vraag de prestaties bij úw aanvoertemperatuur, debiet en brontemperatuur. Dat ene document maakt aanbiedingen van verschillende fabrikanten voor het eerst vergelijkbaar — zonder dat vergelijkt u brochures.', r: '—' },
    profiel_note: { t: 'Aandachtspunt bij dit gebouwtype', d: '{note}', r: '{basis}' }
  },

const LANG_FR = {"code":"fr","name":"Français","prof":{"woning_nieuw":{"label":"Logement — construction neuve","note":"Ici, tout s'emboîte : bonne enveloppe, plancher chauffant, régime bas. L'attention se déplace vers l'eau chaude sanitaire — dans un logement moderne, elle représente vite la moitié du besoin annuel de chaleur et elle fonctionne à une température bien moins favorable que le chauffage.","basis":"PEB construction neuve ; EN 12831"},"woning_renovatie":{"label":"Logement — rénovation","note":"La catégorie la plus délicate et la plus fréquente. Les radiateurs existants ont été sélectionnés à 75/65 et ne fournissent plus, à 45/40, qu'environ un tiers de leur puissance déclarée. Inventoriez pièce par pièce ce qui est installé, calculez ce que cela donne au régime souhaité, et remplacez de manière ciblée les éléments insuffisants — c'est presque toujours moins cher qu'une pompe à chaleur plus grande ou qu'un régime plus élevé.","basis":"EN 12831 ; inventaire des émetteurs existants"},"appartement_collectief":{"label":"Immeuble collectif de logements","note":"Ici, ce sont la production sanitaire et la boucle de circulation qui déterminent le rendement, pas le chauffage. Une conduite collective maintenue toute l'année à 60 °C perd en continu ; des modules ECS instantanés par logement sur un réseau de source à 40 °C résolvent à la fois la question de la légionelle et le problème de rendement.","basis":"PEB ; comptage par unité"},"kantoor_nieuw":{"label":"Bureau — construction neuve","note":"L'activation du noyau béton avec la géothermie forme ici le couple fort : le sous-sol fournit en été un refroidissement passif et se recharge par la même occasion pour l'hiver. La condition est toutefois d'avoir de la masse dans le bâtiment et une régulation terminale qui absorbe la pointe — le noyau béton seul n'encaisse pas la charge de pointe et ne régule pas par local.","basis":"EN 16798-1 ; PEB"},"kantoor_renovatie":{"label":"Bureau — rénovation","note":"Attention aux zones qui veulent chauffer et refroidir en même temps : façade sud au soleil alors que le côté nord demande encore. Un système deux tubes à commutation saisonnière rend cela impossible et génère des plaintes pendant toute la mi-saison.","basis":"EN 16798-1"},"school":{"label":"École","note":"Occupation fortement intermittente avec des congés : ici, c'est la surpuissance de relance qui détermine la puissance du générateur, pas la charge de dimensionnement. Une optimisation du démarrage avec une régulation qui apprend le temps de relance revient moins cher que des kilowatts supplémentaires — et une émission lente comme le noyau béton s'accorde justement mal avec ce profil.","basis":"EN 16798-1 ; directives de l'enseignement"},"zorg":{"label":"Établissement de soins","note":"L'eau chaude sanitaire domine : consommation élevée, continue, avec boucle de circulation et régime légionelle strict à 60 °C. Traitez-la comme une installation distincte avec sa propre production ou son propre étage haute température, faute de quoi elle tire vers le bas le rendement de tout le chauffage.","basis":"EN 16798-1 ; directives de soins ; législation sur la légionelle"},"winkel":{"label":"Commerce / retail","note":"Charge interne élevée due à l'éclairage et aux visiteurs : ici, il faut souvent refroidir toute l'année et ne chauffer qu'à l'ouverture. Là où se trouvent aussi des meubles frigorifiques, la chaleur de leurs condenseurs est une source de chaleur gratuite pour le magasin — ce couplage est presque toujours oublié.","basis":"EN 16798-1"},"sport":{"label":"Équipement sportif","note":"La pointe de douches est dimensionnante et dure vingt minutes. Ici, le stockage revient bien moins cher que la puissance : un grand ballon chargé tranquillement toute la journée bat une grosse pompe à chaleur qui doit tout fournir d'un coup trois fois par semaine.","basis":"EN 16798-1"},"zwembad_geb":{"label":"Piscine","note":"Trois besoins de chaleur simultanés : eau du bassin, chauffage des locaux et eau des douches, chacun à sa propre température. La plus grande perte est l'évaporation de la surface de l'eau, et la première mesure est une couverture en dehors des heures d'ouverture — elle bat n'importe quelle intervention technique sur l'installation.","basis":"VDI 2089"},"industrie_hal":{"label":"Hall industriel","note":"Les panneaux rayonnants chauffent les personnes et les plans de travail au lieu de l'air sous la toiture, ce qui fait une différence considérable dans un hall de grande hauteur. Ils exigent toutefois une température de départ plus élevée que le plancher chauffant — cet arbitrage doit être posé en connaissance de cause.","basis":"Chauffage de procédé ; EN 12831"},"proces_restwarmte":{"label":"Procédé avec chaleur résiduelle","note":"Là où un procédé doit être refroidi toute l'année, une source de chaleur à température constante est déjà disponible — bien plus favorable que l'air extérieur et sans variation saisonnière. Établissez d'abord la cartographie des niveaux de température et de la simultanéité avant de regarder vers l'extérieur.","basis":"Récupération de chaleur sur les procédés"},"datacenter_geb":{"label":"Centre de données / local serveurs","note":"Uniquement du refroidissement, toute l'année, avec la disponibilité au-dessus du rendement. Le régime de froid élevé rend le free cooling possible une grande partie de l'année, et la chaleur évacuée est utilisable à 26 °C de retour pour un bâtiment voisin ou pour l'eau sanitaire via une pompe à chaleur.","basis":"ASHRAE TC 9.9"}},"ui":{"appTitle":"Cahier des charges chauffage et refroidissement","appSubtitle":"De la production jusqu'aux émetteurs — avec le régime de température comme fil rouge","step":"Étape","of":"sur","next":"Suivant","prev":"Précédent","report":"Rapport","print":"Rapport / PDF","save":"Enregistrer","load":"Ouvrir","reset":"Vider","demo":"Exemple","required":"obligatoire","why":"Pourquoi cette question","kpiHeat":"Puissance de chauffage","kpiCool":"Puissance frigorifique
