ctions required","help":"Dew point monitoring is not optional the moment there is radiant cooling in the building: without a sensor on the flow and one in the room, the ceiling drips on the first muggy day.","options":{"weersafhankelijk":"Weather-compensated flow temperature control","nachtverlaging":"Night setback or shutdown","optimale_start":"Optimum start","zomer_winter":"Automatic summer/winter changeover","dauwpunt":"Dew point monitoring during cooling","vrije_koeling_ctl":"Automatic free cooling","sww_voorrang":"Domestic hot water priority","legionella":"Legionella cycle","pv_sturing":"Control on own solar electricity","tarief":"Control on tariff or grid signal","vorst":"Frost protection","storingsmelding":"Remote fault reporting"}},"ctl_zonering":{"label":"Control per zone","help":"Room-by-room control sounds good and is counterproductive with slow emitters: circuits that close raise the temperature in the remaining ones and make the heat pump cycle. Consider maintaining flow at a low temperature with a limit, rather than shutting circuits off.","options":{"thermostaat_zone":"Thermostat per zone","per_ruimte":"Per room","centraal_ctl":"Central only"}},"ctl_terugmelding":{"label":"Feedback of actual efficiency?","help":"A heat meter plus an electricity meter on the heat pump gives the actual seasonal efficiency. Without those two meters, any argument about disappointing performance is unresolvable — and that is exactly why they are so often missing.","options":{"ja":"Yes","nee":"No"}},"ctl_alarmen":{"label":"Alarms and follow-up","help":"Which faults have to reach whom, within what time, and who acts on them? A heat pump that stops in November and is not noticed until December has let the supplementary heating run for a month."},"ene_elek_aansluiting":{"label":"Available electrical supply capacity","help":"Often the surprise of the project: a heat pump with electric supplementary heating needs a considerably larger supply, and upgrading takes months and sometimes costs more than the installation. Check this before you choose a solution."},"ene_gelijktijdig_elek":{"label":"Estimated coincident electrical peak demand","help":"Heat pump, supplementary heating, domestic hot water production and any charging infrastructure together, in the coldest hour of the year."},"ene_pv":{"label":"Capacity of the on-site solar PV installation","help":"Solar electricity and heat demand do not coincide in time; the overlap is in spring and autumn and in domestic hot water. Do not work with annual averages but with coincidence."},"ene_opslag":{"label":"Is electrical storage present or proposed?","options":{"ja":"Yes","nee":"No"}},"ene_tarief_elek":{"label":"Electricity tariff"},"ene_tarief_gas":{"label":"Gas tariff","help":"The ratio between the two tariffs determines the efficiency at which a heat pump is cheaper than a boiler. At a ratio of four that is only above a seasonal efficiency of four — work that through explicitly instead of assuming it."},"ene_capaciteitstarief":{"label":"Does a capacity or peak-demand tariff apply?","help":"Where billing is based on the monthly peak, it pays to spread the supplementary heating and to move domestic hot water production outside the peak. That is a control question with direct financial consequences.","options":{"ja":"Yes","nee":"No"}},"ene_meters":{"label":"Meters to be provided","help":"Metering auxiliary energy separately is almost never done, and it often explains the difference between the promised and the measured efficiency: pumps, defrosting, electronics and circulation all add up.","options":{"warmte_wp":"Heat meter on the heat pump","warmte_sww":"Heat meter on domestic hot water","koude":"Cooling meter","elek_wp":"Electricity meter, heat pump","elek_backup":"Electricity meter, supplementary heating","elek_pompen":"Electricity meter, pumps and auxiliary energy","eenheid":"Metering per unit or tenant"}},"ene_prestatie":{"label":"Is a performance guarantee on seasonal efficiency being asked for?","help":"Only meaningful with metering boundaries, measurement method and boundary conditions agreed in advance. Ask what happens if the guarantee is not met, because that is where the real value lies.","options":{"ja":"Yes","nee":"No"}},"ene_scop_eis":{"label":"Seasonal efficiency required (SCOP)","help":"State the boundary conditions with it: which regime, with or without domestic hot water, with or without auxiliary energy. Without that definition the figure is meaningless."},"ops_plaats_binnen":{"label":"Siting of the indoor units","help":"State the clear space all round, the door width and the floor loading. With a propane heat pump indoors there are additional requirements on the volume of the room, on ventilation and on the presence of lower-lying spaces into which the gas could sink.","options":{"techniek":"Plant room","berging":"Store or utility room","kelder":"Cellar","dak":"Rooftop enclosure","buiten_ops":"Entirely outdoors"}},"ops_plaats_buiten":{"label":"Position of the outdoor units","help":"Distance to the site boundary, to the windows of your own dwelling and of the neighbours, and the direction the fan blows in. Consider too where the cold discharge air goes: onto a terrace or a path it produces frost and black ice."},"ops_geluid_eis":{"label":"Permissible noise level at the assessment position","help":"Follows from the regional environmental conditions and generally applies at the site boundary or at the nearest neighbour's window. The night-time value governs, and it is at night in particular that a heat pump keeps running."},"ops_geluid_afstand":{"label":"Distance to the nearest assessment point"},"ops_geluid_maatregel":{"label":"Acoustic measures proposed","help":"Night mode lowers the noise and the output at the same time — just when it is coldest outside. Work through whether the building can take that, otherwise you solve the noise problem at the expense of the heat.","options":{"nachtmodus":"Night mode with speed limitation","omkasting":"Acoustic enclosure or barrier","trillingsdempers":"Anti-vibration mounts and flexible connections","plaatsing":"Positioned away from sensitive façades","geen_maatregel":"No measures proposed"}},"ops_octaaf":{"label":"Request sound power per octave band?","help":"A single dB(A) figure is not enough for an acoustic calculation, and certainly not for the low-frequency part, which passes through façades and causes the most annoyance.","options":{"ja":"Yes","nee":"No"}},"ops_trillingen":{"label":"Vibration isolation of compressor and pumps?","help":"Where the plant sits on a lightweight floor or against a living space, the vibration isolation determines whether the installation is audible, even if the airborne noise is in order.","options":{"ja":"Yes","nee":"No"}},"ops_koudemiddel_veiligheid":{"label":"Refrigerant safety","help":"Charge per circuit, minimum room size, leak detection, ventilation and distance to openings and cellars. With propane this partly determines the siting — ask before you fix the position."},"ops_condens":{"label":"Is condensate drainage from the outdoor unit arranged?","help":"An air source heat pump produces tens of litres of condensate a day in frost. Without a heated drain or a gravel bed that freezes solid under the unit and on the path beside it.","options":{"ja":"Yes","nee":"No"}},"ops_toegang":{"label":"Is clear service space and access assured?","help":"Including the space to remove a compressor or heat exchanger, ten years from now, once all sorts of things have been built around it.","options":{"ja":"Yes","nee":"No"}},"nrm_epb":{"label":"Does the project fall under the energy performance regulations?","help":"Determines minimum requirements for efficiency, pipe insulation, metering and sometimes for the renewable energy share.","options":{"ja":"Yes","nee":"No"}},"nrm_normen":{"label":"Standards and guidelines to be applied","help":"For each standard, ask for the supporting evidence, not for a statement that it has been complied with. With EN 14511 it is all about the test conditions: the same machine scores very differently under different boundary conditions.","options":{"en12831":"EN 12831 — heat loss calculation","en1264":"EN 1264 — underfloor heating","en442":"EN 442 — radiators","en14511":"EN 14511 / EN 14825 — heat pump performance","en378":"EN 378 — refrigeration safety","en12828":"EN 12828 — heating systems in buildings","vdi2035":"VDI 2035 — fill water quality","legionella_norm":"National legionella legislation","bodem":"Ground energy regulations"}},"nrm_vergunning":{"label":"Permits and notifications required","help":"Boreholes and groundwater abstraction have long lead times and sometimes mandatory studies. So does a network upgrade. Start these processes before placing the order, not after.","options":{"omgeving":"Planning permission","milieu":"Environmental notification or permit","bodemenergie":"Ground energy or drilling permit","grondwater":"Groundwater permit","netbeheerder":"Application to upgrade the grid connection","geen_verg":"None"}},"nrm_fgas":{"label":"Registration and leak checking under the F-gas Regulation?","help":"Depending on the refrigerant charge, periodic leak checking and a logbook are required. Ask who keeps that up and where the logbook is kept.","options":{"ja":"Yes","nee":"No"}},"nrm_subsidie":{"label":"Grants and their conditions","help":"Grants often attach requirements to efficiency, to the installer's accreditation and to the timing of the application. In many schemes an application made after the order has been placed is no longer valid."},"nrm_erkenning":{"label":"Is an accredited installer required?","help":"For refrigeration work and for most grants. Ask for the certificate number with the quotation, not at handover.","options":{"ja":"Yes","nee":"No"}},"uit_fasering":{"label":"Phasing and continuity during the works","help":"Does the building have to stay in operation? For a replacement during the heating season a temporary provision is needed — agree who supplies it and who pays for it."},"uit_inregeling":{"label":"Hydronic balancing with a report?","help":"Flow rates per circuit, measured and recorded. This is the difference between an installation that works at 35 °C and the same installation that has to run at 45 °C because the furthest circuit cannot manage.","options":{"ja":"Yes","nee":"No"}},"uit_prestatiemeting":{"label":"Performance measurement at handover?","help":"Flow, return, flow rate, power input and heat output at a defined operating condition. Without a baseline measurement nothing can be demonstrated later.","options":{"ja":"Yes","nee":"No"}},"uit_seizoensmeting":{"label":"Re-measurement after the first heating season?","help":"The real efficiency only shows over a whole season. Agree that the installer comes back after a year to adjust the heating curve and the settings — that is often worth ten to twenty per cent in savings.","options":{"ja":"Yes","nee":"No"}},"uit_documentatie":{"label":"Documentation required","help":"Ask for the selection report with the quotation, showing performance at your flow temperature. That single document makes quotations from different manufacturers comparable for the first time.","options":{"berekening":"Heat loss and cooling load calculation","selectie":"Selection report with performance points at the project regime","schema":"Hydraulic schematic, as built","elektrisch":"Electrical schematic and points list","inregel":"Balancing report with measured flow rates","stooklijn":"Heating curve as set and control parameters","onderhoud":"Maintenance instructions with intervals","logboek":"Refrigerant logbook","garantie":"Warranty terms and conditions"}},"uit_opleiding":{"label":"Is training of the building manager provided for?","help":"Anyone who does not understand the heating curve will turn it up at the first complaint — and then the efficiency is gone. An hour of explanation at handover pays for itself.","options":{"ja":"Yes","nee":"No"}},"uit_onderhoud":{"label":"Maintenance contract","options":{"geen":"None","basis":"Basic — inspection and statutory checks","volledig":"Full — including controls and performance monitoring","nog_bepalen":"Still to be determined"}},"uit_garantie":{"label":"Warranty period required"},"uit_levertijd":{"label":"Delivery time or completion date required","help":"Ask for the delivery time of the controls and of the outdoor units separately; they rarely run to the same schedule."},"uit_budget":{"label":"Budget indication"},"uit_opmerkingen":{"label":"Other remarks and constraints"}},"pgroup":{"wonen":"Residential","utiliteit":"Non-domestic","industrie":"Industry and process"}};

const LANG_DE = {"code":"de","name":"Deutsch","prof":{"woning_nieuw":{"label":"Wohnhaus — Neubau","note":"Hier fügt sich alles: gute Gebäudehülle, Fußbodenheizung, niedriges Regime. Die Aufmerksamkeit verlagert sich auf das Trinkwarmwasser — das ist bei einem modernen Wohnhaus schnell die Hälfte des jährlichen Wärmebedarfs und läuft auf einem weit ungünstigeren Temperaturniveau als die Heizung.","basis":"Energieeinsparvorschriften Neubau; EN 12831"},"woning_renovatie":{"label":"Wohnhaus — Sanierung","note":"Die schwierigste Kategorie und die häufigste. Vorhandene Heizkörper sind auf 75/65 ausgelegt und liefern bei 45/40 noch etwa ein Drittel ihrer angegebenen Leistung. Erfassen Sie raumweise, was montiert ist, rechnen Sie durch, was beim gewünschten Regime herauskommt, und ersetzen Sie gezielt die Elemente, die zu schwach sind — das ist fast immer günstiger als eine größere Wärmepumpe oder ein höheres Regime.","basis":"EN 12831; vorhandene Wärmeübergabe erfassen"},"appartement_collectief":{"label":"Mehrfamilienhaus mit Zentralversorgung","note":"Hier bestimmen die Trinkwarmwasserbereitung und die Zirkulationsleitung den Wirkungsgrad, nicht die Heizung. Eine gemeinschaftliche Leitung, die das ganze Jahr auf 60 °C steht, verliert fortwährend; Frischwasserstationen je Wohnung an einem Quellennetz mit 40 °C lösen sowohl die Legionellenfrage als auch das Effizienzproblem.","basis":"Energieeinsparvorschriften; Messung je Einheit"},"kantoor_nieuw":{"label":"Bürogebäude — Neubau","note":"Betonkernaktivierung mit Erdwärme ist hier die starke Kombination: Das Erdreich liefert im Sommer passive Kühlung und wird dabei für den Winter aufgeladen. Voraussetzung sind allerdings Masse im Gebäude und eine Nachregelung, die die Spitze auffängt — die Betonkernaktivierung allein schafft die Spitzenlast nicht und regelt nicht raumweise.","basis":"EN 16798-1; Energieeinsparvorschriften"},"kantoor_renovatie":{"label":"Bürogebäude — Sanierung","note":"Achten Sie auf die Zonen, die gleichzeitig heizen und kühlen wollen: Südfassade in der Sonne, während die Nordseite noch Wärme verlangt. Ein Zweileitersystem mit saisonaler Umschaltung macht das unmöglich und führt die gesamte Übergangszeit über zu Beschwerden.","basis":"EN 16798-1"},"school":{"label":"Schule","note":"Stark unterbrochene Nutzung mit Ferien: Hier bestimmt der Aufheizzuschlag die Erzeugerleistung, nicht die Auslegungslast. Ein optimierter Start mit einer Regelung, die die Aufheizzeit lernt, ist günstiger als zusätzliche Kilowatt — und eine träge Wärmeübergabe wie die Betonkernaktivierung passt gerade schlecht zu diesem Muster.","basis":"EN 16798-1; Richtlinien für Bildungsbauten"},"zorg":{"label":"Pflegeeinrichtung","note":"Das Trinkwarmwasser dominiert: hoher Verbrauch, durchgehend, mit Zirkulationsleitung und mit einem strikten Legionellenregime auf 60 °C. Behandeln Sie es als eigenständige Anlage mit eigener Erzeugung oder eigener Hochtemperaturstufe, sonst zieht es den Wirkungsgrad der gesamten Heizung nach unten.","basis":"EN 16798-1; Pflegerichtlinien; Legionellenvorschriften"},"winkel":{"label":"Ladengeschäft / Einzelhandel","note":"Hohe interne Last durch Beleuchtung und Besucher: Kühlen steht hier oft das ganze Jahr an und Heizen nur zur Öffnung. Wo auch Kühlmöbel stehen, ist deren Verflüssigerwärme eine kostenlose Wärmequelle für den Laden — diese Kopplung wird fast immer vergessen.","basis":"EN 16798-1"},"sport":{"label":"Sportstätte","note":"Die Duschspitze ist maßgebend und dauert zwanzig Minuten. Speichervolumen ist hier weit günstiger als Leistung: Ein großer Speicher, der den ganzen Tag ruhig geladen wird, schlägt eine große Wärmepumpe, die dreimal pro Woche kurz alles liefern muss.","basis":"EN 16798-1"},"zwembad_geb":{"label":"Schwimmbad","note":"Drei Wärmeanforderungen gleichzeitig: Beckenwasser, Raumheizung und Duschwasser, jede mit eigener Temperatur. Der größte Verlust ist die Verdunstung von der Wasseroberfläche, und die erste Maßnahme ist eine Abdeckung außerhalb der Öffnungszeiten — die schlägt jeden anlagentechnischen Eingriff.","basis":"VDI 2089"},"industrie_hal":{"label":"Industriehalle","note":"Strahlungsplatten erwärmen Menschen und Arbeitsflächen statt der Luft unter dem Dach, und das macht in einer hohen Halle erheblich viel aus. Sie verlangen allerdings eine höhere Vorlauftemperatur als eine Fußbodenheizung — diesen Tausch müssen Sie bewusst machen.","basis":"Prozesswärme; EN 12831"},"proces_restwarmte":{"label":"Prozess mit Abwärme","note":"Wo ein Prozess das ganze Jahr gekühlt werden muss, steht eine Wärmequelle mit konstanter Temperatur bereit — weit günstiger als Außenluft und ohne saisonalen Verlauf. Erfassen Sie zuerst die Temperaturniveaus und die Gleichzeitigkeit, bevor Sie nach draußen schauen.","basis":"Wärmerückgewinnung aus Prozessen"},"datacenter_geb":{"label":"Rechenzentrum / Serverraum","note":"Nur Kühlen, das ganze Jahr, mit Verfügbarkeit vor Effizienz. Das hohe Kühlregime ermöglicht freie Kühlung während eines großen Teils des Jahres, und die abgeführte Wärme ist bei 26 °C Rücklauf für ein angrenzendes Gebäude oder über eine Wärmepumpe für Trinkwarmwasser nutzbar.","basis":"ASHRAE TC 9.9"}},"ui":{"appTitle":"Ausschreibungsabfrage Heizen und Kühlen","appSubtitle":"Von der Erzeugung bis zur Wärmeübergabe — mit dem Temperaturregime als rotem Faden","step":"Schritt","of":"von","next":"Weiter","prev":"Zurück","report":"Bericht","print":"Bericht / PDF","save":"Speichern","load":"Öffnen","reset":"Leeren","demo":"Beispiel","required":"Pflichtangabe","why":"Warum diese Frage","kpiHeat":"Heizleistung","kpiCool":"Kühlleistung","kpiRegime":"Regime Heizen","kpiFlowRate":"Wasservolumenstrom Heizen","kpiCop":"COP bei Auslegungsbedingungen","kpiScop":"Jahresarbeitszahl (Abschätzung)","kpiBivalent":"Bivalenzpunkt","kpiCoverage":"Deckungsanteil der Wärmepumpe","kpiBackup":"Erforderliche Zusatzheizung","kpiBuffer":"Empfohlenes Puffervolumen","kpiExpansion":"Ausdehnungsgefäß","kpiDhw":"Trinkwarmwasser","kpiDhwCop":"COP Trinkwarmwasser","kpiEnergyHeat":"Wärmebedarf pro Jahr","kpiEnergyElec":"Strom pro Jahr","kpiUA":"Wärmeverlustkoeffizient","kpiRadiator":"Wärmeübergabe bei diesem Regime","diagramTitle":"Aufbau der Anlage","rowWarm":"Heizen","rowKoud":"Kühlen","rowSww":"Trinkwarmwasser","diagramEmpty":"Füllen Sie den Fragebogen aus — die Kette setzt sich hier zusammen.","diagramNote":"Schematische Darstellung der Kette von der Wärmequelle bis zur Wärmeübergabe. Nutzen Sie sie zur Kontrolle der Ausschreibungsabfrage, nicht als hydraulisches Schema.","checksTitle":"Prüfungen","checksNone":"Keine Befunde bei den aktuellen Eingaben.","levelBlok":"Blockierend","levelWaarschuwing":"Warnung","levelAdvies":"Hinweis","checksCount":"{blok} blockierend · {waarschuwing} Warnungen · {advies} Hinweise","basis":"Grundlage","reportTitle":"Ausschreibungsabfrage Heizung und Kühlung","reportFor":"Für","reportBy":"Erstellt von","reportDate":"Datum","reportRef":"Referenz","secSummary":"Zusammenfassung","secDuty":"Berechnete Werte","secModules":"Systemwahl und Begründung","secChecks":"Hinweise und Risiken","secQuestions":"Offene Fragen an den Lieferanten","secAll":"Vollständige Ausschreibungsabfrage","secDisclaimer":"Vorbehalt","colModule":"Komponente","colWhy":"Warum diese Wahl","colDriver":"Maßgebende Daten","colNorm":"Grundlage","unanswered":"nicht ausgefüllt","disclaimer":"Alle auf diesem Blatt berechneten Werte sind Auslegungsrichtwerte, die die Ausschreibungsabfrage untermauern und Systemfehler frühzeitig sichtbar machen sollen. Der Wirkungsgrad einer Wärmepumpe ist mit einer Carnot-Näherung und einem realistischen Gütegrad berechnet; die tatsächlichen Leistungen stammen aus zertifizierten Messdaten nach EN 14511 und EN 14825 bei den tatsächlichen Bedingungen. Die endgültige Auswahl, die hydraulische Ausarbeitung und die garantierten Leistungen kommen vom Lieferanten, mit projektspezifischer Verifikation.","openQuestions":["Leistung und COP beim tatsächlichen Projektregime, nicht nur bei A7/W35 — fordern Sie die vollständige Tabelle an.","Minimale Modulationsleistung und Verhalten bei Teillast.","Mindestlaufzeit und das daraus folgende Puffervolumen.","Leistung und COP bei der Trinkwarmwasserbereitung, getrennt von der Heizung.","Verhalten und Energieverbrauch während der Abtauung sowie der Einfluss auf die abgegebene Wärme.","Schallleistung je Oktavband, im Normalbetrieb und im Nachtmodus, mit der im Nachtmodus verbleibenden Leistung.","Kältemittelfüllmenge je Kreislauf und die Anforderungen an den Aufstellraum.","Wasserseitiger Druckverlust der Geräte beim Projektvolumenstrom.","Datenpunktliste der Regelung mit Lese- und Schreibrechten.","Zulässige Füllwasserqualität und die daran geknüpften Gewährleistungsbedingungen.","Auslegungsbericht zum Angebot, damit Angebote vergleichbar werden."]},"val":{"lucht_water":"Luft/Wasser","lucht_lucht":"Luft/Luft","grond_boring":"Sole/Wasser mit vertikalen Erdsonden","grond_horizontaal":"Sole/Wasser mit Flächenkollektor","water_water":"Wasser/Wasser","afvoerlucht":"Abluft als Wärmequelle","hybride":"Hybrid","gasketel":"Gas-Brennwertkessel","elektrisch":"Elektroheizung","warmtenet":"Fernwärme","wkk":"Kraft-Wärme-Kopplung","biomassa":"Biomasse","zon_thermisch":"Solarkollektoren","radiator":"Heizkörper","convector":"Konvektoren","vloerconvector":"Unterflurkonvektoren","paneel":"Strahlungsplatten","plafondpaneel":"Deckenstrahlplatten","ventilo":"Gebläsekonvektoren","luchtverwarmer":"Luftheizung","vloer":"Fußbodenheizung","wand":"Wandheizung","tabs":"Betonkernaktivierung","koelplafond":"Kühldecke","balk":"Kühlbalken","vrf":"VRF","boiler":"Speicher mit Heizwendel","verswater":"Frischwasserstation","laadsysteem":"Ladesystem mit externem Wärmeübertrager","decentraal":"dezentrale Bereitung","elektrisch_boiler":"elektrischer Warmwasserspeicher","geen":"keine","serie":"in Reihe","parallel":"parallel","ontdooi":"für die Abtauung","monovalent":"monovalent","alternatief":"bivalent alternativ","deels_parallel":"teilparallel","tweede_wp":"zweite Wärmepumpe","gasketel_biv":"Gaskessel","reversibel":"reversible Wärmepumpe","chiller":"separate Kältemaschine","passief_bodem":"passive Erdkühlung","vrije_koeling":"freie Kühlung","adiabatisch":"adiabate Kühlung","warmtenet_koude":"Fernkältenetz","lucht":"luftgekühlt","droog":"Trockenkühler","nat":"nasser Kühlturm","bodem":"in das Erdreich","water":"in Wasser","adiabatisch_cond":"adiabat unterstützt"},"fam":{"bron":"Wärmequelle","opwekking":"Erzeugung","opslag":"Speicherung und Trennung","distributie":"Verteilung","afgifte":"Wärmeübergabe","sanitair":"Trinkwasser","overig":"Sonstiges"},"mod":{"buitendeel":"Außeneinheit","boring":"Erdsonden","grondwater":"Grundwasser","restwarmte":"Abwärme","bron":"Wärmequelle","warmtepomp":"Wärmepumpe","ketel":"Kessel","elektrisch":"Elektrisch","warmtenet":"Fernwärme","chiller":"Kältemaschine","wkk":"KWK","vrije_koeling":"Freie Kühlung","buffer":"Pufferspeicher","boilervat":"Warmwasserspeicher","scheiding":"Trennung","verdeler":"Verteiler","menggroep":"Mischerkreis","pomp":"Pumpe","afleverset":"Wohnungsstation","vloer":"Fußbodenheizung","wand":"Wandheizung","tabs":"Betonkern","radiator":"Heizkörper","convector":"Konvektor","vloerconvector":"Unterflurkonvektor","ventilo":"Fancoil","koelplafond":"Kühldecke","balk":"Kühlbalken","paneel":"Strahlungsplatte","luchtverwarmer":"Luftheizung","vrf":"VRF-Gerät","verswater":"Frischwasserstation","tappunt":"Zapfstelle","circulatie":"Zirkulation"},"rules":{"afgifte_ontoereikend":{"t":"Vorhandene Wärmeübergabe erreicht das gewählte Regime nicht","d":"Bei {aan}/{ret} °C erreicht die Wärmeübergabe über {type} nur noch {pct} % der Nennleistung, nach der sie gemäß EN 442 ausgewählt wurde — diese gilt bei 75/65/20. Um die Last zu decken, sind etwa {nodig} kW Nennleistung erforderlich. Erfassen Sie raumweise, was montiert ist, und ersetzen Sie gezielt die Elemente, die zu schwach sind; das ist fast immer günstiger als ein größeres Gerät oder ein höheres Regime, und es ist der einzige Eingriff, der den Wirkungsgrad tatsächlich verbessert.","r":"EN 442"},"afgifte_derating":{"t":"Wärmeübergabe liefert bei diesem Regime deutlich weniger","d":"Bei {aan}/{ret} °C erreicht die Wärmeübergabe über {type} noch {pct} % der Nennleistung. Rechnen Sie mit etwa {nodig} kW Nennleistung, um die Last zu decken. Prüfen Sie das raumweise: Der Mittelwert sagt nichts aus, entscheidend ist der Raum mit der knappsten Auslegung.","r":"EN 442"},"afgifte_ok":{"t":"Wärmeübergabe passt zum gewählten Regime","d":"Bei diesem Regime erreicht die Wärmeübergabe über {type} noch {pct} % der Nennleistung. Prüfen Sie dennoch den Raum mit dem ungünstigsten Verhältnis zwischen Last und installierter Wärmeübergabe.","r":"EN 442"},"vloer_oververhit":{"t":"Fußbodenheizung über der zulässigen Oberflächentemperatur","d":"Der geforderte Wärmestrom beträgt {nodig} W/m², während bei der maximalen Oberflächentemperatur von 29 °C im Aufenthaltsbereich etwa {max} W/m² möglich sind. Die berechnete Oberflächentemperatur wird {opp} °C — das liegt nicht nur außerhalb der Norm, sondern ist auch unbehaglich. Vergrößern Sie die Verlegefläche, verkleinern Sie den Verlegeabstand oder ergänzen Sie ein zweites Übergabesystem.","r":"EN 1264"},"vloerafwerking":{"t":"Bodenbelag mit hohem Wärmedurchlasswiderstand","d":"Bei R = {r} m²K/W muss die Wassertemperatur auf etwa {tmed} °C steigen, um dieselbe Wärme abzugeben. Das ist der leiseste Projektkiller überhaupt: Der Bauherr wählt den Bodenbelag unabhängig von der Anlage, und der Wirkungsgrad der Wärmepumpe geht mit. Legen Sie den maximal zulässigen Widerstand in der Ausschreibung fest und kommunizieren Sie ihn.","r":"EN 1264"},"legoppervlak":{"t":"Begrenzte Verlegefläche für die Fußbodenheizung","d":"Bei {pct} % verfügbarer Fläche muss dieselbe Wärme durch weniger Quadratmeter, und die Wassertemperatur steigt entsprechend. Prüfen Sie, ob Einbauschränke und Geräte wirklich an dieser Stelle stehen werden, und erwägen Sie eine Wandheizung als Ergänzung.","r":"EN 1264"},"tabs_te_zwaar":{"t":"Betonkernaktivierung kann die Heizlast nicht tragen","d":"Gefordert werden {nodig} W/m², während eine Betonkernaktivierung etwa {max} W/m² liefert. Die Betonkernaktivierung deckt die Grundlast; die Spitze muss von einem zweiten, schnelleren System kommen. Rechnen Sie beides durch, statt zu hoffen, dass die Masse es auffängt.","r":"ISO 11855"},"tabs_koel_te_zwaar":{"t":"Betonkernaktivierung kann die Kühllast nicht allein tragen","d":"Gefordert {nodig} W/m² gegenüber etwa {max} W/m² verfügbar. Ergänzen Sie eine Nachregelung oder senken Sie die Kühllast mit außen liegendem Sonnenschutz — Letzteres ist nahezu immer günstiger als Anlagenleistung.","r":"ISO 11855"},"tabs_zonder_massa":{"t":"Betonkernaktivierung ohne thermische Masse","d":"In einem leichten Gebäude oder unter einer abgehängten Decke hat die Betonkernaktivierung keine wirksame Masse und damit keine Wirkung. Wählen Sie ein anderes Übergabesystem oder legen Sie die Masse frei und nehmen Sie die akustischen Folgen in Kauf.","r":"ISO 11855"},"tabs_onderbroken":{"t":"Träges System bei stark unterbrochener Nutzung","d":"Die Betonkernaktivierung reagiert in Stunden. Bei einem Nutzungsprofil mit starken Unterbrechungen kommt die Wärme zu spät und hört zu spät auf, mit Über- und Unterheizung als Folge. Erwägen Sie ein schnelleres System oder akzeptieren Sie, dass die Betonkernaktivierung nur die Grundlast liefert.","r":"—"},"condens_plafond":{"t":"Kondensationsrisiko an der Kühldecke","d":"Die Vorlauftemperatur von {aan} °C liegt zu dicht am erwarteten Taupunkt von {dauw} °C. Ohne Entfeuchtung an anderer Stelle und ohne Taupunktüberwachung tropft die Decke am ersten schwülen Tag. Erhöhen Sie die Vorlauftemperatur oder sorgen Sie für Entfeuchtung über die Lüftungsanlage und einen Fühler im Vorlauf und im Raum.","r":"ISO 11855; EN 14240"},"straling_zonder_ontvochtiging":{"t":"Strahlungskühlung ohne Entfeuchtung","d":"Eine gekühlte Oberfläche nimmt nur sensible Wärme auf. Ohne Entfeuchtung steigt die Feuchte, bis der Taupunkt an die Begrenzung des Systems stößt, und zwar genau an den wärmsten Tagen. Regeln Sie die Entfeuchtung in der Lüftungsanlage.","r":"—"},"gemengde_regimes":{"t":"Fußbodenheizung und Heizkörper auf einem Regime","d":"Der Erzeuger muss dann die höchste Temperatur liefern, und der Wirkungsgrad folgt den Heizkörpern, nicht dem Fußboden. Sehen Sie einen Mischerkreis vor oder — besser — ersetzen Sie die Heizkörper, damit das gesamte Gebäude auf dem niedrigen Regime laufen kann.","r":"—"},"latent_zonder_ontvochtiging":{"t":"Latente Last von {pct} % ohne Entfeuchtung","d":"Die Feuchte muss irgendwo abgeführt werden. Ohne Entfeuchtung in der Lüftungsanlage oder in den Gebläsekonvektoren steigt die Luftfeuchte, bis die Behaglichkeit verloren geht und die Strahlungskühlung heruntergeregelt werden muss. Legen Sie fest, wo entfeuchtet wird und mit welcher Leistung.","r":"EN 16798-1"},"boven_max_temp":{"t":"Geforderte Vorlauftemperatur über dem Bereich der Wärmepumpe","d":"Gefordert werden {aan} °C, während das Gerät maximal {max} °C liefert. Prüfen Sie zudem, ob dieses Maximum auch bei der niedrigsten Quellentemperatur erreicht wird — viele Geräte erreichen ihr Maximum nur bei milden Außentemperaturen, und das ist genau nicht der Moment, in dem Sie es brauchen.","r":"EN 14511"},"hoog_regime":{"t":"Hohe Vorlauftemperatur für eine Wärmepumpe","d":"Bei {aan} °C liegt der COP bei Auslegungsbedingungen bei etwa {cop}. Jedes Grad weniger bringt grob 2 bis 3 % besseren Wirkungsgrad. Prüfen Sie zuerst, ob sich das Regime durch gezielten Austausch von Übergabeelementen senken lässt; das zahlt sich über die Lebensdauer reichlich aus.","r":"EN 14511"},"kleine_spreiding":{"t":"Sehr kleine Temperaturspreizung","d":"Bei {dt} K Spreizung beträgt der Wasservolumenstrom {debiet} m³/h — das verlangt großzügige Rohrleitungen und kostet das ganze Jahr über Pumpenenergie. Prüfen Sie, ob die Rohrnetzdimensionierung und die Pumpenwahl hierauf beruhen und nicht auf einem Kesselregime.","r":"—"},"grote_spreiding":{"t":"Große Spreizung bei einer Wärmepumpe","d":"Bei {dt} K muss die Wärmepumpe einen niedrigen Rücklauf verarbeiten, während sie einen hohen Vorlauf erzeugt. Die meisten Geräte sind auf 5 bis 8 K ausgelegt; prüfen Sie, ob die angegebenen Leistungsdaten bei dieser Spreizung noch gelten.","r":"EN 14511"},"geen_stooklijn":{"t":"Keine witterungsgeführte Regelung","d":"Ohne Heizkurve läuft die Anlage die ganze Saison auf der Auslegungstemperatur, während bei 7 °C Außentemperatur weit weniger genügt. Das ist ein nahezu kostenloser Effizienzgewinn, und ihn wegzulassen nimmt der Wärmepumpe einen großen Teil ihres Vorteils.","r":"—"},"regime_niet_vastgelegd":{"t":"Regime nicht vertraglich festgelegt","d":"Legen Sie Vorlauf, Rücklauf und Spreizung mit Messpunkten bei der Abnahme fest. Ohne diese Vereinbarung wandert das Regime während der Ausführung stillschweigend nach oben, und hinterher ist niemand für den enttäuschenden Wirkungsgrad verantwortlich.","r":"—"},"tekort_zonder_bijstook":{"t":"Leistungsdefizit ohne Zusatzheizung","d":"Bei Auslegungsbedingungen liefert die Wärmepumpe etwa {cap} kW, während die Last höher liegt; es fehlen {tekort} kW, und es ist keine Zusatzheizung vorgesehen. Wählen Sie ein größeres Gerät oder sehen Sie eine Zusatzheizung vor — rechnen Sie aber zuerst durch, welche von beiden über die Lebensdauer günstiger ist.","r":"—"},"bivalentpunt_hoger":{"t":"Tatsächlicher Bivalenzpunkt höher als gewünscht","d":"Berechnet liegt der Punkt bei {werkelijk} °C gegenüber gewünschten {gewenst} °C; die Wärmepumpe deckt dann etwa {dekking} % des jährlichen Wärmebedarfs. Ein etwas größeres Gerät verschiebt diesen Punkt erheblich und senkt den Anteil der teuren Zusatzheizung.","r":"—"},"lage_dekking":{"t":"Geringer Deckungsanteil der Wärmepumpe","d":"Etwa {dekking} % des jährlichen Wärmebedarfs kommen von der Wärmepumpe; der Rest kommt von der Zusatzheizung ({backup}). Bei elektrischer Zusatzheizung bedeutet das eine deutlich höhere Jahresrechnung, als der Prospekt vermuten lässt.","r":"—"},"elektrische_bijstook":{"t":"Elektrische Zusatzheizung von etwa {kw} kW","d":"Jede Kilowattstunde kostet eine, während die Wärmepumpe drei bis fünf liefert. Fragen Sie, wie viele Betriebsstunden pro Jahr erwartet werden, und rechnen Sie das gegen den Tarif durch — oft erweist sich eine etwas größere Wärmepumpe binnen weniger Jahre als günstiger.","r":"—"},"aanuit_zonder_buffer":{"t":"Ein/Aus-Gerät ohne Pufferspeicher","d":"Ein nicht modulierendes Gerät ohne Pufferspeicher startet und stoppt fortwährend, was Wirkungsgrad und Lebensdauer kostet. Sehen Sie etwa {liter} Liter vor oder wählen Sie ein modulierendes Gerät.","r":"—"},"geen_regeneratie":{"t":"Erdwärme ohne Regeneration","d":"Ein Erdreich, das nur leergezogen wird, kühlt über die Jahre ab, und der Wirkungsgrad sinkt mit. Passive Kühlung im Sommer lädt das Erdreich wieder auf und liefert zugleich nahezu kostenlose Kühlung — das ist das stärkste Argument für Erdwärme, und es wird im Angebot oft vergessen.","r":"—"},"warmtenet_voorwaarden":{"t":"Bedingungen des Fernwärmenetzes nicht festgelegt","d":"Die maximal zulässige Rücklauftemperatur ist bei Fernwärme die harte Randbedingung: Sie wird gemessen, oft hängen Pönalen daran, und sie bestimmt Ihren gesamten Übergabeentwurf. Fordern Sie die Anschlussbedingungen an, bevor Sie die Wärmeübergabe wählen.","r":"—"},"cop_punten":{"t":"Geschätzter Wirkungsgrad bei diesem Regime","d":"Bei {aan} °C Vorlauf: COP {copOntwerp} bei Auslegungsbedingungen, {copMild} bei milder Außentemperatur, geschätztes Saisonmittel {copSeizoen}. Das ist eine Carnot-Näherung — fordern Sie die zertifizierten Werte an diesen Punkten an und vergleichen Sie.","r":"EN 14511 / EN 14825"},"sww_rendement":{"t":"Trinkwarmwasser drückt die Jahresarbeitszahl","d":"Bei einer Speichertemperatur von {t} °C arbeitet die Wärmepumpe mit einem COP von {copSww} gegenüber {copCv} für die Heizung. Der jährliche Wärmebedarf für Trinkwarmwasser beträgt etwa {kwh} kWh, was rund {elek} kWh Strom entspricht. Behandeln Sie dies als eigenständiges System: Eine Frischwasserstation, eine niedrigere Speichertemperatur oder eine separate Hochtemperaturstufe bringt hier mehr als jede Optimierung an der Heizung.","r":"EN 14825"},"verswater_circulatie":{"t":"Frischwasserstation mit Zirkulationsleitung","d":"Eine Frischwasserstation verdankt ihren Vorteil dem Fehlen stehenden Warmwassers. Mit einer Zirkulationsleitung kommt das teilweise zurück, einschließlich des fortwährenden Verlusts. Prüfen Sie, ob die Zirkulation zeit- oder bedarfsabhängig schalten kann, und dämmen Sie stark.","r":"—"},"legionella_elektrisch":{"t":"Legionellenzyklus über die elektrische Zusatzheizung","d":"Das periodische Aufheizen auf 60 °C oder mehr geschieht in der Praxis fast immer mit dem elektrischen Heizelement, weil die Wärmepumpe diese Temperatur nicht erreicht. Fragen Sie, wie viele Kilowattstunden dieser Zyklus pro Jahr kostet; das ist oft mehr als erwartet und lässt sich mit einem Durchflussprinzip vermeiden.","r":"Nationale Legionellenvorschriften"},"boilerspiraal":{"t":"Übertragerfläche des Warmwasserspeichers","d":"Eine Heizwendel, die für eine Wärmepumpe zu klein ist, zwingt die Kondensationstemperatur nach oben und kostet bei jeder Ladung Wirkungsgrad. Fordern Sie die Übertragerfläche in m² und die Leistung bei Ihrer eigenen Vorlauftemperatur an — nicht bei der eines Kessels.","r":"—"},"circulatieverlies":{"t":"Verlust der Zirkulationsleitung","d":"Bei einer schlecht gedämmten Zirkulationsleitung kann der Verlust größer sein als der nutzbare Zapfverbrauch. Fordern Sie eine Abschätzung dieses Verlusts und eine starke Dämmung an; schalten Sie wo möglich zeit- oder bedarfsabhängig.","r":"—"},"voorrang_snel_systeem":{"t":"Trinkwarmwasservorrang bei einem schnellen Übergabesystem","d":"Bei Luftheizung oder Gebläsekonvektoren ist der Ausfall der Heizung binnen zehn Minuten spürbar. Legen Sie fest, wie lange die Unterbrechung dauern darf und ob eine Mindestwärmeabgabe erhalten bleibt.","r":"—"},"buffer_te_klein":{"t":"Puffervolumen kleiner als berechnet","d":"Gewählt {gekozen} Liter gegenüber etwa {nodig} Litern, die sich aus der Mindestlaufzeit und der Abtauung ergeben. Ein zu kleiner Pufferspeicher lässt das Gerät dennoch takten; das kostet Wirkungsgrad und Lebensdauer.","r":"—"},"geen_buffer":{"t":"Kein Pufferspeicher bei einem nicht vollständig modulierenden Gerät","d":"Fragen Sie den Hersteller nach der Mindestlaufzeit und nach dem minimalen Wasservolumen in der Anlage. Bei einer Fußbodenheizung reicht der eigene Inhalt oft aus; bei Heizkörpern mit Thermostatventilen fast nie.","r":"—"},"evenwichtsfles":{"t":"Offener Verteiler oder hydraulische Weiche","d":"Eine falsch dimensionierte hydraulische Weiche mischt Vorlauf und Rücklauf: Die Wärmepumpe sieht einen zu hohen Rücklauf, moduliert zurück, und der Wirkungsgrad sinkt — ohne dass irgendetwas defekt wäre. Vermeiden Sie die hydraulische Trennung, wo es geht, und lassen Sie sie berechnen, wo sie sein muss.","r":"—"},"geen_inregeling":{"t":"Kein wasserseitiger hydraulischer Abgleich vorgesehen","d":"Ohne hydraulischen Abgleich bekommt der nächstgelegene Kreis alles und der entfernteste nichts, und man gleicht das mit einer höheren Vorlauftemperatur aus — genau das, was Sie vermeiden wollten. Das ist der Unterschied zwischen einer Anlage, die mit 35 °C arbeitet, und derselben Anlage, die mit 45 °C laufen muss.","r":"—"},"vulwater":{"t":"Unbehandeltes Füllwasser","d":"Kalk auf einem Wärmeübertrager mit kleinen Kanälen kostet unmittelbar Leistung, und Sauerstoff bildet Magnetit, das Pumpen und Ventile verstopft. Die meisten Hersteller knüpfen ihre Gewährleistung an die Füllwasserqualität. Verlangen Sie eine Analyse bei der Abnahme und nach einem Jahr.","r":"VDI 2035"},"vulwater_onbepaald":{"t":"Füllwasserqualität noch nicht festgelegt","d":"Legen Sie die Anforderung vor der Bestellung fest und nehmen Sie sie mit den Messwerten in die Abnahmedokumentation auf. Nachträglich lässt sich nicht mehr nachweisen, womit gefüllt wurde.","r":"VDI 2035"},"geen_vuilafscheider":{"t":"Keine Schlamm- und Luftabscheidung bei vorhandenen Rohrleitungen","d":"Vorhandene Rohrleitungen enthalten Magnetit und Schlamm, der beim ersten Start zum neuen Wärmeübertrager wandert. Ein magnetischer Schlammabscheider und ein Mikroblasenabscheider unmittelbar vor dem Erzeuger sind hier kein Luxus, sondern die Voraussetzung für den Erhalt der Gewährleistung.","r":"—"},"glycol":{"t":"Glykol im System ({pct} %)","d":"Glykol senkt die Wärmekapazität und erhöht die Viskosität: mehr Volumenstrom und deutlich mehr Pumpenenergie für dieselbe Leistung. Beschränken Sie es auf den Kreis, in dem tatsächlich Frost auftreten kann, und trennen Sie diesen hydraulisch ab.","r":"—"},"pompenergie":{"t":"Hoher Anteil Pumpenenergie","d":"Geschätzt {kw} kW, etwa {pct} % der Heizleistung. Die Hilfsenergie zählt in die tatsächliche Jahresarbeitszahl hinein und wird selten gemessen. Prüfen Sie den Betriebspunkt der Pumpen und den Druckverlust des Netzes.","r":"—"},"expansievat":{"t":"Ausdehnungsgefäß etwa {liter} Liter","d":"Berechnet bei einem Systeminhalt von {volume} Litern. Prüfen Sie den Vordruck gegen die statische Höhe und setzen Sie das Gefäß auf der Saugseite der Pumpe ein.","r":"EN 12828"},"tweepijps_gelijktijdig":{"t":"Zweileitersystem bei gleichzeitigem Wärme- und Kältebedarf","d":"Zonen, die gleichzeitig heizen und kühlen wollen, können das mit einer einzigen saisonalen Umschaltung nicht. Wählen Sie ein Vierleitersystem, ein Quellennetz mit dezentralen Wärmepumpen oder VRF mit Wärmerückgewinnung — sonst führt die gesamte Übergangszeit über zu Beschwerden.","r":"—"},"vrije_koeling_gemist":{"t":"Freie Kühlung bei einem hohen Kühlregime nicht genutzt","d":"Bei {t} °C Vorlauf ist in unseren Breiten während eines großen Teils des Jahres freie Kühlung möglich, mit reiner Pumpenenergie. Das ist das stärkste Argument dafür, das Kühlregime hoch zu legen; nutzen Sie es.","r":"—"},"geen_terugwinning":{"t":"Gleichzeitiger Wärme- und Kältebedarf ohne Wärmerückgewinnung","d":"Die Wärme aus der Kühlung ist das ganze Jahr für Trinkwarmwasser oder für die Beheizung anderer Zonen nutzbar. Ein System mit Wärmerückgewinnung rechnet sich hier nahezu immer.","r":"—"},"koeltoren_legionella":{"t":"Nasser Kühlturm — Beherrschungsplan erforderlich","d":"Ein nasser Kühlturm ist energetisch günstig und bringt einen Legionellen-Beherrschungsplan mit sich, dazu Aufmerksamkeit für die Lage gegenüber den Luftansaugungen dieses Gebäudes und der Nachbarn.","r":"Nationale Legionellenvorschriften"},"koudwater_te_koud":{"t":"Niedrige Kaltwassertemperatur bei Strahlungskühlung","d":"Bei {t} °C Vorlauf sind Strahlungskühlung oder Betonkernaktivierung wegen Kondensation nicht sicher zu betreiben, und zudem geht die Möglichkeit der freien Kühlung verloren. Trennen Sie die Kreise: kaltes Wasser für die Entfeuchtung, warmes Wasser für die Strahlung.","r":"—"},"aansluiting_te_klein":{"t":"Elektrische Anschlussleistung unzureichend","d":"Geschätzt gleichzeitig {nodig} kW gegenüber {beschikbaar} kW verfügbar. Eine Verstärkung dauert Monate und kostet manchmal mehr als die Anlage selbst. Klären Sie das vor der Bestellung und prüfen Sie, ob sich die Spitze über die Regelung verteilen lässt.","r":"—"},"aansluiting_onbekend":{"t":"Elektrische Anschlussleistung nicht angegeben","d":"Das ist die häufigste Überraschung eines Wärmepumpenprojekts. Fragen Sie die verfügbare Anschlussleistung ab und addieren Sie Wärmepumpe, Zusatzheizung, Trinkwarmwasserbereitung und etwaige Ladeinfrastruktur für die kälteste Stunde des Jahres.","r":"—"},"propaan_binnen":{"t":"Propan (R290) bei Innenaufstellung","d":"R290 ist hochentzündlich und schwerer als Luft: Es sinkt in tiefer gelegene Räume ab. Fragen Sie die Füllmenge, die Mindestraumgröße, die Anforderungen an die Lüftung und den Abstand zu Kellern, Schächten und Öffnungen ab — und zwar bevor Sie den Aufstellort festlegen.","r":"EN 378; IEC 60335-2-40"},"geluidseis_onbekend":{"t":"Keine Schallanforderung angegeben","d":"Schall von Außeneinheiten ist bei Wärmepumpen die häufigste Beschwerde und der häufigste Anlass für ein Ordnungsverfahren. Ermitteln Sie den geltenden Grenzwert am Beurteilungsort und achten Sie auf den Nachtwert — gerade nachts läuft das Gerät weiter.","r":"Regionale Immissionsvorschriften"},"geluid_dichtbij":{"t":"Außeneinheit nahe einem Beurteilungspunkt ohne Maßnahmen","d":"Auf {d} m bei einer Anforderung von {db} dB(A) ist eine Maßnahme nahezu sicher erforderlich. Achtung: Der Nachtmodus senkt den Schall und die Leistung, genau dann, wenn es draußen am kältesten ist — rechnen Sie durch, ob das Gebäude das verkraftet.","r":"—"},"condens_buitendeel":{"t":"Kondensatableitung der Außeneinheit nicht geregelt","d":"Eine Luftwärmepumpe erzeugt bei Frost Dutzende Liter Kondensat pro Tag. Ohne beheizte Ableitung oder Kiesbett friert das unter dem Gerät und auf dem Weg daneben fest — mit Sturzgefahr und einem blockierten Ventilator als Folge.","r":"—"},"geen_octaafband":{"t":"Keine Oktavbanddaten angefordert","d":"Ein einzelner dB(A)-Wert genügt nicht für eine schalltechnische Berechnung und schon gar nicht für den tieffrequenten Anteil, der durch Fassaden hindurchgeht und am meisten stört.","r":"—"},"geen_vorstbeveiliging":{"t":"Frostschutz bei Ausfall nicht geregelt","d":"Was geschieht bei einer Störung während der Frostperiode, und wer wird benachrichtigt? Bei einem Gebäude mit viel Wasser im Estrich ist das keine theoretische Frage.","r":"—"},"geen_rendementsmeting":{"t":"Keine Wärme- und Strommessung am Erzeuger","d":"Ohne beide Zähler lässt sich die tatsächliche Jahresarbeitszahl nicht feststellen, und jede Diskussion über enttäuschende Leistungen ist unentscheidbar. Genau deshalb fehlen diese Zähler so oft — nehmen Sie sie in die Ausschreibungsabfrage auf.","r":"—"},"hulpenergie_ongemeten":{"t":"Hilfsenergie nicht gesondert gemessen","d":"Pumpen, Abtauung, Elektronik und Zirkulation summieren sich und erklären oft den Unterschied zwischen dem versprochenen und dem gemessenen Wirkungsgrad. Ein eigener Zähler kostet wenig und macht die Diskussion sachlich.","r":"—"},"geen_inregelrapport":{"t":"Kein Abgleichprotokoll gefordert","d":"Volumenströme je Kreis, gemessen und dokumentiert. Ohne dieses Protokoll ist nicht nachweisbar, dass die Anlage auf dem entworfenen Regime laufen kann, und niemand hat einen Anlass, es zu prüfen.","r":"—"},"geen_nulmeting":{"t":"Keine Leistungsmessung bei der Abnahme","d":"Vorlauf, Rücklauf, Volumenstrom, aufgenommene und abgegebene Leistung bei einem definierten Betriebszustand. Ohne Nullmessung lässt sich später nicht feststellen, ob sich etwas verändert hat.","r":"—"},"geen_nameting":{"t":"Keine Nachmessung nach der ersten Heizperiode","d":"Der tatsächliche Wirkungsgrad zeigt sich erst über eine ganze Heizperiode. Ein vereinbarter Nachbesuch zum Nachjustieren von Heizkurve und Einstellungen bringt üblicherweise zehn bis zwanzig Prozent Einsparung — mehr als die meisten Komponentenentscheidungen.","r":"—"},"scop_zonder_garantie":{"t":"Effizienzanforderung ohne Leistungsgarantie","d":"Eine geforderte Jahresarbeitszahl ohne vereinbarte Bilanzgrenzen, Messverfahren und Folgen bei Nichterreichen ist ein Wunsch, keine Anforderung. Legen Sie fest, was geschieht, wenn sie nicht erreicht wird.","r":"—"},"doorlooptijd_boringen":{"t":"Vorlaufzeit von Genehmigung und Bohrungen","d":"Erdwärme verlangt eine Genehmigung, mitunter einen Response-Test und immer eine Terminplanung mit einem Bohrunternehmen. Diese Vorlaufzeit bestimmt die Planung häufiger als die Lieferzeit der Geräte. Starten Sie das Verfahren vor der Bestellung.","r":"Vorschriften zur Erdwärmenutzung"},"geen_selectierapport":{"t":"Kein Auslegungsbericht zum Angebot gefordert","d":"Fordern Sie die Leistungsdaten bei Ihrer eigenen Vorlauftemperatur, Ihrem Volumenstrom und Ihrer Quellentemperatur an. Dieses eine Dokument macht Angebote verschiedener Hersteller erstmals vergleichbar — ohne es vergleichen Sie Prospekte.","r":"—"},"profiel_note":{"t":"Hinweis zu diesem Gebäudetyp","d":"{note}","r":"{basis}"},"wand_niet_gedimensioneerd":{"t":"Wandheizung wird hier nicht berechnet","d":"Wandheizung ist angehakt, dieses Blatt legt jedoch nur die Fußbodenheizung aus. EN 1264-5 verwendet für Wände eigene Kennwerte, die hier nicht hinterlegt sind; lassen Sie Leistung und Wassertemperatur daher gesondert bestimmen. Halten Sie die Oberflächentemperatur unter etwa {max} °C und achten Sie auf die Lage von Schränken und Leitungen.","r":"EN 1264-5"}},"mot":{"last":{"m":"Auslegungslast","w":"Ausgangspunkt für alle Leistungen und für die Gebäudekennlinie, auf der der Bivalenzpunkt bestimmt wird.","d":"Heizen {kw} kW ({spec} W/m²), Kühlen {kwK} kW; von {tOut} °C außen auf {tIn} °C innen. Wärmeverlustkoeffizient {ua} kW/K.","n":"EN 12831"},"regime":{"m":"Temperaturregime","w":"Der rote Faden: Es verbindet Wärmeübergabe und Erzeugung und bestimmt den Wirkungsgrad.","d":"{aan}/{ret} °C, Spreizung {dt} K, Wasservolumenstrom {debiet} m³/h.","n":"—"},"opwekker_wp":{"m":"Wärmepumpe","w":"Ausführung {type}, gewählt beim oben festgelegten Regime.","d":"Nennleistung {kw7} kW bei A7/W35, bei Auslegungsbedingungen noch {capOntwerp} kW. COP {copOntwerp} bei Auslegung, Saisonschätzung {copSeizoen}. Bivalenzpunkt {biv} °C, Deckung etwa {dekking} % des jährlichen Wärmebedarfs.","n":"EN 14511 / EN 14825"},"opwekker_overig":{"m":"Erzeugung","w":"Ausführung {type}.","d":"Auslegungsleistung {kw} kW.","n":"—"},"bijstook":{"m":"Zusatzheizung","w":"Deckt das Defizit unterhalb des Bivalenzpunkts; Strategie {strategie}.","d":"Erforderlich {kw} kW, Ausführung {type}.","n":"—"},"afgifte_rad":{"m":"Wärmeübergabe — {type}","w":"Liefert beim gewählten Regime {pct} % der Nennleistung nach EN 442.","d":"Um die Last zu decken, sind etwa {nodig} kW Nennleistung erforderlich.","n":"EN 442"},"afgifte_vloer":{"m":"Fußbodenheizung","w":"Grundlastabgabe auf niedriger Temperatur; begrenzt durch die zulässige Oberflächentemperatur.","d":"Gefordert {nodig} W/m² von maximal {max} W/m²; Oberflächentemperatur {opp} °C, erforderliche Wassertemperatur etwa {tmed} °C bei einem Bodenbelag mit R = {r} m²K/W.","n":"EN 1264"},"afgifte_tabs":{"m":"Betonkernaktivierung","w":"Trägt die Grundlast mit der Masse des Gebäudes; träge und selbstregelnd.","d":"Gefordert {warm} W/m² Wärme von maximal {maxWarm} und {koud} W/m² Kälte von maximal {maxKoud}.","n":"ISO 11855"},"sww":{"m":"Trinkwarmwasser","w":"Eigenständiges System mit eigenem, ungünstigerem Temperaturniveau; Ausführung {systeem}.","d":"{liter} l/Tag bei {t} °C, {kwh} kWh/Tag und etwa {jaar} kWh/Jahr. COP {cop}, also rund {elek} kWh Strom pro Jahr.","n":"—"},"buffer":{"m":"Pufferspeicher","w":"Überbrückt die Mindestlaufzeit des Erzeugers und liefert Volumen für die Abtauung.","d":"Empfohlen {liter} Liter bei einer Mindestlaufzeit von {looptijd} min; für die Abtauung allein würden {ontdooi} Liter genügen. Ausführung {mode}.","n":"—"},"expansie":{"m":"Ausdehnungsgefäß","w":"Nimmt die Ausdehnung des Wassers auf und hält den Druck im Betriebsbereich.","d":"Etwa {liter} Liter bei einem Systeminhalt von {volume} Litern.","n":"EN 12828"},"energie":{"m":"Jahresbilanz (Richtwert)","w":"Größenordnung zum Vergleich von Varianten, nicht zur Abrechnung.","d":"Wärmebedarf {warmte} kWh/Jahr; Strom Heizung {elek} kWh, Trinkwarmwasser {swwElek} kWh, zusammen etwa {totaal} kWh.","n":"Gradtagverfahren"}},"sec":{"project":{"title":"Projekt und Gebäude","intro":"Um welches Gebäude handelt es sich, wie gut ist die Gebäudehülle und wer nutzt es? Die Qualität der Gebäudehülle bestimmt die Last, und die Last bestimmt, ob ein niedriges Temperaturregime überhaupt erreichbar ist."},"belasting":{"title":"Lasten","intro":"Die Auslegungsleistung, nicht die Leistung des vorhandenen Kessels. Ein Kessel ist fast immer deutlich überdimensioniert; wer diesen Wert übernimmt, kauft eine Wärmepumpe, die zwei Nummern zu groß ist und deshalb schlecht moduliert."},"afgifte":{"title":"Übergabesysteme","intro":"Was im Raum hängt, bestimmt, welche Temperatur der Erzeuger liefern muss — nicht umgekehrt. Dieser Block steht deshalb bewusst vor der Wahl der Wärmepumpe. Die Berechnung zeigt, was ein vorhandener Heizkörper bei einem niedrigen Regime tatsächlich noch leistet."},"regime":{"title":"Temperaturregime","intro":"Der rote Faden des gesamten Entwurfs. Jedes Grad weniger auf der Vorlaufseite bringt rund 2 bis 3 Prozent besseren Wirkungsgrad der Wärmepumpe — und kostet Übergabefläche. Hier machen Sie diesen Tausch explizit, statt ihn einfach geschehen zu lassen."},"opwekking":{"title":"Wärmeerzeugung","intro":"Erst jetzt ist der Erzeuger an der Reihe, denn jetzt steht fest, welche Temperatur er liefern muss. Fragen Sie Leistungsdaten immer bei Ihrem eigenen Regime ab, nicht bei den Normbedingungen aus dem Prospekt."},"koude":{"title":"Kälteerzeugung","intro":"Kühlung ist selten ein eigenständiges System. Die Frage ist nicht nur, woher die Kälte kommt, sondern auch, wohin die Wärme geht — und ob diese Wärme an anderer Stelle im Gebäude nutzbar ist."},"bivalentie":{"title":"Bivalenz, Zusatzheizung und Versorgungssicherheit","intro":"Eine Wärmepumpe, die die Auslegungslast vollständig allein deckt, ist den Rest des Jahres zu groß. Eine zu kleine lässt das Gebäude kalt. Der Bivalenzpunkt ist die Stelle, an der Sie diese Abwägung bewusst treffen."},"sww":{"title":"Trinkwarmwasser","intro":"Der Teil, der am häufigsten den gesamten Niedertemperaturentwurf zunichtemacht. Die Heizung verlangt 35 °C, das Trinkwarmwasser 55 bis 60 °C — dieselbe Wärmepumpe liefert dort fast die Hälfte weniger Wirkungsgrad. Behandeln Sie es als eigenständiges System."},"hydraulica":{"title":"Hydraulik, Pufferspeicher und Wasserseite","intro":"Hier gehen Wärmepumpenanlagen tatsächlich am häufigsten zugrunde. Eine falsch platzierte hydraulische Trennung oder ein Pufferspeicher an der falschen Stelle zerstört die Temperaturspreizung und damit den Wirkungsgrad, ohne dass irgendetwas defekt wäre."},"distributie":{"title":"Verteilung und Zonierung","intro":"Wie die Energie vom Erzeuger zum Raum gelangt und wo die Grenzen von Verantwortung und Messung liegen. Bei Gemeinschaftsanlagen ist das auch eine juristische und nicht nur eine technische Frage."},"regeling":{"title":"Regelung und Steuerung","intro":"Bei einem Kessel korrigiert die Regelung Entwurfsfehler; bei einer Wärmepumpe verstärkt sie diese. Träge übergeben, niedrig halten und vorausschauen ist hier der Kern."},"energie":{"title":"Energie, Messung und Tarife","intro":"Was die Anlage wirklich kosten wird, hängt ebenso sehr von Tarifen und Gleichzeitigkeit ab wie vom Wirkungsgrad. Dieser Block macht den Betrieb neben der Investition sichtbar."},"opstelling":{"title":"Aufstellung, Schall und Sicherheit","intro":"Wo die Geräte stehen, entscheidet darüber, ob sie dort stehen dürfen. Schall von Außeneinheiten ist bei Wärmepumpen die häufigste Beschwerde und der häufigste Anlass für ein Ordnungsverfahren."},"normen":{"title":"Normen, Genehmigungen und Förderung","intro":"Was rechtlich verlangt wird und was finanziell möglich ist. Beides hat Vorlaufzeiten, die die Planung bestimmen — häufiger als die Lieferzeit der Geräte."},"uitvoering":{"title":"Ausführung, Abnahme und Betrieb","intro":"Eine Wärmepumpenanlage ohne hydraulischen Abgleich erreicht ihren Wirkungsgrad nie — und niemand merkt es, denn warm wird sie ja doch. Dieser Block legt fest, wie Sie es eben doch merken."}},"q":{"prj_name":{"label":"Projektname"},"prj_client":{"label":"Auftraggeber","help":"Wer entscheidet über Investition gegenüber Betriebskosten? Bei einem Investor, der vermietet, fallen diese beiden bei verschiedenen Parteien an — das verändert die gesamte Abwägung."},"prj_location":{"label":"Ort","help":"Bestimmt die Auslegungsaußentemperatur, die Gradtage und die Verfügbarkeit von Fernwärme oder von Erdwärme."},"prj_ref":{"label":"Referenz"},"prj_author":{"label":"Erstellt von"},"prj_date":{"label":"Datum"},"geb_type":{"label":"Gebäudetyp","help":"Steuert die Ausgangswerte für Last, Regime, Gleichzeitigkeit und die Frage, ob überhaupt gekühlt werden muss."},"prj_aard":{"label":"Art des Projekts","help":"Wird nur der Erzeuger ersetzt, steht das Übergabesystem bereits fest und damit auch das Regime. Genau das ist die Situation, in der eine Wärmepumpe an vorhandenen Heizkörpern enttäuscht — dieses Blatt rechnet Ihnen das durch.","options":{"nieuwbouw":"Neubau","renovatie":"Sanierung mit Verbesserung der Gebäudehülle","vervanging":"Erzeugertausch, bestehende Wärmeübergabe","uitbreiding":"Erweiterung"}},"geb_area":{"label":"Beheizte Nutzfläche"},"geb_volume":{"label":"Beheiztes Volumen","help":"Für die Aufheizzeit und für die luftseitigen Systeme."},"geb_bouwjaar":{"label":"Baujahr","help":"Grober Anhaltspunkt für die Qualität der Gebäudehülle, wenn keine Berechnung vorliegt."},"geb_schil":{"label":"Qualität der Gebäudehülle","help":"Die wichtigste Frage dieses Blocks. Eine schlecht gedämmte Gebäudehülle verlangt eine hohe Vorlauftemperatur, und genau dort liefert eine Wärmepumpe am wenigsten. Dämmen vor dem Austausch des Erzeugers ist fast immer die günstigere Reihenfolge.","options":{"passief":"Passivhaus / sehr gut gedämmt","goed":"Gut — neuerer Neubau","gemiddeld":"Mittel — nachträglich gedämmt","matig":"Mäßig — begrenzt gedämmt","slecht":"Schlecht — ungedämmt"}},"geb_luchtdicht":{"label":"Luftdichtheit (n50 oder v50)","help":"Bei einer undichten Gebäudehülle ist die Infiltrationslast ein erheblicher Teil der Auslegungsleistung, und diese Last ist zudem windabhängig — also nicht regelbar."},"geb_massa":{"label":"Thermische Masse","help":"Bestimmt, ob träges Regeln funktioniert. Betonkernaktivierung (BKT) setzt Masse voraus; in einem leichten Gebäude mit abgehängter Decke hat sie keine Wirkung und ist rausgeworfenes Geld.","options":{"zwaar":"Schwer — Beton, sichtbar","gemiddeld":"Mittel","licht":"Leicht — Holzskelett, abgehängte Decke"}},"geb_gebruik":{"label":"Nutzungsprofil","help":"Bei stark unterbrochener Nutzung ist ein träges System wie Fußbodenheizung oder Betonkernaktivierung ungeeignet: Es kann weder rechtzeitig aufheizen noch rechtzeitig aufhören.","options":{"continu":"Durchgehend, 24/7","kantooruren":"Bürozeiten","onderbroken":"Stark unterbrochen","seizoen":"Saisonal"}},"geb_zones":{"label":"Anzahl thermischer Zonen","help":"Zonen mit unterschiedlicher Belegung, Orientierung oder Anforderungen. Jede Zone, die gleichzeitig heizen und kühlen will, drängt die Systemwahl in Richtung Vierleitersystem oder in Richtung einer Wärmepumpe mit Wärmerückgewinnung."},"geb_gelijktijdig":{"label":"Können Zonen gleichzeitig heizen und kühlen?","help":"Sonne im Süden und Schatten im Norden, oder Serverraum neben Büro. Falls ja, ist ein Zweileitersystem mit saisonaler Umschaltung unzureichend, so günstig es auch erscheinen mag.","options":{"ja":"Ja","nee":"Nein"}},"bel_basis":{"label":"Worauf beruht die Leistung?","help":"Eine raumweise Berechnung nach EN 12831 ist die einzige Grundlage, auf der Sie die Wärmeübergabe raumweise überprüfen können. Ein Kennwert taugt für eine erste Abschätzung; Verbrauchsdaten aus drei Jahren sind oft verlässlicher als eine Berechnung mit falschen Ausgangswerten.","options":{"berekening":"Raumweise Heizlastberechnung","opgegeven":"Angegebene Gesamtleistung","specifiek":"Kennwert je m² (Richtwert)","verbruik":"Aus dem tatsächlichen Verbrauch abgeleitet"}},"bel_spec_heat":{"label":"Spezifische Heizleistung","help":"Passivhaus 10–20, neuerer Neubau 30–40, nachträglich gedämmt 45–70, ungedämmt 90–140 W/m². Verwenden Sie dies nur für eine erste Abschätzung."},"bel_heat_kw":{"label":"Heizleistung","help":"Ohne Aufheizzuschlag; diesen geben Sie unten gesondert an, damit sichtbar bleibt, woher er stammt."},"bel_opwarm":{"label":"Aufheizzuschlag nach Betriebsunterbrechung","help":"Bei Dauerbetrieb null. Bei täglicher Nachtabsenkung in einem schweren Gebäude kann der Zuschlag auf 20–30 % steigen — und dieser Zuschlag bestimmt dann die gesamte Erzeugerleistung. Erwägen Sie längeres Vorheizen statt mehr Leistung."},"bel_cooling":{"label":"Wird gekühlt?","options":{"ja":"Ja","nee":"Nein"}},"bel_spec_cool":{"label":"Spezifische Kühlleistung","help":"Büro mit normaler Verglasung 40–60 W/m², mit viel Glas oder hoher interner Last 70–100. Außen liegender Sonnenschutz senkt dies stärker als jede Anlagentechnik."},"bel_cool_kw":{"label":"Kühlleistung"},"bel_latent":{"label":"Anteil der latenten Kühllast","help":"Entscheidend für die Systemwahl. Strahlungskühlung und Betonkernaktivierung nehmen ausschließlich sensible Wärme auf; die Feuchte muss anderswo abgeführt werden — meist über die Lüftungsanlage. Wer das vergisst, bekommt Kondensat an der Decke."},"bel_intern":{"label":"Interne Wärmelast","help":"Personen, Beleuchtung, Geräte. In einem modernen Bürogebäude ist dies oft die dominierende Kühllast und senkt den Heizwärmebedarf tagsüber erheblich."},"bel_proces":{"label":"Prozess- oder Sonderlasten","help":"Serverraum, Küche, Produktionslinie, Schwimmbad. Häufig sind das Lasten, die das ganze Jahr über Kühlung verlangen — und damit eine kostenlose Wärmequelle für den Rest des Gebäudes sind."},"bel_gelijktijdigheid":{"label":"Gleichzeitigkeitsfaktor","help":"Bei vielen Wohnungen an einem Erzeuger dürfen Sie mit weniger als der Summe der Spitzen rechnen. Bei einem Gebäude mit einer Zone nicht: Dort tritt die Spitze sehr wohl überall gleichzeitig auf."},"cnd_t_design":{"label":"Auslegungsaußentemperatur","help":"Für Belgien in der Regel −8 bis −11 °C, je nach Zone und Gebäudemasse. Bestimmt zusammen mit der Last die Gebäudekennlinie, auf der der Bivalenzpunkt gefunden wird."},"cnd_t_room":{"label":"Raumtemperatur Heizen"},"cnd_t_room_cool":{"label":"Raumtemperatur Kühlen"},"cnd_dewpoint_room":{"label":"Höchster zu erwartender Taupunkt im Raum","help":"Die Untergrenze für jede gekühlte Oberfläche. Bei 25 °C und 55 % r. F. liegt der Taupunkt bei etwa 15 °C — eine Kühldecke mit 16 °C Vorlauf liegt gefährlich nahe daran. Ohne Entfeuchtung ist Strahlungskühlung nicht sicher zu regeln."},"cnd_degree_days":{"label":"Gradtage","help":"Für Belgien in der Regel um 2000 K·d, Basis 15/15. Nur für die überschlägige Jahresabschätzung."},"afg_types":{"label":"Welche Übergabesysteme sind vorgesehen oder vorhanden?","help":"Kombinationen sind normal: Fußbodenheizung für die Grundlast und Gebläsekonvektoren für die Spitze und für die Kühlung. Geben Sie alles an, was kommt, denn der kleinste gemeinsame Nenner bestimmt das Regime des gesamten Kreises — es sei denn, Sie arbeiten mit getrennten Gruppen und Mischerkreisen.","options":{"vloer":"Fußbodenheizung","wand":"Wandheizung","tabs":"Betonkernaktivierung","radiator":"Heizkörper","convector":"Konvektoren","vloerconvector":"Unterflurkonvektoren","ventilo":"Gebläsekonvektoren (Fancoils)","koelplafond":"Kühldecke / Klimadecke","balk":"Induktionsgeräte / Kühlbalken","paneel":"Strahlungsplatten","luchtverwarmer":"Luftheizung über die Lüftungsanlage","vrf":"VRF-Innengeräte (direktverdampfend)"}},"afg_bestaand":{"label":"Wird die vorhandene Wärmeübergabe weiterverwendet?","help":"Falls ja: Lassen Sie raumweise die installierte Nennleistung aufnehmen. Ohne diese Bestandsaufnahme lässt sich nicht feststellen, ob das gewählte Regime erreichbar ist, und jede Zusage zur Wärmepumpe ist geraten.","options":{"nee":"Nein, alles neu","deels":"Teilweise","ja":"Ja, vollständig"}},"afg_vloer_share":{"label":"Anteil der Last über Fußboden- oder Wandheizung"},"afg_vloer_coverage":{"label":"Verfügbare Verlegefläche","help":"Unter Einbauschränken, Küchenzeilen und Geräten wird nicht verlegt. Bei 60 % verfügbarer Fläche muss dieselbe Wärme durch weniger Quadratmeter, also steigt die Wassertemperatur — oft gerade genug, um den Vorteil der Wärmepumpe aufzuzehren."},"afg_vloer_r":{"label":"Wärmedurchlasswiderstand des Bodenbelags","help":"Fliesen etwa 0,02, Laminat mit Unterlage 0,10–0,15, Teppich bis 0,20 m²K/W. Das ist der leiseste Projektkiller überhaupt: Dieselbe Fußbodenheizung verlangt unter Teppich eine zehn Grad höhere Wassertemperatur als unter Fliesen. Legen Sie den maximal zulässigen Widerstand in der Ausschreibung fest und teilen Sie ihn dem Bauherrn mit."},"afg_vloer_spacing":{"label":"Verlegeabstand","help":"Ein kleinerer Abstand senkt die erforderliche Wassertemperatur. 10 cm statt 15 cm macht einige Grad aus und ist im Neubau günstig; nachträglich ist das nicht mehr zu ändern."},"afg_tabs_share":{"label":"Anteil der Last über Betonkernaktivierung","help":"Betonkernaktivierung liefert etwa 30–40 W/m² Wärme und 40–50 W/m² Kühlung und reagiert in Stunden, nicht in Minuten. Sie deckt die Grundlast; die Spitze und die raumweise Regelung müssen von einem schnelleren System kommen."},"afg_koelplafond_share":{"label":"Anteil der Kühllast über die Kühldecke"},"afg_regelbaar":{"label":"Raumweise Regelung","help":"Bei Fußbodenheizung und Betonkernaktivierung wirkt eine raumweise Regelung nur träge; Überregeln führt zu Überschwingen und Takten. Bei einer Wärmepumpe ist Durchströmen auf einer niedrigen, witterungsgeführt gesteuerten Temperatur meist besser als Ein-Aus je Raum.","options":{"thermostaat":"Raumthermostat je Zone","kraan":"Thermostatventile","centraal":"Nur zentral, witterungsgeführt","geen":"Keine Einzelraumregelung"}},"afg_meting":{"label":"Vorhandene Wärmeübergabe raumweise erfasst?","help":"Typ, Abmessungen und Nennleistung je Element. Das ist die Arbeit, die niemand machen will und die den Unterschied zwischen einer funktionierenden und einer nicht funktionierenden Anlage ausmacht.","options":{"ja":"Ja","nee":"Nein"}},"reg_t_flow":{"label":"Vorlauftemperatur Heizen bei Auslegungsbedingungen","help":"Fußbodenheizung 30–38, Betonkernaktivierung 26–32, Heizkörper neu 45–55, Heizkörper im Bestand oft 70–80 °C. Diese Zahl entscheidet, welche Erzeuger übrig bleiben."},"reg_t_return":{"label":"Rücklauftemperatur Heizen","help":"Die Temperaturspreizung bestimmt den Wasservolumenstrom und damit die Rohrdurchmesser und die Pumpenenergie. Eine Wärmepumpe arbeitet üblicherweise mit 5 K Spreizung, ein Kessel mit 20 K — das ist ein Faktor vier im Volumenstrom und macht in der Rohrnetzdimensionierung erheblich viel aus."},"reg_weersafhankelijk":{"label":"Witterungsgeführte Regelung der Vorlauftemperatur?","help":"Nahezu kostenloser Effizienzgewinn: Bei 7 °C Außentemperatur genügt ein Vorlauf, der weit unter dem bei −8 °C liegt. Ohne Heizkurve läuft die Anlage die ganze Saison auf dem Auslegungswert und eine Wärmepumpe verliert einen großen Teil ihres Vorteils.","options":{"ja":"Ja","nee":"Nein"}},"reg_t_flow_cool":{"label":"Vorlauftemperatur Kühlen","help":"Gebläsekonvektoren mit Entfeuchtung 6–8 °C, Strahlungskühlung und Betonkernaktivierung 16–18 °C. Eine hohe Kaltwassertemperatur ermöglicht freie Kühlung und eine gut arbeitende Kältemaschine, schließt aber Entfeuchtung aus — das ist eine Systementscheidung, keine Einstellung."},"reg_t_return_cool":{"label":"Rücklauftemperatur Kühlen"},"reg_glycol_pct":{"label":"Glykolanteil","help":"Glykol senkt die Wärmekapazität und erhöht die Viskosität: bei 30 % rund 10 % mehr Volumenstrom und deutlich mehr Pumpenenergie für dieselbe Leistung. Setzen Sie es nur dort ein, wo tatsächlich Frost auftreten kann, und trennen Sie diesen Kreis dann hydraulisch ab."},"reg_menggroepen":{"label":"Mischerkreise für unterschiedliche Regime?","help":"Erforderlich, sobald Fußbodenheizung und Heizkörper am selben Erzeuger hängen. Achtung: Der Erzeuger muss dann die höchste Temperatur liefern, und der Mischerkreis senkt sie örtlich ab — der Wirkungsgrad folgt also den Heizkörpern, nicht dem Fußboden. Prüfen Sie, ob die Heizkörper nicht ersetzt werden können.","options":{"ja":"Ja","nee":"Nein"}},"reg_dt_marge":{"label":"Regime vertraglich mit Messpunkten festlegen?","help":"Vorlauf, Rücklauf und Spreizung bei Auslegungsbedingungen, zu messen bei der Abnahme. Ohne diese Vereinbarung wandert das Regime während der Ausführung stillschweigend nach oben, und hinterher ist niemand für den enttäuschenden Wirkungsgrad verantwortlich.","options":{"ja":"Ja","nee":"Nein"}},"opw_type":{"label":"Typ des Erzeugers","help":"Erdgekoppelte Systeme liefern das ganze Jahr eine stabile Wärmequelle und damit einen weit gleichmäßigeren Wirkungsgrad, verlangen aber Genehmigung, Platz und eine deutlich höhere Investition. Luft/Wasser ist einfacher und hat gerade bei Frost seinen schwächsten Moment — genau dann, wenn das Gebäude am meisten verlangt.","options":{"lucht_water":"Wärmepumpe Luft/Wasser","grond_boring":"Wärmepumpe Sole/Wasser — vertikale Erdsonden","grond_horizontaal":"Wärmepumpe Sole/Wasser — Flächenkollektor","water_water":"Wärmepumpe Wasser/Wasser — Grund- oder Oberflächenwasser","afvoerlucht":"Abluftwärmepumpe","lucht_lucht":"Wärmepumpe Luft/Luft","hybride":"Hybrid — Wärmepumpe mit Kessel","gasketel":"Gas-Brennwertkessel","elektrisch":"Elektrische Widerstandsheizung","warmtenet":"Fernwärme","wkk":"Kraft-Wärme-Kopplung","biomassa":"Biomassekessel","zon_thermisch":"Solarkollektoren (ergänzend)"}},"opw_hp_kw":{"label":"Leistung der Wärmepumpe bei A7/W35","help":"Hersteller geben die Leistung bei günstigen Bedingungen an. Fordern Sie die vollständige Tabelle an: Leistung und COP bei A−7/W45, A2/W35, A7/W35 und bei Ihrer eigenen Vorlauftemperatur. Der Unterschied zwischen diesen Punkten ist größer, als die meisten Angebote vermuten lassen."},"opw_source_t":{"label":"Quellentemperatur bei Auslegungsbedingungen","help":"Bei Luft ist das die Auslegungsaußentemperatur. Beim Erdreich üblicherweise 0 bis 5 °C, bei Grundwasser 10 bis 12 °C. Leer lassen, um sie aus dem Quellentyp abzuleiten."},"opw_modulatie":{"label":"Leistungsregelung","help":"Fragen Sie die minimale Modulationsleistung ab, nicht nur das Maximum. Eine Wärmepumpe, die nicht unter 40 % ihrer Leistung gehen kann, taktet in der Übergangszeit — das kostet Wirkungsgrad und Lebensdauer, und mit einem Pufferspeicher lässt es sich nur mildern, nicht beheben.","options":{"inverter":"Stufenlos (Inverter)","stappen":"Mehrere Stufen","aan_uit":"Ein/Aus"}},"opw_koudemiddel":{"label":"Kältemittel","help":"Die F-Gas-Verordnung drängt die Kältemittel mit hohem GWP aus dem Markt; R290 ist deshalb faktisch zum Standard für kleinere Wärmepumpen geworden. Propan ist hochentzündlich: Das stellt Anforderungen an den Aufstellort, an Abstände zu Öffnungen und an Keller oder Schächte, in die ein Leck absinken könnte.","options":{"R290":"R290 Propan (A3)","R32":"R32 (A2L)","R454C":"R-454C (A2L)","R1234ze":"R-1234ze (A2L)","R744":"R-744 CO₂","R410A":"R-410A (A1)"}},"opw_max_temp":{"label":"Maximale Vorlauftemperatur der Wärmepumpe","help":"Prüfen Sie, ob dieser Wert auch bei der niedrigsten Quellentemperatur noch erreicht wird — viele Geräte erreichen ihr Maximum nur bei milden Außentemperaturen, und das ist genau nicht der Moment, in dem Sie es brauchen."},"opw_bron_detail":{"label":"Angaben zur Wärmequelle","help":"Anzahl und Tiefe der Bohrungen, oder Fläche des Flächenkollektors, oder Volumenstrom und Temperatur des Grundwassers. Fragen Sie bei größeren Projekten auch nach dem Thermal Response Test und nach der Jahresbilanz zwischen Entzug und Eintrag — ein Erdreich, das nur leergezogen wird, kühlt über die Jahre ab, und der Wirkungsgrad sinkt mit."},"opw_regeneratie":{"label":"Regeneration des Erdreichs vorgesehen?","help":"Passive Kühlung im Sommer lädt das Erdreich wieder auf und liefert nahezu kostenlose Kühlung. Das ist das stärkste Argument für Erdwärme — und es wird im Angebot oft vergessen.","options":{"ja":"Ja","nee":"Nein"}},"opw_warmtenet_detail":{"label":"Bedingungen des Fernwärmenetzes","help":"Vorlauftemperatur, garantierte Rücklauftemperatur, Pönalen bei zu hohem Rücklauf, Anschlussleistung und Tarifstruktur. Die maximal zulässige Rücklauftemperatur ist die harte Randbedingung: Sie bestimmt Ihren gesamten Übergabeentwurf und wird gemessen."},"opw_bestaand":{"label":"Vorhandene Erzeugung, die bleibt oder entfällt","help":"Bei einem stufenweisen Austausch: Was bleibt stehen, wie wird es hydraulisch eingebunden und wer regelt den Übergang?"},"kou_type":{"label":"Herkunft der Kälte","help":"Passive Erdkühlung verbraucht nur Pumpenenergie und lädt gleichzeitig das Erdreich für den Winter auf. Sie liefert begrenzte Leistungen bei hoher Wassertemperatur — genau passend zu Betonkernaktivierung und Kühldecke und ungeeignet für die Entfeuchtung.","options":{"reversibel":"Reversible Wärmepumpe","chiller":"Separate Kältemaschine","passief_bodem":"Passive Erdkühlung (Geocooling)","vrije_koeling":"Freie Kühlung mit Trockenkühler","vrf":"VRF mit Wärmerückgewinnung","adiabatisch":"Adiabate Kühlung","warmtenet_koude":"Fernkältenetz","geen":"Keine aktive Kühlung"}},"kou_terugwinning":{"label":"Gleichzeitig heizen und kühlen mit Wärmerückgewinnung?","help":"Bei einem Gebäude mit Serverraum, Küche oder Nord-Süd-Orientierung ist die Wärme aus der Kühlung das ganze Jahr für Trinkwarmwasser oder für die Heizung nutzbar. Das erfordert ein Vierleitersystem oder eine Wärmepumpe mit Wärmerückgewinnung, und es rechnet sich nahezu immer.","options":{"ja":"Ja","nee":"Nein"}},"kou_condensor":{"label":"Wärmeabgabe der Kältemaschine","help":"Ein nasser Kühlturm ist energetisch am günstigsten und bringt einen Legionellen-Beherrschungsplan mit sich, dazu Aufmerksamkeit für die Lage gegenüber Luftansaugungen. Wärme in das Erdreich ist fast immer die beste Option, wenn ohnehin Bohrungen vorhanden sind.","options":{"lucht":"Luftgekühlt","droog":"Trockenkühler mit Glykol","adiabatisch_cond":"Adiabat unterstützt","nat":"Nasser Kühlturm","bodem":"In das Erdreich","water":"In Oberflächen- oder Grundwasser"}},"kou_vrije_koeling":{"label":"Freie Kühlung bei niedriger Außentemperatur?","help":"Bei einem Kühlregime von 16/18 °C ist freie Kühlung in unseren Breiten einen großen Teil des Jahres möglich. Das ist das stärkste Argument dafür, das Kühlregime hoch zu legen — und es funktioniert nur, wenn das Übergabesystem dazu passt.","options":{"ja":"Ja","nee":"Nein"}},"kou_ontvochtiging":{"label":"Wo wird entfeuchtet?","help":"Die Frage, an der Strahlungskühlung steht oder fällt. Ohne Entfeuchtung an anderer Stelle kann eine Kühldecke oder Betonkernaktivierung nie unter den Taupunkt gehen, also muss die Regelung die Oberflächentemperatur begrenzen — mit Leistungsverlust an genau den wärmsten, feuchtesten Tagen.","options":{"lucht":"In der Lüftungsanlage","ventilo":"In den Gebläsekonvektoren","geen":"Nicht — keine aktive Entfeuchtung"}},"biv_strategie":{"label":"Bivalenzstrategie","help":"Parallel hält die Wärmepumpe in Betrieb und lässt die Zusatzheizung nur das Defizit decken; alternativ schaltet sie ganz ab. Bei einem Gaskessel als Zusatzheizung ist der alternative Betrieb manchmal günstiger, bei elektrischer Zusatzheizung praktisch nie.","options":{"monovalent":"Monovalent — Wärmepumpe deckt alles","parallel":"Bivalent parallel — Zusatzheizung neben der Wärmepumpe","alternatief":"Bivalent alternativ — Umschaltung auf den Kessel","deels_parallel":"Teilparallel, danach Umschaltung"}},"biv_backup":{"label":"Art der Zusatzheizung","help":"Eine elektrische Zusatzheizung ist günstig in der Anschaffung und teuer im Betrieb: Jede Kilowattstunde kostet eine, während die Wärmepumpe drei bis fünf liefert. Fragen Sie, wie viele Stunden pro Jahr sie voraussichtlich läuft, und rechnen Sie das durch — oft erweist sich eine etwas größere Wärmepumpe als günstiger.","options":{"geen":"Keine","elektrisch":"Elektrisches Heizelement","gasketel":"Gaskessel","warmtenet":"Fernwärme","tweede_wp":"Zweite Wärmepumpe"}},"biv_punt":{"label":"Gewünschter Bivalenzpunkt","help":"Bei −5 °C deckt die Wärmepumpe üblicherweise gut 90 % des jährlichen Wärmebedarfs, während sie deutlich kleiner als die Auslegungslast ausfallen darf. Dieses Blatt berechnet den tatsächlichen Punkt aus Ihren eigenen Angaben und zeigt ihn neben diesem Wunsch an."},"biv_redundantie":{"label":"Erforderliche Sicherheit bei Ausfall","help":"Für eine Wohnung oder ein Büro selten nötig, für eine Pflegeeinrichtung, ein Rechenzentrum oder einen Prozess eine harte Anforderung. Mehrere kleinere Geräte liefern Redundanz und zugleich besseres Teillastverhalten — oft die bessere Wahl gegenüber einem großen.","options":{"geen":"Keine — Ausfall hinnehmbar","gedeeltelijk":"Teilleistung muss erhalten bleiben","volledig":"Vollständige Redundanz (n+1)"}},"biv_vorstbeveiliging":{"label":"Frostschutz des Gebäudes bei Ausfall geregelt?","help":"Was geschieht bei einer Störung während der Frostperiode, und wer wird darüber benachrichtigt? Bei einem Gebäude mit Fußbodenheizung und viel Wasser im Estrich ist das keine theoretische Frage.","options":{"ja":"Ja","nee":"Nein"}},"biv_smart_grid":{"label":"Steuerung nach Netzbelastung oder Tarif möglich?","help":"Sperrzeiten des Netzbetreibers, dynamische Tarife oder eigener PV-Strom. Das erfordert Speicherkapazität im Pufferspeicher oder in der Gebäudemasse und eine Regelung, die vorausschauen kann. Bei Betonkernaktivierung ist diese Masse ohnehin schon kostenlos vorhanden.","options":{"ja":"Ja","nee":"Nein"}},"dhw_aanwezig":{"label":"Wird Trinkwarmwasser von dieser Anlage bereitet?","options":{"ja":"Ja","nee":"Nein"}},"dhw_persons":{"label":"Anzahl Personen oder Zapfstellen"},"dhw_l_person":{"label":"Verbrauch je Person und Tag","help":"Wohnung 35–50 l je Person bei 55 °C, Büro deutlich weniger, Sportstätte und Pflege erheblich mehr mit ausgeprägter Spitze."},"dhw_profiel":{"label":"Zapfprofil","help":"Die Spitze bestimmt das Volumen, der Tagesverbrauch bestimmt die Leistung. Bei einer Sportstätte ist die Spitze maßgebend, und Speichervolumen ist günstiger als Leistung.","options":{"woning":"Wohnung — Morgen- und Abendspitze","kantoor":"Büro — niedrig und verteilt","sport":"Sport — kurze, sehr hohe Spitze","zorg":"Pflege — hoch und durchgehend","horeca":"Gastronomie / Küche"}},"dhw_t_store":{"label":"Speichertemperatur","help":"Jedes Grad mehr kostet Wirkungsgrad der Wärmepumpe. Ein Durchflussgerät oder eine Frischwasserstation kommt mit einer niedrigeren Speichertemperatur aus, weil kein stehendes Warmwasser vorhanden ist — das ist häufig die eleganteste Lösung der Legionellenfrage."},"dhw_t_cold":{"label":"Kaltwassertemperatur"},"dhw_systeem":{"label":"System","help":"Eine Frischwasserstation bereitet auf Abruf und hält kein Warmwasser vor; das verringert das Legionellenrisiko und erlaubt eine niedrigere Puffertemperatur. Nachteil ist die hohe Spitzenanforderung in diesem Moment — die muss der Pufferspeicher oder der Wärmeübertrager verkraften.","options":{"boiler":"Speicher mit Heizwendel","verswater":"Frischwasserstation (Durchfluss)","laadsysteem":"Ladesystem mit externem Wärmeübertrager","decentraal":"Dezentral je Wohnung oder Zapfstelle","elektrisch_boiler":"Elektrischer Warmwasserspeicher"}},"dhw_legionella":{"label":"Legionellenbeherrschung","help":"Die thermische Desinfektion verlangt periodisch 60 °C oder mehr in der gesamten Anlage einschließlich Zirkulationsleitung. Das ist der Moment, in dem die elektrische Zusatzheizung anspringt: Fragen Sie, wie viel Energie das pro Jahr kostet, denn es ist oft mehr als erwartet.","options":{"thermisch":"Periodische thermische Desinfektion","doorstroom":"Durchflussprinzip, keine Bevorratung","temperatuur":"Dauerhaft auf Temperatur halten","alternatief":"Alternatives Verfahren"}},"dhw_circulatie":{"label":"Zirkulationsleitung vorhanden?","help":"Eine Zirkulationsleitung hält Warmwasser verfügbar und verliert dabei fortwährend Wärme — bei einer schlecht gedämmten Leitung kann dieser Verlust größer sein als der Nutzverbrauch. Dämmen Sie stark und schalten Sie wo möglich zeit- oder bedarfsabhängig.","options":{"ja":"Ja","nee":"Nein"}},"dhw_voorrang":{"label":"Vorrang des Trinkwarmwassers vor der Heizung?","help":"Üblich und selten ein Problem, aber legen Sie fest, wie lange die Heizung ausfallen darf. Bei Betonkernaktivierung merkt es niemand; bei Luftheizung innerhalb
