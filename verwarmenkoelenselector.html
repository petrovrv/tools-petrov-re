ощности, по которой они подобраны согласно EN 442 — а она относится к 75/65/20. Чтобы покрыть нагрузку, требуется около {nodig} kW номинала. Проведите инвентаризацию по помещениям и адресно замените приборы, которые не добирают; это почти всегда дешевле, чем более крупный агрегат или более высокий режим, и это единственное вмешательство, которое действительно улучшает эффективность.","r":"EN 442"},"afgifte_derating":{"t":"При этом режиме теплоотдача заметно ниже","d":"При {aan}/{ret} °C конечные приборы ({type}) отдают ещё {pct} % номинальной мощности. Рассчитывайте примерно на {nodig} kW номинала, чтобы покрыть нагрузку. Проверьте это по каждому помещению: среднее не говорит ни о чём, важно то помещение, где запас наименьший.","r":"EN 442"},"afgifte_ok":{"t":"Теплоотдача соответствует выбранному режиму","d":"При этом режиме конечные приборы ({type}) отдают ещё {pct} % номинальной мощности. Тем не менее проверьте помещение с наихудшим соотношением между нагрузкой и установленной теплоотдачей.","r":"EN 442"},"vloer_oververhit":{"t":"Тёплый пол выше допустимой температуры поверхности","d":"Требуемый тепловой поток составляет {nodig} W/m², тогда как при максимальной температуре поверхности 29 °C в зоне пребывания возможно около {max} W/m². Расчётная температура поверхности получается {opp} °C — это не только за пределами нормы, но и некомфортно. Увеличьте площадь укладки, уменьшите шаг укладки или дополните второй системой теплоотдачи.","r":"EN 1264"},"vloerafwerking":{"t":"Напольное покрытие с высоким термическим сопротивлением","d":"При R = {r} m²K/W температура воды должна подняться примерно до {tmed} °C, чтобы отдать то же тепло. Это самый тихий убийца проектов: застройщик выбирает покрытие пола независимо от инженерии, и эффективность теплового насоса уходит вместе с этим выбором. Зафиксируйте максимально допустимое сопротивление в техническом задании и доведите его до всех участников.","r":"EN 1264"},"legoppervlak":{"t":"Ограниченная площадь укладки тёплого пола","d":"При {pct} % доступной площади то же тепло должно пройти через меньшее число квадратных метров, и температура воды растёт соответственно. Проверьте, действительно ли встроенные шкафы и оборудование встанут именно там, и рассмотрите настенное отопление как дополнение.","r":"EN 1264"},"tabs_te_zwaar":{"t":"Активация бетонного ядра не несёт тепловую нагрузку","d":"Требуется {nodig} W/m², тогда как бетонное ядро отдаёт около {max} W/m². Бетонное ядро покрывает базовую нагрузку; пик должна брать вторая, более быстрая система. Просчитайте обе, вместо того чтобы надеяться, что масса всё сгладит.","r":"ISO 11855"},"tabs_koel_te_zwaar":{"t":"Активация бетонного ядра не несёт холодильную нагрузку в одиночку","d":"Требуется {nodig} W/m² против примерно {max} W/m² доступных. Дополните доводочным охлаждением или снизьте холодильную нагрузку наружными солнцезащитными устройствами — последнее практически всегда дешевле установленной мощности.","r":"ISO 11855"},"tabs_zonder_massa":{"t":"Активация бетонного ядра без тепловой инерции","d":"В лёгком здании или под подвесным потолком у активации бетонного ядра нет работающей массы, а значит, нет и эффекта. Выберите другую систему теплоотдачи либо освободите массу и примите вытекающие из этого акустические последствия.","r":"ISO 11855"},"tabs_onderbroken":{"t":"Инерционная система при сильно прерывистом использовании","d":"Активация бетонного ядра реагирует часами. При режиме эксплуатации с сильными перерывами тепло приходит слишком поздно и прекращается слишком поздно, что даёт перегрев и недогрев. Рассмотрите более быструю систему или примите, что бетонное ядро обеспечивает только базу.","r":"—"},"condens_plafond":{"t":"Риск конденсации на охлаждающем потолке","d":"Температура подачи {aan} °C лежит слишком близко к ожидаемой точке росы {dauw} °C. Без осушения в другом месте и без контроля точки росы потолок закапает в первый же душный день. Повысьте температуру подачи либо обеспечьте осушение через установку обработки воздуха и датчики на подаче и в помещении.","r":"ISO 11855; EN 14240"},"straling_zonder_ontvochtiging":{"t":"Лучистое охлаждение без осушения","d":"Охлаждаемая поверхность воспринимает только явное тепло. Без осушения влажность растёт до тех пор, пока точка росы не упрётся в ограничение системы, — ровно в самые жаркие дни. Организуйте осушение в установке обработки воздуха.","r":"—"},"gemengde_regimes":{"t":"Тёплый пол и радиаторы на одном режиме","d":"Источник тогда обязан выдавать самую высокую температуру, и эффективность следует за радиаторами, а не за полом. Предусмотрите узел смешения или — что лучше — замените радиаторы, чтобы всё здание могло работать на низком режиме.","r":"—"},"latent_zonder_ontvochtiging":{"t":"Скрытая нагрузка {pct} % без осушения","d":"Влагу нужно куда-то убирать. Без осушения в установке обработки воздуха или в фанкойлах влажность воздуха растёт до потери комфорта и до необходимости придушить лучистое охлаждение. Зафиксируйте, где происходит осушение и с какой мощностью.","r":"EN 16798-1"},"boven_max_temp":{"t":"Требуемая температура подачи выше диапазона теплового насоса","d":"Требуется {aan} °C, тогда как агрегат выдаёт максимум {max} °C. Проверьте вдобавок, достигается ли этот максимум и при самой низкой температуре низкопотенциального источника — многие агрегаты выходят на свой максимум только при мягкой наружной температуре, а это ровно не тот момент, когда он вам нужен.","r":"EN 14511"},"hoog_regime":{"t":"Высокая температура подачи для теплового насоса","d":"При {aan} °C COP при расчётных условиях получается около {cop}. Каждый градус снижения даёт грубо 2–3 % прироста эффективности. Сначала выясните, нельзя ли опустить режим адресной заменой приборов теплоотдачи; за срок службы это окупается с запасом.","r":"EN 14511"},"kleine_spreiding":{"t":"Очень малый перепад температур","d":"При перепаде {dt} K расход теплоносителя составляет {debiet} m³/h — это требует трубопроводов с запасом и стоит энергии на перекачку круглый год. Проверьте, что подбор трубопроводов и выбор насосов сделаны исходя из этого, а не из котлового режима.","r":"—"},"grote_spreiding":{"t":"Большой перепад температур при тепловом насосе","d":"При {dt} K тепловой насос должен принимать низкую обратку, создавая при этом высокую подачу. Большинство агрегатов рассчитаны на 5–8 K; проверьте, действуют ли заявленные характеристики при таком перепаде.","r":"EN 14511"},"geen_stooklijn":{"t":"Нет погодозависимого регулирования","d":"Без отопительного графика установка весь сезон работает на расчётной температуре, тогда как при 7 °C снаружи достаточно значительно меньшего. Это практически бесплатный прирост эффективности, и отказ от него отнимает большую часть преимущества теплового насоса.","r":"—"},"regime_niet_vastgelegd":{"t":"Режим не закреплён договором","d":"Зафиксируйте подачу, обратку и перепад температур с точками измерения при сдаче. Без такой договорённости режим по ходу монтажа тихо уползает вверх, и потом никто не отвечает за разочаровывающую эффективность.","r":"—"},"tekort_zonder_bijstook":{"t":"Дефицит мощности без доводчика","d":"При расчётных условиях тепловой насос выдаёт около {cap} kW, тогда как нагрузка выше; не хватает {tekort} kW, а доводчик не предусмотрен. Выберите более крупный агрегат или предусмотрите доводчик — но сначала просчитайте, что из двух дешевле за срок службы.","r":"—"},"bivalentpunt_hoger":{"t":"Фактическая точка бивалентности выше желаемой","d":"По расчёту точка ложится на {werkelijk} °C против желаемых {gewenst} °C; тепловой насос покрывает тогда около {dekking} % годовой потребности в тепле. Чуть более крупный агрегат сдвигает эту точку заметно и снижает долю дорогого доводчика.","r":"—"},"lage_dekking":{"t":"Низкое покрытие тепловым насосом","d":"Около {dekking} % годовой потребности в тепле обеспечивает тепловой насос; остальное даёт доводчик ({backup}). При электрическом доводчике это означает заметно более высокий годовой счёт, чем внушает буклет.","r":"—"},"elektrische_bijstook":{"t":"Электрический доводчик около {kw} kW","d":"Каждый киловатт-час стоит одного киловатт-часа, тогда как тепловой насос выдаёт три-пять. Спросите, сколько часов работы в год ожидается, и просчитайте это по тарифу — часто оказывается, что чуть более крупный тепловой насос окупается за несколько лет.","r":"—"},"aanuit_zonder_buffer":{"t":"Агрегат с работой по принципу включено/выключено без буферной ёмкости","d":"Немодулирующий агрегат без буферной ёмкости непрерывно запускается и останавливается, что стоит эффективности и ресурса. Предусмотрите около {liter} l либо выберите модулирующий агрегат.","r":"—"},"geen_regeneratie":{"t":"Геотермия без регенерации грунтового массива","d":"Массив, из которого только забирают, за годы выхолаживается, и эффективность падает вместе с ним. Пассивное охлаждение летом снова заряжает грунт и вдобавок даёт почти бесплатный холод — это самый сильный довод в пользу геотермии, и о нём часто забывают в коммерческом предложении.","r":"—"},"warmtenet_voorwaarden":{"t":"Условия подключения к тепловой сети не зафиксированы","d":"Максимально допустимая температура обратки — жёсткое граничное условие тепловой сети: она измеряется, за её превышение часто предусмотрены штрафы, и она определяет весь ваш проект теплоотдачи. Запросите условия присоединения до того, как выберете систему теплоотдачи.","r":"—"},"cop_punten":{"t":"Оценочная эффективность при этом режиме","d":"При подаче {aan} °C: COP {copOntwerp} при расчётных условиях, {copMild} при мягкой наружной температуре, оценочное среднесезонное значение {copSeizoen}. Это приближение Карно — запросите сертифицированные значения в этих точках и сравните.","r":"EN 14511 / EN 14825"},"sww_rendement":{"t":"Горячее водоснабжение снижает сезонную эффективность","d":"При температуре хранения {t} °C тепловой насос работает с COP {copSww} против {copCv} для отопления. Годовая потребность в тепле на горячую воду составляет около {kwh} kWh, что соответствует примерно {elek} kWh электроэнергии. Рассматривайте это как отдельную систему: станция приготовления ГВС проточного типа, более низкая температура запаса или отдельная высокотемпературная ступень дадут здесь больше, чем любая оптимизация отопления.","r":"EN 14825"},"verswater_circulatie":{"t":"Станция приготовления ГВС проточного типа с циркуляционным трубопроводом","d":"Преимущество такой станции происходит из отсутствия застойной горячей воды. С циркуляционным трубопроводом эта вода частично возвращается, а вместе с ней и постоянные потери. Проверьте, может ли циркуляция включаться по времени или по запросу, и изолируйте усиленно.","r":"—"},"legionella_elektrisch":{"t":"Цикл против легионеллы на электрическом доводчике","d":"Периодический нагрев до 60 °C и выше на практике почти всегда выполняется электрическим ТЭНом, потому что тепловой насос такую температуру не берёт. Спросите, сколько киловатт-часов этот цикл стоит в год; обычно это больше, чем ожидают, и этого можно избежать проточным принципом.","r":"Национальное законодательство по легионелле"},"boilerspiraal":{"t":"Площадь теплообменника бака-водонагревателя","d":"Змеевик, слишком малый для теплового насоса, вынуждает поднимать температуру конденсации и стоит эффективности при каждой зарядке. Запрашивайте площадь теплообменника в m² и мощность при вашей температуре подачи — не при котловой.","r":"—"},"circulatieverlies":{"t":"Потери циркуляционного трубопровода","d":"При плохо изолированном циркуляционном трубопроводе потери могут превышать полезный водоразбор. Требуйте оценку этих потерь и усиленную изоляцию; где возможно, переключайте по времени или по запросу.","r":"—"},"voorrang_snel_systeem":{"t":"Приоритет горячей воды при быстрой системе теплоотдачи","d":"При воздушном отоплении или фанкойлах отключение отопления заметно в течение десяти минут. Зафиксируйте, сколько может длиться перерыв и сохраняется ли минимальная теплоотдача.","r":"—"},"buffer_te_klein":{"t":"Объём буферной ёмкости меньше расчётного","d":"Выбрано {gekozen} l против примерно {nodig} l, которые следуют из минимального времени работы и из оттайки. Слишком малая буферная ёмкость всё равно оставит агрегат тактовать; это стоит эффективности и ресурса.","r":"—"},"geen_buffer":{"t":"Нет буферной ёмкости при не полностью модулирующем агрегате","d":"Запросите у производителя минимальное время работы и минимальный водяной объём в системе. При тёплых полах собственного объёма часто достаточно; при радиаторах с термостатическими клапанами — почти никогда.","r":"—"},"evenwichtsfles":{"t":"Открытый коллектор или гидравлическая стрелка","d":"Неверно подобранная гидравлическая стрелка смешивает подачу и обратку: тепловой насос видит слишком высокую обратку, снижает модуляцию, и эффективность падает — притом что физически ничего не сломано. Избегайте гидравлического разделения там, где можно, и требуйте расчёт там, где нельзя.","r":"—"},"geen_inregeling":{"t":"Гидравлическая балансировка не предусмотрена","d":"Без балансировки ближайший контур получает всё, а самый дальний — ничего, и это компенсируют повышением температуры подачи — ровно тем, чего вы хотели избежать. Это и есть разница между установкой, которая работает на 35 °C, и той же установкой, которой приходится идти на 45 °C.","r":"—"},"vulwater":{"t":"Необработанный теплоноситель","d":"Накипь на теплообменнике с узкими каналами немедленно стоит мощности, а кислород даёт магнетит, который забивает насосы и арматуру. Большинство производителей увязывают гарантию с качеством теплоносителя. Требуйте анализ при сдаче и через год.","r":"VDI 2035"},"vulwater_onbepaald":{"t":"Качество теплоносителя ещё не определено","d":"Зафиксируйте требование до размещения заказа и включите его в приёмо-сдаточную документацию вместе с результатами измерений. Постфактум уже не доказать, чем система была заполнена.","r":"VDI 2035"},"geen_vuilafscheider":{"t":"Нет шламо- и воздухоотделения при существующих трубопроводах","d":"Существующие трубопроводы содержат магнетит и шлам, который при первом пуске уйдёт в новый теплообменник. Магнитный шламоуловитель и сепаратор микропузырьков непосредственно перед источником здесь не роскошь, а условие сохранения гарантии.","r":"—"},"glycol":{"t":"Гликоль в системе ({pct} %)","d":"Гликоль снижает теплоёмкость и повышает вязкость: больше расход и существенно больше энергии на перекачку при той же мощности. Ограничьте его контуром, где мороз действительно возможен, и отделите этот контур гидравлически.","r":"—"},"pompenergie":{"t":"Высокая доля энергии на перекачку","d":"Оценочно {kw} kW, около {pct} % тепловой мощности. Вспомогательная энергия входит в фактическую сезонную эффективность и почти никогда не измеряется. Проверьте рабочую точку насосов и потери давления в сети.","r":"—"},"expansievat":{"t":"Расширительный бак около {liter} l","d":"Рассчитано при объёме системы {volume} l. Проверьте предварительное давление относительно статической высоты и установите бак на всасывающей стороне насоса.","r":"EN 12828"},"tweepijps_gelijktijdig":{"t":"Двухтрубная система при одновременной потребности в тепле и холоде","d":"Зоны, которым нужно греть и охлаждать одновременно, с одним сезонным переключением этого не смогут. Выберите четырёхтрубную схему, сеть низкопотенциального источника с децентрализованными тепловыми насосами или VRF с рекуперацией — иначе весь межсезонный период будет порождать жалобы.","r":"—"},"vrije_koeling_gemist":{"t":"Свободное охлаждение не используется при высоком режиме охлаждения","d":"При подаче {t} °C в наших широтах свободное охлаждение возможно большую часть года, с одной лишь энергией насосов. Это самый сильный довод в пользу высокого режима охлаждения; используйте его.","r":"—"},"geen_terugwinning":{"t":"Одновременная потребность в тепле и холоде без рекуперации","d":"Тепло от охлаждения пригодно круглый год для горячей воды или для отопления других зон. Система с рекуперацией здесь окупается практически всегда.","r":"—"},"koeltoren_legionella":{"t":"Мокрая градирня — требуется план контроля","d":"Мокрая градирня энергетически выгодна и тянет за собой план контроля легионеллы, а также внимание к расположению относительно воздухозаборов этого здания и соседей.","r":"Национальное законодательство по легионелле"},"koudwater_te_koud":{"t":"Низкая температура холодной воды при лучистом охлаждении","d":"При подаче {t} °C лучистое охлаждение или бетонное ядро невозможно эксплуатировать безопасно из-за конденсации, и вдобавок теряется возможность свободного охлаждения. Разделите контуры: холодная вода на осушение, тёплая — на лучистое охлаждение.","r":"—"},"aansluiting_te_klein":{"t":"Электрическая присоединённая мощность недостаточна","d":"Оценочно одновременно {nodig} kW против {beschikbaar} kW доступных. Увеличение мощности занимает месяцы и иногда стоит дороже самой установки. Выясните это до размещения заказа и проверьте, нельзя ли растянуть пик средствами автоматики.","r":"—"},"aansluiting_onbekend":{"t":"Электрическая присоединённая мощность не указана","d":"Это самый частый сюрприз проекта с тепловым насосом. Запросите доступную величину присоединения и сложите тепловой насос, доводчик, приготовление горячей воды и, при наличии, зарядную инфраструктуру для самого холодного часа года.","r":"—"},"propaan_binnen":{"t":"Пропан (R290) при установке внутри","d":"R290 сильно горюч и тяжелее воздуха: он опускается в нижележащие помещения. Запросите заправочную массу, минимальный объём помещения, требования к вентиляции и расстояние до подвалов, приямков и проёмов — и сделайте это до того, как зафиксируете место установки.","r":"EN 378; IEC 60335-2-40"},"geluidseis_onbekend":{"t":"Требование по шуму не задано","d":"Шум наружных блоков — самая частая жалоба на тепловые насосы и самая частая причина надзорных мер. Найдите применимое предельное значение в точке оценки и обратите внимание на ночное значение — именно ночью агрегат продолжает работать.","r":"Региональные природоохранные требования"},"geluid_dichtbij":{"t":"Наружный блок близко к точке оценки, мероприятия не предусмотрены","d":"На {d} m при требовании {db} dB(A) какое-либо мероприятие практически наверняка необходимо. Учтите: ночной режим снижает и шум, и мощность — ровно тогда, когда снаружи холоднее всего; просчитайте, выдержит ли это здание.","r":"—"},"condens_buitendeel":{"t":"Отвод конденсата от наружного блока не организован","d":"Воздушный тепловой насос в мороз даёт десятки литров конденсата в сутки. Без обогреваемого отвода или щебёночной подушки он смерзается под агрегатом и на дорожке рядом — с риском падения людей и заклиниванием вентилятора.","r":"—"},"geen_octaafband":{"t":"Данные по октавным полосам не запрошены","d":"Одного значения в dB(A) недостаточно для акустического расчёта и тем более для низкочастотной составляющей, которая проходит сквозь фасады и мешает сильнее всего.","r":"—"},"geen_vorstbeveiliging":{"t":"Защита от замерзания при отказе не организована","d":"Что происходит при аварии в морозный период и кто получает сообщение? В здании с большим количеством воды в конструкции пола это не теоретический вопрос.","r":"—"},"geen_rendementsmeting":{"t":"Нет одновременного учёта тепла и электроэнергии на источнике","d":"Без обоих приборов фактическую сезонную эффективность установить невозможно, и любой спор о разочаровывающих показателях неразрешим. Именно поэтому этих счётчиков так часто и нет — включите их в опросник.","r":"—"},"hulpenergie_ongemeten":{"t":"Вспомогательная энергия не учитывается отдельно","d":"Насосы, оттайка, электроника и циркуляция суммируются и часто объясняют разницу между обещанной и измеренной эффективностью. Отдельный счётчик стоит мало и переводит спор в фактическую плоскость.","r":"—"},"geen_inregelrapport":{"t":"Отчёт о балансировке не запрошен","d":"Расходы по контурам, измеренные и запротоколированные. Без этого отчёта невозможно доказать, что установка способна работать на проектном режиме, и ни у кого нет причины это проверять.","r":"—"},"geen_nulmeting":{"t":"Нет измерения характеристик при сдаче","d":"Подача, обратка, расход, потребляемая и отдаваемая мощность при заданном режиме работы. Без нулевого замера позже невозможно установить, изменилось ли что-нибудь.","r":"—"},"geen_nameting":{"t":"Нет повторных измерений после первого отопительного сезона","d":"Фактическая эффективность выявляется только за целый сезон. Договорённость о повторном визите для подстройки отопительного графика и настроек обычно даёт от десяти до двадцати процентов экономии — больше, чем большинство решений по выбору оборудования.","r":"—"},"scop_zonder_garantie":{"t":"Требование по эффективности без гарантии показателей","d":"Требуемая сезонная эффективность без согласованных границ измерения, методики измерения и последствий недостижения — это пожелание, а не требование. Зафиксируйте, что произойдёт, если она не будет достигнута.","r":"—"},"doorlooptijd_boringen":{"t":"Сроки получения разрешений и выполнения бурения","d":"Геотермия требует разрешения, иногда отклик-теста и всегда согласования графика с буровой организацией. Эти сроки определяют планирование чаще, чем сроки поставки оборудования. Запускайте процедуру до размещения заказа.","r":"Нормативные требования к геотермальным системам"},"geen_selectierapport":{"t":"Отчёт о подборе не запрошен вместе с коммерческим предложением","d":"Запрашивайте характеристики при вашей температуре подачи, вашем расходе и вашей температуре низкопотенциального источника. Именно этот один документ впервые делает предложения разных производителей сопоставимыми — без него вы сравниваете буклеты.","r":"—"},"profiel_note":{"t":"На что обратить внимание при этом типе здания","d":"{note}","r":"{basis}"},"wand_niet_gedimensioneerd":{"t":"Стеновое отопление здесь не рассчитывается","d":"Стеновое отопление отмечено, но этот лист рассчитывает только напольное отопление. EN 1264-5 использует для стен собственные коэффициенты, которые здесь не заложены, поэтому теплоотдачу и температуру воды следует определить отдельно. Держите температуру поверхности ниже примерно {max} °C и учитывайте расположение мебели и коммуникаций.","r":"EN 1264-5"}},"mot":{"last":{"m":"Расчётная нагрузка","w":"Отправная точка для всех мощностей и для линии здания, на которой определяется точка бивалентности.","d":"Отопление {kw} kW ({spec} W/m²), охлаждение {kwK} kW; от {tOut} °C снаружи до {tIn} °C внутри. Коэффициент теплопотерь {ua} kW/K.","n":"EN 12831"},"regime":{"m":"Температурный режим","w":"Сквозная линия: он связывает теплоотдачу и теплогенерацию и определяет эффективность.","d":"{aan}/{ret} °C, перепад температур {dt} K, расход теплоносителя {debiet} m³/h.","n":"—"},"opwekker_wp":{"m":"Тепловой насос","w":"Исполнение: {type}. Выбран под зафиксированный выше температурный режим.","d":"Номинально {kw7} kW при A7/W35, при расчётных условиях остаётся {capOntwerp} kW. COP {copOntwerp} при расчётных условиях, сезонная оценка {copSeizoen}. Точка бивалентности {biv} °C, покрытие около {dekking} % годовой потребности в тепле.","n":"EN 14511 / EN 14825"},"opwekker_overig":{"m":"Теплогенерация","w":"Исполнение: {type}.","d":"Расчётная мощность {kw} kW.","n":"—"},"bijstook":{"m":"Доводчик","w":"Покрывает дефицит ниже точки бивалентности; стратегия — {strategie}.","d":"Требуется {kw} kW, исполнение: {type}.","n":"—"},"afgifte_rad":{"m":"Теплоотдача — {type}","w":"При выбранном режиме отдаёт {pct} % номинальной мощности по EN 442.","d":"Чтобы покрыть нагрузку, требуется около {nodig} kW номинала.","n":"EN 442"},"afgifte_vloer":{"m":"Тёплый пол","w":"Базовая теплоотдача на низкой температуре; ограничена допустимой температурой поверхности.","d":"Требуется {nodig} W/m² из максимальных {max} W/m²; температура поверхности {opp} °C, требуемая температура воды около {tmed} °C при покрытии с R = {r} m²K/W.","n":"EN 1264"},"afgifte_tabs":{"m":"Активация бетонного ядра","w":"Несёт базовую нагрузку за счёт массы здания; инерционная и саморегулирующаяся.","d":"Требуется {warm} W/m² тепла из максимальных {maxWarm} и {koud} W/m² холода из максимальных {maxKoud}.","n":"ISO 11855"},"sww":{"m":"Горячее водоснабжение","w":"Отдельная система с собственным, менее выгодным температурным уровнем; исполнение: {systeem}.","d":"{liter} l/сут при {t} °C, {kwh} kWh/сут и около {jaar} kWh/год. COP {cop}, то есть примерно {elek} kWh электроэнергии в год.","n":"—"},"buffer":{"m":"Буферная ёмкость","w":"Перекрывает минимальное время работы источника и даёт объём для оттайки.","d":"Рекомендуется {liter} l при минимальном времени работы {looptijd} мин; только для оттайки хватило бы {ontdooi} l. Подключение: {mode}.","n":"—"},"expansie":{"m":"Расширительный бак","w":"Воспринимает расширение воды и удерживает давление в рабочем диапазоне.","d":"Около {liter} l при объёме системы {volume} l.","n":"EN 12828"},"energie":{"m":"Годовой баланс (ориентировочно)","w":"Порядок величин для сравнения вариантов, а не для расчётов с потребителем.","d":"Потребность в тепле {warmte} kWh/год; электроэнергия на отопление {elek} kWh, на горячую воду {swwElek} kWh, вместе около {totaal} kWh.","n":"Метод градусо-суток"}},"sec":{"project":{"title":"Проект и здание","intro":"Что это за здание, насколько качественна оболочка и кто её эксплуатирует? Качество оболочки задаёт нагрузку, а нагрузка определяет, достижим ли низкотемпературный режим в принципе."},"belasting":{"title":"Нагрузки","intro":"Расчётная мощность, а не мощность существующего котла. Котёл почти всегда выбран со значительным запасом; кто переносит эту цифру в проект, покупает тепловой насос на два типоразмера больше и получает агрегат, который из-за этого плохо модулирует."},"afgifte":{"title":"Системы теплоотдачи","intro":"То, что установлено в помещении, определяет, какую температуру должен выдавать источник, — а не наоборот. Поэтому этот блок идёт до выбора теплового насоса. Расчёт показывает, сколько существующий радиатор действительно отдаёт при низком режиме."},"regime":{"title":"Температурный режим","intro":"Сквозная линия всего проекта. Каждый градус снижения на стороне подачи даёт примерно 2–3 процента прироста эффективности теплового насоса — и стоит площади конечных приборов. Здесь вы делаете этот размен явным, вместо того чтобы он произошёл сам собой."},"opwekking":{"title":"Теплогенерация","intro":"Только теперь очередь источника, потому что теперь зафиксировано, какую температуру он должен выдавать. Запрашивайте характеристики всегда при вашем режиме, а не при нормативных условиях из проспекта."},"koude":{"title":"Холодоснабжение","intro":"Охлаждение редко бывает отдельной системой. Вопрос не только в том, откуда берётся холод, но и в том, куда уходит тепло — и не окажется ли это тепло полезным где-то ещё в здании."},"bivalentie":{"title":"Бивалентность, резерв и надёжность","intro":"Тепловой насос, который в одиночку полностью покрывает расчётную нагрузку, весь остальной год избыточен. Слишком малый оставит здание холодным. Точка бивалентности — то место, где вы делаете этот выбор осознанно."},"sww":{"title":"Горячее водоснабжение","intro":"Раздел, который чаще всего обрушивает весь низкотемпературный проект. Отоплению нужно 35 °C, горячей воде — 55–60 °C: на этих параметрах тот же тепловой насос даёт почти вдвое меньшую эффективность. Рассматривайте ГВС как отдельную систему."},"hydraulica":{"title":"Гидравлика, буфер и водяной контур","intro":"Место, где установки с тепловыми насосами действительно ломаются чаще всего. Неверно выполненное гидравлическое разделение или буферная ёмкость не в том месте уничтожают перепад температур, а вместе с ним и эффективность, — притом что физически ничего не сломано."},"distributie":{"title":"Распределение и зонирование","intro":"Как энергия от источника доходит до помещения и где проходят границы ответственности и учёта. В коллективных системах это ещё и юридический вопрос, а не только технический."},"regeling":{"title":"Регулирование и управление","intro":"У котла автоматика компенсирует ошибки проекта; у теплового насоса она их усиливает. Отдавать медленно, держать низко и смотреть вперёд — вот суть."},"energie":{"title":"Энергия, учёт и тарифы","intro":"Сколько установка будет стоить на самом деле, зависит от тарифов и коэффициента одновременности не меньше, чем от эффективности. Этот блок делает эксплуатационные затраты видимыми рядом с инвестициями."},"opstelling":{"title":"Размещение, шум и безопасность","intro":"Где стоят агрегаты, определяет, разрешено ли им там стоять. Шум наружных блоков — самая частая жалоба на тепловые насосы и самая частая причина надзорного производства."},"normen":{"title":"Нормы, разрешения и меры поддержки","intro":"Что требуется по закону и что возможно финансово. У обоих есть сроки прохождения, и именно они определяют график — чаще, чем сроки поставки оборудования."},"uitvoering":{"title":"Монтаж, сдача и эксплуатация","intro":"Установка с тепловым насосом, которую не отбалансировали гидравлически, никогда не выйдет на свою эффективность — и никто этого не заметит, потому что тепло всё-таки идёт. Этот блок фиксирует, как вы это всё же заметите."}},"q":{"prj_name":{"label":"Название проекта"},"prj_client":{"label":"Заказчик","help":"Кто принимает решение о соотношении инвестиций и эксплуатационных затрат? У инвестора, сдающего объект в аренду, эти две статьи ложатся на разные стороны — и это меняет всю логику выбора."},"prj_location":{"label":"Населённый пункт","help":"Определяет расчётную наружную температуру, градусо-сутки и доступность тепловой сети или геотермального ресурса."},"prj_ref":{"label":"Шифр (референс)"},"prj_author":{"label":"Составил"},"prj_date":{"label":"Дата"},"geb_type":{"label":"Тип здания","help":"Задаёт исходные значения нагрузки, режима, коэффициента одновременности и сам вопрос о том, требуется ли охлаждение в принципе."},"prj_aard":{"label":"Характер проекта","help":"При замене только источника система теплоотдачи уже задана, а вместе с ней и режим. Это ровно та ситуация, в которой тепловой насос на существующих радиаторах разочаровывает, — этот опросник просчитывает такой случай за вас.","options":{"nieuwbouw":"Новое строительство","renovatie":"Реконструкция с улучшением оболочки","vervanging":"Замена источника, существующая теплоотдача","uitbreiding":"Расширение"}},"geb_area":{"label":"Отапливаемая площадь пола"},"geb_volume":{"label":"Отапливаемый объём","help":"Нужен для времени разогрева и для систем воздушной стороны."},"geb_bouwjaar":{"label":"Год постройки","help":"Грубый индикатор качества оболочки, когда расчёта нет."},"geb_schil":{"label":"Качество оболочки здания","help":"Главный вопрос этого блока. Плохо утеплённая оболочка требует высокой температуры подачи, а именно там тепловой насос даёт меньше всего. Утеплить до замены источника почти всегда дешевле, чем наоборот.","options":{"passief":"Пассивный дом / очень хорошее утепление","goed":"Хорошее — современное новое строительство","gemiddeld":"Среднее — доутеплённое здание","matig":"Посредственное — ограниченное утепление","slecht":"Плохое — без утепления"}},"geb_luchtdicht":{"label":"Воздухопроницаемость (n50 или v50)","help":"При негерметичной оболочке инфильтрационная нагрузка составляет заметную долю расчётной мощности и вдобавок зависит от ветра — то есть не поддаётся регулированию."},"geb_massa":{"label":"Тепловая инерция","help":"Определяет, работает ли медленное регулирование. Активация бетонного ядра требует массы; в лёгком здании с подвесным потолком она не даёт эффекта и является выброшенными деньгами.","options":{"zwaar":"Высокая — бетон, открытые поверхности","gemiddeld":"Средняя","licht":"Низкая — каркас, подвесной потолок"}},"geb_gebruik":{"label":"Режим эксплуатации","help":"При сильно прерывистом использовании инерционная система вроде тёплого пола или бетонного ядра непригодна: она не успевает ни вовремя нагреться, ни вовремя остановиться.","options":{"continu":"Непрерывный, 24/7","kantooruren":"Рабочие часы офиса","onderbroken":"Сильно прерывистый","seizoen":"Сезонный"}},"geb_zones":{"label":"Количество тепловых зон","help":"Зоны с разной загрузкой, ориентацией или требованиями. Каждая зона, которой нужно греть и охлаждать одновременно, толкает выбор системы к четырёхтрубной схеме или к тепловому насосу с рекуперацией."},"geb_gelijktijdig":{"label":"Могут ли зоны греть и охлаждать одновременно?","help":"Солнце с юга и тень с севера или серверная рядом с офисом. Если да, двухтрубная схема с сезонным переключением недостаточна, какой бы выгодной она ни казалась.","options":{"ja":"Да","nee":"Нет"}},"bel_basis":{"label":"На чём основана мощность?","help":"Помещенческий расчёт по EN 12831 — единственная база, на которой можно проверить теплоотдачу по каждому помещению. Удельный показатель годится для первой прикидки; данные фактического потребления за три года часто надёжнее расчёта на неверных исходных данных.","options":{"berekening":"Расчёт теплопотерь по помещениям","opgegeven":"Заданная суммарная мощность","specifiek":"Удельный показатель на м² (ориентировочно)","verbruik":"Выведено из фактического потребления"}},"bel_spec_heat":{"label":"Удельная тепловая мощность","help":"Пассивный дом 10–20, современное новое строительство 30–40, доутеплённое здание 45–70, неутеплённое 90–140 W/m². Используйте это только для первой прикидки."},"bel_heat_kw":{"label":"Тепловая мощность","help":"Без надбавки на разогрев; её вы указываете ниже отдельно, чтобы было видно, откуда она берётся."},"bel_opwarm":{"label":"Надбавка на разогрев после перерыва","help":"При непрерывной работе — ноль. При ежедневном ночном снижении в массивном здании надбавка может доходить до 20–30 %, и тогда именно она определяет всю мощность источника. Рассмотрите более длительный предварительный прогрев вместо увеличения мощности."},"bel_cooling":{"label":"Предусмотрено ли охлаждение?","options":{"ja":"Да","nee":"Нет"}},"bel_spec_cool":{"label":"Удельная холодильная мощность","help":"Офис с обычным остеклением 40–60 W/m², с большой площадью стекла или высокой внутренней нагрузкой 70–100. Наружное солнцезащитное устройство снижает эту величину сильнее, чем любая инженерная система."},"bel_cool_kw":{"label":"Холодильная мощность"},"bel_latent":{"label":"Доля скрытой холодильной нагрузки","help":"Решающий фактор при выборе системы. Лучистое охлаждение и бетонное ядро воспринимают исключительно явное тепло; влагу нужно убирать в другом месте — как правило, через установку обработки воздуха. Кто это забудет, получит конденсат на потолке."},"bel_intern":{"label":"Внутренние теплопоступления","help":"Люди, освещение, оборудование. В современном офисе это часто доминирующая холодильная нагрузка, и она заметно снижает потребность в тепле в дневное время."},"bel_proces":{"label":"Технологические или особые нагрузки","help":"Серверная, кухня, производственная линия, бассейн. Часто это нагрузки, требующие охлаждения круглый год, — а значит, бесплатный источник тепла для остального здания."},"bel_gelijktijdigheid":{"label":"Коэффициент одновременности","help":"Когда на один источник работает много квартир, можно считать меньше суммы пиков. Для одного здания с одной зоной — нельзя: там пик действительно наступает везде одновременно."},"cnd_t_design":{"label":"Расчётная наружная температура","help":"Для Бельгии обычно от −8 до −11 °C в зависимости от зоны и массивности здания. Вместе с нагрузкой задаёт линию здания, на которой находится точка бивалентности."},"cnd_t_room":{"label":"Температура помещения при отоплении"},"cnd_t_room_cool":{"label":"Температура помещения при охлаждении"},"cnd_dewpoint_room":{"label":"Наибольшая ожидаемая точка росы в помещении","help":"Нижняя граница для любой охлаждаемой поверхности. При 25 °C и 55 % относительной влажности точка росы около 15 °C — охлаждающий потолок с подачей 16 °C подходит к ней опасно близко. Без осушения лучистое охлаждение невозможно регулировать безопасно."},"cnd_degree_days":{"label":"Градусо-сутки","help":"Для Бельгии обычно около 2000 K·d при базе 15/15. Только для ориентировочной годовой оценки."},"afg_types":{"label":"Какие системы теплоотдачи предусмотрены или уже имеются?","help":"Комбинации — норма: тёплый пол на базовую нагрузку и фанкойлы на пик и на охлаждение. Укажите всё, что будет установлено, потому что режим всего контура задаёт наименьший общий знаменатель — если только вы не работаете с раздельными группами и узлами смешения.","options":{"vloer":"Тёплый пол","wand":"Настенное отопление","tabs":"Активация бетонного ядра (ТАБС)","radiator":"Радиаторы","convector":"Конвекторы","vloerconvector":"Внутрипольные конвекторы","ventilo":"Фанкойлы","koelplafond":"Охлаждающий потолок / климатический потолок","balk":"Индукционные доводчики / охлаждающие балки","paneel":"Лучистые панели","luchtverwarmer":"Воздушное отопление через установку обработки воздуха","vrf":"Внутренние блоки VRF (непосредственное испарение)"}},"afg_bestaand":{"label":"Повторно используется ли существующая теплоотдача?","help":"Если да, распорядитесь снять по каждому помещению установленную номинальную мощность. Без такой инвентаризации невозможно установить, достижим ли выбранный режим, и любое обещание относительно теплового насоса остаётся гаданием.","options":{"nee":"Нет, всё новое","deels":"Частично","ja":"Да, полностью"}},"afg_vloer_share":{"label":"Доля нагрузки через тёплый пол или настенное отопление"},"afg_vloer_coverage":{"label":"Доступная площадь укладки","help":"Под встроенными шкафами, кухонными блоками и оборудованием контуры не укладывают. При 60 % доступной площади то же тепло должно пройти через меньшее число квадратных метров, значит, температура воды растёт — часто ровно настолько, чтобы съесть всё преимущество теплового насоса."},"afg_vloer_r":{"label":"Термическое сопротивление напольного покрытия","help":"Плитка около 0,02, ламинат с подложкой 0,10–0,15, ковровое покрытие до 0,20 m²K/W. Это самый тихий убийца проектов: тот же тёплый пол под ковром требует на десять градусов более высокой температуры воды, чем под плиткой. Зафиксируйте максимально допустимое сопротивление в техническом задании и доведите его до застройщика."},"afg_vloer_spacing":{"label":"Шаг укладки","help":"Меньший шаг снижает требуемую температуру воды. 10 см вместо 15 см дают несколько градусов и в новом строительстве стоят дёшево; постфактум изменить это уже нельзя."},"afg_tabs_share":{"label":"Доля нагрузки через активацию бетонного ядра","help":"Бетонное ядро отдаёт примерно 30–40 W/m² тепла и 40–50 W/m² холода и реагирует часами, а не минутами. Оно покрывает базовую нагрузку; пик и регулирование по помещениям должна обеспечивать более быстрая система."},"afg_koelplafond_share":{"label":"Доля холодильной нагрузки через охлаждающий потолок"},"afg_regelbaar":{"label":"Регулирование по помещениям","help":"При тёплом поле и бетонном ядре регулирование по помещениям работает только медленно; избыточное регулирование ведёт к перегреву и колебаниям. С тепловым насосом обычно лучше держать проток при низкой, погодозависимо управляемой температуре, чем включать и выключать по помещениям.","options":{"thermostaat":"Комнатный термостат на зону","kraan":"Термостатические клапаны","centraal":"Только централизованно, погодозависимо","geen":"Индивидуального регулирования нет"}},"afg_meting":{"label":"Проведена ли инвентаризация существующей теплоотдачи по помещениям?","help":"Тип, размеры и номинальная мощность каждого прибора. Это та работа, которую никто не хочет делать и которая определяет разницу между работающей и неработающей установкой.","options":{"ja":"Да","nee":"Нет"}},"reg_t_flow":{"label":"Температура подачи при отоплении в расчётных условиях","help":"Тёплый пол 30–38, бетонное ядро 26–32, новые радиаторы 45–55, существующие радиаторы часто 70–80 °C. Именно эта цифра решает, какие источники вообще остаются в рассмотрении."},"reg_t_return":{"label":"Температура обратки при отоплении","help":"Перепад температур задаёт расход теплоносителя, а через него — диаметры трубопроводов и энергию на перекачку. Тепловой насос обычно работает с перепадом 5 K, котёл — с 20 K: это разница в расходе в четыре раза и заметная разница в подборе трубопроводов."},"reg_weersafhankelijk":{"label":"Погодозависимое регулирование температуры подачи?","help":"Практически бесплатный прирост эффективности: при 7 °C снаружи достаточно подачи значительно ниже, чем при −8 °C. Без отопительного графика установка весь сезон работает на расчётном значении, и тепловой насос теряет большую часть своего преимущества.","options":{"ja":"Да","nee":"Нет"}},"reg_t_flow_cool":{"label":"Температура подачи при охлаждении","help":"Фанкойлы с осушением 6–8 °C, лучистое охлаждение и бетонное ядро 16–18 °C. Высокая температура холодной воды открывает свободное охлаждение и обеспечивает хорошую работу холодильной машины, но исключает осушение — это выбор системы, а не настройка."},"reg_t_return_cool":{"label":"Температура обратки при охлаждении"},"reg_glycol_pct":{"label":"Доля гликоля","help":"Гликоль снижает теплоёмкость и повышает вязкость: при 30 % это примерно на 10 % больший расход и существенно больше энергии на перекачку при той же мощности. Применяйте его только там, где мороз действительно возможен, и отделяйте такой контур гидравлически."},"reg_menggroepen":{"label":"Узлы смешения для разных режимов?","help":"Необходимы, как только тёплый пол и радиаторы висят на одном источнике. Учтите: источник тогда обязан выдавать самую высокую температуру, а узел смешения понижает её локально — то есть эффективность следует за радиаторами, а не за полом. Оцените, нельзя ли всё-таки заменить радиаторы.","options":{"ja":"Да","nee":"Нет"}},"reg_dt_marge":{"label":"Закрепить режим договором с точками измерения?","help":"Подача, обратка и перепад при расчётных условиях, измеряемые при сдаче. Без такой договорённости режим по ходу монтажа тихо уползает вверх, и потом никто не отвечает за разочаровывающую эффективность.","options":{"ja":"Да","nee":"Нет"}},"opw_type":{"label":"Тип источника","help":"Системы с грунтовым контуром дают стабильный низкопотенциальный источник круглый год и потому гораздо более ровную эффективность, но требуют разрешения, места и заметно больших вложений. Воздух-вода проще, и его самый слабый момент приходится именно на мороз — ровно тогда, когда здание требует больше всего.","options":{"lucht_water":"Тепловой насос воздух-вода","grond_boring":"Тепловой насос грунт-вода — вертикальные скважины","grond_horizontaal":"Тепловой насос грунт-вода — горизонтальный контур","water_water":"Тепловой насос вода-вода — грунтовые или поверхностные воды","afvoerlucht":"Тепловой насос на вытяжном воздухе","lucht_lucht":"Тепловой насос воздух-воздух","hybride":"Гибрид — тепловой насос с котлом","gasketel":"Газовый котёл, конденсационный","elektrisch":"Электрический нагрев сопротивлением","warmtenet":"Тепловая сеть / централизованное теплоснабжение","wkk":"Когенерационная установка","biomassa":"Котёл на биомассе","zon_thermisch":"Солнечные коллекторы (дополнительно)"}},"opw_hp_kw":{"label":"Мощность теплового насоса при A7/W35","help":"Производители дают мощность при благоприятных условиях. Запросите полную таблицу: мощность и COP при A−7/W45, A2/W35, A7/W35 и при вашей собственной температуре подачи. Разница между этими точками больше, чем предполагает большинство коммерческих предложений."},"opw_source_t":{"label":"Температура низкопотенциального источника в расчётных условиях","help":"Для воздуха это расчётная наружная температура. Для грунта обычно от 0 до 5 °C, для грунтовых вод от 10 до 12 °C. Оставьте поле пустым, чтобы вывести значение из типа источника."},"opw_modulatie":{"label":"Регулирование мощности","help":"Запрашивайте минимальную модулируемую мощность, а не только максимальную. Тепловой насос, который не может опуститься ниже 40 % своей мощности, начнёт тактовать весной и осенью — это стоит эффективности и ресурса, и буферной ёмкостью такое можно только смягчить, но не устранить.","options":{"inverter":"Плавное (инвертор)","stappen":"Несколько ступеней","aan_uit":"Включено/выключено"}},"opw_koudemiddel":{"label":"Хладагент","help":"Регламент по фторсодержащим газам выдавливает хладагенты с высоким GWP с рынка; поэтому R290 фактически стал стандартом для тепловых насосов малой мощности. Пропан сильно горюч: это накладывает требования к месту установки, к расстояниям до проёмов и к подвалу или приямку, куда может опуститься утечка.","options":{"R290":"R290 пропан (A3)","R32":"R32 (A2L)","R454C":"R-454C (A2L)","R1234ze":"R-1234ze (A2L)","R744":"R-744 CO₂","R410A":"R-410A (A1)"}},"opw_max_temp":{"label":"Максимальная температура подачи теплового насоса","help":"Проверьте, что это значение достигается и при самой низкой температуре низкопотенциального источника — многие агрегаты выходят на свой максимум только при мягкой наружной температуре, а это ровно не тот момент, когда он вам нужен."},"opw_bron_detail":{"label":"Данные по низкопотенциальному источнику","help":"Количество и глубина скважин, либо площадь горизонтального контура, либо расход и температура грунтовых вод. На крупных объектах запросите также тепловой отклик-тест и годовой баланс отбора и закачки — грунтовый массив, из которого только забирают, за годы выхолаживается, и эффективность падает вместе с ним."},"opw_regeneratie":{"label":"Предусмотрена ли регенерация грунтового массива?","help":"Пассивное охлаждение летом снова заряжает массив и даёт почти бесплатный холод. Это самый сильный довод в пользу геотермии — и о нём часто забывают в коммерческом предложении.","options":{"ja":"Да","nee":"Нет"}},"opw_warmtenet_detail":{"label":"Условия подключения к тепловой сети","help":"Температура подачи, гарантированная температура обратки, штрафы за завышенную обратку, присоединённая мощность и структура тарифа. Максимально допустимая температура обратки — жёсткое граничное условие: она определяет весь ваш проект теплоотдачи и она измеряется."},"opw_bestaand":{"label":"Существующая теплогенерация, которая остаётся или выводится","help":"При поэтапной замене: что остаётся, как оно встраивается гидравлически и кто управляет переходом?"},"kou_type":{"label":"Источник холода","help":"Пассивное охлаждение от грунта расходует только энергию насосов и одновременно заряжает массив к зиме. Оно даёт ограниченную мощность при высокой температуре воды — ровно то, что подходит бетонному ядру и охлаждающему потолку, и не подходит для осушения.","options":{"reversibel":"Реверсивный тепловой насос","chiller":"Отдельная холодильная машина","passief_bodem":"Пассивное охлаждение от грунта","vrije_koeling":"Свободное охлаждение (фрикулинг) с сухой градирней","vrf":"VRF с рекуперацией тепла","adiabatisch":"Адиабатическое охлаждение","warmtenet_koude":"Сеть холодоснабжения","geen":"Активного охлаждения нет"}},"kou_terugwinning":{"label":"Одновременное отопление и охлаждение с рекуперацией?","help":"В здании с серверной, кухней или ориентацией север-юг тепло от охлаждения пригодно круглый год для горячего водоснабжения или для отопления. Это требует четырёхтрубной системы или теплового насоса с рекуперацией и практически всегда окупается.","options":{"ja":"Да","nee":"Нет"}},"kou_condensor":{"label":"Сброс тепла от холодильной машины","help":"Мокрая градирня энергетически наиболее выгодна и тянет за собой план контроля легионеллы, а также внимание к расположению относительно воздухозаборов. Сброс тепла в грунт почти всегда лучший вариант там, где скважины и так уже пробурены.","options":{"lucht":"С воздушным охлаждением","droog":"Сухая градирня с гликолем","adiabatisch_cond":"С адиабатической поддержкой","nat":"Мокрая градирня","bodem":"В грунт","water":"В поверхностные или грунтовые воды"}},"kou_vrije_koeling":{"label":"Свободное охлаждение при низкой наружной температуре?","help":"При режиме охлаждения 16/18 °C свободное охлаждение в наших широтах возможно большую часть года. Это самый сильный довод в пользу высокого режима охлаждения — и работает он только тогда, когда система теплоотдачи ему соответствует.","options":{"ja":"Да","nee":"Нет"}},"kou_ontvochtiging":{"label":"Где происходит осушение?","help":"Вопрос, который решает судьбу лучистого охлаждения. Без осушения в другом месте охлаждающий потолок или бетонное ядро никогда не смогут опуститься ниже точки росы, а значит, автоматика будет ограничивать температуру поверхности — с потерей мощности ровно в самые жаркие и влажные дни.","options":{"lucht":"В установке обработки воздуха","ventilo":"В фанкойлах","geen":"Нигде — активного осушения нет"}},"biv_strategie":{"label":"Стратегия бивалентности","help":"Параллельная схема оставляет тепловой насос в работе и позволяет доводчику покрывать только дефицит; альтернативная выключает насос полностью. При газовом котле в качестве доводчика альтернативная схема иногда дешевле в эксплуатации, при электрическом доводчике — практически никогда.","options":{"monovalent":"Моновалентная — тепловой насос покрывает всё","parallel":"Бивалентно-параллельная — доводчик наряду с тепловым насосом","alternatief":"Бивалентно-альтернативная — переключение на котёл","deels_parallel":"Частично параллельная, затем переключение"}},"biv_backup":{"label":"Тип доводчика","help":"Электрический доводчик дёшев при покупке и дорог в эксплуатации: каждый киловатт-час стоит одного киловатт-часа, тогда как тепловой насос выдаёт три-пять. Спросите, сколько часов в год он предположительно будет работать, и просчитайте это — часто оказывается, что чуть больший тепловой насос дешевле.","options":{"geen":"Нет","elektrisch":"Электрический ТЭН","gasketel":"Газовый котёл","warmtenet":"Тепловая сеть","tweede_wp":"Второй тепловой насос"}},"biv_punt":{"label":"Желаемая точка бивалентности","help":"При −5 °C тепловой насос обычно покрывает свыше 90 % годовой потребности в тепле, будучи при этом заметно меньше расчётной нагрузки. Этот опросник вычисляет фактическую точку по вашим собственным данным и показывает её рядом с этим пожеланием."},"biv_redundantie":{"label":"Требуемая надёжность при отказе","help":"Для жилья или офиса нужна редко, для медицинского учреждения, центра обработки данных или технологического процесса — жёсткое требование. Несколько меньших агрегатов дают и резервирование, и лучшую работу на частичной нагрузке — часто это лучший выбор, чем один большой.","options":{"geen":"Нет — отказ допустим","gedeeltelijk":"Часть мощности должна сохраняться","volledig":"Полное резервирование (n+1)"}},"biv_vorstbeveiliging":{"label":"Организована ли защита здания от замерзания при отказе?","help":"Что происходит при аварии в морозный период и кто получает об этом сообщение? В здании с тёплыми полами и большим количеством воды в конструкции пола это не теоретический вопрос.","options":{"ja":"Да","nee":"Нет"}},"biv_smart_grid":{"label":"Возможно ли управление по нагрузке сети или по тарифу?","help":"Часы блокировки со стороны сетевого оператора, динамические тарифы или собственная солнечная генерация. Это требует ёмкости хранения в буфере или в массе здания и автоматики, способной смотреть вперёд. При активации бетонного ядра эта масса уже есть бесплатно.","options":{"ja":"Да","nee":"Нет"}},"dhw_aanwezig":{"label":"Готовит ли эта установка горячую воду для ГВС?","options":{"ja":"Да","nee":"Нет"}},"dhw_persons":{"label":"Количество человек или водоразборных точек"},"dhw_l_person":{"label":"Расход на человека в сутки","help":"Жильё 35–50 l на человека при 55 °C, офис существенно меньше, спортивные объекты и здравоохранение заметно больше и с резким пиком."},"dhw_profiel":{"label":"Профиль водоразбора","help":"Пик определяет объём, суточное потребление определяет мощность. На спортивном объекте определяющим является пик, и запас объёма дешевле мощности.","options":{"woning":"Жильё — утренний и вечерний пик","kantoor":"Офис — низкое и растянутое потребление","sport":"Спорт — короткий очень высокий пик","zorg":"Здравоохранение — высокое и непрерывное","horeca":"Общественное питание / кухня"}},"dhw_t_store":{"label":"Температура хранения","help":"Каждый градус сверху стоит эффективности теплового насоса. Проточный водонагреватель или станция приготовления ГВС проточного типа обходится более низкой температурой запаса, потому что застойной горячей воды нет, — это часто самое изящное решение вопроса легионеллы."},"dhw_t_cold":{"label":"Температура холодной воды"},"dhw_systeem":{"label":"Система","help":"Станция приготовления ГВС проточного типа готовит воду по запросу и не держит горячую воду в запасе; это снижает риск легионеллы и допускает более низкую температуру буфера. Недостаток — высокий пиковый спрос в этот момент: его должны выдержать буферная ёмкость или теплообменник.","options":{"boiler":"Ёмкостный водонагреватель со змеевиком","verswater":"Станция приготовления ГВС проточного типа","laadsysteem":"Зарядная система с внешним теплообменником","decentraal":"Децентрализованно, по квартирам или точкам разбора","elektrisch_boiler":"Электрический водонагреватель"}},"dhw_legionella":{"label":"Контроль легионеллы","help":"Термическая дезинфекция требует периодических 60 °C и выше во всей системе, включая циркуляционный трубопровод. Это тот момент, когда включается электрический доводчик: спросите, сколько энергии это стоит в год, потому что обычно это больше, чем ожидают.","options":{"thermisch":"Периодическая термическая дезинфекция","doorstroom":"Проточный принцип, без запаса воды","temperatuur":"Постоянное поддержание температуры","alternatief":"Альтернативная технология"}},"dhw_circulatie":{"label":"Есть ли циркуляционный трубопровод?","help":"Циркуляционный трубопровод держит горячую воду доступной и при этом постоянно теряет тепло — при плохой изоляции эти потери могут превышать полезное потребление. Изолируйте усиленно и, где возможно, включайте циркуляцию по времени или по запросу.","options":{"ja":"Да","nee":"Нет"}},"dhw_voorrang":{"label":"Приоритет ГВС над отоплением?","help":"Обычная практика и редко проблема, но зафиксируйте, насколько долго отопление может отключаться. При активации бетонного ядра этого никто не заметит; при воздушном отоплении — в течение десяти минут.","options":{"ja":"Да","nee":"Нет"}},"dhw_zon":{"label":"Использовать солнечный водонагреватель или избыток PV?","help":"Горячая вода — простейшее хранилище для собственной солнечной электроэнергии, п ьного оборудования","eenheid":"Учёт по единице или арендатору"}},"ene_prestatie":{"label":"Запрошена ли гарантия на сезонную эффективность?","help":"Имеет смысл только при заранее согласованных границах измерения, методике измерения и граничных условиях. Спросите, что произойдёт, если гарантия не будет выполнена, — именно в этом её настоящая ценность.","options":{"ja":"Да","nee":"Нет"}},"ene_scop_eis":{"label":"Требуемая сезонная эффективность (SCOP)","help":"Укажите вместе с ней граничные условия: какой режим, с горячим водоснабжением или без, с вспомогательной энергией или без. Без такого разграничения цифра бессмысленна."},"ops_plaats_binnen":{"label":"Размещение внутренних блоков","help":"Укажите свободное пространство вокруг, ширину двери и допустимую нагрузку на пол. При установке пропанового теплового насоса внутри дополнительно действуют требования к объёму помещения, к вентиляции и к наличию нижележащих помещений, куда газ может опуститься.","options":{"techniek":"Техническое помещение","berging":"Кладовая или подсобное помещение","kelder":"Подвал","dak":"Надстройка на кровле","buiten_ops":"Полностью снаружи"}},"ops_plaats_buiten":{"label":"Расположение наружных блоков","help":"Расстояние до границы участка, до окон собственного дома и до окон соседей, а также направление выброса вентилятора. Подумайте и о том, куда уходит холодный выбрасываемый воздух: на террасу или дорожку — значит, иней и гололёд."},"ops_geluid_eis":{"label":"Допустимый уровень шума в точке оценки","help":"Следует из региональных природоохранных требований и действует обычно на границе участка или у ближайшего окна соседа. Определяющим является ночное значение, а именно ночью тепловой насос продолжает работать."},"ops_geluid_afstand":{"label":"Расстояние до ближайшей точки оценки"},"ops_geluid_maatregel":{"label":"Предусмотренные акустические мероприятия","help":"Ночной режим одновременно снижает и шум, и мощность — как раз тогда, когда снаружи холоднее всего. Просчитайте, выдержит ли это здание, иначе вы решите проблему шума за счёт тепла.","options":{"nachtmodus":"Ночной режим с ограничением оборотов","omkasting":"Акустический кожух или экран","trillingsdempers":"Виброопоры и гибкие присоединения","plaatsing":"Размещение в стороне от чувствительных фасадов","geen_maatregel":"Мероприятия не предусмотрены"}},"ops_octaaf":{"label":"Запрашивать уровень звуковой мощности по октавным полосам?","help":"Одного значения в dB(A) недостаточно для акустического расчёта и тем более для низкочастотной составляющей, которая проходит сквозь фасады и мешает сильнее всего.","options":{"ja":"Да","nee":"Нет"}},"ops_trillingen":{"label":"Виброизоляция компрессора и насосов?","help":"При установке на лёгкое перекрытие или у стены жилого помещения именно виброизоляция определяет, слышна ли установка, даже если воздушный шум в норме.","options":{"ja":"Да","nee":"Нет"}},"ops_koudemiddel_veiligheid":{"label":"Безопасность, связанная с хладагентом","help":"Заправочная масса на контур, минимальный объём помещения, обнаружение утечек, вентиляция и расстояние до проёмов и подвалов. Для пропана это отчасти определяет место установки — выясните это до того, как зафиксируете место."},"ops_condens":{"label":"Организован ли отвод конденсата от наружного блока?","help":"Воздушный тепловой насос в мороз даёт десятки литров конденсата в сутки. Без обогреваемого отвода или щебёночной подушки он смерзается под агрегатом и на дорожке рядом.","options":{"ja":"Да","nee":"Нет"}},"ops_toegang":{"label":"Обеспечены ли свободное пространство для обслуживания и доступ?","help":"Включая место для демонтажа компрессора или теплообменника через десять лет, когда вокруг уже всё застроят.","options":{"ja":"Да","nee":"Нет"}},"nrm_epb":{"label":"Подпадает ли проект под требования энергетической эффективности зданий?","help":"Определяет минимальные требования к эффективности, к изоляции трубопроводов, к учёту, а иногда и к доле возобновляемой энергии.","options":{"ja":"Да","nee":"Нет"}},"nrm_normen": const LANG_UK = {"code":"uk","name":"Українська","prof":{"woning_nieuw":{"label":"Житловий будинок — нове будівництво","note":"Тут усе стає на свої місця: добра оболонка, тепла підлога, низький режим. Увага зміщується на гаряче водопостачання — у сучасному будинку це швидко стає половиною річної потреби в теплоті, і працює воно за куди менш сприятливої температури, ніж опалення.","basis":"EPB для нового будівництва; EN 12831"},"woning_renovatie":{"label":"Житловий будинок — реконструкція","note":"Найскладніша категорія і водночас найпоширеніша. Наявні радіатори підібрані на 75/65 і за 45/40 віддають ще близько третини заявленої потужності. Проінвентаризуйте по приміщеннях, що встановлено, прорахуйте, що виходить за бажаного режиму, і цілеспрямовано замініть ті прилади, яких не вистачає — це майже завжди дешевше за більший тепловий насос або за вищий режим.","basis":"EN 12831; інвентаризація наявних приладів тепловіддачі"},"appartement_collectief":{"label":"Колективний житловий будинок","note":"Тут ефективність визначають приготування гарячої води і циркуляційний трубопровід, а не опалення. Колективний трубопровід, що цілий рік стоїть на 60 °C, втрачає теплоту безперервно; станції приготування ГВП проточного типу в кожній квартирі на мережі джерела 40 °C розв'язують і питання легіонели, і питання ефективності.","basis":"EPB; облік на одиницю"},"kantoor_nieuw":{"label":"Офіс — нове будівництво","note":"Активація бетонного ядра з ґрунтовою енергією — сильна пара: влітку ґрунт дає пасивне охолодження і водночас заряджається на зиму. Умова — маса в будівлі та доводяче регулювання, яке перехоплює пік: саме лише бетонне ядро не витягує пікового навантаження і не регулює за приміщеннями.","basis":"EN 16798-1; EPB"},"kantoor_renovatie":{"label":"Офіс — реконструкція","note":"Зверніть увагу на зони, які хочуть водночас опалюватися й охолоджуватися: південний фасад на сонці, тоді як північний бік ще потребує теплоти. Двотрубна система із сезонним перемиканням робить це неможливим і дає скарги весь перехідний сезон.","basis":"EN 16798-1"},"school":{"label":"Школа","note":"Сильно переривчасте використання з канікулами: тут потужність джерела теплоти визначає надбавка на розігрів, а не розрахункове навантаження. Оптимальний старт із регулюванням, яке вивчає час розігріву, дешевший за додаткові кіловати — а повільна тепловіддача на кшталт бетонного ядра до такого режиму пасує погано.","basis":"EN 16798-1; настанови для закладів освіти"},"zorg":{"label":"Заклад охорони здоров'я","note":"Домінує гаряче водопостачання: високе споживання, безперервне, з циркуляційним трубопроводом і суворим режимом проти легіонели на 60 °C. Розглядайте його як окрему установку з власним джерелом теплоти або з власним високотемпературним ступенем, інакше воно тягне вниз ефективність усього опалення.","basis":"EN 16798-1; настанови для закладів охорони здоров'я; законодавство щодо легіонели"},"winkel":{"label":"Магазин / роздрібна торгівля","note":"Високе внутрішнє навантаження від освітлення та відвідувачів: охолодження тут часто потрібне цілий рік, а опалення — лише до відкриття. Там, де є ще й холодильні вітрини, теплота їхніх конденсаторів є безкоштовним джерелом теплоти для магазину — про цей зв'язок майже завжди забувають.","basis":"EN 16798-1"},"sport":{"label":"Спортивна споруда","note":"Визначальним є пік душу, і триває він двадцять хвилин. Запас тут набагато дешевший за потужність: великий бак, який спокійно заряджається протягом дня, перемагає великий тепловий насос, що тричі на тиждень має видати все й одразу.","basis":"EN 16798-1"},"zwembad_geb":{"label":"Басейн","note":"Три потреби в теплоті водночас: вода басейну, опалення приміщень і вода для душу, кожна зі своєю температурою. Найбільша втрата — випаровування з поверхні води, і перший захід — накриття поза годинами роботи; воно перемагає будь-яке інженерне рішення.","basis":"VDI 2089"},"industrie_hal":{"label":"Промисловий цех","note":"Променеві панелі гріють людей і робочі поверхні замість повітря під дахом, і у високому цеху це дає суттєву різницю. Вони, щоправда, потребують вищої температури подачі, ніж тепла підлога — цей обмін слід зробити свідомо.","basis":"Технологічне опалення; EN 12831"},"proces_restwarmte":{"label":"Процес зі скидною теплотою","note":"Там, де процес потрібно охолоджувати цілий рік, уже готове джерело теплоти зі сталою температурою — набагато вигідніше за зовнішнє повітря і без сезонного ходу. Спершу складіть карту температурних рівнів і одночасності, перш ніж дивитися назовні.","basis":"Утилізація теплоти технологічних процесів"},"datacenter_geb":{"label":"Центр обробки даних / серверна","note":"Лише охолодження, цілий рік, з пріоритетом доступності над ефективністю. Високий режим охолодження робить вільне охолодження можливим значну частину року, а відведена теплота на зворотній лінії 26 °C придатна для сусідньої будівлі або для гарячої води через тепловий насос.","basis":"ASHRAE TC 9.9"}},"ui":{"appTitle":"Опитувальник з опалення та охолодження","appSubtitle":"Від виробництва теплоти до кінцевих приладів — із температурним режимом як наскрізною лінією","step":"Крок","of":"з","next":"Далі","prev":"Назад","report":"Звіт","print":"Звіт / pdf","save":"Зберегти","load":"Відкрити","reset":"Очистити","demo":"Приклад","required":"обов'язково","why":"Навіщо це запитання","kpiHeat":"Теплова потужність","kpiCool":"Холодильна потужність","kpiRegime":"Режим опалення","kpiFlowRate":"Витрата води, опалення","kpiCop":"COP за розрахункових умов","kpiScop":"Сезонна ефективність (оцінка)","kpiBivalent":"Точка бівалентності","kpiCoverage":"Покриття тепловим насосом","kpiBackup":"Потрібний доводчик","kpiBuffer":"Рекомендований об'єм буфера","kpiExpansion":"Розширювальний бак","kpiDhw":"Гаряче водопостачання","kpiDhwCop":"COP гарячого водопостачання","kpiEnergyHeat":"Потреба в теплоті за рік","kpiEnergyElec":"Електроенергія за рік","kpiUA":"Коефіцієнт тепловтрат","kpiRadiator":"Тепловіддача за цього режиму","diagramTitle":"Побудова установки","rowWarm"
