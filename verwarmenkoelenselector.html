{type} stanowi tylko {pct} % mocy nominalnej, na której opiera się wybór zgodnie z normą EN 442 — wartość ta obowiązuje przy 75/65/20. Pokrycie obciążenia wymaga około {nodig} kW mocy nominalnej. Sprawdź, co jest zamontowane w każdym pomieszczeniu i wymień dokładnie te elementy, które nie spełniają wymagań; jest to prawie zawsze tańsze niż większe urządzenie lub wyższy reżim, a jest to jedyny sposób, który faktycznie poprawia wydajność.","r":"EN 442"},"afgifte_derating":{"t":"Odbiorniki w tym parametrach pracy generują znacznie mniej energii.","d":"Przy {aan}/{ret} °C moc {type} wynosi {pct} % mocy nominalnej. Aby pokryć obciążenie, należy przyjąć około {nodig} kW mocy nominalnej. Sprawdź to w każdym pomieszczeniu: średnia nic nie powie, liczy się pomieszczenie z najmniejszym marginesem.","r":"EN 442"},"afgifte_ok":{"t":"Odbiorniki pasują do wybranego parametrów pracy.","d":"W tym parametrach pracy {type} nadal wynosi {pct} % mocy nominalnej. Mimo to należy sprawdzić pomieszczenie o najmniej korzystnym stosunku obciążenia do zainstalowanej mocy odbiornika.","r":"EN 442"},"vloer_oververhit":{"t":"Ogrzewanie podłogowe o temperaturze powyżej dopuszczalnej powierzchni","d":"Wymagany strumień ciepła wynosi {nodig} W/m², natomiast przy maksymalnej temperaturze powierzchni 29°C w strefie przebywania ludzi możliwe jest osiągnięcie około {max} W/m². Obliczona temperatura powierzchni wynosi {opp} °C — co jest nie tylko poza normą, ale również niekomfortowe. Należy zwiększyć powierzchnię układania, zmniejszyć odstępy między rurami lub zastosować drugi system emisji.","r":"EN 1264"},"vloerafwerking":{"t":"Wykładzina podłogowa o wysokim oporze cieplnym","d":"Przy R = {r} m²K/W temperatura wody musi wzrosnąć do około {tmed} °C, aby dostarczyć takie samo ciepło. To najcichszy z możliwych zabójców projektów: klient wybiera podłogę niezależnie od instalacji, a wydajność pompy ciepła spada. Należy określić maksymalny dopuszczalny opór w specyfikacji i o nim poinformować.","r":"EN 1264"},"legoppervlak":{"t":"Ograniczona powierzchnia układania ogrzewania podłogowego","d":"Przy {pct} % dostępnej powierzchni to samo ciepło musi przejść przez mniejszą liczbę metrów kwadratowych, a temperatura wody odpowiednio wzrasta. Należy sprawdzić, czy wbudowane szafki i urządzenia rzeczywiście znajdują się w tych miejscach i rozważyć ogrzewanie ścienne jako uzupełnienie.","r":"EN 1264"},"tabs_te_zwaar":{"t":"System budynku aktywowany termicznie nie jest w stanie udźwignąć obciążenia grzewczego","d":"{nodig} W/m² jest wymagane, podczas gdy rdzeń betonowy zapewnia około {max} W/m². Rdzeń betonowy pokrywa obciążenie podstawowe; szczyt musi pochodzić z drugiego, szybszego systemu. Należy obliczyć oba, zamiast liczyć na to, że masa je pochłonie.","r":"ISO 11855"},"tabs_koel_te_zwaar":{"t":"System budynku aktywowany termicznie nie jest w stanie samodzielnie udźwignąć obciążenia chłodzenia","d":"Wymagane {nodig} W/m² w porównaniu z dostępnym około {max} W/m². Uzupełnij go o sterowanie końcowe lub zmniejsz obciążenie chłodzenia za pomocą zewnętrznych osłon przeciwsłonecznych — to drugie rozwiązanie jest prawie zawsze tańsze niż zainstalowana moc instalacji.","r":"ISO 11855"},"tabs_zonder_massa":{"t":"System budynku aktywowany termicznie bez masy termicznej","d":"W lekkim budynku lub nad sufitem podwieszanym aktywacja termiczna konstrukcji nie ma masy efektywnej, a zatem nie ma żadnego efektu. Wybierz inny system emisji lub wyeksponuj masę i zaakceptuj akustyczne konsekwencje takiego działania.","r":"ISO 11855"},"tabs_onderbroken":{"t":"Powolny system o bardzo przerywanym użytkowaniu","d":"Aktywacja rdzenia betonowego reaguje w ciągu kilku godzin. Przy schemacie użytkowania z nagłymi przerwami, ciepło dociera zbyt późno i zatrzymuje się zbyt późno, powodując zarówno przegrzanie, jak i niedogrzanie. Rozważ szybszy system lub zaakceptuj fakt, że betonowy rdzeń dostarcza tylko obciążenie podstawowe.","r":"—"},"condens_plafond":{"t":"Ryzyko kondensacji na suficie chłodzącym","d":"Temperatura zasilania wynosząca {aan} °C jest zbyt bliska oczekiwanemu punktowi rosy wynoszącemu {dauw} °C. Bez osuszania w innym miejscu i bez monitorowania punktu rosy sufit będzie kapał już pierwszego wilgotnego dnia. Podnieś temperaturę zasilania lub zapewnij osuszanie za pomocą centrali wentylacyjnej wraz z czujnikiem na przepływie i jednym w pomieszczeniu.","r":"ISO 11855; EN 14240"},"straling_zonder_ontvochtiging":{"t":"Chłodzenie promiennikowe bez osuszania","d":"Schłodzona powierzchnia pochłania tylko ciepło jawne. Bez osuszania wilgotność wzrasta, aż punkt rosy osiągnie granicę wydajności systemu, dokładnie w najcieplejsze dni. Zajmij się osuszaniem w centrali wentylacyjnej.","r":"—"},"gemengde_regimes":{"t":"Ogrzewanie podłogowe i grzejniki w jednym trybie","d":"Generator musi wtedy dostarczyć najwyższą temperaturę, a wydajność podąża za grzejnikami, a nie za podłogą. Zapewnij obieg mieszający lub — lepiej — wymień grzejniki, aby cały budynek mógł pracować w niskim trybie.","r":"—"},"latent_zonder_ontvochtiging":{"t":"Obciążenie utajone {pct} % bez osuszania","d":"Wilgoć musi gdzieś odprowadzić. Bez osuszania w centrali wentylacyjnej lub w klimakonwektorach wilgotność wzrasta, aż do utraty komfortu i konieczności ograniczenia chłodzenia promiennikowego. Określ miejsce i wydajność osuszania.","r":"EN 16798-1"},"boven_max_temp":{"t":"Wymagana temperatura zasilania przekracza zakres pompy ciepła.","d":"Wymagana jest temperatura {aan} °C, podczas gdy urządzenie dostarcza maksymalnie {max} °C. Sprawdź również, czy to maksimum jest nadal osiągane przy najniższej temperaturze źródła — wiele urządzeń osiąga maksimum tylko przy umiarkowanych temperaturach zewnętrznych, a to zdecydowanie nie jest moment, kiedy jest to potrzebne.","r":"EN 14511"},"hoog_regime":{"t":"Wysoka temperatura zasilania pompy ciepła","d":"Przy {aan} °C współczynnik COP w warunkach projektowych wynosi około {cop}. Każdy stopień niższy daje około 2 do 3% lepszą sprawność. Najpierw sprawdź, czy można obniżyć ten system poprzez celową wymianę odbiorników; to się wielokrotnie zwróci w całym okresie użytkowania.","r":"EN 14511"},"kleine_spreiding":{"t":"Bardzo mała różnica temperatur","d":"Przy różnicy {dt} K natężenie przepływu wody wynosi {debiet} m³/h — co wymaga zastosowania rur o dużej średnicy i generuje koszty energii elektrycznej przez cały rok. Sprawdź, czy dobór rozmiaru rur i pompy jest oparty na tym, a nie na parametrach pracy kotła.","r":"—"},"grote_spreiding":{"t":"Duża różnica temperatur dla pompy ciepła","d":"Przy {dt} K pompa ciepła musi poradzić sobie z niskim powrotem, generując jednocześnie wysoki przepływ. Większość urządzeń jest zaprojektowana dla temperatur od 5 do 8 K; sprawdź, czy deklarowana wydajność nadal obowiązuje przy tej różnicy temperatur.","r":"EN 14511"},"geen_stooklijn":{"t":"Brak kompensacji pogodowej","d":"Bez krzywej grzewczej instalacja pracuje w temperaturze projektowej przez cały sezon, podczas gdy przy temperaturze zewnętrznej 7°C znacznie mniej jest wystarczające. To praktycznie darmowa wydajność, a jej pominięcie pozbawia pompę ciepła dużej części jej zalet.","r":"—"},"regime_niet_vastgelegd":{"t":"System nie jest ustalony umownie","d":"Ustawienie przepływu, powrotu i różnicy temperatur w punktach pomiarowych przy przekazaniu. Bez tego ustalenia system po cichu rośnie podczas prac, a później nikt nie ponosi odpowiedzialności za rozczarowującą wydajność.","r":"—"},"tekort_zonder_bijstook":{"t":"Niedobór mocy bez dodatkowego ogrzewania","d":"W warunkach projektowych pompa ciepła dostarcza około {cap} kW, podczas gdy obciążenie jest wyższe; brakuje {tekort} kW i nie jest zapewnione dodatkowe ogrzewanie. Wybierz większe urządzenie lub zapewnij dodatkowe ogrzewanie — ale najpierw zastanów się, które z tych dwóch rozwiązań jest tańsze w całym okresie użytkowania.","r":"—"},"bivalentpunt_hoger":{"t":"Rzeczywisty punkt biwalentny jest wyższy niż zakładany","d":"Obliczony punkt wypada na {werkelijk} °C w stosunku do zakładanego {gewenst} °C; pompa ciepła pokrywa wówczas około {dekking} % rocznego zapotrzebowania na ciepło. Nieco większa jednostka znacznie przesuwa ten punkt i zmniejsza udział kosztownego ogrzewania dodatkowego.","r":"—"},"lage_dekking":{"t":"Niski udział pokrywany przez pompę ciepła","d":"Około {dekking} % rocznego zapotrzebowania na ciepło pochodzi z pompy ciepła; reszta pochodzi z ogrzewania dodatkowego ({backup}). W przypadku elektrycznego ogrzewania dodatkowego oznacza to znacznie wyższy roczny rachunek niż sugeruje broszura.","r":"—"},"elektrische_bijstook":{"t":"Elektryczne ogrzewanie dodatkowe o mocy około {kw} kW","d":"Każda kilowatogodzina kosztuje jeden, podczas gdy pompa ciepła dostarcza od trzech do pięciu. Zapytaj, ile godzin pracy rocznie jest przewidywanych i porównaj to z taryfą — nieco większa pompa ciepła często okazuje się tańsza w ciągu kilku lat.","r":"—"},"aanuit_zonder_buffer":{"t":"Jednostka włącz/wyłącz bez zbiornika buforowego","d":"Jednostka niemodulująca bez zbiornika buforowego uruchamia się i zatrzymuje w sposób ciągły, co obniża wydajność i żywotność. Zapewnij około {liter} litrów lub wybierz jednostkę modulującą.","r":"—"},"geen_regeneratie":{"t":"Energia gruntowa bez regeneracji","d":"Grunt pobierany tylko raz schładza się z biegiem lat, a wraz z nim spada jego wydajność. Pasywne chłodzenie latem doładowuje grunt i jednocześnie zapewnia niemal darmowe chłodzenie — to najważniejszy powód, dla którego warto wybrać energię gruntową, a często jest on pomijany w wycenie.","r":"—"},"warmtenet_voorwaarden":{"t":"Warunki sieci ciepłowniczej nie zostały ustalone","d":"W przypadku sieci ciepłowniczej maksymalna dopuszczalna temperatura powrotu stanowi sztywne ograniczenie: jest mierzona, często wiążą się z nią kary i determinuje cały projekt emitora. Przed wyborem emitora należy uzyskać warunki podłączenia.","r":"—"},"cop_punten":{"t":"Szacowana sprawność w tym trybie","d":"Przy przepływie w temperaturze {aan} °C: COP {copOntwerp} w warunkach projektowych, {copMild} przy umiarkowanej temperaturze zewnętrznej, szacowana średnia sezonowa {copSeizoen}. Jest to przybliżenie Carnota — uzyskaj certyfikowane wartości w tych punktach i porównaj je.","r":"EN 14511 / EN 14825"},"sww_rendement":{"t":"Ciepła woda użytkowa obniża sprawność sezonową","d":"Przy temperaturze magazynowania {t} °C pompa ciepła pracuje z COP {copSww}, w porównaniu z {copCv} dla ogrzewania. Roczne zapotrzebowanie na ciepło do ciepłej wody użytkowej wynosi około {kwh} kWh, co daje około {elek} kWh energii elektrycznej. Potraktuj to jako oddzielny system: moduł przepływowego podgrzewania wody użytkowej, niższa temperatura magazynowania lub oddzielny stopień wysokotemperaturowy zapewniają tu więcej niż jakakolwiek optymalizacja ogrzewania.","r":"EN 14825"},"verswater_circulatie":{"t":"Moduł przepływowego podgrzewania wody użytkowej z pętlą cyrkulacyjną","d":"Moduł przepływowego podgrzewania wody użytkowej czerpie swoją zaletę z braku stojącej ciepłej wody. Dzięki pętli cyrkulacyjnej część z tego wraca do normy, w tym ciągłe straty. Zbadaj, czy obieg może być przełączany w zależności od czasu lub zapotrzebowania i zaizoluj go solidnie.","r":"—"},"legionella_elektrisch":{"t":"Cykl Legionella w elektrycznym ogrzewaniu dodatkowym","d":"W praktyce okresowe podgrzewanie do 60°C lub wyższej temperatury jest prawie zawsze wykonywane za pomocą grzałki elektrycznej, ponieważ pompa ciepła nie osiąga takiej temperatury. Zapytaj, ile kilowatogodzin kosztuje taki cykl rocznie; często jest to więcej niż oczekiwano i można tego uniknąć, stosując zasadę natychmiastowego ogrzewania.","r":"Krajowe przepisy dotyczące Legionelli"},"boilerspiraal":{"t":"Powierzchnia wymiennika ciepła w podgrzewaczu CWU","d":"Zbyt mała wężownica dla pompy ciepła wymusza wzrost temperatury skraplania i obniża efektywność energetyczną w każdym cyklu ładowania. Zapytaj o powierzchnię wymiennika ciepła w m² i moc przy temperaturze zasilania — a nie kotła.","r":"—"},"circulatieverlies":{"t":"Straty w obiegu cyrkulacyjnym","d":"W przypadku słabo zaizolowanego obiegu cyrkulacyjnego straty mogą przekroczyć zużycie ciepłej wody użytkowej. Zapytaj o szacunkowe koszty i o odpowiednią izolację; przełączaj w zależności od czasu lub zapotrzebowania, jeśli to możliwe.","r":"—"},"voorrang_snel_systeem":{"t":"Priorytet ciepłej wody z systemem szybkiej emisji","d":"W przypadku nagrzewnic powietrza lub klimakonwektorów strata ciepła jest zauważalna w ciągu dziesięciu minut. Określ, jak długo może trwać przerwa i czy dostępna jest minimalna moc.","r":"—"},"buffer_te_klein":{"t":"Objętość bufora mniejsza niż obliczona","d":"Wybrano {gekozen} litrów zamiast około {nodig} litrów wynikających z minimalnego czasu pracy i odszraniania. Zbyt mały bufor powoduje taktowanie urządzenia, co obniża sprawność i trwałość.","r":"—"},"geen_buffer":{"t":"Brak zbiornika buforowego z jednostką, która nie jest w pełni modulowana","d":"Zapytaj producenta o minimalny czas pracy i minimalną objętość wody w instalacji. W przypadku ogrzewania podłogowego pojemność własna systemu często wystarcza; w przypadku grzejników z zaworami termostatycznymi prawie nigdy.","r":"—"},"evenwichtsfles":{"t":"Otwarty rozdzielacz lub rozdzielacz niskostratny","d":"Nieprawidłowo dobrany rozdzielacz niskostratny miesza zasilanie i powrót: pompa ciepła ma zbyt wysoki powrót, moduluje w dół, a sprawność spada — bez żadnych uszkodzeń. Unikaj separacji hydraulicznej, gdzie to możliwe, i zleć jej obliczenie, gdzie to konieczne.","r":"—"},"geen_inregeling":{"t":"Brak równoważenia hydraulicznego dla","d":"Bez równoważenia najbliższy obieg otrzymuje wszystko, a dalszy nic, a ludzie rekompensują to wyższą temperaturą zasilania — dokładnie tego chciałeś uniknąć. Na tym polega różnica między instalacją pracującą w temperaturze 35°C a tą samą instalacją, która musi pracować w temperaturze 45°C.","r":"—"},"vulwater":{"t":"Nieuzdatniona woda napełniająca","d":"Kamień w wymienniku ciepła z małymi kanałami generuje natychmiastowe koszty, a tlen wytwarza magnetyt, który blokuje pompy i zawory. Większość producentów uzależnia swoją gwarancję od jakości wody napełniającej. Poproś o analizę przy odbiorze i ponownie po roku.","r":"VDI 2035"},"vulwater_onbepaald":{"t":"Jakość wody napełniającej nie została jeszcze ustalona","d":"Przed złożeniem zamówienia zgłoś zapotrzebowanie i dołącz je do dokumentacji przekazania wraz z wartościami pomiarowymi. Po zdarzeniu nie ma możliwości wykazania, czym napełniono instalację.","r":"VDI 2035"},"geen_vuilafscheider":{"t":"Brak separacji zanieczyszczeń i powietrza w istniejących rurociągach","d":"Istniejące rurociągi zawierają magnetyt i osad, które przedostają się do nowego wymiennika ciepła podczas pierwszego uruchomienia. Magnetyczny separator zanieczyszczeń i separator powietrza/mikropęcherzyków tuż przed generatorem nie są tutaj luksusem, lecz warunkiem utrzymania gwarancji.","r":"—"},"glycol":{"t":"Glikol w układzie ({pct} %)","d":"Glikol obniża pojemność cieplną i zwiększa lepkość: większy przepływ i znacznie więcej energii pompy przy tej samej wydajności. Należy ograniczyć go do obwodu, do którego może dotrzeć szron, i rozdzielić go hydraulicznie.","r":"—"},"pompenergie":{"t":"Wysoki udział energii pompy","d":"Szacunkowo {kw} kW, około {pct} % mocy grzewczej. Energia pomocnicza wlicza się do rzeczywistej sprawności sezonowej i rzadko jest mierzona. Sprawdź punkt pracy pomp i spadek ciśnienia w systemie.","r":"—"},"expansievat":{"t":"Naczynie wzbiorcze około {liter} litrów","d":"Obliczono dla pojemności systemu {volume} litrów. Sprawdź ciśnienie wstępne w odniesieniu do wysokości statycznej i umieść naczynie po stronie ssawnej pompy.","r":"EN 12828"},"tweepijps_gelijktijdig":{"t":"System dwururowy z jednoczesnym zapotrzebowaniem na ogrzewanie i chłodzenie","d":"Strefy, które mają być ogrzewane i chłodzone jednocześnie, nie mogą tego zrobić za pomocą jednej sezonowej zmiany. Wybierz system czterorurowy, sieć ze źródłem zewnętrznym i zdecentralizowanymi pompami ciepła lub system VRF z odzyskiem ciepła — w przeciwnym razie cały okres przejściowy będzie przynosił skargi.","r":"—"},"vrije_koeling_gemist":{"t":"Brak wykorzystania darmowego chłodzenia przy wysokim reżimie chłodzenia","d":"Przy przepływie na poziomie {t} °C, darmowe chłodzenie jest możliwe przez większą część roku w naszym klimacie, wykorzystując wyłącznie energię pompy. To najsilniejszy argument za ustawieniem wysokiego reżimu chłodzenia; wykorzystaj go.","r":"—"},"geen_terugwinning":{"t":"Jednoczesne zapotrzebowanie na ogrzewanie i chłodzenie bez odzysku ciepła","d":"Ciepło z chłodzenia można wykorzystać przez cały rok do podgrzewania wody użytkowej lub ogrzewania innych pomieszczeń. System z odzyskiem ciepła prawie zawsze się tutaj zwraca.","r":"—"},"koeltoren_legionella":{"t":"Mokra wieża chłodnicza — wymagany plan kontroli","d":"Mokra wieża chłodnicza jest korzystna energetycznie i wymaga planu kontroli Legionelli, a także zwrócenia uwagi na jej położenie względem wlotów powietrza tego budynku i sąsiednich budynków.","r":"Krajowe przepisy dotyczące Legionelli"},"koudwater_te_koud":{"t":"Niska temperatura wody lodowej z chłodzeniem promiennikowym","d":"Przy przepływie na poziomie {t} °C chłodzenie promiennikowe lub betonowy rdzeń nie mogą być bezpiecznie eksploatowane z powodu kondensacji, a także traci się możliwość chłodzenia swobodnego. Należy rozdzielić obiegi: woda o niskiej temperaturze do osuszania, woda o wysokiej temperaturze do powierzchni promiennikowych.","r":"—"},"aansluiting_te_klein":{"t":"Niewystarczająca moc zasilania elektrycznego","d":"Szacowane zapotrzebowanie koincydyjne {nodig} kW w stosunku do {beschikbaar} kW dostępnych. Modernizacja trwa miesiące i czasami kosztuje więcej niż sama instalacja. Sprawdź to przed złożeniem zamówienia i sprawdź, czy szczytowe zapotrzebowanie na energię można rozłożyć na cały system sterowania.","r":"—"},"aansluiting_onbekend":{"t":"Nie podano mocy zasilania elektrycznego","d":"To najczęstsza niespodzianka w projekcie pompy ciepła. Sprawdź dostępne parametry zasilania i dodaj pompę ciepła, ogrzewanie dodatkowe, produkcję ciepłej wody użytkowej i wszelką infrastrukturę ładowania dla najzimniejszej godziny w roku.","r":"—"},"propaan_binnen":{"t":"Propan (R290) w przypadku instalacji wewnętrznej","d":"R290 jest wysoce łatwopalny i cięższy od powietrza: osadza się w niżej położonych przestrzeniach. Zapytaj o ilość czynnika chłodniczego, minimalną powierzchnię pomieszczenia, wymagania dotyczące wentylacji oraz odległość od piwnic, szybów i otworów — i zrób to przed ustaleniem lokalizacji.","r":"EN 378; IEC 60335-2-40"},"geluidseis_onbekend":{"t":"Brak określonego limitu hałasu","d":"Hałas generowany przez jednostki zewnętrzne jest najczęstszą skargą dotyczącą pomp ciepła i najczęstszym powodem egzekwowania przepisów. Sprawdź obowiązującą wartość graniczną w miejscu oceny i zwróć uwagę na wartość nocną — to właśnie w nocy jednostka pracuje.","r":"Regionalne warunki środowiskowe"},"geluid_dichtbij":{"t":"Jednostka zewnętrzna blisko punktu oceny bez żadnych środków","d":"Przy {d} m z limitem {db} dB(A) niemal na pewno konieczne będzie zastosowanie jakichś środków. Należy pamiętać, że tryb nocny obniża zarówno hałas, jak i moc wyjściową, zwłaszcza gdy na zewnątrz jest najzimniej — należy ocenić, czy budynek jest w stanie to wytrzymać.","r":"—"},"condens_buitendeel":{"t":"Brak odpływu kondensatu z jednostki zewnętrznej","d":"Pompa ciepła powietrze-woda produkuje dziesiątki litrów kondensatu dziennie w warunkach mrozu. Bez ogrzewanego odpływu lub żwirowego podłoża, które zamarza pod urządzeniem i na ścieżce obok niego — co w rezultacie stwarza ryzyko poślizgnięcia się i blokuje wentylator.","r":"—"},"geen_octaafband":{"t":"Brak danych dotyczących pasma oktawowego","d":"Pojedyncza wartość dB(A) nie wystarczy do obliczeń akustycznych, a już na pewno nie dla częstotliwości niskiej, która przenika przez fasady i powoduje najwięcej uciążliwości.","r":"—"},"geen_vorstbeveiliging":{"t":"Brak zabezpieczenia przeciwzamarzaniowego w przypadku awarii","d":"Co się stanie, jeśli wystąpi awaria w okresie przymrozków i kogo o tym powiadomimy? W budynku z dużą ilością wody w podłodze nie jest to pytanie teoretyczne.","r":"—"},"geen_rendementsmeting":{"t":"Brak liczników ciepła i energii elektrycznej w generatorze","d":"Bez obu liczników nie można ustalić rzeczywistej sprawności sezonowej, a argument o niezadowalającej wydajności jest nierozstrzygalny. Właśnie dlatego tak często brakuje tych liczników — należy je uwzględnić w specyfikacji.","r":"—"},"hulpenergie_ongemeten":{"t":"Energia pomocnicza nie jest mierzona oddzielnie","d":"Pompy, odszranianie, elektronika i obieg — wszystkie te czynniki sumują się i często wyjaśniają różnicę między deklarowaną a zmierzoną sprawnością. Oddzielny licznik kosztuje niewiele i stawia dyskusję na merytorycznym poziomie.","r":"—"},"geen_inregelrapport":{"t":"Brak żądania raportu bilansującego","d":"Zmierzone i zarejestrowane przepływy w każdym obiegu. Bez tego raportu nie ma możliwości wykazania, że ​​instalacja może pracować w zaprojektowanym trybie, i nikt nie ma powodu, aby to sprawdzać.","r":"—"},"geen_nulmeting":{"t":"Brak pomiaru wydajności przy odbiorze","d":"Przepływ, powrót, natężenie przepływu, pobór mocy i moc cieplna w określonych warunkach pracy. Bez pomiaru bazowego nie ma możliwości późniejszego ustalenia, czy cokolwiek się zmieniło.","r":"—"},"geen_nameting":{"t":"Brak ponownego pomiaru po pierwszym sezonie grzewczym","d":"Rzeczywista wydajność jest widoczna tylko w całym sezonie. Ponowna wizyta w celu dostosowania krzywej grzewczej i ustawień zazwyczaj przynosi od dziesięciu do dwudziestu procent oszczędności — więcej niż w przypadku większości wybranych komponentów.","r":"—"},"scop_zonder_garantie":{"t":"Wymagania dotyczące wydajności bez gwarancji wydajności","d":"Wymagana sezonowa sprawność bez uzgodnionych granic pomiarowych, metody pomiaru i konsekwencji jej niedotrzymania jest życzeniem, a nie wymogiem. Określ, co się stanie, jeśli nie zostanie osiągnięta.","r":"—"},"doorlooptijd_boringen":{"t":"Czas realizacji pozwoleń i odwiertów","d":"Energia gruntowa wymaga uzyskania pozwolenia, czasami testu reakcji i zawsze uzgodnienia harmonogramu z wykonawcą wierceń. Ten czas realizacji częściej decyduje o programie niż czas dostawy sprzętu. Rozpocznij proces przed złożeniem zamówienia.","r":"Przepisy dotyczące energii gruntowej"},"geen_selectierapport":{"t":"Nie wymaga się raportu z wyboru wraz z ofertą","d":"Zapytaj o wydajność przy temperaturze przepływu, natężeniu przepływu i temperaturze źródła. Ten jeden dokument umożliwia porównywanie ofert różnych producentów po raz pierwszy — bez niego porównywane są tylko broszury.","r":"—"},"profiel_note":{"t":"Uwaga dotycząca tego typu budynku","d":"{note}","r":"{basis}"},"wand_niet_gedimensioneerd":{"t":"Ogrzewanie ścienne nie jest tutaj wymiarowane","d":"Wybrano ogrzewanie ścienne, ale ten arkusz wymiaruje tylko ogrzewanie podłogowe. Norma EN 1264-5 używa własnych współczynników dla ścian i nie są one tutaj uwzględniane, dlatego moc i temperaturę wody należy określić osobno. Utrzymuj temperaturę powierzchni poniżej około {max} °C i obserwuj, gdzie znajdują się szafki i media.","r":"EN 1264-5"}},"mot":{"last":{"m":"Obciążenie obliczeniowe","w":"Punkt początkowy dla każdej wartości mocy i dla linii budynku, na której określany jest punkt biwalentny.","d":"Ogrzewanie {kw} kW ({spec} W/m²), chłodzenie {kwK} kW; od {tOut} °C na zewnątrz do {tIn} °C wewnątrz. Współczynnik strat ciepła {ua} kW/K.","n":"EN 12831"},"regime":{"m":"Reżim temperaturowy","w":"Wspólny mianownik: łączy odbiorniki i generatory oraz określa sprawność.","d":"{aan}/{ret} °C, różnica temperatur {dt} K, natężenie przepływu wody {debiet} m³/h.","n":"—"},"opwekker_wp":{"m":"Pompa ciepła","w":"Konfiguracja: {type}, wybrana w trybie określonym powyżej.","d":"Nominalne {kw7} kW przy A7/W35, nadal {capOntwerp} kW w warunkach projektowych. COP {copOntwerp} w warunkach projektowych, szacowany sezonowo {copSeizoen}. Punkt biwalentny {biv} °C, pokrywający około {dekking} % rocznego zapotrzebowania na ciepło.","n":"EN 14511 / EN 14825"},"opwekker_overig":{"m":"Generacja","w":"Konfiguracja: {type}.","d":"Projektowana moc {kw} kW.","n":"—"},"bijstook":{"m":"Ogrzewanie uzupełniające","w":"Pokrywa niedobór poniżej punktu biwalentnego; strategia: {strategie}.","d":"Wymagane {kw} kW, konfiguracja: {type}.","n":"—"},"afgifte_rad":{"m":"Odbiorniki — {type}","w":"W wybranym parametrach pracy zapewnia {pct} % mocy znamionowej zgodnie z normą EN 442.","d":"Pokrycie obciążenia wymaga około {nodig} kW mocy znamionowej.","n":"EN 442"},"afgifte_vloer":{"m":"Ogrzewanie podłogowe","w":"Moc podstawowa odbiornika w niskiej temperaturze; ograniczona dopuszczalną temperaturą powierzchni.","d":"Wymagana moc {nodig} W/m² z maksymalnej wartości {max} W/m²; temperatura powierzchni {opp} °C, wymagana temperatura wody około {tmed} °C przy pokryciu podłogowym o współczynniku R = {r} m²K/W.","n":"EN 1264"},"afgifte_tabs":{"m":"Termicznie aktywowany system budynku","w":"Przenosi obciążenie podstawowe, wykorzystując masę budynku; powolny i samoregulujący.","d":"{warm} W/m² wymaganego ogrzewania z maks. {maxWarm} i {koud} W/m² chłodzenia z maks. {maxKoud}.","n":"ISO 11855"},"sww":{"m":"Ciepła woda użytkowa","w":"Oddzielny system z własnym, mniej korzystnym poziomem temperatury; konfiguracja: {systeem}.","d":"{liter} l/dzień przy {t} °C, {kwh} kWh/dzień i około {jaar} kWh/rok. COP {cop}, czyli około {elek} kWh energii elektrycznej rocznie.","n":"—"},"buffer":{"m":"Zbiornik buforowy","w":"Zapewnia minimalny czas pracy generatora i zapewnia objętość do odszraniania.","d":"Zalecane {liter} litrów przy minimalnym czasie pracy {looptijd} min; do samego odszraniania wystarczy {ontdooi} litrów. Konfiguracja: {mode}.","n":"—"},"expansie":{"m":"Naczynie wzbiorcze","w":"Absorbuje rozszerzalność cieplną wody i utrzymuje ciśnienie w zakresie roboczym.","d":"Około {liter} litrów dla pojemności systemu {volume} litrów.","n":"EN 12828"},"energie":{"m":"Saldo roczne (orientacyjne)","w":"Rząd wielkości do porównywania opcji, a nie do rozliczeń.","d":"Zapotrzebowanie na ciepło {warmte} kWh/rok; energia elektryczna do ogrzewania {elek} kWh, do ciepłej wody użytkowej {swwElek} kWh, razem około {totaal} kWh.","n":"Metoda stopniodni"}},"sec":{"project":{"title":"Projekt i budynek","intro":"Jaki to rodzaj budynku, jak dobra jest obudowa i kto jej używa? Jakość obudowy decyduje o obciążeniu, a obciążenie decyduje o tym, czy w ogóle możliwe jest zastosowanie systemu niskotemperaturowego."},"belasting":{"title":"Obciążenia","intro":"Projektowana moc grzewcza, a nie moc istniejącego kotła. Kocioł jest prawie zawsze znacznie przewymiarowany; każdy, kto po prostu kopiuje tę wartość, kupuje pompę ciepła o dwa rozmiary za dużą, która następnie źle moduluje."},"afgifte":{"title":"Systemy emisji ciepła","intro":"To, co wisi w pomieszczeniu, decyduje o temperaturze, jaką musi dostarczyć generator — a nie odwrotnie. Dlatego ten blok pojawia się przed wyborem pompy ciepła. Obliczenia pokazują, ile faktycznie zapewnia istniejący grzejnik w niskim zakresie temperatur."},"regime":{"title":"Zakres temperatur","intro":"Nić biegnąca przez cały projekt. Każdy stopień niższy po stronie przepływu daje około 2 do 3 procent lepszą wydajność pompy ciepła — i obniża powierzchnię odbiornika. Tutaj wyraźnie określasz ten kompromis, zamiast pozwolić, aby to się stało samemu."},"opwekking":{"title":"Generowanie ciepła","intro":"Dopiero teraz kolej na generator, ponieważ dopiero teraz jest ustalone, jaką temperaturę ma dostarczyć. Zawsze pytaj o dane dotyczące wydajności dla własnego zakresu temperatur, a nie dla standardowych warunków znamionowych z broszury."},"koude":{"title":"Generowanie chłodu","intro":"Chłodzenie rzadko jest systemem autonomicznym. Pytanie brzmi nie tylko, skąd pochodzi chłód, ale także dokąd trafia ciepło — i czy jest ono przydatne gdzie indziej w budynku."},"bivalentie":{"title":"Biwalencja, rezerwa i bezpieczeństwo zasilania","intro":"Pompa ciepła, która samodzielnie pokrywa obciążenie projektowe, jest zbyt duża przez resztę roku. Zbyt mała pompa pozostawia budynek zimnym. Punkt biwalentny to punkt, w którym świadomie dokonuje się tego kompromisu."},"sww":{"title":"Ciepła woda użytkowa","intro":"Element, który najczęściej obniża cały projekt niskotemperaturowy. Ogrzewanie wymaga 35°C, ciepła woda użytkowa 55–60°C — ta sama pompa ciepła zapewnia tam prawie połowę sprawności. Traktuj to jako oddzielny system."},"hydraulica":{"title":"Hydraulika, bufor i strona wodna","intro":"To właśnie tutaj większość instalacji pomp ciepła zawodzi. Źle umieszczony rozdzielacz hydrauliczny lub zbiornik buforowy w niewłaściwym położeniu niszczy różnicę temperatur, a wraz z nią sprawność, bez uszkodzenia instalacji."},"distributie":{"title":"Dystrybucja i podział na strefy","intro":"Sposób, w jaki energia trafia z generatora do pomieszczenia oraz gdzie leżą granice odpowiedzialności i opomiarowania. W instalacjach komunalnych jest to kwestia zarówno prawna, jak i techniczna."},"regeling":{"title":"Sterowanie i nadzór","intro":"W przypadku kotła system sterowania koryguje błędy projektowe; w przypadku pompy ciepła – je powiększa. Powoli emituj, utrzymuj niską temperaturę i myśl przyszłościowo – to jest sedno sprawy."},"energie":{"title":"Energia, opomiarowanie i taryfy","intro":"Rzeczywisty koszt instalacji zależy zarówno od taryf i zróżnicowania, jak i od efektywności. Ten blok uwidacznia koszty eksploatacji obok kosztów inwestycyjnych."},"opstelling":{"title":"Lokalizacja, hałas i bezpieczeństwo","intro":"Miejsce, w którym znajdują się jednostki, decyduje o tym, czy mogą tam stać. Hałas generowany przez jednostki zewnętrzne jest najczęstszą skargą dotyczącą pomp ciepła i najczęstszym powodem działań egzekucyjnych."},"normen":{"title":"Normy, pozwolenia i dotacje","intro":"Co jest wymagane prawnie, a co jest możliwe finansowo. Oba te elementy mają terminy realizacji, które regulują program — częściej niż czas dostawy sprzętu."},"uitvoering":{"title":"Instalacja, przekazanie i zarządzanie","intro":"Instalacja pompy ciepła, która nie została zbilansowana, nigdy nie osiąga swojej sprawności — i nikt tego nie zauważa, ponieważ się nagrzewa. Ten blok określa, jak to zauważysz."}},"q":{"prj_name":{"label":"Nazwa projektu"},"prj_client":{"label":"Klient","help":"Kto decyduje o koszcie inwestycyjnym w porównaniu z kosztami eksploatacyjnymi? W przypadku inwestora, który wynajmuje budynek, te dwie kwestie są rozpatrywane przez różne strony — a to zmienia cały kompromis."},"prj_location":{"label":"Lokalizacja","help":"Określa projektową temperaturę zewnętrzną, liczbę stopniodni i dostępność ogrzewania sieciowego lub energii gruntowej."},"prj_ref":{"label":"Odniesienie"},"prj_author":{"label":"Przygotowane przez"},"prj_date":{"label":"Data"},"geb_type":{"label":"Typ budynku","help":"Określa domyślne wartości obciążenia, parametrów pracy i zróżnicowania, a także pytanie, czy chłodzenie jest w ogóle potrzebne."},"prj_aard":{"label":"Charakter projektu","help":"W przypadku wymiany samego generatora, system emisji i tryb pracy są już naprawione. Właśnie w takiej sytuacji pompa ciepła na istniejących grzejnikach zawodzi — ta karta rozwiązuje ten problem.","options":{"nieuwbouw":"Nowy budynek","renovatie":"Remont z poprawą obudowy","vervanging":"Wymiana generatora, istniejące odbiorniki","uitbreiding":"Rozbudowa"}},"geb_area":{"label":"Ogrzewana powierzchnia podłogi"},"geb_volume":{"label":"Ogrzewana objętość","help":"Czas nagrzewania i systemy po stronie powietrza."},"geb_bouwjaar":{"label":"Rok budowy","help":"Przybliżona ocena jakości obudowy, dla której nie ma dostępnych obliczeń."},"geb_schil":{"label":"Jakość obudowy budynku","help":"Najważniejsze pytanie w tym bloku. Słabo izolowana obudowa wymaga wysokiej temperatury przepływu, a właśnie w tym zakresie pompa ciepła zapewnia najmniej. Izolacja przed wymianą generatora jest prawie zawsze tańszym rozwiązaniem.","options":{"passief":"Pasywna / bardzo dobrze izolowana","goed":"Dobra — niedawno wybudowany budynek","gemiddeld":"Średnia — izolacja po modernizacji","matig":"Umiarkowana — ograniczona izolacja","slecht":"Słaba — brak izolacji"}},"geb_luchtdicht":{"label":"Szczelność (n50 lub v50)","help":"W przypadku nieszczelnej obudowy obciążenie infiltracyjne stanowi znaczną część wydajności projektowej, a obciążenie to jest również zależne od wiatru — więc nie można go kontrolować."},"geb_massa":{"label":"Masa termiczna","help":"Określa, czy powolna kontrola działa. System budynku aktywowany termicznie wymaga masy; w lekkim budynku z sufitem podwieszanym nie ma ona żadnego wpływu i jest wyrzucaniem pieniędzy w błoto.","options":{"zwaar":"Ciężki — betonowy, odsłonięty","gemiddeld":"Średni","licht":"Lekki — szkielet drewniany, sufit podwieszany"}},"geb_gebruik":{"label":"Sposób użytkowania","help":"W przypadku silnie przerywanego użytkowania, powolny system, taki jak ogrzewanie podłogowe lub aktywacja termiczna konstrukcji, nie jest odpowiedni: nie może się nagrzać w odpowiednim czasie i nie może się zatrzymać w odpowiednim czasie.","options":{"continu":"Ciągły, 24/7","kantooruren":"Godziny pracy biura","onderbroken":"Silnie przerywany","seizoen":"Sezonowy"}},"geb_zones":{"label":"Liczba stref termicznych","help":"Strefy o różnym zajętości, orientacji lub wymaganiach. Każda strefa, która ma jednocześnie ogrzewać i chłodzić, skłania do wyboru systemu czterorurowego lub pompy ciepła z odzyskiem ciepła."},"geb_gelijktijdig":{"label":"Czy strefy mogą jednocześnie ogrzewać i chłodzić?","help":"Słońce po stronie południowej i cień po stronie północnej lub serwerownia obok biura. Jeśli tak, system dwururowy z sezonowym przełączaniem nie będzie odpowiedni, niezależnie od tego, jak atrakcyjnie wygląda cenowo.","options":{"ja":"Tak","nee":"Nie"}},"bel_basis":{"label":"Na czym opiera się wydajność?","help":"Obliczenia dla poszczególnych pomieszczeń zgodnie z normą EN 12831 to jedyna podstawa, na której można sprawdzić odbiorniki dla poszczególnych pomieszczeń. Do wstępnego oszacowania służy ogólna zasada; trzyletnie dane dotyczące zużycia są często bardziej wiarygodne niż obliczenia oparte na błędnych założeniach.","options":{"berekening":"Obliczenie strat ciepła dla poszczególnych pomieszczeń","opgegeven":"Deklarowana całkowita moc","specifiek":"Wartość na m² (orientacyjna) oparta na zasadzie praktycznej","verbruik":"Obliczona na podstawie rzeczywistego zużycia"}},"bel_spec_heat":{"label":"Specyficzna moc grzewcza","help":"Budownictwo pasywne 10–20, niedawno wybudowany nowy budynek 30–40, modernizowana izolacja 45–70, nieocieplony 90–140 W/m². Użyj tego tylko do wstępnego oszacowania."},"bel_heat_kw":{"label":"Moc grzewcza","help":"Bez dodatku na nagrzewanie; wprowadzasz go osobno poniżej, aby był widoczny, skąd pochodzi."},"bel_opwarm":{"label":"Dodatek na nagrzewanie po okresie wyłączenia","help":"Zero w przypadku pracy ciągłej. Przy dziennym nocnym obniżeniu mocy w ciężkim budynku, dopuszczalny poziom może sięgać 20–30% — a ten poziom określa całkowitą moc generatora. Rozważ dłuższe podgrzewanie wstępne zamiast instalowania większej mocy."},"bel_cooling":{"label":"Czy jest chłodzenie?","options":{"ja":"Tak","nee":"Nie"}},"bel_spec_cool":{"label":"Specyficzna moc chłodzenia","help":"Biuro z normalnym przeszkleniem 40–60 W/m², z dużą ilością przeszkleń lub wysokim obciążeniem wewnętrznym 70–100. Zewnętrzne osłony przeciwsłoneczne zmniejszają to bardziej niż jakakolwiek instalacja."},"bel_cool_kw":{"label":"Moc chłodzenia"},"bel_latent":{"label":"Ukryty udział obciążenia chłodzenia","help":"Decydujące znaczenie dla wyboru systemu. Chłodzenie promiennikowe i aktywacja termiczna konstrukcji pochłaniają tylko ciepło jawne; wilgoć musi zostać usunięta gdzie indziej — zazwyczaj przez centralę wentylacyjną. Zapomnij o tym, a na suficie pojawi się kondensacja."},"bel_intern":{"label":"Wewnętrzne zyski ciepła","help":"Ludzie, oświetlenie, sprzęt. W nowoczesnym biurze jest to często dominujące obciążenie chłodnicze, które znacznie zmniejsza zapotrzebowanie na ciepło w ciągu dnia."},"bel_proces":{"label":"Obciążenia procesowe lub specjalne","help":"Serwerownia, kuchnia, linia produkcyjna, basen. Są to często obciążenia wymagające chłodzenia przez cały rok — i dlatego stanowią bezpłatne źródło ciepła dla reszty budynku."},"bel_gelijktijdigheid":{"label":"Współczynnik różnorodności","help":"W przypadku wielu budynków mieszkalnych podłączonych do jednego generatora można liczyć na mniej niż sumę szczytów. W przypadku pojedynczego budynku tworzącego jedną strefę może tak nie być: tam szczyt występuje wszędzie jednocześnie."},"cnd_t_design":{"label":"Projektowa temperatura zewnętrzna","help":"W Belgii zazwyczaj wynosi od −8 do −11°C w zależności od strefy i masy budynku. Wraz z obciążeniem określa to linię zabudowy, na której znajduje się punkt biwalentny."},"cnd_t_room":{"label":"Temperatura w pomieszczeniu, ogrzewanie"},"cnd_t_room_cool":{"label":"Temperatura w pomieszczeniu, chłodzenie"},"cnd_dewpoint_room":{"label":"Najwyższa temperatura punktu rosy przewidywana w pomieszczeniu","help":"Dolna granica dla każdej chłodzonej powierzchni. Przy 25°C i 55% wilgotności względnej punkt rosy wynosi około 15°C — sufit chłodzący o temperaturze zasilania 16°C jest niebezpiecznie blisko tej wartości. Bez osuszania nie można bezpiecznie kontrolować chłodzenia promiennikowego."},"cnd_degree_days":{"label":"Stopniodni","help":"Dla Belgii generalnie około 2000 K·d, przy podstawie 15/15. Tylko w celu orientacyjnego oszacowania rocznego."},"afg_types":{"label":"Jakie systemy emisji są proponowane lub już istnieją?","help":"Typowe są kombinacje: ogrzewanie podłogowe dla obciążenia podstawowego i klimakonwektory dla obciążenia szczytowego i chłodzenia. Wprowadź wszystkie dane, ponieważ najmniejszy wspólny mianownik określa reżim dla całego obiegu — chyba że pracujesz z oddzielnymi grupami i obiegami mieszającymi.","options":{"vloer":"Ogrzewanie podłogowe","wand":"Ogrzewanie ścienne","tabs":"Termicznie aktywowany system budynku (aktywacja termiczna konstrukcji)","radiator":"Grzejniki","convector":"Konwektory","vloerconvector":"Konwektory kanałowe (podłogowe)","ventilo":"Klimakonwektory","koelplafond":"Sufit chłodzący / sufit klimatyzacyjny","balk":"Agregaty indukcyjne / belki chłodzące","paneel":"Panele promiennikowe","luchtverwarmer":"Ogrzewanie ciepłym powietrzem za pośrednictwem centrali wentylacyjnej","vrf":"Jednostki wewnętrzne VRF (bezpośrednie odparowanie)"}},"afg_bestaand":{"label":"Czy istniejące odbiorniki są ponownie wykorzystywane?","help":"Jeśli tak, należy zarejestrować zainstalowaną moc nominalną dla każdego pomieszczenia. Bez tego przeglądu nie ma możliwości ustalenia, czy wybrany tryb pracy jest osiągalny, a wszelkie obietnice dotyczące pompy ciepła to hazard.","options":{"nee":"Nie, całkowicie nowe","deels":"Częściowo","ja":"Tak, całkowicie"}},"afg_vloer_share":{"label":"Udział w obciążeniu ogrzewania podłogowego lub ściennego"},"afg_vloer_coverage":{"label":"Dostępna powierzchnia do układania rur","help":"Pod szafkami wnękowymi, meblami kuchennymi ani urządzeniami AGD nie układa się rur. Przy 60% dostępnej powierzchni to samo ciepło musi przepłynąć przez mniejszą liczbę metrów kwadratowych, więc temperatura wody wzrasta — często na tyle, by zniwelować przewagę pompy ciepła."},"afg_vloer_r":{"label":"Opór cieplny wykładziny podłogowej","help":"Płytki około 0,02, laminat z podkładem 0,10–0,15, wykładzina dywanowa do 0,20 m²K/W. To najcichszy z możliwych zabójca projektów: to samo ogrzewanie podłogowe wymaga temperatury wody o dziesięć stopni wyższej pod wykładziną niż pod płytkami. Należy ustalić maksymalny dopuszczalny opór w specyfikacji i przekazać go klientowi."},"afg_vloer_spacing":{"label":"Rozstaw rur","help":"Mniejszy rozstaw rur obniża wymaganą temperaturę wody. 100 mm zamiast 150 mm jest warte kilka stopni i jest tanie w nowym budownictwie; po tym fakcie nie będzie można go już zmienić."},"afg_tabs_share":{"label":"Udział w obciążeniu przenoszonym przez system budynku aktywowany termicznie","help":"Aktywacja rdzenia betonowego zapewnia około 30–40 W/m² ogrzewania i 40–50 W/m² chłodzenia, a reakcja następuje w ciągu godzin, a nie minut. Pokrywa obciążenie podstawowe; obciążenie szczytowe i regulacja poszczególnych pomieszczeń muszą pochodzić z szybszego systemu."},"afg_koelplafond_share":{"label":"Udział w obciążeniu chłodzenia przenoszonym przez sufit chłodzący"},"afg_regelbaar":{"label":"Regulacja poszczególnych pomieszczeń","help":"W przypadku ogrzewania podłogowego i aktywacji rdzenia betonowego, regulacja poszczególnych pomieszczeń działa zawsze powoli; nadmierna regulacja prowadzi do przeregulowania i cykliczności. W przypadku pompy ciepła utrzymanie przepływu przez system na niskim poziomie, z kompensacją pogodową, jest zazwyczaj lepsze niż włączanie i wyłączanie poszczególnych pomieszczeń.","options":{"thermostaat":"Termostat pokojowy na strefę","kraan":"Termostatyczne zawory grzejnikowe","centraal":"Tylko centralne, z kompensacją pogodową","geen":"Brak indywidualnego sterowania"}},"afg_meting":{"label":"Czy istniejące grzejniki zostały zbadane pomieszczenie po pomieszczeniu?","help":"Typ, wymiary i nominalna moc każdego elementu. To praca, której nikt nie chce wykonywać, a która decyduje o tym, czy instalacja działa, czy nie.","options":{"ja":"Tak","nee":"Nie"}},"reg_t_flow":{"label":"Temperatura zasilania ogrzewania w warunkach projektowych","help":"Ogrzewanie podłogowe 30–38°C, aktywacja termiczna konstrukcji 26–32°C, nowe grzejniki 45–55°C, istniejące grzejniki często 70–80°C. Ta wartość decyduje o tym, które generatory pozostają w użyciu."},"reg_t_return":{"label":"Temperatura powrotu ogrzewania","help":"Różnica temperatur określa natężenie przepływu wody, a wraz z nim średnice rur i energię pompy. Pompa ciepła zazwyczaj pracuje z różnicą 5 K, kocioł z 20 K — co stanowi czterokrotność natężenia przepływu i znacząco wpływa na dobór wielkości rur."},"reg_weersafhankelijk":{"label":"Kompensacja pogodowa temperatury zasilania?","help":"Praktycznie darmowa sprawność: przy temperaturze zewnętrznej 7°C wystarczy temperatura zasilania znacznie poniżej wymaganej przy −8°C. Bez krzywej grzewczej instalacja pracuje z wartością projektową przez cały sezon, a pompa ciepła traci znaczną część swoich zalet.","options":{"ja":"Tak","nee":"Nie"}},"reg_t_flow_cool":{"label":"Temperatura zasilania chłodzenia","help":"Klimakonwektory z osuszaniem 6–8°C, chłodzeniem promiennikowym i aktywacją rdzenia betonowego 16–18°C. Wysoka temperatura wody lodowej umożliwia swobodne chłodzenie i wydajny agregat chłodniczy, ale wyklucza osuszanie — to wybór systemu, a nie ustawienie."},"reg_t_return_cool":{"label":"Temperatura powrotu chłodzenia"},"reg_glycol_pct":{"label":"Stężenie glikolu","help":"Glikol obniża pojemność cieplną i podnosi lepkość: przy 30% przepływ jest o około 10% większy, a energia pompy znacznie większa przy tej samej wydajności. Stosować go tylko tam, gdzie występuje szron, i hydraulicznie oddzielić ten obieg."},"reg_menggroepen":{"label":"Obiegi mieszające dla różnych trybów pracy?","help":"Potrzebne, gdy ogrzewanie podłogowe i grzejniki znajdują się na tym samym generatorze. Należy pamiętać, że generator musi wtedy dostarczać najwyższą temperaturę, a obieg mieszający lokalnie ją obniża — więc wydajność podąża za grzejnikami, a nie za podłogą. Należy rozważyć, czy grzejniki nie mogłyby zostać wymienione.","options":{"ja":"Tak","nee":"Nie"}},"reg_dt_marge":{"label":"Czy ustalić warunki umowne z punktami pomiarowymi?","help":"Przepływ, powrót i różnica temperatur w warunkach projektowych, do pomiaru przy odbiorze. Bez tego porozumienia warunki te będą stopniowo rosły w trakcie prac, a później nikt nie będzie odpowiedzialny za rozczarowującą wydajność.","options":{"ja":"Tak","nee":"Nie"}},"opw_type":{"label":"Rodzaj generatora","help":"Systemy sprzężone z gruntem zapewniają stabilne źródło zasilania przez cały rok, a tym samym znacznie bardziej płaską wydajność, ale wymagają pozwolenia, miejsca i znacznie wyższych nakładów inwestycyjnych. Systemy powietrzno-wodne są prostsze i najsłabsze w okresach mrozu — dokładnie wtedy, gdy budynek najbardziej tego potrzebuje.","options":{"lucht_water":"Pompa ciepła powietrze-woda","grond_boring":"Gruntowa pompa ciepła (solanka-woda) — odwierty pionowe","grond_horizontaal":"Gruntowa pompa ciepła (solanka-woda) — kolektor poziomy","water_water":"Pompa ciepła woda-woda — woda gruntowa lub powierzchniowa","afvoerlucht":"Pompa ciepła powietrze-powietrze","lucht_lucht":"Pompa ciepła powietrze-powietrze","hybride":"Hybrydowa — pompa ciepła z kotłem","gasketel":"Kocioł gazowy, kondensacyjny","elektrisch":"Bezpośrednie elektryczne ogrzewanie oporowe","warmtenet":"Ciepłownictwo miejskie","wkk":"Skojarzone wytwarzanie ciepła i energii elektrycznej","biomassa":"Kocioł na biomasę","zon_thermisch":"Kolektory słoneczne (uzupełniające)"}},"opw_hp_kw":{"label":"Moc pompy ciepła przy A7/W35","help":"Producenci podają moc wyjściową w korzystnych warunkach. Poproś o pełną tabelę: moc wyjściową i COP dla A−7/W45, A2/W35, A7/W35 i przy własnej temperaturze zasilania. Różnica między tymi punktami jest większa niż sugeruje większość ofert."},"opw_source_t":{"label":"Temperatura źródła w warunkach projektowych","help":"Dla powietrza jest to projektowana temperatura zewnętrzna. Dla gruntu zazwyczaj 0–5°C, dla wód gruntowych 10–12°C. Pozostaw puste pole, aby uzyskać wartość na podstawie typu źródła."},"opw_modulatie":{"label":"Sterowanie mocą","help":"Zapytaj o minimalną moc modulacyjną, a nie tylko o maksymalną. Pompa ciepła, która nie może spaść poniżej 40% swojej mocy wyjściowej, będzie pracować cyklicznie wiosną i jesienią — to obniża wydajność i żywotność, a zbiornik buforowy może jedynie ją zmiękczyć, a nie rozwiązać ten problem.","options":{"inverter":"W pełni modulowany (inwerter)","stappen":"Wielostopniowy","aan_uit":"Wł./wył."}},"opw_koudemiddel":{"label":"Czynnik chłodniczy","help":"Rozporządzenie w sprawie gazów fluorowanych wypiera z rynku czynniki chłodnicze o wysokim GWP; R290 stał się zatem de facto standardem dla mniejszych pomp ciepła. Propan jest wysoce łatwopalny: nakłada to wymogi dotyczące lokalizacji, odległości od otworów oraz piwnic lub wykopów, w których mógłby się znaleźć wyciek.","options":{"R290":"Propan R290 (A3)","R32":"R32 (A2L)","R454C":"R-454C (A2L)","R1234ze":"R-1234ze (A2L)","R744":"R-744 CO₂","R410A":"R-410A (A1)"}},"opw_max_temp":{"label":"Maksymalna temperatura zasilania pompy ciepła","help":"Sprawdź, czy ta wartość jest nadal osiągana przy najniższej temperaturze źródła — wiele jednostek osiąga maksymalną wartość tylko przy umiarkowanych temperaturach zewnętrznych, a to nie jest moment, kiedy jest to potrzebne."},"opw_bron_detail":{"label":"Dane źródłowe","help":"Liczba i głębokość odwiertów, powierzchnia kolektora poziomego lub natężenie przepływu i temperatura wód gruntowych. W przypadku większych projektów należy również poprosić o test reakcji termicznej i coroczne zrównoważenie między wydobyciem a zatłaczaniem — grunt, który jest tylko pobierany, stygnie z biegiem lat, a wraz z nim spada sprawność."},"opw_regeneratie":{"label":"Czy przewidziano regenerację gruntu?","help":"Pasywne chłodzenie latem doładowuje grunt i zapewnia niemal darmowe chłodzenie. To jest najważniejszy powód, dla którego warto wybrać energię gruntową — i często jest on pomijany w ofercie.","options":{"ja":"Tak","nee":"Nie"}},"opw_warmtenet_detail":{"label":"Warunki sieci ciepłowniczej","help":"Temperatura zasilania, gwarantowana temperatura powrotu, kary za nadmierną temperaturę powrotu, moc przyłączeniowa i struktura taryf. Maksymalna dopuszczalna temperatura powrotu jest sztywnym ograniczeniem: determinuje cały projekt emitora i jest mierzona."},"opw_bestaand":{"label":"Istniejąca generacja do zachowania lub usunięcia","help":"W przypadku wymiany etapowej: co pozostaje na miejscu, jak jest zintegrowane hydraulicznie i kto zarządza przejściem?"},"kou_type":{"label":"Źródło chłodzenia","help":"Pasywne chłodzenie gruntu zużywa jedynie energię pomp i jednocześnie doładowuje grunt na zimę. Zapewnia ograniczoną wydajność przy wysokiej temperaturze wody — idealnie nadaje się do aktywacji rdzenia betonowego i stropów chłodzących, ale nie nadaje się do osuszania.","options":{"reversibel":"Rewersyjna pompa ciepła","chiller":"Oddzielny agregat chłodniczy","passief_bodem":"Pasywne chłodzenie z gruntu","vrije_koeling":"Chłodzenie swobodne z chłodnicą suchą","vrf":"System VRF z odzyskiem ciepła","adiabatisch":"Chłodzenie adiabatyczne","warmtenet_koude":"Chłodzenie miejskie","geen":"Brak aktywnego chłodzenia"}},"kou_terugwinning":{"label":"Jednoczesne ogrzewanie i chłodzenie z odzyskiem ciepła?","help":"W budynku z serwerownią, kuchnią lub o orientacji północ-południe, ciepło z chłodzenia można wykorzystać przez cały rok do podgrzewania wody użytkowej lub ogrzewania. Wymaga to systemu czterorurowego lub pompy ciepła z odzyskiem ciepła, co prawie zawsze się zwraca.","options":{"ja":"Tak","nee":"Nie"}},"kou_condensor":{"label":"Odprowadzanie ciepła z agregatu chłodniczego","help":"Mokra wieża chłodnicza jest najlepszym rozwiązaniem energetycznym i wiąże się z planem kontroli Legionelli, a także zwróceniem uwagi na jej położenie względem wlotów powietrza. Odprowadzanie ciepła do gruntu jest prawie zawsze najlepszym rozwiązaniem w przypadku instalacji odwiertów.","options":{"lucht":"Chłodzona powietrzem","droog":"Chłodnica sucha z glikolem","adiabatisch_cond":"Wspomagana adiabatycznie","nat":"Mokra wieża chłodnicza","bodem":"Do gruntu","water":"Do wód powierzchniowych lub gruntowych"}},"kou_vrije_koeling":{"label":"Darmowe chłodzenie przy niskiej temperaturze zewnętrznej?","help":"Przy reżimie chłodzenia 16/18°C, darmowe chłodzenie jest możliwe przez większą część roku w naszym klimacie. To najmocniejszy argument za ustawieniem wysokiego poziomu chłodzenia — i działa on tylko wtedy, gdy system emisji do niego pasuje.","options":{"ja":"Tak","nee":"Nie"}},"kou_ontvochtiging":{"label":"Gdzie odbywa się osuszanie?","help":"Pytanie, które decyduje o sukcesie lub porażce chłodzenia promiennikowego. Bez osuszania w innym miejscu, schłodzony sufit lub betonowy rdzeń nigdy nie mogą obniżyć temperatury poniżej punktu rosy, więc system sterowania musi ograniczać temperaturę powierzchni — tracąc moc w najcieplejsze i najbardziej wilgotne dni.","options":{"lucht":"W centrali wentylacyjnej","ventilo":"W klimakonwektorach","geen":"Nigdzie — brak aktywnego osuszania"}},"biv_strategie":{"label":"Strategia biwalentna","help":"Równoległy system utrzymuje pracę pompy ciepła i pozwala, aby ogrzewanie uzupełniające pokrywało jedynie niedobór; alternatywny system całkowicie wyłącza pompę ciepła. W przypadku kotła gazowego jako dodatkowego ogrzewania, alternatywne działanie jest czasami tańsze w eksploatacji; w przypadku dodatkowego ogrzewania elektrycznego prawie nigdy.","options":{"monovalent":"Monowalentne — pompa ciepła pokrywa wszystkie potrzeby","parallel":"Biwalentne równoległe — ogrzewanie uzupełniające wraz z pompą ciepła","alternatief":"Biwalentne alternatywne — przełączenie na kocioł","deels_parallel":"Częściowo równoległe, a następnie przełączenie"}},"biv_backup":{"label":"Rodzaj dodatkowego ogrzewania","help":"Elektryczne dodatkowe ogrzewanie jest tanie w zakupie i drogie w eksploatacji: każda kilowatogodzina kosztuje jedną, podczas gdy pompa ciepła zapewnia od trzech do pięciu godzin. Zapytaj, ile godzin rocznie ma pracować pompa i policz to — nieco większa pompa ciepła często okazuje się tańsza.","options":{"geen":"Brak","elektrisch":"Grzałka elektryczna","gasketel":"Kocioł gazowy","warmtenet":"Ogrzewanie miejskie","tweede_wp":"Druga pompa ciepła"}},"biv_punt":{"label":"Pożądany punkt biwalentny","help":"W temperaturze −5°C pompa ciepła zazwyczaj pokrywa ponad 90% rocznego zapotrzebowania na ciepło, przy czym dopuszcza się znacznie niższe obciążenie niż obciążenie projektowe. Ten arkusz oblicza rzeczywisty punkt na podstawie własnych danych i wyświetla go obok tego celu."},"biv_redundantie":{"label":"Wymagane bezpieczeństwo zasilania w przypadku awarii","help":"Rzadko konieczne w przypadku budynku mieszkalnego lub biura, trudne do spełnienia w przypadku domu opieki, centrum danych lub procesu. Kilka mniejszych jednostek zapewnia zarówno redundancję, jak i lepsze zachowanie przy częściowym obciążeniu — często jest to lepszy wybór niż jedna duża jednostka.","options":{"geen":"Brak — awaria dopuszczalna","gedeeltelijk":"Część mocy wyjściowej musi pozostać dostępna","volledig":"Pełna redundancja (n+1)"}},"biv_vorstbeveiliging":{"label":"Czy w przypadku awarii zapewniona jest ochrona przeciwzamrożeniowa budynku?","help":"Co się stanie, jeśli wystąpi awaria w okresie mrozu i kto zostanie o tym powiadomiony? W budynku z ogrzewaniem podłogowym i dużą ilością wody w podłodze nie jest to pytanie teoretyczne.","options":{"ja":"Tak","nee":"Nie"}},"biv_smart_grid":{"label":"Czy działanie może być zgodne z obciążeniem sieci lub taryfą?","help":"Operator sieci blokuje godziny, stosuje dynamiczne taryfy lub posiada własną energię słoneczną. Wymaga to pojemności magazynowej w zbiorniku buforowym lub w masie budynku oraz systemu sterowania z możliwością przewidywania. Dzięki systemowi budynku aktywowanemu termicznie ta masa jest już dostępna za darmo.","options":{"ja":"Tak","nee":"Nie"}},"dhw_aanwezig":{"label":"Czy ta instalacja wytwarza ciepłą wodę użytkową?","options":{"ja":"Tak","nee":"Nie"}},"dhw_persons":{"label":"Liczba osób lub punktów poboru"},"dhw_l_person":{"label":"Zużycie na osobę dziennie","help":"Mieszkanie 35–50 l na osobę przy 55°C, biuro znacznie mniej, obiekty sportowe i opieka znacznie więcej z ostrym szczytem."},"dhw_profiel":{"label":"Profil poboru","help":"Szczyt określa objętość, dzienne zużycie określa wydajność. W obiekcie sportowym szczyt decyduje, a magazynowanie jest tańsze niż produkcja.","options":{"woning":"Mieszkanie — szczyt poranny i wieczorny","kantoor":"Biuro — niski i rozproszony","sport":"Sport — krótki, bardzo wysoki szczyt","zorg":"Opieka — wysoki i ciągły","horeca":"Hotelarstwo / kuchnia"}},"dhw_t_store":{"label":"Temperatura w zbiorniku","help":"Każdy stopień wyżej obniża wydajność pompy ciepła. Jednostka przepływowa lub stacja świeżej wody może pracować z niższą temperaturą w zbiorniku, ponieważ nie ma stojącej ciepłej wody — często najbardziej eleganckie rozwiązanie problemu legionelli."},"dhw_t_cold":{"label":"Temperatura zimnej wody"},"dhw_systeem":{"label":"System","help":"Moduł przepływowy CWU podgrzewa wodę na żądanie i nie zatrzymuje stojącej ciepłej wody; zmniejsza to ryzyko wystąpienia legionelli i pozwala na utrzymanie niższej temperatury bufora. Wadą jest wysokie zapotrzebowanie szczytowe w tym momencie — z którym musi poradzić sobie zbiornik buforowy lub wymiennik ciepła.","options":{"boiler":"Zasobnik z wężownicą","verswater":"Moduł przepływowego podgrzewania CWU (stacja świeżej wody)","laadsysteem":"System ładowania z zewnętrznym wymiennikiem ciepła","decentraal":"Zdecentralizowany na każde mieszkanie lub punkt poboru","elektrisch_boiler":"Elektryczny podgrzewacz wody"}},"dhw_legionella":{"label":"Kontrola Legionelli","help":"Dezynfekcja termiczna wymaga okresowego utrzymywania temperatury 60°C lub wyższej w całej instalacji, w tym w obiegu cyrkulacyjnym. W tym momencie włącza się dodatkowe ogrzewanie elektryczne: zapytaj, ile energii kosztuje to rocznie, ponieważ często jest to więcej niż oczekiwano.","options":{"thermisch":"Okresowa dezynfekcja termiczna","doorstroom":"Zasada natychmiastowa, bez magazynowania","temperatuur":"Utrzymywanie stałej temperatury","alternatief":"Technika alternatywna"}},"dhw_circulatie":{"label":"Czy istnieje obieg cyrkulacyjny?","help":"Pętla cyrkulacyjna utrzymuje dostęp do ciepłej wody, ale jednocześnie stale traci ciepło — w przypadku słabo izolowanej rury straty te mogą przekroczyć zużycie użytkowe. W miarę możliwości należy zapewnić solidną izolację i przełączać instalację w zależności od pory dnia lub zapotrzebowania.","options":{"ja":"Tak","nee":"Nie"}},"dhw_voorrang":{"label":"Czy ciepła woda użytkowa ma pierwszeństwo przed ogrzewaniem?","help":"Częsty i rzadko występujący problem, ale należy ustalić, jak długo ogrzewanie może przestać działać. W przypadku systemu budynku aktywowanego termicznie nikt tego nie zauważa; w przypadku ogrzewania nadmuchowego zauważa się to w ciągu dziesięciu minut.","options":{"ja":"Tak","nee":"Nie"}},"dhw_zon":{"label":"Czy korzystać z energii słonecznej, czy z nadwyżki fotowoltaicznej?","help":"Ciepła woda użytkowa to najprostszy sposób na magazynowanie energii słonecznej, ponieważ zapotrzebowanie na nią występuje przez cały rok. Zapytaj, jak system sterowania rozpoznaje nadwyżkę i czy w takim przypadku tymczasowo podnosi temperaturę zasobnika.","options":{"ja":"Tak","nee":"Nie"}},"hyd_scheiding":{"label":"Separacja hydrauliczna","help":"Nieprawidłowo dobrany sprzęgło hydrauliczne lub otwarty kolektor miesza przepływ i powrót, co prowadzi do utraty różnicy temperatur: pompa ciepła ma zbyt wysoki przepływ powrotny, moduluje w dół, a jej sprawność spada. Unikaj separacji hydraulicznej, gdzie to możliwe, i zleć jej obliczenie, gdzie to konieczne.","options":{"geen":"Brak — obwód pojedynczy","open_verdeler":"Otwarty kolektor / sprzęgło hydrauliczne","buffer_serie":"Zbiornik buforowy połączony szeregowo","buffer_parallel":"Zbiornik buforowy połączony równolegle","wisselaar":"Płytowy wymiennik ciepła"}},"hyd_buffer":{"label":"Zbiornik buforowy","help":"Zbiornik buforowy rozwiązuje dwa często mylone problemy: zbyt krótki czas pracy generatora i zbyt małą objętość wody do odszraniania. Tylko pierwszy przypadek wymaga dużej objętości; w drugim przypadku często wystarczająca jest sama zawartość wody w instalacji.","options":{"geen":"Brak zbiornika buforowego","serie":"Szeregowo na powrocie","parallel":"Równolegle","ontdooi":"Tylko do odszraniania"}},"hyd_buffer_l":{"label":"Proponowana objętość bufora","help":"Pozostaw puste pole, aby wyświetlić tylko obliczoną wartość."},"hyd_min_run":{"label":"Minimalny czas pracy generatora","help":"Zapytaj producenta o tę wartość — bezpośrednio określa ona objętość buforową. Urządzenie, które musi pracować przez sześć minut, ale może oddać tylko dwie minuty ciepła, będzie uruchamiane dziesięć razy na godzinę."},"hyd_buffer_dt":{"label":"Dopuszczalne wahania temperatury w zbiorniku buforowym"},"hyd_system_l":{"label":"Zawartość wody w instalacji","help":"Rurociągi, odbiorniki i urządzenia razem. W przypadku ogrzewania podłogowego ta zawartość jest często wystarczająco duża, aby wchłonąć odszranianie bez dodatkowego zbiornika buforowego."},"hyd_pompen":{"label":"Pompy","help":"Zapytaj o rzeczywisty punkt pracy, a nie o maksymalną wysokość podnoszenia. Pompy o zbyt dużej mocy zużywają energię przez cały rok i powodują hałas przepływu w odbiornikach.","options":{"toerengeregeld":"Regulacja prędkości obrotowej na podstawie różnicy ciśnień","constant":"Stała prędkość obrotowa","debiet":"Regulacja stałego przepływu"}},"hyd_head_kpa":{"label":"Szacowany spadek ciśnienia w systemie","help":"W przypadku pompy ciepła i jej małej różnicy temperatur natężenie przepływu jest wysokie, a spadek ciśnienia odpowiednio wysoki: dlatego przy niskiej różnicy temperatur należy dobierać rurociągi bardziej szczodrze niż w przypadku kotła."},"hyd_inregeling":{"label":"Równoważenie hydrauliczne obiegów","help":"Bez równoważenia, najbliższy obieg otrzymuje wszystko, a dalszy nic, a użytkownicy kompensują to wyższą temperaturą zasilania — dokładnie tego chcieli uniknąć. Zawory regulacyjne niezależne od ciśnienia utrzymują również prawidłowe natężenie przepływu przy częściowym obciążeniu.","options":{"statisch":"Statyczna, z zaworami równoważącymi","dynamisch":"Zawory regulacyjne niezależne od ciśnienia","automatisch":"Automatyczne równoważenie","geen":"Niedostępne dla"}},"hyd_p_static":{"label":"Wysokość statyczna / ciśnienie wstępne"},"hyd_p_max":{"label":"Maksymalne ciśnienie robocze"},"hyd_waterkwaliteit":{"label":"Uzdatnianie wody napełniającej","help":"Kamień wapienny na wymienniku ciepła z małymi kanałami powoduje natychmiastowe koszty, a tlen w systemie wytwarza magnetyt, który blokuje pompy i zawory. Poproś o analizę wody przy odbiorze i ponownie po roku; to najtańsza gwarancja.","options":{"ontzout":"Zdemineralizowana lub zmiękczona, z analizą","inhibitor":"Z inhibitorem","leidingwater":"Nieuzdatniona woda wodociągowa","nog_bepalen":"Nadal do ustalenia"}},"hyd_ontluchting":{"label":"Czy zapewniono automatyczne odpowietrzanie i separację zanieczyszczeń?","help":"Separator powietrza/mikropęcherzyków i magnetyczny separator zanieczyszczeń bezpośrednio przed generatorem. W instalacji z istniejącą instalacją rurową nie jest to luksus, lecz warunek utrzymania gwarancji.","options":{"ja":"Tak","nee":"Nie"}},"hyd_vorst":{"label":"Ochrona przed zamarzaniem jednostek zewnętrznych i instalacji rurowej?","help":"W przypadku pompy ciepła umieszczonej na zewnątrz: w jaki sposób woda utrzymuje ruch podczas przerwy w dostawie prądu i co dzieje się z odpływem kondensatu podczas mrozu? Zamarznięta tacka ociekowa na kondensat zaburza równowagę wentylatora.","options":{"ja":"Tak","nee":"Nie"}},"dis_opzet":{"label":"Układ instalacji","help":"Centralny zapewnia korzyści skali i jeden punkt kontaktowy; zdecentralizowany zapewnia proste rozliczenia i brak strat dystrybucyjnych. Forma pośrednia — wspólne źródło z indywidualnymi pompami ciepła lub interfejsami cieplnymi — łączy oba te rozwiązania i szybko zyskuje na popularności w budownictwie mieszkaniowym.","options":{"centraal":"Centralna — jedna instalacja dla całego budynku","decentraal":"Zdecentralizowana — na jednostkę lub strefę","collectief_individueel":"Źródło wspólne, indywidualni odbiornikzy","cluster":"Klastry na część budynku"}},"dis_leidingen":{"label":"Sieć dystrybucyjna","help":"Sieć czterorurowa umożliwia jednoczesne ogrzewanie i chłodzenie, ale jest bardziej kosztowna i zajmuje więcej miejsca. Sieć źródeł ciepła o temperaturze otoczenia z pompami ciepła w każdej jednostce działa tak samo z dwiema rurami i dlatego jest coraz częściej wybierana.","options":{"tweepijps":"Instalacja dwururowa z sezonowym przełączaniem","vierpijps":"Instalacja czterorurowa","tweepijps_wp":"Instalacja dwururowa ze zdecentralizowanymi pompami ciepła (sieć ze źródłem zewnętrznym)"}},"dis_isolatie":{"label":"Izolacja rur","help":"W sieci niskotemperaturowej straty są mniejsze, ale w przypadku chłodzenia istotna jest również paroszczelność: rura z wodą lodową bez paroszczelnego wykończenia powoduje skraplanie się pary wodnej wewnątrz izolacji, co staje się widoczne dopiero po zmoczeniu sufitu.","options":{"zwaar":"Większa niż wymaga norma","norm":"Zgodnie z normą","beperkt":"Ograniczona"}},"dis_tracelengte":{"label":"Szacowana długość trasy","help":"W przypadku długiego, poziomego odcinka dystrybucji straty dystrybucyjne mogą pochłaniać znaczną część generowanego ciepła, szczególnie przy niskim zajętości."},"dis_afleverset":{"label":"Liczba jednostek interfejsu ciepła na jednostkę?","help":"Określ, co znajduje się wewnątrz urządzenia: opomiarowanie, sterowanie, produkcja ciepłej wody użytkowej, zabezpieczenie przed cofaniem się wody — oraz kto odpowiada za jego konserwację i kto ma do niego dostęp.","options":{"ja":"Tak","nee":"Nie"}},"dis_meting_eenheid":{"label":"Czy opomiarowanie na urządzenie jest wymagane?","help":"Często jest to wymóg prawny w instalacjach komunalnych. Zdecyduj z wyprzedzeniem, gdzie umieścić liczniki, ponieważ determinują one układ całej sieci rurociągów.","options":{"ja":"Tak","nee":"Nie"}},"dis_toegang":{"label":"Dostępność rurociągów i rozdzielaczy","help":"Rozdzielacze w szafkach lub nad sufitami podwieszanymi muszą być dostępne w celu ich wyrównywania i konserwacji. Wszystko, co znajduje się za zamurowaną ścianą, nigdy nie zostanie ponownie wyrównywane."},"ctl_leverancier":{"label":"Geneza systemu sterowania","help":"W rozwiązaniu mieszanym sterowanie pompy ciepła kłóci się z sterowaniem budynku: oba systemy chcą ustawić temperaturę zasilania. Należy ustalić, kto odpowiada za którą zmienną.","options":{"fabriek":"Sterowanie producenta generatora","gbs":"System zarządzania budynkiem","gemengd":"Mieszany"}},"ctl_protocol":{"label":"Protokół komunikacyjny","help":"Zastrzeżony protokół oznacza zależność od jednego dostawcy przez cały okres użytkowania. Poproś o listę punktów z prawami odczytu i zapisu wraz z ofertą.","options":{"geen":"Brak","modbus_rtu":"Modbus RTU","modbus_tcp":"Modbus TCP","bacnet":"BACnet","knx":"KNX","fabrikant":"Zastrzeżony protokół producenta"}},"ctl_stooklijn":{"label":"Czy krzywa grzewcza jest regulowana i udokumentowana?","help":"Poproś o dołączenie do pliku przekazania ustawionej krzywej grzewczej wraz z wynikami temperatur w pomieszczeniach. Bez tego dokumentu nikt już jej nie zoptymalizuje.","options":{"ja":"Tak","nee":"Nie"}},"ctl_functies":{"label":"Wymagane funkcje sterowania","help":"Monitorowanie punktu rosy nie jest opcjonalne w momencie uruchomienia chłodzenia promiennikowego w budynku: bez czujnika na przepływie i czujnika w pomieszczeniu, sufit kapie już pierwszego parnego dnia.","options":{"weersafhankelijk":"Regulacja temperatury przepływu z kompensacją pogodową","nachtverlaging":"Obniżenie lub wyłączenie nocne","optimale_start":"Optymalny start","zomer_winter":"Automatyczne przełączanie lato/zima","dauwpunt":"Monitorowanie punktu rosy podczas chłodzenia","vrije_koeling_ctl":"Automatyczne chłodzenie swobodne","sww_voorrang":"Priorytet ciepłej wody użytkowej","legionella":"Cykl Legionella","pv_sturing":"Sterowanie z własnej energii słonecznej","tarief":"Sterowanie z taryfy lub sygnału sieciowego","vorst":"Ochrona przed zamarzaniem","storingsmelding":"Zdalne zgłaszanie usterek"}},"ctl_zonering":{"label":"Sterowanie strefowe","help":"Sterowanie pomieszczenie po pomieszczeniu brzmi dobrze, ale jest nieefektywne w przypadku wolnoobrotowych odbiorników: obiegi, które się zamykają, podnoszą temperaturę w pozostałych i uruchamiają cykl pompy ciepła. Zamiast wyłączać obiegi, należy rozważyć utrzymanie przepływu na niskim poziomie z ograniczeniem.","options":{"thermostaat_zone":"Termostat na strefę","per_ruimte":"Na pomieszczenie","centraal_ctl":"Tylko centrala"}},"ctl_terugmelding":{"label":"Informacja zwrotna o rzeczywistej sprawności?","help":"Licznik ciepła i licznik energii elektrycznej na pompie ciepła podają rzeczywistą sprawność sezonową. Bez tych dwóch liczników, każda dyskusja o niezadowalającej wydajności jest nierozstrzygalna — i właśnie dlatego tak często ich brakuje.","options":{"ja":"Tak","nee":"Nie"}},"ctl_alarmen":{"label":"Alarmy i dalsze działania","help":"Które usterki muszą do kogo dotrzeć, w jakim czasie i kto musi na nie zareagować? Pompa ciepła, która wyłącza się w listopadzie i nie jest zauważona do grudnia, pozwala na pracę dodatkowego ogrzewania przez miesiąc."},"ene_elek_aansluiting":{"label":"Dostępna moc zasilania elektrycznego","help":"Często zaskakującym aspektem projektu jest: pompa ciepła z dodatkowym ogrzewaniem elektrycznym wymaga znacznie większej mocy, a modernizacja trwa miesiące i czasami kosztuje więcej niż sama instalacja. Sprawdź to przed wyborem rozwiązania."},"ene_gelijktijdig_elek":{"label":"Szacowane szczytowe zapotrzebowanie na energię elektryczną","help":"Pompa ciepła, dodatkowe ogrzewanie, produkcja ciepłej wody użytkowej i infrastruktura ładowania razem, w najzimniejszej godzinie roku."},"ene_pv":{"label":"Moc instalacji fotowoltaicznej na miejscu","help":"Zapotrzebowanie na energię elektryczną i ciepło słoneczne nie pokrywa się w czasie; pokrywa się wiosną i jesienią oraz w przypadku ciepłej wody użytkowej. Nie należy pracować na podstawie średnich rocznych, lecz na podstawie zbieżności."},"ene_opslag":{"label":"Czy magazyn energii elektrycznej jest obecny lub jest planowany?","options":{"ja":"Tak","nee":"Nie"}},"ene_tarief_elek":{"label":"Taryfa za energię elektryczną"},"ene_tarief_gas":{"label":"Taryfa za gaz","help":"Stosunek obu taryf określa efektywność, przy której pompa ciepła jest tańsza niż kocioł. Przy stosunku wynoszącym cztery, który jest tylko wyższy od sprawności sezonowej równej cztery — należy to uwzględnić wprost, zamiast zakładać."},"ene_capaciteitstarief":{"label":"Czy obowiązuje taryfa za moc, czy za szczytowe zapotrzebowanie?","help":"W przypadku rozliczeń opartych na miesięcznym szczycie, opłaca się rozłożyć ogrzewanie uzupełniające i przenieść produkcję ciepłej wody użytkowej poza szczyt. Jest to kwestia kontrolna, która ma bezpośrednie konsekwencje finansowe.","options":{"ja":"Tak","nee":"Nie"}},"ene_meters":{"label":"Należy dostarczyć liczniki","help":"Oddzielne rozliczanie energii pomocniczej prawie nigdy nie jest stosowane i często wyjaśnia różnicę między deklarowaną a zmierzoną wydajnością: pompy, rozmrażanie, elektronika i cyrkulacja sumują się.","options":{"warmte_wp":"Licznik ciepła na pompie ciepła","warmte_sww":"Licznik ciepła na ciepłej wodzie użytkowej","koude":"Licznik chłodzenia","elek_wp":"Licznik energii elektrycznej, pompa ciepła","elek_backup":"Licznik energii elektrycznej, ogrzewanie dodatkowe","elek_pompen":"Licznik energii elektrycznej, pompy i energia pomocnicza","eenheid":"Rozliczanie na jednostkę lub najemcę"}},"ene_prestatie":{"label":"Czy wymagana jest gwarancja wydajności sezonowej?","help":"Ma sens tylko wtedy, gdy granice rozliczeń, metoda pomiaru i warunki brzegowe zostały uzgodnione wcześniej. Zapytaj, co się stanie, jeśli gwarancja nie zostanie spełniona, ponieważ to właśnie w tym tkwi prawdziwa wartość.","options":{"ja":"Tak","nee":"Nie"}},"ene_scop_eis":{"label":"Wymagana sezonowa efektywność (SCOP)","help":"Określ warunki brzegowe: jaki tryb pracy, z ciepłą wodą użytkową czy bez, z energią pomocniczą czy bez. Bez tej definicji wartość ta jest bezwartościowa."},"ops_plaats_binnen":{"label":"Lokalizacja jednostek wewnętrznych","help":"Określ wolną przestrzeń dookoła, szerokość drzwi i obciążenie podłogi. W przypadku pompy ciepła zasilanej propanem w pomieszczeniu występują dodatkowe wymagania dotyczące kubatury pomieszczenia, wentylacji i obecności niżej położonych przestrzeni, w których gaz mógłby się unosić.","options":{"techniek":"Pomieszczenie techniczne","berging":"Magazyn lub pomieszczenie gospodarcze","kelder":"Piwnica","dak":"Obudowa dachowa","buiten_ops":"Całkowicie na zewnątrz"}},"ops_plaats_buiten":{"label":"Położenie jednostek zewnętrznych","help":"Odległość od granicy działki, od okien własnego domu i sąsiadów oraz kierunek nawiewu wentylatora. Należy również wziąć pod uwagę, gdzie trafia zimne powietrze wylotowe: na taras lub ścieżkę, ponieważ powoduje ono szron i gołoledź."},"ops_geluid_eis":{"label":"Dopuszczalny poziom hałasu w miejscu oceny","help":"Wynika z regionalnych warunków środowiskowych i zazwyczaj obowiązuje przy granicy działki lub przy oknie najbliższego sąsiada. Obowiązuje wartość nocna, a to właśnie w nocy pompa ciepła pracuje."},"ops_geluid_afstand":{"label":"Odległość do najbliższego punktu pomiarowego"},"ops_geluid_maatregel":{"label":"Proponowane środki akustyczne","help":"Tryb nocny jednocześnie obniża poziom hałasu i moc wyjściową — dokładnie wtedy, gdy na zewnątrz jest najzimniej. Sprawdź, czy budynek jest w stanie to wytrzymać, w przeciwnym razie problem hałasu zostanie rozwiązany kosztem ciepła.","options":{"nachtmodus":"Tryb nocny z ograniczeniem prędkości","omkasting":"Obudowa lub bariera akustyczna","trillingsdempers":"Mocowania antywibracyjne i elastyczne połączenia","plaatsing":"Umiejscowienie z dala od wrażliwych fasad","geen_maatregel":"Brak zaproponowanych środków"}},"ops_octaaf":{"label":"Wymagać poziomu mocy akustycznej w pasmach oktawowych?","help":"Pojedyncza wartość dB(A) nie wystarczy do obliczeń akustycznych, a już na pewno nie dla części o niskiej częstotliwości, która przechodzi przez fasady i powoduje najwięcej uciążliwości.","options":{"ja":"Tak","nee":"Nie"}},"ops_trillingen":{"label":"Izolacja wibracji sprężarki i pomp?","help":"W przypadku, gdy urządzenie znajduje się na lekkiej podłodze lub przy pomieszczeniu mieszkalnym, izolacja wibracji decyduje o tym, czy instalacja jest słyszalna, nawet jeśli hałas w powietrzu jest prawidłowy.","options":{"ja":"Tak","nee":"Nie"}},"ops_koudemiddel_veiligheid":{"label":"Bezpieczeństwo czynnika chłodniczego","help":"Ilość czynnika na obieg, minimalna wielkość pomieszczenia, wykrywanie nieszczelności, wentylacja oraz odległość od otworów i piwnic. W przypadku propanu to częściowo determinuje lokalizację — zapytaj przed ustaleniem lokalizacji."},"ops_condens":{"label":"Czy zapewniono odpływ kondensatu z jednostki zewnętrznej?","help":"Pompa ciepła powietrze-woda produkuje dziesiątki litrów kondensatu dziennie w warunkach mrozu. Bez ogrzewanego odpływu lub żwirowego podłoża, które zamarza pod jednostką i na ścieżce obok niej.","options":{"ja":"Tak","nee":"Nie"}},"ops_toegang":{"label":"Czy zapewniona jest wolna przestrzeń serwisowa i dostęp do niej?","help":"W tym przestrzeń do demontażu sprężarki lub wymiennika ciepła za dziesięć lat, gdy wokół nich zostaną już zbudowane różne rzeczy.","options":{"ja":"Tak","nee":"Nie"}},"nrm_epb":{"label":"Czy projekt podlega przepisom dotyczącym charakterystyki energetycznej?","help":"Określa minimalne wymagania dotyczące efektywności energetycznej, izolacji rur, opomiarowania, a czasami również udziału energii odnawialnej.","options":{"ja":"Tak","nee":"Nie"}},"nrm_normen":{"label":"Normy i wytyczne, które należy stosować","help":"W przypadku każdej normy należy poprosić o dowody, a nie o oświadczenie o jej spełnieniu. W przypadku normy EN 14511 najważniejsze są warunki testowe: ta sama maszyna uzyskuje bardzo różne wyniki w różnych warunkach brzegowych.","options":{"en12831":"EN 12831 — obliczanie strat ciepła","en1264":"EN 1264 — ogrzewanie podłogowe","en442":"EN 442 — grzejniki","en14511":"EN 14511 / EN 14825 — charakterystyki pomp ciepła","en378":"EN 378 — bezpieczeństwo chłodnictwa","en12828":"EN 12828 — systemy grzewcze w budynkach","vdi2035":"VDI 2035 — jakość wody do napełniania","legionella_norm":"Krajowe przepisy dotyczące legionelli","bodem":"Przepisy dotyczące energii gruntowej"}},"nrm_vergunning":{"label":"Wymagane pozwolenia i zgłoszenia","help":"Odwierty i pobór wód gruntowych wymagają długiego czasu realizacji, a czasem również obowiązkowych badań. Podobnie jest z modernizacją sieci. Rozpocznij te procesy przed złożeniem zamówienia, a nie po nim.","options":{"omgeving":"Pozwolenie na budowę","milieu":"Powiadomienie lub pozwolenie środowiskowe","bodemenergie":"Pozwolenie na energię z gruntu lub wiercenie","grondwater":"Pozwolenie na wody gruntowe","netbeheerder":"Wniosek o modernizację przyłącza sieciowego","geen_verg":"Brak"}},"nrm_fgas":{"label":"Rejestracja i kontrola szczelności zgodnie z rozporządzeniem w sprawie gazów fluorowanych?","help":"W zależności od ilości czynnika chłodniczego wymagane są okresowe kontrole szczelności i dziennik. Zapytaj, kto się tym zajmuje i gdzie przechowywany jest dziennik.","options":{"ja":"Tak","nee":"Nie"}},"nrm_subsidie":{"label":"Dotacje i ich warunki","help":"Dotacje często wiążą się z wymaganiami dotyczącymi efektywności, akredytacji instalatora i terminu złożenia wniosku. W wielu programach wniosek złożony po złożeniu zamówienia traci ważność."},"nrm_erkenning":{"label":"Czy wymagany jest akredytowany instalator?","help":"W przypadku prac chłodniczych i większości dotacji. Poproś o numer certyfikatu wraz z wyceną, a nie przy odbiorze.","options":{"ja":"Tak","nee":"Nie"}},"uit_fasering":{"label":"Fazowanie i ciągłość prac podczas prac","help":"Czy budynek musi pozostać w eksploatacji? W przypadku wymiany w sezonie grzewczym wymagane jest tymczasowe zabezpieczenie — należy ustalić, kto je dostarczy i kto za nie zapłaci."},"uit_inregeling":{"label":"Równoważenie hydrauliczne z protokołem?","help":"Zmierzone i zarejestrowane przepływy na obieg. Na tym polega różnica między instalacją pracującą w temperaturze 35°C a tą samą instalacją, która musi pracować w temperaturze 45°C, ponieważ najdalszy obieg nie jest w stanie jej wytrzymać.","options":{"ja":"Tak","nee":"Nie"}},"uit_prestatiemeting":{"label":"Pomiar parametrów przy odbiorze?","help":"Przepływ, powrót, natężenie przepływu, pobór mocy i moc cieplna w określonych warunkach pracy. Bez pomiaru bazowego nie można niczego później wykazać.","options":{"ja":"Tak","nee":"Nie"}},"uit_seizoensmeting":{"label":"Ponowny pomiar po pierwszym sezonie grzewczym?","help":"Rzeczywista wydajność jest widoczna dopiero po całym sezonie. Zgodzić się, że instalator wraca po roku, aby dostosować krzywą grzewczą i ustawienia — często daje to od dziesięciu do dwudziestu procent oszczędności.","options":{"ja":"Tak","nee":"Nie"}},"uit_documentatie":{"label":"Wymagana dokumentacja","help":"Poproś o raport doboru wraz z ofertą, pokazujący wydajność przy danej temperaturze zasilania. Ten pojedynczy dokument umożliwia pierwsze porównanie ofert różnych producentów.","options":{"berekening":"Obliczenia strat ciepła i obciążenia chłodniczego","selectie":"Raport doboru z punktami pracy dla parametrów projektowych","schema":"Schemat hydrauliczny, powykonawczy","elektrisch":"Schemat elektryczny i lista punktów","inregel":"Raport z bilansowania z zmierzonymi natężeniami przepływu","stooklijn":"Krzywa grzewcza z parametrami zadanymi i kontrolnymi","onderhoud":"Instrukcje konserwacji z okresami międzyobsługowymi","logboek":"Rejestr czynnika chłodniczego","garantie":"Warunki gwarancji"}},"uit_opleiding":{"label":"Czy zapewnione jest szkolenie zarządcy budynku?","help":"Każdy, kto nie rozumie krzywej grzewczej, włączy ją przy pierwszej reklamacji — a wtedy wydajność zniknie. Godzina wyjaśnień przy odbiorze się opłaca.","options":{"ja":"Tak","nee":"Nie"}},"uit_onderhoud":{"label":"Umowa serwisowa","options":{"geen":"Brak","basis":"Podstawowa — przeglądy i kontrole wymagane przepisami","volledig":"Pełna — w tym sterowanie i monitorowanie wydajności","nog_bepalen":"Do ustalenia"}},"uit_garantie":{"label":"Wymagany okres gwarancji"},"uit_levertijd":{"label":"Wymagany czas dostawy lub data zakończenia","help":"Zapytaj o czas dostawy sterowania i jednostek zewnętrznych osobno; rzadko działają one według tego samego harmonogramu."},"uit_budget":{"label":"Wskazanie budżetu"},"uit_opmerkingen":{"label":"Inne uwagi i ograniczenia"}},"pgroup":{"wonen":"Mieszkaniowe","utiliteit":"Budynki niemieszkalne","industrie":"Przemysł i procesy technologiczne"}};
