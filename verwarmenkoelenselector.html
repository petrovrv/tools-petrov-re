","kpiRegime":"Régime de chauffage","kpiFlowRate":"Débit d'eau en chauffage","kpiCop":"COP aux conditions de base","kpiScop":"Rendement saisonnier (estimation)","kpiBivalent":"Point de bivalence","kpiCoverage":"Couverture par la pompe à chaleur","kpiBackup":"Appoint nécessaire","kpiBuffer":"Volume tampon conseillé","kpiExpansion":"Vase d'expansion","kpiDhw":"Eau chaude sanitaire","kpiDhwCop":"COP eau sanitaire","kpiEnergyHeat":"Besoin de chaleur par an","kpiEnergyElec":"Électricité par an","kpiUA":"Coefficient de déperdition thermique","kpiRadiator":"Émission à ce régime","diagramTitle":"Structure de l'installation","rowWarm":"Chauffage","rowKoud":"Refroidissement","rowSww":"Eau chaude sanitaire","diagramEmpty":"Complétez le questionnaire — la chaîne se compose ici.","diagramNote":"Représentation schématique de la chaîne, de la source jusqu'aux émetteurs. Utilisez-la pour contrôler le cahier des charges, non comme schéma hydraulique.","checksTitle":"Contrôles","checksNone":"Aucune constatation avec les données actuelles.","levelBlok":"Bloquant","levelWaarschuwing":"Avertissement","levelAdvies":"Point d'attention","checksCount":"{blok} bloquants · {waarschuwing} avertissements · {advies} points d'attention","basis":"Fondement","reportTitle":"Cahier des charges chauffage et refroidissement","reportFor":"Pour","reportBy":"Établi par","reportDate":"Date","reportRef":"Référence","secSummary":"Synthèse","secDuty":"Valeurs calculées","secModules":"Choix du système et justification","secChecks":"Points d'attention et risques","secQuestions":"Questions ouvertes au fournisseur","secAll":"Cahier des charges complet","secDisclaimer":"Réserve","colModule":"Composant","colWhy":"Pourquoi ce choix","colDriver":"Données déterminantes","colNorm":"Fondement","unanswered":"non renseigné","disclaimer":"Toutes les valeurs calculées sur cette feuille sont des indications de conception, destinées à étayer le cahier des charges et à rendre visibles très tôt les erreurs de système. Le rendement d'une pompe à chaleur est calculé au moyen d'une approche de Carnot et d'un facteur de qualité réaliste ; les performances réelles proviennent de données de mesure certifiées selon EN 14511 et EN 14825 aux conditions réelles. La sélection définitive, la mise au point hydraulique et les performances garanties relèvent du fournisseur, avec une vérification propre au projet.","openQuestions":["Puissance et COP au régime réel du projet, et pas seulement à A7/W35 — demandez le tableau complet.","Puissance minimale en modulation et comportement à charge partielle.","Temps de fonctionnement minimal et volume tampon qui en découle.","Puissance et COP pour la préparation d'eau chaude sanitaire, séparément du chauffage.","Comportement et consommation d'énergie pendant le dégivrage, et influence sur la chaleur fournie.","Puissance acoustique par bande d'octave, en fonctionnement normal et en mode nuit, avec la puissance qui subsiste en mode nuit.","Quantité de charge de fluide frigorigène par circuit et exigences relatives au local d'implantation.","Perte de charge côté eau des appareils au débit du projet.","Liste des points de la régulation avec droits de lecture et d'écriture.","Qualité d'eau de remplissage admise et conditions de garantie qui y sont liées.","Rapport de sélection joint à l'offre, afin que les offres deviennent comparables."]},"val":{"lucht_water":"air/eau","lucht_lucht":"air/air","grond_boring":"géothermique à forages verticaux","grond_horizontaal":"géothermique à réseau horizontal","water_water":"eau/eau","afvoerlucht":"sur air extrait","hybride":"hybride","gasketel":"chaudière gaz à condensation","elektrisch":"électrique","warmtenet":"réseau de chaleur","wkk":"cogénération","biomassa":"biomasse","zon_thermisch":"capteurs solaires thermiques","radiator":"radiateurs","convector":"convecteurs","vloerconvector":"convecteurs de sol","paneel":"panneaux rayonnants","plafondpaneel":"panneaux de plafond","ventilo":"ventilo-convecteurs","luchtverwarmer":"chauffage à air pulsé","vloer":"plancher chauffant","wand":"mur chauffant","tabs":"activation du noyau béton","koelplafond":"plafond rafraîchissant","balk":"poutres climatiques","vrf":"VRF","boiler":"ballon de stockage à serpentin","verswater":"module ECS instantané","laadsysteem":"système de charge avec échangeur externe","decentraal":"production décentralisée","elektrisch_boiler":"chauffe-eau électrique","geen":"aucun","serie":"en série","parallel":"parallèle","ontdooi":"pour le dégivrage","monovalent":"monovalent","alternatief":"bivalent alternatif","deels_parallel":"partiellement parallèle","tweede_wp":"deuxième pompe à chaleur","gasketel_biv":"chaudière gaz","reversibel":"pompe à chaleur réversible","chiller":"machine frigorifique séparée","passief_bodem":"géocooling passif","vrije_koeling":"free cooling","adiabatisch":"refroidissement adiabatique","warmtenet_koude":"réseau de froid","lucht":"refroidi par air","droog":"aéroréfrigérant sec","nat":"tour de refroidissement humide","bodem":"vers le sous-sol","water":"vers l'eau","adiabatisch_cond":"assisté par voie adiabatique"},"fam":{"bron":"Source","opwekking":"Production","opslag":"Stockage et découplage","distributie":"Distribution","afgifte":"Émission","sanitair":"Sanitaire","overig":"Divers"},"mod":{"buitendeel":"Unité extérieure","boring":"Forages","grondwater":"Eau souterraine","restwarmte":"Chaleur résiduelle","bron":"Source","warmtepomp":"Pompe à chaleur","ketel":"Chaudière","elektrisch":"Électrique","warmtenet":"Réseau de chaleur","chiller":"Machine frigorifique","wkk":"Cogénération","vrije_koeling":"Free cooling","buffer":"Ballon tampon","boilervat":"Ballon ECS","scheiding":"Découplage","verdeler":"Collecteur","menggroep":"Circuit mélangeur","pomp":"Pompe","afleverset":"Module d'appartement","vloer":"Plancher chauffant","wand":"Mur chauffant","tabs":"Noyau béton","radiator":"Radiateur","convector":"Convecteur","vloerconvector":"Convecteur de sol","ventilo":"Ventilo-convecteur","koelplafond":"Plafond rafraîchissant","balk":"Poutre climatique","paneel":"Panneau rayonnant","luchtverwarmer":"Chauffage à air pulsé","vrf":"Unité VRF","verswater":"Module ECS instantané","tappunt":"Point de puisage","circulatie":"Circulation"},"rules":{"afgifte_ontoereikend":{"t":"Les émetteurs existants n'atteignent pas le régime choisi","d":"À {aan}/{ret} °C, les émetteurs de type {type} ne fournissent plus que {pct} % de la puissance nominale sur laquelle ils ont été sélectionnés selon EN 442 — celle-ci vaut à 75/65/20. Pour couvrir la charge, il faut environ {nodig} kW nominaux. Inventoriez pièce par pièce ce qui est installé et remplacez de manière ciblée les éléments insuffisants ; c'est presque toujours moins cher qu'un appareil plus grand ou qu'un régime plus élevé, et c'est la seule intervention qui améliore réellement le rendement.","r":"EN 442"},"afgifte_derating":{"t":"Les émetteurs fournissent nettement moins à ce régime","d":"À {aan}/{ret} °C, les émetteurs de type {type} fournissent encore {pct} % de la puissance nominale. Comptez environ {nodig} kW nominaux pour couvrir la charge. Vérifiez-le pièce par pièce : la moyenne ne dit rien, c'est le local le plus juste qui compte.","r":"EN 442"},"afgifte_ok":{"t":"Les émetteurs conviennent au régime choisi","d":"À ce régime, les émetteurs de type {type} fournissent encore {pct} % de la puissance nominale. Vérifiez néanmoins le local présentant le rapport le plus défavorable entre la charge et l'émission installée.","r":"EN 442"},"vloer_oververhit":{"t":"Plancher chauffant au-dessus de la température de surface admissible","d":"Le flux de chaleur demandé est de {nodig} W/m², alors qu'à la température de surface maximale de 29 °C dans la zone de séjour, environ {max} W/m² sont possibles. La température de surface calculée atteint {opp} °C — ce n'est pas seulement hors norme, c'est aussi inconfortable. Augmentez la surface de pose, réduisez le pas de pose, ou complétez par un deuxième système d'émission.","r":"EN 1264"},"vloerafwerking":{"t":"Revêtement de sol à résistance thermique élevée","d":"Avec R = {r} m²K/W, la température d'eau doit monter à environ {tmed} °C pour délivrer la même chaleur. C'est le tueur de projet le plus silencieux qui soit : le maître d'ouvrage choisit son sol indépendamment de l'installation et le rendement de la pompe à chaleur suit. Fixez la résistance maximale admissible dans le cahier des charges et communiquez-la.","r":"EN 1264"},"legoppervlak":{"t":"Surface de pose limitée pour le plancher chauffant","d":"Avec {pct} % de surface disponible, la même chaleur doit passer par moins de mètres carrés et la température d'eau monte en conséquence. Vérifiez si les armoires fixes et les appareils viendront réellement à cet endroit, et envisagez le mur chauffant en complément.","r":"EN 1264"},"tabs_te_zwaar":{"t":"L'activation du noyau béton ne peut pas porter la charge de chauffage","d":"Il est demandé {nodig} W/m² alors qu'un noyau béton fournit environ {max} W/m². Le noyau béton couvre la charge de base ; la pointe doit provenir d'un deuxième système, plus rapide. Calculez les deux au lieu d'espérer que la masse absorbera le reste.","r":"ISO 11855"},"tabs_koel_te_zwaar":{"t":"L'activation du noyau béton ne peut pas porter seule la charge frigorifique","d":"Demandé {nodig} W/m² contre environ {max} W/m² disponibles. Complétez par une régulation terminale, ou abaissez la charge frigorifique par une protection solaire extérieure — cette dernière est presque toujours moins chère que de la puissance d'installation.","r":"ISO 11855"},"tabs_zonder_massa":{"t":"Activation du noyau béton sans inertie thermique","d":"Dans un bâtiment léger ou sous un faux plafond, l'activation du noyau béton ne dispose d'aucune masse active et reste donc sans effet. Choisissez un autre système d'émission, ou dégagez la masse et acceptez-en les conséquences acoustiques.","r":"ISO 11855"},"tabs_onderbroken":{"t":"Système lent en cas d'occupation fortement intermittente","d":"L'activation du noyau béton réagit en heures. Avec un profil d'occupation fortement interrompu, la chaleur arrive trop tard et s'arrête trop tard, avec surchauffe et sous-chauffe à la clé. Envisagez un système plus rapide, ou acceptez que le noyau béton n'assure que la base.","r":"—"},"condens_plafond":{"t":"Risque de condensation sur le plafond rafraîchissant","d":"La température de départ de {aan} °C est trop proche du point de rosée attendu de {dauw} °C. Sans déshumidification ailleurs et sans surveillance du point de rosée, le plafond goutte au premier jour lourd. Relevez la température de départ, ou assurez la déshumidification par le traitement d'air avec une sonde sur le départ ET dans le local.","r":"ISO 11855 ; EN 14240"},"straling_zonder_ontvochtiging":{"t":"Refroidissement par rayonnement sans déshumidification","d":"Une surface refroidie n'absorbe que la chaleur sensible. Sans déshumidification, l'humidité monte jusqu'à ce que le point de rosée atteigne la limite du système, précisément les jours les plus chauds. Assurez la déshumidification dans le traitement d'air.","r":"—"},"gemengde_regimes":{"t":"Plancher chauffant et radiateurs sur un même régime","d":"Le générateur doit alors fournir la température la plus élevée et le rendement suit les radiateurs, pas le plancher. Prévoyez un circuit mélangeur ou — mieux — remplacez les radiateurs pour que tout le bâtiment puisse fonctionner au régime bas.","r":"—"},"latent_zonder_ontvochtiging":{"t":"Charge latente de {pct} % sans déshumidification","d":"L'humidité doit être évacuée quelque part. Sans déshumidification dans le traitement d'air ou dans les ventilo-convecteurs, l'humidité de l'air monte jusqu'à ce que le confort disparaisse et que le refroidissement par rayonnement doive être bridé. Fixez où la déshumidification a lieu et avec quelle puissance.","r":"EN 16798-1"},"boven_max_temp":{"t":"Température de départ demandée au-delà de la plage de la pompe à chaleur","d":"Il est demandé {aan} °C alors que l'appareil fournit au maximum {max} °C. Vérifiez en outre que ce maximum est encore atteint à la température de source la plus basse — beaucoup d'appareils n'atteignent leur maximum qu'aux températures extérieures douces, et c'est justement le moment où vous n'en avez pas besoin.","r":"EN 14511"},"hoog_regime":{"t":"Température de départ élevée pour une pompe à chaleur","d":"À {aan} °C, le COP aux conditions de base ressort autour de {cop}. Chaque degré en moins apporte grosso modo 2 à 3 % de rendement en plus. Examinez d'abord si le régime peut être abaissé par le remplacement ciblé d'éléments d'émission ; cela se rentabilise largement sur la durée de vie.","r":"EN 14511"},"kleine_spreiding":{"t":"Écart de température très faible","d":"Avec un écart de {dt} K, le débit d'eau est de {debiet} m³/h — cela exige des conduites larges et coûte de l'énergie de pompage toute l'année. Vérifiez que le dimensionnement des conduites et le choix des pompes reposent bien là-dessus et non sur un régime de chaudière.","r":"—"},"grote_spreiding":{"t":"Écart de température important pour une pompe à chaleur","d":"À {dt} K, la pompe à chaleur doit traiter un retour bas tout en produisant un départ élevé. La plupart des appareils sont conçus pour 5 à 8 K ; vérifiez que les performances annoncées valent encore à cet écart.","r":"EN 14511"},"geen_stooklijn":{"t":"Pas de régulation en fonction de l'extérieur","d":"Sans courbe de chauffe, l'installation tourne toute la saison à la température de dimensionnement, alors qu'à 7 °C extérieurs bien moins suffit. C'est un gain de rendement quasi gratuit, et l'omettre supprime une grande partie de l'avantage de la pompe à chaleur.","r":"—"},"regime_niet_vastgelegd":{"t":"Régime non fixé contractuellement","d":"Fixez départ, retour et écart de température avec des points de mesure à la réception. Sans cet accord, le régime glisse discrètement vers le haut pendant l'exécution et, après coup, plus personne n'est responsable du rendement décevant.","r":"—"},"tekort_zonder_bijstook":{"t":"Déficit de puissance sans appoint","d":"Aux conditions de base, la pompe à chaleur fournit environ {cap} kW, alors que la charge est plus élevée ; il manque {tekort} kW et aucun appoint n'est prévu. Choisissez un appareil plus grand ou prévoyez un appoint — mais calculez d'abord laquelle des deux options revient le moins cher sur la durée de vie.","r":"—"},"bivalentpunt_hoger":{"t":"Point de bivalence réel plus élevé que souhaité","d":"Le calcul place le point à {werkelijk} °C, contre {gewenst} °C souhaités ; la pompe à chaleur couvre alors environ {dekking} % du besoin annuel de chaleur. Un appareil légèrement plus grand déplace fortement ce point et réduit la part d'appoint coûteux.","r":"—"},"lage_dekking":{"t":"Faible couverture par la pompe à chaleur","d":"Environ {dekking} % du besoin annuel de chaleur provient de la pompe à chaleur ; le reste vient de l'appoint ({backup}). Avec un appoint électrique, cela signifie une facture annuelle nettement plus élevée que ne le suggère la brochure.","r":"—"},"elektrische_bijstook":{"t":"Appoint électrique d'environ {kw} kW","d":"Chaque kilowattheure en coûte un, là où la pompe à chaleur en fournit trois à cinq. Demandez combien d'heures de fonctionnement par an sont attendues et faites le calcul au tarif — souvent, une pompe à chaleur un peu plus grande se révèle moins chère en quelques années.","r":"—"},"aanuit_zonder_buffer":{"t":"Appareil tout ou rien sans ballon tampon","d":"Un appareil non modulant sans ballon tampon démarre et s'arrête sans cesse, ce qui coûte du rendement et de la durée de vie. Prévoyez environ {liter} litres, ou choisissez un appareil modulant.","r":"—"},"geen_regeneratie":{"t":"Géothermie sans régénération","d":"Un sous-sol que l'on ne fait que vider se refroidit au fil des années et le rendement baisse avec lui. Le refroidissement passif en été recharge le sous-sol ET fournit un froid quasi gratuit — c'est la raison la plus forte de choisir la géothermie, et elle est souvent oubliée dans l'offre.","r":"—"},"warmtenet_voorwaarden":{"t":"Conditions du réseau de chaleur non fixées","d":"Sur un réseau de chaleur, la température de retour maximale autorisée est la contrainte dure : elle est mesurée, elle est souvent assortie de pénalités, et elle détermine toute votre conception d'émission. Demandez les conditions de raccordement avant de choisir les émetteurs.","r":"—"},"cop_punten":{"t":"Rendement estimé à ce régime","d":"À {aan} °C de départ : COP {copOntwerp} aux conditions de base, {copMild} par température extérieure douce, moyenne saisonnière estimée {copSeizoen}. Il s'agit d'une approche de Carnot — demandez les valeurs certifiées à ces points et comparez.","r":"EN 14511 / EN 14825"},"sww_rendement":{"t":"L'eau chaude sanitaire pèse sur le rendement saisonnier","d":"À une température de stockage de {t} °C, la pompe à chaleur travaille à un COP de {copSww}, contre {copCv} pour le chauffage. Le besoin annuel de chaleur pour l'eau de puisage est d'environ {kwh} kWh, ce qui correspond à environ {elek} kWh d'électricité. Traitez cela comme un système à part : un module ECS instantané, une température de stockage plus basse ou un étage haute température séparé rapportent ici plus que n'importe quelle optimisation du chauffage.","r":"EN 14825"},"verswater_circulatie":{"t":"Module ECS instantané avec boucle de circulation","d":"Un module ECS instantané tire son avantage de l'absence d'eau chaude stagnante. Avec une boucle de circulation, celle-ci revient en partie, pertes continues comprises. Examinez si la circulation peut être commandée en fonction de l'horaire ou de la demande, et isolez fortement.","r":"—"},"legionella_elektrisch":{"t":"Cycle antilégionelle sur l'appoint électrique","d":"Le réchauffage périodique à 60 °C ou plus se fait en pratique presque toujours avec la résistance électrique, parce que la pompe à chaleur n'atteint pas cette température. Demandez combien de kilowattheures ce cycle coûte par an ; c'est souvent plus que prévu et cela s'évite avec un principe instantané.","r":"Législation nationale sur la légionelle"},"boilerspiraal":{"t":"Surface d'échange du ballon ECS","d":"Un serpentin trop petit pour une pompe à chaleur force la température de condensation vers le haut et coûte du rendement à chaque charge. Demandez la surface d'échange en m² et la puissance à votre propre température de départ — pas à celle d'une chaudière.","r":"—"},"circulatieverlies":{"t":"Pertes de la boucle de circulation","d":"Avec une boucle de circulation mal isolée, les pertes peuvent dépasser la consommation utile de puisage. Demandez une estimation de ces pertes ainsi qu'une isolation renforcée ; commandez, là où c'est possible, en fonction de l'horaire ou de la demande.","r":"—"},"voorrang_snel_systeem":{"t":"Priorité à l'eau sanitaire avec un système d'émission rapide","d":"Avec un chauffage à air pulsé ou des ventilo-convecteurs, l'arrêt du chauffage se remarque en moins de dix minutes. Fixez la durée maximale de l'interruption et si une émission minimale est maintenue.","r":"—"},"buffer_te_klein":{"t":"Volume tampon inférieur au volume calculé","d":"{gekozen} litres choisis contre environ {nodig} litres découlant du temps de fonctionnement minimal et du dégivrage. Un ballon tampon trop petit laisse malgré tout l'appareil faire des cycles courts ; cela coûte du rendement et de la durée de vie.","r":"—"},"geen_buffer":{"t":"Pas de ballon tampon pour un appareil qui ne module pas entièrement","d":"Demandez au fabricant le temps de fonctionnement minimal et le volume d'eau minimal dans l'installation. Avec un plancher chauffant, le contenu propre suffit souvent ; avec des radiateurs à robinets thermostatiques, presque jamais.","r":"—"},"evenwichtsfles":{"t":"Collecteur ouvert ou bouteille de découplage","d":"Une bouteille de découplage mal dimensionnée mélange départ et retour : la pompe à chaleur voit un retour trop élevé, module vers le bas et le rendement s'effondre — sans que rien ne soit en panne. Évitez la séparation hydraulique là où c'est possible, et faites-la calculer là où elle est indispensable.","r":"—"},"geen_inregeling":{"t":"Aucun équilibrage hydraulique prévu","d":"Sans équilibrage, le circuit le plus proche reçoit tout et le plus éloigné rien, et on compense cela par une température de départ plus élevée — précisément ce que vous vouliez éviter. C'est la différence entre une installation qui fonctionne à 35 °C et la même installation qui doit tourner à 45 °C.","r":"—"},"vulwater":{"t":"Eau de remplissage non traitée","d":"Le calcaire sur un échangeur à petits canaux coûte immédiatement de la puissance, et l'oxygène produit de la magnétite qui bouche pompes et vannes. La plupart des fabricants lient leur garantie à la qualité de l'eau de remplissage. Demandez une analyse à la réception et après un an.","r":"VDI 2035"},"vulwater_onbepaald":{"t":"Qualité de l'eau de remplissage encore indéterminée","d":"Fixez l'exigence avant la commande et reprenez-la dans le dossier de réception, avec les valeurs mesurées. Après coup, il n'est plus possible de démontrer avec quoi l'installation a été remplie.","r":"VDI 2035"},"geen_vuilafscheider":{"t":"Pas de séparateur de boues ni de séparateur d'air sur des conduites existantes","d":"Les conduites existantes contiennent de la magnétite et des boues qui partent vers le nouvel échangeur dès le premier démarrage. Un séparateur de boues magnétique et un séparateur d'air à microbulles juste en amont du générateur ne sont pas ici un luxe mais la condition pour conserver la garantie.","r":"—"},"glycol":{"t":"Glycol dans le système ({pct} %)","d":"Le glycol abaisse la capacité thermique et augmente la viscosité : plus de débit et nettement plus d'énergie de pompage pour la même puissance. Limitez-le au circuit où le gel peut réellement survenir et séparez celui-ci hydrauliquement.","r":"—"},"pompenergie":{"t":"Part élevée d'énergie de pompage","d":"Estimée à {kw} kW, soit environ {pct} % de la puissance de chauffage. L'énergie auxiliaire compte dans le rendement saisonnier réel et n'est que rarement mesurée. Vérifiez le point de fonctionnement des pompes et la perte de charge du réseau.","r":"—"},"expansievat":{"t":"Vase d'expansion d'environ {liter} litres","d":"Calculé pour un contenu de système de {volume} litres. Vérifiez la pression de gonflage par rapport à la hauteur statique et placez le vase à l'aspiration de la pompe.","r":"EN 12828"},"tweepijps_gelijktijdig":{"t":"Système deux tubes avec demande simultanée de chaud et de froid","d":"Les zones qui veulent chauffer et refroidir en même temps ne le peuvent pas avec une seule commutation saisonnière. Choisissez un quatre tubes, un réseau de source avec pompes à chaleur décentralisées, ou du VRF à récupération — sinon toute la mi-saison génère des plaintes.","r":"—"},"vrije_koeling_gemist":{"t":"Free cooling non exploité avec un régime de froid élevé","d":"À {t} °C de départ, le free cooling est possible dans nos régions pendant une grande partie de l'année, avec la seule énergie de pompage. C'est l'argument le plus fort pour placer haut le régime de froid ; exploitez-le.","r":"—"},"geen_terugwinning":{"t":"Demande simultanée de chaud et de froid sans récupération","d":"La chaleur issue du refroidissement est utilisable toute l'année pour l'eau sanitaire ou pour le chauffage d'autres zones. Un système à récupération se rentabilise ici presque toujours.","r":"—"},"koeltoren_legionella":{"t":"Tour de refroidissement humide — plan de gestion exigé","d":"Une tour de refroidissement humide est énergétiquement favorable et implique un plan de gestion de la légionelle, ainsi qu'une attention à son emplacement par rapport aux prises d'air de ce bâtiment et de celles des voisins.","r":"Législation nationale sur la légionelle"},"koudwater_te_koud":{"t":"Température d'eau glacée basse avec du refroidissement par rayonnement","d":"À {t} °C de départ, le refroidissement par rayonnement ou le noyau béton ne peut pas être exploité en toute sécurité en raison de la condensation, et la possibilité de free cooling est en outre perdue. Séparez les circuits : eau froide pour la déshumidification, eau plus chaude pour le rayonnement.","r":"—"},"aansluiting_te_klein":{"t":"Puissance de raccordement électrique insuffisante","d":"Estimation simultanée de {nodig} kW contre {beschikbaar} kW disponibles. Le renforcement prend des mois et coûte parfois plus que l'installation elle-même. Vérifiez-le avant la commande, et examinez si la pointe peut être étalée par la régulation.","r":"—"},"aansluiting_onbekend":{"t":"Puissance de raccordement électrique non renseignée","d":"C'est la surprise la plus fréquente d'un projet de pompe à chaleur. Demandez la puissance de raccordement disponible et additionnez pompe à chaleur, appoint, production d'eau sanitaire et éventuelle infrastructure de recharge pour l'heure la plus froide de l'année.","r":"—"},"propaan_binnen":{"t":"Propane (R290) en implantation intérieure","d":"Le R290 est fortement inflammable et plus lourd que l'air : il descend vers les locaux situés plus bas. Demandez la quantité de charge, le volume minimal du local, les exigences de ventilation et la distance aux caves, fosses et ouvertures — et faites-le avant de fixer le lieu d'implantation.","r":"EN 378 ; IEC 60335-2-40"},"geluidseis_onbekend":{"t":"Aucune exigence acoustique renseignée","d":"Le bruit des unités extérieures est, pour les pompes à chaleur, la plainte la plus fréquente et le motif de contrôle le plus fréquent. Recherchez la valeur limite applicable au point d'évaluation, et faites attention à la valeur de nuit — c'est justement la nuit que l'appareil continue de tourner.","r":"Conditions environnementales régionales"},"geluid_dichtbij":{"t":"Unité extérieure proche d'un point d'évaluation sans mesures","d":"À {d} m avec une exigence de {db} dB(A), une mesure quelconque est quasi certainement nécessaire. Attention : le mode nuit abaisse le bruit ET la puissance, précisément quand il fait le plus froid dehors — vérifiez par le calcul si le bâtiment le supporte.","r":"—"},"condens_buitendeel":{"t":"Évacuation des condensats de l'unité extérieure non organisée","d":"Une pompe à chaleur air produit, par temps de gel, des dizaines de litres de condensats par jour. Sans évacuation chauffée ni lit de gravier, cela gèle sous l'appareil et sur le sentier voisin — avec risque de chute et ventilateur bloqué à la clé.","r":"—"},"geen_octaafband":{"t":"Données par bande d'octave non demandées","d":"Une seule valeur en dB(A) ne suffit pas pour un calcul acoustique, et encore moins pour la composante basse fréquence, qui traverse les façades et gêne le plus.","r":"—"},"geen_vorstbeveiliging":{"t":"Protection antigel en cas de panne non organisée","d":"Que se passe-t-il en cas de défaut pendant la période de gel, et qui en est averti ? Dans un bâtiment contenant beaucoup d'eau dans la dalle, ce n'est pas une question théorique.","r":"—"},"geen_rendementsmeting":{"t":"Pas de comptage thermique ET électrique sur le générateur","d":"Sans ces deux compteurs, le rendement saisonnier réel ne peut pas être établi et toute discussion sur des performances décevantes est indécidable. C'est précisément pour cela que ces compteurs manquent si souvent — inscrivez-les dans le cahier des charges.","r":"—"},"hulpenergie_ongemeten":{"t":"Énergie auxiliaire non comptée séparément","d":"Pompes, dégivrage, électronique et circulation s'additionnent et expliquent souvent l'écart entre le rendement promis et le rendement mesuré. Un compteur séparé coûte peu et rend la discussion factuelle.","r":"—"},"geen_inregelrapport":{"t":"Aucun rapport d'équilibrage demandé","d":"Débits par circuit, mesurés et consignés. Sans ce rapport, il n'est pas démontrable que l'installation peut tourner au régime prévu, et personne n'a de raison de le vérifier.","r":"—"},"geen_nulmeting":{"t":"Pas de mesure des performances à la réception","d":"Départ, retour, débit, puissance absorbée et puissance fournie dans un état de fonctionnement défini. Sans mesure initiale, il est impossible d'établir par la suite si quelque chose a changé.","r":"—"},"geen_nameting":{"t":"Pas de contre-mesure après la première saison de chauffe","d":"Le rendement réel n'apparaît qu'après une saison entière. Un rendez-vous de retour pour ajuster la courbe de chauffe et les réglages procure généralement dix à vingt pour cent d'économie — plus que la plupart des choix de composants.","r":"—"},"scop_zonder_garantie":{"t":"Exigence de rendement sans garantie de performance","d":"Un rendement saisonnier demandé sans limites de mesure, méthode de mesure et conséquences convenues en cas de non-atteinte est un souhait, pas une exigence. Fixez ce qui se passe s'il n'est pas atteint.","r":"—"},"doorlooptijd_boringen":{"t":"Délais de permis et de forage","d":"La géothermie exige un permis, parfois un test de réponse et toujours une planification avec une firme de forage. Ce délai détermine le planning plus souvent que le délai de livraison des appareils. Lancez la démarche avant la commande.","r":"Réglementation sur la géothermie"},"geen_selectierapport":{"t":"Aucun rapport de sélection demandé avec l'offre","d":"Demandez les performances à votre propre température de départ, à votre débit et à votre température de source. Ce seul document rend, pour la première fois, comparables les offres de fabricants différents — sans lui, vous comparez des brochures.","r":"—"},"profiel_note":{"t":"Point d'attention pour ce type de bâtiment","d":"{note}","r":"{basis}"},"wand_niet_gedimensioneerd":{"t":"Le chauffage mural n'est pas calculé ici","d":"Le chauffage mural est coché, mais cette feuille ne dimensionne que le plancher chauffant. L'EN 1264-5 utilise pour les parois des coefficients propres qui ne sont pas repris ici ; faites donc déterminer séparément l'émission et la température d'eau. Maintenez la température de surface sous environ {max} °C et tenez compte de l'emplacement des meubles et des conduites.","r":"EN 1264-5"}},"mot":{"last":{"m":"Charge de dimensionnement","w":"Point de départ de toutes les puissances et de la droite du bâtiment sur laquelle se détermine le point de bivalence.","d":"Chauffage {kw} kW ({spec} W/m²), refroidissement {kwK} kW ; de {tOut} °C extérieurs à {tIn} °C intérieurs. Coefficient de déperdition thermique {ua} kW/K.","n":"EN 12831"},"regime":{"m":"Régime de température","w":"Le fil rouge : il relie l'émission et la production et détermine le rendement.","d":"{aan}/{ret} °C, écart de température {dt} K, débit d'eau {debiet} m³/h.","n":"—"},"opwekker_wp":{"m":"Pompe à chaleur","w":"Type {type}, choisi au régime fixé ci-dessus.","d":"Nominal {kw7} kW à A7/W35, aux conditions de base encore {capOntwerp} kW. COP {copOntwerp} au point de dimensionnement, estimation saisonnière {copSeizoen}. Point de bivalence {biv} °C, couverture d'environ {dekking} % du besoin annuel de chaleur.","n":"EN 14511 / EN 14825"},"opwekker_overig":{"m":"Production","w":"Type : {type}.","d":"Puissance de dimensionnement {kw} kW.","n":"—"},"bijstook":{"m":"Appoint","w":"Couvre le déficit sous le point de bivalence ; stratégie : {strategie}.","d":"Nécessaire {kw} kW, type : {type}.","n":"—"},"afgifte_rad":{"m":"Émission — {type}","w":"Fournit, au régime choisi, {pct} % de la puissance nominale selon EN 442.","d":"Pour couvrir la charge, environ {nodig} kW nominaux sont requis.","n":"EN 442"},"afgifte_vloer":{"m":"Plancher chauffant","w":"Émission de base à basse température ; limitée par la température de surface admissible.","d":"Demandé {nodig} W/m² sur un maximum de {max} W/m² ; température de surface {opp} °C, température d'eau nécessaire environ {tmed} °C avec un revêtement de R = {r} m²K/W.","n":"EN 1264"},"afgifte_tabs":{"m":"Activation du noyau béton","w":"Porte la charge de base grâce à la masse du bâtiment ; lente et autorégulante.","d":"Demandé {warm} W/m² de chaleur sur un maximum de {maxWarm}, et {koud} W/m² de froid sur un maximum de {maxKoud}.","n":"ISO 11855"},"sww":{"m":"Eau chaude sanitaire","w":"Système distinct avec son propre niveau de température, moins favorable ; type : {systeem}.","d":"{liter} l/jour à {t} °C, {kwh} kWh/jour et environ {jaar} kWh/an. COP {cop}, soit environ {elek} kWh d'électricité par an.","n":"—"},"buffer":{"m":"Ballon tampon","w":"Comble le temps de fonctionnement minimal du générateur et fournit le volume nécessaire au dégivrage.","d":"Conseillé {liter} litres pour un temps de fonctionnement minimal de {looptijd} min ; pour le seul dégivrage, {ontdooi} litres suffiraient. Configuration : {mode}.","n":"—"},"expansie":{"m":"Vase d'expansion","w":"Absorbe la dilatation de l'eau et maintient la pression dans la plage de service.","d":"Environ {liter} litres pour un contenu de système de {volume} litres.","n":"EN 12828"},"energie":{"m":"Bilan annuel (indicatif)","w":"Ordre de grandeur pour comparer des variantes, pas pour facturer.","d":"Besoin de chaleur {warmte} kWh/an ; électricité chauffage {elek} kWh, eau sanitaire {swwElek} kWh, ensemble environ {totaal} kWh.","n":"Approche par degrés-jours"}},"sec":{"project":{"title":"Projet et bâtiment","intro":"De quel bâtiment s'agit-il, quelle est la qualité de l'enveloppe et qui l'utilise ? La qualité de l'enveloppe détermine la charge, et la charge détermine si un régime de basse température est seulement réalisable."},"belasting":{"title":"Charges","intro":"La puissance de dimensionnement, et non la puissance de la chaudière existante. Une chaudière est presque toujours largement surdimensionnée ; celui qui reprend ce chiffre achète une pompe à chaleur de deux tailles trop grande, qui module donc mal."},"afgifte":{"title":"Systèmes d'émission","intro":"Ce qui est installé dans le local détermine la température que le générateur doit fournir — et non l'inverse. Ce bloc vient donc avant le choix de la pompe à chaleur. Le calcul montre ce qu'un radiateur existant fournit réellement encore à régime bas."},"regime":{"title":"Régime de température","intro":"Le fil rouge de toute la conception. Chaque degré en moins côté départ apporte environ 2 à 3 pour cent de rendement en plus à la pompe à chaleur — et coûte de la surface d'émission. Ici, vous rendez cet arbitrage explicite au lieu de le laisser se faire tout seul."},"opwekking":{"title":"Production de chaleur","intro":"Ce n'est que maintenant que vient le tour du générateur, car la température qu'il doit fournir est désormais fixée. Demandez toujours les performances à votre régime, pas aux conditions normalisées du dépliant."},"koude":{"title":"Production de froid","intro":"Le refroidissement est rarement un système isolé. La question n'est pas seulement de savoir d'où vient le froid, mais aussi où va la chaleur — et si cette chaleur est utile ailleurs dans le bâtiment."},"bivalentie":{"title":"Bivalence, appoint et sécurité","intro":"Une pompe à chaleur qui couvre seule toute la charge de dimensionnement est trop grande le reste de l'année. Une pompe trop petite laisse le bâtiment froid. Le point de bivalence est l'endroit où vous posez cet arbitrage en connaissance de cause."},"sww":{"title":"Eau chaude sanitaire","intro":"Le poste qui fait le plus souvent échouer toute la conception basse température. Le chauffage demande 35 °C, l'eau sanitaire 55 à 60 °C — la même pompe à chaleur y délivre près de moitié moins de rendement. Traitez-la comme un système à part."},"hydraulica":{"title":"Hydraulique, ballon tampon et côté eau","intro":"C'est là que la plupart des installations de pompe à chaleur se cassent réellement. Une séparation hydraulique mal placée ou un ballon tampon au mauvais endroit détruit l'écart de température, et donc le rendement, sans que rien ne soit en panne."},"distributie":{"title":"Distribution et zonage","intro":"Comment l'énergie du générateur parvient jusqu'au local, et où se situent les limites de responsabilité et de comptage. Dans les installations collectives, c'est aussi une question juridique, pas seulement technique."},"regeling":{"title":"Régulation et pilotage","intro":"Sur une chaudière, la régulation corrige les erreurs de conception ; sur une pompe à chaleur, elle les amplifie. Émettre lentement, rester bas et anticiper : voilà l'essentiel ici."},"energie":{"title":"Énergie, comptage et tarifs","intro":"Ce que l'installation va réellement coûter dépend autant des tarifs et de la simultanéité que du rendement. Ce bloc rend l'exploitation visible à côté de l'investissement."},"opstelling":{"title":"Implantation, bruit et sécurité","intro":"L'endroit où sont placés les appareils détermine s'ils peuvent y être placés. Le bruit des unités extérieures est, pour les pompes à chaleur, la plainte la plus fréquente et le motif de procédure de contrôle le plus fréquent."},"normen":{"title":"Normes, permis et primes","intro":"Ce qui est légalement obligatoire et ce qui est financièrement possible. Les deux comportent des délais de traitement qui déterminent le planning — plus souvent que le délai de livraison des appareils."},"uitvoering":{"title":"Exécution, réception et gestion","intro":"Une installation de pompe à chaleur qui n'a pas été équilibrée n'atteint jamais son rendement — et personne ne le remarque, car elle chauffe quand même. Ce bloc fixe la manière dont vous, vous le remarquerez."}},"q":{"prj_name":{"label":"Nom du projet"},"prj_client":{"label":"Maître d'ouvrage","help":"Qui décide de l'arbitrage entre investissement et coûts d'exploitation ? Chez un investisseur qui met en location, ces deux postes incombent à des parties différentes — cela change tout l'arbitrage."},"prj_location":{"label":"Localité","help":"Détermine la température extérieure de base, les degrés-jours et la disponibilité d'un réseau de chaleur ou de la géothermie."},"prj_ref":{"label":"Référence"},"prj_author":{"label":"Établi par"},"prj_date":{"label":"Date"},"geb_type":{"label":"Type de bâtiment","help":"Pilote les valeurs de départ pour la charge, le régime et la simultanéité, ainsi que la question de savoir s'il faut refroidir."},"prj_aard":{"label":"Nature du projet","help":"En cas de remplacement du seul générateur, le système d'émission est déjà fixé, et le régime avec lui. C'est précisément la situation dans laquelle une pompe à chaleur sur radiateurs existants déçoit — cette feuille fait le calcul pour vous.","options":{"nieuwbouw":"Construction neuve","renovatie":"Rénovation avec amélioration de l'enveloppe","vervanging":"Remplacement du générateur, émission existante","uitbreiding":"Extension"}},"geb_area":{"label":"Surface de plancher chauffée"},"geb_volume":{"label":"Volume chauffé","help":"Pour le temps de relance et pour les systèmes à air."},"geb_bouwjaar":{"label":"Année de construction","help":"Indication grossière de la qualité de l'enveloppe lorsqu'aucun calcul n'est disponible."},"geb_schil":{"label":"Qualité de l'enveloppe du bâtiment","help":"La question la plus importante de ce bloc. Une enveloppe mal isolée exige une température de départ élevée, et c'est précisément là qu'une pompe à chaleur donne le moins. Isoler avant de remplacer le générateur est presque toujours l'ordre le moins cher.","options":{"passief":"Passif / très bien isolé","goed":"Bon — construction neuve récente","gemiddeld":"Moyen — isolé après coup","matig":"Médiocre — isolation limitée","slecht":"Mauvais — non isolé"}},"geb_luchtdicht":{"label":"Étanchéité à l'air (n50 ou v50)","help":"Avec une enveloppe non étanche, la charge d'infiltration représente une part appréciable de la puissance de dimensionnement, et cette charge dépend en outre du vent — elle n'est donc pas régulable."},"geb_massa":{"label":"Inertie thermique","help":"Détermine si une régulation lente fonctionne. L'activation du noyau béton exige de la masse ; dans un bâtiment léger avec faux plafond, elle n'a aucun effet et constitue de l'argent jeté par les fenêtres.","options":{"zwaar":"Lourde — béton, apparent","gemiddeld":"Moyenne","licht":"Légère — ossature bois, faux plafond"}},"geb_gebruik":{"label":"Profil d'occupation","help":"En cas d'occupation fortement intermittente, un système lent comme le plancher chauffant ou le noyau béton est inadapté : il ne peut ni monter en température à temps, ni s'arrêter à temps.","options":{"continu":"Continu, 24 h/24 et 7 j/7","kantooruren":"Heures de bureau","onderbroken":"Fortement intermittent","seizoen":"Saisonnier"}},"geb_zones":{"label":"Nombre de zones thermiques","help":"Zones dont l'occupation, l'orientation ou les exigences diffèrent. Chaque zone qui veut chauffer et refroidir en même temps pousse le choix du système vers un quatre tubes ou vers une pompe à chaleur à récupération."},"geb_gelijktijdig":{"label":"Des zones peuvent-elles chauffer et refroidir simultanément ?","help":"Soleil au sud et ombre au nord, ou local serveurs à côté de bureaux. Si oui, un système deux tubes à commutation saisonnière est insuffisant, aussi avantageux paraisse-t-il.","options":{"ja":"Oui","nee":"Non"}},"bel_basis":{"label":"Sur quoi la puissance est-elle basée ?","help":"Un calcul pièce par pièce selon EN 12831 est la seule base sur laquelle vous pouvez contrôler l'émission par local. Un ratio sert à une première estimation ; des données de consommation sur trois ans sont souvent plus fiables qu'un calcul reposant sur de mauvaises hypothèses.","options":{"berekening":"Calcul de déperditions pièce par pièce","opgegeven":"Puissance totale imposée","specifiek":"Ratio par m² (indicatif)","verbruik":"Déduite de la consommation réelle"}},"bel_spec_heat":{"label":"Puissance de chauffage spécifique","help":"Construction passive 10–20, construction neuve récente 30–40, isolé après coup 45–70, non isolé 90–140 W/m². N'utilisez ceci que pour une première estimation."},"bel_heat_kw":{"label":"Puissance de chauffage","help":"Sans surpuissance de relance ; celle-ci s'indique séparément ci-dessous, de sorte que son origine reste visible."},"bel_opwarm":{"label":"Surpuissance de relance après interruption","help":"Nulle en fonctionnement continu. Avec un abaissement de nuit quotidien dans un bâtiment lourd, la surpuissance peut atteindre 20–30 % — et c'est alors elle qui détermine toute la puissance du générateur. Envisagez un préchauffage plus long plutôt que davantage de puissance."},"bel_cooling":{"label":"Y a-t-il refroidissement ?","options":{"ja":"Oui","nee":"Non"}},"bel_spec_cool":{"label":"Puissance frigorifique spécifique","help":"Bureau à vitrage normal 40–60 W/m², avec beaucoup de vitrage ou des charges internes élevées 70–100. Une protection solaire extérieure abaisse cette valeur plus fortement que n'importe quelle installation."},"bel_cool_kw":{"label":"Puissance frigorifique"},"bel_latent":{"label":"Part de charge frigorifique latente","help":"Déterminant pour le choix du système. Le refroidissement par rayonnement et le noyau béton n'absorbent que la chaleur sensible ; l'humidité doit être évacuée ailleurs — le plus souvent par le traitement d'air. Qui l'oublie obtient de la condensation au plafond."},"bel_intern":{"label":"Charge thermique interne","help":"Personnes, éclairage, équipements. Dans un bureau moderne, c'est souvent la charge frigorifique dominante et elle réduit sensiblement le besoin de chauffage en journée."},"bel_proces":{"label":"Charges de procédé ou charges particulières","help":"Local serveurs, cuisine, ligne de production, piscine. Ce sont souvent des charges qui demandent du refroidissement toute l'année — et donc une source de chaleur gratuite pour le reste du bâtiment."},"bel_gelijktijdigheid":{"label":"Coefficient de simultanéité","help":"Avec de nombreux logements sur un seul générateur, vous pouvez compter moins que la somme des pointes. Avec un seul bâtiment et une seule zone, non : la pointe y survient bel et bien partout en même temps."},"cnd_t_design":{"label":"Température extérieure de base","help":"Pour la Belgique, généralement −8 à −11 °C selon la zone et la masse du bâtiment. Détermine, avec la charge, la droite du bâtiment sur laquelle se trouve le point de bivalence."},"cnd_t_room":{"label":"Température ambiante en chauffage"},"cnd_t_room_cool":{"label":"Température ambiante en refroidissement"},"cnd_dewpoint_room":{"label":"Point de rosée le plus élevé attendu dans le local","help":"La limite inférieure de toute surface refroidie. À 25 °C et 55 % HR, le point de rosée se situe autour de 15 °C — un plafond rafraîchissant à 16 °C de départ en est dangereusement proche. Sans déshumidification, le refroidissement par rayonnement n'est pas régulable en toute sécurité."},"cnd_degree_days":{"label":"Degrés-jours","help":"Pour la Belgique, généralement autour de 2000 K·d, base 15/15. Uniquement pour l'estimation annuelle indicative."},"afg_types":{"label":"Quels systèmes d'émission sont prévus ou présents ?","help":"Les combinaisons sont normales : plancher chauffant pour la charge de base et ventilo-convecteurs pour la pointe et pour le refroidissement. Indiquez tout ce qui sera installé, car le plus petit dénominateur commun détermine le régime de tout le circuit — sauf si vous travaillez avec des groupes séparés et des circuits mélangeurs.","options":{"vloer":"Plancher chauffant","wand":"Mur chauffant","tabs":"Activation du noyau béton","radiator":"Radiateurs","convector":"Convecteurs","vloerconvector":"Convecteurs de sol","ventilo":"Ventilo-convecteurs (fancoils)","koelplafond":"Plafond rafraîchissant / plafond climatique","balk":"Unités à induction / poutres climatiques","paneel":"Panneaux rayonnants","luchtverwarmer":"Chauffage à air pulsé via le traitement d'air","vrf":"Unités intérieures VRF (à détente directe)"}},"afg_bestaand":{"label":"Les émetteurs existants sont-ils réutilisés ?","help":"Si oui : faites relever pièce par pièce la puissance nominale installée. Sans cet inventaire, il est impossible d'établir si le régime choisi est atteignable, et toute promesse relative à la pompe à chaleur est un pari.","options":{"nee":"Non, tout est neuf","deels":"En partie","ja":"Oui, intégralement"}},"afg_vloer_share":{"label":"Part de la charge assurée par le plancher ou le mur chauffant"},"afg_vloer_coverage":{"label":"Surface de pose disponible","help":"On ne pose pas sous les armoires fixes, les blocs de cuisine et les appareils. Avec 60 % de surface disponible, la même chaleur doit passer par moins de mètres carrés, et la température d'eau monte donc — souvent juste assez pour effacer l'avantage de la pompe à chaleur."},"afg_vloer_r":{"label":"Résistance thermique du revêtement de sol","help":"Carrelage environ 0,02, stratifié avec sous-couche 0,10–0,15, moquette jusqu'à 0,20 m²K/W. C'est le tueur de projet le plus silencieux qui soit : le même plancher chauffant exige, sous moquette, une température d'eau supérieure de dix degrés à celle nécessaire sous carrelage. Fixez la résistance maximale admissible dans le cahier des charges et communiquez-la au maître d'ouvrage."},"afg_vloer_spacing":{"label":"Pas de pose","help":"Un pas plus faible abaisse la température d'eau nécessaire. 10 cm au lieu de 15 cm fait gagner quelques degrés et coûte peu en construction neuve ; après coup, cela ne se modifie plus."},"afg_tabs_share":{"label":"Part de la charge assurée par l'activation du noyau béton","help":"Le noyau béton fournit environ 30–40 W/m² en chaleur et 40–50 W/m² en froid, et réagit en heures, pas en minutes. Il couvre la charge de base ; la pointe et la régulation par local doivent provenir d'un système plus rapide."},"afg_koelplafond_share":{"label":"Part de la charge frigorifique assurée par le plafond rafraîchissant"},"afg_regelbaar":{"label":"Régulation par local","help":"Avec le plancher chauffant et le noyau béton, la régulation par local n'agit que lentement ; surréguler conduit à des dépassements et à des cycles courts. Sur une pompe à chaleur, laisser circuler à une température basse pilotée en fonction de l'extérieur vaut généralement mieux qu'un tout ou rien par local.","options":{"thermostaat":"Thermostat d'ambiance par zone","kraan":"Robinets thermostatiques","centraal":"Uniquement central, en fonction de l'extérieur","geen":"Aucune régulation individuelle"}},"afg_meting":{"label":"Émission existante inventoriée par local ?","help":"Type, dimensions et puissance nominale par élément. C'est le travail que personne ne veut faire et qui fait la différence entre une installation qui fonctionne et une installation qui ne fonctionne pas.","options":{"ja":"Oui","nee":"Non"}},"reg_t_flow":{"label":"Température de départ en chauffage aux conditions de base","help":"Plancher chauffant 30–38, noyau béton 26–32, radiateurs neufs 45–55, radiateurs existants souvent 70–80 °C. Ce chiffre décide quels générateurs restent en lice."},"reg_t_return":{"label":"Température de retour en chauffage","help":"L'écart de température détermine le débit d'eau et, par là, les diamètres de conduites et l'énergie de pompage. Une pompe à chaleur travaille généralement avec 5 K d'écart, une chaudière avec 20 K — soit un facteur quatre sur le débit, avec une différence considérable sur le dimensionnement des conduites."},"reg_weersafhankelijk":{"label":"Régulation de la température de départ en fonction de l'extérieur ?","help":"Un gain de rendement quasi gratuit : à 7 °C extérieurs, un départ bien plus bas qu'à −8 °C suffit. Sans courbe de chauffe, l'installation tourne toute la saison à la valeur de dimensionnement et une pompe à chaleur perd une grande partie de son avantage.","options":{"ja":"Oui","nee":"Non"}},"reg_t_flow_cool":{"label":"Température de départ en refroidissement","help":"Ventilo-convecteurs avec déshumidification 6–8 °C, refroidissement par rayonnement et noyau béton 16–18 °C. Une température d'eau glacée élevée rend possibles le free cooling et une machine frigorifique performante, mais exclut la déshumidification — c'est un choix de système, pas un réglage."},"reg_t_return_cool":{"label":"Température de retour en refroidissement"},"reg_glycol_pct":{"label":"Pourcentage de glycol","help":"Le glycol abaisse la capacité thermique et augmente la viscosité : à 30 %, environ 10 % de débit en plus et nettement plus d'énergie de pompage pour la même puissance. N'en utilisez que là où le gel peut réellement survenir, et séparez alors ce circuit hydrauliquement."},"reg_menggroepen":{"label":"Circuits mélangeurs pour des régimes différents ?","help":"Nécessaires dès que plancher chauffant et radiateurs sont raccordés au même générateur. Attention : le générateur doit alors fournir la température la plus élevée et le circuit mélangeur l'abaisse localement — le rendement suit donc les radiateurs, pas le plancher. Examinez si les radiateurs ne peuvent pas être remplacés.","options":{"ja":"Oui","nee":"Non"}},"reg_dt_marge":{"label":"Fixer le régime contractuellement avec des points de mesure ?","help":"Départ, retour et écart de température aux conditions de base, à mesurer à la réception. Sans cet accord, le régime glisse discrètement vers le haut pendant l'exécution et, après coup, plus personne n'est responsable du rendement décevant.","options":{"ja":"Oui","nee":"Non"}},"opw_type":{"label":"Type de générateur","help":"Les systèmes couplés au sol offrent toute l'année une source stable et donc un rendement beaucoup plus régulier, mais exigent un permis, de la place et un investissement nettement plus élevé. L'air/eau est plus simple et connaît son point faible justement par temps de gel — précisément quand le bâtiment demande le plus.","options":{"lucht_water":"Pompe à chaleur air/eau","grond_boring":"Pompe à chaleur géothermique (eau glycolée/eau) — forages verticaux","grond_horizontaal":"Pompe à chaleur géothermique (eau glycolée/eau) — réseau horizontal","water_water":"Pompe à chaleur eau/eau — nappe ou eau de surface","afvoerlucht":"Pompe à chaleur sur air extrait","lucht_lucht":"Pompe à chaleur air/air","hybride":"Hybride — pompe à chaleur avec chaudière","gasketel":"Chaudière gaz à condensation","elektrisch":"Chauffage électrique par résistance","warmtenet":"Réseau de chaleur / chauffage urbain","wkk":"Cogénération","biomassa":"Chaudière biomasse","zon_thermisch":"Capteurs solaires thermiques (en appoint)"}},"opw_hp_kw":{"label":"Puissance de la pompe à chaleur à A7/W35","help":"Les fabricants donnent la puissance dans des conditions favorables. Demandez le tableau complet : puissance ET COP à A−7/W45, A2/W35, A7/W35 et à votre propre température de départ. L'écart entre ces points est plus grand que ne le suggèrent la plupart des offres."},"opw_source_t":{"label":"Température de source aux conditions de base","help":"Pour l'air, c'est la température extérieure de base. Pour le sol, généralement 0 à 5 °C, pour la nappe 10 à 12 °C. Laissez vide pour la déduire du type de source."},"opw_modulatie":{"label":"Régulation de la puissance","help":"Demandez la puissance minimale en modulation, pas seulement le maximum. Une pompe à chaleur qui ne peut pas descendre sous 40 % de sa puissance va faire des cycles courts au printemps et en automne — cela coûte du rendement et de la durée de vie, et un ballon tampon ne peut qu'atténuer le phénomène, pas le résoudre.","options":{"inverter":"En continu (inverter)","stappen":"Plusieurs étages","aan_uit":"Tout ou rien"}},"opw_koudemiddel":{"label":"Fluide frigorigène","help":"Le règlement F-gas évince du marché les fluides à PRG élevé ; R290 est de ce fait devenu de facto le standard des pompes à chaleur de plus petite taille. Le propane est fortement inflammable : cela impose des exigences quant au lieu d'implantation, aux distances par rapport aux ouvertures et à la cave ou à la fosse dans laquelle une fuite pourrait descendre.","options":{"R290":"R290 propane (A3)","R32":"R32 (A2L)","R454C":"R-454C (A2L)","R1234ze":"R-1234ze (A2L)","R744":"R-744 CO₂","R410A":"R-410A (A1)"}},"opw_max_temp":{"label":"Température de départ maximale de la pompe à chaleur","help":"Vérifiez que cette valeur est encore atteinte à la température de source la plus basse — beaucoup d'appareils n'atteignent leur maximum qu'aux températures extérieures douces, et c'est justement le moment où vous n'en avez pas besoin."},"opw_bron_detail":{"label":"Données de la source","help":"Nombre et profondeur des forages, ou surface du réseau horizontal, ou débit et température de l'eau souterraine. Demandez aussi le test de réponse thermique pour les projets plus importants, ainsi que le bilan annuel entre extraction et injection — un sous-sol que l'on ne fait que vider se refroidit au fil des années et le rendement baisse avec lui."},"opw_regeneratie":{"label":"Régénération du sous-sol prévue ?","help":"Le refroidissement passif en été recharge le sous-sol et fournit un froid quasi gratuit. C'est la raison la plus forte de choisir la géothermie — et elle est souvent oubliée dans l'offre.","options":{"ja":"Oui","nee":"Non"}},"opw_warmtenet_detail":{"label":"Conditions du réseau de chaleur","help":"Température de départ, température de retour garantie, pénalités en cas de retour trop élevé, puissance de raccordement et structure tarifaire. La température de retour maximale autorisée est la contrainte dure : elle détermine toute votre conception d'émission et elle est mesurée."},"opw_bestaand":{"label":"Production existante conservée ou supprimée","help":"En cas de remplacement par phases : que reste-t-il en place, comment est-ce intégré hydrauliquement et qui règle la transition ?"},"kou_type":{"label":"Source du froid","help":"Le géocooling passif ne consomme que l'énergie de pompage et recharge en même temps le sous-sol pour l'hiver. Il fournit des puissances limitées à une température d'eau élevée — exactement ce qui convient au noyau béton et au plafond rafraîchissant, et ce qui ne convient pas à la déshumidification.","options":{"reversibel":"Pompe à chaleur réversible","chiller":"Machine frigorifique séparée","passief_bodem":"Géocooling passif","vrije_koeling":"Free cooling avec aéroréfrigérant sec","vrf":"VRF avec récupération de chaleur","adiabatisch":"Refroidissement adiabatique","warmtenet_koude":"Réseau de froid","geen":"Pas de refroidissement actif"}},"kou_terugwinning":{"label":"Chauffer et refroidir simultanément avec récupération ?","help":"Dans un bâtiment doté d'un local serveurs, d'une cuisine ou d'une orientation nord-sud, la chaleur issue du refroidissement est utilisable toute l'année pour l'eau chaude sanitaire ou pour le chauffage. Cela exige un système à quatre tubes ou une pompe à chaleur à récupération, et cela se rentabilise presque toujours.","options":{"ja":"Oui","nee":"Non"}},"kou_condensor":{"label":"Évacuation de la chaleur de la machine frigorifique","help":"Une tour de refroidissement humide est la solution la plus favorable sur le plan énergétique et implique un plan de gestion de la légionelle, ainsi qu'une attention à son emplacement par rapport aux prises d'air. Rejeter la chaleur dans le sous-sol est presque toujours la meilleure option lorsque des forages existent déjà.","options":{"lucht":"Refroidie par air","droog":"Aéroréfrigérant sec à eau glycolée","adiabatisch_cond":"Assistée par voie adiabatique","nat":"Tour de refroidissement humide","bodem":"Vers le sous-sol","water":"Vers l'eau de surface ou l'eau souterraine"}},"kou_vrije_koeling":{"label":"Free cooling à basse température extérieure ?","help":"Avec un régime de froid de 16/18 °C, le free cooling est possible dans nos régions pendant une grande partie de l'année. C'est l'argument le plus fort pour placer haut le régime de froid — et il ne fonctionne que si le système d'émission s'y prête.","options":{"ja":"Oui","nee":"Non"}},"kou_ontvochtiging":{"label":"Où la déshumidification a-t-elle lieu ?","help":"La question qui fait ou défait le refroidissement par rayonnement. Sans déshumidification ailleurs, un plafond rafraîchissant ou un noyau béton ne peut jamais descendre sous le point de rosée ; la régulation doit donc limiter la température de surface — avec une perte de puissance précisément les jours les plus chauds et les plus humides.","options":{"lucht":"Dans le traitement d'air","ventilo":"Dans les ventilo-convecteurs","geen":"Nulle part — pas de déshumidification active"}},"biv_strategie":{"label":"Stratégie de bivalence","help":"Le mode parallèle maintient la pompe à chaleur en service et laisse l'appoint couvrir uniquement le déficit ; le mode alternatif l'arrête complètement. Avec une chaudière gaz en appoint, l'alternatif est parfois moins cher à l'exploitation ; avec un appoint électrique, quasiment jamais.","options":{"monovalent":"Monovalent — la pompe à chaleur couvre tout","parallel":"Bivalent parallèle — appoint à côté de la pompe à chaleur","alternatief":"Bivalent alternatif — bascule vers la chaudière","deels_parallel":"Partiellement parallèle, puis bascule"}},"biv_backup":{"label":"Type d'appoint","help":"L'appoint électrique est bon marché à l'achat et cher à l'usage : chaque kilowattheure en coûte un, là où la pompe à chaleur en fournit trois à cinq. Demandez combien d'heures par an il est censé fonctionner et faites le calcul — souvent, une pompe à chaleur un peu plus grande se révèle moins chère.","options":{"geen":"Aucun","elektrisch":"Résistance électrique","gasketel":"Chaudière gaz","warmtenet":"Réseau de chaleur","tweede_wp":"Deuxième pompe à chaleur"}},"biv_punt":{"label":"Point de bivalence souhaité","help":"À −5 °C, la pompe à chaleur couvre généralement plus de 90 % du besoin annuel de chaleur, tout en pouvant être sensiblement plus petite que la charge de dimensionnement. Cette feuille calcule le point réel à partir de vos propres données et l'affiche à côté de ce souhait."},"biv_redundantie":{"label":"Niveau de sécurité exigé en cas de panne","help":"Rarement nécessaire pour un logement ou un bureau, exigence dure pour un établissement de soins, un centre de données ou un procédé. Plusieurs appareils plus petits offrent la redondance ET un meilleur fonctionnement à charge partielle — souvent le meilleur choix face à un seul gros appareil.","options":{"geen":"Aucun — panne acceptable","gedeeltelijk":"Une puissance partielle doit subsister","volledig":"Redondance complète (n+1)"}},"biv_vorstbeveiliging":{"label":"Protection antigel du bâtiment organisée en cas de panne ?","help":"Que se passe-t-il en cas de défaut pendant la période de gel, et qui en est averti ? Dans un bâtiment à plancher chauffant contenant beaucoup d'eau dans la dalle, ce n'est pas une question théorique.","options":{"ja":"Oui","nee":"Non"}},"biv_smart_grid":{"label":"Pilotage sur la charge du réseau ou sur le tarif possible ?","help":"Heures de blocage du gestionnaire de réseau, tarifs dynamiques ou électricité photovoltaïque propre. Cela exige une capacité de stockage dans un ballon tampon ou dans la masse du bâtiment, ainsi qu'une régulation capable d'anticiper. Avec l'activation du noyau béton, cette masse est déjà là gratuitement.","options":{"ja":"Oui","nee":"Non"}},"dhw_aanwezig":{"label":"L'eau chaude sanitaire est-elle produite par cette installation ?","options":{"ja":"Oui","nee":"Non"}},"dhw_persons":{"label":"Nombre de personnes ou de points de puisage"},"dhw_l_person":{"label":"Consommation par personne et par jour","help":"Logement 35–50 l par personne à 55 °C, bureau bien moins, équipement sportif et soins nettement plus avec une pointe marquée."},"dhw_profiel":{"label":"Profil de puisage","help":"La pointe détermine le volume, la consommation journalière détermine la puissance. Dans un équipement sportif, c'est la pointe qui est dimensionnante et le stockage revient moins cher que la puissance.","options":{"woning":"Logement — pointes du matin et du soir","kantoor":"Bureau — faible et étalé","sport":"Sport — pointe courte et très élevée","zorg":"Soins — élevé et continu","horeca":"Horeca / cuisine"}},"dhw_t_store":{"label":"Température de stockage","help":"Chaque degré supplémentaire coûte du rendement à la pompe à chaleur. Un appareil instantané ou un module ECS instantané peut se contenter d'une température de stockage plus basse parce qu'il n'y a pas d'eau chaude stagnante — c'est souvent la solution la plus élégante à la question de la légionelle."},"dhw_t_cold":{"label":"Température d'eau froide"},"dhw_systeem":{"label":"Système","help":"Un module ECS instantané prépare à la demande et ne conserve pas d'eau chaude ; cela réduit le risque de légionelle et autorise une température de ballon plus basse. L'inconvénient est la forte demande de pointe à ce moment-là — le ballon ou l'échangeur doit pouvoir l'encaisser.","options":{"boiler":"Ballon de stockage à serpentin","verswater":"Module ECS instantané (production instantanée)","laadsysteem":"Système de charge avec échangeur externe","decentraal":"Décentralisé par logement ou par point de puisage","elektrisch_boiler":"Chauffe-eau électrique"}},"dhw_legionella":{"label":"Maîtrise de la légionelle","help":"La désinfection thermique exige périodiquement 60 °C ou plus dans toute l'installation, boucle de circulation comprise. C'est le moment où l'appoint électrique s'enclenche : demandez combien d'énergie cela coûte par an, car c'est souvent plus que prévu.","options":{"thermisch":"Désinfection thermique périodique","doorstroom":"Principe instantané, sans stockage","temperatuur":"Maintien permanent en température","alternatief":"Technique alternative"}},"dhw_circulatie":{"label":"Boucle de circulation présente ?","help":"Une boucle de circulation maintient l'eau chaude disponible et perd de la chaleur en continu — avec une conduite mal isolée, cette perte peut dépasser la consommation utile. Isolez fortement et commandez, là où c'est possible, en fonction de l'horaire ou de la demande.","options":{"ja":"Oui","nee":"Non"}},"dhw_voorrang":{"label":"Priorité de l'eau sanitaire sur le chauffage ?","help":"Usuel et rarement problématique, mais fixez combien de temps le chauffage peut s'interrompre. Avec l'activation du noyau béton, personne ne le remarque ; avec le chauffage à air pulsé, en moins de dix minutes.","options":{"ja":"Oui","nee":"Non"}},"dhw_zon":{"label":"Recourir à un chauffe-eau solaire ou au surplus photovoltaïque ?","help":"L'eau sanitaire est le stockage le plus simple pour votre propre électricité solaire, car la demande existe toute l'année. Demandez comment la régulation reconnaît le surplus et si elle relève alors temporairement la température de stockage.","options":{"ja":"Oui","nee":"Non"}},"hyd_scheiding":{"label":"Séparation hydraulique","help":"Une bouteille de découplage ou un collecteur ouvert mal dimensionné mélange départ et retour et détruit l'écart de température : la pompe à chaleur voit un retour trop élevé, module vers le bas et le rendement s'effondre. Évitez la séparation hydraulique là où c'est possible, et faites-la calculer là où elle est indispensable.","options":{"geen":"Aucune — un seul circuit","open_verdeler":"Collecteur ouvert / bouteille de découplage","buffer_serie":"Ballon tampon en série","buffer_parallel":"Ballon tampon en parallèle","wisselaar":"Échangeur à plaques"}},"hyd_buffer":{"label":"Ballon tampon","help":"Un ballon tampon résout deux problèmes différents que l'on confond souvent : les temps de fonctionnement trop courts du générateur, et le volume d'eau insuffisant pour le dégivrage. Seul le premier exige un grand volume ; pour le second, le contenu en eau de l'installation elle-même suffit souvent.","options":{"geen":"Pas de ballon tampon","serie":"En série dans le retour","parallel":"En parallèle","ontdooi":"Uniquement pour le dégivrage"}},"hyd_buffer_l":{"label":"Volume tampon prévu","help":"Laissez vide pour ne voir que la valeur calculée."},"hyd_min_run":{"label":"Temps de fonctionnement minimal du générateur","help":"Demandez cette valeur au fabricant — elle détermine directement le volume tampon. Un appareil qui doit tourner six minutes et ne peut évacuer sa chaleur que pendant deux minutes démarre dix fois par heure."},"hyd_buffer_dt":{"label":"Oscillation de température admissible dans le ballon tampon"},"hyd_system_l":{"label":"Contenu en eau de l'installation","help":"Conduites, émetteurs et appareils réunis. Avec un plancher chauffant, ce contenu est souvent suffisant pour absorber le dégivrage sans ballon tampon supplémentaire."},"hyd_pompen":{"label":"Pompes","help":"Demandez le point de fonctionnement réel, pas la hauteur manométrique maximale. Des pompes surdimensionnées consomment toute l'année et provoquent des bruits d'écoulement dans les émetteurs.","options":{"toerengeregeld":"À vitesse variable sur pression différentielle","constant":"À vitesse constante","debiet":"Régulées à débit constant"}},"hyd_head_kpa":{"label":"Perte de charge estimée du réseau","help":"Avec un régime de pompe à chaleur à faible écart de température, le débit est élevé et la perte de charge à l'avenant : c'est la raison pour laquelle il faut choisir des conduites plus larges qu'avec une chaudière lorsque l'écart est faible."},"hyd_inregeling":{"label":"Équilibrage des circuits","help":"Sans équilibrage, le circuit le plus proche reçoit tout et le plus éloigné rien, et on compense cela par une température de départ plus élevée — précisément ce que vous vouliez éviter. Les vannes indépendantes de la pression maintiennent aussi le débit en ordre à charge partielle.","options":{"statisch":"Statique, avec vannes d'équilibrage","dynamisch":"Vannes de réglage indépendantes de la pression","automatisch":"Auto-équilibrant","geen":"Non prévu"}},"hyd_p_static":{"label":"Hauteur statique / pression de gonflage"},"hyd_p_max":{"label":"Pression de service maximale"},"hyd_waterkwaliteit":{"label":"Traitement de l'eau de remplissage","help":"Le calcaire sur un échangeur à petits canaux coûte immédiatement de la puissance, et l'oxygène présent dans le système produit de la magnétite qui bouche pompes et vannes. Demandez une analyse d'eau à la réception et après un an ; c'est la garantie la moins chère qui soit.","options":{"ontzout":"Déminéralisée ou adoucie, avec analyse","inhibitor":"Avec inhibiteur","leidingwater":"Eau de distribution non traitée","nog_bepalen":"À déterminer"}},"hyd_ontluchting":{"label":"Purge automatique et séparation des boues prévues ?","help":"Séparateur d'air à microbulles et séparateur de boues magnétique juste en amont du générateur. Sur une installation comportant des conduites existantes, ce n'est pas un luxe mais la condition pour conserver la garantie.","options":{"ja":"Oui","nee":"Non"}},"hyd_vorst":{"label":"Protection antigel des unités extérieures et des conduites ?","help":"Pour une pompe à chaleur installée à l'extérieur : comment l'eau reste-t-elle en mouvement en cas de coupure de courant, et qu'advient-il de l'évacuation des condensats par temps de gel ? Un bac à condensats pris en glace déséquilibre le ventilateur.","options":{"ja":"Oui","nee":"Non"}},"dis_opzet":{"label":"Configuration de l'installation","help":"Le centralisé procure un effet d'échelle et un seul interlocuteur ; le décentralisé procure un décompte simple et aucune perte de distribution. La forme intermédiaire — source collective avec pompes à chaleur individuelles ou modules d'appartement — combine les deux et progresse fortement dans le logement.","options":{"centraal":"Centralisée — une seule production pour l'ensemble","decentraal":"Décentralisée — par unité ou par zone","collectief_individueel":"Source collective, émission individuelle","cluster":"Grappes par partie de bâtiment"}},"dis_leidingen":{"label":"Réseau de distribution","help":"Le quatre tubes autorise le chauffage et le refroidissement simultanés et coûte plus de place et d'argent. Un réseau de source à température modérée avec des pompes à chaleur par unité fait la même chose avec deux conduites, et il est de ce fait choisi de plus en plus souvent.","options":{"tweepijps":"Deux tubes avec commutation saisonnière","vierpijps":"Quatre tubes","tweepijps_wp":"Deux tubes avec pompes à chaleur décentralisées (réseau de source)"}},"dis_isolatie":{"label":"Isolation des conduites","help":"Sur un réseau basse température, les pertes sont plus faibles, mais en refroidissement l'étanchéité à la vapeur compte aussi : une conduite d'eau glacée sans finition pare-vapeur produit de la condensation à l'intérieur de l'isolant, et celle-ci ne devient visible que lorsque le plafond est mouillé.","options":{"zwaar":"Plus épaisse que la norme","norm":"Conforme à la norme","beperkt":"Limitée"}},"dis_tracelengte":{"label":"Longueur de tracé estimée","help":"Sur une longue distribution horizontale, les pertes de distribution peuvent absorber une part appréciable de la production, surtout à faible taux d'occupation."},"dis_afleverset":{"label":"Modules d'appartement par unité ?","help":"Fixez ce que contient le module : comptage, régulation, production sanitaire, protection contre le retour d'eau — ainsi que qui l'entretient et qui en détient la clé.","options":{"ja":"Oui","nee":"Non"}},"dis_meting_eenheid":{"label":"Comptage par unité exigé ?","help":"Souvent légalement obligatoire dans les installations collectives. Déterminez tôt où viennent les compteurs, car ils déterminent l'agencement de tout le réseau de conduites.","options":{"ja":"Oui","nee":"Non"}},"dis_toegang":{"label":"Accessibilité des conduites et des collecteurs","help":"Les collecteurs placés dans des armoires ou dans des faux plafonds doivent rester accessibles pour l'équilibrage et l'entretien. Ce qui se trouve derrière un mur maçonné ne sera plus jamais équilibré."},"ctl_leverancier":{"label":"Origine de la régulation","help":"Dans une solution mixte, la régulation de la pompe à chaleur se bat avec celle du bâtiment : toutes deux veulent fixer la température de départ. Établissez qui commande quelle grandeur.","options":{"fabriek":"Régulation d'usine du générateur","gbs":"Système de gestion technique du bâtiment","gemengd":"Mixte"}},"ctl_protocol":{"label":"Protocole de communication","help":"Un protocole propriétaire signifie une dépendance à une seule partie pour toute la durée de vie. Demandez la liste des points avec les droits de lecture ET d'écriture au moment de l'offre.","options":{"geen":"Aucun","modbus_rtu":"Modbus RTU","modbus_tcp":"Modbus TCP","bacnet":"BACnet","knx":"KNX","fabrikant":"Protocole propriétaire du fabricant"}},"ctl_stooklijn":{"label":"Courbe de chauffe réglable et documentée ?","help":"Demandez la courbe de chauffe réglée dans le dossier de réception, avec les températures ambiantes correspondantes. Sans ce document, plus personne ne l'optimisera jamais.","options":{"ja":"Oui","nee":"Non"}},"ctl_functies":{"label":"Fonctions de régulation exigées","help":"La surveillance du point de rosée n'est pas une option dès qu'il y a du refroidissement par rayonnement dans le bâtiment : sans sonde sur le départ et dans le local, le plafond goutte au premier jour lourd.","options":{"weersafhankelijk":"Régulation du départ en fonction de l'extérieur","nachtverlaging":"Abaissement ou coupure de nuit","optimale_start":"Optimisation du démarrage","zomer_winter":"Commutation été-hiver automatique","dauwpunt":"Surveillance du point de rosée en refroidissement","vrije_koeling_ctl":"Free cooling automatique","sww_voorrang":"Priorité à l'eau chaude sanitaire","legionella":"Cycle antilégionelle","pv_sturing":"Pilotage sur l'électricité photovoltaïque propre","tarief":"Pilotage sur le tarif ou sur un signal du réseau","vorst":"Protection antigel","storingsmelding":"Report d'alarme à distance"}},"ctl_zonering":{"label":"Régulation par zone","help":"La régulation par local sonne bien et se retourne contre vous en cas d'émission lente : les circuits qui se ferment élèvent la température dans les autres et font faire des cycles courts à la pompe à chaleur. Envisagez une circulation permanente à basse température avec limitation plutôt qu'une fermeture des circuits.","options":{"thermostaat_zone":"Thermostat par zone","per_ruimte":"Par local","centraal_ctl":"Uniquement central"}},"ctl_terugmelding":{"label":"Retour d'information sur le rendement réel ?","help":"Un compteur d'énergie thermique plus un compteur électrique sur la pompe à chaleur donnent le rendement saisonnier réel. Sans ces deux compteurs, toute discussion sur des performances décevantes est indécidable — et c'est précisément pour cela qu'ils manquent si souvent.","options":{"ja":"Oui","nee":"Non"}},"ctl_alarmen":{"label":"Alarmes et suivi","help":"Quels défauts doivent aboutir où, dans quel délai, et qui intervient ? Une pompe à chaleur qui s'arrête en novembre et n'est remarquée qu'en décembre a laissé tourner l'appoint pendant un mois."},"ene_elek_aansluiting":{"label":"Puissance de raccordement électrique disponible","help":"Souvent la surprise du projet : une pompe à chaleur avec appoint électrique demande un raccordement nettement plus important, et le renforcement prend des mois et coûte parfois plus que l'installation. Vérifiez-le avant de choisir une solution."},"ene_gelijktijdig_elek":{"label":"Puissance électrique de pointe simultanée estimée","help":"Pompe à chaleur, appoint, production sanitaire et éventuellement infrastructure de recharge réunis, à l'heure la plus froide de l'année."},"ene_pv":{"label":"Puissance de l'installation photovoltaïque propre","help":"L'électricité solaire et le besoin de chaleur ne coïncident pas dans le temps ; le recouvrement se situe au printemps et en automne, ainsi que sur l'eau sanitaire. Ne calculez pas avec des moyennes annuelles mais avec la simultanéité."},"ene_opslag":{"label":"Stockage électrique présent ou prévu ?","options":{"ja":"Oui","nee":"Non"}},"ene_tarief_elek":{"label":"Tarif de l'électricité"},"ene_tarief_gas":{"label":"Tarif du gaz","help":"Le rapport entre les deux tarifs détermine à partir de quel rendement une pompe à chaleur est moins chère qu'une chaudière. Avec un rapport de quatre, ce n'est qu'au-delà d'un rendement saisonnier de quatre — faites explicitement ce calcul au lieu de le supposer."},"ene_capaciteitstarief":{"label":"Un tarif de capacité (pointe) s'applique-t-il ?","help":"Là où la facturation se fait sur la pointe mensuelle, il vaut la peine d'étaler l'appoint et de placer la production sanitaire hors pointe. C'est une question de régulation aux conséquences financières directes.","options":{"ja":"Oui","nee":"Non"}},"ene_meters":{"label":"Compteurs à prévoir","help":"Compter séparément l'énergie auxiliaire ne se fait presque jamais et explique souvent l'écart entre le rendement promis et le rendement mesuré : pompes, dégivrage, électronique et circulation s'additionnent.","options":{"warmte_wp":"Compteur d'énergie thermique sur la pompe à chaleur","warmte_sww":"Compteur d'énergie thermique sur l'eau chaude sanitaire","koude":"Compteur d'énergie frigorifique","elek_wp":"Compteur électrique de la pompe à chaleur","elek_backup":"Compteur électrique de l'appoint","elek_pompen":"Compteur électrique des pompes et de l'énergie auxiliaire","eenheid":"Comptage par unité ou par locataire"}},"ene_prestatie":{"label":"Garantie de performance sur le rendement saisonnier demandée ?","help":"Utile uniquement avec des limites de mesure, une méthode de mesure et des conditions convenues à l'avance. Demandez ce qui se passe si la garantie n'est pas atteinte, car c'est là que réside la valeur réelle.","options":{"ja":"Oui","nee":"Non"}},"ene_scop_eis":{"label":"Rendement saisonnier demandé (SCOP)","help":"Précisez à quelles conditions : quel régime, avec ou sans eau sanitaire, avec ou sans énergie auxiliaire. Sans cette délimitation, le chiffre n'a aucun sens."},"ops_plaats_binnen":{"label":"Implantation des unités intérieures","help":"Indiquez l'espace libre alentour, la largeur de porte et la charge admissible du plancher. Pour une pompe à chaleur au propane installée à l'intérieur s'ajoutent des exigences quant au volume du local, à la ventilation et à la présence de locaux situés plus bas dans lesquels le gaz peut descendre.","options":{"techniek":"Local technique","berging":"Débarras ou buanderie","kelder":"Cave","dak":"Édicule en toiture","buiten_ops":"Entièrement à l'extérieur"}},"ops_plaats_buiten":{"label":"Emplacement des unités extérieures","help":"Distance à la limite de parcelle, aux fenêtres du logement lui-même et à celles des voisins, et direction dans laquelle souffle le ventilateur. Songez aussi à l'endroit où part l'air froid soufflé : vers une terrasse ou un sentier, cela donne du givre et du verglas."},"ops_geluid_eis":{"label":"Niveau sonore admissible au point d'évaluation","help":"Découle des conditions environnementales régionales et s'applique généralement à la limite de parcelle ou à la fenêtre du voisin la plus proche. La valeur de nuit est dimensionnante, et c'est justement la nuit qu'une pompe à chaleur continue de tourner."},"ops_geluid_afstand":{"label":"Distance au point d'évaluation le plus proche"},"ops_geluid_maatregel":{"label":"Mesures acoustiques prévues","help":"Le mode nuit abaisse le bruit et la puissance en même temps — précisément quand il fait le plus froid dehors. Vérifiez par le calcul si le bâtiment le supporte, faute de quoi vous résolvez le problème de bruit au détriment de la chaleur.","options":{"nachtmodus":"Mode nuit avec limitation de vitesse","omkasting":"Capotage ou écran acoustique","trillingsdempers":"Plots antivibratiles et raccordements flexibles","plaatsing":"Implantation à l'écart des façades sensibles","geen_maatregel":"Aucune mesure prévue"}},"ops_octaaf":{"label":"Demander la puissance acoustique par bande d'octave ?","help":"Une seule valeur en dB(A) ne suffit pas pour un calcul acoustique, et encore moins pour la composante basse fréquence, qui traverse les façades et gêne le plus.","options":{"ja":"Oui","nee":"Non"}},"ops_trillingen":{"label":"Isolation antivibratile du compresseur et des pompes ?","help":"En cas d'implantation sur un plancher léger ou contre un local d'habitation, l'isolation antivibratile détermine si l'installation est audible, même lorsque le bruit aérien est en ordre.","options":{"ja":"Oui","nee":"Non"}},"ops_koudemiddel_veiligheid":{"label":"Sécurité liée au fluide frigorigène","help":"Quantité de charge par circuit, volume
