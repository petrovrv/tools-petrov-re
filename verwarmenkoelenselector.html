minimal du local, détection de fuite, ventilation et distance aux ouvertures et aux caves. Avec le propane, cela détermine en partie le lieu d'implantation — posez la question avant de fixer l'emplacement."},"ops_condens":{"label":"Évacuation des condensats de l'unité extérieure organisée ?","help":"Une pompe à chaleur air produit, par temps de gel, des dizaines de litres de condensats par jour. Sans évacuation chauffée ni lit de gravier, cela gèle sous l'appareil et sur le sentier voisin.","options":{"ja":"Oui","nee":"Non"}},"ops_toegang":{"label":"Espace de service libre et accès garantis ?","help":"Y compris la place pour sortir un compresseur ou un échangeur, dans dix ans, quand on aura entre-temps construit toutes sortes de choses autour.","options":{"ja":"Oui","nee":"Non"}},"nrm_epb":{"label":"Le projet relève-t-il de la réglementation sur la performance énergétique ?","help":"Détermine les exigences minimales de rendement, d'isolation des conduites, de comptage et parfois de part d'énergie renouvelable.","options":{"ja":"Oui","nee":"Non"}},"nrm_normen":{"label":"Normes et directives à appliquer","help":"Demandez, pour chaque norme, la pièce justificative, et non la déclaration selon laquelle elle est respectée. Pour EN 14511, ce sont les conditions de mesure qui comptent : la même machine obtient des résultats très différents sous d'autres conditions.","options":{"en12831":"EN 12831 — calcul des déperditions","en1264":"EN 1264 — plancher chauffant","en442":"EN 442 — radiateurs","en14511":"EN 14511 / EN 14825 — performances des pompes à chaleur","en378":"EN 378 — sécurité frigorifique","en12828":"EN 12828 — systèmes de chauffage dans les bâtiments","vdi2035":"VDI 2035 — qualité de l'eau de remplissage","legionella_norm":"Législation nationale sur la légionelle","bodem":"Réglementation sur la géothermie"}},"nrm_vergunning":{"label":"Permis et déclarations nécessaires","help":"Les forages et le captage d'eau souterraine ont de longs délais de traitement et parfois des études obligatoires. Le renforcement du réseau également. Lancez ces démarches avant la commande, pas après.","options":{"omgeving":"Permis d'environnement (permis unique)","milieu":"Déclaration ou autorisation environnementale","bodemenergie":"Permis de géothermie ou de forage","grondwater":"Permis de captage d'eau souterraine","netbeheerder":"Demande de renforcement du raccordement au réseau","geen_verg":"Aucun"}},"nrm_fgas":{"label":"Enregistrement et contrôle d'étanchéité selon le règlement F-gas ?","help":"Selon la quantité de charge, un contrôle d'étanchéité périodique et une obligation de registre s'appliquent. Demandez qui le tient à jour et où se trouve le registre.","options":{"ja":"Oui","nee":"Non"}},"nrm_subsidie":{"label":"Mesures de soutien et conditions","help":"Les primes lient souvent des exigences au rendement, à l'agrément de l'installateur et au moment de l'introduction de la demande. Une demande introduite après la commande n'est plus valable dans beaucoup de régimes."},"nrm_erkenning":{"label":"Installateur agréé exigé ?","help":"Pour les travaux frigorifiques et pour la plupart des primes. Demandez le numéro de certificat au moment de l'offre, pas à la réception.","options":{"ja":"Oui","nee":"Non"}},"uit_fasering":{"label":"Phasage et continuité pendant les travaux","help":"Le bâtiment doit-il rester en service ? En cas de remplacement pendant la saison de chauffe, une installation provisoire est nécessaire — convenez qui la fournit et qui la paie."},"uit_inregeling":{"label":"Équilibrage hydraulique avec rapport ?","help":"Débits par circuit, mesurés et consignés. C'est la différence entre une installation qui fonctionne à 35 °C et la même installation qui doit tourner à 45 °C parce que le circuit le plus éloigné n'y arrive pas.","options":{"ja":"Oui","nee":"Non"}},"uit_prestatiemeting":{"label":"Mesure des performances à la réception ?","help":"Départ, retour, débit, puissance absorbée et puissance fournie dans un état de fonctionnement défini. Sans mesure initiale, il est impossible de démontrer quoi que ce soit par la suite.","options":{"ja":"Oui","nee":"Non"}},"uit_seizoensmeting":{"label":"Contre-mesure après la première saison de chauffe ?","help":"Le rendement réel n'apparaît qu'après une saison entière. Convenez que l'installateur revienne après un an pour ajuster la courbe de chauffe et les réglages — il y a souvent là dix à vingt pour cent d'économie.","options":{"ja":"Oui","nee":"Non"}},"uit_documentatie":{"label":"Documentation demandée","help":"Demandez le rapport de sélection au moment de l'offre, avec les performances à votre propre température de départ. Ce seul document rend, pour la première fois, comparables les offres de fabricants différents.","options":{"berekening":"Calcul des déperditions et de la charge frigorifique","selectie":"Rapport de sélection avec les points de performance au régime du projet","schema":"Schéma hydraulique, as-built","elektrisch":"Schéma électrique et liste des points","inregel":"Rapport d'équilibrage avec les débits mesurés","stooklijn":"Courbe de chauffe réglée et paramètres de régulation","onderhoud":"Prescription d'entretien avec intervalles","logboek":"Registre du fluide frigorigène","garantie":"Dispositions et conditions de garantie"}},"uit_opleiding":{"label":"Formation du gestionnaire prévue ?","help":"Celui qui ne comprend pas la courbe de chauffe la relève à la première plainte — et le rendement est perdu. Une heure d'explication à la réception se rentabilise.","options":{"ja":"Oui","nee":"Non"}},"uit_onderhoud":{"label":"Contrat d'entretien","options":{"geen":"Aucun","basis":"De base — inspection et contrôles légaux","volledig":"Complet — y compris la régulation et le suivi des performances","nog_bepalen":"À déterminer"}},"uit_garantie":{"label":"Durée de garantie demandée"},"uit_levertijd":{"label":"Délai de livraison ou date de réception demandés","help":"Demandez séparément le délai de livraison de la régulation et celui des unités extérieures ; ils coïncident rarement."},"uit_budget":{"label":"Indication budgétaire"},"uit_opmerkingen":{"label":"Autres remarques et conditions"}},"pgroup":{"wonen":"Résidentiel","utiliteit":"Tertiaire","industrie":"Industrie et procédés"}};

const LANG_EN = {"code":"en","name":"English","prof":{"woning_nieuw":{"label":"Dwelling — new build","note":"Here everything falls into place: a good envelope, underfloor heating, a low regime. Attention shifts to the domestic hot water — in a modern dwelling that is soon half of the annual heat demand, and it runs at a far less favourable temperature than the heating.","basis":"EPB, new build; EN 12831"},"woning_renovatie":{"label":"Dwelling — refurbishment","note":"The most awkward category and the most common one. Existing radiators were selected for 75/65 and at 45/40 still deliver only about a third of their stated output. Survey what is fitted room by room, work out what comes out at the intended regime, and replace precisely those elements that fall short — that is almost always cheaper than a bigger heat pump or a higher regime.","basis":"EN 12831; existing emitters to be surveyed"},"appartement_collectief":{"label":"Communal residential building","note":"Here the domestic hot water production and the circulation loop determine the efficiency, not the heating. A communal pipe held at 60 °C all year loses heat continuously; instantaneous DHW modules per dwelling on a 40 °C source network solve both the legionella question and the efficiency problem.","basis":"EPB; metering per unit"},"kantoor_nieuw":{"label":"Office — new build","note":"A thermally activated building system with ground energy is the strong pairing here: in summer the ground provides passive cooling and is recharged for the winter in the process. The conditions are mass in the building and terminal control that handles the peak — concrete core activation alone does not meet the peak load and does not control room by room.","basis":"EN 16798-1; EPB"},"kantoor_renovatie":{"label":"Office — refurbishment","note":"Watch the zones that want to heat and cool at the same time: the south façade in the sun while the north side still calls for heat. A two-pipe system with seasonal changeover makes that impossible and produces complaints throughout the shoulder season.","basis":"EN 16798-1"},"school":{"label":"School","note":"Strongly intermittent use with holidays: here the warm-up allowance determines the generator output, not the design load. Optimum start with a control system that learns the warm-up time is cheaper than extra kilowatts — and slow emitters such as concrete core activation suit this pattern badly.","basis":"EN 16798-1; education sector guidance"},"zorg":{"label":"Care facility","note":"Domestic hot water dominates: high consumption, continuous, with a circulation loop and a strict legionella regime at 60 °C. Treat it as a separate installation with its own generation or its own high-temperature stage, otherwise it drags the efficiency of the whole heating system down.","basis":"EN 16798-1; healthcare guidance; legionella legislation"},"winkel":{"label":"Shop / retail","note":"High internal gains from lighting and visitors: here cooling is often needed all year and heating only before opening. Where there are refrigerated display cases as well, their condenser heat is a free heat source for the shop — a link that is almost always overlooked.","basis":"EN 16798-1"},"sport":{"label":"Sports facility","note":"The shower peak governs and it lasts twenty minutes. Storage is far cheaper than output here: a large cylinder charged steadily all day beats a large heat pump that has to deliver everything at once three times a week.","basis":"EN 16798-1"},"zwembad_geb":{"label":"Swimming pool","note":"Three heat demands at once: pool water, space heating and shower water, each at its own temperature. The largest loss is evaporation from the water surface, and the first measure is a cover outside opening hours — that beats any plant-side intervention.","basis":"VDI 2089"},"industrie_hal":{"label":"Industrial hall","note":"Radiant panels heat people and working surfaces instead of the air under the roof, and in a tall hall that makes a substantial difference. They do call for a higher flow temperature than underfloor heating — you have to make that trade-off deliberately.","basis":"Process heating; EN 12831"},"proces_restwarmte":{"label":"Process with waste heat","note":"Where a process has to be cooled all year, a heat source at constant temperature is already there — far more favourable than outdoor air and with no seasonal variation. Map the temperature levels and the coincidence first, before you look outdoors.","basis":"Heat recovery from processes"},"datacenter_geb":{"label":"Data centre / server room","note":"Cooling only, all year, with availability ranking above efficiency. The high cooling regime makes free cooling possible for a large part of the year, and the rejected heat at a 26 °C return is usable for an adjoining building or for domestic hot water via a heat pump.","basis":"ASHRAE TC 9.9"}},"ui":{"appTitle":"Heating and cooling design brief","appSubtitle":"From generation to terminal units — with the temperature regime as the common thread","step":"Step","of":"of","next":"Next","prev":"Previous","report":"Report","print":"Report / PDF","save":"Save","load":"Open","reset":"Clear","demo":"Example","required":"required","why":"Why this question is asked","kpiHeat":"Heating output","kpiCool":"Cooling output","kpiRegime":"Heating regime","kpiFlowRate":"Water flow rate, heating","kpiCop":"COP at design conditions","kpiScop":"Seasonal efficiency (estimate)","kpiBivalent":"Bivalent point","kpiCoverage":"Share covered by the heat pump","kpiBackup":"Supplementary heating required","kpiBuffer":"Recommended buffer volume","kpiExpansion":"Expansion vessel","kpiDhw":"Domestic hot water","kpiDhwCop":"COP, domestic hot water","kpiEnergyHeat":"Annual heat demand","kpiEnergyElec":"Annual electricity","kpiUA":"Heat loss coefficient","kpiRadiator":"Emitter output at this regime","diagramTitle":"Make-up of the installation","rowWarm":"Heating","rowKoud":"Cooling","rowSww":"Domestic hot water","diagramEmpty":"Fill in the questionnaire — the chain assembles itself here.","diagramNote":"Schematic representation of the chain from source to terminal units. Use it to check the brief, not as a hydraulic schematic.","checksTitle":"Checks","checksNone":"No findings with the current entries.","levelBlok":"Blocking","levelWaarschuwing":"Warning","levelAdvies":"Point to note","checksCount":"{blok} blocking · {waarschuwing} warnings · {advies} points to note","basis":"Basis","reportTitle":"Heating and cooling design brief","reportFor":"For","reportBy":"Prepared by","reportDate":"Date","reportRef":"Reference","secSummary":"Summary","secDuty":"Calculated values","secModules":"System choice and justification","secChecks":"Points to note and risks","secQuestions":"Outstanding questions for the supplier","secAll":"Full brief","secDisclaimer":"Qualification","colModule":"Item","colWhy":"Why this choice","colDriver":"Governing data","colNorm":"Basis","unanswered":"not completed","disclaimer":"All calculated values on this sheet are design indications, intended to support the brief and to make system errors visible early. Heat pump efficiency is calculated using a Carnot approximation with a realistic quality grade; actual performance comes from certified test data to EN 14511 and EN 14825 at the actual conditions. The final selection, the hydraulic design and the guaranteed performance come from the supplier, with project-specific verification.","openQuestions":["Output and COP at the actual project regime, not only at A7/W35 — ask for the full table.","Minimum modulating output and behaviour at part load.","Minimum run time and the buffer volume that follows from it.","Output and COP when producing domestic hot water, separately from the heating.","Behaviour and energy consumption during defrosting, and the effect on the heat delivered.","Sound power per octave band, in normal operation and in night mode, with the output that remains available in night mode.","Refrigerant charge per circuit and the requirements on the plant space.","Water-side pressure drop of the units at the project flow rate.","Points list for the control system, with read and write rights.","Permitted fill water quality and the warranty conditions attached to it.","Selection report with the quotation, so that offers become comparable."]},"val":{"lucht_water":"air-to-water","lucht_lucht":"air-to-air","grond_boring":"ground-source with vertical boreholes","grond_horizontaal":"ground-source with a horizontal collector","water_water":"water-to-water","afvoerlucht":"exhaust-air","hybride":"hybrid","gasketel":"condensing gas boiler","elektrisch":"electric","warmtenet":"district heating","wkk":"combined heat and power","biomassa":"biomass","zon_thermisch":"solar thermal collectors","radiator":"radiators","convector":"convectors","vloerconvector":"trench convectors","paneel":"radiant panels","plafondpaneel":"ceiling panels","ventilo":"fan coil units","luchtverwarmer":"warm-air heating","vloer":"underfloor heating","wand":"wall heating","tabs":"a thermally activated building system","koelplafond":"a chilled ceiling","balk":"chilled beams","vrf":"VRF","boiler":"storage cylinder with coil","verswater":"instantaneous DHW module","laadsysteem":"charging system with external heat exchanger","decentraal":"decentralised production","elektrisch_boiler":"electric water heater","geen":"none","serie":"in series","parallel":"in parallel","ontdooi":"for defrosting","monovalent":"monovalent","alternatief":"bivalent alternative","deels_parallel":"partly parallel","tweede_wp":"second heat pump","gasketel_biv":"gas boiler","reversibel":"reversible heat pump","chiller":"separate chiller","passief_bodem":"passive ground cooling","vrije_koeling":"free cooling","adiabatisch":"adiabatic cooling","warmtenet_koude":"district cooling","lucht":"air-cooled","droog":"dry cooler","nat":"wet cooling tower","bodem":"to the ground","water":"to water","adiabatisch_cond":"adiabatically assisted"},"fam":{"bron":"Source","opwekking":"Generation","opslag":"Storage and separation","distributie":"Distribution","afgifte":"Terminal units","sanitair":"Domestic hot water","overig":"Other"},"mod":{"buitendeel":"Outdoor unit","boring":"Boreholes","grondwater":"Groundwater","restwarmte":"Waste heat","bron":"Source","warmtepomp":"Heat pump","ketel":"Boiler","elektrisch":"Electric","warmtenet":"District heating","chiller":"Chiller","wkk":"CHP","vrije_koeling":"Free cooling","buffer":"Buffer vessel","boilervat":"DHW cylinder","scheiding":"Separation","verdeler":"Manifold","menggroep":"Mixing circuit","pomp":"Pump","afleverset":"Heat interface unit","vloer":"Underfloor heating","wand":"Wall heating","tabs":"Concrete core","radiator":"Radiator","convector":"Convector","vloerconvector":"Trench convector","ventilo":"Fan coil","koelplafond":"Chilled ceiling","balk":"Chilled beam","paneel":"Radiant panel","luchtverwarmer":"Warm-air heating","vrf":"VRF unit","verswater":"Fresh water station","tappunt":"Draw-off point","circulatie":"Circulation"},"rules":{"afgifte_ontoereikend":{"t":"Existing emitters cannot reach the chosen regime","d":"At {aan}/{ret} °C the output of {type} is only {pct} % of the nominal output on which selection to EN 442 is based — that figure applies at 75/65/20. Covering the load calls for roughly {nodig} kW nominal. Survey what is fitted room by room and replace precisely those elements that fall short; that is almost always cheaper than a bigger unit or a higher regime, and it is the only measure that actually improves the efficiency.","r":"EN 442"},"afgifte_derating":{"t":"Emitters deliver considerably less at this regime","d":"At {aan}/{ret} °C the output of {type} is {pct} % of the nominal output. Reckon on roughly {nodig} kW nominal to cover the load. Check this room by room: the average tells you nothing, what matters is the room with the least margin.","r":"EN 442"},"afgifte_ok":{"t":"Emitters suit the chosen regime","d":"At this regime the output of {type} is still {pct} % of the nominal output. Even so, check the room with the least favourable ratio between load and installed emitter capacity.","r":"EN 442"},"vloer_oververhit":{"t":"Underfloor heating above the permissible surface temperature","d":"The heat flux required is {nodig} W/m², whereas at the maximum surface temperature of 29 °C in the occupied zone roughly {max} W/m² is possible. The calculated surface temperature comes to {opp} °C — which is not only outside the standard but also uncomfortable. Increase the laying area, reduce the pipe spacing, or supplement with a second emission system.","r":"EN 1264"},"vloerafwerking":{"t":"Floor covering with a high thermal resistance","d":"At R = {r} m²K/W the water temperature has to rise to roughly {tmed} °C to deliver the same heat. This is the quietest project killer there is: the client chooses the floor independently of the installation and the heat pump's efficiency follows it down. Fix the maximum permissible resistance in the specification and communicate it.","r":"EN 1264"},"legoppervlak":{"t":"Limited laying area for underfloor heating","d":"At {pct} % available area the same heat has to pass through fewer square metres and the water temperature rises accordingly. Check whether fitted cupboards and appliances really are going in those positions, and consider wall heating as a supplement.","r":"EN 1264"},"tabs_te_zwaar":{"t":"The thermally activated building system cannot carry the heating load","d":"{nodig} W/m² is required whereas a concrete core delivers roughly {max} W/m². A concrete core covers the base load; the peak has to come from a second, faster system. Calculate both rather than hoping the mass will absorb it.","r":"ISO 11855"},"tabs_koel_te_zwaar":{"t":"The thermally activated building system cannot carry the cooling load on its own","d":"{nodig} W/m² required against roughly {max} W/m² available. Supplement it with terminal control, or reduce the cooling load with external solar shading — the latter is almost always cheaper than installed plant capacity.","r":"ISO 11855"},"tabs_zonder_massa":{"t":"Thermally activated building system without thermal mass","d":"In a lightweight building or above a suspended ceiling, concrete core activation has no effective mass and therefore no effect. Choose a different emission system, or expose the mass and accept the acoustic consequences of doing so.","r":"ISO 11855"},"tabs_onderbroken":{"t":"Slow system with strongly intermittent use","d":"Concrete core activation responds in hours. With a pattern of use involving sharp interruptions, the heat arrives too late and stops too late, causing both overheating and underheating. Consider a faster system, or accept that the concrete core supplies the base load only.","r":"—"},"condens_plafond":{"t":"Risk of condensation on the chilled ceiling","d":"The flow temperature of {aan} °C is too close to the expected dew point of {dauw} °C. Without dehumidification elsewhere and without dew point monitoring, the ceiling will drip on the first muggy day. Raise the flow temperature, or provide dehumidification via the air handling plant together with a sensor on the flow and one in the room.","r":"ISO 11855; EN 14240"},"straling_zonder_ontvochtiging":{"t":"Radiant cooling without dehumidification","d":"A cooled surface absorbs sensible heat only. Without dehumidification the humidity rises until the dew point hits the system's limit, precisely on the warmest days. Handle the dehumidification in the air handling plant.","r":"—"},"gemengde_regimes":{"t":"Underfloor heating and radiators on a single regime","d":"The generator then has to deliver the highest temperature and the efficiency follows the radiators, not the floor. Provide a mixing circuit or — better — replace the radiators so that the whole building can run at the low regime.","r":"—"},"latent_zonder_ontvochtiging":{"t":"Latent load of {pct} % without dehumidification","d":"The moisture has to go somewhere. Without dehumidification in the air handling plant or in the fan coil units, the humidity rises until comfort is lost and radiant cooling has to be throttled back. Set down where dehumidification takes place and at what capacity.","r":"EN 16798-1"},"boven_max_temp":{"t":"Flow temperature required is above the heat pump's range","d":"{aan} °C is required whereas the unit delivers {max} °C at most. Check as well whether that maximum is still reached at the lowest source temperature — many units only achieve their maximum at mild outdoor temperatures, and that is exactly not the moment when you need it.","r":"EN 14511"},"hoog_regime":{"t":"High flow temperature for a heat pump","d":"At {aan} °C the COP at design conditions comes out at around {cop}. Every degree lower yields roughly 2 to 3 % better efficiency. First investigate whether the regime can be brought down by targeted replacement of emitters; that pays for itself many times over across the service life.","r":"EN 14511"},"kleine_spreiding":{"t":"Very small temperature difference","d":"At a {dt} K difference the water flow rate is {debiet} m³/h — which calls for generous pipe sizes and costs pump energy all year. Check that the pipe sizing and the pump selection are based on this and not on a boiler regime.","r":"—"},"grote_spreiding":{"t":"Large temperature difference for a heat pump","d":"At {dt} K the heat pump has to handle a low return while producing a high flow. Most units are designed for 5 to 8 K; check whether the stated performance still applies at this temperature difference.","r":"EN 14511"},"geen_stooklijn":{"t":"No weather compensation","d":"Without a heating curve the installation runs at the design temperature all season, whereas at 7 °C outside far less is enough. This is virtually free efficiency, and leaving it out removes a large part of the heat pump's advantage.","r":"—"},"regime_niet_vastgelegd":{"t":"Regime not fixed contractually","d":"Set down flow, return and temperature difference with measuring points at handover. Without that agreement the regime quietly creeps upwards during the works, and afterwards nobody is responsible for the disappointing efficiency.","r":"—"},"tekort_zonder_bijstook":{"t":"Shortfall in output with no supplementary heating","d":"At design conditions the heat pump delivers roughly {cap} kW while the load is higher; {tekort} kW is missing and no supplementary heating is provided. Choose a larger unit or provide supplementary heating — but first work out which of the two is cheaper across the service life.","r":"—"},"bivalentpunt_hoger":{"t":"Actual bivalent point higher than intended","d":"Calculated, the point falls at {werkelijk} °C against an intended {gewenst} °C; the heat pump then covers roughly {dekking} % of the annual heat demand. A slightly larger unit shifts this point considerably and reduces the share of expensive supplementary heating.","r":"—"},"lage_dekking":{"t":"Low share covered by the heat pump","d":"Roughly {dekking} % of the annual heat demand comes from the heat pump; the rest comes from the supplementary heating ({backup}). With electric supplementary heating that means a considerably higher annual bill than the brochure suggests.","r":"—"},"elektrische_bijstook":{"t":"Electric supplementary heating of roughly {kw} kW","d":"Every kilowatt-hour costs one, where the heat pump delivers three to five. Ask how many running hours per year are expected and work that through against the tariff — a slightly larger heat pump often turns out cheaper within a few years.","r":"—"},"aanuit_zonder_buffer":{"t":"On/off unit without a buffer vessel","d":"A non-modulating unit without a buffer vessel starts and stops continuously, which costs efficiency and service life. Provide roughly {liter} litres, or choose a modulating unit.","r":"—"},"geen_regeneratie":{"t":"Ground energy without regeneration","d":"Ground that is only ever drawn down cools off over the years and the efficiency falls with it. Passive cooling in summer recharges the ground and delivers almost free cooling at the same time — that is the strongest reason to choose ground energy and it is often left out of the quotation.","r":"—"},"warmtenet_voorwaarden":{"t":"District heating conditions not established","d":"With district heating the maximum permitted return temperature is the hard constraint: it is metered, penalties are often attached to it, and it governs your entire emitter design. Obtain the connection conditions before you choose the emitters.","r":"—"},"cop_punten":{"t":"Estimated efficiency at this regime","d":"At {aan} °C flow: COP {copOntwerp} at design conditions, {copMild} at mild outdoor temperature, estimated seasonal average {copSeizoen}. This is a Carnot approximation — obtain the certified values at these points and compare.","r":"EN 14511 / EN 14825"},"sww_rendement":{"t":"Domestic hot water depresses the seasonal efficiency","d":"At a storage temperature of {t} °C the heat pump works at COP {copSww}, against {copCv} for the heating. The annual heat demand for domestic hot water is roughly {kwh} kWh, which comes to roughly {elek} kWh of electricity. Treat this as a separate system: an instantaneous DHW module, a lower storage temperature or a separate high-temperature stage delivers more here than any optimisation of the heating.","r":"EN 14825"},"verswater_circulatie":{"t":"Instantaneous DHW module with a circulation loop","d":"An instantaneous DHW module derives its advantage from the absence of standing hot water. With a circulation loop some of that comes back, including the continuous loss. Investigate whether the circulation can be switched on a time or demand basis, and insulate heavily.","r":"—"},"legionella_elektrisch":{"t":"Legionella cycle on electric supplementary heating","d":"In practice, periodic heating to 60 °C or above is almost always done with the electric element, because the heat pump does not reach that temperature. Ask how many kilowatt-hours that cycle costs per year; it is often more than expected and it can be avoided with an instantaneous principle.","r":"National legionella legislation"},"boilerspiraal":{"t":"Heat exchanger area of the DHW cylinder","d":"A coil that is too small for a heat pump forces the condensing temperature up and costs efficiency at every charging cycle. Ask for the heat exchanger area in m² and the output at your flow temperature — not at a boiler's.","r":"—"},"circulatieverlies":{"t":"Loss from the circulation loop","d":"With a poorly insulated circulation loop the loss can exceed the useful hot water consumption. Ask for an estimate of that loss and for heavy insulation; switch on a time or demand basis wherever possible.","r":"—"},"voorrang_snel_systeem":{"t":"Hot water priority with a fast emission system","d":"With warm-air heating or fan coil units, the loss of heating is noticeable within ten minutes. Set down how long the interruption may last and whether a minimum output remains available.","r":"—"},"buffer_te_klein":{"t":"Buffer volume smaller than calculated","d":"{gekozen} litres chosen against roughly {nodig} litres following from the minimum run time and from defrosting. Too small a buffer vessel lets the unit cycle after all; that costs efficiency and service life.","r":"—"},"geen_buffer":{"t":"No buffer vessel with a unit that does not fully modulate","d":"Ask the manufacturer for the minimum run time and for the minimum water volume in the installation. With underfloor heating the system's own content is often enough; with radiators on thermostatic valves, almost never.","r":"—"},"evenwichtsfles":{"t":"Open manifold or low-loss header","d":"A wrongly sized low-loss header mixes flow and return: the heat pump sees too high a return, modulates down and the efficiency falls away — without anything being broken. Avoid hydraulic separation where you can, and have it calculated where you must.","r":"—"},"geen_inregeling":{"t":"No hydronic balancing provided for","d":"Without balancing, the nearest circuit gets everything and the furthest gets nothing, and people compensate with a higher flow temperature — exactly what you wanted to avoid. This is the difference between an installation that works at 35 °C and the same installation that has to run at 45 °C.","r":"—"},"vulwater":{"t":"Untreated fill water","d":"Limescale on a heat exchanger with small channels costs output immediately, and oxygen produces magnetite that blocks pumps and valves. Most manufacturers tie their warranty to the fill water quality. Ask for an analysis at handover and again after a year.","r":"VDI 2035"},"vulwater_onbepaald":{"t":"Fill water quality not yet determined","d":"Set down the requirement before the order is placed and include it in the handover file, together with the measured values. After the event there is no way to demonstrate what the system was filled with.","r":"VDI 2035"},"geen_vuilafscheider":{"t":"No dirt and air separation with existing pipework","d":"Existing pipework contains magnetite and sludge that travels to the new heat exchanger at the first start-up. A magnetic dirt separator and an air/microbubble separator immediately upstream of the generator are not a luxury here but the condition for keeping the warranty.","r":"—"},"glycol":{"t":"Glycol in the system ({pct} %)","d":"Glycol lowers the heat capacity and raises the viscosity: more flow and considerably more pump energy for the same output. Restrict it to the circuit where frost can genuinely reach, and separate that circuit hydraulically.","r":"—"},"pompenergie":{"t":"High share of pump energy","d":"Estimated at {kw} kW, roughly {pct} % of the heating output. Auxiliary energy counts towards the actual seasonal efficiency and is rarely metered. Check the duty point of the pumps and the pressure drop of the system.","r":"—"},"expansievat":{"t":"Expansion vessel roughly {liter} litres","d":"Calculated for a system content of {volume} litres. Check the pre-charge pressure against the static height and place the vessel on the suction side of the pump.","r":"EN 12828"},"tweepijps_gelijktijdig":{"t":"Two-pipe system with simultaneous heating and cooling demand","d":"Zones that want to heat and cool at the same time cannot do so with a single seasonal changeover. Choose four-pipe, an ambient source network with decentralised heat pumps, or VRF with heat recovery — otherwise the whole shoulder season produces complaints.","r":"—"},"vrije_koeling_gemist":{"t":"Free cooling not exploited at a high cooling regime","d":"At {t} °C flow, free cooling is possible for a large part of the year in our climate, using pump energy alone. That is the strongest argument for setting the cooling regime high; make use of it.","r":"—"},"geen_terugwinning":{"t":"Simultaneous heating and cooling demand without heat recovery","d":"The heat from the cooling is usable all year for domestic hot water or for heating other zones. A system with heat recovery almost always pays for itself here.","r":"—"},"koeltoren_legionella":{"t":"Wet cooling tower — control plan required","d":"A wet cooling tower is favourable energetically and brings with it a legionella control plan, plus attention to its position relative to the air intakes of this building and of the neighbours.","r":"National legionella legislation"},"koudwater_te_koud":{"t":"Low chilled water temperature with radiant cooling","d":"At {t} °C flow, radiant cooling or a concrete core cannot be operated safely because of condensation, and the option of free cooling is lost as well. Separate the circuits: low-temperature water for dehumidification, high-temperature water for radiant surfaces.","r":"—"},"aansluiting_te_klein":{"t":"Electrical supply capacity insufficient","d":"Estimated coincident demand {nodig} kW against {beschikbaar} kW available. Upgrading takes months and sometimes costs more than the installation itself. Check this before the order is placed, and investigate whether the peak can be spread out through the control system.","r":"—"},"aansluiting_onbekend":{"t":"Electrical supply capacity not stated","d":"This is the most common surprise in a heat pump project. Obtain the available supply rating and add up heat pump, supplementary heating, domestic hot water production and any charging infrastructure for the coldest hour of the year.","r":"—"},"propaan_binnen":{"t":"Propane (R290) with indoor siting","d":"R290 is highly flammable and heavier than air: it sinks into lower-lying spaces. Ask for the refrigerant charge, the minimum room size, the ventilation requirements and the distance to cellars, pits and openings — and do so before you fix the siting.","r":"EN 378; IEC 60335-2-40"},"geluidseis_onbekend":{"t":"No noise limit stated","d":"Noise from outdoor units is the most common complaint with heat pumps and the most common reason for enforcement. Look up the applicable limit value at the assessment position, and mind the night-time value — it is at night in particular that the unit keeps running.","r":"Regional environmental conditions"},"geluid_dichtbij":{"t":"Outdoor unit close to an assessment point with no measures","d":"At {d} m with a limit of {db} dB(A), some measure is all but certain to be needed. Note that night mode lowers the noise and the output alike, precisely when it is coldest outside — work out whether the building can take that.","r":"—"},"condens_buitendeel":{"t":"Condensate drainage from the outdoor unit not arranged","d":"An air source heat pump produces tens of litres of condensate a day in frost. Without a heated drain or a gravel bed that freezes solid under the unit and on the path beside it — with a slipping hazard and a blocked fan as the result.","r":"—"},"geen_octaafband":{"t":"No octave band data requested","d":"A single dB(A) figure is not enough for an acoustic calculation, and certainly not for the low-frequency part, which passes through façades and causes the most annoyance.","r":"—"},"geen_vorstbeveiliging":{"t":"Frost protection on failure not arranged","d":"What happens if there is a fault during a frost period, and who is told? In a building with a lot of water in the floor this is not a theoretical question.","r":"—"},"geen_rendementsmeting":{"t":"No heat and electricity metering on the generator","d":"Without both meters the actual seasonal efficiency cannot be established and any argument about disappointing performance is unresolvable. That is exactly why those meters are so often missing — include them in the brief.","r":"—"},"hulpenergie_ongemeten":{"t":"Auxiliary energy not metered separately","d":"Pumps, defrosting, electronics and circulation all add up and often explain the difference between the promised and the measured efficiency. A separate meter costs little and puts the discussion on a factual footing.","r":"—"},"geen_inregelrapport":{"t":"No balancing report requested","d":"Flow rates per circuit, measured and recorded. Without this report there is no way to demonstrate that the installation can run at the designed regime, and nobody has any reason to check it.","r":"—"},"geen_nulmeting":{"t":"No performance measurement at handover","d":"Flow, return, flow rate, power input and heat output at a defined operating condition. Without a baseline measurement there is no way to establish later whether anything has changed.","r":"—"},"geen_nameting":{"t":"No re-measurement after the first heating season","d":"The actual efficiency only shows over a whole season. A return visit to adjust the heating curve and the settings generally delivers ten to twenty per cent in savings — more than most component choices.","r":"—"},"scop_zonder_garantie":{"t":"Efficiency requirement without a performance guarantee","d":"A seasonal efficiency asked for without agreed metering boundaries, measurement method and consequences for failure to meet it is a wish, not a requirement. Set down what happens if it is not achieved.","r":"—"},"doorlooptijd_boringen":{"t":"Lead time for permits and boreholes","d":"Ground energy calls for a permit, sometimes a response test and always scheduling with a drilling contractor. That lead time governs the programme more often than the delivery time of the equipment does. Start the process before placing the order.","r":"Ground energy regulations"},"geen_selectierapport":{"t":"No selection report requested with the quotation","d":"Ask for the performance at your flow temperature, flow rate and source temperature. That single document makes offers from different manufacturers comparable for the first time — without it you are comparing brochures.","r":"—"},"profiel_note":{"t":"Point to note for this building type","d":"{note}","r":"{basis}"},"wand_niet_gedimensioneerd":{"t":"Wall heating is not dimensioned here","d":"Wall heating is selected, but this sheet only dimensions floor heating. EN 1264-5 uses its own coefficients for walls and they are not implemented here, so have the output and the water temperature determined separately. Keep the surface temperature below roughly {max} °C and watch where cupboards and services end up.","r":"EN 1264-5"}},"mot":{"last":{"m":"Design load","w":"The starting point for every output figure and for the building line on which the bivalent point is determined.","d":"Heating {kw} kW ({spec} W/m²), cooling {kwK} kW; from {tOut} °C outside to {tIn} °C inside. Heat loss coefficient {ua} kW/K.","n":"EN 12831"},"regime":{"m":"Temperature regime","w":"The common thread: it links the emitters and the generation and determines the efficiency.","d":"{aan}/{ret} °C, temperature difference {dt} K, water flow rate {debiet} m³/h.","n":"—"},"opwekker_wp":{"m":"Heat pump","w":"Configuration: {type}, selected at the regime set out above.","d":"Nominal {kw7} kW at A7/W35, still {capOntwerp} kW at design conditions. COP {copOntwerp} at design, seasonal estimate {copSeizoen}. Bivalent point {biv} °C, covering roughly {dekking} % of the annual heat demand.","n":"EN 14511 / EN 14825"},"opwekker_overig":{"m":"Generation","w":"Configuration: {type}.","d":"Design output {kw} kW.","n":"—"},"bijstook":{"m":"Supplementary heating","w":"Covers the shortfall below the bivalent point; strategy: {strategie}.","d":"{kw} kW required, configuration: {type}.","n":"—"},"afgifte_rad":{"m":"Emitters — {type}","w":"At the chosen regime this delivers {pct} % of the nominal output to EN 442.","d":"Covering the load calls for roughly {nodig} kW nominal.","n":"EN 442"},"afgifte_vloer":{"m":"Underfloor heating","w":"Base emitter output at low temperature; limited by the permissible surface temperature.","d":"{nodig} W/m² required out of a maximum of {max} W/m²; surface temperature {opp} °C, water temperature required roughly {tmed} °C with a floor covering of R = {r} m²K/W.","n":"EN 1264"},"afgifte_tabs":{"m":"Thermally activated building system","w":"Carries the base load using the mass of the building; slow and self-regulating.","d":"{warm} W/m² of heating required out of a maximum of {maxWarm}, and {koud} W/m² of cooling out of a maximum of {maxKoud}.","n":"ISO 11855"},"sww":{"m":"Domestic hot water","w":"A separate system with its own, less favourable temperature level; configuration: {systeem}.","d":"{liter} l/day at {t} °C, {kwh} kWh/day and roughly {jaar} kWh/year. COP {cop}, so roughly {elek} kWh of electricity per year.","n":"—"},"buffer":{"m":"Buffer vessel","w":"Bridges the minimum run time of the generator and provides volume for defrosting.","d":"{liter} litres recommended at a minimum run time of {looptijd} min; for defrosting alone {ontdooi} litres would be enough. Configuration: {mode}.","n":"—"},"expansie":{"m":"Expansion vessel","w":"Absorbs the expansion of the water and keeps the pressure within the working range.","d":"Roughly {liter} litres for a system content of {volume} litres.","n":"EN 12828"},"energie":{"m":"Annual balance (indicative)","w":"An order of magnitude for comparing options, not for billing.","d":"Heat demand {warmte} kWh/year; electricity for heating {elek} kWh, for domestic hot water {swwElek} kWh, together roughly {totaal} kWh.","n":"Degree-day method"}},"sec":{"project":{"title":"Project and building","intro":"What kind of building is it, how good is the envelope and who uses it? The quality of the envelope determines the load, and the load determines whether a low-temperature regime is feasible at all."},"belasting":{"title":"Loads","intro":"The design output, not the output of the existing boiler. A boiler is almost always heavily oversized; anyone who simply copies that figure buys a heat pump two sizes too large, which then modulates badly."},"afgifte":{"title":"Heat emission systems","intro":"What hangs in the room determines the temperature the generator has to deliver — not the other way round. That is why this block comes before the choice of heat pump. The calculation shows what an existing radiator genuinely still delivers at a low regime."},"regime":{"title":"Temperature regime","intro":"The thread running through the whole design. Every degree lower on the flow side yields roughly 2 to 3 per cent better heat pump efficiency — and costs emitter surface area. Here you make that trade-off explicit instead of letting it happen to you."},"opwekking":{"title":"Heat generation","intro":"Only now is it the generator's turn, because only now is it settled what temperature it has to deliver. Always ask for performance figures at your own regime, not at the standard rating conditions from the brochure."},"koude":{"title":"Cooling generation","intro":"Cooling is rarely a stand-alone system. The question is not only where the cooling comes from, but also where the heat goes — and whether that heat is useful somewhere else in the building."},"bivalentie":{"title":"Bivalence, back-up and security of supply","intro":"A heat pump that covers the design load entirely on its own is too big for the rest of the year. One that is too small leaves the building cold. The bivalent point is where you make that trade-off deliberately."},"sww":{"title":"Domestic hot water","intro":"The item that most often brings the whole low-temperature design down. Heating asks for 35 °C, domestic hot water asks for 55 to 60 °C — the same heat pump delivers almost half the efficiency there. Treat it as a separate system."},"hydraulica":{"title":"Hydraulics, buffer and water side","intro":"Where most heat pump installations actually come undone. A wrongly placed hydraulic separation, or a buffer vessel in the wrong position, destroys the temperature difference and with it the efficiency, without anything being broken."},"distributie":{"title":"Distribution and zoning","intro":"How the energy gets from the generator to the room, and where the boundaries of responsibility and metering lie. In communal installations this is a legal question as well as a technical one."},"regeling":{"title":"Control and supervision","intro":"With a boiler the control system corrects design errors; with a heat pump it magnifies them. Emit slowly, keep the temperature low and look ahead — that is the heart of it here."},"energie":{"title":"Energy, metering and tariffs","intro":"What the installation will actually cost depends as much on tariffs and diversity as on efficiency. This block makes the running costs visible alongside the capital cost."},"opstelling":{"title":"Siting, noise and safety","intro":"Where the units stand determines whether they are allowed to stand there. Noise from outdoor units is the most common complaint with heat pumps and the most common reason for enforcement action."},"normen":{"title":"Standards, permits and grants","intro":"What is legally required and what is financially possible. Both have lead times that govern the programme — more often than the delivery time of the equipment does."},"uitvoering":{"title":"Installation, handover and management","intro":"A heat pump installation that has not been balanced never reaches its efficiency — and nobody notices, because it does get warm. This block sets out how you will notice."}},"q":{"prj_name":{"label":"Project name"},"prj_client":{"label":"Client","help":"Who decides on capital cost versus running cost? With an investor who lets the building, those two sit with different parties — and that changes the whole trade-off."},"prj_location":{"label":"Location","help":"Determines the design outdoor temperature, the degree days and the availability of district heating or of ground energy."},"prj_ref":{"label":"Reference"},"prj_author":{"label":"Prepared by"},"prj_date":{"label":"Date"},"geb_type":{"label":"Building type","help":"Drives the default values for load, regime and diversity, and the question of whether cooling is needed at all."},"prj_aard":{"label":"Nature of the project","help":"Where only the generator is being replaced, the emission system is already fixed and so is the regime. That is precisely the situation in which a heat pump on existing radiators disappoints — this sheet works that through for you.","options":{"nieuwbouw":"New build","renovatie":"Refurbishment with envelope improvement","vervanging":"Generator replacement, existing emitters","uitbreiding":"Extension"}},"geb_area":{"label":"Heated floor area"},"geb_volume":{"label":"Heated volume","help":"For the warm-up time and for the air-side systems."},"geb_bouwjaar":{"label":"Year of construction","help":"A rough indication of envelope quality where no calculation is available."},"geb_schil":{"label":"Quality of the building envelope","help":"The most important question in this block. A poorly insulated envelope calls for a high flow temperature, and that is exactly where a heat pump delivers least. Insulating before replacing the generator is almost always the cheaper order of work.","options":{"passief":"Passive / very well insulated","goed":"Good — recent new build","gemiddeld":"Average — retrofitted insulation","matig":"Moderate — limited insulation","slecht":"Poor — uninsulated"}},"geb_luchtdicht":{"label":"Airtightness (n50 or v50)","help":"With a leaky envelope the infiltration load is a substantial part of the design output, and that load is also wind-dependent — so it cannot be controlled."},"geb_massa":{"label":"Thermal mass","help":"Determines whether slow control works. A thermally activated building system needs mass; in a lightweight building with a suspended ceiling it has no effect and is money thrown away.","options":{"zwaar":"Heavy — concrete, exposed","gemiddeld":"Medium","licht":"Light — timber frame, suspended ceiling"}},"geb_gebruik":{"label":"Pattern of use","help":"With strongly intermittent use a slow system such as underfloor heating or concrete core activation is unsuitable: it cannot warm up in time and cannot stop in time.","options":{"continu":"Continuous, 24/7","kantooruren":"Office hours","onderbroken":"Strongly intermittent","seizoen":"Seasonal"}},"geb_zones":{"label":"Number of thermal zones","help":"Zones with different occupancy, orientation or requirements. Every zone that wants to heat and cool at the same time pushes the system choice towards four-pipe or towards a heat pump with heat recovery."},"geb_gelijktijdig":{"label":"Can zones heat and cool at the same time?","help":"Sun on the south side and shade on the north, or a server room next to an office. If so, a two-pipe system with seasonal changeover will not do, however attractive it looks on price.","options":{"ja":"Yes","nee":"No"}},"bel_basis":{"label":"What is the output based on?","help":"A room-by-room calculation to EN 12831 is the only basis on which you can check the emitters room by room. A rule-of-thumb figure is for a first estimate; three years of consumption data are often more reliable than a calculation built on the wrong assumptions.","options":{"berekening":"Room-by-room heat loss calculation","opgegeven":"Stated total output","specifiek":"Rule-of-thumb figure per m² (indicative)","verbruik":"Derived from actual consumption"}},"bel_spec_heat":{"label":"Specific heating output","help":"Passive construction 10–20, recent new build 30–40, retrofitted insulation 45–70, uninsulated 90–140 W/m². Use this only for a first estimate."},"bel_heat_kw":{"label":"Heating output","help":"Without the warm-up allowance; you enter that separately below, so that it stays visible where it comes from."},"bel_opwarm":{"label":"Allowance for warm-up after a shutdown period","help":"Zero for continuous operation. With a daily night setback in a heavy building the allowance can run to 20–30 % — and that allowance then determines the whole generator output. Consider preheating for longer rather than installing more output."},"bel_cooling":{"label":"Is there cooling?","options":{"ja":"Yes","nee":"No"}},"bel_spec_cool":{"label":"Specific cooling output","help":"An office with normal glazing 40–60 W/m², with a lot of glass or a high internal load 70–100. External solar shading reduces this more than any plant can."},"bel_cool_kw":{"label":"Cooling output"},"bel_latent":{"label":"Latent share of the cooling load","help":"Decisive for the choice of system. Radiant cooling and concrete core activation absorb sensible heat only; the moisture has to be removed somewhere else — usually via the air handling plant. Forget that and you get condensation on the ceiling."},"bel_intern":{"label":"Internal heat gains","help":"People, lighting, equipment. In a modern office this is often the dominant cooling load, and it substantially reduces the heating demand during the day."},"bel_proces":{"label":"Process or special loads","help":"Server room, kitchen, production line, swimming pool. These are often loads that call for cooling all year round — and are therefore a free heat source for the rest of the building."},"bel_gelijktijdigheid":{"label":"Diversity factor","help":"With many dwellings on one generator you may reckon on less than the sum of the peaks. With a single building forming one zone you may not: there the peak really does occur everywhere at once."},"cnd_t_design":{"label":"Design outdoor temperature","help":"For Belgium generally −8 to −11 °C depending on zone and building mass. Together with the load it determines the building line on which the bivalent point is found."},"cnd_t_room":{"label":"Room temperature, heating"},"cnd_t_room_cool":{"label":"Room temperature, cooling"},"cnd_dewpoint_room":{"label":"Highest dew point expected in the room","help":"The lower limit for every cooled surface. At 25 °C and 55 % RH the dew point is around 15 °C — a chilled ceiling with a flow temperature of 16 °C is dangerously close to that. Without dehumidification, radiant cooling cannot be controlled safely."},"cnd_degree_days":{"label":"Degree days","help":"For Belgium generally around 2000 K·d, base 15/15. For the indicative annual estimate only."},"afg_types":{"label":"Which emission systems are proposed or already present?","help":"Combinations are normal: underfloor heating for the base load and fan coil units for the peak and for cooling. Enter everything that is going in, because the lowest common denominator sets the regime for the whole circuit — unless you work with separate groups and mixing circuits.","options":{"vloer":"Underfloor heating","wand":"Wall heating","tabs":"Thermally activated building system (concrete core activation)","radiator":"Radiators","convector":"Convectors","vloerconvector":"Trench (floor) convectors","ventilo":"Fan coil units","koelplafond":"Chilled ceiling / climate ceiling","balk":"Induction units / chilled beams","paneel":"Radiant panels","luchtverwarmer":"Warm-air heating via the air handling plant","vrf":"VRF indoor units (direct expansion)"}},"afg_bestaand":{"label":"Are existing emitters being reused?","help":"If so, have the installed nominal output recorded room by room. Without that survey there is no way to establish whether the chosen regime is achievable, and any promise about the heat pump is a gamble.","options":{"nee":"No, all new","deels":"Partly","ja":"Yes, entirely"}},"afg_vloer_share":{"label":"Share of the load carried by underfloor or wall heating"},"afg_vloer_coverage":{"label":"Available laying area","help":"No pipe is laid under fitted cupboards, kitchen units or appliances. At 60 % available area the same heat has to pass through fewer square metres, so the water temperature rises — often just enough to swallow the heat pump's advantage."},"afg_vloer_r":{"label":"Thermal resistance of the floor covering","help":"Tiles roughly 0.02, laminate with underlay 0.10–0.15, carpet up to 0.20 m²K/W. This is the quietest project killer there is: the same underfloor heating needs a water temperature ten degrees higher under carpet than under tiles. Fix the maximum permissible resistance in the specification and pass it on to the client."},"afg_vloer_spacing":{"label":"Pipe spacing","help":"Closer spacing lowers the water temperature required. 100 mm instead of 150 mm is worth a few degrees and is cheap in new build; after the event it can no longer be changed."},"afg_tabs_share":{"label":"Share of the load carried by the thermally activated building system","help":"Concrete core activation delivers roughly 30–40 W/m² of heating and 40–50 W/m² of cooling, and responds in hours, not in minutes. It covers the base load; the peak and the room-by-room control have to come from a faster system."},"afg_koelplafond_share":{"label":"Share of the cooling load carried by the chilled ceiling"},"afg_regelbaar":{"label":"Room-by-room control","help":"With underfloor heating and concrete core activation, room-by-room control only ever works slowly; overcontrolling leads to overshoot and cycling. With a heat pump, keeping flow through the system at a low, weather-compensated temperature is usually better than switching on and off room by room.","options":{"thermostaat":"Room thermostat per zone","kraan":"Thermostatic radiator valves","centraal":"Central only, weather-compensated","geen":"No individual control"}},"afg_meting":{"label":"Have the existing emitters been surveyed room by room?","help":"Type, dimensions and nominal output of every element. This is the work nobody wants to do, and it makes the difference between an installation that works and one that does not.","options":{"ja":"Yes","nee":"No"}},"reg_t_flow":{"label":"Heating flow temperature at design conditions","help":"Underfloor heating 30–38, concrete core activation 26–32, new radiators 45–55, existing radiators often 70–80 °C. This figure decides which generators remain in the running."},"reg_t_return":{"label":"Heating return temperature","help":"The temperature difference determines the water flow rate and with it the pipe diameters and the pump energy. A heat pump generally works with a 5 K difference, a boiler with 20 K — that is a factor of four in flow rate and makes a substantial difference to the pipe sizing."},"reg_weersafhankelijk":{"label":"Weather compensation of the flow temperature?","help":"Virtually free efficiency: at 7 °C outside, a flow temperature far below the one needed at −8 °C is enough. Without a heating curve the installation runs at the design value all season and a heat pump loses a large part of its advantage.","options":{"ja":"Yes","nee":"No"}},"reg_t_flow_cool":{"label":"Cooling flow temperature","help":"Fan coil units with dehumidification 6–8 °C, radiant cooling and concrete core activation 16–18 °C. A high chilled water temperature makes free cooling and an efficient chiller possible, but rules out dehumidification — that is a system choice, not a setting."},"reg_t_return_cool":{"label":"Cooling return temperature"},"reg_glycol_pct":{"label":"Glycol concentration","help":"Glycol lowers the heat capacity and raises the viscosity: at 30 % roughly 10 % more flow and considerably more pump energy for the same output. Use it only where frost can genuinely reach, and separate that circuit hydraulically."},"reg_menggroepen":{"label":"Mixing circuits for different regimes?","help":"Needed as soon as underfloor heating and radiators sit on the same generator. Note that the generator then has to deliver the highest temperature and the mixing circuit reduces it locally — so the efficiency follows the radiators, not the floor. Consider whether the radiators could not be replaced.","options":{"ja":"Yes","nee":"No"}},"reg_dt_marge":{"label":"Fix the regime contractually with measuring points?","help":"Flow, return and temperature difference at design conditions, to be measured at handover. Without that agreement the regime quietly creeps upwards during the works, and afterwards nobody is responsible for the disappointing efficiency.","options":{"ja":"Yes","nee":"No"}},"opw_type":{"label":"Type of generator","help":"Ground-coupled systems provide a stable source all year and therefore a far flatter efficiency, but they need a permit, space and a considerably higher investment. Air-to-water is simpler and is at its weakest in frost — precisely when the building asks for most.","options":{"lucht_water":"Air-to-water heat pump","grond_boring":"Ground-source (brine-to-water) heat pump — vertical boreholes","grond_horizontaal":"Ground-source (brine-to-water) heat pump — horizontal collector","water_water":"Water-to-water heat pump — ground or surface water","afvoerlucht":"Exhaust-air heat pump","lucht_lucht":"Air-to-air heat pump","hybride":"Hybrid — heat pump with boiler","gasketel":"Gas boiler, condensing","elektrisch":"Direct electric resistance heating","warmtenet":"District heating","wkk":"Combined heat and power","biomassa":"Biomass boiler","zon_thermisch":"Solar thermal collectors (supplementary)"}},"opw_hp_kw":{"label":"Heat pump output at A7/W35","help":"Manufacturers quote output at favourable conditions. Ask for the full table: output and COP at A−7/W45, A2/W35, A7/W35 and at your own flow temperature. The spread between those points is larger than most quotations suggest."},"opw_source_t":{"label":"Source temperature at design conditions","help":"For air this is the design outdoor temperature. For ground generally 0 to 5 °C, for groundwater 10 to 12 °C. Leave blank to derive it from the source type."},"opw_modulatie":{"label":"Output control","help":"Ask for the minimum modulating output, not just the maximum. A heat pump that cannot go below 40 % of its output will cycle in spring and autumn — that costs efficiency and service life, and a buffer vessel can only soften it, not solve it.","options":{"inverter":"Fully modulating (inverter)","stappen":"Multiple stages","aan_uit":"On/off"}},"opw_koudemiddel":{"label":"Refrigerant","help":"The F-gas Regulation is squeezing high-GWP refrigerants out of the market; R290 has therefore become the de facto standard for smaller heat pumps. Propane is highly flammable: that imposes requirements on the siting, on distances to openings, and on any cellar or pit into which a leak could sink.","options":{"R290":"R290 propane (A3)","R32":"R32 (A2L)","R454C":"R-454C (A2L)","R1234ze":"R-1234ze (A2L)","R744":"R-744 CO₂","R410A":"R-410A (A1)"}},"opw_max_temp":{"label":"Maximum flow temperature of the heat pump","help":"Check that this value is still reached at the lowest source temperature — many units only achieve their maximum at mild outdoor temperatures, and that is exactly not the moment when you need it."},"opw_bron_detail":{"label":"Source data","help":"Number and depth of the boreholes, or the area of the horizontal collector, or the flow rate and temperature of the groundwater. On larger projects also ask for the thermal response test and for the annual balance between extraction and injection — ground that is only ever drawn down cools off over the years and the efficiency falls with it."},"opw_regeneratie":{"label":"Is ground regeneration provided for?","help":"Passive cooling in summer recharges the ground and delivers almost free cooling. That is the strongest reason to choose ground energy — and it is often left out of the quotation.","options":{"ja":"Yes","nee":"No"}},"opw_warmtenet_detail":{"label":"District heating conditions","help":"Flow temperature, guaranteed return temperature, penalties for excessive return temperature, connected capacity and tariff structure. The maximum permitted return temperature is the hard constraint: it governs your entire emitter design and it is metered."},"opw_bestaand":{"label":"Existing generation to be retained or removed","help":"For a phased replacement: what stays in place, how is it integrated hydraulically, and who manages the transition?"},"kou_type":{"label":"Source of cooling","help":"Passive ground cooling consumes only pump energy and recharges the ground for the winter at the same time. It delivers limited output at a high water temperature — exactly suited to concrete core activation and chilled ceilings, and unsuitable for dehumidification.","options":{"reversibel":"Reversible heat pump","chiller":"Separate chiller","passief_bodem":"Passive cooling from the ground","vrije_koeling":"Free cooling with a dry cooler","vrf":"VRF with heat recovery","adiabatisch":"Adiabatic cooling","warmtenet_koude":"District cooling","geen":"No active cooling"}},"kou_terugwinning":{"label":"Simultaneous heating and cooling with heat recovery?","help":"In a building with a server room, a kitchen or a north-south orientation, the heat from the cooling is usable all year for domestic hot water or for heating. That calls for a four-pipe system or a heat pump with heat recovery, and it almost always pays for itself.","options":{"ja":"Yes","nee":"No"}},"kou_condensor":{"label":"Heat rejection from the chiller","help":"A wet cooling tower is the best option energetically and brings with it a legionella control plan, plus attention to its position relative to air intakes. Rejecting heat to the ground is almost always the best option where boreholes are being installed anyway.","options":{"lucht":"Air-cooled","droog":"Dry cooler with glycol","adiabatisch_cond":"Adiabatically assisted","nat":"Wet cooling tower","bodem":"To the ground","water":"To surface water or groundwater"}},"kou_vrije_koeling":{"label":"Free cooling at low outdoor temperature?","help":"With a 16/18 °C cooling regime, free cooling is possible for a large part of the year in our climate. That is the strongest argument for setting the cooling regime high — and it only works if the emission system suits it.","options":{"ja":"Yes","nee":"No"}},"kou_ontvochtiging":{"label":"Where does dehumidification take place?","help":"The question that makes or breaks radiant cooling. Without dehumidification elsewhere, a chilled ceiling or concrete core can never go below the dew point, so the control system has to limit the surface temperature — losing output on precisely the warmest, most humid days.","options":{"lucht":"In the air handling plant","ventilo":"In the fan coil units","geen":"Nowhere — no active dehumidification"}},"biv_strategie":{"label":"Bivalent strategy","help":"Parallel keeps the heat pump running and lets the supplementary heating cover only the shortfall; alternative switches the heat pump off entirely. With a gas boiler as supplementary heating, alternative operation is sometimes cheaper to run; with electric supplementary heating, almost never.","options":{"monovalent":"Monovalent — heat pump covers everything","parallel":"Bivalent parallel — supplementary heating alongside the heat pump","alternatief":"Bivalent alternative — changeover to the boiler","deels_parallel":"Partly parallel, then changeover"}},"biv_backup":{"label":"Type of supplementary heating","help":"Electric supplementary heating is cheap to buy and expensive to run: every kilowatt-hour costs one, where the heat pump delivers three to five. Ask how many hours a year it is expected to run and work that through — a slightly larger heat pump often turns out cheaper.","options":{"geen":"None","elektrisch":"Electric element","gasketel":"Gas boiler","warmtenet":"District heating","tweede_wp":"Second heat pump"}},"biv_punt":{"label":"Desired bivalent point","help":"At −5 °C the heat pump generally covers well over 90 % of the annual heat demand while being allowed to be considerably smaller than the design load. This sheet calculates the actual point from your own data and shows it next to this target."},"biv_redundantie":{"label":"Security of supply required on failure","help":"Rarely necessary for a dwelling or office, a hard requirement for a care home, a data centre or a process. Several smaller units give both redundancy and better part-load behaviour — often the better choice over one large unit.","options":{"geen":"None — failure acceptable","gedeeltelijk":"Part of the output must remain available","volledig":"Full redundancy (n+1)"}},"biv_vorstbeveiliging":{"label":"Is frost protection of the building on failure arranged?","help":"What happens if there is a fault during a frost period, and who is told about it? In a building with underfloor heating and a lot of water in the floor this is not a theoretical question.","options":{"ja":"Yes","nee":"No"}},"biv_smart_grid":{"label":"Can operation follow grid load or tariff?","help":"Network operator blocking hours, dynamic tariffs or your own solar electricity. That calls for storage capacity in a buffer vessel or in the building mass, and a control system that can look ahead. With a thermally activated building system that mass is already there for free.","options":{"ja":"Yes","nee":"No"}},"dhw_aanwezig":{"label":"Does this installation produce domestic hot water?","options":{"ja":"Yes","nee":"No"}},"dhw_persons":{"label":"Number of people or draw-off points"},"dhw_l_person":{"label":"Consumption per person per day","help":"Dwelling 35–50 l per person at 55 °C, office far less, sports facilities and care substantially more with a sharp peak."},"dhw_profiel":{"label":"Draw-off profile","help":"The peak determines the volume, the daily consumption determines the output. In a sports facility the peak governs, and storage is cheaper than output.","options":{"woning":"Dwelling — morning and evening peak","kantoor":"Office — low and spread out","sport":"Sports — short, very high peak","zorg":"Care — high and continuous","horeca":"Hospitality / kitchen"}},"dhw_t_store":{"label":"Storage temperature","help":"Every degree higher costs heat pump efficiency. An instantaneous unit or fresh water station can manage with a lower storage temperature because there is no standing hot water — often the most elegant answer to the legionella question."},"dhw_t_cold":{"label":"Cold water temperature"},"dhw_systeem":{"label":"System","help":"An instantaneous DHW module heats on demand and holds no standing hot water; that reduces the legionella risk and allows a lower buffer temperature. The drawback is the high peak demand at that moment — which the buffer vessel or the heat exchanger has to cope with.","options":{"boiler":"Storage cylinder with coil","verswater":"Instantaneous DHW module (fresh water station)","laadsysteem":"Charging system with external heat exchanger","decentraal":"Decentralised per dwelling or draw-off point","elektrisch_boiler":"Electric water heater"}},"dhw_legionella":{"label":"Legionella control","help":"Thermal disinfection requires 60 °C or more periodically throughout the installation, including the circulation loop. That is the moment when the electric supplementary heating cuts in: ask how much energy that costs per year, because it is often more than expected.","options":{"thermisch":"Periodic thermal disinfection","doorstroom":"Instantaneous principle, no storage","temperatuur":"Held permanently at temperature","alternatief":"Alternative technique"}},"dhw_circulatie":{"label":"Is there a circulation loop?","help":"A circulation loop keeps hot water available and loses heat continuously in doing so — with a poorly insulated pipe that loss can exceed the useful consumption. Insulate heavily and switch on a time or demand basis wherever possible.","options":{"ja":"Yes","nee":"No"}},"dhw_voorrang":{"label":"Does domestic hot water take priority over heating?","help":"Common and rarely a problem, but set down how long the heating may drop out. With a thermally activated building system nobody notices; with warm-air heating they notice within ten minutes.","options":{"ja":"Yes","nee":"No"}},"dhw_zon":{"label":"Use solar thermal or surplus PV?","help":"Domestic hot water is the simplest store for your own solar electricity, because the demand exists all year. Ask how the control system recognises the surplus and whether it then raises the storage temperature temporarily.","options":{"ja":"Yes","nee":"No"}},"hyd_scheiding":{"label":"Hydraulic separation","help":"A low-loss header or open manifold that is wrongly sized mixes flow and return and destroys the temperature difference: the heat pump sees too high a return, modulates down and the efficiency falls away. Avoid hydraulic separation where you can, and have it calculated where you must.","options":{"geen":"None — single circuit","open_verdeler":"Open manifold / low-loss header","buffer_serie":"Buffer vessel in series","buffer_parallel":"Buffer vessel in parallel","wisselaar":"Plate heat exchanger"}},"hyd_buffer":{"label":"Buffer vessel","help":"A buffer vessel solves two different problems that are often confused: run times of the generator that are too short, and too little water volume for defrosting. Only the first calls for a large volume; for the second the water content of the installation itself is often enough.","options":{"geen":"No buffer vessel","serie":"In series in the return","parallel":"In parallel","ontdooi":"For defrosting only"}},"hyd_buffer_l":{"label":"Buffer volume proposed","help":"Leave blank to see the calculated value only."},"hyd_min_run":{"label":"Minimum run time of the generator","help":"Ask the manufacturer for this value — it directly determines the buffer volume. A unit that has to run for six minutes but can only shed two minutes' worth of heat will start ten times an hour."},"hyd_buffer_dt":{"label":"Permissible temperature swing in the buffer vessel"},"hyd_system_l":{"label":"Water content of the installation","help":"Pipework, emitters and equipment together. With underfloor heating that content is often large enough to absorb defrosting without an additional buffer vessel."},"hyd_pompen":{"label":"Pumps","help":"Ask for the actual duty point, not for the maximum head. Oversized pumps consume energy all year round and cause flow noise in the emitters.","options":{"toerengeregeld":"Speed-controlled on differential pressure","constant":"Constant speed","debiet":"Controlled to constant flow"}},"hyd_head_kpa":{"label":"Estimated pressure drop of the system","help":"With a heat pump regime and its small temperature difference the flow rate is high and the pressure drop correspondingly so: that is the reason to size pipework more generously at a low temperature difference than with a boiler."},"hyd_inregeling":{"label":"Hydronic balancing of the circuits","help":"Without balancing, the nearest circuit gets everything and the furthest gets nothing, and people compensate with a higher flow temperature — exactly what you wanted to avoid. Pressure-independent control valves also keep the flow rate correct at part load.","options":{"statisch":"Static, with balancing valves","dynamisch":"Pressure-independent control valves","automatisch":"Automatically balancing","geen":"Not provided for"}},"hyd_p_static":{"label":"Static height / pre-charge pressure"},"hyd_p_max":{"label":"Maximum working pressure"},"hyd_waterkwaliteit":{"label":"Treatment of the fill water","help":"Limescale on a heat exchanger with small channels costs output immediately, and oxygen in the system produces magnetite that blocks pumps and valves. Ask for a water analysis at handover and again after a year; it is the cheapest guarantee there is.","options":{"ontzout":"Demineralised or softened, with analysis","inhibitor":"With inhibitor","leidingwater":"Untreated mains water","nog_bepalen":"Still to be determined"}},"hyd_ontluchting":{"label":"Are automatic air venting and dirt separation provided?","help":"An air/microbubble separator and a magnetic dirt separator immediately upstream of the generator. In an installation with existing pipework that is not a luxury but the condition for keeping the warranty.","options":{"ja":"Yes","nee":"No"}},"hyd_vorst":{"label":"Frost protection of outdoor units and pipework?","help":"With an externally sited heat pump: how does the water keep moving during a power cut, and what happens to the condensate drain in frost? A frozen condensate tray throws the fan out of balance.","options":{"ja":"Yes","nee":"No"}},"dis_opzet":{"label":"Layout of the installation","help":"Central gives economies of scale and a single point of contact; decentralised gives straightforward billing and no distribution losses. The intermediate form — a communal source with individual heat pumps or heat interface units — combines both and is gaining ground fast in housing.","options":{"centraal":"Central — one plant for the whole building","decentraal":"Decentralised — per unit or zone","collectief_individueel":"Communal source, individual emitters","cluster":"Clusters per part of the building"}},"dis_leidingen":{"label":"Distribution network","help":"Four-pipe allows simultaneous heating and cooling and costs more space and money. An ambient-temperature source network with heat pumps in each unit does the same with two pipes and is therefore chosen more and more often.","options":{"tweepijps":"Two-pipe with seasonal changeover","vierpijps":"Four-pipe","tweepijps_wp":"Two-pipe with decentralised heat pumps (ambient source network)"}},"dis_isolatie":{"label":"Pipe insulation","help":"In a low-temperature network the losses are smaller, but for cooling the vapour tightness matters too: a chilled water pipe without a vapour-tight finish produces condensation inside the insulation, and that only becomes visible once the ceiling is wet.","options":{"zwaar":"Heavier than the standard requires","norm":"To the standard","beperkt":"Limited"}},"dis_tracelengte":{"label":"Estimated route length","help":"With a long horizontal distribution run the distribution losses can swallow a substantial part of the generated heat, particularly at low occupancy."},"dis_afleverset":{"label":"Heat interface units per unit?","help":"Set down what is inside the unit: metering, control, domestic hot water production, backflow prevention — and who maintains it and who holds the key.","options":{"ja":"Yes","nee":"No"}},"dis_meting_eenheid":{"label":"Is metering per unit required?","help":"Often a legal requirement in communal installations. Decide early where the meters go, because they determine the layout of the whole pipework network.","options":{"ja":"Yes","nee":"No"}},"dis_toegang":{"label":"Accessibility of pipework and manifolds","help":"Manifolds in cupboards or above suspended ceilings must remain reachable for balancing and maintenance. Anything behind a bricked-up wall will never be balanced again."},"ctl_leverancier":{"label":"Origin of the control system","help":"In a mixed solution the heat pump's controls fight the building's: both want to set the flow temperature. Set down who is in charge of which variable.","options":{"fabriek":"Manufacturer's controls on the generator","gbs":"Building management system","gemengd":"Mixed"}},"ctl_protocol":{"label":"Communication protocol","help":"A proprietary protocol means dependence on a single supplier for the whole service life. Ask for the points list, with read and write rights, with the quotation.","options":{"geen":"None","modbus_rtu":"Modbus RTU","modbus_tcp":"Modbus TCP","bacnet":"BACnet","knx":"KNX","fabrikant":"Manufacturer's proprietary protocol"}},"ctl_stooklijn":{"label":"Is the heating curve adjustable and documented?","help":"Ask for the heating curve as set to be included in the handover file, together with the resulting room temperatures. Without that document nobody will ever optimise it again.","options":{"ja":"Yes","nee":"No"}},"ctl_functies":{"label":"Control fun
