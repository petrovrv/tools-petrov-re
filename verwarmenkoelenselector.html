const LANG_ES = {"code":"es","name":"Español","prof":{"woning_nieuw":{"label":"Vivienda — construcción nueva","basis":"Normativa PEB de obra nueva; EN 12831","note":"Aquí todo encaja: buena envolvente, suelo radiante, régimen bajo. La atención se desplaza hacia el agua caliente sanitaria — en una vivienda moderna representa pronto la mitad de la demanda de calor anual y funciona a una temperatura mucho menos favorable que la calefacción."},"woning_renovatie":{"label":"Vivienda — reforma","basis":"EN 12831; inventario de la emisión existente","note":"La categoría más difícil y la más frecuente. Los radiadores existentes se seleccionaron a 75/65 y a 45/40 entregan aún aproximadamente un tercio de su potencia declarada. Haga un inventario por local de lo instalado, calcule qué resulta con el régimen deseado, y sustituya de forma selectiva los elementos insuficientes — eso es casi siempre más barato que una bomba de calor mayor o un régimen más alto."},"appartement_collectief":{"label":"Edificio de viviendas colectivo","basis":"Normativa PEB; medición por unidad","note":"Aquí la preparación sanitaria y la tubería de circulación determinan el rendimiento, no la calefacción. Una tubería colectiva que está todo el año a 60 °C pierde continuamente; las estaciones de agua fresca por vivienda sobre una red de fuente a 40 °C resuelven a la vez el problema de la legionela y el del rendimiento."},"kantoor_nieuw":{"label":"Oficina — obra nueva","basis":"EN 16798-1; normativa PEB","note":"La activación del núcleo de hormigón con energía geotérmica es aquí la pareja ganadora: el terreno aporta refrigeración pasiva en verano y con ello se recarga para el invierno. La condición es tener masa en el edificio y una regulación terminal que absorba la punta — la losa sola no cubre la carga punta ni regula por local."},"kantoor_renovatie":{"label":"Oficina — reforma","basis":"EN 16798-1","note":"Preste atención a las zonas que quieren calentar y refrigerar a la vez: fachada sur al sol mientras la cara norte aún pide calor. Un sistema de dos tubos con conmutación estacional lo hace imposible y genera quejas durante toda la temporada intermedia."},"school":{"label":"Centro escolar","basis":"EN 16798-1; directrices para centros educativos","note":"Uso muy intermitente con vacaciones: aquí el suplemento de arranque determina la potencia del generador, no la carga de diseño. Un arranque óptimo con una regulación que aprende el tiempo de calentamiento es más barato que kilovatios adicionales — y una emisión lenta como la losa térmica activa encaja mal precisamente con este patrón."},"zorg":{"label":"Centro sanitario","basis":"EN 16798-1; directrices sanitarias; normativa de legionela","note":"El agua caliente sanitaria domina: consumo alto, continuo, con tubería de circulación y con un régimen antilegionela estricto a 60 °C. Trátelo como una instalación aparte con generación propia o etapa de alta temperatura propia; de lo contrario, arrastra a la baja el rendimiento de toda la calefacción."},"winkel":{"label":"Comercio / retail","basis":"EN 16798-1","note":"Alta carga interna por iluminación y visitantes: aquí la refrigeración suele ser necesaria todo el año y la calefacción solo a la apertura. Donde también hay muebles frigoríficos, su calor de condensación es una fuente de calor gratuita para el comercio — ese acoplamiento se olvida casi siempre."},"sport":{"label":"Instalación deportiva","basis":"EN 16798-1","note":"La punta de duchas es determinante y dura veinte minutos. Aquí la acumulación es mucho más barata que la potencia: un depósito grande que se carga tranquilamente todo el día vence a una bomba de calor grande que debe entregarlo todo tres veces por semana."},"zwembad_geb":{"label":"Piscina","basis":"VDI 2089","note":"Tres demandas de calor a la vez: agua del vaso, calefacción del local y agua de duchas, cada una con su propia temperatura. La mayor pérdida es la evaporación de la superficie del agua, y la primera medida es una cubierta fuera del horario de apertura — eso vence a cualquier intervención en la instalación."},"industrie_hal":{"label":"Nave industrial","basis":"Calefacción de proceso; EN 12831","note":"Los paneles radiantes calientan a las personas y las superficies de trabajo en lugar del aire bajo la cubierta, y eso supone una diferencia considerable en una nave alta. Sí exigen una temperatura de impulsión más alta que el suelo radiante — esa contrapartida debe asumirla conscientemente."},"proces_restwarmte":{"label":"Proceso con calor residual","basis":"Recuperación de calor de procesos","note":"Donde un proceso debe refrigerarse todo el año, hay disponible una fuente de calor a temperatura constante — mucho más favorable que el aire exterior y sin variación estacional. Determine primero los niveles de temperatura y la simultaneidad antes de mirar hacia el exterior."},"datacenter_geb":{"label":"Centro de datos / sala de servidores","basis":"ASHRAE TC 9.9","note":"Solo refrigeración, todo el año, con la disponibilidad por encima del rendimiento. El régimen de frío alto permite refrigeración gratuita durante gran parte del año, y el calor evacuado a 26 °C de retorno es utilizable para un edificio colindante o para agua sanitaria mediante una bomba de calor."}},"ui":{"appTitle":"Especificación de calefacción y refrigeración","appSubtitle":"De la generación a la emisión — con el régimen de temperatura como hilo conductor","step":"Paso","of":"de","next":"Siguiente","prev":"Anterior","report":"Informe","print":"Informe / pdf","save":"Guardar","load":"Abrir","reset":"Vaciar","demo":"Ejemplo","required":"obligatorio","why":"Por qué esta pregunta","kpiHeat":"Potencia de calefacción","kpiCool":"Potencia de refrigeración","kpiRegime":"Régimen de calefacción","kpiFlowRate":"Caudal de agua de calefacción","kpiCop":"COP en condiciones de diseño","kpiScop":"Rendimiento estacional (estimado)","kpiBivalent":"Punto bivalente","kpiCoverage":"Cobertura de la bomba de calor","kpiBackup":"Apoyo necesario","kpi  régimen elegido","d":"A {aan}/{ret} °C, {type} solo entrega ya el {pct} % de la potencia nominal para la que se seleccionó según EN 442 — eso se aplica a 75/65/20. Para cubrir la carga se necesitan aproximadamente {nodig} kW nominales. Haga un inventario por local de lo instalado y sustituya de forma selectiva los elementos insuficientes; eso es casi siempre más barato que un equipo mayor o un régimen más alto, y es la única intervención que sí mejora el rendimiento.","r":"EN 442"},"afgifte_derating":{"t":"La emisión entrega considerablemente menos en este régimen","d":"A {aan}/{ret} °C, {type} entrega aún el {pct} % de la potencia nominal. Cuente con unos {nodig} kW nominales para cubrir la carga. Compruébelo local por local: la media no dice nada, lo que importa es el local más ajustado.","r":"EN 442"},"afgifte_ok":{"t":"La emisión se ajusta al régimen elegido","d":"En este régimen, {type} entrega aún el {pct} % de la potencia nominal. Compruebe no obstante el local con la relación más desfavorable entre carga y emisión instalada.","r":"EN 442"},"wand_niet_gedimensioneerd":{"t":"La calefacción por pared no se dimensiona aquí","d":"Se ha marcado calefacción por pared, pero esta hoja solo dimensiona el suelo radiante. La norma EN 1264-5 emplea para paredes parámetros propios que aquí no están incluidos; haga determinar la emisión y la temperatura del agua por separado. Mantenga la temperatura superficial por debajo de unos {max} °C y preste atención a la ubicación de armarios y conducciones.","r":"EN 1264-5"},"vloer_oververhit":{"t":"Suelo radiante por encima de la temperatura superficial admisible","d":"El flujo de calor exigido es de {nodig} W/m², mientras que con la temperatura superficial máxima de 29 °C en la zona ocupada es posible aportar unos {max} W/m². La temperatura superficial calculada resulta {opp} °C — lo cual no solo excede la norma, sino que además resulta incómodo. Aumente la superficie de tubería, reduzca el paso de montaje o complemente con un segundo sistema de emisión.","r":"EN 1264"},"vloerafwerking":{"t":"Acabado de suelo con alta resistencia térmica","d":"Con R = {r} m²K/W, la temperatura del agua debe subir hasta unos {tmed} °C para ceder el mismo calor. Este es el asesino silencioso de proyectos por excelencia: el promotor elige el suelo con independencia de la instalación, y el rendimiento de la bomba de calor lo sigue. Fije la resistencia máxima admisible en el pliego y comuníquela.","r":"EN 1264"},"legoppervlak":{"t":"Superficie de montaje limitada para el suelo radiante","d":"Con un {pct} % de superficie disponible, el mismo calor debe pasar por menos metros cuadrados y la temperatura del agua sube en consecuencia. Compruebe si los armarios y equipos fijos ocuparán realmente ese lugar, y considere la calefacción por pared como complemento.","r":"EN 1264"},"tabs_te_zwaar":{"t":"La losa térmica activa no puede asumir la carga de calefacción","d":"Se exigen {nodig} W/m² mientras que una losa térmica activa aporta unos {max} W/m². La losa cubre la carga base; la punta debe proceder de un segundo sistema, más rápido. Calcule ambos en lugar de confiar en que la masa lo absorba.","r":"ISO 11855"},"tabs_koel_te_zwaar":{"t":"La losa térmica activa no puede asumir sola la carga de refrigeración","d":"Se exigen {nodig} W/m² frente a unos {max} W/m² disponibles. Complemente con una regulación terminal, o reduzca la carga de refrigeración con protección solar exterior — esto último es casi siempre más barato que potencia de instalación.","r":"ISO 11855"},"tabs_zonder_massa":{"t":"Losa térmica activa sin masa térmica","d":"En un edificio ligero o bajo un techo suspendido, la activación del núcleo de hormigón no tiene masa activa y por tanto carece de efecto. Elija otro sistema de emisión, o deje la masa vista y acepte sus consecuencias acústicas.","r":"ISO 11855"},"tabs_onderbroken":{"t":"Sistema lento con un uso muy intermitente","d":"La losa térmica activa reacciona en horas. Con un patrón de uso muy intermitente, el calor llega tarde y deja de llegar tarde también, con sobrecalentamiento e infracalentamiento como consecuencia. Considere un sistema más rápido, o acepte que la losa solo cubra la base.","r":"—"},"condens_plafond":{"t":"Riesgo de condensación en el techo frío","d":"La temperatura de impulsión de {aan} °C está demasiado cerca del punto de rocío previsto de {dauw} °C. Sin deshumectación en otro punto y sin vigilancia del punto de rocío, el techo gotea el primer día bochornoso. Suba la temperatura de impulsión, o asegure la deshumectación mediante el tratamiento de aire y una sonda en impulsión y en el local.","r":"ISO 11855; EN 14240"},"straling_zonder_ontvochtiging":{"t":"Refrigeración radiante sin deshumectación","d":"Una superficie refrigerada solo absorbe calor sensible. Sin deshumectación, la humedad sube hasta que el punto de rocío alcanza el límite del sistema, justo en los días más calurosos. Regule la deshumectación en el tratamiento de aire.","r":"—"},"gemengde_regimes":{"t":"Suelo radiante y radiadores en un mismo régimen","d":"El generador debe entonces suministrar la temperatura más alta y el rendimiento sigue a los radiadores, no al suelo. Prevea un grupo de mezcla, o — mejor — sustituya los radiadores para que todo el edificio pueda funcionar en el régimen bajo.","r":"—"},"latent_zonder_ontvochtiging":{"t":"Carga latente del {pct} % sin deshumectación","d":"La humedad tiene que ir a alguna parte. Sin deshumectación en el tratamiento de aire o en los fancoils, la humedad relativa sube hasta que el confort desaparece y hay que reducir la refrigeración radiante. Defina dónde se deshumecta y con qué potencia.","r":"EN 16798-1"},"boven_max_temp":{"t":"Temperatura de impulsión exigida por encima del rango de la bomba de calor","d":"Se exigen {aan} °C mientras que el equipo entrega como máximo {max} °C. Compruebe además si ese máximo también se alcanza a la temperatura de fuente más baja — muchos equipos solo alcanzan su máximo con temperaturas exteriores suaves, y ese es precisamente el momento en que no lo necesita.","r":"EN 14511"},"hoog_regime":{"t":"Temperatura de impulsión alta para una bomba de calor","d":"A {aan} °C, el COP en condiciones de diseño ronda {cop}. Cada grado menos aporta aproximadamente un 2 a 3 % más de rendimiento. Estudie primero si el régimen puede bajarse mediante la sustitución selectiva de elementos de emisión; eso se amortiza sobradamente a lo largo de la vida útil.","r":"EN 14511"},"kleine_spreiding":{"t":"Salto térmico muy pequeño","d":"Con un salto de {dt} K, el caudal de agua es de {debiet} m³/h — eso exige tuberías generosas y cuesta energía de bombeo todo el año. Compruebe que el dimensionado de las tuberías y la selección de la bomba se basan en esto y no en un régimen de caldera.","r":"—"},"grote_spreiding":{"t":"Salto térmico grande en una bomba de calor","d":"Con {dt} K, la bomba de calor debe procesar un retorno bajo mientras produce una impulsión alta. La mayoría de los equipos están diseñados para 5 a 8 K; compruebe si las prestaciones declaradas siguen siendo válidas con este salto.","r":"EN 14511"},"geen_stooklijn":{"t":"Sin regulación por curva de calefacción","d":"Sin curva de calefacción, la instalación funciona toda la temporada a la temperatura de diseño, mientras que a 7 °C exterior basta con mucho menos. Esta es una ganancia de rendimiento casi gratuita, y omitirla elimina gran parte de la ventaja de la bomba de calor.","r":"—"},"regime_niet_vastgelegd":{"t":"Régimen no fijado contractualmente","d":"Fije la impulsión, el retorno y el salto térmico con puntos de medida en la recepción. Sin ese acuerdo, el régimen se desliza al alza silenciosamente durante la ejecución y después nadie es responsable del rendimiento decepcionante.","r":"—"},"tekort_zonder_bijstook":{"t":"Déficit de potencia sin apoyo","d":"En condiciones de diseño, la bomba de calor entrega unos {cap} kW, mientras que la carga es mayor; faltan {tekort} kW y no hay apoyo previsto. Elija un equipo mayor o prevea apoyo — pero calcule primero cuál de las dos opciones es más barata a lo largo de la vida útil.","r":"—"},"bivalentpunt_hoger":{"t":"Punto bivalente real más alto de lo deseado","d":"Calculado, el punto se sitúa en {werkelijk} °C frente a los {gewenst} °C deseados; la bomba de calor cubre entonces aproximadamente el {dekking} % de la demanda de calor anual. Un equipo algo mayor desplaza este punto considerablemente y reduce la fracción de apoyo, más caro.","r":"—"},"lage_dekking":{"t":"Baja cobertura por parte de la bomba de calor","d":"Aproximadamente el {dekking} % de la demanda de calor anual procede de la bomba de calor; el resto procede del apoyo ({backup}). Con apoyo eléctrico, eso supone una factura anual considerablemente más alta de lo que sugiere el folleto.","r":"—"},"elektrische_bijstook":{"t":"Apoyo eléctrico de unos {kw} kW","d":"Cada kilovatio-hora cuesta uno, donde la bomba de calor entrega de tres a cinco. Pregunte cuántas horas de funcionamiento se esperan al año y calcúlelo con la tarifa — a menudo resulta que una bomba de calor algo mayor sale más barata en pocos años.","r":"—"},"aanuit_zonder_buffer":{"t":"Equipo todo/nada sin depósito de inercia","d":"Un equipo no modulante sin depósito de inercia arranca y para continuamente, lo que cuesta rendimiento y vida útil. Prevea unos {liter} litros, o elija un equipo modulante.","r":"—"},"geen_regeneratie":{"t":"Energía geotérmica sin regeneración","d":"Un terreno del que solo se extrae se enfría con los años y el rendimiento baja con él. La refrigeración pasiva en verano recarga el terreno y además aporta refrigeración casi gratuita — es la razón más sólida para elegir energía geotérmica, y se olvida a menudo en la oferta.","r":"—"},"warmtenet_voorwaarden":{"t":"Condiciones de la red de calor no fijadas","d":"La temperatura de retorno máxima admisible es, en una red de calor, la condición de contorno estricta: se mide, a menudo lleva penalizaciones asociadas y determina todo el diseño de la emisión. Solicite las condiciones de conexión antes de elegir la emisión.","r":"—"},"cop_punten":{"t":"Rendimiento estimado en este régimen","d":"A {aan} °C de impulsión: COP {copOntwerp} en condiciones de diseño, {copMild} con temperatura exterior suave, media estacional estimada {copSeizoen}. Esto es una aproximación de Carnot — solicite los valores certificados en estos puntos y compare.","r":"EN 14511 / EN 14825"},"sww_rendement":{"t":"El agua caliente sanitaria reduce el rendimiento estacional","d":"Con una temperatura de acumulación de {t} °C, la bomba de calor trabaja con un COP {copSww}, frente a {copCv} para la calefacción. La demanda de calor anual para agua sanitaria es de unos {kwh} kWh, lo que equivale a unos {elek} kWh de electricidad. Trátelo como un sistema aparte: una estación de agua fresca, una temperatura de acumulación más baja o una etapa de alta temperatura independiente aportan aquí más que cualquier optimización de la calefacción.","r":"EN 14825"},"verswater_circulatie":{"t":"Estación de agua fresca con tubería de circulación","d":"Una estación de agua fresca debe su ventaja a la ausencia de agua caliente estancada. Con una tubería de circulación, eso vuelve en parte, incluida la pérdida continua. Estudie si la circulación puede activarse por horario o por demanda, y aísle con generosidad.","r":"—"},"legionella_elektrisch":{"t":"Ciclo antilegionela con apoyo eléctrico","d":"El calentamiento periódico a 60 °C o más se realiza en la práctica casi siempre con la resistencia eléctrica, porque la bomba de calor no alcanza esa temperatura. Pregunte cuántos kilovatios-hora cuesta ese ciclo al año; a menudo es más de lo esperado, y con un principio de flujo continuo se puede evitar.","r":"Normativa nacional de legionela"},"boilerspiraal":{"t":"Superficie de intercambio del depósito acumulador","d":"Un serpentín demasiado pequeño para una bomba de calor obliga a elevar la temperatura de condensación y cuesta rendimiento en cada carga. Solicite la superficie de intercambio en m² y la potencia a su temperatura de impulsión — no a la de una caldera.","r":"—"},"circulatieverlies":{"t":"Pérdida de la tubería de circulación","d":"Con una tubería de circulación mal aislada, la pérdida puede ser mayor que el consumo útil de agua. Solicite una estimación de esa pérdida y un aislamiento reforzado; conmute por horario o por demanda siempre que sea posible.","r":"—"},"voorrang_snel_systeem":{"t":"Prioridad al agua sanitaria con un sistema de emisión rápido","d":"Con calefacción por aire o fancoils, la interrupción de la calefacción se nota en menos de diez minutos. Fije cuánto puede durar la interrupción y si se mantiene una emisión mínima.","r":"—"},"buffer_te_klein":{"t":"Volumen de depósito de inercia menor que el calculado","d":"Elegidos {gekozen} litros frente a unos {nodig} litros que resultan del tiempo mínimo de funcionamiento y del desescarche. Un depósito demasiado pequeño deja que el equipo siga ciclando; eso cuesta rendimiento y vida útil.","r":"—"},"geen_buffer":{"t":"Sin depósito de inercia en un equipo no totalmente modulante","d":"Pregunte al fabricante el tiempo mínimo de funcionamiento y el volumen mínimo de agua en la instalación. Con suelo radiante, el contenido propio suele bastar; con radiadores con válvulas termostáticas, casi nunca.","r":"—"},"evenwichtsfles":{"t":"Colector abierto o botellón de equilibrado","d":"Un botellón de equilibrado mal dimensionado mezcla impulsión y retorno: la bomba de calor ve un retorno demasiado alto, modula a la baja y el rendimiento cae — sin que nada esté averiado. Evite la separación hidráulica siempre que pueda, y hágala calcular donde sea imprescindible.","r":"—"},"geen_inregeling":{"t":"Sin equilibrado hidráulico previsto","d":"Sin equilibrado, el circuito más cercano recibe todo y el más lejano nada, y eso se compensa con una temperatura de impulsión más alta — justo lo que se quería evitar. Es la diferencia entre una instalación que funciona a 35 °C y la misma instalación obligada a funcionar a 45 °C.","r":"—"},"vulwater":{"t":"Agua de llenado sin tratar","d":"La cal en un intercambiador de canales estrechos cuesta potencia de inmediato, y el oxígeno genera magnetita que obstruye bombas y válvulas. La mayoría de los fabricantes condicionan su garantía a la calidad del agua de llenado. Solicite un análisis en la recepción y al cabo de un año.","r":"VDI 2035"},"vulwater_onbepaald":{"t":"Calidad del agua de llenado aún sin determinar","d":"Fije la exigencia antes del pedido e inclúyala en el dosier de recepción, junto con los valores medidos. A posteriori ya no puede demostrarse con qué se llenó.","r":"VDI 2035"},"geen_vuilafscheider":{"t":"Sin separación de suciedad y aire en tuberías existentes","d":"Las tuberías existentes contienen magnetita y lodos que en el primer arranque van directos al nuevo intercambiador. Un separador de suciedad magnético y un separador de microburbujas justo antes del generador no son aquí un lujo, sino la condición para conservar la garantía.","r":"—"},"glycol":{"t":"Glicol en el sistema ({pct} %)","d":"El glicol reduce la capacidad térmica y aumenta la viscosidad: más caudal y considerablemente más energía de bombeo para la misma potencia. Limítelo al circuito donde realmente puede haber riesgo de helada y sepárelo hidráulicamente.","r":"—"},"pompenergie":{"t":"Fracción alta de energía de bombeo","d":"Estimada en {kw} kW, aproximadamente el {pct} % de la potencia de calefacción. La energía auxiliar cuenta en el rendimiento estacional real y rara vez se mide. Compruebe el punto de trabajo de las bombas y la pérdida de carga de la red.","r":"—"},"expansievat":{"t":"Vaso de expansión de unos {liter} litros","d":"Calculado para un contenido de sistema de {volume} litros. Compruebe la presión de precarga frente a la altura estática y sitúe el vaso en el lado de aspiración de la bomba.","r":"EN 12828"},"tweepijps_gelijktijdig":{"t":"Sistema de dos tubos con demanda simultánea de calor y frío","d":"Las zonas que quieren calentar y refrigerar a la vez no pueden hacerlo con una única conmutación estacional. Elija un sistema de cuatro tubos, una red de fuente con bombas de calor descentralizadas, o VRF con recuperación — de lo contrario, toda la temporada intermedia generará quejas.","r":"—"},"vrije_koeling_gemist":{"t":"Refrigeración gratuita no aprovechada con un régimen de frío alto","d":"A {t} °C de impulsión, en nuestra región es posible la refrigeración gratuita durante gran parte del año, con solo energía de bombeo. Es el argumento más sólido para fijar el régimen de frío alto; aprovéchelo.","r":"—"},"geen_terugwinning":{"t":"Demanda simultánea de calor y frío sin recuperación","d":"El calor procedente de la refrigeración es utilizable todo el año para el agua sanitaria o para calentar otras zonas. Un sistema con recuperación se amortiza aquí casi siempre.","r":"—"},"koeltoren_legionella":{"t":"Torre de refrigeración húmeda — se exige plan de gestión","d":"Una torre de refrigeración húmeda es energéticamente favorable y conlleva un plan de gestión frente a la legionela, además de atención a su posición respecto a las tomas de aire de este edificio y de los vecinos.","r":"Normativa nacional de legionela"},"koudwater_te_koud":{"t":"Temperatura de agua fría baja con refrigeración radiante","d":"A {t} °C de impulsión, la refrigeración radiante o la losa térmica activa no pueden operarse con seguridad por riesgo de condensación, y además se pierde la posibilidad de refrigeración gratuita. Separe los circuitos: agua fría para deshumectar, agua templada para la radiación.","r":"—"},"aansluiting_te_klein":{"t":"Potencia de conexión eléctrica insuficiente","d":"Estimados {nodig} kW simultáneos frente a {beschikbaar} kW disponibles. Ampliar la potencia contratada tarda meses y a veces cuesta más que la propia instalación. Compruébelo antes del pedido, y estudie si la punta puede repartirse mediante la regulación.","r":"—"},"aansluiting_onbekend":{"t":"Potencia de conexión eléctrica no indicada","d":"Esta es la sorpresa más frecuente de un proyecto con bomba de calor. Solicite la potencia contratada disponible y sume bomba de calor, apoyo, preparación de agua sanitaria y cualquier infraestructura de carga para la hora más fría del año.","r":"—"},"propaan_binnen":{"t":"Propano (R290) en instalación interior","d":"El R290 es muy inflamable y más pesado que el aire: se acumula en los espacios más bajos. Solicite la cantidad de carga, el tamaño mínimo del local, los requisitos de ventilación y la distancia a sótanos, arquetas y aberturas — y hágalo antes de fijar el emplazamiento.","r":"EN 378; IEC 60335-2-40"},"geluidseis_onbekend":{"t":"Sin exigencia acústica indicada","d":"El ruido de las unidades exteriores es, en las bombas de calor, la queja más frecuente y el motivo más habitual de intervención administrativa. Busque el valor límite aplicable en el punto de evaluación, y preste atención al valor nocturno — precisamente de noche el equipo sigue funcionando.","r":"Condiciones ambientales regionales"},"geluid_dichtbij":{"t":"Unidad exterior próxima a un punto de evaluación sin medidas","d":"A {d} m con una exigencia de {db} dB(A), casi con seguridad se necesita alguna medida. Atención: el modo nocturno reduce el ruido y también la potencia, justo cuando más frío hace fuera — calcule si el edificio lo puede asumir.","r":"—"},"condens_buitendeel":{"t":"Evacuación de condensados de la unidad exterior sin resolver","d":"Una bomba de calor aerotérmica produce decenas de litros de condensados al día en caso de helada. Sin evacuación calefactada o lecho de grava, eso se congela bajo el equipo y en el camino contiguo — con riesgo de caída y un ventilador bloqueado como consecuencia.","r":"—"},"geen_octaafband":{"t":"No se han solicitado datos por banda de octava","d":"Un único valor en dB(A) no basta para un cálculo acústico, y menos aún para la componente de baja frecuencia, que atraviesa las fachadas y es la que más molesta.","r":"—"},"geen_vorstbeveiliging":{"t":"Protección antihielo sin resolver en caso de fallo","d":"¿Qué ocurre ante una avería durante el periodo de heladas, y quién recibe el aviso? En un edificio con mucha agua en el suelo, esta no es una pregunta teórica.","r":"—"},"geen_rendementsmeting":{"t":"Sin medición de calor y electricidad en el generador","d":"Sin ambos contadores no puede determinarse el rendimiento estacional real, y toda discusión sobre prestaciones decepcionantes queda sin resolver. Es precisamente por eso por lo que esos contadores faltan tan a menudo — inclúyalos en la solicitud de oferta.","r":"—"},"hulpenergie_ongemeten":{"t":"Energía auxiliar no medida por separado","d":"Bombas, desescarche, electrónica y circulación se suman y a menudo explican la diferencia entre el rendimiento prometido y el medido. Un contador aparte cuesta poco y hace la discusión objetiva.","r":"—"},"geen_inregelrapport":{"t":"No se ha solicitado informe de equilibrado","d":"Caudales por circuito, medidos y registrados. Sin este informe no puede demostrarse que la instalación pueda funcionar en el régimen de diseño, y nadie tiene motivo para comprobarlo.","r":"—"},"geen_nulmeting":{"t":"Sin medición de prestaciones en la recepción","d":"Impulsión, retorno, caudal, potencia absorbida y potencia cedida en un estado de funcionamiento definido. Sin esta medición inicial, después no puede determinarse si algo ha cambiado.","r":"—"},"geen_nameting":{"t":"Sin medición posterior tras la primera temporada de calefacción","d":"El rendimiento real solo se revela al cabo de una temporada completa. Una cita de seguimiento para ajustar la curva de calefacción y los parámetros suele aportar un ahorro del diez al veinte por ciento — más que la mayoría de las elecciones de componentes.","r":"—"},"scop_zonder_garantie":{"t":"Exigencia de rendimiento sin garantía de prestaciones","d":"Un rendimiento estacional exigido sin límites de medición, método de medida y consecuencias acordadas en caso de no alcanzarlo es un deseo, no una exigencia. Fije qué ocurre si no se alcanza.","r":"—"},"doorlooptijd_boringen":{"t":"Plazo de permiso y sondeos","d":"La energía geotérmica exige permiso, a veces un ensayo de respuesta térmica y siempre planificación con una empresa perforadora. Ese plazo determina el calendario con más frecuencia que el plazo de entrega de los equipos. Inicie el trámite antes del pedido.","r":"Normativa de energía geotérmica"},"geen_selectierapport":{"t":"No se ha solicitado informe de selección con la oferta","d":"Solicite las prestaciones a su temperatura de impulsión, caudal y temperatura de fuente. Ese único documento hace por primera vez comparables las propuestas de distintos fabricantes — sin él, está comparando folletos.","r":"—"},"profiel_note":{"t":"Punto de atención para este tipo de edificio","d":"{note}","r":"{basis}"}},"mot":{"last":{"m":"Carga de diseño","w":"Punto de partida de todas las potencias y de la línea de edificio con la que se determina el punto bivalente.","d":"Calefacción {kw} kW ({spec} W/m²), refrigeración {kwK} kW; de {tOut} °C exterior a {tIn} °C interior. Coeficiente de pérdidas térmicas {ua} kW/K.","n":"EN 12831"},"regime":{"m":"Régimen de temperatura","w":"El hilo conductor: conecta la emisión con la generación y determina el rendimiento.","d":"{aan}/{ret} °C, salto térmico {dt} K, caudal de agua {debiet} m³/h.","n":"—"},"opwekker_wp":{"m":"Bomba de calor","w":"Tipo {type}, seleccionada para el régimen fijado más arriba.","d":"Nominal {kw7} kW a A7/W35, en condiciones de diseño aún {capOntwerp} kW. COP {copOntwerp} en diseño, estimación estacional {copSeizoen}. Punto bivalente {biv} °C, cobertura de aproximadamente el {dekking} % de la demanda de calor anual.","n":"EN 14511 / EN 14825"},"opwekker_overig":{"m":"Generación","w":"Tipo {type}.","d":"Potencia de diseño {kw} kW.","n":"—"},"bijstook":{"m":"Apoyo","w":"Cubre el déficit por debajo del punto bivalente; estrategia {strategie}.","d":"Necesario {kw} kW, tipo {type}.","n":"—"},"afgifte_rad":{"m":"Emisión — {type}","w":"Entrega, en el régimen elegido, el {pct} % de la potencia nominal según EN 442.","d":"Para cubrir la carga se requieren unos {nodig} kW nominales.","n":"EN 442"},"afgifte_vloer":{"m":"Suelo radiante","w":"Emisión de base a baja temperatura; limitada por la temperatura superficial admisible.","d":"Exigidos {nodig} W/m² de un máximo de {max} W/m²; temperatura superficial {opp} °C, temperatura de agua necesaria de unos {tmed} °C con un acabado de R = {r} m²K/W.","n":"EN 1264"},"afgifte_tabs":{"m":"Losa térmica activa","w":"Cubre la carga base con la masa del edificio; lenta y autorregulante.","d":"Exigidos {warm} W/m² de calor de un máximo de {maxWarm}, y {koud} W/m² de frío de un máximo de {maxKoud}.","n":"ISO 11855"},"sww":{"m":"Agua caliente sanitaria","w":"Sistema aparte con un nivel de temperatura propio, más desfavorable; tipo {systeem}.","d":"{liter} l/día a {t} °C, {kwh} kWh/día y unos {jaar} kWh/año. COP {cop}, es decir, unos {elek} kWh de electricidad al año.","n":"—"},"buffer":{"m":"Depósito de inercia","w":"Cubre el tiempo mínimo de funcionamiento del generador y aporta volumen para el desescarche.","d":"Recomendados {liter} litros con un tiempo mínimo de funcionamiento de {looptijd} min; solo para el desescarche bastarían {ontdooi} litros. Tipo {mode}.","n":"—"},"expansie":{"m":"Vaso de expansión","w":"Absorbe la dilatación del agua y mantiene la presión dentro del rango de trabajo.","d":"Unos {liter} litros para un contenido de sistema de {volume} litros.","n":"EN 12828"},"energie":{"m":"Balance anual (indicativo)","w":"Orden de magnitud para comparar variantes, no para liquidar cuentas.","d":"Demanda de calor {warmte} kWh/año; electricidad calefacción {elek} kWh, agua sanitaria {swwElek} kWh, en total unos {totaal} kWh.","n":"Aproximación por grados-día"}},"sec":{"project":{"title":"Proyecto y edificio","intro":"¿De qué tipo de edificio se trata, qué tan buena es la envolvente y quién lo utiliza? La calidad de la envolvente determina la carga, y la carga determina si un régimen de baja temperatura es siquiera alcanzable."},"belasting":{"title":"Cargas","intro":"La potencia de diseño, no la potencia de la caldera existente. Una caldera está casi siempre notablemente sobredimensionada; quien adopta ese valor compra una bomba de calor dos tallas demasiado grande y que por ello modula mal."},"afgifte":{"title":"Sistemas de emisión","intro":"Lo que hay instalado en el local determina qué temperatura debe entregar el generador — no al revés. Por eso este bloque precede a la elección de la bomba de calor. El cálculo muestra qué potencia entrega realmente un radiador existente con un régimen bajo."},"regime":{"title":"Régimen de temperatura","intro":"El hilo conductor de todo el diseño. Cada grado menos en la impulsión aporta aproximadamente entre un 2 y un 3 % más de rendimiento de la bomba de calor — y cuesta superficie de emisión. Aquí hace explícito ese intercambio, en lugar de dejar que simplemente ocurra."},"opwekking":{"title":"Generación de calor","intro":"Solo ahora le toca el turno al generador, porque ya está fijado qué temperatura debe entregar. Pida siempre las prestaciones para su propio régimen, no para las condiciones normalizadas del folleto."},"koude":{"title":"Generación de frío","intro":"La refrigeración rara vez es un sistema aislado. La pregunta no es solo de dónde viene el frío, sino también adónde va el calor — y si ese calor es aprovechable en otra parte del edificio."},"bivalentie":{"title":"Bivalencia, apoyo y seguridad de suministro","intro":"Una bomba de calor que cubre por sí sola toda la carga de diseño resulta sobredimensionada el resto del año. Una demasiado pequeña deja el edificio frío. El punto bivalente es el lugar donde usted toma esa decisión de forma consciente."},"sww":{"title":"Agua caliente sanitaria","intro":"El apartado que con más frecuencia echa por tierra todo el diseño de baja temperatura. La calefacción pide 35 °C, el agua caliente sanitaria pide entre 55 y 60 °C — la misma bomba de calor entrega ahí casi la mitad de rendimiento. Trátelo como un sistema aparte."},"hydraulica":{"title":"Hidráulica, depósito de inercia y circuito de agua","intro":"Donde más instalaciones de bomba de calor fallan realmente. Una separación hidráulica mal colocada o un depósito de inercia en el lugar equivocado destruyen el salto térmico, y con él el rendimiento, sin que nada esté averiado."},"distributie":{"title":"Distribución y zonificación","intro":"Cómo llega la energía del generador al local, y dónde están los límites de responsabilidad y de medición. En instalaciones colectivas esto es también una cuestión jurídica, no solo técnica."},"regeling":{"title":"Regulación y control","intro":"En una caldera, la regulación corrige errores de diseño; en una bomba de calor, los amplifica. Entregar de forma lenta, mantener el régimen bajo y anticiparse es aquí lo esencial."},"energie":{"title":"Energía, medición y tarifas","intro":"Lo que la instalación va a costar realmente depende tanto de las tarifas y de la simultaneidad como del rendimiento. Este bloque hace visible la explotación junto a la inversión."},"opstelling":{"title":"Ubicación, ruido y seguridad","intro":"Dónde se colocan los equipos determina si pueden estar ahí. El ruido de las unidades exteriores es, en las bombas de calor, la queja más frecuente y el motivo más frecuente de un procedimiento de inspección."},"normen":{"title":"Normativa, permisos y ayudas","intro":"Lo que exige la ley y lo que permite la financiación. Ambos tienen plazos que condicionan la planificación — con más frecuencia que el plazo de entrega de los equipos."},"uitvoering":{"title":"Ejecución, recepción y gestión","intro":"Una instalación de bomba de calor que no se equilibra hidráulicamente nunca alcanza su rendimiento — y nadie lo nota, porque al fin y al cabo calienta. Este bloque establece cómo, aun así, usted sí lo nota."}},"q":{"prj_name":{"label":"Nombre del proyecto"},"prj_client":{"label":"Promotor / cliente","help":"¿Quién decide entre inversión y costes de explotación? En el caso de un inversor que alquila, esas dos decisiones recaen en partes distintas — eso cambia toda la ponderación."},"prj_location":{"label":"Ubicación","help":"Determina la temperatura exterior de diseño, los grados-día y la disponibilidad de red de calor o de energía geotérmica."},"prj_ref":{"label":"Referencia"},"prj_author":{"label":"Elaborado por"},"prj_date":{"label":"Fecha"},"geb_type":{"label":"Tipo de edificio","help":"Determina los valores de partida para carga, régimen, simultaneidad y la cuestión de si siquiera hace falta refrigerar."},"prj_aard":{"label":"Naturaleza del proyecto","help":"Si solo se sustituye el generador, el sistema de emisión ya está fijado, y con él el régimen. Es exactamente la situación en la que una bomba de calor sobre radiadores existentes decepciona — esta ficha se lo calcula.","options":{"nieuwbouw":"Obra nueva","renovatie":"Reforma con mejora de la envolvente","vervanging":"Sustitución del generador, emisión existente","uitbreiding":"Ampliación"}},"geb_area":{"label":"Superficie útil calefactada"},"geb_volume":{"label":"Volumen calefactado","help":"Para el tiempo de calentamiento y para los sistemas del lado de aire."},"geb_bouwjaar":{"label":"Año de construcción","help":"Indicación aproximada de la calidad de la envolvente cuando no hay cálculo disponible."},"geb_schil":{"label":"Calidad de la envolvente del edificio","help":"La pregunta más importante de este bloque. Una envolvente mal aislada exige una temperatura de impulsión alta, y precisamente ahí es donde una bomba de calor rinde menos. Aislar antes de sustituir el generador es casi siempre el orden más económico.","options":{"passief":"Pasivo / muy bien aislado","goed":"Bueno — obra nueva reciente","gemiddeld":"Medio — aislado a posteriori","matig":"Mediocre — aislamiento limitado","slecht":"Malo — sin aislar"}},"geb_luchtdicht":{"label":"Estanqueidad al aire (n50 o v50)","help":"Con una envolvente poco estanca, la carga por infiltración es una parte considerable de la potencia de diseño, y además esa carga depende del viento — por tanto, no es regulable."},"geb_massa":{"label":"Masa térmica","help":"Determina si la regulación lenta funciona. La activación del núcleo de hormigón (losa térmicamente activa) requiere masa; en un edificio ligero con falso techo no tiene efecto y es dinero tirado.","options":{"zwaar":"Pesada — hormigón visto","gemiddeld":"Media","licht":"Ligera — entramado de madera, falso techo"}},"geb_gebruik":{"label":"Patrón de uso","help":"Con un uso muy discontinuo, un sistema lento como el suelo radiante o la losa térmicamente activa no es adecuado: no puede calentarse a tiempo ni detenerse a tiempo.","options":{"continu":"Continuo, 24/7","kantooruren":"Horario de oficina","onderbroken":"Muy discontinuo","seizoen":"Estacional"}},"geb_zones":{"label":"Número de zonas térmicas","help":"Zonas con ocupación, orientación o exigencias distintas. Cada zona que quiere calentar y refrigerar a la vez empuja la elección de sistema hacia cuatro tubos o hacia una bomba de calor con recuperación de calor."},"geb_gelijktijdig":{"label":"¿Pueden las zonas calentar y refrigerar a la vez?","help":"Sol en la fachada sur y sombra en la norte, o sala de servidores junto a una oficina. Si es así, un sistema de dos tubos con conmutación estacional resulta insuficiente, por económico que parezca.","options":{"ja":"Sí","nee":"No"}},"bel_basis":{"label":"¿En qué se basa la potencia?","help":"Un cálculo por local según EN 12831 es la única base sobre la que puede comprobar la emisión local por local. Un valor específico sirve para una primera estimación; los datos de consumo de tres años suelen ser más fiables que un cálculo con hipótesis erróneas.","options":{"berekening":"Cálculo de carga térmica por local","opgegeven":"Potencia total indicada","specifiek":"Valor específico por m² (orientativo)","verbruik":"Derivada del consumo real"}},"bel_spec_heat":{"label":"Potencia de calefacción específica","help":"Passivhaus 10–20, obra nueva reciente 30–40, aislado a posteriori 45–70, sin aislar 90–140 W/m². Utilice este valor solo para una primera estimación."},"bel_heat_kw":{"label":"Potencia de calefacción","help":"Sin el suplemento por arranque; ese se indica aparte más abajo, para que quede visible de dónde procede."},"bel_opwarm":{"label":"Suplemento por arranque tras interrupción","help":"Cero en servicio continuo. Con reducción nocturna diaria en un edificio pesado, el suplemento puede llegar al 20–30 % — y ese suplemento determina entonces toda la potencia del generador. Considere precalentar más tiempo en lugar de más potencia."},"bel_cooling":{"label":"¿Se refrigera?","options":{"ja":"Sí","nee":"No"}},"bel_spec_cool":{"label":"Potencia de refrigeración específica","help":"Oficina con acristalamiento normal 40–60 W/m², con mucho vidrio o alta carga interna 70–100. La protección solar exterior reduce esto más que cualquier medida de instalación."},"bel_cool_kw":{"label":"Potencia de refrigeración"},"bel_latent":{"label":"Fracción de carga latente","help":"Decisiva para la elección de sistema. La refrigeración radiante y la losa térmicamente activa absorben únicamente calor sensible; la humedad debe evacuarse en otro punto — normalmente mediante la unidad de tratamiento de aire. Quien lo olvida obtiene condensación en el techo."},"bel_intern":{"label":"Carga térmica interna","help":"Personas, iluminación, equipos. En una oficina moderna suele ser la carga de refrigeración dominante, y reduce notablemente la demanda de calefacción durante el día."},"bel_proces":{"label":"Cargas de proceso o especiales","help":"Sala de servidores, cocina, línea de producción, piscina. A menudo son cargas que exigen refrigeración todo el año — y por tanto constituyen una fuente de calor gratuita para el resto del edificio."},"bel_gelijktijdigheid":{"label":"Factor de simultaneidad","help":"Con muchas viviendas sobre un mismo generador puede contarse con menos que la suma de los picos. Con un único edificio de una sola zona, no: ahí el pico sí se produce en todas partes a la vez."},"cnd_t_design":{"label":"Temperatura exterior de diseño","help":"Para Bélgica, habitualmente entre −8 y −11 °C según la zona y la masa del edificio. Determina, junto con la carga, la curva del edificio sobre la que se halla el punto bivalente."},"cnd_t_room":{"label":"Temperatura interior de calefacción"},"cnd_t_room_cool":{"label":"Temperatura interior de refrigeración"},"cnd_dewpoint_room":{"label":"Punto de rocío máximo previsto en el local","help":"El límite inferior para toda superficie refrigerada. A 25 °C y 55 % de HR el punto de rocío está en torno a 15 °C — un techo frío con 16 °C de impulsión se sitúa peligrosamente cerca. Sin deshumidificación, la refrigeración radiante no puede regularse con seguridad."},"cnd_degree_days":{"label":"Grados-día","help":"Para Bélgica, habitualmente en torno a 2000 K·d, base 15/15. Solo para la estimación anual orientativa."},"afg_types":{"label":"¿Qué sistemas de emisión están previstos o instalados?","help":"Las combinaciones son habituales: suelo radiante para la carga base y fancoils para la punta y para la refrigeración. Indique todo lo que vaya a instalarse, porque el mínimo común denominador determina el régimen de todo el circuito — salvo que trabaje con grupos separados y grupos de mezcla.","options":{"vloer":"Suelo radiante","wand":"Pared radiante","tabs":"Losa térmicamente activa","radiator":"Radiadores","convector":"Convectores","vloerconvector":"Convectores de suelo","ventilo":"Ventiloconvectores (fancoils)","koelplafond":"Techo frío / techo climático","balk":"Unidades de inducción / vigas climáticas","paneel":"Paneles radiantes","luchtverwarmer":"Calefacción por aire mediante la unidad de tratamiento de aire","vrf":"Unidades interiores VRF (expansión directa)"}},"afg_bestaand":{"label":"¿Se reutiliza la emisión existente?","help":"En caso afirmativo: haga levantar la potencia nominal instalada local por local. Sin ese inventario no puede determinarse si el régimen elegido es alcanzable, y cualquier promesa sobre la bomba de calor es una apuesta.","options":{"nee":"No, todo nuevo","deels":"Parcialmente","ja":"Sí, completamente"}},"afg_vloer_share":{"label":"Fracción de la carga vía suelo o pared radiante"},"afg_vloer_coverage":{"label":"Superficie de colocación disponible","help":"Bajo armarios fijos, muebles de cocina y equipos no se instala. Con un 60 % de superficie disponible, el mismo calor debe pasar por menos metros cuadrados, así que sube la temperatura del agua — a menudo lo justo para consumir la ventaja de la bomba de calor."},"afg_vloer_r":{"label":"Resistencia térmica del acabado del suelo","help":"Baldosa aproximadamente 0,02, laminado con base 0,10–0,15, moqueta hasta 0,20 m²K/W. Es el asesino de proyectos más silencioso que existe: el mismo suelo radiante exige bajo moqueta una temperatura del agua diez grados más alta que bajo baldosa. Fije la resistencia máxima admisible en el pliego y comuníquela al promotor."},"afg_vloer_spacing":{"label":"Paso de colocación","help":"Un paso menor reduce la temperatura de agua necesaria. 10 cm en lugar de 15 cm supone algunos grados y es económico en obra nueva; a posteriori ya no puede modificarse."},"afg_tabs_share":{"label":"Fracción de la carga vía losa térmicamente activa","help":"La losa térmicamente activa entrega aproximadamente 30–40 W/m² de calor y 40–50 W/m² de frío, y reacciona en horas, no en minutos. Cubre la carga base; la punta y la regulación por local deben provenir de un sistema más rápido."},"afg_koelplafond_share":{"label":"Fracción de la carga de refrigeración vía techo frío"},"afg_regelbaar":{"label":"Regulación por local","help":"Con suelo radiante y losa térmicamente activa, la regulación por local solo actúa con lentitud; sobrerregular provoca sobreoscilación y ciclado. Con una bomba de calor, el caudal continuo a baja temperatura y regulado por climatología suele ser mejor que el todo/nada por local.","options":{"thermostaat":"Termostato por zona","kraan":"Válvulas termostáticas","centraal":"Solo central, regulada por climatología","geen":"Sin regulación individual"}},"afg_meting":{"label":"¿Emisión existente inventariada por local?","help":"Tipo, dimensiones y potencia nominal por elemento. Es el trabajo que nadie quiere hacer y el que marca la diferencia entre una instalación que funciona y una que no.","options":{"ja":"Sí","nee":"No"}},"reg_t_flow":{"label":"Temperatura de impulsión de calefacción en condiciones de diseño","help":"Suelo radiante 30–38, losa térmicamente activa 26–32, radiadores nuevos 45–55, radiadores existentes a menudo 70–80 °C. Esta cifra decide qué generadores quedan disponibles."},"reg_t_return":{"label":"Temperatura de retorno de calefacción","help":"El salto térmico determina el caudal de agua y con ello los diámetros de tubería y la energía de bombeo. Una bomba de calor trabaja habitualmente con un salto de 5 K, una caldera con 20 K — eso supone un factor cuatro en caudal y afecta considerablemente al dimensionado de la red de tuberías."},"reg_weersafhankelijk":{"label":"¿Regulación climática de la temperatura de impulsión?","help":"Ganancia de rendimiento casi gratuita: con 7 °C exteriores basta una impulsión muy inferior a la necesaria con −8 °C. Sin curva de calefacción, la instalación funciona toda la temporada al valor de diseño y una bomba de calor pierde gran parte de su ventaja.","options":{"ja":"Sí","nee":"No"}},"reg_t_flow_cool":{"label":"Temperatura de impulsión de refrigeración","help":"Fancoils con deshumidificación 6–8 °C, refrigeración radiante y losa térmicamente activa 16–18 °C. Una temperatura de agua fría alta permite la refrigeración gratuita y una enfriadora que trabaje bien, pero excluye la deshumidificación — es una decisión de sistema, no un ajuste."},"reg_t_return_cool":{"label":"Temperatura de retorno de refrigeración"},"reg_glycol_pct":{"label":"Porcentaje de glicol","help":"El glicol reduce la capacidad calorífica y aumenta la viscosidad: al 30 % supone alrededor de un 10 % más de caudal y notablemente más energía de bombeo para la misma potencia. Empléelo solo donde realmente pueda darse helada, y separe entonces ese circuito hidráulicamente."},"reg_menggroepen":{"label":"¿Grupos de mezcla para regímenes distintos?","help":"Necesarios en cuanto suelo radiante y radiadores cuelgan del mismo generador. Atención: el generador debe entregar entonces la temperatura más alta, y el grupo de mezcla la reduce localmente — el rendimiento sigue, por tanto, a los radiadores, no al suelo. Valore si los radiadores no pueden sustituirse.","options":{"ja":"Sí","nee":"No"}},"reg_dt_marge":{"label":"¿Régimen fijado contractualmente con puntos de medición?","help":"Impulsión, retorno y salto térmico en condiciones de diseño, a medir en la recepción. Sin ese acuerdo, el régimen sube silenciosamente durante la ejecución y luego nadie es responsable del rendimiento decepcionante.","options":{"ja":"Sí","nee":"No"}},"opw_type":{"label":"Tipo de generador","help":"Los sistemas acoplados al terreno entregan una fuente estable todo el año y por tanto un rendimiento mucho más uniforme, pero exigen permiso, espacio y una inversión notablemente mayor. El sistema aire/agua es más sencillo y tiene precisamente en la helada su momento más débil — justo cuando el edificio más demanda.","options":{"lucht_water":"Bomba de calor aire/agua","grond_boring":"Bomba de calor tierra/agua — sondas verticales","grond_horizontaal":"Bomba de calor tierra/agua — colector horizontal","water_water":"Bomba de calor agua/agua — agua subterránea o superficial","afvoerlucht":"Bomba de calor sobre aire de extracción","lucht_lucht":"Bomba de calor aire/aire","hybride":"Híbrida — bomba de calor con caldera","gasketel":"Caldera de gas de condensación","elektrisch":"Calefacción eléctrica por resistencia","warmtenet":"Red de calor / calefacción urbana","wkk":"Cogeneración","biomassa":"Caldera de biomasa","zon_thermisch":"Colectores solares térmicos (complementarios)"}},"opw_hp_kw":{"label":"Potencia de la bomba de calor en A7/W35","help":"Los fabricantes indican la potencia en condiciones favorables. Solicite la tabla completa: potencia y COP en A−7/W45, A2/W35, A7/W35 y en su propia temperatura de impulsión. La diferencia entre esos puntos es mayor de lo que sugieren la mayoría de las ofertas."},"opw_source_t":{"label":"Temperatura de la fuente en condiciones de diseño","help":"En el caso del aire, es la temperatura exterior de diseño. En el terreno, habitualmente 0 a 5 °C; en el agua subterránea, 10 a 12 °C. Déjelo en blanco para derivarlo del tipo de fuente."},"opw_modulatie":{"label":"Regulación de la potencia","help":"Solicite la potencia modulante mínima, no solo el máximo. Una bomba de calor que no puede bajar de un 40 % de su potencia empieza a ciclar en las estaciones intermedias — eso cuesta rendimiento y vida útil, y con un depósito de inercia solo se atenúa, no se resuelve.","options":{"inverter":"Modulación continua (inverter)","stappen":"Varias etapas","aan_uit":"Todo/nada"}},"opw_koudemiddel":{"label":"Refrigerante","help":"El Reglamento F-Gas expulsa del mercado a los refrigerantes de alto PCA; el R290 se ha convertido por ello, de hecho, en el estándar para las bombas de calor de menor tamaño. El propano es altamente inflamable: eso condiciona el lugar de instalación, las distancias a aberturas y la existencia de sótanos o fosos en los que pudiera acumularse una fuga.","options":{"R290":"R290 propano (A3)","R32":"R32 (A2L)","R454C":"R-454C (A2L)","R1234ze":"R-1234ze (A2L)","R744":"R-744 CO₂","R410A":"R-410A (A1)"}},"opw_max_temp":{"label":"Temperatura máxima de impulsión de la bomba de calor","help":"Compruebe que este valor se alcanza también con la temperatura de fuente más baja — muchos equipos solo alcanzan su máximo con temperaturas exteriores suaves, y ese no es precisamente el momento en que lo necesita."},"opw_bron_detail":{"label":"Datos de la fuente","help":"Número y profundidad de las sondas, o superficie del colector horizontal, o caudal y temperatura del agua subterránea. Pregunte también por el test de respuesta térmica en proyectos mayores y por el balance anual entre extracción e inyección — un terreno del que solo se extrae se va enfriando con los años, y el rendimiento baja con él."},"opw_regeneratie":{"label":"¿Se prevé regeneración del terreno?","help":"La refrigeración pasiva en verano recarga el terreno y aporta refrigeración casi gratuita. Es el argumento más fuerte para optar por la energía geotérmica — y a menudo se olvida en la oferta.","options":{"ja":"Sí","nee":"No"}},"opw_warmtenet_detail":{"label":"Condiciones de la red de calor","help":"Temperatura de impulsión, temperatura de retorno garantizada, penalizaciones por retorno excesivo, potencia de conexión y estructura tarifaria. La temperatura de retorno máxima permitida es la condición de contorno estricta: determina todo su diseño de emisión y se mide."},"opw_bestaand":{"label":"Generación existente que permanece o desaparece","help":"En una sustitución por fases: ¿qué permanece, cómo se integra hidráulicamente y quién gestiona la transición?"},"kou_type":{"label":"Origen del frío","help":"La refrigeración pasiva por terreno solo consume energía de bombeo y a la vez recarga el terreno para el invierno. Entrega potencias limitadas a temperatura de agua alta — encaja exactamente con la losa térmicamente activa y el techo frío, y no es apta para deshumidificación.","options":{"reversibel":"Bomba de calor reversible","chiller":"Enfriadora independiente","passief_bodem":"Refrigeración pasiva del terreno (geocooling)","vrije_koeling":"Refrigeración gratuita con torre seca","vrf":"VRF con recuperación de calor","adiabatisch":"Refrigeración adiabática","warmtenet_koude":"Red de frío","geen":"Sin refrigeración activa"}},"kou_terugwinning":{"label":"¿Calefacción y refrigeración simultáneas con recuperación?","help":"En un edificio con sala de servidores, cocina u orientación norte-sur, el calor procedente de la refrigeración es aprovechable todo el año para agua caliente sanitaria o para la calefacción. Eso requiere un sistema de cuatro tubos o una bomba de calor con recuperación de calor, y casi siempre se amortiza.","options":{"ja":"Sí","nee":"No"}},"kou_condensor":{"label":"Evacuación de calor de la enfriadora","help":"Una torre de refrigeración húmeda es energéticamente la opción más favorable y conlleva un plan de control de legionela, además de atención a su ubicación respecto a las tomas de aire. Evacuar el calor al terreno es casi siempre la mejor opción cuando ya existen sondas.","options":{"lucht":"Refrigerada por aire","droog":"Torre seca con glicol","adiabatisch_cond":"Con apoyo adiabático","nat":"Torre de refrigeración húmeda","bodem":"Al terreno","water":"A agua superficial o subterránea"}},"kou_vrije_koeling":{"label":"¿Refrigeración gratuita con baja temperatura exterior?","help":"Con un régimen de refrigeración de 16/18 °C, la refrigeración gratuita es posible en nuestra región durante gran parte del año. Es el argumento más fuerte para fijar alto el régimen de frío — y solo funciona si el sistema de emisión es compatible.","options":{"ja":"Sí","nee":"No"}},"kou_ontvochtiging":{"label":"¿Dónde se deshumidifica?","help":"La pregunta de la que depende que la refrigeración radiante funcione o no. Sin deshumidificación en otro punto, un techo frío o una losa térmicamente activa nunca puede bajar del punto de rocío, así que la regulación debe limitar la temperatura superficial — con pérdida de potencia precisamente en los días más calurosos y húmedos.","options":{"lucht":"En la unidad de tratamiento de aire","ventilo":"En los ventiloconvectores","geen":"No — sin deshumidificación activa"}},"biv_strategie":{"label":"Estrategia de bivalencia","help":"El modo paralelo mantiene la bomba de calor en marcha y deja que el apoyo cubra solo el déficit; el modo alternativo la desconecta por completo. Con una caldera de gas como apoyo, el modo alternativo a veces resulta más económico en funcionamiento; con apoyo eléctrico, prácticamente nunca.","options":{"monovalent":"Monovalente — la bomba de calor lo cubre todo","parallel":"Bivalente paralelo — apoyo junto a la bomba de calor","alternatief":"Bivalente alternativo — conmutación a la caldera","deels_parallel":"Parcialmente paralelo, después conmutación"}},"biv_backup":{"label":"Tipo de apoyo","help":"El apoyo eléctrico es barato de adquirir y caro de usar: cada kilovatio-hora cuesta uno, mientras que la bomba de calor entrega entre tres y cinco. Pregunte cuántas horas al año se espera que funcione y hágalo el cálculo — a menudo resulta más económica una bomba de calor algo mayor.","options":{"geen":"Ninguno","elektrisch":"Resistencia eléctrica","gasketel":"Caldera de gas","warmtenet":"Red de calor","tweede_wp":"Segunda bomba de calor"}},"biv_punt":{"label":"Punto bivalente deseado","help":"A −5 °C, la bomba de calor cubre habitualmente más del 90 % de la demanda anual de calor, mientras puede ser notablemente más pequeña que la carga de diseño. Esta ficha calcula el punto real a partir de sus propios datos y lo muestra junto a este deseo."},"biv_redundantie":{"label":"Seguridad requerida ante avería","help":"Rara vez necesaria en una vivienda u oficina; exigencia estricta en un centro sanitario, un centro de datos o un proceso. Varios equipos más pequeños aportan redundancia y a la vez mejor comportamiento en carga parcial — a menudo la mejor opción frente a uno grande.","options":{"geen":"Ninguna — avería aceptable","gedeeltelijk":"Debe mantenerse potencia parcial","volledig":"Redundancia total (n+1)"}},"biv_vorstbeveiliging":{"label":"¿Protección antihielo del edificio resuelta ante avería?","help":"¿Qué ocurre ante una avería durante el periodo de heladas, y quién es avisado? En un edificio con suelo radiante y mucha agua en la losa, no es una pregunta teórica.","options":{"ja":"Sí","nee":"No"}},"biv_smart_grid":{"label":"¿Posible control por carga de red o tarifa?","help":"Horas de bloqueo del operador de red, tarifas dinámicas o excedente fotovoltaico propio. Eso exige capacidad de almacenamiento en el depósito de inercia o en la masa del edificio, y una regulación capaz de anticiparse. Con losa térmicamente activa, esa masa ya está disponible de forma gratuita.","options":{"ja":"Sí","nee":"No"}},"dhw_aanwezig":{"label":"¿Prepara esta instalación el agua caliente sanitaria?","options":{"ja":"Sí","nee":"No"}},"dhw_persons":{"label":"Número de personas o puntos de consumo"},"dhw_l_person":{"label":"Consumo por persona y día","help":"Vivienda 35–50 l por persona a 55 °C, oficina bastante menos, instalación deportiva y centros sanitarios notablemente más, con una punta pronunciada."},"dhw_profiel":{"label":"Perfil de consumo","help":"La punta determina el volumen, el consumo diario determina la potencia. En una instalación deportiva, la punta es determinante y el volumen de acumulación resulta más económico que la potencia.","options":{"woning":"Vivienda — punta de mañana y tarde","kantoor":"Oficina — bajo y repartido","sport":"Deporte — punta muy alta y breve","zorg":"Centro sanitario — alto y continuo","horeca":"Hostelería / cocina"}},"dhw_t_store":{"label":"Temperatura de acumulación","help":"Cada grado más cuesta rendimiento a la bomba de calor. Una unidad de flujo instantáneo o una estación de agua fresca puede funcionar con una temperatura de acumulación más baja porque no hay agua caliente estancada — a menudo la solución más elegante frente a la legionela."},"dhw_t_cold":{"label":"Temperatura del agua fría"},"dhw_systeem":{"label":"Sistema","help":"Una estación de agua fresca prepara el ACS bajo demanda y no mantiene agua caliente almacenada; eso reduce el riesgo de legionela y permite una temperatura de depósito más baja. La desventaja es la elevada demanda punta en ese instante — que debe poder asumir el depósito o el intercambiador.","options":{"boiler":"Depósito acumulador con serpentín","verswater":"Estación de agua fresca (flujo instantáneo)","laadsysteem":"Sistema de carga con intercambiador externo","decentraal":"Descentralizado por vivienda o punto de consumo","elektrisch_boiler":"Termo eléctrico"}},"dhw_legionella":{"label":"Control de la legionela","help":"La desinfección térmica exige periódicamente 60 °C o más en toda la instalación, incluida la tubería de recirculación. Ese es el momento en que arranca el apoyo eléctrico: pregunte cuánta energía cuesta eso al año, porque suele ser más de lo previsto.","options":{"thermisch":"Desinfección térmica periódica","doorstroom":"Principio de flujo instantáneo, sin acumulación","temperatuur":"Mantenimiento permanente de temperatura","alternatief":"Técnica alternativa"}},"dhw_circulatie":{"label":"¿Tubería de recirculación presente?","help":"Una tubería de recirculación mantiene el agua caliente disponible y con ello pierde calor de forma continua — con una tubería mal aislada, esa pérdida puede superar el consumo útil. Aísle en abundancia y, donde sea posible, controle por horario o por demanda.","options":{"ja":"Sí","nee":"No"}},"dhw_voorrang":{"label":"¿Prioridad del agua sanitaria sobre la calefacción?","help":"Habitual y rara vez un problema, pero fije durante cuánto tiempo puede interrumpirse la calefacción. Con losa térmicamente activa nadie lo nota; con calefacción por aire, en diez minutos.","options":{"ja":"Sí","nee":"No"}},"dhw_zon":{"label":"¿Se aprovecha energía solar térmica o excedente fotovoltaico?","help":"El agua caliente sanitaria es el almacenamiento más sencillo para la energía fotovoltaica propia, porque la demanda existe todo el año. Pregunte cómo reconoce la regulación el excedente y si eleva entonces temporalmente la temperatura de acumulación.","options":{"ja":"Sí","nee":"No"}},"hyd_scheiding":{"label":"Separación hidráulica","help":"Una botella de equilibrio hidráulico o un colector abierto mal dimensionado mezcla impulsión y retorno y destruye el salto térmico: la bomba de calor ve un retorno demasiado alto, modula a la baja y el rendimiento cae. Evite la separación hidráulica donde sea posible, y hágala calcular donde sea imprescindible.","options":{"geen":"Ninguna — un solo circuito","open_verdeler":"Colector abierto / botella de equilibrio hidráulico","buffer_serie":"Depósito de inercia en serie","buffer_parallel":"Depósito de inercia en paralelo","wisselaar":"Intercambiador de placas"}},"hyd_buffer":{"label":"Depósito de inercia","help":"Un depósito de inercia resuelve dos problemas distintos que a menudo se confunden: tiempos de funcionamiento demasiado cortos del generador, y volumen de agua insuficiente para el desescarche. Solo el primero exige un volumen grande; para el segundo suele bastar el contenido de agua de la propia instalación.","options":{"geen":"Sin depósito de inercia","serie":"En serie en el retorno","parallel":"En paralelo","ontdooi":"Solo para el desescarche"}},"hyd_buffer_l":{"label":"Volumen de depósito previsto","help":"Déjelo en blanco para ver solo el valor calculado."},"hyd_min_run":{"label":"Tiempo mínimo de funcionamiento del generador","help":"Solicite este valor al fabricante — determina directamente el volumen del depósito de inercia. Un equipo que debe funcionar seis minutos y solo puede ceder su calor durante dos arranca diez veces por hora."},"hyd_buffer_dt":{"label":"Oscilación de temperatura admisible en el depósito"},"hyd_system_l":{"label":"Contenido de agua de la instalación","help":"Tuberías, emisión y equipos en conjunto. Con suelo radiante, ese contenido suele ser suficiente para absorber el desescarche sin depósito de inercia adicional."},"hyd_pompen":{"label":"Bombas","help":"Pregunte por el punto de trabajo real, no por la altura manométrica máxima. Las bombas sobredimensionadas consumen todo el año y provocan ruido de flujo en la emisión.","options":{"toerengeregeld":"Velocidad variable por presión diferencial","constant":"Velocidad constante","debiet":"Regulada a caudal constante"}},"hyd_head_kpa":{"label":"Pérdida de carga estimada de la red","help":"Con un régimen de bomba de calor de salto pequeño, el caudal es alto y la pérdida de carga proporcional: esa es la razón para dimensionar las tuberías más holgadamente con un salto bajo que con una caldera."},"hyd_inregeling":{"label":"Equilibrado de los circuitos","help":"Sin equilibrado hidráulico, el circuito más cercano recibe todo y el más lejano nada, y eso se compensa con una temperatura de impulsión más alta — exactamente lo que quería evitar. Las válvulas de regulación independientes de la presión mantienen el caudal correcto también en carga parcial.","options":{"statisch":"Estático, con válvulas de equilibrado","dynamisch":"Válvulas de regulación independientes de la presión","automatisch":"Autoequilibrado","geen":"No previsto"}},"hyd_p_static":{"label":"Altura estática / presión previa"},"hyd_p_max":{"label":"Presión de trabajo máxima"},"hyd_waterkwaliteit":{"label":"Tratamiento del agua de llenado","help":"La cal en un intercambiador de canales pequeños cuesta potencia de inmediato, y el oxígeno en el sistema genera magnetita que obstruye bombas y válvulas. Solicite un análisis de agua en la recepción y al cabo de un año; es la garantía más económica que existe.","options":{"ontzout":"Desalada o descalcificada, con análisis","inhibitor":"Con inhibidor","leidingwater":"Agua de red sin tratar","nog_bepalen":"Aún por determinar"}},"hyd_ontluchting":{"label":"¿Se prevé purga automática y separación de suciedad?","help":"Separador de microburbujas y separador magnético de lodos justo antes del generador. En una instalación con tuberías existentes, no es un lujo sino la condición para conservar la garantía.","options":{"ja":"Sí","nee":"No"}},"hyd_vorst":{"label":"¿Protección antihielo de unidades exteriores y tuberías?","help":"En una bomba de calor instalada en el exterior: ¿cómo se mantiene el agua en movimiento ante un corte de suministro, y qué ocurre con el desagüe de condensados en caso de helada? Una bandeja de condensados helada desequilibra el ventilador.","options":{"ja":"Sí","nee":"No"}},"dis_opzet":{"label":"Concepto de la instalación","help":"Centralizado aporta economía de escala y un único interlocutor; descentralizado aporta facturación sencilla y sin pérdidas de distribución. La forma intermedia — fuente colectiva con bombas de calor individuales o subestaciones de usuario — combina ambas y está en fuerte auge en vivienda.","options":{"centraal":"Centralizado — una generación para el conjunto","decentraal":"Descentralizado — por unidad o zona","collectief_individueel":"Fuente colectiva, emisión individual","cluster":"Grupos por parte del edificio"}},"dis_leidingen":{"label":"Red de distribución","help":"Un sistema de cuatro tubos permite calentar y refrigerar a la vez y cuesta más espacio y dinero. Una red de fuente a temperatura moderada con bombas de calor por unidad logra lo mismo con dos tuberías y por eso se elige cada vez con más frecuencia.","options":{"tweepijps":"Dos tubos con conmutación estacional","vierpijps":"Cuatro tubos","tweepijps_wp":"Dos tubos con bombas de calor descentralizadas (red de fuente)"}},"dis_isolatie":{"label":"Aislamiento de tuberías","help":"En una red de baja temperatura las pérdidas son menores, pero en refrigeración también cuenta la estanqueidad al vapor: una tubería de frío sin acabado de barrera de vapor forma condensación dentro del aislamiento, y eso solo se hace visible cuando el techo está mojado.","options":{"zwaar":"Más reforzado que la norma","norm":"Según la norma","beperkt":"Limitado"}},"dis_tracelengte":{"label":"Longitud de traza estimada","help":"Con una distribución horizontal larga, las pérdidas de distribución pueden consumir una parte considerable de la generación, sobre todo con baja ocupación."},"dis_afleverset":{"label":"¿Subestaciones de usuario por unidad?","help":"Fije qué incluye la subestación: medición, regulación, preparación de ACS, prevención de retorno — y quién la mantiene y quién tiene la llave.","options":{"ja":"Sí","nee":"No"}},"dis_meting_eenheid":{"label":"¿Medición por unidad requerida?","help":"En instalaciones colectivas, a menudo obligatoria por ley. Determine pronto dónde van los contadores, porque condicionan la distribución de toda la red de tuberías.","options":{"ja":"Sí","nee":"No"}},"dis_toegang":{"label":"Accesibilidad de tuberías y colectores","help":"Los colectores en armarios o en falsos techos deben permanecer accesibles para el equilibrado y el mantenimiento. Lo que queda tras un tabique cerrado nunca vuelve a equilibrarse."},"ctl_leverancier":{"label":"Origen de la regulación","help":"En una solución mixta, la regulación de la bomba de calor compite con la del edificio: ambas quieren determinar la temperatura de impulsión. Fije quién decide sobre cada magnitud.","options":{"fabriek":"Regulación de fábrica del generador","gbs":"Sistema de gestión técnica del edificio","gemengd":"Mixto"}},"ctl_protocol":{"label":"Protocolo de comunicación","help":"Un protocolo propietario implica dependencia de una sola parte durante toda la vida útil. Solicite la lista de puntos con derechos de lectura y escritura ya en la oferta.","options":{"geen":"Ninguno","modbus_rtu":"Modbus RTU","modbus_tcp":"Modbus TCP","bacnet":"BACnet","knx":"KNX","fabrikant":"Protocolo propietario del fabricante"}},"ctl_stooklijn":{"label":"¿Curva de calefacción ajustable y documentada?","help":"Solicite la curva de calefacción configurada en el expediente de recepción, con las temperaturas interiores correspondientes. Sin ese documento, nadie vuelve a optimizarla jamás.","options":{"ja":"Sí","nee":"No"}},"ctl_functies":{"label":"Funciones de regulación requeridas","help":"El control del punto de rocío no es opcional en cuanto hay refrigeración radiante en el edificio: sin sonda en la impulsión y en el local, el techo gotea el primer día bochornoso.","options":{"weersafhankelijk":"Regulación de impulsión por climatología","nachtverlaging":"Reducción o corte nocturno","optimale_start":"Arranque óptimo","zomer_winter":"Conmutación automática verano-invierno","dauwpunt":"Control del punto de rocío en refrigeración","vrije_koeling_ctl":"Refrigeración gratuita automática","sww_voorrang":"Prioridad de agua caliente sanitaria","legionella":"Ciclo antilegionela","pv_sturing":"Control por excedente fotovoltaico propio","tarief":"Control por tarifa o señal de red","vorst":"Protección antihielo","storingsmelding":"Notificación remota de averías"}},"ctl_zonering":{"label":"Regulación por zona","help":"La regulación por local suena bien y con una emisión lenta resulta contraproducente: los circuitos que se cierran elevan la temperatura en el resto y hacen ciclar la bomba de calor. Considere el caudal continuo a baja temperatura con limitación, en lugar de cerrar.","options":{"thermostaat_zone":"Termostato por zona","per_ruimte":"Por local","centraal_ctl":"Solo central"}},"ctl_terugmelding":{"label":"¿Retorno del rendimiento real?","help":"Contador de calor más contador eléctrico en la bomba de calor dan el rendimiento estacional real. Sin esos dos contadores, cualquier discusión sobre un rendimiento decepcionante es indecidible — y precisamente por eso faltan tan a menudo.","options":{"ja":"Sí","nee":"No"}},"ctl_alarmen":{"label":"Alarmas y seguimiento","help":"¿Qué averías deben llegar adónde, en qué plazo, y quién actúa? Una bomba de calor que falla en noviembre y no se detecta hasta diciembre ha dejado funcionando el apoyo durante un mes."},"ene_elek_aansluiting":{"label":"Potencia de conexión eléctrica disponible","help":"A menudo la sorpresa del proyecto: una bomba de calor con apoyo eléctrico exige una conexión notablemente más potente, y el refuerzo tarda meses y a veces cuesta más que la instalación. Verifique esto antes de elegir una solución."},"ene_gelijktijdig_elek":{"label":"Potencia eléctrica p const LANGS = { nl: LANG_NL, fr: LANG_FR, en: LANG_EN, de: LANG_DE, ru: LANG_RU, uk: LANG_UK, pl: LANG_PL, es: LANG_ES };
const LANG_ORDER = ['nl', 'fr', 'en', 'de', 'ru', 'uk', 'pl', 'es'];

const App = {
  A: {},
  lang: 'nl',
  theme: 'auto',
  step: 0,
  view: 'form',        // 'form' | 'report'
  hideEmpty: true,
  R: null
};

/* ---- vertaalhulpen -------------------------------------------------- */
function L() { return LANGS[App.lang] || LANG_NL; }
function base() { return LANG_NL; }

function tt(path, fallback) {
  const walk = (o) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const v = walk(L());
  if (v !== undefined && v !== null && v !== '') return v;
  const b = walk(base());
  return (b !== undefined && b !== null) ? b : (fallback !== undefined ? fallback : path);
}

/* Waarden vertalen wanneer ze als sleutel in de val-tabel voorkomen */
function vlabel(v) {
  if (v === null || v === undefined) return '—';
  const s = String(v);
  const d = (L().val || {});
  if (Object.prototype.hasOwnProperty.call(d, s)) return d[s];
  const b = (base().val || {});
  if (Object.prototype.hasOwnProperty.call(b, s)) return b[s];
  return s;
}

/* Korte specificatie onder een module in het schema.
   These three shorthands are written under a module in the schematic and had no entry in any
   dictionary, so `bijstook`, `passief` and `koude` were printed into the English, French, German,
   Russian and Ukrainian drawing — and into the report. */
const SPEC_SHORT = {
  bijstook: { nl: 'bijstook', fr: 'appoint', en: 'back-up', de: 'Nachheizung', ru: 'доводчик', uk: 'резерв', es: 'apoyo', pl: 'dogrzew' },
  passief: { nl: 'passief', fr: 'passif', en: 'passive', de: 'passiv', ru: 'пассивное', uk: 'пасивне', es: 'pasivo', pl: 'pasywne' },
  koude: { nl: 'koude', fr: 'froid', en: 'cooling', de: 'Kälte', ru: 'холод', uk: 'холод', es: 'frío', pl: 'chłód' },
  /* the two hydraulic separations that reach the drawing have no entry in any `val` block, so
     the raw answer key — a Dutch word, with its underscore — was drawn under the module */
  open_verdeler: { nl: 'open verdeler', fr: 'bouteille', en: 'low-loss header', de: 'Weiche', ru: 'гидрострелка', uk: 'гідрострілка', es: 'botella de equilibrio', pl: 'sprzęgło hydrauliczne' },
  wisselaar: { nl: 'wisselaar', fr: 'échangeur', en: 'heat exchanger', de: 'Wärmetauscher', ru: 'теплообменник', uk: 'теплообмінник', es: 'intercambiador', pl: 'wymiennik' }
};
function specLabel(v) {
  if (v === undefined || v === null || v === '') return '';
  const s = String(v);
  if (Object.prototype.hasOwnProperty.call(SPEC_SHORT, s))
    return SPEC_SHORT[s][App.lang] || SPEC_SHORT[s].nl;
  const lab = vlabel(s);
  return lab.length > 18 ? lab.slice(0, 17) + '…' : lab;
}

/* Rule variables arrive as raw JS floats. Printed through vlabel() they kept
   binary tails (5.5200000000000005) and an English decimal point, so the same
   quantity read "11.6 kW" in a motivation and "11,6 kW" in the results table
   one page earlier. One formatter serves both, and a four-digit whole number
   keeps no thousands separator so a year stays a year. */
function nvar(v) {
  if (!Number.isFinite(v)) return String(v);
  const a = Math.abs(v);
  const d = Number.isInteger(v) ? 0 : (a < 10 ? 2 : (a < 100 ? 1 : 0));
  return v.toLocaleString(LOCALE[App.lang] || 'nl-BE', {
    minimumFractionDigits: d, maximumFractionDigits: d,
    useGrouping: !(Number.isInteger(v) && a < 1e4)
  });
}
function fill(tpl, vars) {
  if (!tpl) return '';
  return String(tpl).replace(/\{(\w+)\}/g, (_, k) => {
    const v = vars[k];
    if (v === undefined || v === null || v === '') return '—';
    if (typeof v === 'number') return nvar(v);
    return vlabel(v);
  });
}

/* Schemateksten: vertaling wint, anders het Nederlandse origineel */
function qText(q, field) {
  const o = ((L().q || {})[q.id] || {})[field];
  return o || q[field] || '';
}
function optLabel(q, opt) {
  const o = (((L().q || {})[q.id] || {}).options || {})[opt.v];
  return o || opt.l;
}
function secText(sec, field) {
  const o = ((L().sec || {})[sec.id] || {})[field];
  return o || sec[field] || '';
}
function secTitle(sec, i) {
  return (i + 1) + ' · ' + secText(sec, 'title');
}
function profText(p, field) {
  const o = ((L().prof || {})[p.id] || {})[field];
  return o || p[field] || '';
}
function modLabel(key) {
  return (L().mod || {})[key] || (base().mod || {})[key] || key;
}

/* ---- rekenpijplijn -------------------------------------------------- */
function compute() {
  const A = App.A;
  const profile = PROFILES.find(p => p.id === A.geb_type) || null;
  const loads = CALC.loads(A);
  const regime = CALC.regime(A, loads);
  const terminals = CALC.terminals(A, loads, regime);
  const generation = CALC.generation(A, loads, regime);
  const hydraulics = CALC.hydraulics(A, loads, regime, generation);
  const chainInfo = CHAIN.chain(A, {});
  const R = { profile, loads, regime, terminals, generation, hydraulics, chainInfo };
  R.rules = CHAIN.checkRules(A, R);
  R.motivations = CHAIN.motivations(A, R);
  App.R = R;
  return R;
}

/* ---- opmaakhulpen --------------------------------------------------- */
const LOCALE = { nl: 'nl-BE', fr: 'fr-BE', en: 'en-GB', de: 'de-DE', ru: 'ru-RU', uk: 'uk-UA', es: 'es-ES', pl: 'pl-PL' };
function nf(x, d = 0) {
  if (!Number.isFinite(x)) return '—';
  return x.toLocaleString(LOCALE[App.lang] || 'nl-BE', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
