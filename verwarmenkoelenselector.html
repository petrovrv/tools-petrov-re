von zehn Minuten.","options":{"ja":"Ja","nee":"Nein"}},"dhw_zon":{"label":"Solarthermie oder PV-Überschuss nutzen?","help":"Trinkwarmwasser ist der einfachste Speicher für eigenen PV-Strom, weil der Bedarf ganzjährig besteht. Fragen Sie, wie die Regelung den Überschuss erkennt und ob sie die Speichertemperatur dann vorübergehend anhebt.","options":{"ja":"Ja","nee":"Nein"}},"hyd_scheiding":{"label":"Hydraulische Trennung","help":"Eine falsch dimensionierte hydraulische Weiche oder ein offener Verteiler mischt Vorlauf und Rücklauf und zerstört die Spreizung: Die Wärmepumpe sieht einen zu hohen Rücklauf, moduliert zurück, und der Wirkungsgrad sinkt. Vermeiden Sie die hydraulische Trennung, wo es geht, und lassen Sie sie berechnen, wo sie sein muss.","options":{"geen":"Keine — ein Kreis","open_verdeler":"Offener Verteiler / hydraulische Weiche","buffer_serie":"Pufferspeicher in Reihe","buffer_parallel":"Pufferspeicher parallel","wisselaar":"Plattenwärmeübertrager"}},"hyd_buffer":{"label":"Pufferspeicher","help":"Ein Pufferspeicher löst zwei verschiedene Probleme, die oft verwechselt werden: zu kurze Laufzeiten des Erzeugers und zu wenig Wasservolumen für die Abtauung. Nur das Erste verlangt ein großes Volumen; für das Zweite genügt oft der Wasserinhalt der Anlage selbst.","options":{"geen":"Kein Pufferspeicher","serie":"In Reihe im Rücklauf","parallel":"Parallel","ontdooi":"Nur für die Abtauung"}},"hyd_buffer_l":{"label":"Vorgesehenes Puffervolumen","help":"Leer lassen, um nur den berechneten Wert zu sehen."},"hyd_min_run":{"label":"Mindestlaufzeit des Erzeugers","help":"Fragen Sie diesen Wert beim Hersteller ab — er bestimmt das Puffervolumen unmittelbar. Ein Gerät, das sechs Minuten laufen muss und seine Wärme nur zwei Minuten lang abgeben kann, startet zehnmal pro Stunde."},"hyd_buffer_dt":{"label":"Zulässige Temperaturschwankung im Pufferspeicher"},"hyd_system_l":{"label":"Wasserinhalt der Anlage","help":"Rohrleitungen, Wärmeübergabe und Geräte zusammen. Bei einer Fußbodenheizung ist dieser Inhalt oft groß genug, um die Abtauung ohne zusätzlichen Pufferspeicher abzufangen."},"hyd_pompen":{"label":"Pumpen","help":"Fragen Sie nach dem tatsächlichen Betriebspunkt, nicht nach der maximalen Förderhöhe. Überdimensionierte Pumpen verbrauchen das ganze Jahr über und verursachen Strömungsgeräusche in der Wärmeübergabe.","options":{"toerengeregeld":"Drehzahlgeregelt nach Differenzdruck","constant":"Konstante Drehzahl","debiet":"Auf konstanten Volumenstrom geregelt"}},"hyd_head_kpa":{"label":"Geschätzter Druckverlust des Netzes","help":"Bei einem Wärmepumpenregime mit kleiner Spreizung ist der Volumenstrom hoch und der Druckverlust entsprechend: Das ist der Grund, die Rohrleitungen bei geringer Spreizung großzügiger zu wählen als bei einem Kessel."},"hyd_inregeling":{"label":"Abgleich der Kreise","help":"Ohne hydraulischen Abgleich bekommt der nächstgelegene Kreis alles und der entfernteste nichts, und man gleicht das mit einer höheren Vorlauftemperatur aus — genau das, was Sie vermeiden wollten. Druckunabhängige Regelventile halten den Volumenstrom auch bei Teillast in Ordnung.","options":{"statisch":"Statisch, mit Strangregulierventilen","dynamisch":"Druckunabhängige Regelventile","automatisch":"Selbsttätig abgleichend","geen":"Nicht vorgesehen"}},"hyd_p_static":{"label":"Statische Höhe / Vordruck"},"hyd_p_max":{"label":"Maximaler Betriebsdruck"},"hyd_waterkwaliteit":{"label":"Aufbereitung des Füllwassers","help":"Kalk auf einem Wärmeübertrager mit kleinen Kanälen kostet unmittelbar Leistung, und Sauerstoff im System bildet Magnetit, das Pumpen und Ventile verstopft. Verlangen Sie eine Wasseranalyse bei der Abnahme und nach einem Jahr; das ist die günstigste Absicherung, die es gibt.","options":{"ontzout":"Entsalzt oder enthärtet, mit Analyse","inhibitor":"Mit Inhibitor","leidingwater":"Unbehandeltes Leitungswasser","nog_bepalen":"Noch festzulegen"}},"hyd_ontluchting":{"label":"Automatische Entlüftung und Schlammabscheidung vorgesehen?","help":"Mikroblasenabscheider und magnetischer Schlammabscheider unmittelbar vor dem Erzeuger. Bei einer Anlage mit vorhandenen Rohrleitungen ist das kein Luxus, sondern die Voraussetzung für den Erhalt der Gewährleistung.","options":{"ja":"Ja","nee":"Nein"}},"hyd_vorst":{"label":"Frostschutz von Außeneinheiten und Leitungen?","help":"Bei einer außen aufgestellten Wärmepumpe: Wie bleibt das Wasser bei Stromausfall in Bewegung, und was geschieht bei Frost mit der Kondensatableitung? Eine zugefrorene Kondensatwanne bringt den Ventilator aus dem Gleichgewicht.","options":{"ja":"Ja","nee":"Nein"}},"dis_opzet":{"label":"Aufbau der Anlage","help":"Zentral bringt Skalenvorteile und einen einzigen Ansprechpartner; dezentral bringt einfache Abrechnung und keine Verteilverluste. Die Zwischenform — kollektive Wärmequelle mit einzelnen Wärmepumpen oder Wohnungsstationen — verbindet beides und ist im Wohnungsbau stark im Kommen.","options":{"centraal":"Zentral — eine Erzeugung für das Ganze","decentraal":"Dezentral — je Einheit oder Zone","collectief_individueel":"Kollektive Wärmequelle, individuelle Wärmeübergabe","cluster":"Cluster je Gebäudeteil"}},"dis_leidingen":{"label":"Verteilnetz","help":"Ein Vierleitersystem erlaubt gleichzeitiges Heizen und Kühlen und kostet mehr Platz und Geld. Ein Quellennetz auf gemäßigter Temperatur mit Wärmepumpen je Einheit leistet dasselbe mit zwei Leitungen und wird deshalb immer häufiger gewählt.","options":{"tweepijps":"Zweileitersystem mit saisonaler Umschaltung","vierpijps":"Vierleitersystem","tweepijps_wp":"Zweileitersystem mit dezentralen Wärmepumpen (Quellennetz)"}},"dis_isolatie":{"label":"Rohrleitungsdämmung","help":"Bei einem Niedertemperaturnetz sind die Verluste geringer, aber bei der Kühlung zählt auch die Dampfdichtheit: Eine Kälteleitung ohne dampfbremsende Ausführung bildet Kondensat innerhalb der Dämmung, und das wird erst sichtbar, wenn die Decke nass ist.","options":{"zwaar":"Stärker als die Norm","norm":"Nach Norm","beperkt":"Begrenzt"}},"dis_tracelengte":{"label":"Geschätzte Trassenlänge","help":"Bei einer langen horizontalen Verteilung können die Verteilverluste einen erheblichen Teil der Erzeugung aufzehren, besonders bei geringer Auslastung."},"dis_afleverset":{"label":"Wohnungsstationen je Einheit?","help":"Legen Sie fest, was in der Station enthalten ist: Messung, Regelung, Trinkwarmwasserbereitung, Rückflussverhinderer — und wer sie wartet und wer den Schlüssel hat.","options":{"ja":"Ja","nee":"Nein"}},"dis_meting_eenheid":{"label":"Messung je Einheit erforderlich?","help":"Bei Gemeinschaftsanlagen häufig gesetzlich vorgeschrieben. Legen Sie früh fest, wo die Zähler sitzen, denn sie bestimmen die Aufteilung des gesamten Rohrnetzes.","options":{"ja":"Ja","nee":"Nein"}},"dis_toegang":{"label":"Zugänglichkeit von Leitungen und Verteilern","help":"Verteiler in Schränken oder in abgehängten Decken müssen für den Abgleich und die Wartung erreichbar bleiben. Was hinter einer zugemauerten Wand sitzt, wird nie wieder abgeglichen."},"ctl_leverancier":{"label":"Herkunft der Regelung","help":"Bei einer gemischten Lösung kämpft die Regelung der Wärmepumpe gegen die des Gebäudes: Beide wollen die Vorlauftemperatur bestimmen. Legen Sie fest, wer über welche Größe bestimmt.","options":{"fabriek":"Werksregelung des Erzeugers","gbs":"Gebäudeleittechnik","gemengd":"Gemischt"}},"ctl_protocol":{"label":"Kommunikationsprotokoll","help":"Ein herstellereigenes Protokoll bedeutet Abhängigkeit von einer einzigen Partei über die gesamte Lebensdauer. Fordern Sie die Datenpunktliste mit Lese- und Schreibrechten bereits zum Angebot an.","options":{"geen":"Keines","modbus_rtu":"Modbus RTU","modbus_tcp":"Modbus TCP","bacnet":"BACnet","knx":"KNX","fabrikant":"Herstellereigenes Protokoll"}},"ctl_stooklijn":{"label":"Heizkurve einstellbar und dokumentiert?","help":"Fordern Sie die eingestellte Heizkurve in der Abnahmedokumentation an, mit den zugehörigen Raumtemperaturen. Ohne dieses Dokument optimiert sie nie wieder jemand.","options":{"ja":"Ja","nee":"Nein"}},"ctl_functies":{"label":"Erforderliche Regelfunktionen","help":"Taupunktüberwachung ist keine Option, sobald es Strahlungskühlung im Gebäude gibt: ohne Fühler im Vorlauf und im Raum tropft die Decke am ersten schwülen Tag.","options":{"weersafhankelijk":"Witterungsgeführte Vorlaufregelung","nachtverlaging":"Nachtabsenkung oder -abschaltung","optimale_start":"Optimierter Start","zomer_winter":"Automatische Sommer-Winter-Umschaltung","dauwpunt":"Taupunktüberwachung bei Kühlung","vrije_koeling_ctl":"Freie Kühlung automatisch","sww_voorrang":"Vorrang Trinkwarmwasser","legionella":"Legionellenzyklus","pv_sturing":"Steuerung nach eigenem PV-Strom","tarief":"Steuerung nach Tarif oder Netzsignal","vorst":"Frostschutz","storingsmelding":"Störmeldung aus der Ferne"}},"ctl_zonering":{"label":"Regelung je Zone","help":"Eine Einzelraumregelung klingt gut und wirkt bei träger Wärmeübergabe kontraproduktiv: Kreise, die schließen, erhöhen die Temperatur in den übrigen und lassen die Wärmepumpe takten. Erwägen Sie Durchströmen auf niedriger Temperatur mit Begrenzung statt Zusteuern.","options":{"thermostaat_zone":"Thermostat je Zone","per_ruimte":"Je Raum","centraal_ctl":"Nur zentral"}},"ctl_terugmelding":{"label":"Rückmeldung des tatsächlichen Wirkungsgrades?","help":"Wärmemengenzähler plus Stromzähler an der Wärmepumpe liefern die tatsächliche Jahresarbeitszahl. Ohne diese beiden Zähler ist jede Diskussion über enttäuschende Leistungen unentscheidbar — und genau deshalb fehlen sie so oft.","options":{"ja":"Ja","nee":"Nein"}},"ctl_alarmen":{"label":"Alarmierung und Nachverfolgung","help":"Welche Störungen müssen wo ankommen, in welcher Zeit, und wer handelt? Eine Wärmepumpe, die im November ausfällt und erst im Dezember bemerkt wird, hat die Zusatzheizung einen Monat lang laufen lassen."},"ene_elek_aansluiting":{"label":"Verfügbare elektrische Anschlussleistung","help":"Oft die Überraschung des Projekts: Eine Wärmepumpe mit elektrischer Zusatzheizung verlangt einen deutlich stärkeren Anschluss, und die Verstärkung dauert Monate und kostet manchmal mehr als die Anlage. Klären Sie das, bevor Sie eine Lösung wählen."},"ene_gelijktijdig_elek":{"label":"Geschätzte gleichzeitige elektrische Spitzenleistung","help":"Wärmepumpe, Zusatzheizung, Trinkwarmwasserbereitung und gegebenenfalls Ladeinfrastruktur zusammen, in der kältesten Stunde des Jahres."},"ene_pv":{"label":"Leistung der eigenen PV-Anlage","help":"PV-Strom und Wärmebedarf fallen zeitlich nicht zusammen; die Überschneidung liegt in der Übergangszeit und beim Trinkwarmwasser. Rechnen Sie nicht mit Jahresmittelwerten, sondern mit Gleichzeitigkeit."},"ene_opslag":{"label":"Elektrischer Speicher vorhanden oder vorgesehen?","options":{"ja":"Ja","nee":"Nein"}},"ene_tarief_elek":{"label":"Stromtarif"},"ene_tarief_gas":{"label":"Gastarif","help":"Das Verhältnis beider Tarife bestimmt, ab welchem Wirkungsgrad eine Wärmepumpe günstiger ist als ein Kessel. Bei einem Verhältnis von vier ist das erst oberhalb einer Jahresarbeitszahl von vier der Fall — rechnen Sie das ausdrücklich durch, statt es anzunehmen."},"ene_capaciteitstarief":{"label":"Gilt ein Leistungs- oder Spitzenlasttarif?","help":"Wo nach der Monatsspitze abgerechnet wird, lohnt es sich, die Zusatzheizung zu verteilen und die Trinkwarmwasserbereitung außerhalb der Spitze zu legen. Das ist eine Regelungsfrage mit unmittelbaren finanziellen Folgen.","options":{"ja":"Ja","nee":"Nein"}},"ene_meters":{"label":"Vorzusehende Zähler","help":"Die Hilfsenergie gesondert zu messen wird fast nie gemacht und erklärt oft den Unterschied zwischen dem versprochenen und dem gemessenen Wirkungsgrad: Pumpen, Abtauung, Elektronik und Zirkulation summieren sich.","options":{"warmte_wp":"Wärmemengenzähler an der Wärmepumpe","warmte_sww":"Wärmemengenzähler Trinkwarmwasser","koude":"Kältemengenzähler","elek_wp":"Stromzähler Wärmepumpe","elek_backup":"Stromzähler Zusatzheizung","elek_pompen":"Stromzähler Pumpen und Hilfsenergie","eenheid":"Messung je Einheit oder Mieter"}},"ene_prestatie":{"label":"Leistungsgarantie auf die Jahresarbeitszahl gefordert?","help":"Nur sinnvoll mit vorab vereinbarten Bilanzgrenzen, Messverfahren und Randbedingungen. Fragen Sie, was geschieht, wenn die Garantie nicht erreicht wird, denn darin liegt der eigentliche Wert.","options":{"ja":"Ja","nee":"Nein"}},"ene_scop_eis":{"label":"Geforderte Jahresarbeitszahl (SCOP)","help":"Geben Sie dazu an, unter welchen Randbedingungen: welches Regime, mit oder ohne Trinkwarmwasser, mit oder ohne Hilfsenergie. Ohne diese Abgrenzung ist die Zahl bedeutungslos."},"ops_plaats_binnen":{"label":"Aufstellung der Inneneinheiten","help":"Geben Sie den freien Raum ringsum, die Türbreite und die Bodenbelastbarkeit an. Bei einer Propan-Wärmepumpe im Innenbereich gelten zusätzlich Anforderungen an das Raumvolumen, an die Lüftung und an das Vorhandensein tiefer gelegener Räume, in die das Gas absinken kann.","options":{"techniek":"Technikraum","berging":"Abstellraum oder Hauswirtschaftsraum","kelder":"Keller","dak":"Dachaufbau","buiten_ops":"Vollständig im Freien"}},"ops_plaats_buiten":{"label":"Standort der Außeneinheiten","help":"Abstand zur Grundstücksgrenze, zu Fenstern des eigenen Hauses und der Nachbarn sowie die Richtung, in die der Ventilator bläst. Bedenken Sie auch, wohin die kalte Ausblasluft geht: auf eine Terrasse oder einen Weg gerichtet, gibt es Reif und Glatteis."},"ops_geluid_eis":{"label":"Zulässiger Schallpegel am Beurteilungsort","help":"Ergibt sich aus den regionalen Immissionsvorschriften und gilt üblicherweise an der Grundstücksgrenze oder am nächstgelegenen Fenster eines Nachbarn. Der Nachtwert ist maßgebend, und gerade nachts läuft eine Wärmepumpe weiter."},"ops_geluid_afstand":{"label":"Abstand zum nächstgelegenen Beurteilungspunkt"},"ops_geluid_maatregel":{"label":"Vorgesehene schalltechnische Maßnahmen","help":"Der Nachtmodus senkt den Schall und die Leistung gleichzeitig — genau dann, wenn es draußen am kältesten ist. Rechnen Sie durch, ob das Gebäude das verkraftet, sonst lösen Sie das Schallproblem auf Kosten der Wärme.","options":{"nachtmodus":"Nachtmodus mit Drehzahlbegrenzung","omkasting":"Schallschutzeinhausung oder -wand","trillingsdempers":"Schwingungsdämpfer und flexible Anschlüsse","plaatsing":"Aufstellung abgewandt von empfindlichen Fassaden","geen_maatregel":"Keine Maßnahmen vorgesehen"}},"ops_octaaf":{"label":"Schallleistung je Oktavband anfordern?","help":"Ein einzelner dB(A)-Wert genügt nicht für eine schalltechnische Berechnung und schon gar nicht für den tieffrequenten Anteil, der durch Fassaden hindurchgeht und am meisten stört.","options":{"ja":"Ja","nee":"Nein"}},"ops_trillingen":{"label":"Schwingungsentkopplung von Verdichter und Pumpen?","help":"Bei Aufstellung auf einer leichten Decke oder an einem Wohnraum entscheidet die Schwingungsentkopplung darüber, ob die Anlage hörbar ist, auch wenn der Luftschall in Ordnung ist.","options":{"ja":"Ja","nee":"Nein"}},"ops_koudemiddel_veiligheid":{"label":"Sicherheit rund um das Kältemittel","help":"Füllmenge je Kreislauf, Mindestraumgröße, Leckageerkennung, Lüftung und Abstand zu Öffnungen und Kellern. Bei Propan bestimmt dies den Aufstellort mit — fragen Sie danach, bevor Sie den Standort festlegen."},"ops_condens":{"label":"Kondensatableitung der Außeneinheit geregelt?","help":"Eine Luftwärmepumpe erzeugt bei Frost Dutzende Liter Kondensat pro Tag. Ohne beheizte Ableitung oder Kiesbett friert das unter dem Gerät und auf dem Weg daneben fest.","options":{"ja":"Ja","nee":"Nein"}},"ops_toegang":{"label":"Freier Wartungsraum und Zugang sichergestellt?","help":"Einschließlich des Raums, um einen Verdichter oder Wärmeübertrager auszubauen — in zehn Jahren, wenn inzwischen ringsum alles zugebaut ist.","options":{"ja":"Ja","nee":"Nein"}},"nrm_epb":{"label":"Fällt das Projekt unter die Energieeinsparvorschriften?","help":"Bestimmt Mindestanforderungen an den Wirkungsgrad, an die Dämmung von Leitungen, an die Messung und mitunter an den Anteil erneuerbarer Energie.","options":{"ja":"Ja","nee":"Nein"}},"nrm_normen":{"label":"Anzuwendende Normen und Richtlinien","help":"Fordern Sie je Norm den Nachweis an, nicht die Erklärung, dass sie eingehalten sei. Bei EN 14511 geht es um die Messbedingungen: Dieselbe Maschine schneidet bei anderen Randbedingungen ganz anders ab.","options":{"en12831":"EN 12831 — Heizlastberechnung","en1264":"EN 1264 — Fußbodenheizung","en442":"EN 442 — Heizkörper","en14511":"EN 14511 / EN 14825 — Wärmepumpenleistung","en378":"EN 378 — kältetechnische Sicherheit","en12828":"EN 12828 — Heizungsanlagen in Gebäuden","vdi2035":"VDI 2035 — Füllwasserqualität","legionella_norm":"Nationale Legionellenvorschriften","bodem":"Vorschriften zur Erdwärmenutzung"}},"nrm_vergunning":{"label":"Erforderliche Genehmigungen und Anzeigen","help":"Bohrungen und Grundwasserentnahme haben lange Vorlaufzeiten und teilweise vorgeschriebene Untersuchungen. Netzverstärkungen ebenso. Starten Sie diese Verfahren vor der Bestellung, nicht danach.","options":{"omgeving":"Baugenehmigung","milieu":"Immissionsschutzrechtliche Anzeige oder Genehmigung","bodemenergie":"Genehmigung Erdwärme oder Bohrungen","grondwater":"Wasserrechtliche Erlaubnis","netbeheerder":"Antrag auf Verstärkung des Netzanschlusses","geen_verg":"Keine"}},"nrm_fgas":{"label":"Registrierung und Dichtheitskontrolle nach der F-Gas-Verordnung?","help":"Abhängig von der Füllmenge gelten eine wiederkehrende Dichtheitskontrolle und eine Aufzeichnungspflicht. Fragen Sie, wer das führt und wo das Betriebsbuch liegt.","options":{"ja":"Ja","nee":"Nein"}},"nrm_subsidie":{"label":"Fördermaßnahmen und Bedingungen","help":"Förderungen knüpfen häufig Anforderungen an den Wirkungsgrad, an die Zulassung des Installateurs und an den Zeitpunkt der Antragstellung. Ein Antrag nach der Bestellung ist in vielen Programmen nicht mehr gültig."},"nrm_erkenning":{"label":"Zugelassener Fachbetrieb erforderlich?","help":"Für kältetechnische Arbeiten und für die meisten Förderungen. Fordern Sie die Zertifikatsnummer beim Angebot an, nicht bei der Abnahme.","options":{"ja":"Ja","nee":"Nein"}},"uit_fasering":{"label":"Bauabschnitte und Betriebssicherheit während der Arbeiten","help":"Muss das Gebäude in Betrieb bleiben? Bei einem Austausch in der Heizperiode ist eine Übergangslösung nötig — vereinbaren Sie, wer sie liefert und bezahlt."},"uit_inregeling":{"label":"Wasserseitiger hydraulischer Abgleich mit Protokoll?","help":"Volumenströme je Kreis, gemessen und dokumentiert. Das ist der Unterschied zwischen einer Anlage, die mit 35 °C arbeitet, und derselben Anlage, die mit 45 °C laufen muss, weil der entfernteste Kreis es nicht schafft.","options":{"ja":"Ja","nee":"Nein"}},"uit_prestatiemeting":{"label":"Leistungsmessung bei der Abnahme?","help":"Vorlauf, Rücklauf, Volumenstrom, aufgenommene und abgegebene Leistung bei einem definierten Betriebszustand. Ohne Nullmessung lässt sich später nichts nachweisen.","options":{"ja":"Ja","nee":"Nein"}},"uit_seizoensmeting":{"label":"Nachmessung nach der ersten Heizperiode?","help":"Der tatsächliche Wirkungsgrad zeigt sich erst über eine ganze Heizperiode. Vereinbaren Sie, dass der Installateur nach einem Jahr wiederkommt, um Heizkurve und Einstellungen nachzujustieren — darin stecken oft zehn bis zwanzig Prozent Einsparung.","options":{"ja":"Ja","nee":"Nein"}},"uit_documentatie":{"label":"Geforderte Dokumentation","help":"Fordern Sie den Auslegungsbericht bereits zum Angebot an, mit den Leistungsdaten bei Ihrer eigenen Vorlauftemperatur. Dieses eine Dokument macht Angebote verschiedener Hersteller erstmals vergleichbar.","options":{"berekening":"Heizlast- und Kühllastberechnung","selectie":"Auslegungsbericht mit Leistungspunkten beim Projektregime","schema":"Hydraulisches Schema, As-built","elektrisch":"Elektroschema und Datenpunktliste","inregel":"Abgleichprotokoll mit gemessenen Volumenströmen","stooklijn":"Eingestellte Heizkurve und Regelparameter","onderhoud":"Wartungsvorschrift mit Intervallen","logboek":"Kältemittel-Betriebsbuch","garantie":"Gewährleistungsbestimmungen und -bedingungen"}},"uit_opleiding":{"label":"Schulung des Betreibers vorgesehen?","help":"Wer die Heizkurve nicht versteht, stellt sie bei der ersten Beschwerde höher — und dann ist der Wirkungsgrad dahin. Eine Stunde Erklärung bei der Abnahme zahlt sich aus.","options":{"ja":"Ja","nee":"Nein"}},"uit_onderhoud":{"label":"Wartungsvertrag","options":{"geen":"Keiner","basis":"Basis — Inspektion und gesetzliche Prüfungen","volledig":"Vollumfänglich — einschließlich Regelung und Leistungsüberwachung","nog_bepalen":"Noch festzulegen"}},"uit_garantie":{"label":"Geforderte Gewährleistungsfrist"},"uit_levertijd":{"label":"Geforderte Lieferzeit oder Fertigstellungstermin","help":"Fragen Sie die Lieferzeit der Regelung und der Außeneinheiten getrennt ab; die laufen selten gleich."},"uit_budget":{"label":"Budgetrahmen"},"uit_opmerkingen":{"label":"Sonstige Anmerkungen und Randbedingungen"}},"pgroup":{"wonen":"Wohnen","utiliteit":"Nichtwohngebäude","industrie":"Industrie und Prozess"}};

const LANG_RU = {"code":"ru","name":"Русский","prof":{"woning_nieuw":{"label":"Жилой дом — новое строительство","note":"Здесь всё складывается само: хорошая оболочка, тёплый пол, низкий режим. Внимание смещается на горячее водоснабжение — в современном доме это быстро становится половиной годовой потребности в тепле, и работает оно на куда менее выгодной температуре, чем отопление.","basis":"EPB для нового строительства; EN 12831"},"woning_renovatie":{"label":"Жилой дом — реконструкция","note":"Самая сложная категория и самая распространённая. Существующие радиаторы подобраны на 75/65 и при 45/40 отдают примерно треть заявленной мощности. Проведите инвентаризацию по помещениям, просчитайте, что получается при желаемом режиме, и адресно замените приборы, которые не добирают, — это почти всегда дешевле, чем более крупный тепловой насос или более высокий режим.","basis":"EN 12831; инвентаризация существующей теплоотдачи"},"appartement_collectief":{"label":"Многоквартирный дом с коллективной системой","note":"Здесь эффективность определяют приготовление горячей воды и циркуляционный трубопровод, а не отопление. Коллективный трубопровод, круглый год держащий 60 °C, теряет непрерывно; станции приготовления ГВС проточного типа в каждой квартире на сети низкопотенциального источника 40 °C решают и вопрос легионеллы, и проблему эффективности.","basis":"EPB; учёт по каждой единице"},"kantoor_nieuw":{"label":"Офис — новое строительство","note":"Активация бетонного ядра в связке с геотермией — здесь сильная пара: летом грунт даёт пассивное охлаждение и при этом заряжается к зиме. Условие, впрочем, — масса в здании и доводочное регулирование, которое снимает пик: одно бетонное ядро пиковую нагрузку не берёт и не регулирует по помещениям.","basis":"EN 16798-1; EPB"},"kantoor_renovatie":{"label":"Офис — реконструкция","note":"Обратите внимание на зоны, которым нужно греть и охлаждать одновременно: южный фасад на солнце, тогда как северная сторона ещё требует тепла. Двухтрубная система с сезонным переключением делает это невозможным и весь межсезонный период порождает жалобы.","basis":"EN 16798-1"},"school":{"label":"Школа","note":"Сильно прерывистое использование с каникулами: здесь мощность источника определяет надбавка на разогрев, а не расчётная нагрузка. Оптимальный пуск с автоматикой, обучающейся времени разогрева, дешевле лишних киловаттов — а инерционная теплоотдача вроде бетонного ядра к такому режиму подходит плохо.","basis":"EN 16798-1; руководства для учебных зданий"},"zorg":{"label":"Учреждение здравоохранения","note":"Доминирует горячее водоснабжение: высокое потребление, непрерывное, с циркуляционным трубопроводом и со строгим противолегионеллёзным режимом на 60 °C. Рассматривайте его как отдельную установку с собственным источником или собственной высокотемпературной ступенью, иначе оно потянет вниз эффективность всего отопления.","basis":"EN 16798-1; отраслевые руководства здравоохранения; законодательство по легионелле"},"winkel":{"label":"Магазин / розничная торговля","note":"Высокая внутренняя нагрузка от освещения и посетителей: охлаждение здесь часто требуется круглый год, а отопление — только к открытию. Там, где есть ещё и холодильные витрины, тепло их конденсаторов является бесплатным источником тепла для магазина — про эту связку почти всегда забывают.","basis":"EN 16798-1"},"sport":{"label":"Спортивный объект","note":"Определяющим является душевой пик, и длится он двадцать минут. Запас объёма здесь намного дешевле мощности: большой бак, спокойно заряжаемый весь день, выигрывает у большого теплового насоса, которому три раза в неделю нужно разом выдать всё.","basis":"EN 16798-1"},"zwembad_geb":{"label":"Бассейн","note":"Три тепловые потребности одновременно: вода бассейна, отопление помещений и вода для душевых, каждая со своей температурой. Наибольшие потери — испарение с поверхности воды, и первая мера — покрывало вне часов работы: оно выигрывает у любого инженерного мероприятия.","basis":"VDI 2089"},"industrie_hal":{"label":"Производственный цех","note":"Лучистые панели греют людей и рабочие поверхности вместо воздуха под кровлей, и в высоком цехе это даёт заметную разницу. Правда, они требуют более высокой температуры подачи, чем тёплый пол, — этот размен нужно сделать осознанно.","basis":"Технологическое отопление; EN 12831"},"proces_restwarmte":{"label":"Технологический процесс со сбросным теплом","note":"Там, где процесс нужно охлаждать круглый год, уже есть готовый источник тепла постоянной температуры — гораздо более выгодный, чем наружный воздух, и без сезонного хода. Сначала составьте карту температурных уровней и одновременности, и только потом смотрите наружу.","basis":"Утилизация тепла технологических процессов"},"datacenter_geb":{"label":"Центр обработки данных / серверная","note":"Только охлаждение, круглый год, с приоритетом доступности над эффективностью. Высокий режим охлаждения делает свободное охлаждение возможным большую часть года, а отводимое тепло с обраткой 26 °C пригодно для соседнего здания или для горячего водоснабжения через тепловой насос.","basis":"ASHRAE TC 9.9"}},"ui":{"appTitle":"Опросник по отоплению и охлаждению","appSubtitle":"От источника до конечных приборов — с температурным режимом как сквозной линией","step":"Шаг","of":"из","next":"Далее","prev":"Назад","report":"Отчёт","print":"Отчёт / pdf","save":"Сохранить","load":"Открыть","reset":"Очистить","demo":"Пример","required":"обязательно","why":"Зачем этот вопрос","kpiHeat":"Тепловая мощность","kpiCool":"Холодильная мощность","kpiRegime":"Режим отопления","kpiFlowRate":"Расход теплоносителя при отоплении","kpiCop":"COP при расчётных условиях","kpiScop":"Сезонная эффективность (оценка)","kpiBivalent":"Точка бивалентности","kpiCoverage":"Покрытие тепловым насосом","kpiBackup":"Требуемый доводчик","kpiBuffer":"Рекомендуемый объём буферной ёмкости","kpiExpansion":"Расширительный бак","kpiDhw":"Горячее водоснабжение","kpiDhwCop":"COP при приготовлении ГВС","kpiEnergyHeat":"Годовая потребность
