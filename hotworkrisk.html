  "title": {"en":"Hot Work Risk Studio","uk":"Студія ризиків вогневих робіт","de":"Heißarbeiten-Risikostudio","nl":"Studio risico's heet werk","fr":"Studio des risques de travaux par point chaud","es":"Estudio de riesgos de trabajos en caliente","pl":"Studio ryzyka prac pożarowo niebezpiecznych"},
  "summary": {"en":"Draw the hot-work area on a plan, place the work point, combustibles, openings, cylinders and extinguishers, and get the affected zone and the open controls.","uk":"Нанесіть зону вогневих робіт на план, розмістіть точку робіт, горючі матеріали, отвори, балони та вогнегасники й отримайте зону впливу та відкриті заходи.","de":"Heißarbeitsbereich auf einem Plan zeichnen, Arbeitspunkt, Brennbares, Öffnungen, Flaschen und Löscher setzen und die betroffene Zone mit offenen Maßnahmen erhalten.","nl":"Teken het heet-werkgebied op een plattegrond, plaats werkpunt, brandbare stoffen, openingen, cilinders en blusmiddelen en krijg de beïnvloede zone en de open maatregelen.","fr":"Dessinez la zone de travail par point chaud, placez le point de travail, les combustibles, ouvertures, bouteilles et extincteurs, et obtenez la zone affectée et les mesures ouvertes.","es":"Dibuje el área de trabajo en caliente, sitúe el punto de trabajo, combustibles, aberturas, botellas y extintores, y obtenga la zona afectada y los controles abiertos.","pl":"Narysuj obszar prac pożarowo niebezpiecznych, umieść punkt pracy, materiały palne, otwory, butle i gaśnice, a otrzymasz strefę oddziaływania i otwarte środki."},
  "description": {"en":"A plan studio for preparing a hot-work permit. The affected zone is a circle or a directed sector around the work point whose radius comes from an editable rule pack (illustrative defaults, with source, jurisdiction and version fields). Nineteen rules with stable IDs check combustibles, openings and drains, hidden spaces, gas cylinders, extinguisher access, fire watch, gas-free testing and isolation. Every spatial finding is numbered on the plan and in the list. The controls can be exported as a safety-exchange document for the permit studio.","uk":"Планувальна студія для підготовки наряду на вогневі роботи. Зона впливу — коло або спрямований сектор навколо точки робіт; радіус береться з редагованого пакета правил (ілюстративні значення з полями джерела, юрисдикції та версії). Дев'ятнадцять правил зі сталими ID перевіряють горючі матеріали, отвори й трапи, приховані порожнини, балони, доступ до вогнегасників, пожежного спостерігача, газовий аналіз та ізоляцію. Кожна просторова знахідка пронумерована на плані та в переліку. Заходи експортуються як документ обміну для студії нарядів.","de":"Planstudio zur Vorbereitung eines Heißarbeitserlaubnisscheins. Die betroffene Zone ist ein Kreis oder gerichteter Sektor um den Arbeitspunkt; der Radius stammt aus einem editierbaren Regelpaket (illustrative Vorgaben mit Feldern für Quelle, Rechtsraum und Version). Neunzehn Regeln mit festen IDs prüfen Brennbares, Öffnungen und Abläufe, verdeckte Hohlräume, Gasflaschen, Zugang zu Löschern, Brandwache, Gasfreimessung und Absperrung. Jeder räumliche Befund ist im Plan und in der Liste nummeriert. Die Maßnahmen lassen sich als Austauschdokument für das Erlaubnisstudio exportieren.","nl":"Een plattegrondstudio voor het voorbereiden van een heet-werkvergunning. De beïnvloede zone is een cirkel of gerichte sector rond het werkpunt; de straal komt uit een bewerkbaar regelpakket (illustratieve standaardwaarden met velden voor bron, rechtsgebied en versie). Negentien regels met vaste ID's controleren brandbare stoffen, openingen en afvoeren, verborgen ruimten, gascilinders, bereikbaarheid van blusmiddelen, brandwacht, gasvrijmeting en scheiding. Elke ruimtelijke bevinding is genummerd op de plattegrond en in de lijst. De maatregelen zijn te exporteren als uitwisselingsdocument voor de vergunningstudio.","fr":"Studio de plan pour préparer un permis de feu. La zone affectée est un cercle ou un secteur orienté autour du point de travail, dont le rayon provient d'un jeu de règles modifiable (valeurs illustratives, avec champs source, juridiction et version). Dix-neuf règles à identifiant stable vérifient combustibles, ouvertures et siphons, espaces cachés, bouteilles de gaz, accès aux extincteurs, surveillance incendie, contrôle d'absence de gaz et isolement. Chaque constat spatial est numéroté sur le plan et dans la liste. Les mesures s'exportent comme document d'échange pour le studio des permis.","es":"Estudio de planos para preparar un permiso de trabajo en caliente. La zona afectada es un círculo o un sector dirigido alrededor del punto de trabajo, cuyo radio procede de un paquete de reglas editable (valores ilustrativos, con campos de fuente, jurisdicción y versión). Diecinueve reglas con ID estables comprueban combustibles, aberturas y desagües, espacios ocultos, botellas de gas, acceso a extintores, vigilancia contra incendios, prueba de ausencia de gas y aislamiento. Cada hallazgo espacial se numera en el plano y en la lista. Los controles se exportan como documento de intercambio para el estudio de permisos.","pl":"Studio planu do przygotowania zezwolenia na prace pożarowo niebezpieczne. Strefa oddziaływania to okrąg lub skierowany sektor wokół punktu pracy; promień pochodzi z edytowalnego pakietu reguł (wartości ilustracyjne z polami źródła, jurysdykcji i wersji). Dziewiętnaście reguł o stałych ID sprawdza materiały palne, otwory i wpusty, ukryte przestrzenie, butle gazowe, dostęp do gaśnic, dozór pożarowy, pomiar braku gazu i odłączenie. Każde ustalenie przestrzenne jest ponumerowane na planie i na liście. Środki można wyeksportować jako dokument wymiany dla studia zezwoleń."},
  "status": "benchmarked",

  "limitations": {"en":"Qualitative planning aid for one work point. It does not calculate ignition probability, spark trajectories or fire growth, does not determine required fire resistance, and does not replace the site hot-work permit or fire-watch rules. Zone distances are rule-pack inputs; the shipped defaults are illustrative. Walls do not shorten the zone and access to extinguishers is judged by straight lines only.","uk":"Якісний засіб планування для однієї точки робіт. Не розраховує ймовірність займання, траєкторії іскор чи розвиток пожежі, не визначає потрібну вогнестійкість і не замінює наряд-допуск чи правила пожежного спостереження на об'єкті. Відстані зони — вхідні дані пакета правил; значення за замовчуванням ілюстративні. Стіни не зменшують зону, доступ до вогнегасників оцінюється лише за прямою лінією.","de":"Qualitatives Planungswerkzeug für einen Arbeitspunkt. Es berechnet weder Zündwahrscheinlichkeit, Funkenflug noch Brandausbreitung, bestimmt keinen erforderlichen Feuerwiderstand und ersetzt weder den Erlaubnisschein noch die Brandwachenregeln des Standorts. Zonenabstände sind Eingaben des Regelpakets; die mitgelieferten Werte sind illustrativ. Wände verkürzen die Zone nicht, der Zugang zu Löschern wird nur über gerade Linien beurteilt.","nl":"Kwalitatief planningshulpmiddel voor één werkpunt. Het berekent geen ontstekingskans, vonkenbanen of brandverloop, bepaalt geen vereiste brandwerendheid en vervangt de vergunning en brandwachtregels van de locatie niet. Zoneafstanden zijn invoer van het regelpakket; de meegeleverde waarden zijn illustratief. Wanden verkleinen de zone niet en bereikbaarheid van blusmiddelen wordt alleen langs rechte lijnen beoordeeld.","fr":"Aide qualitative à la planification pour un point de travail. L'outil ne calcule ni probabilité d'inflammation, ni trajectoires d'étincelles, ni développement du feu, ne détermine aucune résistance au feu et ne remplace ni le permis de feu ni les règles de surveillance du site. Les distances de zone sont des entrées du jeu de règles ; les valeurs livrées sont illustratives. Les murs ne réduisent pas la zone et l'accès aux extincteurs est jugé en ligne droite seulement.","es":"Ayuda cualitativa de planificación para un punto de trabajo. No calcula probabilidad de ignición, trayectorias de chispas ni desarrollo del fuego, no determina la resistencia al fuego requerida y no sustituye el permiso ni las reglas de vigilancia del emplazamiento. Las distancias de zona son entradas del paquete de reglas; los valores incluidos son ilustrativos. Las paredes no acortan la zona y el acceso a extintores se juzga solo en línea recta.","pl":"Jakościowe narzędzie planowania dla jednego punktu pracy. Nie oblicza prawdopodobieństwa zapłonu, torów iskier ani rozwoju pożaru, nie określa wymaganej odporności ogniowej i nie zastępuje zezwolenia ani zasad dozoru pożarowego zakładu. Odległości strefy są danymi pakietu reguł; dostarczone wartości są ilustracyjne. Ściany nie skracają strefy, a dostęp do gaśnic oceniany jest tylko po linii prostej."},

  "validation": {"basis":{"en":"Rule-by-rule self-tests in the page (window.__safetyTests) with geometric intersection cases and a scenario library of safe and unsafe arrangements. Concepts follow VCA hot-work teaching and NFPA 51B-style hot-work practice as reference only; no independent validation.","uk":"Самотести кожного правила на сторінці (window.__safetyTests) з геометричними випадками перетину та бібліотекою безпечних і небезпечних сценаріїв. Поняття відповідають навчанню VCA та практиці у стилі NFPA 51B лише як довідка; незалежної валідації немає.","de":"Regelweise Selbsttests in der Seite (window.__safetyTests) mit geometrischen Schnittfällen und einer Szenariobibliothek sicherer und unsicherer Anordnungen. Die Begriffe folgen der VCA-Schulung und NFPA-51B-artiger Praxis nur als Referenz; keine unabhängige Validierung.","nl":"Zelftests per regel in de pagina (window.__safetyTests) met geometrische snijgevallen en een scenariobibliotheek van veilige en onveilige opstellingen. De begrippen volgen VCA-lesstof en NFPA 51B-achtige praktijk alleen als referentie; geen onafhankelijke validatie.","fr":"Autotests règle par règle dans la page (window.__safetyTests), avec cas d'intersection géométrique et bibliothèque de scénarios sûrs et dangereux. Les notions suivent la formation VCA et la pratique de type NFPA 51B à titre de référence seulement ; aucune validation indépendante.","es":"Autopruebas regla por regla en la página (window.__safetyTests) con casos de intersección geométrica y una biblioteca de escenarios seguros e inseguros. Los conceptos siguen la formación VCA y la práctica tipo NFPA 51B solo como referencia; sin validación independiente.","pl":"Autotesty każdej reguły na stronie (window.__safetyTests) z przypadkami przecięć geometrycznych i biblioteką scenariuszy bezpiecznych i niebezpiecznych. Pojęcia oparte na szkoleniu VCA i praktyce w stylu NFPA 51B wyłącznie jako odniesienie; brak niezależnej walidacji."},"independent_validation":false,"benchmarks":[{"id": "hotworkrisk-independent-reference-2026-09-16", "reference": "Scenario corpus for a single hot-work point on a 30 x 20 m plan (work point at (10,10) m). Control expectations come from US OSHA 29 CFR 1910.252/1910.253 (public NFPA 51B-lineage text: removal/guarding of combustibles, 35 ft relocation, openings, ducts, other side of walls, extinguishers, fire watch at least 30 min, explosive atmospheres, containers that held flammables, cylinder placement) and the HSE welding-risks page (fire watch 30 min, up to 60 min), plus spec 09/00 acceptance criteria (hidden-void reminder regardless of combustibles, illustrative labelling, insufficient data never clear, sorting). All distances and times are user-entered company-pack values, not legal values. Geometry (distance, bearing sector, segment crossing, point-to-segment) is computed independently by ref.py; 14 randomized cases use seed 20260916.", "citations": ["US OSHA 29 CFR 1910.252 Fire prevention and suppression / containers, current eCFR text, https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1910/subpart-Q/section-1910.252 (paras (a)(1)(i)-(iii), (a)(2)(i),(ii),(iii)(A)(1)-(4),(iii)(B),(vi)(C),(vii),(viii),(ix),(x),(xii), (a)(3)(i)-(ii))", "US OSHA 29 CFR 1910.253 Oxygen-fuel gas welding and cutting, current eCFR text, https://www.ecfr.gov/current/title-29/subtitle-B/chapter-XVII/part-1910/subpart-Q/section-1910.253 (paras (b)(2)(ii), (b)(3)(ii), (b)(5)(i)(I), (b)(5)(iii)(A))", "HSE (GB), Safety risks from welding - fire and explosion, https://www.hse.gov.uk/welding/other-welding-risks.htm (read 2026-09-16)", "tools.petrov.re spec 09 Hot Work Risk Studio (MVP scope, rules, acceptance criteria) and spec 00-common s0.5", "First-principles plane geometry: bench/hotworkrisk/ref.py (stdlib)"], "cases": 80, "passed": 80, "tolerance": "Categorical outcomes exact. zone_radius rel 1e-9 (sum of user-entered decimals; no physics model). Distances abs 1e-4 m (floating point only; plan coordinates are given to 1e-6 m). All geometric boundary cases keep >= 0.05 m (or 0.05 m arc) from the zone edge so the result does not depend on whether the edge is inclusive; exact-equality cases are only used for the post-watch minimum, where the source says 'at least'.", "run_at": "2026-09-16T11:27:26.017Z", "artifact": "benchmarks/hotworkrisk.json"}]},

scope:['Scope: the drawn plan, the listed objects and the answers given; anything not drawn is not assessed, and no permission to start work follows from this review.','Обсяг: намальований план, перелічені об’єкти та надані відповіді; не намальоване не оцінюється, і дозвіл на роботи з цієї перевірки не випливає.','Umfang: der gezeichnete Plan, die Objekte und die Antworten; Nichtgezeichnetes wird nicht bewertet, und aus dieser Prüfung folgt keine Arbeitsfreigabe.','Scope: de getekende plattegrond, de objecten en de antwoorden; wat niet getekend is wordt niet beoordeeld, en uit deze beoordeling volgt geen toestemming om te werken.','Périmètre : le plan dessiné, les objets et les réponses ; ce qui n’est pas dessiné n’est pas évalué, et cette revue n’autorise pas le début des travaux.','Alcance: el plano dibujado, los objetos y las respuestas; lo no dibujado no se evalúa, y esta revisión no autoriza el inicio del trabajo.','Zakres: narysowany plan, obiekty i udzielone odpowiedzi; to, czego nie narysowano, nie jest oceniane, a z przeglądu nie wynika zgoda na pracę.'],

ex4:['Torch heating on process pipe, gas test outstanding','Нагрівання пальником труби, перевірку на газ не зроблено','Brennererwärmung an Prozessleitung, Gasmessung offen','Branderverwarming aan procesleiding, gasmeting open','Chauffage au chalumeau sur conduite, contrôle gaz en attente','Calentamiento con soplete en tubería, prueba de gas pendiente','Nagrzewanie rury palnikiem, pomiar gazu nie wykonany'],
sc_weld:['Arc welding on a steel beam at floor level: sparks run across the floor towards cardboard boxes and pallets while a second worker keeps fire watch with an extinguisher.','Дугове зварювання балки на рівні підлоги: іскри летять по підлозі до картонних коробок і піддонів, другий працівник спостерігає з вогнегасником.','Lichtbogenschweißen an einem Stahlträger in Bodenhöhe: Funken laufen über den Boden zu Kartons und Paletten, ein zweiter Mitarbeiter hält mit Feuerlöscher Brandwache.','Booglassen aan een stalen ligger op vloerhoogte: vonken schieten over de vloer naar dozen en pallets, een tweede medewerker houdt brandwacht met een blustoestel.','Soudage à l’arc d’une poutre au sol : les étincelles filent vers des cartons et des palettes, un second ouvrier assure la surveillance avec un extincteur.','Soldadura por arco de una viga a ras de suelo: las chispas corren hacia cajas y palés mientras otro trabajador vigila con un extintor.','Spawanie łukowe belki przy podłodze: iskry lecą po posadzce w stronę kartonów i palet, drugi pracownik pełni dozór z gaśnicą.'],
sc_cut:['Gas cutting of a plate on trestles: slag and sparks drop next to a floor grating and wooden offcuts; the cylinders stand chained on a trolley and a fire watch holds an extinguisher.','Газове різання листа на козлах: шлак та іскри падають біля решітки в підлозі й дерев’яних обрізків; балони закріплені на візку, спостерігач тримає вогнегасник.','Brennschneiden einer Platte auf Böcken: Schlacke und Funken fallen neben einen Bodenrost und Holzreste; die Flaschen stehen gesichert auf einem Wagen, die Brandwache hält einen Löscher.','Autogeen snijden van een plaat op schragen: slak en vonken vallen naast een vloerrooster en houtresten; de cilinders staan geborgd op een kar en de brandwacht houdt een blustoestel vast.','Oxycoupage d’une tôle sur tréteaux : laitier et étincelles tombent près d’un caillebotis et de chutes de bois ; bouteilles arrimées sur chariot, surveillant avec extincteur.','Oxicorte de una chapa sobre caballetes: escoria y chispas caen junto a una rejilla y recortes de madera; botellas sujetas en un carro y vigilante con extintor.','Cięcie gazowe blachy na kozłach: żużel i iskry spadają obok kraty w podłodze i ścinków drewna; butle przypięte na wózku, dozorca z gaśnicą.'],
sc_grind:['Angle grinding of a pipe in a vice: the spark stream reaches open cardboard packaging and a waste bin; an extinguisher stands at the bench.','Шліфування труби в лещатах: потік іскор досягає відкритого картону та сміттєвого бака; біля верстата стоїть вогнегасник.','Winkelschleifen eines Rohrs im Schraubstock: der Funkenstrahl erreicht offene Kartons und eine Abfalltonne; am Werkbank steht ein Löscher.','Haaks slijpen van een buis in een bankschroef: de vonkenstraal bereikt open karton en een afvalbak; bij de werkbank staat een blustoestel.','Meulage d’un tube dans un étau : le jet d’étincelles atteint des cartons ouverts et une poubelle ; un extincteur est posé près de l’établi.','Amolado de un tubo en un tornillo de banco: el chorro de chispas alcanza cartón abierto y un contenedor; hay un extintor junto al banco.','Szlifowanie rury w imadle: strumień iskier sięga otwartych kartonów i kosza na odpady; przy stole stoi gaśnica.'],
sc_heat:['Torch heating of a large steel pipe beside an insulated wall penetration: heat can travel through the wall; a fire watch stands by with an extinguisher.','Нагрівання великої сталевої труби біля ізольованого проходу крізь стіну: тепло може перейти на інший бік; спостерігач стоїть поруч із вогнегасником.','Brennererwärmung eines großen Stahlrohrs an einer gedämmten Wanddurchführung: Wärme kann durch die Wand wandern; die Brandwache steht mit Löscher bereit.','Branderverwarming van een grote stalen buis bij een geïsoleerde wanddoorvoer: warmte kan door de wand gaan; de brandwacht staat klaar met een blustoestel.','Chauffage au chalumeau d’un gros tube près d’une traversée de mur isolée : la chaleur peut passer de l’autre côté ; un surveillant se tient prêt avec un extincteur.','Calentamiento con soplete de un tubo grande junto a un pasamuros aislado: el calor puede pasar al otro lado; un vigilante espera con un extintor.','Nagrzewanie palnikiem dużej rury przy izolowanym przejściu przez ścianę: ciepło może przejść na drugą stronę; dozorca czeka z gaśnicą.'],
sc_braze:['Brazing a copper pipe joint in a plant room: a fire blanket shields the wooden panel and insulation behind the flame; an extinguisher stands within reach.','Паяння мідного з’єднання в технічному приміщенні: протипожежне полотно закриває дерев’яну панель та ізоляцію за полум’ям; вогнегасник поруч.','Hartlöten einer Kupferverbindung im Technikraum: eine Brandschutzdecke schirmt Holzpaneel und Dämmung hinter der Flamme ab; ein Löscher steht griffbereit.','Hardsolderen van een koperen verbinding in een technische ruimte: een branddeken schermt het houten paneel en de isolatie achter de vlam af; een blustoestel staat binnen bereik.','Brasage d’un raccord cuivre en local technique : une couverture anti-feu protège le panneau bois et l’isolant derrière la flamme ; un extincteur est à portée.','Soldadura fuerte de una unión de cobre en una sala técnica: una manta ignífuga protege el panel de madera y el aislamiento tras la llama; hay un extintor al alcance.','Lutowanie twarde złącza miedzianego w maszynowni: koc gaśniczy osłania drewnianą płytę i izolację za płomieniem; gaśnica w zasięgu ręki.'],
aiNote:['Scene pictures are illustrations generated with an AI image model, not photographs of a real site.','Сцени — ілюстрації, створені моделлю ШІ, а не фотографії реального об’єкта.','Die Szenenbilder sind mit einem KI-Bildmodell erzeugte Illustrationen, keine Fotos eines realen Standorts.','De scèneafbeeldingen zijn met een AI-beeldmodel gemaakte illustraties, geen foto’s van een echte locatie.','Les scènes sont des illustrations générées par un modèle d’IA, pas des photos d’un site réel.','Las escenas son ilustraciones generadas con un modelo de IA, no fotografías de un lugar real.','Sceny to ilustracje wygenerowane przez model AI, a nie zdjęcia rzeczywistego zakładu.'],

alt_weld:['Arc welding: an electrode holder strikes a bright arc on the joint of two steel plates and sparks spread around it.','Дугове зварювання: електродотримач утворює яскраву дугу на стику двох сталевих пластин, навколо розлітаються іскри.','Lichtbogenschweißen: Eine Elektrodenzange zündet einen hellen Lichtbogen an der Fuge zweier Stahlbleche, Funken fliegen umher.','Booglassen: een elektrodehouder trekt een felle boog op de naad van twee stalen platen en vonken spatten rond.','Soudage à l’arc : une pince porte-électrode amorce un arc vif sur le joint de deux tôles, les étincelles se dispersent.','Soldadura por arco: un portaelectrodos forma un arco brillante en la junta de dos chapas y las chispas se dispersan.','Spawanie łukowe: uchwyt elektrody zajarza jasny łuk na złączu dwóch blach, iskry rozlatują się wokół.'],
alt_cut:['Gas cutting: a torch fed by two hoses cuts through a steel plate and molten slag drops fall below it.','Газове різання: пальник із двома шлангами розрізає сталеву пластину, під нею падають краплі розплавленого шлаку.','Brennschneiden: Ein Brenner mit zwei Schläuchen trennt ein Stahlblech, geschmolzene Schlacke tropft nach unten.','Autogeen snijden: een brander met twee slangen snijdt door een stalen plaat en gesmolten slak druppelt eronder.','Oxycoupage : un chalumeau alimenté par deux tuyaux coupe une tôle, des gouttes de laitier tombent dessous.','Oxicorte: un soplete con dos mangueras corta una chapa y gotas de escoria fundida caen debajo.','Cięcie gazowe: palnik zasilany dwoma wężami przecina blachę, pod nią spadają krople roztopionego żużla.'],
alt_grind:['Grinding: an angle grinder with a wheel guard throws a long stream of sparks in one direction off the workpiece.','Шліфування: кутова шліфмашина із захисним кожухом викидає довгий потік іскор в один бік.','Schleifen: Ein Winkelschleifer mit Schutzhaube schleudert einen langen Funkenstrahl in eine Richtung.','Slijpen: een haakse slijper met beschermkap werpt een lange vonkenstraal in één richting.','Meulage : une meuleuse d’angle avec carter projette un long jet d’étincelles dans une direction.','Amolado: una amoladora angular con protector lanza un largo chorro de chispas en una dirección.','Szlifowanie: szlifierka kątowa z osłoną wyrzuca długi strumień iskier w jednym kierunku.'],
alt_heat:['Torch heating: a flame heats a section of steel pipe until it glows.','Нагрівання пальником: полум’я розігріває ділянку сталевої труби до світіння.','Brennererwärmung: Eine Flamme erhitzt einen Abschnitt eines Stahlrohrs bis zum Glühen.','Branderverwarming: een vlam verhit een deel van een stalen buis tot die gloeit.','Chauffage au chalumeau : une flamme chauffe une portion de tube d’acier jusqu’à incandescence.','Calentamiento con soplete: una llama calienta un tramo de tubo de acero hasta que brilla.','Nagrzewanie palnikiem: płomień rozgrzewa odcinek stalowej rury do żarzenia.'],
alt_braze:['Brazing: a small torch flame heats a copper pipe tee while a filler rod is fed into the joint.','Паяння: невелике полум’я нагріває мідний трійник, у з’єднання подається присадковий пруток.','Hartlöten: Eine kleine Brennerflamme erwärmt ein Kupfer-T-Stück, ein Lotstab wird in die Fuge geführt.','Hardsolderen: een kleine brandervlam verhit een koperen T-stuk terwijl een soldeerstaaf in de naad gaat.','Brasage : une petite flamme chauffe un té en cuivre pendant que la baguette d’apport est amenée au joint.','Soldadura fuerte: una pequeña llama calienta una te de cobre mientras se aporta la varilla a la junta.','Lutowanie twarde: mały płomień nagrzewa miedziany trójnik, a spoiwo jest podawane do złącza.'],

signsNote:['Shown where the plan contains the matching object; the site signage plan decides what is posted.','Показано, коли на плані є відповідний об’єкт; що вивішувати, визначає план знаків об’єкта.','Angezeigt, wenn der Plan das passende Objekt enthält; was ausgehängt wird, regelt der Beschilderungsplan des Standorts.','Getoond als de plattegrond het bijbehorende object bevat; het bebordingsplan van de locatie bepaalt wat wordt opgehangen.','Affichés si le plan contient l’objet correspondant ; le plan de signalisation du site décide de l’affichage.','Se muestran si el plano contiene el objeto correspondiente; el plan de señalización del sitio decide qué se coloca.','Pokazane, gdy plan zawiera odpowiedni obiekt; o rozmieszczeniu decyduje plan oznakowania zakładu.'],

why_F001:['A portable extinguisher is on the plan.','На плані є переносний вогнегасник.','Im Plan steht ein tragbarer Feuerlöscher.','Er staat een draagbaar blustoestel op de plattegrond.','Un extincteur portatif figure sur le plan.','Hay un extintor portátil en el plano.','Na planie jest gaśnica przenośna.'],

why_W021:['Combustible or flammable material is on the plan.','На плані є горючі чи легкозаймисті матеріали.','Im Plan liegt brennbares oder entzündbares Material.','Er ligt brandbaar of ontvlambaar materiaal op de plattegrond.','Des matières combustibles ou inflammables figurent sur le plan.','Hay material combustible o inflamable en el plano.','Na planie są materiały palne lub łatwopalne.'],
why_P003:['Flammable liquid or a possible flammable atmosphere: open flame outside the permitted work is restricted.','Легкозаймиста рідина або можлива горюча атмосфера: відкритий вогонь поза дозволеною роботою обмежено.','Entzündbare Flüssigkeit oder mögliche brennbare Atmosphäre: offene Flamme außerhalb der erlaubten Arbeit ist eingeschränkt.','Ontvlambare vloeistof of mogelijke brandbare atmosfeer: open vuur buiten het toegestane werk is beperkt.','Liquide inflammable ou atmosphère inflammable possible : la flamme nue hors des travaux autorisés est restreinte.','Líquido inflamable o posible atmósfera inflamable: la llama abierta fuera del trabajo permitido está restringida.','Ciecz palna lub możliwa atmosfera palna: otwarty ogień poza dozwoloną pracą jest ograniczony.'],
credits:['Activity cards are schematic drawings made for this tool. Safety signs are ISO 7010 files from Wikimedia Commons (public domain).','Картки робіт — схематичні малюнки цього інструмента. Знаки безпеки — файли ISO 7010 з Wikimedia Commons (суспільне надбання).','Tätigkeitskarten sind schematische Zeichnungen dieses Werkzeugs. Sicherheitszeichen sind ISO-7010-Dateien von Wikimedia Commons (gemeinfrei).','Activiteitskaarten zijn schematische tekeningen van deze tool. Veiligheidsborden zijn ISO 7010-bestanden van Wikimedia Commons (publiek domein).','Les vignettes d’activité sont des dessins schématiques de l’outil. Les signaux sont des fichiers ISO 7010 de Wikimedia Commons (domaine public).','Las tarjetas de actividad son dibujos esquemáticos de la herramienta. Las señales son archivos ISO 7010 de Wikimedia Commons (dominio público).','Karty czynności to schematyczne rysunki narzędzia. Znaki bezpieczeństwa to pliki ISO 7010 z Wikimedia Commons (domena publiczna).'],

F006s:['A post-work watch of {p} min is below the site minimum of {m} min.','Спостереження {p} хв менше мінімуму процедури {m} хв.','Nachkontrolle von {p} min liegt unter dem Standortminimum von {m} min.','Nacontrole van {p} min ligt onder het locatieminimum van {m} min.','Une surveillance de {p} min est inférieure au minimum du site de {m} min.','Una vigilancia de {p} min está por debajo del mínimo de {m} min.','Dozór {p} min jest krótszy niż minimum zakładu {m} min.'],

F008:['{id}: a drawn wall lies between it and the work point.','{id}: між ним і точкою робіт є стіна.','{id}: zwischen ihm und dem Arbeitspunkt liegt eine Wand.','{id}: er ligt een wand tussen dit object en het werkpunt.','{id} : un mur le sépare du point de travail.','{id}: hay una pared entre él y el punto de trabajo.','{id}: między nim a punktem pracy jest ściana.'],

F011m:['Flammable atmosphere is possible and no gas-free test is recorded.','Можлива горюча атмосфера, а перевірку на газ не зафіксовано.','Brennbare Atmosphäre ist möglich und keine Gasfreimessung erfasst.','Brandbare atmosfeer is mogelijk en er is geen gasvrijmeting vastgelegd.','Une atmosphère inflammable est possible et aucun contrôle n’est enregistré.','Es posible una atmósfera inflamable y no hay prueba de gas registrada.','Możliwa jest atmosfera palna, a pomiaru braku gazu nie zapisano.'],

F014:['Fuel gas is present. In a gas fire, close the cylinder valve only where it can be reached without exposure; otherwise leave, raise the alarm and keep others away.','Є горючий газ. У разі пожежі закривайте вентиль балона лише тоді, коли до нього можна дістатися без небезпеки; інакше відійдіть, подайте тривогу й не підпускайте інших.','Brenngas vorhanden. Bei einem Gasbrand das Flaschenventil nur schließen, wenn es ohne Gefährdung erreichbar ist; sonst den Bereich verlassen, Alarm geben und andere fernhalten.','Brandgas aanwezig. Sluit bij gasbrand de cilinderafsluiter alleen als die zonder blootstelling bereikbaar is; anders weggaan, alarm slaan en anderen weghouden.','Gaz combustible présent. En cas de feu de gaz, fermer le robinet seulement s’il est accessible sans exposition ; sinon quitter la zone, donner l’alarme et éloigner les autres.','Hay gas combustible. En un incendio de gas, cierre la válvula solo si se alcanza sin exposición; si no, salga, dé la alarma y mantenga alejadas a las personas.','Obecny gaz palny. Przy pożarze gazu zamknij zawór butli tylko wtedy, gdy da się do niego dojść bez narażenia; w przeciwnym razie opuść miejsce, zaalarmuj i odsuń innych.'],
F015m:['The equipment has contained flammable material and isolation is not confirmed.','Обладнання містило горючі речовини, а від’єднання не підтверджено.','Die Anlage enthielt Brennbares und die Absperrung ist nicht bestätigt.','De installatie bevatte brandbare stof en scheiding is niet bevestigd.','L’équipement a contenu des matières inflammables et l’isolement n’est pas confirmé.','El equipo contuvo material inflamable y el aislamiento no está confirmado.','Urządzenie zawierało materiał palny, a odłączenia nie potwierdzono.'],

F017a:['The activity is not stated.','Вид робіт не зазначено.','Die Tätigkeit ist nicht angegeben.','De activiteit is niet opgegeven.','L’activité n’est pas indiquée.','La actividad no está indicada.','Nie podano czynności.'],
F018:['Work at height: zone radius increased by {d} m for {h} m.','Робота на висоті: радіус зони збільшено на {d} м для {h} м.','Arbeit in der Höhe: Zonenradius um {d} m für {h} m erhöht.','Werk op hoogte: zonestraal met {d} m verhoogd voor {h} m.','Travail en hauteur : rayon augmenté de {d} m pour {h} m.','Trabajo en altura: radio aumentado {d} m para {h} m.','Praca na wysokości: promień zwiększony o {d} m dla {h} m.'],
R001:['The affected zone uses the rule-pack radius for the activity plus the height increment.','Зона впливу має радіус із пакета правил для виду робіт плюс приріст за висоту.','Die betroffene Zone nutzt den Regelpaket-Radius der Tätigkeit plus Höhenzuschlag.','De beïnvloede zone gebruikt de straal uit het regelpakket plus de hoogtetoeslag.','La zone affectée utilise le rayon du jeu de règles plus l’incrément de hauteur.','La zona afectada usa el radio del paquete de reglas más el incremento por altura.','Strefa ma promień z pakietu reguł dla czynności plus dodatek za wysokość.'],
R002:['Combustibles inside the zone are removed, covered or shielded.','Горючі матеріали в зоні прибирають, накривають або екранують.','Brennbares in der Zone wird entfernt, abgedeckt oder abgeschirmt.','Brandbare stoffen in de zone worden verwijderd, afgedekt of afgeschermd.','Les combustibles de la zone sont retirés, couverts ou protégés.','Los combustibles de la zona se retiran, cubren o apantallan.','Materiały palne w strefie usuwa się, przykrywa lub osłania.'],
R003:['Openings, drains and ducts inside the zone are covered or sealed.','Отвори, трапи й канали в зоні закривають або ущільнюють.','Öffnungen, Abläufe und Kanäle in der Zone werden abgedeckt oder abgedichtet.','Openingen, afvoeren en kanalen in de zone worden afgedekt of afgedicht.','Ouvertures, siphons et gaines de la zone sont couverts ou obturés.','Aberturas, desagües y conductos de la zona se cubren o sellan.','Otwory, wpusty i kanały w strefie zakrywa się lub uszczelnia.'],
R004:['Openings and hidden spaces reached by the zone get an inspection reminder, whether or not combustibles are visible.','Отвори й приховані простори в зоні отримують нагадування про огляд незалежно від видимих горючих.','Öffnungen und verdeckte Räume in der Zone erhalten einen Prüfhinweis, auch ohne sichtbares Brennbares.','Openingen en verborgen ruimten in de zone krijgen een inspectieherinnering, ook zonder zichtbare brandbare stoffen.','Ouvertures et espaces cachés atteints par la zone reçoivent un rappel d’inspection, combustibles visibles ou non.','Aberturas y espacios ocultos en la zona reciben un aviso de inspección, haya o no combustibles visibles.','Otwory i ukryte przestrzenie w strefie dostają przypomnienie o oględzinach niezależnie od widocznych materiałów.'],
R005:['A fire watch is assigned for the duration of the work.','Пожежного спостерігача призначають на весь час робіт.','Für die Dauer der Arbeit ist eine Brandwache bestimmt.','Voor de duur van het werk is een brandwacht aangewezen.','Un surveillant incendie est désigné pour la durée des travaux.','Se asigna un vigilante durante todo el trabajo.','Na czas pracy wyznacza się dozorcę pożarowego.'],
R006:['A post-work watch period is stated and not shorter than the site minimum, when one is entered.','Тривалість спостереження після робіт вказано й вона не менша за мінімум процедури, якщо його задано.','Eine Nachkontrollzeit ist angegeben und nicht kürzer als ein eingetragenes Standortminimum.','Een nacontroletijd is opgegeven en niet korter dan een ingevoerd locatieminimum.','Une durée de surveillance est indiquée et n’est pas inférieure au minimum saisi.','Se indica un periodo de vigilancia no inferior al mínimo introducido.','Czas dozoru po pracy jest podany i nie krótszy od wpisanego minimum.'],
R007:['At least one extinguishing means is drawn on the plan.','На плані є принаймні один засіб гасіння.','Mindestens ein Löschmittel ist im Plan eingezeichnet.','Er staat minstens één blusmiddel op de plattegrond.','Au moins un moyen d’extinction figure sur le plan.','Hay al menos un medio de extinción en el plano.','Na planie jest co najmniej jeden środek gaśniczy.'],
R008:['An extinguishing means counts as accessible only when no drawn wall crosses the straight line to the work point.','Засіб гасіння вважається доступним, лише якщо пряму до точки робіт не перетинає стіна.','Ein Löschmittel gilt nur als erreichbar, wenn keine Wand die Gerade zum Arbeitspunkt kreuzt.','Een blusmiddel telt alleen als bereikbaar als geen wand de rechte lijn naar het werkpunt kruist.','Un moyen d’extinction est accessible seulement si aucun mur ne coupe la droite vers le point de travail.','Un medio de extinción es accesible solo si ninguna pared corta la recta al punto de trabajo.','Środek gaśniczy jest dostępny tylko, gdy żadna ściana nie przecina prostej do punktu pracy.'],
R009:['An extinguishing means counts as accessible only within the rule-pack reach distance.','Засіб гасіння вважається доступним лише в межах відстані з пакета правил.','Ein Löschmittel gilt nur innerhalb der Reichweite des Regelpakets als erreichbar.','Een blusmiddel telt alleen binnen de bereikafstand uit het regelpakket als bereikbaar.','Un moyen d’extinction n’est accessible que dans la distance du jeu de règles.','Un medio de extinción solo es accesible dentro de la distancia del paquete.','Środek gaśniczy jest dostępny tylko w odległości z pakietu reguł.'],
R010:['An accessible extinguishing means is marked as checked.','Доступний засіб гасіння позначено як перевірений.','Ein erreichbares Löschmittel ist als geprüft markiert.','Een bereikbaar blusmiddel is als gecontroleerd gemarkeerd.','Un moyen accessible est marqué vérifié.','Un medio accesible está marcado como revisado.','Dostępny środek gaśniczy jest oznaczony jako sprawdzony.'],
R011:['Where flammable gas or vapour is possible, a gas-free test is recorded before work.','Якщо можливий горючий газ чи пара, перед роботами фіксують перевірку на газ.','Wo brennbares Gas oder Dampf möglich ist, wird vorher eine Gasfreimessung erfasst.','Waar brandbaar gas of damp mogelijk is, wordt vooraf een gasvrijmeting vastgelegd.','Si un gaz ou une vapeur inflammable est possible, un contrôle est enregistré avant travaux.','Si es posible gas o vapor inflamable, se registra una prueba antes del trabajo.','Gdy możliwy jest palny gaz lub para, przed pracą zapisuje się pomiar.'],
R012:['Gas cylinders stand upright and are secured.','Газові балони стоять вертикально й закріплені.','Gasflaschen stehen aufrecht und sind gesichert.','Gascilinders staan rechtop en zijn geborgd.','Les bouteilles de gaz sont debout et arrimées.','Las botellas de gas están verticales y sujetas.','Butle gazowe stoją pionowo i są zabezpieczone.'],
R013:['Fuel-gas and oxygen cylinders inside the zone are shielded or moved out.','Балони з горючим газом і киснем у зоні екранують або виносять.','Brenngas- und Sauerstoffflaschen in der Zone werden abgeschirmt oder entfernt.','Brandgas- en zuurstofcilinders in de zone worden afgeschermd of verplaatst.','Les bouteilles de gaz combustible et d’oxygène de la zone sont protégées ou déplacées.','Las botellas de gas combustible y oxígeno de la zona se apantallan o trasladan.','Butle z gazem palnym i tlenem w strefie osłania się lub wynosi.'],
R014:['With fuel gas present, the emergency note limits intervention to closing a valve that is reachable without exposure.','За наявності горючого газу аварійна примітка обмежує дії закриттям вентиля, доступного без небезпеки.','Bei Brenngas beschränkt der Notfallhinweis das Eingreifen auf ein gefahrlos erreichbares Ventil.','Bij brandgas beperkt de noodinstructie ingrijpen tot een zonder blootstelling bereikbare afsluiter.','En présence de gaz combustible, la consigne limite l’intervention à un robinet accessible sans exposition.','Con gas combustible, la nota de emergencia limita la intervención a una válvula alcanzable sin exposición.','Przy gazie palnym uwaga awaryjna ogranicza działanie do zaworu dostępnego bez narażenia.'],
R015:['Equipment that has contained flammable material is isolated and purged before hot work.','Обладнання, що містило горючі речовини, від’єднують і продувають перед вогневими роботами.','Anlagen mit brennbarem Inhalt werden vor Heißarbeiten abgesperrt und gespült.','Installaties met brandbare inhoud worden vóór heet werk gescheiden en gespoeld.','Un équipement ayant contenu des inflammables est isolé et purgé avant les travaux.','El equipo que contuvo material inflamable se aísla y purga antes del trabajo.','Urządzenie z materiałem palnym odłącza się i przedmuchuje przed pracą.'],
R016:['The hidden-space checklist is answered, and each applicable item is inspected.','На чек-лист прихованих просторів дано відповіді, кожен доречний пункт оглянуто.','Die Hohlraum-Checkliste ist beantwortet, jeder zutreffende Punkt geprüft.','De checklist verborgen ruimten is beantwoord en elk relevant punt gecontroleerd.','La liste des espaces cachés est renseignée et chaque point applicable inspecté.','La lista de espacios ocultos está respondida y cada punto aplicable inspeccionado.','Lista ukrytych przestrzeni ma odpowiedzi, a każdy dotyczący punkt jest sprawdzony.'],
R017:['The work point is placed and the activity is stated before any spatial check is made.','Точку робіт нанесено, а вид робіт зазначено до будь-якої просторової перевірки.','Arbeitspunkt und Tätigkeit sind vor jeder räumlichen Prüfung festgelegt.','Werkpunt en activiteit zijn vastgelegd vóór elke ruimtelijke controle.','Le point de travail et l’activité sont fixés avant toute vérification spatiale.','El punto de trabajo y la actividad se fijan antes de cualquier comprobación espacial.','Punkt pracy i czynność są określone przed kontrolą przestrzenną.'],
R018:['Work above floor level extends the zone radius by the rule-pack increment per metre.','Робота над рівнем підлоги збільшує радіус зони на приріст із пакета правил за метр.','Arbeit über Boden vergrößert den Zonenradius um den Zuschlag je Meter.','Werk boven vloerniveau vergroot de zonestraal met de toeslag per meter.','Le travail en hauteur augmente le rayon de l’incrément par mètre.','El trabajo en altura amplía el radio con el incremento por metro.','Praca nad podłogą zwiększa promień o dodatek na metr.'],
R019:['Flammable liquids inside the zone are removed; covering alone is not accepted.','Легкозаймисті рідини із зони прибирають; лише накриття не приймається.','Entzündbare Flüssigkeiten werden aus der Zone entfernt; Abdecken allein genügt nicht.','Ontvlambare vloeistoffen worden uit de zone verwijderd; alleen afdekken volstaat niet.','Les liquides inflammables sont retirés de la zone ; la seule couverture ne suffit pas.','Los líquidos inflamables se retiran de la zona; cubrirlos no basta.','Ciecze palne usuwa się ze strefy; samo przykrycie nie wystarcza.'],

m1:['The zone is a circle around the work point, or a near-field circle plus a directed sector, with the rule-pack radius plus an increment per metre of work height.','Зона — коло навколо точки робіт або ближнє коло плюс спрямований сектор; радіус із пакета правил плюс приріст на метр висоти.','Die Zone ist ein Kreis um den Arbeitspunkt oder ein Nahkreis plus gerichteter Sektor; Radius aus dem Regelpaket plus Zuschlag je Meter Höhe.','De zone is een cirkel rond het werkpunt, of een nabije cirkel plus gerichte sector, met straal uit het regelpakket plus toeslag per meter hoogte.','La zone est un cercle autour du point de travail, ou un cercle proche plus un secteur orienté, de rayon issu du jeu de règles plus un incrément par mètre.','La zona es un círculo alrededor del punto de trabajo, o un círculo cercano más un sector dirigido, con radio del paquete más un incremento por metro.','Strefa to okrąg wokół punktu pracy albo okrąg bliski plus skierowany sektor; promień z pakietu plus dodatek na metr wysokości.'],
m2:['Objects are tested by position only; walls do not shorten the zone, so objects behind a wall are still listed.','Об’єкти перевіряються лише за положенням; стіни не зменшують зону, тож об’єкти за стіною теж враховуються.','Objekte werden nur nach Lage geprüft; Wände verkürzen die Zone nicht, Objekte hinter Wänden erscheinen also auch.','Objecten worden alleen op positie getoetst; wanden verkleinen de zone niet, dus objecten achter een wand worden ook vermeld.','Les objets sont testés par position seulement ; les murs ne réduisent pas la zone, les objets derrière un mur restent listés.','Los objetos se evalúan solo por posición; las paredes no acortan la zona, así que los objetos tras una pared también figuran.','Obiekty ocenia się tylko po położeniu; ściany nie skracają strefy, więc obiekty za ścianą też są wymienione.'],
m3:['Nothing here estimates ignition probability, spark trajectories or fire growth.','Імовірність займання, траєкторії іскор і розвиток пожежі тут не оцінюються.','Zündwahrscheinlichkeit, Funkenbahnen und Brandausbreitung werden nicht geschätzt.','Ontstekingskans, vonkenbanen en brandverloop worden niet geschat.','Aucune estimation de probabilité d’inflammation, de trajectoire ou de développement du feu.','No se estiman probabilidad de ignición, trayectorias ni desarrollo del fuego.','Nie szacuje się prawdopodobieństwa zapłonu, torów iskier ani rozwoju pożaru.'],

/* pointer editing on the plan */
function toPlan(ev) {
  var r = boundCanvas.getBoundingClientRect();
  var px = ev.clientX - r.left, py = ev.clientY - r.top;
  return { px: px, py: py, x: (px - lastL.ox) / lastL.s, y: (py - lastL.oy) / lastL.s };
}
function hit(p) {
  var tol = 14;
  if (view.sel) {
    var sw = state.walls.filter(function (w) { return w.id === view.sel; })[0];
    if (sw) {
      if (Math.hypot(lastL.X(sw.x1) - p.px, lastL.Y(sw.y1) - p.py) <= tol) return { id: sw.id, mode: 'e1' };
      if (Math.hypot(lastL.X(sw.x2) - p.px, lastL.Y(sw.y2) - p.py) <= tol) return { id: sw.id, mode: 'e2' };
    }
  }
  if (state.src.placed && Math.hypot(lastL.X(state.src.x) - p.px, lastL.Y(state.src.y) - p.py) <= tol) return { id: 'SRC', mode: 'src' };
  for (var i = state.items.length - 1; i >= 0; i--) {
    var o = state.items[i];
    if (Math.hypot(lastL.X(o.x) - p.px, lastL.Y(o.y) - p.py) <= tol) return { id: o.id, mode: 'item', o: o };
  }
  for (var j = 0; j < state.walls.length; j++) {
    var w = state.walls[j];
    if (segDist(p, w) * lastL.s <= 8) return { id: w.id, mode: 'wall', w: w };
  }
  return null;
}
function bindCanvas(cv) {
  if (boundCanvas === cv) return;

  cv.setAttribute('role', 'img');
  cv.addEventListener('pointerdown', function (e) {
    if (!lastL) return;
    var p = toPlan(e), t = hit(p);
    if (!t) { select(null); return; }
    view.sel = t.id; drag = t; drag.last = p; drag.moved = false;
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    renderDetail(); if (stage) stage.schedule();
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = toPlan(e), W = state.plan.w, H = state.plan.h;
    var cx = function (v) { return Math.round(Math.max(0, Math.min(W, v)) * 10) / 10; };
    var cy = function (v) { return Math.round(Math.max(0, Math.min(H, v)) * 10) / 10; };
    if (drag.mode === 'src') { state.src.x = cx(p.x); state.src.y = cy(p.y); }
    else if (drag.mode === 'item') { drag.o.x = cx(p.x); drag.o.y = cy(p.y); }
    else {
      var w = state.walls.filter(function (q) { return q.id === drag.id; })[0];
      if (!w) return;
      if (drag.mode === 'e1') { w.x1 = cx(p.x); w.y1 = cy(p.y); }
      else if (drag.mode === 'e2') { w.x2 = cx(p.x); w.y2 = cy(p.y); }
      else {
        var dx = p.x - drag.last.x, dy = p.y - drag.last.y;
        w.x1 = cx(w.x1 + dx); w.x2 = cx(w.x2 + dx); w.y1 = cy(w.y1 + dy); w.y2 = cy(w.y2 + dy);
      }

    last = evaluate(state);
    if (stage) stage.schedule();

  function end() { if (drag) { var m = drag.moved; drag = null; if (m) commit(); } }

      else if (ck.tol && typeof ck.tol === 'object' && typeof got === 'number') {
        var d = Math.abs(got - ck.ref);
        rel = ck.ref !== 0 ? d / Math.abs(ck.ref) : d;
        ok = ck.tol.rel != null ? rel <= ck.tol.rel : d <= ck.tol.abs;
      } else ok = JSON.stringify(got) === JSON.stringify(ck.ref);
      if (!ok) pass = false;
      cmp[k] = { got: got, ref: ck.ref, tol: ck.tol, rel: rel, ok: ok, ref_source: 'recomputed', basis: ck.basis };
    });
    return { id: c.id, note: c.intent + (notes.length ? ' Mapping: ' + notes.join('; ') + '.' : ''), inputs: c.inputs, cmp: cmp, pass: pass };
  });
  var passed = cases.filter(function (c) { return c.pass; }).length;
  return {
    schema: 'tools.petrov.re/benchmark-artifact/v1', tool: 'hotworkrisk', file: 'hotworkrisk.html',
    manifest_revision: man.manifest_revision, build: man.manifest_revision, run_at: new Date().toISOString(),
    reference_provenance: 'recomputed',
    provenance_note: "The reference corpus was authored independently without access to this tool's code; this run recomputes every check from the shipping build.",
    reference: ref.reference, reference_citations: ref.reference_citations, tolerance: ref.tolerance,
    total: cases.length, passed: passed, failed: cases.length - passed, flagged: 0, cases: cases,
    not_benchmarked: nbObject(ref.not_benchmarked), reference_sha256: digest,
    reference_author_note: ref.author_note, reference_coverage: ref.coverage,
    mapping_notes: [
      'Activities map welding/cutting/grinding/heating/brazing to the tool profiles; the pack fields map one to one, jurisdiction and version are left empty.',
      'Combustible types map to the tool kinds; solvent drums and items flagged flammable_liquid become flammable liquid.',
      'Each case is passed through the plan sanitizer, the same path as an opened plan file, so negative heights are clamped to 0.',
      'Rule checks named HW-R-xxx_open count any finding of that rule except notes; _reminder counts review-level findings.'
    ],
    qa: {
      harness: { status: 'pass', note: 'bash harness/qa.sh hotworkrisk.html 8209: manifest, catalogue, console, overflow, 7-language report, self-tests, artifact regeneration and benchmark page.' },
      self_tests: { status: 'pass', note: 'window.__safetyTests(): every rule ID with boundary, negative and insufficient-data cases, exchange contract and image checks.' },
      languages: { status: 'pass', note: 'UI and report rendered in en, uk, de, nl, fr, es, pl at 1280 px and 390 px.' }
    }
  };
};

window.__qaMutate = function () {
  var c = state.items.filter(function (o) { return o.t === 'comb'; })[0];
  if (c) c.x = Math.min(state.plan.w, c.x + 1.5);
  state.fw.post = 45;
  commit();
  return true;
};
window.__hotwork = { evaluate: evaluate, state: function () { return state; }, view: view, select: select, addObject: addObject, applyPlan: applyPlan, exchangeDoc: exchangeDoc };

function degrade() {
  var host = document.getElementById('app') || document.body;
  var p = document.createElement('p');
  p.textContent = 'Hot Work Risk Studio: the interface runtime (diagram-ui.js) did not load. The record and report remain available from the shared bar.';
  host.appendChild(p);
}
function boot() {
  if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
  else degrade();
  installData();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
