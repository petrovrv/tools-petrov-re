<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-08-11.2","id":"moleculeconstructor","file":"moleculeconstructor.html","listed":true,"category":"mat","order":22,"title":{"en":"Molecule Constructor","uk":"Конструктор молекул","de":"Molekül-Konstruktor","nl":"Molecuulbouwer","fr":"Constructeur de molécules","es":"Constructor de moléculas","pl":"Konstruktor cząsteczek"},"summary":{"en":"Build molecules atom by atom. Place atoms, connect them with bonds, and assemble structures on an interactive drawing canvas.","uk":"Створюйте молекули атом за атомом. Розміщуйте атоми, з’єднуйте їх зв’язками та збирайте структури на інтерактивному полотні.","de":"Moleküle Atom für Atom aufbauen. Atome platzieren, mit Bindungen verknüpfen und Strukturen auf einer interaktiven Zeichenfläche zusammensetzen.","nl":"Bouw moleculen atoom voor atoom. Plaats atomen, verbind ze met bindingen en stel structuren samen op een interactief tekenvlak.","fr":"Construisez des molécules atome par atome. Placez les atomes, reliez-les par des liaisons et assemblez des structures sur un canevas de dessin interactif.","es":"Construya moléculas átomo a átomo. Coloque átomos, conéctelos con enlaces y ensamble estructuras en un lienzo de dibujo interactivo.","pl":"Buduj cząsteczki atom po atomie. Umieszczaj atomy, łącz je wiązaniami i składaj struktury na interaktywnym polu rysunkowym."},"description":{"en":"Build molecules atom by atom. Place atoms, connect them with bonds, and assemble structures on an interactive drawing canvas.","uk":"Створюйте молекули атом за атомом. Розміщуйте атоми, з’єднуйте їх зв’язками та збирайте структури на інтерактивному полотні.","de":"Moleküle Atom für Atom aufbauen. Atome platzieren, mit Bindungen verknüpfen und Strukturen auf einer interaktiven Zeichenfläche zusammensetzen.","nl":"Bouw moleculen atoom voor atoom. Plaats atomen, verbind ze met bindingen en stel structuren samen op een interactief tekenvlak.","fr":"Construisez des molécules atome par atome. Placez les atomes, reliez-les par des liaisons et assemblez des structures sur un canevas de dessin interactif.","es":"Construya moléculas átomo a átomo. Coloque átomos, conéctelos con enlaces y ensamble estructuras en un lienzo de dibujo interactivo.","pl":"Buduj cząsteczki atom po atomie. Umieszczaj atomy, łącz je wiązaniami i składaj struktury na interaktywnym polu rysunkowym."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"Visual connectivity and valence aid only; geometry, charge, stereochemistry, electronic structure, stability, reactivity, toxicity and synthesis feasibility are not validated. The valence check is the standard neutral valence of each element (C 4, H 1, O 2, N 3, S 2/4/6, P 3/5, halogens 1, Na/K 1, Mg/Ca/Zn 2, Al 3, Fe 2/3, Cu 1/2), so charged species such as ammonium or a sulfate ion can never be closed and are reported as having open bonding positions. A closed valence count does not mean the molecule exists. The formula is written carbon first, then hydrogen, then the remaining elements alphabetically, which for carbon-free hydrides departs from strict Hill order in favour of the conventional formula (HCl, not ClH); recognised substances are shown with their conventional formula. Only 18 elements are available, and recognition is limited to the 107 stored structures.","uk":"Лише візуальна допомога зі зв'язністю та валентністю; геометрія, заряд, стереохімія, електронна будова, стабільність, реакційна здатність, токсичність і здійсненність синтезу не перевіряються. Перевірка валентності використовує стандартну нейтральну валентність кожного елемента (C 4, H 1, O 2, N 3, S 2/4/6, P 3/5, галогени 1, Na/K 1, Mg/Ca/Zn 2, Al 3, Fe 2/3, Cu 1/2), тому заряджені частинки, як-от амоній чи сульфат-іон, ніколи не «закриються» і показуються з відкритими позиціями зв'язку. Закриті валентності не означають, що молекула існує. Формула записується: спершу вуглець, потім водень, далі решта за абеткою, що для безвуглецевих гідридів відхиляється від строгого порядку Гілла на користь звичної формули (HCl, а не ClH); для розпізнаних речовин показується звична формула. Доступно лише 18 елементів, а розпізнавання обмежене 107 збереженими структурами.","de":"Nur visuelle Konnektivitäts- und Valenzhilfe; Geometrie, Ladung, Stereochemie, elektronische Struktur, Stabilität, Reaktivität, Toxizität und Synthesetauglichkeit werden nicht geprüft. Die Valenzprüfung verwendet die üblichen neutralen Valenzen (C 4, H 1, O 2, N 3, S 2/4/6, P 3/5, Halogene 1, Na/K 1, Mg/Ca/Zn 2, Al 3, Fe 2/3, Cu 1/2); geladene Teilchen wie Ammonium oder ein Sulfat-Ion lassen sich daher nie schließen und werden mit offenen Bindungsstellen angezeigt. Geschlossene Valenzen bedeuten nicht, dass es das Molekül gibt. Die Formel wird mit Kohlenstoff zuerst, dann Wasserstoff, dann den übrigen Elementen alphabetisch geschrieben, was bei kohlenstofffreien Hydriden zugunsten der üblichen Schreibweise (HCl statt ClH) von der strengen Hill-Reihenfolge abweicht; erkannte Stoffe erscheinen mit ihrer üblichen Formel. Es stehen nur 18 Elemente zur Verfügung, und die Erkennung ist auf die 107 gespeicherten Strukturen begrenzt.","nl":"Alleen een visueel hulpmiddel voor verbindingen en valentie; geometrie, lading, stereochemie, elektronenstructuur, stabiliteit, reactiviteit, toxiciteit en synthetiseerbaarheid worden niet gevalideerd. De valentiecontrole gebruikt de gebruikelijke neutrale valenties (C 4, H 1, O 2, N 3, S 2/4/6, P 3/5, halogenen 1, Na/K 1, Mg/Ca/Zn 2, Al 3, Fe 2/3, Cu 1/2), dus geladen deeltjes zoals ammonium of een sulfaation kunnen nooit gesloten worden en worden met open bindingsplaatsen weergegeven. Gesloten valenties betekenen niet dat het molecuul bestaat. De formule zet koolstof eerst, dan waterstof, dan de overige elementen alfabetisch; voor koolstofvrije hydriden wijkt dat af van strikte Hill-volgorde ten gunste van de conventionele formule (HCl in plaats van ClH). Er zijn slechts 18 elementen beschikbaar en herkenning is beperkt tot de 107 opgeslagen structuren.","fr":"Aide visuelle à la connectivité et à la valence uniquement ; géométrie, charge, stéréochimie, structure électronique, stabilité, réactivité, toxicité et faisabilité de synthèse ne sont pas validées. Le contrôle de valence utilise la valence neutre usuelle de chaque élément (C 4, H 1, O 2, N 3, S 2/4/6, P 3/5, halogènes 1, Na/K 1, Mg/Ca/Zn 2, Al 3, Fe 2/3, Cu 1/2) ; les espèces chargées comme l'ammonium ou l'ion sulfate ne peuvent donc jamais être fermées et sont signalées avec des positions de liaison ouvertes. Des valences fermées ne signifient pas que la molécule existe. La formule s'écrit carbone d'abord, puis hydrogène, puis les autres éléments par ordre alphabétique, ce qui pour les hydrures sans carbone s'écarte de l'ordre de Hill strict au profit de la formule conventionnelle (HCl et non ClH) ; les substances reconnues sont affichées avec leur formule conventionnelle. Seuls 18 éléments sont disponibles et la reconnaissance se limite aux 107 structures enregistrées.","es":"Solo una ayuda visual de conectividad y valencia; geometría, carga, estereoquímica, estructura electrónica, estabilidad, reactividad, toxicidad y viabilidad de síntesis no se validan. La comprobación de valencia usa la valencia neutra habitual de cada elemento (C 4, H 1, O 2, N 3, S 2/4/6, P 3/5, halógenos 1, Na/K 1, Mg/Ca/Zn 2, Al 3, Fe 2/3, Cu 1/2), de modo que especies cargadas como el amonio o el ion sulfato nunca pueden cerrarse y se señalan con posiciones de enlace abiertas. Que las valencias estén cerradas no significa que la molécula exista. La fórmula se escribe con el carbono primero, luego el hidrógeno y después el resto en orden alfabético, lo que para los hidruros sin carbono se aparta del orden de Hill estricto en favor de la fórmula convencional (HCl y no ClH); las sustancias reconocidas se muestran con su fórmula convencional. Solo hay 18 elementos disponibles y el reconocimiento se limita a las 107 estructuras almacenadas.","pl":"Narzędzie służy wyłącznie jako wizualna pomoc do sprawdzania łączności i wartościowości; geometria, ładunek, stereochemia, struktura elektronowa, stabilność, reaktywność, toksyczność ani wykonalność syntezy nie są walidowane. Kontrola używa standardowych neutralnych wartościowości pierwiastków (C 4, H 1, O 2, N 3, S 2/4/6, P 3/5, halogeny 1, Na/K 1, Mg/Ca/Zn 2, Al 3, Fe 2/3, Cu 1/2), dlatego form naładowanych, takich jak jon amonowy lub siarczanowy, nie da się „zamknąć” i są zgłaszane z otwartymi pozycjami wiązań. Zamknięte wartościowości nie oznaczają, że cząsteczka istnieje. Wzór zapisuje węgiel jako pierwszy, następnie wodór, a pozostałe pierwiastki alfabetycznie; dla wodorków bez węgla odstępuje to od ścisłej kolejności Hilla na rzecz wzoru konwencjonalnego (HCl, nie ClH). Rozpoznane substancje są pokazywane ze wzorem konwencjonalnym. Dostępnych jest 18 pierwiastków, a rozpoznawanie ogranicza się do 107 zapisanych struktur."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","ru","pl"],"dependencies":[],"network_access":{"mode":"none"},"validation":{"basis":{"en":"16 cases driven through the page's own canvas and goal list: the valence table against the standard neutral valences of the elements, all 107 stored structures re-derived (valence balance, connectivity, formula) by an independent python implementation and rebuilt on the canvas to check they are recognised again, six known-valid molecules built atom by atom, and seven impossible structures (five-bonded carbon, two-bonded hydrogen, three-bonded oxygen, four-bonded nitrogen, a neutral CO triple bond, two fragments, a bare sulfate ion) that must be refused or flagged. All 16 pass. The harness is the author's own; no external party has reviewed it.","uk":"16 випадків, проведених через власне полотно та список цілей сторінки: таблиця валентностей проти стандартних нейтральних валентностей елементів, усі 107 збережених структур перераховано незалежною реалізацією на python (баланс валентностей, зв'язність, формула) і перебудовано на полотні для перевірки повторного розпізнавання, шість відомих коректних молекул зібрано поатомно, і сім неможливих структур (п'ятивалентний вуглець, двовалентний водень, тривалентний кисень, чотиривалентний азот, нейтральний потрійний зв'язок CO, два фрагменти, голий сульфат-іон) мають бути відхилені або позначені. Усі 16 пройдено. Стенд авторський; жодна стороння особа його не перевіряла.","de":"16 Fälle über die eigene Zeichenfläche und Zielliste der Seite: die Valenztabelle gegen die üblichen neutralen Valenzen der Elemente, alle 107 gespeicherten Strukturen mit einer unabhängigen Python-Implementierung nachgerechnet (Valenzbilanz, Zusammenhang, Formel) und auf der Zeichenfläche neu aufgebaut, sechs bekannte gültige Moleküle Atom für Atom gebaut und sieben unmögliche Strukturen (fünfbindiger Kohlenstoff, zweibindiger Wasserstoff, dreibindiger Sauerstoff, vierbindiger Stickstoff, neutrale CO-Dreifachbindung, zwei Fragmente, nacktes Sulfat-Ion), die abgewiesen oder markiert werden müssen. Alle 16 bestanden. Der Prüfstand stammt vom Autor; niemand von außen hat ihn geprüft.","nl":"16 gevallen via het eigen tekenvlak en de doelenlijst van de pagina: de valentietabel tegen de gebruikelijke neutrale valenties van de elementen, alle 107 opgeslagen structuren herberekend met een onafhankelijke python-implementatie (valentiebalans, samenhang, formule) en opnieuw op het tekenvlak opgebouwd, zes bekende geldige moleculen atoom voor atoom gebouwd, en zeven onmogelijke structuren (vijfbindige koolstof, tweebindige waterstof, driebindige zuurstof, vierbindige stikstof, neutrale CO-drievoudige binding, twee fragmenten, kaal sulfaation) die geweigerd of gemarkeerd moeten worden. Alle 16 geslaagd. De testbank is van de auteur zelf; geen externe partij heeft die beoordeeld.","fr":"16 cas pilotés par le canevas et la liste d'objectifs de la page : la table des valences contre les valences neutres usuelles des éléments, les 107 structures stockées recalculées par une implémentation python indépendante (bilan de valence, connexité, formule) puis reconstruites sur le canevas pour vérifier qu'elles sont reconnues, six molécules valides connues construites atome par atome, et sept structures impossibles (carbone à cinq liaisons, hydrogène à deux, oxygène à trois, azote à quatre, triple liaison CO neutre, deux fragments, ion sulfate nu) qui doivent être refusées ou signalées. Les 16 cas passent. Le banc d'essai est celui de l'auteur ; aucun tiers ne l'a examiné.","es":"16 casos ejecutados con el propio lienzo y la lista de objetivos de la página: la tabla de valencias contra las valencias neutras habituales de los elementos, las 107 estructuras almacenadas recalculadas por una implementación independiente en python (balance de valencia, conexión, fórmula) y reconstruidas en el lienzo para comprobar que se reconocen de nuevo, seis moléculas válidas conocidas construidas átomo a átomo, y siete estructuras imposibles (carbono con cinco enlaces, hidrógeno con dos, oxígeno con tres, nitrógeno con cuatro, triple enlace CO neutro, dos fragmentos, ion sulfato desnudo) que deben rechazarse o señalarse. Los 16 casos pasan. El banco de pruebas es del propio autor; ningún tercero lo ha revisado.","pl":"16 przypadków przeprowadzono przez własne pole robocze i listę celów strony: tabelę wartościowości porównano ze standardowymi neutralnymi wartościowościami pierwiastków; wszystkie 107 zapisanych struktur niezależnie przeliczono w Pythonie (bilans wartościowości, łączność, wzór) i ponownie zbudowano na polu, aby sprawdzić ich rozpoznawanie; sześć znanych poprawnych cząsteczek zbudowano atom po atomie; siedem struktur niemożliwych (pięciowiązaniowy węgiel, dwuwiązanowy wodór, trzywiązaniowy tlen, czterowiązaniowy azot, neutralne potrójne wiązanie CO, dwa fragmenty i sam jon siarczanowy) musi zostać odrzuconych lub oznaczonych. Wszystkie 16 przypadków przechodzi test. Stanowisko testowe jest autorskie; nie było niezależnie recenzowane."},"independent_validation":false,"benchmarks":[{"id":"valence-and-structure-integrity","reference":"Data-integrity and rule-checking benchmark. Standard neutral valences of the elements and CIAAW atomic weights typed into an independent python implementation (/root/bench/tmp/mc_ref.py) which recomputes the Hill formula, the valence balance, the connectivity and the molar mass of every structure; the tool is then driven through its own canvas and goal list and compared.","citations":["Standard common valences: CRC Handbook of Chemistry and Physics, oxidation states/valence of the elements; IUPAC, Nomenclature of Inorganic Chemistry (Red Book, 2005), standard bonding numbers (C 4, N 3, O 2, H 1, halogens 1, S 2/4/6, P 3/5).","Atomic weights for the molar-mass cross-check: CIAAW abridged standard atomic weights (2021 table with the 2024 revisions), https://ciaaw.org/abridged-atomic-weights.htm.","Hill notation: E. A. Hill, J. Am. Chem. Soc. 22(8), 478-494 (1900) — carbon first, then hydrogen, then the remaining elements alphabetically."],"cases":16,"passed":16,"tolerance":"Everything here is exact bookkeeping: formulas, valence balance, connectivity, recognition and the set of refused bonds are compared for exact equality. Molar masses are computed for the record only, because the tool does not display one.","run_at":"2026-10-04T11:43:17.645Z","artifact":"benchmarks/moleculeconstructor.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":true,"requires":[]},"handoff":{"provides":[],"accepts":[]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

const LANG_NAMES= {"en":"English","ru":"Русский","uk":"Українська","de":"Deutsch","es":"Español","nl":"Nederlands","fr":"Français","pl":"Polski"};
/* Language precedence: ?lang= -> localStorage.diagram_lang -> browser -> the shared
   bootstrap's choice -> en.  "ru" is this tool's extra language: honoured from the URL,
   never written into the shared diagram_lang key that the seven-site-language catalogue uses. */
const SITE_LANGS=["en","uk","de","nl","fr","es","pl"];
let   LANG      = (()=>{const S=Object.keys(LANG_NAMES);let l=null;
  try{l=new URLSearchParams(location.search).get("lang")}catch(e){}
  if(l)l=String(l).slice(0,2).toLowerCase();
  if(!S.includes(l)){try{const x=localStorage.getItem("diagram_lang");if(S.includes(x))l=x}catch(e){}}
  if(!S.includes(l)){for(const n of (navigator.languages||[navigator.language||""])){
    const x=String(n).slice(0,2).toLowerCase();if(S.includes(x)){l=x;break}}}
  if(!S.includes(l))l=S.includes(window.__diagramLang)?window.__diagramLang:"en";
  return l})();

/* ===== Element valence helpers (support variable valence) ===== */
const maxVal = el => Math.max.apply(null, VALENCE[el]);
function dotsFor(used, el){
  const allowed = VALENCE[el];
  for(const a of allowed){ if(a>=used) return a-used; }
  return 0;
}
function isSatisfied(used, el){ return VALENCE[el].includes(used); }

/* ===== Formula / Hill ===== */
function hill(cnt){
  const parts=[];
  if(cnt.C) parts.push(['C',cnt.C]);
  if(cnt.H) parts.push(['H',cnt.H]);
  Object.keys(cnt).filter(e=>e!=='C'&&e!=='H').sort().forEach(e=>parts.push([e,cnt[e]]));
  return parts.map(([e,c])=> e+(c>1?c:'')).join('');
}
function subFormula(str){ return str.replace(/(\d+)/g,'<sub>$1</sub>'); }
// Signature of heavy (non-H) atoms, e.g. ['C','C','O'] -> "C2O1"; order-independent.
function elemSig(els){ const c={}; for(const e of els) c[e]=(c[e]||0)+1; return Object.keys(c).sort().map(k=>k+c[k]).join(''); }

/* ===== Precompute DB graphs ===== */
function buildMatrix(nodes, edges){
  const n=nodes.length, A=Array.from({length:n},()=>new Array(n).fill(0));
  for(const [i,j,o] of edges){ A[i][j]=o; A[j][i]=o; }
  return A;
}
function makeGraphObj(nodes, A){
  const n=nodes.length;
  const labels=nodes.map(([el,h])=>el+':'+h);
  const labelFreq={}; labels.forEach(l=>labelFreq[l]=(labelFreq[l]||0)+1);
  const edgeSig=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++) if(A[i][j]){
    const p=[labels[i],labels[j]].sort(); edgeSig.push(p[0]+'|'+p[1]+'|'+A[i][j]);
  }
  return {n,labels,labelFreq,A,edgeSig};
}
for(const m of SUBS){
  m.A=buildMatrix(m.nodes,m.edges);
  m._g=makeGraphObj(m.nodes,m.A);
  const cnt={}; for(const [el,h] of m.nodes){cnt[el]=(cnt[el]||0)+1; if(h)cnt.H=(cnt.H||0)+h;}
  m.formula=hill(cnt);
  if(!m.formula && m.df) m.formula=m.df;   // elemental hydrogen (no heavy atoms)
  m.ccount=m.nodes.filter(x=>x[0]==='C').length;
  m.heavySig=elemSig(m.nodes.map(x=>x[0]));   // set of heavy atoms (H ignored)
}

/* ===== Graph isomorphism (labels + bond orders) ===== */
function sameMultiset(a,b){
  if(a.length!==b.length) return false;
  const m={}; a.forEach(x=>m[x]=(m[x]||0)+1);
  for(const x of b){ if(!m[x]) return false; m[x]--; }
  return true;
}
function graphsIsomorphic(g,t){
  const n=g.n; if(n!==t.n) return false;
  if(!sameMultiset(g.labels,t.labels)) return false;
  if(!sameMultiset(g.edgeSig,t.edgeSig)) return false;
  const usedT=new Array(n).fill(false), mapGT=new Array(n).fill(-1);
  const orderG=[...Array(n).keys()].sort((a,b)=>g.labelFreq[g.labels[a]]-g.labelFreq[g.labels[b]]);
  function bt(pos){
    if(pos===n) return true;
    const gi=orderG[pos];
    for(let tj=0;tj<n;tj++){
      if(usedT[tj]||g.labels[gi]!==t.labels[tj]) continue;
      let ok=true;
      for(let p=0;p<pos;p++){ const gk=orderG[p], tk=mapGT[gk]; if(g.A[gi][gk]!==t.A[tj][tk]){ok=false;break;} }
      if(!ok) continue;
      mapGT[gi]=tj; usedT[tj]=true;
      if(bt(pos+1)) return true;
      mapGT[gi]=-1; usedT[tj]=false;
    }
    return false;
  }
  return bt(0);
}

/* ===== Analyze current drawing ===== */
function analyze(atoms, bonds){
  const res={formula:'',freeTotal:0,allClosed:true,connected:true,match:null,heavyCount:0};
  if(atoms.length===0) return res;
  const used={}; atoms.forEach(a=>used[a.id]=0);
  for(const b of bonds){ used[b.a]+=b.order; used[b.b]+=b.order; }
  let free=0, allSat=true;
  for(const a of atoms){ const d=dotsFor(used[a.id],a.el); free+=d; if(!isSatisfied(used[a.id],a.el)) allSat=false; }
  res.freeTotal=free; res.allClosed=allSat;
  const cnt={}; atoms.forEach(a=>cnt[a.el]=(cnt[a.el]||0)+1); res.formula=hill(cnt);
  res.connected=isConnected(atoms,bonds);
  if(!res.allClosed || !res.connected) return res;

  const heavy=atoms.filter(a=>a.el!=='H'); res.heavyCount=heavy.length;
  if(heavy.length===0){ // pure-hydrogen molecule, e.g. H2
    if(res.formula==='H2'){ const m=SUBS.find(s=>s.id==='hydrogen'); if(m) res.match=m; }
    return res;
  }
  const idx=new Map(heavy.map((a,i)=>[a.id,i]));
  const nodes=heavy.map(a=>[a.el,0]);
  const A=Array.from({length:heavy.length},()=>new Array(heavy.length).fill(0));
  const byId=new Map(atoms.map(a=>[a.id,a]));
  for(const b of bonds){
    const a1=byId.get(b.a), a2=byId.get(b.b);
    if(a1.el==='H'&&a2.el==='H') continue;
    if(a1.el==='H'||a2.el==='H'){ const hv=a1.el==='H'?b.b:b.a; nodes[idx.get(hv)][1]+=1; }
    else { const i=idx.get(b.a), j=idx.get(b.b); A[i][j]=b.order; A[j][i]=b.order; }
  }
  const g=makeGraphObj(nodes,A);
  for(const m of SUBS){
    if(m.formula!==res.formula || m.nodes.length!==heavy.length) continue;
    if(graphsIsomorphic(g,m._g)){ res.match=m; break; }
  }
  return res;
}
function isConnected(atoms,bonds){
  if(atoms.length<=1) return true;
  const adj=new Map(atoms.map(a=>[a.id,[]]));
  for(const b of bonds){ adj.get(b.a).push(b.b); adj.get(b.b).push(b.a); }
  const seen=new Set([atoms[0].id]), st=[atoms[0].id];
  while(st.length){ const x=st.pop(); for(const y of adj.get(x)) if(!seen.has(y)){seen.add(y);st.push(y);} }
  return seen.size===atoms.length;
}

const state={atoms:[],bonds:[],nextId:1,mode:'simple',armed:'C',tool:'build'};

   owns the stage that hosts it (and rebuilds that stage on a language change). */

svg.id='svg'; svg.setAttribute('xmlns',SVG_NS);

let ui=null;            // the DiagramUI app, null until boot (and null if diagram-ui.js is missing)
let mcStage=null;       // its stage
const els={};           // palette / card / goals hosts, filled by whichever shell mounts
const byId=id=>state.atoms.find(a=>a.id===id);
function usedOf(id){ let u=0; for(const b of state.bonds) if(b.a===id||b.b===id) u+=b.order; return u; }
function canBond(id){ const a=byId(id); return usedOf(id)<maxVal(a.el); }
function bondBetween(a,b){ return state.bonds.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a)); }
function T(k){ return (I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k; }

/* ---- Force-directed canonical layout ---- */
const LC=50, LH=34, SPRING=0.09, REP=2400, STEP=0.55, CENTER=0.006;
const QCHARGE=el=>el==='H'?0.32:1;   // hydrogens repel less -> sit close, canonical look
let simAlpha=0, simRAF=null;
function kick(energy){ simAlpha=Math.max(simAlpha,energy||1); if(!simRAF) simRAF=requestAnimationFrame(simStep); }
function simStep(){
  for(let s=0;s<3;s++) physics();
  simAlpha*=0.93;
  render();
  if(simAlpha>0.02) simRAF=requestAnimationFrame(simStep);
  else { simRAF=null; render(); }
}
function physics(){
  const A=state.atoms, n=A.length; if(n===0) return;
  const r=svg.getBoundingClientRect(); const cx=r.width/2, cy=r.height/2;
  const fx={}, fy={}; A.forEach(a=>{fx[a.id]=0;fy[a.id]=0;});
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    const a=A[i], b=A[j];
    let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy; if(d2<1)d2=1;
    const d=Math.sqrt(d2), rep=REP*QCHARGE(a.el)*QCHARGE(b.el)/d2, ux=dx/d, uy=dy/d;
    fx[a.id]+=ux*rep; fy[a.id]+=uy*rep; fx[b.id]-=ux*rep; fy[b.id]-=uy*rep;
  }
  for(const bnd of state.bonds){
    const a=byId(bnd.a), b=byId(bnd.b);
    const rest=(a.el==='H'||b.el==='H')?LH:LC;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01;
    const f=SPRING*(d-rest), ux=dx/d, uy=dy/d;
    fx[a.id]+=ux*f; fy[a.id]+=uy*f; fx[b.id]-=ux*f; fy[b.id]-=uy*f;
  }
  const lo=R+4, hix=Math.max(lo,r.width-R-4), hiy=Math.max(lo,r.height-R-4);
  for(const a of A){
    fx[a.id]+=(cx-a.x)*CENTER; fy[a.id]+=(cy-a.y)*CENTER;
    if(a.id===dragFrom) continue;
    a.x+=Math.max(-12,Math.min(12,fx[a.id]*STEP));
    a.y+=Math.max(-12,Math.min(12,fy[a.id]*STEP));
    /* the stage clips: an atom outside the box would be unreachable, and on a
       phone-sized stage the relaxation does push atoms out. Positions are
       presentation only — they are in no record, export or permalink. */
    if(r.width){ a.x=Math.max(lo,Math.min(hix,a.x)); a.y=Math.max(lo,Math.min(hiy,a.y)); }
  }
}

/* ---- Render ---- */
let hoverTgt=null;
function render(){
  gBonds.innerHTML=''; gAtoms.innerHTML='';
  const map=new Map(state.atoms.map(a=>[a.id,a]));
  state.bonds.forEach((b,bi)=>{
    const A=map.get(b.a), B=map.get(b.b);
    const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;
    const offs=b.order===1?[0]:b.order===2?[-4,4]:[-6,0,6];
    for(const o of offs){
      const l=document.createElementNS(SVG_NS,'line');
      l.setAttribute('x1',A.x+nx*o); l.setAttribute('y1',A.y+ny*o);
      l.setAttribute('x2',B.x+nx*o); l.setAttribute('y2',B.y+ny*o);
      l.setAttribute('class','bondLine');
      gBonds.appendChild(l);
    }
    const hit=document.createElementNS(SVG_NS,'line');
    hit.setAttribute('x1',A.x);hit.setAttribute('y1',A.y);hit.setAttribute('x2',B.x);hit.setAttribute('y2',B.y);
    hit.setAttribute('class','bondHit');
    hit.addEventListener('click',e=>{e.stopPropagation(); if(state.tool==='erase') delBond(bi); else incBond(bi);});
    hit.addEventListener('dblclick',e=>{e.stopPropagation();delBond(bi);});
    hit.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();delBond(bi);});
    gBonds.appendChild(hit);
  });
  for(const a of state.atoms){
    const used=usedOf(a.id), dots=dotsFor(used,a.el);
    const g=document.createElementNS(SVG_NS,'g');
    g.setAttribute('class','atomG'+(hoverTgt===a.id?' hoverTgt':''));
    g.setAttribute('transform',`translate(${a.x},${a.y})`);
    g.dataset.atom=a.id;
    for(let k=0;k<dots;k++){
      const ang=-Math.PI/2 + k*(2*Math.PI/Math.max(dots,1));
      const d=document.createElementNS(SVG_NS,'circle');
      d.setAttribute('cx',Math.cos(ang)*(R+9)); d.setAttribute('cy',Math.sin(ang)*(R+9));
      d.setAttribute('r','3.6'); d.setAttribute('class','socket'); d.setAttribute('fill',SOCKET_FILL); g.appendChild(d);
    }
    if(dots===0 && used<maxVal(a.el)){ // satisfied but can still extend (variable valence)
      const ring=document.createElementNS(SVG_NS,'circle');
      ring.setAttribute('r',R+7); ring.setAttribute('class','socketRing'); g.appendChild(ring);
    }
    const c=document.createElementNS(SVG_NS,'circle');
    c.setAttribute('class','body'); c.setAttribute('r',R); c.setAttribute('fill',COLORS[a.el]);
    c.setAttribute('stroke', a.el==='H'?'#b9c4d0':'rgba(0,0,0,.15)'); c.setAttribute('stroke-width', a.el==='H'?'2':'1');
    g.appendChild(c);
    const t=document.createElementNS(SVG_NS,'text');
    t.setAttribute('text-anchor','middle'); t.setAttribute('dy','5.5');
    t.setAttribute('font-size', a.el.length>1?'14':'17'); t.setAttribute('font-weight','800');
    t.setAttribute('fill',TEXTCOL[a.el]); t.textContent=a.el; g.appendChild(t);
    g.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();deleteAtom(a.id);});
    gAtoms.appendChild(g);
  }
}

/* ---- Actions ---- */
/* UI_AUDIT.md S-11: a direct-manipulation stage must have undo. Every action that
   changes the drawing snapshots it first; the framework's History does the rest. */
function hpush(){ if(ui&&ui.history) ui.history.push(); }
function addAtom(x,y,el){ hpush(); const id=state.nextId++; state.atoms.push({id,el,x,y}); update(); kick(0.5); return id; }
function addAtomBonded(fromId,x,y,el){
  hpush();
  const id=state.nextId++; state.atoms.push({id,el,x,y}); state.bonds.push({a:fromId,b:id,order:1}); update(); kick(1);
}
function tryBond(aId,bId){
  if(aId===bId) return;
  const ex=bondBetween(aId,bId);
  if(ex){
    if(ex.order>=3){ toast(T('toastMaxBond')); return; }
    if(!canBond(aId)||!canBond(bId)){ toast(T('toastCantIncrease')); return; }
    hpush(); ex.order++; update(); kick(0.6);
  } else {
    if(!canBond(aId)){ toast(T('toastNoFree').replace('{el}',byId(aId).el)); return; }
    if(!canBond(bId)){ toast(T('toastNoFree').replace('{el}',byId(bId).el)); return; }
    hpush(); state.bonds.push({a:aId,b:bId,order:1}); update(); kick(0.8);
  }
}
function incBond(bi){
  const b=state.bonds[bi]; if(!b) return;
  if(b.order<3){
    if(canBond(b.a)&&canBond(b.b)){ hpush(); b.order++; } else { toast(T('toastCantIncrease')); return; }
  } else { hpush(); b.order=1; }
  update(); kick(0.4);
}
function delBond(bi){ hpush(); state.bonds.splice(bi,1); update(); kick(0.6); }
function deleteAtom(id){
  hpush();
  state.atoms=state.atoms.filter(a=>a.id!==id);
  state.bonds=state.bonds.filter(b=>b.a!==id&&b.b!==id);
  update(); kick(0.6);
}
function autoH(){
  const add=[];
  for(const a of state.atoms){
    if(a.el==='H') continue;
    const dots=dotsFor(usedOf(a.id),a.el);
    for(let k=0;k<dots;k++){
      const ang=Math.random()*2*Math.PI;
      add.push({p:a.id,x:a.x+Math.cos(ang)*40,y:a.y+Math.sin(ang)*40});
    }
  }
  if(!add.length){ toast(T('toastAllClosed')); return; }
  hpush();
  for(const h of add){ const id=state.nextId++; state.atoms.push({id,el:'H',x:h.x,y:h.y}); state.bonds.push({a:h.p,b:id,order:1}); }
  update(); kick(1);
}
/* Fit: centre the drawing in the stage, shrinking it if it has outgrown the box.
   Only atom coordinates move, and those are drawn, never stored. */
function fitDrawing(){
  const r=svg.getBoundingClientRect();
  if(!state.atoms.length||!r.width) return;
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(const a of state.atoms){ minx=Math.min(minx,a.x);maxx=Math.max(maxx,a.x);miny=Math.min(miny,a.y);maxy=Math.max(maxy,a.y); }
  const pad=R+8, bw=Math.max(maxx-minx,1), bh=Math.max(maxy-miny,1);
  const sc=Math.min(1,(r.width-2*pad)/bw,(r.height-2*pad)/bh);
  const cx=r.width/2, cy=r.height/2, mx=(minx+maxx)/2, my=(miny+maxy)/2;
  for(const a of state.atoms){ a.x=cx+(a.x-mx)*sc; a.y=cy+(a.y-my)*sc; }
  render();
}
function clearAll(){ hpush(); state.atoms=[]; state.bonds=[]; if(simRAF){cancelAnimationFrame(simRAF);simRAF=null;} update(); }

/* ---- Build a whole substance from the DB (click-to-build) ---- */
function buildSubstance(m){
  hpush();
  state.atoms=[]; state.bonds=[];
  const r=svg.getBoundingClientRect(), host=svg.parentElement; const sw=r.width||host?.clientWidth||760, sh=r.height||host?.clientHeight||460, cx=sw/2, cy=sh/2;
  const refit=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>fitDrawing()));
  if(m.nodes.length===0){ // elemental hydrogen H2
    const h1=state.nextId++, h2=state.nextId++;
    state.atoms.push({id:h1,el:'H',x:cx-25,y:cy},{id:h2,el:'H',x:cx+25,y:cy});
    state.bonds.push({a:h1,b:h2,order:1}); update(); kick(1); refit(); return;
  }
  const heavyIds=[]; const nH=m.nodes.length;
  m.nodes.forEach(([el,h],i)=>{
    const ang=-Math.PI/2 + i*2*Math.PI/Math.max(nH,1);
    const x=cx+Math.cos(ang)*(nH>1?55:0), y=cy+Math.sin(ang)*(nH>1?55:0);
    const id=state.nextId++; state.atoms.push({id,el,x,y}); heavyIds.push(id);
    for(let k=0;k<h;k++){
      const ha=ang + (k-(h-1)/2)*0.6;
      const hx=x+Math.cos(ha)*36, hy=y+Math.sin(ha)*36;
      const hid=state.nextId++; state.atoms.push({id:hid,el:'H',x:hx,y:hy}); state.bonds.push({a:id,b:hid,order:1});
    }
  });
  for(const [i,j,o] of m.edges) state.bonds.push({a:heavyIds[i],b:heavyIds[j],order:o});
  update(); kick(1.4); refit();
}

/* ============================================================
   UI: palette, card, goals  (the shell around them is diagram-ui.js)
   ============================================================ */
function renderPalette(){
  const pal=els.palette; if(!pal) return;
  pal.innerHTML='';
  for(const grp of PAL_CATS[state.mode]){
    const lab=document.createElement('div'); lab.className='catLabel'; lab.textContent=T('cat_'+grp.cat); pal.appendChild(lab);
    const row=document.createElement('div'); row.className='atomRow';
    for(const el of grp.els){
      const btn=document.createElement('button');
      btn.type='button'; btn.className='atomBtn'; btn.dataset.el=el;
      btn.setAttribute('aria-pressed',String(state.armed===el));
      btn.setAttribute('aria-label',el+' — '+VALENCE[el].join('/'));
      btn.innerHTML=`<span class="ball" style="background:${COLORS[el]};color:${TEXTCOL[el]}">${el}</span><small>${VALENCE[el].join('/')}</small>`;
      btn.onclick=()=>{ state.armed=el; renderPalette(); };
      row.appendChild(btn);
    }
    pal.appendChild(row);
  }
}

let lastMatchId=null;
/* update() repaints the drawing and asks for a fresh answer; paint() is the answer.
   With the framework, paint() runs inside on.compute and returns the results object;
   without it (diagram-ui.js blocked) paint() writes the same strings into the
   fallback shell.  The analysis itself is untouched. */
function update(){
  render();
  if(ui) ui.run(); else paint();
}
function paint(){
  const res=analyze(state.atoms,state.bonds);
  let tone='mut', msg=T('msgStart');
  if(state.atoms.length===0){ showPlaceholder(false); lastMatchId=null; }
  else if(!res.allClosed){ tone='warn'; msg=T('msgFree').replace('{n}',res.freeTotal); showPlaceholder(false); lastMatchId=null; }
  else if(!res.connected){ tone='warn'; msg=T('msgSeveral'); showPlaceholder(false); lastMatchId=null; }
  else if(res.match){ tone='ok'; msg=T('msgRecognized'); showCard(res.match,res.match.id!==lastMatchId); lastMatchId=res.match.id; }
  else { tone='bad'; msg=T('msgNotInBase').replace('{f}',res.formula); showPlaceholder(true); lastMatchId=null; }
  const shown=state.atoms.length? subFormula(res.match?(res.match.df||res.match.formula):res.formula) : '—';
  if(els.formula) els.formula.innerHTML=shown;
  renderGoals();
  if(els.msg){ els.msg.className='msg '+tone; els.msg.textContent=state.atoms.length?msg:T('msgStart'); }
  if(!ui) return null;
  if(!state.atoms.length) return null;          // nothing built: the framework shows learn.intro, record() stays null
  const yn=v=>X(v?'yes':'no');
  return {
    verdict:{tone:tone==='mut'?null:tone, text:msg},
    tiles:[
      {label:X('tileFormula'), value:res.match?(res.match.df||res.match.formula):res.formula},
      {label:X('tileOpen'),    value:res.freeTotal, precision:0, tone:res.freeTotal?'warn':'ok'},
      {label:X('tileClosed'),  value:yn(res.allClosed), tone:res.allClosed?'ok':'warn', learn:'valence'},
      {label:X('tileOne'),     value:yn(res.connected), tone:res.connected?'ok':'warn'},
      {label:T('palAtoms'),    value:state.atoms.length, precision:0, headline:false},
      {label:X('tileBonds'),   value:state.bonds.length, precision:0, headline:false}
    ]
  };
}
function trOf(m){ return m.tr[LANG]||m.tr.en; }
function showPlaceholder(unknown){
  if(!els.card) return;
  els.card.innerHTML='<div class="placeholder">'+(unknown?T('cardPlaceholderUnknown'):T('cardPlaceholder'))+'</div>';
}
function showCard(m,animate){
  if(!els.card) return;
  const t=trOf(m);
  const tags=t.cls.map(c=>`<span class="tag">${c}</span>`).join('');
  const labels=[T('descClass'),T('descProps'),T('descUse')];
  const rows=t.d.map((v,i)=>`<div class="row"><b>${labels[i]}</b>${v}</div>`).join('');
  els.card.innerHTML=`<div class="${animate?'celebrate':''}">
    <div class="name">${t.name}</div>
    <div class="iupac">${t.iupac} · ${subFormula(m.df||m.formula)}</div>
    <div>${tags}</div>${rows}</div>`;
}
function renderGoals(){
  const box=els.goals; if(!box) return;
  const modeList=SUBS.filter(m=> state.mode==='adv'? true : m.level==='s');
  let list;
  if(state.atoms.length===0) list=modeList;                       // empty field -> whole list
  else {                                                          // else: match the exact set of heavy atoms on the field
    const sig=elemSig(state.atoms.filter(a=>a.el!=='H').map(a=>a.el));
    list=modeList.filter(m=>m.heavySig===sig);
  }
  if(!list.length){ box.innerHTML='<div class="goalsEmpty">'+T('goalsEmpty')+'</div>'; return; }
  box.innerHTML=list.map(m=>{
    const done=m.id===lastMatchId;
    return `<button type="button" class="goal ${done?'done':''}" data-sub="${m.id}"><span>${done?'✓ ':''}${trOf(m).name}</span><span class="f">${subFormula(m.df||m.formula)}</span></button>`;
  }).join('');
  [...box.querySelectorAll('.goal')].forEach(g=>g.onclick=()=>{ const m=SUBS.find(s=>s.id===g.dataset.sub); if(m) buildSubstance(m); });
}

/* ============================================================
   Mouse interaction: click to place, drag from atom to bond
   ============================================================ */
let dragFrom=null, dragMoved=false, bgDown=null, startPt=null;
function pt(e){ const r=svg.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function atomAt(p){
  let best=null,bd=1e9;
  for(const a of state.atoms){ const d=Math.hypot(a.x-p.x,a.y-p.y); if(d<R+8&&d<bd){bd=d;best=a;} }
  return best;
}
svg.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-atom]'); const p=pt(e); startPt=p;
  if(state.tool==='erase'){ if(g){ deleteAtom(+g.dataset.atom); } return; } // bonds handled by their own click
  if(g){ dragFrom=+g.dataset.atom; dragMoved=false; }
  else if(!e.target.closest('.bondHit')){ bgDown=p; }
});
svg.addEventListener('pointermove',e=>{
  const p=pt(e);
  if(dragFrom!=null){
    if(!dragMoved && Math.hypot(p.x-startPt.x,p.y-startPt.y)>4) dragMoved=true;
    if(dragMoved){
      const from=byId(dragFrom);
      gGhost.innerHTML='';
      const l=document.createElementNS(SVG_NS,'line');
      l.setAttribute('x1',from.x);l.setAttribute('y1',from.y);l.setAttribute('x2',p.x);l.setAttribute('y2',p.y);
      l.setAttribute('class','ghost'); gGhost.appendChild(l);
      const tgt=atomAt(p); hoverTgt=(tgt&&tgt.id!==dragFrom)?tgt.id:null; render();
    }
  }
});
window.addEventListener('pointerup',e=>{
  const p=pt(e);
  if(dragFrom!=null){
    gGhost.innerHTML=''; hoverTgt=null;
    if(dragMoved){
      if(!canBond(dragFrom)){ toast(T('toastNoFree').replace('{el}',byId(dragFrom).el)); }
      else {
        const tgt=atomAt(p);
        if(tgt && tgt.id!==dragFrom) tryBond(dragFrom,tgt.id);
        else addAtomBonded(dragFrom,p.x,p.y,state.armed);
      }
    }
    dragFrom=null; dragMoved=false; render();
  } else if(bgDown){
    if(Math.hypot(p.x-bgDown.x,p.y-bgDown.y)<4) addAtom(bgDown.x,bgDown.y,state.armed);
    bgDown=null;
  }
});
gAtoms.addEventListener('dblclick',e=>{ const g=e.target.closest('[data-atom]'); if(g){e.stopPropagation(); deleteAtom(+g.dataset.atom);} });

/* ---- Controls ---- */
/* The toolbar, the language switcher, the Simple|Advanced pill row and the toast
   stack all belonged to the tool and now belong to the framework: the actions live
   in the inputs panel, the palette mode and the build/erase mode are fields, and
   messages go through Diagram.notify, which is the site's one toast stack. */
function setTool(v){
  state.tool = v==='erase'?'erase':'build';
  svg.classList.toggle('eraseMode', state.tool==='erase');
  toast(T(state.tool==='erase'?'toastEraseOn':'toastEraseOff'));
}
function setMode(v){
  state.mode = v==='adv'?'adv':'simple';
  const allEls=PAL_CATS[state.mode].flatMap(g=>g.els);
  if(!allEls.includes(state.armed)) state.armed='C';
  renderPalette();
}
svg.addEventListener('contextmenu',e=>e.preventDefault()); // custom right-click deletion above

function toast(txt){
  if(ui) ui.notify(txt,{kind:'ok'});
  else if(window.Diagram&&window.Diagram.notify) window.Diagram.notify(txt,'ok');
}

/* ---- Test hook ---- */
window.CHEM={ SUBS, analyze, VALENCE,
  recognizeHeavy(nodes,edges){
    const atoms=[],bonds=[]; let id=1; const hv=[];
    nodes.forEach(([el,h])=>{ const i=id++; atoms.push({id:i,el,x:0,y:0}); hv.push(i);
      for(let k=0;k<h;k++){ const j=id++; atoms.push({id:j,el:'H',x:0,y:0}); bonds.push({a:i,b:j,order:1}); } });
    edges.forEach(([i,j,o])=>bonds.push({a:hv[i],b:hv[j],order:o}));
    const r=analyze(atoms,bonds);
    return r.match? r.match.tr.en.name : (r.allClosed&&r.connected? '(not in base: '+r.formula+')':'(not closed)');
  },
  setLang(l){ applyToolLang(l); }
};


/* =================== framework v2 (diagram-common.js) =================== */
/* The permalink carries the chemistry, not the drawing: atom positions are the output of a
   force relaxation that keeps nudging them, so storing them would make the same molecule
   serialise differently every second.  A restored structure is laid out on a circle and the
   relaxer settles it, exactly as the goal list does. */
function dgcSerialize(){
  return {v:1,lang:LANG,mode:state.mode,
    atoms:state.atoms.map(a=>a.el),
    bonds:state.bonds.map(b=>[state.atoms.findIndex(a=>a.id===b.a),state.atoms.findIndex(a=>a.id===b.b),b.order])};
}
function dgcDeserialize(st){
  if(!st||typeof st!=='object'||!Array.isArray(st.atoms)||!Array.isArray(st.bonds))
    throw new Error(RT('errPayload'));
  const unknown=st.atoms.filter(el=>!VALENCE[el]);
  if(unknown.length)throw new Error(RT('errUnknown',{x:[...new Set(unknown)].join(', ')}));
  if(st.bonds.some(b=>!(b[0]>=0&&b[0]<st.atoms.length&&b[1]>=0&&b[1]<st.atoms.length)))
    throw new Error(RT('errBond'));
  if(LANG_NAMES[st.lang]&&st.lang!==LANG)applyToolLang(st.lang);
  if(st.mode==='adv'||st.mode==='simple'){ setMode(st.mode); if(ui)ui.sync(); }
  state.atoms=[];state.bonds=[];state.nextId=1;
  const r=svg.getBoundingClientRect(),cx=(r.width||760)/2,cy=(r.height||460)/2,n=st.atoms.length;
  const ids=st.atoms.map((el,i)=>{const a=-Math.PI/2+i*2*Math.PI/Math.max(n,1);
    const id=state.nextId++;
    state.atoms.push({id,el,x:cx+Math.cos(a)*(n>1?70:0),y:cy+Math.sin(a)*(n>1?70:0)});return id});
  for(const [i,j,o] of st.bonds)state.bonds.push({a:ids[i],b:ids[j],order:Math.max(1,Math.min(3,+o||1))});
  update();kick(1);
}
function dgcAnalysis(){return analyze(state.atoms,state.bonds)}

function dgcRecord(){
  if(!state.atoms.length)return null;
  const r=dgcAnalysis(),m=r.match?trOf(r.match):null;
  const cnt={};state.atoms.forEach(a=>cnt[a.el]=(cnt[a.el]||0)+1);
  const status=!r.allClosed?RT('statusOpen',{n:r.freeTotal})
    :!r.connected?RT('statusFragments')
    :r.match?RT('statusRecognized',{name:m.name}):RT('statusUnknown');
  const inputs={atoms:state.atoms.length,bonds:state.bonds.length,
    heavy_atoms:state.atoms.filter(a=>a.el!=='H').length,
    palette:state.mode==='adv'?RT('paletteAdv'):RT('paletteSimple'),
    composition:Object.keys(cnt).sort().map(e=>e+' '+cnt[e]).join(', ')};
  // Only the four quantities the page really computes are outputs; the substance lookup is
  // a database hit, reported in the notes and in the PDF section instead, so that the
  // exported python script can recompute every output it is asked to verify.
  const outputs={formula:r.match?(r.match.df||r.match.formula):r.formula,
    all_valences_closed:r.allClosed,single_connected_molecule:r.connected,
    open_valences:r.freeTotal};
  const units={formula:'',all_valences_closed:'',single_connected_molecule:'',open_valences:RT('bondUnit')};
  const bondList=state.bonds.map(b=>{
    const A=state.atoms.find(a=>a.id===b.a),B=state.atoms.find(a=>a.id===b.b);
    return A.el+(b.order===1?'-':b.order===2?'=':'#')+B.el});
  const warn=[];
  if(!r.allClosed)warn.push(RT('warnOpen',{n:r.freeTotal}));
  if(!r.connected)warn.push(RT('warnFragments'));
  if(r.allClosed&&r.connected&&!r.match)warn.push(RT('warnUnknown'));
  return {inputs,outputs,units,
    model:{equations:[
      RT('eqValence'),
      RT('eqConnectivity'),
      RT('eqFormula'),
      RT('eqRecognition')],
     ranges:[
      RT('rangeNeutral'),
      RT('rangeGeometry'),
      RT('rangeElements')],
     notes:[RT('noteStatus',{status}),
      r.match?(RT('noteRecognized',{name:m.name})+(m.iupac?' (IUPAC: '+m.iupac+')':'')+
        ((m.cls&&m.cls.length)?' — '+m.cls.join(', '):'')):RT('noteNoMatch'),
      RT('noteBondList',{list:(bondList.join(', ')||RT('none'))})]},
    warnings:warn};
}
function dgcSections(){
  if(!state.atoms.length)return [];
  const rows=state.atoms.map((a,i)=>{
    const used=state.bonds.reduce((s,b)=>s+((b.a===a.id||b.b===a.id)?b.order:0),0);
    return [String(i+1),a.el,String(used),VALENCE[a.el].join(' / '),isSatisfied(used,a.el)?RT('satisfied'):RT('open')];
  });
  const out=[{title:RT('sectionAtoms'),cols:'0.5fr 0.7fr 1fr 1fr 1fr',
    head:['#',RT('element'),RT('bondsUsed'),RT('allowed'),RT('state')],rows}];
  const r=dgcAnalysis();
  if(r.match){const m=trOf(r.match);
    out.push({title:RT('sectionSubstance'),cols:'1fr 3fr',head:[RT('field'),RT('value')],
      rows:[[RT('name'),m.name],['IUPAC',m.iupac||'—'],[RT('classes'),(m.cls||[]).join(', ')],
            [RT('formula'),(r.match.df||r.match.formula)]].concat((m.d||[]).map((v,i)=>[[RT('class'),RT('properties'),RT('uses')][i]||RT('note'),v]))});

function dgcPython(){
  const r=dgcAnalysis();
  if(!state.atoms.length)return null;
  const atoms=state.atoms.map(a=>a.el);
  const idx=new Map(state.atoms.map((a,i)=>[a.id,i]));
  const bonds=state.bonds.map(b=>[idx.get(b.a),idx.get(b.b),b.order]);
  const displayed={formula:r.match?(r.match.df||r.match.formula):r.formula,
    all_valences_closed:r.allClosed,single_connected_molecule:r.connected,open_valences:r.freeTotal};
  return {code:MC_PY_SRC({ATOMS:atoms,BONDS:bonds,VAL:VALENCE,DISP:displayed,
      MATCH:r.match?(r.match.df||r.match.formula):null}),
    requires:[],
    scope:RT('pythonScope'),
    selftest:{tolerance:0,note:RT('pythonSelftest')}};
}
function MC_PY_SRC(D){
 const J=JSON.stringify(JSON.stringify({atoms:D.ATOMS,bonds:D.BONDS,valence:D.VAL,displayed:D.DISP,match:D.MATCH},null,1));
 return `import json

_M = json.loads(${J})

ATOMS     = _M["atoms"]      # element of every atom on the canvas, hydrogens included
BONDS     = _M["bonds"]      # [i, j, bond order]
VALENCE   = _M["valence"]    # allowed total bond order per element
DISPLAYED = _M["displayed"]  # what the page showed at export time
MATCHED   = _M["match"]      # conventional formula of the recognised substance, if any

# Atomic weights: CIAAW abridged standard atomic weights (2021 table, 2024 revisions).
MASS = {"H": 1.0080, "C": 12.011, "N": 14.007, "O": 15.999, "F": 18.998, "P": 30.974,
        "S": 32.06, "Cl": 35.45, "Br": 79.904, "I": 126.90, "Na": 22.990, "K": 39.098,
        "Mg": 24.305, "Ca": 40.078, "Al": 26.982, "Fe": 55.845, "Cu": 63.546, "Zn": 65.38}


def bond_order_sum():
    """Total bond order at every atom."""
    used = [0] * len(ATOMS)
    for i, j, o in BONDS:
        used[i] += o
        used[j] += o
    return used


def valence_state():
    """Which atoms are outside their valence, and how many positions are still open."""
    used = bond_order_sum()
    open_positions = 0
    unsatisfied = []
    for k, el in enumerate(ATOMS):
        allowed = VALENCE[el]
        if used[k] not in allowed:
            unsatisfied.append([k, el, used[k]])
        nxt = [a for a in allowed if a >= used[k]]
        open_positions += (min(nxt) - used[k]) if nxt else 0
    return unsatisfied, open_positions


def connected():
    """A molecule is one connected graph."""
    if len(ATOMS) <= 1:
        return True
    adj = {k: [] for k in range(len(ATOMS))}
    for i, j, o in BONDS:
        adj[i].append(j)
        adj[j].append(i)
    seen, stack = {0}, [0]
    while stack:
        x = stack.pop()
        for y in adj[x]:
            if y not in seen:
                seen.add(y)
                stack.append(y)
    return len(seen) == len(ATOMS)


def formula():
    """Carbon first, then hydrogen, then the rest alphabetically."""
    counts = {}
    for el in ATOMS:
        counts[el] = counts.get(el, 0) + 1
    order = ([("C", counts["C"])] if counts.get("C") else []) + \
            ([("H", counts["H"])] if counts.get("H") else []) + \
            [(e, counts[e]) for e in sorted(k for k in counts if k not in ("C", "H"))]
    return "".join(e + (str(c) if c > 1 else "") for e, c in order)


def molar_mass():
    """Not shown by the page; computed here from the CIAAW atomic weights."""
    return sum(MASS[el] for el in ATOMS)


def compute():
    unsatisfied, open_positions = valence_state()
    return {"formula": MATCHED if MATCHED else formula(),
            "all_valences_closed": not unsatisfied,
            "single_connected_molecule": connected(),
            "open_valences": open_positions,
            "molar_mass_g_per_mol": round(molar_mass(), 4),
            "unsatisfied_atoms": unsatisfied}
`;
}
function dgcInit(){
  if(!window.Diagram)return;
  window.Diagram.init({

    state:{serialize:dgcSerialize,deserialize:dgcDeserialize},
    record:dgcRecord,
    python:dgcPython,
    handoff:{provides:[],accepts:[]},
    report:{sections:dgcSections}
  });
}

 pl:{"modeLabel":"Paleta","elementLabel":"Pierwiastek","panelTools":"Narzędzia","toolLabel":"Tryb","toolBuild":"Buduj","toolErase":"Wymaż","resetLabel":"Resetuj","tileFormula":"Wzór","tileOpen":"Otwarte wiązania","tileClosed":"Wartościowości zamknięte","tileOne":"Jedna cząsteczka","tileBonds":"Wiązania","yes":"Tak","no":"Nie","footerTitle":"Model i ograniczenia","cardTitle":"Karta substancji","tAtoms":"Wybierz pierwiastek, a następnie kliknij puste miejsce, aby umieścić atom. Liczba pod symbolem oznacza liczbę wiązań tworzonych przez dany pierwiastek; siarka, fosfor, żelazo i miedź mają więcej niż jedną dozwoloną wartościowość.","tBonds":"Przeciągnij od atomu i puść na innym atomie, aby je połączyć; po puszczeniu na pustym miejscu pojawi się nowy atom wybranego pierwiastka, już związany. Kliknięcie wiązania zwiększa jego krotność: pojedyncze, podwójne, potrójne, a następnie znów pojedyncze.","tAutoH":"Dodaje atom wodoru do każdej otwartej pozycji wiązania jednocześnie — to najszybszy sposób ukończenia szkieletu węglowego.","tGoals":"Lista pokazuje wszystkie substancje w bibliotece zbudowane dokładnie z ciężkich atomów znajdujących się obecnie na polu; przy pustym polu pokazuje całą bibliotekę. Kliknij pozycję, aby zbudować ją automatycznie.","tMode":"Prosta paleta zawiera węgiel, wodór, tlen i azot oraz tworzone przez nie substancje. Paleta zaawansowana dodaje siarkę i fosfor, cztery halogeny oraz osiem metali i otwiera całą bibliotekę 107 substancji."}
};
function X(k){ return (X_I18N[LANG]&&X_I18N[LANG][k])||X_I18N.en[k]; }
/* language objects for the framework: {en:…, ru:…, uk:…, …} */
function LO(k,f){ const o={}; for(const l of LANG_KEYS){ const v=(I18N[l]&&I18N[l][k])||I18N.en[k]; o[l]=f?f(v):v; } return o; }
function XO(k){ const o={}; for(const l of LANG_KEYS) o[l]=(X_I18N[l]&&X_I18N[l][k])||X_I18N.en[k]; return o; }
function MO(k){ const m=(window.Diagram&&Diagram.manifest&&Diagram.manifest())||null;   // manifest text, seven site languages
  const src=m&&m[k]||{}; const o={}; for(const l of LANG_KEYS) o[l]=src[l]||src.en||''; return o; }
function noEmoji(v){ return String(v).replace(/^[^\p{L}\p{N}]+/u,'').trim(); }
function noColon(v){ return String(v).replace(/[::]\s*$/,''); }
function joinLO(a,b,sep){ const o={}; for(const l of LANG_KEYS) o[l]=a[l]+(sep||' ')+b[l]; return o; }

/* ---- learn content: the tool's own prose, moved rather than rewritten ---- */
const LEARN={
  version:1,
  intro:{ title:LO('btnHelp',noEmoji), body:joinLO(LO('appSub'),LO('helpText'),'\n\n') },
  topics:{
    atoms:{ title:LO('palAtoms'), body:joinLO(XO('tAtoms'),LO('hint'),'\n\n') },
    valence:{ title:LO('legendTitle',noColon), body:LO('legendText') },
    bonds:{ title:XO('tileBonds'), body:XO('tBonds') },
    erase:{ title:LO('btnErase',noEmoji), body:LO('toastEraseOn') },
    autoh:{ title:LO('btnAutoH',noEmoji), body:XO('tAutoH') },
    card:{ title:XO('cardTitle'), body:LO('cardPlaceholder') },
    goals:{ title:LO('buildTitle'), body:XO('tGoals') },
    mode:{ title:XO('modeLabel'), body:XO('tMode') }
  },
  tour:[
    {topic:'atoms', focus:'[data-dgu-field="f-el"]'},
    {topic:'bonds', focus:'.dgu-stage'},
    {topic:'autoh', focus:'[data-dgu-panel="tools"]'},
    {topic:'valence', focus:'.dgu-stage-cap'},
    {topic:'card', focus:'[data-dgu-panel="detail"] .dgu-panel-h'},
    {topic:'goals', focus:'[data-dgu-panel="goals"] .dgu-panel-h'}
  ]
};

/* ---- undo/redo: the snapshot is the drawing plus the two modes ---- */
function histCapture(){
  return JSON.stringify({a:state.atoms,b:state.bonds,n:state.nextId,m:state.mode,r:state.armed,t:state.tool});
}
function histRestore(snap){
  let o; try{o=JSON.parse(snap)}catch(e){return}
  state.atoms=o.a.map(x=>({id:x.id,el:x.el,x:x.x,y:x.y}));
  state.bonds=o.b.map(x=>({a:x.a,b:x.b,order:x.order}));
  state.nextId=o.n; state.mode=o.m; state.armed=o.r; state.tool=o.t;
  svg.classList.toggle('eraseMode', state.tool==='erase');
  renderPalette(); render(); kick(0.4);
}

/* ---- language: seven site languages through the framework, plus this tool's ru ---- */
function applyToolLang(l){
  if(!LANG_NAMES[l]) return;
  LANG=l;
  try{const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u)}catch(e){}
  if(SITE_LANGS.includes(l)){try{localStorage.setItem('diagram_lang',l)}catch(e){}}
  if(window.Diagram){try{window.Diagram.setLang(l)}catch(e){}}
  if(document.documentElement.lang!==l) document.documentElement.lang=l;
  if(ui){ if(ui.lang!==l){ ui.lang=l; ui.rebuild(); } else { renderPalette(); update(); } }
  else { if(els.langSel&&els.langSel.value!==l) els.langSel.value=l; mountFallbackText(); renderPalette(); update(); }
}
/* The framework language select uses the seven site languages; this tool additionally supports Russian locally.
   Native language names are restored after each framework rebuild. */
function decorateHeader(app){
  if(!app||!app.head) return;
  const sels=app.head.querySelectorAll('select');
  for(const sel of sels){
    const vals=[...sel.options].map(o=>o.value);
    if(vals.indexOf('en')<0) continue;
    for(const o of sel.options) if(LANG_NAMES[o.value]) o.textContent=LANG_NAMES[o.value];
    if(sel.value!==LANG&&vals.indexOf(LANG)>=0) sel.value=LANG;
    if(!sel.__mcExtraLang){
      sel.__mcExtraLang=1;
      sel.addEventListener('change',function(){ if(!SITE_LANGS.includes(sel.value)) applyToolLang(sel.value); });
    }
  }
}

function subName(id){ const m=SUBS.find(x=>x.id===id); return m; }
function exampleOf(id){
  const m=subName(id); if(!m) return null;
  const label={}; for(const l of LANG_KEYS) label[l]=(m.tr[l]||m.tr.en).name;
  return { label:label, note:(m.df||m.formula),
    apply:function(){ if(m.level==='a'&&state.mode!=='adv'){ setMode('adv'); } buildSubstance(m); } };
}

function mountFramework(){
  ui=DiagramUI.app({
    id:'moleculeconstructor', mount:'#app',
    layout:'studio', compute:'live',
    state:state, defaults:DEFAULTS,
    /* the h1 is the manifest's title; the manifest has seven site languages and this tool
       has seven, so the seventh comes from the tool's own title string */
    title:(function(){const t=MO('title'); t.ru=noEmoji(I18N.ru.appTitle); return t})(),
    subtitle:LO('appSub'),
    history:{capture:histCapture, restore:histRestore},
    learn:LEARN,
    shortcuts:[
      {keys:'h', label:LO('btnAutoH',noEmoji), run:function(){ autoH(); }},
      {keys:'e', label:LO('btnErase',noEmoji), run:function(){ setTool(state.tool==='erase'?'build':'erase'); if(ui)ui.sync(); }}
    ],
    regions:{
      stage:function(host,app){
        mcStage=app.stage({
          caption:joinLO(LO('legendTitle'),LO('legendText')),
          minHeight:360,
          a11y:function(){
            if(!state.atoms.length) return T('msgStart');
            const r=analyze(state.atoms,state.bonds);
            return T('palAtoms')+': '+state.atoms.length+', '+X('tileBonds')+': '+state.bonds.length+
                   ', '+X('tileFormula')+': '+(r.match?(r.match.df||r.match.formula):r.formula);
          },
          render:function(size,st){
            if(svg.parentNode!==st.body) st.body.appendChild(svg);
            if(state.atoms.length) kick(0.2); else render();
          },
          fit:function(){ fitDrawing(); }
        });
        mcStage.body.appendChild(svg);       /* attached at once: the layout needs a box */
      }
    },
    panels:[
      { id:'palette', slot:'inputs', title:LO('palAtoms'), note:LO('hint'), learn:'atoms',
        fields:[
          { id:'f-mode', key:'mode', type:'segmented', label:XO('modeLabel'), learn:'mode',
            options:[['simple',LO('modeSimple')],['adv',LO('modeAdv')]] },
          { id:'f-el', key:'armed', type:'custom', label:XO('elementLabel'), learn:'valence',
            render:function(box){ els.palette=box; renderPalette(); } }
        ] },
      { id:'tools', slot:'inputs', title:XO('panelTools'), learn:'erase',
        fields:[
          { id:'f-tool', key:'tool', type:'segmented', label:XO('toolLabel'), learn:'erase',
            options:[['build',XO('toolBuild')],['erase',XO('toolErase')]] }
        ],
        actions:[
          { id:'autoh', label:LO('btnAutoH'), variant:'primary', run:function(){ autoH(); } },
          { id:'reset', label:XO('resetLabel'), variant:'ghost', run:function(){ if(ui)ui.reset(); } }
        ] },
      { id:'detail', slot:'detail', title:XO('cardTitle'), learn:'card',
        render:function(box){
          const f=document.createElement('div'); f.id='formula'; f.textContent='—';
          const c=document.createElement('div'); c.id='card';
          box.appendChild(f); box.appendChild(c);
          els.formula=f; els.card=c;
        } },
      { id:'goals', slot:'dock', title:LO('buildTitle'), learn:'goals',
        render:function(box){
          const g=document.createElement('div'); g.id='goals';
          box.appendChild(g); els.goals=g;
        } }
    ],
    footer:function(host,app){
      const d=document.createElement('details');
      const sum=document.createElement('summary');
      sum.textContent=DiagramUI.pick(XO('footerTitle'),app.lang);
      const pl=document.createElement('p');
      pl.textContent=DiagramUI.pick(MO('limitations'),app.lang);
      d.appendChild(sum); d.appendChild(pl); host.appendChild(d);
    },
    on:{
      compute:function(){ return paint(); },
      change:function(key,value){
        if(key==='mode') setMode(value);
        else if(key==='tool') setTool(value);
      },
      reset:function(fresh,app){
        hpush();
        state.atoms=[]; state.bonds=[]; state.nextId=1;
        state.mode=(fresh&&fresh.mode)||'simple';
        state.armed=(fresh&&fresh.armed)||'C';
        state.tool=(fresh&&fresh.tool)||'build';
        app.state=state;                       /* the tool keeps one state object */
        svg.classList.remove('eraseMode');
        if(simRAF){cancelAnimationFrame(simRAF);simRAF=null;}
        lastMatchId=null; renderPalette(); render();
      },
      lang:function(l){ if(LANG_NAMES[l]) LANG=l; },
      ready:function(app){
        ui=app;
        if(!app.__mcExamples){
          app.__mcExamples=1;
          const ex=['water','ethanol','h2so4'].map(exampleOf).filter(Boolean);
          if(ex.length) app.examples(ex);
        }
        decorateHeader(app);
        svg.classList.toggle('eraseMode', state.tool==='erase');
        renderPalette(); render();
      }
    }
  });

  /* the tool's own language precedence honours ?lang=ru, which the site's seven do not */
  if(LANG!==ui.lang&&LANG_NAMES[LANG]&&!SITE_LANGS.includes(LANG)){
    applyToolLang(LANG);      /* rebuild() readies the new instance itself */
  }else{
    if(LANG!==ui.lang) LANG=ui.lang;
    ui.ready();
  }
}

/* ---- the shell of last resort: diagram-ui.js did not load ----------------
   Rule 4 of the port: a missing stylesheet may not cost the chemistry set.  The
   drawing, the palette, the substance card, the goal list, the language choice
   and every action stay reachable; only the shared shell is gone. */
function mountFallback(){
  const host=document.getElementById('app')||document.body;
  const st=document.createElement('style');
  st.textContent=
   ':root{--bg:#f6f8fb;--panel:#fff;--ink:#12161d;--muted:#5b6675;--line:#e2e7ee;--accent:#3763e6;'+
   '--weak:rgba(55,99,230,.10);--ok:#1f6f34;--warn:#9a5a00;--bad:#a5261f;'+
   '--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;'+
   '--fs-title:22px;--fs-body:15px;--fs-label:13px;--fs-small:12px;--fs-micro:11px;'+
   '--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--radius-sm:8px;--radius-md:14px;'+
   '--radius-pill:999px;--tap:44px;}'+
   'body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-body)/1.5 var(--font);}'+
   '.mcfb{display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-3);}'+
   '.mcfb h1{font-size:var(--fs-title);margin:0;}'+
   '.mcfb-head{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;}'+
   '.mcfb-row{display:flex;gap:var(--sp-2);flex-wrap:wrap;}'+
   '.mcfb-row button,.mcfb select{min-height:var(--tap);padding:0 var(--sp-3);border-radius:var(--radius-sm);'+
   'border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 var(--fs-label)/1 var(--font);cursor:pointer;}'+
   '.mcfb-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--sp-3);}'+
   '.mcfb-stage{height:60vh;min-height:280px;}'+
   '.msg.ok{color:var(--ok)}.msg.warn{color:var(--warn)}.msg.bad{color:var(--bad)}.msg.mut{color:var(--muted)}';
  document.head.appendChild(st);

  const wrap=document.createElement('div'); wrap.className='mcfb';
  wrap.innerHTML=
    '<div class="mcfb-head"><h1 id="fbTitle"></h1>'+
    '<select id="fbLang" aria-label="Language"></select></div>'+
    '<div class="mcfb-row" id="fbActions"></div>'+
    '<div class="mcfb-box"><div id="fbPalette"></div></div>'+
    '<div class="mcfb-box mcfb-stage" id="fbStage"></div>'+
    '<div class="mcfb-box"><div id="formula">—</div><div class="msg mut" id="msg"></div><div id="card"></div></div>'+
    '<div class="mcfb-box"><h2 id="fbGoalsHead"></h2><div id="goals"></div></div>';
  host.appendChild(wrap);
  document.getElementById('fbStage').appendChild(svg);
  els.palette=document.getElementById('fbPalette');
  els.formula=document.getElementById('formula');
  els.msg=document.getElementById('msg');
  els.card=document.getElementById('card');
  els.goals=document.getElementById('goals');
  els.langSel=document.getElementById('fbLang');
  els.langSel.innerHTML=LANG_KEYS.map(k=>'<option value="'+k+'">'+LANG_NAMES[k]+'</option>').join('');
  els.langSel.value=LANG;
  els.langSel.onchange=()=>applyToolLang(els.langSel.value);
  const act=document.getElementById('fbActions');
  const mk=(id,key,fn)=>{const b=document.createElement('button');b.type='button';b.id=id;b.onclick=fn;act.appendChild(b);return b};
  els.fbAutoH=mk('fbAutoH','btnAutoH',autoH);
  els.fbErase=mk('fbErase','btnErase',()=>{ setTool(state.tool==='erase'?'build':'erase'); mountFallbackText(); });
  els.fbClear=mk('fbClear','btnClear',clearAll);
  els.fbHelp =mk('fbHelp','btnHelp',()=>toast(T('helpText')));
  els.fbMode =document.createElement('select'); els.fbMode.setAttribute('aria-label','Palette');
  els.fbMode.innerHTML='<option value="simple"></option><option value="adv"></option>';
  els.fbMode.onchange=()=>{ setMode(els.fbMode.value); update(); };
  act.appendChild(els.fbMode);
  mountFallbackText();
  renderPalette(); update();
}
function mountFallbackText(){
  if(!els.langSel) return;
  document.getElementById('fbTitle').textContent=T('appTitle');
  document.getElementById('fbGoalsHead').textContent=T('buildTitle');
  els.fbAutoH.textContent=T('btnAutoH'); els.fbErase.textContent=T('btnErase');
  els.fbClear.textContent=T('btnClear'); els.fbHelp.textContent=T('btnHelp');
  els.fbMode.options[0].textContent=T('modeSimple'); els.fbMode.options[1].textContent=T('modeAdv');
  els.fbMode.value=state.mode;
  document.title=T('appTitle');
}

/* ---- Start ---- */
function boot(){
  if(window.DiagramUI&&DiagramUI.api==='tools.petrov.re/ui/v1') mountFramework();
  else mountFallback();
  dgcInit();            /* unconditional: never inside a then(), a catch() or a success branch */
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

</script>
