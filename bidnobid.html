    "uk": "Чи вартий тендер витрат на пропозицію? Розраховує дерево рішень з одним чи двома етапами (кваліфікація, потім пропозиція) до очікуваної вартості участі, дає беззбиткову імовірність перемоги поряд із базовою часткою 1/N і вашим відсотком перемог, враховує зниження маржі, альтернативну вартість зайнятої команди та заявлену стратегічну цінність, оцінює відповідність профілю, перевіряє відсікачі й показує, що змінює відповідь.",

  "description": {
    "en": "For the contractor or equipment supplier deciding whether to qualify (life-cycle stage 3) and whether to tender (stage 4). Net contribution if won M = value × (margin − expected margin erosion) − opportunity cost of capacity; bid cost = hours × rate + external cost per gate. One gate: EV = p·M − B. Two gates (restricted procedure or competitive negotiation / dialogue; classic sectors, Wet 17.06.2016 art. 79 §2: if the authority limits the number, at least 5 or 3 invited; special sectors, art. 149: number set by the entity, no legal minimum): EV = p1·max(p2·M − B2, 0) − B1, compared with the misleading “all costs up front” view. Breakeven probability, strategic value needed, bid spend per contract won, return on bid spend, attractiveness score from weighted criteria (Shipley / APMP practice), knock-outs, a stated decision rule (bid, bid with conditions, strategic bid, no bid) and a tornado of the expected value. Exports CSV, JSON and the module of the tender project file.",
    "uk": "Для підрядника чи постачальника обладнання, який вирішує, чи подавати кваліфікаційні документи (етап 3 життєвого циклу) і чи подавати пропозицію (етап 4). Чистий внесок у разі перемоги M = вартість × (маржа − очікуване зниження маржі) − альтернативна вартість ресурсів; витрати на пропозицію = години × ставка + зовнішні витрати на кожному етапі. Один етап: EV = p·M − B. Два етапи (обмежена процедура чи конкурентні переговори / діалог; класичні сектори, Закон Бельгії 17.06.2016 ст. 79 §2: якщо замовник обмежує кількість — щонайменше 5 або 3 запрошених; спеціальні сектори, ст. 149: кількість визначає замовник, без законного мінімуму): EV = p1·max(p2·M − B2, 0) − B1 порівняно з хибним підходом «усі витрати одразу». Беззбиткова імовірність, потрібна стратегічна цінність, витрати на один виграний контракт, віддача на витрати, бал привабливості за зваженими критеріями (практика Shipley / APMP), відсікачі, відкрите правило рішення (подавати, за умов, стратегічна участь, не подавати) і діаграма-торнадо очікуваної вартості. Експорт CSV, JSON і модуля файлу тендерного проєкту.",

    "nl": "Voor de aannemer of uitrustingsleverancier die beslist of hij zich kandidaat stelt (fase 3 van de levenscyclus) en of hij inschrijft (fase 4). Nettobijdrage bij gunning M = waarde × (marge − verwachte marge-erosie) − opportuniteitskost van de capaciteit; offertekosten = uren × tarief + externe kosten per fase. Eén fase: VW = p·M − B. Twee fasen (niet-openbare procedure of mededingingsprocedure met onderhandeling / concurrentiegerichte dialoog; klassieke sectoren, wet 17.06.2016 art. 79 §2: bij beperking minstens 5 of 3 uitgenodigd; speciale sectoren, art. 149: aantal bepaald door de entiteit, geen wettelijk minimum): VW = p1·max(p2·M − B2, 0) − B1, vergeleken met de misleidende benadering “alle kosten vooraf”. Break-evenkans, vereiste strategische waarde, offertekosten per gewonnen opdracht, rendement op offertekosten, aantrekkelijkheidsscore uit gewogen criteria (praktijk Shipley / APMP), knock-outs, een expliciete beslisregel (inschrijven, onder voorwaarden, strategisch, niet inschrijven) en een tornado van de verwachte waarde. Export naar CSV, JSON en de module van het aanbestedingsprojectbestand.",

    "es": "Para el contratista o proveedor de equipos que decide si presentarse a la selección (etapa 3 del ciclo de vida) y si ofertar (etapa 4). Contribución neta si se gana M = importe × (margen − erosión de margen esperada) − coste de oportunidad de la capacidad; coste de la oferta = horas × tarifa + costes externos por fase. Una fase: VE = p·M − B. Dos fases (procedimiento restringido o negociación / diálogo competitivo; sectores clásicos, ley belga 17.06.2016 art. 79 §2: si se limita el número, al menos 5 o 3 invitados; sectores especiales, art. 149: número fijado por la entidad, sin mínimo legal): VE = p1·max(p2·M − B2, 0) − B1, comparado con el engañoso enfoque «todos los costes por adelantado». Probabilidad de equilibrio, valor estratégico necesario, coste de oferta por contrato ganado, retorno del coste de oferta, puntuación de atractivo con criterios ponderados (práctica Shipley / APMP), eliminatorios, una regla de decisión explícita (ofertar, con condiciones, estratégica, no ofertar) y un tornado del valor esperado. Exporta CSV, JSON y el módulo del archivo de proyecto de licitación.",

<script>

(function () {
  'use strict';

  /* ============================================================ 1. the model */
  var TOOL = 'bidnobid';
  function lib() { return window.TndBnb || null; }
  function core() { return window.TndCore || null; }
  var MAXC = 12, MAXK = 6;

  /* percentages are kept in percent in the state (6 = 6 %), money in euro */
  var DEFAULTS = {
    procedure: 'single', V: 4200000, m: 6, r: 0.5, C: 0, S: 0,
    rate: 85, h1: 0, x1: 0, h2: 320, x2: 6000,
    p1: 60, p2: 18, N: 7, h: 15,
    criteria: [
      { name: 'Relationship and knowledge of the client', group: 'client', weight: 10, score: 7 },
      { name: 'Competitive position (incumbent, price level)', group: 'client', weight: 15, score: 5 },
      { name: 'Technical capability and references', group: 'capability', weight: 15, score: 8 },
      { name: 'Key staff available for bid and execution', group: 'capability', weight: 10, score: 6 },
      { name: 'Workload and execution capacity', group: 'capacity', weight: 10, score: 6 },
      { name: 'Contract terms and risk allocation', group: 'risk', weight: 15, score: 6 },
      { name: 'Payment terms and client solvency', group: 'risk', weight: 10, score: 8 },
      { name: 'Margin potential against the market', group: 'risk', weight: 5, score: 4 },
      { name: 'Strategic fit', group: 'strategy', weight: 5, score: 6 },
      { name: 'Follow-on work', group: 'strategy', weight: 5, score: 4 }
    ],
    ko: [
      { name: 'Selection criteria met (erkenning class, turnover, references)', met: true },
      { name: 'Bond and insurance capacity available', met: true },
      { name: 'No exclusion ground or conflict of interest', met: true }
    ],
    go: 65, review: 45, dp: 10, dm: 2, dB: 30, dV: 15,
    tenderRef: '', preparedBy: ''
  };
  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null, ui = null, stage = null;

  function engineInput(s) {
    var pct = function (v) { return (+v || 0) / 100; };
    return {
      procedure: s.procedure === 'two' ? 'two' : 'single', V: +s.V || 0, m: pct(s.m), r: pct(s.r), C: +s.C || 0, S: +s.S || 0,
      rate: +s.rate || 0, h1: +s.h1 || 0, x1: +s.x1 || 0, h2: +s.h2 || 0, x2: +s.x2 || 0,
      p1: pct(s.p1), p2: pct(s.p2), N: +s.N >= 1 ? Math.round(+s.N) : null, h: +s.h > 0 ? pct(s.h) : null,
      go: +s.go, review: +s.review, dp: pct(s.dp), dm: pct(s.dm), dB: pct(s.dB), dV: pct(s.dV),
      criteria: (s.criteria || []).slice(0, MAXC).map(function (c, k) { return { id: 'K' + (k + 1), name: c.name, group: c.group, weight: +c.weight || 0, score: +c.score || 0 }; }),
      ko: (s.ko || []).slice(0, MAXK).map(function (c, k) { return { id: 'KO' + (k + 1), name: c.name, met: c.met === true ? true : (c.unclear ? null : false) }; })
    };
  }
  function solve(s) {
    var B = lib();
    if (!B) return { ok: false, errors: ['engine'] };
    try { var inp = engineInput(s), r = B.analyse(inp); r.raw = inp; return r; }
    catch (e) { return { ok: false, errors: ['exception'], msg: String(e && e.message || e) }; }
  }

  /* ======================================================== 2. the interface */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }
  var LANGS = ['en', 'uk', 'de', 'nl', 'fr', 'es', 'pl'];
  function TF(fn) { var o = {}; LANGS.forEach(function (l) { o[l] = fn(l); }); return o; }
  function lang() { try { var l = window.DiagramUI && DiagramUI.domainLang ? DiagramUI.domainLang() : 'en'; return LANGS.indexOf(l) >= 0 ? l : 'en'; } catch (e) { return 'en'; } }
  var COMMA = { en: false, uk: true, de: true, nl: true, fr: true, es: true, pl: true };
  function nf(v, l, d) {
    if (v == null || !isFinite(v)) return '—';
    var C = core(); if (C && C.fmt) return C.fmt(v, l, d == null ? 2 : d);
    var s = v.toFixed(d == null ? 2 : d); return COMMA[l] ? s.replace('.', ',') : s;
  }
  function eur(v, l) {
    if (v == null || !isFinite(v)) return '—';
    var C = core(); if (C && C.money) return C.money(v, 'EUR', l, 0);
    return nf(v, l, 0) + ' €';
  }
  function keur(v, l) {
    if (v == null || !isFinite(v)) return '—';

    nNoMargin: T('After margin erosion and the opportunity cost of capacity nothing is left to win: no probability of award makes this bid pay.', 'Після зниження маржі та альтернативної вартості ресурсів виграти нічого: жодна імовірність перемоги не окупить участь.', 'Nach Margenerosion und Opportunitätskosten bleibt nichts zu gewinnen: keine Zuschlagswahrscheinlichkeit macht dieses Angebot lohnend.', 'Na marge-erosie en opportuniteitskost blijft er niets te winnen: geen enkele kans op gunning maakt deze offerte rendabel.', 'Après érosion de la marge et coût d’opportunité, il n’y a plus rien à gagner : aucune probabilité d’attribution ne rend cette offre rentable.', 'Tras la erosión del margen y el coste de oportunidad no queda nada que ganar: ninguna probabilidad de adjudicación hace rentable esta oferta.', 'Po erozji marży i koszcie alternatywnym nie ma nic do wygrania: żadne prawdopodobieństwo wygranej nie sprawi, że oferta się opłaci.'),

    nPolicy: T('Decision rule (stated policy heuristic): any knock-out not met → NO BID; expected value negative even with the strategic value → NO BID; negative in money but positive with it → STRATEGIC BID; otherwise the score decides between BID, BID WITH CONDITIONS and NO BID.', 'Правило рішення (відкрита евристика політики): невиконаний відсікач → НЕ ПОДАВАТИ; очікувана вартість від’ємна навіть зі стратегічною цінністю → НЕ ПОДАВАТИ; від’ємна в грошах, але додатна з нею → СТРАТЕГІЧНА УЧАСТЬ; інакше бал вирішує між ПОДАВАТИ, ЗА УМОВ і НЕ ПОДАВАТИ.', 'Entscheidungsregel (offengelegte Heuristik): ein K.-o.-Kriterium nicht erfüllt → KEIN ANGEBOT; Erwartungswert auch mit strategischem Wert negativ → KEIN ANGEBOT; in Geld negativ, mit ihm positiv → STRATEGISCHES ANGEBOT; sonst entscheiden die Punkte zwischen ANBIETEN, MIT AUFLAGEN und KEIN ANGEBOT.', 'Beslisregel (expliciete beleidsheuristiek): een knock-out niet vervuld → NIET INSCHRIJVEN; verwachte waarde negatief, ook met strategische waarde → NIET INSCHRIJVEN; negatief in geld maar positief ermee → STRATEGISCHE INSCHRIJVING; anders beslist de score tussen INSCHRIJVEN, ONDER VOORWAARDEN en NIET INSCHRIJVEN.', 'Règle de décision (heuristique explicite) : un critère éliminatoire non rempli → NO-GO ; valeur attendue négative même avec la valeur stratégique → NO-GO ; négative en argent mais positive avec elle → GO STRATÉGIQUE ; sinon la note départage GO, GO SOUS CONDITIONS et NO-GO.', 'Regla de decisión (heurística explícita): un criterio eliminatorio no cumplido → NO OFERTAR; valor esperado negativo incluso con el valor estratégico → NO OFERTAR; negativo en dinero pero positivo con él → OFERTA ESTRATÉGICA; si no, la nota decide entre OFERTAR, CON CONDICIONES y NO OFERTAR.', 'Reguła decyzji (jawna heurystyka): niespełnione kryterium eliminujące → NIE SKŁADAĆ; wartość oczekiwana ujemna nawet z wartością strategiczną → NIE SKŁADAĆ; ujemna w pieniądzu, ale dodatnia z nią → OFERTA STRATEGICZNA; w pozostałych przypadkach ocena rozstrzyga między SKŁADAĆ, POD WARUNKAMI i NIE SKŁADAĆ.'),
    nAssume: T('Thresholds, criterion weights, the strategic value and the sensitivity swings are company choices (learning assumptions) — replace them with your own bid policy and track record.', 'Пороги, ваги критеріїв, стратегічна цінність і діапазони чутливості — вибір компанії (навчальні припущення); замініть їх власною тендерною політикою та статистикою.', 'Schwellen, Kriteriengewichte, strategischer Wert und Sensitivitätsbereiche sind Firmenentscheidungen (Lernannahmen) — durch Ihre eigene Angebotspolitik und Statistik ersetzen.', 'Drempels, wegingen, strategische waarde en gevoeligheidsmarges zijn bedrijfskeuzes (leeraannames) — vervang ze door uw eigen offertebeleid en historiek.', 'Seuils, poids des critères, valeur stratégique et plages de sensibilité sont des choix d’entreprise (hypothèses d’apprentissage) — remplacez-les par votre propre politique d’offre et vos statistiques.', 'Umbrales, pesos, valor estratégico y rangos de sensibilidad son decisiones de la empresa (hipótesis didácticas): sustitúyalos por su propia política de ofertas e historial.', 'Progi, wagi kryteriów, wartość strategiczna i zakresy wrażliwości to wybory firmy (założenia szkoleniowe) — zastąp je własną polityką ofertową i statystyką.'),

  };

  function reasonText(R, l) {
    if (R.reason === 'ko') return S.whyKo[l] + ': ' + R.failed.map(function (id) { var k = +id.slice(2) - 1, c = (state.ko || [])[k]; return c && c.name ? c.name : id; }).join('; ');
    if (R.reason === 'money') return S.whyMoney[l];
    if (R.reason === 'strategic') return S.whyStrat[l];
    if (R.reason === 'ok') return S.whyOk[l];
    if (R.reason === 'unscored') return S.whyUnscored[l];
    if (R.decision === 'conditions') return S.whyCond[l];
    return S.whyFit[l];
  }
  function rangeText(id, n, l) {
    if (id === 'p2' || id === 'p1') return '± ' + nf(100 * n.dp, l, 0) + ' p.p.';
    if (id === 'm') return '± ' + nf(100 * n.dm, l, 1) + ' p.p.';
    if (id === 'V') return '± ' + nf(100 * n.dV, l, 0) + ' %';
    return '± ' + nf(100 * n.dB, l, 0) + ' %';
  }

  function computeView(s) {
    last = solve(s);
    if (stage) stage.schedule();
    var R = last;
    if (!R || !R.ok) {
      return { verdict: { tone: 'bad', text: R && R.errors && R.errors[0] === 'engine' ? S.errEngine : (R && R.errors && R.errors[0] === 'exception' ? TF(function () { return 'Error: ' + R.msg; }) : S.errValue) }, tiles: [], notes: [] };
    }
    var n = R.input, mo = R.money, sc = R.scoring, two = n.procedure === 'two';
    var tiles = [], tables = [], notes = [];
    var tone = R.decision === 'bid' ? 'ok' : (R.decision === 'nobid' ? 'bad' : 'warn');
    var verdict = { tone: tone, text: TF(function (l) {
      var c = ' ';
      return DEC[R.decision][l] + ' — ' + reasonText(R, l) + ' · ' + S.vEV[l] + ' ' + keur(mo.EV, l) + (n.S > 0 ? ' (' + keur(mo.EVs, l) + ')' : '') + ' · ' + S.vScore[l] + c + nf(sc.score, l, 0) + '/100.';
    }) };
    var LG = lang();
    function tile(label, value, hint, learn, tn, headline) { tiles.push({ label: label, value: str(value, LG), hint: str(hint || '', LG), learn: learn, tone: tn || null, headline: headline !== false }); }
    tile(S.tEV, keur(mo.EV, LG), n.S > 0 ? S.rEVs[LG] + ': ' + keur(mo.EVs, LG) : '', 'ev', mo.EV >= 0 ? 'ok' : (mo.EVs >= 0 && n.S > 0 ? 'warn' : 'bad'));
    var beTxt = mo.breakeven == null ? S.never[LG] : pc(mo.breakeven, LG, 1);
    var beHint = S.yours[LG] + ' ' + pc(n.p2, LG, 0) + (mo.base != null ? ' · ' + S.vsBase[LG] + ' ' + pc(mo.base, LG, 1) : '') + (mo.breakeven != null && mo.breakeven > 1 ? ' · ' + S.over1[LG] : '');
    tile(S.tBE, beTxt, beHint, 'pwin', mo.breakeven != null && mo.breakeven <= n.p2 ? 'ok' : 'bad');
    tile(S.tScore, sc.score == null ? '—' : nf(sc.score, LG, 0) + ' / 100', '≥ ' + nf(n.go, LG, 0) + ' · ≥ ' + nf(n.review, LG, 0), 'scoring', sc.score == null ? null : (sc.score >= n.go ? 'ok' : (sc.score >= n.review ? 'warn' : 'bad')));
    tile(S.tCost, keur(mo.Btot, LG), pc(mo.costPct, LG, 2) + ' ' + S.ofV[LG], 'ev', null, false);
    var wd = two && !mo.go2;
    tile(S.tPerWin, keur(mo.perWin, LG), wd ? S.tWdHint[LG] : '', 'pwin', null, false);
    tile(S.tRoi, mo.roi == null ? '—' : nf(mo.roi, LG, 2) + ' ×', wd ? S.tWdHint[LG] : '', 'ev', mo.roi != null && mo.roi >= 1 ? 'ok' : 'warn', false);
    if (two) tile(S.tNaive, keur(mo.naive, LG), '', 'gates', mo.naive < 0 && mo.EV >= 0 ? 'warn' : null, false);
    if (mo.EV < 0 && mo.Sneed != null) tile(S.tSneed, keur(mo.Sneed, LG), S.ifWon[LG], 'capacity', null, false);

    /* 1 decision tree */
    var tr = [];
    function row(lbl, txt, how, tn) { tr.push({ tone: tn || null, cells: [lbl, { text: txt, num: true }, how || ''] }); }
    row(S.rM, TF(function (l) { return eur(mo.M, l); }), TF(function (l) { return eur(n.V, l) + ' · (' + pc(n.m, l, 2) + ' − ' + pc(n.r, l, 2) + ') − ' + eur(n.C, l); }), mo.M <= 0 ? 'bad' : null);
    if (two) row(S.rB1, TF(function (l) { return eur(mo.B1, l); }), TF(function (l) { return nf(n.h1, l, 0) + ' h × ' + eur(n.rate, l) + ' + ' + eur(n.x1, l); }));
    row(S.rB2, TF(function (l) { return eur(mo.B2, l); }), TF(function (l) { return nf(n.h2, l, 0) + ' h × ' + eur(n.rate, l) + ' + ' + eur(n.x2, l); }));
    row(S.rEV2, TF(function (l) { return eur(mo.EV2, l); }), TF(function (l) { return pc(n.p2, l, 1) + ' × ' + eur(mo.M, l) + ' − ' + eur(mo.B2, l); }), mo.EV2 < 0 ? 'warn' : null);
    if (two) row(S.rGate2, mo.submit ? S.rSubmit : S.rWithdraw, 'max(EV2; 0)', mo.submit ? null : 'warn');
    row(S.rEV, TF(function (l) { return eur(mo.EV, l); }), two ? TF(function (l) { return pc(n.p1, l, 0) + ' × ' + eur(Math.max(mo.EV2, 0), l) + ' − ' + eur(mo.B1, l); }) : 'p2·M − B2', mo.EV >= 0 ? 'ok' : 'bad');
    if (n.S > 0) row(S.rEVs, TF(function (l) { return eur(mo.EVs, l); }), 'M + S', mo.EVs >= 0 ? 'ok' : 'bad');
    row(S.rPwin, TF(function (l) { return pc(mo.Pwin, l, 1); }), two ? (mo.go2 ? 'p1 · p2' : TF(function (l) { return '0 (' + S.rWithdraw[l] + ')'; })) : 'p2');
    row(S.rSpend, TF(function (l) { return eur(mo.spend, l); }), two ? (mo.go2 ? 'B1 + p1·B2' : TF(function (l) { return 'B1 (' + S.rWithdraw[l] + ')'; })) : 'B2');
    row(S.rAfford, TF(function (l) { return eur(mo.affordableB2, l); }), '', mo.affordableB2 != null && mo.affordableB2 < mo.B2 ? 'warn' : null);
    tables.push({ title: S.tabTree, head: [S.hItem, { label: S.hValue, num: true }, { label: S.hHow, wrap: true }], rows: tr });

    /* 2 scoring */
    var srows = sc.rows.map(function (r) { return { cells: [r.name || r.id, GRP[r.group], { value: r.weight, precision: 0, num: true }, { value: r.score, precision: 1, num: true }, { value: r.weighted, precision: 1, num: true }] }; });
    lib().GROUPS.forEach(function (g) { var x = sc.groups[g]; if (x.weight > 0) srows.push({ dim: true, cells: [GRP[g], '', { value: x.weight, precision: 0, num: true }, { text: TF(function (l) { return nf(x.score / 10, l, 1); }), num: true }, { value: x.share * x.score, precision: 1, num: true }] }); });
    srows.push({ chosen: true, cells: [S.total, '', { value: sc.weight, precision: 0, num: true }, '', { value: sc.score, precision: 1, num: true }] });
    if (sc.rows.length) tables.push({ title: S.tabScore, head: [S.cName, S.cGroup, { label: S.cWeight, num: true }, { label: S.cScore, num: true }, { label: S.hWeighted, num: true }], rows: srows });

    /* 3 knock-outs */
    if (n.ko.length) tables.push({ title: S.tabKo, head: [S.koName, S.koMet], rows: n.ko.map(function (k) { return { tone: k.met ? null : 'bad', cells: [k.name || k.id, k.met ? S.met : S.notMet] }; }) });

    /* 4 tornado */
    tables.push({ title: S.tabTor, head: [S.hVar, S.hRange, { label: S.hLow, num: true }, { label: S.hHigh, num: true }, S.hFlip],
      rows: R.tornado.bars.map(function (b) { return { tone: b.flips ? 'warn' : null, cells: [S.vNames[b.id], TF(function (l) { return rangeText(b.id, n, l); }), { text: TF(function (l) { return keur(b.low, l); }), num: true }, { text: TF(function (l) { return keur(b.high, l); }), num: true }, b.flips ? S.yes : S.no] }; }) });

    if (R.flags.indexOf('optimism-base') >= 0) notes.push(S.nOptBase);
    if (R.flags.indexOf('optimism-hit') >= 0) notes.push(S.nOptHit);
    if (R.flags.indexOf('no-margin') >= 0) notes.push(S.nNoMargin);
    if (R.flags.indexOf('withdraw') >= 0) notes.push(S.nWithdraw);
    if (R.flags.indexOf('weights') >= 0) notes.push(S.nWeights);
    if (R.reason === 'unscored') notes.push(S.nUnscored);
    if (R.flags.indexOf('thresholds') >= 0) notes.push(S.nThresholds);
    if (R.flags.indexOf('ko-unclear') >= 0) notes.push(S.nKoUnclear);
    if (two && mo.naive < 0 && mo.EV >= 0) notes.push(S.nNaive);
    notes.push(S.nPolicy);
    notes.push(S.nAssume);
    notes.push(S.nDisclaimer);
    return { verdict: verdict, tiles: tiles, tables: tables, notes: notes };
  }

  /* ---- stage: EV against p2 (top) and the tornado (bottom) ---- */
  function renderStage(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim() || '#888', lineC = cs.getPropertyValue('--line').trim() || '#ccc', ink = cs.getPropertyValue('--ink').trim() || '#111';
    var okC = cs.getPropertyValue('--ok').trim() || '#1e8449', badC = cs.getPropertyValue('--bad').trim() || '#c0392b';
    var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
    ctx.clearRect(0, 0, w, h);
    var R = last, B = lib();
    if (!R || !R.ok || !B) return;
    var l = lang(), fs = coarse ? 10 : 11, n = R.input, mo = R.money;
    ctx.font = fs + 'px ' + font;
    var Lm = coarse ? 46 : 60, Rm = coarse ? 8 : 14, top = 14;
    var hTop = Math.max(150, Math.round((h - 20) * 0.55)), pw = w - Lm - Rm, ph = hTop - top - 34;
    if (pw < 60 || ph < 40) return;
    var pts = B.curve(n, 100), pmax = 1;
    var ys = pts.map(function (p) { return p[1]; }), ymin = Math.min(0, Math.min.apply(null, ys)), ymax = Math.max(0, Math.max.apply(null, ys));
    if (ymax - ymin < 1) ymax = ymin + 1;
    var pad = (ymax - ymin) * 0.06; ymin -= pad; ymax += pad;
    function X(p) { return Lm + p / pmax * pw; }
    function Y(v) { return top + ph - (v - ymin) / (ymax - ymin) * ph; }
    ctx.strokeStyle = muted; ctx.fillStyle = muted; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Lm, top); ctx.lineTo(Lm, top + ph); ctx.lineTo(Lm + pw, top + ph); ctx.stroke();
    ctx.strokeStyle = lineC; ctx.beginPath(); ctx.moveTo(Lm, Y(0)); ctx.lineTo(Lm + pw, Y(0)); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    [0, 0.2, 0.4, 0.6, 0.8, 1].forEach(function (t) { var px = X(t); ctx.strokeStyle = muted; ctx.beginPath(); ctx.moveTo(px, top + ph); ctx.lineTo(px, top + ph + 3); ctx.stroke(); ctx.fillText(nf(100 * t, l, 0) + ' %', px, top + ph + 4); });
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    var yt = DiagramUI.ticks(ymin, ymax, ph, size.density) || [ymin, 0, ymax];
    yt.forEach(function (v) { if (v < ymin || v > ymax) return; ctx.fillText(keur(v, l), Lm - 4, Y(v)); });
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(S.axP[l], Lm + pw / 2, hTop - 2);
    ctx.save(); ctx.translate(10, top + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'top'; ctx.fillText(S.axEV[l], 0, -6); ctx.restore();
    /* EV curve, green above zero, red below */
    ctx.lineWidth = 2.5;
    for (var i = 1; i < pts.length; i++) {
      ctx.strokeStyle = (pts[i][1] + pts[i - 1][1]) / 2 >= 0 ? okC : badC;
      ctx.beginPath(); ctx.moveTo(X(pts[i - 1][0]), Y(pts[i - 1][1])); ctx.lineTo(X(pts[i][0]), Y(pts[i][1])); ctx.stroke();
    }
    function vline(p, label, col, dash, row) {
      if (p == null || !(p >= 0 && p <= 1)) return;
      var px = X(p);
      ctx.strokeStyle = col; ctx.setLineDash(dash || []); ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, top + ph); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = col; ctx.textAlign = px > Lm + pw - 60 ? 'right' : 'left'; ctx.textBaseline = 'top';
      ctx.fillText(label, px + (ctx.textAlign === 'left' ? 3 : -3), top + row * (fs + 2));
    }
    vline(mo.breakeven, S.mkBE[l] + ' ' + pc(mo.breakeven, l, 1), muted, [4, 3], 0);
    vline(mo.base, '1/N ' + pc(mo.base, l, 1), muted, [1, 3], 1);
    vline(n.h, S.mkHit[l] + ' ' + pc(n.h, l, 0), muted, [6, 2, 1, 2], 2);
    vline(n.p2, S.mkYou[l] + ' ' + pc(n.p2, l, 0), ink, null, 3);
    ctx.fillStyle = mo.EV >= 0 ? okC : badC; ctx.beginPath(); ctx.arc(X(n.p2), Y(mo.EV), 4.5, 0, 2 * Math.PI); ctx.fill();
    /* tornado */
    var bars = R.tornado.bars, y0 = hTop + 14, rh = Math.max(16, Math.min(28, (h - y0 - 24) / Math.max(1, bars.length)));
    var lab = coarse ? 86 : 150, x0 = Lm + (coarse ? 40 : 90), bw = w - x0 - Rm;
    var lo = Math.min(R.tornado.base, Math.min.apply(null, bars.map(function (b) { return Math.min(b.low, b.high); })));
    var hi = Math.max(R.tornado.base, Math.max.apply(null, bars.map(function (b) { return Math.max(b.low, b.high); })));
    lo = Math.min(lo, 0); hi = Math.max(hi, 0); if (hi - lo < 1) hi = lo + 1;
    function TX(v) { return x0 + (v - lo) / (hi - lo) * bw; }
    bars.forEach(function (b, k) {
      var yy = y0 + k * rh;
      ctx.fillStyle = ink; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(String(str(S.vNames[b.id], l)).slice(0, coarse ? 12 : 26), x0 - 6, yy + rh / 2);
      var a = TX(Math.min(b.low, b.high)), c = TX(Math.max(b.low, b.high));
      ctx.fillStyle = DiagramUI.series(0); ctx.globalAlpha = 0.75; ctx.fillRect(a, yy + 3, Math.max(1, c - a), rh - 6); ctx.globalAlpha = 1;
    });
    ctx.strokeStyle = ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(TX(R.tornado.base), y0 - 4); ctx.lineTo(TX(R.tornado.base), y0 + bars.length * rh + 2); ctx.stroke();
    ctx.strokeStyle = badC; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(TX(0), y0 - 4); ctx.lineTo(TX(0), y0 + bars.length * rh + 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    [lo, 0, hi].forEach(function (v, k) { if (k === 1 && (TX(0) - TX(lo) < 40 || TX(hi) - TX(0) < 40)) return; ctx.fillText(keur(v, l), TX(v), y0 + bars.length * rh + 4); });
    void lab;
  }

    t.rate = p.rate; t.h1 = p.h1; t.x1 = p.x1; t.h2 = p.h2; t.x2 = p.x2;
    t.p1 = +(100 * p.p1).toFixed(6); t.p2 = +(100 * p.p2).toFixed(6); t.N = p.N; t.h = p.h == null ? 0 : +(100 * p.h).toFixed(6);
    t.criteria.length = 0;
    p.criteria.forEach(function (c) { t.criteria.push({ name: str(CK[c.key], l) || c.key, group: c.group, weight: c.weight, score: c.score }); });
    t.ko.length = 0;
    p.ko.forEach(function (c) { t.ko.push({ name: str(KOK[c.key], l) || c.key, met: c.met }); });
  }
  function buildExamples() {

    });
  }

  function buildLearn() {
    return {
      version: 1,
      intro: {
        title: T('Bid / no-bid in one page', 'Bid / no-bid на одній сторінці', 'Bid/No-Bid auf einer Seite', 'Bid/no-bid op één pagina', 'Go / no-go en une page', 'Ofertar o no en una página', 'Bid/no-bid na jednej stronie'),
        body: T('Life-cycle stage 3 (selection: bid/no-bid #1) and 4 (tender documents: bid/no-bid #2). Enter what the contract is worth to you, what the bid costs and how likely you are to win; the tool rolls back the decision tree, scores the fit, checks the knock-outs and shows what moves the answer.',
                'Етап життєвого циклу 3 (відбір: перше рішення bid/no-bid) і 4 (тендерна документація: друге рішення). Введіть, скільки вам дає контракт, скільки коштує пропозиція і які шанси на перемогу; інструмент розраховує дерево рішень, оцінює відповідність профілю, перевіряє відсікачі й показує, що найбільше впливає на відповідь.',
                'Lebenszyklus-Phase 3 (Eignung: Bid/No-Bid Nr. 1) und 4 (Vergabeunterlagen: Bid/No-Bid Nr. 2). Geben Sie ein, was der Auftrag Ihnen bringt, was das Angebot kostet und wie wahrscheinlich der Zuschlag ist; das Werkzeug rechnet den Entscheidungsbaum zurück, bewertet die Passung, prüft die K.-o.-Kriterien und zeigt, was die Antwort bewegt.',
                'Fase 3 (selectie: bid/no-bid nr. 1) en 4 (opdrachtdocumenten: bid/no-bid nr. 2) van de levenscyclus. Voer in wat de opdracht u oplevert, wat de offerte kost en hoe groot de kans op gunning is; de tool rekent de beslissingsboom terug, scoort de fit, toetst de knock-outs en toont wat het antwoord bepaalt.',
                'Étapes 3 (sélection : go/no-go n° 1) et 4 (documents du marché : go/no-go n° 2) du cycle de vie. Saisissez ce que le marché vous rapporte, ce que coûte l’offre et vos chances de gain ; l’outil résout l’arbre de décision, note l’adéquation, vérifie les critères éliminatoires et montre ce qui fait varier la réponse.',
                'Etapas 3 (selección: primera decisión de ofertar) y 4 (pliegos: segunda decisión) del ciclo de vida. Introduzca lo que el contrato le aporta, lo que cuesta la oferta y la probabilidad de ganar; la herramienta resuelve el árbol de decisión, puntúa el encaje, revisa los criterios eliminatorios y muestra qué mueve la respuesta.',
                'Etap 3 (kwalifikacja: decyzja bid/no-bid nr 1) i 4 (dokumenty zamówienia: decyzja nr 2) cyklu życia. Wprowadź, ile daje Ci umowa, ile kosztuje oferta i jakie są szanse wygranej; narzędzie rozwiązuje drzewo decyzyjne, ocenia dopasowanie, sprawdza kryteria eliminujące i pokazuje, co najbardziej zmienia odpowiedź.')
      },
      topics: {
        ev: { title: T('Expected value of a bid', 'Очікувана вартість участі', 'Erwartungswert eines Angebots', 'Verwachte waarde van een offerte', 'Valeur attendue d’une offre', 'Valor esperado de una oferta', 'Wartość oczekiwana oferty'),
          body: T('A bid is a bet: you pay the bid cost B for sure and receive the net contribution M only if you win, with probability p. Expected value EV = p·M − B. M is the margin after the expected cost of the risks you keep and after the margin the team would earn elsewhere. A positive EV means that over many similar tenders this kind of bid pays; it says nothing about this one tender.',
                  'Участь у тендері — це ставка: витрати на пропозицію B ви несете напевно, а чистий внесок M отримуєте лише в разі перемоги з імовірністю p. Очікувана вартість EV = p·M − B. M — маржа після очікуваної вартості ризиків, що лишаються на вас, і після маржі, яку команда заробила б деінде. Додатна EV означає, що на багатьох подібних тендерах такі пропозиції окупаються; про один конкретний тендер вона нічого не каже.',
                  'Ein Angebot ist eine Wette: die Angebotskosten B zahlen Sie sicher, den Nettobeitrag M erhalten Sie nur bei Zuschlag, mit Wahrscheinlichkeit p. Erwartungswert EW = p·M − B. M ist die Marge nach den erwarteten Kosten der verbleibenden Risiken und nach der Marge, die das Team anderswo verdienen würde. Ein positiver EW heißt: über viele ähnliche Ausschreibungen lohnt sich diese Art Angebot; über diese eine Ausschreibung sagt er nichts.',
                  'Een offerte is een weddenschap: de offertekosten B betaalt u zeker, de nettobijdrage M krijgt u enkel bij gunning, met kans p. Verwachte waarde VW = p·M − B. M is de marge na de verwachte kost van de risico’s die u draagt en na de marge die het team elders zou verdienen. Een positieve VW betekent dat dit soort offertes over veel vergelijkbare aanbestedingen loont; over deze ene opdracht zegt ze niets.',
                  'Une offre est un pari : vous payez à coup sûr le coût d’offre B et ne recevez la contribution nette M qu’en cas de gain, avec la probabilité p. Valeur attendue VA = p·M − B. M est la marge après le coût attendu des risques conservés et après la marge que l’équipe gagnerait ailleurs. Une VA positive signifie que ce type d’offre est rentable sur de nombreux appels similaires ; elle ne dit rien de ce seul appel.',
                  'Una oferta es una apuesta: el coste de oferta B lo paga seguro y la contribución neta M solo la recibe si gana, con probabilidad p. Valor esperado VE = p·M − B. M es el margen tras el coste esperado de los riesgos asumidos y tras el margen que el equipo ganaría en otro sitio. Un VE positivo significa que, en muchas licitaciones parecidas, este tipo de oferta compensa; no dice nada de esta licitación concreta.',
                  'Oferta to zakład: koszt oferty B ponosisz na pewno, a wkład netto M otrzymujesz tylko po wygranej, z prawdopodobieństwem p. Wartość oczekiwana WO = p·M − B. M to marża po oczekiwanym koszcie ryzyk po Twojej stronie i po marży, którą zespół zarobiłby gdzie indziej. Dodatnia WO oznacza, że w wielu podobnych przetargach taka oferta się opłaca; o tym jednym przetargu nic nie mówi.') },
        gates: { title: T('Two gates and the option to withdraw', 'Два етапи й право відмовитися', 'Zwei Stufen und die Option zum Rückzug', 'Twee fasen en de optie om terug te trekken', 'Deux étapes et l’option de se retirer', 'Dos fases y la opción de retirarse', 'Dwa etapy i opcja wycofania się'),
          body: T('In a restricted procedure the authority first selects candidates (classic sectors, Wet 17.06.2016 art. 79 §1–§2, Dir. 2014/24/EU art. 65: if the authority limits the number, at least 5 invited, or 3 in a competitive negotiation, dialogue or innovation partnership, and fewer if fewer qualify; special sectors — grid, rail, water and other utilities, art. 149, Dir. 2014/25/EU art. 78(2): the entity sets the number by objective rules, no legal minimum, only sufficient competition). You spend the qualification cost B1 now, and the tender cost B2 only if shortlisted — and you can still withdraw if the tender documents disappoint. So EV = p1·max(p2·M − B2, 0) − B1. Charging B1 + B2 up front understates a good opportunity.',
                  'В обмеженій процедурі замовник спершу відбирає кандидатів (класичні сектори, Закон Бельгії 17.06.2016 ст. 79 §1–§2, Дир. 2014/24/ЄС ст. 65: якщо замовник обмежує кількість — щонайменше 5 запрошених, або 3 у конкурентних переговорах, діалозі чи інноваційному партнерстві, і менше, якщо кваліфікувалося менше; спеціальні сектори — мережі, залізниця, вода та інші комунальні послуги, ст. 149, Дир. 2014/25/ЄС ст. 78(2): кількість встановлює замовник за об’єктивними правилами, законного мінімуму немає, лише достатня конкуренція). Витрати на кваліфікацію B1 ви несете зараз, а на пропозицію B2 — лише після відбору, і ще можете відмовитися, якщо документація розчарує. Тому EV = p1·max(p2·M − B2, 0) − B1. Врахування B1 + B2 одразу занижує добру можливість.',
                  'Im nicht offenen Verfahren wählt der Auftraggeber zuerst Bewerber aus (klassische Sektoren, belg. Gesetz 17.06.2016 Art. 79 §1–§2, RL 2014/24/EU Art. 65: begrenzt der Auftraggeber die Zahl, mindestens 5 Eingeladene bzw. 3 im Verhandlungsverfahren, wettbewerblichen Dialog oder in der Innovationspartnerschaft, weniger, wenn weniger geeignet sind; Sektoren — Netz, Bahn, Wasser und andere Versorger, Art. 149, RL 2014/25/EU Art. 78 Abs. 2: der Sektorenauftraggeber legt die Zahl nach objektiven Regeln fest, kein gesetzliches Minimum, nur ausreichender Wettbewerb). Die Kosten des Teilnahmeantrags B1 fallen jetzt an, die Angebotskosten B2 nur nach Aufforderung — und Sie können noch zurückziehen, wenn die Unterlagen enttäuschen. Also EW = p1·max(p2·M − B2, 0) − B1. B1 + B2 vorab anzusetzen unterschätzt eine gute Gelegenheit.',
                  'In een niet-openbare procedure selecteert de aanbestedende overheid eerst kandidaten (klassieke sectoren, wet 17.06.2016 art. 79 §1–§2, richtlijn 2014/24/EU art. 65: als de aanbestedende overheid het aantal beperkt, minstens 5 uitgenodigd, of 3 bij een mededingingsprocedure met onderhandeling, concurrentiegerichte dialoog of innovatiepartnerschap, en minder als er minder geschikt zijn; speciale sectoren — net, spoor, water en andere nutsvoorzieningen, art. 149, richtlijn 2014/25/EU art. 78, lid 2: de aanbestedende entiteit bepaalt het aantal volgens objectieve regels, geen wettelijk minimum, enkel voldoende mededinging). De kosten van de selectiefase B1 maakt u nu, de offertekosten B2 enkel na selectie — en u kunt zich nog terugtrekken als de opdrachtdocumenten tegenvallen. Dus VW = p1·max(p2·M − B2, 0) − B1. B1 + B2 vooraf aanrekenen onderschat een goede opportuniteit.',
                  'En procédure restreinte, le pouvoir adjudicateur sélectionne d’abord les candidats (secteurs classiques, loi 17.06.2016 art. 79 §1–§2, directive 2014/24/UE art. 65 : si le pouvoir adjudicateur limite le nombre, au moins 5 invités, ou 3 en procédure concurrentielle avec négociation, dialogue compétitif ou partenariat d’innovation, et moins si moins sont qualifiés ; secteurs spéciaux — réseaux, rail, eau et autres services d’utilité publique, art. 149, directive 2014/25/UE art. 78, §2 : l’entité adjudicatrice fixe le nombre selon des règles objectives, sans minimum légal, seulement une concurrence suffisante). Le coût de candidature B1 est engagé maintenant, le coût d’offre B2 seulement après sélection — et vous pouvez encore vous retirer si les documents déçoivent. D’où VA = p1·max(p2·M − B2, 0) − B1. Imputer B1 + B2 d’emblée sous-estime une bonne opportunité.',
                  'En el procedimiento restringido el poder adjudicador selecciona primero a los candidatos (sectores clásicos, ley belga 17.06.2016 art. 79 §1–§2, Directiva 2014/24/UE art. 65: si el poder adjudicador limita el número, al menos 5 invitados, o 3 en la negociación, el diálogo competitivo o la asociación para la innovación, y menos si se califican menos; sectores especiales — red, ferrocarril, agua y otros servicios, art. 149, Directiva 2014/25/UE art. 78.2: la entidad adjudicadora fija el número con reglas objetivas, sin mínimo legal, solo competencia suficiente). El coste de selección B1 se gasta ahora y el de la oferta B2 solo si le seleccionan, y aún puede retirarse si los pliegos decepcionan. Así, VE = p1·max(p2·M − B2, 0) − B1. Imputar B1 + B2 por adelantado infravalora una buena oportunidad.',
                  'W przetargu ograniczonym zamawiający najpierw wybiera kandydatów (sektory klasyczne, ustawa belg. 17.06.2016 art. 79 §1–§2, dyrektywa 2014/24/UE art. 65: jeśli zamawiający ogranicza liczbę — co najmniej 5 zaproszonych albo 3 w negocjacjach, dialogu konkurencyjnym lub partnerstwie innowacyjnym, a mniej, jeśli mniej się zakwalifikuje; sektory użyteczności publicznej — sieci, kolej, woda, art. 149, dyrektywa 2014/25/UE art. 78 ust. 2: liczbę ustala zamawiający sektorowy według obiektywnych zasad, bez ustawowego minimum, tylko wystarczająca konkurencja). Koszt kwalifikacji B1 ponosisz teraz, koszt oferty B2 dopiero po zaproszeniu — i nadal możesz się wycofać, jeśli dokumenty rozczarują. Stąd WO = p1·max(p2·M − B2, 0) − B1. Liczenie B1 + B2 z góry zaniża dobrą okazję.') },
        pwin: { title: T('Win probability, base rate and breakeven', 'Імовірність перемоги, базова частка й беззбитковість', 'Zuschlagswahrscheinlichkeit, Basisrate und Schwelle', 'Kans op gunning, basiskans en break-even', 'Probabilité de gain, taux de base et seuil', 'Probabilidad de ganar, tasa base y equilibrio', 'Prawdopodobieństwo wygranej, częstość bazowa i próg'),
          body: T('The breakeven probability p* = (B2 + B1/p1)/M is the chance of award at which the bid exactly pays back. Compare it with two anchors: the base rate 1/N (an average bidder among N) and your own hit rate on similar tenders. If p* is close to 1/N, the bid only pays if you really are better than average — write down why. A win probability more than twice the base rate is flagged as optimistic. Bid spend per contract won = expected bid spend ÷ probability of winning.',
                  'Беззбиткова імовірність p* = (B2 + B1/p1)/M — шанс перемоги, за якого участь рівно окупається. Порівняйте її з двома орієнтирами: базовою часткою 1/N (середній учасник серед N) і власним відсотком перемог у подібних тендерах. Якщо p* близька до 1/N, участь окупається лише тоді, коли ви справді кращі за середнього, — запишіть чому. Імовірність, більш ніж удвічі вища за базову, позначається як оптимістична. Витрати на один виграний контракт = очікувані витрати ÷ імовірність перемоги.',
                  'Die Schwellenwahrscheinlichkeit p* = (B2 + B1/p1)/M ist die Zuschlagschance, bei der sich das Angebot genau trägt. Vergleichen Sie sie mit zwei Ankern: der Basisrate 1/N (ein durchschnittlicher Bieter unter N) und Ihrer eigenen Trefferquote. Liegt p* nahe 1/N, lohnt sich das Angebot nur, wenn Sie wirklich besser als der Durchschnitt sind — schreiben Sie auf, warum. Eine Wahrscheinlichkeit über dem Doppelten der Basisrate wird als optimistisch markiert. Angebotskosten je Auftrag = erwartete Angebotskosten ÷ Zuschlagswahrscheinlichkeit.',
                  'De break-evenkans p* = (B2 + B1/p1)/M is de kans op gunning waarbij de offerte zich precies terugverdient. Vergelijk ze met twee ankers: de basiskans 1/N (een gemiddelde inschrijver op N) en uw eigen slaagkans bij vergelijkbare opdrachten. Ligt p* dicht bij 1/N, dan loont de offerte enkel als u echt beter bent dan gemiddeld — noteer waarom. Een kans hoger dan het dubbele van de basiskans wordt als optimistisch gemarkeerd. Offertekosten per gewonnen opdracht = verwachte offertekosten ÷ kans om te winnen.',
                  'La probabilité d’équilibre p* = (B2 + B1/p1)/M est la chance d’attribution à laquelle l’offre se rembourse exactement. Comparez-la à deux repères : le taux de base 1/N (un soumissionnaire moyen parmi N) et votre propre taux de réussite. Si p* est proche de 1/N, l’offre n’est rentable que si vous êtes vraiment meilleur que la moyenne — notez pourquoi. Une probabilité supérieure au double du taux de base est signalée comme optimiste. Coût d’offre par marché gagné = coût d’offre attendu ÷ probabilité de gain.',
                  'La probabilidad de equilibrio p* = (B2 + B1/p1)/M es la probabilidad de adjudicación con la que la oferta se paga justo. Compárela con dos referencias: la tasa base 1/N (un licitador medio entre N) y su propia tasa de éxito. Si p* está cerca de 1/N, la oferta solo compensa si de verdad es mejor que la media: anote por qué. Una probabilidad superior al doble de la tasa base se marca como optimista. Coste de oferta por contrato ganado = coste de oferta esperado ÷ probabilidad de ganar.',
                  'Próg rentowności p* = (B2 + B1/p1)/M to szansa wygranej, przy której oferta dokładnie się zwraca. Porównaj go z dwoma punktami odniesienia: częstością bazową 1/N (przeciętny wykonawca spośród N) i własnym wskaźnikiem wygranych. Jeśli p* jest bliskie 1/N, oferta opłaca się tylko wtedy, gdy naprawdę jesteś lepszy od przeciętnego — zapisz dlaczego. Prawdopodobieństwo ponad dwa razy wyższe od bazowego jest oznaczane jako optymistyczne. Koszt ofert na wygraną = oczekiwany koszt ofert ÷ prawdopodobieństwo wygranej.') },
        capacity: { title: T('Capacity, risk and strategic value', 'Ресурси, ризик і стратегічна цінність', 'Kapazität, Risiko und strategischer Wert', 'Capaciteit, risico en strategische waarde', 'Capacité, risque et valeur stratégique', 'Capacidad, riesgo y valor estratégico', 'Zasoby, ryzyko i wartość strategiczna'),
          body: T('Three adjustments turn the price margin into what winning is really worth. Margin erosion r is the expected cost of the contract risks you keep (delay damages, warranty, unrecoverable claims). The opportunity cost C is the margin the same team or factory slot would earn on other work. The strategic value S (reference, new client, follow-on work) is kept apart: the tool shows the EV with and without it and the smallest S that makes the bid pay — the price management is implicitly paying for the strategy.',
                  'Три поправки перетворюють маржу в ціні на реальну вартість перемоги. Зниження маржі r — очікувана вартість ризиків, що лишаються на вас (неустойки за затримку, гарантія, невідшкодовані претензії). Альтернативна вартість C — маржа, яку та сама команда чи виробничий слот заробили б на іншій роботі. Стратегічна цінність S (референція, новий замовник, подальші замовлення) тримається окремо: інструмент показує EV з нею й без неї та найменше S, за якого участь окупається, — ціну, яку керівництво неявно платить за стратегію.',
                  'Drei Korrekturen machen aus der Preismarge, was der Zuschlag wirklich wert ist. Die Margenerosion r sind die erwarteten Kosten der verbleibenden Vertragsrisiken (Verzugsstrafen, Gewährleistung, nicht durchsetzbare Nachträge). Die Opportunitätskosten C sind die Marge, die dasselbe Team oder derselbe Fertigungsslot anderswo verdienen würde. Der strategische Wert S (Referenz, neuer Kunde, Folgeaufträge) bleibt getrennt: das Werkzeug zeigt den EW mit und ohne ihn und das kleinste S, bei dem sich das Angebot lohnt — den Preis, den die Geschäftsleitung stillschweigend für die Strategie zahlt.',
                  'Drie correcties maken van de prijsmarge wat gunning echt waard is. De marge-erosie r is de verwachte kost van de risico’s die u draagt (vertragingsboetes, waarborg, niet-recupereerbare claims). De opportuniteitskost C is de marge die hetzelfde team of dezelfde productieplaats elders zou verdienen. De strategische waarde S (referentie, nieuwe opdrachtgever, vervolgopdrachten) blijft apart: de tool toont de VW met en zonder S en de kleinste S waarbij de offerte loont — de prijs die de directie impliciet voor de strategie betaalt.',
                  'Trois corrections transforment la marge du prix en ce que le gain vaut vraiment. L’érosion de marge r est le coût attendu des risques conservés (pénalités de retard, garantie, réclamations non récupérables). Le coût d’opportunité C est la marge que la même équipe ou le même créneau d’usine gagnerait ailleurs. La valeur stratégique S (référence, nouveau client, travaux ultérieurs) reste à part : l’outil montre la VA avec et sans elle et le plus petit S qui rend l’offre rentable — le prix que la direction paie implicitement pour la stratégie.',
                  'Tres ajustes convierten el margen del precio en lo que ganar vale de verdad. La erosión de margen r es el coste esperado de los riesgos asumidos (penalidades por demora, garantía, reclamaciones no recuperables). El coste de oportunidad C es el margen que el mismo equipo o hueco de fábrica ganaría en otro trabajo. El valor estratégico S (referencia, cliente nuevo, trabajos posteriores) se mantiene aparte: la herramienta muestra el VE con y sin él y el menor S que hace rentable la oferta, es decir, el precio que la dirección paga implícitamente por la estrategia.',
                  'Trzy korekty zamieniają marżę w cenie na rzeczywistą wartość wygranej. Erozja marży r to oczekiwany koszt ryzyk po Twojej stronie (kary za zwłokę, gwarancja, nieodzyskiwalne roszczenia). Koszt alternatywny C to marża, którą ten sam zespół lub ten sam termin produkcyjny zarobiłby gdzie indziej. Wartość strategiczna S (referencja, nowy klient, kolejne zamówienia) jest liczona osobno: narzędzie pokazuje WO z nią i bez niej oraz najmniejsze S, przy którym oferta się opłaca — cenę, jaką zarząd niejawnie płaci za strategię.') },
        scoring: { title: T('Attractiveness score and knock-outs', 'Бал привабливості й відсікачі', 'Attraktivitätspunkte und K.-o.-Kriterien', 'Aantrekkelijkheidsscore en knock-outs', 'Note d’attractivité et critères éliminatoires', 'Puntuación de atractivo y criterios eliminatorios', 'Ocena atrakcyjności i kryteria eliminujące'),
          body: T('Money is not everything: bid/no-bid practice (Shipley, APMP) also scores the fit — client relationship, competitive position, capability, key staff, workload, contract terms, payment, strategy. Score = Σ weight × score ÷ (10 × Σ weight), 0–100. Knock-outs are must-haves that no score compensates: selection criteria you cannot meet, a bond you cannot obtain, a delivery slot you do not have. One failed knock-out means no bid.',
                  'Гроші — не все: практика bid/no-bid (Shipley, APMP) оцінює й відповідність профілю — стосунки із замовником, конкурентну позицію, спроможність, ключовий персонал, завантаженість, умови контракту, оплату, стратегію. Бал = Σ вага × бал ÷ (10 × Σ ваг), 0–100. Відсікачі — обов’язкові умови, яких жоден бал не компенсує: критерії відбору, яких ви не виконуєте, гарантія, якої не отримаєте, виробничий слот, якого немає. Один невиконаний відсікач — неучасть.',
                  'Geld ist nicht alles: die Bid/No-Bid-Praxis (Shipley, APMP) bewertet auch die Passung — Kundenbeziehung, Wettbewerbsposition, Leistungsfähigkeit, Schlüsselpersonal, Auslastung, Vertragsbedingungen, Zahlung, Strategie. Punkte = Σ Gewicht × Note ÷ (10 × Σ Gewicht), 0–100. K.-o.-Kriterien sind Muss-Bedingungen, die keine Punktzahl ausgleicht: nicht erfüllbare Eignungskriterien, eine nicht erhältliche Bürgschaft, ein fehlender Liefertermin. Ein verfehltes K.-o.-Kriterium heißt kein Angebot.',
                  'Geld is niet alles: de bid/no-bidpraktijk (Shipley, APMP) scoort ook de fit — relatie met de opdrachtgever, concurrentiepositie, bekwaamheid, sleutelpersoneel, werklast, contractvoorwaarden, betaling, strategie. Score = Σ weging × score ÷ (10 × Σ weging), 0–100. Knock-outs zijn must-haves die geen score compenseert: selectiecriteria die u niet haalt, een borgtocht die u niet krijgt, een leverplaats die u niet hebt. Eén gemiste knock-out betekent niet inschrijven.',
                  'L’argent ne fait pas tout : la pratique du go/no-go (Shipley, APMP) note aussi l’adéquation — relation client, position concurrentielle, capacités, personnel clé, plan de charge, clauses du contrat, paiement, stratégie. Note = Σ poids × note ÷ (10 × Σ poids), 0–100. Les critères éliminatoires sont des impératifs qu’aucune note ne compense : critères de sélection non remplis, cautionnement impossible à obtenir, créneau de livraison indisponible. Un seul critère éliminatoire non rempli signifie no-go.',
                  'El dinero no lo es todo: la práctica de decisión de ofertar (Shipley, APMP) puntúa también el encaje: relación con el cliente, posición competitiva, capacidad, personal clave, carga de trabajo, condiciones del contrato, pago, estrategia. Nota = Σ peso × nota ÷ (10 × Σ peso), 0–100. Los criterios eliminatorios son imprescindibles que ninguna nota compensa: criterios de selección que no cumple, una garantía que no obtendrá, un hueco de entrega que no tiene. Un solo eliminatorio no cumplido significa no ofertar.',
                  'Pieniądze to nie wszystko: praktyka bid/no-bid (Shipley, APMP) ocenia też dopasowanie — relacje z zamawiającym, pozycję konkurencyjną, zdolności, kluczowy personel, obłożenie, warunki umowy, płatności, strategię. Ocena = Σ waga × ocena ÷ (10 × Σ wag), 0–100. Kryteria eliminujące to warunki konieczne, których żadna ocena nie zrównoważy: niespełnione warunki udziału, gwarancja niemożliwa do uzyskania, brak terminu dostawy. Jedno niespełnione kryterium eliminujące oznacza rezygnację z oferty.') },
        policy: { title: T('How the decision is made', 'Як ухвалюється рішення', 'Wie die Entscheidung entsteht', 'Hoe de beslissing tot stand komt', 'Comment la décision est prise', 'Cómo se toma la decisión', 'Jak zapada decyzja'),
          body: T('A stated policy heuristic, in this order: a knock-out not met → NO BID; EV negative even with the strategic value → NO BID; EV negative in money but positive with the strategic value → STRATEGIC BID, which needs management sign-off; otherwise the score decides — at or above the bid threshold BID, between the review and bid thresholds BID WITH CONDITIONS (team, terms, price limits to agree), below the review threshold NO BID. Thresholds are your company policy.',
                  'Відкрита евристика політики, у такому порядку: невиконаний відсікач → НЕ ПОДАВАТИ; EV від’ємна навіть зі стратегічною цінністю → НЕ ПОДАВАТИ; EV від’ємна в грошах, але додатна зі стратегічною цінністю → СТРАТЕГІЧНА УЧАСТЬ, потрібне рішення керівництва; інакше вирішує бал — від порогу участі ПОДАВАТИ, між порогами перегляду й участі ПОДАВАТИ ЗА УМОВ (погодити команду, умови, межі ціни), нижче порогу перегляду НЕ ПОДАВАТИ. Пороги — політика вашої компанії.',
                  'Eine offengelegte Heuristik in dieser Reihenfolge: K.-o.-Kriterium nicht erfüllt → KEIN ANGEBOT; EW auch mit strategischem Wert negativ → KEIN ANGEBOT; EW in Geld negativ, mit strategischem Wert positiv → STRATEGISCHES ANGEBOT mit Freigabe der Geschäftsleitung; sonst entscheiden die Punkte — ab der Anbietschwelle ANBIETEN, zwischen Prüf- und Anbietschwelle ANBIETEN MIT AUFLAGEN (Team, Bedingungen, Preisgrenzen abstimmen), unter der Prüfschwelle KEIN ANGEBOT. Die Schwellen sind Ihre Firmenpolitik.',
                  'Een expliciete beleidsheuristiek, in deze volgorde: knock-out niet vervuld → NIET INSCHRIJVEN; VW negatief, ook met strategische waarde → NIET INSCHRIJVEN; VW negatief in geld maar positief met strategische waarde → STRATEGISCHE INSCHRIJVING, met akkoord van de directie; anders beslist de score — vanaf de drempel INSCHRIJVEN, tussen de herbekijk- en de inschrijfdrempel ONDER VOORWAARDEN (team, voorwaarden, prijsgrenzen afspreken), onder de herbekijkdrempel NIET INSCHRIJVEN. De drempels zijn uw bedrijfsbeleid.',
                  'Une heuristique explicite, dans cet ordre : critère éliminatoire non rempli → NO-GO ; VA négative même avec la valeur stratégique → NO-GO ; VA négative en argent mais positive avec la valeur stratégique → GO STRATÉGIQUE, à valider par la direction ; sinon la note décide — au-dessus du seuil go GO, entre le seuil de réexamen et le seuil go GO SOUS CONDITIONS (équipe, clauses, limites de prix à convenir), sous le seuil de réexamen NO-GO. Les seuils sont la politique de votre entreprise.',
                  'Una heurística explícita, en este orden: eliminatorio no cumplido → NO OFERTAR; VE negativo incluso con el valor estratégico → NO OFERTAR; VE negativo en dinero pero positivo con el valor estratégico → OFERTA ESTRATÉGICA, con aprobación de la dirección; si no, decide la nota: desde el umbral de ofertar OFERTAR, entre el umbral de revisión y el de ofertar OFERTAR CON CONDICIONES (equipo, cláusulas, límites de precio), por debajo del umbral de revisión NO OFERTAR. Los umbrales son la política de su empresa.',
                  'Jawna heurystyka, w tej kolejności: niespełnione kryterium eliminujące → NIE SKŁADAĆ; WO ujemna nawet z wartością strategiczną → NIE SKŁADAĆ; WO ujemna w pieniądzu, ale dodatnia z wartością strategiczną → OFERTA STRATEGICZNA, wymaga zgody zarządu; w pozostałych przypadkach decyduje ocena — od progu złożenia SKŁADAĆ, między progiem przeglądu a progiem złożenia SKŁADAĆ POD WARUNKAMI (ustalić zespół, warunki, limity ceny), poniżej progu przeglądu NIE SKŁADAĆ. Progi to polityka Twojej firmy.') },
        tornado: { title: T('What moves the answer', 'Що змінює відповідь', 'Was die Antwort bewegt', 'Wat het antwoord bepaalt', 'Ce qui fait varier la réponse', 'Qué cambia la respuesta', 'Co zmienia odpowiedź'),
          body: T('Each input is moved alone over its swing (probabilities ± points, margin ± points, bid cost and value ± %) and the EV recomputed. The longest bar is what to firm up before the bid board; a bar crossing zero means that input alone can flip the decision. Usually it is the win probability — the least known number.',
                  'Кожну вхідну величину змінюють окремо в її діапазоні (імовірності ± п. п., маржа ± п. п., витрати й вартість ± %) і перераховують EV. Найдовша смуга — те, що треба уточнити до тендерного комітету; смуга, що перетинає нуль, означає, що одна ця величина може змінити рішення. Зазвичай це імовірність перемоги — найменш відоме число.',
                  'Jede Eingabe wird einzeln über ihren Bereich verschoben (Wahrscheinlichkeiten ± Punkte, Marge ± Punkte, Angebotskosten und Wert ± %) und der EW neu berechnet. Der längste Balken ist das, was vor dem Angebotsgremium zu erhärten ist; ein Balken über die Null heißt, dass diese Eingabe allein die Entscheidung kippen kann. Meist ist es die Zuschlagswahrscheinlichkeit — die am wenigsten bekannte Zahl.',
                  'Elke invoer wordt afzonderlijk over haar marge verschoven (kansen ± punten, marge ± punten, offertekosten en waarde ± %) en de VW herberekend. De langste balk is wat u vóór het offertecomité hard moet maken; een balk over nul betekent dat die invoer alleen de beslissing kan doen kantelen. Meestal is het de kans op gunning — het minst gekende getal.',
                  'Chaque donnée est déplacée seule sur sa plage (probabilités ± points, marge ± points, coût d’offre et montant ± %) et la VA recalculée. La barre la plus longue est ce qu’il faut consolider avant le comité d’offre ; une barre qui traverse zéro signifie que cette donnée seule peut faire basculer la décision. C’est en général la probabilité de gain — le chiffre le moins connu.',
                  'Cada dato se mueve solo dentro de su rango (probabilidades ± puntos, margen ± puntos, coste de oferta e importe ± %) y se recalcula el VE. La barra más larga es lo que debe afinar antes del comité de ofertas; una barra que cruza cero indica que ese dato por sí solo puede cambiar la decisión. Suele ser la probabilidad de ganar, el número menos conocido.',
                  'Każdą daną zmienia się osobno w jej zakresie (prawdopodobieństwa ± pkt, marża ± pkt, koszt oferty i wartość ± %) i przelicza WO. Najdłuższy pasek to to, co trzeba doprecyzować przed komitetem ofertowym; pasek przecinający zero oznacza, że ta jedna dana może zmienić decyzję. Zwykle jest to prawdopodobieństwo wygranej — najmniej znana liczba.') }
      },
      tour: [

  }

  /* ---- project bar (tnd-core.js) ---- */
  var bar = null, useMsg = null;
  function projectPayload() {
    if (!last || !last.ok) return null;
    var mo = last.money;
    return {
      state: JSON.parse(JSON.stringify(state)),
      results: { decision: last.decision, reason: last.reason, ev: mo.EV, ev_with_strategic: mo.EVs, breakeven_p2: mo.breakeven, p_win: mo.Pwin, score: last.scoring.score,
                 bid_cost: mo.Btot, expected_bid_spend: mo.spend, knockouts_failed: last.failed, staged_vs_naive: last.input.procedure === 'two' ? { staged: mo.EV, naive: mo.naive } : null },
      summary: { text: last.decision + ': EV ' + Math.round(mo.EV) + ' EUR, score ' + (last.scoring.score == null ? '-' : Math.round(last.scoring.score)) + '/100' }
    };
  }
  function showUse(text, tone) {
    if (!useMsg) return;
    useMsg.textContent = text; useMsg.style.display = text ? '' : 'none';
    useMsg.style.borderColor = tone === 'bad' ? 'var(--bad,#c0392b)' : (tone === 'warn' ? 'var(--warn,#d68910)' : 'var(--line,#e2e7ee)');
  }
  var TWO_STAGE = { restricted: 1, 'competitive-negotiation': 1, 'competitive-dialogue': 1, 'innovation-partnership': 1 };
  /* "Use": restore our own module state, or take the tender value, procedure and reference from the shared tender block */
  function useProject(doc, moduleId) {
    var L = lang();
    if (!doc || typeof doc !== 'object') { showUse(S.useNone[L], 'warn'); return { ok: false }; }
    var mod = doc.modules && doc.modules[TOOL];
    if ((moduleId === TOOL || !moduleId) && mod && mod.state && typeof mod.state === 'object') {
      var clean = sanitize(mod.state), warn = sanitizeWarn.slice();
      if (clean.V > 0) {
        Object.keys(DEFAULTS).forEach(function (k) { state[k] = JSON.parse(JSON.stringify(DEFAULTS[k])); });
        localiseDefaults(state);
        Object.keys(clean).forEach(function (k) { state[k] = clean[k]; });
        if (ui) { ui.sync(); ui.run(); }
        showUse(S.useTaken[L] + ': ' + (mod.summary && mod.summary.text || TOOL) + (warn.length ? ' · ' + S.impWarn[L] + ': ' + warn.map(function (w) { return w === 'ko' ? S.nKoUnclear[L] : S.nThresholds[L]; }).join(' ') : ''), warn.length ? 'warn' : 'ok');
        return { ok: true, from: 'module' };
      }
    }
    var t = doc.tender || {};
    if (!(typeof t.value_est === 'number' && isFinite(t.value_est) && t.value_est > 0 && t.value_est <= 1e11)) { showUse(S.useNone[L], 'warn'); return { ok: false }; }
    state.V = t.value_est;
    if (typeof t.procedure === 'string' && t.procedure) state.procedure = TWO_STAGE[t.procedure] ? 'two' : 'single';
    if (typeof t.reference === 'string' && t.reference) state.tenderRef = t.reference.slice(0, 200);
    else if (typeof t.title === 'string' && t.title) state.tenderRef = t.title.slice(0, 200);
    var nb = (doc.parties || []).filter(function (p) { return p && p.role === 'bidder'; }).length;
    if (nb >= 2 && nb <= 50) state.N = nb;
    if (ui) { ui.sync(); ui.run(); }
    showUse(S.useTaken[L] + ': ' + eur(state.V, L) + (state.tenderRef ? ' · ' + state.tenderRef : ''), 'ok');
    return { ok: true, from: 'tender' };
  }
  function mountBar(box) {
    var C = core();
    if (!C || !C.ui || typeof C.ui.projectBar !== 'function') return;
    try {
      var lc = document.createElement('div'); box.appendChild(lc);
      if (typeof C.ui.lifecycle === 'function') C.ui.lifecycle({ mount: lc, toolId: TOOL, role: 'contractor', lang: lang });
      var bx = document.createElement('div'); box.appendChild(bx);
      var stored = null; try { stored = C.project.load(); } catch (e) { stored = null; }
      bar = C.ui.projectBar({ mount: bx, toolId: TOOL, lang: lang, doc: stored || C.project.empty({ role: 'contractor', lang: lang() }),
        getDoc: function () { var p = projectPayload(), d = bar ? bar.getDoc() : C.project.empty(); return p ? C.project.withModule(d, TOOL, p) : d; },
        onChange: function () { },
        onUse: function (id, mod, doc) { useProject(doc, id); } });
      if (bar && bar.element) {
        var css = 'min-height:var(--ctl-h,32px);padding:0 10px;border:1px solid var(--line,#e2e7ee);border-radius:var(--radius-sm,8px);background:var(--panel-2,#f9fafc);color:var(--ink,#12161d);cursor:pointer;font:inherit';
        var b = document.createElement('button');
        b.type = 'button'; b.setAttribute('data-tnd', 'save-module'); b.textContent = '↥ ' + S.save[lang()]; b.style.cssText = css;
        b.addEventListener('click', function () { var p = projectPayload(); if (p && bar) bar.commit(p); });
        var u = document.createElement('button');
        u.type = 'button'; u.setAttribute('data-tnd', 'use-tender'); u.textContent = S.useTender[lang()]; u.style.cssText = css;
        u.addEventListener('click', function () { if (bar) useProject(bar.getDoc(), 'tender'); });
        var head = bar.element.firstChild; if (head) { head.appendChild(b); head.appendChild(u); }
        useMsg = document.createElement('div');
        useMsg.setAttribute('role', 'status'); useMsg.setAttribute('data-tnd', 'use-msg');
        useMsg.style.cssText = 'display:none;margin-top:6px;padding:6px 8px;border:1px solid var(--line,#e2e7ee);border-left-width:4px;border-radius:var(--radius-sm,8px);font-size:0.92em';
        bar.element.appendChild(useMsg);
      }
    } catch (e) { bar = null; }
  }

  var DEF_CK = ['rel', 'comp', 'tech', 'staff', 'load', 'terms', 'pay', 'margin', 'fit', 'follow'], DEF_KO = ['erkenning', 'bond', 'exclusion'];
  function localiseDefaults(t) {

    (t.ko || []).forEach(function (c, k) { var key = DEF_KO[k]; if (key && c && c.name === KOK[key].en) c.name = KOK[key][l]; });
    return t;
  }

        title: T('Engineering and commercial analysis, not legal advice', 'Інженерно-комерційний аналіз, не юридична консультація', 'Technisch-kaufmännische Analyse, keine Rechtsberatung', 'Technisch-commerciële analyse, geen juridisch advies', 'Analyse technique et commerciale, pas un avis juridique', 'Análisis técnico y comercial, no asesoramiento jurídico', 'Analiza techniczno-handlowa, nie porada prawna'),
        text: T('The decision rule, thresholds and weights are a stated company policy, not a standard. The expected value is only as good as the win probability you enter.', 'Правило рішення, пороги й ваги — відкрита політика компанії, а не стандарт. Очікувана вартість не краща за введену імовірність перемоги.', 'Entscheidungsregel, Schwellen und Gewichte sind eine offengelegte Firmenpolitik, keine Norm. Der Erwartungswert ist nur so gut wie die eingegebene Zuschlagswahrscheinlichkeit.', 'De beslisregel, drempels en wegingen zijn een expliciet bedrijfsbeleid, geen norm. De verwachte waarde is maar zo goed als de ingevoerde kans op gunning.', 'La règle de décision, les seuils et les poids sont une politique d’entreprise explicite, pas une norme. La valeur attendue ne vaut que par la probabilité de gain saisie.', 'La regla de decisión, los umbrales y los pesos son una política de empresa explícita, no una norma. El valor esperado solo es tan bueno como la probabilidad de ganar introducida.', 'Reguła decyzji, progi i wagi to jawna polityka firmy, a nie norma. Wartość oczekiwana jest tak dobra, jak wprowadzone prawdopodobieństwo wygranej.') }],

        { id: 'cost', slot: 'inputs', title: S.pCost, fields: [

          { id: 'f-h1', key: 'h1', type: 'number', unit: 'h', min: 0, max: 100000, step: 'any', precision: 0, label: S.h1, learn: 'gates', visible: isTwo },
          { id: 'f-x1', key: 'x1', type: 'number', unit: '€', min: 0, max: 1e8, step: 'any', precision: 0, label: S.x1, learn: 'gates', visible: isTwo },

      footer: T('Method: decision tree with expected value (H. Raiffa, Decision Analysis, 1968; R. T. Clemen, Making Hard Decisions, 1996, ch. 3–4); bid/no-bid scoring, knock-outs and hit rate after Shipley Associates and the APMP Body of Knowledge (practice). Law: Wet 17.06.2016 art. 79 §2 and art. 149 (number of candidates invited, classic / special sectors), Dir. 2014/24/EU art. 65(2), Dir. 2014/25/EU art. 78(2).',
                'Метод: дерево рішень з очікуваною вартістю (H. Raiffa, Decision Analysis, 1968; R. T. Clemen, Making Hard Decisions, 1996, розд. 3–4); оцінювання bid/no-bid, відсікачі й відсоток перемог за практикою Shipley Associates та APMP Body of Knowledge. Право: Закон Бельгії 17.06.2016 ст. 79 §2 і ст. 149 (кількість запрошених кандидатів, класичні / спеціальні сектори), Дир. 2014/24/ЄС ст. 65(2), Дир. 2014/25/ЄС ст. 78(2).',
                'Methode: Entscheidungsbaum mit Erwartungswert (H. Raiffa, Decision Analysis, 1968; R. T. Clemen, Making Hard Decisions, 1996, Kap. 3–4); Bid/No-Bid-Bewertung, K.-o.-Kriterien und Trefferquote nach Shipley Associates und APMP Body of Knowledge (Praxis). Recht: belg. Gesetz 17.06.2016 Art. 79 §2 und Art. 149 (Zahl der eingeladenen Bewerber, klassische Sektoren / Sektoren), RL 2014/24/EU Art. 65 Abs. 2, RL 2014/25/EU Art. 78 Abs. 2.',
                'Methode: beslissingsboom met verwachte waarde (H. Raiffa, Decision Analysis, 1968; R. T. Clemen, Making Hard Decisions, 1996, hfst. 3–4); bid/no-bidscore, knock-outs en slaagkans volgens Shipley Associates en het APMP Body of Knowledge (praktijk). Recht: wet 17.06.2016 art. 79 §2 en art. 149 (aantal uitgenodigde kandidaten, klassieke / speciale sectoren), richtlijn 2014/24/EU art. 65, lid 2, richtlijn 2014/25/EU art. 78, lid 2.',
                'Méthode : arbre de décision avec valeur attendue (H. Raiffa, Decision Analysis, 1968 ; R. T. Clemen, Making Hard Decisions, 1996, chap. 3–4) ; notation go/no-go, critères éliminatoires et taux de réussite d’après Shipley Associates et l’APMP Body of Knowledge (pratique). Droit : loi du 17.06.2016 art. 79 §2 et art. 149 (nombre de candidats invités, secteurs classiques / spéciaux), directive 2014/24/UE art. 65, §2, directive 2014/25/UE art. 78, §2.',
                'Método: árbol de decisión con valor esperado (H. Raiffa, Decision Analysis, 1968; R. T. Clemen, Making Hard Decisions, 1996, cap. 3–4); puntuación de la decisión de ofertar, eliminatorios y tasa de éxito según Shipley Associates y el APMP Body of Knowledge (práctica). Derecho: ley belga 17.06.2016 art. 79 §2 y art. 149 (número de candidatos invitados, sectores clásicos / especiales), Directiva 2014/24/UE art. 65.2, Directiva 2014/25/UE art. 78.2.',
                'Metoda: drzewo decyzyjne z wartością oczekiwaną (H. Raiffa, Decision Analysis, 1968; R. T. Clemen, Making Hard Decisions, 1996, rozdz. 3–4); ocena bid/no-bid, kryteria eliminujące i wskaźnik wygranych wg Shipley Associates i APMP Body of Knowledge (praktyka). Prawo: ustawa belg. 17.06.2016 art. 79 §2 i art. 149 (liczba zaproszonych kandydatów, sektory klasyczne / użyteczności publicznej), dyrektywa 2014/24/UE art. 65 ust. 2, dyrektywa 2014/25/UE art. 78 ust. 2.'),

    ui.panel({ id: 'io', slot: 'inputs', actionsAlign: 'end',

                 { label: T('JSON', 'JSON', 'JSON', 'JSON', 'JSON', 'JSON', 'JSON'), run: function () { var r = buildRecord(); if (r) download('bidnobid.json', 'application/json', JSON.stringify(r, null, 2)); } },
                 ui.resetAction() ] });
    ui.examples(buildExamples());
    stage = ui.stage({
      caption: S.stageCap, minHeight: 440,

          last.tornado.bars.map(function (b) { return str(S.vNames[b.id], l) + ' ' + keur(b.low, l) + '…' + keur(b.high, l); }).join('; ') + '.';
      },
      render: renderStage
    });
    ui.ready();
    window.__bidnobid = { ui: ui, state: state, solve: solve, engineInput: engineInput, last: function () { return last; }, csv: csvText, record: buildRecord,
      projectPayload: projectPayload, useProject: useProject, sanitize: sanitize, applyPreset: function (id) {
        var p = lib().PRESETS.filter(function (x) { return x.id === id; })[0]; if (!p) return false; applyPreset(state, p); ui.sync(); ui.run(); return true; },
      analyse: function (inp) { return lib().analyse(inp); } };
