  function degrade() {
    document.title = 'diagram-ui.js v1 is required';
    var host = document.getElementById('app') || document.body;
    var h = document.createElement('h1'); h.textContent = 'Bid / No-Bid Decision';
    var p = document.createElement('p'); p.textContent = 'The interactive interface could not load. The export, the calculation record and the limitations are still available from the bar at the bottom of the page.';
    host.appendChild(h); host.appendChild(p);
    last = solve(state);
  }
  function boot() {
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }

  /* ======================================================= 3. the data layer */
  function csvText() {
    var r = last;
    if (!r || !r.ok) return '';
    var mo = r.money, n = r.input, rows = [];
    function add(sec, item, v, unit) { rows.push([sec, item, v == null ? '' : v, unit || '']); }
    add('decision', 'decision', r.decision); add('decision', 'reason', r.reason); add('decision', 'knockouts_failed', r.failed.join(' '));
    add('money', 'procedure', n.procedure); add('money', 'contract_value', n.V, 'EUR'); add('money', 'margin', n.m, 'fraction'); add('money', 'margin_erosion', n.r, 'fraction');
    add('money', 'opportunity_cost', n.C, 'EUR'); add('money', 'strategic_value', n.S, 'EUR');
    add('money', 'net_contribution_M', mo.M, 'EUR'); add('money', 'qualification_cost_B1', mo.B1, 'EUR'); add('money', 'tender_cost_B2', mo.B2, 'EUR');
    add('money', 'p_shortlist', n.p1, 'fraction'); add('money', 'p_award', n.p2, 'fraction'); add('money', 'p_win', mo.Pwin, 'fraction');
    add('money', 'value_of_tender_EV2', mo.EV2, 'EUR'); add('money', 'expected_value', mo.EV, 'EUR'); add('money', 'expected_value_with_strategic', mo.EVs, 'EUR');
    if (n.procedure === 'two') add('money', 'all_costs_up_front', mo.naive, 'EUR');
    add('money', 'breakeven_p_award', mo.breakeven, 'fraction'); add('money', 'base_rate_1_over_N', mo.base, 'fraction'); add('money', 'strategic_value_needed', mo.Sneed, 'EUR');
    add('money', 'expected_bid_spend', mo.spend, 'EUR'); add('money', 'bid_spend_per_win', mo.perWin, 'EUR'); add('money', 'return_on_bid_spend', mo.roi, 'x');
    r.scoring.rows.forEach(function (c) { add('criterion', c.name || c.id, c.score, 'score 0-10, weight ' + c.weight + ', group ' + c.group); });
    add('criterion', 'attractiveness_score', r.scoring.score, '0-100');
    n.ko.forEach(function (k) { add('knockout', k.name || k.id, k.met ? 'met' : 'NOT MET'); });
    r.tornado.bars.forEach(function (b) { add('tornado', b.id, b.low, 'EV at low (EUR); EV at high ' + b.high + (b.flips ? '; flips' : '')); });
    var C = core(), cols = ['section', 'item', 'value', 'unit_or_note'];
    if (C && C.csv) return C.csv(rows, cols);
    return cols.join(',') + '\r\n' + rows.map(function (x) { return x.map(function (v) { v = String(v); if (/^[=+\-@\t\r]/.test(v) && isNaN(+v)) v = '\'' + v; return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n') + '\r\n';
  }
  function download(name, type, text) {
    var a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: type }));
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function buildRecord() {
    if (!last) return null;
    var inputs = {}, outputs = {}, units = {}, warnings = [];
    inputs.tender_reference = state.tenderRef; inputs.prepared_by = state.preparedBy;
    inputs.gates = state.procedure; inputs.contract_value = state.V; units.contract_value = 'EUR';
    inputs.margin = state.m; inputs.margin_erosion = state.r; units.margin = units.margin_erosion = '% of price';
    inputs.opportunity_cost = state.C; inputs.strategic_value = state.S; units.opportunity_cost = units.strategic_value = 'EUR';
    inputs.hourly_rate = state.rate; units.hourly_rate = 'EUR/h';
    if (state.procedure === 'two') { inputs.qualification_hours = state.h1; inputs.qualification_external = state.x1; inputs.p_shortlist = state.p1; units.p_shortlist = '%'; }
    inputs.tender_hours = state.h2; inputs.tender_external = state.x2; inputs.p_award = state.p2; units.p_award = '%';
    inputs.bidders = state.N; inputs.hit_rate = state.h; units.hit_rate = '%';
    inputs.criteria = (state.criteria || []).map(function (c) { return c.name + ' [' + c.group + '] w ' + c.weight + ' s ' + c.score; }).join('; ');
    inputs.knockouts = (state.ko || []).map(function (k) { return k.name + ': ' + (k.met === true ? 'met' : (k.unclear ? 'NOT MET (unclear in import)' : 'NOT MET')); }).join('; ');
    inputs.thresholds = 'bid ' + state.go + ', review ' + state.review;
    if (last.ok) {
      var mo = last.money;
      outputs.decision = last.decision; outputs.reason = last.reason;
      outputs.expected_value = mo.EV; outputs.expected_value_with_strategic = mo.EVs; units.expected_value = units.expected_value_with_strategic = 'EUR';
      if (last.input.procedure === 'two') { outputs.all_costs_up_front = mo.naive; outputs.gate2 = mo.submit ? 'submit' : 'withdraw'; }
      outputs.net_contribution = mo.M; outputs.bid_cost = mo.Btot; outputs.expected_bid_spend = mo.spend;
      outputs.breakeven_p_award = mo.breakeven; outputs.base_rate = mo.base; outputs.p_win = mo.Pwin;
      outputs.strategic_value_needed = mo.Sneed; outputs.bid_spend_per_win = mo.perWin; outputs.return_on_bid_spend = mo.roi;
      outputs.attractiveness_score = last.scoring.score; units.attractiveness_score = '0-100';
      outputs.tornado = last.tornado.bars.map(function (b) { return b.id + ': ' + Math.round(b.low) + ' .. ' + Math.round(b.high) + (b.flips ? ' (flips)' : ''); }).join('; ');
      if (last.flags.length) warnings.push('flags: ' + last.flags.join(', '));
    } else warnings.push('invalid input: ' + ((last && last.errors) || []).join(', '));
    warnings.push('Engineering and commercial analysis, not legal advice. The decision rule, thresholds and weights are a stated company policy (learning assumptions).');
    return {
      inputs: inputs, outputs: outputs, units: units,
      model: {
        equations: ['M = V (m - r) - C', 'B1 = h1 rate + x1 (two gates), B2 = h2 rate + x2', 'one gate: EV = p2 M - B2', 'two gates: EV = p1 max(p2 M - B2, 0) - B1; all costs up front = p1 p2 M - B1 - B2',
                    'EV with strategic value: same tree with payoff M + S', 'breakeven p2 = (B2 + B1/p1)/M', 'strategic value needed = (B2 + B1/p1)/p2 - M when EV < 0',
                    'gate-2 policy: submit if EV2 >= 0 (if only S makes the bid pay: if p2 (M + S) - B2 >= 0), else withdraw', 'expected bid spend = B1 + p1 B2 if the policy submits, else B1; p_win = p1 p2 if it submits, else 0; per win = spend/p_win; return = p_win M/spend', 'score = 100 sum(w s)/(10 sum w)',
                    'decision: knock-out not met (or unclear) -> nobid; EV < 0 and EVs < 0 -> nobid; EV < 0 <= EVs -> strategic; no score -> conditions (unscored); score >= go -> bid; >= review -> conditions; else nobid',
                    'tornado: one input at a time over its swing (p +- dp, m +- dm, V and bid cost +- %)'],
        ranges: ['up to 12 criteria, up to 6 knock-outs'],
        notes: ['Raiffa 1968; Clemen 1996 ch. 3-4; Shipley / APMP bid/no-bid practice', 'Wet 17.06.2016 art. 79 par. 1-2 (classic sectors): if the authority limits the number, restricted procedure at least 5 candidates invited, competitive negotiation / dialogue / innovation partnership at least 3, fewer if fewer qualify; art. 149 (special sectors, Dir. 2014/25/EU art. 78(2)): number set by the entity, no legal minimum, sufficient competition', 'optimism flags p2 > 2/N and p2 > 2h: rule of thumb of this tool (learning assumption)']
      },
      warnings: warnings
    };
  }
  var LIM = { V: [0, 1e11], m: [-50, 80], r: [0, 50], C: [0, 1e10], S: [0, 1e10], rate: [0, 1000], h1: [0, 100000], x1: [0, 1e8], h2: [0, 200000], x2: [0, 1e9],
              p1: [0, 100], p2: [0, 100], N: [1, 50], h: [0, 100], go: [0, 100], review: [0, 100], dp: [0, 50], dm: [0, 20], dB: [0, 100], dV: [0, 100] };
  var ENUM = { procedure: ['single', 'two'] };
  var GROUPS = ['client', 'capability', 'capacity', 'risk', 'strategy'];
  function fin(v, lo, hi) { return typeof v === 'number' && isFinite(v) && v >= lo && v <= hi; }
  /* permalink / project import: known keys only, numbers within the field limits, enums checked, lists rebuilt */
  var sanitizeWarn = [];
  function sanitize(o) {
    var out = {};
    sanitizeWarn = [];
    if (!o || typeof o !== 'object' || Array.isArray(o)) return out;
    Object.keys(DEFAULTS).forEach(function (k) {
      if (!Object.prototype.hasOwnProperty.call(o, k)) return;
      var v = o[k];
      if (ENUM[k]) { if (ENUM[k].indexOf(String(v)) >= 0) out[k] = String(v); return; }
      if (LIM[k]) { v = typeof v === 'string' && v.trim() !== '' ? +v : v; if (fin(v, LIM[k][0], LIM[k][1])) out[k] = v; return; }
      if (k === 'criteria' && Array.isArray(v)) {
        out.criteria = v.slice(0, MAXC).filter(function (c) { return c && typeof c === 'object'; }).map(function (c) {
          return { name: String(c.name == null ? '' : c.name).slice(0, 80), group: GROUPS.indexOf(c.group) >= 0 ? c.group : 'client',
                   weight: fin(+c.weight, 0, 100) ? +c.weight : 0, score: fin(+c.score, 0, 10) ? +c.score : 0 };
        });
        return;
      }
      if (k === 'ko' && Array.isArray(v)) {
        out.ko = v.slice(0, MAXK).filter(function (c) { return c && typeof c === 'object'; }).map(function (c) {
          /* fail safe: only true / 1 / "true" / "1" are met; false / 0 / "false" / "0" not met; anything else not met and marked unclear */
          var yes = [true, 1, 'true', '1'].indexOf(c.met) >= 0, no = [false, 0, 'false', '0'].indexOf(c.met) >= 0;
          var row = { name: String(c.name == null ? '' : c.name).slice(0, 120), met: yes };
          if (!yes && !no) { row.unclear = true; sanitizeWarn.push('ko'); }
          return row;
        });
        return;
      }
      if (typeof v === 'string' && (k === 'tenderRef' || k === 'preparedBy')) out[k] = v.slice(0, 200);
    });
    /* review must not exceed go (also against the current value of the other one) */
    var g = out.go != null ? out.go : state.go, rv = out.review != null ? out.review : state.review;
    if (rv > g) { out.go = rv; out.review = g; sanitizeWarn.push('thresholds'); }
    return out;
  }
  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: TOOL, file: 'bidnobid.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { var c = sanitize(o), w = sanitizeWarn.slice(); Object.keys(c).forEach(function (k) { state[k] = c[k]; }); last = solve(state); if (ui) { ui.sync(); ui.run(); } if (w.indexOf('thresholds') >= 0) showUse(S.impWarn[lang()] + ': ' + S.nThresholds[lang()], 'warn'); }
        },
        record: buildRecord
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
