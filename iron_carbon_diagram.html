/* AGENTS.md §3 — language precedence: ?lang=xx, then localStorage.diagram_lang,
   then the browser, then English. window.__diagramLang is what the shared
   bootstrap already resolved from exactly that chain. diagram-ui.js resolves the
   same chain; pickLang() is kept for the fallback boot, where it is the only
   resolver on the page. */
const SITE_LANGS=['en','uk','de','nl','fr','es','pl'];
function pickLang(){
  const sup=Object.keys(I18N);
  const norm=v=>String(v||"").slice(0,2).toLowerCase();
  const ok=v=>sup.indexOf(norm(v))>=0;
  let q=null; try{q=new URLSearchParams(location.search).get("lang");}catch(e){}
  if(ok(q))return norm(q);
  if(ok(window.__diagramLang))return norm(window.__diagramLang);
  try{const x=localStorage.getItem("diagram_lang"); if(ok(x))return norm(x);}catch(e){}
  const nav=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
  for(let i=0;i<nav.length;i++){ if(ok(nav[i]))return norm(nav[i]); }
  return "en";
}
let lang = pickLang();
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;
/* a localized object for the framework, from the tool's own dictionary … */
function K(key){ const o={}; SITE_LANGS.forEach(l=>{o[l]=(I18N[l]&&I18N[l][key])||I18N.en[key];}); return o; }
/* … or composed from it */
function L6(fn){ const o={}; SITE_LANGS.forEach(l=>{o[l]=fn(I18N[l],l);}); return o; }
function T6(en,uk,de,nl,fr,es,pl){ return {en,uk,de,nl,fr,es,pl:pl||en}; }
function MAN(){ try{ return JSON.parse(document.getElementById('diagram-tool-manifest').textContent); }catch(e){ return null; } }

/* ============================ Key points & phase model ============================ */
const CEM = 6.67;          // cementite composition
const P_C = 0.022, S_C = 0.76, E_C = 2.14, EU_C = 4.30; // ferrite max, eutectoid, austenite max, eutectic
const lerp = (x,x0,x1,y0,y1)=> y0 + (y1-y0)*(x-x0)/(x1-x0);

// Liquidus temperature as a function of carbon
function liquidus(c){
  if(c<=0.53) return lerp(c,0,0.53,1538,1493);
  if(c<=EU_C) return lerp(c,0.53,EU_C,1493,1147);
  return lerp(c,EU_C,CEM,1147,1252);          // Fe3C melts ~1252 °C
}

// Phase colors
const PC = { L:"#8ecae6", delta:"#ffd6a5", gamma:"#a7e0a0", alpha:"#f4b8c1", Fe3C:"#c9b6e4",
             pearlite:"#f0c987", ledeburite:"#d6c3a0" };

function lever(c,left,right){ // fraction of LEFT phase and RIGHT phase
  const fL = (right-c)/(right-left);
  return { left: Math.max(0,Math.min(1,fL)), right: Math.max(0,Math.min(1,1-fL)) };
}

// Returns {kind:'single'|'two', phases:[{key,frac}]}
function phaseAt(c,T){
  if(c<0||c>CEM||T<200||T>1600) return null;
  const TL = liquidus(c);
  if(T>=TL) return {kind:'single', phases:[{key:'L',frac:1}]};

  // ---- band: T >= 1493 (peritectic and above) ----
  if(T>=1493){
    const sAH = lerp(T,1538,1493,0,0.09);   // solidus (A-H)
    const lAB = lerp(T,1538,1493,0,0.53);   // liquidus (A-B)
    if(c<=sAH) return {kind:'single',phases:[{key:'delta',frac:1}]};
    if(c<=lAB){ const f=lever(c,sAH,lAB); return {kind:'two',phases:[{key:'delta',frac:f.left},{key:'L',frac:f.right}]}; }
    return {kind:'single',phases:[{key:'L',frac:1}]};
  }
  // ---- band: 1394 <= T < 1493 (delta / delta+gamma / gamma / L+gamma) ----
  if(T>=1394){
    const dSolv = lerp(T,1394,1493,0,0.09);   // N-H  (delta / delta+gamma)
    const njC   = lerp(T,1394,1493,0,0.16);   // N-J  (delta+gamma / gamma)
    const gSol  = lerp(T,1493,1147,0.16,E_C); // J-E  solidus (gamma / L+gamma)
    const lBC   = lerp(T,1493,1147,0.53,EU_C);// B-C  liquidus
    if(c<=dSolv) return {kind:'single',phases:[{key:'delta',frac:1}]};
    if(c<=njC){ const f=lever(c,dSolv,njC); return {kind:'two',phases:[{key:'delta',frac:f.left},{key:'gamma',frac:f.right}]}; }
    if(c<=gSol) return {kind:'single',phases:[{key:'gamma',frac:1}]};
    if(c<=lBC){ const f=lever(c,gSol,lBC); return {kind:'two',phases:[{key:'gamma',frac:f.left},{key:'L',frac:f.right}]}; }
    return {kind:'single',phases:[{key:'L',frac:1}]};
  }
  // ---- band: 1147 <= T < 1394 ----
  if(T>=1147){
    const gSol = lerp(T,1493,1147,0.16,E_C);
    const lBC  = lerp(T,1493,1147,0.53,EU_C);
    const lCD  = lerp(T,1147,1252,EU_C,CEM);   // C-D liquidus (cementite side)
    if(c<=gSol) return {kind:'single',phases:[{key:'gamma',frac:1}]};
    if(c<=lBC){ const f=lever(c,gSol,lBC); return {kind:'two',phases:[{key:'gamma',frac:f.left},{key:'L',frac:f.right}]}; }
    if(c<=lCD) return {kind:'single',phases:[{key:'L',frac:1}]};
    const f=lever(c,lCD,CEM); return {kind:'two',phases:[{key:'L',frac:f.left},{key:'Fe3C',frac:f.right}]};
  }
  // ---- band: 727 <= T < 1147 ----
  if(T>=727){
    const ferrGP = (T<=912)? lerp(T,912,727,0,P_C) : 0;    // G-P  (alpha / alpha+gamma)
    const gLeft  = (T<=912)? lerp(T,912,727,0,S_C) : 0;    // G-S  A3 (alpha+gamma / gamma)
    const gRight = lerp(T,1147,727,E_C,S_C);               // E-S  Acm (gamma / gamma+Fe3C)
    if(T<=912 && c<=ferrGP) return {kind:'single',phases:[{key:'alpha',frac:1}]};
    if(T<=912 && c<=gLeft){ const f=lever(c,ferrGP,gLeft); return {kind:'two',phases:[{key:'alpha',frac:f.left},{key:'gamma',frac:f.right}]}; }
    if(c<=gRight) return {kind:'single',phases:[{key:'gamma',frac:1}]};
    const f=lever(c,gRight,CEM); return {kind:'two',phases:[{key:'gamma',frac:f.left},{key:'Fe3C',frac:f.right}]};
  }
  // ---- band: T < 727 (below eutectoid) ----
  const ferrMax = lerp(T,727,200,P_C,0.008);   // P-Q ferrite solvus
  if(c<=ferrMax) return {kind:'single',phases:[{key:'alpha',frac:1}]};
  const f=lever(c,ferrMax,CEM); return {kind:'two',phases:[{key:'alpha',frac:f.left},{key:'Fe3C',frac:f.right}]};
}

/* ============================ Room-temperature microstructure ============================ */
function microstructure(c){
  if(c<P_C) return {cls:'ferriteAlloy', parts:[{k:'alpha',f:1}]};
  // the snap bands are tested first so that they are symmetric about the invariant
  // composition; applied after the "hypo" test they only ever caught the upper half
  if(Math.abs(c-S_C)<0.015) return {cls:'eutS', parts:[{k:'pearlite',f:1}]};
  if(c<S_C){ const pearl=(c-P_C)/(S_C-P_C);
    return {cls:'hypoS', parts:[{k:'proF',f:1-pearl},{k:'pearlite',f:pearl}]}; }
  if(c<E_C){ const cem=(c-S_C)/(CEM-S_C);
    return {cls:'hyperS', parts:[{k:'pearlite',f:1-cem},{k:'secC',f:cem}]}; }
  if(Math.abs(c-EU_C)<0.03) return {cls:'eutCI', parts:[{k:'ledeburite',f:1}]};
  if(c<EU_C) return {cls:'hypoCI', parts:[{k:'pearlite',f:null},{k:'secC',f:null},{k:'ledeburite',f:null}]};
  return {cls:'hyperCI', parts:[{k:'priC',f:null},{k:'ledeburite',f:null}]};
}

/* ============================ Canvas drawing ============================
   The drawing is the baseline drawing: the same polylines, the same region
   labels, the same invariant points, the same per-column sampling of phaseAt().
   What changed is that the geometry comes from the stage instead of a fixed
   920x640 canvas (spec §10 / UI_AUDIT S-13: the old canvas rendered at 37 % of
   its design width on a phone), and that the chrome colours — background, grid,
   axes, text — come from the token layer. The phase palette, the boundary
   colours and the invariant markers are the diagram's own key: they are data,
   and they are unchanged. */
const C0=0, C1=CEM, T0=200, T1=1600;
/* the old page had one margin set for one 920 px canvas; the stage hands over
   whatever width the column has, so the margins follow the width and the plot
   never collapses into its own labels */
const FINE={l:64,r:120,t:38,b:56}, MID={l:56,r:72,t:32,b:48}, COARSE={l:52,r:44,t:26,b:40};

function geom(W,H,coarse){
  const M=(coarse||W<520)?COARSE:(W<760?MID:FINE);
  const PW=Math.max(10,W-M.l-M.r), PH=Math.max(10,H-M.t-M.b);
  /* below this the small annotations stop being readable and start colliding */
  const tight=coarse||PW<300;
  return {M,PW,PH,W,H,coarse,tight,
    X:c=>M.l+(c-C0)/(C1-C0)*PW,
    Y:T=>M.t+(T1-T)/(T1-T0)*PH,
    invX:px=>C0+(px-M.l)/PW*(C1-C0),
    invY:py=>T1-(py-M.t)/PH*(T1-T0)};
}
let GEO=geom(920,640,false);   /* the geometry the last paint used */

/* PC — the phase colour key — comes with the model block above, unchanged. */

const POLY = { // boundary polylines in (c,T)
  liquidus:[[0,1538],[0.53,1493],[EU_C,1147],[CEM,1252]],
  solidus:[[0,1538],[0.09,1493],[0.16,1493],[E_C,1147]],
  peritectic:[[0.09,1493],[0.53,1493]],
  eutectic:[[E_C,1147],[CEM,1147]],
  NH:[[0,1394],[0.09,1493]],
  NJ:[[0,1394],[0.16,1493]],
  GS:[[0,912],[S_C,727]],
  ES:[[E_C,1147],[S_C,727]],
  GP:[[0,912],[P_C,727]],
  A1:[[P_C,727],[S_C,727],[CEM,727]],
  PQ:[[P_C,727],[0.008,200]],
  cementite:[[CEM,1252],[CEM,200]]
};
const REGION_LABELS = [
  {c:0.55,T:1560,k:'L',big:true},
  {c:0.30,T:1512,k:'LdL',txt:'L+δ',s:11},
  {c:0.045,T:1455,k:null,txt:'δ',s:12},
  {c:0.28,T:1430,k:null,txt:'δ+γ',s:11},
  {c:1.5,T:1250,k:'gamma',big:true},
  {c:2.9,T:1330,k:null,txt:'L+γ',s:13},
  {c:5.35,T:1230,k:null,txt:'L+Fe₃C',s:13},
  {c:3.4,T:930,k:null,txt:'γ+Fe₃C',s:13},
  {c:0.30,T:815,k:null,txt:'α+γ',s:11},
  {c:0.16,T:640,k:null,txt:'α',s:12},
  {c:2.9,T:470,k:null,txt:'α+Fe₃C',s:13},
];
const INV_PTS = [
  {c:0.16,T:1493,lbl:'J', react:'peritectic', eq:'δ + L → γ'},
  {c:EU_C,T:1147,lbl:'C', react:'eutectic',   eq:'L → γ(2.14) + Fe₃C'},
  {c:S_C, T:727, lbl:'S', react:'eutectoid',  eq:'γ → α(0.022) + Fe₃C'},
  {c:E_C, T:1147,lbl:'E', react:null, eq:null},
  {c:P_C, T:727, lbl:'P', react:null, eq:null},
];

function mix(a,b){
  const pa=hx(a), pb=hx(b);
  return `rgb(${(pa[0]+pb[0])>>1},${(pa[1]+pb[1])>>1},${(pa[2]+pb[2])>>1})`;
}
function hx(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }

function palette(){
  const cs=window.getComputedStyle(document.documentElement);
  const g=(n,f)=>{ const v=cs.getPropertyValue(n); return (v&&v.trim())||f; };
  /* the fallbacks are the light values of the token layer, so the drawing is
     unchanged when diagram-ui.js is missing */
  return { panel:g('--panel','#ffffff'), ink:g('--ink','#12161d'),
           muted:g('--muted','#5b6675'), line:g('--line','#e2e7ee'),
           accent:g('--accent','#0b6efd'), font:g('--font','Segoe UI, sans-serif') };
}
function drawPoly(g,G,pts,color,width,dash){
  g.save(); g.strokeStyle=color; g.lineWidth=width; g.setLineDash(dash||[]);
  g.beginPath(); pts.forEach((p,i)=> i? g.lineTo(G.X(p[0]),G.Y(p[1])) : g.moveTo(G.X(p[0]),G.Y(p[1])) );
  g.stroke(); g.restore();
}
/* Wide: the grid the page has always drawn, 0.5 %C and 100 °C. Tight: the
   framework's own tick rule, so the density is computed the way it is computed
   everywhere else. Its 'fine' target is 60 px, which is the honest spacing for
   labels this short — the count still falls from 14 to 4 and from 15 to 3. */
function ticksC(G){
  if(!G.tight){ const out=[]; for(let c=0;c<=CEM+0.001;c+=0.5) out.push(+c.toFixed(1)); return out; }
  if(window.DiagramUI) return DiagramUI.ticks(C0,C1,G.PW,'fine');
  const out=[]; for(let c=0;c<=CEM+0.001;c+=2) out.push(c); return out;
}
function ticksT(G){
  if(!G.tight){ const out=[]; for(let T=200;T<=1600;T+=100) out.push(T); return out; }
  if(window.DiagramUI) return DiagramUI.ticks(T0,T1,G.PH,'fine');
  const out=[]; for(let T=200;T<=1600;T+=400) out.push(T); return out;
}

/* the painted phase field + axes + labels; expensive, so it is cached exactly
   as the old page cached its 920x640 offscreen canvas */
function drawBase(g,G,P){
  const {W,H,M,PW,PH}=G;
  const F=P.font;
  g.clearRect(0,0,W,H);
  g.fillStyle=P.panel; g.fillRect(0,0,W,H);

  const step=2;
  for(let px=M.l; px<=M.l+PW; px+=step){
    const c=G.invX(px+0.5);
    for(let py=M.t; py<=M.t+PH; py+=step){
      const T=G.invY(py+0.5);
      const r=phaseAt(c,T); if(!r) continue;
      let col;
      if(r.kind==='single') col=PC[r.phases[0].key];
      else col=mix(PC[r.phases[0].key],PC[r.phases[1].key]);
      g.fillStyle=col; g.fillRect(px,py,step,step);
    }
  }
  /* soften for readability — over the panel colour, so light mode is unchanged */
  g.save(); g.globalAlpha=0.35; g.fillStyle=P.panel; g.fillRect(M.l,M.t,PW,PH); g.restore();

  /* gridlines and tick labels: physical text size, never scaled (spec §10) */
  g.save(); g.strokeStyle=P.line; g.lineWidth=1; g.fillStyle=P.muted;
  g.font="11px "+F; g.textAlign="center";
  ticksC(G).forEach(c=>{ const x=G.X(c); g.beginPath(); g.moveTo(x,M.t); g.lineTo(x,M.t+PH); g.stroke();
    g.fillText(c.toFixed(1), x, M.t+PH+16); });
  g.textAlign="right";
  ticksT(G).forEach(T=>{ const y=G.Y(T); g.beginPath(); g.moveTo(M.l,y); g.lineTo(M.l+PW,y); g.stroke();
    g.fillText(T, M.l-8, y+4); });
  g.restore();

  g.strokeStyle=P.ink; g.lineWidth=1.5;
  g.strokeRect(M.l,M.t,PW,PH);
  g.fillStyle=P.ink; g.font="bold 12px "+F; g.textAlign="center";
  g.fillText(t('carbonL')+"  (wt%)", M.l+PW/2, H-8);
  g.save(); g.translate(G.tight?12:16,M.t+PH/2); g.rotate(-Math.PI/2); g.fillText(t('tempL'),0,0); g.restore();
  g.textAlign="center"; g.font="11px "+F; g.fillStyle=P.muted;
  g.fillText("Fe₃C = 6.67", G.X(CEM), M.t-8);

  drawPoly(g,G,POLY.liquidus,"#c0392b",2.2);
  drawPoly(g,G,POLY.solidus,"#2c3e50",1.8);
  drawPoly(g,G,POLY.peritectic,"#8e44ad",1.6);
  drawPoly(g,G,POLY.eutectic,"#c0392b",1.8);
  drawPoly(g,G,POLY.NH,"#2c3e50",1.2);
  drawPoly(g,G,POLY.NJ,"#2c3e50",1.2);
  drawPoly(g,G,POLY.GS,"#1f6f43",1.8);   // A3
  drawPoly(g,G,POLY.ES,"#1f6f43",1.8);   // Acm
  drawPoly(g,G,POLY.GP,"#1f6f43",1.2);
  drawPoly(g,G,POLY.A1,"#b8860b",1.8);   // A1 eutectoid
  drawPoly(g,G,POLY.PQ,"#2c3e50",1.0,[3,3]);
  drawPoly(g,G,POLY.cementite,"#6c3483",2.0);

  if(!G.tight){
    g.fillStyle=P.muted; g.font="italic 11px "+F; g.textAlign="left";
    const letter=(l,c,T,dx,dy)=>{ g.fillText(l, G.X(c)+(dx||4), G.Y(T)+(dy||0)); };
    letter('A',0,1538,-14,-4); letter('N',0,1394,-14,4); letter('G',0,912,-14,4);
    letter('B',0.53,1493,2,-4); letter('H',0.09,1493,-2,-4); letter('J',0.16,1493,4,10);
    letter('E',E_C,1147,4,-4); letter('C',EU_C,1147,-2,-6); letter('F',CEM,1147,-16,-4);
    letter('S',S_C,727,4,-4); letter('P',P_C,727,-14,-2); letter('K',CEM,727,-16,-4);
    letter('D',CEM,1252,-16,-2);
  }

  g.textAlign="center"; g.textBaseline="middle";
  REGION_LABELS.forEach(rl=>{
    /* spec §10: below md the non-essential annotations go, the field names stay */
    if(G.tight && !rl.big && (rl.s||12)<13) return;
    const txt = rl.k ? t(rl.k) : rl.txt;
    g.font = (rl.big? "bold 15px":"600 "+(rl.s||12)+"px") + " " + F;
    g.fillStyle= rl.big? P.ink : P.muted;
    g.fillText(txt, G.X(rl.c), G.Y(rl.T));
  });
  if(!G.tight){
    g.save(); g.translate(G.X(CEM)+14, G.Y(900)); g.rotate(-Math.PI/2);
    g.font="600 12px "+F; g.fillStyle="#5b2c82"; g.textAlign="center";
    g.fillText(t('Fe3C'),0,0); g.restore();
  }
  g.textBaseline="alphabetic";

  INV_PTS.forEach(p=>{
    const x=G.X(p.c),y=G.Y(p.T);
    g.fillStyle= p.react? "#c0392b":"#2c3e50";
    g.beginPath(); g.arc(x,y,p.react?4.5:3,0,7); g.fill();
    if(p.react){ g.strokeStyle=P.panel; g.lineWidth=1; g.stroke(); }
  });
}

let baseCv=null, baseSig="";
function paint(ctx,W,H,coarse,dpr){
  const P=palette();
  const G=geom(W,H,coarse); GEO=G;
  const sig=[W,H,coarse,dpr,lang,P.panel,P.ink,P.line,P.muted].join('|');
  if(!baseCv){ baseCv=document.createElement('canvas'); }
  if(baseSig!==sig){
    baseCv.width=Math.max(1,Math.round(W*dpr)); baseCv.height=Math.max(1,Math.round(H*dpr));
    const g=baseCv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    drawBase(g,G,P);
    baseSig=sig;
  }
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(baseCv,0,0,W,H);

  /* alloy line */
  if(alloyC!=null){
    const x=G.X(alloyC);
    ctx.save(); ctx.strokeStyle=P.accent; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(x,G.M.t); ctx.lineTo(x,G.M.t+G.PH); ctx.stroke();
    ctx.restore();
    ctx.fillStyle=P.accent; ctx.font="bold 11px "+P.font; ctx.textAlign="center";
    ctx.fillText(alloyC.toFixed(2)+"%C", x, G.M.t-2);
  }
  /* the point being read */
  if(cursor){
    const px=G.X(cursor.c), py=G.Y(cursor.T);
    if(px>=G.M.l-1&&px<=G.M.l+G.PW+1&&py>=G.M.t-1&&py<=G.M.t+G.PH+1){
      ctx.save(); ctx.globalAlpha=0.6; ctx.strokeStyle=P.ink; ctx.lineWidth=1; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(px,G.M.t); ctx.lineTo(px,G.M.t+G.PH);
      ctx.moveTo(G.M.l,py); ctx.lineTo(G.M.l+G.PW,py); ctx.stroke(); ctx.restore();
      ctx.fillStyle="#c0392b"; ctx.beginPath(); ctx.arc(px,py,4,0,7); ctx.fill();
      ctx.strokeStyle=P.panel; ctx.lineWidth=1; ctx.stroke();
    }
  }
}

/* ============================ Readout helpers ============================ */
function fmtPct(f){ return (f*100).toFixed(1)+"%"; }
function phaseName(k){ return t(k); }
function invRows(){
  return [
    {name:t('peritectic'), T:1493, C:'0.16', eq:'δ + L → γ'},
    {name:t('eutectic'),   T:1147, C:'4.30', eq:'L → γ(2.14) + Fe₃C'},
    {name:t('eutectoid'),  T:727,  C:'0.76', eq:'γ → α(0.022) + Fe₃C'},
  ];
}
function DiagramUI_pick(o){ return (o&&(o[lang]||o.en))||''; }
function elm(tag,cls,txt){ const n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; }

/* the phase chips, the two fraction rows and the stacked bar: the same markup
   the old readout card carried, moved into the results region */
function phasesNode(r){
  const box=elm('div','icd-block');
  box.id='icd-fractions';
  box.appendChild(elm('div','icd-h',t('phasesR')));
  const chips=elm('div');
  if(r) r.phases.forEach(p=>{ const s=elm('span','icd-chip',phaseName(p.key)); s.style.background=PC[p.key]; chips.appendChild(s); });
  box.appendChild(chips);
  box.appendChild(elm('div','icd-h icd-h2',t('fracR')));
  if(!r){ box.appendChild(elm('div','icd-muted',t('outside'))); return box; }
  const rows=elm('div');
  if(r.kind==='two'){
    const p0=r.phases[0], p1=r.phases[1];
    [p0,p1].forEach(p=>{ const row=elm('div','icd-row');
      row.appendChild(elm('span',null,phaseName(p.key)));
      row.appendChild(elm('span',null,fmtPct(p.frac)));
      rows.appendChild(row); });
    const bar=elm('div','icd-bar');
    [p0,p1].forEach(p=>{ const d=elm('div'); d.style.width=(p.frac*100)+'%'; d.style.background=PC[p.key]; bar.appendChild(d); });
    rows.appendChild(bar);
  } else {
    const row=elm('div','icd-row');
    row.appendChild(elm('span',null,phaseName(r.phases[0].key)));
    row.appendChild(elm('span',null,'100%'));
    rows.appendChild(row);
  }
  box.appendChild(rows);
  return box;
}
function alloyNode(){
  const box=elm('div','icd-block');
  box.appendChild(elm('div','icd-h',t('alloyTitle')));
  if(alloyC==null){ box.appendChild(elm('div','icd-muted',DiagramUI_pick(ALLOY_HINT))); return box; }
  const m=microstructure(alloyC);
  const head=elm('div'); head.appendChild(elm('span','icd-badge',t(m.cls))); box.appendChild(head);
  box.appendChild(elm('div','icd-muted icd-h2',t('microstructure')+':'));
  const parts=m.parts.map(p=>{
    const nm=t(p.k);
    return p.f!=null ? `${nm} ${t('approx')} ${(p.f*100).toFixed(1)}%` : nm;
  });
  box.appendChild(elm('div',null,parts.join(" + ")));
  return box;
}

/* the framework's own table markup, so a node looks like a native table */
function tableNode(title,head,rows){
  const wrap=elm('div','dgu-table-wrap');
  const tb=document.createElement('table'); tb.className='dgu-table';
  if(title){ const cap=document.createElement('caption'); cap.className='icd-cap'; cap.textContent=title; tb.appendChild(cap); }
  const thead=document.createElement('thead'), tr=document.createElement('tr');
  head.forEach(h=>tr.appendChild(elm('th',null,h))); thead.appendChild(tr); tb.appendChild(thead);
  const tbody=document.createElement('tbody');
  rows.forEach(r=>{ const x=document.createElement('tr');
    r.forEach(c=>x.appendChild(elm('td',null,c))); tbody.appendChild(x); });
  tb.appendChild(tbody); wrap.appendChild(tb);
  return wrap;
}

/* ============================ State ============================ */
const DEFAULTS={c:0.40,T:700,alloy:0.40};
const state={c:DEFAULTS.c,T:DEFAULTS.T,alloy:DEFAULTS.alloy};
/* `cursor` and `alloyC` keep their old meaning: the point the record describes
   and the alloy line. They are written by compute(), so the record, the
   permalink, the report and the python export read exactly what they read
   before. */
let cursor=null, alloyC=null, lastR=null;

function numOK(v){
  return (typeof v==='number' && isFinite(v)) ? true
    : T6('Enter a number.','Введіть число.','Bitte eine Zahl eingeben.','Voer een getal in.','Saisissez un nombre.','Introduzca un número.',"Wprowadź liczbę.");
}
function alloyOK(v){
  if(v==null) return true;                       /* an empty field clears the line */
  if(typeof v!=='number' || !isFinite(v)) return numOK(v);
  /* the old page dropped an out-of-range alloy on the floor without a word
     (UI_AUDIT S-9); the value is still refused, but now it says so */
  if(v<0||v>CEM) return T6('Between 0 and '+CEM+' wt%C.','Від 0 до '+CEM+' % мас. C.','Zwischen 0 und '+CEM+' Gew.-%C.','Tussen 0 en '+CEM+' gew.%C.','Entre 0 et '+CEM+' %C massique.','Entre 0 y '+CEM+' %C en masa.',"Między 0 a"+CEM+"%wag.");

const PY_IRON = `CEM = 6.67          # cementite Fe3C, wt%C
P_C = 0.022         # max C in ferrite at 727 C
S_C = 0.76          # eutectoid composition
E_C = 2.14          # max C in austenite at 1147 C
EU_C = 4.30         # eutectic composition


def lerp(x, x0, x1, y0, y1):
    return y0 + (y1 - y0) * (x - x0) / (x1 - x0)


def liquidus(c):
    """Liquidus temperature in degC for carbon content c in wt%."""
    if c <= 0.53:
        return lerp(c, 0.0, 0.53, 1538.0, 1493.0)
    if c <= EU_C:
        return lerp(c, 0.53, EU_C, 1493.0, 1147.0)
    return lerp(c, EU_C, CEM, 1147.0, 1252.0)


def lever(c, left, right):
    """Lever rule: mass fraction of the left and of the right phase."""
    f = (right - c) / (right - left)
    return max(0.0, min(1.0, f)), max(0.0, min(1.0, 1.0 - f))


def phase_at(c, T):
    """Phases and mass fractions at composition c (wt%C) and temperature T (degC)."""
    if c < 0 or c > CEM or T < 200 or T > 1600:
        return None
    if T >= liquidus(c):
        return ("single", [("L", 1.0)])
    if T >= 1493:
        s_ah = lerp(T, 1538, 1493, 0.0, 0.09)
        l_ab = lerp(T, 1538, 1493, 0.0, 0.53)
        if c <= s_ah:
            return ("single", [("delta", 1.0)])
        if c <= l_ab:
            fl, fr = lever(c, s_ah, l_ab)
            return ("two", [("delta", fl), ("L", fr)])
        return ("single", [("L", 1.0)])
    if T >= 1394:
        d_solv = lerp(T, 1394, 1493, 0.0, 0.09)
        nj_c = lerp(T, 1394, 1493, 0.0, 0.16)
        g_sol = lerp(T, 1493, 1147, 0.16, E_C)
        l_bc = lerp(T, 1493, 1147, 0.53, EU_C)
        if c <= d_solv:
            return ("single", [("delta", 1.0)])
        if c <= nj_c:
            fl, fr = lever(c, d_solv, nj_c)
            return ("two", [("delta", fl), ("gamma", fr)])
        if c <= g_sol:
            return ("single", [("gamma", 1.0)])
        if c <= l_bc:
            fl, fr = lever(c, g_sol, l_bc)
            return ("two", [("gamma", fl), ("L", fr)])
        return ("single", [("L", 1.0)])
    if T >= 1147:
        g_sol = lerp(T, 1493, 1147, 0.16, E_C)
        l_bc = lerp(T, 1493, 1147, 0.53, EU_C)
        l_cd = lerp(T, 1147, 1252, EU_C, CEM)
        if c <= g_sol:
            return ("single", [("gamma", 1.0)])
        if c <= l_bc:
            fl, fr = lever(c, g_sol, l_bc)
            return ("two", [("gamma", fl), ("L", fr)])
        if c <= l_cd:
            return ("single", [("L", 1.0)])
        fl, fr = lever(c, l_cd, CEM)
        return ("two", [("L", fl), ("Fe3C", fr)])
    if T >= 727:
        ferr_gp = lerp(T, 912, 727, 0.0, P_C) if T <= 912 else 0.0
        g_left = lerp(T, 912, 727, 0.0, S_C) if T <= 912 else 0.0
        g_right = lerp(T, 1147, 727, E_C, S_C)
        if T <= 912 and c <= ferr_gp:
            return ("single", [("alpha", 1.0)])
        if T <= 912 and c <= g_left:
            fl, fr = lever(c, ferr_gp, g_left)
            return ("two", [("alpha", fl), ("gamma", fr)])
        if c <= g_right:
            return ("single", [("gamma", 1.0)])
        fl, fr = lever(c, g_right, CEM)
        return ("two", [("gamma", fl), ("Fe3C", fr)])
    ferr_max = lerp(T, 727, 200, P_C, 0.008)
    if c <= ferr_max:
        return ("single", [("alpha", 1.0)])
    fl, fr = lever(c, ferr_max, CEM)
    return ("two", [("alpha", fl), ("Fe3C", fr)])


def microstructure(c):
    """Room-temperature constituents; a fraction of None means 'present, not quantified'."""
    if c < P_C:
        return "ferriteAlloy", [("alpha", 1.0)]
    if abs(c - S_C) < 0.015:
        return "eutS", [("pearlite", 1.0)]
    if c < S_C:
        pearl = (c - P_C) / (S_C - P_C)
        return "hypoS", [("proF", 1.0 - pearl), ("pearlite", pearl)]
    if c < E_C:
        cem = (c - S_C) / (CEM - S_C)
        return "hyperS", [("pearlite", 1.0 - cem), ("secC", cem)]
    if abs(c - EU_C) < 0.03:
        return "eutCI", [("ledeburite", 1.0)]
    if c < EU_C:
        return "hypoCI", [("pearlite", None), ("secC", None), ("ledeburite", None)]
    return "hyperCI", [("priC", None), ("ledeburite", None)]


def compute():
    c = CARBON
    T = TEMPERATURE
    r = phase_at(c, T)
    out = {"phase_field": r[0] if r else "outside",
           "phase_1": r[1][0][0] if r else None,
           "fraction_1": r[1][0][1] if r else None,
           "phase_2": r[1][1][0] if r and len(r[1]) > 1 else None,
           "fraction_2": r[1][1][1] if r and len(r[1]) > 1 else None,
           "liquidus": liquidus(c),
           "alloy_class": None}
    if ALLOY_CARBON is not None:
        cls, parts = microstructure(ALLOY_CARBON)
        out["alloy_class"] = cls
        for k, f in parts:
            out["alloy_%s_fraction" % k] = f
    return out`;

function computeResults(s){
  if(!(typeof s.c==='number'&&isFinite(s.c)&&typeof s.T==='number'&&isFinite(s.T))) return null;
  cursor={c:s.c,T:s.T};
  alloyC=(s.alloy==null?null:s.alloy);
  const r=phaseAt(s.c,s.T);
  lastR=r;
  if(stage) stage.schedule();

  const tiles=[
    {label:K('carbonR'), value:s.c, precision:3, unit:'wt%C', learn:'carbon'},
    /* the temperatures are strings on purpose: the page has always printed
       1520, never 1 520, and the port may not change a number on the screen */
    {label:K('tempR'), value:String(Math.round(s.T)), unit:'°C', learn:'temperature'},
    {label:K('fieldR'), value:(r?(r.kind==='single'?t('single'):t('two')):t('outside')), learn:'phasefield'}
  ];
  tiles.push({label:T6('Liquidus','Лінія ліквідусу','Liquidus','Liquidus','Liquidus','Líquidus',"Likwidus"),
              value:liquidus(s.c).toFixed(1), unit:'°C', headline:false, learn:'diagram'});

  return {
    verdict:{ tone:(r?null:'warn'), text:t('fieldR')+': '+(r?(r.kind==='single'?t('single'):t('two')):t('outside')) },
    tiles:tiles,
    /* nodes, not tables: Results.render() puts every table above every node,
       and the invariant points are reference material that belongs under the
       answer, where the old card had it */
    nodes:[phasesNode(r), alloyNode(),
           tableNode(t('invTitle'),[t('reaction'),t('tcol'),t('ccol'),t('eqn')],
                     invRows().map(x=>[x.name,String(x.T),x.C,x.eq]))]
  };
}

function a11yText(){
  if(!cursor) return '';
  const r=phaseAt(cursor.c,cursor.T);
  const head=t('carbonR')+' '+cursor.c.toFixed(3)+' wt%C, '+t('tempR')+' '+Math.round(cursor.T)+' °C. ';
  if(!r) return head+t('outside')+'.';
  return head+(r.kind==='single'?t('single'):t('two'))+': '+
    r.phases.map(p=>phaseName(p.key)+' '+fmtPct(p.frac)).join(', ')+'.'+
    (alloyC!=null?(' '+t('alloyL').replace(/\s*%C$/,'')+' '+alloyC.toFixed(2)+' wt%C.'):'');
}

/* ============================ The app ============================ */
let ui=null, stage=null, rafPending=false;
/* UPSTREAM (framework defect). App.rebuild() — which runs on every language
   change — builds a fresh instance and copies its properties onto the object
   whose setLang() was called. That is the instance the *header* holds, not the
   one DiagramUI.app() returned, so after the second switch the tool's own
   reference points at a destroyed app: its regions, its results view and its
   stage are all detached, and a run() through it computes into DOM nodes that
   are no longer on the page (the record moved, the screen did not). App.current
   is always the live one, so resolve it at call time. Belongs in diagram-ui.js.
*/
function UI(){ return (window.DiagramUI && DiagramUI.current) || ui; }

function commitPoint(c,T){
  state.c=c; state.T=T;
  if(rafPending) return;
  rafPending=true;
  requestAnimationFrame(()=>{ rafPending=false; const a=UI(); if(a){ a.sync(); a.run(); } });
}

function bindStage(app){
  stage=app.stage({
    caption:T6('Metastable Fe–Fe₃C diagram. Move the pointer to read a point; click to set the alloy composition.','Метастабільна діаграма Fe–Fe₃C. Наведіть вказівник, щоб зчитати точку; клацніть, щоб задати склад сплаву.','Metastabiles Fe–Fe₃C-Diagramm. Zeiger bewegen, um einen Punkt abzulesen; klicken, um die Legierungszusammensetzung zu setzen.','Metastabiel Fe–Fe₃C-diagram. Beweeg de aanwijzer om een punt af te lezen; klik om de legeringssamenstelling te kiezen.','Diagramme métastable Fe–Fe₃C. Déplacez le pointeur pour lire un point ; cliquez pour définir la composition de l’alliage.','Diagrama metaestable Fe–Fe₃C. Mueva el puntero para leer un punto; haga clic para fijar la composición de la aleación.',"Metastabilny diagram Fe–Fe₃C. Przesuń wskaźnik, aby odczytać punkt; kliknij, aby ustawić skład stopu."),
    a11y:a11yText,
    render:function(size,st){ paint(st.canvas(),size.w,size.h,size.density==='coarse',size.dpr); }
  });
  const body=stage.body;
  const pos=ev=>{
    const cv=stage.cv; if(!cv) return null;
    const rect=cv.getBoundingClientRect();
    if(!rect.width||!rect.height) return null;
    return {px:ev.clientX-rect.left, py:ev.clientY-rect.top};
  };
  DiagramUI.on(body,'mousemove',function(ev){
    const p=pos(ev); if(!p) return;
    const G=GEO;
    if(p.px<G.M.l||p.px>G.M.l+G.PW||p.py<G.M.t||p.py>G.M.t+G.PH) return;
    commitPoint(Math.max(0,Math.min(CEM,G.invX(p.px))), Math.max(200,Math.min(1600,G.invY(p.py))));
  });
  DiagramUI.on(body,'click',function(ev){
    const p=pos(ev); if(!p) return;
    const G=GEO;
    const c=Math.max(0,Math.min(CEM,G.invX(p.px)));
    state.alloy=+c.toFixed(2);
    const a=UI(); a.sync(); a.run();
  });
  DiagramUI.theme.watch(function(){ baseSig=''; if(stage) stage.schedule(); });
}

function buildInputs(app){
  app.examples([
    {label:K('hypoS'), note:'0.20 %C · 850 °C',  state:{c:0.20,T:850, alloy:0.20}},
    {label:K('eutS'),  note:'0.76 %C · 727 °C',  state:{c:0.76,T:727, alloy:0.76}},
    {label:K('hyperS'),note:'1.00 %C · 800 °C',  state:{c:1.00,T:800, alloy:1.00}},
    {label:K('hypoCI'),note:'3.50 %C · 1200 °C', state:{c:3.50,T:1200,alloy:3.50}}
  ].map(function(ex){ ex.apply=function(fresh,a){ adopt(fresh,a); }; return ex; }));
  app.panel({
    slot:'inputs', id:'point', learn:'phasefield',
    title:T6('Composition and temperature','Склад і температура','Zusammensetzung und Temperatur','Samenstelling en temperatuur','Composition et température','Composición y temperatura',"Skład i temperatura"),
    fields:[
      {id:'f-c', key:'c', type:'number', step:0.01, unit:'wt%C', learn:'carbon',
       label:K('carbonR'), hint:'0 – '+CEM, validate:numOK},
      {id:'f-T', key:'T', type:'number', step:1, unit:'°C', learn:'temperature',
       label:K('tempR'), hint:'200 – 1600', validate:numOK}
    ]
  });
  app.panel({
    slot:'inputs', id:'alloy', title:K('alloyTitle'), learn:'alloy',
    fields:[
      {id:'f-alloy', key:'alloy', type:'number', step:0.01, unit:'wt%C', learn:'microstructure',
       label:L6(d=>d.alloyL.replace(/\s*%C$/,'')), hint:ALLOY_HINT,
       validate:alloyOK,
       set:function(v,st){ st.alloy=(v==null?null:+(+v).toFixed(3)); }}
    ],
    actions:[{id:'clear', label:K('clearAlloy'), variant:'ghost',
              run:function(){ state.alloy=null; const a=UI(); a.sync(); a.run(); }}]
  });
  app.panel({
    slot:'inputs', id:'dgu-reset-row',
    render:function(box){
      const row=document.createElement('div');
      row.className='dgu-panel-actions';
      row.appendChild(app.actionButton(app.resetAction()));
      box.appendChild(row);
    }
  });
}

function buildFooter(host,app){
  const d=document.createElement('details');
  const dict=I18N[app.lang]||I18N.en;
  const li=a=>'<ul>'+a.map(x=>'<li>'+DiagramUI.esc(x)+'</li>').join('')+'</ul>';
  d.innerHTML='<summary>'+DiagramUI.esc(DiagramUI.pick(
      T6('Model, ranges and notes','Модель, діапазони та примітки','Modell, Bereiche und Hinweise','Model, bereiken en opmerkingen','Modèle, domaines et remarques','Modelo, rangos y notas',"Model, zakresy i uwagi"), app.lang))+
    '</summary><p>'+DiagramUI.esc(dict.foot)+'</p>'+
    li(dict.rec.rg)+li(dict.rec.nt)+
    '<p>'+DiagramUI.esc(dict.rec.noneq)+'</p>';
  host.appendChild(d);
}

function boot(){
  lang=pickLang();
  document.title=t('title');
  if(!window.DiagramUI || DiagramUI.api!=='tools.petrov.re/ui/v1'){ bootBare(); dgcInit(); return; }
  lang=DiagramUI.lang();

  ui=DiagramUI.app({
    id:'iron-carbon-diagram', mount:'#app', layout:'calculator', compute:'live',
    lang:lang, state:state, defaults:DEFAULTS, history:false,
    title:K('title'), subtitle:K('subtitle'),
    /* the results region is this tool's "Current point" card, under its own name */
    strings:{ results:K('currentPoint') },
    learn:learnData(),
    regions:{
      inputs:function(host,app){ buildInputs(app); },
      stage: function(host,app){ bindStage(app); }
    },
    footer:function(host,app){ buildFooter(host,app); },
    on:{
      compute:computeResults,
      lang:function(code){ lang=code; baseSig=''; document.title=t('title'); },
      reset:function(fresh,app){ adopt(fresh,app); }
    }
  });
  ui.ready();
  dgcInit();
}

/* ---- diagram-ui.js is missing (blocked, 404 or an old cache). The physics,
        the record, the permalink, the report and every export still work, so
        run them, and say plainly which part is not there. ---- */
let bareCv=null;
function bootBare(){
  const box=document.getElementById('app')||document.body;
  box.innerHTML='';
  box.className='icd-fb';
  const h1=document.createElement('h1'); h1.textContent=t('title'); box.appendChild(h1);
  const sub=document.createElement('p'); sub.textContent=t('subtitle'); box.appendChild(sub);
  const msg=document.createElement('p'); msg.textContent=DiagramUI_pick(BARE_MSG); box.appendChild(msg);
  const row=document.createElement('div'); row.className='icd-fb-row';
  const mk=(key,val,step,onc)=>{
    const w=document.createElement('label');
    w.textContent=t(key)+' ';
    const i=document.createElement('input');
    i.type='number'; i.step=step; i.value=val;
    i.addEventListener('change',()=>onc(parseFloat(i.value)));
    i.addEventListener('keydown',e=>{ if(e.key==='Enter')onc(parseFloat(i.value)); });
    w.appendChild(i); row.appendChild(w); return i;
  };
  mk('carbonL',state.c,0.01,v=>{ if(isFinite(v)){state.c=v; bareRun();} });
  mk('tempL',state.T,1,v=>{ if(isFinite(v)){state.T=v; bareRun();} });
  mk('alloyL',state.alloy,0.01,v=>{ state.alloy=(isFinite(v)&&v>=0&&v<=CEM)?+v.toFixed(3):null; bareRun(); });
  box.appendChild(row);
  bareCv=document.createElement('canvas');
  bareCv.width=920; bareCv.height=640; bareCv.style.maxWidth='100%'; bareCv.style.height='auto';
  box.appendChild(bareCv);
  const out=document.createElement('div'); out.id='icd-fb-out'; box.appendChild(out);
  bareRun();
}
const BARE_MSG=T6('The shared interface layer (diagram-ui.js) did not load, so this is the plain form. Every number, the permalink, the PDF report and the exports are computed in this page and still work.','Спільний шар інтерфейсу (diagram-ui.js) не завантажився, тому показано просту форму. Усі числа, постійне посилання, звіт PDF та експорти обчислюються в цій сторінці й працюють.','Die gemeinsame Oberflächenschicht (diagram-ui.js) wurde nicht geladen, daher das einfache Formular. Alle Zahlen, der Permalink, der PDF-Bericht und die Exporte werden in dieser Seite berechnet und funktionieren weiterhin.','De gedeelde interfacelaag (diagram-ui.js) is niet geladen, vandaar dit eenvoudige formulier. Alle getallen, de permalink, het PDF-rapport en de exports worden in deze pagina berekend en werken gewoon.','La couche d’interface partagée (diagram-ui.js) n’a pas été chargée : voici le formulaire simple. Tous les nombres, le permalien, le rapport PDF et les exports sont calculés dans cette page et fonctionnent toujours.','La capa de interfaz compartida (diagram-ui.js) no se cargó, por lo que se muestra el formulario simple. Todos los números, el enlace permanente, el informe PDF y las exportaciones se calculan en esta página y siguen funcionando.',"Wspólna warstwa interfejsu (diagram-ui.js) nie załadowała się, więc to jest zwykła forma. Wszystkie liczby, permalink, raport PDF i eksporty są obliczane na tej stronie i nadal działają.");

function bareRun(){
  cursor={c:state.c,T:state.T};
  alloyC=(state.alloy==null?null:state.alloy);
  if(bareCv){
    const ctx=bareCv.getContext('2d');
    ctx.setTransform(1,0,0,1,0,0);
    paint(ctx,920,640,false,1);
  }
  const out=document.getElementById('icd-fb-out');
  if(!out) return;
  out.innerHTML='';
  const r=phaseAt(state.c,state.T);
  const line=(a,b)=>{ const d=document.createElement('div'); d.className='icd-row';
    d.appendChild(elm('span',null,a)); d.appendChild(elm('span',null,b)); out.appendChild(d); };
  line(t('carbonR'), state.c.toFixed(3)+' %C');
  line(t('tempR'), Math.round(state.T)+' °C');
  line(t('fieldR'), r?(r.kind==='single'?t('single'):t('two')):t('outside'));
  out.appendChild(phasesNode(r));
  out.appendChild(alloyNode());
}

/* ============================ init ============================ */
function dgcInit(){
  if(!window.Diagram)return;
  window.Diagram.init({
    id:'iron-carbon-diagram',file:'iron_carbon_diagram.html',
    state:{serialize:dgcSerialize,deserialize:dgcDeserialize},
    record:dgcRecord,
    python:dgcPython,
    report:{sections:dgcSections},
    handoff:{provides:[],accepts:[]}
  });
}
function dgcDeserialize(st){
  if(!st||typeof st!=='object')throw new Error('unrecognised state payload');
  let wantLang=null;
  if(st.lang&&I18N[st.lang])wantLang=st.lang;
  if(st.c!=null&&isFinite(st.c)&&st.T!=null&&isFinite(st.T)){
    if(st.c<0||st.c>CEM)throw new Error('carbon out of range');
    state.c=+st.c; state.T=+st.T;
  }
  if(st.alloy!=null&&isFinite(st.alloy))state.alloy=+st.alloy;
  else state.alloy=null;
  const a=ui?UI():null;
  if(a){
    if(wantLang&&wantLang!==a.lang){ a.setLang(wantLang); }   /* rebuilds and recomputes */
    else { a.sync(); a.run(); }
  }else{
    if(wantLang){ lang=wantLang; document.title=t('title'); bootBare(); }
    else bareRun();
  }
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

/* the tool's own handles, for the harnesses */
window.__ironCarbon={get state(){return state;},solve:phaseAt,micro:microstructure,
  get ui(){return ui;},get cursor(){return cursor;},get alloy(){return alloyC;},
  get geom(){return GEO;}};

})();
</script>
