<script>
/* page code of quotelevel.html (source: _tnd/quotelevel/page.js) */
(function () {
  'use strict';

  /* ============================================================ 1. the model */
  var TOOL = 'quotelevel';
  function lib() { return window.TndQl || null; }
  function core() { return window.TndCore || null; }
  var MAXI = 30, MAXQ = 8, MAXG = 240, MAXT = 8;
  var INCOTERMS = ['EXW', 'FCA', 'FAS', 'FOB', 'CFR', 'CIF', 'CPT', 'CIP', 'DAP', 'DPU', 'DDP', 'site'];
  var STATUSES = ['exc', 'unc', 'opt', 'inc'];
  var LEGS = ['load', 'pre', 'main', 'ins', 'imp', 'onc', 'unload'];

  /* percentages in percent in the state (6 = 6 %), money in euro (quote prices and amounts in the quote currency). Filled from the first preset at boot. */
  var DEFAULTS = {
    policy: 'allowance', unclear: 100, rate: 6, gapWarn: 10,
    load: 0, ins: 0, duty: 0, impFix: 0, unload: 0,
    items: [], quotes: [], terms: [], gaps: [],
    pkgName: '', tenderRef: '', preparedBy: ''
  };
  var state = JSON.parse(JSON.stringify(DEFAULTS));
  var last = null, ui = null, stage = null;

  function pct(v) { return (+v || 0) / 100; }
  /* lists are edited in place (the list fields keep a reference to the array) */
  function setArr(t, k, arr) { if (!Array.isArray(t[k])) t[k] = []; t[k].length = 0; arr.forEach(function (x) { t[k].push(x); }); }
  function assign(t, src) { Object.keys(src).forEach(function (k) { if (Array.isArray(src[k])) setArr(t, k, src[k]); else t[k] = src[k]; }); }
  function engineInput(s) {
    var items = (s.items || []).slice(0, MAXI).map(function (it, k) { return { id: String(it.id || 'I' + (k + 1)), name: it.name, allowance: +it.allowance || 0 }; });
    var quotes = (s.quotes || []).slice(0, MAXQ).map(function (q, k) {
      return { id: String(q.id || 'Q' + (k + 1)), name: q.name, price: q.price === '' || q.price == null ? NaN : +q.price, cur: String(q.cur || 'EUR').trim().toUpperCase() || 'EUR',
               fx: q.fx === '' || q.fx == null ? NaN : +q.fx, incoterm: q.incoterm, eu: q.eu !== false, pre: 0, main: 0, onc: 0,
               adv: 0, advMonths: 0, adj: 0, cells: {} };
    });
    /* the first quote with an id gets its terms and lines (the engine renames a repeated id to -2); a repeated terms or gap line is ignored and noted */
    var byId = {}, dupRows = [], seenT = {}, seenG = {};
    quotes.forEach(function (q) { if (!byId[q.id]) byId[q.id] = q; });
    (s.terms || []).slice(0, MAXT).forEach(function (t) {
      var q = byId[String(t.q)];
      if (!q) return;
      if (seenT[q.id]) { dupRows.push(q.id); return; }
      seenT[q.id] = 1;
      q.pre = +t.pre || 0; q.main = +t.main || 0; q.onc = +t.onc || 0; q.adv = pct(t.adv); q.advMonths = +t.months || 0; q.adj = +t.adj || 0;
    });
    (s.gaps || []).slice(0, MAXG).forEach(function (g) {
      var q = byId[String(g.q)];
      if (!q || STATUSES.indexOf(g.s) < 0) return;
      var gk = q.id + '\u0000' + String(g.item);
      if (seenG[gk]) { dupRows.push(q.id + '/' + String(g.item)); return; }
      seenG[gk] = 1;
      q.cells[String(g.item)] = { s: g.s, amt: g.amt === '' || g.amt == null || !isFinite(+g.amt) ? null : +g.amt };
    });
    return { policy: s.policy, unclear: pct(s.unclear), rate: pct(s.rate), gapWarn: pct(s.gapWarn),
             load: +s.load || 0, ins: pct(s.ins), duty: pct(s.duty), impFix: +s.impFix || 0, unload: +s.unload || 0, items: items, quotes: quotes, dupRows: dupRows };
  }
  function solve(s) {
    var B = lib();
    if (!B) return { ok: false, errors: ['engine'] };
    try { var inp = engineInput(s), r = B.analyse(inp); r.raw = inp; return r; }
    catch (e) { return { ok: false, errors: ['exception'], msg: String(e && e.message || e) }; }
  }

  /* ======================================================== 2. the interface */
  function T(en, uk, de, nl, fr, es, pl) { return { en: en, uk: uk, de: de, nl: nl, fr: fr, es: es, pl: pl }; }
  var LANGS = ['en', 'uk', 'de', 'nl', 'fr', 'es', 'pl'];
  function TF(fn) { var o = {}; LANGS.forEach(function (l) { o[l] = fn(l); }); return o; }
  function lang() { try { var l = window.DiagramUI && DiagramUI.domainLang ? DiagramUI.domainLang() : 'en'; return LANGS.indexOf(l) >= 0 ? l : 'en'; } catch (e) { return 'en'; } }
  var COMMA = { en: false, uk: true, de: true, nl: true, fr: true, es: true, pl: true };
  function nf(v, l, d) {
    if (v == null || !isFinite(v)) return '—';
    var C = core(); if (C && C.fmt) return C.fmt(v, l, d == null ? 2 : d);
    var s = v.toFixed(d == null ? 2 : d); return COMMA[l] ? s.replace('.', ',') : s;
  }
  function eur(v, l) {
    if (v == null || !isFinite(v)) return '—';
    var C = core(); if (C && C.money) return C.money(v, 'EUR', l, 0);

  }

    nReversal: T('The cheapest quote on paper is not the cheapest once levelled: what it leaves out costs more than its discount.', 'Найдешевша на папері пропозиція не є найдешевшою після вирівнювання: те, чого в ній немає, коштує більше за її знижку.', 'Das billigste Angebot auf dem Papier ist nach der Nivellierung nicht das billigste: was fehlt, kostet mehr als sein Preisvorteil.', 'De goedkoopste offerte op papier is na de vergelijking niet de goedkoopste: wat ontbreekt, kost meer dan haar prijsvoordeel.', 'L’offre la moins chère sur le papier ne l’est plus une fois nivelée : ce qu’elle omet coûte plus que sa remise.', 'La oferta más barata sobre el papel no lo es tras homogeneizar: lo que omite cuesta más que su descuento.', 'Najtańsza na papierze oferta nie jest najtańsza po wyrównaniu: to, czego w niej brak, kosztuje więcej niż jej rabat.'),
    nGap: T('The leader’s plugs exceed the warning level: its lead rests on your own estimates — clarify its exclusions in writing before you award.', 'Доцінки лідера перевищують поріг: його перевага тримається на ваших власних оцінках — до присудження з’ясуйте його виключення письмово.', 'Die Ansätze des Ersten übersteigen die Warnschwelle: sein Vorsprung beruht auf Ihren eigenen Schätzungen — Ausschlüsse vor der Vergabe schriftlich klären.', 'De aanvullingen van de eerste overschrijden de drempel: zijn voorsprong steunt op uw eigen ramingen — laat de uitsluitingen schriftelijk verduidelijken vóór de gunning.', 'Les compléments du premier dépassent le seuil : son avance repose sur vos propres estimations — faites clarifier ses exclusions par écrit avant d’attribuer.', 'Los complementos de la primera superan el umbral: su ventaja descansa en sus propias estimaciones — aclare sus exclusiones por escrito antes de adjudicar.', 'Uzupełnienia lidera przekraczają próg: jego przewaga opiera się na Twoich szacunkach — wyjaśnij wyłączenia na piśmie przed udzieleniem zamówienia.'),
    nFragile: T('Fragile ranking: a moderate error in your plugs (factor outside the range on the tile) changes the leader.', 'Нестійке ранжування: помірна похибка доцінок (множник поза діапазоном на плитці) змінює лідера.', 'Instabile Rangfolge: ein mäßiger Fehler in den Ansätzen (Faktor außerhalb des Bereichs auf der Kachel) ändert den Ersten.', 'Fragiele rangschikking: een matige fout in de aanvullingen (factor buiten het bereik op de tegel) verandert de eerste.', 'Classement fragile : une erreur modérée sur les compléments (facteur hors de la plage de la tuile) change le premier.', 'Clasificación frágil: un error moderado en los complementos (factor fuera del rango de la ficha) cambia la primera.', 'Niestabilny ranking: umiarkowany błąd uzupełnień (mnożnik poza zakresem z kafelka) zmienia lidera.'),
    nTie: T('Two or more quotes share the lowest levelled cost: decide on the documented non-price grounds or ask for a best and final offer.', 'Дві чи більше пропозицій мають однакову найнижчу вирівняну вартість: вирішуйте за задокументованими неціновими підставами або попросіть остаточну пропозицію.', 'Zwei oder mehr Angebote haben die gleichen niedrigsten nivellierten Kosten: nach dokumentierten Nichtpreisgründen entscheiden oder ein letztes Angebot (BAFO) einholen.', 'Twee of meer offertes delen de laagste genivelleerde kost: beslis op gedocumenteerde niet-prijsgronden of vraag een beste en finale offerte.', 'Deux offres ou plus partagent le coût nivelé le plus bas : décidez sur des motifs non-prix documentés ou demandez une meilleure offre finale.', 'Dos o más ofertas comparten el menor coste homogeneizado: decida por motivos no económicos documentados o pida una mejor oferta final.', 'Dwie lub więcej ofert ma ten sam najniższy koszt wyrównany: zdecyduj na udokumentowanych podstawach pozacenowych lub poproś o ofertę ostateczną.'),
    nAllExc: T('Some items are excluded or unclear in every quote: they do not change the ranking but must be budgeted or bought separately.', 'Деякі позиції виключено чи неясні в усіх пропозиціях: на ранжування вони не впливають, але їх треба закласти в бюджет чи закупити окремо.', 'Einige Positionen fehlen oder sind unklar in allen Angeboten: sie ändern die Rangfolge nicht, müssen aber gesondert budgetiert oder vergeben werden.', 'Sommige items zijn in alle offertes uitgesloten of onduidelijk: ze veranderen de rangschikking niet, maar moeten apart begroot of besteld worden.', 'Certains postes sont exclus ou imprécis dans toutes les offres : ils ne changent pas le classement mais doivent être budgétés ou achetés à part.', 'Algunas partidas están excluidas o ambiguas en todas las ofertas: no cambian la clasificación pero deben presupuestarse o comprarse aparte.', 'Niektóre pozycje są wyłączone lub niejasne we wszystkich ofertach: nie zmieniają rankingu, ale trzeba je zabudżetować lub kupić osobno.'),
    nInvalid: T('A quote without a price or exchange rate, or with a levelled cost of zero or less (a credit larger than the quote), is left out of the ranking.', 'Пропозицію без ціни чи курсу або з вирівняною вартістю нуль чи менше (кредит, більший за пропозицію) виключено з ранжування.', 'Ein Angebot ohne Preis oder Wechselkurs oder mit nivellierten Kosten von null oder weniger (Gutschrift größer als das Angebot) bleibt ohne Rang.', 'Een offerte zonder prijs of wisselkoers, of met een genivelleerde kost van nul of minder (creditering groter dan de offerte), blijft buiten de rangschikking.', 'Une offre sans prix ou sans cours de change, ou dont le coût nivelé est nul ou négatif (avoir supérieur à l’offre), est laissée hors classement.', 'Una oferta sin precio o sin tipo de cambio, o con un coste homogeneizado nulo o negativo (abono mayor que la oferta), queda fuera de la clasificación.', 'Oferta bez ceny lub kursu albo z kosztem wyrównanym równym zero lub ujemnym (uznanie większe niż oferta) pozostaje poza rankingiem.'),
    nEurFx: T('A quote in EUR is taken at rate 1; the rate left in its field is ignored:', 'Пропозицію в EUR враховано за курсом 1; курс, що лишився в полі, проігноровано:', 'Ein Angebot in EUR wird mit Kurs 1 gerechnet; der im Feld verbliebene Kurs wird ignoriert:', 'Een offerte in EUR telt aan koers 1; de koers die nog in het veld staat, wordt genegeerd:', 'Une offre en EUR est prise au cours 1 ; le cours resté dans le champ est ignoré :', 'Una oferta en EUR se toma al tipo 1; el tipo que quedó en el campo se ignora:', 'Oferta w EUR liczona jest po kursie 1; kurs pozostawiony w polu jest pomijany:'),
    nOptNoAmt: T('Options without a price are plugged like exclusions until the bidder prices them:', 'Опції без ціни доцінено як виключення, доки учасник не назве ціну:', 'Optionen ohne Preis werden wie Ausschlüsse angesetzt, bis der Bieter sie bepreist:', 'Opties zonder prijs worden aangevuld als uitsluitingen tot de inschrijver ze prijst:', 'Les options non chiffrées reçoivent un complément comme des exclusions jusqu’à ce que le soumissionnaire les chiffre :', 'Las opciones sin precio se complementan como exclusiones hasta que el licitador las cotice:', 'Opcje bez ceny są uzupełniane jak wyłączenia, dopóki oferent ich nie wyceni:'),
    nZeroPlug: T('These excluded or unclear items add 0 € to the levelled cost, so the gap is free in the comparison — enter your own estimate (or use the max / mean rule):', 'Ці виключені чи неясні позиції додають 0 € до вирівняної вартості, тож прогалина в порівнянні безкоштовна — введіть власну оцінку (або правило max / середнє):', 'Diese ausgeschlossenen oder unklaren Positionen erhöhen die nivellierten Kosten um 0 €, die Lücke ist im Vergleich also gratis — eigenen Ansatz eingeben (oder Max-/Mittelwert-Regel):', 'Deze uitgesloten of onduidelijke items voegen 0 € toe aan de genivelleerde kost, dus het gat is gratis in de vergelijking — vul uw eigen raming in (of gebruik de regel max / gemiddelde):', 'Ces postes exclus ou imprécis ajoutent 0 € au coût nivelé : la lacune est gratuite dans la comparaison — saisissez votre estimation (ou la règle max / moyenne) :', 'Estas partidas excluidas o ambiguas añaden 0 € al coste homogeneizado, así que el hueco sale gratis en la comparación — introduzca su estimación (o use la regla máx. / media):', 'Te wyłączone lub niejasne pozycje dodają 0 € do kosztu wyrównanego, więc luka jest w porównaniu darmowa — wpisz własną wycenę (lub użyj reguły max / średnia):'),
    nDup: T('Repeated ids: a second quote or item with the same id is renamed with -2; a second terms line for a quote, or a second exclusion / option line for the same quote and item, is ignored (the first counts):', 'Повторені ідентифікатори: друга пропозиція чи позиція з тим самим ід. отримує -2; другий рядок умов для пропозиції чи другий рядок виключення / опції для тієї ж пропозиції й позиції ігнорується (діє перший):', 'Doppelte Ids: ein zweites Angebot oder eine zweite Position mit derselben Id erhält -2; eine zweite Bedingungszeile für ein Angebot oder eine zweite Ausschluss-/Optionszeile für dasselbe Angebot und dieselbe Position wird ignoriert (die erste gilt):', 'Dubbele id’s: een tweede offerte of item met dezelfde id krijgt -2; een tweede voorwaardenlijn voor een offerte of een tweede uitsluitings- / optielijn voor dezelfde offerte en hetzelfde item wordt genegeerd (de eerste telt):', 'Identifiants répétés : une deuxième offre ou un deuxième poste de même identifiant reçoit -2 ; une deuxième ligne de conditions pour une offre, ou une deuxième ligne d’exclusion / option pour la même offre et le même poste, est ignorée (la première compte) :', 'Identificadores repetidos: una segunda oferta o partida con el mismo id recibe -2; una segunda línea de condiciones para una oferta, o una segunda línea de exclusión / opción para la misma oferta y partida, se ignora (cuenta la primera):', 'Powtórzone identyfikatory: druga oferta lub pozycja o tym samym id dostaje -2; drugi wiersz warunków dla oferty lub drugi wiersz wyłączenia / opcji dla tej samej oferty i pozycji jest pomijany (liczy się pierwszy):'),
    nCustoms: T('Customs value simplifications: under C and D rules the quoted price is taken as it stands, without deducting on-carriage inside the EU (duty slightly overstated; UCC art. 72(a) allows the deduction only when that leg is shown separately on the invoice). Options and plugs are taken as landed amounts on site — include any duty in them.', 'Спрощення митної вартості: за правилами груп C і D ціну пропозиції беруть як є, без вирахування доставки всередині ЄС (мито трохи завищене; ст. 72(a) МКС дозволяє вирахування лише якщо цю ділянку окремо вказано в рахунку). Опції й доцінки вважаються сумами з доставкою на майданчик — включайте в них мито.', 'Vereinfachungen beim Zollwert: bei C- und D-Klauseln gilt der Angebotspreis wie angeboten, ohne Abzug des Nachlaufs innerhalb der EU (Zoll leicht überschätzt; Art. 72 Buchst. a UZK erlaubt den Abzug nur bei gesondertem Ausweis in der Rechnung). Optionen und Ansätze gelten als Beträge frei Baustelle — Zoll darin einrechnen.', 'Vereenvoudigingen van de douanewaarde: bij C- en D-regels telt de offerteprijs zoals geboden, zonder aftrek van het natransport binnen de EU (rechten iets overschat; art. 72, a) DWU staat de aftrek alleen toe als dat traject apart op de factuur staat). Opties en aanvullingen gelden als bedragen geleverd op de bouwplaats — reken eventuele rechten erin.', 'Simplifications de la valeur en douane : sous les règles C et D, le prix de l’offre est pris tel quel, sans déduire le post-acheminement dans l’UE (droits légèrement surestimés ; l’art. 72, a) CDU ne permet la déduction que si ce tronçon figure séparément sur la facture). Options et compléments sont des montants rendus chantier — incluez-y les droits éventuels.', 'Simplificaciones del valor en aduana: con reglas C y D se toma el precio ofertado tal cual, sin deducir el transporte final dentro de la UE (arancel algo sobrestimado; el art. 72.a CAU solo permite la deducción si ese tramo figura por separado en la factura). Opciones y complementos se toman como importes puestos en obra — incluya en ellos el arancel.', 'Uproszczenia wartości celnej: przy regułach C i D cenę oferty przyjmuje się bez zmian, bez odliczenia dowozu wewnątrz UE (cło lekko zawyżone; art. 72 lit. a UKC pozwala odliczyć tylko, gdy ten odcinek wykazano osobno na fakturze). Opcje i uzupełnienia traktuje się jako kwoty z dostawą na budowę — wliczaj w nie cło.'),
    nFx: T('Foreign-currency quotes are converted at the rate you entered; the exchange risk until payment is not priced (hedge or add an adjustment).', 'Пропозиції в іноземній валюті перераховано за введеним курсом; валютний ризик до оплати не оцінено (хеджуйте або додайте коригування).', 'Fremdwährungsangebote sind zum eingegebenen Kurs umgerechnet; das Währungsrisiko bis zur Zahlung ist nicht bepreist (absichern oder Korrektur ansetzen).', 'Offertes in vreemde munt zijn omgerekend tegen de ingevoerde koers; het wisselkoersrisico tot betaling is niet geprijsd (indekken of correctie toevoegen).', 'Les offres en devise sont converties au cours saisi ; le risque de change jusqu’au paiement n’est pas chiffré (couvrir ou ajouter un ajustement).', 'Las ofertas en divisa se convierten al tipo introducido; el riesgo de cambio hasta el pago no está valorado (cubrir o añadir un ajuste).', 'Oferty w obcej walucie przeliczono po wpisanym kursie; ryzyko kursowe do zapłaty nie jest wycenione (zabezpiecz lub dodaj korektę).'),
    nNoAllow: T('Some items have no own estimate: with the max / mean rule they fall back to 0 € when no other bidder priced them.', 'Деякі позиції не мають власної оцінки: за правилом max / середнє вони дорівнюють 0 €, якщо їх ніхто інший не оцінив.', 'Einige Positionen haben keinen eigenen Ansatz: mit der Max-/Mittelwert-Regel fallen sie auf 0 € zurück, wenn kein anderer Bieter sie bepreist hat.', 'Sommige items hebben geen eigen raming: met de regel max / gemiddelde vallen ze terug op 0 € als geen andere inschrijver ze prijsde.', 'Certains postes n’ont pas d’estimation propre : avec la règle max / moyenne ils retombent à 0 € si aucun autre soumissionnaire ne les a chiffrés.', 'Algunas partidas no tienen estimación propia: con la regla máx. / media caen a 0 € si ningún otro licitador las cotizó.', 'Niektóre pozycje nie mają własnej wyceny: przy regule max / średnia spadają do 0 €, gdy nikt inny ich nie wycenił.'),
    nMethod: T('Levelled cost = price in € + priced options + plugs for excluded and unclear items + logistics the buyer still pays to land the goods on site (by Incoterms 2020 rule) + cost of the advance + commercial adjustments. Duty on the customs value per Union Customs Code art. 70–71.',
               'Вирівняна вартість = ціна в € + оцінені опції + доцінки за виключені й неясні позиції + логістика, яку покупець ще оплачує до майданчика (за правилом Incoterms 2020) + вартість авансу + комерційні коригування. Мито на митну вартість за ст. 70–71 Митного кодексу ЄС.',
               'Nivellierte Kosten = Preis in € + bepreiste Optionen + Ansätze für ausgeschlossene und unklare Positionen + Logistik, die der Käufer bis zur Baustelle noch trägt (nach Incoterms-2020-Klausel) + Kosten der Anzahlung + kaufmännische Korrekturen. Zoll auf den Zollwert nach Art. 70–71 Zollkodex der Union.',
               'Genivelleerde kost = prijs in € + geprijsde opties + aanvullingen voor uitgesloten en onduidelijke items + logistiek die de koper nog betaalt tot op de bouwplaats (volgens Incoterms 2020-regel) + kost van het voorschot + commerciële correcties. Invoerrechten op de douanewaarde volgens art. 70–71 van het douanewetboek van de Unie.',
               'Coût nivelé = prix en € + options chiffrées + compléments pour postes exclus et imprécis + logistique encore à charge de l’acheteur jusqu’au chantier (selon la règle Incoterms 2020) + coût de l’avance + ajustements commerciaux. Droits sur la valeur en douane selon les art. 70–71 du code des douanes de l’Union.',
               'Coste homogeneizado = precio en € + opciones cotizadas + complementos por partidas excluidas y ambiguas + logística que el comprador aún paga hasta obra (según la regla Incoterms 2020) + coste del anticipo + ajustes comerciales. Arancel sobre el valor en aduana según los art. 70–71 del código aduanero de la Unión.',
               'Koszt wyrównany = cena w € + wycenione opcje + uzupełnienia za pozycje wyłączone i niejasne + logistyka, którą kupujący nadal płaci do budowy (wg reguły Incoterms 2020) + koszt zaliczki + korekty handlowe. Cło od wartości celnej wg art. 70–71 unijnego kodeksu celnego.'),
    nAssume: T('Own estimates, plug rule, unclear factor, duty rate, insurance and financing rate are your assumptions (example values in the presets); the levelled cost is a comparison basis, not a price to pay.', 'Власні оцінки, правило доцінок, множник неясних позицій, ставка мита, страхування й ставка фінансування — ваші припущення (у прикладах — значення для прикладу); вирівняна вартість — база порівняння, а не ціна до сплати.', 'Eigene Ansätze, Ansatzregel, Unklar-Faktor, Zollsatz, Versicherung und Finanzierungssatz sind Ihre Annahmen (in den Beispielen angenommene Werte); die nivellierten Kosten sind eine Vergleichsbasis, kein zu zahlender Preis.', 'Eigen ramingen, aanvullingsregel, factor voor onduidelijke items, invoerrecht, verzekering en financieringsrente zijn uw aannames (in de voorbeelden aangenomen waarden); de genivelleerde kost is een vergelijkingsbasis, geen te betalen prijs.', 'Estimations propres, règle des compléments, facteur des postes imprécis, taux de droit, assurance et taux de financement sont vos hypothèses (valeurs d’exemple dans les cas types) ; le coût nivelé est une base de comparaison, pas un prix à payer.', 'Estimaciones propias, regla de complementos, factor de ambiguas, arancel, seguro y tipo de financiación son sus hipótesis (valores de ejemplo en los casos tipo); el coste homogeneizado es una base de comparación, no un precio a pagar.', 'Własne wyceny, reguła uzupełnień, mnożnik pozycji niejasnych, stawka cła, ubezpieczenie i stopa finansowania to Twoje założenia (w przykładach przyjęte wartości); koszt wyrównany to podstawa porównania, nie cena do zapłaty.'),
    nDisclaimer: T('Engineering and commercial analysis, not legal advice.', 'Інженерно-комерційний аналіз, не юридична консультація.', 'Technisch-kaufmännische Analyse, keine Rechtsberatung.', 'Technisch-commerciële analyse, geen juridisch advies.', 'Analyse technique et commerciale, pas un avis juridique.', 'Análisis técnico y comercial, no asesoramiento jurídico.', 'Analiza techniczno-handlowa, nie porada prawna.'),

  function qLabel(id) { var q = (state.quotes || []).filter(function (x) { return String(x.id) === String(id); })[0]; return q ? (q.name ? q.id + ' ' + q.name : q.id) : String(id); }
  function iLabel(id) { var it = (state.items || []).filter(function (x) { return String(x.id) === String(id); })[0]; return it ? (it.name || it.id) : String(id); }
  function incLabel(x, l) { return x === 'site' ? str(S.siteRule, l) : x; }

  function computeView(s) {
    last = solve(s);
    if (stage) stage.schedule();
    var R = last, LG = lang();
    if (!R || !R.ok) {
      var e = R && R.errors && R.errors[0];
      return { verdict: { tone: 'bad', text: e === 'engine' ? S.errEngine : (e === 'exception' ? TF(function () { return 'Error: ' + R.msg; }) : S.errQuotes) }, tiles: [], notes: [] };
    }
    var rows = R.rows, valid = rows.filter(function (r) { return r.valid; });
    var tiles = [], tables = [], notes = [];
    if (!valid.length) return { verdict: { tone: 'bad', text: S.vNone }, tiles: [], tables: [], notes: [S.nInvalid, S.nDisclaimer] };
    var byId = {}; rows.forEach(function (r) { byId[r.id] = r; });
    var lead = R.leader ? byId[R.leader] : null, raw = R.rawLeader ? byId[R.rawLeader] : null;
    var verdict;
    if (lead) {
      var tone = ['gap', 'fragile', 'zeroplug', 'optnoamt', 'dupid'].some(function (f) { return R.flags.indexOf(f) >= 0; }) ? 'warn' : 'ok';
      verdict = { tone: tone, text: TF(function (l) {
        var t = S.vLow[l] + ': ' + qLabel(lead.id) + ' — ' + eur(lead.L, l);
        if (R.lead != null) t += ' · ' + S.vLeads[l] + ' ' + keur(R.lead, l);
        if (raw && raw !== lead) t += ' · ' + S.vPaper[l] + ': ' + qLabel(raw.id) + ' (' + S.levRank[l] + ' ' + raw.rank + ')';
        return t + '.';
      }) };
    } else {
      verdict = { tone: 'warn', text: TF(function (l) { return S.vTie[l] + ': ' + R.leaders.map(qLabel).join(' = ') + ' — ' + eur(byId[R.leaders[0]].L, l) + '.'; }) };
    }
    function tile(label, value, hint, learn, tn, headline) { tiles.push({ label: label, value: str(value, LG), hint: str(hint || '', LG), learn: learn, tone: tn || null, headline: headline !== false }); }
    var first = lead || byId[R.leaders[0]];
    tile(S.tLow, keur(first.L, LG), qLabel(first.id), 'level', 'ok');
    tile(S.tLead, R.lead == null ? '—' : keur(R.lead, LG), R.second ? qLabel(R.second) + ' · ' + pc(R.lead / first.L, LG, 1) : '', 'level', R.lead != null && R.lead > 0 ? null : 'warn');
    tile(S.tGap, pc(first.gapShare, LG, 1), keur(first.plug, LG) + ' · ' + str(S.ofLev, LG), 'plugs', R.flags.indexOf('gap') >= 0 ? 'warn' : 'ok');
    if (R.stability) tile(S.tStab, nf(R.stability.lo, LG, 2) + ' … ' + (R.stability.hi == null ? '∞' : nf(R.stability.hi, LG, 2)), S.fHint[LG], 'stability', R.flags.indexOf('fragile') >= 0 ? 'warn' : 'ok');
    if (raw) tile(S.tPaper, keur(raw.P, LG), qLabel(raw.id) + ' → ' + keur(raw.L, LG) + ' (' + str(S.levRank, LG) + ' ' + raw.rank + ')', 'level', raw.rank === 1 ? null : 'warn', false);

    /* 1 levelling table */
    var lev = rows.slice().sort(function (a, b) { return (a.valid ? a.L : Infinity) - (b.valid ? b.L : Infinity) || (a.id < b.id ? -1 : 1); }).map(function (r) {
      if (!r.valid) return { tone: 'bad', cells: [qLabel(r.id), { text: S.invalidQ[r.reason] }, '', '', '', '', '', '', '—', ''] };
      function m(v) { return { value: Math.round(v), precision: 0, num: true }; }
      return { tone: r.rank === 1 ? 'ok' : null, cells: [qLabel(r.id), m(r.P), m(r.opt), m(r.plug), m(r.logistics), m(r.fin), m(r.adj), m(r.L),
        { text: r.rawRank + ' → ' + r.rank, num: true }, { text: TF(function (l) { return pc(r.gapShare, l, 1); }), num: true }] };
    });
    tables.push({ title: S.tabLev, head: [S.qName, S.cP, S.cOpt, S.cPlug, S.cLog, S.cFin, S.cAdj, S.cL, S.cRank, S.cGap], rows: lev });

    /* 2 scope matrix */
    var inp = R.input;
    if (inp.items.length) {
      var head = [S.iName, S.allowance].concat(valid.map(function (r) { return r.id; }));
      var srows = inp.items.map(function (it) {
        var all = R.allExcluded.indexOf(it.id) >= 0;
        return { tone: all ? 'warn' : null, cells: [it.name || it.id, { value: it.allowance, precision: 0, num: true }].concat(valid.map(function (r) {
          var c = r.cells[it.id];
          if (c.s === 'inc') return { text: '✓', num: true };
          return { text: TF(function (l) { return S.stShort[c.s] + ' ' + nf(Math.round(c.add), l, 0) + (c.from && c.from !== 'allowance' ? ' (' + str(S.from[c.from], l) + ')' : ''); }), num: true };
        })) };
      });
      tables.push({ title: S.tabScope, head: head, rows: srows });
    }
    /* 3 logistics */
    var lrows = valid.filter(function (r) { return r.incoterm !== 'site' || r.logistics > 0; }).map(function (r) {
      var q = inp.quotes.filter(function (x) { return x.id === r.id; })[0];
      return { cells: [qLabel(r.id), TF(function (l) { return incLabel(r.incoterm, l) + ' · ' + (q.eu ? S.EUw[l] : S.nonEU[l]); })].concat(LEGS.map(function (e) { return { value: Math.round(r.log[e]), precision: 0, num: true }; }))
        .concat([{ value: r.customsValue == null ? null : Math.round(r.customsValue), precision: 0, num: true }, { value: Math.round(r.logistics), precision: 0, num: true }]) };
    });
    if (lrows.length) tables.push({ title: S.tabLog, head: [S.qName, TF(function (l) { return S.incoterm[l] + ' · ' + S.cOrigin[l]; })].concat(LEGS.map(function (e) { return S.legs[e]; })).concat([S.cCV, S.cTot]), rows: lrows });

    if (R.flags.indexOf('reversal') >= 0) notes.push(S.nReversal);
    if (R.flags.indexOf('gap') >= 0) notes.push(S.nGap);
    if (R.flags.indexOf('fragile') >= 0) notes.push(S.nFragile);
    if (R.flags.indexOf('tie') >= 0) notes.push(S.nTie);
    if (R.flags.indexOf('allexc') >= 0) notes.push(TF(function (l) { return S.nAllExc[l] + ' (' + R.allExcluded.map(iLabel).join('; ') + ')'; }));
    if (R.flags.indexOf('invalid') >= 0) notes.push(S.nInvalid);
    if (R.flags.indexOf('fx') >= 0) notes.push(S.nFx);
    if (R.flags.indexOf('noallow') >= 0) notes.push(S.nNoAllow);
    function cellList(list) { return list.map(function (c) { return c.q + ' · ' + iLabel(c.item); }).join('; '); }
    if (R.flags.indexOf('zeroplug') >= 0) notes.push(TF(function (l) { return S.nZeroPlug[l] + ' ' + cellList(R.zeroPlug) + '.'; }));
    if (R.flags.indexOf('optnoamt') >= 0) notes.push(TF(function (l) { return S.nOptNoAmt[l] + ' ' + cellList(R.optNoAmount) + '.'; }));
    var eurIgn = inp.quotes.filter(function (q) { return q.fxIgnored; }).map(function (q) { return q.id; });
    if (eurIgn.length) notes.push(TF(function (l) { return S.nEurFx[l] + ' ' + eurIgn.join(', ') + '.'; }));
    var dupL = (R.duplicates || []).concat(R.raw && R.raw.dupRows || []);
    if (dupL.length) notes.push(TF(function (l) { return S.nDup[l] + ' ' + dupL.join(', ') + '.'; }));
    if (inp.quotes.some(function (q) { return !q.eu && q.incoterm !== 'DDP' && q.incoterm !== 'site'; })) notes.push(S.nCustoms);
    notes.push(S.nMethod);
    notes.push(S.nAssume);
    notes.push(S.nDisclaimer);
    return { verdict: verdict, tiles: tiles, tables: tables, notes: notes };
  }

  /* ---- stage: stacked bars (top) and levelled cost against the plug factor (bottom) ---- */
  function renderStage(size, st) {
    var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim() || '#888', lineC = cs.getPropertyValue('--line').trim() || '#ccc', ink = cs.getPropertyValue('--ink').trim() || '#111';
    var okC = cs.getPropertyValue('--ok').trim() || '#1e8449';
    var font = cs.getPropertyValue('--font').trim() || 'sans-serif';
    ctx.clearRect(0, 0, w, h);
    var R = last, B = lib();
    if (!R || !R.ok || !B) return;
    var valid = R.rows.filter(function (r) { return r.valid; });
    if (!valid.length) return;
    var l = lang(), fs = coarse ? 10 : 11;
    ctx.font = fs + 'px ' + font;
    var Lm = coarse ? 70 : 120, Rm = coarse ? 10 : 18, top = 10;
    var bw = w - Lm - Rm;
    if (bw < 80) return;
    var parts = ['P', 'opt', 'plug', 'logistics', 'other'];
    var cols = [DiagramUI.series(0), DiagramUI.series(1), DiagramUI.series(3), DiagramUI.series(2), DiagramUI.series(4)];
    var names = [S.cP, S.cOpt, S.cPlug, S.cLog, S.other];
    var maxL = 0; valid.forEach(function (r) { maxL = Math.max(maxL, r.L, r.P + r.opt + r.plug + r.logistics + Math.max(0, r.fin + r.adj)); });
    var rh = coarse ? 22 : 26, hTop = top + valid.length * rh + 40;
    var sorted = valid.slice().sort(function (a, b) { return a.L - b.L || (a.id < b.id ? -1 : 1); });
    function X(v) { return Lm + v / maxL * bw * 0.86; }
    ctx.textBaseline = 'middle';
    sorted.forEach(function (r, k) {
      var y = top + k * rh, x = Lm;
      ctx.fillStyle = ink; ctx.textAlign = 'right';
      var lab = (r.rank === 1 ? '★ ' : '') + r.id + (r.name && !coarse ? ' ' + r.name.slice(0, 14) : '');
      ctx.fillText(lab, Lm - 6, y + rh / 2);
      var vals = [r.P, r.opt, r.plug, r.logistics, r.fin + r.adj];
      vals.forEach(function (v, i) {
        if (!(v > 0)) return;
        var x2 = X((x - Lm) / (bw * 0.86) * maxL + v);
        ctx.fillStyle = cols[i]; ctx.globalAlpha = i === 2 ? 0.9 : 0.75;
        ctx.fillRect(x, y + 3, Math.max(1, x2 - x), rh - 6); ctx.globalAlpha = 1;
        x = x2;
      });
      ctx.fillStyle = ink; ctx.textAlign = 'left';
      ctx.fillText(keur(r.L, l) + ' (' + r.rawRank + '→' + r.rank + ')', X(r.L) + 4 > x ? X(r.L) + 4 : x + 4, y + rh / 2);
    });
    /* legend */
    var ly = top + sorted.length * rh + 8, lx = Lm;
    ctx.textAlign = 'left';
    names.forEach(function (nm, i) {
      var t = str(nm, l); ctx.fillStyle = cols[i]; ctx.fillRect(lx, ly - 5, 10, 10); ctx.fillStyle = muted; ctx.fillText(t, lx + 14, ly);
      lx += 22 + ctx.measureText(t).width; if (lx > w - 60) { lx = Lm; ly += 14; }
    });
    /* bottom: L_j(f) = L_j - plug_j + f plug_j, f in 0..2 */
    var y0 = Math.max(ly + 22, hTop + 6), ph = h - y0 - 30;
    if (ph < 60) return;
    var cv = B.curve(R.raw, 2, 40), ymin = Infinity, ymax = -Infinity;
    cv.forEach(function (c) { c.pts.forEach(function (p) { ymin = Math.min(ymin, p[1]); ymax = Math.max(ymax, p[1]); }); });
    if (!(ymax > ymin)) { ymax = ymin + 1; }
    var pad = (ymax - ymin) * 0.06; ymin -= pad; ymax += pad;
    var pw = bw;
    function FX(f) { return Lm + f / 2 * pw; }
    function FY(v) { return y0 + ph - (v - ymin) / (ymax - ymin) * ph; }
    if (R.stability) {
      var a = FX(Math.min(2, R.stability.lo)), b = FX(Math.min(2, R.stability.hi == null ? 2 : R.stability.hi));
      ctx.fillStyle = okC; ctx.globalAlpha = 0.10; ctx.fillRect(a, y0, Math.max(0, b - a), ph); ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = muted; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Lm, y0); ctx.lineTo(Lm, y0 + ph); ctx.lineTo(Lm + pw, y0 + ph); ctx.stroke();
    ctx.strokeStyle = lineC; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(FX(1), y0); ctx.lineTo(FX(1), y0 + ph); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    [0, 0.5, 1, 1.5, 2].forEach(function (f) { ctx.fillText(nf(f, l, 1), FX(f), y0 + ph + 3); });
    ctx.fillText(str(S.fAxis, l), Lm + pw / 2, y0 + ph + 15);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    var yt = DiagramUI.ticks(ymin, ymax, ph, size.density) || [ymin, ymax];
    yt.forEach(function (v) { if (v < ymin || v > ymax) return; ctx.fillText(keur(v, l), Lm - 4, FY(v)); });
    var order = sorted.map(function (r) { return r.id; });
    cv.forEach(function (c) {
      var k = order.indexOf(c.id);
      ctx.strokeStyle = DiagramUI.series(k % 6); ctx.lineWidth = c.id === R.leader ? 2.5 : 1.5;
      ctx.beginPath(); c.pts.forEach(function (p, i) { if (i) ctx.lineTo(FX(p[0]), FY(p[1])); else ctx.moveTo(FX(p[0]), FY(p[1])); }); ctx.stroke();
      var e = c.pts[c.pts.length - 1]; ctx.fillStyle = DiagramUI.series(k % 6); ctx.textAlign = 'right'; ctx.fillText(c.id, FX(2) - 2, FY(e[1]) - 7);
    });
  }

  function applyPreset(t, p) {
    var keep = { tenderRef: t.tenderRef, preparedBy: t.preparedBy }, l = lang();
    Object.keys(DEFAULTS).forEach(function (k) { if (k !== 'items' && k !== 'quotes' && k !== 'gaps') t[k] = JSON.parse(JSON.stringify(DEFAULTS[k])); });
    t.tenderRef = keep.tenderRef; t.preparedBy = keep.preparedBy;
    t.policy = p.policy; t.unclear = +(100 * p.unclear).toFixed(6); t.rate = +(100 * p.rate).toFixed(6); t.gapWarn = +(100 * p.gapWarn).toFixed(6);
    t.load = p.load || 0; t.ins = +(100 * (p.ins || 0)).toFixed(6); t.duty = +(100 * (p.duty || 0)).toFixed(6); t.impFix = p.impFix || 0; t.unload = p.unload || 0;
    t.pkgName = PKG[p.id] || '';
    setArr(t, 'items', p.items.map(function (it) { return { id: it.id, name: str(IK[it.key], l) || it.key, allowance: it.allowance }; }));
    var names = QN[p.id] || [];
    setArr(t, 'quotes', p.quotes.map(function (q, k) {
      return { id: q.id, name: names[k] || '', price: q.price, cur: q.cur, fx: q.fx, incoterm: q.incoterm, eu: q.eu !== false };
    }));
    setArr(t, 'terms', p.quotes.filter(function (q) { return q.pre || q.main || q.onc || q.adv || q.advMonths || q.adj; }).map(function (q) {
      return { q: q.id, pre: q.pre || 0, main: q.main || 0, onc: q.onc || 0, adv: +(100 * (q.adv || 0)).toFixed(6), months: q.advMonths || 0, adj: q.adj || 0 };
    }));
    var gaps = [];
    p.quotes.forEach(function (q) { Object.keys(q.cells).forEach(function (iid) { var c = q.cells[iid]; gaps.push({ q: q.id, item: iid, s: c.s, amt: c.amt == null ? null : c.amt }); }); });
    setArr(t, 'gaps', gaps);
  }

                  'Die nivellierten Kosten sind, was das Paket Sie mit diesem Bieter kostet: sein Preis in Euro, plus die Optionen, die Sie brauchen, plus Ihr Ansatz für jede fehlende Position, plus Transport, Versicherung und Zoll bis zur Baustelle, plus Finanzierung der Anzahlung und kaufmännische Korrekturen. Vergleichen Sie nivellierte Kosten, nicht Preise.',
                  'De genivelleerde kost is wat het pakket u met die inschrijver kost: zijn prijs in euro, plus de opties die u moet nemen, plus uw aanvulling voor elk item dat ontbreekt, plus transport, verzekering en invoerrechten tot op de bouwplaats, plus de financiering van het voorschot en commerciële correcties. Vergelijk genivelleerde kosten, geen prijzen.',
                  'Le coût nivelé est ce que le lot vous coûtera avec ce soumissionnaire : son prix en euros, plus les options à acheter, plus votre complément pour chaque poste omis, plus transport, assurance et droits jusqu’au chantier, plus le financement de son avance et les ajustements commerciaux. Comparez des coûts nivelés, pas des prix.',
                  'El coste homogeneizado es lo que le costará el paquete con ese licitador: su precio en euros, más las opciones que debe comprar, más su complemento por cada partida omitida, más transporte, seguro y aranceles hasta obra, más la financiación del anticipo y los ajustes comerciales. Compare costes homogeneizados, no precios.',
                  'Koszt wyrównany to tyle, ile kosztuje Cię pakiet z danym oferentem: jego cena w euro plus opcje do kupienia, plus Twoje uzupełnienie za każdą pominiętą pozycję, plus transport, ubezpieczenie i cło do budowy, plus finansowanie zaliczki i korekty handlowe. Porównuj koszty wyrównane, nie ceny.') },
        scope: { title: T('Scope matrix: included, excluded, unclear, option', 'Матриця обсягу: включено, виключено, неясно, опція', 'Leistungsmatrix: enthalten, ausgeschlossen, unklar, Option', 'Scopematrix: inbegrepen, uitgesloten, onduidelijk, optie', 'Matrice du périmètre : inclus, exclu, imprécis, option', 'Matriz de alcance: incluido, excluido, ambiguo, opción', 'Macierz zakresu: zawarte, wyłączone, niejasne, opcja'),
          body: T('List the scope items that bidders treat differently (from your requisition, or the lines that usually go missing: hoisting, testing, documentation, temporary works). Read every quote’s exclusions and qualifications and record them here; whatever is not listed counts as included. A priced option adds the bidder’s own price; an exclusion adds your plug.',
                  'Перелічіть позиції обсягу, які учасники трактують по-різному (з ваших технічних вимог або ті, що зазвичай випадають: підйом, випробування, документація, тимчасові роботи). Прочитайте виключення й застереження кожної пропозиції та внесіть їх сюди; усе, чого тут немає, вважається включеним. Окремо оцінена опція додає ціну учасника; виключення — вашу доцінку.',
                  'Listen Sie die Positionen auf, die Bieter unterschiedlich behandeln (aus Ihrer Anfrage oder die üblichen Lücken: Einheben, Prüfungen, Dokumentation, Hilfsleistungen). Lesen Sie Ausschlüsse und Vorbehalte jedes Angebots und tragen Sie sie hier ein; alles Nichtaufgeführte gilt als enthalten. Eine bepreiste Option addiert den Bieterpreis, ein Ausschluss Ihren Ansatz.',
                  'Som de scope-items op die inschrijvers verschillend behandelen (uit uw aanvraagspecificatie of de gebruikelijke gaten: inhijsen, testen, documentatie, tijdelijke werken). Lees de uitsluitingen en voorbehouden van elke offerte en noteer ze hier; wat niet vermeld is, geldt als inbegrepen. Een geprijsde optie telt de prijs van de inschrijver op, een uitsluiting uw aanvulling.',
                  'Listez les postes que les soumissionnaires traitent différemment (de votre réquisition, ou les oublis habituels : levage, essais, documentation, ouvrages provisoires). Lisez exclusions et réserves de chaque offre et reportez-les ici ; ce qui n’est pas listé est réputé inclus. Une option chiffrée ajoute le prix du soumissionnaire ; une exclusion, votre complément.',
                  'Enumere las partidas que los licitadores tratan de forma distinta (de su requisición o los huecos habituales: izado, pruebas, documentación, medios auxiliares). Lea exclusiones y salvedades de cada oferta y anótelas aquí; lo no listado se considera incluido. Una opción cotizada suma el precio del licitador; una exclusión, su complemento.',
                  'Wypisz pozycje, które oferenci traktują różnie (ze specyfikacji zapytania lub typowe luki: wciągnięcie, próby, dokumentacja, roboty tymczasowe). Przeczytaj wyłączenia i zastrzeżenia każdej oferty i wpisz je tutaj; to, czego nie wymieniono, uznaje się za zawarte. Wyceniona opcja dodaje cenę oferenta, wyłączenie — Twoje uzupełnienie.') },
        plugs: { title: T('Plugs and the plug rule', 'Доцінки та правило доцінок', 'Ansätze und Ansatzregel', 'Aanvullingen en de aanvullingsregel', 'Compléments et règle de complément', 'Complementos y regla de complemento', 'Uzupełnienia i reguła uzupełnień'),
          body: T('A plug is the money you add for a missing item. Three common rules: your own estimate; the highest price another bidder gave for that item (conservative, used when quotes are itemised); the mean of the others. Choose the rule before opening — the steel example shows it can pick the winner. Unclear items count at a share of the plug (100 % until the bidder confirms in writing).',
                  'Доцінка — це сума, яку ви додаєте за відсутню позицію. Три поширені правила: власна оцінка; найвища ціна, яку за цю позицію дав інший учасник (консервативно, коли пропозиції мають розбивку); середня ціна інших. Оберіть правило до розкриття — приклад зі сталлю показує, що воно може визначити переможця. Неясні позиції враховуються як частка доцінки (100 %, доки учасник не підтвердить письмово).',
                  'Ein Ansatz ist der Betrag, den Sie für eine fehlende Position zuschlagen. Drei übliche Regeln: eigener Ansatz; der höchste Preis eines anderen Bieters für diese Position (vorsichtig, bei aufgeschlüsselten Angeboten); der Mittelwert der anderen. Regel vor der Öffnung wählen — das Stahlbeispiel zeigt, dass sie den Gewinner bestimmen kann. Unklare Positionen zählen mit einem Anteil (100 %, bis der Bieter schriftlich bestätigt).',
                  'Een aanvulling is het bedrag dat u optelt voor een ontbrekend item. Drie gangbare regels: uw eigen raming; de hoogste prijs die een andere inschrijver voor dat item gaf (voorzichtig, bij uitgesplitste offertes); het gemiddelde van de anderen. Kies de regel vóór de opening — het staalvoorbeeld toont dat ze de winnaar kan bepalen. Onduidelijke items tellen voor een deel van de aanvulling (100 % tot schriftelijke bevestiging).',
                  'Un complément est le montant ajouté pour un poste manquant. Trois règles courantes : votre estimation ; le prix le plus élevé d’un autre soumissionnaire pour ce poste (prudent, si les offres sont détaillées) ; la moyenne des autres. Choisissez la règle avant l’ouverture — l’exemple acier montre qu’elle peut désigner le gagnant. Les postes imprécis comptent pour une part du complément (100 % jusqu’à confirmation écrite).',
                  'Un complemento es el importe que suma por una partida ausente. Tres reglas habituales: su estimación; el precio más alto de otro licitador para esa partida (prudente, con ofertas desglosadas); la media de los demás. Elija la regla antes de abrir — el ejemplo del acero muestra que puede decidir el ganador. Las partidas ambiguas cuentan por una parte del complemento (100 % hasta confirmación escrita).',
                  'Uzupełnienie to kwota dodawana za brakującą pozycję. Trzy typowe reguły: własna wycena; najwyższa cena innego oferenta za tę pozycję (ostrożnie, przy ofertach z rozbiciem); średnia pozostałych. Wybierz regułę przed otwarciem — przykład ze stalą pokazuje, że może wskazać zwycięzcę. Pozycje niejasne liczą się jako część uzupełnienia (100 % do pisemnego potwierdzenia).') },
        incoterms: { title: T('Incoterms 2020: who pays which leg', 'Incoterms 2020: хто платить за яку ділянку', 'Incoterms 2020: wer zahlt welchen Abschnitt', 'Incoterms 2020: wie betaalt welk traject', 'Incoterms 2020 : qui paie quel tronçon', 'Incoterms 2020: quién paga cada tramo', 'Incoterms 2020: kto płaci za który odcinek'),
          body: T('Every quote is brought to one basis: landed on site, import cleared, unloaded. Under EXW you pay everything from the seller’s floor; FCA adds loading and export formalities by the seller; FAS/FOB also the leg to the port; CFR/CPT the main carriage (CPT here to the site); CIF/CIP also the insurance; DAP carries the risk to site (no insurance for you); DPU also unloads; DDP also clears import and pays duty. Enter the legs per quote; the tool adds the ones the seller does not pay.',
                  'Кожну пропозицію зводять до однієї бази: доставлено на майданчик, розмитнено, розвантажено. За EXW ви платите все від складу продавця; FCA — продавець завантажує й оформлює експорт; FAS/FOB — ще й доставка до порту; CFR/CPT — основне перевезення (CPT тут до майданчика); CIF/CIP — ще й страхування; DAP — ризик до майданчика несе продавець (страхування вам не потрібне); DPU — ще й розвантаження; DDP — ще й імпортне оформлення та мито. Введіть ділянки для кожної пропозиції; інструмент додасть ті, яких не оплачує продавець.',
                  'Jedes Angebot wird auf eine Basis gebracht: frei Baustelle, verzollt, entladen. Bei EXW zahlen Sie alles ab Werk; FCA: Verladung und Ausfuhr durch den Verkäufer; FAS/FOB zusätzlich der Vorlauf zum Hafen; CFR/CPT der Hauptlauf (CPT hier bis zur Baustelle); CIF/CIP zusätzlich die Versicherung; DAP trägt das Risiko bis zur Baustelle (keine Versicherung für Sie); DPU entlädt auch; DDP verzollt auch und zahlt den Zoll. Abschnitte je Angebot eingeben; das Werkzeug addiert die, die der Verkäufer nicht zahlt.',
                  'Elke offerte wordt op één basis gebracht: geleverd op de bouwplaats, ingeklaard, gelost. Bij EXW betaalt u alles vanaf de vloer van de verkoper; FCA: laden en uitvoerformaliteiten door de verkoper; FAS/FOB ook het traject tot de haven; CFR/CPT het hoofdtransport (CPT hier tot de bouwplaats); CIF/CIP ook de verzekering; DAP draagt het risico tot de bouwplaats (geen verzekering voor u); DPU lost ook; DDP klaart ook in en betaalt de rechten. Vul de trajecten per offerte in; de tool telt op wat de verkoper niet betaalt.',
                  'Chaque offre est ramenée à une base : rendu chantier, dédouané, déchargé. En EXW vous payez tout depuis l’usine ; FCA : chargement et formalités d’export par le vendeur ; FAS/FOB aussi le pré-acheminement au port ; CFR/CPT le transport principal (CPT ici jusqu’au chantier) ; CIF/CIP aussi l’assurance ; DAP porte le risque jusqu’au chantier (pas d’assurance pour vous) ; DPU décharge aussi ; DDP dédouane aussi et paie les droits. Saisissez les tronçons par offre ; l’outil ajoute ceux que le vendeur ne paie pas.',
                  'Cada oferta se lleva a una base: puesta en obra, despachada, descargada. En EXW paga todo desde el suelo del vendedor; FCA: carga y trámites de exportación por el vendedor; FAS/FOB también el tramo al puerto; CFR/CPT el transporte principal (CPT aquí hasta obra); CIF/CIP también el seguro; DAP lleva el riesgo hasta obra (sin seguro para usted); DPU también descarga; DDP también despacha importación y paga aranceles. Introduzca los tramos por oferta; la herramienta suma los que no paga el vendedor.',
                  'Każdą ofertę sprowadza się do jednej bazy: dostawa na budowę, odprawa importowa, rozładunek. Przy EXW płacisz wszystko od magazynu sprzedawcy; FCA: załadunek i formalności wywozowe po stronie sprzedawcy; FAS/FOB także dowóz do portu; CFR/CPT przewóz główny (CPT tu do budowy); CIF/CIP także ubezpieczenie; DAP — ryzyko do budowy po stronie sprzedawcy (bez ubezpieczenia dla Ciebie); DPU także rozładunek; DDP także odprawa i cło. Wpisz odcinki dla każdej oferty; narzędzie doda te, których nie płaci sprzedawca.') },
        customs: { title: T('Customs value and duty', 'Митна вартість і мито', 'Zollwert und Zoll', 'Douanewaarde en invoerrechten', 'Valeur en douane et droits', 'Valor en aduana y aranceles', 'Wartość celna i cło'),
          body: T('For goods from outside the EU the duty is charged on the customs value: the price plus transport, insurance, loading and handling up to the entry into the Union (Union Customs Code, Reg. (EU) 952/2013 art. 70(1) and 71(1)(e)); transport after entry and erection or technical assistance after entry are not included (art. 72). So a FOB quote pays duty on its freight too. Take the rate for the HS code from TARIC. Simplification: a C or D price is taken as the customs value as quoted (on-carriage inside the EU not deducted).',
                  'Для товарів з-поза ЄС мито нараховується на митну вартість: ціна плюс перевезення, страхування, завантаження й обробка до ввезення в Союз (Митний кодекс Союзу, Регламент (ЄС) 952/2013, ст. 70(1) і 71(1)(e)); перевезення після ввезення та монтаж чи технічна допомога після ввезення не включаються (ст. 72). Тож пропозиція FOB сплачує мито й на фрахт. Ставку для коду ТН ЗЕД беріть з TARIC. Спрощення: ціна за правилом C чи D береться як митна вартість без змін (доставку всередині ЄС не вираховано).',
                  'Für Waren von außerhalb der EU wird der Zoll auf den Zollwert erhoben: Preis plus Beförderung, Versicherung, Lade- und Behandlungskosten bis zum Verbringen in die Union (Zollkodex der Union, VO (EU) 952/2013 Art. 70 Abs. 1 und 71 Abs. 1 Buchst. e); Beförderung nach dem Eingang sowie Montage oder technische Unterstützung danach gehören nicht dazu (Art. 72). Ein FOB-Angebot zahlt also auch Zoll auf die Fracht. Satz der HS-Position aus TARIC. Vereinfachung: ein C- oder D-Preis gilt unverändert als Zollwert (Nachlauf in der EU nicht abgezogen).',
                  'Voor goederen van buiten de EU worden de invoerrechten geheven op de douanewaarde: prijs plus vervoer, verzekering, laad- en behandelingskosten tot het binnenbrengen in de Unie (douanewetboek van de Unie, Verord. (EU) 952/2013 art. 70, lid 1, en 71, lid 1, e)); vervoer na binnenkomst en montage of technische bijstand daarna tellen niet mee (art. 72). Een FOB-offerte betaalt dus ook rechten op de vracht. Tarief van de GS-code uit TARIC. Vereenvoudiging: een C- of D-prijs telt ongewijzigd als douanewaarde (natransport binnen de EU niet afgetrokken).',
                  'Pour les marchandises hors UE, les droits portent sur la valeur en douane : prix plus transport, assurance, chargement et manutention jusqu’à l’entrée dans l’Union (code des douanes de l’Union, règl. (UE) 952/2013 art. 70, par. 1, et 71, par. 1, e)) ; le transport après l’entrée et le montage ou l’assistance technique après l’entrée n’en font pas partie (art. 72). Une offre FOB paie donc aussi des droits sur le fret. Taux du code SH dans TARIC. Simplification : un prix C ou D est pris tel quel comme valeur en douane (post-acheminement dans l’UE non déduit).',
                  'Para mercancías de fuera de la UE el arancel se aplica sobre el valor en aduana: precio más transporte, seguro, carga y manipulación hasta la entrada en la Unión (código aduanero de la Unión, Regl. (UE) 952/2013 art. 70.1 y 71.1.e); el transporte tras la entrada y el montaje o asistencia técnica posteriores no se incluyen (art. 72). Así una oferta FOB paga arancel también sobre el flete. Tipo del código SA en TARIC. Simplificación: un precio C o D se toma tal cual como valor en aduana (transporte final dentro de la UE no deducido).',
                  'Dla towarów spoza UE cło nalicza się od wartości celnej: cena plus transport, ubezpieczenie, załadunek i obsługa do wprowadzenia do Unii (unijny kodeks celny, rozp. (UE) 952/2013 art. 70 ust. 1 i 71 ust. 1 lit. e); transport po wprowadzeniu oraz montaż lub pomoc techniczna po wprowadzeniu nie są wliczane (art. 72). Oferta FOB płaci więc cło także od frachtu. Stawkę kodu HS weź z TARIC. Uproszczenie: cenę C lub D przyjmuje się bez zmian jako wartość celną (dowóz wewnątrz UE nie jest odliczany).') },
        money: { title: T('Currency, advances, adjustments', 'Валюта, аванси, коригування', 'Währung, Anzahlungen, Korrekturen', 'Munt, voorschotten, correcties', 'Devise, avances, ajustements', 'Divisa, anticipos, ajustes', 'Waluta, zaliczki, korekty'),
          body: T('A foreign-currency price is converted at the rate you enter (euro per unit); the exchange risk until payment is yours unless hedged. An advance of a% paid m months before delivery costs a × price × rate × m/12. Put other commercial differences — shorter warranty, lower LD cap, longer payment terms — as a stated euro adjustment per quote, with the reason in the record.',
                  'Ціна в іноземній валюті перераховується за введеним курсом (євро за одиницю); валютний ризик до оплати — ваш, якщо не хеджовано. Аванс a %, сплачений за m місяців до поставки, коштує a × ціна × ставка × m/12. Інші комерційні відмінності — коротша гарантія, нижчий ліміт неустойки, довша відстрочка — вносьте як заявлене коригування в євро для кожної пропозиції з причиною в записі.',
                  'Ein Fremdwährungspreis wird zum eingegebenen Kurs (Euro je Einheit) umgerechnet; das Währungsrisiko bis zur Zahlung tragen Sie, wenn nicht abgesichert. Eine Anzahlung von a %, m Monate vor Lieferung gezahlt, kostet a × Preis × Satz × m/12. Andere kaufmännische Unterschiede — kürzere Gewährleistung, niedrigere Vertragsstrafen-Obergrenze, längere Zahlungsziele — als ausgewiesene Euro-Korrektur je Angebot mit Begründung im Protokoll.',
                  'Een prijs in vreemde munt wordt omgerekend tegen de ingevoerde koers (euro per eenheid); het wisselkoersrisico tot betaling is voor u, tenzij ingedekt. Een voorschot van a %, m maanden vóór levering betaald, kost a × prijs × rente × m/12. Andere commerciële verschillen — kortere waarborg, lager plafond voor vertragingsboetes, langere betalingstermijn — als vermelde correctie in euro per offerte, met de reden in het verslag.',
                  'Un prix en devise est converti au cours saisi (euros par unité) ; le risque de change jusqu’au paiement est le vôtre sauf couverture. Une avance de a % versée m mois avant livraison coûte a × prix × taux × m/12. Les autres écarts commerciaux — garantie plus courte, plafond de pénalités plus bas, délai de paiement plus long — en ajustement en euros affiché par offre, avec le motif au procès-verbal.',
                  'Un precio en divisa se convierte al tipo introducido (euros por unidad); el riesgo de cambio hasta el pago es suyo salvo cobertura. Un anticipo del a % pagado m meses antes de la entrega cuesta a × precio × tipo × m/12. Otras diferencias comerciales — garantía más corta, tope de penalizaciones menor, plazo de pago más largo — como ajuste declarado en euros por oferta, con el motivo en el registro.',
                  'Cena w obcej walucie jest przeliczana po wpisanym kursie (euro za jednostkę); ryzyko kursowe do zapłaty jest Twoje, jeśli go nie zabezpieczysz. Zaliczka a % płatna m miesięcy przed dostawą kosztuje a × cena × stopa × m/12. Inne różnice handlowe — krótsza gwarancja, niższy limit kar, dłuższy termin płatności — wpisz jako jawną korektę w euro dla oferty, z uzasadnieniem w protokole.') },
        stability: { title: T('How sure is the winner?', 'Наскільки надійний переможець?', 'Wie sicher ist der Gewinner?', 'Hoe zeker is de winnaar?', 'Quelle certitude pour le gagnant ?', '¿Qué tan segura es la ganadora?', 'Na ile pewny jest zwycięzca?'),
          body: T('Your plugs are estimates. Multiply all of them by a common factor f: the leader stays the cheapest for f between the two values on the tile. If the range does not reach well past 1 (below 1.5) or starts above 0.5, a moderate estimating error changes the winner — clarify the leader’s exclusions in writing before you carry its price into your bid or award the subcontract.',
                  'Ваші доцінки — це оцінки. Помножте їх усі на спільний множник f: лідер лишається найдешевшим для f між двома значеннями на плитці. Якщо діапазон не сягає помітно далі 1 (менше 1,5) або починається вище 0,5, помірна похибка оцінки змінює переможця — з’ясуйте виключення лідера письмово, перш ніж переносити його ціну у свою пропозицію чи укладати субпідряд.',
                  'Ihre Ansätze sind Schätzungen. Multiplizieren Sie alle mit einem gemeinsamen Faktor f: der Erste bleibt am günstigsten für f zwischen den beiden Werten auf der Kachel. Reicht der Bereich nicht deutlich über 1 (unter 1,5) oder beginnt er über 0,5, ändert ein mäßiger Schätzfehler den Gewinner — Ausschlüsse des Ersten schriftlich klären, bevor sein Preis ins Angebot geht oder der Auftrag vergeben wird.',
                  'Uw aanvullingen zijn ramingen. Vermenigvuldig ze allemaal met een gemeenschappelijke factor f: de eerste blijft de goedkoopste voor f tussen de twee waarden op de tegel. Reikt het bereik niet duidelijk voorbij 1 (onder 1,5) of begint het boven 0,5, dan verandert een matige ramingsfout de winnaar — laat de uitsluitingen van de eerste schriftelijk verduidelijken voordat u zijn prijs in uw offerte neemt of de onderaanneming gunt.',
                  'Vos compléments sont des estimations. Multipliez-les tous par un facteur commun f : le premier reste le moins cher pour f entre les deux valeurs de la tuile. Si la plage ne dépasse pas nettement 1 (moins de 1,5) ou commence au-dessus de 0,5, une erreur d’estimation modérée change le gagnant — faites clarifier par écrit les exclusions du premier avant de reprendre son prix ou de passer la sous-traitance.',
                  'Sus complementos son estimaciones. Multiplíquelos todos por un factor común f: la primera sigue siendo la más barata para f entre los dos valores de la ficha. Si el rango no llega claramente más allá de 1 (menos de 1,5) o empieza por encima de 0,5, un error moderado de estimación cambia la ganadora — aclare por escrito las exclusiones de la primera antes de llevar su precio a su oferta o adjudicar el subcontrato.',
                  'Twoje uzupełnienia to szacunki. Pomnóż je wszystkie przez wspólny mnożnik f: lider pozostaje najtańszy dla f między dwiema wartościami z kafelka. Jeśli zakres nie sięga wyraźnie powyżej 1 (poniżej 1,5) lub zaczyna się powyżej 0,5, umiarkowany błąd wyceny zmienia zwycięzcę — wyjaśnij na piśmie wyłączenia lidera, zanim przeniesiesz jego cenę do oferty lub zlecisz podwykonawstwo.') }
      },
      tour: [
