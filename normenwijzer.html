/* ---------- the data file ----------
   DOCS, TITLES, DESC, PTX, SCN, PROV and I18N are deployed as the separate file
   normenwijzer-data.json, declared in the manifest "dependencies". It is fetched
   from the same directory as this page; no external service is contacted. The
   shell, the header and the shared chrome are on screen before it is asked for. */
var TARGET={docs:DOCS,titles:TITLES,desc:DESC,ptx:PTX,scn:SCN,prov:PROV,i18n:I18N};
function fill(d){
 var k,t,v,i,q;
 for(k in TARGET){
  if(!Object.prototype.hasOwnProperty.call(TARGET,k))continue;
  t=TARGET[k];v=d[k];
  if(!v)continue;
  if(Object.prototype.toString.call(t)==="[object Array]"){for(i=0;i<v.length;i++)t.push(v[i]);}
  else{for(q in v){if(Object.prototype.hasOwnProperty.call(v,q))t[q]=v[q];}}
 }
}
function onData(){
 READY=true;DATA_ERR=null;
 LANG=langNow();
 if(PENDING){applyIncoming(PENDING,true);PENDING=null;}
 refreshLearn();
 noteDropped();
 if(ui){
  if(I18N[LANG])ui.lang=LANG;
  ui.rebuild();
  LEARN.autostart=false;          /* offered once, not again on every rebuild */
 }else{
  bareShell();syncBare();renderAll();
 }
}
function onFail(e){
 DATA_ERR=(e&&e.message)?e.message:String(e);
 LEARN.autostart=false;
 var nb=stateBlock();
 if(HOST.state&&HOST.state.parentNode)HOST.state.parentNode.replaceChild(nb,HOST.state);
 HOST.state=nb;
 if(ui){
  /* ready() first: it runs the (empty) live compute and resolves whenReady, and
     fail() then leaves the shell in the failed state instead of ready */
  try{ui.ready();}catch(e3){}
  try{ui.fail((BOOTMSG[bootLang()]||BOOTMSG.en).title);}catch(e2){}
 }
}

/* ---------- the permalink contract ----------
   The object below is what every existing link carries; its shape may not change,
   and it did not: v, lang, scen, dirty, task{proc,cont,ex,hygr,env,req}, 
   filt{sec,cat,dom,geo,q}, lift[]. */
function dgcState(){
 return {v:1,lang:LANG,scen:ST.scen||"",dirty:ST.dirty?1:0,
         task:{proc:ST.task.proc,cont:ST.task.cont,ex:ST.task.ex,hygr:ST.task.hygr,
               env:ST.task.env,req:(ST.task.req||[]).slice(0)},
         filt:{sec:ST.filt.sec,cat:ST.filt.cat,dom:ST.filt.dom,geo:ST.filt.geo,q:ST.filt.q},
         lift:Object.keys(ST.lift)};
}
/* the language named by an explicit ?lang= in the address, if it is one this page
   speaks; it takes precedence over the language stored in a permalink payload */
function urlLang(){
 var l="";
 try{l=new URLSearchParams(location.search).get("lang")||"";}catch(e){}
 l=l.slice(0,2).toLowerCase();
 return (l&&LANGS.indexOf(l)>=0)?l:"";
}
/* "The link could not be fully read": the values a permalink carried that this
   page does not know, dropped on restore. Page-local strings, seven languages. */
var PARTIALMSG={
 en:"The shared link could not be fully read: the values below are unknown to this version of the tool and were left out. Everything else was restored.",
 uk:"Надіслане посилання не вдалося прочитати повністю: наведені нижче значення невідомі цій версії інструмента, тому їх пропущено. Усе інше відновлено.",
 de:"Der geteilte Link konnte nicht vollständig gelesen werden: Die unten genannten Werte kennt diese Version des Werkzeugs nicht; sie wurden weggelassen. Alles andere wurde wiederhergestellt.",
 nl:"De gedeelde link kon niet volledig worden gelezen: de onderstaande waarden zijn onbekend in deze versie van de tool en zijn weggelaten. Al het andere is hersteld.",
 fr:"Le lien partagé n'a pas pu être lu entièrement : les valeurs ci-dessous sont inconnues de cette version de l'outil et ont été ignorées. Tout le reste a été restauré.",
 es:"No se pudo leer por completo el enlace compartido: los valores siguientes son desconocidos para esta versión de la herramienta y se omitieron. Todo lo demás se restauró.",
 pl:"Udostępnionego linku nie udało się odczytać w całości: poniższe wartości są nieznane tej wersji narzędzia i zostały pominięte. Wszystko inne zostało przywrócone."
};
var DROPPED=[];
/* yes / no for the calculation record (page-local, seven languages) */
var YESNO={en:["yes","no"],uk:["так","ні"],de:["ja","nein"],nl:["ja","nee"],fr:["oui","non"],es:["sí","no"],pl:["tak","nie"]};
function noteDropped(){
 if(!DROPPED.length)return;
 var list=DROPPED.join(", ");DROPPED=[];
 try{if(window.Diagram&&Diagram.notify)Diagram.notify(PARTIALMSG[LANG]||PARTIALMSG.en,"warn",list);}catch(e){}
}
function optionsOf(fid){var f=facetById(fid),out=[],i;for(i=0;i<f.opts.length;i++)out.push(f.opts[i][0]);return out;}
function applyIncoming(st,quiet){
 /* every value is checked against the vocabularies; an unknown one is dropped and
    named in the notice as field=value, in this fixed order of fields */
 var drop=[],f,i,v,ok;
 var bad=function(field,val){drop.push(field+"="+(typeof val==="string"?val:JSON.stringify(val)));};
 var ul=urlLang();
 if(st.lang!==undefined&&st.lang!==""&&!(typeof st.lang==="string"&&I18N[st.lang]))bad("lang",st.lang);
 else if(!ul&&st.lang&&I18N[st.lang])LANG=st.lang;
 ST.scen="";
 if(st.scen!==undefined&&st.scen!==""){
  if(typeof st.scen==="string"&&scenById(st.scen))ST.scen=st.scen;else bad("scen",st.scen);
 }
 ST.task=emptyTask();
 if(st.task&&typeof st.task==="object"){
  for(i=0;i<FKEYS.length;i++){
   f=FKEYS[i];v=st.task[f];
   if(f==="req"){
    if(v===undefined)continue;
    if(!Array.isArray(v)){bad("task.req",v);continue;}
    for(var r=0;r<v.length;r++){
     if(typeof v[r]==="string"&&optionsOf("req").indexOf(v[r])>=0&&ST.task.req.indexOf(v[r])<0)ST.task.req.push(v[r]);
     else bad("task.req",v[r]);
    }
   }else{
    if(v===undefined||v==="")continue;
    if(typeof v==="string"&&optionsOf(f).indexOf(v)>=0)ST.task[f]=v;else bad("task."+f,v);
   }
  }
 }
 ST.lift={};
 if(st.lift!==undefined){
  if(!Array.isArray(st.lift))bad("lift",st.lift);
  else for(var j=0;j<st.lift.length;j++){
   if(typeof st.lift[j]==="string"&&SUBJ.indexOf(st.lift[j])>=0)ST.lift[st.lift[j]]=1;else bad("lift",st.lift[j]);
  }
 }
 ST.filt={sec:"",cat:"",dom:"",geo:"",q:""};
 if(st.filt&&typeof st.filt==="object"){
  var voc={sec:AREAS,cat:CATS,dom:DOMS,geo:GEOS},k;
  for(k in voc){
   v=st.filt[k];
   if(v===undefined||v==="")continue;
   if(typeof v==="string"&&voc[k].indexOf(v)>=0)ST.filt[k]=v;else bad("filt."+k,v);
  }
  v=st.filt.q;
  if(v!==undefined&&v!==""){if(typeof v==="string")ST.filt.q=v;else bad("filt.q",v);}
 }
 /* "modified" is recomputed from the restored facets, never taken on trust */
 ST.dirty=scenDiffers();
 DROPPED=drop;
 if(quiet)return;
 noteDropped();
 if(ui&&ui.lang!==LANG&&I18N[LANG]){ui.lang=LANG;lastSig=null;ui.rebuild();}
 else render();
}
function dgcRestore(st){
 if(!st||typeof st!=="object")return;
 /* the permalink may arrive before the register does: hold it and apply it once
    the data is here, which is what the old success-branch init did implicitly */
 if(!READY){PENDING=st;return;}
 applyIncoming(st,false);
}

/* ---------------------------------------------------------------- boot ----
   The shell is built from the manifest before any of the page's own work, and
   Diagram.init is called unconditionally, never from the success branch of a
   fetch: a data failure costs the register, never the toolbar. */
function boot(){
 if(window.DiagramUI&&DiagramUI.api==="tools.petrov.re/ui/v1")bootUI();
 else bootBare();
 if(window.Diagram){
  try{
   window.Diagram.init({
    id:"normenwijzer",file:"normenwijzer.html",
    state:{serialize:dgcState,deserialize:dgcRestore},
    record:function(){return READY?dgcRecord():null;},
    /* A corpus navigator has nothing to export as a runnable script: the result is a
       selection out of a shipped data file, not a computation. python_export.supported
       is false in the manifest for exactly that reason. */
    handoff:{provides:[],accepts:[]},
    /* translated field labels for the printed report (refreshed with every record) */
    report:{labels:REPORTLABELS}
   });
  }catch(e){}
 }
 var p=fetch("normenwijzer-data.json").then(function(r){
  if(!r.ok)throw new Error("HTTP "+r.status+" "+r.statusText);
  return r.json();
 }).then(function(d){fill(d);onData();}).catch(function(e){onFail(e);});
 try{if(window.Diagram&&window.Diagram.ready)window.Diagram.ready(p);}catch(e4){}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
</script>
