<script type="application/json" id="diagram-tool-manifest">{"schema":"tools.petrov.re/tool-manifest/v2","manifest_revision":"2026-10-16.normenwijzer-4","id":"normenwijzer","file":"normenwijzer.html","listed":true,"category":"hvac","order":38,"title":{"en":"Standards Orientation Aid","uk":"Орієнтир у нормативному полі","de":"Orientierungshilfe im Normenfeld","nl":"Normenwijzer","fr":"Repère normatif","es":"Orientador normativo","pl":"Orientacja w normach"},"summary":{"en":"A first-level navigator through the normative landscape of industrial climate control and process ventilation: binding law, standards, sector guidance…","uk":"Навігатор першого рівня нормативним ландшафтом промислової кліматизації та процесної вентиляції: обовʼязкове право, стандарти, галузеві настанови…","de":"Ein Wegweiser erster Stufe durch die normative Landschaft der industriellen Klimatisierung und Prozesslüftung: verbindliches Recht, Normen, Branchenleitfäden…","nl":"Een wegwijzer van het eerste niveau door het normatieve landschap van industriële klimaatbeheersing en procesventilatie: dwingend recht, normen, branchevoorschriften…","fr":"Un repère de premier niveau dans le paysage normatif de la climatisation industrielle et de la ventilation de procédé : droit contraignant, normes, guides sectoriels…","es":"Un orientador de primer nivel por el panorama normativo de la climatización industrial y la ventilación de proceso: derecho vinculante, normas, guías sectoriales…","pl":"Nawigator pierwszego poziomu po krajobrazie normatywnym klimatyzacji przemysłowej i wentylacji procesowej: prawo obowiązujące, normy, wytyczne branżowe…"},"description":{"en":"A first-level navigator through the normative landscape of industrial climate control and process ventilation: binding law, standards, sector guidance, calculation methods and rules of thumb are kept in five strictly separated categories, each with its own colour and badge shape. Start from a ready-made industry scenario — potato washing, milk-powder drying, a foundry, a battery dry room, a ship engine room and two dozen more — and it presets process type, contaminant, protection target, explosion and hygiene regime and environment, explains why every facet is set that way, and lists what that industry usually misses. Any facet stays editable and an edited scenario is marked as modified. Filter by subject area, category, subject field or area of application, or read the coverage matrix. This is an orientation for searching, not a determination of applicability: no value from a standard that is sold is reproduced, and the edition in force and the applicability to a project are checked at the source and with the competent authority. Every register entry and every scenario also carries a layer of key conditions in three visually separated bands: for a standard that is sold, the shape of the requirement without any value; for an openly published source, the same shape plus the reminder to check the edition in force; and for the worked material of this collection, the figure itself with the conditions under which it was obtained and the file it is traced to. Structural checks on translation completeness, category integrity, the absence of any figure in a paid-standard entry and the traceability of every figure to an existing source file run in the background and surface only when they fail. A facet can also state that a requirement is not expected, and that is not the same as saying nothing: what it rules out is kept out of the selection, listed with the ground for it, and brought back with one click.","uk":"Навігатор першого рівня нормативним ландшафтом промислової кліматизації та процесної вентиляції: обовʼязкове право, стандарти, галузеві настанови, розрахункові методики та емпіричні правила тримаються у пʼяти строго розділених категоріях, кожна зі своїм кольором і формою бейджа. Почніть із готового галузевого сценарію — миття картоплі, сушіння молочного порошку, ливарний цех, суха кімната для елементів, машинне відділення судна та ще два десятки — і він сам виставить тип процесу, забруднювач, обʼєкт захисту, вибухо- та гігієнічний режим і середовище, пояснить, чому кожен фасет саме такий, і перелічить те, що в цій галузі зазвичай пропускають. Будь-який фасет лишається редагованим, а змінений сценарій позначається як змінений. Фільтруйте за тематичною областю, категорією, предметною областю чи областю дії або читайте матрицю покриття. Це орієнтир для пошуку, а не висновок про застосовність: жодне значення з платного стандарту не відтворюється, а чинна редакція та застосовність до проєкту перевіряються у першоджерелі та з компетентним органом. Кожен запис реєстру і кожен сценарій несе також шар ключових умов у трьох візуально розділених смугах: для платного стандарту — форма вимоги без жодного значення; для відкрито опублікованого джерела — та сама форма плюс нагадування перевірити чинну редакцію; для власного опрацьованого матеріалу — сама величина з умовами свого отримання та файлом, до якого її простежено. Структурні перевірки повноти перекладів, цілісності категорій, відсутності будь-якої величини в записі платного стандарту та простежуваності кожної величини до наявного файла-джерела виконуються у фоні й показуються лише в разі провалу. Фасет може також стверджувати, що вимога не очікується, і це не те саме, що промовчати: вилучене не потрапляє до добірки, наводиться разом із підставою і повертається одним натиском.","de":"Ein Wegweiser erster Stufe durch die normative Landschaft der industriellen Klimatisierung und Prozesslüftung: verbindliches Recht, Normen, Branchenleitfäden, Rechenverfahren und Faustregeln bleiben in fünf streng getrennten Kategorien, jede mit eigener Farbe und eigener Badge-Form. Beginnen Sie mit einem fertigen Branchenszenario — Kartoffelwäsche, Milchpulvertrocknung, Gießerei, Trockenraum für Batteriezellen, Schiffsmaschinenraum und zwei Dutzend weitere — und es setzt Prozessart, Schadstoff, Schutzziel, Explosions- und Hygieneregime sowie Umgebung vor, erklärt, warum jede Facette so gesetzt ist, und nennt, was in dieser Branche meist übersehen wird. Jede Facette bleibt änderbar, ein geändertes Szenario wird als geändert gekennzeichnet. Filtern Sie nach Themenbereich, Kategorie, Sachgebiet oder Geltungsbereich, oder lesen Sie die Abdeckungsmatrix. Dies ist eine Orientierung für die Suche, keine Feststellung der Anwendbarkeit: kein Wert aus einer kostenpflichtigen Norm wird wiedergegeben, und geltende Ausgabe wie Anwendbarkeit auf ein Projekt werden an der Quelle und bei der zuständigen Behörde geprüft. Jeder Registereintrag und jedes Szenario trägt zudem eine Ebene wesentlicher Bedingungen in drei sichtbar getrennten Bändern: für eine kostenpflichtige Norm die Form der Anforderung ohne jeden Wert; für eine offen veröffentlichte Quelle dieselbe Form samt Hinweis auf die geltende Fassung; für das eigene ausgearbeitete Material die Größe selbst mit den Bedingungen ihrer Herleitung und der Datei, auf die sie zurückgeführt ist. Strukturprüfungen zu Übersetzungsvollständigkeit, Kategorieintegrität, Abwesenheit jedes Werts in einem Eintrag kostenpflichtiger Normen und Rückführbarkeit jeder Größe auf eine vorhandene Quelldatei laufen im Hintergrund und erscheinen nur bei einem Fehlschlag. Eine Facette kann auch aussagen, dass eine Anforderung nicht zu erwarten ist, und das ist nicht dasselbe wie keine Aussage: was sie ausschließt, bleibt aus der Auswahl, wird mit dem Grund aufgeführt und lässt sich mit einem Klick zurückholen.","nl":"Een wegwijzer van het eerste niveau door het normatieve landschap van industriële klimaatbeheersing en procesventilatie: dwingend recht, normen, branchevoorschriften, rekenmethoden en vuistregels blijven in vijf streng gescheiden categorieën, elk met een eigen kleur en badgevorm. Begin met een kant-en-klaar branchescenario — aardappelwassen, melkpoederdroging, een gieterij, een dryroom voor batterijcellen, een scheepsmachinekamer en twee dozijn andere — en het zet procestype, verontreiniging, beschermingsdoel, explosie- en hygiëneregime en omgeving alvast, legt uit waarom elk facet zo staat, en noemt wat die branche meestal mist. Elk facet blijft aanpasbaar en een gewijzigd scenario wordt als gewijzigd gemarkeerd. Filter op themagebied, categorie, vakgebied of toepassingsgebied, of lees de dekkingsmatrix. Dit is een oriëntatie om te zoeken, geen vaststelling van toepasselijkheid: geen enkele waarde uit een betaalde norm wordt weergegeven, en de geldende editie en de toepasselijkheid op een project worden bij de bron en bij het bevoegd gezag gecontroleerd. Elk registeritem en elk scenario draagt daarnaast een laag kernvoorwaarden in drie zichtbaar gescheiden banden: voor een betaalde norm de vorm van de eis zonder enige waarde; voor een openbaar gepubliceerde bron dezelfde vorm plus de herinnering de geldende uitgave te controleren; en voor het eigen uitgewerkte materiaal de grootheid zelf met de voorwaarden waaronder zij verkregen is en het bestand waarnaar zij herleid is. Structurele controles op vertaalvolledigheid, categorie-integriteit, de afwezigheid van elke waarde in een item van een betaalde norm en de herleidbaarheid van elke grootheid tot een bestaand bronbestand draaien op de achtergrond en verschijnen alleen bij een fout. Een facet kan ook stellen dat een eis niet wordt verwacht, en dat is niet hetzelfde als niets zeggen: wat het uitsluit blijft buiten de selectie, staat vermeld met de grond ervoor en is met één klik terug te halen.","fr":"Un repère de premier niveau dans le paysage normatif de la climatisation industrielle et de la ventilation de procédé : droit contraignant, normes, guides sectoriels, méthodes de calcul et règles empiriques restent dans cinq catégories strictement séparées, chacune avec sa couleur et sa forme de pastille. Partez d’un scénario sectoriel prêt à l’emploi — lavage de pommes de terre, séchage de poudre de lait, fonderie, salle sèche de cellules, salle des machines d’un navire et deux douzaines d’autres — et il prérègle type de procédé, contaminant, objet à protéger, régime d’explosion et d’hygiène et environnement, explique pourquoi chaque facette est ainsi réglée et énumère ce que ce secteur oublie d’ordinaire. Toute facette reste modifiable et un scénario retouché est signalé comme modifié. Filtrez par domaine thématique, catégorie, domaine ou champ d’application, ou lisez la matrice de couverture. C’est une orientation pour chercher, non une détermination d’applicabilité : aucune valeur issue d’une norme payante n’est reproduite, et l’édition en vigueur comme l’applicabilité à un projet se vérifient à la source et auprès de l’autorité compétente. Chaque entrée du registre et chaque scénario portent en outre une couche de conditions essentielles en trois bandes visuellement distinctes : pour une norme payante, la forme de l’exigence sans aucune valeur ; pour une source publiée ouvertement, la même forme accompagnée du rappel de vérifier l’édition en vigueur ; pour le matériel élaboré en propre, la grandeur elle-même avec ses conditions d’obtention et le fichier dont elle est issue. Des contrôles structurels de complétude des traductions, d’intégrité des catégories, d’absence de toute valeur dans une entrée de norme payante et de traçabilité de chaque grandeur vers un fichier source existant tournent en arrière-plan et n’apparaissent qu’en cas d’échec. Une facette peut aussi affirmer qu’une exigence n’est pas attendue, ce qui n’équivaut pas à ne rien dire : ce qu’elle écarte reste hors de la sélection, figure avec son motif et se rétablit d’un clic.","es":"Un orientador de primer nivel por el panorama normativo de la climatización industrial y la ventilación de proceso: derecho vinculante, normas, guías sectoriales, métodos de cálculo y reglas empíricas se mantienen en cinco categorías estrictamente separadas, cada una con su color y su forma de distintivo. Empiece por un escenario sectorial listo para usar — lavado de patata, secado de leche en polvo, una fundición, una sala seca de celdas, una sala de máquinas de buque y dos docenas más — y ajusta de antemano tipo de proceso, contaminante, objeto a proteger, régimen de explosión e higiene y entorno, explica por qué cada faceta queda así y enumera lo que ese sector suele pasar por alto. Toda faceta sigue siendo editable y un escenario retocado se marca como modificado. Filtre por área temática, categoría, campo temático o ámbito de aplicación, o lea la matriz de cobertura. Esto es una orientación para buscar, no una determinación de aplicabilidad: no se reproduce ningún valor de una norma de pago, y la edición vigente y la aplicabilidad a un proyecto se comprueban en la fuente y ante la autoridad competente. Cada entrada del registro y cada escenario llevan además una capa de condiciones clave en tres bandas visualmente separadas: para una norma de pago, la forma del requisito sin valor alguno; para una fuente publicada abiertamente, la misma forma más el recordatorio de comprobar la edición vigente; y para el material propio elaborado, la magnitud misma con las condiciones en que se obtuvo y el archivo del que procede. Las comprobaciones estructurales de integridad de traducciones y categorías, de ausencia de cualquier valor en una entrada de norma de pago y de trazabilidad de cada magnitud a un archivo de origen existente se ejecutan en segundo plano y solo aparecen si fallan. Una faceta también puede afirmar que un requisito no se espera, y eso no es lo mismo que no decir nada: lo que descarta queda fuera de la selección, aparece con su motivo y se recupera con un clic.","pl":"Nawigator pierwszego poziomu po krajobrazie normatywnym klimatyzacji przemysłowej i wentylacji procesowej: prawo obowiązujące, normy, wytyczne branżowe, metody obliczeniowe i reguły praktyczne są utrzymywane w pięciu ściśle rozdzielonych kategoriach, każda z własnym kolorem i kształtem oznaczenia. Zacznij od gotowego scenariusza branżowego — mycia ziemniaków, suszenia mleka w proszku, odlewni, suchego pomieszczenia do produkcji ogniw, maszynowni okrętowej i ponad dwudziestu innych — a narzędzie ustawi typ procesu, zanieczyszczenie, obiekt ochrony, reżim przeciwwybuchowy i higieniczny oraz środowisko, wyjaśni podstawę każdego wyboru i wskaże elementy zwykle pomijane w danej branży. Każdy aspekt pozostaje edytowalny, a zmieniony scenariusz jest oznaczany jako zmodyfikowany. Można filtrować według obszaru tematycznego, kategorii, pola tematu lub zakresu zastosowania albo korzystać z macierzy pokrycia. Jest to pomoc do orientacji i wyszukiwania, a nie ustalenie stosowalności: żadna wartość ze sprzedawanej normy nie jest odtwarzana, a obowiązujące wydanie i stosowalność do projektu należy sprawdzić u źródła i z właściwym organem. Każdemu wpisowi rejestru i scenariuszowi towarzyszy warstwa warunków kluczowych w trzech wizualnie rozdzielonych pasmach: dla sprzedawanej normy — postać wymagania bez wartości; dla źródła opublikowanego jawnie — ta sama postać wraz z przypomnieniem o sprawdzeniu obowiązującego wydania; dla opracowanych materiałów tej kolekcji — wartość z warunkami jej uzyskania i plikiem źródłowym, do którego można ją prześledzić. W tle działają kontrole kompletności tłumaczeń, integralności kategorii, braku wartości we wpisach dotyczących sprzedawanych norm oraz identyfikowalności każdej wartości do istniejącego pliku źródłowego; komunikat pojawia się tylko przy błędzie. Aspekt może też wskazywać, że dane wymaganie nie jest oczekiwane. Nie jest to równoznaczne z brakiem informacji: wykluczone wpisy pozostają poza wyborem, są pokazane wraz z podstawą wykluczenia i można je przywrócić jednym kliknięciem."},"status":"benchmarked","independent_validation":false,"limitations":{"en":"First-level orientation aid only: it maps a normative landscape and never determines applicability. The register is not exhaustive and whole families may be missing for a given project; editions change and an entry names a document, not a version in force; applicability is decided by the project and the competent authority, never by this page or a filter result; the absence of a document says nothing about its legal status or relevance; the presence of a document means only that it belongs to the landscape, not that it applies to your case. No value, threshold or class from a standard that is sold is reproduced; for such a document only the shape of the requirement is given. A layer of key conditions accompanies every register entry and every scenario: the figures shown come from worked examples and data sets of this collection, each with the conditions under which it was obtained and the source file it is traced to, and each is an orientation figure and not a requirement. Verify every document at the original source and with the competent authority before any use. Ready-made industry scenarios preset the facets and explain the reasoning, but they describe a typical situation and never establish that a document or a measure applies to your plant. A facet set to not expected narrows the selection: entries of that subject are kept out, always named together with the ground for it and always recoverable. That is an orientation decision, not a statement that such a requirement cannot arise on your plant.","uk":"Лише порадник першого рівня: показує нормативний ландшафт і ніколи не визначає застосовності. Реєстр не є вичерпним, і для конкретного проєкту можуть бракувати цілі сімейства; редакції змінюються, а запис називає документ, а не чинну версію; застосовність визначають проєкт і компетентний орган, а не ця сторінка чи результат фільтра; відсутність документа нічого не говорить про його правовий статус чи доречність; наявність документа означає лише належність до ландшафту, а не застосовність до вашого випадку. Жодне значення, порогове значення чи клас із платного стандарту не відтворюються; для такого документа наведено лише форму вимоги. Кожен запис реєстру і кожен сценарій супроводжує шар ключових умов: наведені величини походять із розрахункових прикладів і наборів даних цієї збірки, кожна з умовами свого отримання та файлом-джерелом, до якого її простежено, і кожна є орієнтиром, а не вимогою. Перед будь-яким використанням перевіряйте кожен документ у першоджерелі та з компетентним органом. Готові галузеві сценарії виставляють фасети й пояснюють міркування, але описують типову ситуацію і ніколи не встановлюють, що документ чи захід застосовні до вашого підприємства. Фасет у значенні «не очікується» звужує добірку: позиції цієї області залишаються поза нею, завжди названі разом із підставою і завжди повертані. Це рішення орієнтації, а не твердження, що така вимога не може виникнути на вашому підприємстві.","de":"Nur Orientierungshilfe erster Stufe: sie bildet eine normative Landschaft ab und stellt nie die Anwendbarkeit fest. Das Register ist nicht vollständig, und für ein bestimmtes Projekt können ganze Familien fehlen; Ausgaben ändern sich, und ein Eintrag nennt ein Dokument, nicht eine geltende Fassung; über die Anwendbarkeit entscheiden das Projekt und die zuständige Behörde, nie diese Seite oder ein Filterergebnis; das Fehlen eines Dokuments sagt nichts über Rechtsstatus oder Erheblichkeit; das Vorhandensein bedeutet nur Zugehörigkeit zur Landschaft, nicht Geltung für Ihren Fall. Kein Wert, keine Schwelle und keine Klasse aus einer kostenpflichtigen Norm wird wiedergegeben; für ein solches Dokument steht nur die Form der Anforderung. Jeden Registereintrag und jedes Szenario begleitet eine Ebene wesentlicher Bedingungen: die gezeigten Größen stammen aus Rechenbeispielen und Datensätzen dieser Sammlung, jeweils mit den Bedingungen ihrer Herleitung und der Quelldatei, auf die sie zurückgeführt sind, und jede ist ein Orientierungswert und keine Anforderung. Prüfen Sie jedes Dokument vor jeder Verwendung an der Originalquelle und bei der zuständigen Behörde. Fertige Branchenszenarien setzen die Facetten vor und erläutern die Begründung, beschreiben aber eine typische Situation und stellen nie fest, dass ein Dokument oder eine Maßnahme für Ihre Anlage gilt. Eine Facette im Wert nicht zu erwarten verengt die Auswahl: Einträge dieses Gegenstands bleiben draußen, stets zusammen mit dem Grund genannt und stets zurückholbar. Das ist eine Orientierungsentscheidung und keine Aussage, dass eine solche Anforderung in Ihrer Anlage nicht auftreten kann.","nl":"Uitsluitend oriëntatiehulp van het eerste niveau: zij brengt een normatief landschap in kaart en stelt nooit de toepasselijkheid vast. Het register is niet uitputtend en voor een concreet project kunnen hele families ontbreken; edities veranderen en een item noemt een document, niet een geldende versie; toepasselijkheid wordt bepaald door het project en het bevoegd gezag, nooit door deze pagina of een filterresultaat; het ontbreken van een document zegt niets over de juridische status of relevantie; de aanwezigheid betekent alleen dat het tot het landschap behoort, niet dat het op uw geval van toepassing is. Geen waarde, drempel of klasse uit een betaalde norm wordt weergegeven; voor zo’n document staat alleen de vorm van de eis. Bij elk registeritem en elk scenario hoort een laag kernvoorwaarden: de getoonde grootheden komen uit rekenvoorbeelden en datasets van deze verzameling, elk met de voorwaarden waaronder zij verkregen is en het bronbestand waarnaar zij herleid is, en elk is een oriëntatiewaarde en geen eis. Controleer elk document vóór elk gebruik bij de originele bron en bij het bevoegd gezag. Kant-en-klare branchescenario’s zetten de facetten voor en leggen de redenering uit, maar beschrijven een typische situatie en stellen nooit vast dat een document of maatregel op uw installatie van toepassing is. Een facet op niet verwacht versmalt de selectie: vermeldingen van dat onderwerp blijven erbuiten, altijd met de grond erbij genoemd en altijd terug te halen. Dat is een oriëntatiebeslissing en geen uitspraak dat zo’n eis in uw installatie niet kan optreden.","fr":"Aide d’orientation de premier niveau seulement : elle cartographie un paysage normatif et ne détermine jamais l’applicabilité. Le registre n’est pas exhaustif et des familles entières peuvent manquer pour un projet donné ; les éditions changent et une entrée nomme un document, non une version en vigueur ; l’applicabilité est décidée par le projet et l’autorité compétente, jamais par cette page ni par un résultat de filtre ; l’absence d’un document ne dit rien de son statut juridique ni de sa pertinence ; sa présence signifie seulement qu’il appartient au paysage, non qu’il s’applique à votre cas. Aucune valeur, aucun seuil et aucune classe issus d’une norme payante ne sont reproduits ; pour un tel document, seule la forme de l’exigence figure. Chaque entrée du registre et chaque scénario s’accompagnent d’une couche de conditions essentielles : les grandeurs présentées proviennent d’exemples de calcul et de jeux de données de ce recueil, chacune avec ses conditions d’obtention et le fichier source dont elle est issue, et chacune est un repère et non une exigence. Vérifiez chaque document, avant tout emploi, à la source d’origine et auprès de l’autorité compétente. Les scénarios sectoriels prêts à l’emploi préréglent les facettes et expliquent le raisonnement, mais décrivent une situation type et n’établissent jamais qu’un document ou une mesure s’applique à votre installation. Une facette réglée sur non attendu restreint la sélection : les entrées de ce sujet restent à l’écart, toujours nommées avec leur motif et toujours récupérables. C’est une décision d’orientation et non l’affirmation qu’une telle exigence ne peut pas se présenter dans votre installation.","es":"Solo ayuda de orientación de primer nivel: traza un panorama normativo y nunca determina la aplicabilidad. El registro no es exhaustivo y para un proyecto concreto pueden faltar familias enteras; las ediciones cambian y una entrada nombra un documento, no una versión vigente; la aplicabilidad la deciden el proyecto y la autoridad competente, nunca esta página ni un resultado de filtro; la ausencia de un documento no dice nada sobre su estatus jurídico ni su pertinencia; su presencia solo significa que pertenece al panorama, no que se aplique a su caso. No se reproduce ningún valor, umbral ni clase de una norma de pago; para tal documento solo figura la forma del requisito. Cada entrada del registro y cada escenario llevan una capa de condiciones clave: las magnitudes mostradas proceden de ejemplos de cálculo y conjuntos de datos de esta recopilación, cada una con las condiciones en que se obtuvo y el archivo de origen del que procede, y cada una es una referencia y no un requisito. Compruebe cada documento, antes de cualquier uso, en la fuente original y ante la autoridad competente. Los escenarios sectoriales listos para usar preajustan las facetas y explican el razonamiento, pero describen una situación típica y nunca establecen que un documento o una medida se apliquen a su instalación. Una faceta puesta en no se espera estrecha la selección: las entradas de ese asunto quedan fuera, siempre nombradas junto con su motivo y siempre recuperables. Es una decisión de orientación y no una afirmación de que tal requisito no pueda surgir en su instalación.","pl":"Wyłącznie pomoc orientacyjna pierwszego poziomu: odwzorowuje krajobraz normatywny i nie ustala stosowalności. Rejestr nie jest wyczerpujący i dla konkretnego projektu mogą brakować całe rodziny dokumentów; wydania ulegają zmianie, a wpis wskazuje dokument, nie obowiązującą wersję; o stosowalności decydują projekt i właściwy organ, nigdy ta strona ani wynik filtrowania. Brak dokumentu nie mówi nic o jego statusie prawnym ani znaczeniu, a jego obecność oznacza tylko przynależność do krajobrazu, nie stosowalność w danym przypadku. Nie odtwarza się żadnej wartości, progu ani klasy ze sprzedawanej normy; dla takiego dokumentu podawana jest wyłącznie postać wymagania. Każdemu wpisowi i scenariuszowi towarzyszy warstwa warunków kluczowych: prezentowane wartości pochodzą z opracowanych przykładów i zbiorów danych tej kolekcji, wraz z warunkami uzyskania i wskazaniem pliku źródłowego, i są wartościami orientacyjnymi, nie wymaganiami. Przed użyciem należy zweryfikować każdy dokument u źródła i z właściwym organem. Gotowe scenariusze branżowe ustawiają aspekty i wyjaśniają podstawę wyboru, lecz opisują sytuację typową i nie ustanawiają stosowalności dokumentu ani środka do konkretnej instalacji. Ustawienie aspektu jako „nieoczekiwany” zawęża wybór: wpisy z tego obszaru pozostają poza nim, są zawsze pokazane wraz z podstawą i mogą zostać przywrócone. Jest to decyzja orientacyjna, a nie stwierdzenie, że takie wymaganie nie może wystąpić w danej instalacji."},"intended_use":["education","technical exploration","preliminary assessment"],"catalog_languages":["en","uk","de","nl","fr","es","pl"],"tool_languages":["en","uk","de","nl","fr","es","pl"],"dependencies":["normenwijzer-data.json"],"network_access":{"mode":"same-origin-data","note":"Fetches only its own declared local file normenwijzer-data.json (the standards corpus) from this site. No external service is contacted and nothing is transmitted."},"validation":{"basis":{"en":"211 cases with 1834 checks pass on this build. This is a data-integrity and navigation benchmark: corpus counts, schema and referential closure, 71 registry filter and search paths, 49 facet paths, all 28 scenarios, permalink round trips and all seven languages, each stored as an exact step list and compared without tolerance with an independent python re-implementation written by a second agent from a method specification without access to the page code. 29 register entries were checked on 2026-08-12 against the issuing bodies' catalogues; those spot checks are kept as recorded evidence. The harness is the author's own; no external party has reviewed it.","uk":"211 випадків із 1834 перевірками проходять на цій збірці. Це перевірка цілісності даних і навігації: кількості й схема записів, посилальна замкненість, 71 шляхів фільтрів реєстру та пошуку, 49 шляхів фасетів, усі 28 сценаріїв, повні цикли постійних посилань і всі сім мов; кожен випадок збережено як точний список кроків і порівняно без допуску з незалежною реалізацією на python, яку інший агент написав за специфікацією методу без доступу до коду сторінки. 29 записів реєстру 2026-08-12 звірено з каталогами органів, що їх видали; ці вибіркові перевірки збережено як записані докази. Набір тестів авторський; зовнішнього рецензування не було.","de":"211 Fälle mit 1834 Prüfungen bestehen auf diesem Build. Dies ist ein Benchmark für Datenintegrität und Navigation: Bestandszahlen, Schema und referenzielle Geschlossenheit, 71 Register-Filter- und Suchpfade, 49 Facettenpfade, alle 28 Szenarien, Permalink-Rundläufe und alle sieben Sprachen, jeweils als exakte Schrittfolge gespeichert und ohne Toleranz mit einer unabhängigen Python-Neuimplementierung verglichen, die ein zweiter Agent aus einer Methodenspezifikation ohne Zugriff auf den Seitencode geschrieben hat. 29 Registereinträge wurden am 2026-08-12 mit den Katalogen der herausgebenden Stellen abgeglichen; diese Stichproben bleiben als aufgezeichneter Nachweis erhalten. Das Prüfgerüst stammt vom Autor; eine externe Prüfung fand nicht statt.","nl":"211 gevallen met 1834 controles slagen op deze build. Dit is een benchmark voor gegevensintegriteit en navigatie: aantallen, schema en referentiële geslotenheid, 71 register-filter- en zoekpaden, 49 facetpaden, alle 28 scenario's, permalink-rondgangen en alle zeven talen, elk opgeslagen als exacte stappenlijst en zonder tolerantie vergeleken met een onafhankelijke python-herimplementatie die een tweede agent schreef uit een methodespecificatie zonder toegang tot de paginacode. 29 registeritems zijn op 2026-08-12 gecontroleerd tegen de catalogi van de uitgevende instanties; die steekproeven blijven bewaard als vastgelegd bewijs. Het testharnas is van de auteur; er was geen externe review.","fr":"211 cas et 1834 vérifications passent sur cette version. Il s'agit d'un banc d'intégrité des données et de navigation : effectifs, schéma et fermeture référentielle, 71 chemins de filtres et de recherche du registre, 49 chemins de facettes, les 28 scénarios, des allers-retours de permalien et les sept langues, chacun enregistré comme une liste exacte d'étapes et comparé sans tolérance à une réimplémentation python indépendante écrite par un second agent à partir d'une spécification de méthode sans accès au code de la page. 29 entrées du registre ont été vérifiées le 2026-08-12 dans les catalogues des organismes émetteurs ; ces sondages sont conservés comme preuves enregistrées. Le banc d'essai est celui de l'auteur ; aucune revue externe n'a eu lieu.","es":"211 casos con 1834 comprobaciones pasan en esta versión. Es una prueba de integridad de datos y navegación: recuentos, esquema y cierre referencial, 71 rutas de filtros y búsqueda del registro, 49 rutas de facetas, los 28 escenarios, ciclos completos de enlace permanente y los siete idiomas, cada uno guardado como lista exacta de pasos y comparado sin tolerancia con una reimplementación python independiente escrita por un segundo agente a partir de una especificación del método sin acceso al código de la página. 29 entradas del registro se comprobaron el 2026-08-12 en los catálogos de los organismos emisores; esas comprobaciones se conservan como evidencia registrada. El banco de pruebas es del autor; no hubo revisión externa.","pl":"211 przypadków z 1834 sprawdzeniami przechodzi na tej wersji. Jest to benchmark integralności danych i nawigacji: liczebności korpusu, schemat i domknięcie referencyjne, 71 ścieżek filtrowania i wyszukiwania w rejestrze, 49 ścieżek faset, wszystkie 28 scenariuszy, przejścia w obie strony przez permalink i wszystkie siedem języków, każde zapisane jako dokładna lista kroków i porównane bez tolerancji z niezależną reimplementacją python napisaną przez drugiego agenta na podstawie specyfikacji metody, bez dostępu do kodu strony. 29 pozycji rejestru sprawdzono 2026-08-12 względem katalogów instytucji wydających; te kontrole wyrywkowe są przechowywane jako zarejestrowany dowód. Zestaw testów jest autorski; zewnętrznej recenzji nie było."},"independent_validation":false,"benchmarks":[{"id":"normenwijzer-stored-inputs-2026-10-16","reference":"Independent python re-implementation written by a second agent from a method specification, the data file and the page constants only, without access to the page code: record schema, referential closure, registry filters and search, facet selection with exclusion and lift rules, scenario key conditions, matrix counts, permalink encoding and restore, and language outputs, evaluated on the stored step list of every case. Every case input is stored in benchmarks/normenwijzer.reference.json. The 29 catalogue spot checks of 2026-08-12 are carried in the artifact as recorded evidence and are not counted as cases.","citations":["Independent re-implementation of the schema, referential closure and filter/facet semantics: /root/bench/ref/gen_normenwijzer.py (this repository).","Regulation (EC) No 852/2004 — Regulation (EC) No 852/2004 of the European Parliament and of the Council of 29 April 2004 on the hygiene of foodstuffs (EUR-Lex (EU)): in force — https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32004R0852","Directive 2014/34/EU — Directive 2014/34/EU of the European Parliament and of the Council of 26 February 2014 on the harmonisation of the laws of the Member States relating to equipment and protective systems intended for use in potentially explosive atmospheres (recast) (EUR-Lex (EU)): in force since 18 April 2014 (recast) — https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32014L0034","Directive 1999/92/EC — Directive 1999/92/EC of the European Parliament and of the Council of 16 December 1999 on minimum requirements for improving the safety and health protection of workers potentially at risk from explosive atmospheres (EU ory zgodnie z regułami porównania, obiekty według zbioru kluczy, liczby, wartości logiczne i null według typu."},"run_at":"2026-10-16T00:00:24Z","reference_provenance":"mixed","provenance_note":"All 1834 counted checks are recomputed by the reference; the 29 catalogue spot checks of 2026-08-12 are recorded, not re-derived, and are kept uncounted.","artifact":"benchmarks/normenwijzer.json"}]},"report":{"pdf":true,"source_attribution":true},"python_export":{"supported":false,"reason":{"en":"The result is a selection out of a shipped corpus, not a computation: there is no equation to re-run in a standalone script.","uk":"Результат — це вибірка з наявного корпусу, а не обчислення: немає рівняння, яке можна відтворити окремим скриптом.","de":"Das Ergebnis ist eine Auswahl aus einem mitgelieferten Bestand, keine Berechnung: es gibt keine Gleichung, die ein eigenständiges Skript nachrechnen könnte.","nl":"Het resultaat is een selectie uit een meegeleverd bestand, geen berekening: er is geen vergelijking die een losstaand script kan nadoen.","fr":"Le résultat est une sélection dans un corpus livré avec la page, non un calcul : il n'y a pas d'équation qu'un script autonome pourrait refaire.","es":"El resultado es una selección de un corpus incluido, no un cálculo: no hay ecuación que un script independiente pueda reproducir.","pl":"Wynik jest wyborem z dołączonego zbioru, a nie obliczeniem: nie ma równania, które samodzielny skrypt mógłby odtworzyć."}},"handoff":{"provides":[],"accepts":[]},"state_codec":{"permalink":true,"record":"tools.petrov.re/calculation-record/v1"},"ui":{"framework":"tools.petrov.re/ui/v1","level":3}}</script>

  /* normenwijzer — tool styles.

  /* v3.1 §17 R1/R2 own [hidden] and the body-level cards' box-sizing now; both

     own two inline-flex classes still need one rule. */
  .scentag[hidden],.btn[hidden]{display:none}

  .badge.static{cursor:default}
  .badge.law{border-radius:2px}
  .badge.std{border-radius:var(--radius-pill)}
  .badge.guide{border-radius:3px;
    clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
  .badge.method{border-radius:3px;transform:skewX(-12deg)}
  .badge.method span{transform:skewX(12deg);display:inline-block}
  .badge.rule{background:transparent;border:2px dashed;border-radius:var(--radius-pill);
    font-style:italic;padding:2px var(--sp-2)}
  .badge.off{opacity:.32;filter:grayscale(1)}
  /* status marks: shape and glyph carry the meaning, not colour alone */
  .badge.st{background:transparent;color:var(--ink);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:2px var(--sp-2);font-weight:650}
  .badge.st-confirmed{border-color:var(--ok);border-width:2px}
  .badge.st-confirmed span::before{content:"\2713\00a0"}
  .badge.st-assumed{border-color:var(--warn);border-style:dashed;border-width:2px}
  .badge.st-assumed span::before{content:"\2248\00a0"}

  /* buttons inside generated content follow the framework button */
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--ctl-h);
    padding:0 var(--sp-3);font:500 var(--fs-label)/1 var(--font);color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
    cursor:pointer}
  .btn:hover{background:var(--weak);border-color:var(--accent)}
  .btn.small{padding:0 var(--sp-2);font-size:var(--fs-small)}

  /* legend */
  .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--sp-3)}
  .lgi{border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--sp-3);
    border-left-width:5px;border-left-style:solid}
  .lgi.rule{border-left-style:dashed}
  .lgi p{margin:var(--sp-2) 0 0;font-size:var(--fs-small);color:var(--muted)}
  .why{margin-top:var(--sp-3);border-top:1px solid var(--line);padding-top:var(--sp-3)}
  .why h3{font:650 var(--fs-label)/1.3 var(--font)}
  .why ul{margin:var(--sp-2) 0 0;padding-left:var(--sp-5);font-size:var(--fs-label);color:var(--muted)}
  .why li{margin-bottom:var(--sp-1)}

  /* scenarios */
  .scentag{display:inline-flex;align-items:center;gap:var(--sp-1);font-size:var(--fs-micro);
    font-weight:650;letter-spacing:.06em;text-transform:uppercase;padding:var(--sp-1) var(--sp-2);
    border-radius:var(--radius-pill);background:var(--warn-bg);color:var(--warn);
    border:1px solid var(--warn)}
  .scengrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--sp-3)}
  .wcard{border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--sp-3);
    background:var(--panel)}
  .wcard h3{margin:0 0 var(--sp-1);font-size:var(--fs-micro);letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);font-weight:650}
  .wcard .wv{font-size:var(--fs-label);font-weight:650;display:block;margin-bottom:var(--sp-1)}
  .wcard .ww{font-size:var(--fs-small);color:var(--muted);margin:0}
  .wsub{margin:var(--sp-1) 0 0;font-size:var(--fs-micro);color:var(--muted)}
  .wsub .lb{text-transform:uppercase;letter-spacing:.06em;font-weight:650}
  .blind{margin-top:var(--sp-3);border:1px dashed;border-radius:var(--radius-md);
    padding:var(--sp-3)}
  .blind h3{margin:0 0 var(--sp-2);font-size:var(--fs-small);letter-spacing:.06em;
    text-transform:uppercase}
  .blind ul{margin:0;padding-left:var(--sp-5);font-size:var(--fs-label)}
  .blind li{margin-bottom:var(--sp-1)}
  .secrow{margin-top:var(--sp-3);display:flex;gap:var(--sp-1);flex-wrap:wrap;align-items:center}
  .secrow .lb{font-size:var(--fs-micro);color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;font-weight:650}

  /* the six facets: three-valued chips */
  .fst{font-size:var(--fs-micro);font-weight:650;letter-spacing:.06em;text-transform:uppercase;
    border-radius:var(--radius-pill);padding:2px var(--sp-2);vertical-align:middle}
  .fst.y{background:var(--ok-bg);color:var(--ok)}
  .fst.n{background:var(--bad-bg);color:var(--bad)}
  .fst.u{background:var(--panel-2);color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:var(--sp-1)}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:var(--radius-pill);padding:var(--sp-1) var(--sp-3);font-size:var(--fs-small);
    cursor:pointer;font-family:inherit;text-align:left}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip.neg.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

  /* the situation result */
  .taskout{margin-top:var(--sp-3)}
  .fam{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-2) 0;
    border-bottom:1px solid var(--line);font-size:var(--fs-label)}
  .fam:last-child{border-bottom:0}
  .fam .fn{flex:1 1 170px;min-width:0;overflow-wrap:anywhere}
  .fam .cc{display:flex;gap:var(--sp-1);flex-wrap:wrap;min-width:0;max-width:100%}
  .fam .count,.fam .btn{max-width:100%}
  .tk-gap{margin-top:var(--sp-3)}
  .count{font-size:var(--fs-small);color:var(--muted)}
  .note{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);
    border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-small);
    margin-top:var(--sp-3)}
  .fstrip{margin:var(--sp-3) 0;border:1px solid var(--line);border-radius:var(--radius-md);
    padding:var(--sp-3);background:var(--panel)}
  .fstrip h3{font-size:var(--fs-small);letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin:0 0 var(--sp-1)}
  .fsr{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--sp-2);
    margin-top:var(--sp-2)}
  .fchip{border:1px solid var(--line);border-left:5px solid var(--line);
    border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3)}
  .fchip.y{border-left-color:var(--ok)}
  .fchip.n{border-left-color:var(--bad)}
  .fchip.u{border-left-color:var(--muted)}
  .fchip b{display:block;font-size:var(--fs-micro);letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted)}
  .fchip .fv{display:block;font-size:var(--fs-label);font-weight:650;margin-top:2px}
  .fchip .fs{display:inline-block;margin-top:var(--sp-1);font-size:var(--fs-micro);font-weight:650;
    letter-spacing:.06em;text-transform:uppercase;border-radius:var(--radius-pill);
    padding:2px var(--sp-2);background:var(--panel-2);color:var(--muted)}
  .fchip.y .fs{background:var(--ok-bg);color:var(--ok)}
  .fchip.n .fs{background:var(--bad-bg);color:var(--bad)}
  .fchip .fsub{display:block;font-size:var(--fs-micro);color:var(--muted);margin-top:var(--sp-1)}

  /* what a facet keeps out, and how to bring it back */
  .exblk{margin-top:var(--sp-4);border-top:1px dashed var(--line);padding-top:var(--sp-3)}
  .exblk h3{font-size:var(--fs-small);letter-spacing:.06em;text-transform:uppercase;
    color:var(--bad);margin:0 0 var(--sp-1)}
  .exblk .exnone{margin:var(--sp-2) 0 0}
  .exrow{border:1px solid var(--line);border-left:5px solid var(--bad);
    border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);margin-top:var(--sp-2);
    background:var(--panel)}
  .exrow.lifted{border-left-color:var(--ok)}
  .exh{display:flex;gap:var(--sp-2);align-items:baseline;flex-wrap:wrap}
  .exs{font-weight:650;font-size:var(--fs-label)}
  .exn{font-size:var(--fs-micro);color:var(--muted);font-variant-numeric:tabular-nums}
  .exb{margin:var(--sp-1) 0 var(--sp-2);font-size:var(--fs-small);color:var(--muted)}
  .exb .lb{text-transform:uppercase;letter-spacing:.06em;font-size:var(--fs-micro);font-weight:650}
  .exents{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-bottom:var(--sp-2)}
  .exent{font-size:var(--fs-micro);color:var(--muted);border:1px dashed var(--line);
    border-radius:var(--radius-sm);padding:2px var(--sp-2)}
  .liftmark{font-size:var(--fs-micro);color:var(--ok);text-transform:uppercase;
    letter-spacing:.06em;font-weight:650}
  .dexcl{margin:var(--sp-2) 0 0;font-size:var(--fs-small);color:var(--bad);
    border:1px dashed var(--bad);border-radius:var(--radius-sm);padding:var(--sp-1) var(--sp-2)}
  .dexcl.lift{color:var(--ok);border-color:var(--ok)}
  .kchid{margin-top:var(--sp-2);border:1px dashed var(--line);border-radius:var(--radius-sm);
    padding:var(--sp-2) var(--sp-3)}
  .kchid p{margin:0 0 var(--sp-1);font-size:var(--fs-small)}

  /* coverage matrix */
  .mwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-md)}
  table.mx{border-collapse:collapse;width:100%;font-size:var(--fs-small)}
  table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:var(--sp-1) var(--sp-2);
    text-align:center}
  table.mx th.s,table.mx td.s{text-align:left;white-space:nowrap;position:sticky;left:0;
    background:var(--panel);z-index:1}
  table.mx thead th{position:sticky;top:0;background:var(--panel);z-index:2;
    font-size:var(--fs-micro);letter-spacing:.06em;text-transform:uppercase}
  table.mx thead th.s{z-index:3}
  table.mx td.c{cursor:pointer;font-variant-numeric:tabular-nums;font-weight:650}
  table.mx td.c.z{color:var(--muted);font-weight:400;cursor:default;background:none}
  table.mx tbody th.s{font-weight:650}
  table.mx td.c:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  table.mx td.c:hover:not(.z){outline:2px solid var(--accent);outline-offset:-2px}
  td.tot{font-weight:650;font-variant-numeric:tabular-nums}

  /* the register */
  .catrail{display:flex;gap:var(--sp-1);flex-wrap:wrap;align-items:center;margin-bottom:var(--sp-3)}
  .catrail .lb{font-size:var(--fs-micro);color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;font-weight:650}
  .catrail button{border:0;background:none;padding:0;cursor:pointer;font-family:inherit}
  .catrail button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .grouphead{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-4) 0 var(--sp-2)}
  .grouphead .gl{flex:1;height:1px;background:var(--line)}
  .doc{border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--sp-3);
    margin-bottom:var(--sp-2);background:var(--panel);border-left-width:6px;border-left-style:solid}
  .doc.rule{border-left-style:dashed}
  .doc h3{margin-top:var(--sp-2);font:650 var(--fs-body)/1.3 var(--font)}
  .dh{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
  .code{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--muted)}
  .dref{margin:var(--sp-2) 0 0;font-size:var(--fs-micro);color:var(--muted);display:flex;
    gap:var(--sp-1);align-items:baseline}
  .dref .lb{letter-spacing:.06em;text-transform:uppercase}
  .dmeta{font-size:var(--fs-small);color:var(--muted);margin:var(--sp-1) 0 0;display:flex;
    gap:var(--sp-2);flex-wrap:wrap;align-items:center}
  .pill{border:1px solid var(--line);border-radius:var(--radius-pill);padding:2px var(--sp-2);
    font-size:var(--fs-micro)}
  .sec{background:var(--weak);border:1px solid transparent;color:var(--accent);
    border-radius:var(--radius-sm);padding:1px var(--sp-1);font-size:var(--fs-micro);
    font-variant-numeric:tabular-nums}
  .sec.off{background:transparent;border:1px dashed var(--bad);color:var(--bad)}
  dl.df{margin:var(--sp-2) 0 0;display:grid;grid-template-columns:minmax(140px,190px) 1fr;
    gap:var(--sp-1) var(--sp-3);font-size:var(--fs-label)}
  dl.df dt{color:var(--muted);font-size:var(--fs-small);font-weight:650;text-transform:uppercase;
    letter-spacing:.06em;padding-top:2px}
  dl.df dd{margin:0}
  dl.df ul{margin:0;padding-left:var(--sp-4)}
  .drem{margin:var(--sp-2) 0 0;font-size:var(--fs-small);color:var(--warn);
    background:var(--warn-bg);border:1px dashed var(--warn);border-radius:var(--radius-sm);
    padding:var(--sp-1) var(--sp-2)}
  .empty{padding:var(--sp-5);text-align:center;color:var(--muted);font-size:var(--fs-label)}

  /* key conditions: three visually separated source layers */
  .prov{margin-top:var(--sp-3);border-top:1px dashed var(--line);padding-top:var(--sp-3)}
  .prov h4{font-size:var(--fs-small);letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);margin:0 0 var(--sp-1)}
  .prov .lyintro{font-size:var(--fs-small);color:var(--muted);margin:0 0 var(--sp-2)}
  .lyblk{border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-2)}
  .lyblk:last-child{margin-bottom:0}
  .lyblk.openlaw{border:2px dotted}
  .lyblk.chapter{border:1px solid var(--line);border-left-width:6px;border-left-style:solid}
  .lyblk.paidstd{border:2px dashed}
  .lytag{display:inline-block;font-size:var(--fs-micro);font-weight:650;letter-spacing:.08em;
    text-transform:uppercase;padding:2px var(--sp-2);border-radius:var(--radius-sm);
    color:var(--accent-ink)}
  .lytag.openlaw{border-radius:var(--radius-pill)}
  .lytag.paidstd{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .lyd{font-size:var(--fs-small);color:var(--muted);margin:var(--sp-1) 0 var(--sp-2)}
  .pv{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:var(--sp-2) var(--sp-3);margin-top:var(--sp-2)}
  .pvt{font-size:var(--fs-label);font-weight:650;margin:0 0 var(--sp-1)}
  .pvchips{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin:0 0 var(--sp-2)}
  .chipv{display:inline-flex;flex-direction:column;gap:1px;border:1px solid var(--accent);
    background:var(--weak);border-radius:var(--radius-sm);padding:2px var(--sp-2)}
  .chipv b{font-size:var(--fs-label);font-weight:650;font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .chipv i{font-size:var(--fs-micro);color:var(--muted);font-style:normal}
  dl.pvdl{margin:0;display:grid;grid-template-columns:minmax(120px,168px) 1fr;
    gap:var(--sp-1) var(--sp-3);font-size:var(--fs-small)}
  dl.pvdl dt{color:var(--muted);font-size:var(--fs-micro);font-weight:650;text-transform:uppercase;
    letter-spacing:.06em;padding-top:2px}
  dl.pvdl dd{margin:0}
  .pvb{display:flex;gap:var(--sp-1);flex-wrap:wrap;align-items:center;margin-top:var(--sp-2)}
  .pvb .pvref{margin-left:auto;font-size:var(--fs-micro);color:var(--muted)}
  .pvnote{margin:var(--sp-2) 0 0;font-size:var(--fs-micro);color:var(--warn);
    background:var(--warn-bg);border:1px dashed var(--warn);border-radius:var(--radius-sm);
    padding:var(--sp-1) var(--sp-2)}

  /* the structural checks, and the limits */
  .flag{display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-2) 0;
    border-bottom:1px solid var(--line);font-size:var(--fs-label)}
  .flag:last-child{border-bottom:0}
  .flag::before{content:"\2713";flex:none;width:var(--sp-5);height:var(--sp-5);
    border-radius:var(--radius-sm);display:grid;place-items:center;font-size:var(--fs-micro);
    font-weight:650;color:var(--accent-ink);background:var(--ok)}
  .flag.bad::before{content:"\2715";background:var(--bad)}
  #val-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);
    border-radius:var(--radius-sm);padding:var(--sp-2) var(--sp-3);font-size:var(--fs-small)}
  #lim-out{margin:0;padding-left:var(--sp-5);font-size:var(--fs-label);color:var(--muted)}
  #lim-out li{margin-bottom:var(--sp-1)}
  .nw-foot{color:var(--muted);font-size:var(--fs-small)}

  /* the badge explanation, inside the framework dialog */
  .mdlbody p{margin:0 0 var(--sp-2);font-size:var(--fs-label)}
  .mdlbody ul{margin:0;padding-left:var(--sp-5);font-size:var(--fs-label)}
  .mdlbody li{margin-bottom:var(--sp-1)}
  .mdlrow{display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-3) 0 var(--sp-1);
    flex-wrap:wrap}
  .mdlk{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    font-weight:650}
  .mdlwhy,.mdlleglb{margin:var(--sp-3) 0 var(--sp-1);font-size:var(--fs-small);letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted)}
  .mdlleg{display:flex;gap:var(--sp-1);flex-wrap:wrap;margin-bottom:var(--sp-3)}

  /* the filter rail is a disclosure below lg, exactly one control to open it */
  .nw-navbox{border:1px solid var(--line);border-radius:var(--radius-md);background:var(--panel);
    padding:var(--sp-2)}
  .nw-navbox>summary{cursor:pointer;font:650 var(--fs-section)/1.3 var(--font);
    text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:var(--sp-2);
    min-height:var(--tap);display:flex;align-items:center}
  .nw-navbox[open]>summary{border-bottom:1px solid var(--line);margin-bottom:var(--sp-2)}
  .nw-navbox .dgu-panel{border:0;padding:var(--sp-2);background:transparent}
  .nw-toc{display:flex;flex-wrap:wrap;gap:var(--sp-1)}

  /* pending and failed states of the data file */
  .nw-state{border:1px dashed var(--line);border-radius:var(--radius-md);padding:var(--sp-4);
    color:var(--muted);font-size:var(--fs-label);background:var(--panel-2)}
  .nw-state.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .nw-state b{display:block;margin-bottom:var(--sp-2);color:inherit}
  .nw-state small{opacity:.7}

  /* tap targets below md, for the targets THIS PAGE owns. v3.1 §17 R4 owns the
     framework's own (.dgu-sel, .dgu-home, tour/dialog/popover buttons) and gives
     .dgu-q a 44 px ::after hit area rather than a 44 px dot (§4.5). */
  @media(max-width:768px){
    html .dgu-app .badge,html .dgu-app .chip,html .dgu-app .btn,html .dgu-app .catrail button,
    html .dgu-app .exent{min-height:var(--tap);min-width:var(--tap)}
    /* min-height does not bind a table cell; height does */
    html .dgu-app table.mx td.c{height:var(--tap);min-width:var(--tap)}
    .fam{align-items:flex-start}
    .fam .fn,.fam .cc{flex:1 1 100%;width:100%}
    .badge{max-width:100%}
    .badge span{overflow-wrap:anywhere}
    dl.df,dl.pvdl{grid-template-columns:1fr}
    dl.df dt,dl.pvdl dt{padding-top:var(--sp-1)}
    .chipv b{white-space:normal}
  }

  /* diagram-ui.js absent: the page still works, with the token layer inlined */
  .nw-bare{max-width:1120px;margin:0 auto;padding:var(--sp-4)}
  .nw-bare *{box-sizing:border-box}
  .nw-bare section{margin:var(--sp-5) 0;border:1px solid var(--line);border-radius:var(--radius-md);
    background:var(--panel);padding:var(--sp-4)}
  .nw-bare h1{font-size:var(--fs-title)}
  .nw-bare h2{font:650 var(--fs-section)/1.3 var(--font);text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted)}
  .nw-bare label{display:block;margin:var(--sp-2) 0;font-size:var(--fs-label)}
  .nw-bare select,.nw-bare input{font:inherit;font-size:var(--fs-label);padding:var(--sp-2);
    border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);
    color:var(--ink);max-width:100%;min-height:var(--tap)}
  /* the genre warning, fallback only: with diagram-ui.js present it is
     ui.notice({sticky:true}), §5.2 — the component measured for this page. */
  .nw-bare .genrebar{display:flex;gap:var(--sp-3);align-items:flex-start;background:var(--warn-bg);
    color:var(--warn);border:1px solid var(--warn);border-radius:var(--radius-md);
    padding:var(--sp-3) var(--sp-4)}
  .nw-bare .genrebar .gi{flex:none;width:var(--sp-5);height:var(--sp-5);border-radius:var(--radius-sm);
    background:var(--warn);color:var(--bg);display:grid;place-items:center;font-weight:650;
    font-size:var(--fs-label)}
  .nw-bare .genrebar b{display:block;font-size:var(--fs-micro);letter-spacing:.08em;
    text-transform:uppercase}

/* ---------- facets: expected, not expected, not determined ---------- */
/* every facet option states which subjects it expects (second slot) and which it
   explicitly does not expect (third slot); a facet left unset states nothing     */
function facetById(id){for(var i=0;i<FACETS.length;i++){if(FACETS[i].id===id)return FACETS[i];}return null;}
function chosenOf(f,state){var v=state[f.id];return f.multi?((v||[]).slice(0)):(v?[v]:[]);}
function subjName(s){return s.indexOf("ar_")===0?T(s):T("dom_"+s);}
function subjNames(list){var out=[],i,n;for(i=0;i<list.length;i++){n=subjName(list[i]);if(out.indexOf(n)<0)out.push(n);}return out;}
function verdicts(state){
  var y={},n={},why={},i,j,k,f,ch,o;
  for(i=0;i<FACETS.length;i++){
    f=FACETS[i];ch=chosenOf(f,state);
    for(j=0;j<f.opts.length;j++){
      o=f.opts[j];
      if(ch.indexOf(o[0])<0)continue;
      for(k=0;k<o[1].length;k++)y[o[1][k]]=1;
      for(k=0;k<o[2].length;k++){n[o[2][k]]=1;why[o[2][k]]={f:f.id,o:o[0]};}
    }
  }
  var v={},lift={},s;
  for(i=0;i<SUBJ.length;i++){
    s=SUBJ[i];
    if(n[s]&&ST.lift[s]){v[s]=1;lift[s]=1;}
    else if(n[s])v[s]=-1;
    else if(y[s])v[s]=1;
    else v[s]=0;
  }
  return {v:v,why:why,lift:lift};
}
/* what a single facet states as a whole */
function facetState(state,fid){
  var f=facetById(fid),ch=chosenOf(f,state),j,o,pos=0,neg=0;
  if(!ch.length)return 0;
  for(j=0;j<f.opts.length;j++){
    o=f.opts[j];
    if(ch.indexOf(o[0])<0)continue;
    if(o[1].length)pos=1;
    if(o[2].length)neg=1;
  }
  return pos?1:(neg?-1:0);
}
function facetSubjects(state,fid,which){
  var f=facetById(fid),ch=chosenOf(f,state),out=[],j,k,o,lst;
  for(j=0;j<f.opts.length;j++){
    o=f.opts[j];
    if(ch.indexOf(o[0])<0)continue;
    lst=(which<0)?o[2]:o[1];
    for(k=0;k<lst.length;k++){if(out.indexOf(lst[k])<0)out.push(lst[k]);}
  }
  return out;
}
function facetValueLabel(state,fid){
  var f=facetById(fid),ch=chosenOf(f,state),p=[],j;
  for(j=0;j<ch.length;j++)p.push(T(ch[j]));
  return p.length?p.join(" \u00b7 "):T("tk_unset");
}
function docSubjects(d){
  var out=d.dom.slice(0),i;
  for(i=0;i<d.ar.length;i++){if(SUBJ.indexOf(d.ar[i])>=0&&out.indexOf(d.ar[i])<0)out.push(d.ar[i]);}
  return out;
}
function selectionOf(state){
  var V=verdicts(state),sel=[],exc=[],i,j,d,su,neg,pos,lif;
  for(i=0;i<DOCS.length;i++){
    d=DOCS[i];su=docSubjects(d);neg=[];pos=[];lif=[];
    for(j=0;j<su.length;j++){
      if(V.v[su[j]]===-1)neg.push(su[j]);
      else if(V.v[su[j]]===1){pos.push(su[j]);if(V.lift[su[j]])lif.push(su[j]);}
    }
    if(neg.length)exc.push({d:d,neg:neg});
    else if(pos.length)sel.push({d:d,lift:lif});
  }
  return {V:V,sel:sel,exc:exc};
}

function exclusionBlock(R,fk){
  var V=R.V,byFacet={},order=[],i,j,s,w,g;
  for(i=0;i<R.exc.length;i++){
    for(j=0;j<R.exc[i].neg.length;j++){
      s=R.exc[i].neg[j];w=V.why[s];
      if(!w)continue;
      if(!byFacet[w.f]){byFacet[w.f]={o:w.o,subs:[],docs:[],seen:{}};order.push(w.f);}

/* ---------- the exclusion class, read straight from the facet table ---------- */
/* deliberately independent of the selection code: if a facet value that says
   "not expected" stops excluding, these go red                                */
var CTRLRES=null;
function negOf(state){
  var out={},i,j,k,f,v,ch,o;
  for(i=0;i<FACETS.length;i++){
    f=FACETS[i];v=state[f.id];ch=f.multi?(v||[]):(v?[v]:[]);
    for(j=0;j<f.opts.length;j++){
      o=f.opts[j];
      if(ch.indexOf(o[0])<0)continue;
      for(k=0;k<o[2].length;k++)out[o[2][k]]={f:f.id,o:o[0]};
    }
  }
  return out;
}
function posOf(state){
  var out={},i,j,k,f,v,ch,o;
  for(i=0;i<FACETS.length;i++){
    f=FACETS[i];v=state[f.id];ch=f.multi?(v||[]):(v?[v]:[]);
    for(j=0;j<f.opts.length;j++){
      o=f.opts[j];
      if(ch.indexOf(o[0])<0)continue;
      for(k=0;k<o[1].length;k++)out[o[1][k]]=1;
    }
  }
  return out;
}
function cloneSet(st){return {proc:st.proc,cont:st.cont,ex:st.ex,hygr:st.hygr,env:st.env,req:(st.req||[]).slice(0)};}
/* the selection the facet table alone calls for, built without touching
   verdicts() or selectionOf(): an unset facet contributes no area at all      */
function modelSel(state){
  var ng=negOf(state),pg=posOf(state),sel={},exc={},i,j,d,su,neg,pos;
  for(i=0;i<DOCS.length;i++){
    d=DOCS[i];su=docSubjects(d);neg=false;pos=false;
    for(j=0;j<su.length;j++){if(ng[su[j]])neg=true;else if(pg[su[j]])pos=true;}
    if(neg)exc[d.id]=1;
    else if(pos)sel[d.id]=1;
  }
  return {sel:sel,exc:exc};
}
function sameIds(a,b){
  var k;
  for(k in a){if(Object.prototype.hasOwnProperty.call(a,k)&&!b[k])return false;}
  for(k in b){if(Object.prototype.hasOwnProperty.call(b,k)&&!a[k])return false;}
  return true;
}
/* every situation in which at least one facet is left unset */
function unsetStates(){
  var out=[emptyTask()],i,j,q,f,st,base;
  for(i=0;i<SCEN.length;i++){
    base=cloneSet(SCEN[i].set);
    for(j=0;j<FACETS.length;j++){st=cloneSet(base);st[FACETS[j].id]=FACETS[j].multi?[]:"";out.push(st);}
  }
  for(j=0;j<FACETS.length;j++){
    f=FACETS[j];
    for(q=0;q<f.opts.length;q++){st=emptyTask();st[f.id]=f.multi?[f.opts[q][0]]:f.opts[q][0];out.push(st);}
  }
  return out;
}
function controlStates(){
  var out=[],i,j,q,f,st;
  for(i=0;i<SCEN.length;i++){
    out.push(cloneSet(SCEN[i].set));
    for(j=0;j<FACETS.length;j++){
      f=FACETS[j];
      if(f.multi)continue;
      for(q=0;q<f.opts.length;q++){st=cloneSet(SCEN[i].set);st[f.id]=f.opts[q][0];out.push(st);}
    }
  }
  return out;
}
function controlCheck(){
  if(CTRLRES)return CTRLRES;
  var held=ST.lift;ST.lift={};
  var okNeg=true,okKeep=true,okArea=true,okPv=true,okUnset=true;
  var CT=controlStates(),i,j,q,st0,ng,pg,R0,ss,held2;
  for(i=0;i<CT.length;i++){
    st0=CT[i];ng=negOf(st0);pg=posOf(st0);R0=selectionOf(st0);
    for(j=0;j<R0.sel.length;j++){
      ss=docSubjects(R0.sel[j].d);
      for(q=0;q<ss.length;q++){if(ng[ss[q]])okNeg=false;}
    }
    /* nothing is lost from a facet that says "expected": every entry that sits in
       an expected subject and in no not-expected subject stays in the selection */
    for(j=0;j<DOCS.length;j++){
      ss=docSubjects(DOCS[j]);
      var wanted=false,barred=false;
      for(q=0;q<ss.length;q++){if(pg[ss[q]])wanted=true;if(ng[ss[q]])barred=true;}
      if(!wanted||barred)continue;
      held2=false;
      for(var z=0;z<R0.sel.length;z++){if(R0.sel[z].d.id===DOCS[j].id){held2=true;break;}}
      if(!held2)okKeep=false;
    }
  }
  /* and for the situations as they are shipped, no expected subject is emptied */
  for(i=0;i<SCEN.length;i++){
    ng=negOf(SCEN[i].set);pg=posOf(SCEN[i].set);R0=selectionOf(SCEN[i].set);
    for(q=0;q<SUBJ.length;q++){
      if(!pg[SUBJ[q]]||ng[SUBJ[q]])continue;
      held2=false;
      for(j=0;j<R0.sel.length;j++){if(docSubjects(R0.sel[j].d).indexOf(SUBJ[q])>=0){held2=true;break;}}
      if(!held2)okKeep=false;
    }
  }
  for(i=0;i<SCEN.length;i++){
    ng=negOf(SCEN[i].set);
    for(j=0;j<SCEN[i].ar.length;j++){if(ng[SCEN[i].ar[j]])okArea=false;}
    var lst=provFor("scen",SCEN[i].id);
    for(j=0;j<lst.length;j++){
      var su=TPSUBJ[lst[j].tp]||[];
      for(q=0;q<su.length;q++){if(ng[su[q]])okPv=false;}
    }
  }
  /* an unset facet states nothing: the selection the machine actually produces in
     every situation that leaves a facet unset is compared with the selection the
     facet table alone calls for. Both sides are computed by different code, so a
     change that makes "not set" mean "not expected" — or "expected" — shows up   */
  var US=unsetStates(),EX,got,gex;
  for(i=0;i<US.length;i++){
    st0=US[i];R0=selectionOf(st0);EX=modelSel(st0);
    got={};gex={};
    for(j=0;j<R0.sel.length;j++)got[R0.sel[j].d.id]=1;
    for(j=0;j<R0.exc.length;j++)gex[R0.exc[j].d.id]=1;
    if(!sameIds(got,EX.sel))okUnset=false;
    if(!sameIds(gex,EX.exc))okUnset=false;
  }
  /* and clearing a facet that only says "not expected" never costs an entry */
  for(i=0;i<SCEN.length;i++){
    var base=cloneSet(SCEN[i].set),Rb=selectionOf(base),ids={},kk;
    for(j=0;j<Rb.sel.length;j++)ids[Rb.sel[j].d.id]=1;
    for(j=0;j<FACETS.length;j++){
      if(facetState(base,FACETS[j].id)>=0)continue;
      var st2=cloneSet(base);st2[FACETS[j].id]=FACETS[j].multi?[]:"";
      var R2=selectionOf(st2),ids2={};
      for(q=0;q<R2.sel.length;q++)ids2[R2.sel[q].d.id]=1;
      for(kk in ids){if(Object.prototype.hasOwnProperty.call(ids,kk)&&!ids2[kk])okUnset=false;}
    }
  }
  /* the run-time filter that keeps a key condition off screen when its subject is
     marked not expected, measured against the facet table rather than itself     */
  var okFilt=true,nblk=0,STS=controlStates().concat(US),Vf,sj,want;
  for(i=0;i<STS.length&&okFilt;i++){
    st0=STS[i];ng=negOf(st0);Vf=verdicts(st0);
    for(j=0;j<PROV.length;j++){
      sj=TPSUBJ[PROV[j].tp]||[];want="";
      for(q=0;q<sj.length;q++){if(ng[sj[q]]){want=sj[q];break;}}
      if(pvBlocked(PROV[j],Vf)!==want){okFilt=false;break;}
      if(want)nblk++;
    }
  }
  if(!nblk)okFilt=false;
  ST.lift=held;
  CTRLRES={neg:okNeg,keep:okKeep,area:okArea,pv:okPv,unset:okUnset,filt:okFilt};
  return CTRLRES;
}

/* ---------- filters + list ---------- */
function haystack(d){
  var p=[d.id,d.idn||"",TI(d.id),TI(d.id,DEFAULT_LANG),T(d.org),I18N[DEFAULT_LANG][d.org]||""];
  return fold(p.join(" "));
}
function qhit(hay,q){
  q=fold(q).replace(/^\s+|\s+$/g,"");
  if(!q)return true;
  var toks=q.split(/\s+/);
  for(var i=0;i<toks.length;i++){
    var t=toks[i],ok=false,cuts=[t];
    if(t.length>=4)cuts.push(t.slice(0,-1));
    if(t.length>=6)cuts.push(t.slice(0,-2));
    for(var j=0;j<cuts.length;j++){if(cuts[j].length>=2&&hay.indexOf(cuts[j])>=0){ok=true;break;}}
    if(!ok)return false;
  }
  return true;
}
function matches(d){
  if(ST.filt.sec&&d.ar.indexOf(ST.filt.sec)<0)return false;
  if(ST.filt.cat&&d.cat!==ST.filt.cat)return false;
  if(ST.filt.dom&&d.dom.indexOf(ST.filt.dom)<0)return false;
  if(ST.filt.geo&&d.geo!==ST.filt.geo)return false;
  if(ST.filt.q&&!qhit(haystack(d),ST.filt.q))return false;
  return true;
}

    h+='<div class="grouphead" id="grp-'+CATS[c]+'">'+catBadge(CATS[c],"grp:"+CATS[c])+"<span class='gl'></span></div>";
    h+=grp.map(docCard).join("");
  }
  if(!h)h='<div class="empty">'+esc(T("f_none"))+"</div>";
  el("list").innerHTML=h;
}

function provBlock(list,fk,ttl,hint){

/* ---------- checks ---------- */
function runChecks(){
  var res=[],i,j,d;
  var enKeys=Object.keys(I18N[DEFAULT_LANG]),okKeys=true;
  for(i=0;i<LANGS.length;i++){
    var dict=I18N[LANGS[i]];
    if(!dict){okKeys=false;break;}
    for(j=0;j<enKeys.length;j++){if(typeof dict[enKeys[j]]!=="string"||!dict[enKeys[j]].length){okKeys=false;break;}}
    if(!okKeys)break;
  }
  res.push(["v1",okKeys]);

  var okCat=true;
  for(i=0;i<DOCS.length;i++){if(CATS.indexOf(DOCS[i].cat)<0||STATUS.indexOf(DOCS[i].st)<0)okCat=false;}
  res.push(["v2",okCat]);

  var okAr=true;
  for(i=0;i<DOCS.length;i++){
    d=DOCS[i];
    if(!d.ar||!d.ar.length)okAr=false;
    else for(j=0;j<d.ar.length;j++){if(AREAS.indexOf(d.ar[j])<0)okAr=false;}
  }
  res.push(["v3",okAr]);

  /* a paid-standard entry carries no figure in any language */
  var okPaid=true,rr,tx,q;
  for(i=0;i<PROV.length&&okPaid;i++){
    rr=PROV[i];
    if(rr.ly!=="paidstd")continue;
    if(rr.v&&rr.v.length){okPaid=false;break;}
    for(j=0;j<LANGS.length&&okPaid;j++){
      tx=(PTX[LANGS[j]]||{})[rr.id];
      if(!tx){okPaid=false;break;}
      for(q=0;q<tx.length;q++){if(/[0-9]/.test(tx[q])){okPaid=false;break;}}
    }
  }
  var paidNodes=document.querySelectorAll(".pv.paidstd");
  for(i=0;i<paidNodes.length;i++){if(/[0-9]/.test(paidNodes[i].textContent))okPaid=false;}
  res.push(["v4a",okPaid]);

  /* an entry that carries a figure names the file it is traced to */
  var okTrace=true,hasNum;
  for(i=0;i<PROV.length&&okTrace;i++){
    rr=PROV[i];hasNum=!!(rr.v&&rr.v.length);
    for(j=0;j<LANGS.length&&!hasNum;j++){
      tx=(PTX[LANGS[j]]||{})[rr.id]||[];
      for(q=0;q<tx.length;q++){if(/[0-9]/.test(tx[q])){hasNum=true;break;}}
    }
    if(hasNum&&!(rr.tr&&rr.tr.length))okTrace=false;
  }
  res.push(["v4b",okTrace]);

  /* every named file exists in the worked material */
  var okSrc=true;
  for(i=0;i<PROV.length;i++){
    if(PROV[i].tr&&SRCFILES.indexOf(PROV[i].tr)<0)okSrc=false;
    if(PROV[i].tc&&SRCFILES.indexOf(PROV[i].tc)<0)okSrc=false;
  }
  res.push(["v4c",okSrc]);

  /* a trace names the place inside the file, not only the file */
  var okPlace=true,traced=0;
  for(i=0;i<PROV.length;i++){
    rr=PROV[i];
    if(!rr.tr)continue;
    traced++;
    if(typeof rr.ln!=="number"||!(rr.ln>0)||rr.ln!==Math.floor(rr.ln))okPlace=false;
    if(typeof rr.mt!=="string"||!rr.mt.length)okPlace=false;
    if(rr.tc&&(typeof rr.tcl!=="number"||!(rr.tcl>0)))okPlace=false;
  }
  if(!traced)okPlace=false;
  var pvAll=document.querySelectorAll(".pv"),sf,cut;
  for(i=0;i<pvAll.length;i++){
    if(!pvAll[i].querySelector(".pvchips"))continue;
    sf=pvAll[i].getAttribute("data-source-file")||"";
    cut=sf.lastIndexOf(":");
    if(cut<1||!/^[0-9]+$/.test(sf.slice(cut+1))||SRCFILES.indexOf(sf.slice(0,cut))<0){okPlace=false;break;}
  }
  res.push(["v4f",okPlace]);

  /* every openly published entry carries the reminder about the edition in force,
     and a sold standard carries the reminder that no figure is reproduced */
  var okEd=true;
  for(i=0;i<LANGS.length;i++){
    var edt=I18N[LANGS[i]]["pv_ed"],nnt=I18N[LANGS[i]]["pv_nonum"];
    if(typeof edt!=="string"||!edt.length)okEd=false;
    if(typeof nnt!=="string"||!nnt.length)okEd=false;
  }
  var opN=document.querySelectorAll(".pv.openlaw").length;
  var opNote=document.querySelectorAll(".pv.openlaw > .pvnote").length;
  if(opN!==opNote)okEd=false;
  var noteMap=[["openlaw","pv_ed"],["paidstd","pv_nonum"],["chapter","pv_orient"]],nn,nd2;
  for(i=0;i<noteMap.length;i++){
    nn=document.querySelectorAll(".pv."+noteMap[i][0]);
    for(j=0;j<nn.length;j++){
      nd2=nn[j].querySelector(".pvnote");
      if(!nd2||nd2.textContent.trim()!==String(T(noteMap[i][1])).trim())okEd=false;
    }
  }
  res.push(["v4d",okEd]);

  /* no entry claims that it applies to the reader's project or that it is enough */
  var okClaim=true,low,b;
  for(i=0;i<PROV.length&&okClaim;i++){
    for(j=0;j<LANGS.length&&okClaim;j++){
      tx=(PTX[LANGS[j]]||{})[PROV[i].id]||[];
      for(q=0;q<tx.length&&okClaim;q++){
        low=fold(tx[q]);
        for(b=0;b<BANNED.length;b++){if(low.indexOf(BANNED[b])>=0){okClaim=false;break;}}
      }
    }
  }
  res.push(["v4e",okClaim]);


  var seen={},okId=true;
  for(i=0;i<DOCS.length;i++){if(seen[DOCS[i].id])okId=false;seen[DOCS[i].id]=1;}
  res.push(["v5",okId]);

  var counts={},okRep=true;
  for(i=0;i<DOCS.length;i++)counts[DOCS[i].cat]=(counts[DOCS[i].cat]||0)+1;
  for(i=0;i<CATS.length;i++){if(!counts[CATS[i]])okRep=false;}
  res.push(["v6",okRep]);

  var okChk=true;
  for(i=0;i<DOCS.length;i++){
    d=DOCS[i];
    if(!d.chk||!d.chk.length)okChk=false;
    else for(j=0;j<d.chk.length;j++){if(typeof T("ck_"+d.chk[j])!=="string"||T("ck_"+d.chk[j])==="ck_"+d.chk[j])okChk=false;}
  }
  res.push(["v7",okChk]);

  var okTr=true;
  for(i=0;i<LANGS.length;i++){
    var t=DESC[LANGS[i]];if(!t){okTr=false;break;}
    for(j=0;j<DOCS.length;j++){
      var p=t[DOCS[j].id];
      if(!p||typeof p[0]!=="string"||typeof p[1]!=="string"||!p[0].length||!p[1].length){okTr=false;break;}
    }
    if(!okTr)break;
  }
  res.push(["v8",okTr]);

  var okMeta=true;
  for(i=0;i<DOCS.length;i++){
    d=DOCS[i];
    if(!d.dom||!d.dom.length||GEOS.indexOf(d.geo)<0)okMeta=false;
    else for(j=0;j<d.dom.length;j++){if(DOMS.indexOf(d.dom[j])<0)okMeta=false;}
  }
  res.push(["v9",okMeta]);

  var sum=0;
  for(i=0;i<CATS.length;i++)sum+=(counts[CATS[i]]||0);
  /* the corpus size is whatever the data file holds, not a fixed number */
  res.push(["v10",DOCS.length>0&&sum===DOCS.length]);

  /* every category reachable in every mode: register group, matrix row, task result */
  var mxCol={},taskCat={};
  for(i=0;i<CATS.length;i++){mxCol[CATS[i]]=0;taskCat[CATS[i]]=0;}
  for(i=0;i<DOCS.length;i++){
    d=DOCS[i];
    if(d.ar&&d.ar.length)mxCol[d.cat]++;
    for(j=0;j<d.dom.length;j++){if(DOMS.indexOf(d.dom[j])>=0){taskCat[d.cat]++;break;}}
  }
  var okReach=true;
  for(i=0;i<CATS.length;i++){if(!mxCol[CATS[i]]||!taskCat[CATS[i]]||!counts[CATS[i]])okReach=false;}
  var mxHead=document.querySelectorAll("#mx thead th").length;
  if(mxHead&&mxHead!==CATS.length+2)okReach=false;
  res.push(["v11",okReach]);

  /* every subject field carries at least one calculation method and one rule of thumb */
  var okSpan=true;
  for(i=0;i<DOMS.length;i++){
    var hasM=false,hasR=false;
    for(j=0;j<DOCS.length;j++){
      if(DOCS[j].dom.indexOf(DOMS[i])<0)continue;
      if(DOCS[j].cat==="method")hasM=true;
      if(DOCS[j].cat==="rule")hasR=true;
    }
    if(!hasM||!hasR)okSpan=false;
  }
  res.push(["v12",okSpan]);

  /* scenarios: complete, translated, free of numeric requirements */
  var okScen=true;
  for(i=0;i<LANGS.length;i++){
    var sd=SCN[LANGS[i]];if(!sd){okScen=false;break;}
    for(j=0;j<SCEN.length;j++){
      var e2=sd[SCEN[j].id];
      if(!e2||typeof e2.n!=="string"||!e2.n.length){okScen=false;break;}
      if(!e2.w||e2.w.length!==6||!e2.b||e2.b.length!==3){okScen=false;break;}
      var texts=e2.w.concat(e2.b).concat([e2.n]),bad=false;
      for(var q=0;q<texts.length;q++){if(typeof texts[q]!=="string"||!texts[q].length||/[0-9]/.test(texts[q]))bad=true;}
      if(bad){okScen=false;break;}
    }
    if(!okScen)break;
  }
  res.push(["v13",okScen]);

  /* every scenario sets every facet and points at subject areas */
  var okSet=true;
  for(i=0;i<SCEN.length;i++){
    var s=SCEN[i];
    if(!s.ar||!s.ar.length){okSet=false;continue;}
    for(j=0;j<s.ar.length;j++){if(AREAS.indexOf(s.ar[j])<0)okSet=false;}
    if(!s.set||!s.set.proc||!s.set.cont||!s.set.ex||!s.set.hygr||!s.set.env||!s.set.req.length)okSet=false;
    var dm=verdicts(s.set).v,any=false;
    for(j=0;j<SUBJ.length;j++){if(dm[SUBJ[j]]===1)any=true;}
    if(!any)okSet=false;
  }
  res.push(["v14",okSet]);

  /* every entry is named and attributed in all seven languages, with no numeric requirement there */
  var okTitle=true;
  for(i=0;i<LANGS.length;i++){
    var tt=TITLES[LANGS[i]],ii=I18N[LANGS[i]];
    if(!tt){okTitle=false;break;}
    for(j=0;j<DOCS.length;j++){
      var nm=tt[DOCS[j].id],og=ii[DOCS[j].org];
      if(typeof nm!=="string"||!nm.length||/[0-9]/.test(nm)){okTitle=false;break;}
      if(typeof og!=="string"||!og.length){okTitle=false;break;}
    }
    if(!okTitle)break;
  }
  res.push(["v15",okTitle]);

  /* every subject area is named everywhere and actually carries entries */
  var okArea=true;
  for(i=0;i<AREAS.length;i++){
    var used=0;
    for(j=0;j<DOCS.length;j++){if(DOCS[j].ar.indexOf(AREAS[i])>=0)used++;}
    if(!used)okArea=false;
    for(j=0;j<LANGS.length;j++){var an=I18N[LANGS[j]][AREAS[i]];if(typeof an!=="string"||!an.length)okArea=false;}
  }
  res.push(["v16",okArea]);

  /* every category badge on the page is a real button with an accessible name */
  var marks=document.querySelectorAll(".badge"),okBdg=true;
  for(i=0;i<marks.length;i++){
    var m=marks[i];
    if(m.tagName==="BUTTON"){if(!m.getAttribute("aria-label"))okBdg=false;continue;}
    if(!m.closest||!m.closest("button"))okBdg=false;
  }
  res.push(["v17",okBdg]);

  /* every figure is tied to a register entry and to an industry scenario */
  var okTie=true;
  for(i=0;i<PROV.length;i++){
    if(!PROV[i].scen.length)okTie=false;
    if(PROV[i].v.length&&!PROV[i].docs.length)okTie=false;
  }
  res.push(["v18",okTie]);

  /* every key condition exists in all seven languages */
  var okPvT=true;
  for(i=0;i<LANGS.length&&okPvT;i++){
    var pd=PTX[LANGS[i]];
    if(!pd){okPvT=false;break;}
    for(j=0;j<PROV.length;j++){
      var pt=pd[PROV[j].id];
      if(!pt||pt.length!==4){okPvT=false;break;}
      for(q=0;q<4;q++){if(typeof pt[q]!=="string"||!pt[q].length){okPvT=false;break;}}
      if(!okPvT)break;
    }
  }
  res.push(["v19",okPvT]);


  var cx=controlCheck();
  res.push(["v20",cx.neg]);
  res.push(["v21",cx.keep]);
  res.push(["v22",cx.area]);
  res.push(["v23",cx.pv]);
  res.push(["v24",cx.unset]);
  res.push(["v25",cx.filt]);

  var fails=0;
  el("val-out").innerHTML=res.map(function(r){
    if(!r[1])fails++;
    return '<div class="flag '+(r[1]?"ok":"bad")+'">'+esc(T(r[0]))+"</div>";
  }).join("");
  var w=el("val-warn");
  if(fails){w.hidden=false;w.textContent=T("val_warn");}
  else{w.hidden=true;w.textContent="";}
}

 light:{law:"#c0392b",std:"#2456c6",guide:"#a8620a",method:"#0f7a66",rule:"#6b4fbf"},

     390 px viewport permanently)". ui.notice({sticky}) is compact by default —
     two lines with a translated Show more — which is the answer to the 22 %.

     slot:"results" is the other half of that repair, and it is deliberate. A
     sticky notice travels no further than the region it is docked in, and the
     §5.2 default for `reference` is `stage`. This page's stage — the categories,
     the scenarios, the exclusions, the coverage matrix — is 2 700 px of a
     285 105 px document at 390 and 1 588 px of 140 620 px at 1440, so docked
