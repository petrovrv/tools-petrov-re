<script>
(function () {
'use strict';
/* Temporary Configuration & Bypass Risk — calculation core (pure functions, no DOM).
   Register of temporary configurations with dated life cycle and a restoration-evidence closure gate, plus an
   optional scenario estimate (initiating frequency × chain PFD over the joint exposure interval). Linked
   configurations are shown together; scenario results are never summed. */
var TC_VERSION = '2026-10-09.tc-3';
var TC_STATUS = ['confirmed', 'rejected', 'unknown', 'not_applicable'];
var TC_DATA = ['confirmed', 'estimated', 'unknown'];
var TC_REQUEST = ['active', 'restoration', 'closed'];
var TC_DECISION = ['pending', 'approved', 'rejected'];
var TC_DAYS_PER_YEAR = 365.2425;

function tcNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function tcText(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function tcList(v) { var out = []; tcText(v).split(/[,;\s]+/).forEach(function (x) { if (x && out.indexOf(x) < 0) out.push(x); }); return out; }
/* YYYY-MM-DD of a real calendar day → day number (days since 1970-01-01), else null */
function tcDay(v) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(tcText(v)); if (!m) return null;
  var y = +m[1], mo = +m[2], d = +m[3], t = Date.UTC(y, mo - 1, d), x = new Date(t);
  if (x.getUTCFullYear() !== y || x.getUTCMonth() !== mo - 1 || x.getUTCDate() !== d) return null;
  return Math.round(t / 86400000);
}
function tcPfd(v) { return tcNum(v) !== null && v >= 0 && v <= 1; }

/* one register row; A = assessment day number */
function tcConfig(c, id, A) {
  var o = { id: id, state: 'unknown', overdue: false, days_to_expiry: null, in_effect: true, gaps: [] }, g = o.gaps;
  var st = tcDay(c.start_date), ex = tcDay(c.expiry_date);
  if (!tcText(c.owner)) g.push('owner_missing');
  if (!tcText(c.reason)) g.push('reason_missing');
  if (!tcText(c.affected_function)) g.push('function_missing');
  if (!tcText(c.initial_config) || !tcText(c.temporary_config)) g.push('configuration_missing');
  if (!tcText(c.return_trigger)) g.push('return_trigger_missing');
  if (st === null) g.push('start_invalid');
  if (ex === null) g.push('expiry_invalid');
  if (st !== null && ex !== null && ex < st) g.push('expiry_before_start');
  if (c.approval_status === 'rejected') g.push('approval_rejected'); else if (c.approval_status !== 'confirmed') g.push('approval_unconfirmed');
  var req = TC_REQUEST.indexOf(c.requested_state) >= 0 ? c.requested_state : 'active';
  if (req === 'closed') {
    var cg = [], route = c.restoration_status === 'confirmed' ? 'restored' : c.restoration_status === 'not_applicable' ? 'superseded' : null;
    if (!route) cg.push('restoration_not_confirmed');
    if (route === 'superseded' && !tcText(c.restoration_reason)) cg.push('na_reason_missing');
    if (!tcText(c.restoration_evidence)) cg.push('restoration_evidence_missing');
    if (!tcText(c.verified_by)) cg.push('verifier_missing');
    var vd = tcDay(c.verified_date);

figurationen und Überbrückungen","modelVersion":"Modellversion","eqNote":"Symbole: s_i, e_i — Beginn und Ende der Konfiguration i (Ende: Verifizierungsdatum bei Abschluss, Ablaufdatum innerhalb der Frist, Bewertungsdatum bei Überfälligkeit); t — gemeinsame Exposition in Tagen; q_j — Barrieren-PFD; Q — Ketten-PFD; λ — Häufigkeit des auslösenden Ereignisses; f — Szenariohäufigkeit; P — Wahrscheinlichkeit über die Exposition; B — Ausgangszustand, T — temporär. Q_J — gemeinsame Ketten-PFD der Barrieren einer Abhängigkeitsgruppe. I — inkrementelle Wahrscheinlichkeit Δf · t_y in der Form der Konfigurationsrisiko-Praxis (ICDP); sie übersteigt ΔP, wenn f · t_y nicht klein ist.","modelText":"Die Registerzustände folgen den Daten und der Abschlussbedingung; die Szenarioabschätzung setzt eine konstante Häufigkeit des auslösenden Ereignisses über die gemeinsame Exposition und unabhängige Barrieren voraus, sofern keine Abhängigkeitsgruppe angegeben ist.","boundaryText":"Das Werkzeug setzt keinen Akzeptanzschwellenwert und liefert keine regulatorische Schlussfolgerung; die Freigabe ist eine eigene, an die Eingaben gebundene Entscheidung.","scopeText":"Vorläufiges Ingenieurhilfsmittel. Die eingebauten Beispiele sind synthetisch. Es ist keine Risikoakzeptanzschwelle hinterlegt.","incrP":"Δf · t","w_joint_below_independent":"Die gemeinsame PFD der Abhängigkeitsgruppe liegt unter dem Produkt der Barrieren-PFD; Abhängigkeit zwischen Barrieren kann ein gemeinsames Versagen nicht unwahrscheinlicher machen als unabhängige Ausfälle."},"nl":{"title":"Tijdelijke configuraties en risico van overbruggingen","subtitle":"Register van tijdelijke configuraties en overbruggingen met vervaldatum, goedkeuring en afsluiting alleen met bewijs van herstel; optionele scenarioschatting zonder optelling","registerPanel":"Register","item":"Register of eenheid","assessmentDate":"Beoordelingsdatum","syntheticCase":"Synthetisch voorbeeld","configs":"Tijdelijke configuraties","editConfig":"Geselecteerde config en lopend herstel blijft van kracht; afsluiting wordt alleen aanvaard met bevestigd herstel, bewijs, verificateur en verificatiedatum.","learnTryTitle":"Probeer","learnTry":"Open het voorbeeld ‘afsluiting zonder bewijs’ en evalueer. Voordat u verder leest: is de overbrugging nog van kracht?","learnExplainTitle":"Uitleg","learnExplain":"Het verzoek tot afsluiting is nog geen afsluiting. Zonder bevestigd herstel en bewijs is de rij ‘afsluiting geblokkeerd’: ze blijft van kracht, ze is over haar vervaldatum, en de blootstelling van het scenario loopt tot de beoordelingsdatum — 28 dagen in plaats van 2, ΔP 7,7 × 10⁻⁶ in plaats van 5,5 × 10⁻⁷.","learnFixTitle":"Correctie","learnFix":"Leg het herstel vast als bevestigd, de afmelding van de werkorder als bewijs, de verificateur en de datum: de rij wordt afgesloten en de blootstelling van het scenario eindigt op de verificatiedatum.","learnBoundaryTitle":"Waar het getal ophoudt","learnBoundary":"Een scenarioschatting heeft de frequentie van de initiërende gebeurtenis nodig, elke barrière-PFD met bron en status, en een gezamenlijke PFD voor afhankelijke barrières. Anders wordt ze achtergehouden. Scenario's worden nooit opgeteld, en goedkeuring blijft een afzonderlijke beslissing.","reportTitle":"Register van tijdelijke configuraties en overbruggingen","modelVersion":"Modelversie","eqNote":"Symbolen: s_i, e_i — begin en einde van configuratie i (einde: verificatiedatum indien afgesloten, vervaldatum indien binnen termijn, beoordelingsdatum indien achterstallig); t — gezamenlijke blootstelling in dagen; q_j — barrière-PFD; Q — keten-PFD; λ — frequentie van de initiërende gebeurtenis; f — scenariofrequentie; P — kans over de blootstelling; B — basistoestand, T — tijdelijk. Q_J — gezamenlijke keten-PFD van de barrières in één afhankelijkheidsgroep. I — incrementele kans Δf · t_y in de vorm uit de praktijk van configuratierisico (ICDP); zij overtreft ΔP wanneer f · t_y niet klein is.","modelText":"De registertoestanden volgen uit de datums en de afsluitvoorwaarde; de scenarioschatting veronderstelt een constante frequentie van de initiërende gebeurtenis over de gezamenlijke blootstelling en onafhankelijke barrières, tenzij een afhankelijkheidsgroep is opgegeven.","boundaryText":"Het hulpmiddel stelt geen aanvaardbaarheidsdrempel vast en trekt geen regelgevende conclusie; goedkeuring is een afzonderlijke beslissing, gekoppeld aan de invoer.","scopeText":"Voorlopig technisch hulpmiddel. De ingebouwde voorbeelden zijn synthetisch. Er is geen drempel voor risicoaanvaardbaarheid ingebouwd.","incrP":"Δf · t","w_joint_below_independent":"De gezamenlijke PFD van de afhankelijkheidsgroep ligt onder het product van de barrière-PFD's; afhankelijkheid tussen barrières kan gezamenlijk falen niet minder waarschijnlijk maken dan onafhankelijk falen."},"fr":{"title":"Configurations temporaires et risque des inhibitions","subtitle":"Registre des configurations temporaires et des inhibitions avec échéance, approbation et clôture subordonnée à la preuve de rétablissement ; estimation facultative par scénario, sans sommation","registerPanel":"Registre","item":"Registre ou tranche","assessmentDate":"Date d'évaluation","syntheticCase":"Cas synthétique","configs":"Configurations temporaires","editConfig":"Configuration sélectionnée","editRow":"Ligne","addRow":"Ajouter une ligne","id":"ID","name":"Intitulé","owner":"Responsable","reason":"Motif","affectedFunction":"Fonction affectée","initialConfig":"Configuration initiale","temporaryConfig":"Configuration temporaire","compensating":"Mesures compensatoires","returnTrigger":"Critère de retour","linkGroup":"Ensemble lié","startDate":"Date de début","expiry":"Échéance","requested":"État demandé","req_active":"en vigueur","req_restoration":"rétablissement en cours","req_closed":"clôturer","approval":"Approbation","approvalRef":"Référence d'approbation","restoration":"Rétablissement","restorationReason":"Motif si sans objet","restorationEvidence":"Preuve de rétablissem s":"Des configurations liées sont en vigueur ensemble ; leurs scénarios sont affichés séparément et jamais additionnés.","w_exposure_extends_to_assessment":"Une configuration en retard est comptée comme en vigueur jusqu'à la date d'évaluation.","w_estimated_data":"L'estimation utilise des données marquées comme estimées.","w_scenarios_not_summed":"Plusieurs scénarios sont estimés ; ils ne sont pas additionnés.","w_restored_values":"Des valeurs enregistrées ont été remplacées au chargement : ","a_set_assessment_date":"saisir une date d'évaluation valide","a_add_configuration":"ajouter une configuration temporaire","a_rename_duplicate":"donner à la ligne un ID unique","a_assign_barrier":"affecter la barrière à un scénario","a_complete_record":"compléter l'entrée du registre","a_correct_dates":"corriger les dates","a_obtain_approval":"obtenir l'approbation","a_remove_or_reapprove":"supprimer la configuration ou obtenir une nouvelle approbation","a_restore_or_extend":"rétablir maintenant, ou prolonger avec une nouvelle approbation","a_complete_restoration_evidence":"compléter la preuve de rétablissement avant la clôture","a_complete_restoration":"achever le rétablissement et en enregistrer la preuve","a_link_configurations":"rattacher le scénario à des configurations du registre","a_check_exposure":"vérifier les dates des configurations liées","a_obtain_frequency":"obtenir la fréquence de l'événement initiateur avec sa source","a_confirm_model":"confirmer que le modèle de scénario s'applique","a_define_barriers":"définir les barrières du scénario","a_obtain_pfd":"obtenir les PFD des barrières avec leurs sources","a_model_dependence":"modéliser conjointement les barrières dépendantes","exControl":"Une inhibition d'essai, clôturée avec preuve (contrôle)","exControlNote":"Rétablie le 3 septembre et vérifiée ; le scénario couvre les 2 jours en vigueur : ΔP ≈ 5,5 × 10⁻⁷.","exLinked":"Deux inhibitions de verrouillage liées (type)","exLinkedNote":"Un ensemble d'arrêt, les deux ,5 × 10⁻⁷.","learnFixTitle":"Correction","learnFix":"Enregistrez le rétablissement comme confirmé, la clôture de l'ordre de travail comme preuve, le vérificateur et la date : la ligne devient clôturée et l'exposition du scénario s'arrête à la date de vérification.","learnBoundaryTitle":"Où s'arrête le chiffre","learnBoundary":"Une estimation par scénario exige la fréquence de l'événement initiateur, la PFD de chaque barrière avec sa source et son statut, et une PFD conjointe pour les barrières dépendantes. Sinon elle est retenue. Les scénarios ne sont jamais additionnés, et l'approbation reste une décision distincte.","reportTitle":"Registre des configurations temporaires et des inhibitions","modelVersion":"Version du modèle","eqNote":"Symboles : s_i, e_i — début et fin de la configuration i (fin : date de vérification si clôturée, échéance si dans les délais, date d'évaluation si en retard) ; t — exposition conjointe en jours ; q_j — PFD de barrière ; Q — PFD de la chaîne ; λ — fréquence de l'événement initiateur ; f — fréquence du scénario ; P — probabilité sur l'exposition ; B — référence, T — temporaire. Q_J — PFD conjointe de la chaîne pour les barrières d’un même groupe de dépendance. I — probabilité incrémentale Δf · t_y, forme utilisée dans la pratique du risque de configuration (ICDP) ; elle dépasse ΔP lorsque f · t_y n’est pas petit.","modelText":"Les états du registre découlent des dates et de la condition de clôture ; l'estimation par scénario suppose une fréquence de l'événement initiateur constante sur l'exposition conjointe et des barrières indépendantes, sauf si un groupe de dépendance est déclaré.","boundaryText":"L'outil ne fixe aucun seuil d'acceptation et ne fournit aucune conclusion réglementaire ; l'approbation est une décision distincte liée aux données.","scopeText":"Aide d'ingénierie préliminaire. Les exemples intégrés sont synthétiques. Aucun seuil d'acceptabilité du risque n'est intégré.","incrP":"Δf · t","w_joint_below_independent":"La PF
