    legendText: T('Top panel: hazard level 0–4 (solid: this run; dashed: comparison run). Bottom panel: people in the danger zone (blue), not accounted for (orange), casualties without care (red), in care (green). Triangles: steps with decisions. Rings: steps where a cue was first shown and later missed.', 'Верхня панель: рівень небезпеки 0–4 (суцільна: цей прогін; пунктир: порівняльний). Нижня: люди в зоні (синій), невраховані (помаранчевий), постраждалі без допомоги (червоний), під опікою (зелений). Трикутники — кроки з рішеннями. Кільця — кроки, де вперше з’явився пропущений сигнал.', 'Oben: Gefahrenstufe 0–4 (durchgezogen: dieser Durchlauf; gestrichelt: Vergleich). Unten: Personen im Gefahrenbereich (blau), nicht erfasst (orange), Verletzte ohne Versorgung (rot), in Versorgung (grün). Dreiecke: Schritte mit Entscheidungen. Ringe: Schritte, in denen ein später verpasster Hinweis erschien.', 'Boven: gevaarniveau 0–4 (doorgetrokken: deze run; gestreept: vergelijking). Onder: mensen in de gevarenzone (blauw), ongeteld (oranje), slachtoffers zonder zorg (rood), in zorg (groen). Driehoeken: stappen met beslissingen. Ringen: stappen waarin een later gemist signaal verscheen.', 'En haut : niveau de danger 0–4 (plein : cette partie ; tirets : comparaison). En bas : personnes en zone (bleu), non recensées (orange), victimes sans soins (rouge), prises en charge (vert). Triangles : pas avec décisions. Anneaux : pas où un signal ensuite manqué est apparu.', 'Arriba: nivel de peligro 0–4 (continua: esta partida; discontinua: comparación). Abajo: personas en zona (azul), sin localizar (naranja), heridos sin atención (rojo), atendidos (verde). Triángulos: pasos con decisiones. Anillos: pasos donde apareció una señal luego omitida.', 'U góry: poziom zagrożenia 0–4 (ciągła: ten przebieg; przerywana: porównanie). Na dole: osoby w strefie (niebieski), niepoliczeni (pomarańczowy), poszkodowani bez pomocy (czerwony), pod opieką (zielony). Trójkąty: kroki z decyzjami. Pierścienie: kroki, w których pojawił się później pominięty sygnał.'),
    methodRange: T('Seven state variables with fixed ranges: hazard level 0–4, communications 0–2, emergency services 0–2 and four people counts.', 'Сім змінних стану з фіксованими межами: рівень небезпеки 0–4, зв’язок 0–2, екстрені служби 0–2 і чотири лічильники людей.', 'Sieben Zustandsgrößen mit festen Bereichen: Gefahrenstufe 0–4, Kommunikation 0–2, Rettungskräfte 0–2 und vier Personenzahlen.', 'Zeven toestandsvariabelen met vaste bereiken: gevaarniveau 0–4, communicatie 0–2, hulpdiensten 0–2 en vier aantallen mensen.', 'Sept variables d’état à plages fixes : niveau de danger 0–4, communications 0–2, secours 0–2 et quatre effectifs.', 'Siete variables de estado con rangos fijos: nivel de peligro 0–4, comunicaciones 0–2, servicios de emergencia 0–2 y cuatro recuentos de personas.', 'Siedem zmiennych stanu o stałych zakresach: poziom zagrożenia 0–4, łączność 0–2, służby 0–2 i cztery liczby osób.'),
    methodNote1: T('Scenario content is illustrative teaching material; an organisation adapting it replaces it with its own emergency arrangements and has it reviewed by a competent person.', 'Зміст сценаріїв — ілюстративний навчальний матеріал; організація, що його адаптує, замінює його власними аварійними процедурами і дає на перевірку компетентній особі.', 'Die Szenarioinhalte sind beispielhaftes Lehrmaterial; eine Organisation ersetzt sie durch ihre eigenen Notfallregelungen und lässt sie von einer fachkundigen Person prüfen.', 'De scenario-inhoud is illustratief lesmateriaal; een organisatie vervangt die door haar eigen noodregelingen en laat ze door een deskundige beoordelen.', 'Le contenu des scénarios est un support pédagogique illustratif ; une organisation qui l’adapte le remplace par ses propres dispositions d’urgence et le fait relire par une personne compétente.', 'El contenido de los escenarios es material didáctico ilustrativo; una organización que lo adapte lo sustituye por sus propias disposiciones y lo hace revisar por una persona competente.', 'Treść scenariuszy to poglądowy materiał szkoleniowy; organizacja, która go dostosowuje, zastępuje go własnymi ustaleniami awaryjnymi i poddaje przeglądowi kompetentnej osoby.'),
    methodNote2: T('No score is computed and speed is not rewarded; the debrief lists findings only.', 'Бали не обчислюються і швидкість не винагороджується; розбір лише перелічує висновки.', 'Es wird keine Punktzahl berechnet und Tempo nicht belohnt; die Nachbesprechung listet nur Befunde.', 'Er wordt geen score berekend en snelheid wordt niet beloond; de nabespreking noemt alleen bevindingen.', 'Aucun score n’est calculé et la rapidité n’est pas récompensée ; le débriefing ne liste que des constats.', 'No se calcula puntuación ni se premia la rapidez; el análisis solo enumera hallazgos.', 'Nie jest liczona punktacja i szybkość nie jest nagradzana; omówienie wymienia tylko ustalenia.'),

  var RULES = [
    { id: 'DRILL-M-001', text: T('Replaying the same scenario revision with the same seed and decisions reproduces the same timeline.', 'Повтор тієї самої редакції сценарію з тим самим зерном і рішеннями відтворює ту саму хронологію.', 'Dieselbe Szenariorevision mit gleichem Startwert und gleichen Entscheidungen ergibt dieselbe Zeitleiste.', 'Dezelfde scenariorevisie met dezelfde seed en beslissingen geeft dezelfde tijdlijn.', 'Rejouer la même révision avec la même graine et les mêmes décisions reproduit la même chronologie.', 'Repetir la misma revisión con la misma semilla y decisiones reproduce la misma cronología.', 'Ta sama wersja scenariusza z tym samym ziarnem i decyzjami daje tę samą oś czasu.') },
    { id: 'DRILL-M-002', text: T('A scenario file is checked against the scenario schema before loading; a file with errors is refused.', 'Файл сценарію перевіряється за схемою перед завантаженням; файл з помилками відхиляється.', 'Eine Szenariodatei wird vor dem Laden gegen das Schema geprüft; eine fehlerhafte Datei wird abgelehnt.', 'Een scenariobestand wordt vóór het laden aan het schema getoetst; een bestand met fouten wordt geweigerd.', 'Un fichier de scénario est vérifié par rapport au schéma avant chargement ; un fichier erroné est refusé.', 'Un archivo de escenario se comprueba contra el esquema antes de cargarlo; uno con errores se rechaza.', 'Plik scenariusza jest sprawdzany względem schematu przed wczytaniem; plik z błędami jest odrzucany.') },
    { id: 'DRILL-M-003', text: T('An exhaustive search confirms that every decision, cue, event and outcome is reachable and that no live state stalls.', 'Повний перебір підтверджує досяжність кожного рішення, сигналу, події й результату та відсутність глухих станів.', 'Eine vollständige Suche bestätigt, dass jede Entscheidung, jeder Hinweis, jedes Ereignis und Ergebnis erreichbar ist und kein offener Zustand stecken bleibt.', 'Een volledige doorzoeking bevestigt dat elke beslissing, elk signaal, elke gebeurtenis en uitkomst bereikbaar is en geen open toestand vastloopt.', 'Une exploration exhaustive confirme que chaque décision, signal, événement et issue est atteignable et qu’aucun état ouvert ne se bloque.', 'Una búsqueda exhaustiva confirma que toda decisión, señal, suceso y desenlace es alcanzable y que ningún estado abierto se bloquea.', 'Pełne przeszukanie potwierdza osiągalność każdej decyzji, sygnału, zdarzenia i wyniku oraz brak zablokowanych stanów.') },
    { id: 'DRILL-M-004', text: T('A step accepts at most the scenario’s decision budget; confirming with no decision holds and observes.', 'Крок приймає не більше рішень, ніж дозволяє сценарій; підтвердження без рішень означає очікування.', 'Ein Schritt nimmt höchstens das Entscheidungsbudget des Szenarios an; ohne Entscheidung wird abgewartet.', 'Een stap aanvaardt hoogstens het beslissingsbudget van het scenario; zonder beslissing wordt afgewacht.', 'Un pas accepte au plus le nombre de décisions du scénario ; valider sans décision revient à attendre.', 'Un paso admite como máximo el cupo de decisiones del escenario; confirmar sin decisión es esperar.', 'Krok przyjmuje najwyżej limit decyzji scenariusza; zatwierdzenie bez decyzji oznacza czekanie.') },
    { id: 'DRILL-M-005', text: T('Decisions apply first; events are then checked once each in declared order, with chance draws from the seeded generator.', 'Спершу діють рішення; потім події перевіряються по одному разу в оголошеному порядку з розіграшами від генератора із зерном.', 'Zuerst wirken Entscheidungen; dann wird jedes Ereignis einmal in deklarierter Reihenfolge geprüft, Zufall aus dem Generator mit Startwert.', 'Eerst gelden beslissingen; daarna wordt elke gebeurtenis eenmaal in gedeclareerde volgorde getoetst, met kans uit de generator met seed.', 'Les décisions s’appliquent d’abord ; chaque événement est ensuite vérifié une fois dans l’ordre déclaré, les tirages venant du générateur initialisé.', 'Primero actúan las decisiones; después cada suceso se comprueba una vez en orden declarado, con sorteos del generador con semilla.', 'Najpierw działają decyzje; potem każde zdarzenie jest sprawdzane raz w zadeklarowanej kolejności, z losowaniem z generatora z ziarnem.') },
    { id: 'DRILL-M-006', text: T('A run that reaches the step limit without an outcome is reported as unresolved and needs review.', 'Прогін, що досяг ліміту кроків без результату, вважається невирішеним і потребує розгляду.', 'Ein Durchlauf, der die Schrittgrenze ohne Ergebnis erreicht, gilt als ungelöst und muss geprüft werden.', 'Een run die de stappenlimiet zonder uitkomst bereikt, geldt als onopgelost en moet worden beoordeeld.', 'Une partie qui atteint la limite de pas sans issue est déclarée non résolue et doit être examinée.', 'Una partida que llega al límite de pasos sin desenlace se declara sin resolver y debe revisarse.', 'Przebieg, który osiąga limit kroków bez wyniku, jest nierozstrzygnięty i wymaga przeglądu.') },
    { id: 'DRILL-M-007', text: T('A stored decision that is unavailable on replay stops the run at that step and later steps are dropped.', 'Збережене рішення, недоступне при повторі, зупиняє прогін на цьому кроці, подальші кроки відкидаються.', 'Eine gespeicherte Entscheidung, die bei der Wiederholung nicht verfügbar ist, stoppt den Durchlauf; spätere Schritte entfallen.', 'Een opgeslagen beslissing die bij herhaling niet beschikbaar is, stopt de run; latere stappen vervallen.', 'Une décision enregistrée indisponible à la rejouée arrête la partie à ce pas ; les pas suivants sont retirés.', 'Una decisión guardada que no está disponible al repetir detiene la partida; se descartan los pasos siguientes.', 'Zapisana decyzja niedostępna w powtórce zatrzymuje przebieg; dalsze kroki są odrzucane.') },
    { id: 'DRILL-M-008', text: T('A decision marked unsafe cannot improve a state variable or bring a barrier into use.', 'Рішення з позначкою «небезпечне» не може покращити змінну стану чи задіяти бар’єр.', 'Eine als unsicher markierte Entscheidung kann keine Zustandsgröße verbessern und keine Barriere aktivieren.', 'Een als onveilig gemarkeerde beslissing kan geen toestandsvariabele verbeteren of een barrière inzetten.', 'Une décision marquée dangereuse ne peut ni améliorer une variable d’état ni mettre une barrière en service.', 'Una decisión marcada como insegura no puede mejorar una variable de estado ni activar una barrera.', 'Decyzja oznaczona jako niebezpieczna nie może poprawić zmiennej stanu ani uruchomić bariery.') },
    { id: 'DRILL-D-001', text: T('A cue is missed when none of its expected decisions is taken by the end of its window.', 'Сигнал пропущено, якщо жодне очікуване рішення не ухвалено до кінця його вікна.', 'Ein Hinweis ist verpasst, wenn bis zum Ende seines Fensters keine erwartete Entscheidung fällt.', 'Een signaal is gemist als tot het einde van zijn venster geen verwachte beslissing is genomen.', 'Un signal est manqué si aucune décision attendue n’est prise avant la fin de sa fenêtre.', 'Una señal se omite si ninguna decisión esperada se toma antes del fin de su ventana.', 'Sygnał jest pominięty, jeśli do końca okna nie podjęto żadnej oczekiwanej decyzji.') },
    { id: 'DRILL-D-002', text: T('Each unsafe decision is listed with the declared safer alternatives open at that step.', 'Кожне небезпечне рішення наводиться з оголошеними безпечнішими альтернативами, доступними на тому кроці.', 'Jede unsichere Entscheidung wird mit den deklarierten sichereren Alternativen dieses Schritts aufgeführt.', 'Elke onveilige beslissing wordt vermeld met de gedeclareerde veiligere alternatieven van die stap.', 'Chaque décision dangereuse est listée avec les alternatives plus sûres déclarées ouvertes à ce pas.', 'Cada decisión insegura se lista con las alternativas más seguras declaradas abiertas en ese paso.', 'Każda niebezpieczna decyzja jest podana z zadeklarowanymi bezpieczniejszymi alternatywami z tego kroku.') },
    { id: 'DRILL-D-003', text: T('Barrier status at the end of the run is traced to the decisions and events that set it.', 'Стан бар’єрів наприкінці прогону простежується до рішень і подій, що його встановили.', 'Der Barrierenstatus am Ende wird auf die Entscheidungen und Ereignisse zurückgeführt, die ihn setzten.', 'De barrièrestatus aan het eind wordt herleid tot de beslissingen en gebeurtenissen die hem zetten.', 'L’état final des barrières est relié aux décisions et événements qui l’ont fixé.', 'El estado final de las barreras se remonta a las decisiones y sucesos que lo fijaron.', 'Stan barier na końcu jest powiązany z decyzjami i zdarzeniami, które go ustawiły.') },
    { id: 'DRILL-D-004', text: T('Each debrief statement carries the ID of the rule, cue, decision or event it comes from.', 'Кожне твердження розбору має ідентифікатор правила, сигналу, рішення чи події-джерела.', 'Jede Aussage der Nachbesprechung trägt die Kennung ihrer Regel, ihres Hinweises, ihrer Entscheidung oder ihres Ereignisses.', 'Elke uitspraak in de nabespreking draagt de id van haar regel, signaal, beslissing of gebeurtenis.', 'Chaque énoncé du débriefing porte l’identifiant de sa règle, de son signal, de sa décision ou de son événement.', 'Cada afirmación del análisis lleva el identificador de su regla, señal, decisión o suceso.', 'Każde stwierdzenie omówienia ma identyfikator swojej reguły, sygnału, decyzji lub zdarzenia.') },
    { id: 'DRILL-D-005', text: T('The outcome is the first declared outcome rule whose condition holds after a step.', 'Результат — перше оголошене правило результату, умова якого виконана після кроку.', 'Das Ergebnis ist die erste deklarierte Ergebnisregel, deren Bedingung nach einem Schritt erfüllt ist.', 'De uitkomst is de eerste gedeclareerde uitkomstregel waarvan de voorwaarde na een stap geldt.', 'L’issue est la première règle d’issue déclarée dont la condition est remplie après un pas.', 'El desenlace es la primera regla de desenlace declarada cuya condición se cumple tras un paso.', 'Wynik to pierwsza zadeklarowana reguła wyniku, której warunek jest spełniony po kroku.') }

  /* ============================================================== 9. chart */
  var SERIES_COLORS = { light: ['#2a78d6', '#eb6834', '#a5261f', '#1f6f34'], dark: ['#5b8cff', '#d95926', '#e08a83', '#5fb87a'] };
  function drawChart(ctx, w, h, opts) {
    var c = cur;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = opts.bg; ctx.fillRect(0, 0, w, h);
    if (!c || c.missing) return;
    var sc = c.sc, run = c.run, states = run.states;
    var pad = opts.coarse ? 30 : 40, padR = 12, padT = 12, padB = 24, gap = 18;
    var hTop = Math.round((h - padT - padB - gap) * 0.38), hBot = h - padT - padB - gap - hTop;
    var x0 = pad, x1 = w - padR;
    var X = function (i) { return x0 + (x1 - x0) * i / sc.max_steps; };
    ctx.font = '400 ' + (opts.fs || 11) + 'px ' + opts.font;
    ctx.lineWidth = 1;
    /* panel frames and x ticks */
    var yTop0 = padT, yTop1 = padT + hTop, yBot0 = yTop1 + gap, yBot1 = yBot0 + hBot;
    ctx.strokeStyle = opts.line;
    [[yTop0, yTop1], [yBot0, yBot1]].forEach(function (p) {
      ctx.beginPath(); ctx.moveTo(x0, p[0]); ctx.lineTo(x0, p[1]); ctx.lineTo(x1, p[1]); ctx.stroke();
    });
    ctx.fillStyle = opts.muted; ctx.textAlign = 'center';
    for (var i = 0; i <= sc.max_steps; i++) {
      ctx.beginPath(); ctx.moveTo(X(i), yBot1); ctx.lineTo(X(i), yBot1 + 3); ctx.stroke();
      if (!opts.coarse || i % 2 === 0) ctx.fillText(String(i), X(i), yBot1 + 14);
    }
    /* top: hazard 0..4 */
    var YH = function (v) { return yTop1 - (yTop1 - yTop0 - 4) * v / 4; };
    ctx.textAlign = 'right';
    for (var v = 0; v <= 4; v += 2) {
      ctx.fillText(String(v), x0 - 6, YH(v) + 4);
      ctx.strokeStyle = opts.grid; ctx.beginPath(); ctx.moveTo(x0, YH(v)); ctx.lineTo(x1, YH(v)); ctx.stroke();
    }
    var stepLine = function (list, key, Y, color, dash, width) {
      if (!list.length) return;
      ctx.strokeStyle = color; ctx.lineWidth = width || 2; ctx.setLineDash(dash || []);
      ctx.beginPath();
      list.forEach(function (s, i) {
        var y = Y(s.vars[key]);
        if (i === 0) ctx.moveTo(X(i), y); else { ctx.lineTo(X(i), Y(list[i - 1].vars[key])); ctx.lineTo(X(i), y); }
      });
      ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
    };
    if (c.cmpRun) stepLine(c.cmpRun.states, 'hazard', YH, opts.muted, [5, 4], 1.5);
    stepLine(states, 'hazard', YH, opts.hazard, null, 2.5);
    /* bottom: people counts, one shared axis (all are head counts) */
    var maxN = 1;
    states.forEach(function (s) { ['exposed', 'unaccounted', 'casualty', 'in_care'].forEach(function (k) { maxN = Math.max(maxN, s.vars[k]); }); });
    var niceMax = maxN <= 4 ? 4 : (maxN <= 10 ? 10 : Math.ceil(maxN / 5) * 5);
    var YB = function (n) { return yBot1 - (yBot1 - yBot0 - 4) * n / niceMax; };
    ctx.fillStyle = opts.muted;
    [0, niceMax / 2, niceMax].forEach(function (n) {
      ctx.fillText(String(n), x0 - 6, YB(n) + 4);
      ctx.strokeStyle = opts.grid; ctx.beginPath(); ctx.moveTo(x0, YB(n)); ctx.lineTo(x1, YB(n)); ctx.stroke();
    });
    ['exposed', 'unaccounted', 'casualty', 'in_care'].forEach(function (k, j) {
      stepLine(states, k, function (n) { return YB(n) + (j - 1.5) * 1.5; }, opts.series[j], j === 1 ? [6, 3] : null, 2);
    });
    /* markers: decisions (filled triangles) and first sight of later-missed cues (rings) */
    ctx.fillStyle = opts.ink;
    run.logs.forEach(function (lg) {
      if (!lg.decisions.length) return;
      var x = (X(lg.step - 1) + X(lg.step)) / 2;
      ctx.beginPath(); ctx.moveTo(x, yTop0 + 1); ctx.lineTo(x - 4, yTop0 + 8); ctx.lineTo(x + 4, yTop0 + 8); ctx.closePath(); ctx.fill();
    });
    ctx.strokeStyle = opts.warn; ctx.lineWidth = 2;
    var seenStep = {};
    c.deb.missed.forEach(function (m) {
      if (seenStep[m.step]) return; seenStep[m.step] = 1;
      var x = (X(m.step - 1) + X(m.step)) / 2;
      ctx.beginPath(); ctx.arc(x, yTop0 + 16, 4.5, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.lineWidth = 1;

      ctx.fillStyle = { controlled: opts.ok, controlled_loss: opts.warn, escalated: opts.bad, unresolved: opts.warn }[run.state.terminal.cls] || opts.ink;
      ctx.beginPath();
      if (run.state.terminal.cls === 'controlled') ctx.arc(xe, ye, 5, 0, Math.PI * 2);
      else { ctx.moveTo(xe, ye - 6); ctx.lineTo(xe + 6, ye); ctx.lineTo(xe, ye + 6); ctx.lineTo(xe - 6, ye); ctx.closePath(); }
      ctx.fill();
    }
  }
  function themeColors(dark) {
