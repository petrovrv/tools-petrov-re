 "description": {
  "en": "A turn-based simulator for talking through emergency response. Five built-in scenarios start from a described situation; at each nominal step the user reads the observations, chooses up to two decisions and sees people, communications, emergency services and barriers change under declared rules. Hidden conditions and chance events come from a seeded generator, so the same seed and decisions replay identically, runs can be rewound, and a run can be compared with a saved branch or a reference playthrough. The debrief lists key decisions, cues missed within their response window, decisions marked unsafe with their safer alternatives, and barrier status, each with the ID of the cue, decision, event or rule behind it. Scenario files can be exported and imported; an import is checked against the scenario schema and searched exhaustively for unreachable content and dead ends before it loads.",
  "uk": "Покроковий симулятор для обговорення дій в аварійній ситуації. П’ять вбудованих сценаріїв починаються з описаної обстановки; на кожному номінальному кроці користувач читає спостереження, обирає до двох рішень і бачить, як за оголошеними правилами змінюються люди, зв’язок, екстрені служби та бар’єри. Приховані умови й випадкові події беруться з генератора із зерном, тож те саме зерно й рішення відтворюються однаково, прогін можна відмотати й порівняти зі збереженою гілкою чи еталонним проходженням. Розбір перелічує ключові рішення, сигнали, пропущені у вікні реагування, рішення з позначкою «небезпечне» з безпечнішими альтернативами та стан бар’єрів — кожне з ідентифікатором джерела. Файли сценаріїв можна експортувати та імпортувати; імпорт перевіряється за схемою і повним перебором на недосяжний зміст і глухі кути.",
  "de": "Ein rundenbasierter Simulator, um Notfallmaßnahmen durchzusprechen. Fünf eingebaute Szenarien beginnen mit einer beschriebenen Lage; in jedem nominalen Schritt liest man die Beobachtungen, wählt bis zu zwei Entscheidungen und sieht, wie sich Personen, Kommunikation, Rettungskräfte und Barrieren nach deklarierten Regeln ändern. Verdeckte Bedingungen und Zufallsereignisse stammen aus einem Generator mit Startwert; gleiche Eingaben ergeben dieselbe Wiederholung, Durchläufe lassen sich zurückspulen und mit einem gespeicherten Zweig oder einem Referenzdurchlauf vergleichen. Die Nachbesprechung nennt wichtige Entscheidungen, im Reaktionsfenster verpasste Hinweise, als unsicher markierte Entscheidungen mit sichereren Alternativen und den Barrierenstatus, jeweils mit der Kennung der Quelle. Szenariodateien lassen sich exportieren und importieren; ein Import wird gegen das Schema geprüft und vollständig auf unerreichbare Inhalte und Sackgassen durchsucht.",
  "nl": "Een beurtelingse simulator om noodrespons door te spreken. Vijf ingebouwde scenario’s beginnen met een beschreven situatie; bij elke nominale stap leest de gebruiker de waarnemingen, kiest tot twee beslissingen en ziet mensen, communicatie, hulpdiensten en barrières volgens gedeclareerde regels veranderen. Verborgen omstandigheden en kansgebeurtenissen komen uit een generator met seed, zodat dezelfde invoer identiek herhaalt, runs terug te spoelen zijn en te vergelijken met een bewaarde vertakking of referentiedoorloop. De nabespreking noemt belangrijke beslissingen, signalen die binnen hun venster zijn gemist, als onveilig gemarkeerde beslissingen met veiligere alternatieven en de barrièrestatus, elk met de id van de bron. Scenariobestanden zijn te exporteren en importeren; een import wordt aan het schema getoetst en volledig doorzocht op onbereikbare inhoud en doodlopende toestanden.",
  "fr": "Un simulateur au tour par tour pour discuter d’une réponse d’urgence. Cinq scénarios intégrés partent d’une situation décrite ; à chaque pas nominal, l’utilisateur lit les observations, choisit jusqu’à deux décisions et voit personnes, communications, secours et barrières évoluer selon des règles déclarées. Conditions cachées et événements aléatoires proviennent d’un générateur initialisé par une graine : mêmes entrées, même rejouée ; une partie peut être rembobinée et comparée à une branche gardée ou à une partie de référence. Le débriefing liste décisions clés, signaux manqués dans leur fenêtre, décisions marquées dangereuses avec leurs alternatives plus sûres et état des barrières, chacun avec l’identifiant de sa source. Les fichiers de scénario s’exportent et s’importent ; un import est vérifié par rapport au schéma et exploré exhaustivement à la recherche de contenu inaccessible et d’impasses.",
  "es": "Un simulador por turnos para comentar la respuesta a una emergencia. Cinco escenarios incorporados parten de una situación descrita; en cada paso nominal el usuario lee las observaciones, elige hasta dos decisiones y ve cómo cambian personas, comunicaciones, servicios de emergencia y barreras según reglas declaradas. Las condiciones ocultas y los sucesos aleatorios salen de un generador con semilla: las mismas entradas se repiten igual, la partida puede retrocederse y compararse con una rama guardada o una partida de referencia. El análisis enumera decisiones clave, señales omitidas en su ventana, decisiones marcadas como inseguras con alternativas más seguras y el estado de las barreras, cada una con el identificador de su origen. Los archivos de escenario se pueden exportar e importar; una importación se comprueba contra el esquema y se explora por completo en busca de contenido inalcanzable y callejones sin salida.",

  "nl": "Op regels gebaseerd trainingsmodel. De vijf scenario’s zijn illustratieve inhoud, geschreven voor deze tool en niet beoordeeld door een deskundige in noodhulp. Het voorspelt geen verloop van brand, gas, letsel of slachtoffers, legt geen tijdsdruk op en vervangt geen praktijkoefeningen of noodplan van een locatie. Een uitkomst beschrijft alleen de modeltoestand; beheerst zegt niets over het slagen van een echte inzet. Eén gebruiker; geen teammodus en geen scenario-editor. Geïmporteerde bestanden worden gecontroleerd op schema, bereikbaarheid en doodlopende toestanden, niet op de kwaliteit van de inhoud.",
  "fr": "Modèle d’entraînement à base de règles. Les cinq scénarios sont un contenu illustratif rédigé pour cet outil et non relu par un professionnel des secours. Il ne prédit ni la dynamique d’un feu, d’un gaz, de blessures ou de victimes, n’impose aucune pression temporelle et ne remplace ni les exercices pratiques ni le plan d’urgence d’un site. Une issue décrit seulement l’état du modèle ; « maîtrisé » ne dit rien de la réussite d’une intervention réelle. Un seul utilisateur ; pas de mode équipe ni d’éditeur de scénarios. Les fichiers importés sont vérifiés pour le schéma, l’accessibilité et les impasses, pas pour la qualité du contenu.",
  "es": "Modelo de formación basado en reglas. Los cinco escenarios son contenido ilustrativo escrito para esta herramienta y no revisado por un profesional de emergencias. No predice la dinámica de un incendio, gas, lesiones o víctimas, no impone presión de tiempo real y no sustituye los simulacros prácticos ni el plan de emergencia de un centro. Un desenlace describe solo el estado del modelo; «controlado» no dice nada sobre el éxito de una respuesta real. Un solo usuario; sin modo de equipo ni editor de escenarios. Los archivos importados se comprueban en esquema, alcanzabilidad y callejones sin salida, no en la calidad del contenido.",
  "pl": "Model szkoleniowy oparty na regułach. Pięć scenariuszy to poglądowe treści napisane dla tego narzędzia i niesprawdzone przez specjalistę ratownictwa. Nie przewiduje dynamiki pożaru, gazu, urazów ani poszkodowanych, nie wywiera presji czasu i nie zastępuje ćwiczeń praktycznych ani planu awaryjnego zakładu. Wynik opisuje tylko stan modelu; „opanowane” nic nie mówi o powodzeniu rzeczywistych działań. Jeden użytkownik; brak trybu zespołowego i edytora scenariuszy. Importowane pliki są sprawdzane pod kątem schematu, osiągalności i ślepych zaułków, nie jakości treści."

.ed-decisions{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:var(--sp-2);margin:var(--sp-2) 0}
.ed-dec{display:flex;gap:var(--sp-2);align-items:flex-start;width:100%;background:var(--panel-2)}
.ed-dec.on{border-color:var(--accent);background:var(--weak);box-shadow:inset 0 0 0 1px var(--accent)}
.ed-tick{font-size:18px;line-height:1.1;flex:0 0 auto}
.ed-dec-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ed-dec-l{overflow-wrap:anywhere}
.ed-dec-t .ed-id{align-self:flex-start}
.ed-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:var(--sp-2)}
.ed-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--sp-2);background:var(--panel-2);min-width:0}
.ed-card-l{font:500 var(--fs-micro)/1.3 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);overflow-wrap:anywhere}
.ed-card-v{font:650 var(--fs-body)/1.3 var(--font);overflow-wrap:anywhere}
.ed-delta{display:inline-block;margin-left:6px;font:500 var(--fs-micro)/1 var(--font);color:var(--muted)}
.ed-barriers{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:var(--fs-small)}
.ed-barriers li{display:flex;gap:var(--sp-2);align-items:flex-start;line-height:1.4}
.ed-bicon{flex:0 0 1.4em;text-align:center;font-weight:700}
.ed-barriers li.bs-used .ed-bicon{color:var(--ok)}
.ed-barriers li.bs-failed .ed-bicon{color:var(--bad)}
.ed-barriers li.bs-available .ed-bicon{color:var(--muted)}
.ed-timeline{margin:0;padding-left:1.2em;display:grid;gap:var(--sp-2);font-size:var(--fs-small)}
.ed-tl-h{font-weight:650}
.ed-tl-e{color:var(--muted)}
.ed-tl-o{font-weight:650}
.ed-tl-o.ok{color:var(--ok)}.ed-tl-o.warn{color:var(--warn)}.ed-tl-o.bad{color:var(--bad)}
.ed-flabel{display:block;font:500 var(--fs-label)/1.3 var(--font);margin:var(--sp-2) 0 4px}
.ed-select{width:100%;max-width:100%;min-height:var(--ctl-h);font:inherit;font-size:var(--fs-label);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);padding:4px var(--sp-2)}
.ed-cmp{font-size:var(--fs-small);margin:var(--sp-2) 0}
.ed-deb{margin-top:var(--sp-3)}
.ed-tablewrap{overflow-x:auto;max-width:100%}
.ed-table{border-collapse:collapse;width:100%;font-size:var(--fs-small)}
.ed-table th,.ed-table td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
.ed-table th{font:650 var(--fs-micro)/1.3 var(--font);text-transform:uppercase;color:var(--muted)}
.ed-table tr.diverge td{background:var(--warn-bg)}
.ed-table tr.foot td{font-weight:650}
.ed-cue{list-style:none;margin:0 0 var(--sp-2) -1.1em}
.ed-cue.is-new{display:block}
.ed-cue:not(.is-new){display:flex;gap:var(--sp-2);align-items:flex-start}
.ed-imgwrap{display:block}
.ed-imgwrap img{display:block;max-width:100%;height:auto}
.ed-scene img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel-2)}
.ed-scene{margin-bottom:6px}
.ed-scene.small{flex:0 0 96px;margin:0}
.ed-scene.small img{width:96px}
.ed-cue-t{min-width:0;line-height:1.45}
.ed-sign{display:inline-block;vertical-align:middle;margin-left:6px}
.ed-sign img{width:26px;height:26px}
.ed-dec .ed-sign{margin-left:auto;flex:0 0 auto}
.ed-dec .ed-sign img{width:30px;height:30px}
.ed-imgwrap.failed{border:1px dashed var(--line);border-radius:var(--radius-sm);padding:var(--sp-2);font-size:var(--fs-small);color:var(--muted)}
.ed-sign.failed{display:none}
@media(max-width:480px){.ed-scene.small{flex-basis:72px}.ed-scene.small img{width:72px}}
</style>
</head>

<script type="application/json" id="drill-packs">{"schema":"tools.petrov.re/emergency-drill-scenario-pack/v1","packs":[{"schema":"tools.petrov.re/emergency-drill-scenario/v1","id":"fire-workshop","revision":"1","title":{"en":"Fire in a workshop store room","uk":"Пожежа в складському приміщенні майстерні","de":"Brand im Lagerraum einer Werkstatt","nl":"Brand in de opslagruimte van een werkplaats","fr":"Incendie dans le magasin d’un atelier","es":"Incendio en el almacén de un taller","pl":"Pożar w magazynku warsztatu"},"brief":{"en":"A maintenance workshop, one floor, six people at work. A small storage room holds cardboard, oil and spare parts. You are the senior person present.","uk":"Ремонтна майстерня, один поверх, працюють шестеро. У невеликому складі — картон, олива і запчастини. Ви — старший на місці.","de":"Eine Instandhaltungswerkstatt, ein Geschoss, sechs Personen bei der Arbeit. Ein kleiner Lagerraum enthält Karton, Öl und Ersatzteile. Sie sind die ranghöchste anwesende Person.","nl":"Een onderhoudswerkplaats, één verdieping, zes mensen aan het werk. Een kleine opslagruimte bevat karton, olie en reserveonderdelen. U bent de hoogste in rang ter plaatse.","fr":"Un atelier de maintenance de plain-pied, six personnes au travail. Un petit local contient du carton, de l’huile et des pièces. Vous êtes la personne la plus haut placée sur place.","es":"Un taller de mantenimiento de una planta con seis personas trabajando. Un pequeño almacén guarda cartón, aceite y repuestos. Usted es la persona de mayor rango presente.","pl":"Warsztat utrzymania ruchu, jedna kondygnacja, sześć osób w pracy. W małym magazynku są kartony, olej i części zamienne. Jesteś najstarszą rangą osobą na miejscu."},"basis":{"kind":"illustrative","source":"Scenario pack written for this tool; not taken from a site emergency plan; not reviewed by an emergency-response professional","jurisdiction":"none","version":"2026-09-15"},"context_refs":["ISO 45001:2018, 8.2 Emergency preparedness and response","Council Directive 89/654/EEC (workplace minimum requirements; emergency routes and exits)"],"step_minutes":2,"max_steps":8,"actions_per_step":2,"vars":{"hazard":1,"exposed":6,"unaccounted":6,"casualty":0,"in_care":0,"comms":2,"ext":0},"barriers":[{"id":"B-ALARM","label":{"en":"Fire alarm and manual call point","uk":"Пожежна сигналізація і ручний сповіщувач","de":"Brandmeldeanlage und Handmelder","nl":"Brandmeldinstallatie en handmelder","fr":"Alarme incendie et déclencheur manuel","es":"Alarma de incendio y pulsador manual","pl":"Alarm pożarowy i ręczny ostrzegacz"}},{"id":"B-FAFF","label":{"en":"Portable extinguisher (first-aid firefighting)","uk":"Переносний вогнегасник (первинне гасіння)","de":"Feuerlöscher (Entstehungsbrandbekämpfung)","nl":"Draagbaar blustoestel (beginnende brand)","fr":"Extincteur portatif (première intervention)","es":"Extintor portátil (primera intervención)","pl":"Gaśnica przenośna (gaszenie w zarodku)"}},{"id":"B-DOOR","label":{"en":"Store-room door as smoke and fire barrier","uk":"Двері складу як протидимна і протипожежна перешкода","de":"Lagerraumtür als Rauch- und Brandbarriere","nl":"Deur van de opslagruimte als rook- en brandscheiding","fr":"Porte du magasin comme barrière fumée et feu","es":"Puerta del almacén como barrera de humo y fuego","pl":"Drzwi magazynku jako bariera dymu i ognia"}},{"id":"B-ASSY","label":{"en":"Assembly point and roll-call","uk":"Місце збору і перекличка","de":"Sammelplatz und Anwesenheitskontrolle","nl":"Verzamelplaats en appèl","fr":"Point de rassemblement et appel","es":"Punto de reunión y recuento","pl":"Miejsce zbiórki i sprawdzenie obecności"}}],"setup":[{"id":"FIRE-S01","chance":0.5,"effects":[["flag","missing"]],"text":{"en":"A contractor in the far bay wears ear defenders and hears only the alarm sounders.","uk":"Підрядник у дальньому прольоті в навушниках і чує лише сирену сигналізації.","de":"Ein Fremdarbeiter in der hinteren Halle trägt Gehörschutz und hört nur die Alarmsirenen.","nl":"Een aannemer in de achterste hal draagt gehoorbescherming en hoort alleen de alarmsirenes.","fr":"Un sous-traitant dans la travée du fond porte un casque antibruit et n’entend que les sirènes.","es":"Un contratista en la nave del fondo lleva protectores auditivos y solo oye las sirenas.","pl":"Podwykonawca w dalszej hali nosi ochronniki słuchu i słyszy tylko syreny alarmowe."},"else_text":{"en":"Everyone in the workshop can hear a spoken warning.","uk":"Усі в майстерні чують усне попередження.","de":"Alle in der Werkstatt hören eine mündliche Warnung.","nl":"Iedereen in de werkplaats hoort een mondelinge waarschuwing.","fr":"Tout le monde dans l’atelier entend un avertissement oral.","es":"Todos en el taller oyen un aviso de viva voz.","pl":"Wszyscy w warsztacie słyszą ostrzeżenie głosowe."}}],"decisions":[{"id":"raise_alarm","code":"FIRE-D01","tag":"safe","barrier":"B-ALARM","effects":[],"label":{"en":"Operate the manual call point","uk":"Натиснути ручний пожежний сповіщувач","de":"Handmelder auslösen","nl":"Handmelder indrukken","fr":"Actionner le déclencheur manuel","es":"Accionar el pulsador manual","pl":"Użyć ręcznego ostrzegacza pożarowego"}},{"id":"call_fs","code":"FIRE-D02","tag":"safe","when":["v","ext","==",0],"effects":[["set","ext",1]],"label":{"en":"Call the fire service","uk":"Викликати пожежну службу","de":"Feuerwehr alarmieren","nl":"Brandweer bellen","fr":"Appeler les pompiers","es":"Llamar a los bomberos","pl":"Wezwać straż pożarną"}},{"id":"faff","code":"FIRE-D03","tag":"neutral","barrier":"B-FAFF","when":["v","hazard","<=",2],"effects":[],"label":{"en":"Tackle the fire with a portable extinguisher","uk":"Гасити вогнегасником","de":"Brand mit dem Feuerlöscher bekämpfen","nl":"Brand bestrijden met een blustoestel","fr":"Attaquer le feu à l’extincteur","es":"Atacar el fuego con un extintor","pl":"Gasić pożar gaśnicą"}},{"id":"close_door","code":"FIRE-D04","tag":"safe","barrier":"B-DOOR","effects":[],"label":{"en":"Close the store-room door","uk":"Зачинити двері складу","de":"Lagerraumtür schließen","nl":"Deur van de opslagruimte sluiten","fr":"Fermer la porte du magasin","es":"Cerrar la puerta del almacén","pl":"Zamknąć drzwi magazynku"}},{"id":"evacuate","code":"FIRE-D05","tag":"safe","effects":[],"label":{"en":"Order everyone out by the nearest exit","uk":"Наказати всім вийти найближчим виходом","de":"Alle über den nächsten Ausgang hinausschicken","nl":"Iedereen via de dichtstbijzijnde uitgang naar buiten sturen","fr":"Faire sortir tout le monde par l’issue la plus proche","es":"Ordenar la salida por la salida más cercana","pl":"Polecić wszystkim wyjść najbliższym wyjściem"}},{"id":"roll_call","code":"FIRE-D06","tag":"safe","barrier":"B-ASSY","when":{"any":[["f","raise_alarm"],["f","evacuate"]]},"effects":[],"label":{"en":"Take a roll-call at the assembly point","uk":"Провести перекличку на місці збору","de":"Anwesenheit am Sammelplatz prüfen","nl":"Appèl houden op de verzamelplaats","fr":"Faire l’appel au point de rassemblement","es":"Hacer recuento en el punto de reunión","pl":"Sprawdzić obecność na miejscu zbiórki"}},{"id":"reenter","code":"FIRE-D07","tag":"unsafe","when":{"all":[["f","rc_done"],["v","unaccounted",">",0]]},"effects":[["add","exposed",1]],"safer":["brief_fs","call_fs"],"why":{"en":"Searching a smoke-filled building without breathing apparatus adds a second person at risk; search is a fire-service task.","uk":"Пошук у задимленій будівлі без дихального апарата додає ще одну людину під загрозою; пошук — завдання пожежників.","de":"Die Suche in einem verrauchten Gebäude ohne Atemschutz bringt eine zweite Person in Gefahr; Suche ist Aufgabe der Feuerwehr.","nl":"Zoeken in een rokerig gebouw zonder ademlucht brengt een tweede persoon in gevaar; zoeken is een taak van de brandweer.","fr":"Chercher dans un bâtiment enfumé sans appareil respiratoire expose une deuxième personne ; la recherche revient aux pompiers.","es":"Buscar en un edificio lleno de humo sin equipo respiratorio pone en riesgo a otra persona; la búsqueda corresponde a los bomberos.","pl":"Przeszukiwanie zadymionego budynku bez aparatu oddechowego naraża kolejną osobę; to zadanie straży pożarnej."},"label":{"en":"Send a colleague back in to search","uk":"Відправити колегу всередину на пошуки","de":"Einen Kollegen zur Suche zurückschicken","nl":"Een collega terugsturen om te zoeken","fr":"Renvoyer un collègue à l’intérieur pour chercher","es":"Enviar a un compañero adentro a buscar","pl":"Wysłać współpracownika z powrotem na poszukiwania"}},{"id":"brief_fs","code":"FIRE-D08","tag":"safe","when":["v","ext","==",2],"effects":[],"label":{"en":"Brief the fire crew: fire location and missing people","uk":"Поінформувати пожежників: місце пожежі та зниклі люди","de":"Feuerwehr einweisen: Brandort und vermisste Personen","nl":"Brandweer inlichten: brandlocatie en vermiste personen","fr":"Informer les pompiers : lieu du feu et personnes manquantes","es":"Informar a los bomberos: lugar del fuego y personas desaparecidas","pl":"Przekazać strażakom: miejsce pożaru i osoby zaginione"}}],"events":[{"id":"FIRE-E01","when":{"all":[["f","faff"],["nf","faff_tried"],["v","hazard","==",1]]},"chance":0.6,"effects":[["set","hazard",0],["flag","out"],["mark","out"],["flag","faff_tried"]],"else":[["flag","faff_tried"],["barrier","B-FAFF","failed"]],"text":{"en":"The extinguisher knocks the fire down.","uk":"Вогнегасник збиває полум’я.","de":"Der Löscher schlägt den Brand nieder.","nl":"Het blustoestel slaat de brand neer.","fr":"L’extincteur abat le feu.","es":"El extintor sofoca el fuego.","pl":"Gaśnica przygasza ogień."},"else_text":{"en":"The extinguisher empties; the fire burns on.","uk":"Вогнегасник порожній; вогонь горить далі.","de":"Der Löscher ist leer; es brennt weiter.","nl":"Het blustoestel is leeg; de brand gaat door.","fr":"L’extincteur est vide ; le feu continue.","es":"El extintor se vacía; el fuego sigue.","pl":"Gaśnica pusta; ogień się pali."}},{"id":"FIRE-E02","when":{"all":[["f","faff"],["nf","faff_tried"],["v","hazard",">=",2]]},"effects":[["flag","faff_tried"],["barrier","B-FAFF","failed"]],"text":{"en":"The fire is too large for an extinguisher.","uk":"Пожежа завелика для вогнегасника.","de":"Der Brand ist zu groß für einen Löscher.","nl":"De brand is te groot voor een blustoestel.","fr":"Le feu est trop grand pour un extincteur.","es":"El fuego es demasiado grande para un extintor.","pl":"Pożar jest za duży na gaśnicę."}},{"id":"FIRE-E03","when":{"all":[["nf","out"],["nf","close_door"],["v","hazard",">=",1],["v","hazard","<=",3]]},"effects":[["add","hazard",1]],"text":{"en":"The fire grows.","uk":"Пожежа розростається.","de":"Der Brand wächst.","nl":"De brand groeit.","fr":"Le feu grandit.","es":"El fuego crece.","pl":"Pożar rośnie."}},{"id":"FIRE-E04","when":{"all":[["nf","out"],["f","close_door"],["v","hazard",">=",1],["v","hazard","<=",3]]},"chance":0.3,"effects":[["add","hazard",1]],"text":{"en":"The fire grows behind the closed door.","uk":"Пожежа росте за зачиненими дверима.","de":"Der Brand wächst hinter der Tür.","nl":"De brand groeit achter de deur.","fr":"Le feu grandit derrière la porte.","es":"El fuego crece tras la puerta.","pl":"Pożar rośnie za drzwiami."},"else_text":{"en":"The closed door holds the smoke back.","uk":"Зачинені двері стримують дим.","de":"Die Tür hält den Rauch zurück.","nl":"De deur houdt de rook tegen.","fr":"La porte retient la fumée.","es":"La puerta contiene el humo.","pl":"Drzwi zatrzymują dym."}},{"id":"FIRE-E05","when":{"all":[["f","out"],["v","ext","==",0],["since","out",">=",2]]},"chance":0.5,"effects":[["set","hazard",2],["unflag","out"]],"text":{"en":"Hidden embers re-ignite the shelving.","uk":"Приховані жарини знову підпалюють стелажі.","de":"Glutnester entzünden das Regal erneut.","nl":"Smeulende resten ontsteken het rek opnieuw.","fr":"Des braises cachées rallument les étagères.","es":"Brasas ocultas reavivan las estanterías.","pl":"Ukryty żar ponownie zapala regały."},"else_text":{"en":"Smoke still drifts from the shelving.","uk":"Зі стелажів досі йде дим.","de":"Aus dem Regal steigt noch Rauch.","nl":"Uit het rek komt nog rook.","fr":"De la fumée sort encore des étagères.","es":"Aún sale humo de las estanterías.","pl":"Z regałów wciąż wydobywa się dym."}},{"id":"FIRE-E06","when":{"all":[{"any":[["f","raise_alarm"],["f","evacuate"]]},["nf","evac_done"],{"any":[["f","raise_alarm"],["nf","missing"]]}]},"effects":[["set","exposed",0],["flag","evac_done"]],"text":{"en":"Everyone leaves the workshop.","uk":"Усі залишають майстерню.","de":"Alle verlassen die Werkstatt.","nl":"Iedereen verlaat de werkplaats.","fr":"Tout le monde quitte l’atelier.","es":"Todos salen del taller.","pl":"Wszyscy opuszczają warsztat."}},{"id":"FIRE-E07","when":{"all":[["f","evacuate"],["nf","raise_alarm"],["f","missing"],["nf","evac_done"]]},"effects":[["set","exposed",1],["flag","evac_done"]],"text":{"en":"People leave the workshop.","uk":"Люди виходять з майстерні.","de":"Personen verlassen die Werkstatt.","nl":"Mensen verlaten de werkplaats.","fr":"Des personnes quittent l’atelier.","es":"La gente sale del taller.","pl":"Ludzie wychodzą z warsztatu."}},{"id":"FIRE-E08","when":{"all":[["f","raise_alarm"],["f","evac_done"],["f","missing"],["nf","late_out"],["nf","reenter"],["v","exposed",">",0]]},"effects":[["add","exposed",-1],["flag","late_out"]],"text":{"en":"The sounders bring the contractor out.","uk":"Сирени виводять підрядника назовні.","de":"Die Sirenen holen den Fremdarbeiter heraus.","nl":"De sirenes brengen de aannemer naar buiten.","fr":"Les sirènes font sortir le sous-traitant.","es":"Las sirenas hacen salir al contratista.","pl":"Syreny wyprowadzają podwykonawcę."}},{"id":"FIRE-E09","when":{"all":[["f","roll_call"],["f","evac_done"]]},"silent":true,"effects":[["copy","exposed","unaccounted"],["flag","rc_done"]],"text":{"en":"Roll-call result updated.","uk":"Результат переклички оновлено.","de":"Ergebnis der Anwesenheitskontrolle aktualisiert.","nl":"Resultaat appèl bijgewerkt.","fr":"Résultat de l’appel mis à jour.","es":"Resultado del recuento actualizado.","pl":"Wynik sprawdzenia obecności zaktualizowany."}},{"id":"FIRE-E10","when":{"all":[["v","hazard",">=",3],["v","exposed",">",0],["nf","hurt"]]},"effects":[["add","casualty",1],["flag","hurt"]],"text":{"en":"A person inside is overcome by smoke.","uk":"Людина всередині отруїлася димом.","de":"Eine Person im Gebäude erleidet eine Rauchvergiftung.","nl":"Iemand binnen raakt bedwelmd door rook.","fr":"Une personne à l’intérieur est intoxiquée par la fumée.","es":"Una persona dentro sufre intoxicación por humo.","pl":"Osoba w środku podtruwa się dymem."}},{"id":"FIRE-E11","when":{"all":[["v","ext","==",1],["since","call_fs",">=",2]]},"effects":[["set","ext",2],["mark","arrived"]],"text":{"en":"The fire service arrives.","uk":"Прибуває пожежна служба.","de":"Die Feuerwehr trifft ein.","nl":"De brandweer komt aan.","fr":"Les pompiers arrivent.","es":"Llegan los bomberos.","pl":"Przyjeżdża straż pożarna."}},{"id":"FIRE-E12","when":{"all":[["v","ext","==",2],["v","exposed",">",0],{"any":[["f","brief_fs"],["since","arrived",">=",2]]}]},"effects":[["set","exposed",0],["flag","rescued"]],"text":{"en":"Fire crews bring the remaining people out.","uk":"Пожежники виводять решту людей.","de":"Die Feuerwehr holt die übrigen Personen heraus.","nl":"Brandweerlieden halen de overige mensen naar buiten.","fr":"Les pompiers font sortir les dernières personnes.","es":"Los bomberos sacan a las personas restantes.","pl":"Strażacy wyprowadzają pozostałe osoby."}},{"id":"FIRE-E13","when":{"all":[["v","ext","==",2],["since","arrived",">=",1],["v","hazard",">",0]]},"effects":[["set","hazard",0],["flag","out"]],"text":{"en":"Fire crews extinguish the fire.","uk":"Пожежники гасять пожежу.","de":"Die Feuerwehr löscht den Brand.","nl":"De brandweer blust de brand.","fr":"Les pompiers éteignent le feu.","es":"Los bomberos extinguen el fuego.","pl":"Strażacy gaszą pożar."}},{"id":"FIRE-E14","when":{"all":[["v","casualty",">",0] ,{"id":"FIRE-C04","when":{"all":[["b","B-FAFF","failed"],["nf","close_door"]]},"expects":["close_door","evacuate"],"window":1,"text":{"en":"The extinguisher did not stop the fire.","uk":"Вогнегасник не зупинив вогонь.","de":"Der Löscher hat den Brand nicht gestoppt.","nl":"Het blustoestel heeft de brand niet gestopt.","fr":"L’extincteur n’a pas arrêté le feu.","es":"El extintor no detuvo el fuego.","pl":"Gaśnica nie zatrzymała ognia."}},{"id":"FIRE-C05","when":{"all":[["f","evac_done"],["nf","roll_call"]]},"expects":["roll_call"],"window":2,"text":{"en":"People are gathering at the assembly point.","uk":"Люди збираються на місці збору.","de":"Personen sammeln sich am Sammelplatz.","nl":"Mensen verzamelen zich op de verzamelplaats.","fr":"Des personnes se regroupent au point de rassemblement.","es":"La gente se reúne en el punto de reunión.","pl":"Ludzie zbierają się na miejscu zbiórki."}},{"id":"FIRE-C06","when":{"all":[["f","rc_done"],["v","unaccounted",">",0]]},"expects":["call_fs","brief_fs"],"window":2,"text":{"en":"Roll-call: the contractor from the far bay is missing.","uk":"Перекличка: немає підрядника з дальнього прольоту.","de":"Anwesenheit: der Fremdarbeiter aus der hinteren Halle fehlt.","nl":"Appèl: de aannemer uit de achterste hal ontbreekt.","fr":"Appel : le sous-traitant de la travée du fond manque.","es":"Recuento: falta el contratista de la nave del fondo.","pl":"Obecność: brakuje podwykonawcy z dalszej hali."}},{"id":"FIRE-C07","when":{"all":[["v","ext","==",2],["nf","brief_fs"]]},"expects":["brief_fs"],"window":1,"text":{"en":"Fire crews arrive and ask who is in charge.","uk":"Пожежники прибули і питають, хто керує.","de":"Die Feuerwehr fragt, wer die Leitung hat.","nl":"De brandweer vraagt wie de leiding heeft.","fr":"Les pompiers demandent qui dirige.","es":"Los bomberos preguntan quién está al mando.","pl":"Strażacy pytają, kto kieruje."}},{"id":"FIRE-C08","when":{"all":[["f","out"],["v","ext","==",0]]},"expects":["call_fs"],"window":1,"text":{ n hurt by smoke","uk":"Пожежу погашено, одна людина постраждала від диму","de":"Brand gelöscht, eine Person durch Rauch verletzt","nl":"Brand geblust, één persoon gewond door rook","fr":"Feu éteint, une personne intoxiquée","es":"Fuego apagado, una persona afectada por el humo","pl":"Pożar zgaszony, jedna osoba poszkodowana od dymu"},"explain":{"en":"The situation ended under control, but a person was inside while the fire was at a serious level.","uk":"Ситуацію взято під контроль, але людина перебувала всередині за серйозного рівня пожежі.","de":"Die Lage endete kontrolliert, aber eine Person war bei ernster Brandstufe im Gebäude.","nl":"De situatie eindigde beheerst, maar er was iemand binnen toen de brand ernstig was.","fr":"La situation s’est terminée maîtrisée, mais une personne était à l’intérieur au niveau de feu sérieux.","es":"La situación terminó controlada, pero una persona estaba dentro con el fuego en nivel grave.","pl":"Sytuacja zakończyła się opanowaniem, ale osoba była w środku przy poważnym poziomie pożaru."}}],"reference_paths":[{"id":"FIRE-P1","seed":1,"expect":"FIRE-O3","label":{"en":"Alarm and call first, then door and roll-call","uk":"Спершу тривога і виклик, потім двері та перекличка","de":"Erst Alarm und Notruf, dann Tür und Anwesenheit","nl":"Eerst alarm en melding, dan deur en appèl","fr":"D’abord alarme et appel, puis porte et appel nominal","es":"Primero alarma y llamada, luego puerta y recuento","pl":"Najpierw alarm i wezwanie, potem drzwi i obecność"},"steps":[["raise_alarm","call_fs"],["close_door","roll_call"],[],["brief_fs"]]},{"id":"FIRE-P2","seed":1,"expect":"FIRE-O3","label":{"en":"Extinguisher attempt after raising the alarm","uk":"Спроба гасіння після оголошення тривоги","de":"Löschversuch nach Alarmauslösung","nl":"Bluspoging na het alarm","fr":"Tentative d’extinction après l’alarme","es":"Intento de extinción tras la alarma","pl":"Próba gaszenia po ogłoszeniu alarmu"},"steps":[["raise_alarm","faff"],["call_fs","close_door"],[" ."},"basis":{"kind":"illustrative","source":"Scenario pack written for this tool; not taken from a site emergency plan; not reviewed by an emergency-response professional","jurisdiction":"none","version":"2026-09-15"},"context_refs":["ISO 45001:2018, 8.2 Emergency preparedness and response","Directive 1999/92/EC (workers potentially at risk from explosive atmospheres)"],"step_minutes":2,"max_steps":8,"actions_per_step":2,"vars":{"hazard":2,"exposed":3,"unaccounted":3,"casualty":0,"in_care":0,"comms":2,"ext":0},"barriers":[{"id":"B-IGN","label":{"en":"Ignition-source control","uk":"Контроль джерел запалювання","de":"Vermeidung von Zündquellen","nl":"Beheersing van ontstekingsbronnen","fr":"Maîtrise des sources d’inflammation","es":"Control de fuentes de ignición","pl":"Kontrola źródeł zapłonu"}},{"id":"B-ESV","label":{"en":"Emergency gas shut-off valve","uk":"Аварійний газовий запірний клапан","de":"Gas-Notabsperrarmatur","nl":"Gasnoodafsluiter","fr":"Vanne de coupure gaz d’urgence","es":"Válvula de corte de gas de emergencia","pl":"Awaryjny zawór odcinający gaz"}},{"id":"B-VENT","label":{"en":"Natural ventilation through outside doors","uk":"Природна вентиляція через зовнішні двері","de":"Natürliche Lüftung über Außentüren","nl":"Natuurlijke ventilatie via buitendeuren","fr":"Ventilation naturelle par les portes extérieures","es":"Ventilación natural por puertas exteriores","pl":"Wentylacja naturalna przez drzwi zewnętrzne"}},{"id":"B-CORDON","label":{"en":"Exclusion zone","uk":"Зона відчуження","de":"Absperrbereich","nl":"Afzetting","fr":"Périmètre d’exclusion","es":"Zona de exclusión","pl":"Strefa wykluczenia"}}],"setup":[{"id":"GAS-S01","chance":0.5,"effects":[["flag","esv_stiff"]],"text":{"en":"The shut-off valve handle is seized; it needs the valve key kept in the workshop.","uk":"Рукоятка клапана заклинила; потрібен ключ, що зберігається в майстерні.","de":"Der Absperrhebel sitzt fest; der Schlüssel dafür liegt in der Werkstatt.","nl":"De hendel van de afsluit  traces de brûlure à la porte.","es":"Un estallido y marcas de quemado en la puerta.","pl":"Huk i ślady osmalenia na drzwiach kotłowni."}}],"outcomes":[{"id":"GAS-O1","class":"escalated","when":{"all":[["f","ignited"],["f","hurt"],["v","ext","==",0]]},"label":{"en":"Ignition injured a person; no emergency call made","uk":"Займання травмувало людину; виклику не було","de":"Zündung verletzte eine Person; kein Notruf","nl":"Ontsteking verwondde iemand; geen melding gedaan","fr":"Inflammation avec blessé ; aucun appel d’urgence","es":"La ignición hirió a alguien; sin llamada de emergencia","pl":"Zapłon zranił osobę; brak wezwania"},"explain":{"en":"The gas ignited with a person in the area before anyone called the emergency services.","uk":"Газ спалахнув, коли в зоні була людина, до виклику служб.","de":"Das Gas zündete mit einer Person im Bereich, bevor jemand Hilfe rief.","nl":"Het gas ontbrandde met iemand in het gebied voordat er gebeld was.","fr":"Le gaz s’est enflammé avec une personne dans la zone avant tout appel.","es":"El gas se inflamó con alguien en la zona antes de cualquier llamada.","pl":"Gaz zapalił się z osobą w strefie, zanim ktoś wezwał służby."}},{"id":"GAS-O2","class":"controlled","when":{"all":[["v","hazard","==",0],["v","exposed","==",0],["v","unaccounted","==",0],["f","esv_closed"],["nf","ignited"]]},"label":{"en":"Supply isolated, gas dispersed, everyone accounted for","uk":"Подачу перекрито, газ розсіяно, усіх враховано","de":"Zuleitung gesperrt, Gas verdünnt, alle erfasst","nl":"Toevoer dicht, gas verdund, iedereen geteld","fr":"Gaz coupé et dispersé, tout le monde recensé","es":"Suministro cortado, gas disperso, todos localizados","pl":"Dopływ odcięty, gaz rozproszony, wszyscy policzeni"},"explain":{"en":"The supply was isolated, the gas level returned to zero without ignition, and the head count is complete.","uk":"Подачу перекрито, рівень газу повернувся до нуля без займання, облік людей повний.","de":"Die Zuleitung wurde gesperrt, der Gaspegel sank ohne Zündung auf null, die Zählung ist vollständig.","nl":"De toevoer is afgesloten, het gasniveau daalde zonder ontsteking tot nul en de telling is compleet.","fr":"L’alimentation a été coupée, le gaz est retombé à zéro sans inflammation et le décompte est complet.","es":"Se cortó el suministro, el gas volvió a cero sin ignición y el recuento está completo.","pl":"Dopływ odcięto, poziom gazu spadł do zera bez zapłonu, liczenie jest pełne."}},{"id":"GAS-O3","class":"controlled_loss","when":{"all":[["v","hazard","==",0],["v","exposed","==",0],["v","unaccounted","==",0],["v","casualty","==",0],["f","esv_closed"],["f","ignited"]]},"label":{"en":"Controlled after an ignition","uk":"Контроль відновлено після займання","de":"Kontrolliert nach einer Zündung","nl":"Beheerst na een ontsteking","fr":"Maîtrisé après une inflammation","es":"Controlado tras una ignición","pl":"Opanowane po zapłonie"},"explain":{"en":"The situation ended under control, but the gas ignited during the response.","uk":"Ситуацію взято під контроль, але під час реагування газ спалахнув.","de":"Die Lage endete kontrolliert, doch das Gas zündete während des Einsatzes.","nl":"De situatie eindigde beheerst, maar het gas ontbrandde tijdens de inzet.","fr":"La situation s’est terminée maîtrisée, mais le gaz s’est enflammé pendant l’intervention.","es":"La situación terminó controlada, pero el gas se inflamó durante la respuesta.","pl":"Sytuacja została opanowana, ale gaz zapalił się w trakcie działań."}}],"reference_paths":[{"id":"GAS-P1","seed":1,"expect":"GAS-O2","label":{"en":"Evacuate and control ignition, then isolate","uk":"Евакуація і контроль запалювання, потім перекриття","de":"Räumen und Zündquellen meiden, dann absperren","nl":"Ontruimen en ontsteking voorkomen, dan afsluiten","fr":"Évacuer et maîtriser l’inflammation, puis couper","es":"Evacuar y controlar la ignición, luego cortar","pl":"Ewakuacja i kontrola zapłonu, potem odcięcie"},"steps":[["no_switch","evacuate"],["close_esv","call_ext"],["cordon","roll_call"],["open_doors"]]},{"id":"GAS-P2","seed":3,"expect":"GAS-O3","label":{"en":"Switching off inside the room first","uk":"Спершу вимкнення всередині приміщення","de":"Zuerst im Raum abschalten","nl":"Eerst binnen in de ruimte uitschakelen","fr":"Coupure dans le local en premier","es":"Primero desconectar dentro de la sala","pl":"Najpierw wyłączenie wewnątrz pomieszczenia"},"steps":[["isolate_power","call_ext"],["evacuate"],["close_esv"],["fetch_key","roll_call"],[],[],[]]}]},{"schema":"tools.petrov.re/emergency-drill-scenario/v1","id":"fall-injury","revision":"1","title":{"en":"Worker injured in a warehouse aisle","uk":"Травмований працівник у проході складу","de":"Verletzter Beschäftigter in einem Lagergang","nl":"Gewonde medewerker in een magazijngang","fr":"Salarié blessé dans une allée d’entrepôt","es":"Trabajador herido en un pasillo de almacén","pl":"Pracownik ranny w alejce magazynu"},"brief":{"en":"A picker has fallen from a ladder in a racked aisle where forklifts still run. You arrive first; the site has a trained first aider on shift.","uk":"Комплектувальник упав з драбини в проході між стелажами, де досі їздять навантажувачі. Ви прибули першими; на зміні є підготовлений рятувальник.","de":"Ein Kommissionierer ist in einem Regalgang, in dem noch Stapler fahren, von der Leiter gestürzt. Sie sind als Erste vor Ort; ein Ersthelfer ist im Dienst.","nl":"Een orderpicker is van een ladder gevallen in een stellinggang waar nog heftrucks rijden. U bent als eerste ter plaatse; er is een bedrijfshulpverlener in dienst.","fr":"Un préparateur est tombé d’une échelle dans une allée où circulent encore des chariots. Vous arrivez en premier ; un sauveteur secouriste est de service.","es":"Un preparador ha caído de una escalera en un pasillo donde siguen circulando carretillas. Usted llega primero; hay un socorrista formado de turno.","pl":"Magazynier spadł z drabiny w alejce regałowej, gdzie nadal jeżdżą wózki. Jesteś pierwszy na miejscu; na zmianie jest przeszkolony ratownik."},"basis":{"kind":"illustrative","source":"Scenario pack written for this tool; not taken from a site emergency plan; not reviewed by an emergency-response professional","jurisdiction":"none","version":"2026-09-15"},"context_refs":["ISO 45001:2018, 8.2 Emergency preparedness and response","HSE L74, First aid at work (guidance on the Health and Safety (First-Aid) Regulations 1981)"],"step_minutes":2,"max_steps":8,"actions_per_step":2,"vars":{"hazard":2,"exposed":2,"unaccounted":0,"casualty":1,"in_care":0,"comms":2,"ext":0},"barriers":[{"id":"B-SCENE","label":{"en":"Traffic stop in the aisle","uk":"Зупинка руху в проході","de":"Verkehrsstopp im Gang","nl":"Verkeersstop in de gang","fr":"Arrêt de la circulation dans l’allée","es":"Parada del tráfico en el pasillo","pl":"Wstrzymanie ruchu w alejce"}},{"id":"B-FA","label":{"en":"Trained first aider and kit","uk":"Підготовлений рятувальник і аптечка","de":"Ersthelfer und Verbandkasten","nl":"Bedrijfshulpverlener en verbanddoos","fr":"Sauveteur secouriste et trousse","es":"Socorrista y botiquín","pl":"Przeszkolony ratownik i apteczka"}},{"id":"B-GUIDE","label":{"en":"Guide for the ambulance at the gate","uk":"Супровідник для швидкої біля воріт","de":"Einweiser für den Rettungsdienst am Tor","nl":"Opvang van de ambulance bij de poort","fr":"Guide pour l’ambulance au portail","es":"Guía para la ambulancia en la entrada","pl":"Osoba kierująca karetkę przy bramie"}}],"setup":[{"id":"FALL-S01","chance":0.5,"effects":[["flag","deteriorates"]],"text":{"en":"The casualty’s condition worsens after a few minutes.","uk":"Стан потерпілого погіршується за кілька хвилин.","de":"Der Zustand der verletzten Person verschlechtert sich nach einigen Minuten.","nl":"De toestand van het slachtoffer verslechtert na enkele minuten.","fr":"L’état de la victime se dégrade après quelques minutes.","es":"El estado del herido empeora al cabo de unos minutos.","pl":"Stan poszkodowanego pogarsza się po kilku minutach."},"else_text":{"en":"The casualty’s condition stays stable.","uk":"Стан потерпілого стабільний.","de":"Der Zustand bleibt stabil.","nl":"De toestand blijft stabiel.","fr":"L’état de la victime reste stable.","es":"El estado del herido se mantiene estable.","pl":"Stan poszkodowanego jest stabilny."}},{"id":"FALL-S02","chance":0.5,"effects":[["flag","gate_locked"]],"text":{"en":"The rear gate nearest the aisle is locked.","uk":"Задні ворота біля проходу замкнені.","de":"Das hintere Tor nahe dem Gang ist verschlossen.","nl":"De achterpoort bij de gang is op slot.","fr":"Le portail arrière proche de l’allée est fermé à clé.","es":"La puerta trasera junto al pasillo está cerrada con llave.","pl":"Tylna brama przy alejce jest zamknięta."},"else_text":{"en":"The rear gate nearest the aisle is open.","uk":"Задні ворота біля проходу відчинені.","de":"Das hintere Tor nahe dem Gang ist offen.","nl":"De achterpoort bij de gang is open.","fr":"Le portail arrière proche de l’allée est ouvert.","es":"La puerta trasera junto al pasillo está abierta.","pl":"Tylna brama przy alejce jest otwarta."}}],"decisions":[{"id":"stop_traffic","code":"FALL-D01","tag":"safe","barrier":"B-SCENE","effects":[],"label":{"en":"Stop forklift traffic in the aisle","uk":"Зупинити рух навантажувачів у проході","de":"Staplerverkehr im Gang stoppen","nl":"Heftruckverkeer in de gang stilleggen","fr":"Arrêter les chariots dans l’allée","es":"Detener las carretillas en el pasillo","pl":"Wstrzymać ruch wózków w alejce"}},{"id":"call_fa","code":"FALL-D02","tag":"safe","effects":[],"label":{"en":"Call the first aider with the kit","uk":"Викликати рятувальника з аптечкою","de":"Ersthelfer mit Verbandkasten rufen","nl":"De bedrijfshulpverlener met verbanddoos roepen","fr":"Appeler le sauveteur avec la trousse","es":"Llamar al socorrista con el botiquín","pl":"Wezwać ratownika z apteczką"}},{"id":"call_ems","code":"FALL-D03","tag":"safe","when":["v","ext","==",0],"effects":[["set","ext",1]],"label":{"en":"Call an ambulance","uk":"Викликати швидку допомогу","de":"Rettungsdienst rufen","nl":"Ambulance bellen","fr":"Appeler une ambulance","es":"Llamar a una ambulancia","pl":"Wezwać karetkę"}},{"id":"move_casualty","code":"FALL-D04","tag":"unsafe","when":["nf","handover"],"effects":[],"safer":["stop_traffic","keep_still"],"why":{"en":"A fall casualty may have a spinal injury; moving is for danger that cannot be removed, and here the traffic can be stopped.","uk":"Потерпілий після падіння може мати травму хребта; переміщувати можна лише через небезпеку, яку не усунути, а рух тут можна зупинити.","de":"Nach einem Sturz ist eine Wirbelsäulenverletzung möglich; bewegt wird nur bei nicht abstellbarer Gefahr, und der Verkehr lässt sich hier stoppen.","nl":"Na een val kan de wervelkolom letsel hebben; verplaatsen is voor gevaar dat niet weg te nemen is, en het verkeer is hier stil te leggen.","fr":"Après une chute, une lésion rachidienne est possible ; on ne déplace qu’en cas de danger impossible à supprimer, et ici la circulation peut être arrêtée.","es":"Tras una caída puede haber lesión de columna; solo se mueve ante un peligro que no se puede eliminar, y aquí el tráfico se puede detener.","pl":"Po upadku możliwy jest uraz kręgosłupa; przenosi się tylko przy zagrożeniu, którego nie da się usunąć, a ruch można tu wstrzymać."},"label":{"en":"Carry the casualty to the rest room","uk":"Перенести потерпілого до кімнати відпочинку","de":"Verletzte Person in den Pausenraum tragen","nl":"Het slachtoffer naar de kantine dragen","fr":"Porter la victime en salle de pause","es":"Llevar al herido a la sala de descanso","pl":"Przenieść poszkodowanego do pokoju socjalnego"}},{"id":"keep_still","code":"FALL-D05","tag":"safe","effects":[],"label":{"en":"Keep the casualty still and talk to them","uk":"Тримати потерпілого нерухомо і говорити з ним","de":"Verletzte Person ruhig halten und ansprechen","nl":"Het slachtoffer stil houden en aanspreken","fr":"Maintenir la victime immobile et lui parler","es":"Mantener quieto al herido y hablarle","pl":"Utrzymać poszkodowanego w bezruchu i mówić do niego"}},{"id":"send_guide","code":"FALL-D06","tag":"safe","barrier":"B-GUIDE","when":["v","ext",">=",1],"effects":[],"label":{"en":"Send someone to meet the ambulance","uk":"Відправити когось зустріти швидку","de":"Jemanden zum Einweisen des Rettungsdienstes schicken","nl":"Iemand sturen om de ambulance op te vangen","fr":"Envoyer quelqu’un accueillir l’ambulance","es":"Enviar a alguien a recibir a la ambulancia","pl":"Wysłać kogoś na spotkanie karetki"}},{"id":"update_ems","code":"FALL-D07","tag":"safe","when":{"all":[["v","ext","==",1],["f","worse"]]},"effects":[],"label":{"en":"Call back with the change in condition","uk":"Передзвонити про зміну стану","de":"Zustandsänderung nachmelden","nl":"Terugbellen over de verandering","fr":"Rappeler pour signaler l’aggravation","es":"Volver a llamar con el cambio de estado","pl":"Oddzwonić ze zmianą stanu"}},{"id":"clear_bystanders","code":"FALL-D08","tag":"safe","effects":[],"label":{"en":"Send bystanders out of the aisle","uk":"Вивести сторонніх з проходу","de":"Schaulustige aus dem Gang schicken","nl":"Omstanders uit de gang sturen","fr":"Faire sortir les curieux de l’allée","es":"Sacar a los curiosos del pasillo","pl":"Usunąć gapiów z alejki"}}],"events":[{"id":"FALL-E01","when":{"all":[["f","stop_traffic"],["v","hazard",">",0]]},"effects":[["set","hazard",0]],"text":{"en":"Traffic stops; the aisle is closed.","uk":"Рух зупинено; прохід закрито.","de":"Verkehr steht; der Gang ist gesperrt.","nl":"Verkeer staat stil; de gang is dicht.","fr":"La circulation cesse ; l’allée est fermée.","es":"Se detiene el tráfico; pasillo cerrado.","pl":"Ruch wstrzymany; alejka zamknięta."}},{"id":"FALL-E02","when":{"all":[["nf","stop_traffic"],["v","hazard","==",2],["nf","nearmiss"]]},"chance":0.5,"effects":[["flag","nearmiss"],["add","hazard",1]],"text":{"en":"A forklift passes close to the casualty.","uk":"Навантажувач проїжджає поруч із потерпілим.","de":"Ein Stapler fährt dicht an der Person vorbei.","nl":"Een heftruck rijdt vlak langs het slachtoffer.","fr":"Un chariot frôle la victime.","es":"Una carretilla pasa muy cerca del herido.","pl":"Wózek przejeżdża tuż obok poszkodowanego."},"else_text":{"en":"Forklifts keep working further down the aisle.","uk":"Навантажувачі працюють далі в проході.","de":"Stapler arbeiten weiter hinten im Gang.","nl":"Heftrucks werken verderop in de gang.","fr":"Les chariots travaillent plus loin dans l’allée.","es":"Las carretillas siguen al fondo del pasillo.","pl":"Wózki pracują dalej w alejce."}},{"id":"FALL-E03","when":{"all":[["nf","stop_traffic"],["nf","clear_bystanders"],["v","hazard",">=",3],["nf","struck"]]},"chance":0.5,"effects":[["flag","struck"],["add","casualty",1]],"text":{"en":"A reversing forklift strikes a bystander.","uk":"Навантажувач заднім ходом збиває стороннього.","de":"Ein rückwärtsfahrender Stapler erfasst eine Person.","nl":"Een achteruitrijdende heftruck raakt een omstander.","fr":"Un chariot en marche arrière heurte un curieux.","es":"Una carretilla marcha atrás golpea a un curioso.","pl":"Cofający wózek potrąca gapia."},"else_text":{"en":"Bystanders step aside from a forklift.","uk":"Сторонні відходять від навантажувача.","de":"Umstehende weichen einem Stapler aus.","nl":"Omstanders stappen opzij voor een heftruck.","fr":"Les curieux s’écartent d’un chariot.","es":"Los curiosos se apartan de una carretilla.","pl":"Gapie odsuwają się przed wózkiem."}},{"id":"FALL-E04","when":{"all":[["f","move_casualty"],["nf","moved_harm"]]},"effects":[["flag","moved_harm"],["flag","worse"]],"text":{"en":"Moving causes severe pain and leg numbness.","uk":"Переміщення спричиняє сильний біль і оніміння ніг.","de":"Das Bewegen verursacht starke Schmerzen und Taubheit.","nl":"Verplaatsen veroorzaakt hevige pijn en gevoelloze benen.","fr":"Le déplacement provoque une vive douleur et un engourdissement.","es":"Moverlo causa dolor intenso y entumecimiento.","pl":"Przeniesienie wywołuje silny ból i drętwienie nóg."}},{"id":"FALL-E05","when":{"all":[["f","deteriorates"],["step",">=",2],["nf","worse"]]},"effects":[["flag","worse"]],"text":{"en":"The casualty becomes drowsy and pale.","uk":"Потерпілий стає сонливим і блідим.","de":"Die Person wird schläfrig und blass.","nl":"Het slachtoffer wordt suf en bleek.","fr":"La victime devient somnolente et pâle.","es":"El herido se vuelve somnoliento y pálido.","pl":"Poszkodowany robi się senny i blady."}},{"id":"FALL-E06","when":{"all":[["f","call_fa"],["since","call_fa",">=",1],["nf","fa_here"]]},"effects":[["flag","fa_here"],["barrier","B-FA","used"]],"text":{"en":"The first aider arrives with the kit.","uk":"Прибуває рятувальник з аптечкою.","de":"Der Ersthelfer trifft mit dem Kasten ein.","nl":"De hulpverlener komt met de verbanddoos.","fr":"Le sauveteur arrive avec la trousse.","es":"Llega el socorrista con el botiquín.","pl":"Przybywa ratownik z apteczką."}},{"id":"FALL-E07","when":{"all":[["f","fa_here"],["v","casualty",">",0]]},"effects":[["move","casualty","in_care"]],"text":{"en":"The first aider takes over care.","uk":"Рятувальник бере допомогу на себе.","de":"Der Ersthelfer übernimmt die Versorgung.","nl":"De hulpverlener neemt de zorg over.","fr":"Le sauveteur prend en charge.","es":"El socorrista asume la atención.","pl":"Ratownik przejmuje opiekę."}},{"id":"FALL-E08","when":{"all":[["v","ext","==",1],["since","call_ems",">=",3],{"any":[["f","send_guide"],["nf","gate_locked"],["since","call_ems",">=",5]]}]},"effects":[["set","ext",2],["mark","arrived"]],"text":{"en":"The ambulance crew reaches the aisle.","uk":"Бригада швидкої дісталася проходу.","de":"Der Rettungsdienst erreicht den Gang.","nl":"De ambulanceploeg bereikt de gang.","fr":"L’équipe d’ambulance atteint l’allée.","es":"La ambulancia llega al pasillo.","pl":"Zespół karetki dociera do alejki."}},{"id":"FALL-E09","when":{"all":[["v","ext","==",1],["since","call_ems",">=",3],["nf","send_guide"],["f","gate_locked"],["nf","delay"]]},"effects":[["flag","delay"]],"text":{"en":"The ambulance waits at the locked rear gate.","uk":"Швидка чекає біля замкнених задніх воріт.","de":"Der Rettungswagen steht am verschlossenen Hintertor.","nl":"De ambulance staat bij de dichte achterpoort.","fr":"L’ambulance attend au portail arrière fermé.","es":"La ambulancia espera en la puerta trasera cerrada.","pl":"Karetka czeka przy zamkniętej tylnej bramie."}},{"id":"FALL-E10","when":{"all":[["v","ext","==",2],["v","hazard","==",0],["nf","handover"]]},"effects":[["flag","handover"],["move","casualty","in_care"],["set","exposed",0]],"text":{"en":"Casualties are handed over to the ambulance crew.","uk":"Потерпілих передано бригаді швидкої.","de":"Die Verletzten werden an den Rettungsdienst übergeben.","nl":"De slachtoffers worden aan de ambulanceploeg overgedragen.","fr":"Les victimes sont confiées à l’équipe d’ambulance.","es":"Los heridos se entregan al equipo de ambulancia.","pl":"Poszkodowani zostają przekazani zespołowi karetki."}}],"cues":[{"id":"FALL-C01","when":["step","==",0],"expects":["call_fa","call_ems"],"window":1,"text":{"en":"A worker lies at the foot of a ladder, conscious, with back pain.","uk":"Біля драбини лежить працівник, при свідомості, скаржиться на біль у спині.","de":"Am Fuß einer Leiter liegt ein Beschäftigter, bei Bewusstsein, mit Rückenschmerzen.","nl":"Aan de voet van een ladder ligt een medewerker, bij bewustzijn, met rugpijn.","fr":"Un salarié gît au pied d’une échelle, conscient, avec des douleurs au dos.","es":"Un trabajador yace al pie de una escalera, consciente, con dolor de espalda.","pl":"U podnóża drabiny leży pracownik, przytomny, z bólem pleców."}},{"id":"FALL-C02","when":["v","hazard",">=",2],"expects":["stop_traffic"],"window":1,"text":{"en":"Forklifts are still moving in the aisle.","uk":"У проході досі рухаються навантажувачі.","de":"Im Gang fahren noch Stapler.","nl":"In de gang rijden nog heftrucks.","fr":"Des chariots circulent encore dans l’allée."," ich niet.","fr":"Le collègue ne donne pas non plus de nouvelles.","es":"El compañero tampoco se reporta.","pl":"Współpracownik też się nie zgłasza."}},{"id":"LONE-E07","when":{"all":[["f","found"],["f","hurt"],["nf","cas_set"]]},"effects":[["flag","cas_set"],["add","casualty",1]],"text":{"en":"The technician has a leg injury and cannot walk.","uk":"У техніка травма ноги, він не може йти.","de":"Der Techniker hat eine Beinverletzung und kann nicht gehen.","nl":"De monteur heeft beenletsel en kan niet lopen.","fr":"Le technicien est blessé à la jambe et ne peut pas marcher.","es":"El técnico tiene una lesión en la pierna y no puede andar.","pl":"Technik ma uraz nogi i nie może chodzić."}},{"id":"LONE-E08","when":{"all":[["f","found"],["nf","hurt"],["v","exposed",">",0]]},"effects":[["set","exposed",0],["set","hazard",0]],"text":{"en":"The technician is unhurt and leaves with the team.","uk":"Технік неушкоджений і їде з пошуковцями.","de":"Der Techniker ist unverletzt und fährt mit zurück.","nl":"De monteur is ongedeerd en gaat mee terug.","fr":"Le technicien est indemne et repart avec l’équipe.","es":"El técnico está ileso y se va con el equipo.","pl":"Technik jest cały i wraca z zespołem."}},{"id":"LONE-E09","when":{"all":[["f","found"],["f","send_team"],["v","casualty",">",0]]},"effects":[["move","casualty","in_care"]],"text":{"en":"The team gives first aid.","uk":"Пошуковці надають першу допомогу.","de":"Das Team leistet Erste Hilfe.","nl":"Het team verleent eerste hulp.","fr":"Le binôme donne les premiers secours.","es":"El equipo presta primeros auxilios.","pl":"Zespół udziela pierwszej pomocy."}},{"id":"LONE-E10","when":{"all":[["v","ext","==",1],["since","call_ems",">=",2]]},"effects":[["set","ext",2]],"text":{"en":"Emergency services reach the pump station.","uk":"Екстрені служби дісталися насосної.","de":"Der Rettungsdienst erreicht die Pumpstation.","nl":"De hulpdiensten bereiken het gemaal.","fr":"Les secours atteignent la station.","es":"Emergencias llega .","es":"El técnico herido fue encontrado y entregado antes de que el frío añadiera daño en el modelo.","pl":"Rannego technika odnaleziono i przekazano, zanim chłód pogorszył stan w modelu."}},{"id":"LONE-O4","class":"controlled_loss","when":{"all":[["f","recovered"],["f","worse"]]},"label":{"en":"Injured technician handed over after a delay","uk":"Травмованого передано із затримкою","de":"Verletzter nach Verzögerung übergeben","nl":"Gewonde na vertraging overgedragen","fr":"Blessé remis après un délai","es":"Herido entregado con retraso","pl":"Rannego przekazano z opóźnieniem"},"explain":{"en":"The technician was handed over, but the search started late and cold exposure added harm in the model.","uk":"Техніка передано, але пошук почався пізно, і холод обтяжив стан у моделі.","de":"Der Techniker wurde übergeben, doch die Suche begann spät und Auskühlung verschlimmerte den Zustand im Modell.","nl":"De monteur werd overgedragen, maar het zoeken begon laat en kou verergerde de toestand in het model.","fr":"Le technicien a été remis, mais la recherche a commencé tard et le froid a aggravé son état dans le modèle.","es":"El técnico fue entregado, pero la búsqueda empezó tarde y el frío empeoró su estado en el modelo.","pl":"Technika przekazano, ale poszukiwania zaczęły się późno i chłód pogorszył stan w modelu."}}],"reference_paths":[{"id":"LONE-P1","seed":2,"expect":"LONE-O3","label":{"en":"Phone, escalate, locate, send a team","uk":"Дзвінок, ескалація, пошук, пара","de":"Anrufen, eskalieren, orten, Team schicken","nl":"Bellen, escaleren, lokaliseren, team sturen","fr":"Appeler, alerter, localiser, envoyer un binôme","es":"Llamar, escalar, localizar, enviar equipo","pl":"Telefon, eskalacja, lokalizacja, zespół"},"steps":[["try_phone","escalate"],["check_gps","send_team"],["call_ems","radio_check"],[],[]]},{"id":"LONE-P2","seed":3,"expect":"LONE-O1","label":{"en":"One colleague sent alone","uk":"Одного колегу відправлено самого","de":"Eine Person allein geschickt","nl": ","pl":"Na trzecim piętrze pracuje dwadzieścia osób, w tym osoba na wózku. Piętro ma dwie chronione klatki schodowe (A i B) oraz strefę oczekiwania z interkomem przy klatce B. Jesteś koordynatorem piętra."},"basis":{"kind":"illustrative","source":"Scenario pack written for this tool; not taken from a site emergency plan; not reviewed by an emergency-response professional","jurisdiction":"none","version":"2026-09-15"},"context_refs":["ISO 45001:2018, 8.2 Emergency preparedness and response","Council Directive 89/654/EEC (workplace minimum requirements; emergency routes and exits)"],"step_minutes":2,"max_steps":8,"actions_per_step":2,"vars":{"hazard":1,"exposed":20,"unaccounted":20,"casualty":0,"in_care":0,"comms":2,"ext":0},"barriers":[{"id":"B-STAIR-A","label":{"en":"Protected stair A","uk":"Захищені сходи A","de":"Geschützte Treppe A","nl":"Beschermde trap A","fr":"Escalier protégé A","es":"Escalera protegida A","pl":"Chroniona klatka A"}},{"id":"B-STAIR-B","label":{"en":"Protected stair B","uk":"Захищені сходи B","de":"Geschützte Treppe B","nl":"Beschermde trap B","fr":"Escalier protégé B","es":"Escalera protegida B","pl":"Chroniona klatka B"}},{"id":"B-REFUGE","label":{"en":"Refuge point with call unit","uk":"Зона безпеки з переговорним пристроєм","de":"Warteraum mit Sprechstelle","nl":"Opvangplek met intercom","fr":"Espace d’attente sécurisé avec interphone","es":"Zona de refugio con interfono","pl":"Strefa oczekiwania z interkomem"}},{"id":"B-SWEEP","label":{"en":"Floor sweep by the warden","uk":"Обхід поверху відповідальним","de":"Kontrollgang durch die Etagenbeauftragten","nl":"Controleronde door de coördinator","fr":"Ronde de contrôle du guide-file","es":"Barrido de planta por el responsable","pl":"Obchód piętra przez koordynatora"}},{"id":"B-ASSY","label":{"en":"Assembly point and roll-call","uk":"Місце збору і перекличка","de":"Sammelplatz und Anwesenheitskontrolle","nl":"Verzamelplaats en appèl","fr":"Point de rassemblement et appel","es":"Punto de reunió ście i obciąża klatki schodowe."},"label":{"en":"Let staff collect coats and bags first","uk":"Дозволити спершу забрати одяг і сумки","de":"Erst Jacken und Taschen holen lassen","nl":"Eerst jassen en tassen laten pakken","fr":"Laisser prendre manteaux et sacs d’abord","es":"Dejar recoger abrigos y bolsos primero","pl":"Pozwolić najpierw zabrać kurtki i torby"}}],"events":[{"id":"EVAC-E01","when":{"all":[["f","stair_a_smoke"],["step",">=",1],["nf","a_smoke"]]},"effects":[["flag","a_smoke"],["add","hazard",1],["barrier","B-STAIR-A","failed"]],"text":{"en":"Smoke is entering stair A.","uk":"Дим проникає на сходи A.","de":"Rauch dringt in Treppe A ein.","nl":"Rook dringt trap A binnen.","fr":"La fumée entre dans l’escalier A.","es":"Entra humo en la escalera A.","pl":"Dym wnika do klatki A."}},{"id":"EVAC-E02","when":{"all":[["f","belongings"],["nf","slowed"]]},"effects":[["flag","slowed"]],"text":{"en":"Staff stop to collect belongings.","uk":"Люди зупиняються забрати речі.","de":"Beschäftigte holen ihre Sachen.","nl":"Medewerkers pakken hun spullen.","fr":"Le personnel récupère ses affaires.","es":"El personal recoge sus cosas.","pl":"Pracownicy zbierają rzeczy."}},{"id":"EVAC-E03","when":{"all":[["f","use_lift"],["nf","lift_done"]]},"chance":0.5,"effects":[["flag","lift_done"],["flag","lift_stuck"]],"else":[["flag","lift_done"]],"text":{"en":"The lift stops between floors with three people inside.","uk":"Ліфт зупиняється між поверхами з трьома людьми.","de":"Der Aufzug bleibt mit drei Personen zwischen den Etagen stehen.","nl":"De lift stopt tussen twee verdiepingen met drie mensen erin.","fr":"L’ascenseur s’arrête entre deux étages avec trois personnes.","es":"El ascensor se detiene entre plantas con tres personas.","pl":"Winda staje między piętrami z trzema osobami."},"else_text":{"en":"The lift carries a few people down.","uk":"Ліфт спускає кількох людей.","de":"Der Aufzug bringt einige hinunter.","nl":"De lift brengt enkelen naar beneden.","fr":"L’ascenseur desce uentra humo y regresa; una persona lo inhala.","pl":"Na klatce A ludzie trafiają na dym i zawracają; jedna osoba go wdycha."}},{"id":"EVAC-E07","when":{"all":[["f","refuge"],["nf","refuge_done"]]},"effects":[["add","exposed",-1],["flag","refuge_done"]],"text":{"en":"The wheelchair user waits at the refuge point.","uk":"Людина на кріслі чекає в зоні безпеки.","de":"Die Rollstuhlnutzerin wartet im Warteraum.","nl":"De rolstoelgebruiker wacht op de opvangplek.","fr":"La personne en fauteuil attend à l’espace d’attente.","es":"La usuaria de silla espera en el refugio.","pl":"Osoba na wózku czeka w strefie oczekiwania."}},{"id":"EVAC-E08","when":{"all":[["f","sweep"],["f","evac_done"],["nf","sweep_done"]]},"effects":[["add","exposed",-1],["flag","sweep_done"]],"text":{"en":"The sweep finds a person in a meeting room.","uk":"Під час обходу знайдено людину в переговорній.","de":"Beim Kontrollgang wird eine Person im Besprechungsraum gefunden.","nl":"Bij de ronde wordt iemand in een vergaderruimte gevonden.","fr":"La ronde trouve une personne dans une salle.","es":"El barrido encuentra a alguien en una sala.","pl":"Podczas obchodu znaleziono osobę w sali spotkań."}},{"id":"EVAC-E09","when":{"all":[["f","roll_call"],["f","evac_done"]]},"silent":true,"effects":[["copy","exposed","unaccounted"]],"text":{"en":"Roll-call result updated.","uk":"Результат переклички оновлено.","de":"Ergebnis der Anwesenheitskontrolle aktualisiert.","nl":"Resultaat appèl bijgewerkt.","fr":"Résultat de l’appel mis à jour.","es":"Resultado del recuento actualizado.","pl":"Wynik sprawdzenia obecności zaktualizowany."}},{"id":"EVAC-E10","when":{"all":[["v","ext","==",1],["since","call_fs",">=",2]]},"effects":[["set","ext",2],["mark","arrived"]],"text":{"en":"Fire crews arrive at the entrance.","uk":"Пожежники прибули до входу.","de":"Die Feuerwehr trifft am Eingang ein.","nl":"De brandweer komt bij de ingang aan.","fr":"Les pompiers arrivent à l’entrée.","es":"Los bomberos llegan a la entrada.","pl":"S /* Emergency Drill Simulator — tools.petrov.re, category safety.

/* ==================================================================== engine

   Pure functions only: no DOM, no screen strings. Shared by the interface,

var DRILL = (function () {

      case 'f': return !!st.flags[c[1]];
      case 'nf': return !st.flags[c[1]];
      case 'since': return has(st.marks, c[1]) && cmp(st.step - st.marks[c[1]], c[2], c[3]);
      case 'step': return cmp(st.step, c[1], c[2]);
      case 'b': return st.barriers[c[1]] === c[2];

    unresolvedExplain: T('The model stopped at its step limit. The situation is neither controlled nor escalated in the modelled scope; treat it as open and review the missed cues.', 'Модель зупинилася на ліміті кроків. Ситуація в межах моделі ні під контролем, ні ескалована; вважайте її відкритою і перегляньте пропущені сигнали.', 'Das Modell hielt an seiner Schrittgrenze. Die Lage ist im Modellumfang weder kontrolliert noch eskaliert; als offen behandeln und die verpassten Hinweise prüfen.', 'Het model stopte bij de stappenlimiet. De situatie is binnen het model beheerst noch geëscaleerd; behandel haar als open en bekijk de gemiste signalen.', 'Le modèle s’est arrêté à sa limite de pas. La situation n’est ni maîtrisée ni aggravée dans le périmètre modélisé ; la considérer comme ouverte et revoir les signaux manqués.', 'El modelo se detuvo en su límite de pasos. La situación no está controlada ni agravada en el alcance modelado; trátela como abierta y revise las señales omitidas.', 'Model zatrzymał się na limicie kroków. Sytuacja w zakresie modelu nie jest ani opanowana, ani eskalowana; traktuj ją jako otwartą i przejrzyj pominięte sygnały.'),

    resNote: T('Each line carries the ID of the cue, decision, event or rule it comes from. The outcome describes the model state only.', 'Кожен рядок має ідентифікатор сигналу, рішення, події чи правила, з якого він походить. Результат описує лише стан моделі.', 'Jede Zeile trägt die Kennung des Hinweises, der Entscheidung, des Ereignisses oder der Regel, aus der sie stammt. Das Ergebnis beschreibt nur den Modellzustand.', 'Elke regel draagt de id van het signaal, de beslissing, de gebeurtenis of de regel waar hij vandaan komt. De uitkomst beschrijft alleen de modeltoestand.', 'Chaque ligne porte l’identifiant du signal, de la décision, de l’événement ou de la règle d’origine. L’issue décrit seulement l’état du modèle.', 'Cada línea lleva el identificador de la señal, decisión, suceso o regla de la que procede. El desenlace describe solo el estado del modelo.', 'Każdy wiersz ma identyfikator sygnału, decyzji, zdarzenia lub reguły, z której pochodzi. Wynik opisuje tylko stan modelu.'),
    footer: T('Model: finite states and declared events, advanced one nominal step at a time. Decisions apply first, then events in declared order; chance draws come from a generator seeded with the run seed and the scenario id. No real-time clock and no score.',
      'Модель: скінченні стани й оголошені події, що просуваються на один номінальний крок. Спершу застосовуються рішення, потім події в оголошеному порядку; випадкові розіграші — з генератора, ініціалізованого зерном і ідентифікатором сценарію. Без реального часу і без балів.',
      'Modell: endliche Zustände und deklarierte Ereignisse, je ein nominaler Schritt. Zuerst wirken die Entscheidungen, dann die Ereignisse in deklarierter Reihenfolge; Zufallsziehungen stammen aus einem Generator mit Startwert und Szenariokennung. Keine Echtzeituhr, keine Punkte.',
      'Model: eindige toestanden en gedeclareerde gebeurtenissen, telkens één nominale stap. Eerst gelden de beslissingen, dan de gebeurtenissen in gedeclareerde volgorde; kanstrekkingen komen uit een generator met de seed en de scenario-id. Geen echte klok en geen score.',
      'Modèle : états finis et événements déclarés, un pas nominal à la fois. Les décisions s’appliquent d’abord, puis les événements dans l’ordre déclaré ; les tirages viennent d’un générateur initialisé par la graine et l’identifiant du scénario. Ni horloge réelle ni score.',
      'Modelo: estados finitos y sucesos declarados, un paso nominal cada vez. Primero se aplican las decisiones y luego los sucesos en el orden declarado; los sorteos salen de un generador iniciado con la semilla y el identificador del escenario. Sin reloj real y sin puntuación.',
      'Model: skończone stany i zadeklarowane zdarzenia, po jednym kroku nominalnym. Najpierw działają decyzje, potem zdarzenia w zadeklarowanej kolejności; losowania pochodzą z generatora inicjowanego ziarnem i identyfikatorem scenariusza. Bez zegara czasu rzeczywistego i bez punktacji.'),
    tagUnsafe: T('marked unsafe', 'позначено як небезпечне', 'als unsicher markiert', 'als onveilig gemarkeerd', 'marquée dangereuse', 'marcada como insegura', 'oznaczona jako niebezpieczna'),
    learnIntroT: T('How a drill runs', 'Як проходить вправа', 'So läuft eine Übung', 'Zo verloopt een oefening', 'Déroulement d’un exercice', 'Cómo transcurre un simulacro', 'Jak przebiega ćwiczenie'),
    learnIntroB: T('Read the observations, choose up to the allowed number of decisions and confirm the step. The situation then changes by the scenario rules. There is no timer: take the time a real briefing would need. When the run ends, the debrief lists missed cues, unsafe choices and the barriers you used.', 'Прочитайте спостереження, оберіть дозволену кількість рішень і підтвердіть крок. Далі обстановка змінюється за правилами сценарію. Таймера немає: витрачайте стільки часу, скільки потребує реальний інструктаж. Після завершення розбір покаже пропущені сигнали, небезпечні вибори та задіяні бар’єри.', 'Beobachtungen lesen, bis zur erlaubten Zahl Entscheidungen wählen und den Schritt bestätigen. Dann ändert sich die Lage nach den Szenarioregeln. Es gibt keinen Timer. Am Ende zeigt die Nachbesprechung verpasste Hinweise, unsichere Entscheidungen und genutzte Barrieren.', 'Lees de waarnemingen, kies tot het toegestane aantal beslissingen en bevestig de stap. De situatie verandert dan volgens de scenarioregels. Er is geen timer. Aan het eind toont de nabespreking gemiste signalen, onveilige keuzes en gebruikte barrières.', 'Lisez les observations, choisissez jusqu’au nombre de décisions permis et validez le pas. La situation évolue alors selon les règles du scénario. Pas de minuteur. À la fin, le débriefing liste signaux manqués, choix dangereux et barrières utilisées.', 'Lea las observaciones, elija hasta el número permitido de decisiones y confirme el paso. La situación cambia según las reglas del escenario. No hay temporizador. Al final, el análisis enumera señales omitidas, decisiones inseguras y barreras usadas.', 'Przeczytaj obserwacje, wybierz dozwoloną liczbę decyzji i zatwierdź krok. Sytuacja zmienia się według reguł scenariusza. Nie ma licznika czasu. Na koniec omówienie pokazuje pominięte sygnały, niebezpieczne wybory i użyte bariery.'),
    learnCueT: T('Cues and windows', 'Сигнали та вікна', 'Hinweise und Fenster', 'Signalen en vensters', 'Signaux et fenêtres', 'Señales y ventanas', 'Sygnały i okna'),
    learnCueB: T('Each observation has an ID and, for most, a set of expected responses and a window in steps. A cue counts as missed when none of its expected responses is taken within the window; a response taken earlier also counts.', 'Кожне спостереження має ідентифікатор, а більшість — очікувані відповіді й вікно в кроках. Сигнал пропущено, якщо жодної очікуваної відповіді не зроблено у вікні; відповідь, зроблена раніше, теж зараховується.', 'Jede Beobachtung hat eine Kennung und meist erwartete Reaktionen mit einem Fenster in Schritten. Ein Hinweis gilt als verpasst, wenn keine erwartete Reaktion im Fenster erfolgt; eine frühere Reaktion zählt ebenfalls.', 'Elke waarneming heeft een id en meestal verwachte reacties met een venster in stappen. Een signaal is gemist als geen verwachte reactie binnen het venster volgt; een eerdere reactie telt ook.', 'Chaque observation a un identifiant et, le plus souvent, des réponses attendues avec une fenêtre en pas. Un signal est manqué si aucune réponse attendue n’intervient dans la fenêtre ; une réponse antérieure compte aussi.', 'Cada observación tiene un identificador y, en general, respuestas esperadas con una ventana en pasos. Una señal se omite si no se da ninguna respuesta esperada en la ventana; una respuesta anterior también cuenta.', 'Każda obserwacja ma identyfikator i zwykle oczekiwane reakcje z oknem w krokach. Sygnał jest pominięty, gdy w oknie nie podjęto żadnej oczekiwanej reakcji; wcześniejsza reakcja też się liczy.'),
    learnSeedT: T('Seed and replay', 'Зерно і повтор', 'Startwert und Wiederholung', 'Seed en herhaling', 'Graine et rejouée', 'Semilla y repetición', 'Ziarno i powtórka'),
    learnSeedB: T('Hidden conditions and chance events are drawn from a generator started with the seed. The same scenario revision, seed and decisions always give the same timeline, which is what makes a branch comparison meaningful.', 'Приховані умови й випадкові події беруться з генератора, запущеного із зерном. Та сама редакція, зерно і рішення завжди дають ту саму хронологію — тому порівняння гілок має сенс.', 'Verdeckte Bedingungen und Zufallsereignisse stammen aus einem Generator mit dem Startwert. Gleiche Revision, gleicher Startwert und gleiche Entscheidungen ergeben stets dieselbe Zeitleiste; darauf beruht der Zweigvergleich.', 'Verborgen omstandigheden en kansgebeurtenissen komen uit een generator met de seed. Dezelfde revisie, seed en beslissingen geven altijd dezelfde tijdlijn; daarop rust de vergelijking van vertakkingen.', 'Conditions cachées et événements aléatoires proviennent d’un générateur initialisé par la graine. Même révision, même graine et mêmes décisions donnent toujours la même chronologie : c’est ce qui rend la comparaison de branches valable.', 'Las condiciones ocultas y los sucesos aleatorios salen de un generador iniciado con la semilla. Misma revisión, semilla y decisiones dan siempre la misma cronología; en eso se basa la comparación de ramas.', 'Ukryte warunki i zdarzenia losowe pochodzą z generatora uruchomionego ziarnem. Ta sama wersja, ziarno i decyzje zawsze dają tę samą oś czasu; na tym opiera się porównanie gałęzi.'),
    learnOutT: T('Outcomes', 'Результати', 'Ergebnisse', 'Uitkomsten', 'Issues', 'Desenlaces', 'Wyniki'),
    learnOutB: T('Each scenario declares outcome rules, checked in order after every step. Controlled means the scenario’s end condition holds in the model; it is not a statement about a real incident. Reaching the step limit gives an unresolved result that needs review.', 'Кожен сценарій має правила результату, що перевіряються по черзі після кожного кроку. «Під контролем» означає, що умова завершення виконана в моделі, а не твердження про реальний інцидент. Досягнення ліміту кроків дає невирішений результат, що потребує розгляду.', 'Jedes Szenario deklariert Ergebnisregeln, die nach jedem Schritt der Reihe nach geprüft werden. Kontrolliert heißt, dass die Endbedingung im Modell erfüllt ist; es ist keine Aussage über einen echten Vorfall. Die Schrittgrenze ergibt ein ungelöstes Ergebnis, das geprüft werden muss.', 'Elk scenario declareert uitkomstregels die na elke stap op volgorde worden getoetst. Beheerst betekent dat de eindvoorwaarde in het model geldt; het zegt niets over een echt incident. De stappenlimiet geeft een onopgeloste uitkomst die beoordeeld moet worden.', 'Chaque scénario déclare des règles d’issue, vérifiées dans l’ordre après chaque pas. Maîtrisé signifie que la condition de fin est remplie dans le modèle ; ce n’est pas un constat sur un incident réel. La limite de pas donne une issue non résolue à examiner.', 'Cada escenario declara reglas de desenlace que se comprueban en orden tras cada paso. Controlado significa que la condición final se cumple en el modelo; no es una afirmación sobre un incidente real. El límite de pasos da un resultado sin resolver que debe revisarse.', 'Każdy scenariusz deklaruje reguły wyniku sprawdzane kolejno po każdym kroku. Opanowane oznacza spełnienie warunku końcowego w modelu, a nie stwierdzenie o rzeczywistym zdarzeniu. Limit kroków daje wynik nierozstrzygnięty wymagający przeglądu.'),

    learnImgB: T('Scene pictures are illustrations generated with an AI image model, not photographs of a real site; each one shows what the trainee sees at one cue and adds nothing the cue text does not say. Safety signs are the ISO 7010 graphics from public-domain vector files on Wikimedia Commons; the list of sources ships with the tool.', 'Сцени — ілюстрації, згенеровані моделлю ШІ, а не фотографії реального об’єкта; кожна показує те, що бачить учасник на одному сигналі, і не додає нічого понад текст сигналу. Знаки безпеки — графіка ISO 7010 з векторних файлів суспільного надбання з Wikimedia Commons; перелік джерел постачається разом з інструментом.', 'Die Szenenbilder sind mit einem KI-Bildmodell erzeugte Illustrationen, keine Fotos eines echten Standorts; jedes zeigt, was bei einem Hinweis zu sehen ist, und sagt nichts über dessen Text hinaus. Sicherheitszeichen sind die ISO-7010-Grafiken aus gemeinfreien Vektordateien von Wikimedia Commons; die Quellenliste liegt dem Werkzeug bei.', 'De scènes zijn met een AI-beeldmodel gegenereerde illustraties, geen foto’s van een echte locatie; elk toont wat de cursist bij één signaal ziet en zegt niets meer dan de tekst. Veiligheidspictogrammen zijn de ISO 7010-afbeeldingen uit rechtenvrije vectorbestanden van Wikimedia Commons; de bronnenlijst hoort bij de tool.', 'Les scènes sont des illustrations générées par un modèle d’IA, pas des photographies d’un site réel ; chacune montre ce que voit l’apprenant à un signal et n’ajoute rien au texte. Les signaux de sécurité sont les graphismes ISO 7010 issus de fichiers vectoriels du domaine public sur Wikimedia Commons ; la liste des sources accompagne l’outil.', 'Las escenas son ilustraciones generadas con un modelo de IA, no fotografías de un lugar real; cada una muestra lo que ve el alumno en una señal y no añade nada al texto. Las señales de seguridad son los gráficos ISO 7010 de archivos vectoriales de dominio público de Wikimedia Commons; la lista de fuentes acompaña a la herramienta.', 'Sceny to ilustracje wygenerowane modelem AI, a nie zdjęcia rzeczywistego miejsca; każda pokazuje to, co uczestnik widzi przy jednym sygnale, i nie dodaje nic ponad jego tekst. Znaki bezpieczeństwa to grafiki ISO 7010 z plików wektorowych w domenie publicznej z Wikimedia Commons; lista źródeł jest dołączona do narzędzia.'),
