 "summary": {
  "en": "Builds process and technical datasheets for eleven equipment types, with values per operating case in SI, pulls from attached calculations with their trace, consistency rules and revision comparison.",
  "uk": "Складає технологічні й технічні опитувальні листи для одинадцяти типів обладнання: значення за режимами в SI, дані з долучених розрахунків із простежуваністю, правила узгодженості й порівняння ревізій.",
  "de": "Erstellt Prozess- und technische Datenblätter für elf Gerätearten: Werte je Betriebsfall in SI, Übernahme aus angehängten Berechnungen mit Rückverfolgung, Konsistenzregeln und Revisionsvergleich.",

  "fr": "Établit des fiches procédé et techniques pour onze types d’équipement : valeurs par cas de fonctionnement en SI, reprise depuis des calculs rattachés avec traçabilité, règles de cohérence et comparaison des révisions.",

  "pl": "Tworzy procesowe i techniczne karty danych dla jedenastu typów urządzeń: wartości według przypadków pracy w SI, pobieranie z dołączonych obliczeń z powiązaniem, reguły spójności i porównanie rewizji."

 "description": {
  "en": "A datasheet states what one equipment item must do in each operating case and what it must withstand; the purchaser fills it for enquiry, the supplier completes it for order, and it is frozen as built. Eleven built-in templates — centrifugal pump, fan, air handling unit, chiller, plate and shell-and-tube heat exchangers, atmospheric storage tank, control valve, LV induction motor, dry-type transformer and diesel generator set — give every parameter an SI unit, the display units allowed for it and the maturity at which it becomes required. Five operating cases (normal, design, minimum, start-up, emergency) are columns. Fifty-one rules check completeness, domains and units, design pressure and temperature envelopes against the operating envelope, driver and equipment rating against the worst case with the margin the user states, NPSH available minus required against the stated margin, the rated flow against the case range, control-valve opening on the inherent characteristic within 10–90 %, heat balance, temperature order and template scope. Values can be pulled from calculations attached to the project package, keeping the trace calc:<tool>/<record>/<key>, and the sheet reports when the source changed afterwards. Issuing a revision freezes the values; later changes are highlighted against it. The datasheet is written to the equipment-datasheet register of the project package, read by the technical requisition and the package readiness gate.",
  "uk": "Опитувальний лист фіксує, що має робити одна одиниця обладнання в кожному режимі й що вона має витримувати; замовник заповнює його для запиту, постачальник доповнює для замовлення, а після монтажу його фіксують як виконавчий. Одинадцять вбудованих шаблонів — відцентровий насос, вентилятор, припливно-витяжна установка, холодильна машина, пластинчастий і кожухотрубний теплообмінники, атмосферний резервуар, регулюючий клапан, асинхронний двигун НН, сухий трансформатор і дизель-генераторна установка — задають для кожного параметра одиницю SI, дозволені одиниці відображення та стадію, з якої він обов’язковий. П’ять режимів (нормальний, розрахунковий, мінімальний, пусковий, аварійний) є стовпцями. П’ятдесят одне правило перевіряє повноту, області значень і одиниці, розрахункові тиск і температуру проти робочого діапазону, номінал приводу чи обладнання проти найгіршого режиму з запасом, який задає користувач, різницю наявного й необхідного NPSH проти заданого запасу, номінальну витрату проти діапазону режимів, відкриття регулюючого клапана на власній характеристиці в межах 10–90 %, тепловий баланс, порядок температур і межі шаблону. Значення можна брати з розрахунків, долучених до пакета проєкту, зі збереженням сліду calc:<tool>/<record>/<key>; лист повідомляє, коли джерело згодом змінилося. Випуск ревізії фіксує значення, наступні зміни підсвічуються відносно неї. Лист записується до реєстру опитувальних листів у пакеті проєкту, який читають технічна заявка та перевірка готовності пакета.",
  "de": "Ein Datenblatt legt fest, was ein Gerät in jedem Betriebsfall leisten und was es aushalten muss; der Besteller füllt es zur Anfrage, der Lieferant ergänzt es zur Bestellung, und nach dem Bau wird es als Ausführungsstand eingefroren. Elf eingebaute Vorlagen — Kreiselpumpe, Ventilator, RLT-Gerät, Kaltwassersatz, Platten- und Rohrbündelwärmeübertrager, atmosphärischer Lagertank, Stellventil, Niederspannungs-Asynchronmotor, Trockentransformator und Dieselaggregat — geben jedem Parameter eine SI-Einheit, die zulässigen Anzeigeeinheiten und den Reifegrad, ab dem er Pflicht ist. Fünf Betriebsfälle (normal, Auslegung, Minimum, Anfahren, Notfall) bilden die Spalten. Einundfünfzig Regeln prüfen Vollständigkeit, Definitionsbereiche und Einheiten, Auslegungsdruck und -temperatur gegen den Betriebsbereich, Antriebs- und Gerätebemessung gegen den ungünstigsten Fall mit der vom Benutzer angegebenen Reserve, NPSH der Anlage minus NPSH der Pumpe gegen die angegebene Reserve, den Nennförderstrom gegen den Bereich der Fälle, den Stellventilhub auf der inhärenten Kennlinie innerhalb 10–90 %, Wärmebilanz, Temperaturreihenfolge und Geltungsbereich der Vorlage. Werte lassen sich aus Berechnungen übernehmen, die an das Projektpaket angehängt sind; die Spur calc:<tool>/<record>/<key> bleibt erhalten, und das Blatt meldet, wenn sich die Quelle danach ändert. Das Herausgeben einer Revision friert die Werte ein; spätere Änderungen werden ihr gegenüber hervorgehoben. Das Datenblatt wird in das Gerätedatenblatt-Register des Projektpakets geschrieben, das die technische Anfragespezifikation und die Paketbereitschaftsprüfung lesen.",
  "nl": "Een datablad legt vast wat één apparaat in elk bedrijfsgeval moet doen en wat het moet doorstaan; de opdrachtgever vult het in voor de aanvraag, de leverancier vult het aan voor de bestelling, en na de bouw wordt het vastgelegd als uitgevoerd. Elf ingebouwde sjablonen — centrifugaalpomp, ventilator, luchtbehandelingskast, koelmachine, platen- en pijpenbundelwarmtewisselaar, atmosferische opslagtank, regelklep, laagspannings-inductiemotor, droge transformator en dieselaggregaat — geven elke parameter een SI-eenheid, de toegestane weergave-eenheden en de maturiteit waarop hij verplicht wordt. Vijf bedrijfsgevallen (normaal, ontwerp, minimum, opstart, nood) vormen de kolommen. Eenenvijftig regels controleren volledigheid, domeinen en eenheden, ontwerpdruk en -temperatuur tegen het bedrijfsbereik, aandrijvings- en apparaatvermogen tegen het ongunstigste geval met de marge die de gebruiker opgeeft, beschikbare min vereiste NPSH tegen de opgegeven marge, het nominale debiet tegen het bereik van de gevallen, de klepopening op de inherente karakteristiek binnen 10–90 %, warmtebalans, temperatuurvolgorde en toepassingsgebied van het sjabloon. Waarden kunnen worden overgenomen uit berekeningen die aan het projectpakket zijn gekoppeld; het spoor calc:<tool>/<record>/<key> blijft bewaard en het blad meldt wanneer de bron daarna is gewijzigd. Een revisie uitgeven legt de waarden vast; latere wijzigingen worden daartegen gemarkeerd. Het datablad wordt in het databladregister van het projectpakket geschreven, dat de technische aanvraagspecificatie en de pakketgereedheidstoets lezen.",
  "fr": "Une fiche technique énonce ce qu’un équipement doit faire dans chaque cas de fonctionnement et ce à quoi il doit résister ; l’acheteur la remplit pour la consultation, le fournisseur la complète pour la commande, puis elle est figée tel que construit. Onze modèles intégrés — pompe centrifuge, ventilateur, centrale de traitement d’air, groupe d’eau glacée, échangeurs à plaques et tubulaire, réservoir atmosphérique, vanne de régulation, moteur asynchrone BT, transformateur sec et groupe électrogène diesel — donnent à chaque paramètre une unité SI, les unités d’affichage admises et la maturité à partir de laquelle il est exigé. Cinq cas de fonctionnement (normal, dimensionnement, minimum, démarrage, secours) forment les colonnes. Cinquante et une règles contrôlent la complétude, les domaines et les unités, la pression et la température de calcul face à l’enveloppe de service, la puissance de l’entraînement ou de l’équipement face au cas le plus défavorable avec la marge indiquée par l’utilisateur, NPSH disponible moins requis face à la marge indiquée, le débit nominal face à la plage des cas, l’ouverture de la vanne sur sa caractéristique intrinsèque entre 10 et 90 %, le bilan thermique, l’ordre des températures et le domaine du modèle. Les valeurs peuvent être reprises de calculs rattachés au dossier de projet en gardant la trace calc:<tool>/<record>/<key>, et la fiche signale quand la source a changé ensuite. Émettre une révision fige les valeurs ; les modifications ultérieures sont mises en évidence par rapport à elle. La fiche est écrite dans le registre des fiches techniques du dossier de projet, lu par la réquisition technique et le contrôle de préparation des lots.",
  "es": "Una hoja de datos establece lo que un equipo debe hacer en cada caso de operación y lo que debe soportar; el comprador la rellena para la consulta, el proveedor la completa para el pedido y se congela según construido. Once plantillas integradas — bomba centrífuga, ventilador, unidad de tratamiento de aire, enfriadora, intercambiadores de placas y de carcasa y tubos, tanque de almacenamiento atmosférico, válvula de control, motor de inducción de BT, transformador seco y grupo electrógeno diésel — asignan a cada parámetro una unidad SI, las unidades de presentación permitidas y la madurez a partir de la cual es obligatorio. Cinco casos de operación (normal, diseño, mínimo, arranque, emergencia) son las columnas. Cincuenta y una reglas comprueban la integridad, los dominios y las unidades, la presión y la temperatura de diseño frente a la envolvente de operación, la potencia del accionamiento o del equipo frente al caso más desfavorable con el margen que indica el usuario, NPSH disponible menos requerido frente al margen indicado, el caudal nominal frente al rango de los casos, la apertura de la válvula sobre su característica inherente dentro del 10–90 %, el balance térmico, el orden de temperaturas y el alcance de la plantilla. Los valores pueden tomarse de cálculos adjuntos al paquete del proyecto conservando la traza calc:<tool>/<record>/<key>, y la hoja avisa cuando la fuente cambia después. Emitir una revisión congela los valores; los cambios posteriores se resaltan frente a ella. La hoja se escribe en el registro de hojas de datos del paquete del proyecto, que leen la requisición técnica y la verificación de preparación del paquete.",
  "pl": "Karta danych określa, co jedno urządzenie ma robić w każdym przypadku pracy i czemu ma sprostać; zamawiający wypełnia ją do zapytania, dostawca uzupełnia do zamówienia, a po budowie zostaje zamrożona jako powykonawcza. Jedenaście wbudowanych szablonów — pompa wirowa, wentylator, centrala wentylacyjna, agregat wody lodowej, płytowy i płaszczowo-rurowy wymiennik ciepła, atmosferyczny zbiornik magazynowy, zawór regulacyjny, silnik indukcyjny nn, transformator suchy i zespół prądotwórczy diesla — przypisuje każdemu parametrowi jednostkę SI, dozwolone jednostki wyświetlania i etap, od którego jest wymagany. Pięć przypadków pracy (normalny, obliczeniowy, minimalny, rozruch, awaryjny) tworzy kolumny. Pięćdziesiąt jeden reguł sprawdza kompletność, dziedziny i jednostki, ciśnienie i temperaturę obliczeniową względem zakresu roboczego, moc napędu lub urządzenia względem najniekorzystniejszego przypadku z zapasem podanym przez użytkownika, różnicę NPSH dostępnej i wymaganej względem podanego zapasu, przepływ znamionowy względem zakresu przypadków, otwarcie zaworu na charakterystyce wewnętrznej w granicach 10–90 %, bilans cieplny, kolejność temperatur i zakres szablonu. Wartości można pobierać z obliczeń dołączonych do pakietu projektu z zachowaniem śladu calc:<tool>/<record>/<key>, a karta zgłasza, gdy źródło później się zmieni. Wydanie rewizji zamraża wartości; późniejsze zmiany są względem niej wyróżniane. Karta jest zapisywana w rejestrze kart danych pakietu projektu, który czytają techniczna specyfikacja zapytania i kontrola gotowości pakietu."
 },

 "limitations": {
  "en": "A specification-consistency aid, not a selection or sizing program: it computes no pump or fan curve, heat-transfer area, valve trim or transformer loss and only checks the numbers entered or pulled against each other. The eleven templates are author method informed by API 610 (12th ed.) datasheet practice, EN 13053:2019, IEC 60034-1:2022, IEC 60076-11:2018 and ISO 8528-1:2018; they reproduce no published form and are not complete against one, so a project or purchaser form stays authoritative. Margins (driver, NPSH, capacity) are user inputs with no default and no claimed code value. The control-valve check covers liquid, turbulent, non-choked flow with piping geometry factor 1 and an ideal inherent characteristic; gas, steam, two-phase, flashing, cavitation, choked flow, installed characteristic and noise are out of scope. Heat-exchanger temperature checks assume counter-current terminal differences; F-factor, temperature cross and phase change are not assessed. Pressures are gauge unless the key ends in _abs, and the maximum operating pressure is the largest value entered for the listed operating pressures, with no static head reconstructed. A pulled value is a copy with a trace: the tool detects a changed source record and does not re-run the source tool. Rating checks assume continuous duty (S1). The permalink carries one datasheet and its previous-revision snapshot; the revision history and the package travel only in the package file.",
  "uk": "Засіб перевірки узгодженості специфікації, а не програма підбору чи розрахунку розмірів: він не будує характеристик насоса чи вентилятора, не рахує площі теплообміну, затвора клапана чи втрат трансформатора, а лише зіставляє введені або взяті значення між собою. Одинадцять шаблонів — авторська методика з урахуванням практики опитувальних листів API 610 (12-те вид.), EN 13053:2019, IEC 60034-1:2022, IEC 60076-11:2018 та ISO 8528-1:2018; вони не відтворюють жодної опублікованої форми й не повні щодо неї, тож визначальною лишається форма проєкту чи замовника. Запаси (приводу, NPSH, продуктивності) вводить користувач; значень за замовчуванням і нормативних значень інструмент не пропонує. Перевірка регулюючого клапана охоплює рідину в турбулентному режимі без запирання, коефіцієнт трубопровідної геометрії 1 та ідеальну власну характеристику; газ, пара, двофазні потоки, скипання, кавітація, запирання, робоча характеристика й шум виходять за межі. Температурні перевірки теплообмінників припускають протитечію; поправка F, перетин температур і фазовий перехід не оцінюються. Тиски надлишкові, якщо ключ не закінчується на _abs; максимальний робочий тиск — найбільше введене значення з переліку робочих тисків, гідростатика не відновлюється. Взяте значення — копія зі слідом: інструмент виявляє зміну вихідного запису, але не перераховує вихідний інструмент. Перевірки номіналу припускають тривалий режим S1. Постійне посилання містить один лист і знімок попередньої ревізії; історія ревізій і пакет передаються лише у файлі пакета.",
  "de": "Eine Hilfe zur Konsistenz einer Spezifikation, kein Auswahl- oder Auslegungsprogramm: Es berechnet keine Pumpen- oder Ventilatorkennlinie, keine Wärmeübertragungsfläche, keine Ventilgarnitur und keine Transformatorverluste, sondern prüft nur die eingegebenen oder übernommenen Zahlen gegeneinander. Die elf Vorlagen sind eine Methode des Autors in Anlehnung an die Datenblattpraxis von API 610 (12. Ausg.), EN 13053:2019, IEC 60034-1:2022, IEC 60076-11:2018 und ISO 8528-1:2018; sie geben kein veröffentlichtes Formblatt wieder und sind ihm gegenüber nicht vollständig, maßgebend bleibt das Formblatt des Projekts oder Bestellers. Reserven (Antrieb, NPSH, Leistung) sind Benutzereingaben ohne Vorgabewert und ohne behaupteten Normwert. Die Stellventilprüfung gilt für Flüssigkeit, turbulent, ohne Verblockung, Rohrleitungsgeometriefaktor 1 und ideale inhärente Kennlinie; Gas, Dampf, Zweiphasenströmung, Ausdampfung, Kavitation, Verblockung, Betriebskennlinie und Geräusch liegen außerhalb. Temperaturprüfungen an Wärmeübertragern setzen Gegenstrom voraus; F-Faktor, Temperaturkreuzung und Phasenwechsel werden nicht bewertet. Drücke sind Überdrücke, sofern der Schlüssel nicht auf _abs endet; der maximale Betriebsdruck ist der größte eingegebene Wert der aufgeführten Betriebsdrücke, eine Höhendifferenz wird nicht rekonstruiert. Ein übernommener Wert ist eine Kopie mit Spur: Das Werkzeug erkennt einen geänderten Quelldatensatz und rechnet das Quellwerkzeug nicht neu. Leistungsprüfungen setzen Dauerbetrieb (S1) voraus. Der Permalink trägt ein Datenblatt und den Stand der vorigen Revision; Revisionsverlauf und Paket reisen nur in der Paketdatei.",
  "nl": "Een hulpmiddel voor de consistentie van een specificatie, geen selectie- of dimensioneringsprogramma: het berekent geen pomp- of ventilatorkarakteristiek, geen warmtewisselend oppervlak, geen kleptrim en geen transformatorverlies, en toetst alleen de ingevoerde of overgenomen getallen onderling. De elf sjablonen zijn een methode van de auteur, geïnformeerd door de databladpraktijk van API 610 (12e ed.), EN 13053:2019, IEC 60034-1:2022, IEC 60076-11:2018 en ISO 8528-1:2018; ze geven geen gepubliceerd formulier weer en zijn daartegen niet volledig, dus het formulier van project of opdrachtgever blijft bepalend. Marges (aandrijving, NPSH, capaciteit) zijn invoer van de gebruiker zonder standaardwaarde en zonder geclaimde normwaarde. De regelklepcontrole geldt voor vloeistof, turbulent, zonder gesmoorde stroming, leidinggeometriefactor 1 en een ideale inherente karakteristiek; gas, stoom, tweefasenstroming, flashing, cavitatie, gesmoorde stroming, geïnstalleerde karakteristiek en geluid vallen erbuiten. Temperatuurcontroles van warmtewisselaars gaan uit van tegenstroom; F-factor, temperatuurkruising en faseovergang worden niet beoordeeld. Drukken zijn overdruk tenzij de sleutel op _abs eindigt; de maximale bedrijfsdruk is de grootste ingevoerde waarde van de genoemde bedrijfsdrukken, zonder reconstructie van statische hoogte. Een overgenomen waarde is een kopie met spoor: de tool ziet een gewijzigd bronrecord en rekent de brontool niet opnieuw door. Vermogenscontroles gaan uit van continubedrijf (S1). De permalink draagt één datablad met de stand van de vorige revisie; revisiegeschiedenis en pakket reizen alleen in het pakketbestand.",
  "fr": "Une aide à la cohérence d’une spécification, non un programme de sélection ou de dimensionnement : il ne calcule ni courbe de pompe ou de ventilateur, ni surface d’échange, ni garniture de vanne, ni pertes de transformateur, et ne fait que confronter entre eux les nombres saisis ou repris. Les onze modèles relèvent de la méthode de l’auteur, éclairée par la pratique des fiches de l’API 610 (12e éd.), l’EN 13053:2019, l’IEC 60034-1:2022, l’IEC 60076-11:2018 et l’ISO 8528-1:2018 ; ils ne reproduisent aucun formulaire publié et ne sont pas complets par rapport à lui, le formulaire du projet ou de l’acheteur fait foi. Les marges (entraînement, NPSH, puissance) sont des saisies de l’utilisateur, sans valeur par défaut ni valeur normative revendiquée. Le contrôle de vanne couvre le liquide en écoulement turbulent non engorgé, facteur de géométrie de tuyauterie 1 et caractéristique intrinsèque idéale ; gaz, vapeur, diphasique, vaporisation, cavitation, engorgement, caractéristique installée et bruit sont hors domaine. Les contrôles de température des échangeurs supposent un contre-courant ; facteur F, croisement de températures et changement de phase ne sont pas évalués. Les pressions sont relatives sauf clé terminée par _abs ; la pression de service maximale est la plus grande valeur saisie parmi les pressions de service listées, sans reconstitution de hauteur statique. Une valeur reprise est une copie avec trace : l’outil détecte un enregistrement source modifié et ne relance pas l’outil source. Les contrôles de puissance supposent un service continu (S1). Le lien permanent porte une fiche et l’état de la révision précédente ; l’historique des révisions et le dossier ne voyagent que dans le fichier du dossier.",
  "es": "Una ayuda para la coherencia de una especificación, no un programa de selección ni de dimensionado: no calcula curvas de bomba o ventilador, superficie de intercambio, guarnición de válvula ni pérdidas de transformador, y solo contrasta entre sí los números introducidos o tomados. Las once plantillas son método del autor inspirado en la práctica de hojas de datos de API 610 (12.ª ed.), EN 13053:2019, IEC 60034-1:2022, IEC 60076-11:2018 e ISO 8528-1:2018; no reproducen ningún formulario publicado ni son completas frente a él, así que prevalece el formulario del proyecto o del comprador. Los márgenes (accionamiento, NPSH, capacidad) son datos del usuario sin valor por defecto ni valor normativo declarado. La comprobación de válvula cubre líquido en régimen turbulento sin bloqueo, factor de geometría de tubería 1 y característica inherente ideal; gas, vapor, bifásico, vaporización instantánea, cavitación, bloqueo, característica instalada y ruido quedan fuera. Las comprobaciones de temperatura de intercambiadores suponen contracorriente; factor F, cruce de temperaturas y cambio de fase no se evalúan. Las presiones son manométricas salvo que la clave termine en _abs; la presión de servicio máxima es el mayor valor introducido de las presiones de servicio indicadas, sin reconstruir altura estática. Un valor tomado es una copia con traza: la herramienta detecta un registro de origen modificado y no vuelve a ejecutar la herramienta de origen. Las comprobaciones de potencia suponen servicio continuo (S1). El enlace permanente lleva una hoja y la instantánea de la revisión anterior; el historial de revisiones y el paquete viajan solo en el archivo del paquete.",
  "pl": "Narzędzie do kontroli spójności specyfikacji, a nie program doboru ani wymiarowania: nie wyznacza charakterystyki pompy ani wentylatora, powierzchni wymiany ciepła, elementów dławiących zaworu ani strat transformatora, a jedynie porównuje ze sobą wprowadzone lub pobrane liczby. Jedenaście szablonów to metoda autora oparta na praktyce kart danych API 610 (wyd. 12), EN 13053:2019, IEC 60034-1:2022, IEC 60076-11:2018 i ISO 8528-1:2018; nie odtwarzają żadnego opublikowanego formularza i nie są wobec niego kompletne, rozstrzyga formularz projektu lub zamawiającego. Zapasy (napędu, NPSH, mocy) podaje użytkownik; nie ma wartości domyślnych ani deklarowanych wartości normowych. Kontrola zaworu obejmuje ciecz w przepływie turbulentnym bez dławienia krytycznego, współczynnik geometrii rurociągu 1 i idealną charakterystykę wewnętrzną; gaz, para, przepływ dwufazowy, odparowanie, kawitacja, dławienie, charakterystyka zainstalowana i hałas są poza zakresem. Kontrole temperatur wymienników zakładają przeciwprąd; współczynnik F, krzyżowanie temperatur i przemiana fazowa nie są oceniane. Ciśnienia są nadciśnieniami, chyba że klucz kończy się na _abs; maksymalne ciśnienie robocze to największa wprowadzona wartość wymienionych ciśnień roboczych, bez odtwarzania wysokości statycznej. Pobrana wartość to kopia ze śladem: narzędzie wykrywa zmianę rekordu źródłowego, ale nie uruchamia ponownie narzędzia źródłowego. Kontrole mocy zakładają pracę ciągłą (S1). Link stały przenosi jedną kartę i stan poprzedniej rewizji; historia rewizji i pakiet są przenoszone tylko w pliku pakietu."
 },

   "uk": "Сторінку оцінює benchmarks/equipmentdatasheet.reference.json — еталонний корпус, укладений іншим агентом за публічною специфікацією та наведеними в ній стандартами, без доступу до цього коду, згодом виправлений і розширений незалежним арбітражем. window.__dgcBenchmark() переносить кожен інструментонезалежний випадок у власний стан інструмента й перераховує кожну перевірку на чинній збірці: 105 із 105 випадків проходять, жоден не позначено. Корпус задіює 50 із 51 правила перевірки, усі одинадцять шаблонів і п'ять пресетів; EQU-R-060 (довжина постійного посилання) не має випадку, бо залежить від кодувальника. Допуски випливають з арифметики: точна рівність для всіх категорійних і цілих виходів, відносний 1e-12 для збереженого значення в СІ, відносний 1e-9 для номіналу, NPSH, клапана й теплового балансу — це власний епсилон інструмента. Це авторський стенд проти незалежного еталона, а не незалежна валідація.",
   "de": "Die Seite wird gegen benchmarks/equipmentdatasheet.reference.json bewertet, einen Referenzkorpus, den ein anderer Agent aus der öffentlichen Spezifikation und den dort zitierten Normen ohne Zugriff auf diesen Code erstellt hat und den eine unabhängige Schlichtung danach korrigiert und erweitert hat. window.__dgcBenchmark() bildet jeden werkzeugneutralen Fall auf den eigenen Zustand ab und rechnet jede Prüfung auf dem ausgelieferten Build neu: 105 von 105 Fällen bestehen, keiner ist markiert. Der Korpus übt 50 der 51 Prüfregeln, alle elf Vorlagen und die fünf Voreinstellungen; EQU-R-060 (Permalink-Länge) hat keinen Fall, weil sie vom Kodierer abhängt. Die Toleranzen folgen der Arithmetik: exakt für jede kategoriale und ganzzahlige Ausgabe, relativ 1e-12 für einen gespeicherten SI-Wert, relativ 1e-9 für Leistungs-, NPSH-, Ventil- und Bilanzgrößen, was dem eigenen Epsilon des Werkzeugs entspricht. Das ist der Prüfstand des Autors gegen eine unabhängige Referenz, keine unabhängige Validierung.",
   "nl": "De pagina wordt getoetst aan benchmarks/equipmentdatasheet.reference.json, een referentiecorpus dat een andere agent schreef uit de openbare specificatie en de daarin genoemde normen, zonder toegang tot deze code, daarna gecorrigeerd en uitgebreid door een onafhankelijke arbitrage. window.__dgcBenchmark() zet elk toolneutraal geval om in de eigen toestand en herberekent elke controle op de uitgeleverde build: 105 van de 105 gevallen slagen en geen enkel geval is gemarkeerd. Het corpus beproeft 50 van de 51 controleregels, alle elf sjablonen en de vijf voorinstellingen; EQU-R-060 (lengte van de permalink) heeft geen geval, want die hangt van de codeerder af. De toleranties volgen uit de rekenkunde: exact voor elke categorale en gehele uitvoer, relatief 1e-12 voor een opgeslagen SI-waarde, relatief 1e-9 voor de vermogens-, NPSH-, klep- en balansgetallen, wat de eigen epsilon van de tool is. Dit is de eigen testbank van de auteur tegen een onafhankelijke referentie, geen onafhankelijke validatie.",
   "fr": "La page est notée face à benchmarks/equipmentdatasheet.reference.json, un corpus de référence rédigé par un autre agent à partir de la spécification publique et des normes qu'elle cite, sans accès à ce code, puis corrigé et étendu par un arbitrage indépendant. window.__dgcBenchmark() transpose chaque cas neutre dans l'état propre de l'outil et recalcule chaque contrôle sur la version livrée : 105 cas sur 105 passent et aucun n'est signalé. Le corpus exerce 50 des 51 règles de revue, les onze modèles et les cinq préréglages ; EQU-R-060 (longueur du lien permanent) n'a pas de cas, car elle dépend de l'encodeur. Les tolérances viennent de l'arithmétique : exactitude pour toute sortie catégorielle ou entière, relative 1e-12 pour une valeur SI stockée, relative 1e-9 pour les grandeurs de puissance, de NPSH, de vanne et de bilan, soit l'epsilon propre de l'outil. C'est le banc d'essai de l'auteur face à une référence indépendante, non une validation indépendante.",
   "es": "La página se califica frente a benchmarks/equipmentdatasheet.reference.json, un corpus de referencia redactado por otro agente a partir de la especificación pública y de las normas que cita, sin acceso a este código, y corregido y ampliado después por un arbitraje independiente. window.__dgcBenchmark() traslada cada caso neutro al estado propio de la herramienta y recalcula cada comprobación sobre la compilación publicada: pasan 105 de 105 casos y ninguno queda señalado. El corpus ejercita 50 de las 51 reglas de revisión, las once plantillas y los cinco preajustes; EQU-R-060 (longitud del enlace permanente) no tiene caso, porque depende del codificador. Las tolerancias salen de la aritmética: exactitud para toda salida categórica o entera, relativa 1e-12 para un valor SI almacenado, relativa 1e-9 para las cifras de potencia, NPSH, válvula y balance, que es el epsilon propio de la herramienta. Este es el banco del autor frente a una referencia independiente, no una validación independiente.",

  /* ================================================================ 1. the model
     Pure functions: no DOM, no strings for the screen except through the
     dictionaries above. Every stored physical value is SI (spec §3.2). */

  var SCHEMA_STATE = 'equipmentdatasheet/state/1';
  var TEMPLATE_REVISION = 'EQU-T-1';
  var EPS = 1e-9;
  var CASES = ['normal', 'design', 'minimum', 'startup', 'emergency'];
  var MATURITIES = ['enquiry', 'order', 'as_built'];
  var SEVS = ['blocker', 'major', 'minor', 'info'];

  /* §4.1 comparison helpers, relative tolerance EPS.
     The relative form is arithmetic on ±Infinity: a − b and EPS·sab(a, b) are
     both −Infinity / Infinity, so GE(1, Infinity) came back true and a rating
     compared against an overflowed requirement passed silently. A non-finite
     operand therefore falls back to the exact comparison, which makes
     GE(x, Infinity) false for every finite x and NaN false on both sides. */
  function sab(a, b) { return Math.max(Math.abs(a), Math.abs(b)); }
  function GE(a, b) { return (isFinite(a) && isFinite(b)) ? a - b >= -EPS * sab(a, b) : a >= b; }
  function LE(a, b) { return GE(b, a); }
  function LT(a, b) { return (isFinite(a) && isFinite(b)) ? b - a > EPS * sab(a, b) : a < b; }

  /* ---- pull dialog (§7.1) ------------------------------------------------ */
  function calcEntries() {
    var out = [];
    var c = PKG.loaded && PKG.doc && PKG.doc.calculations;
    if (!c || typeof c !== 'object' || Array.isArray(c)) return out;
    Object.keys(c).forEach(function (toolId) {
      (Array.isArray(c[toolId]) ? c[toolId] : []).forEach(function (e) {
        if (e && typeof e === 'object' && e.id) out.push({ tool: toolId, entry: e });
      });
    });
    /* records naming this tag or package first (§7.1) */
    var tag = state.sheet.tag, pkgId = state.sheet.package_id;
    out.sort(function (a, b) {
      var sa = ((a.entry.tag && a.entry.tag === tag) ? 2 : 0) + ((pkgId && a.entry.package_id === pkgId) ? 1 : 0);
      var sb = ((b.entry.tag && b.entry.tag === tag) ? 2 : 0) + ((pkgId && b.entry.package_id === pkgId) ? 1 : 0);
      return sb - sa;
    });
    return out;
  }
  function applyUpdate(slot) {
    var e = state.values[slot], pl = e && e.pull;
    if (!pl) return;
    var list = PKG.loaded && PKG.doc && PKG.doc.calculations ? PKG.doc.calculations[pl.tool] : null;
    var entry = Array.isArray(list) ? list.filter(function (x) { return x && x.id === pl.record_id; })[0] : null;
    if (!entry) { say(Lf(RULES['EQU-R-030'].msg, { p: pLabel(splitSlot(slot).key), c: '', rec: pl.record_id }), 'err'); return; }
    var T0 = tpl(state.sheet.equipment_type), p = T0 && T0.byKey[splitSlot(slot).key];
    if (!p) return;
    var made = makePull(pl.tool, entry, pl.key, p, pl.raw_unit, nowIso());
    if (made.error) { say(L(S.pNoLeaf), 'err'); return; }
    ask(L(S.pullT), Lf(S.pOldNew, { old: fmtParamValue(p, e.v), 'new': fmtParamValue(p, made.entry.v) }), function () {
      state.values[slot] = made.entry;
      touch();
      if (ui) { ui.sync(); ui.run(); }
      say(Lf(S.updated, { p: pLabel(p.key), src: made.entry.src }));
    });
  }
  function nowIso() { try { return new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'); } catch (e) { return ''; } }

          o.value = p.key; parSel.appendChild(o);

      function fillCases() {

        caseSel.disabled = false;

    DiagramUI.dialog({ title: L(S.pullT), body: body, actions: [
      { label: L(S.cancel), variant: 'ghost', run: function () {} },
      { label: L(S.pullDo), variant: 'primary', run: function () {
        var x = entries[sel.idx], p = sel.param && T0.byKey[sel.param];
        if (!x || !p || !sel.leaf) return;
        var made = makePull(x.tool, x.entry, sel.leaf, p, sel.unit, nowIso());

        if (made.error) { say(L(S.pNoLeaf), 'err'); return; }
        var slot = slotKey(p.key, p.sc === 'C' ? (sel.kase || 'design') : null);
        var cur = state.values[slot];
        var put = function () {
          state.values[slot] = made.entry;
          touch();
          if (ui) { ui.sync(); ui.run(); }
          say(Lf(S.pulled, { p: pLabel(p.key, T0), src: made.entry.src }));
        };
        if (cur && !absent(cur.v)) ask(L(S.pullT), Lf(S.pOldNew, { old: fmtParamValue(p, cur.v), 'new': fmtParamValue(p, made.entry.v) }), put);
        else put();
      } }
    ] });
  }

  /* ---- the package panel ------------------------------------------------- */
  function paintPackage(box) {
    clear(box);
    var lines = [];
    if (!PKG_OK()) lines.push(Pt('storageOff'));
    else {
      var m = null;
      try { m = DiagramProject.peek(); } catch (e) { m = null; }
      if (m) lines.push(Pt('available', { project: m.project || '—', rev: m.revision, when: String(m.updated_at || '').replace('T', ' ').replace('Z', ' UTC') }));
      /* peek() answers null for an empty store and for a store that throws.
         The runtime's own probe separates the two, so a broken localStorage is
         named as such instead of being reported as "no package available". */
      else lines.push(Pt(storeReadable() ? 'none' : 'storageOff'));
    }
    lines.concat(PKG.msgs).forEach(function (t) { box.appendChild(note(t)); });
    if (!PKG.loaded) return;
    /* the register this tool owns */
    box.appendChild(mk('div', 'font-weight:600;margin:.6em 0 .3em', L(S.regTitle)));
    if (!PKG.register.length) box.appendChild(note(L(S.regEmpty)));
    else {
      var w = mk('div', CSS.wrap), t = mk('table', CSS.tbl), hr = mk('tr');
      [L(S.tag), 'id', L(S.eqType), L(S.rev), L(S.maturity), L(S.tVerdict), L(S.flagsT), ''].forEach(function (x) { hr.appendChild(mk('th', CSS.th, x)); });
      t.appendChild(hr);
      PKG.register.forEach(function (it) {
        if (!it || typeof it !== 'object') return;
        var tr = mk('tr');
        /* a 40-character KKS tag is one unbroken token; without a break
           opportunity the register table pushed the page sideways */
        tr.appendChild(mk('td', CSS.td + ';overflow-wrap:anywhere', str(it.tag) || '—'));
        tr.appendChild(mk('td', CSS.td + ';overflow-wrap:anywhere', str(it.id)));
        tr.appendChild(mk('td', CSS.td, TYPE_LABEL[it.equipment_type] ? L(TYPE_LABEL[it.equipment_type]) : str(it.equipment_type)));
        /* `revision` is the label; an item written before §7.2 carried an object. */
        tr.appendChild(mk('td', CSS.td, revLabel(it) || '—'));
        tr.appendChild(mk('td', CSS.td, MAT_LABEL[it.maturity] ? L(MAT_LABEL[it.maturity]) : str(it.maturity)));
        /* the verdict is a fixed vocabulary this tool writes, so it is rendered
           in the page language; a value from outside the vocabulary prints
           verbatim */
        tr.appendChild(mk('td', CSS.td, VERDICT_LABEL[it.verdict]
          ? Lf(VERDICT_LABEL[it.verdict], { m: L(MAT_LABEL[it.maturity] || MAT_LABEL.enquiry) })
          : str(it.verdict)));
        var flags = (PKG.doc && Array.isArray(PKG.doc.flags) ? PKG.doc.flags : []).filter(function (f) {
          return f && f.target_kind === 'equipment_datasheet' && String(f.target_id) === String(it.id);
        });
        /* TZ-project-package section 2.3: an item shown with a flag carries the
           flag, the reason and who raised it. The column held the count alone,
           which put both one Open click away. */
        var ftd = mk('td', CSS.flagCell);
        flags.forEach(function (f) {
          ftd.appendChild(mk('div', '', Lf(S.flagRow, {
            flag: str(f.flag), reason: str(f.reason), by: str(f.raised_by), at: str(f.raised_at),
            rev: f.raised_against_revision == null ? '—' : String(f.raised_against_revision)
          })));
        });
        tr.appendChild(ftd);
        var td = mk('td', CSS.td), b = mk('button', CSS.btn, L(S.open));
        b.type = 'button';
        b.addEventListener('click', function () { pkgOpenItem(it); });
        td.appendChild(b); tr.appendChild(td);
        t.appendChild(tr);
      });
      w.appendChild(t); box.appendChild(w);
    }
    /* flags: shown, attributed, with no control that would edit them */
    var fl = last ? last.findings.filter(function (f) { return f.rule === 'EQU-R-050' || f.rule === 'EQU-R-051' || f.rule === 'EQU-R-052'; }) : [];
    if (fl.length) {
      box.appendChild(mk('div', 'font-weight:600;margin:.6em 0 .3em', L(S.flagsT)));
      /* the orphan lead is a heading over the group, not a prefix repeated on
         every row (AGENTS section 4.1: nothing said twice in one document) */
      var flRow = function (f) {
        var n = note(Lf(S.flagRow, f.vars));
        if (f.rule === 'EQU-R-050') n.style.color = 'var(--warn)';
        box.appendChild(n);
      };
      fl.filter(function (f) { return f.rule !== 'EQU-R-052'; }).forEach(flRow);
      var orphans = fl.filter(function (f) { return f.rule === 'EQU-R-052'; });
      if (orphans.length) {
        box.appendChild(mk('div', 'font-weight:600;margin:.5em 0 .2em', L(S.orphanT)));

    var nu = [];

    box.appendChild(note(nu.length ? nu.join(' · ') : Pt('ignoredNone')));
  }

    PKG.dirty = false;

  var MODEL = { evaluate: evaluate, normState: normState, TEMPLATES: TEMPLATES, PRESETS: PRESETS,
    itemFromState: itemFromState, stateFromItem: stateFromItem, selfTests: selfTests,
    benchState: benchState, runBenchCase: runBenchCase, toSI: toSI, fromSI: fromSI };

  function installData() {
    if (!window.Diagram) return;
    Diagram.init({
      id: 'equipmentdatasheet',
      file: 'equipmentdatasheet.html',
      state: { serialize: serialize, deserialize: deserialize },
      record: dgcRecord,
      python: dgcPython,
      report: { profile: dgcProfile, sections: dgcSections }
    });
  }
  function boot() {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      if (LANGS.indexOf(q) >= 0 && window.Diagram && Diagram.setDocumentLang) Diagram.setDocumentLang(q);
    } catch (e) {}
    /* The default sheet was seeded while the module loaded, before the framework
       could resolve the domain language, so its free text is seeded again here:
       a reader who selected Ukrainian in an earlier session and arrives without
       ?lang= would otherwise read the English seed. */
    adoptSheet(normState(PRESETS[0].build()));
    if (window.DiagramUI && DiagramUI.api === 'tools.petrov.re/ui/v1') buildInterface();
    else degrade();
    installData();
  }
  window.__dgcBenchmark = benchmarkArtifact;
  window.__edsTests = selfTests;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
