   outdoor air, cooling, electrical demand), the evidence held for each discipline, open items and actions. Never a
   compliance certificate: incomplete data or a missing profile keep the result from a positive state. */

var BC_TOOL = { structure: null, egress: null, fire: null, ventilation: 'ventilation.html', hvac: 'wallthermalcalculator.html', electrical: 'loadlist.html', acoustics: 'roomacoustics.html', accessibility: null };

5 mm, і вона вміщується в 900 mm.","exProblem":"Майстерня без профілю і без пожежної стратегії (проблема)","exProblemNote":"Немає юрисдикції чи редакції і немає доказів щодо пожежного захисту: перевірки потужності не оцінюються, і скринінг залишається неповним.","exTry":"Спроба: технічне приміщення стає постійним робочим місцем","exTryNote":"Двоє людей у технічному приміщенні площею 40 m²: запущено всі 8 дисциплін; зовнішнього повітря 60 проти 20 l/s і охолодження 1,2 проти 0,5 kW недостатньо, шість дисциплін не мають доказів.","exFix":"Виправлено: кожну запущену дисципліну перевірено","exFixNote":"Забезпечено 70 l/s повітря і 1,5 kW охолодження, усі докази задокументовано: дефіциту немає, скринінг завершено.","learnIntroTitle":"Які перевірки запускає нове призначення","learnIntro":"Зміна призначення може запустити перевірки у восьми дисциплінах. Інструмент перелічує їх із причинами, порівнює потужності зі значеннями вибраного профілю і залишає прогалини в доказах видимими.","learnDataTitle":"Призначення і кількість людей","learnData":"Введіть поточне й нове призначення, площу, поверхи, кількість людей і що ще змінюється (постійні робочі місця, доступ відвідувачів, режим роботи, процес, шум). Група використання (низька заповненість, перебування людей, публічне використання, технологічний процес) визначає більшість причин запуску.","learnModelTitle":"Значення профілю","learnModel":"Нормовані значення (навантаження на перекриття, ширина виходу на одну людину, зовнішнє повітря, тепловиділення, електричне навантаження) беруться з вибраних юрисдикції та редакції; без них перевірки потужності не оцінюються.","learnTryTitle":"Спроба","learnTry":"Перш ніж відкрити матрицю, назвіть дисципліни, яких стосується перетворення технічного приміщення на постійне робоче місце для двох людей; потім відкрийте «Спроба».","learnExplainTitle":"Чому так багато","learnExplain":"Приміщення переходить із групи низької заповненості до групи з перебуванням людей: сама зміна групи запускає евакуаційні шляхи, вентиляцію, опалення та охолодження, акустику і доступність; нове призначення запускає конструкції та пожежний захист; більша кількість людей запускає електропостачання.","learnFixTitle":"Виправлення","learnFix":"Відкрийте «Виправлено»: із 70 l/s зовнішнього повітря, 1,5 kW охолодження та задокументованими доказами кожну запущену дисципліну перевірено без дефіциту.","learnBoundaryTitle":"Скринінг і затвердження","learnBoundary":"Матриця показує, які перевірки потрібні і де бракує даних; відповідність і затвердження нового призначення залишаються за відповідальним фахівцем і прив'язані до вхідних даних.","eqNote":"Позначення: N₁ — кількість людей за нового призначення; N — кількість людей; A — площа підлоги; w_p — ширина виходу на одну людину; W_min — мінімальна ширина виходу; W_r, Q_r — потрібні ширина виходу та зовнішнє повітря; q_p, q_A — зовнішнє повітря на одну людину та на одиницю площі; g_p, g_A — тепловиділення на одну людину та на одиницю площі; p_A — електричне навантаження на одиницю площі; P_c, P_e — потреба в охолодженні та електричне навантаження; X_r, X_a — потрібна та наявна потужність; m — запас; ρ — щільність людей. n_r — потрібна кількість виходів; N_t — кількість людей, понад яку потрібні два виходи; L, L_max — довжина шляху евакуації та її межа. N_t3 — кількість людей, понад яку потрібні три виходи; L_1 — межа для евакуації в одному напрямку.","modelText":"Площі в m², навантаження в kN/m², ширини в mm, повітря в l/s, потужність у kW; нормовані значення вводять із вибраного профілю, жодне з них не вбудоване.","boundaryText":"Інструмент виконує скринінг і не видає сертифіката відповідності; юрисдикції не змішуються, а затвердження є окремим рішенням, прив'язаним до вхідних даних.","scopeText":"Скринінг зміни призначення за дисциплінами; сертифікатом відповідності він не є. Вбудовані приклади синтетичні.","refProfile":"Нормовані значення з вибраних юрисдикції та редакції, введені користувачем","refScreen":"Застосовність дисциплін за групою використання, кількістю людей і заявленими змінами","ev_unknown":"не задокументовано","use_residential":"житло","use_hotel":"готель або нічліг","grp_sleeping":"нічне перебування","rs_sleeping":"люди ночують у приміщеннях","f_exit_width_min":"Мінімальна ширина виходу","use_flats":"квартири (кілька житлових одиниць)","use_institutional":"заклад догляду або лікарня","grp_care":"догляд (евакуація з допомогою)","rs_assisted_evacuation":"людям потрібна допомога для евакуації","rs_separating_elements":"розділювальні стіни й перекриття стають предметом вимог","rs_high_rise":"верхній поверх вище граничної висоти","rs_partial":"змінюється призначення лише частини будівлі","q_exit_count":"Кількість виходів","q_travel_distance":"Довжина шляху евакуації","f_building_area":"Площа всієї будівлі (часткова зміна)","f_top_floor_height":"Висота верхнього поверху над землею","f_height_threshold":"Порогова висота для додаткових протипожежних заходів","f_exit_count":"Наявні виходи","f_exit_count_threshold":"Кількість людей, понад яку потрібні два виходи","f_travel_distance":"Найдовший шлях до виходу","f_travel_distance_max":"Найбільша довжина шляху, евакуація в кількох напрямках","w_height_not_given":"Кілька поверхів без висоти верхнього поверху: заходи, що залежать від висоти, не перевірено.","exitsUnit":"виходів","limActual":"межа ≥ фактично","exHotel":"Частина житлового будинку стає готелем","exHotelNote":"Житло → готель на 400 з 1 200 м², 4 поверхи, верхній поверх на 10,5 м: розділювальні стіни й перекриття вводять акустику (доказ відкритий), часткова зміна вводить пожежну безпеку й евакуацію, а шлях 52 м перевищує межу 45 м.","rs_unit_count_change":"змінюється кількість квартир або житлових кімнат","rs_access_scope":"до нового призначення застосовуються вимоги доступності (готель або заклад)","f_units_old":"Квартири або житлові кімнати, зараз","f_units_new":"Квартири або житлові кімнати, нові","f_exit_count_threshold_3":"Кількість людей, понад яку потрібні три виходи","f_trave muss positiv sein.","b_storeys_invalid":"Die Anzahl der Geschosse muss eine ganze Zahl von mindestens 1 sein.","b_occupants_invalid":"Die Anzahl der Personen muss eine ganze Zahl von mindestens 0 sein.","b_value_invalid":"Ein Kapazitäts- oder Profilwert ist negativ.","g_check_data_missing":"Der Kapazitätsprüfung fehlt ein geforderter oder verfügbarer Wert.","g_evidence_unknown":"Für dieses ausgelöste Fachgebiet ist kein Nachweis erfasst.","g_na_reason_missing":"Als nicht zutreffend markiert, ohne Grund.","g_profile_missing":"Kein Rechtsraum oder keine Ausgabe gewählt: Es wird keine Kapazitätsprüfung ausgewertet.","g_data_source_missing":"Quelle oder Revision der Bestandsaufnahme fehlt.","g_data_unconfirmed":"Der Status der Gebäudedaten ist unbekannt.","w_no_trigger":"Kein Fachgebiet ist ausgelöst; das Ergebnis gilt nur für die angegebenen Daten.","w_vertical_escape_not_checked":"Mehrere Geschosse: Treppenkapazität und vertikale Rettungswege werden hier nicht geprüft.","w_estimated_data":"Die Gebäudedaten sind als geschätzt markiert.","w_continue_in_tool":"Detaillierte Prüfung in","w_compliance_outside_model":"Nur Screening: Die Konformität stellt die verantwortliche Fachperson nach den geltenden Regeln fest.","w_restored_values":"Gespeicherte Werte wurden beim Laden ersetzt: ","a_select_use":"bisherige und neue Nutzung auswählen","a_correct_input":"die Eingaben korrigieren","a_enter_check_values":"geforderten und verfügbaren Wert eingeben","a_survey_evidence":"den Bestand erheben und dokumentieren","a_record_na_reason":"festhalten, warum das Fachgebiet nicht zutrifft","a_select_profile":"Rechtsraum und Ausgabe auswählen","a_record_data_source":"Quelle und Revision der Bestandsaufnahme erfassen","a_confirm_data":"die Gebäudedaten bestätigen","a_resolve_shortfall":"die Ertüchtigung planen oder die Nutzung begrenzen","changeOfUse":"Nutzungsänderung","profile":"Regelwerksprofil","modelVersion":"Modellversion","exControl":"Büro bleibt Büro (Kontrolle)","exControlNote":"Gleiche Nutzung und 10 Personen auf 120 m², Unterlagen aktuell: Es wird keine neue Prüfung in einem Fachgebiet ausgelöst.","exTypical":"Lager wird zur Werkstatt (typisch)","exTypicalNote":"2 → 8 Personen auf 180 m² mit neuem Prozess: alle 8 Fachgebiete ausgelöst; 260 l/s Außenluft erforderlich gegenüber 150 l/s und 5,3 kW Kühlung ohne vorhandene Kälteleistung sind Defizite.","exClass":"Büro wird zum Unterrichtsraum","exClassNote":"8 → 30 Personen auf 80 m², öffentliche Nutzung auf 3 Geschossen: Außenluft 380 gegenüber 160 l/s und Kühlung 5 gegenüber 3 kW reichen nicht aus; die Mindestbreite des Rettungswegs von 800 mm ist gegenüber 30 × 7,5 = 225 mm maßgebend und passt in 900 mm.","exProblem":"Werkstatt ohne Profil und ohne Brandschutzkonzept (Problem)","exProblemNote":"Kein Rechtsraum, keine Ausgabe und kein Brandschutznachweis: Es wird keine Kapazitätsprüfung ausgewertet, und das Screening bleibt unvollständig.","exTry":"Versuch: Technikraum wird zum ständigen Arbeitsplatz","exTryNote":"Zwei Personen in einem Technikraum von 40 m²: alle 8 Fachgebiete werden ausgelöst; Außenluft 60 gegenüber 20 l/s und Kühlung 1,2 gegenüber 0,5 kW reichen nicht aus, sechs Fachgebiete haben keinen Nachweis.","exFix":"Lösung: jedes ausgelöste Fachgebiet geprüft","exFixNote":"70 l/s Luft und 1,5 kW Kühlung bereitgestellt und alle Nachweise dokumentiert: kein Defizit, Screening vollständig.","learnIntroTitle":"Welche Prüfungen eine neue Nutzung auslöst","learnIntro":"Eine Nutzungsänderung kann Prüfungen in acht Fachgebieten auslösen. Das Werkzeug listet sie mit ihren Gründen auf, vergleicht die Kapazität mit den Werten des gewählten Profils und hält Nachweislücken sichtbar.","learnDataTitle":"Nutzung und Belegung","learnData":"Geben Sie bisherige und neue Nutzung, Fläche, Geschosse, Personen und weitere Änderungen ein (ständige Arbeitsplätze, Publikumsverkehr, Betriebszeiten, Prozess, Lärm). Die Nutzungsgruppe (geringe Belegung, Aufenthalt von Personen, öffentliche Nutzung, Prozessnutzung) bestimmt die meisten Auslöser.","learnModelTitle":"Profilwerte","learnModel":"Die geforderten Werte (Nutzlast, Rettungswegbreite je Person, Außenluft, Wärmelasten, elektrischer Leistungsbedarf) stammen aus dem gewählten Rechtsraum und der gewählten Ausgabe; ohne sie wird keine Kapazitätsprüfung ausgewertet.","learnTryTitle":"Versuch","learnTry":"Nennen Sie vor dem Öffnen der Matrix die Fachgebiete, die betroffen sind, wenn ein Technikraum zum ständigen Arbeitsplatz für zwei Personen wird; öffnen Sie dann „Versuch“.","learnExplainTitle":"Warum so viele","learnExplain":"Der Raum wechselt von der Gruppe mit geringer Belegung in eine Gruppe mit Aufenthalt von Personen: Schon der Gruppenwechsel löst Rettungswege, Lüftung, Heizung und Kühlung, Akustik und Barrierefreiheit aus; die neue Nutzung löst Tragwerk und Brandschutz aus; mehr Personen lösen die Elektroversorgung aus.","learnFixTitle":"Korrektur","learnFix":"Öffnen Sie „Lösung“: Mit 70 l/s Außenluft, 1,5 kW Kühlung und dokumentierten Nachweisen ist jedes ausgelöste Fachgebiet ohne Defizit geprüft.","learnBoundaryTitle":"Screening und Freigabe","learnBoundary":"Die Matrix zeigt, welche Prüfungen fällig sind und wo Daten fehlen; Konformität und Freigabe der neuen Nutzung bleiben bei der verantwortlichen Fachperson und sind an die Eingaben gebunden.","eqNote":"Symbole: N₁ — Personen der neuen Nutzung; N — Personen; A — Grundfläche; w_p — Rettungswegbreite je Person; W_min — Mindestbreite des Rettungswegs; W_r, Q_r — geforderte Rettungswegbreite und Außenluft; q_p, q_A — Außenluft je Person und je Fläche; g_p, g_A — Wärmelast je Person und je Fläche; p_A — elektrischer Leistungsbedarf je Fläche; P_c, P_e — Kühl- und elektrischer Leistungsbedarf; X_r, X_a — geforderte und verfügbare Kapazität; m — Abstand; ρ — Belegungsdichte. n_r — geforderte Ausgänge; N_t — Personenzahl, ab der zwei Ausgänge gefordert sind; L, L_max — Rettungsweglänge und ihre Grenze. N_t3 — Personenzahl, ab der drei Ausgänge gefordert sind; L_1 — ntes","a_record_na_reason":"consigner pourquoi la discipline est sans objet","a_select_profile":"sélectionner la juridiction et l'édition","a_record_data_source":"enregistrer la source et la révision du relevé","a_confirm_data":"confirmer les données du bâtiment","a_resolve_shortfall":"concevoir la mise à niveau ou limiter l'usage","changeOfUse":"Changement de destination","profile":"Profil réglementaire","modelVersion":"Version du modèle","exControl":"Le bureau reste un bureau (contrôle)","exControlNote":"Même destination et 10 occupants sur 120 m², documents à jour : aucune nouvelle vérification de discipline n'est déclenchée.","exTypical":"Un stockage devient un atelier (type)","exTypicalNote":"2 → 8 occupants sur 180 m² avec un nouveau procédé : les 8 disciplines sont déclenchées ; 260 l/s d'air neuf nécessaires contre 150 l/s et 5,3 kW de refroidissement sans aucune puissance existante sont des insuffisances.","exClass":"Un bureau devient une salle de classe","exClassNote":"8 → 30 occupants sur 80 m², accueil du public sur 3 niveaux : l'air neuf 380 contre 160 l/s et le refroidissement 5 contre 3 kW sont insuffisants ; la largeur de dégagement minimale de 800 mm prévaut sur 30 × 7,5 = 225 mm et tient dans 900 mm.","exProblem":"Atelier sans profil ni stratégie incendie (problème)","exProblemNote":"Ni juridiction ni édition et aucune preuve incendie : aucune vérification de capacité n'est évaluée et le criblage reste incomplet.","exTry":"À tester : un local technique devient un poste de travail permanent","exTryNote":"Deux personnes dans un local technique de 40 m² : les 8 disciplines sont déclenchées ; l'air neuf 60 contre 20 l/s et le refroidissement 1,2 contre 0,5 kW sont insuffisants, six disciplines n'ont aucune preuve.","exFix":"Corrigé : chaque discipline déclenchée vérifiée","exFixNote":"70 l/s d'air et 1,5 kW de refroidissement fournis et toutes les preuves documentées : aucune insuffisance, criblage complet.","learnIntroTitle":"Quelles vérifications une lina.","exTypical":"Un almacén pasa a ser taller (típico)","exTypicalNote":"2 → 8 ocupantes en 180 m² con un nuevo proceso: se activan las 8 disciplinas; 260 l/s de aire exterior necesarios frente a 150 l/s y 5,3 kW de refrigeración sin potencia existente son déficits.","exClass":"Una oficina pasa a ser aula","exClassNote":"8 → 30 ocupantes en 80 m², uso público en 3 plantas: el aire exterior 380 frente a 160 l/s y la refrigeración 5 frente a 3 kW son insuficientes; la anchura mínima de salida de 800 mm prevalece sobre 30 × 7,5 = 225 mm y cabe en 900 mm.","exProblem":"Taller sin perfil ni estrategia contra incendios (problema)","exProblemNote":"Sin jurisdicción ni edición y sin evidencia de protección contra incendios: no se evalúa ninguna comprobación de capacidad y el cribado queda incompleto.","exTry":"Ejercicio: una sala técnica pasa a ser puesto de trabajo permanente","exTryNote":"Dos personas en una sala técnica de 40 m²: se activan las 8 disciplinas; el aire exterior 60 frente a 20 l/s y la refrigeración 1,2 frente a 0,5 kW son insuficientes, seis disciplinas no tienen evidencia.","exFix":"Solución: cada disciplina activada comprobada","exFixNote":"Se aportan 70 l/s de aire y 1,5 kW de refrigeración y toda la evidencia está documentada: sin déficit, cribado completo.","learnIntroTitle":"Qué comprobaciones activa un nuevo uso","learnIntro":"Un cambio de uso puede activar comprobaciones en ocho disciplinas. La herramienta las enumera con sus motivos, compara la capacidad con los valores del perfil seleccionado y mantiene visibles las lagunas de evidencia.","learnDataTitle":"Uso y ocupación","learnData":"Introduzca el uso actual y el nuevo, la superficie, las plantas, los ocupantes y qué más cambia (puestos de trabajo permanentes, acceso de público, horario, proceso, ruido). El grupo de ocupación (baja ocupación, ocupación habitual, pública concurrencia, uso de proceso) determina la mayoría de las activaciones.","learnModelTitle":"Valores del perfil","learnModel":"Los valores exigidos (carga sobre el forjado, anchura de salida por persona, aire exterior, ganancias de calor, demanda eléctrica) proceden de la jurisdicción y la edición seleccionadas; sin ellos no se evalúa ninguna comprobación de capacidad.","learnTryTitle":"Ejercicio","learnTry":"Antes de abrir la matriz, nombre las disciplinas afectadas cuando una sala técnica pasa a ser puesto de trabajo permanente para dos personas; después abra «Ejercicio».","learnExplainTitle":"Por qué tantas","learnExplain":"El local pasa del grupo de baja ocupación a uno de ocupación habitual: el cambio de grupo por sí solo activa la evacuación, la ventilación, la calefacción y refrigeración, la acústica y la accesibilidad; el nuevo uso activa la estructura y la protección contra incendios; más ocupantes activan el suministro eléctrico.","learnFixTitle":"Corrección","learnFix":"Abra «Solución»: con 70 l/s de aire exterior, 1,5 kW de refrigeración y evidencia documentada, cada disciplina activada queda comprobada sin déficit.","learnBoundaryTitle":"Cribado y aprobación","learnBoundary":"La matriz indica qué comprobaciones corresponden y dónde faltan datos; el cumplimiento y la aprobación del nuevo uso corresponden al profesional responsable y están vinculados a los datos.","eqNote":"Símbolos: N₁ — ocupantes del nuevo uso; N — ocupantes; A — superficie útil; w_p — anchura de salida por persona; W_min — anchura mínima de salida; W_r, Q_r — anchura de salida y aire exterior exigidos; q_p, q_A — aire exterior por persona y por superficie; g_p, g_A — ganancia de calor por persona y por superficie; p_A — demanda eléctrica por superficie; P_c, P_e — demanda de refrigeración y demanda eléctrica; X_r, X_a — capacidad exigida y disponible; m — margen; ρ — densidad de ocupación. n_r — salidas exigidas; N_t — ocupación por encima de la cual se exigen dos salidas; L, L_max — recorrido de evacuación y su límite. N_t3 — ocupación por encima de la cual se exigen tres salidas; L_1 — límite para evacuación en un solo sentido.","modelText":"Superficies en m², cargas en kN/m², anchuras en mm, aire en l/s, potencia en kW; los valores exigidos se introducen a partir del perfil seleccionado, ninguno está incorporado.","boundaryText":"La herramienta realiza un cribado y no emite ningún certificado de cumplimiento; las jurisdicciones no se mezclan, y la aprobación es una decisión aparte vinculada a los datos.","scopeText":"Cribado de un cambio de uso por disciplina; no es un certificado de cumplimiento. Los ejemplos integrados son sintéticos.","refProfile":"Valores exigidos de la jurisdicción y la edición seleccionadas, introducidos por el usuario","refScreen":"Aplicabilidad de las disciplinas según el grupo de ocupación, la ocupación y los cambios declarados","ev_unknown":"no documentado","use_residential":"vivienda","use_hotel":"hotel o alojamiento nocturno","grp_sleeping":"uso con pernoctación","rs_sleeping":"hay personas que pernoctan en el local","f_exit_width_min":"Anchura mínima de salida","use_flats":"viviendas plurifamiliares","use_institutional":"residencia asistida u hospital","grp_care":"asistencial (evacuación asistida)","rs_assisted_evacuation":"los ocupantes necesitan ayuda para evacuar","rs_separating_elements":"las paredes y forjados separadores entran en el alcance","rs_high_rise":"última planta por encima del umbral de altura","rs_partial":"solo cambia de uso una parte del edificio","q_exit_count":"Número de salidas","q_travel_distance":"Recorrido de evacuación","f_building_area":"Superficie del edificio completo (cambio parcial)","f_top_floor_height":"Altura del suelo de la última planta","f_height_threshold":"Umbral de altura para medidas adicionales contra incendios","f_exit_count":"Salidas disponibles","f_exit_count_threshold":"Ocupación por encima de la cual se exigen dos salidas","f_travel_distance":"Mayor recorrido hasta una salida","f_travel_distance_max":"Recorrido máximo, evacuación en más de un sentido","w_height_not_given":"Varias plantas s ic":"dostęp publiczny","rs_permanent":"stałe stanowiska pracy w pomieszczeniu o niskim obłożeniu","rs_hours":"zmieniają się godziny pracy","rs_noise":"źródła hałasu lub wrażliwość na hałas","st_met":"sprawdzone, bez niedoboru","st_not_met":"niedobór","st_unknown":"brak dowodowy","st_not_applicable":"nie dotyczy","st_no_trigger":"nieuruchomione","q_imposed_load":"Obciążenie użytkowe","q_exit_width":"Szerokość wyjść","q_outdoor_air":"Powietrze zewnętrzne","q_cooling":"Chłodzenie","q_electrical_demand":"Zapotrzebowanie na moc elektryczną","act_structure":"potwierdź obciążenia obliczeniowe i drogę przekazywania obciążeń","act_egress":"sprawdź drogi ewakuacyjne, ich szerokości i długości przejść","act_fire":"przeanalizuj strefy pożarowe, wykrywanie i gaszenie","act_ventilation":"zwymiaruj powietrze zewnętrzne i wywiew dla nowego sposobu użytkowania","act_hvac":"przelicz obciążenie grzewcze i chłodnicze","act_electrical":"sprawdź moc zasilania i rozdział energii","act_acoustics":"sprawdź izolacyjność akustyczną i akustykę pomieszczenia","act_accessibility":"sprawdź drogi dojścia i udogodnienia","decision":"Decyzja","decisionStatus":"Decyzja","decisionReason":"Uzasadnienie decyzji","decPending":"oczekuje","decApproved":"zatwierdzone","decRejected":"odrzucone","decStale":"zatwierdzenie nieaktualne: dane zmienione","decNoReason":"zatwierdzenie bez uzasadnienia","decisionBasis":"Decyzja jest powiązana z danymi, dla których ją podjęto; każda zmiana czyni ją nieaktualną.","run":"Wykonaj screening","results":"Wyniki","triggeredTile":"Uruchomione branże","shortfallTile":"Niedobory wydajności","criterion":"Screening","densityTile":"Gęstość osób","before":"przed","openItems":"Otwarte punkty","crit_met":"brak niedoboru, dowody kompletne","crit_not_met":"stwierdzono niedobór","crit_unknown":"niekompletny","crit_no_trigger":"nie uruchomiono nowego sprawdzenia","matrixTable":"Macierz zastosowania","state":"Stan","discipline":"Branża","evidence":"dowody","trigger":"przyczyna","checkTable":"Wydajność względem profilu","margin":"Zapas","check":"Kontrola","reqAvail":"wymagane / dostępne","gapTable":"Otwarte punkty","gap":"Punkt","actions":"Działania","action":"Działanie","warning":"Uwaga","noResult":"Brak wyniku","plot":"Wymagana wydajność jako udział dostępnej (100 % = granica); pozostałe branże pokazują swój stan","lgUtil":"słupek: wymagane / dostępne","verdictBlocked":"Brak screeningu: brakuje wymaganych danych lub są nieprawidłowe, zob. przyczyny.","verdict_met":"Każda uruchomiona branża jest sprawdzona bez niedoboru, a jej dowody są udokumentowane, według wybranego profilu.","verdict_not_met":"Co najmniej jedna uruchomiona branża ma niedobór lub niewystarczające dowody.","verdict_unknown":"Branże są uruchomione, lecz brakujące dowody, wartości lub profil uniemożliwiają pozytywny wynik screeningu.","verdict_no_trigger":"Na podstawie podanych danych zmiana nie uruchamia nowego sprawdzenia branżowego.","b_use_invalid":"Nie wybrano sposobu użytkowania.","b_area_invalid":"Powierzchnia użytkowa musi być dodatnia.","b_storeys_invalid":"Liczba kondygnacji musi być liczbą całkowitą nie mniejszą niż 1.","b_occupants_invalid":"Liczba osób musi być liczbą całkowitą nie mniejszą niż 0.","b_value_invalid":"Wartość wydajności lub profilu jest ujemna.","g_check_data_missing":"Sprawdzeniu wydajności brakuje wartości wymaganej lub dostępnej.","g_evidence_unknown":"Dla tej uruchomionej branży nie zapisano dowodów.","g_na_reason_missing":"Oznaczono jako niedotyczące bez podania przyczyny.","g_profile_missing":"Nie wybrano jurysdykcji ani wydania: żadne sprawdzenie wydajności nie jest oceniane.","g_data_source_missing":"Brakuje źródła lub rewizji inwentaryzacji.","g_data_unconfirmed":"Status danych budynku jest nieznany.","w_no_trigger":"Żadna branża nie jest uruchomiona; wynik obowiązuje tylko dla podanych danych.","w_vertical_escape_not_checked":"Kilka kondygnacji: przepustowość schodów i ewakuacja pionowa nie są tu sprawdzane.","w_estimated_data":"Dane budynku oznaczono jako szacowane.","w_continue_in_tool":"Szczegółowe sprawdzenie w","w_compliance_outside_model":"Tylko screening: zgodność stwierdza odpowiedzialny specjalista według obowiązujących przepisów.","w_restored_values":"Podczas wczytywania zastąpiono zapisane wartości: ","a_select_use":"wybierz obecny i nowy sposób użytkowania","a_correct_input":"popraw dane wejściowe","a_enter_check_values":"wprowadź wartość wymaganą i dostępną","a_survey_evidence":"zinwentaryzuj i udokumentuj istniejące rozwiązania","a_record_na_reason":"zapisz, dlaczego branża nie dotyczy","a_select_profile":"wybierz jurysdykcję i wydanie","a_record_data_source":"zapisz źródło i rewizję inwentaryzacji","a_confirm_data":"potwierdź dane budynku","a_resolve_shortfall":"zaprojektuj modernizację lub ogranicz użytkowanie","changeOfUse":"Zmiana sposobu użytkowania","profile":"Profil przepisów","modelVersion":"Wersja modelu","exControl":"Biuro pozostaje biurem (kontrolny)","exControlNote":"Ten sam sposób użytkowania i 10 osób na 120 m², dokumenty aktualne: nie zostaje uruchomione żadne nowe sprawdzenie branżowe.","exTypical":"Magazyn staje się warsztatem (typowy)","exTypicalNote":"2 → 8 osób na 180 m² z nowym procesem: uruchomiono wszystkie 8 branż; potrzebne 260 l/s powietrza zewnętrznego wobec 150 l/s oraz 5,3 kW chłodzenia przy braku istniejącej mocy to niedobory.","exClass":"Biuro staje się salą dydaktyczną","exClassNote":"8 → 30 osób na 80 m², użytkowanie publiczne na 3 kondygnacjach: powietrza zewnętrznego 380 wobec 160 l/s i chłodzenia 5 wobec 3 kW jest za mało; minimalna szerokość wyjścia 800 mm jest decydująca wobec 30 × 7,5 = 225 mm i mieści się w 900 mm.","exProblem":"Warsztat bez profilu i bez strategii pożarowej (błąd)","exProblemNote":"Brak jurysdykcji i wydania oraz brak dowodów ochrony przeciwpożarowej: żadne sprawdzenie wydajności nie jest oceniane, a screening pozostaje niekompletny.","exTry":"Sprawdź: pomieszczenie techniczne staje się stałym stanowiskiem pracy","exTryNote":"Dwie osoby w pomieszczeniu technicznym o powierzchni 40 m²: uruchomiono wszystkie 8 branż; powietrza zewnętrznego 60 wobec 20 l/s i chłodzenia 1,2 wobec 0,5 kW jest za mało, sześć branż nie ma dowodów.","exFix":"Poprawka: każda uruchomiona branża sprawdzona","exFixNote":"Zapewniono 70 l/s powietrza i 1,5 kW chłodzenia, wszystkie dowody udokumentowano: brak niedoboru, screening kompletny.","learnIntroTitle":"Jakie sprawdzenia uruchamia nowy sposób użytkowania","learnIntro":"Zmiana sposobu użytkowania może uruchomić sprawdzenia w ośmiu branżach. Narzędzie wymienia je wraz z przyczynami, porównuje wydajność z wartościami wybranego profilu i pozostawia braki dowodowe widocznymi.","learnDataTitle":"Sposób użytkowania i liczba osób","learnData":"Wprowadź obecny i nowy sposób użytkowania, powierzchnię, kondygnacje, liczbę osób oraz inne zmiany (stałe stanowiska pracy, dostęp publiczny, godziny pracy, proces, hałas). Grupa użytkowania (niskie obłożenie, przebywanie ludzi, użytkowanie publiczne, proces technologiczny) decyduje o większości przyczyn uruchomienia.","learnModelTitle":"Wartości profilu","learnModel":"Wartości wymagane (obciążenie stropu, szerokość wyjścia na osobę, powietrze zewnętrzne, zyski ciepła, zapotrzebowanie na moc elektryczną) pochodzą z wybranej jurysdykcji i wydania; bez nich żadne sprawdzenie wydajności nie jest oceniane.","learnTryTitle":"Sprawdź","learnTry":"Zanim otworzysz macierz, wymień branże, których dotyczy przekształcenie pomieszczenia technicznego w stałe stanowisko pracy dla dwóch osób; następnie otwórz „Sprawdź”.","learnExplainTitle":"Dlaczego tak wiele","learnExplain":"Pomieszczenie przechodzi z grupy o niskim obłożeniu do grupy z przebywaniem ludzi: już sama zmiana grupy uruchamia drogi ewakuacyjne, wentylację, ogrzewanie i chłodzenie, akustykę i dostępność; nowy sposób użytkowania uruchamia konstrukcję i ochronę przeciwpożarową; większa liczba osób uruchamia zasilanie elektryczne.","learnFixTitle":"Poprawka","learnFix":"Otwórz „Poprawka”: przy 70 l/s powietrza zewnętrznego, 1,5 kW chłodzenia i udokumentowanych dowodach każda uruchomiona branża jest sprawdzona bez niedoboru.","learnBoundaryTitle":"Screening i zatwierdzenie","learnBoundary":"Macierz wskazuje, które sprawdzenia są wymagane i gdzie brakuje danych; zgodność i zatwierdzenie nowego sposobu użytkowania należą do odpowiedzialnego specjalisty i są powiązane z danymi.","eqNote":"Symbole: N₁ — liczba osób przy nowym sposobie użytkowania; N — liczba osób; A — powierzchnia użytkowa; w_p — szerokość wyjścia na osobę; W_min — minimalna szerokość wyjścia; W_r, Q_r — wymagana szerokość wyjścia i wymagane powietrze zewnętrzne; q_p, q_A — powietrze zewnętrzne na osobę i na powierzchnię; g_p, g_A — zyski ciepła na osobę i na powierzchnię; p_A — zapotrzebowanie na moc elektryczną na powierzchnię; P_c, P_e — zapotrzebowanie na chłodzenie i na moc elektryczną; X_r, X_a — wydajność wymagana i dostępna; m — zapas; ρ — gęstość osób. n_r — wymagana liczba wyjść; N_t — liczba osób, powyżej której wymagane są dwa wyjścia; L, L_max — długość dojścia i jej granica. N_t3 — liczba osób, powyżej której wymagane są trzy wyjścia; L_1 — granica dla ewakuacji w jednym kierunku.","modelText":"Powierzchnie w m², obciążenia w kN/m², szerokości w mm, powietrze w l/s, moc w kW; wartości wymagane wprowadza się z wybranego profilu, żadna nie jest wbudowana.","boundaryText":"Narzędzie wykonuje screening i nie wydaje świadectwa zgodności; jurysdykcje nie są mieszane, a zatwierdzenie jest odrębną decyzją powiązaną z danymi.","scopeText":"Screening zmiany sposobu użytkowania według branż; bez świadectwa zgodności. Wbudowane przykłady są syntetyczne.","refProfile":"Wartości wymagane z wybranej jurysdykcji i wydania, wprowadzone przez użytkownika","refScreen":"Zastosowanie branż według grupy użytkowania, liczby osób i zgłoszonych zmian","ev_unknown":"nieudokumentowane","use_residential":"lokal mieszkalny","use_hotel":"hotel lub zakwaterowanie z noclegiem","grp_sleeping":"nocleg","rs_sleep
