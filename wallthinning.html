(function () {

/* Wall Thinning Trender — calculation core (pure functions, no DOM).
   Weighted linear trend of UT wall thickness per comparable CML set, 95 % mean-trend band,

var WT_VERSION = '2026-10-03.wt-2';
var WT_Z = 1.959963984540054;
var WT_STATUS = ['confirmed', 'rejected', 'unknown', 'not_applicable'];
var WT_METHOD = ['manual_ut', 'encoded_ut', 'other'];
var WT_DECISION = ['pending', 'approved', 'rejected'];
var WT_OUTLIER = 3;
var MS_DAY = 86400000;

function wtNum(v) { return typeof v === 'number' && isFinite(v) ? v : null; }
function wtText(v) { return v === null || v === undefined ? '' : String(v).trim(); }

/* ISO date YYYY-MM-DD that exists in the proleptic Gregorian calendar, as a UTC day */
function wtParseDate(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  var y = +s.slice(0, 4), m = +s.slice(5, 7), d = +s.slice(8, 10), ms = Date.UTC(y, m - 1, d), dt = new Date(ms);
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
  return ms;
}
function wtDaysInYear(y) { return (Date.UTC(y + 1, 0, 1) - Date.UTC(y, 0, 1)) / MS_DAY; }
/* decimal year: year + elapsed days / days in that year */
function wtDecimalYear(s) { var ms = wtParseDate(s); if (ms === null) return null; var y = new Date(ms).getUTCFullYear(); return y + (ms - Date.UTC(y, 0, 1)) / (wtDaysInYear(y) * MS_DAY); }
function wtDateFromYear(v) {
  if (typeof v !== 'number' || !isFinite(v)) return null; var y = Math.floor(v), f = v - y;
  return new Date(Date.UTC(y, 0, 1) + Math.floor(f * wtDaysInYear(y) + 1e-9) * MS_DAY).toISOString().slice(0, 10);
}

function wtFit(pts) {
  var x0 = Infinity; pts.forEach(function (p) { if (p.x < x0) x0 = p.x; });
  var S = 0, Sx = 0, Sy = 0, Sxx = 0, Sxy = 0;
  pts.forEach(function (p) { var x = p.x - x0, w = 1 / (p.u * p.u); S += w; Sx += w * x; Sy += w * p.y; Sxx += w * x * x; Sxy += w * x * p.y; });
  var det = S * Sxx - Sx * Sx;
  if (!(det > 0)) return null;
  var a = (Sxx * Sy - Sx * Sxy) / det, b = (S * Sxy - Sx * Sy) / det, chi2 = 0;
  pts.forEach(function (p) { var r = p.y - (a + b * (p.x - x0)); chi2 += r * r / (p.u * p.u); });

  return { x0: x0, intercept_mm: a, slope_mm_per_year: b, thinning_rate_mm_per_year: -b, chi2: chi2, dof: dof, variance_scale: k,
           var_intercept: k * Sxx / det, var_slope: k * S / det, cov_intercept_slope: -k * Sx / det, se_slope_mm_per_year: Math.sqrt(k * S / det) };

function wtPredict(f, x) { var q = x - f.x0; return { mean: f.intercept_mm + f.slope_mm_per_year * q, variance: Math.max(0, f.var_intercept + 2 * q * f.cov_intercept_slope + q * q * f.var_slope) }; }

/* first x >= xs at which mean + sign·z·se reaches tMin, up to xe; closed form:
   (m)^2 = z^2 V with m = a + b q - tMin; the root must have m >= 0 (lower band, sign -1) or m <= 0 (upper band, sign +1) */
function wtBandCrossing(f, tMin, sign, xs, xe) {
  function g(x) { var p = wtPredict(f, x); return p.mean + sign * WT_Z * Math.sqrt(p.variance) - tMin; }

  var A = b * b - z2 * f.var_slope, B = 2 * (ap * b - z2 * f.cov_intercept_slope), C = ap * ap - z2 * f.var_intercept, roots = [];

    if (sign < 0 ? m < 0 : m > 0) return;

}

function wtAnalyse(s) {

  if (!horizonOk) issues.push({ code: 'horizon' });

  rows.forEach(function (r, i) {
    var id = wtText(r.id) || ('row-' + (i + 1));
    if (r.data_status !== 'confirmed' || r.comparability_status !== 'confirmed') { excluded.push({ id: id, data_status: r.data_status, comparability_status: r.comparability_status }); return; }

  });

  if (excluded.length) warnings.push({ code: 'nonconfirmed_rows_excluded' });
  if (!groups.length) issues.push({ code: 'no_comparable_series' });

    var pts = g.pts.slice().sort(function (p, q) { return p.x - q.x || p.index - q.index; });
    var times = {}; pts.forEach(function (p) { times[p.x] = 1; });
    var item = { key: g.key, cml: g.cml, comparison_group: g.comparison_group, n_points: pts.length, data_quality: 'insufficient', fit: null, forecast: null, points: [], warnings: [] };
    pts.forEach(function (p) { item.points.push({ id: p.id, date: p.date, year: p.x, thickness_mm: p.y, uncertainty_mm: p.u, residual_mm: null, normalized_residual: null, outlier: false });
      if (tNomOk && p.y > tNom + 3 * p.u) item.warnings.push('above_nominal'); });
    if (item.warnings.length) item.warnings = ['above_nominal'];
    if (pts.length < 2 || Object.keys(times).length < 2) { item.warnings.push('insufficient_points'); return item; }

    if (!f) { item.warnings.push('regression_singular'); return item; }

                 chi2: f.chi2, dof: f.dof, variance_scale: f.variance_scale, var_intercept: f.var_intercept, var_slope: f.var_slope, cov_intercept_slope: f.cov_intercept_slope };
    item.data_quality = pts.length === 2 ? 'two_point' : 'multi_point';
    if (pts.length === 2) item.warnings.push('two_point');
    pts.forEach(function (p, i) { var r = p.y - (f.intercept_mm + f.slope_mm_per_year * (p.x - f.x0)), n = Math.abs(r) / p.u;
      item.points[i].residual_mm = r; item.points[i].normalized_residual = n; item.points[i].outlier = n > WT_OUTLIER; });
    if (item.points.some(function (p) { return p.outlier; })) item.warnings.push('outlier_candidates');
    if (tMinOk && horizonOk) {
      var first = pts[0].x, last = pts[pts.length - 1].x;
      if (!(f.slope_mm_per_year < 0)) { item.forecast = { nominal_year: null, early_year: null, late_year: null }; item.warnings.push('non_decreasing'); }
