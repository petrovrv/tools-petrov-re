  "limitations": {
    "en": "Quasi-steady models only. Pump mode assumes incompressible single-phase liquid; parallel pumps are identical on common headers and branch imbalance is not resolved. Fan mode uses ideal-gas density and incompressible fan laws; high-pressure compressibility, acoustics and dynamic surge are outside scope. Static and total fan pressure are not silently converted. Manufacturer operating/stability limits are used only when supplied by the user; illustrative defaults are not certified limits. Pipe friction: laminar 64/Re up to Re 2000, Colebrook–White from Re 4000 and, between them, the Dunlop cubic interpolation used by EPANET 2 (Rossman 2000, Appendix D), anchored to Colebrook–White at Re 4000; the transition band is an interpolation, not a measured law. When the pump and system curves intersect more than once, the stable intersection at the highest flow is used.",
    "uk": "Лише квазістаціонарні моделі. Pump mode передбачає нестисливу однофазну рідину; паралельні насоси однакові на спільних колекторах, дисбаланс гілок не розраховується. Fan mode використовує густину ідеального газу та нестисливі fan laws; стисливість при великому перепаді тиску, акустика й динамічний surge поза межами моделі. Static/total pressure приховано не перераховуються. Межі виробника застосовуються лише коли їх задає користувач; демонстраційні межі не є сертифікованими. Тертя в трубі: ламінарне 64/Re до Re 2000, Colebrook–White від Re 4000, а між ними — кубічна інтерполяція Dunlop, як в EPANET 2 (Rossman 2000, додаток D), прив’язана до Colebrook–White при Re 4000; перехідна зона — інтерполяція, а не виміряний закон. Якщо криві насоса й системи перетинаються кілька разів, використовується стійкий перетин із найбільшою витратою.",
    "de": "Nur quasistationäre Modelle. Pumpenmodus: inkompressible Einphasenflüssigkeit; Parallelpumpen sind identisch an gemeinsamen Sammlern, Zweigunsymmetrien werden nicht gelöst. Ventilatormodus: ideale Gasdichte und inkompressible Ventilatorgesetze; Hochdruck-Kompressibilität, Akustik und dynamischer Surge liegen außerhalb des Modells. Statischer und Gesamtdruck werden nicht still umgerechnet. Herstellergrenzen gelten nur bei Nutzereingabe; illustrative Grenzen sind nicht zertifiziert. Rohrreibung: laminar 64/Re bis Re 2000, Colebrook–White ab Re 4000 und dazwischen die kubische Dunlop-Interpolation aus EPANET 2 (Rossman 2000, Anhang D), bei Re 4000 an Colebrook–White angeschlossen; der Übergangsbereich ist eine Interpolation, kein gemessenes Gesetz. Schneiden sich Pumpen- und Anlagenkennlinie mehrfach, gilt der stabile Schnittpunkt mit dem größten Förderstrom.",
    "nl": "Alleen quasi-stationaire modellen. Pompmodus: onsamendrukbare eenfasige vloeistof; parallelpompen zijn identiek op gemeenschappelijke headers en takonbalans wordt niet opgelost. Ventilatormodus: ideale-gasdichtheid en onsamendrukbare ventilatorwetten; compressibiliteit bij hoge druk, akoestiek en dynamische surge vallen buiten de scope. Statische en totale ventilatordruk worden niet stil omgerekend. Fabrikantgrenzen gelden alleen wanneer de gebruiker ze opgeeft; illustratieve grenzen zijn niet gecertificeerd. Leidingwrijving: laminair 64/Re tot Re 2000, Colebrook–White vanaf Re 4000 en daartussen de kubische Dunlop-interpolatie uit EPANET 2 (Rossman 2000, bijlage D), bij Re 4000 aangesloten op Colebrook–White; het overgangsgebied is een interpolatie, geen gemeten wet. Snijden pomp- en systeemkromme elkaar meer dan eens, dan geldt het stabiele snijpunt met het grootste debiet.",
    "fr": "Modèles quasi-stationnaires uniquement. Mode pompe : liquide monophasique incompressible ; les pompes en parallèle sont identiques sur collecteurs communs et les déséquilibres de branches ne sont pas résolus. Mode ventilateur : densité de gaz parfait et lois incompressibles ; compressibilité à forte pression, acoustique et surge dynamique hors périmètre. Aucune conversion silencieuse pression statique/totale. Les limites fabricant ne sont utilisées que si l’utilisateur les fournit ; les limites illustratives ne sont pas certifiées. Frottement en conduite : laminaire 64/Re jusqu’à Re 2000, Colebrook–White à partir de Re 4000 et, entre les deux, l’interpolation cubique de Dunlop utilisée par EPANET 2 (Rossman 2000, annexe D), raccordée à Colebrook–White à Re 4000 ; la zone de transition est une interpolation, pas une loi mesurée. Si les courbes pompe et réseau se coupent plusieurs fois, l’intersection stable au débit le plus élevé est retenue.",
    "es": "Solo modelos cuasiestacionarios. Modo bomba: líquido monofásico incompresible; las bombas en paralelo son idénticas en colectores comunes y no se resuelve el desequilibrio de ramales. Modo ventilador: densidad de gas ideal y leyes incompresibles; compresibilidad a alta presión, acústica y surge dinámico quedan fuera del alcance. No se convierte silenciosamente presión estática/total. Los límites del fabricante solo se usan si los aporta el usuario; los límites ilustrativos no están certificados. Fricción en tubería: laminar 64/Re hasta Re 2000, Colebrook–White desde Re 4000 y, entre ambos, la interpolación cúbica de Dunlop usada por EPANET 2 (Rossman 2000, apéndice D), enlazada con Colebrook–White en Re 4000; la zona de transición es una interpolación, no una ley medida. Si las curvas de bomba y sistema se cortan más de una vez, se usa la intersección estable de mayor caudal.",
    "pl": "Tylko modele quasi-stacjonarne. Tryb pompy zakłada nieściśliwą ciecz jednofazową; pompy równoległe działają identycznie na wspólnych kolektorach, a nierównowaga gałęzi nie jest rozwiązywana. Tryb wentylatora wykorzystuje gęstość gazu idealnego i prawa wentylatora nieściśliwego; ściśliwość pod wysokim ciśnieniem, akustyka i udar dynamiczny wykraczają poza zakres. Statyczne i całkowite ciśnienie wentylatora nie są konwertowane bezgłośnie. Limity pracy/stabilności podane przez producenta są stosowane tylko wtedy, gdy są dostarczone przez użytkownika; domyślne wartości ilustracyjne nie są limitami certyfikowanymi. Tarcie w rurze: laminarne 64/Re do Re 2000, Colebrook–White od Re 4000, a pomiędzy nimi sześcienna interpolacja Dunlopa stosowana w EPANET 2 (Rossman 2000, załącznik D), połączona z Colebrookiem–White’em przy Re 4000; strefa przejściowa jest interpolacją, a nie zmierzonym prawem. Gdy charakterystyki pompy i instalacji przecinają się więcej niż raz, przyjmuje się stabilny punkt przecięcia o największym przepływie."
  },

 en:{xLimitValues:'Limit values',xOther:'Other',xPowerBasis:'Power basis of the pasted column',xBareMsg:'The shared interface layer (diagram-ui.js) did not load, so this is the plain form. Every number, the permalink, the PDF report and the exports are computed in this page and still work.',xView:'View',xMachineMode:'Machine',xPump:'Pump',xFan:'Fan',xWorkspace:'Workspace',
  xUp:'↑ Increase',xSame:'≈ Unchanged',xDown:'↓ Decrease',xScore:'Score',
  xWhat:'What this tool does',xCurveTopic:'Reading the two curves',
  xCurveBody:'The machine curve falls as flow rises; the system curve rises as flow rises. The operating point is where they cross — you cannot set it directly, you can only move one of the two curves. Throttling moves the system curve, speed and parallel machines move the machine curve.',
  xOpBody:'Flow, head or pressure, efficiency and electrical power at the crossing point. They are read off the curves, not entered: every one of them changes when you move a control.',
  xBudgetBody:'How the head or pressure the machine produces is spent: static lift and pressure difference, straight pipe or duct, valves, dampers, filter and coil. A tall bar is where a change would pay off.',
  xNpshBody:'NPSHa is what the suction side offers, NPSHr is what the pump needs. The margin is the difference; when it goes negative the pump cavitates. Hot liquid, a throttled suction valve or a lower source level all eat into it.',
  xBaselineBody:'Pin baseline stores the current state as a reference. Every later change is then reported against it, in "What changed?" and in the comparison table, and the pinned curves are drawn dashed on the chart.',
  xExploreBody:'Explore turns the tool into a short prediction exercise: pick what you think a change will do, then let the tool apply it and compare. Your state is pinned as the baseline first, so the change is visible on the chart.',
  xPaste:'Curve data — paste or import',xPreview:'Parsed points',xUnits:'Units of the pasted data',
  xRelated:'Related tools',xModelNotes:'Model, assumptions and limits',
  xNoRoot:'No operating point',xLive:'Every view updates together.',
  xImportUnitsHint:'These describe the columns you paste, not the units shown on screen.'},
 uk:{xLimitValues:'Значення меж',xOther:'Інший',xPowerBasis:'Основа потужності у вставленому стовпці',xBareMsg:'Спільний шар інтерфейсу (diagram-ui.js) не завантажився, тому показано просту форму. Усі числа, постійне посилання, звіт PDF та експорти обчислюються в цій сторінці й працюють.',xView:'Вигляд',xMachineMode:'Машина',xPump:'Насос',xFan:'Вентилятор',xWorkspace:'Режим роботи',
  xUp:'↑ Зросте',xSame:'≈ Майже не зміниться',xDown:'↓ Зменшиться',xScore:'Рахунок',
  xWhat:'Що робить цей інструмент',xCurveTopic:'Як читати дві криві',
  xCurveBody:'Характеристика машини спадає зі зростанням витрати, характеристика системи — зростає. Робоча точка там, де вони перетинаються: її не можна задати напряму, можна лише зсунути одну з кривих. Дроселювання зсуває криву системи, швидкість і паралельні машини — криву машини.',
  xOpBody:'Витрата, напір або тиск, ККД та електрична потужність у точці перетину. Це не введені значення, а зчитані з кривих: усі вони змінюються, щойно ви рухаєте будь-який регулятор.',
  xBudgetBody:'Куди витрачається напір або тиск машини: статика й різниця тисків, пряма труба чи повітропровід, клапани, заслінка, фільтр і теплообмінник. Висока смуга — там, де зміна дасть найбільший ефект.',
  xNpshBody:'NPSHa — це те, що дає всмоктувальна сторона, NPSHr — те, що потрібно насосу. Запас — різниця між ними; від’ємний запас означає кавітацію. Гаряча рідина, прикритий всмоктувальний клапан або нижчий рівень джерела зменшують запас.',
  xBaselineBody:'«Зафіксувати базу» зберігає поточний стан як опорний. Кожну наступну зміну показано відносно нього — у розділі «Що змінилося?» та в таблиці порівняння, а зафіксовані криві малюються пунктиром.',
  xExploreBody:'Режим дослідження перетворює інструмент на коротку вправу з прогнозування: оберіть, що станеться, і дайте інструменту застосувати зміну та порівняти. Поточний стан спершу фіксується як база, щоб зміна була видимою на графіку.',
  xPaste:'Дані кривої — вставити або імпортувати',xPreview:'Розпізнані точки',xUnits:'Одиниці вставлених даних',
  xRelated:'Пов’язані інструменти',xModelNotes:'Модель, припущення та межі',
  xNoRoot:'Робочої точки немає',xLive:'Усі подання оновлюються разом.',
  xImportUnitsHint:'Це одиниці стовпців, які ви вставляєте, а не одиниці на екрані.'},
 de:{xLimitValues:'Grenzwerte',xOther:'Andere',xPowerBasis:'Leistungsbasis der eingefügten Spalte',xBareMsg:'Die gemeinsame Oberflächenschicht (diagram-ui.js) wurde nicht geladen, daher das einfache Formular. Alle Zahlen, der Permalink, der PDF-Bericht und die Exporte werden in dieser Seite berechnet und funktionieren weiterhin.',xView:'Ansicht',xMachineMode:'Maschine',xPump:'Pumpe',xFan:'Ventilator',xWorkspace:'Arbeitsmodus',
  xUp:'↑ Steigt',xSame:'≈ Nahezu gleich',xDown:'↓ Sinkt',xScore:'Punkte',
  xWhat:'Was dieses Werkzeug tut',xCurveTopic:'Die beiden Kennlinien lesen',
  xCurveBody:'Die Maschinenkennlinie fällt mit steigendem Volumenstrom, die Anlagenkennlinie steigt. Der Betriebspunkt liegt im Schnittpunkt: Er lässt sich nicht direkt einstellen, nur eine der beiden Kurven lässt sich verschieben. Drosseln verschiebt die Anlagenkennlinie, Drehzahl und Parallelbetrieb die Maschinenkennlinie.',
  xOpBody:'Volumenstrom, Förderhöhe bzw. Druck, Wirkungsgrad und elektrische Leistung im Schnittpunkt. Sie werden nicht eingegeben, sondern abgelesen: jede Stellgröße verändert sie alle.',
  xBudgetBody:'Wohin die erzeugte Förderhöhe bzw. der Druck geht: Statik und Druckdifferenz, gerades Rohr oder Kanal, Armaturen, Klappe, Filter und Register. Der längste Balken zeigt, wo eine Änderung sich lohnt.',
  xNpshBody:'NPSHa bietet die Saugseite, NPSHr verlangt die Pumpe. Der Abstand ist die Differenz; wird er negativ, kavitiert die Pumpe. Heißes Medium, ein gedrosseltes Saugventil oder ein tieferer Quellstand zehren daran.',
  xBaselineBody:'„Basis fixieren“ speichert den aktuellen Zustand als Referenz. Jede spätere Änderung wird dagegen berichtet — in „Was hat sich geändert?“ und in der Vergleichstabelle; die fixierten Kennlinien werden gestrichelt gezeichnet.',
  xExploreBody:'Der Explore-Modus macht aus dem Werkzeug eine kurze Vorhersageübung: Wählen Sie, was eine Änderung bewirkt, lassen Sie sie anwenden und vergleichen Sie. Der aktuelle Zustand wird zuvor als Basis fixiert, damit die Änderung sichtbar bleibt.',
  xPaste:'Kennliniendaten — einfügen oder importieren',xPreview:'Erkannte Punkte',xUnits:'Einheiten der eingefügten Daten',
  xRelated:'Verwandte Werkzeuge',xModelNotes:'Modell, Annahmen und Grenzen',
  xNoRoot:'Kein Betriebspunkt',xLive:'Alle Ansichten reagieren gemeinsam.',
  xImportUnitsHint:'Sie beschreiben die eingefügten Spalten, nicht die Anzeige.'},
 nl:{xLimitValues:'Grenswaarden',xOther:'Overig',xPowerBasis:'Vermogensbasis van de geplakte kolom',xBareMsg:'De gedeelde interfacelaag (diagram-ui.js) is niet geladen, vandaar dit eenvoudige formulier. Alle getallen, de permalink, het PDF-rapport en de exports worden in deze pagina berekend en werken gewoon.',xView:'Weergave',xMachineMode:'Machine',xPump:'Pomp',xFan:'Ventilator',xWorkspace:'Werkmodus',
  xUp:'↑ Stijgt',xSame:'≈ Vrijwel gelijk',xDown:'↓ Daalt',xScore:'Score',
  xWhat:'Wat deze tool doet',xCurveTopic:'De twee krommen lezen',
  xCurveBody:'De machinekromme daalt bij toenemend debiet, de systeemkromme stijgt. Het werkpunt ligt op het snijpunt: je stelt het niet rechtstreeks in, je verschuift alleen één van beide krommen. Smoren verschuift de systeemkromme, toerental en parallelbedrijf de machinekromme.',
  xOpBody:'Debiet, opvoerhoogte of druk, rendement en elektrisch vermogen in het snijpunt. Ze worden niet ingevoerd maar afgelezen: elke instelling verandert ze allemaal.',
  xBudgetBody:'Waar de geleverde opvoerhoogte of druk heen gaat: statisch en drukverschil, rechte leiding of kanaal, appendages, klep, filter en batterij. De langste balk laat zien waar een wijziging loont.',
  xNpshBody:'NPSHa is wat de zuigzijde biedt, NPSHr is wat de pomp nodig heeft. De marge is het verschil; wordt die negatief, dan caviteert de pomp. Warm medium, een gesmoorde zuigklep of een lager bronniveau eten er aan.',
  xBaselineBody:'„Referentie vastzetten” bewaart de huidige toestand. Elke latere wijziging wordt daartegen gerapporteerd — in „Wat veranderde?” en in de vergelijkingstabel; de vastgezette krommen worden gestreept getekend.',
  xExploreBody:'Verkennen maakt van de tool een korte voorspeloefening: kies wat een wijziging doet, laat de tool die toepassen en vergelijk. De huidige toestand wordt eerst vastgezet, zodat de wijziging zichtbaar blijft.',
  xPaste:'Krommegegevens — plakken of importeren',xPreview:'Herkende punten',xUnits:'Eenheden van de geplakte gegevens',
  xRelated:'Verwante tools',xModelNotes:'Model, aannames en grenzen',
  xNoRoot:'Geen werkpunt',xLive:'Alle weergaven bewegen mee.',
  xImportUnitsHint:'Ze beschrijven de geplakte kolommen, niet de weergave.'},
 fr:{xLimitValues:'Valeurs limites',xOther:'Autre',xPowerBasis:'Base de puissance de la colonne collée',xBareMsg:'La couche d’interface partagée (diagram-ui.js) n’a pas été chargée : voici le formulaire simple. Tous les nombres, le permalien, le rapport PDF et les exports sont calculés dans cette page et fonctionnent toujours.',xView:'Affichage',xMachineMode:'Machine',xPump:'Pompe',xFan:'Ventilateur',xWorkspace:'Mode de travail',
  xUp:'↑ Augmente',xSame:'≈ Quasi inchangé',xDown:'↓ Diminue',xScore:'Score',
  xWhat:'Ce que fait cet outil',xCurveTopic:'Lire les deux courbes',
  xCurveBody:'La courbe machine descend quand le débit augmente, la courbe réseau monte. Le point de fonctionnement est leur intersection : il ne se règle pas directement, on ne déplace que l’une des deux courbes. L’étranglement déplace la courbe réseau, la vitesse et le parallèle la courbe machine.',
  xOpBody:'Débit, hauteur ou pression, rendement et puissance électrique au point d’intersection. Ce ne sont pas des entrées mais des lectures : chaque réglage les modifie toutes.',
  xBudgetBody:'Où passe la hauteur ou la pression produite : statique et différence de pression, conduite ou gaine droite, vannes, registre, filtre et batterie. La barre la plus longue indique où agir.',
  xNpshBody:'Le NPSHa est ce qu’offre l’aspiration, le NPSHr ce qu’exige la pompe. La marge est leur différence ; négative, la pompe cavite. Liquide chaud, vanne d’aspiration étranglée ou niveau amont plus bas la réduisent.',
  xBaselineBody:'« Figer la référence » enregistre l’état courant. Toute modification ultérieure est rapportée par rapport à lui — dans « Qu’est-ce qui a changé ? » et dans le tableau de comparaison ; les courbes figées sont tracées en pointillés.',
  xExploreBody:'Le mode Explorer transforme l’outil en court exercice de prédiction : choisissez l’effet attendu, laissez l’outil appliquer le changement et comparez. L’état courant est figé d’abord, pour que le changement reste visible.',
  xPaste:'Données de courbe — coller ou importer',xPreview:'Points reconnus',xUnits:'Unités des données collées',
  xRelated:'Outils liés',xModelNotes:'Modèle, hypothèses et limites',
  xNoRoot:'Pas de point de fonctionnement',xLive:'Toutes les vues évoluent ensemble.',
  xImportUnitsHint:'Elles décrivent les colonnes collées, pas l’affichage.'},
 es:{xLimitValues:'Valores límite',xOther:'Otro',xPowerBasis:'Base de potencia de la columna pegada',xBareMsg:'La capa de interfaz compartida (diagram-ui.js) no se cargó, por lo que se muestra el formulario simple. Todos los números, el enlace permanente, el informe PDF y las exportaciones se calculan en esta página y siguen funcionando.',xView:'Vista',xMachineMode:'Máquina',xPump:'Bomba',xFan:'Ventilador',xWorkspace:'Modo de trabajo',
  xUp:'↑ Aumenta',xSame:'≈ Casi igual',xDown:'↓ Disminuye',xScore:'Puntuación',
  xWhat:'Qué hace esta herramienta',xCurveTopic:'Leer las dos curvas',
  xCurveBody:'La curva de la máquina baja al aumentar el caudal y la curva del sistema sube. El punto de operación es su intersección: no se fija directamente, solo se desplaza una de las dos curvas. Estrangular mueve la curva del sistema; la velocidad y el paralelo, la de la máquina.',
  xOpBody:'Caudal, altura o presión, eficiencia y potencia eléctrica en la intersección. No se introducen, se leen: cualquier ajuste las cambia todas.',
  xBudgetBody:'Adónde va la altura o la presión producida: estática y diferencia de presión, tubería o conducto recto, válvulas, compuerta, filtro y batería. La barra más larga indica dónde compensa actuar.',
  xNpshBody:'El NPSHa es lo que ofrece la aspiración y el NPSHr lo que exige la bomba. El margen es la diferencia; si es negativo, la bomba cavita. Líquido caliente, válvula de succión estrangulada o nivel de origen más bajo lo reducen.',
  xBaselineBody:'«Fijar referencia» guarda el estado actual. Cada cambio posterior se informa frente a él —en «¿Qué cambió?» y en la tabla de comparación— y las curvas fijadas se dibujan a trazos.',
  xExploreBody:'Explorar convierte la herramienta en un breve ejercicio de predicción: elija qué hará un cambio, deje que la herramienta lo aplique y compare. El estado actual se fija primero para que el cambio quede visible.',
  xPaste:'Datos de curva — pegar o importar',xPreview:'Puntos reconocidos',xUnits:'Unidades de los datos pegados',
  xRelated:'Herramientas relacionadas',xModelNotes:'Modelo, hipótesis y límites',
  xNoRoot:'Sin punto de operación',xLive:'Todas las vistas se actualizan juntas.',
  xImportUnitsHint:'Describen las columnas pegadas, no lo que se muestra.'}
,pl:{xLimitValues:"Wartości graniczne",xOther:"Inne",xPowerBasis:"Rodzaj mocy w wklejonej kolumnie",xBareMsg:"Nie załadowała się współdzielona warstwa interfejsu (diagram-ui.js), dlatego wyświetlany jest formularz podstawowy. Wszystkie obliczenia, permalink, raport PDF i eksporty są wykonywane na tej stronie i nadal działają.",xView:"Pogląd",xMachineMode:"Maszyna",xPump:"Pompa",xFan:"Wentylator",xWorkspace:"Przestrzeń robocza",
  xUp:"↑ Wzrost",xSame:"≈ Bez zmian",xDown:"↓ Spadek",xScore:"Wynik",
  xWhat:"Co to narzędzie robi",xCurveTopic:"Jak czytać dwie charakterystyki",
  xCurveBody:"Charakterystyka maszyny opada wraz ze wzrostem przepływu, a charakterystyka instalacji rośnie. Punkt pracy leży na ich przecięciu — nie można ustawić go bezpośrednio, można jedynie przesuwać jedną z dwóch charakterystyk. Dławienie przesuwa charakterystykę instalacji, a prędkość i równoległa praca maszyn — charakterystykę maszyny.",
  xOpBody:"Przepływ, wysokość podnoszenia lub ciśnienie, sprawność i moc elektryczna w punkcie przecięcia. Są odczytywane z charakterystyk, a nie wprowadzane ręcznie: każda z tych wartości zmienia się po zmianie nastawy.",
  xBudgetBody:"Pokazuje, na co zużywana jest wysokość podnoszenia lub ciśnienie wytwarzane przez maszynę: wysokość statyczna i różnica ciśnień, proste odcinki rur lub kanałów, zawory, przepustnice, filtr i wymiennik. Wysoki słupek wskazuje miejsce, w którym zmiana może dać największy efekt.",

function statusFor(R){

  badge:R.reason==='curveRange'?t('badgeCurveLimit'):t('badgeNoRoot'),chips:[],issues:[noPointText(R)],missing:false};
 const Lm=scaledLimits(),issues=[];let msg=t('good'),tone='ok',badge='✓';
 if(Number.isFinite(R.margin)&&R.margin<0)issues.push({sev:2,text:t('cav')});
 if(Number.isFinite(Lm.minFlow)&&R.Q<Lm.minFlow)issues.push({sev:2,text:t('belowMin')});
 if(Number.isFinite(Lm.aorMin)&&Number.isFinite(Lm.aorMax)&&(R.Q<Lm.aorMin||R.Q>Lm.aorMax))issues.push({sev:2,text:t('outsideAor')});
 else if(Number.isFinite(Lm.porMin)&&Number.isFinite(Lm.porMax)&&(R.Q<Lm.porMin||R.Q>Lm.porMax))issues.push({sev:1,text:t('outsidePor')});
 else if(Number.isFinite(Lm.porMin)&&Number.isFinite(Lm.porMax))msg=t('insidePor');
 if(Number.isFinite(Lm.motorRatingW)&&Number.isFinite(R.Ps)&&R.Ps>Lm.motorRatingW)issues.push({sev:2,text:t('motorOver')});
 if(Lm.npshMarginMode==='absolute'&&Number.isFinite(Lm.npshMarginValue)&&Number.isFinite(R.margin)&&R.margin<Lm.npshMarginValue)issues.push({sev:1,text:t('npshReqFail')});
 if(Lm.npshMarginMode==='ratio'&&Number.isFinite(Lm.npshMarginValue)&&Number.isFinite(R.Na)&&Number.isFinite(R.Nr)&&R.Nr>0&&R.Na/R.Nr<Lm.npshMarginValue)issues.push({sev:1,text:t('npshReqFail')});
 if(R.noStable)issues.push({sev:2,text:t('pumpNoStable')});
 if(R.roots&&R.roots.length>1)issues.push({sev:1,text:t('pumpMultiRoot').replace('%n',R.roots.length)});
 if(issues.length){const worst=Math.max.apply(null,issues.map(x=>x.sev));
  tone=worst>=2?'bad':'warn';msg=issues.map(x=>x.text).join(' ');badge=worst>=2?t('badgeLimit')+' ✕':t('badgeLimit')+' ⚠'}
 else if(!(Number.isFinite(Lm.porMin)&&Number.isFinite(Lm.porMax))){msg=t('limitsMissing');tone='warn';badge=t('badgeLimits')}
 const issueTexts=issues.map(x=>x.text),missing=!issues.length&&tone==='warn';
 const bep=currentBepQ(),chips=[];
 if(Number.isFinite(bep)&&bep>0)chips.push([t('bepDistance')+': ',fmt((R.Q/bep-1)*100,1)+'%']);
 if(Number.isFinite(Lm.porMin)&&Number.isFinite(Lm.porMax))chips.push(['POR ',fmt(Lm.porMin*3600,1)+'–'+fmt(Lm.porMax*3600,1)+' m³/h']);
 if(Number.isFinite(Lm.aorMin)&&Number.isFinite(Lm.aorMax))chips.push(['AOR ',fmt(Lm.aorMin*3600,1)+'–'+fmt(Lm.aorMax*3600,1)+' m³/h']);
 return {tone,text:msg,badge,chips,issues:issueTexts,missing};
}
function statusForFan(R){
 if(!R.ok)return {tone:'bad',text:t('fanNoRoot'),badge:'—',chips:[]};
 const issues=[];
 if(R.unstable)issues.push(t('fanUnstable'));
 const mr=Number(fanMachine.limits&&fanMachine.limits.motorRatingW);
 if(Number.isFinite(mr)&&mr>0&&Number.isFinite(R.Ps)&&R.Ps>mr*F.fans)issues.push(t('fanMotorOver'));
 if(R.dp>3000)issues.push(t('fanHighPressure'));

 return {tone:issues.length?'warn':'ok',text:issues.length?issues.join(' '):t('fanStable'),
  badge:R.unstable?'⚠':'✓',chips};
}

function syncExplore(){

  clearNode(exNodes.sel);

 if(mode==='fan')fanBaseline=fanSnapshot();else baseline=snapshot();
 sc.apply();
 const after=rerun();
 const a=learnValue(before,sc.metric),b=learnValue(after,sc.metric),dir=learnDirection(a,b),ok=dir===learnPrediction;

  ((after&&after.ok)?(lt('observed')+': <span class="op-arrow">'+(dir==='up'?'↑':dir==='down'?'↓':'≈')+'</span> '+
   learnDisplay(a,sc.metric)+' → '+learnDisplay(b,sc.metric)+' '+learnUnit(sc.metric)+'.'):lt('noPoint'))+
  '<div class="op-note">'+lt('because')+': '+lt(sc.why)+'</div>';

}

    stEff=app.stage({slot:'dock',caption:L('effpower'),minHeight:220,
     a11y:function(){return t('effpower')},render:drawEff});
    stAux=app.stage({slot:'dock',caption:auxCaption(),minHeight:220,
     a11y:function(){return mode==='fan'?t('densityFanLaws'):'NPSH'},render:drawAux});
    stEff.node.classList.add('op-dock-cell');stAux.node.classList.add('op-dock-cell');
   }
  },
  footer:function(host,app){
   const d=document.createElement('details');
   d.appendChild(e('summary',{text:t('xModelNotes')}));
   d.appendChild(e('p',{class:'op-note',text:manifestText('limitations')}));
   d.appendChild(e('p',{class:'op-note',text:t('ductHandoff')}));
   host.appendChild(d);
   const row=e('div',{class:'dgu-panel-actions'});
   row.appendChild(e('span',{class:'op-note',text:t('xRelated')}));
   const a=e('a',{class:'dgu-btn',href:'ductnetwork.html?lang='+encodeURIComponent(lang),
    target:'_blank',rel:'noopener',text:t('openDuct')});

 });
 nodeBudget.id='op-budget';

 if(window.Diagram&&Diagram.setDocumentLang)Diagram.setDocumentLang(lang);

 initDiagram();
 window.__operatingpoint={ui:ui,solve:solve,fanSolve:fanSolve,state:uiState,clamped:()=>permalinkClamp.slice()};
}

/* Local repair: the framework labels a toggle field with <label for> pointing
   at the wrapper span, so the checkbox itself has no accessible name and the
   label does not activate it. Belongs upstream in diagram-ui.js. */
function repairToggles(){
 document.querySelectorAll('.dgu-app .dgu-field.toggle').forEach(function(f){
  const lab=f.querySelector('label.dgu-flabel'),box=f.querySelector('input[type=checkbox]');
  if(!lab||!box)return;
  if(!box.id)box.id=(f.dataset.dguField||'f')+'-box';
  lab.setAttribute('for',box.id);
  box.setAttribute('aria-label',lab.textContent.replace('?','').trim());
 });
}

/* ------------------------------------------------------------- bare boot --
   diagram-ui.js blocked: the tool still computes, still exports, still links. */
function bootBare(){
 const host=document.getElementById('app')||document.body;
 host.innerHTML='';host.className='op-bare';
 host.appendChild(e('h1',{text:t('title')}));
 host.appendChild(e('p',{text:t('subtitle')}));
 host.appendChild(e('p',{text:t('xBareMsg')}));
 const seg=e('div',{class:'op-bare-row'});
 [['pump','xPump'],['fan','xFan']].forEach(([m,k])=>{
  const b=e('button',{type:'button',text:t(k)});
  b.addEventListener('click',()=>{mode=m;bareRender()});seg.appendChild(b)});
 host.appendChild(seg);
 const rows=e('div',{class:'op-bare-row'});host.appendChild(rows);
 const svgWrap=e('div');const svg=document.createElementNS(NS,'svg');
 svg.setAttribute('id','mainPlot');svg.setAttribute('role','img');svg.setAttribute('aria-label','Pump and system head-flow curves');
 const svgF=document.createElementNS(NS,'svg');
 svgF.setAttribute('id','fanMainPlot');svgF.setAttribute('role','img');svgF.setAttribute('aria-label','Fan and system pressure-flow curves');
 svgWrap.appendChild(svg);svgWrap.appendChild(svgF);host.appendChild(svgWrap);
 const out=e('div',{class:'op-bare-out',role:'status','aria-live':'polite'});host.appendChild(out);
 function field(label,get,set,min,max,step){
  const w=e('label',{});w.appendChild(document.createTextNode(label+' '));
  const i=e('input',{type:'number'});i.min=min;i.max=max;i.step=step;i.value=get();
  i.addEventListener('change',()=>{const v=parseFloat(i.value);if(Number.isFinite(v)){set(v);bareRender()}});
  w.appendChild(i);rows.appendChild(w);return i;
 }
 function bareRender(){
  clearNode(rows);
  if(mode==='fan'){
   field(t('fanSpeed'),()=>F.speed,v=>F.speed=v,50,120,1);
   field(t('damperOpening'),()=>F.damper,v=>F.damper=v,15,100,1);
   field(t('filterLoading'),()=>F.filterLoad,v=>F.filterLoad=v,0,100,1);
   field(t('airTemp'),()=>F.temp,v=>F.temp=v,-10,55,1);
  }else{
   field(t('speed'),()=>S.speed,v=>S.speed=v,50,120,1);
   field(t('dvalve'),()=>S.dvalve,v=>S.dvalve=v,10,100,1);
   field(t('destElev'),()=>S.z2,v=>S.z2=v,0,32,.5);
   field(t('temp'),()=>S.temp,v=>S.temp=v,5,95,1);
  }
  const w=Math.max(280,Math.min(720,(document.getElementById('app')||document.body).clientWidth-40)),h=Math.round(w*0.5);
  setVis(svg,mode!=='fan');setVis(svgF,mode==='fan');
  if(mode==='fan'){const R=fanSolve();lastFanR=R;sizePx(svgF,w,h);renderFanMain(svgF,w,h,R);
   out.textContent=R.ok?('Q '+fmt(R.Q,2)+' m³/s · Δp '+fmt(R.dp,0)+' Pa · η '+(Number.isFinite(R.eta)?fmt(R.eta*100,1):'—')+' % · P1 '+(Number.isFinite(R.Pe)?fmt(R.Pe/1000,2):'—')+' kW'):t('fanNoRoot')}
  else{const R=solve();lastR=R;sizePx(svg,w,h);renderMain(svg,w,h,R);
   out.textContent=R.ok?('Q '+fmt(R.Q*3600,1)+' m³/h · H '+fmt(R.H,1)+' m · η '+(Number.isFinite(R.eta)?fmt(R.eta*100,1):'—')+' % · P1 '+(Number.isFinite(R.Pe)?fmt(R.Pe/1000,2):'—')+' kW'):t('noroot')}
 }
 window.__opBare=bareRender;
 bareRender();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
