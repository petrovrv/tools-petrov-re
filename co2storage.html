  "en": "Estimates storage capacity using Goodman et al. (2011) efficiency factors (P10/P50/P90) for saline aquifers and p/z refill for depleted gas fields, and derives the required well count from radial Darcy injectivity limited by the tubing erosional velocity. Computes the wellbore pressure and temperature profile with Span–Wagner CO₂ properties, compares the required wellhead pressure with the arrival pressure (booster compression or choking with Joule–Thomson cooling), and compares the levelised storage cost with a tariff.",
  "uk": "Оцінює ємність зберігання за коефіцієнтами ефективності Goodman et al. (2011) (P10/P50/P90) для солоних водоносних горизонтів і за повторним заповненням p/z для виснажених газових родовищ, а також визначає потрібну кількість свердловин на основі радіальної приймальності за Дарсі з обмеженням за ерозійною швидкістю в НКТ. Розраховує профіль тиску й температури у стовбурі свердловини з властивостями CO₂ за Span–Wagner, порівнює потрібний тиск на гирлі з тиском надходження (дотискувальний компресор або дроселювання з охолодженням Джоуля–Томсона) та зіставляє нормовану вартість зберігання з тарифом.",

  "nl": "Schat de opslagcapaciteit met efficiëntiefactoren volgens Goodman et al. (2011) (P10/P50/P90) voor zoute aquifers en met p/z-hervulling voor uitgeputte gasvelden, en leidt het benodigde aantal putten af uit radiale Darcy-injectiviteit, begrensd door de erosiesnelheid in de tubing. Berekent het druk- en temperatuurprofiel in de put met CO₂-eigenschappen volgens Span–Wagner, vergelijkt de vereiste putkopdruk met de aankomstdruk (boostercompressie of smoren met Joule-Thomson-afkoeling) en zet de genivelleerde opslagkosten af tegen een tarief.",
  "fr": "Estime la capacité de stockage à l'aide des facteurs d'efficacité de Goodman et al. (2011) (P10/P50/P90) pour les aquifères salins et du remplissage p/z pour les gisements de gaz déplétés, et déduit le nombre de puits requis de l'injectivité radiale de Darcy limitée par la vitesse d'érosion dans le tubing. Calcule le profil de pression et de température dans le puits avec les propriétés du CO₂ selon Span–Wagner, compare la pression en tête de puits requise à la pression d'arrivée (surpresseur ou duse avec refroidissement Joule-Thomson) et confronte le coût actualisé de stockage à un tarif.",
  "es": "Estima la capacidad de almacenamiento con los factores de eficiencia de Goodman et al. (2011) (P10/P50/P90) para acuíferos salinos y con el rellenado p/z para yacimientos de gas agotados, y obtiene el número de pozos necesario a partir de la inyectividad radial de Darcy limitada por la velocidad erosional en el tubing. Calcula el perfil de presión y temperatura en el pozo con propiedades del CO₂ según Span–Wagner, compara la presión requerida en cabeza de pozo con la presión de llegada (compresión booster o estrangulamiento con enfriamiento Joule-Thomson) y contrasta el coste nivelado de almacenamiento con una tarifa.",

  function RENDER_PROFILE(size, st, last, core) {
    var ctx = st.canvas(), w = size.w, h = size.h, coarse = size.density === 'coarse';
    var cs = getComputedStyle(document.documentElement);
    var muted = cs.getPropertyValue('--muted').trim() || '#777', line = cs.getPropertyValue('--line').trim() || '#ddd';
    var font = '400 12px ' + (cs.getPropertyValue('--font').trim() || 'sans-serif');
    var c0 = DiagramUI.series(0), c1 = DiagramUI.series(1), c2 = DiagramUI.series(2);
    ctx.clearRect(0, 0, w, h);
    var pr = last && last.wellbore && last.wellbore.profile;
    if (!pr || !pr.length) return;
    var L = coarse ? 34 : 46, B = 32, T = 30, R = 14, pw = w - L - R, ph = h - T - B;
    var i, q, x, y, tk, top = pr[0], res = last.reservoir || {};
    var zMax = 0, pMax = 0, tMin = Infinity, tMax = -Infinity;
    for (i = 0; i < pr.length; i++) {
      q = pr[i]; zMax = Math.max(zMax, q.z); pMax = Math.max(pMax, q.p);
      tMin = Math.min(tMin, q.T); tMax = Math.max(tMax, q.T); if (q.z < top.z) top = q;
    }
    if (isFinite(res.p_res)) pMax = Math.max(pMax, res.p_res);
    if (isFinite(res.BHP_max)) pMax = Math.max(pMax, res.BHP_max);
    pMax = (pMax / 1e5) * 1.05 || 1; zMax = zMax || 1; tMin -= 5; tMax += 5;
    function XP(pa) { return L + (pa / 1e5) / pMax * pw; }
    function XT(k) { return L + (k - tMin) / (tMax - tMin) * pw; }
    function Y(z) { return T + z / zMax * ph; }
    ctx.font = font; ctx.lineWidth = 1; ctx.setLineDash([]); ctx.strokeStyle = line;
    ctx.strokeRect(L + 0.5, T + 0.5, pw, ph);
    ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    tk = DiagramUI.ticks(0, pMax, pw, size.density);
    for (i = 0; i < tk.length; i++) {
      x = Math.round(L + tk[i] / pMax * pw) + 0.5; if (x < L || x > L + pw + 1) continue;
      ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke();
      ctx.fillText(DiagramUI.fmt(tk[i], { precision: 0 }), x, T + ph + 4);
    }
    ctx.textAlign = 'right'; ctx.fillText('bar', L + pw, T + ph + 18);
    ctx.fillStyle = c1; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    tk = DiagramUI.ticks(tMin - 273.15, tMax - 273.15, pw, size.density);
    for (i = 0; i < tk.length; i++) {
      x = XT(tk[i] + 273.15); if (x < L - 1 || x > L + pw + 1) continue;
      ctx.fillText(DiagramUI.fmt(tk[i], { precision: 0 }), x, T - 4);
    }
    ctx.textAlign = 'right'; ctx.fillText('°C', L + pw, T - 16);
    ctx.fillStyle = muted; ctx.textBaseline = 'middle';
    tk = DiagramUI.ticks(0, zMax, ph, size.density);
    for (i = 0; i < tk.length; i++) {
      y = Math.round(Y(tk[i])) + 0.5; if (y < T || y > T + ph + 1) continue;
      ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
      ctx.fillText(DiagramUI.fmt(tk[i], { precision: 0 }), L - 4, y);
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText('m', 2, T - 4);
    function plot(fx, col, lw, dash) {
      var j, on = false, px;
      ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash);
      for (j = 0; j < pr.length; j++) {
        px = fx(pr[j]);
        if (isFinite(px)) { if (on) ctx.lineTo(px, Y(pr[j].z)); else ctx.moveTo(px, Y(pr[j].z)); on = true; } else on = false;
      }
      ctx.stroke(); ctx.setLineDash([]);
    }
    plot(function (o) { return XT(o.T); }, c1, 1.5, []);
    plot(function (o) {
      if (!(o.T < 304.1282)) return NaN;
      try { return XP(core.sat(o.T).p); } catch (e) { return NaN; }
    }, c2, 1.5, [6, 4]);
    plot(function (o) { return XP(o.p); }, c0, 2.5, []);
    if (isFinite(res.BHP_max)) {
      x = Math.round(XP(res.BHP_max)) + 0.5;
      ctx.strokeStyle = muted; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.fillText('BHP max', x - 3, T + 4);
    }
    x = XP(top.p); y = Y(top.z);
    ctx.fillStyle = c0; ctx.beginPath(); ctx.arc(x, y, coarse ? 5 : 3.5, 0, 2 * Math.PI); ctx.fill();
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText('WHP', x + 6, y + 4);
    if (last.wellbore.status === 'vacuum') {
      ctx.fillStyle = c0; ctx.textAlign = 'center'; ctx.fillText('vacuum', L + pw / 2, T + 20);
    }
  }

          'Typowy lądowy poziom wodonośny'),
        'Screening values; onshore, fracture gradient constraint.',
        { type: 'saline', offshore: false, depth: 1800, p_res: 180e5, T_res: 333.15, k_mD: 100,
          h: 50, mdot_Mty: 1, T_surf: 283.15, frac_grad: 16500, platform: 'none' })
    ];
  }

  function DATA_HANDOFF(getLast, state, rerun) {
    return {
      provides: ['p', 'mdot', 'T'],
      accepts: ['mdot', 'p', 'T'],
      build: function () {
        var r = getLast();
        if (!r || !r.ok) return null;
        return {
          quantities: {
            p: { value: r.WHP, unit: 'Pa' },
            mdot: { value: r.inputs.mdot, unit: 'kg/s' },
            T: { value: r.inputs.T_wh, unit: 'K' }
          },
          sets: { storage: [{ p: { value: r.WHP, unit: 'Pa' } }] }
        };
      },
      apply: function (p) {
        var q = (p && p.quantities) || {};
        if (q.mdot && isFinite(q.mdot.value)) state.mdot_Mty = q.mdot.value * 365.25 * 86400 / 1e9;
        if (q.p && isFinite(q.p.value)) state.p_arrival = q.p.value;
        if (q.T && isFinite(q.T.value)) state.T_wh = q.T.value;
        rerun();
      }
    };
  }

var state=JSON.parse(JSON.stringify(DEFAULTS));
var last=null;
var stage=null;
var ui=null;

function core(){return (window.CCUS||{}).core;}
function solveNow(s){
  try{ return window.CCUS.storage.solve(toInp(s)); }
  catch(e){ return {ok:false,error:String(e&&e.message||e),warnings:[]}; }
}

function LEGEND_ITEMS(){
  return [
    {series:0,label:T('Pressure','Тиск','Druck','Druk','Pression','Presión','Ciśnienie')},
    {series:1,label:T('Temperature','Температура','Temperatur','Temperatuur','Température','Temperatura','Temperatura')},
    {series:2,dash:true,label:T('Saturation pressure','Тиск насичення','Sättigungsdruck','Verzadigingsdruk','Pression de saturation','Presión de saturación','Ciśnienie nasycenia')}
  ];
}

function adoptStage(app){
  stage=app.stages[0]||null;
  if(stage) stage.legend({items:LEGEND_ITEMS()});
}

function degrade(){
  document.title='diagram-ui.js v1 is required';
  var host=document.getElementById('app')||document.body;
  var h=document.createElement('h1');
  h.textContent='CO2 storage screening';
  host.appendChild(h);
  var p=document.createElement('p');
  p.textContent='This page needs diagram-ui.js v1 (tools.petrov.re/ui/v1), which could not be loaded.';
  host.appendChild(p);
  last=solveNow(state);
}

function buildInterface(){
  ui=DiagramUI.app({
    id:'co2storage', mount:'#app', layout:'calculator', compute:'live',
    state:state, defaults:DEFAULTS,
    subtitle:T('Capacity, wells and wellhead pressure for CO2 storage','Ємність, свердловини та тиск на гирлі для зберігання CO2','Kapazität, Bohrungen und Kopfdruck für die CO2-Speicherung','Capaciteit, putten en putmonddruk voor CO2-opslag','Capacité, puits et pression en tête de puits pour le stockage du CO2','Capacidad, pozos y presión en cabeza de pozo para el almacenamiento de CO2','Pojemność, odwierty i ciśnienie głowicowe dla składowania CO2'),
    notices:[{id:'genre',tone:'warn',sticky:true,
      title:T('What these numbers are','Що означають ці числа','Was diese Zahlen sind','Wat deze getallen zijn','Ce que représentent ces chiffres','Qué son estas cifras','Czym są te liczby'),
      text:T('Screening estimates for one homogeneous reservoir layer and pure CO2; not a storage permit or reservoir study.','Оціночні розрахунки для одного однорідного пласта та чистого CO2; не є дозволом на зберігання чи дослідженням пласта.','Screening-Abschätzungen für eine homogene Speicherschicht und reines CO2; keine Speichergenehmigung und keine Lagerstättenstudie.','Screeningschattingen voor één homogene reservoirlaag en zuivere CO2; geen opslagvergunning of reservoirstudie.','Estimations de présélection pour une couche réservoir homogène et du CO2 pur ; ni permis de stockage ni étude de réservoir.','Estimaciones de cribado para una capa de yacimiento homogénea y CO2 puro; no es un permiso de almacenamiento ni un estudio de yacimiento.','Szacunki przesiewowe dla jednej jednorodnej warstwy złożowej i czystego CO2; nie stanowią pozwolenia na składowanie ani studium złożowego.')}],
    /* glue fix: topics are objects, merged (model draft used Array concat) */
    learn:{version:1, intro:LEARN_A.intro, topics:Object.assign({},LEARN_A.topics,LEARN_B),
      tour:[
        {topic:'type',focus:'[data-dgu-field="f-type"]'},
        {topic:'pressure',focus:'[data-dgu-field="f-pres"]'},
        {topic:'injectivity',focus:'[data-dgu-field="f-k"]'},
        {topic:'whp',focus:'.dgu-r-results'},
        {topic:'profile',focus:'.dgu-stage'}
      ]},
    panels:PANELS_A().concat(PANELS_B()),
    footer:T('Model: volumetric capacity, radial-flow injectivity and a stepwise tubing pressure-temperature profile for pure CO2.','Модель: об\'ємна ємність, радіальна приймальність і покроковий профіль тиску й температури в НКТ для чистого CO2.','Modell: volumetrische Kapazität, Injektivität bei radialer Strömung und schrittweises Druck-Temperatur-Profil im Steigrohr für reines CO2.','Model: volumetrische capaciteit, injectiviteit bij radiale stroming en een stapsgewijs druk-temperatuurprofiel in de tubing voor zuivere CO2.','Modèle : capacité volumétrique, injectivité en écoulement radial et profil pression-température pas à pas dans le tubing pour du CO2 pur.','Modelo: capacidad volumétrica, inyectividad con flujo radial y perfil de presión y temperatura por pasos en la tubería para CO2 puro.','Model: pojemność wolumetryczna, chłonność przy przepływie radialnym i krokowy profil ciśnienia i temperatury w rurach dla czystego CO2.'),
    on:{
      rebuild:adoptStage,
      compute:function(s){
        last=solveNow(s);
        if(stage) stage.schedule();
        var a=COMPUTE_HEAD(last), b=COMPUTE_TABLES(last);
        return {verdict:a.verdict,tiles:a.tiles,meters:a.meters,tables:b.tables,notes:b.notes};
      }
    }
  });
  ui.panel({id:'io',slot:'inputs',actionsAlign:'end',actions:[ui.resetAction()]});
  ui.examples(EXAMPLES());
  ui.stage({
    caption:T('Pressure and temperature in the injection tubing','Тиск і температура в нагнітальних НКТ','Druck und Temperatur im Injektionsstrang','Druk en temperatuur in de injectietubing','Pression et température dans le tubing d\'injection','Presión y temperatura en la tubería de inyección','Ciśnienie i temperatura w rurach zatłaczających'),
    minHeight:300,
    a11y:function(){
      return last&&last.ok?('Wellhead pressure '+DiagramUI.fmt(last.WHP/1e5,{precision:1})+' bar, bottomhole '+DiagramUI.fmt(last.BHP/1e5,{precision:1})+' bar.'):'';
    },
    render:function(size,st){ RENDER_PROFILE(size,st,last,core()); }
  });
  adoptStage(ui);
  ui.ready();
  window.__co2storage={ui:ui,state:state,solve:solveNow};
}

function installData(){
  if(!window.Diagram) return;
  Diagram.init({
    id:'co2storage', file:'co2storage.html',
    state:{
      serialize:function(){ return state; },
      deserialize:function(o){ Object.assign(state,o||{}); last=solveNow(state); if(ui){ ui.sync(); ui.run(); } }
    },
    record:function(){
      if(!last||!last.ok) return null;
      return {
        inputs:toInp(state),
        outputs:{WHP:last.WHP,BHP:last.BHP,wells:last.Ntot,M50:last.capacity.M50,lcos:last.lcos},
        units:{WHP:'Pa',BHP:'Pa',M50:'kg',lcos:'EUR/t'},
        model:{
          equations:['M = A*h*phi*rho_CO2*E','q = 2*pi*k*h*dP/(mu*ln(re/rw))','dP/dz = rho*g - f*rho*v^2/(2*D)'],
          ranges:['screening'],
          notes:['prototype']
        },
        warnings:last.warnings
      };
    },
    handoff:DATA_HANDOFF(function(){ return last; }, state, function(){ last=solveNow(state); if(ui){ ui.sync(); ui.run(); } })
  });
}

function boot(){
  if(window.DiagramUI&&DiagramUI.api==='tools.petrov.re/ui/v1') buildInterface(); else degrade();
  installData();
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();

</script>
</body>
</html>
