const SL = ['en','uk','de','nl','fr','es','pl'];
let lang = 'en';
function t(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
/* one string in the tool languages, straight out of the dictionary above:
   L6(d => d.conv) is the sign-convention paragraph in every language. */
function L6(fn){ const o={}; SL.forEach(l=>{ try{ o[l]=fn(I18N[l]||I18N.en); }catch(e){ o[l]=fn(I18N.en); } }); return o; }
function J6(){ const parts=[].slice.call(arguments); return L6(d=>parts.map(f=>f(d)).filter(Boolean).join('\n\n')); }

/* =========================================================
   Model — unchanged arithmetic, lifted out of the DOM.
   Every function below is pure: it takes the state it needs and
   returns values.  Not one operation, constant, rounding or
   iteration order has been touched.
   ========================================================= */
function numOf(v){ const x=parseFloat(v); return isFinite(x)?x:0; }          /* was parseFloat(...)||0 */

function getBeam(s){
  const L = numOf(s.L);
  const type = s.sup;
  let supports=[]; // each {x, type:'pin'|'fixed'}
  if(type==="simple"){
    supports=[{x:0,kind:"pin"},{x:L,kind:"roller"}];
  }else if(type==="cantL"){
    supports=[{x:0,kind:"fixed"}];
  }else if(type==="cantR"){
    supports=[{x:L,kind:"fixed"}];
  }else{ // overhang / general two pins
    let a=parseFloat(s.sa), b=parseFloat(s.sb);
    supports=[{x:a,kind:"pin"},{x:b,kind:"roller"}];
  }
  return {L, type, supports};
}

/* ---- exact (closed-form) treatment of the distributed loads ---------------
   Every distributed load supported by this tool is linear in x over its own
   interval [a,b]:  w(s) = w1 + k*(s-a),  k=(w2-w1)/(b-a)   (k=0 for a UDL).
   All the integrals we need are therefore polynomials and are evaluated in
   closed form - no quadrature, no cell-size error at the edges of a load. */

// normalised span of a distributed load; null if the load is not distributed
function distSpan(ld){
  let a, b, w1, w2;
  if(ld.type==="udl"){ a=ld.a; b=ld.b; w1=ld.w; w2=ld.w; }
  else if(ld.type==="tri"){ a=ld.a; b=ld.b; w1=ld.w1; w2=ld.w2; }
  else return null;
  if(b<a){ const ta=a; a=b; b=ta; const t1=w1; w1=w2; w2=t1; }   // normalise
  return {a,b,w1,w2};
}

// exact partial integrals of w over [a, t] with t = clamp(x, a, b):
//   S0 = int_a^t w ds            (resultant of the part of the load left of x)
//   S1 = int_a^t w*(s-a) ds      (its first moment about a)
function distCut(sp, x){
  const t=Math.min(Math.max(x,sp.a),sp.b);
  const u=t-sp.a, len=sp.b-sp.a;
  if(u<=0 || len<=0) return {S0:0,S1:0};
  const k=(sp.w2-sp.w1)/len;
  return {S0: sp.w1*u + k*u*u/2,
          S1: sp.w1*u*u/2 + k*u*u*u/3};
}

// exact resultant and centroid of a whole distributed load
function distProps(ld){
  const sp=distSpan(ld);
  if(!sp) return {F:0, xbar:0};
  const c=distCut(sp, sp.b);
  return {F:c.S0, xbar: c.S0!==0 ? sp.a + c.S1/c.S0 : (sp.a+sp.b)/2};
}

// intensity contribution of a single distributed load at position x (drawing,
// and the load-intensity readout only - the statics never integrates this)
function loadIntensity(ld, x){
  const sp=distSpan(ld);
  if(!sp) return 0;
  if(x<sp.a-1e-9||x>sp.b+1e-9) return 0;
  if(sp.b===sp.a) return 0;
  const frac=(x-sp.a)/(sp.b-sp.a);
  return sp.w1 + (sp.w2-sp.w1)*frac;
}

// Solve reactions. Return {ok, reactions:[{x,kind,label,Ry,M?}], err}
function solveReactions(beam, loads){
  const L=beam.L;
  // sum of downward loads and their moment about origin
  // For each load compute vertical force (down positive) and its moment about 0.
  // Convention: take moments CCW positive.
  // Simpler: ΣFy=0 with up positive, ΣM about 0 with CCW positive.
  // Downward load magnitude Fd at x: Fy contribution = -Fd. Moment about origin (CCW) = x * Fy = -Fd*x.
  let sumFy=0;      // up positive; external loads only
  let sumM0=0;      // CCW positive; external loads moment about x=0
  for(const ld of loads){
    if(ld.type==="point"){
      sumFy += -ld.P;             // downward
      sumM0 += -ld.P*ld.x;        // r x F, CCW
    }else if(ld.type==="moment"){
      sumM0 += ld.M;              // applied CCW positive
    }else{ // distributed
      const p=distProps(ld);
      sumFy += -p.F;
      sumM0 += -p.F*p.xbar;
    }
  }

  const reactions=[];
  if(beam.type==="cantL"||beam.type==="cantR"){
    const xs = beam.supports[0].x;
    // Reaction force Ry (up) and reaction moment Mr (CCW) at fixed end.
    // ΣFy: Ry + sumFy = 0 -> Ry=-sumFy
    // ΣM about xs: Mr + (moment of external loads about xs) = 0
    const Ry = -sumFy;
    let Mext=0;
    for(const ld of loads){
      if(ld.type==="point"){ Mext += -ld.P*(ld.x-xs); }
      else if(ld.type==="moment"){ Mext += ld.M; }
      else{ const p=distProps(ld); Mext += -p.F*(p.xbar-xs); }
    }
    const Mr = -Mext;
    reactions.push({x:xs,kind:"fixed",label:"R",Ry, M:Mr});
    return {ok:true, reactions};
  }else{
    // two vertical supports at xa, xb
    const A=beam.supports[0], B=beam.supports[1];
    const xa=A.x, xb=B.x;
    if(Math.abs(xa-xb)<1e-9 || xa<0 || xb<0 || xa>L+1e-9 || xb>L+1e-9){
      return {ok:false, err:t("errNoSup")};
    }
    // ΣM about A (CCW): moment of external loads about A + Rb*(xb-xa) = 0
    let MextA=0;
    for(const ld of loads){
      if(ld.type==="point"){ MextA += -ld.P*(ld.x-xa); }
      else if(ld.type==="moment"){ MextA += ld.M; }
      else{ const p=distProps(ld); MextA += -p.F*(p.xbar-xa); }
    }
    const Rb = -MextA/(xb-xa);
    const Ra = -sumFy - Rb;
    reactions.push({x:xa,kind:A.kind,label:"R_A",Ry:Ra});
    reactions.push({x:xb,kind:B.kind,label:"R_B",Ry:Rb});
    return {ok:true, reactions};
  }
}

// Build Q and M sampled arrays. Handle discontinuities by sampling just-left/just-right.
function buildDiagrams(beam, reactions, loads, N){
  if(N===undefined) N=600;
  const L=beam.L;
  const xs=[], Q=[], M=[];
  // discrete upward point forces: reactions(Ry up) and applied point loads(down)
  const pts=[]; // {x, Fy(up positive)}
  const mos=[]; // applied concentrated moments {x, M ccw}
  for(const r of reactions){ pts.push({x:r.x, Fy:r.Ry}); if(r.M!==undefined) mos.push({x:r.x, M:r.M}); }
  for(const ld of loads){
    if(ld.type==="point") pts.push({x:ld.x, Fy:-ld.P});
    if(ld.type==="moment") mos.push({x:ld.x, M:ld.M});
  }
  // Q(x) = sum of upward forces strictly to the left of x + reaction/point forces at positions < x
  // With Q = sum upward forces left of x, and distributed downward load reduces Q as x grows:
  //   dQ/dx = -w(x)  where w is downward intensity (kN/m). And point up force adds +Fy jump.
  // dM/dx = Q(x). For sagging-positive M and CCW-positive applied moment, at the moment
  // location M jumps by -Mo when crossing left->right.
  // We build a set of sample x's including breakpoints, sampling both sides.
  const breaks=new Set([0,L]);
  for(const p of pts) breaks.add(clamp(p.x,0,L));
  for(const m of mos) breaks.add(clamp(m.x,0,L));
  for(const ld of loads){ const sp=distSpan(ld); if(sp){breaks.add(clamp(sp.a,0,L)); breaks.add(clamp(sp.b,0,L));} }
  const bpts=[...breaks].sort((a,b)=>a-b);

  // spans of the distributed loads, pre-normalised; integrated in closed form
  const spans=[]; for(const ld of loads){ const sp=distSpan(ld); if(sp) spans.push(sp); }

  // Shear just left ('L') or just right ('R') of x.
  // 'L' excludes the discrete forces sitting exactly at x, 'R' includes them.
  function shearAt(x, side){
    let q=0;
    for(const sp of spans) q -= distCut(sp,x).S0;   // downward distributed reduces shear
    for(const p of pts){
      if(side==='R'){ if(p.x <= x+1e-9) q+=p.Fy; }
      else { if(p.x < x-1e-9) q+=p.Fy; }
    }
    return q;
  }
  // Bending moment just left ('L') or just right ('R') of x:
  //   M(x) = sum over everything to the left of x of (upward force)*(x - x')
  //          minus the applied CCW couples that have been crossed.
  // A discrete force exactly at x has zero lever arm, so it never changes M;
  // a concentrated couple exactly at x DOES: it is included in the 'R' limit and
  // excluded from the 'L' limit.  The reaction moment of a fixed end is such a
  // couple, so the fixed-end moment shows up in the 'R' limit at a left fixed
  // support and in the 'L' limit at a right fixed support.
  function momentAt(x, side){
    let m=0;
    for(const sp of spans){
      const c=distCut(sp,x);                  // exact ∫ w ds and ∫ w (s-a) ds up to min(x,b)
      m -= (x-sp.a)*c.S0 - c.S1;              // = ∫ (-w)*(x-s) ds
    }
    for(const p of pts){
      if(p.x < x-1e-9) m += p.Fy*(x-p.x);     // forces exactly at x have zero arm
    }
    for(const mo of mos){
      if(side==='R'){ if(mo.x <= x+1e-9) m += -mo.M; }
      else { if(mo.x < x-1e-9) m += -mo.M; }
    }
    return m;
  }

  // Sample: within each segment sample several points; at breakpoints sample both sides.
  const perSeg=Math.max(4, Math.round(N/Math.max(1,bpts.length-1)));
  for(let s=0;s<bpts.length-1;s++){
    const x0=bpts[s], x1=bpts[s+1];
    for(let i=0;i<=perSeg;i++){
      let x=x0+(x1-x0)*i/perSeg;
      let side = (i===0)?'R':((i===perSeg)?'L':'M');
      // for endpoints of segment we want both discontinuity sides
      xs.push(x); Q.push(shearAt(x, side==='M'?'R':side)); M.push(momentAt(x, side==='M'?'R':side));
    }
  }
  return {xs,Q,M};
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

/* =========================================================
   Analyze extremes
   ========================================================= */
function analyze(d){
  let Qmax=-Infinity,Qmin=Infinity,Mmax=-Infinity,Mmin=Infinity;
  let xQmax=0,xQmin=0,xMmax=0,xMmin=0;
  for(let i=0;i<d.xs.length;i++){
    if(d.Q[i]>Qmax){Qmax=d.Q[i];xQmax=d.xs[i];}
    if(d.Q[i]<Qmin){Qmin=d.Q[i];xQmin=d.xs[i];}
    if(d.M[i]>Mmax){Mmax=d.M[i];xMmax=d.xs[i];}
    if(d.M[i]<Mmin){Mmin=d.M[i];xMmin=d.xs[i];}
  }
  // zero crossings of Q
  const zeros=[];
  for(let i=1;i<d.xs.length;i++){
    if((d.Q[i-1]<0&&d.Q[i]>0)||(d.Q[i-1]>0&&d.Q[i]<0)){
      const t=d.Q[i-1]/(d.Q[i-1]-d.Q[i]);
      zeros.push(d.xs[i-1]+(d.xs[i]-d.xs[i-1])*t);
    }
  }
  return {Qmax,Qmin,Mmax,Mmin,xQmax,xQmin,xMmax,xMmin,zeros};
}

/* the whole calculation, from state to the object the page has always held */
function solve(s){
  const beam=getBeam(s);
  const sol=solveReactions(beam, s.loads);
  if(!sol.ok) return {ok:false, err:sol.err, beam:beam};
  const d=buildDiagrams(beam, sol.reactions, s.loads);
  const a=analyze(d);
  return {ok:true, beam:beam, reactions:sol.reactions, d:d, a:a};
}

function sampleTable(n){
  const {d,beam}=lastResult;const L=beam.L;const out=[];
  for(let i=0;i<=n;i++){const x=L*i/n; out.push({x,Q:interp(d.xs,d.Q,x),M:interp(d.xs,d.M,x)});}
  return out;
}
function interp(xs,vs,x){
  if(x<=xs[0])return vs[0]; if(x>=xs[xs.length-1])return vs[vs.length-1];
  for(let i=1;i<xs.length;i++){if(xs[i]>=x){const t=(x-xs[i-1])/((xs[i]-xs[i-1])||1);return vs[i-1]+(vs[i]-vs[i-1])*t;}}
  return vs[vs.length-1];
}

/* the framework replaces app.state wholesale on reset and on an example; keep
   one object identity so the record, the permalink and the drawing all read
   the same state. */
function adopt(s, app){
  if(s===state) return;
  Object.keys(state).forEach(k=>{ delete state[k]; });
  Object.assign(state, s);
  if(app) app.state = state;
}

/* =========================================================
   Drawing.  The pictures are the tool's, unchanged in shape;
   what changed is that they now take their chrome colours from
   the token layer (so dark mode is readable), their tick density
   from DiagramUI.ticks, and their size from the stage.
   ========================================================= */
function palette(){
  const cs=getComputedStyle(document.documentElement);
  const g=(n,f)=>{ const v=cs.getPropertyValue(n).trim(); return v||f; };
  const dark = !!(window.DiagramUI && DiagramUI.theme.get()==='dark');
  return {
    ink:g('--ink','#12161d'), muted:g('--muted','#5b6675'), line:g('--line','#e2e7ee'),
    font:g('--font','-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif'),
    /* series colours: the light set is the tool's own palette, unchanged;
       the dark set is the same hues lifted for a dark panel */
    beam:  dark?'#94a3b8':'#334155',
    sup:   dark?'#5eead4':'#0f766e',
    load:  dark?'#a78bfa':'#7c3aed',
    loadInk:dark?'#c4b5fd':'#5b21b6',
    mom:   dark?'#fbbf24':'#b45309',
    q:     dark?'#fb7185':'#e11d48',
    m:     dark?'#60a5fa':'#2563eb',
    zero:  dark?'#22d3ee':'#0891b2',
    fill:  dark?'44':'22'
  };
}
const FS_SMALL = 12, FS_MICRO = 11;   /* --fs-small / --fs-micro, drawn physical */

function fmtTick(v){
  const a=Math.abs(v);
  return (a>=100||v===Math.round(v)) ? String(Math.round(v)) : (a>=1? v.toFixed(1) : v.toFixed(2));
}

function drawBeam(ctx,w,h,beam,reactions,loads,dens){
  const P=palette();
  ctx.clearRect(0,0,w,h);
  const L=beam.L||1;
  const padL=40,padR=40, y0=h*0.5;
  const sx=x=> padL+(w-padL-padR)*(x/L);
  // beam line
  ctx.strokeStyle=P.beam;ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(sx(0),y0);ctx.lineTo(sx(L),y0);ctx.stroke();
  // supports
  reactions.forEach(r=>{drawSupport(ctx,sx(r.x),y0,r.kind,P,w);});
  // loads
  loads.forEach(ld=>drawLoad(ctx,ld,sx,y0,L,P));
  // axis ticks
  ctx.fillStyle=P.muted;ctx.font='400 '+FS_MICRO+'px '+P.font;ctx.textAlign='center';
  DiagramUI.ticks(0,L,w-padL-padR,dens).forEach(v=>{ ctx.fillText(fmtTick(v),sx(v),y0+42); });
  ctx.textAlign='left';
}

function drawSupport(ctx,x,y,kind,P,w){
  ctx.fillStyle=P.sup;ctx.strokeStyle=P.sup;ctx.lineWidth=1.5;
  if(kind==="fixed"){
    ctx.beginPath();ctx.moveTo(x,y-26);ctx.lineTo(x,y+26);ctx.stroke();
    for(let i=-26;i<26;i+=7){ctx.beginPath();ctx.moveTo(x,y+i);ctx.lineTo(x+ (x>w/2? -12:12),y+i+7);ctx.stroke();}
  }else{
    ctx.beginPath();ctx.moveTo(x,y+2);ctx.lineTo(x-11,y+20);ctx.lineTo(x+11,y+20);ctx.closePath();ctx.stroke();
    if(kind==="roller"){
      ctx.beginPath();ctx.arc(x-5,y+24,3,0,7);ctx.arc(x+5,y+24,3,0,7);ctx.stroke();
    }else{
      ctx.beginPath();ctx.moveTo(x-13,y+24);ctx.lineTo(x+13,y+24);ctx.stroke();
      for(let i=-11;i<12;i+=6){ctx.beginPath();ctx.moveTo(x+i,y+24);ctx.lineTo(x+i-4,y+30);ctx.stroke();}
    }
  }
}

function drawLoad(ctx,ld,sx,y0,L,P){
  ctx.strokeStyle=P.load;ctx.fillStyle=P.load;ctx.lineWidth=1.5;
  if(ld.type==="point"){
    const dir=ld.P>=0?1:-1;
    const x=sx(ld.x);
    ctx.beginPath();
    if(dir>0){ctx.moveTo(x,y0-34);ctx.lineTo(x,y0-4);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y0-2);ctx.lineTo(x-4,y0-9);ctx.lineTo(x+4,y0-9);ctx.closePath();ctx.fill();}
    else{ctx.moveTo(x,y0+4);ctx.lineTo(x,y0+34);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y0+2);ctx.lineTo(x-4,y0+9);ctx.lineTo(x+4,y0+9);ctx.closePath();ctx.fill();}
    ctx.fillStyle=P.loadInk;ctx.font='400 '+FS_MICRO+'px '+P.font;
    ctx.fillText(Math.abs(ld.P)+"kN",x+3,dir>0?y0-36:y0+44);ctx.fillStyle=P.load;
  }else if(ld.type==="udl"||ld.type==="tri"){
    const a=sx(ld.a),b=sx(ld.b);
    const w1=ld.type==="udl"?ld.w:ld.w1, w2=ld.type==="udl"?ld.w:ld.w2;
    const maxw=Math.max(Math.abs(w1),Math.abs(w2),1e-6);
    const H=26;
    const h1=H*Math.abs(w1)/maxw, h2=H*Math.abs(w2)/maxw;
    ctx.fillStyle=P.load+'22';ctx.strokeStyle=P.load;
    ctx.beginPath();ctx.moveTo(a,y0-h1);ctx.lineTo(b,y0-h2);ctx.lineTo(b,y0-2);ctx.lineTo(a,y0-2);ctx.closePath();ctx.fill();ctx.stroke();
    const n=Math.max(2,Math.round((b-a)/22));
    for(let i=0;i<=n;i++){const xx=a+(b-a)*i/n;const hh=h1+(h2-h1)*i/n;
      ctx.beginPath();ctx.moveTo(xx,y0-hh);ctx.lineTo(xx,y0-4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(xx,y0-2);ctx.lineTo(xx-3,y0-7);ctx.lineTo(xx+3,y0-7);ctx.closePath();ctx.fill();}
    ctx.fillStyle=P.loadInk;ctx.font='400 '+FS_MICRO+'px '+P.font;
    const lbl=ld.type==="udl"?ld.w+"kN/m":w1+"→"+w2+"kN/m";
    ctx.fillText(lbl,(a+b)/2-16,y0-H-6);ctx.fillStyle=P.load;
  }else if(ld.type==="moment"){
    const x=sx(ld.x); const r=16; const ccw=ld.M>=0;
    ctx.strokeStyle=P.mom;ctx.fillStyle=P.mom;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y0,r,ccw?0.6:-0.6, ccw?5.5:5.5+0, ccw);ctx.stroke();
    const ang=ccw?5.4:1.0;
    const ax=x+r*Math.cos(ang), ay=y0+r*Math.sin(ang);
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-5,ay-2);ctx.lineTo(ax+1,ay+5);ctx.closePath();ctx.fill();
    ctx.font='400 '+FS_MICRO+'px '+P.font;ctx.fillText(Math.abs(ld.M)+"kN·m",x+r+2,y0-r);
    ctx.lineWidth=1.5;
  }
}

function drawDiagram(ctx,w,h,xs,vals,color,L,marks,dens){
  const P=palette();
  ctx.clearRect(0,0,w,h);
  const padL=48,padR=24,padT=14,padB=26;
  const y0=(h-padB+padT)/2;
  let vmax=Math.max(...vals,0.0001), vmin=Math.min(...vals,-0.0001);
  const span=Math.max(Math.abs(vmax),Math.abs(vmin))*1.15||1;
  const sx=x=>padL+(w-padL-padR)*(x/L);
  const sy=v=> padT+(h-padT-padB)*(1-(v+span)/(2*span));
  const zeroY=sy(0);
  // axis
  ctx.strokeStyle=P.line;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,h-padB);ctx.stroke();
  ctx.beginPath();ctx.moveTo(padL,zeroY);ctx.lineTo(w-padR,zeroY);ctx.stroke();
  // fill area
  ctx.beginPath();ctx.moveTo(sx(xs[0]),zeroY);
  for(let i=0;i<xs.length;i++) ctx.lineTo(sx(xs[i]),sy(vals[i]));
  ctx.lineTo(sx(xs[xs.length-1]),zeroY);ctx.closePath();
  ctx.fillStyle=color+P.fill;ctx.fill();
  // curve
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;
  for(let i=0;i<xs.length;i++){const X=sx(xs[i]),Y=sy(vals[i]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.stroke();
  // y labels — round values from the shared tick rule, never the raw half-span
  ctx.fillStyle=P.muted;ctx.font='400 '+FS_MICRO+'px '+P.font;ctx.textAlign="right";
  DiagramUI.ticks(-span,span,(h-padT-padB)*2,dens).forEach(v=>{ctx.fillText(fmtTick(v),padL-4,sy(v)+3);});
  ctx.textAlign="left";
  // x labels
  ctx.textAlign='center';
  DiagramUI.ticks(0,L,w-padL-padR,dens).forEach(v=>{ctx.fillText(fmtTick(v),sx(v),h-padB+13);});
  ctx.textAlign='left';
  // marks — kept clear of the y axis labels (UI_AUDIT: the shear label used to
  // collide with the top y-axis label at x = 0)
  if(marks) marks.forEach(m=>{
    const X=sx(m.x),Y=sy(m.v);
    ctx.fillStyle=m.color||color;ctx.beginPath();ctx.arc(X,Y,3.2,0,7);ctx.fill();
    ctx.font='400 '+FS_MICRO+'px '+P.font;ctx.fillStyle=P.ink;
    const tw=ctx.measureText(m.label).width;
    let lx=X+4; if(lx<padL+16) lx=padL+16; if(lx+tw>w-4) lx=Math.max(padL+8,X-4-tw);
    ctx.fillText(m.label,lx,Y+(m.v>=0?-4:12));
  });
}

/* Add load — the same clamp the tool has always applied, but the clamped value
   is now written back into the form and announced (spec section 6). */
function addLoad(app){
  const s=state, type=s.ltype, L=numOf(s.L);
  let clamped=false;
  const cl=(v,key)=>{ const c=clamp(numOf(v),0,L); if(c!==numOf(v)) {clamped=true; s[key]=c;} return c; };
  if(type==="point"){
    s.loads.push({type:type,P:numOf(s.pMag),x:cl(s.pPos,'pPos')});
  }else if(type==="udl"||type==="tri"){
    let a,b,ld;
    if(type==="udl"){ a=cl(s.wA,'wA'); b=cl(s.wB,'wB'); ld={type:type,w:numOf(s.wMag),a:a,b:b}; }
    else { a=cl(s.triA,'triA'); b=cl(s.triB,'triB'); ld={type:type,w1:numOf(s.triW1),w2:numOf(s.triW2),a:a,b:b}; }
    if(Math.abs(b-a)<1e-9){ notify(t("errBadSpan"),'err'); if(clamped) notify(t("clampNote"),'warn'); sync(app); return; }
    let note="";
    if(b<a){ const sp=distSpan(ld); ld.a=sp.a; ld.b=sp.b;
      if(type==="udl") ld.w=sp.w1; else { ld.w1=sp.w1; ld.w2=sp.w2; }
      note=t("noteSwapped"); }
    s.loads.push(ld);
    if(clamped) notify(t("clampNote"),'warn');
    if(note) notify(note,'warn');
    sync(app); return;
  }else{
    s.loads.push({type:type,M:numOf(s.mMag),x:cl(s.mPos,'mPos')});
  }
  if(clamped) notify(t("clampNote"),'warn');
  sync(app);
}
function notify(msg,kind){ if(ui) ui.notify(msg,{kind:kind}); else if(window.Diagram) Diagram.notify(msg,kind); }
function sync(app){ const a=app||ui; if(a){ a.sync(); a.run(); } else if(fb) fbSync(); }

const PY_BEAM = `def dist_span(ld):
    """Normalised span of a distributed load: (a, b, w1, w2); None if not distributed."""
    if ld["type"] == "udl":
        a, b, w1, w2 = ld["a"], ld["b"], ld["w"], ld["w"]
    elif ld["type"] == "tri":
        a, b, w1, w2 = ld["a"], ld["b"], ld["w1"], ld["w2"]
    else:
        return None
    if b < a:
        a, b = b, a
        w1, w2 = w2, w1
    return (a, b, w1, w2)


def dist_cut(sp, x):
    """Exact partial integrals of w over [a, clamp(x,a,b)]: (S0, S1)."""
    a, b, w1, w2 = sp
    t = min(max(x, a), b)
    u = t - a
    ln = b - a
    if u <= 0 or ln <= 0:
        return 0.0, 0.0
    k = (w2 - w1) / ln
    return w1 * u + k * u * u / 2.0, w1 * u * u / 2.0 + k * u * u * u / 3.0


def dist_props(ld):
    """Resultant and centroid of a whole distributed load."""
    sp = dist_span(ld)
    if sp is None:
        return 0.0, 0.0
    s0, s1 = dist_cut(sp, sp[1])
    return s0, (sp[0] + s1 / s0 if s0 != 0 else (sp[0] + sp[1]) / 2.0)


def get_beam():
    L = BEAM_LENGTH
    if SUPPORT_TYPE == "simple":
        sup = [(0.0, "pin"), (L, "roller")]
    elif SUPPORT_TYPE == "cantL":
        sup = [(0.0, "fixed")]
    elif SUPPORT_TYPE == "cantR":
        sup = [(L, "fixed")]
    else:
        sup = [(SUPPORT_A_X, "pin"), (SUPPORT_B_X, "roller")]
    return L, SUPPORT_TYPE, sup


def solve_reactions(beam):
    """Support reactions of the statically determinate beam."""
    L, typ, sup = beam
    sum_fy = 0.0
    for ld in LOADS:
        if ld["type"] == "point":
            sum_fy -= ld["P"]
        elif ld["type"] == "moment":
            pass
        else:
            f, _ = dist_props(ld)
            sum_fy -= f
    if typ in ("cantL", "cantR"):
        xs = sup[0][0]
        ry = -sum_fy
        mext = 0.0
        for ld in LOADS:
            if ld["type"] == "point":
                mext += -ld["P"] * (ld["x"] - xs)
            elif ld["type"] == "moment":
                mext += ld["M"]
            else:
                f, xbar = dist_props(ld)
                mext += -f * (xbar - xs)
        return [{"x": xs, "kind": "fixed", "label": "R", "Ry": ry, "M": -mext}]
    xa, xb = sup[0][0], sup[1][0]
    if abs(xa - xb) < 1e-9:
        raise ValueError("the two supports coincide - the beam is not solvable")
    mexta = 0.0
    for ld in LOADS:
        if ld["type"] == "point":
            mexta += -ld["P"] * (ld["x"] - xa)
        elif ld["type"] == "moment":
            mexta += ld["M"]
        else:
            f, xbar = dist_props(ld)
            mexta += -f * (xbar - xa)
    rb = -mexta / (xb - xa)
    ra = -sum_fy - rb
    return [{"x": xa, "kind": sup[0][1], "label": "R_A", "Ry": ra},
            {"x": xb, "kind": sup[1][1], "label": "R_B", "Ry": rb}]


def clamp(v, a, b):
    return max(a, min(b, v))


def build_diagrams(beam, reactions, n=600):
    """Sample Q(x) and M(x) on the same grid the page uses (breakpoints + n intervals)."""
    L = beam[0]
    pts = []
    mos = []
    for r in reactions:
        pts.append((r["x"], r["Ry"]))
        if "M" in r:
            mos.append((r["x"], r["M"]))
    for ld in LOADS:
        if ld["type"] == "point":
            pts.append((ld["x"], -ld["P"]))
        if ld["type"] == "moment":
            mos.append((ld["x"], ld["M"]))
    breaks = set([0.0, L])
    for x, _ in pts:
        breaks.add(clamp(x, 0.0, L))
    for x, _ in mos:
        breaks.add(clamp(x, 0.0, L))
    spans = []
    for ld in LOADS:
        sp = dist_span(ld)
        if sp:
            spans.append(sp)
            breaks.add(clamp(sp[0], 0.0, L))
            breaks.add(clamp(sp[1], 0.0, L))
    bpts = sorted(breaks)

    def shear_at(x, side):
        q = 0.0
        for sp in spans:
            q -= dist_cut(sp, x)[0]
        for px, fy in pts:
            if (px <= x + 1e-9) if side == "R" else (px < x - 1e-9):
                q += fy
        return q

    def moment_at(x, side):
        m = 0.0
        for sp in spans:
            s0, s1 = dist_cut(sp, x)
            m -= (x - sp[0]) * s0 - s1
        for px, fy in pts:
            if px < x - 1e-9:
                m += fy * (x - px)
        for mx, mv in mos:
            if (mx <= x + 1e-9) if side == "R" else (mx < x - 1e-9):
                m += -mv
        return m

    xs, qs, ms = [], [], []
    per_seg = max(4, int(round(n / max(1, len(bpts) - 1))))
    for s in range(len(bpts) - 1):
        x0, x1 = bpts[s], bpts[s + 1]
        for i in range(per_seg + 1):
            x = x0 + (x1 - x0) * i / per_seg
            side = "R" if i == 0 else ("L" if i == per_seg else "R")
            xs.append(x)
            qs.append(shear_at(x, side))
            ms.append(moment_at(x, side))
    return xs, qs, ms


def analyze(d):
    """Extreme values of Q and M and where they occur, on the sampled grid."""
    xs, qs, ms = d
    qmax = qmin = mmax = mmin = None
    xqmax = xqmin = xmmax = xmmin = 0.0
    for i in range(len(xs)):
        if qmax is None or qs[i] > qmax:
            qmax, xqmax = qs[i], xs[i]
        if qmin is None or qs[i] < qmin:
            qmin, xqmin = qs[i], xs[i]
        if mmax is None or ms[i] > mmax:
            mmax, xmmax = ms[i], xs[i]
        if mmin is None or ms[i] < mmin:
            mmin, xmmin = ms[i], xs[i]
    return {"Q_max": qmax, "x_Q_max": xqmax, "Q_min": qmin, "x_Q_min": xqmin,
            "M_max": mmax, "x_M_max": xmmax, "M_min": mmin, "x_M_min": xmmin}


def compute():
    beam = get_beam()
    reactions = solve_reactions(beam)
    out = {}
    for i, r in enumerate(reactions):
        k = "R_A" if i == 0 else "R_B"
        out[k + "_position"] = r["x"]
        out[k + "_force"] = r["Ry"]
        out[k + "_moment"] = r.get("M")
    out.update(analyze(build_diagrams(beam, reactions)))

    return {verdict:{tone:'bad',text:r.err},tiles:tiles(null)};
  }

  redraw(); syncCsvBtn();

function boot(){
  if(I18N[window.__diagramLang])lang=window.__diagramLang;

     diagram-ui.js missing, or a throw while building it — the data layer, the
     permalink and the exports still come up, so the finally clause below is the
     only place it is called from. */

}

/* UPSTREAM (framework defect, spec 9.3 / 16: the tour card never covers its own
   target).  Below md Learn.place() always docks the card to the bottom edge and
   clears the target by scrolling the page; when the target sits at the very end
   of the document there is nothing left to scroll and the card lands on it.
   Nudge the card to the other half of the viewport when that happens. */
function installTourGuard(){
  if(installTourGuard.done||!window.MutationObserver)return;
  installTourGuard.done=true;
  const place=function(){
    const card=document.querySelector('.dgu-tour'), spot=document.querySelector('.dgu-spot');
    if(!card||!spot)return;
    const c=card.getBoundingClientRect(), s=spot.getBoundingClientRect();
    if(c.right<s.left||c.left>s.right||c.bottom<s.top||c.top>s.bottom)return;   /* already clear */
    if(s.height>window.innerHeight-c.height-24)return;                          /* nothing would help */
    const top=(s.top+s.height/2>window.innerHeight/2)?12:Math.max(12,window.innerHeight-c.height-12);
    card.style.top=top+'px';
  };
  const soon=function(){ requestAnimationFrame(place); setTimeout(place,80); };
  const watch=function(card){ new MutationObserver(soon).observe(card,{childList:true,subtree:true}); soon(); };
  new MutationObserver(function(recs){
    recs.forEach(function(r){ Array.prototype.forEach.call(r.addedNodes,function(n){
      if(n.classList&&n.classList.contains('dgu-tour')) watch(n); }); });
  }).observe(document.body,{childList:true});
  window.addEventListener('resize',place);
}

function renderList(ul,app){
  while(ul.firstChild) ul.removeChild(ul.firstChild);
  if(!state.loads.length){
    const p=document.createElement('div');
    p.className='dgu-hint'; p.textContent=t('emptyList');
    ul.appendChild(p);
    return;
  }
  state.loads.forEach(function(ld,i){
    const li=document.createElement('li');
    const tag=document.createElement('span');
    tag.className='bd-tag '+(ld.type==='moment'?'moment':'force');
    const txt=document.createElement('span');
    txt.className='bd-txt'; txt.textContent=loadText(ld);
    const b=document.createElement('button');
    b.type='button'; b.className='dgu-btn ghost'; b.textContent=t('del');
    b.setAttribute('aria-label',t('del')+': '+loadText(ld));
    b.onclick=function(){ state.loads.splice(i,1); sync(app); };
    li.appendChild(tag); li.appendChild(txt); li.appendChild(b);
    ul.appendChild(li);
  });
}

/* =========================================================
   Boot — the framework-less fallback (hard rule 4).
   Same declarations, same maths, same exports, no shell.
   ========================================================= */
let fb=null;
function fbEl(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
function fbLabel(x){ return (x&&typeof x==='object')?(x[lang]||x.en||''):String(x==null?'':x); }
function fbField(f,box){
  const w=fbEl('div','dgu-field'); w.dataset.dguField=f.id;
  if(f.type==='note'){ const d=fbEl('div','dgu-hint',fbLabel(f.label)); w.appendChild(d); box.appendChild(w);
    fb.fields.push({def:f,node:w,ctl:null}); return; }
  const lab=fbEl('label','dgu-flabel',fbLabel(f.label)); lab.htmlFor=f.id+'-c'; w.appendChild(lab);
  const row=fbEl('div','dgu-frow');
  let ctl;
  if(f.type==='select'){
    ctl=document.createElement('select');
    (f.options||[]).forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=fbLabel(o[1]);ctl.appendChild(op);});
    ctl.onchange=()=>{ state[f.key]=ctl.value; fbSync(); };
  }else{
    ctl=document.createElement('input'); ctl.type='number';
    if(f.step!=null)ctl.step=f.step; if(f.minDisplay!=null)ctl.min=f.minDisplay;
    ctl.oninput=()=>{ state[f.key]=ctl.value===''?null:parseFloat(ctl.value); fbSync(); };
  }
  ctl.id=f.id+'-c'; row.appendChild(ctl);
  if(f.unit)row.appendChild(fbEl('span','dgu-unit',f.unit));
  w.appendChild(row); box.appendChild(w);
  fb.fields.push({def:f,node:w,ctl:ctl});
}
function fbSync(){
  fb.fields.forEach(({def,node,ctl})=>{
    const vis=def.visible?!!def.visible({state:state}):true;
    node.hidden=!vis; node.style.display=vis?'':'none';
    if(!ctl)return;
    const v=state[def.key];
    if(document.activeElement!==ctl)ctl.value=v==null?'':String(v);
  });
  renderList(fb.list,null);
  const r=solve(state);
  if(!r.ok){
    lastResult=null; fb.err.textContent=r.err;
    fbDraw(); fb.tiles.innerHTML=''; fb.tables.innerHTML='';
    return;
  }
  fb.err.textContent='';
  lastResult={beam:r.beam,reactions:r.reactions,d:r.d,a:r.a};
  fbDraw();
  const data=resultsData();
  fb.tiles.innerHTML='';
  data.tiles.forEach(t2=>{
    const d=fbEl('div','bd-fb-tile');
    d.appendChild(fbEl('span',null,fbLabel(t2.label)+(t2.hint?' ('+t2.hint+')':'')));
    d.appendChild(fbEl('b',null,t2.value==null?'—':t2.value+' '+t2.unit));
    fb.tiles.appendChild(d);
  });
  fb.tables.innerHTML='';
  data.tables.forEach(tb=>{
    const cap=fbEl('h2',null,fbLabel(tb.title)); fb.tables.appendChild(cap);
    const table=document.createElement('table');
    const tr=document.createElement('tr');
    tb.head.forEach(h=>{const th=document.createElement('th');th.textContent=fbLabel(h);tr.appendChild(th);});
    table.appendChild(tr);
    tb.rows.forEach(r2=>{const trr=document.createElement('tr');
      r2.forEach(c=>{const td=document.createElement('td');td.textContent=c;trr.appendChild(td);});
      table.appendChild(trr);});
    fb.tables.appendChild(table);
  });
}
function fbCanvas(cv){
  const ratio=Math.min(window.devicePixelRatio||1,2);
  const w=cv.clientWidth||600, h=260;
  cv.width=Math.round(w*ratio); cv.height=Math.round(h*ratio);
  const ctx=cv.getContext('2d'); ctx.setTransform(ratio,0,0,ratio,0,0);
  return {ctx,w,h};
}
function fbTicks(min,max,px){
  const target=Math.max(2,Math.floor(px/60)), span=max-min;
  if(!(span>0))return[min];
  const raw=span/target, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), n=raw/mag;
  const step=(n<=1?1:n<=2?2:n<=5?5:10)*mag;
  const out=[]; for(let v=Math.ceil(min/step)*step; v<=max+step*1e-9; v+=step) out.push(Math.round(v/step)*step);
  return out;
}
function fbDraw(){
  const b=fbCanvas(fb.cvBeam);
  drawBeam(b.ctx,b.w,b.h,lastResult?lastResult.beam:getBeam(state),lastResult?lastResult.reactions:[],state.loads,'fine');
  const q=fbCanvas(fb.cvQ), m=fbCanvas(fb.cvM);
  if(!lastResult){ q.ctx.clearRect(0,0,q.w,q.h); m.ctx.clearRect(0,0,m.w,m.h); return; }
  const P=palette(), d=lastResult.d, a=lastResult.a;
  drawDiagram(q.ctx,q.w,q.h,d.xs,d.Q,P.q,lastResult.beam.L,[
    {x:a.xQmax,v:a.Qmax,label:a.Qmax.toFixed(2)},{x:a.xQmin,v:a.Qmin,label:a.Qmin.toFixed(2)},
    ...a.zeros.map(z=>({x:z,v:0,label:"0",color:P.zero}))],'fine');
  drawDiagram(m.ctx,m.w,m.h,d.xs,d.M,P.m,lastResult.beam.L,[
    {x:a.xMmax,v:a.Mmax,label:a.Mmax.toFixed(2)},{x:a.xMmin,v:a.Mmin,label:a.Mmin.toFixed(2)}],'fine');
}
function bootFallback(){
  if(!window.DiagramUI) window.DiagramUI={ticks:fbTicks,theme:{get:()=>'light',watch:()=>{}}};
  document.body.className='bd-fb-body';
  const root=document.getElementById('app')||document.body;
  root.className='bd-fb';
  fb={fields:[]};
  const head=fbEl('div','bd-fb-head');
  const m=(window.Diagram&&Diagram.manifest&&Diagram.manifest())||null;
  head.appendChild(fbEl('h1',null,(m&&m.title&&(m.title[lang]||m.title.en))||t('appTitle')));
  head.appendChild(fbEl('div','dgu-hint',t('appSub')));
  root.appendChild(head);
  const cols=fbEl('div','bd-fb-cols'); root.appendChild(cols);
  const left=fbEl('div','bd-fb-col'), right=fbEl('div','bd-fb-col');
  cols.appendChild(left); cols.appendChild(right);

  const pb=fbEl('div','bd-fb-box'); pb.appendChild(fbEl('h2',null,t('beamHdr')));
  BEAM_FIELDS().forEach(f=>fbField(f,pb)); left.appendChild(pb);

  const pl=fbEl('div','bd-fb-box'); pl.appendChild(fbEl('h2',null,t('loadsHdr')));
  LOAD_FIELDS().forEach(f=>fbField(f,pl));
  const acts=fbEl('div','bd-fb-actions');
  const add=fbEl('button','primary',t('addBtn')); add.type='button'; add.onclick=()=>addLoad(null);
  const clr=fbEl('button',null,t('clearBtn')); clr.type='button'; clr.onclick=()=>{state.loads=[];fbSync();};
  const dem=fbEl('button',null,t('demoBtn')); dem.type='button';
  dem.onclick=()=>{ adopt(clone(EXAMPLES()[0].state),null); fbSync(); };
  acts.appendChild(add); acts.appendChild(dem); acts.appendChild(clr);
  pl.appendChild(acts); left.appendChild(pl);

  const pls=fbEl('div','bd-fb-box'); pls.appendChild(fbEl('h2',null,t('listHdr')));
  fb.list=fbEl('ul','bd-list'); pls.appendChild(fb.list); left.appendChild(pls);

  const pd=fbEl('div','bd-fb-box'); pd.appendChild(fbEl('h2',null,t('diagHdr')));
  fb.err=fbEl('div','bd-err'); pd.appendChild(fb.err);
  fb.cvBeam=document.createElement('canvas'); fb.cvQ=document.createElement('canvas'); fb.cvM=document.createElement('canvas');
  [[fb.cvBeam,'beamTitle'],[fb.cvQ,'qTitle'],[fb.cvM,'mTitle']].forEach(([cv,k])=>{
    pd.appendChild(cv); pd.appendChild(fbEl('div','dgu-hint',t(k)));
  });
  pd.appendChild(fbEl('div','dgu-hint',t('conv')));
  right.appendChild(pd);

  const pr=fbEl('div','bd-fb-box'); pr.appendChild(fbEl('h2',null,t('resHdr')));
  fb.tiles=fbEl('div','bd-fb-tiles'); pr.appendChild(fb.tiles);
  const csv=fbEl('button',null,t('xlsBtn')); csv.type='button'; csv.onclick=exportCsv;
  const ca=fbEl('div','bd-fb-actions'); ca.appendChild(csv); pr.appendChild(ca);
  fb.tables=fbEl('div','bd-fb-col'); pr.appendChild(fb.tables);
  right.appendChild(pr);

  window.addEventListener('resize',fbDraw);
  fbSync();
}

/* the test hook the parity harnesses read; nothing on the page uses it */
window.__beam={buildCSV:buildCSV,solve:solve,get state(){return state;},get last(){return lastResult;}};

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
