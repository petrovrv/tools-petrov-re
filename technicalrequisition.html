 "summary": {
  "en": "Assembles one package's requisition — scope and battery limits, applicable requirements, datasheets, vendor documents, inspection points, spares, packing, bid instructions — and checks it against the issue purpose.",
  "uk": "Складає заявку на один пакет — обсяг постачання та межі, застосовні вимоги, опитувальні листи, документи постачальника, точки контролю, ЗІП, пакування, умови подання пропозицій — і перевіряє її за метою випуску.",
  "de": "Stellt die Bestellanforderung eines Pakets zusammen — Lieferumfang, Anforderungen, Datenblätter, Lieferantendokumente, Prüfpunkte, Ersatzteile, Verpackung, Angebotsvorgaben — und prüft sie je Ausgabezweck.",
  "nl": "Stelt de aanvraag voor één pakket samen — leveringsomvang en batterijgrenzen, eisen, datasheets, leveranciersdocumenten, keurpunten, reservedelen, verpakking, biedinstructies — en toetst die aan het uitgiftedoel.",
  "fr": "Assemble la réquisition d'un lot — limites de fourniture, exigences, fiches techniques, documents fournisseur, points de contrôle, rechanges, emballage, instructions d'offre — et la contrôle selon l'objet d'émission.",
  "es": "Reúne la requisición de un paquete — alcance y límites, requisitos, hojas de datos, documentos del proveedor, puntos de inspección, repuestos, embalaje, instrucciones de oferta — y la verifica según el objeto de emisión.",
  "pl": "Składa zapotrzebowanie dla jednego pakietu — zakres dostawy i granice, wymagania, karty danych, dokumenty dostawcy, punkty kontroli, części zamienne, pakowanie, instrukcje ofertowe — i sprawdza je pod kątem celu wydania."
 },
 "description": {
  "en": "Builds the technical part of what a purchaser sends a supplier for one package: scope of supply and exclusions, terminal points with interface ids, requirements selected from the project requirements register with their obligation and the compliance statement form the supplier must return, datasheets attached at their register revision, the vendor document requirements list with a due stage per item, inspection and test points with hold, witness, surveillance and review codes, spares, packing and preservation, and bid instructions. Sixty-six rules check completeness and consistency at three issue purposes — enquiry, purchase and as-purchased — so that a datasheet parameter below order maturity blocks issue for purchase while leaving issue for enquiry open. One item is written into the project package requisitions register, which bid evaluation and package readiness read.",
  "uk": "Формує технічну частину того, що замовник надсилає постачальнику по одному пакету: обсяг постачання та винятки, точки підключення з ідентифікаторами інтерфейсів, вимоги, відібрані з реєстру вимог проєкту, із зазначенням обов'язковості та форми підтвердження відповідності, опитувальні листи в ревізії реєстру, перелік документів постачальника зі стадією подання, точки інспекції та випробувань із кодами H, W, S, R, ЗІП, пакування та консервацію, умови подання пропозицій. Шістдесят шість правил перевіряють повноту та несуперечливість для трьох цілей випуску — запит, закупівля, за фактом закупівлі — тож параметр опитувального листа нижче зрілості «замовлення» блокує випуск на закупівлю, але не на запит. До реєстру requisitions пакета проєкту записується один запис, який читають оцінка пропозицій і готовність пакета.",
  "de": "Erstellt den technischen Teil dessen, was ein Besteller einem Lieferanten für ein Paket sendet: Lieferumfang und Ausschlüsse, Anschlusspunkte mit Schnittstellenkennungen, aus dem Anforderungsregister des Projekts ausgewählte Anforderungen mit Verbindlichkeit und geforderter Konformitätsaussage, Datenblätter in der Registerrevision, die Lieferantendokumentenliste mit Fälligkeitsstufe je Position, Prüfpunkte mit den Codes H, W, S, R, Ersatzteile, Verpackung und Konservierung sowie Angebotsvorgaben. 66 Regeln prüfen Vollständigkeit und Widerspruchsfreiheit für drei Ausgabezwecke — Anfrage, Bestellung, wie bestellt —, sodass ein Datenblattparameter unterhalb der Reife „order“ die Ausgabe zur Bestellung sperrt, die Ausgabe zur Anfrage aber nicht. Ein Eintrag wird in das Register requisitions des Projektpakets geschrieben, das Angebotsbewertung und Paketbereitschaft lesen.",
  "nl": "Bouwt het technische deel van wat een koper een leverancier stuurt voor één pakket: leveringsomvang en uitsluitingen, aansluitpunten met interface-id's, eisen gekozen uit het eisenregister van het project met hun verplichtend karakter en de gevraagde conformiteitsverklaring, datasheets in de registerrevisie, de leveranciersdocumentenlijst met een opleverstadium per regel, keur- en beproevingspunten met de codes H, W, S, R, reservedelen, verpakking en conservering, en biedinstructies. 66 regels toetsen volledigheid en consistentie voor drie uitgiftedoelen — aanvraag, bestelling, zoals besteld — zodat een datasheetparameter onder de maturiteit «order» uitgifte voor bestelling blokkeert en uitgifte voor aanvraag openlaat. Eén regel wordt naar het register requisitions van het projectpakket geschreven, dat biedbeoordeling en pakketgereedheid lezen.",
  "fr": "Construit la part technique de ce qu'un acheteur envoie à un fournisseur pour un lot : limites de fourniture et exclusions, points de raccordement avec identifiants d'interface, exigences prises dans le registre du projet avec leur caractère obligatoire et la forme de déclaration de conformité attendue, fiches techniques à la révision du registre, liste des documents fournisseur avec un jalon d'échéance par ligne, points d'inspection et d'essai aux codes H, W, S, R, pièces de rechange, emballage et conservation, instructions d'offre. 66 règles contrôlent complétude et cohérence pour trois objets d'émission — consultation, commande, tel que commandé — de sorte qu'un paramètre de fiche technique sous la maturité « order » bloque l'émission pour commande sans bloquer l'émission pour consultation. Une entrée est écrite dans le registre requisitions du dossier de projet, que lisent l'évaluation des offres et la préparation du lot.",
  "es": "Construye la parte técnica de lo que un comprador envía a un proveedor para un paquete: alcance de suministro y exclusiones, puntos terminales con identificadores de interfaz, requisitos tomados del registro del proyecto con su obligatoriedad y la forma de declaración de conformidad exigida, hojas de datos en la revisión del registro, la lista de documentos del proveedor con un hito de entrega por línea, puntos de inspección y ensayo con los códigos H, W, S, R, repuestos, embalaje y preservación, e instrucciones de oferta. 66 reglas comprueban integridad y coherencia para tres objetos de emisión — consulta, compra, según lo comprado — de modo que un parámetro de hoja de datos por debajo de la madurez «order» bloquea la emisión para compra sin bloquear la emisión para consulta. Se escribe un elemento en el registro requisitions del paquete de proyecto, que leen la evaluación de ofertas y la preparación del paquete.",
  "pl": "Buduje techniczną część tego, co zamawiający wysyła dostawcy dla jednego pakietu: zakres dostawy i wyłączenia, punkty przyłączeniowe z identyfikatorami interfejsów, wymagania wybrane z rejestru wymagań projektu wraz z ich obligatoryjnością i formą oświadczenia o zgodności, karty danych w rewizji rejestru, listę dokumentów dostawcy z etapem wymagalności dla każdej pozycji, punkty inspekcji i badań z kodami H, W, S, R, części zamienne, pakowanie i konserwację oraz instrukcje ofertowe. 66 reguł sprawdza kompletność i spójność dla trzech celów wydania — zapytanie, zakup, zgodnie z zakupem — tak że parametr karty danych poniżej dojrzałości «order» blokuje wydanie do zakupu, nie blokując wydania do zapytania. Do rejestru requisitions pakietu projektu zapisywana jest jedna pozycja, którą czytają ocena ofert i gotowość pakietu."
 },

 "limitations": {
  "en": "Rule-based completeness and consistency checks over lists the user enters or loads. The tool does not judge whether a requirement, a datasheet value or a test is technically adequate; it checks that what the project package says belongs in the requisition is there, at the right revision and maturity, and that the requisition does not contradict itself. Commercial content — prices, payment terms, liquidated damages, warranty, contract conditions — and supplier qualification (ISO 9001:2015 8.4.3 c) and e)) are outside the model. Interface ids on terminal points are checked for presence only: the interfaces register is not read, so neither the existence of an id nor agreement between the two sides can be confirmed. Whether a requirement is mandatory is taken from its obligation field when present, otherwise from its verbal form (shall / should); a requirement written in neither form is reported as undetermined and the user decides. Datasheet maturity is read per parameter; a parameter with no recognised maturity is treated as below order. Deviations, technical queries and bid evaluation are separate tools, and an as-purchased revision is not checked against accepted deviations. Due stages are an ordered list of eight milestones; calendar dates and float are not scheduled.",
  "uk": "Перевірки повноти та несуперечливості на основі правил за списками, які користувач вводить або завантажує. Інструмент не оцінює технічну достатність вимоги, значення опитувального листа чи випробування; він перевіряє, що все, що за пакетом проєкту належить до заявки, там є, у правильній ревізії та зрілості, і що заявка сама собі не суперечить. Комерційний зміст — ціни, умови оплати, штрафи, гарантія, умови договору — та кваліфікація постачальника (ISO 9001:2015 8.4.3 c) і e)) поза моделлю. Ідентифікатори інтерфейсів у точках підключення перевіряються лише на наявність: реєстр interfaces не читається, тож ні існування ідентифікатора, ні узгодженість сторін підтвердити неможливо. Обов'язковість вимоги береться з її поля obligation, інакше з дієслівної форми (shall / should); вимогу без жодної з форм позначено як невизначену, і вирішує користувач. Зрілість опитувального листа читається для кожного параметра; параметр без розпізнаної зрілості вважається нижчим за «order». Відхилення, технічні запити та оцінка пропозицій — окремі інструменти, і ревізія «за фактом закупівлі» не звіряється з погодженими відхиленнями. Стадії подання — упорядкований список із восьми віх; календарні дати та резерв часу не плануються.",
  "de": "Regelbasierte Vollständigkeits- und Widerspruchsprüfungen über Listen, die der Nutzer eingibt oder lädt. Das Werkzeug beurteilt nicht, ob eine Anforderung, ein Datenblattwert oder eine Prüfung technisch angemessen ist; es prüft, ob das, was laut Projektpaket in die Bestellanforderung gehört, vorhanden ist, in der richtigen Revision und Reife, und ob die Bestellanforderung sich nicht selbst widerspricht. Kaufmännischer Inhalt — Preise, Zahlungsbedingungen, Vertragsstrafen, Gewährleistung, Vertragsbedingungen — und Lieferantenqualifikation (ISO 9001:2015 8.4.3 c) und e)) liegen außerhalb des Modells. Schnittstellenkennungen an Anschlusspunkten werden nur auf Vorhandensein geprüft: das Register interfaces wird nicht gelesen, daher lässt sich weder die Existenz einer Kennung noch die Übereinstimmung beider Seiten bestätigen. Die Verbindlichkeit einer Anforderung stammt aus ihrem Feld obligation, sonst aus der Verbalform (shall / should); eine Anforderung in keiner der Formen wird als unbestimmt gemeldet und der Nutzer entscheidet. Die Datenblattreife wird je Parameter gelesen; ein Parameter ohne erkannte Reife gilt als unterhalb „order“. Abweichungen, technische Rückfragen und Angebotsbewertung sind eigene Werkzeuge, und eine Revision „wie bestellt“ wird nicht gegen genehmigte Abweichungen geprüft. Fälligkeitsstufen sind eine geordnete Liste von acht Meilensteinen; Kalendertermine und Puffer werden nicht terminiert.",
  "nl": "Regelgebaseerde volledigheids- en consistentiecontroles over lijsten die de gebruiker invoert of laadt. De tool beoordeelt niet of een eis, een datasheetwaarde of een beproeving technisch toereikend is; ze controleert of wat volgens het projectpakket in de aanvraag hoort er staat, in de juiste revisie en maturiteit, en of de aanvraag zichzelf niet tegenspreekt. Commerciële inhoud — prijzen, betalingsvoorwaarden, boetes, garantie, contractvoorwaarden — en leverancierskwalificatie (ISO 9001:2015 8.4.3 c) en e)) vallen buiten het model. Interface-id's op aansluitpunten worden alleen op aanwezigheid gecontroleerd: het register interfaces wordt niet gelezen, dus noch het bestaan van een id noch overeenstemming tussen beide zijden is te bevestigen. Of een eis verplicht is komt uit het veld obligation, anders uit de werkwoordsvorm (shall / should); een eis in geen van beide vormen wordt als onbepaald gemeld en de gebruiker beslist. Datasheetmaturiteit wordt per parameter gelezen; een parameter zonder herkende maturiteit geldt als onder «order». Afwijkingen, technische vragen en biedbeoordeling zijn aparte tools, en een revisie «zoals besteld» wordt niet tegen geaccepteerde afwijkingen getoetst. Opleverstadia vormen een geordende lijst van acht mijlpalen; kalenderdata en speling worden niet gepland.",
  "fr": "Contrôles de complétude et de cohérence par règles sur des listes saisies ou chargées par l'utilisateur. L'outil ne juge pas si une exigence, une valeur de fiche technique ou un essai est techniquement adéquat ; il vérifie que ce que le dossier de projet rattache à la réquisition y figure, à la bonne révision et à la bonne maturité, et que la réquisition ne se contredit pas. Le contenu commercial — prix, conditions de paiement, pénalités, garantie, conditions contractuelles — et la qualification du fournisseur (ISO 9001:2015 8.4.3 c) et e)) sont hors modèle. Les identifiants d'interface des points de raccordement ne sont contrôlés qu'en présence : le registre interfaces n'est pas lu, donc ni l'existence d'un identifiant ni l'accord des deux côtés ne peuvent être confirmés. Le caractère obligatoire d'une exigence vient de son champ obligation, sinon de sa forme verbale (shall / should) ; une exigence dans aucune des deux formes est signalée comme indéterminée et l'utilisateur tranche. La maturité de fiche technique est lue par paramètre ; un paramètre sans maturité reconnue est traité comme inférieur à « order ». Dérogations, questions techniques et évaluation des offres sont des outils distincts, et une révision « tel que commandé » n'est pas confrontée aux dérogations acceptées. Les jalons d'échéance forment une liste ordonnée de huit étapes ; ni dates calendaires ni marges ne sont planifiées.",
  "es": "Comprobaciones de integridad y coherencia basadas en reglas sobre listas que el usuario introduce o carga. La herramienta no juzga si un requisito, un valor de hoja de datos o un ensayo es técnicamente adecuado; comprueba que lo que el paquete de proyecto asigna a la requisición esté presente, en la revisión y madurez correctas, y que la requisición no se contradiga. El contenido comercial — precios, condiciones de pago, penalizaciones, garantía, condiciones contractuales — y la calificación del proveedor (ISO 9001:2015 8.4.3 c) y e)) quedan fuera del modelo. Los identificadores de interfaz de los puntos terminales solo se comprueban por presencia: el registro interfaces no se lee, por lo que no puede confirmarse ni la existencia de un identificador ni el acuerdo entre ambos lados. La obligatoriedad de un requisito se toma de su campo obligation y, si no, de su forma verbal (shall / should); un requisito sin ninguna de las dos formas se informa como indeterminado y decide el usuario. La madurez de la hoja de datos se lee por parámetro; un parámetro sin madurez reconocida se trata como inferior a «order». Desviaciones, consultas técnicas y evaluación de ofertas son herramientas aparte, y una revisión «según lo comprado» no se contrasta con las desviaciones aceptadas. Los hitos de entrega son una lista ordenada de ocho etapas; no se programan fechas de calendario ni holguras.",
  "pl": "Regułowe kontrole kompletności i spójności list wprowadzanych lub wczytywanych przez użytkownika. Narzędzie nie ocenia, czy wymaganie, wartość karty danych lub badanie są technicznie wystarczające; sprawdza, czy to, co według pakietu projektu należy do zapotrzebowania, tam jest, we właściwej rewizji i dojrzałości, oraz czy zapotrzebowanie nie zaprzecza samemu sobie. Treść handlowa — ceny, warunki płatności, kary umowne, gwarancja, warunki kontraktu — oraz kwalifikacja dostawcy (ISO 9001:2015 8.4.3 c) i e)) są poza modelem. Identyfikatory interfejsów w punktach przyłączeniowych sprawdzane są tylko pod kątem obecności: rejestr interfaces nie jest czytany, więc nie da się potwierdzić ani istnienia identyfikatora, ani zgodności obu stron. Obligatoryjność wymagania pochodzi z jego pola obligation, a w razie braku z formy czasownikowej (shall / should); wymaganie bez żadnej z tych form jest zgłaszane jako nieokreślone i decyduje użytkownik. Dojrzałość karty danych czytana jest dla każdego parametru; parametr bez rozpoznanej dojrzałości traktowany jest jako poniżej «order». Odstępstwa, zapytania techniczne i ocena ofert to odrębne narzędzia, a rewizja «zgodnie z zakupem» nie jest zestawiana z przyjętymi odstępstwami. Etapy wymagalności to uporządkowana lista ośmiu kamieni milowych; daty kalendarzowe i zapasy czasu nie są planowane."
 },

 "validation": {
  "basis": {
   "en": "Requisition sections map onto ISO 9001:2015 clause 8.4.3 items a), b), d) and f), information for external providers, checked against a verbatim reproduction of the clause rather than the ISO text. Clause titles 6.2.4 Tender data, 6.2.6 Evaluation criteria and 6.2.7 Scope of work of ISO 10845-1:2020 are cited for their titles only; no procedure of that standard is implemented. Inspection point codes H, W, S, R follow IOGP S-723Q, December 2020, clauses 3.3 to 3.6 and Annex A. The due-stage and document-purpose vocabulary follows the IOGP S-723L information requirements form, December 2020. Mandatory and recommended verbal forms follow ISO/IEC Directives Part 2, 9th edition 2021, clauses 7.2 and 7.3. The 66 rules, their severities per issue purpose and the parameter maturity vocabulary are author engineering methodology.",
   "uk": "Розділи заявки відповідають пунктам a), b), d) і f) підрозділу 8.4.3 ISO 9001:2015 «Інформація для зовнішніх постачальників», звіреним із дослівним відтворенням пункту, а не з текстом ISO. Назви підрозділів 6.2.4 «Tender data», 6.2.6 «Evaluation criteria» та 6.2.7 «Scope of work» ISO 10845-1:2020 наведено лише як назви; жодної процедури цього стандарту не реалізовано. Коди точок контролю H, W, S, R відповідають IOGP S-723Q, грудень 2020, підрозділи 3.3–3.6 і додаток A. Словник стадій подання та призначення документа відповідає формі вимог до інформації IOGP S-723L, грудень 2020. Дієслівні форми обов'язковості та рекомендації відповідають ISO/IEC Directives Part 2, 9-те видання 2021, підрозділи 7.2 і 7.3. 66 правил, їхні рівні критичності за метою випуску та словник зрілості параметрів є авторською інженерною методикою.",
   "de": "Die Abschnitte der Bestellanforderung bilden ISO 9001:2015 Abschnitt 8.4.3 Punkte a), b), d) und f), Informationen für externe Anbieter, ab; geprüft an einer wortgetreuen Wiedergabe des Abschnitts, nicht am ISO-Text. Die Abschnittstitel 6.2.4 Tender data, 6.2.6 Evaluation criteria und 6.2.7 Scope of work aus ISO 10845-1:2020 werden nur als Titel zitiert; keine Prozedur dieser Norm ist umgesetzt. Die Prüfpunktcodes H, W, S, R folgen IOGP S-723Q, Dezember 2020, Abschnitte 3.3 bis 3.6 und Anhang A. Das Vokabular der Fälligkeitsstufen und Dokumentzwecke folgt dem Formblatt IOGP S-723L, Dezember 2020. Verbindliche und empfehlende Verbalformen folgen ISO/IEC Directives Part 2, 9. Ausgabe 2021, Abschnitte 7.2 und 7.3. Die 66 Regeln, ihre Schweregrade je Ausgabezweck und das Reifevokabular sind Autorenmethodik.",
   "nl": "De secties van de aanvraag zijn afgebeeld op ISO 9001:2015 paragraaf 8.4.3 punten a), b), d) en f), informatie voor externe aanbieders, getoetst aan een letterlijke weergave van de paragraaf en niet aan de ISO-tekst. De paragraaftitels 6.2.4 Tender data, 6.2.6 Evaluation criteria en 6.2.7 Scope of work uit ISO 10845-1:2020 zijn alleen als titel geciteerd; geen procedure van die norm is geïmplementeerd. De keurpuntcodes H, W, S, R volgen IOGP S-723Q, december 2020, paragrafen 3.3 tot 3.6 en bijlage A. Het vocabulaire van opleverstadia en documentdoel volgt het formulier IOGP S-723L, december 2020. Verplichtende en aanbevelende werkwoordsvormen volgen ISO/IEC Directives Part 2, 9e editie 2021, paragrafen 7.2 en 7.3. De 66 regels, hun ernst per uitgiftedoel en het maturiteitsvocabulaire zijn auteursmethodiek.",

function vlab(group, key) { if (key === '' || key == null) return '—'; return tx(voc(group, key)); }

  var out = withBlank ? [{ value: '', label: blankLabel || S.notSet }] : [];

}

'TEC-R-007': T('A history entry is dated before the entry above it.', 'Запис історії датовано раніше за попередній.', 'Ein Historieneintrag ist früher datiert als der vorangehende.', 'Een historieregel is gedateerd vóór de regel erboven.', 'Une entrée d’historique est datée avant celle qui la précède.', 'Una entrada del historial es anterior a la que la precede.', 'Wpis historii jest datowany wcześniej niż poprzedzający go wpis.'),
'TEC-R-008': T('The issue purpose falls back to an earlier one in the history.', 'Мета випуску в історії повертається до попередньої.', 'Der Ausgabezweck fällt in der Historie auf einen früheren zurück.', 'Het uitgiftedoel valt in de historie terug op een eerder doel.', 'L’objet d’émission recule dans l’historique.', 'El objeto de emisión retrocede en el historial.', 'Cel wydania cofa się w historii do wcześniejszego.'),
'TEC-R-009': T('No purchase issue precedes the as-purchased revision.', 'Жодного випуску на закупівлю перед ревізією «за фактом закупівлі».', 'Der Revision „wie bestellt“ geht keine Ausgabe zur Bestellung voraus.', 'Aan de revisie «zoals besteld» gaat geen uitgifte voor bestelling vooraf.', 'Aucune émission pour commande ne précède la révision « tel que commandé ».', 'Ninguna emisión para compra precede a la revisión «según lo comprado».', 'Żadne wydanie do zakupu nie poprzedza rewizji «zgodnie z zakupem».'),
'TEC-R-010': T('The selected vendor is not named.', 'Обраного постачальника не названо.', 'Der gewählte Lieferant ist nicht benannt.', 'De gekozen leverancier is niet genoemd.', 'Le fournisseur retenu n’est pas nommé.', 'No se nombra al proveedor seleccionado.', 'Nie wskazano wybranego dostawcy.'),
'TEC-R-011': T('The purchase order reference is not stated.', 'Посилання на замовлення не зазначено.', 'Die Bestellreferenz ist nicht angegeben.', 'De bestelreferentie is niet vermeld.', 'La référence de commande n’est pas indiquée.', 'No se indica la referencia del pedido.', 'Nie podano numeru zamówienia.'),
'TEC-R-020': T('No item stands in the scope of supply.', 'Жодної позиції в обсязі постачання.', 'Im Lieferumfang steht keine Position.', 'Er staat geen positie in de leveringsomvang.', 'Aucun article ne figure dans les limites de fourniture.', 'No figura ningún elemento en el alcance de suministro.', 'W zakresie dostawy nie ma żadnej pozycji.'),
'TEC-R-021': T('The same item key stands both inside the scope of supply and among the exclusions.', 'Той самий ключ позиції стоїть і в обсязі постачання, і серед винятків.', 'Derselbe Positionsschlüssel steht im Lieferumfang und unter den Ausschlüssen.', 'Dezelfde positiesleutel staat zowel in de leveringsomvang als bij de uitsluitingen.', 'La même clé d’article figure à la fois dans le périmètre et dans les exclusions.', 'La misma clave de elemento figura en el alcance y en las exclusiones.', 'Ten sam klucz pozycji występuje w zakresie dostawy i wśród wyłączeń.'),
'TEC-R-022': T('A scope line carries no item key, so the contradiction test cannot see it.', 'Рядок обсягу не має ключа позиції, тож перевірка суперечностей його не бачить.', 'Eine Umfangszeile führt keinen Positionsschlüssel, daher sieht die Widerspruchsprüfung sie nicht.', 'Een scoperegel heeft geen positiesleutel, waardoor de tegenspraaktoets hem niet ziet.', 'Une ligne de périmètre n’a pas de clé d’article : le test de contradiction ne la voit pas.', 'Una línea de alcance no lleva clave de elemento, por lo que la prueba de contradicción no la ve.', 'Wiersz zakresu nie ma klucza pozycji, więc test sprzeczności go nie widzi.'),
'TEC-R-023': T('No terminal point defines the battery limit.', 'Жодна точка підключення не визначає межу постачання.', 'Kein Anschlusspunkt definiert die Schnittstelle.', 'Geen aansluitpunt definieert de batterijgrens.', 'Aucun point de raccordement ne définit la limite de fourniture.', 'Ningún punto terminal define el límite de suministro.', 'Żaden punkt przyłączeniowy nie definiuje granicy dostawy.'),
'TEC-R-024': T('A terminal point has no description or no type.', 'Точка підключення не має опису або типу.', 'Ein Anschlusspunkt hat keine Beschreibung oder keinen Typ.', 'Een aansluitpunt heeft geen omschrijving of geen type.', 'Un point de raccordement n’a pas de description ou pas de type.', 'Un punto terminal carece de descripción o de tipo.', 'Punkt przyłączeniowy nie ma opisu lub typu.'),
'TEC-R-025': T('An excluded item does not say who supplies it.', 'Виключена позиція не вказує, хто її постачає.', 'Eine ausgeschlossene Position nennt nicht, wer sie liefert.', 'Een uitgesloten positie vermeldt niet wie hem levert.', 'Un article exclu ne dit pas qui le fournit.', 'Un elemento excluido no indica quién lo suministra.', 'Wyłączona pozycja nie wskazuje, kto ją dostarcza.'),
'TEC-R-026': T('Terminal points with and without an interface id.', 'Точки підключення з ідентифікатором інтерфейсу та без нього.', 'Anschlusspunkte mit und ohne Schnittstellenkennung.', 'Aansluitpunten met en zonder interface-id.', 'Points de raccordement avec et sans identifiant d’interface.', 'Puntos terminales con y sin identificador de interfaz.', 'Punkty przyłączeniowe z identyfikatorem interfejsu i bez niego.'),
'TEC-R-030': T('A mandatory requirement tagged to this package or system is not selected.', 'Обов’язкову вимогу, прив’язану до цього пакета чи системи, не відібрано.', 'Eine diesem Paket oder System zugeordnete verbindliche Anforderung ist nicht ausgewählt.', 'Een aan dit pakket of systeem gekoppelde verplichte eis is niet geselecteerd.', 'Une exigence obligatoire rattachée à ce lot ou système n’est pas retenue.', 'Un requisito obligatorio asignado a este paquete o sistema no está seleccionado.', 'Obowiązkowe wymaganie przypisane do tego pakietu lub systemu nie zostało wybrane.'),
'TEC-R-031': T('A selected requirement id is not in the requirements register.', 'Ідентифікатора відібраної вимоги немає в реєстрі вимог.', 'Eine ausgewählte Anforderungskennung steht nicht im Anforderungsregister.', 'Een geselecteerde eis-id staat niet in het eisenregister.', 'Un identifiant d’exigence retenu ne figure pas au registre des exigences.', 'Un identificador de requisito seleccionado no está en el registro de requisitos.', 'Identyfikatora wybranego wymagania nie ma w rejestrze wymagań.'),
'TEC-R-032': T('A selected requirement is marked not applicable in the register.', 'Відібрану вимогу в реєстрі позначено як незастосовну.', 'Eine ausgewählte Anforderung ist im Register als nicht zutreffend markiert.', 'Een geselecteerde eis staat in het register als niet van toepassing.', 'Une exigence retenue est marquée non applicable au registre.', 'Un requisito seleccionado está marcado como no aplicable en el registro.', 'Wybrane wymaganie jest w rejestrze oznaczone jako niemające zastosowania.'),
'TEC-R-033': T('The line obligation differs from the obligation the register carries.', 'Обов’язковість у рядку відрізняється від тієї, що в реєстрі.', 'Die Verbindlichkeit der Zeile weicht von der des Registers ab.', 'Het verplichtend karakter van de regel wijkt af van dat van het register.', 'Le caractère obligatoire de la ligne diffère de celui du registre.', 'La obligatoriedad de la línea difiere de la del registro.', 'Obligatoryjność wiersza różni się od tej w rejestrze.'),
'TEC-R-034': T('A requirement line states no obligation.', 'Рядок вимоги не зазначає обов’язковості.', 'Eine Anforderungszeile nennt keine Verbindlichkeit.', 'Een eisregel vermeldt geen verplichtend karakter.', 'Une ligne d’exigence n’indique aucun caractère obligatoire.', 'Una línea de requisito no indica obligatoriedad.', 'Wiersz wymagania nie podaje obligatoryjności.'),
'TEC-R-035': T('A requirement line states no compliance statement form.', 'Рядок вимоги не зазначає форми підтвердження відповідності.', 'Eine Anforderungszeile nennt keine Form der Konformitätsaussage.', 'Een eisregel vermeldt geen vorm van conformiteitsverklaring.', 'Une ligne d’exigence n’indique aucune forme de déclaration de conformité.', 'Una línea de requisito no indica la forma de declaración de conformidad.', 'Wiersz wymagania nie podaje formy oświadczenia o zgodności.'),
'TEC-R-036': T('An exceptions-only compliance matrix returns no offered value for a mandatory requirement.', 'Матриця лише з відхиленнями не поверне запропонованого значення для обов’язкової вимоги.', 'Eine Konformitätsmatrix nur mit Abweichungen liefert für eine verbindliche Anforderung keinen angebotenen Wert.', 'Een conformiteitsmatrix met alleen uitzonderingen levert geen aangeboden waarde voor een verplichte eis.', 'Une matrice de conformité limitée aux exceptions ne renvoie aucune valeur offerte pour une exigence obligatoire.', 'Una matriz de conformidad solo de excepciones no devuelve valor ofertado para un requisito obligatorio.', 'Macierz zgodności wyłącznie z odstępstwami nie zwraca oferowanej wartości dla wymagania obowiązkowego.'),
'TEC-R-037': T('Requirement tagging resolved neither a system nor a package.', 'Прив’язка вимог не дала ні системи, ні пакета.', 'Die Anforderungszuordnung ergab weder ein System noch ein Paket.', 'De eiskoppeling leverde noch een systeem noch een pakket op.', 'Le rattachement des exigences n’a résolu ni système ni lot.', 'La asignación de requisitos no resolvió ni sistema ni paquete.', 'Przypisanie wymagań nie dało ani systemu, ani pakietu.'),
'TEC-R-038': T('Register requirements carry neither a system nor a package tag.', 'Вимоги реєстру не мають ні системної, ні пакетної прив’язки.', 'Registeranforderungen tragen weder eine System- noch eine Paketzuordnung.', 'Registereisen dragen noch een systeem- noch een pakketkoppeling.', 'Des exigences du registre ne portent ni rattachement système ni rattachement lot.', 'Requisitos del registro no llevan asignación de sistema ni de paquete.', 'Wymagania rejestru nie mają przypisania ani do systemu, ani do pakietu.'),
'TEC-R-039': T('No requirement is selected into the requisition.', 'До заявки не відібрано жодної вимоги.', 'In die Bestellanforderung ist keine Anforderung übernommen.', 'Er is geen eis in de aanvraag opgenomen.', 'Aucune exigence n’est reprise dans la réquisition.', 'No se ha incorporado ningún requisito a la requisición.', 'Do zapotrzebowania nie wybrano żadnego wymagania.'),
'TEC-R-040': T('A datasheet of this package is not attached.', 'Опитувальний лист цього пакета не долучено.', 'Ein Datenblatt dieses Pakets ist nicht beigefügt.', 'Een datasheet van dit pakket is niet bijgevoegd.', 'Une fiche technique de ce lot n’est pas jointe.', 'Una hoja de datos de este paquete no está adjunta.', 'Karta danych tego pakietu nie została dołączona.'),
'TEC-R-041': T('An attached datasheet is not at the register revision.', 'Долучений опитувальний лист не в ревізії реєстру.', 'Ein beigefügtes Datenblatt liegt nicht in der Registerrevision vor.', 'Een bijgevoegde datasheet heeft niet de registerrevisie.', 'Une fiche technique jointe n’est pas à la révision du registre.', 'Una hoja de datos adjunta no está en la revisión del registro.', 'Dołączona karta danych nie jest w rewizji rejestru.'),
'TEC-R-042': T('An attached datasheet id is not in the datasheet register.', 'Ідентифікатора долученого опитувального листа немає в реєстрі.', 'Eine beigefügte Datenblattkennung steht nicht im Datenblattregister.', 'Een bijgevoegde datasheet-id staat niet in het datasheetregister.', 'Un identifiant de fiche technique joint ne figure pas au registre.', 'Un identificador de hoja de datos adjunto no está en el registro.', 'Identyfikatora dołączonej karty danych nie ma w rejestrze.'),
'TEC-R-043': T('An attached datasheet belongs to another package.', 'Долучений опитувальний лист належить іншому пакету.', 'Ein beigefügtes Datenblatt gehört zu einem anderen Paket.', 'Een bijgevoegde datasheet hoort bij een ander pakket.', 'Une fiche technique jointe appartient à un autre lot.', 'Una hoja de datos adjunta pertenece a otro paquete.', 'Dołączona karta danych należy do innego pakietu.'),
'TEC-R-044': T('An attached datasheet carries a parameter below order maturity.', 'Долучений опитувальний лист має параметр нижче зрілості «order».', 'Ein beigefügtes Datenblatt führt einen Parameter unterhalb der Reife „order“.', 'Een bijgevoegde datasheet bevat een parameter onder maturiteit «order».', 'Une fiche technique jointe porte un paramètre sous la maturité « order ».', 'Una hoja de datos adjunta lleva un parámetro por debajo de la madurez «order».', 'Dołączona karta danych zawiera parametr poniżej dojrzałości «order».'),
'TEC-R-045': T('An attached datasheet carries a parameter whose maturity is not recognised.', 'Долучений опитувальний лист має параметр із нерозпізнаною зрілістю.', 'Ein beigefügtes Datenblatt führt einen Parameter mit unbekannter Reife.', 'Een bijgevoegde datasheet bevat een parameter met onbekende maturiteit.', 'Une fiche technique jointe porte un paramètre dont la maturité n’est pas reconnue.', 'Una hoja de datos adjunta lleva un parámetro con madurez no reconocida.', 'Dołączona karta danych zawiera parametr o nierozpoznanej dojrzałości.'),
'TEC-R-046': T('Neither the package nor the requisition carries a datasheet.', 'Ні пакет, ні заявка не містять опитувального листа.', 'Weder das Paket noch die Bestellanforderung führt ein Datenblatt.', 'Noch het pakket noch de aanvraag bevat een datasheet.', 'Ni le lot ni la réquisition ne porte de fiche technique.', 'Ni el paquete ni la requisición llevan hoja de datos.', 'Ani pakiet, ani zapotrzebowanie nie zawiera karty danych.'),
'TEC-R-050': T('No vendor document is required of the supplier.', 'Від постачальника не вимагається жодного документа.', 'Vom Lieferanten wird kein Dokument gefordert.', 'Van de leverancier wordt geen document gevraagd.', 'Aucun document n’est exigé du fournisseur.', 'No se exige ningún documento al proveedor.', 'Od dostawcy nie wymaga się żadnego dokumentu.'),
'TEC-R-051': T('A document needed for the factory acceptance test falls due after it.', 'Документ, потрібний для заводських випробувань, подається після них.', 'Ein für die Werksabnahme benötigtes Dokument wird erst danach fällig.', 'Een voor de fabrieksacceptatietest benodigd document is pas daarna verschuldigd.', 'Un document requis pour l’essai en usine est dû après celui-ci.', 'Un documento necesario para el ensayo en fábrica vence después de este.', 'Dokument potrzebny do odbioru fabrycznego jest wymagalny dopiero po nim.'),
'TEC-R-052': T('A document needed for the site acceptance test falls due after it.', 'Документ, потрібний для приймальних випробувань на об’єкті, подається після них.', 'Ein für die Standortabnahme benötigtes Dokument wird erst danach fällig.', 'Een voor de site-acceptatietest benodigd document is pas daarna verschuldigd.', 'Un document requis pour l’essai sur site est dû après celui-ci.', 'Un documento necesario para el ensayo en obra vence después de este.', 'Dokument potrzebny do odbioru na obiekcie jest wymagalny dopiero po nim.'),
'TEC-R-053': T('A vendor document line lacks a type, a purpose or a due stage.', 'Рядок документа постачальника не має типу, призначення або стадії подання.', 'Einer Lieferantendokumentzeile fehlt Typ, Zweck oder Fälligkeitsstufe.', 'Een leveranciersdocumentregel mist type, doel of opleverstadium.', 'Une ligne de document fournisseur manque de type, d’objet ou de jalon.', 'Una línea de documento del proveedor carece de tipo, objeto o hito.', 'Wiersz dokumentu dostawcy nie ma typu, celu lub etapu wymagalności.'),
'TEC-R-054': T('A vendor document of this package is requested by no line.', 'Документ постачальника цього пакета не затребувано жодним рядком.', 'Ein Lieferantendokument dieses Pakets wird von keiner Zeile angefordert.', 'Een leveranciersdocument van dit pakket wordt door geen regel gevraagd.', 'Un document fournisseur de ce lot n’est demandé par aucune ligne.', 'Un documento del proveedor de este paquete no lo solicita ninguna línea.', 'Dokument dostawcy tego pakietu nie jest wymagany przez żaden wiersz.'),
'TEC-R-055': T('A vendor document id is not in the vendor document register.', 'Ідентифікатора документа постачальника немає в реєстрі.', 'Eine Lieferantendokumentkennung steht nicht im Dokumentenregister.', 'Een leveranciersdocument-id staat niet in het documentenregister.', 'Un identifiant de document fournisseur ne figure pas au registre.', 'Un identificador de documento del proveedor no está en el registro.', 'Identyfikatora dokumentu dostawcy nie ma w rejestrze.'),
'TEC-R-056': T('The factory acceptance test is required and no FAT procedure is called for.', 'Заводські випробування вимагаються, а програми FAT не затребувано.', 'Die Werksabnahme ist gefordert, eine FAT-Prozedur wird nicht verlangt.', 'De fabrieksacceptatietest is vereist en er wordt geen FAT-procedure gevraagd.', 'L’essai en usine est exigé et aucune procédure FAT n’est demandée.', 'Se exige el ensayo en fábrica y no se pide procedimiento FAT.', 'Odbiór fabryczny jest wymagany, a procedury FAT nie zażądano.'),
'TEC-R-057': T('Hold or witness points are specified and no inspection and test plan falls due before manufacture.', 'Задано точки зупинки або присутності, а план інспекцій не подається до виготовлення.', 'Halte- oder Zeugenpunkte sind festgelegt, ein Prüfplan wird nicht vor der Fertigung fällig.', 'Er zijn stop- of bijwoonpunten vastgelegd en geen keuringsplan is vóór fabricage verschuldigd.', 'Des points d’arrêt ou de convocation sont définis et aucun plan de contrôle n’est dû avant fabrication.', 'Se definen puntos de parada o de presencia y ningún plan de inspección vence antes de fabricar.', 'Określono punkty wstrzymania lub obecności, a plan kontroli nie jest wymagalny przed produkcją.'),
'TEC-R-058': T('A document due after the purchase order states no offset in weeks.', 'Документ із поданням після замовлення не має зсуву в тижнях.', 'Ein nach der Bestellung fälliges Dokument nennt keinen Versatz in Wochen.', 'Een na de bestelling verschuldigd document noemt geen offset in weken.', 'Un document dû après la commande n’indique pas de décalage en semaines.', 'Un documento que vence tras el pedido no indica desfase en semanas.', 'Dokument wymagalny po zamówieniu nie podaje przesunięcia w tygodniach.'),
'TEC-R-060': T('A hold point names no owner to release it.', 'Точка зупинки не називає відповідального за її зняття.', 'Ein Haltepunkt nennt keinen Verantwortlichen für die Freigabe.', 'Een stoppunt noemt geen eigenaar die het vrijgeeft.', 'Un point d’arrêt ne nomme personne pour le lever.', 'Un punto de parada no nombra responsable de liberarlo.', 'Punkt wstrzymania nie wskazuje osoby zwalniającej.'),
'TEC-R-061': T('A witness point names no owner to attend it.', 'Точка присутності не називає відповідального за участь.', 'Ein Zeugenpunkt nennt keinen Verantwortlichen für die Teilnahme.', 'Een bijwoonpunt noemt geen eigenaar die erbij is.', 'Un point de convocation ne nomme personne pour y assister.', 'Un punto de presencia no nombra responsable de asistir.', 'Punkt obecności nie wskazuje osoby uczestniczącej.'),
'TEC-R-062': T('The factory acceptance test is required and no test point of that kind is specified.', 'Заводські випробування вимагаються, а точки такого виду не задано.', 'Die Werksabnahme ist gefordert, ein Prüfpunkt dieser Art fehlt.', 'De fabrieksacceptatietest is vereist en er is geen punt van die soort.', 'L’essai en usine est exigé et aucun point de ce type n’est défini.', 'Se exige el ensayo en fábrica y no se define punto de ese tipo.', 'Odbiór fabryczny jest wymagany, a punktu tego rodzaju nie określono.'),
'TEC-R-063': T('The site acceptance test is required and no test point of that kind is specified.', 'Приймальні випробування на об’єкті вимагаються, а точки такого виду не задано.', 'Die Standortabnahme ist gefordert, ein Prüfpunkt dieser Art fehlt.', 'De site-acceptatietest is vereist en er is geen punt van die soort.', 'L’essai sur site est exigé et aucun point de ce type n’est défini.', 'Se exige el ensayo en obra y no se define punto de ese tipo.', 'Odbiór na obiekcie jest wymagany, a punktu tego rodzaju nie określono.'),
'TEC-R-064': T('The factory acceptance test is not required and something depends on it.', 'Заводські випробування не вимагаються, а від них щось залежить.', 'Die Werksabnahme ist nicht gefordert, etwas hängt dennoch von ihr ab.', 'De fabrieksacceptatietest is niet vereist en er hangt iets van af.', 'L’essai en usine n’est pas exigé et quelque chose en dépend.', 'No se exige el ensayo en fábrica y algo depende de él.', 'Odbiór fabryczny nie jest wymagany, a coś od niego zależy.'),
'TEC-R-065': T('A hold or witness point states no notice period.', 'Точка зупинки або присутності не задає строку повідомлення.', 'Ein Halte- oder Zeugenpunkt nennt keine Vorankündigungsfrist.', 'Een stop- of bijwoonpunt noemt geen aanzegtermijn.', 'Un point d’arrêt ou de convocation n’indique pas de préavis.', 'Un punto de parada o de presencia no indica plazo de aviso.', 'Punkt wstrzymania lub obecności nie podaje terminu powiadomienia.'),
'TEC-R-070': T('A spares category states no mode.', 'Категорія ЗІП не задає режиму.', 'Eine Ersatzteilkategorie nennt keinen Modus.', 'Een reservedelencategorie noemt geen modus.', 'Une catégorie de pièces n’indique pas de mode.', 'Una categoría de repuestos no indica modo.', 'Kategoria części zamiennych nie podaje trybu.'),

function L(k, vars) {
  var s = tx(S[k] || { en: k });
  if (vars) Object.keys(vars).forEach(function (v) { s = s.split('{' + v + '}').join(String(vars[v])); });
  return s;
}

/* ============================== 10. presets (§9) ========================
   Named for the situation they show. No preset carries a client identity;
   vendor fields hold role labels (AGENTS §6.3).

   The free text a preset seeds is what every reader sees on first load and in
   the PDF, so it is written in seven languages here and resolved at seed time.
   Ids, tags, flange designations and dates stay as they are: they are the same
   in every language. An item key is not one of them -- the panel's own Learn
   topic calls it "a short noun naming the thing", and the comparison is on the
   normalised key -- so the six seeded keys are nouns in seven languages, and
   P4's contradiction keeps its capital-and-space variant through keyVariant(),
   which normalises to the same key in each. The register requirements carry an explicit
   `obligation`, so the demonstration grades identically in all seven

function ctxPackageOptions() {
  var c = state.context, out = [];
  if (c && c.loaded.structure && c.packages_known.length) {
    c.packages_known.forEach(function (id) {
      out.push({ value: id, label: id + (c.package.id === id && c.package.name ? ' — ' + c.package.name : '') });
    });
  }
  if (state.package_id && !out.some(function (o) { return o.value === state.package_id; })) out.unshift({ value: state.package_id, label: state.package_id });
  out.unshift({ value: '', label: S.notSet });
  return out;
}
function regReqText(id) {
  var c = state.context;
  if (!c || !c.loaded.requirements) return '';
  var r = c.requirements.filter(function (x) { return x.id === id; })[0];
  return r ? r.text : '';
}
function regReqObl(id) {
  var c = state.context;
  if (!c || !c.loaded.requirements) return '';
  var r = c.requirements.filter(function (x) { return x.id === id; })[0];
  return r ? tx(voc('obligation', regObl(r))) : '';
}
function regDsField(id, field) {
  var c = state.context;
  if (!c || !c.loaded.equipment_datasheets) return '';
  var r = c.datasheets.filter(function (x) { return x.id === id; })[0];
  return r ? String(r[field] || '') : '';
}
function dsBelowOrder(id) {
  var c = state.context;
  if (!c || !c.loaded.equipment_datasheets) return '';
  var r = c.datasheets.filter(function (x) { return x.id === id; })[0];
  if (!r) return '';
  var lowKeys = r.parameters.filter(function (q) { return rankMat(q.maturity) < 3; }).map(function (q) { return q.key; });
  return lowKeys.length ? String(lowKeys.length) + ' — ' + keyList(lowKeys) : '0';
}
/* §7.5 — a flag against a referenced item is shown beside the row that
   references it, attributed, with no edit, resolve or dismiss control. */
function flagCell(kind, id) {
  if (!id) return '';
  var out = [];
  (state.context && state.context.loaded.flags ? state.context.flags : []).forEach(function (f) {
    if (String(f.target_kind || '') === kind && String(f.target_id || '') === String(id))
      out.push(String(f.flag || '') + ' — ' + String(f.reason || '') + ' (' + String(f.raised_by || '') + ', ' + String(f.raised_at || '') + ')');
  });
  return out.join(' · ');
}

/* ============================== 16. UI state bridge =====================
   The framework binds a field to `state[key]`, so the nested groups of §3.1
   (`tests`, `spares`, `packing`, `bid`) and the `needed_for` array are
   mirrored onto flat keys the form can edit. `canon()` rebuilds the §3.1
   object, which is the only shape the rule engine, the record, the permalink
   and the register item ever see. */
function flatten(cs) {
  var w = clone(cs);
  w.fat_required = cs.tests.fat_required;
  w.sat_required = cs.tests.sat_required;
  w.sp_commissioning = cs.spares.commissioning.mode;
  w.sp_operating_2yr = cs.spares.operating_2yr.mode;
  w.sp_capital = cs.spares.capital.mode;
  w.packing_standard = cs.packing.standard;
  w.preservation_months = cs.packing.preservation_months;
  w.outdoor_storage = cs.packing.outdoor_storage;
  w.bid_matrix = cs.bid.compliance_matrix_format;
  w.bid_deviation = cs.bid.deviation_list_required;
  w.bid_clarification = cs.bid.clarification_deadline;
  w.bid_due = cs.bid.bid_due_date;
  w.register_id = deriveRqnId(cs.requisition_no) || '\u2014';
  delete w.tests; delete w.spares; delete w.packing; delete w.bid;
  w.vdrl = cs.vdrl.map(function (v) { var o = clone(v); o.needed_for_text = v.needed_for.join(', '); delete o.needed_for; return o; });
  return w;
}
function canon(w) {
  var raw = clone(w || {});
  raw.tests = { fat_required: w.fat_required === true, sat_required: w.sat_required === true };
  raw.spares = { commissioning: { mode: w.sp_commissioning || '' }, operating_2yr: { mode: w.sp_operating_2yr || '' }, capital: { mode: w.sp_capital || '' } };
  raw.packing = { standard: w.packing_standard || '', preservation_months: w.preservation_months, outdoor_storage: w.outdoor_storage === true };
  raw.bid = { compliance_matrix_format: w.bid_matrix === undefined ? '' : w.bid_matrix,
              deviation_list_required: w.bid_deviation !== false,
              clarification_deadline: w.bid_clarification || '', bid_due_date: w.bid_due || '' };
  raw.vdrl = arr(w.vdrl).map(function (v) {
    var o = clone(v || {});
    if (o.needed_for_text !== undefined) {
      o.needed_for = String(o.needed_for_text).split(/[,;\s]+/).map(function (x) { return norm(x); }).filter(function (x) { return NEEDED_FOR.indexOf(x) >= 0; });
      delete o.needed_for_text;
    }
    return o;
  });
  ['fat_required', 'sat_required', 'sp_commissioning', 'sp_operating_2yr', 'sp_capital',
   'packing_standard', 'preservation_months', 'outdoor_storage', 'bid_matrix', 'bid_deviation',
   'bid_clarification', 'bid_due', 'register_id'].forEach(function (k) { delete raw[k]; });
  return sanitise(raw).state;
}

/* ============================== 17. pull actions (§7.1) ================= */
function say(msg) { pkgNote = [msg]; if (ui) { try { ui.sync(); ui.run(); } catch (e) {} } pkgPaint(); }
function pullMandatory() {
  var cs = canon(state), d = derive(cs), added = 0;
  d.expected_mandatory.forEach(function (id) {
    if (d.selected.indexOf(id) >= 0) return;
    state.requirements.push({ requirement_id: id, obligation: d.reg_obl[id] === 'desirable' ? 'desirable' : 'mandatory', compliance_form: 'confirm' });
    added++;
  });
  say(added ? L('addedN', { n: added }) : L('addedNone'));
}
function pullDatasheets() {
  var cs = canon(state), d = derive(cs), added = 0, updated = 0;
  d.package_ds.forEach(function (r) {
    var line = state.datasheets.filter(function (l) { return l.datasheet_id === r.id; })[0];
    if (!line) { state.datasheets.push({ datasheet_id: r.id, revision: r.revision }); added++; return; }
    if (norm(line.revision) !== norm(r.revision)) {
      /* §3.4 rule 4 — both values shown, the user decides. */
      var ok = window.confirm(r.id + ': ' + (line.revision || '—') + ' → ' + (r.revision || '—') + '?');
      if (ok) { line.revision = r.revision; updated++; }
    }
  });
  say((added || updated) ? (L('addedN', { n: added }) + ' ' + L('updatedN', { n: updated })) : L('addedNone'));
}
function pullVendorDocuments() {
  var cs = canon(state), d = derive(cs), added = 0;
  d.reg_vendor_documents.forEach(function (v) {
    if (v.package_ref !== d.pkg || blank(d.pkg) || d.vd_referenced[v.id]) return;
    state.vdrl.push({ id: nextId(state.vdrl, 'VDR'), doc_type: 'other', title: v.label,
      purpose: '', due_stage: MILESTONE_TO_STAGE[v.first_milestone] || '', offset_weeks: null,
      needed_for_text: '', as_built: false, vendor_document_id: v.id });
    added++;
  });
  say(added ? L('addedN', { n: added }) : L('addedNone'));
}
function addRequirementRow() {
  var cs = canon(state), d = derive(cs);
  var free = d.reg_requirements.filter(function (r) { return d.selected.indexOf(r.id) < 0; });
  var id = window.prompt(tx(S.reqPicker) + (free.length ? ' (' + free.slice(0, 20).map(function (r) { return r.id; }).join(', ') + ')' : ''), free.length ? free[0].id : '');
  if (id === null) return;
  id = String(id).trim();
  if (!id) return;
  var obl = d.reg_obl[id];
  state.requirements.push({ requirement_id: id, obligation: OBLIGATIONS.indexOf(obl) >= 0 ? obl : '', compliance_form: 'confirm' });
  say(L('addedN', { n: 1 }));
}

    requirement_ids: cs.requirements.map(function (l) { return l.requirement_id; }),
