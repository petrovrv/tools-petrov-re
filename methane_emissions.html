            'Deze tool schat de jaarlijkse CH4-emissies van een olie- en gasinstallatie bottom-up in door het aantal apparaten te vermenigvuldigen met emissiefactoren uit EPA Subpart W / API Compendium 2021 en tankflashing, blowdowns en fakkelslip op te tellen. De resultaten worden met de gekozen GWP omgerekend naar CO2e, de methaanintensiteit wordt berekend ten opzichte van de OGCI-doelstelling van 0,2 % en de inventaris kan worden afgestemd op een gemeten totaal voor de locatie (OGMP 2.0 Level 5).',

              'Неорганізовані викиди — це ненавмисні витоки з клапанів, з\'єднань, фланців, відкритих кінців трубопроводів, запобіжних клапанів і ущільнень компресорів, які тут оцінюються за допомогою популяційних коефіцієнтів викидів Subpart W (захід США) на один компонент, що працює з газом. Реальні розподіли витоків мають «важкий хвіст»: кілька суперемітерів формують більшу частину викидів. Обстеження LDAR із використанням камер оптичної візуалізації газу (OGI) дозволяють виявляти й усувати такі витоки, чого не можуть врахувати узагальнені коефіцієнти.',

              'Les émissions fugitives sont des fuites involontaires provenant des vannes, raccords, brides, conduites à extrémité ouverte, soupapes de sûreté et garnitures de compresseurs, estimées ici à l\'aide des facteurs d\'émission par population de la Subpart W (ouest des États-Unis) par composant en service gaz. Les distributions réelles des fuites sont à queue lourde : quelques super-émetteurs représentent l\'essentiel des émissions. Les campagnes LDAR utilisant des caméras d\'imagerie optique des gaz (OGI) permettent de détecter et de réparer ces fuites, ce que les facteurs génériques ne peuvent pas refléter.',

      { id: 'compressor-station', group: G2,
        label: T('Compressor station', 'Компресорна станція', 'Verdichterstation', 'Compressorstation', 'Station de compression', 'Estación de compresión', 'Tłocznia gazu'),
        note: T('Look at the intensity: 80 t CH4/y on 5 Mt/y of gas is only 0.002 %; reciprocating compressors (43 t/y) are the largest category, ahead of fugitive leaks (18 t/y).', 'Дивіться на інтенсивність: 80 т CH4/рік на 5 млн т/рік газу — лише 0,002 %; найбільша категорія — поршневі компресори (43 т/рік), далі неорганізовані витоки (18 т/рік).', 'Achten Sie auf die Intensität: 80 t CH4/a bei 5 Mt/a Gas sind nur 0,002 %; Kolbenverdichter (43 t/a) sind die größte Kategorie, vor diffusen Leckagen (18 t/a).', 'Kijk naar de intensiteit: 80 t CH4/jr op 5 Mt/jr gas is slechts 0,002 %; zuigercompressoren (43 t/jr) zijn de grootste categorie, vóór diffuse lekken (18 t/jr).', 'Regardez l’intensité : 80 t CH4/an pour 5 Mt/an de gaz, soit 0,002 % ; les compresseurs alternatifs (43 t/an) forment la plus grande catégorie, devant les fuites fugitives (18 t/an).', 'Fíjese en la intensidad: 80 t CH4/año sobre 5 Mt/año de gas es solo 0,002 %; los compresores alternativos (43 t/año) son la mayor categoría, por delante de las fugas (18 t/año).', 'Spójrz na intensywność: 80 t CH4/rok przy 5 Mt/rok gazu to tylko 0,002 %; największą kategorią są sprężarki tłokowe (43 t/rok), przed nieszczelnościami (18 t/rok).'),
        apply: function (t) {
          t.level = 'simple'; t.xCH4 = 0.92; t.hours = 8760;
          t.c_pcHighBleed = 0; t.c_pcIntermittent = 6; t.c_pcLowBleed = 4; t.c_pneumaticPump = 0;

      { id: 'level5-reconciliation', group: G2,
        label: T('Level 5 reconciliation', 'Узгодження рівня 5', 'Abgleich Level 5', 'Reconciliatie niveau 5', 'Rapprochement niveau 5', 'Conciliación nivel 5', 'Uzgodnienie poziomu 5'),
        note: T('Aha: the site-level measurement (600 t/y) is 7.5 times the bottom-up inventory (80 t/y) - typical of super-emitters that emission factors miss; at OGMP Level 5 the measured value is reported (17 880 t CO2e/y).', 'Ага: вимірювання на рівні об’єкта (600 т/рік) у 7,5 раза більше за інвентаризацію «знизу вгору» (80 т/рік) — типово для суперемітерів, яких не бачать коефіцієнти викидів; на рівні OGMP 5 звітується виміряне значення (17 880 т CO2e/рік).', 'Aha: die Messung auf Standortebene (600 t/a) ist 7,5-mal so hoch wie das Bottom-up-Inventar (80 t/a) - typisch für Super-Emitter, die Emissionsfaktoren übersehen; auf OGMP Level 5 wird der Messwert berichtet (17 880 t CO2e/a).', 'Aha: de meting op locatieniveau (600 t/jr) is 7,5 keer de bottom-up-inventaris (80 t/jr) - typisch voor superuitstoters die emissiefactoren missen; op OGMP-niveau 5 wordt de gemeten waarde gerapporteerd (17 880 t CO2e/jr).', 'Aha : la mesure à l’échelle du site (600 t/an) vaut 7,5 fois l’inventaire ascendant (80 t/an) - typique des super-émetteurs que les facteurs d’émission ne voient pas ; au niveau OGMP 5, la valeur mesurée est déclarée (17 880 t CO2e/an).', 'Ajá: la medición del emplazamiento (600 t/año) es 7,5 veces el inventario ascendente (80 t/año), típico de superemisores que los factores de emisión no ven; en el nivel OGMP 5 se informa el valor medido (17 880 t CO2e/año).', 'Aha: pomiar na poziomie obiektu (600 t/rok) to 7,5 raza więcej niż inwentarz oddolny (80 t/rok) - typowe dla superemiterów, których nie widzą wskaźniki emisji; na poziomie OGMP 5 raportuje się wartość zmierzoną (17 880 t CO2e/rok).'),
        apply: function (t) {
          t.level = 'full'; t.xCH4 = 0.92; t.hours = 8760;
          t.c_pcHighBleed = 0; t.c_pcIntermittent = 6; t.c_pcLowBleed = 4; t.c_pneumaticPump = 0;
          t.c_leakValve = 400; t.c_leakConnector = 3000; t.c_leakFlange = 600; t.c_leakOEL = 20; t.c_leakPRV = 20; t.c_leakCompSeal = 4;
          t.c_recipRodPacking = 24; t.c_centrifWetSeal = 0;

    ui.examples(EX);

    function measuredOf() { return (state && typeof state.measured === 'number' && isFinite(state.measured) && state.measured > 0) ? state.measured : null; }
    ui.stage({
      caption: T('Annual CH4 emissions by category (t/y)', 'Річні викиди CH4 за категоріями (т/рік)', 'Jährliche CH4-Emissionen nach Kategorie (t/a)', 'Jaarlijkse CH4-emissies per categorie (t/j)', 'Émissions annuelles de CH4 par catégorie (t/an)', 'Emisiones anuales de CH4 por categoría (t/año)', 'Roczne emisje CH4 według kategorii (t/rok)'),
      minHeight: 260,
      a11y: function () {
        if (!last || !last.ok || !last.r) { return LP(T('No result', 'Немає результату', 'Kein Ergebnis', 'Geen resultaat', 'Pas de résultat', 'Sin resultado', 'Brak wyniku')); }
        var r = last.r, b = r.byCategory || {}, i, v, sum = 0, bi = -1, bv = -Infinity;
        var keys = ['pneumatic', 'fugitive', 'compressor', 'tank', 'venting', 'flaring'];
        var names = ['Pneumatic devices', 'Fugitive leaks', 'Compressors', 'Storage tanks', 'Venting / blowdowns', 'Flaring (unburnt)'];
        for (i = 0; i < keys.length; i++) {
          v = b[keys[i]];
          if (typeof v === 'number' && isFinite(v)) { sum += v; if (v > bv) { bv = v; bi = i; } }
        }
        var tot = (typeof r.total_t_y === 'number' && isFinite(r.total_t_y)) ? r.total_t_y : sum;
        var s = LP(TF(T('Total annual CH4 emissions: $1 t/y.', 'Сумарні річні викиди CH4: $1 т/рік.', 'Jährliche CH4-Emissionen gesamt: $1 t/a.', 'Totale jaarlijkse CH4-emissies: $1 t/jr.', 'Émissions annuelles totales de CH4 : $1 t/an.', 'Emisiones anuales totales de CH4: $1 t/año.', 'Łączna roczna emisja CH4: $1 t/rok.'), [DiagramUI.fmt(tot, { precision: 2 })]));
        if (bi >= 0) { s += ' ' + LP(TF(T('Largest category: $1, $2 t/y.', 'Найбільша категорія: $1, $2 т/рік.', 'Größte Kategorie: $1, $2 t/a.', 'Grootste categorie: $1, $2 t/jr.', 'Catégorie principale : $1, $2 t/an.', 'Categoría mayor: $1, $2 t/año.', 'Największa kategoria: $1, $2 t/rok.'), [LP(CAT_T[keys[bi]]), DiagramUI.fmt(bv, { precision: 2 })])); }
        var meas = measuredOf();
        if (meas !== null) { s += ' ' + LP(TF(T('Measured site emissions: $1 t/y.', 'Виміряні викиди об’єкта: $1 т/рік.', 'Gemessene Standortemissionen: $1 t/a.', 'Gemeten locatie-emissies: $1 t/jr.', 'Émissions mesurées du site : $1 t/an.', 'Emisiones medidas del emplazamiento: $1 t/año.', 'Zmierzona emisja obiektu: $1 t/rok.'), [DiagramUI.fmt(meas, { precision: 2 })])); }
        return s;
      },
      render: function (size, st) {
        var ctx = st.canvas(), w = size.w, h = size.h, i, v, x, y;
        ctx.clearRect(0, 0, w, h);
        if (!last || !last.ok || !last.r) { return; }
        var cs = getComputedStyle(document.documentElement);
        var muted = cs.getPropertyValue('--muted').trim() || '#888', line = cs.getPropertyValue('--line').trim() || '#ccc', font = cs.getPropertyValue('--font').trim() || 'sans-serif';
        var coarse = size.density === 'coarse', lw = coarse ? 96 : 140, fs = coarse ? 11 : 12;
        var pl = lw + 12, pr = coarse ? 44 : 60, pt = 6, axisH = 36, pw = w - pl - pr, ph = h - pt - axisH;
        if (pw < 20 || ph < 20) { return; }
        var r = last.r, b = r.byCategory || {}, rows = [], sum = 0, max = 1;
        var keys = ['pneumatic', 'fugitive', 'compressor', 'tank', 'venting', 'flaring'];
        var names = ['Pneumatic devices', 'Fugitive leaks', 'Compressors', 'Storage tanks', 'Venting / blowdowns', 'Flaring (unburnt)'];
        function num(n) { return (typeof n === 'number' && isFinite(n)) ? n : null; }
        for (i = 0; i < keys.length; i++) {
          v = num(b[keys[i]]); if (v !== null) { sum += v; }
          rows.push({ label: LP(CAT_T[keys[i]]), v: v, c: DiagramUI.series(0), a: 1 });
        }
        var meas = measuredOf();
        if (meas !== null) {
          rows.push({ label: LP(T('Bottom-up total', 'Підсумок знизу вгору', 'Bottom-up gesamt', 'Bottom-up totaal', 'Total ascendant', 'Total ascendente', 'Suma oddolna')), v: num(r.total_t_y) !== null ? r.total_t_y : sum, c: DiagramUI.series(0), a: 0.5 });
          rows.push({ label: LP(T('Measured (site)', 'Виміряно (об’єкт)', 'Gemessen (Standort)', 'Gemeten (locatie)', 'Mesuré (site)', 'Medido (emplazamiento)', 'Zmierzono (obiekt)')), v: meas, c: DiagramUI.series(1), a: 1 });
        }
        for (i = 0; i < rows.length; i++) { if (rows[i].v !== null && rows[i].v > max) { max = rows[i].v; } }
        var ticks = DiagramUI.ticks(0, max, pw, size.density) || [];
        var xmax = Math.max(max, ticks.length ? ticks[ticks.length - 1] : max);
        function sx(val) { return pl + (Math.max(0, val) / xmax) * pw; }
        var rowH = ph / rows.length, barH = Math.min(rowH * 0.65, 22), base = pt + ph;
        ctx.font = fs + 'px ' + font; ctx.lineWidth = 1;
        ctx.strokeStyle = line; ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        for (i = 0; i < ticks.length; i++) {
          x = Math.round(sx(ticks[i])) + 0.5;
          ctx.beginPath(); ctx.moveTo(x, pt); ctx.lineTo(x, base); ctx.stroke();
          ctx.fillText(DiagramUI.fmt(ticks[i], { precision: 2 }), x, base + 4);
        }
        ctx.beginPath(); ctx.moveTo(pl, base + 0.5); ctx.lineTo(pl + pw, base + 0.5); ctx.stroke();
        ctx.fillText('t CH4/y', pl + pw / 2, base + fs + 10);
        ctx.textBaseline = 'middle';
        for (i = 0; i < rows.length; i++) {
          y = pt + rowH * i + rowH / 2;
          ctx.globalAlpha = 1; ctx.fillStyle = muted; ctx.textAlign = 'right';
          ctx.fillText(rows[i].label, lw, y, lw - 4);
          ctx.textAlign = 'left';
          if (rows[i].v === null) { ctx.fillText('–', pl + 4, y); continue; }
          x = sx(rows[i].v);
          ctx.globalAlpha = rows[i].a; ctx.fillStyle = rows[i].c;
          ctx.fillRect(pl, y - barH / 2, Math.max(1, x - pl), barH);
          ctx.globalAlpha = 1; ctx.fillStyle = muted;
          ctx.fillText(DiagramUI.fmt(rows[i].v, { precision: 2 }), x + 4, y);
        }
        ctx.globalAlpha = 1;
      }
    });
    adoptStage(ui);

    ui.ready();
    window.__methane_emissions = { ui: ui, state: state, solve: solve, last: function () { return last; } };
  }

  /* ======================================================= 3. the data layer */
  function buildRecord() {
    if (!last) return null;
    var units = { xCH4: '-', hours: 'h', tankOil: 'm3/y', bdVol: 'm3', bdP: 'Pa', bdT: 'K', bdN: '1/y',
      flareGas: 'kg/y', flareX: '-', flareDRE: '-', measured: 't/y', gwp: '-', ogmpLevel: '-', gasThroughput: 't/y' };
    var i, k, inputs = {}, outputs = {}, notes = ['Mass basis CH4 (no LHV/HHV)', 'measured = 0 means no measurement reconciliation'];
    for (i = 0; i < CKEYS.length; i++) units['c_' + CKEYS[i]] = '-';
    for (k in units) if (units.hasOwnProperty(k)) inputs[k] = state[k];
    var warnings = last.ok ? (last.r.warnings || []).slice() : [String(last.err)];
    if (last.ok) {
      var r = last.r, bc = r.byCategory || {};
      outputs.total_t_y = r.total_t_y; outputs.reported_t_y = r.reported_t_y;
      outputs.co2e_t_y = r.co2e_t_y; outputs.intensity_pct = r.intensity_pct;
      outputs.reported_m3_iso_y = r.reported_m3_iso_y;
      for (k in bc) if (bc.hasOwnProperty(k)) outputs['cat_' + k + '_t_y'] = bc[k];
      outputs.ogmp_level = r.ogmp ? r.ogmp.level : null;
      if (r.ogmp && r.ogmp.ratio != null) outputs.ogmp_ratio = r.ogmp.ratio;
      outputs.gwp_value = r.breakdown && r.breakdown.gwp ? r.breakdown.gwp.value : state.gwp;
      outputs.basis = 'mass CH4 (no LHV/HHV)';
      if (r.norm) notes.push(r.norm);
    }
    return { inputs: inputs, outputs: outputs, units: units, model: {
      equations: ['whole gas scf/h x xCH4 -> kg CH4/h at 60 F, 14.696 psia (23.690 L/mol)',
        'blowdown m = p V M xCH4/(R T) per event', 'V_ISO = m_CH4 / M x R x 288.15 K / 101.325 kPa (ISO 13443:1996 clause 3; 1 scf = 0.02826 m3(ISO), Annex B Eq. B.1)', 'flare slip = m_gas x w_CH4 x (1-DRE)', 'CO2e = CH4 x GWP'],
      ranges: ['xCH4 in (0,1] mol/mol', 'hours in [0,8784] h', 'counts >= 0 (integers)', 'bdP > 0 Pa, bdT > 0 K, bdVol >= 0 m3',
        'flareX, flareDRE in [0,1]', 'tankOil, flareGas, bdN, measured, gasThroughput >= 0', 'ogmpLevel in 1..5'],
      notes: notes }, warnings: warnings };
  }
  var HANDOFF = {
    provides: ['x', 'mdot'],
    accepts: ['x'],
    build: function () {
      if (!last || !last.ok) return null;
      var r = last.r, YS = 8760 * 3600, q = {}, row = {};
      var fin = function (v) { return typeof v === 'number' && isFinite(v); };
      if (fin(r.intensity_pct)) { q.x = { value: r.intensity_pct / 100, unit: '-' }; row.intensity = { value: r.intensity_pct / 100, unit: '-' }; }
      if (fin(r.reported_t_y)) { q.mdot = { value: r.reported_t_y * 1000 / YS, unit: 'kg/s' }; row.CH4 = { value: r.reported_t_y * 1000 / YS, unit: 'kg/s' }; }
      if (fin(r.co2e_t_y)) row.CO2e = { value: r.co2e_t_y * 1000 / YS, unit: 'kg/s' };
      return {
        quantities: q,
        sets: { emissions: [row], composition: [{ CH4: { value: state.xCH4, unit: '-' } }] }
      };
    },
    apply: function (payload) {
      var q = (payload && payload.quantities) || {}, s = (payload && payload.sets) || {}, comp = s.composition, v = null, i;
      var num = function (x) { var n = x && x.value; return (typeof n === 'number' && isFinite(n)) ? n : null; };
      var ok = function (n) { return n !== null && n > 0 && n <= 1; };
      if (comp && comp.length) for (i = 0; i < comp.length; i++) if (comp[i] && comp[i].CH4) { v = num(comp[i].CH4); break; }
      if (!ok(v)) v = num(q.x);
      if (!ok(v)) return;
      state.xCH4 = v;
      last = solve(state);
      if (ui) { ui.sync(); ui.run(); }
    }
  };

  function installData() {
    if (window.Diagram) {
      Diagram.init({
        id: 'methane_emissions',
        file: 'methane_emissions.html',
        state: {
          serialize: function () { return state; },
          deserialize: function (o) { Object.assign(state, o || {}); last = solve(state);
                                      if (ui) { ui.sync(); ui.run(); } }
        },
        record: buildRecord,
        handoff: HANDOFF
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
